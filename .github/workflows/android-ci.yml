xname: android-ci
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SmartWash-Android/**'
  pull_request:
    branches:
      - main
    paths:
      - 'SmartWash-Android/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SmartWash-Android
    steps:
      - uses: actions/checkout@v7
      - name: set on JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with gradle
        run: ./gradlew build --info
