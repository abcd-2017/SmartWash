name: android-ci
on:
  workflow_dispatch:
#  push:
#    branches:
#      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SmartWash-Android
    steps:
      - uses: actions/checkout@v7
      - name: set on JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 两个 flavor 分别构建（full=com.smartwash / lite=com.todayeat.app），
      # 并各跑单元测试；任一变体失败即 CI 失败，避免只验 full 而漏掉 lite 的编译断裂。
      - name: Build debug APKs (full + lite)
        run: |
          ./gradlew \
            assembleFullDebug \
            assembleLiteDebug \
            testFullDebugUnitTest \
            testLiteDebugUnitTest
