name: backend-ci
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SmartWash/**'
  pull_request:
    branches:
      - main
    paths:
      - 'SmartWash/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SmartWash
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B verify
