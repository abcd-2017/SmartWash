name: harmony-ci
on:
  workflow_dispatch:
  # push/PR 触发暂时禁用：GitHub runner 连不上华为 SDK 服务器，下载 toolchains 失败
  # 鸿蒙端构建靠本地 DevEco Studio 验证，等华为解决 CI 下载问题后再启用
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'SmartWash_Harmony/**'
  # pull_request:
  #   branches:
  #     - main
  #   paths:
  #     - 'SmartWash_Harmony/**'

jobs:
  build-harmony:
    runs-on: macos-latest
    # hvigor 构建偶尔会卡住，设超时兜底
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./SmartWash_Harmony

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Download HarmonyOS SDK
        run: |
          RELEASE_JSON=$(curl -s -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/harmonyos-dev/hos-sdk/releases/latest)
          ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("commandline-tools-mac-.*\\.zip")) | .browser_download_url')
          echo "Downloading: $ASSET_URL"
          curl -LJO "$ASSET_URL"

      - name: Unzip SDK
        run: unzip commandline-tools-mac-*.zip

      - name: Install SDK components
        run: |
          export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Duser.country=CN"
          chmod +x command-line-tools/sdkmanager/bin/sdkmgr
          command-line-tools/sdkmanager/bin/sdkmgr install toolchains:9 OpenHarmony/toolchains:9 --accept-license

      - name: Install hvigor
        run: |
          npm init -y
          npm config set @ohos:registry=https://repo.harmonyos.com/npm/
          npm install @ohos/hvigor@2.4.2 @ohos/hvigor-ohos-plugin@2.4.2

      - name: Build HAP
        run: |
          export HOS_SDK_HOME=$(pwd)/hwsdk
          ./node_modules/.bin/hvigor --mode module -p product=default assembleHap --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: entry-default-unsigned.hap
          path: SmartWash_Harmony/entry/build/default/outputs/default/entry-default-unsigned.hap
