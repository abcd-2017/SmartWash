name: build-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 默认只给 GITHUB_TOKEN 读权限，各 job 按需单独提升
permissions:
  contents: read

env:
  VERSION: ${{ github.ref_name }}

  # 阿里云 ACR
  REGISTRY: ${{ secrets.ACR_REGISTRY }}
  BACKEND_IMAGE: ${{ secrets.BACKEND_IMAGE }}
  WEB_IMAGE: ${{ secrets.WEB_IMAGE }}

  # 部署 Webhook（IP / 端口拆为独立变量，便于分环境维护）
  DEPLOY_WEBHOOK_HOST: ${{ secrets.DEPLOY_WEBHOOK_HOST }}
  DEPLOY_WEBHOOK_PORT: ${{ secrets.DEPLOY_WEBHOOK_PORT }}

jobs:

  # =========================================================
  # 1. 构建 Backend Docker Image → 推送到 ACR
  # =========================================================
  backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    defaults:
      run:
        working-directory: ./SmartWash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./SmartWash
          file: ./SmartWash/Dockerfile
          push: true
          tags: |
            ${{ secrets.BACKEND_IMAGE }}:${{ github.ref_name }}
            ${{ secrets.BACKEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}


  # =========================================================
  # 2. 构建 Web Docker Image → 推送到 ACR
  # =========================================================
  web:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    defaults:
      run:
        working-directory: ./SmartWashWeb

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push web image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./SmartWashWeb
          file: ./SmartWashWeb/Dockerfile
          push: true
          tags: |
            ${{ secrets.WEB_IMAGE }}:${{ github.ref_name }}
            ${{ secrets.WEB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

  # =========================================================
  # 3. 构建 Android APK
  # =========================================================
  android:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      sha256: ${{ steps.calc-sha256.outputs.sha256 }}

    defaults:
      run:
        working-directory: ./SmartWash-Android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          VERSION_CODE=$(echo "$VERSION" | awk -F'.' '{printf "%d%02d%02d", $1, $2, $3}')
          ./gradlew assembleRelease \
            -PversionCode=$VERSION_CODE \
            -PversionName=$VERSION

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mv \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-${VERSION}.apk

      - name: Calculate SHA256
        id: calc-sha256
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SHA=$(sha256sum \
            app/build/outputs/apk/release/app-${VERSION}.apk \
            | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"


  # =========================================================
  # 4. 创建 GitHub Release
  #    APK + version.json
  # =========================================================
  release:
    needs:
      - backend
      - web
      - android

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate release metadata
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          VERSION_CODE=$(echo "$VERSION" | awk -F'.' '{printf "%d%02d%02d", $1, $2, $3}')

          cat > version.json << EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION}",
            "fileName": "app-${VERSION}.apk",
            "sha256": "${{ needs.android.outputs.sha256 }}",
            "forceUpdate": false,
            "minVersionCode": 10000,
            "changelog": "详见 GitHub Release",
            "releaseDate": "$(date +%Y-%m-%d)",
            "backendImage": "${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}",
            "backendDigest": "${{ needs.backend.outputs.digest }}",
            "webImage": "${{ env.WEB_IMAGE }}:${{ github.ref_name }}",
            "webDigest": "${{ needs.web.outputs.digest }}"
          }
          EOF

      - name: Prepare APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
      
          echo "Looking for APK..."
      
          APK_FILES=()
          while IFS= read -r -d '' file; do
            APK_FILES+=("$file")
          done < <(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print0
          )
      
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No APK file found."
            echo "Available build outputs:"
            find app/build/outputs -type f -print
            exit 1
          fi
      
          if [ "${#APK_FILES[@]}" -gt 1 ]; then
            echo "ERROR: Multiple APK files found:"
            printf '%s\n' "${APK_FILES[@]}"
            echo "Please configure the workflow to select the correct APK."
            exit 1
          fi
      
          APK="${APK_FILES[0]}"
          APK_DIR="$(dirname "$APK")"
          TARGET="${APK_DIR}/app-${VERSION}.apk"
      
          echo "Source APK : $APK"
          echo "Target APK : $TARGET"
      
          mv "$APK" "$TARGET"
      
          echo "APK renamed successfully:"
          ls -lh "$TARGET"
      
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                tag_name: ${{ github.ref_name }}
                name: Release ${{ github.ref_name }}
                generate_release_notes: true
                files: |
                  release-assets/app-*.apk
                  release-assets/version.json


  # =========================================================
  # 5. 通知服务器执行部署
  #    通过 Webhook 触发，服务器拉取镜像并滚动更新
  # =========================================================
  deploy:
    needs:
      - backend
      - web
      - release

    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read

    steps:
      - name: Trigger production deployment
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          VERSION: ${{ github.ref_name }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          BACKEND_DIGEST: ${{ needs.backend.outputs.digest }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
          WEB_DIGEST: ${{ needs.web.outputs.digest }}
        run: |
          DEPLOY_URL="http://${DEPLOY_WEBHOOK_HOST}:${DEPLOY_WEBHOOK_PORT}/api/deploy"

          echo "Deploying version ${VERSION} via ${DEPLOY_URL}..."

          curl --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "$DEPLOY_URL" \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --header "Content-Type: application/json" \
            --data @- <<EOF
          {
            "version": "${VERSION}",
            "backendImage": "${BACKEND_IMAGE}",
            "backendDigest": "${BACKEND_DIGEST}",
            "webImage": "${WEB_IMAGE}",
            "webDigest": "${WEB_DIGEST}"
          }
          EOF
