name: SSH and SCP diagnostic

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Create 1 MiB test file
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p scp-test
          dd if=/dev/urandom \
            of=scp-test/payload.bin \
            bs=1M \
            count=1 \
            status=none

          HASH=$(sha256sum scp-test/payload.bin | cut -d ' ' -f1)
          printf '%s  payload.bin\n' "$HASH" > scp-test/SHA256SUMS
          ls -lh scp-test

      - name: Test SSH commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 1m
          debug: true
          script_stop: true
          script: |
            set -eu

            TEST_DIR="/tmp/gha-scp-${{ github.run_id }}-${{ github.run_attempt }}"

            echo "Connected successfully"
            echo "User: $(whoami)"
            echo "UID: $(id -u)"
            hostname
            id

            if [ "$(id -u)" -eq 0 ]; then
              echo "WARNING: GitHub Actions is logged in as root"
            fi

            command -v tar
            command -v sha256sum
            df -h /tmp

            umask 077
            mkdir -p "$TEST_DIR"
            test -d "$TEST_DIR"
            test -w "$TEST_DIR"

            echo "Remote directory ready: $TEST_DIR"

      - name: Test SCP upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: "scp-test/*"
          target: "/tmp/gha-scp-${{ github.run_id }}-${{ github.run_attempt }}/"
          strip_components: 1
          tar_tmp_path: "/tmp/"
          timeout: 30s
          command_timeout: 2m
          debug: true
          overwrite: true

      - name: Verify uploaded file through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 1m
          debug: true
          script_stop: true
          script: |
            set -eu

            TEST_DIR="/tmp/gha-scp-${{ github.run_id }}-${{ github.run_attempt }}"
            cd "$TEST_DIR"

            ls -lh
            test -f payload.bin
            test -f SHA256SUMS
            test "$(wc -c < payload.bin)" -eq 1048576
            sha256sum -c SHA256SUMS

            echo "SSH and SCP diagnostic passed"

      - name: Clean remote test files
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 1m
          script_stop: true
          script: |
            set -eu

            TEST_DIR="/tmp/gha-scp-${{ github.run_id }}-${{ github.run_attempt }}"

            case "$TEST_DIR" in
              /tmp/gha-scp-*)
                rm -rf -- "$TEST_DIR"
                ;;
              *)
                echo "Unsafe cleanup path: $TEST_DIR"
                exit 1
                ;;
            esac
