plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    id("com.google.dagger.hilt.android")
    id("com.google.devtools.ksp")
}

// 统一后端地址（与鸿蒙端/Web 端对齐）：通过 Gradle 属性注入，兜底为演示服务器地址。
// 生产发布切换方式：GitHub Actions 传入 -PbaseUrl=https://your-domain.com/（保留末尾斜杠），
// 并同步删除 network_security_config.xml 中对应的明文放行。
def SMART_WASH_BASE_URL = project.hasProperty('baseUrl') ? "\"${project.baseUrl}\"" : '"http://8.148.70.81:9000/"'

android {
    namespace 'com.smartwash'
    compileSdk 35

    defaultConfig {
        applicationId "com.smartwash"
        minSdk 30
        targetSdk 35
        versionCode = project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1
        versionName = project.hasProperty('versionName') ? project.versionName : "1.0"
        ndk {
            //noinspection ChromeOsAbiSupport
//            abiFilters 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField "String", "BASE_URL", SMART_WASH_BASE_URL
            // 观象台解读网关（LLM 走后端，密钥不出服务端）：endpoint 统一此处注入，禁止硬编码
            buildConfigField "String", "DIVINATION_BASE_URL", SMART_WASH_BASE_URL
        }
        release {
            buildConfigField "String", "BASE_URL", SMART_WASH_BASE_URL
            buildConfigField "String", "DIVINATION_BASE_URL", SMART_WASH_BASE_URL
            minifyEnabled true // 开启代码压缩与混淆
            shrinkResources true // 移除未使用资源
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest

    //网络请求框架
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.okhttp.logging

    //辅助工具库,权限申请
    implementation libs.accompanist.permissions

    //自动注入
    implementation(libs.hilt.android)
    implementation(libs.androidx.hilt.navigation.compose)
    // Hilt 注解处理统一走 KSP（与 Room 一致），Hilt 2.51 起官方支持
    ksp(libs.hilt.compiler)

    //datastore
    implementation libs.androidx.datastore.preferences
    implementation libs.androidx.datastore.preferences.core
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.material.icons.extended

    //分页
    implementation libs.androidx.paging.compose
    implementation libs.androidx.paging.runtime.ktx

    //Room
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    implementation libs.core

    //图片加载
    implementation libs.coil.compose

    //历法底座（观象台）：四柱/节气/中气/农历/旬空，纯 Java 可单测
    implementation libs.lunar

    // APK 后台下载（WorkManager + Hilt Worker）
    implementation libs.androidx.work.runtime.ktx
    implementation libs.androidx.hilt.work
    ksp libs.androidx.hilt.compiler
}