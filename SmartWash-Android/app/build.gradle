plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    id("com.google.dagger.hilt.android")
    id("com.google.devtools.ksp")
}

// 统一后端地址（与鸿蒙端/Web 端对齐）：通过 Gradle 属性注入，兜底为演示服务器地址。
// 生产发布切换方式：GitHub Actions 传入 -PbaseUrl=https://your-domain.com/（保留末尾斜杠），
// 并同步删除 network_security_config.xml 中对应的明文放行。
def SMART_WASH_BASE_URL = project.hasProperty('baseUrl') ? "\"${project.baseUrl}\"" : '"http://8.148.70.81:9000/"'

android {
    namespace 'com.smartwash'
    compileSdk 35

    defaultConfig {
        applicationId "com.smartwash"
        minSdk 30
        targetSdk 35
        versionCode = project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1
        versionName = project.hasProperty('versionName') ? project.versionName : "1.0"
        ndk {
            //noinspection ChromeOsAbiSupport
//            abiFilters 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release 签名配置：优先读取 Gradle 属性（本地 ~/.gradle/gradle.properties），
    // 其次读取环境变量（CI 传入），均无则回退到 'none'（构建即失败，强制必须配置）。
    signingConfigs {
        release {
            storeFile file(project.findProperty('SMART_WASH_STORE_FILE') ?: System.getenv('SMART_WASH_STORE_FILE') ?: 'none')
            storePassword project.findProperty('SMART_WASH_STORE_PASSWORD') ?: System.getenv('SMART_WASH_STORE_PASSWORD') ?: ''
            keyAlias project.findProperty('SMART_WASH_KEY_ALIAS') ?: System.getenv('SMART_WASH_KEY_ALIAS') ?: ''
            keyPassword project.findProperty('SMART_WASH_KEY_PASSWORD') ?: System.getenv('SMART_WASH_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "BASE_URL", SMART_WASH_BASE_URL
        }
        release {
            // 签名：CI 环境注入 release 签名；本地未配置时回退 debug keystore（仅测试用）
            signingConfig signingConfigs.release
            buildConfigField "String", "BASE_URL", SMART_WASH_BASE_URL
            minifyEnabled true // 开启代码压缩与混淆
            shrinkResources true // 移除未使用资源
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest

    //网络请求框架（OkHttp/Retrofit 基础设施在 :common:network，此处仅 app 直接消费的部分：
    //Retrofit 供 di/ 各业务 API @Provides，okhttp 供上传/下载）
    implementation libs.retrofit
    implementation libs.okhttp

    //自动注入
    implementation(libs.hilt.android)
    implementation(libs.androidx.hilt.navigation.compose)
    // Hilt 注解处理统一走 KSP（与 Room 一致），Hilt 2.51 起官方支持
    ksp(libs.hilt.compiler)

    implementation libs.androidx.navigation.compose
    implementation libs.androidx.material.icons.extended

    //分页
    implementation libs.androidx.paging.compose
    implementation libs.androidx.paging.runtime.ktx

    //Room（基础设施在 :common:database，runtime/ktx 经其 api 传递；
    //ksp 处理器已随 DivinationDatabase 迁入 :feature:divination，app 无 Room 注解类）
    //图片加载
    implementation libs.coil.compose

    // APK 后台下载（WorkManager：MainActivity 调度/监听进度用；@HiltWorker 与
    // androidx hilt-compiler 已随 ApkDownloadWorker 迁入 :feature:update）。
    // hilt-work 供 App 注入 HiltWorkerFactory（feature 的 implementation 依赖不传递，app 需自行声明）
    implementation libs.androidx.work.runtime.ktx
    implementation libs.androidx.hilt.work

    //启动任务引擎（common:init 模块化基建）：App.onCreate 经 InitEngine 统一调度，业务任务后续逐个接入
    implementation project(":common:init")

    //跨模块共享数据契约（T2.1）：响应信封 ApiResult/PageData、HttpStatusCode、RequestState
    implementation project(":common:utils")

    //跨模块通用工具（T2.2）：DataStore 封装、动效/触感、二维码、参数校验、按压反馈
    implementation project(":common:utils")

    //网络基础设施（T2.3）：OkHttp/Retrofit 供给、鉴权与错误转译拦截器、@RequireAuthorization、NetworkException
    implementation project(":common:network")

    //Room 缓存库（T2.4）：AppDatabase + Laundry/School/Coupon 三表 DAO 供给
    implementation project(":common:database")

    //清氧设计系统 + 共享 UI 组件（T2.5）：theme（AppDesign/Color/Theme/Type）+ ui/common 组件
    implementation project(":common:ui")

    //应用热更新链路（T3.1）：版本检查/下载/安装；弹窗 UI 留壳层，MainActivity/SettingPage
    //消费 UpdateViewModel/UpdateState/AppVersionVo/ApkInstaller（app → feature 依赖方向）
    implementation project(":feature:update")

    //观象台占卜子系统（T4.1）：四套算法内核+卦历库+解读网关+7 页面整模块迁入；
    //MainActivity NavHost / HomePage 问卜页签消费页面 composable，PageConstant.Div* 委托 DivRoute
    implementation project(":feature:divination")

    //用户域对外契约（T5.3）：app 壳（MainActivity 会话事件/登录页注册）与 home/index/
    //laundry 消费方一律注入 UserApi（isLogin/getUserInfo 缓存/loginEvents），不触碰 impl
    implementation project(":feature:user:api")

    //用户域实现（T5.2）：会话+用户网络链路+登录/注册/用户中心/资料编辑/设置页面迁入；
    //app 壳仅剩 NavHost 页面注册（LoginPage/RegisterPage/SettingPage/UpdateUserInfoPage，
    //T8.1 拆 NavGraphBuilder 聚合后摘除）
    implementation project(":feature:user:impl")

    //订单域对外契约（T6.1）：app 壳留守页面（detail/index/laundry/pickup/payment）与
    //UserImplSeamModule 一律注入 OrderApi（详情/试算/下单/计数/寄件取件/分页源），
    //不触碰 impl；OrderVo→OrderBrief、OrderStatus/ShowOrderStatus 枚举同随本模块
    implementation project(":feature:order:api")

    //订单域实现（T6.1）：订单网络链路（OrderServiceApi/OrderRepository）+ 订单页迁入；
    //app 壳仅剩 NavHost 页面注册（OrderPage，T8.1 拆 NavGraphBuilder 聚合后摘除）
    implementation project(":feature:order:impl")

    //支付域对外契约（T6.2，含充值）：仅 PaymentRoute 路由常量（零跨模块数据消费）；
    //PageConstant 支付/充值四路由委托本模块，order-impl/user-impl 跨域跳转同源取值
    implementation project(":feature:payment:api")

    //支付域实现（T6.2）：支付+充值网络链路与页面迁入；app 壳仅剩 NavHost 页面注册
    //（PaymentPage/PaySuccessPage/RechargePage/RechargeRecordPage，T8.1 拆聚合后摘除）
    implementation project(":feature:payment:impl")

    //洗衣域对外契约（T7.1，含 School 域）：LaundryRoute 路由常量（PageConstant 洗衣/服务
    //两路由委托本模块）+ SchoolSearchSource 学校搜索契约（user-impl 资料编辑页消费）
    implementation project(":feature:laundry:api")

    //洗衣域实现（T7.1）：洗衣+学校网络链路与页面（服务 tab 页/洗衣预约页）迁入；
    //app 壳仅剩 NavHost 页面注册与 HomePage 服务 tab 内嵌（T8.1 拆聚合后摘除）
    implementation project(":feature:laundry:impl")

    //优惠券域对外契约（T7.2，按域嵌套 feature/coupon/{api,impl}）：CouponRoute 路由常量
    //（PageConstant 优惠券路由委托本模块）+ CouponApi 服务契约（payment-impl 支付页选券消费）
    implementation project(":feature:coupon:api")

    //优惠券域实现（T7.2）：优惠券网络链路与优惠券页迁入；app 壳仅剩 NavHost 页面注册
    //（CouponPage，T8.1 拆聚合后摘除）；CouponSource seam 与 PaymentImplSeamModule 已删
    implementation project(":feature:coupon:impl")

    //工具箱子系统（短链首批）：列表/创建/详情独立路由，经 MainActivity NavHost 一行
    //toolboxGraph 聚合；暂无工作台入口，接入点见 SmartWash-Android/docs/短链工具箱对接文档.md
    implementation project(":feature:toolbox")
}