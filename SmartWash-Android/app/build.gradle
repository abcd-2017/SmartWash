    //洗衣域对外契约（T7.1，含 School 域）：LaundryRoute 路由常量 + SchoolSearchSource
    //学校搜索契约（user-impl 资料编辑页消费）
    fullImplementation project(":feature:laundry:api")

    //洗衣域实现（T7.1）：洗衣+学校网络链路与页面（服务 tab 页/洗衣预约页）迁入
    fullImplementation project(":feature:laundry:impl")

    //优惠券域对外契约（T7.2）：CouponRoute 路由常量 + CouponApi 服务契约
