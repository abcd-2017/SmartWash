    // 家庭点单（diningGraph 聚合；入口走深链 smartwash://dining 与后续工作台卡片，无底栏入口）
    // 两变体共用，保留 implementation
    implementation project(":feature:dining:impl")
    // dining 对外契约（implementation 不传递）：壳层全局扫一扫经 DiningApi 归一加入链接
