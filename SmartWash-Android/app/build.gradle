// 统一后端地址（与鸿蒙端/Web 端对齐）：通过 Gradle 属性注入，兜底为演示服务器地址。
// 生产发布切换方式：GitHub Actions 传入 -PbaseUrl=https://your-domain.com/（保留末尾斜杠），
// 并同步删除 network_security_config.xml 中对应的明文放行。
// 兜底不含真实服务器地址(开源仓库红线):未注入 baseUrl 时请求会失败,生产/演示经 -PbaseUrl= 注入
def SMART_WASH_BASE_URL = project.hasProperty('baseUrl') ? "\"${project.baseUrl}\"" : '"https://your-domain.com/"'

android {
    namespace 'com.smartwash'
    compileSdk 35

    defaultConfig {
        applicationId "com.smartwash"
        minSdk 30
        targetSdk 35
        versionCode = project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1
        versionName = project.hasProperty('versionName') ? project.versionName : "1.0"
        ndk {
            // ABI 过滤由 Gradle 属性注入，仅发版打包使用（CI 传 -PabiFilters=arm64-v8a，逗号分隔可传多个）。
            // 本地开发不带该参数：保留全部 ABI，模拟器（x86_64/arm64 镜像）与真机均可安装调试。
            //noinspection ChromeOsAbiSupport
            if (project.hasProperty('abiFilters')) {
                abiFilters.addAll(project.abiFilters.split(',').collect { it.trim() }.findAll { it })
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 深链 scheme 兜底（full 与 lite 两个 flavor 各自覆盖，见下方 productFlavors）。
        // Manifest 的 <data android:scheme="${deepLinkScheme}"/> 在合并期取本占位符。
        manifestPlaceholders = [deepLinkScheme: "smartwash"]
    }

    // ===== 变体维度（app flavors）=====
    // full：完整功能变体（applicationId com.smartwash，深链 scheme smartwash）
    // lite：轻量变体「吃啥」（applicationId com.todayeat.app，深链 scheme todayeat），
    //       仅保留 common:* + user/game/dining 域，其余业务域经 fullImplementation 裁剪。
    flavorDimensions "app"
    productFlavors {
        full {
            dimension "app"
            applicationId "com.smartwash"
            manifestPlaceholders = [deepLinkScheme: "smartwash"]
            resValue "string", "app_name", "SmartWash"
            // 深链 scheme 的编译期镜像（与上方 manifestPlaceholders 同源）：
            // DeepLinkParser/DeepLinkHandler 运行期判定本端 scheme，非本端 scheme 一律 Unknown。
            // 两处必须一致，否则会出现「Manifest 收 todayeat:// 但解析器只认 smartwash://」的静默失配。
            buildConfigField "String", "DEEP_LINK_SCHEME", '"smartwash"'
            // 品牌名（User-Agent 等平台标识用）：与 resValue app_name 同源，供 common:network
            // 的 RequestInterceptor 注入 @Named("appName") 拼接 UA（library 不可见 app BuildConfig）。
            // lite 必须与 full 取不同值，否则 lite 请求头会暴露旧品牌 SmartWash。
            buildConfigField "String", "APP_NAME", '"SmartWash"'
            // OTA 分发渠道：后端 GET /web/app/version|download 按 channel 分组下发产物。
            // 与 flavor 名同源，供 :feature:update:core 的 AppUpdateRepository 经
            // @Named("appChannel") 注入后透传（library 不可见 app BuildConfig）。
            buildConfigField "String", "APP_CHANNEL", '"full"'
        }
        lite {
            dimension "app"
            applicationId "com.todayeat.app"
            manifestPlaceholders = [deepLinkScheme: "todayeat"]
            resValue "string", "app_name", "吃啥"
            buildConfigField "String", "DEEP_LINK_SCHEME", '"todayeat"'
            buildConfigField "String", "APP_NAME", '"TodayEat"'
            // OTA 分发渠道：lite 走后端 android-lite/ 对象前缀，与 full 的产物清单隔离
            buildConfigField "String", "APP_CHANNEL", '"lite"'
        }
    }


    // Release 签名配置：优先读取 Gradle 属性（本地 ~/.gradle/gradle.properties），
    // 其次读取环境变量（CI 传入），均无则回退到 'none'（构建即失败，强制必须配置）。
    signingConfigs {
        release {
            storeFile file(project.findProperty('SMART_WASH_STORE_FILE') ?: System.getenv('SMART_WASH_STORE_FILE') ?: 'none')
            storePassword project.findProperty('SMART_WASH_STORE_PASSWORD') ?: System.getenv('SMART_WASH_STORE_PASSWORD') ?: ''
            keyAlias project.findProperty('SMART_WASH_KEY_ALIAS') ?: System.getenv('SMART_WASH_KEY_ALIAS') ?: ''
            keyPassword project.findProperty('SMART_WASH_KEY_PASSWORD') ?: System.getenv('SMART_WASH_KEY_PASSWORD') ?: ''
        }
    }

    // MinIO 对外端点不再编译期注入（原 buildConfigField MINIO_ENDPOINT 已移除）：
    // 改由 GET /web/config 运行期下发（ServerConfig），域名变更无需发版。
    buildTypes {
        debug {
            buildConfigField "String", "BASE_URL", SMART_WASH_BASE_URL
        }
        release {
            // 签名：CI 环境注入 release 签名；本地未配置时回退 debug keystore（仅测试用）
            signingConfig signingConfigs.release
            buildConfigField "String", "BASE_URL", SMART_WASH_BASE_URL
            minifyEnabled true // 开启代码压缩与混淆
            shrinkResources true // 移除未使用资源
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    // lifecycle-viewmodel（viewModelScope 扩展所在；lifecycle-viewmodel-compose 不一定传递）
