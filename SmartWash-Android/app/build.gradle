    implementation project(":common:utils")

    //跨模块通用工具（T2.2）：DataStore 封装、动效/触感、二维码、参数校验、按压反馈
    implementation project(":common:utils")

    //网络基础设施（T2.3）：OkHttp/Retrofit 供给、鉴权与错误转译拦截器、@RequireAuthorization、NetworkException
    implementation project(":common:network")

    //Room 缓存库（T2.4）：AppDatabase + Laundry/School/Coupon 三表 DAO 供给
    implementation project(":common:database")

    //清氧设计系统 + 共享 UI 组件（T2.5）：theme（AppDesign/Color/Theme/Type）+ ui/common 组件
    implementation project(":common:ui")

    //热更新对外契约（api/impl 拆分）：AppVersionVo + AppUpdateApi。
    //两变体共用（lite 手动检查更新也消费本契约），故保留 implementation 而非 fullImplementation。
    implementation project(":feature:update:api")
    //热更新内核（下载/安装/版本比较，不含 InitTask）：两变体共用（lite 手动检查复用下载链路）
    implementation project(":feature:update:core")
    //热更新实现（full 专属）：UpdateInitTask 启动静默检查 + UpdateViewModel/UpdateEventBus。
    //lite 不依赖本模块，Hilt @IntoSet 注册随之消失，即「lite 不注册 UpdateInitTask」。
    fullImplementation project(":feature:update:impl")

    //观象台对外契约（api/impl 拆分）：DivRoute 路由常量 + DivinationApi/VO（WorkbenchPage 跳转）
    fullImplementation project(":feature:divination:api")
    //观象台实现（T4.1）：四套算法内核+卦历库+解读网关+7 页面；
    //MainActivity NavHost / HomePage 问卜页签消费页面 composable
    fullImplementation project(":feature:divination:impl")

    //用户域对外契约（T5.3）：app 壳（MainActivity 会话事件/登录页注册）与 home/index/
