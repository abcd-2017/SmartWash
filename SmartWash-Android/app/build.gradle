    //优惠券域实现（T7.2）：优惠券网络链路与优惠券页迁入
    fullImplementation project(":feature:coupon:impl")

    //积分域对外契约（扩展提案功能 17）：PointsRoute 路由常量 + Gson 载荷 + PointsServiceApi
    fullImplementation project(":feature:points:api")

    //积分域实现（扩展提案功能 17）：积分仓库 + 签到有礼页
