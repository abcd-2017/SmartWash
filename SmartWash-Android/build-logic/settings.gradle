// buildSrc 为独立构建：仓库与主项目 settings.gradle 对齐（主项目切镜像时此处同步）。
// 导入主项目 version catalog，保证 buildSrc 与各模块版本单一来源：
// AGP / Kotlin 升级只需改 gradle/libs.versions.toml 一处。
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
    versionCatalogs {
        libs {
            from(files("../gradle/libs.versions.toml"))
        }
    }
}
