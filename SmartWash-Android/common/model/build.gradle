// :common:model —— 跨模块共享的纯数据契约（响应信封 ApiResult/PageData、HttpStatusCode、RequestState）。
// 依赖方向底座：feature-api → common:*，业务域模型一律不进本模块（跟各自 feature 的 api 模块走）。
plugins {
    id 'smartwash.android.library'
}

android {
    namespace 'com.smartwash.common.model'
}

dependencies {
    // 仅 @Keep / @StringRes 注解（app 内原靠 core-ktx 传递解析，独立模块需显式声明）
    implementation libs.androidx.annotation
}
