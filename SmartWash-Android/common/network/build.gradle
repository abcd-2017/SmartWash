// :common:network —— 网络基础设施（OkHttp/Retrofit 供给、鉴权与错误转译拦截器、@RequireAuthorization、NetworkException）。
// 业务 Retrofit 接口（UserApi 等）与 session 域暂留 app（阶段 5-7 跟各自 feature 走）；
// token/会话事件经 TokenProvider/SessionEventNotifier 接口由 app 侧 @Binds 绑定实现。
apply from: "$rootDir/config/android-library.gradle"
apply from: "$rootDir/config/hilt.gradle"

android {
    namespace 'com.smartwash.common.network'

    buildFeatures {
        // NetworkModule 按 BuildConfig.DEBUG 决定是否挂日志拦截器（library 变体跟随 app debug/release）
        buildConfig true
    }
}

dependencies {
    // Retrofit 类型经 api 暴露：app 侧 di/ 各业务 API @Provides 仍直接消费 Retrofit
    api libs.retrofit
    implementation libs.converter.gson
    implementation libs.okhttp.logging
    // SSE 流式通道（SseClient，观象台解读真连 issue #78）：okhttp 官方 sse 扩展，
    // implementation 不外传——业务侧只消费 SseClient 封装，不直接触碰 EventSource 类型
    implementation libs.okhttp.sse
    // ResponseInterceptor 解析响应信封（ApiResult/HttpStatusCode）
    implementation project(':common:utils')
    // NetworkException 的 @StringRes 注解
    implementation libs.androidx.annotation

    // JVM 单测（ResponseInterceptor 401 续签恢复链路）：AppLogger 内核走 android.util.Log 需 Robolectric，
    // 401/信封响应用 MockWebServer 假后端
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.mockwebserver
}
