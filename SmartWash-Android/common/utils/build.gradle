// :common:utils —— 跨模块通用工具（DataStore 封装、动效/触感、二维码、参数校验、Compose 按压反馈）。
// 业务存储 key（AppConstant）与业务域枚举不进本模块（跟各自 feature 走）。
apply from: "$rootDir/config/android-library.gradle"
apply from: "$rootDir/config/compose.gradle"
apply from: "$rootDir/config/hilt.gradle"

android {
    namespace 'com.smartwash.common.utils'

    buildFeatures {
        // AppLogger 按 BuildConfig.DEBUG 门控日志输出（library 变体跟随 app debug/release）
        buildConfig true
    }
}

dependencies {
    // AppLogger 委托 LogCore（common:init 零依赖日志内核）；common → common:init 为铁律 1 合法方向
    implementation project(':common:init')
    // 原 common:model 的依赖（ApiResult/PageData/HttpStatusCode/RequestState）
    implementation libs.androidx.annotation
    // SharePreferenceUtils：DataStore Preferences 封装
    implementation libs.androidx.datastore.preferences
    // BitmapUtil：zxing 二维码生成
    implementation libs.core
    // PagingUtils：pagingFlow 分页流组装（T8.2 自 app/payment-impl 双副本收敛）
    implementation libs.androidx.paging.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel
    // AnimationUtils / PressFeedbackModifier：直接 import 的 Compose 动画与交互库
    // （版本由 SmartWashComposePlugin 引入的 BOM 统一管理）
    implementation libs.androidx.compose.animation
    implementation libs.androidx.compose.foundation
    // ClickDebouncer 单元测试
    testImplementation libs.junit
}
