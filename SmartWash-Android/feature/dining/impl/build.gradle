// :feature:dining:impl —— 家庭点单域实现（按域嵌套结构 feature/dining/{api,impl}；
// 包名/namespace 保持 com.smartwash.feature.dining，与模块路径解耦，同 notice/coupon 先例）。
// 订单三页（07 号票发起链路：订单列表[域首页]/创建/分享[二维码]）+ 菜谱三页（04 号票：
// 菜谱库/详情/新增，入口在订单列表页右上角）；深链 host "dining" → 订单列表（di @IntoSet
// 贡献，模式同 game/notice）。表单校验/二维码内容构造/VO 映射为 logic 纯函数（JVM 单测锚点）。
// 依赖方向：dining:api / common（禁止依赖 app 壳与其他 feature-impl）。
apply from: "$rootDir/config/android-library.gradle"
apply from: "$rootDir/config/compose.gradle"
apply from: "$rootDir/config/hilt.gradle"
apply from: "$rootDir/config/serialization.gradle"

android {
    namespace 'com.smartwash.feature.dining'

    testOptions {
        unitTests {
            // JVM 单测中 android.util.Log（AppLogger/LogCore）返回默认值而非抛 not mocked
            returnDefaultValues = true
        }
    }
}

dependencies {
    // 本域路由常量、Gson 载荷、网络接口与跨域服务契约（DiningRoute/DiningVo/DiningServiceApi/DiningApi）
    implementation project(':feature:dining:api')
    // 用户域对外契约（点单页经 UserApi 取当前手机号识别「我的选菜」；铁律 2：impl → 他人 api）
    implementation project(':feature:user:api')

    // 响应信封 ApiResult / RequestState / AppLogger / 触感 / pressable / motionSpec
    implementation project(':common:utils')
    // NetworkException（ResponseInterceptor 错误转译产物；Retrofit 经 api 模块传递）
    implementation project(':common:network')
    // 清氧设计系统（AppColors/AppDimens/AppTextStyles 主题 + PageHeader/GroupCard/AppButton/
    // EmptyState/LoadingState/ButtonSpinner 组件 + SmartWashAsyncImage 封面直链回显 + ShellRoute）
    implementation project(':common:ui')

    // ViewModel 基类 + viewModelScope
    implementation libs.androidx.lifecycle.viewmodel
    // hiltViewModel()（页面默认参数）
    implementation libs.androidx.hilt.navigation.compose
    // NavHostController（菜谱库 → 详情/新增返回导航）
    implementation libs.androidx.navigation.compose
    // PhotoPicker（ActivityResultContracts.PickVisualMedia 封面选图，对齐头像上传先例）
    implementation libs.androidx.activity.compose
    // Compose 基础（LazyColumn/items/Row/Box；compose convention 只带 ui/material3）
    implementation libs.androidx.compose.foundation
    // 图标（EmptyState 占位参数 / 新增入口；规范 §4.1 禁外部图标库）
    implementation libs.androidx.material.icons.extended
    // ViewModel 协程 launch / MutableStateFlow / 同步通道 Flow + delay
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.core
    // 相机权限运行时申请（Context.checkSelfPermission / shouldShowRequestPermissionRationale）
    implementation libs.androidx.core.ktx
    // 购买清单快照 JSON 解析（纯 Gson，与 api 模块载荷一致）
    implementation libs.gson
    // 扫码识别与分发已上移壳层全局扫一扫（CameraX/ML Kit 依赖随迁 app 壳）

    // JVM 单测（表单校验 / VO 映射 / 深链贡献者 / 扫码解析归一锚点）
    testImplementation libs.junit
    // 共享购物车同步状态机 / 轮询调度 / 订阅生命周期（10 号票）
    testImplementation libs.kotlinx.coroutines.test
}
