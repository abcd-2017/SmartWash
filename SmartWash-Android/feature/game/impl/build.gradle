// :feature:game:impl —— 游戏中心实现（api/impl 拆分）。
// 包名/namespace 保持 com.smartwash.feature.game（与模块路径解耦）。
// H5 小游戏列表（后端 game_config 经 GET /web/auth/game/list 下发，全量 <100 不分页），
// 卡片点击复用壳层既有 WebView 路由承载游戏页（零新建容器）。
// 路由常量 GameRoute 与 GameApi/GameVo 在 :feature:game:api（单一事实来源），
// 经 app 壳 NavHost 一行 gameGraph 聚合；入口：深链 smartwash://game-center
//（di/DeepLinkModule 贡献）与后端 workbench_entry 配置的工作台卡片，无底栏入口。
apply from: "$rootDir/config/android-library.gradle"
apply from: "$rootDir/config/compose.gradle"
apply from: "$rootDir/config/hilt.gradle"
apply from: "$rootDir/config/serialization.gradle"

android {
    namespace 'com.smartwash.feature.game'
}

dependencies {
    // 本域对外契约（GameRoute + GameApi/GameVo）
    implementation project(':feature:game:api')

    // 响应信封 ApiResult、RequestState、selectedColor、LocalReduceMotion、按压反馈 pressable
    implementation project(':common:utils')
    // Retrofit（api 传递）+ @RequireAuthorization（GameApi 消费，
    // 鉴权/错误转译拦截器经 common:network 的 NetworkModule 自动生效）
    implementation project(':common:network')
    // 清氧设计系统 theme + 共享组件（PageHeader/EmptyState/SkeletonBlock/AppButton）+ ShellRoute
    implementation project(':common:ui')

    // ViewModel 基类 + viewModelScope
    implementation libs.androidx.lifecycle.viewmodel
    // hiltViewModel()
    implementation libs.androidx.hilt.navigation.compose
    // NavHostController（游戏卡 → WebView 页跳转）
    implementation libs.androidx.navigation.compose
    // Compose 基础（Column/LazyColumn/horizontalScroll；compose convention 只带 ui/material3）
    implementation libs.androidx.compose.foundation
    // 动效（chips 选中色过渡由 common:utils selectedColor 消费；保留与 toolbox 同基线）
    implementation libs.androidx.compose.animation
    // 图标（Icons.Default.SportsEsports 等，Material 内置；规范 §4.1 禁外部图标库）
    implementation libs.androidx.material.icons.extended

    // JVM 单测（icon/色组/分类白名单映射锚点 + 深链贡献者路由串锚点）
    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
}
