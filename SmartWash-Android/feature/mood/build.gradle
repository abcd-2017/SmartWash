// :feature:mood —— 情绪气象站子系统（单模块，照 :feature:toolbox 先例）。
// 交付今日记录/月历热图/月度趋势三个独立页面：路由常量 MoodRoute 为模块内单一事实来源，
// 经 app 壳 NavHost 聚合注册（宿主后续一行 moodGraph，本提交不改壳层导航）。
apply from: "$rootDir/config/android-library.gradle"
apply from: "$rootDir/config/compose.gradle"
apply from: "$rootDir/config/hilt.gradle"
apply from: "$rootDir/config/serialization.gradle"

android {
    namespace 'com.smartwash.feature.mood'
}

dependencies {
    // 响应信封 ApiResult/PageData、RequestState、动效降级 LocalReduceMotion/motionSpec、
    // 按压反馈 pressable、触感 HapticEffect
    implementation project(':common:utils')
    // Retrofit（api 传递）+ @RequireAuthorization（MoodApi 消费，
    // 鉴权/错误转译拦截器经 common:network 的 NetworkModule 自动生效）
    implementation project(':common:network')
    // 清氧设计系统 theme + 共享组件（PageHeader/GroupCard/EmptyState/SkeletonList）
    implementation project(':common:ui')

    // ViewModel 基类 + viewModelScope
    implementation libs.androidx.lifecycle.viewmodel
    // hiltViewModel()
    implementation libs.androidx.hilt.navigation.compose
    // NavHostController（页面间跳转）
    implementation libs.androidx.navigation.compose
    // Compose 基础（Column/Canvas/verticalScroll 等；compose convention 只带 ui/material3）
    implementation libs.androidx.compose.foundation
    // 动效（motionSpec/defaultSpring 消费；与 toolbox 同基线）
    implementation libs.androidx.compose.animation
    // 图标（EmptyState 占位参数消费，Material 内置；规范 §4.1 禁外部图标库）
    implementation libs.androidx.material.icons.extended
    // @Keep（MoodApi 的请求/返回体；common:model 的 annotation 不传递）
    implementation libs.androidx.annotation

    // JVM 单测（月份平移/等级词典/今日日期 key 计算）
    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
}
