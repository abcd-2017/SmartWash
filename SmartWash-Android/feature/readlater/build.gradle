// :feature:readlater —— 稍后读（AI 摘要）子系统（单模块，照 :feature:toolbox 先例）。
// 交付稍后读独立页面（收藏输入条/未读已读 Tab/搜索/标签筛选/卡片列表），
// 路由常量 ReadLaterRoute 为模块内单一事实来源，经 app 壳 NavHost 聚合注册
// （MainActivity NavHost 一行 readLaterGraph，入口走深链 smartwash://read-later）。
apply from: "$rootDir/config/android-library.gradle"
apply from: "$rootDir/config/compose.gradle"
apply from: "$rootDir/config/hilt.gradle"
apply from: "$rootDir/config/serialization.gradle"

android {
    namespace 'com.smartwash.feature.readlater'
}

dependencies {
    // 响应信封 ApiResult/PageData、RequestState、pagingFlow、按压反馈 pressable、
    // 动效降级 LocalReduceMotion、深链契约 DeepLinkContributor
    implementation project(':common:utils')
    // Retrofit（api 传递）+ @RequireAuthorization（ReadLaterApi 消费，
    // 鉴权/错误转译拦截器经 common:network 的 NetworkModule 自动生效）
    implementation project(':common:network')
    // 清氧设计系统 theme + 共享组件（PageHeader/GroupCard/AppButton/EmptyState/SkeletonList）
    implementation project(':common:ui')

    // ViewModel 基类 + viewModelScope
    implementation libs.androidx.lifecycle.viewmodel
    // hiltViewModel()
    implementation libs.androidx.hilt.navigation.compose
    // NavHostController（Graph 聚合）
    implementation libs.androidx.navigation.compose
    // Compose 基础（Column/LazyColumn/PullToRefresh/横向滚动行等；compose convention 只带 ui/material3）
    implementation libs.androidx.compose.foundation
    // 动效（页面不自写动效，共享组件内部消费；与 toolbox/mood 同基线）
    implementation libs.androidx.compose.animation
    // 分页（ReadLaterPagingSource + collectAsLazyPagingItems）
    implementation libs.androidx.paging.runtime.ktx
    implementation libs.androidx.paging.compose
    // 图标（Icons.Rounded.Link/Search 等，Material 内置；规范 §4.1 禁外部图标库）
    implementation libs.androidx.material.icons.extended
    // @Keep（ReadLaterApi 的请求/返回体）
    implementation libs.androidx.annotation
}
