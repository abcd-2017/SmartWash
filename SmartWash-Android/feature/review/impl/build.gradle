// :feature:review:impl —— 记忆复习实现（api/impl 拆分）。
// 包名/namespace 保持 com.smartwash.feature.review（与模块路径解耦）。
// FSRS 调度在后端 FsrsScheduler 纯函数，客户端只传 (cardId, rating)。
// 路由常量 ReviewRoute / ReviewConstant 与 ReviewApi/VO 在 :feature:review:api（单一事实来源），
// 页面经 app 壳 MainActivity NavHost 一行 reviewGraph 聚合。接口契约见 docs/review-api.md。
apply from: "$rootDir/config/android-library.gradle"
apply from: "$rootDir/config/compose.gradle"
apply from: "$rootDir/config/hilt.gradle"
apply from: "$rootDir/config/serialization.gradle"

android {
    namespace 'com.smartwash.feature.review'
}

dependencies {
    // 本域对外契约（ReviewRoute/ReviewConstant + ReviewApi/VO）
    implementation project(':feature:review:api')

    // 响应信封 ApiResult/PageData、RequestState、动效降级 LocalReduceMotion/motionSpec、
    // 按压反馈 pressable、触感 HapticEffect
    implementation project(':common:utils')
    // Retrofit（api 传递）+ @RequireAuthorization（ReviewApi 消费，
    // 鉴权/错误转译拦截器经 common:network 的 NetworkModule 自动生效）+ NetworkException
    implementation project(':common:network')
    // 清氧设计系统 theme + 共享组件（PageHeader/AppCard/AppButton/EmptyState/SkeletonList/GroupCard）
    implementation project(':common:ui')

    // ViewModel 基类 + viewModelScope + SavedStateHandle
    implementation libs.androidx.lifecycle.viewmodel
    // hiltViewModel()（传递 lifecycle-viewmodel-savedstate）
    implementation libs.androidx.hilt.navigation.compose
    // NavHostController（页面间跳转 + NavGraphBuilder 聚合）
    implementation libs.androidx.navigation.compose
    // Compose 基础（Column/LazyColumn/PullToRefresh 等；compose convention 只带 ui/material3）
    implementation libs.androidx.compose.foundation
    // 动效（复习页翻面 AnimatedContent + 卡片展开 AnimatedVisibility）
    implementation libs.androidx.compose.animation
    // 图标（EmptyState 占位参数消费 Material 内置；规范 §4.1 禁外部图标库）
    implementation libs.androidx.material.icons.extended
    // @Keep（ReviewApi 的请求/返回体；common:model 的 annotation 不传递）
    implementation libs.androidx.annotation

    // JVM 单测（到期文案换算等纯逻辑锚点）
    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
}
