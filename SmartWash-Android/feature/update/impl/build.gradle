// :feature:update:impl —— 热更新 full 变体实现（启动静默检查 + 更新 UI 状态机）。
// 包名/namespace 保持 com.smartwash.feature.update（与模块路径解耦）。
// 下载/安装/版本比较内核已抽至 :feature:update:core（两变体共用）；本模块只承载：
// - UpdateInitTask：启动静默检查（经 @IntoSet 注册进 InitTaskRegistry，lite 不依赖本模块故不注册）
// - UpdateEventBus：更新事件广播（feature → 壳层）
// - UpdateViewModel：检查→下载→安装状态机（app 壳 full 变体消费）
// 弹窗 UI 留壳层 app（事件驱动）；app 的 full 变体依赖本模块，lite 不依赖。
apply from: "$rootDir/config/android-library.gradle"
apply from: "$rootDir/config/hilt.gradle"

android {
    namespace 'com.smartwash.feature.update'

    testOptions {
        unitTests {
            // JVM 单测中 android.util.Log（AppLogger/LogCore）返回默认值而非抛 not mocked（dining 先例）
            returnDefaultValues = true
        }
    }
}

dependencies {
    // 对外契约（AppVersionVo；UpdateViewModel 状态机）
    implementation project(':feature:update:api')
    // 热更新内核（AppUpdateRepository / UpdateSettingsStore / ApkInstaller）
    implementation project(':feature:update:core')

    // NetworkException（UpdateViewModel 错误分流）
    implementation project(':common:network')
    // AppLogger
    implementation project(':common:utils')

    // 启动任务基类（UpdateInitTask）
    implementation project(':common:init')

    // ViewModel 基类 + viewModelScope
    implementation libs.androidx.lifecycle.viewmodel
    // UpdateEventBus/UpdateViewModel 的协程与 Flow
    implementation libs.kotlinx.coroutines.core

    // JVM 单测（事件总线 replay/DROP_OLDEST 契约 + 更新状态机锚点）
    testImplementation libs.junit
    // UpdateViewModel viewModelScope 的 Main 调度器注入
    testImplementation libs.kotlinx.coroutines.test
    // UpdateViewModel 构造链需要 Context（SessionManager 同款 Robolectric 先例）
    testImplementation libs.robolectric
    // android-all 框架包走 Gradle 依赖（CI gradle 缓存），避免 Robolectric 运行期自取
    testImplementation libs.androidAllInstrumented
    testImplementation libs.androidx.test.core
}
