// :feature:user:impl —— 用户域实现（api/impl 服务化样板的 impl 侧，T5.2）。
// 会话（SessionManager/SessionEventBus）+ 用户网络链路（UserAccountApi/UserRepository）
// + 权限管理/修改密码/重置密码页面（两变体共用，src/main）；对外仅经 :feature:user:api
// 的 UserApi 契约暴露（di @Binds），跨模块消费方不得触碰本模块实现细节。
//
// 变体说明（app flavors，与 app 模块同维度 "app"）：
// - src/main：两变体共用实现（会话/网络/权限/密码页），只依赖 user-api + common；
// - src/full：full 专属页面（登录/注册/设置/我的页/资料编辑/解读模型/钱包流水）与
//   其网络链路（DivSettingApi/TransactionApi）、图贡献者（UserFlavorGraphModule）。
//   这些页面依赖 laundry/order/payment/coupon/points/notice 等 full 专属契约，
//   故对应依赖一律声明为 fullImplementation（AGP flavor 配置）——放进 implementation
//   会让 lite 变体编译缺符号。
// 依赖方向：user-api / common / core:init（禁止依赖 app 壳与其他 feature-impl）。
apply from: "$rootDir/config/android-library.gradle"
apply from: "$rootDir/config/compose.gradle"
apply from: "$rootDir/config/hilt.gradle"

android {
    namespace 'com.smartwash.feature.user.impl'

    // ===== 变体维度（与 app 模块对齐）=====
    // app 声明 flavorDimensions "app" + full/lite 两 flavor；本模块作为被 app 依赖的
    // library，必须声明同名维度，否则 app 的 fullImplementation project(':feature:user:impl')
    // 无法解析到本模块的 full 变体（AGP 报 missingDimensionStrategy 缺失）。
    // 本模块只提供 full 源集（src/full），lite 变体即 src/main（无 lite 专属覆盖）。
    flavorDimensions "app"
    productFlavors {
        full {
            dimension "app"
        }
        lite {
            dimension "app"
        }
    }
}

dependencies {
    // 对外服务契约（UserApi/UserRoute/LoginEvent/UserInfo）
    implementation project(':feature:user:api')

    // 吃啥域对外契约（DiningApi：设置页「饮食偏好」经此读写 /web/auth/dining/dietary-preference；
    // 铁律 2：impl → 他人 api 合法；dining 两变体共用，故放 main 源集）
    implementation project(':feature:dining:api')

    // 响应信封 ApiResult / HttpStatusCode / RequestState
    implementation project(':common:utils')
    // Retrofit（api 传递）+ @RequireAuthorization + NetworkException + TokenProvider/SessionEventNotifier 契约
    implementation project(':common:network')
    // 清氧设计系统（AppColors/AppDimens/Glass* 主题 + AppCard/SettingRow 等组件）
    implementation project(':common:ui')
    // DataStore 封装（SharePreferenceUtils）+ 触感/按压反馈/手机号校验
    //（common:ui 对 common:utils 是 implementation，不传递，本模块直接消费须显式声明）
    implementation project(':common:utils')

    // 启动任务基类（SessionInitTask 注册进 InitTaskRegistry，App.onCreate 经 InitEngine 调度）
    implementation project(':common:init')

    // ViewModel 基类 + viewModelScope
    implementation libs.androidx.lifecycle.viewmodel
    // hiltViewModel()（页面默认参数）
    implementation libs.androidx.hilt.navigation.compose
    // NavHostController（页面间跳转）
    implementation libs.androidx.navigation.compose
    // Compose 基础（LazyColumn/verticalScroll/rememberScrollState；compose convention 只带 ui/material3）
    implementation libs.androidx.compose.foundation
    // rememberLauncherForActivityResult（权限管理页通知权限申请）
    implementation libs.androidx.activity.compose
    // 图标（权限管理页/重置密码页的 Material 内置图标）
    implementation libs.androidx.material.icons.extended
    // @Keep（UserAccountApi 的请求/返回体；common:model 的 annotation 不传递）
    implementation libs.androidx.annotation
    // MultipartBody（头像上传接口签名；okhttp 虽经 common:network 的 retrofit api 传递，
    // 本模块直接消费 okhttp3 类型，按项目惯例显式声明）
    implementation libs.okhttp
    // TokenRefresherImpl 解析 /auth/refresh 信封（ApiResult<TokenPairVo>）与请求体序列化
    implementation libs.gson
    // SessionManager/UserApiImpl 的协程作用域与 Flow
    implementation libs.kotlinx.coroutines.android

    // JVM 单测（TokenRefresherImpl 单飞续签链路）：SessionManager 的 DataStore 依赖 Android 上下文需
    // Robolectric + androidx.test.core（ApplicationProvider）；/auth/refresh 用 MockWebServer 假后端
    testImplementation libs.junit
    testImplementation libs.robolectric
    // android-all 框架包走 Gradle 依赖（CI gradle 缓存），避免 Robolectric 运行期自取
    testImplementation libs.androidAllInstrumented
    testImplementation libs.androidx.test.core
    testImplementation libs.mockwebserver

    // ==================== full 变体专属依赖（src/full 源集）====================
    // 以下均为 full 专属页面（登录/注册/设置/我的页/资料编辑/解读模型/钱包流水）的跨域契约，
    // 声明为 fullImplementation：只进 full 变体 classpath，lite 变体不解析这些符号。
    // 依赖方向仍为 impl → 他人 api（铁律 2），无任何 impl → impl。

    // 洗衣域学校搜索契约（SchoolSearchSource/SchoolOption；资料编辑页按关键字搜学校）
    fullImplementation project(':feature:laundry:api')
    // 订单域路由常量（OrderRoute；我的页「我的订单」入口跨域跳转）
    fullImplementation project(':feature:order:api')
    // 支付域路由常量（PaymentRoute；我的页「去充值」与钱包流水页「去充值」跨域跳转）
    fullImplementation project(':feature:payment:api')
    // 优惠券域路由常量（CouponRoute；我的页「优惠券」入口跨域跳转）
    fullImplementation project(':feature:coupon:api')
    // 积分域路由常量（PointsRoute；我的页「签到有礼」入口跨域跳转）
    fullImplementation project(':feature:points:api')
    // 站内信域路由常量与服务契约（NoticeRoute/NoticeApi；我的页「消息中心」入口 + 未读角标）
    fullImplementation project(':feature:notice:api')

    // 钱包流水分页（TransactionPagingSource + pagingFlow 的 Pager）
    fullImplementation libs.androidx.paging.runtime.ktx
    // collectAsLazyPagingItems（钱包流水页列表）
    fullImplementation libs.androidx.paging.compose
    // 头像 AsyncImage 加载（我的页头像）
    fullImplementation libs.coil.compose
    // 登录/注册/资料编辑页的认证转场与 AnimatedContent（compose convention 只带 ui/material3）
    fullImplementation libs.androidx.compose.animation
}
