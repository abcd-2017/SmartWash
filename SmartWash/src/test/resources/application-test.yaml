# 测试环境配置 - 使用 H2 内存数据库
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:smart_wash_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 3
  cache:
    type: simple

mybatis-plus:
  global-config:
    db-config:
      update-strategy: not_empty
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: dGVzdFNlY3JldEtleUZvckpXVFRlc3RpbmdQdXJwb3Nlcw==

cors:
  allowed-origins: http://localhost:*
