<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>元素落沙</title>
<style>
  /* token:GAME-THEME.md §2 (D5 终版:仅 :root 浅色 + [data-theme=dark] 深色,桥唯一控制) */
  :root{--g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-on-primary:#FFF;--g-primary-deep:#1E8C5C;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-warning:#D98A26;--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;
    --g-fs-empty:#FFFFFF;--g-fs-sand:#D9B44A;--g-fs-wetsand:#B08A42;--g-fs-water:#4A9FD4;--g-fs-stone:#8D958F;--g-fs-fire:#F2703E;--g-fs-smoke:#97A0A6;--g-fs-plant:#3FA45C;--g-fs-oil:#6E5433;--g-fs-steam:#BFD3DC;--g-fs-lava:#E2572B;--g-fs-glass:#C2E4E8;color-scheme:light}
  [data-theme="dark"]{--g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-warning:#E2A44E;--g-shadow:0 2px 12px rgba(0,0,0,.28);
    --g-fs-empty:#1D201E;--g-fs-sand:#E2BE58;--g-fs-wetsand:#BD9550;--g-fs-water:#6BB4DE;--g-fs-stone:#9BA39D;--g-fs-fire:#FF8A50;--g-fs-smoke:#8A9298;--g-fs-plant:#4ADE6E;--g-fs-oil:#8A6C45;--g-fs-steam:#A7C2CE;--g-fs-lava:#F26838;--g-fs-glass:#9CCBD4;color-scheme:dark}
  [hidden]{display:none!important}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--g-bg);color:var(--g-text);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:manipulation;
  }
  .app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:10px 12px calc(8px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:10px}
  h1{margin:0;font-size:21px;line-height:1.15;flex:1;color:var(--g-primary-deep)}
  .hud{display:flex;gap:10px;font-size:12px;color:var(--g-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .toolbar{display:flex;align-items:center;gap:8px;margin:10px 0 8px}
  .sp{flex:1}
  .btn{min-height:44px;padding:0 16px;border:0;border-radius:var(--g-radius-btn);background:var(--g-primary);color:var(--g-on-primary);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .btn:active{opacity:.85}
  .btn.ghost{background:var(--g-surface);color:var(--g-text);border:1px solid var(--g-border)}
  .seg{display:flex;border:1px solid var(--g-border);border-radius:var(--g-radius-btn);overflow:hidden;background:var(--g-surface)}
  .seg button{min-width:44px;min-height:44px;padding:0 10px;border:0;background:transparent;color:var(--g-text);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .seg button+button{border-left:1px solid var(--g-border)}
  .seg button.on{background:var(--g-primary);color:var(--g-on-primary)}
  .stage{position:relative;flex:1;min-height:240px;display:flex;align-items:center;justify-content:center;border:1px solid var(--g-border);border-radius:var(--g-radius);background:var(--g-surface2);overflow:hidden}
  canvas{display:block;touch-action:none;border-radius:10px}
  .badge{position:absolute;top:10px;right:10px;padding:5px 10px;border:1px solid var(--g-border);border-radius:9px;background:var(--g-surface);color:var(--g-warning);font-size:12px;font-weight:700}
  .bar{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;min-height:46px;min-width:56px;padding:6px 12px;border:1px solid var(--g-border);border-radius:var(--g-radius-btn);background:var(--g-surface);color:var(--g-text);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .chip .sw{width:16px;height:16px;border-radius:5px;flex:0 0 auto}
  .chip.on{border-color:var(--g-primary);background:var(--g-primary-soft);color:var(--g-on-soft);box-shadow:inset 0 0 0 1px var(--g-primary)}
  .foot{margin:6px 0 0;font-size:12px;color:var(--g-faint);text-align:center;min-height:18px}
  .foot b{color:var(--g-primary-deep)}
  #toast{color:var(--g-muted)}
  #toast.pop{animation:fspop .35s ease-out}
  @keyframes fspop{from{transform:scale(1.3)}to{transform:scale(1)}}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
paint(B||"light");
})();
</script>
</head>
<body>
<div class="app">
  <header>
    <h1>元素落沙</h1>
    <div class="hud"><span id="fps">— FPS</span><span id="cnt">0 粒</span></div>
  </header>
  <div class="toolbar">
    <div class="seg" id="brushSeg">
      <button type="button" data-b="2">细</button>
      <button type="button" data-b="4" class="on">中</button>
      <button type="button" data-b="7">粗</button>
    </div>
    <span class="sp"></span>
    <button class="btn ghost" id="clearBtn" type="button">清屏</button>
    <button class="btn" id="pauseBtn" type="button">暂停</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="元素落沙实验区"></canvas>
    <span class="badge" id="badge" hidden>已暂停</span>
  </div>
  <div class="bar" id="elemBar"></div>
  <p class="foot"><b id="reactCount">0/9</b> 反应已发现 · <span id="toast">拖拽画布倾倒元素，试着发现全部反应</span></p>
</div>
<script>
"use strict";
(() => {
  // ===== 元胞自动机核心:typed array 网格 240x400 =====
  const GW = 240, GH = 400, NCELLS = GW * GH;
  const STEP = 1 / 60;
  const PREFS_KEY = "sw_h5_fallsand_prefs";
  // 元素 id:0空 1沙 2水 3石 4火 5烟 6植物 7油 8蒸汽 9岩浆 10玻璃 11湿沙
  const E = { EMPTY:0, SAND:1, WATER:2, STONE:3, FIRE:4, SMOKE:5, PLANT:6, OIL:7, STEAM:8, LAVA:9, GLASS:10, WETSAND:11 };
  const CAT  = [0,1,2,0,3,3,0,2,3,2,0,1];   // 0静态 1粉 2液 3气
  const DENS = [0,5,3,0,0,0,0,2,0,6,0,5];   // 粉/液密度,大者沉(沙沉入水/油,水沉入油,岩浆最重)
  const FLOW = [0,0,5,0,0,0,0,3,0,2,0,0];   // 液体横向铺展格数

  const REACT_NAMES = {
    steam:  "水火相克 · 蒸汽",
    quench: "水淬岩浆 · 岩石",
    wet:    "沙水相融 · 湿沙",
    grow:   "植物吸水 · 生长",
    ignite: "油液遇火 · 点燃",
    burn:   "植物燃烧",
    glass:  "高温熔砂 · 玻璃",
    crust:  "岩浆表面 · 结壳",
    rain:   "蒸汽冷凝 · 成雨"
  };
  const REACT_KEYS = Object.keys(REACT_NAMES);

  const grid  = new Uint8Array(NCELLS);
  const life  = new Uint8Array(NCELLS);   // 气体寿命
  const moved = new Uint8Array(NCELLS);   // 本步已移动标记,防双移
  let frame = 0;

  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const stage = $("stage"), fpsEl = $("fps"), cntEl = $("cnt"), badge = $("badge");
  const clearBtn = $("clearBtn"), pauseBtn = $("pauseBtn"), elemBar = $("elemBar");
  const brushSeg = $("brushSeg"), reactCountEl = $("reactCount"), toastEl = $("toast");

  // 离屏 1:1 网格画布,主画布最近邻放大
  const off = document.createElement("canvas");
  off.width = GW; off.height = GH;
  const octx = off.getContext("2d");
  const img = octx.createImageData(GW, GH);

  // ===== 主题调色板:颜色全部读 CSS 变量,JS 零颜色字面量 (GAME-THEME.md §3) =====
  const PAL = {};
  const colTab = [];
  const FS_DEFS = [
    [E.EMPTY,"empty"],[E.SAND,"sand"],[E.WETSAND,"wetsand"],[E.WATER,"water"],[E.STONE,"stone"],
    [E.FIRE,"fire"],[E.SMOKE,"smoke"],[E.PLANT,"plant"],[E.OIL,"oil"],[E.STEAM,"steam"],
    [E.LAVA,"lava"],[E.GLASS,"glass"]
  ];
  function hx(v){ return /^#[0-9a-fA-F]{6}$/.test(v) ? [parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)] : null; }
  function palLoad(){
    const s = getComputedStyle(document.documentElement);
    for(const def of FS_DEFS){
      const c = hx(s.getPropertyValue("--g-fs-" + def[1]).trim());
      if(c) colTab[def[0]] = c;
      else if(!colTab[def[0]]) colTab[def[0]] = [128,128,128];
    }
  }
  window.__gOnTheme = function(){ palLoad(); render(); };
  palLoad();

  // ===== 可放置元素 =====
  const PLACE = [
    {id:E.SAND,  key:"sand",  name:"沙"},
    {id:E.WATER, key:"water", name:"水"},
    {id:E.STONE, key:"stone", name:"石"},
    {id:E.FIRE,  key:"fire",  name:"火"},
    {id:E.PLANT, key:"plant", name:"植物"},
    {id:E.OIL,   key:"oil",   name:"油"},
    {id:E.LAVA,  key:"lava",  name:"岩浆"},
    {id:E.SMOKE, key:"smoke", name:"烟"},
    {id:0,       key:"erase", name:"橡皮"}
  ];
  const PROB = [1, 0.8, 0.75, 0.95, 0.6, 0.5, 0.75, 0.75, 0, 0, 0, 0, 1];

  let curElem = E.SAND, brush = 4;
  let running = true, resumeOnVisible = false;
  let discovered = new Set();
  let dpr = 1;

  // ===== 存档(localStorage,try/catch) =====
  function loadPrefs(){
    try{
      const v = JSON.parse(localStorage.getItem(PREFS_KEY) || "null");
      if(v && typeof v === "object"){
        if(PLACE.some(p => p.id === v.e)) curElem = v.e;
        if(v.b === 2 || v.b === 4 || v.b === 7) brush = v.b;
        if(Array.isArray(v.d)) v.d.forEach(k => { if(REACT_NAMES[k]) discovered.add(k); });
      }
    }catch(e){}
  }
  function savePrefs(){
    try{ localStorage.setItem(PREFS_KEY, JSON.stringify({e:curElem, b:brush, d:[...discovered]})); }catch(e){}
  }

  // ===== 气体生成(带寿命) =====
  function ignite(i){ grid[i] = E.FIRE;  life[i] = 30 + (Math.random()*40|0); }
  function smokeAt(i){ grid[i] = E.SMOKE; life[i] = 90 + (Math.random()*80|0); }
  function steamAt(i){ grid[i] = E.STEAM; life[i] = 240 + (Math.random()*240|0); }

  // ===== 反应发现提示 =====
  function note(k){
    if(discovered.has(k)) return;
    discovered.add(k);
    reactCountEl.textContent = discovered.size + "/" + REACT_KEYS.length;
    toastEl.textContent = "新反应：" + REACT_NAMES[k];
    toastEl.classList.remove("pop"); void toastEl.offsetWidth; toastEl.classList.add("pop");
    savePrefs();
  }

  function trySwap(i, j){
    const g = grid[i]; grid[i] = grid[j]; grid[j] = g;
    const l = life[i]; life[i] = life[j]; life[j] = l;
    moved[i] = 1; moved[j] = 1;
  }

  // ===== 反应表(双元素接触) =====
  const RX = [1,-1,0,0], RY = [0,0,1,-1];
  function reactWater(i, x, y){
    for(let k = 0; k < 4; k++){
      if(grid[i] !== E.WATER) return;
      const nx = x + RX[k], ny = y + RY[k];
      if(nx < 0 || nx >= GW || ny < 0 || ny >= GH) continue;
      const j = i + RY[k]*GW + RX[k], n = grid[j], r = Math.random();
      if(n === E.FIRE){ if(r < 0.9){ steamAt(j); note("steam"); } }
      else if(n === E.LAVA){ if(r < 0.7){ grid[j] = E.STONE; moved[j] = 1; steamAt(i); note("quench"); } }
      else if(n === E.SAND){ if(r < 0.3){ grid[j] = E.WETSAND; moved[j] = 1; note("wet"); } else if(r > 0.9){ grid[i] = E.EMPTY; } }
      else if(n === E.PLANT){ if(r < 0.008){ grid[i] = E.PLANT; moved[i] = 1; note("grow"); } }
    }
  }
  function reactFire(i, x, y){
    for(let k = 0; k < 4; k++){
      if(grid[i] !== E.FIRE) return;
      const nx = x + RX[k], ny = y + RY[k];
      if(nx < 0 || nx >= GW || ny < 0 || ny >= GH) continue;
      const j = i + RY[k]*GW + RX[k], n = grid[j], r = Math.random();
      if(n === E.WATER){ if(r < 0.9){ steamAt(i); note("steam"); } }
      else if(n === E.PLANT){ if(r < 0.3){ ignite(j); note("burn"); } }
      else if(n === E.OIL){ if(r < 0.45){ ignite(j); note("ignite"); } }
    }
  }
  function reactLava(i, x, y){
    for(let k = 0; k < 4; k++){
      if(grid[i] !== E.LAVA) return;
      const nx = x + RX[k], ny = y + RY[k];
      if(nx < 0 || nx >= GW || ny < 0 || ny >= GH) continue;
      const j = i + RY[k]*GW + RX[k], n = grid[j], r = Math.random();
      if(n === E.SAND || n === E.WETSAND){ if(r < 0.06){ grid[j] = E.GLASS; moved[j] = 1; note("glass"); } }
      else if(n === E.WATER){ if(r < 0.7){ grid[i] = E.STONE; moved[i] = 1; steamAt(j); note("quench"); } }
      else if(n === E.OIL){ if(r < 0.4){ ignite(j); note("ignite"); } }
      else if(n === E.PLANT){ if(r < 0.5){ ignite(j); note("burn"); } }
    }
  }

  // ===== 运动规则(粉/液/气三类) =====
  function movePowder(i, x, y, v){
    if(y >= GH - 1) return;
    const dn = i + GW, b = grid[dn];
    if((b === E.EMPTY || CAT[b] === 3 || (CAT[b] === 2 && DENS[v] > DENS[b])) && !moved[dn]){ trySwap(i, dn); return; }
    if(v === E.WETSAND && Math.random() < 0.55) return;   // 湿沙黏滞:斜向概率减半
    const d = Math.random() < 0.5 ? 1 : -1;
    for(let k = 0; k < 2; k++){
      const dx = d * (k ? -1 : 1), nx = x + dx;
      if(nx < 0 || nx >= GW) continue;
      const j = dn + dx, c = grid[j];
      if((c === E.EMPTY || CAT[c] === 3 || (CAT[c] === 2 && DENS[v] > DENS[c])) && !moved[j]){ trySwap(i, j); return; }
    }
  }
  function moveLiquid(i, x, y, v){
    if(v === E.LAVA){
      if(y > 0 && grid[i - GW] === E.EMPTY && Math.random() < 0.0012){ grid[i] = E.STONE; moved[i] = 1; note("crust"); return; }
      if(frame & 1) return;                               // 岩浆迟滞:隔步流动
    }
    if(y < GH - 1){
      const dn = i + GW, b = grid[dn];
      if((b === E.EMPTY || CAT[b] === 3 || (CAT[b] === 2 && DENS[v] > DENS[b])) && !moved[dn]){ trySwap(i, dn); return; }
      const d = Math.random() < 0.5 ? 1 : -1;
      for(let k = 0; k < 2; k++){
        const dx = d * (k ? -1 : 1), nx = x + dx;
        if(nx < 0 || nx >= GW) continue;
        const j = dn + dx, c = grid[j];
        if(c === E.EMPTY && !moved[j]){ trySwap(i, j); return; }
      }
    }
    const flow = FLOW[v], d = Math.random() < 0.5 ? 1 : -1;
    let dest = -1;
    for(let k = 1; k <= flow; k++){
      const nx = x + d * k;
      if(nx < 0 || nx >= GW) break;
      const j = i + d * k;
      if(grid[j] === E.EMPTY && !moved[j]) dest = j; else break;
    }
    if(dest >= 0) trySwap(i, dest);
  }
  function moveGas(i, x, y, v){
    const L = life[i] - 1;
    if(L <= 0){
      if(v === E.FIRE){ if(Math.random() < 0.35) smokeAt(i); else grid[i] = E.EMPTY; }
      else if(v === E.STEAM){ grid[i] = E.WATER; note("rain"); }
      else grid[i] = E.EMPTY;
      moved[i] = 1; return;
    }
    life[i] = L;
    if(y === 0){
      if(v === E.STEAM && Math.random() < 0.03){ grid[i] = E.WATER; moved[i] = 1; note("rain"); }
      else if(Math.random() < 0.06){ grid[i] = E.EMPTY; moved[i] = 1; }
      return;
    }
    const up = i - GW, b = grid[up];
    if((b === E.EMPTY || (CAT[b] === 2 && v !== E.FIRE)) && Math.random() < (v === E.STEAM ? 0.95 : v === E.FIRE ? 0.8 : 0.7)){ trySwap(i, up); return; }
    const d = Math.random() < 0.5 ? 1 : -1, nx = x + d;
    if(nx >= 0 && nx < GW){
      const j = up + d, c = grid[j];
      if((c === E.EMPTY || (CAT[c] === 2 && v !== E.FIRE)) && Math.random() < 0.6){ trySwap(i, j); return; }
      if(grid[i + d] === E.EMPTY && Math.random() < 0.3){ trySwap(i, i + d); return; }
    }
  }

  // ===== 单步模拟:自底向上 + 逐行交替方向扫描 =====
  function step(){
    frame++;
    moved.fill(0);
    for(let y = GH - 1; y >= 0; y--){
      const ltr = (y + frame) & 1, row = y * GW;
      for(let q = 0; q < GW; q++){
        const x = ltr ? q : GW - 1 - q, i = row + x, v = grid[i];
        if(!v || moved[i]) continue;
        if(v === E.WATER){ reactWater(i, x, y); if(grid[i] !== E.WATER || moved[i]) continue; moveLiquid(i, x, y, v); }
        else if(v === E.FIRE){ reactFire(i, x, y); if(grid[i] !== E.FIRE || moved[i]) continue; moveGas(i, x, y, v); }
        else if(v === E.LAVA){ reactLava(i, x, y); if(grid[i] !== E.LAVA || moved[i]) continue; moveLiquid(i, x, y, v); }
        else if(v === E.SAND || v === E.WETSAND){ movePowder(i, x, y, v); }
        else if(v === E.OIL){ moveLiquid(i, x, y, v); }
        else if(v === E.SMOKE || v === E.STEAM){ moveGas(i, x, y, v); }
      }
    }
  }

  // ===== 渲染:ImageData 直写 + 最近邻放大;顺带统计粒子数 =====
  function render(){
    const d = img.data, t = frame & 1023;
    let count = 0;
    for(let i = 0, p = 0; i < NCELLS; i++, p += 4){
      const v = grid[i];
      if(v === 0){ d[p] = colTab[0][0]; d[p+1] = colTab[0][1]; d[p+2] = colTab[0][2]; d[p+3] = 255; continue; }
      count++;
      const c = colTab[v];
      let n = ((i * 2654435761 + t * 97) >>> 0) & 63; n -= 32;
      if(v !== E.FIRE && v !== E.LAVA && v !== E.STEAM && v !== E.SMOKE) n >>= 2;
      d[p] = c[0] + n; d[p+1] = c[1] + n; d[p+2] = c[2] + n; d[p+3] = 255;
    }
    octx.putImageData(img, 0, 0);
    ctx.drawImage(off, 0, 0, cv.width, cv.height);
    return count;
  }

  // ===== 画布尺寸(适配 stage,保持 3:5) =====
  function fit(){
    const r = stage.getBoundingClientRect();
    const aw = Math.max(120, r.width - 16), ah = Math.max(180, r.height - 16);
    let ch = ah, cw = ch * GW / GH;
    if(cw > aw){ cw = aw; ch = cw * GH / GW; }
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width = cw + "px"; cv.style.height = ch + "px";
    cv.width = Math.max(1, Math.round(cw * dpr));
    cv.height = Math.max(1, Math.round(ch * dpr));
    ctx.imageSmoothingEnabled = false;
  }

  // ===== 触控倾倒(多指 + 插值补点) =====
  const pointers = new Map();
  function toCell(e){
    const r = cv.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(GW - 1, Math.floor((e.clientX - r.left) / r.width * GW))),
      y: Math.max(0, Math.min(GH - 1, Math.floor((e.clientY - r.top) / r.height * GH)))
    };
  }
  function stamp(cx, cy){
    const r = brush;
    for(let dy = -r; dy <= r; dy++){
      for(let dx = -r; dx <= r; dx++){
        if(dx*dx + dy*dy > r*r) continue;
        const px = cx + dx, py = cy + dy;
        if(px < 0 || px >= GW || py < 0 || py >= GH) continue;
        const i = py * GW + px;
        if(curElem === 0){ grid[i] = 0; life[i] = 0; continue; }
        if(Math.random() > PROB[curElem]) continue;
        grid[i] = curElem;
        if(curElem === E.FIRE) life[i] = 30 + (Math.random()*40|0);
        else if(curElem === E.SMOKE) life[i] = 90 + (Math.random()*80|0);
        else life[i] = 0;
      }
    }
  }
  function strokeLine(a, b){
    const n = Math.max(1, Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y)));
    for(let s = 1; s <= n; s++) stamp(Math.round(a.x + (b.x - a.x) * s / n), Math.round(a.y + (b.y - a.y) * s / n));
  }
  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    if(cv.setPointerCapture) try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    const c = toCell(e);
    pointers.set(e.pointerId, c);
    stamp(c.x, c.y);
  });
  cv.addEventListener("pointermove", e => {
    if(!pointers.has(e.pointerId)) return;
    e.preventDefault();
    const c = toCell(e), prev = pointers.get(e.pointerId);
    strokeLine(prev, c);
    pointers.set(e.pointerId, c);
  });
  const lift = e => { pointers.delete(e.pointerId); };
  cv.addEventListener("pointerup", lift);
  cv.addEventListener("pointercancel", lift);

  // ===== 元素选择栏 / 笔刷 / 按钮 =====
  function buildChips(){
    elemBar.innerHTML = PLACE.map(p =>
      `<button type="button" class="chip${p.id === curElem ? " on" : ""}" data-id="${p.id}">` +
      `<i class="sw" style="background:${p.id ? "var(--g-fs-" + p.key + ")" : "var(--g-surface2)"}"></i>${p.name}</button>`
    ).join("");
    elemBar.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      curElem = +b.dataset.id;
      elemBar.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", +x.dataset.id === curElem));
      savePrefs();
    }));
  }
  function syncBrush(){
    brushSeg.querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.b === brush));
  }
  brushSeg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    brush = +b.dataset.b; syncBrush(); savePrefs();
  }));
  function syncPause(){ badge.hidden = running; pauseBtn.textContent = running ? "暂停" : "继续"; }
  clearBtn.addEventListener("click", () => { grid.fill(0); life.fill(0); toastEl.textContent = "已清空画布"; });
  pauseBtn.addEventListener("click", () => { running = !running; resumeOnVisible = false; syncPause(); });

  // 切后台自动暂停,回前台恢复(除非用户手动暂停)
  document.addEventListener("visibilitychange", () => {
    if(document.hidden){
      if(running){ running = false; resumeOnVisible = true; syncPause(); }
    }else if(resumeOnVisible){
      resumeOnVisible = false; running = true; syncPause();
      last = performance.now(); acc = 0;
    }
  });
  window.addEventListener("resize", fit);

  // ===== 主循环:dt 累积器驱动固定步长模拟 =====
  let last = performance.now(), acc = 0, frames = 0, hudT = 0;
  function loop(now){
    requestAnimationFrame(loop);
    let dt = (now - last) / 1000; last = now;
    if(!(dt > 0)) dt = 0.016;
    if(dt > 0.1) dt = 0.1;
    if(running){
      acc += dt;
      let n = 0;
      while(acc >= STEP && n < 3){ step(); acc -= STEP; n++; }
      if(acc > STEP) acc = 0;
    }
    const count = render();
    frames++;
    if(now - hudT > 500){
      fpsEl.textContent = Math.round(frames * 1000 / (now - hudT)) + " FPS";
      cntEl.textContent = count + " 粒";
      frames = 0; hudT = now;
    }
  }

  loadPrefs();
  buildChips();
  syncBrush();
  syncPause();
  reactCountEl.textContent = discovered.size + "/" + REACT_KEYS.length;
  fit();
  requestAnimationFrame(loop);

  // QA 钩子(自动化测试用,不影响玩法)
  window.__fs = { grid, life, step, render, stamp, GW, GH };
})();
</script>
</body>
</html>
