<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>算盘速算</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（木框 / 木珠，前缀 afb-）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-on-primary:#FFFFFF;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-hairline:#EFF1EE;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gap:16px;--g-afb-wood1:#C9A06A;--g-afb-wood2:#A87F4C;--g-afb-bead1:#F0E0C2;--g-afb-bead2:#D6BE95;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-hairline:#262A27;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-afb-wood1:#6B5334;--g-afb-wood2:#4A3822;--g-afb-bead1:#4A3B28;--g-afb-bead2:#332A1C;color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .lvtag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 10px; background: var(--g-primary-soft); color: var(--g-on-soft); font-size: 14px; font-weight: 600; line-height: 1.4; }
  .sub { font-size: 14px; color: var(--g-muted); }
  /* 入场错落 30-50ms */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat { background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; min-width: 0; animation: rise .38s ease-out both; }
  .stat:nth-child(2) { animation-delay: 36ms; }
  .stat:nth-child(3) { animation-delay: 72ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); white-space: nowrap; }
  .stat .val { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); transition: color .16s ease-out; }
  .stat .val.low { color: var(--g-danger); }
  .stat .val.bump { animation: bump .3s ease-out; }
  .stage { background: var(--g-surface); border-radius: var(--g-radius); box-shadow: var(--g-shadow); padding: 14px 12px 12px; }
  /* 目标：算式结果区，品牌软底深字 */
  .q { text-align: center; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 12px; padding: 8px 10px; border-radius: 12px; background: var(--g-primary-soft); color: var(--g-on-soft); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; transition: color .16s ease-out; }

  /* 算盘：木框 / 档杆 / 计数梁 / 算珠 */
  .abacus {
    position: relative;
    display: flex; justify-content: center; gap: 10px;
    padding: 12px 10px;
    border-radius: var(--g-radius);
    background: linear-gradient(180deg, var(--g-afb-wood1), var(--g-afb-wood2));
    box-shadow: inset 0 2px 0 rgba(255,255,255,.32), inset 0 -3px 0 rgba(0,0,0,.14), var(--g-shadow);
  }
  .abacus::before { content: ""; position: absolute; left: 7px; right: 7px; top: 7px; bottom: 26px; border-radius: 12px; background: var(--g-afb-wood2); box-shadow: inset 0 2px 7px rgba(0,0,0,.22); }
  .rod { position: relative; display: flex; flex-direction: column; align-items: center; width: 58px; z-index: 1; animation: rise .4s ease-out both; }
  .rod:nth-child(2) { animation-delay: 36ms; }
  .rod:nth-child(3) { animation-delay: 72ms; }
  .rod:nth-child(4) { animation-delay: 108ms; }
  .rline { position: absolute; left: 50%; top: 6px; bottom: 30px; width: 3px; margin-left: -1.5px; border-radius: 10px; background: linear-gradient(90deg, rgba(0,0,0,.24), var(--g-afb-wood1) 55%, rgba(0,0,0,.18)); transition: background .16s ease-out, box-shadow .16s ease-out; }
  .rod.cur .rline { background: linear-gradient(90deg, var(--g-primary-deep), var(--g-primary) 55%, var(--g-primary-deep)); box-shadow: 0 0 6px rgba(45,155,106,.55); }
  .upzone { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 5px; min-height: 50px; }
  .beam { height: 8px; width: 100%; margin: 1px 0; border-radius: 999px; background: linear-gradient(180deg, var(--g-afb-wood1), var(--g-afb-wood2)); box-shadow: inset 0 1px 0 rgba(255,255,255,.42), inset 0 -1px 0 rgba(0,0,0,.22), 0 1px 2px rgba(0,0,0,.2); }
  .dnzone { display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 5px; }
  /* 算珠：44px 热区 + 34px 木珠面 + 高光/投影 */
  .bead { position: relative; width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; padding: 0; font: inherit; transition: transform .14s ease-out; }
  .bead:active { transform: scale(.96); }
  .bs { position: absolute; left: 1px; right: 1px; top: 50%; height: 34px; transform: translateY(-50%); border-radius: 999px; background: linear-gradient(180deg, var(--g-afb-bead1), var(--g-afb-bead2)); box-shadow: inset 0 2px 2px rgba(255,255,255,.55), inset 0 -3px 4px rgba(0,0,0,.16), 0 2px 3px rgba(0,0,0,.22); transition: transform .16s ease-out, background .16s ease-out, box-shadow .16s ease-out; }
  .bs::after { content: ""; position: absolute; left: 14%; right: 14%; top: 12%; height: 26%; border-radius: 999px; background: rgba(255,255,255,.5); }
  .bead.active .bs { background: linear-gradient(180deg, var(--g-primary), var(--g-primary-deep)); box-shadow: inset 0 2px 2px rgba(255,255,255,.35), inset 0 -3px 4px rgba(0,0,0,.24), 0 2px 4px rgba(0,0,0,.26); }
  .bead.active .bs::after { background: rgba(255,255,255,.4); }
  :root[data-theme=dark] .bead.active .bs { background: linear-gradient(180deg, var(--g-primary-deep), var(--g-primary)); }
  /* 计数珠轻靠计数梁，给出「拨到位」的手感 */
  .upzone .bead.active .bs { transform: translateY(calc(-50% + 3px)); }
  .dnzone .bead.active .bs { transform: translateY(calc(-50% - 3px)); }
  .rodlabel { margin-top: 6px; padding: 1px 6px; border-radius: 10px; background: var(--g-surface); color: var(--g-text); font-size: 12px; font-variant-numeric: tabular-nums; box-shadow: 0 1px 2px rgba(0,0,0,.16); }
  .rod.cur .rodlabel { color: var(--g-primary-deep); font-weight: 700; }
  /* 图例 */
  .legend { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .lg { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--g-muted); }
  .lg .swi { color: var(--g-primary-deep); }

  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn {
    min-height: 44px; padding: 0 10px; flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .14s ease-out, background .16s ease-out, opacity .16s ease-out;
  }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .35; }
  .btn.primary { background: var(--g-btn-primary); color: var(--g-on-primary); }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .ctl { min-height: 48px; width: 100%; border: 0; border-radius: var(--g-radius-btn); background: var(--g-btn-primary); color: var(--g-on-primary); font-family: inherit; font-size: 18px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--g-shadow); transition: transform .14s ease-out, filter .16s ease-out; }
  .ctl:active { transform: scale(.96); }
  .ctl[disabled] { opacity: .45; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
    transition: transform .14s ease-out, background .16s ease-out;
  }
  .lvbtn:active { transform: scale(.96); }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* 动效降级：同时压平 duration 与 delay，否则错落入场会变成整体延迟后闪现 */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:.01ms !important; transition-duration:.01ms !important} }
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
/* 内联图标库：照抄本库 window.SW_ICON 结构（24 viewBox / currentColor / 零外链） */
window.SW_ICON=function(n,s){s=s||"";var P={
 'bulb':'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.7 1.3 1.5 1.3 2.5h5.4c0-1 .5-1.8 1.3-2.5A6 6 0 0 0 12 3z"/>',
 'backspace':'<path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/>',
 'rotate':'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
 'grid':'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
 'check':'<path d="M4 12.5l5 5L20 6.5"/>',
 'x':'<path d="M6 6l12 12M18 6L6 18"/>',
 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>',
 'target':'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',
 'circle':'<circle cx="12" cy="12" r="5.5"/>'
};
var fill={'circle':1};
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};

<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<body>
<div class="wrap">
  <header><span class="lvtag" id="lvTag">第 1 关</span><span class="sub" id="lvRule"></span></header>
  <div class="stats">
    <div class="stat"><span class="label">关卡</span><span class="val" id="stLv">1/40</span></div>
    <div class="stat"><span class="label">算盘读数</span><span class="val" id="stVal">0</span></div>
    <div class="stat"><span class="label">机会</span><span class="val" id="stCh">3</span></div>
  </div>
  <div class="stage">
    <div class="q" id="qtext"></div>
    <div class="abacus" id="abacus"></div>
    <div class="legend">
      <span class="lg" id="lg1"></span>
      <span class="lg" id="lg2"></span>
      <span class="lg" id="lg3"></span>
    </div>
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite">拨珠让算盘读数等于算式结果，点「确认」；上珠一颗计 5，下珠一颗计 1</p>
  <div class="tools">
    <button class="btn" id="btnHint">提示</button>
    <button class="btn" id="btnZero">清盘</button>
    <button class="btn" id="btnReset">重开</button>
    <button class="btn" id="btnLv">选关</button>
  </div>
  <button class="ctl" id="btnOk">确认读数</button>
  <p class="foot">键盘：←/→ 切档 · 1-9 直设档值 · 0 清档 · Enter 确认 · H 提示 · R 重开 · L 选关</p>
</div>
<div class="overlay" role="dialog" aria-modal="true" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">过关！</h2>
    <p class="desc" id="ovDesc"></p>
    <div class="lvgrid" id="lvgrid" hidden></div>
    <button class="btn primary" id="ovBtn">下一关</button>
  </div>
</div>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡（种子制：genLevel 生成 + 独立验证器逐关复核 + 缓存） ---------- */
var GAME_KEY="abacus-flash",SAVE_KEY="sw.abacusflash.v1";
var LEVELS=[];for(var _i=0;_i<40;_i++)LEVELS.push(17001+_i*31);
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function applySeeds(seeds,ver){
  if(!Array.isArray(seeds)||seeds.length<8||!seeds.every(function(s){return Number.isInteger(s)&&s>0&&s<1e9;}))return false;
  LEVELS=seeds.slice();
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(LEVELS));localStorage.setItem(LEVELS_VER_KEY,String(ver||0));}catch(e){}
  return true;
}
function loadCachedSeeds(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length>=8&&list.every(function(s){return Number.isInteger(s)&&s>0&&s<1e9;})){
      LEVELS=list;return true;
    }
  }catch(e){}
  return false;
}
loadCachedSeeds();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    if(!res||!Array.isArray(res.levels)||!res.levels.length)return;
    var seeds=[];
    for(var i=0;i<res.levels.length;i++){
      var row=res.levels[i];
      if(!row||typeof row.dataJson!=="string")return;
      try{var d=JSON.parse(row.dataJson);if(!d||!Number.isInteger(d.seed))return;seeds.push(d.seed);}catch(e){return;}
    }
    if(applySeeds(seeds,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  setOvBtn("取消","x");
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

/* ---------- 生成器基础 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function diffOf(idx){
  if(idx<10)return {rods:2,sub:0.3,two:0};
  if(idx<22)return {rods:3,sub:0.35,two:0.15};
  if(idx<32)return {rods:3,sub:0.4,two:0.3};
  return {rods:4,sub:0.4,two:0.4};
}
/* 读数（生成器路径：位权累加） */
function beadsToValue(up,dn){
  var v=0,n=up.length;
  for(var i=0;i<n;i++)v+=(up[i]*5+dn[i])*Math.pow(10,n-1-i);
  return v;
}
/* genLevel：算式 x+y / y−x / x+y−z，答案在 rods 档可表示范围 */
function genLevel(seed,idx,attempt){
  attempt=attempt||0;
  var rng=mulberry32(seed);
  var dc=diffOf(idx);
  var lim=Math.pow(10,dc.rods)-1;
  var lo=Math.max(1,Math.floor(lim/20));
  var x=lo+Math.floor(rng()*(lim-lo*2));
  var y=lo+Math.floor(rng()*(lim-lo*2));
  var z=0;
  var two=rng()<dc.two;
  if(two)z=lo+Math.floor(rng()*(lim-lo*2));
  var sub=!two&&rng()<dc.sub;
  var ans;
  if(two)ans=x+y-z;
  else if(sub){
    if(y<=x){var t=x;x=y;y=t;}
    if(y===x)y=Math.min(lim,y+1);
    ans=y-x;
  }
  else ans=x+y;
  if(ans<0||ans>lim){
    if(attempt>=5)return {rods:dc.rods,parts:[12,34,0,0,0],sub:false,two:false,ans:46,seed:seed};
    return genLevel((seed*37+41)%1000000007,idx,attempt+1);
  }
  return {rods:dc.rods,parts:[x,y,0,0,z],sub:sub,two:two,ans:ans,seed:seed};
}
/* 独立验证器：字符串拼接重组路径 + 逐档表示性检查 */
function verifyLevelData(d){
  if(!d||typeof d!=="object")return "数据异常";
  if(!Number.isInteger(d.rods)||d.rods<2||d.rods>4)return "档位越界";
  if(!Array.isArray(d.parts)||d.parts.length<2)return "算式结构异常";
  for(var i=0;i<d.parts.length;i++){
    if(!Number.isInteger(d.parts[i])||d.parts[i]<0||d.parts[i]>9999)return "算式数越界";
  }
  if(!Number.isInteger(d.ans)||d.ans<0)return "答案异常";
  /* 独立求值：按 parts 与 sub/two 语义重组 */
  var x=d.parts[0],y=d.parts[1],z=d.parts.length>4?d.parts[4]:0;
  var want;
  if(d.two)want=x+y-z;
  else if(d.sub)want=y-x;
  else want=x+y;
  if(want!==d.ans)return "答案与算式不符("+want+"≠"+d.ans+")";
  /* 答案在 rods 档可表示：逐档分解每档 0-9 */
  var s=String(d.ans);
  while(s.length<d.rods)s="0"+s;
  if(s.length>d.rods)return "答案超出档位表示范围";
  for(var k=0;k<s.length;k++){
    var dv=+s.charAt(k);
    if(dv<0||dv>9)return "档值越界";
  }
  /* 上珠+下珠表示性：每档值 0-9 均可由 1 上珠(5) + 4 下珠(1) 表出 */
  return null;
}
/* 标准锚点用例（人工核对） */
function verifyAnchors(){
  /* 锚点1：珠状态→值（2 档：档0 上1下3=8、档1 上0下2=2 → 82） */
  if(beadsToValue([1,0],[3,2])!==82)return "锚点1 珠读数应 82";
  /* 锚点2：1 档上珠 = 5 */
  if(beadsToValue([1],[0])!==5)return "锚点2 上珠应 5";
  /* 锚点3：算式语义（生成器改写后 y-x=85：47+38=85） */
  var d={rods:2,parts:[47,85],sub:true,two:false,ans:38};
  var e=verifyLevelData(d);if(e)return "锚点3 "+e;
  /* 锚点4：两步算式 92+53-15=130（3 档） */
  var d2={rods:3,parts:[92,53,0,0,15],sub:false,two:true,ans:130};
  var e2=verifyLevelData(d2);if(e2)return "锚点4 "+e2;
  return null;
}
function selfCheck(){
  var err=verifyAnchors();
  for(var i=0;i<LEVELS.length;i++){
    var e=safeVerify(LEVELS[i],i);
    if(e&&!err)err="第 "+(i+1)+" 关 "+e;
  }
  if(err)say("数据校验告警："+err);
}
function safeVerify(seed,idx){
  try{
    var d=genLevel(seed,idx);
    return verifyLevelData(d);
  }catch(e){return "生成异常";}
}
/* ---------- 状态与渲染 ---------- */
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
var lv=save.lv,L=null,up=[],dn=[],cur=0,chances=3,done=false,hints=3;
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  var d=null;
  for(var t=0;t<3;t++){
    d=genLevel(LEVELS[lv]+t*9973,lv);
    if(!verifyLevelData(d))break;
    d=null;
  }
  if(!d){say("本关数据异常，已回退");if(lv>0){lv--;save.lv=Math.min(save.lv,lv);persist();loadLevel(lv);return;}return;}
  L=d;
  up=[];dn=[];
  for(var i=0;i<L.rods;i++){up.push(0);dn.push(0);}
  cur=0;chances=3;done=false;hints=3;
  $("lvTag").textContent="第 "+(lv+1)+" 关";
  $("lvRule").textContent=L.rods+" 档算盘";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  updStats();renderAbacus();paintQ();
  say("拨珠使读数等于算式结果；上珠一颗计 5、下珠一颗计 1");
}
function paintQ(){
  var x=L.parts[0],y=L.parts[1];
  var s=x+" "+(L.sub?"−":"+")+" "+y;
  if(L.two)s=x+" + "+y+" − "+L.parts[4];
  $("qtext").textContent=s+" = ?";
}
function bumpEl(el){if(window.__gRM||!el)return;el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}
function updStats(){
  var v=beadsToValue(up,dn),sv=$("stVal");
  if(sv.textContent!==String(v)){sv.textContent=v;bumpEl(sv)}
  var ch=$("stCh"),cv=String(Math.max(0,chances));
  if(ch.textContent!==cv){ch.textContent=cv;bumpEl(ch)}
  if(chances<=1)ch.classList.add("low");else ch.classList.remove("low");
}
function setOvBtn(text,icon){$("ovBtn").innerHTML=(icon?window.SW_ICON(icon):"")+text}
function renderAbacus(){
  var g=$("abacus");g.innerHTML="";
  for(var i=0;i<L.rods;i++){
    (function(i){
      var rod=document.createElement("div");
      rod.className="rod";
      rod.setAttribute("data-i",i);
      var rl=document.createElement("div");rl.className="rline";rl.setAttribute("aria-hidden","true");
      rod.appendChild(rl);
      var upz=document.createElement("div");upz.className="upzone";
      var ub=document.createElement("button");
      ub.className="bead";
      ub.setAttribute("data-t","up");
      ub.setAttribute("data-i",i);
      ub.setAttribute("aria-label","第 "+(L.rods-i)+" 档上珠");
      ub.innerHTML='<span class="bs" aria-hidden="true"></span>';
      ub.addEventListener("click",function(){toggleBead(i,1);});
      upz.appendChild(ub);
      rod.appendChild(upz);
      var beam=document.createElement("div");beam.className="beam";beam.setAttribute("aria-hidden","true");
      rod.appendChild(beam);
      var dnz=document.createElement("div");dnz.className="dnzone";
      for(var k=0;k<4;k++){
        (function(k){
          var db=document.createElement("button");
          db.className="bead";
          db.setAttribute("data-t","dn");
          db.setAttribute("data-i",i);
          db.setAttribute("aria-label","第 "+(L.rods-i)+" 档下珠"+(k+1));
          db.innerHTML='<span class="bs" aria-hidden="true"></span>';
          db.addEventListener("click",function(){toggleBead(i,-(k+1));});
          dnz.appendChild(db);
        })(k);
      }
      rod.appendChild(dnz);
      var lab=document.createElement("div");lab.className="rodlabel";lab.textContent="×"+Math.pow(10,L.rods-1-i);
      rod.appendChild(lab);
      g.appendChild(rod);
    })(i);
  }
  paintBeads();
}
function paintBeads(){
  var beads=$("abacus").querySelectorAll(".bead");
  for(var i=0;i<beads.length;i++){
    var t=beads[i].getAttribute("data-t"),ri=+beads[i].getAttribute("data-i");
    var act=t==="up"?(up[ri]===1):(dn[ri]>=parseInt(beads[i].getAttribute("aria-label").slice(-1),10));
    beads[i].className="bead"+(act?" active":"");
  }
  var rods=$("abacus").querySelectorAll(".rod");
  for(var r=0;r<rods.length;r++)rods[r].className="rod"+(L.rods-1-r===cur?" cur":"");
  updStats();
}
function toggleBead(i,mode){
  if(done)return;
  if(mode===1)up[i]=up[i]?0:1;
  else{
    var k=-mode;
    dn[i]=(dn[i]===k)?k-1:k;
    if(dn[i]<0)dn[i]=k===1?4:k-1;
  }
  cur=i;
  paintBeads();
}
function setRod(i,v){
  if(done||v<0||v>9)return;
  up[i]=v>=5?1:0;
  dn[i]=v>=5?v-5:v;
  cur=i;
  paintBeads();
}
function clearAll(){
  if(done)return;
  for(var i=0;i<L.rods;i++){up[i]=0;dn[i]=0;}
  paintBeads();
}
function confirmVal(){
  if(done)return;
  var v=beadsToValue(up,dn);
  if(v===L.ans){winLevel();return;}
  chances--;updStats();
  if(chances<=0){failLevel("读数不对，机会用完了");return;}
  say("读数 "+v+" 不等于算式结果，还剩 "+chances+" 次机会");
}
function hint(){
  if(done||hints<=0)return;
  var s=String(L.ans);
  while(s.length<L.rods)s="0"+s;
  var pos=L.rods-1-cur;
  setRod(cur,+s.charAt(L.rods-1-cur));
  hints--;
  say("已把当前档（×"+Math.pow(10,pos)+"）拨到 "+s.charAt(L.rods-1-cur));
}
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:3-Math.max(0,chances)}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"过关！";
  $("ovDesc").innerHTML="拨珠 "+beadsToValue(up,dn)+" 正确 · 剩余机会 "+chances+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  setOvBtn((lv>=LEVELS.length-1)?"回到第 1 关":"下一关",(lv>=LEVELS.length-1)?"rotate":"arrow-right");
  $("overlay").classList.add("show");
}
function failLevel(reason){
  done=true;updStats();
  $("ovTitle").textContent="挑战失败";
  $("ovDesc").textContent=reason+"。重开本关再来，提示键可以帮你拨对一档。";
  setOvBtn("重开本关","rotate");
  $("overlay").classList.add("show");
}
/* ---------- 键盘 ---------- */
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"){cur=(cur+1)%L.rods;paintBeads();e.preventDefault();}
  else if(k==="ArrowRight"){cur=(cur+L.rods-1)%L.rods;paintBeads();e.preventDefault();}
  else if(k>="0"&&k<="9"){setRod(cur,+k);e.preventDefault();}
  else if(k==="Enter"||k===" "){
    if($("overlay").classList.contains("show")){$("ovBtn").click();e.preventDefault();return;}
    if(!done)confirmVal();
    e.preventDefault();
  }
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置");}
  else if(k==="l"||k==="L"){if(!done)openLevelSelect();}
});
$("btnOk").addEventListener("click",confirmVal);
$("btnZero").addEventListener("click",clearAll);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置");});
$("btnLv").addEventListener("click",function(){if(!done)openLevelSelect();});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0);}
    else{lv++;save.lv=Math.max(save.lv,lv);persist();loadLevel(lv);}
  }else loadLevel(lv);
});
/* ---------- 启动 ---------- */
loadLevel(save.lv);
selfCheck();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

/* 按钮图标注入（内联 SVG，零外链）：工具钮 / 主 CTA / 图例 */

})();
