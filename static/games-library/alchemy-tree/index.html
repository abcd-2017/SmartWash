  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */

<script>

(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}

try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
/* ========== 关卡生成器 + 独立验证器（纯逻辑，无 DOM 依赖） ========== */
(function(){
"use strict";
var BASE_N=5;
var EL_NAMES=["水","火","土","风","金","蒸汽","泥","岩浆","能量","雾","植物","温泉","晶石","生命","贤者之石"];
var RECIPES=[[0,1,5],[0,2,6],[1,2,7],[1,3,8],[0,3,9],[6,8,10],[2,5,11],[7,8,12],[10,11,13],[12,13,14]];
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,rnd){for(var i=a.length-1;i>0;i--){var j=(rnd()*(i+1))|0;var t=a[i];a[i]=a[j];a[j]=t;}return a}
function mkey(m){return m.slice().sort(function(a,b){return a-b}).join(",")}
function mcount(m,id){var c=0;for(var i=0;i<m.length;i++)if(m[i]===id)c++;return c}
/* 独立求解器：多重集 BFS。应用配方（消耗两枚产一枚），求最少合成步数与首跳 */
function fuseBFS(stock,recipes,target){
  if(stock.indexOf(target)>=0)return {par:0,first:null};
  var key0=mkey(stock),seen={};seen[key0]={d:0,prev:null,move:null};
  var q=[stock.slice()],nodes=0;
  while(q.length&&nodes<80000){
    var m=q.shift(),info=seen[mkey(m)],d=info.d;
    if(d>26)continue;
    for(var ri=0;ri<recipes.length;ri++){
      var r=recipes[ri],a=r[0],b=r[1],c=r[2];
      if(mcount(m,a)<1)continue;
      if(a===b){if(mcount(m,a)<2)continue;}else if(mcount(m,b)<1)continue;
      var nm=m.slice();
      nm.splice(nm.indexOf(a),1);
      nm.splice(nm.indexOf(b),1);
      nm.push(c);
      var nk=mkey(nm);
      if(seen[nk])continue;
      seen[nk]={d:d+1,prev:mkey(m),move:[a,b,c]};
      if(nm.indexOf(target)>=0){
        var cur=nk,first=null;
        while(cur&&seen[cur].prev){first=seen[cur].move;cur=seen[cur].prev;}
        return {par:d+1,first:first};
      }
      q.push(nm);nodes++;
    }
  }
  return {par:0,first:null};
}
/* 由目标反推配方闭包与基础元素需求 */
function needsTree(t,acc){
  for(var i=0;i<RECIPES.length;i++){
    var r=RECIPES[i];
    if(r[2]===t){needsTree(r[0],acc);needsTree(r[1],acc);acc.recs[i]=1;return;}
  }
  acc.stock.push(t);
}
function genLevel(rnd,target,nRec,nStock){
  var acc={recs:{},stock:[]};
  needsTree(target,acc);
  var recList=Object.keys(acc.recs).map(Number);
  var cand=[];
  for(var i=0;i<RECIPES.length;i++)if(!acc.recs[i])cand.push(i);
  shuffle(cand,rnd);
  for(var d2=0;d2<nRec&&d2<cand.length;d2++)recList.push(cand[d2]);
  recList.sort(function(a,b){return a-b});
  var stock=acc.stock.slice();
  nStock=Math.max(0,Math.min(nStock,12-stock.length));
  for(var s=0;s<nStock;s++)stock.push((rnd()*BASE_N)|0);
  shuffle(stock,rnd);
  var recipes=recList.map(function(i){return RECIPES[i].slice()});
  return {recipes:recipes,stock:stock};
}
function genLevels(){
  var rnd=mulberry(20261120);
  var T1=[5,6,7,8,9],T2=[10,11,12],T3=[13,14];
  var out=[];
  for(var i=0;i<40;i++){
    var pool,rec,sk;
    if(i<14){pool=T1;rec=(i/5)|0;sk=Math.min(2,(i/6)|0);}
    else if(i<27){pool=T2;rec=1+((i-14)/7|0);sk=1+((i-14)/5|0);}
    else{pool=(i>=35)?T3:T3.slice(0,1);rec=2+((i-27)/7|0);sk=2+((i-27)/5|0);}
    var target=pool[(rnd()*pool.length)|0];
    var gl=genLevel(rnd,target,rec,sk);
    var v=fuseBFS(gl.stock,gl.recipes,target);
    if(!(v.par>0)){i--;continue;}   // 验证器兜底：理论不会发生（按闭包构造），保险起见重摇
    out.push({name:"合成·"+(i+1<10?"0":"")+(i+1),target:target,stock:gl.stock,recipes:gl.recipes,par:v.par,difficulty:Math.min(6,1+((i/7)|0))});
  }
  return out;
}
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim()||d.name.length>24)return false;
  if(!Number.isInteger(d.target)||d.target<5||d.target>=EL_NAMES.length)return false;
  if(!Array.isArray(d.stock)||d.stock.length<2||d.stock.length>12)return false;
  for(var i=0;i<d.stock.length;i++){if(!Number.isInteger(d.stock[i])||d.stock[i]<0||d.stock[i]>=BASE_N)return false;}
  if(!Array.isArray(d.recipes)||!d.recipes.length||d.recipes.length>RECIPES.length)return false;
  var seen={};
  for(var j=0;j<d.recipes.length;j++){
    var r=d.recipes[j];
    if(!Array.isArray(r)||r.length!==3)return false;
    var ok=false;
    for(var k=0;k<RECIPES.length;k++){if(RECIPES[k][0]===r[0]&&RECIPES[k][1]===r[1]&&RECIPES[k][2]===r[2]){ok=true;break;}}
    if(!ok)return false;   // 只允许内置配方表条目
    var key=r[0]+","+r[1];
    if(seen[key])return false;seen[key]=1;
  }
  return true;
}
function normalizeLevel(d){
  var v=fuseBFS(d.stock,d.recipes,d.target);
  var diff=Number.isInteger(d.difficulty)?Math.min(9,Math.max(1,d.difficulty)):3;
  return {name:String(d.name),target:d.target,stock:d.stock.slice(),recipes:d.recipes.map(function(r){return r.slice()}),par:v.par,difficulty:diff};
}
window.__AG={EL_NAMES:EL_NAMES,RECIPES:RECIPES,BASE_N:BASE_N,genLevels:genLevels,fuseBFS:fuseBFS,validLevelData:validLevelData,normalizeLevel:normalizeLevel};
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 关卡数据（DB 下发优先，本地缓存兜底，包内生成器产默认关） ========== */
var AG=window.__AG,GAME_KEY="alchemy-tree",SAVE_KEY="sw.alchemytree.v1";
var LEVELS=AG.genLevels();
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i],d;
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!AG.validLevelData(d))return null;                 // 结构非法整批放弃
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    var n=AG.normalizeLevel(d);
    if(!(n.par>0))continue;                               // 验证器判无解：该关不进关卡表
    list.push(n);
  }
  return list.length?list:null;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(AG.validLevelData)){
      LEVELS=list.map(AG.normalizeLevel).filter(function(x){return x.par>0});
      if(LEVELS.length)return v;
      LEVELS=AG.genLevels();
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用包内默认关
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,stock=[],recipes=[],target=0;
var sel=-1,history=[],moves=0,done=false,hintMove=null,hintT=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=340;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* 加载关卡（含验证器复核） */
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!AG.validLevelData(L)){say("关卡数据异常");return;}
  var v=AG.fuseBFS(L.stock,L.recipes,L.target);   // 加载复核：可解性 + 最优步数
  stock=L.stock.slice();recipes=L.recipes;target=L.target;
  sel=-1;history=[];moves=0;done=false;hintMove=null;
  $("lvTag").textContent="第 "+(lv+1)+" 关";
  $("lvRule").textContent=L.name+" · 目标 "+AG.EL_NAMES[target]+" · 配方 "+recipes.length+" 条";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stPar").textContent=v.par>0?v.par:"-";
  if(!(v.par>0))say("警告：验证器判定本关无法合成目标（数据异常）");
  else say("点两个元素尝试合成，凑出「"+AG.EL_NAMES[target]+"」即过关");
  updStats();resize();
}
function updStats(){
  $("stMoves").textContent=moves;
  $("btnUndo").disabled=!history.length||done;
}
/* ---------- 合成（主逻辑：与 fuseBFS 验证器相互独立） ---------- */
function findRecipe(a,b){
  for(var i=0;i<recipes.length;i++){
    var r=recipes[i];
    if(r[0]===a&&r[1]===b)return r;
    if(r[0]===b&&r[1]===a)return r;
  }
  return null;
}
function fuse(i,j){
  var a=stock[i],b=stock[j];
  var r=findRecipe(a,b);
  if(!r){say(AG.EL_NAMES[a]+" + "+AG.EL_NAMES[b]+"：没有这个配方");sel=-1;return;}
  history.push(stock.slice());
  stock.splice(Math.max(i,j),1);stock.splice(Math.min(i,j),1);
  stock.push(r[2]);
  sel=-1;moves=history.length;hintMove=null;
  updStats();
  say(AG.EL_NAMES[a]+" + "+AG.EL_NAMES[b]+" → "+AG.EL_NAMES[r[2]]);
  if(r[2]===target){winLevel();return;}
  if(stock.indexOf(target)>=0){winLevel();return;}
}
function tapChip(i){
  if(done)return;
  if(sel===i){sel=-1;return;}
  if(sel<0){sel=i;say("已选中「"+AG.EL_NAMES[stock[i]]+"」，再点一枚合成");return;}
  fuse(sel,i);
}
function undo(){
  if(!history.length||done)return;
  stock=history.pop();moves=history.length;sel=-1;hintMove=null;
  say("已撤销一步");updStats();
}
function hint(){
  if(done)return;
  var v=AG.fuseBFS(stock,recipes,target);
  if(!(v.par>0)){say("验证器：当前库存已无法合成目标，撤销几步吧");return;}
  hintMove=v.first;hintT=Date.now();
  if(!v.first){say("目标已经在库里了！");return;}
  say("建议："+AG.EL_NAMES[v.first[0]]+" + "+AG.EL_NAMES[v.first[1]]+" → "+AG.EL_NAMES[v.first[2]]+"（还需 "+v.par+" 步）");
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:moves}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部合成完成！":"过关！";
  $("ovDesc").innerHTML="用 "+moves+" 次合成凑出「"+AG.EL_NAMES[target]+"」（参考最优 "+$("stPar").textContent+"）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),primary:v("--g-primary"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),
    e1:v("--g-st-e1"),e2:v("--g-st-e2"),e3:v("--g-st-e3"),e4:v("--g-st-e4"),e5:v("--g-st-e5"),e6:v("--g-st-e6")};
}
window.__gOnTheme=function(){palLoad()};//App 推送主题时刷新调色板，rAF 自动重绘
/* ---------- 绘制 ---------- */
var chipPos=[];
function elColor(id){
  return [PAL.e1,PAL.e2,PAL.e3,PAL.e4,PAL.e5,PAL.e6][id%6];
}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);
  var rows=Math.max(1,Math.ceil(stock.length/4));
  H=76+rows*86;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  chipPos=[];
  for(var i=0;i<stock.length;i++){
    var col=i%4,row=(i/4)|0;
    chipPos.push({x:W/4*(col+0.5),y:96+row*86});
  }
}
function rr(x,y,w2,h2,r){
  r=Math.min(r,w2/2,h2/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);
  ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();
}
function drawChip(x,y,r,txt,color,sel2,pulse){
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
  // 元素名：surface 徽章底 + text 字色（深浅模式均达标，chip 素材色保留）
  ctx.font=txt.length>2?"700 12px sans-serif":"700 14px sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  var tw=ctx.measureText(txt).width;
  ctx.fillStyle=PAL.surface;
  rr(x-tw/2-5,y-8,tw+10,16,8);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(x-tw/2-5,y-8,tw+10,16,8);ctx.stroke();
  ctx.fillStyle=PAL.text;
  ctx.fillText(txt,x,y+1);
  if(sel2){
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,y,r+4,0,7);ctx.stroke();
  }
  if(pulse){
    var a=0.5+0.5*Math.sin((Date.now()-hintT)/180);
    ctx.strokeStyle=PAL.warning;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,y,r+4+a*3,0,7);ctx.stroke();
  }
}
function draw(){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  //目标条
  ctx.fillStyle=PAL.surface2;
  rr(8,10,W-16,48,10);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(8,10,W-16,48,10);ctx.stroke();
  ctx.fillStyle=PAL.muted;
  ctx.font="600 14px sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText("目标",22,34);
  var tw=AG.EL_NAMES[target].length>2?58:46;
  drawChip(30+tw+20,34,20,AG.EL_NAMES[target],elColor(target),false,false);
  ctx.fillStyle=PAL.text;
  ctx.font="600 14px sans-serif";ctx.textAlign="right";
  ctx.fillText("库存 "+stock.length+" 枚",W-20,34);
  //元素棋子
  for(var i=0;i<stock.length;i++){
    var p=chipPos[i];
    var hl=hintMove&&stock[i]===hintMove[0]&&hintMove.indexOf(stock[i])>=0&&i===stock.indexOf(hintMove[0]);
    var hl2=hintMove&&(i===lastIdx(hintMove[0])||i===lastIdx(hintMove[1]));
    drawChip(p.x,p.y,32,AG.EL_NAMES[stock[i]],elColor(stock[i]),sel===i,hl2&&Date.now()-hintT<2600);
  }
}
function lastIdx(id){return stock.lastIndexOf(id)}
var rafId=0;
function loop(){draw(performance.now());rafId=requestAnimationFrame(loop)}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  if(done)return;
  var best=-1,bd=1e9;
  for(var i=0;i<chipPos.length;i++){
    var d=Math.hypot(chipPos[i].x-x,chipPos[i].y-y);
    if(d<40&&d<bd){bd=d;best=i;}
  }
  if(best>=0)tapChip(best);
});
cv.addEventListener("pointercancel",function(){});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="9"){var i=parseInt(k,10)-1;if(i<stock.length)tapChip(i);e.preventDefault();}
  else if(k==="0"){if(stock.length>=10)tapChip(9);e.preventDefault();}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
  else if(k===" "||k==="Enter"){if($("overlay").classList.contains("show"))$("ovBtn").click();e.preventDefault();}
});
window.addEventListener("resize",resize);
document.addEventListener("visibilitychange",function(){
  if(document.hidden){ if(rafId){cancelAnimationFrame(rafId);rafId=0} }
  else{ if(!rafId){ rafId=requestAnimationFrame(loop) } resize() }
});
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);resize();loop();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
