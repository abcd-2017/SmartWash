<script>
/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 调色板（颜色全部经 CSS 变量读取，JS 零颜色字面量） ========== */
var PAL={};
/* 同色相明度推拉：t>0 向恒白提亮、t<0 向恒黑压暗（只由 PAL 色值派生，无新色相） */
function sh(c,t){
  var s=String(c).trim(),m=s.match(/^#([0-9a-f]{3,6})$/i),r,g,b;
  if(m){var h=m[1];if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    r=parseInt(h.slice(0,2),16);g=parseInt(h.slice(2,4),16);b=parseInt(h.slice(4,6),16);}
  else{var p=s.match(/\d+/g);r=+p[0];g=+p[1];b=+p[2];}
  var k=t<0?-t:t;
  if(t<0){r*=1-k;g*=1-k;b*=1-k;}else{r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k;}
  return "rgb("+Math.round(r)+","+Math.round(g)+","+Math.round(b)+")";
}
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim();}
  PAL={surface:v("--g-surface"),surface2:v("--g-surface2"),text:v("--g-text"),muted:v("--g-muted"),
    border:v("--g-border"),primary:v("--g-primary"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),
    sky:v("--g-am-sky"),ground:v("--g-am-ground"),wood:v("--g-am-wood"),hero:v("--g-am-hero")};
  var dark=document.documentElement.dataset.theme==="dark";
  PAL.skyHi=sh(PAL.sky,.4);PAL.skyLo=sh(PAL.sky,-.22);
  PAL.cloud=sh(PAL.sky,dark?.1:.5);PAL.hill1=sh(PAL.primary,.55);PAL.hill2=sh(PAL.primary,.2);
  PAL.gndHi=sh(PAL.ground,.24);PAL.gndLo=sh(PAL.ground,-.24);PAL.soil=sh(PAL.ground,-.48);
  PAL.woodHi=sh(PAL.wood,.26);PAL.woodLo=sh(PAL.wood,-.28);
  PAL.heroHi=sh(PAL.hero,.34);PAL.heroLo=sh(PAL.hero,-.32);
  PAL.skin=sh(PAL.warning,.58);PAL.metal=sh(PAL.text,.72);
  PAL.warnHi=sh(PAL.warning,.3);PAL.warnLo=sh(PAL.warning,-.24);
  PAL.dangHi=sh(PAL.danger,.32);PAL.dangLo=sh(PAL.danger,-.24);
  PAL.ringA=dark?sh(PAL.surface,.45):PAL.surface;PAL.ringALo=sh(PAL.ringA,-.14);
}
window.__gOnTheme=function(){palLoad();if(typeof draw==="function")draw();};
palLoad();

/* ========== 通用工具与覆盖层面板 ========== */
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
var overlayEl=$("overlay"),panelEl=$("panel");
function showPanel(html){panelEl.innerHTML=html;overlayEl.classList.add("show");}
function hideOverlay(){overlayEl.classList.remove("show");}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}

/* ==================== 移靶射箭（移动靶 + 风向修正，关卡驱动） ==================== */
var GAME_KEY="archery-move",SAVE_KEY="sw.archerymove.v1";
var LEVELS_KEY="sw.archerymove.v1.levels",LEVELS_VER_KEY="sw.archerymove.v1.levels.ver";

/*XC-CORE-BEGIN*/
var GEN={};
function amSeed(no){return no*7669+7043;}
function amRng(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var AM_X0=60,AM_Y0=380,AM_VX=320,AM_G=520,AM_PLANE=330,AM_MID=200;
/* 弹道闭式解：x(t)=x0+vx*t+w/2*t^2，求到达靶面的时间与落点 */
GEN.flight=function(w,charge){
  var vy0=-80-charge*380;
  var a=w/2,b=AM_VX,c=AM_X0-AM_PLANE;
  var t;
  if(Math.abs(w)<0.01){t=-c/b;}
  else{
    var disc=b*b-4*a*c;
    if(disc<0)return null;
    var r1=(-b+Math.sqrt(disc))/(2*a),r2=(-b-Math.sqrt(disc))/(2*a);
    t=r1>0?r1:r2;
    if(t<=0)return null;
  }
  var y=AM_Y0+vy0*t+AM_G/2*t*t;
  return {t:t,y:y};
};
GEN.ringOf=function(off){
  var d=Math.abs(off);
  if(d<=13)return 10;
  if(d<=28)return 8;
  if(d<=45)return 6;
  if(d<=64)return 4;
  return 0;
};
/* 独立求解：枚举蓄力 × 出手时刻，验证每支箭都存在 ≥8 环的解并定标目标分 */
GEN.arrowMax=function(lv,windIdx){
  var wind=lv.winds[windIdx];
  var best=0;
  for(var c=0.4;c<=1.001;c+=0.04){
    for(var rt=0;rt<=2.6*Math.PI/lv.om;rt+=0.03){
      var fl=GEN.flight(wind,c);
      if(!fl)continue;
      var ty=AM_MID+lv.range*Math.sin(lv.om*(rt+fl.t)+lv.ph);
      var sc=GEN.ringOf(fl.y-ty);
      if(sc>best)best=sc;
      if(best===10)return best;
    }
  }
  return best;
};
GEN.gen=function(no,seed){
  var p=(no-1)/39;
  var range=90+p*60;
  var om=1.1+p*0.9;
  var wbase=30+p*110;
  var s=(seed==null?amSeed(no):seed);
  for(var att=0;att<60;att++){
    var rng=amRng(s+att*7919);
    var winds=[],i;
    for(i=0;i<5;i++)winds.push(Math.round((rng()<0.5?-1:1)*(wbase+rng()*20)));
    var lv={name:"射箭·"+(no<10?"0"+no:no),no:no,seed:s+att*7919,
      range:Math.round(range),om:Math.round(om*100)/100,ph:rng()*6.28,winds:winds};
    var sum=0,minRing=10;
    for(i=0;i<5;i++){
      var m=GEN.arrowMax(lv,i);
      sum+=m;if(m<minRing)minRing=m;
    }
    var need=Math.max(18,Math.min(40,Math.round(0.66*sum)));
    lv.need=need;
    if(minRing>=8&&need<=Math.round(0.7*sum)&&GEN.validate(lv).ok)return lv;
  }
  return {name:"射箭·01",no:no,seed:s,range:90,om:1.1,ph:1.0,winds:[40,-40,40,-40,40],need:18};
};
/* 独立验证器：每支箭在风场下均存在 ≥8 环解；目标分 ≤ 可达上限的 70% */
GEN.validate=function(lv){
  if(!lv||typeof lv!=="object")return{ok:false,why:"shape"};
  if(!(lv.range>=90&&lv.range<=150))return{ok:false,why:"range"};
  if(!(lv.om>=1.1&&lv.om<=2.0))return{ok:false,why:"om"};
  if(!Array.isArray(lv.winds)||lv.winds.length!==5)return{ok:false,why:"winds"};
  for(var i=0;i<5;i++)if(!(Math.abs(lv.winds[i])>=30&&Math.abs(lv.winds[i])<=160))return{ok:false,why:"wind"+i};
  if(!(Number.isInteger(lv.need)&&lv.need>=18&&lv.need<=40))return{ok:false,why:"need"};
  var sum=0;
  for(i=0;i<5;i++){
    var m=GEN.arrowMax(lv,i);
    if(m<8)return{ok:false,why:"arrow"+i+"="+m};
    sum+=m;
  }
  if(lv.need>Math.round(0.7*sum))return{ok:false,why:"need-tight"};
  return{ok:true,why:"",sum:sum};
};
GEN.validateLevelsAll=function(){
  var fails=[],n=0;
  for(var no=1;no<=40;no++){
    var lv=GEN.gen(no,amSeed(no));
    var r=GEN.validate(lv);
    if(!r.ok)fails.push(no+"("+r.why+")");
    n++;
  }
  return {total:n,fails:fails,allOk:fails.length===0};
};
globalThis.__XC=GEN;

/* ---------- 默认关卡（确定性种子，40 关） ---------- */
var DEFAULT_LEVELS=[];
(function(){
  for(var no=1;no<=40;no++)DEFAULT_LEVELS.push({name:"射箭·"+(no<10?"0"+no:no),no:no,seed:amSeed(no),difficulty:Math.min(6,1+Math.floor((no-1)/7))});
})();
var LEVELS=DEFAULT_LEVELS;
var save=loadSaveData();
var cur=Math.min(save.lv,LEVELS.length-1);

/* ---------- 状态 ---------- */
var course=null,state="ready",paused=false;
var T=0,arrowNo=0,score=0,charge=0,charging=false;
var arrow=null,stick=[],nextT=0;
var stLv=$("stLv"),stScore=$("stScore"),stNeed=$("stNeed"),msgEl=$("msg");
var btnRetry=$("btnRetry"),btnLevels=$("btnLevels");
function say(t){msgEl.textContent=t;}
function totalStars(){var t=0,k;for(k in save.done)t+=save.done[k];return t;}
function refresh(){

}

/* ---------- 画布 ---------- */
var NW=390,NH=460,W=390,H=460,S=1,offX=0,offY=0;
var cv=$("cv"),ctx=cv.getContext("2d");
function rr(x0,y0,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x0+r,y0);
  ctx.arcTo(x0+w,y0,x0+w,y0+h,r);ctx.arcTo(x0+w,y0+h,x0,y0+h,r);
  ctx.arcTo(x0,y0+h,x0,y0,r);ctx.arcTo(x0,y0,x0+w,y0,r);
  ctx.closePath();
}
function fit(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));H=Math.max(300,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);offX=(W-NW*S)/2;offY=(H-NH*S)/2;
  draw();
}
window.addEventListener("resize",fit);

/* ---------- 关卡流程 ---------- */
function loadLevel(idx){
  idx=Math.max(0,Math.min(idx,LEVELS.length-1));
  cur=idx;
  var d=LEVELS[idx];
  course=GEN.gen(d.no,d.seed==null?amSeed(d.no):d.seed);
  var chk=GEN.validate(course);
  if(!chk.ok)course=GEN.gen(d.no,amSeed(d.no));
  state="ready";paused=false;
  T=0;arrowNo=0;score=0;charge=0;charging=false;arrow=null;stick=[];nextT=0;
  refresh();
}
function enterLevel(i){loadLevel(i);showStart();}
function startPlay(){
  state="running";paused=false;
  hideOverlay();
  say("按住蓄力，松手放箭 · 共 5 支");
}
function selectClosed(){showStart();}
function press(){
  if(state!=="running"||paused)return;
  if(arrow||nextT>0)return;
  charging=true;charge=0;
}
function releaseArrow(){
  if(!charging||state!=="running"||paused)return;
  charging=false;
  var wind=course.winds[arrowNo];
  var fl=GEN.flight(wind,charge);
  if(!fl){say("这箭飞不出去了");arrowNo++;checkDone();return;}
  arrow={t:0,ts:fl.t,yImp:fl.y,wind:wind,vy0:-80-charge*380,tRel:T};
  charge=0;
}
function checkDone(){
  if(arrowNo>=5){
    state="over";
    var win=score>=course.need;
    var stars=win?(score>=course.need+10?3:2):1;
    if(win){
      var old=parseInt(save.done[cur],10)||0;
      if(stars>old)save.done[cur]=stars;
      save.best=totalStars();
      if(cur+1>save.lv)save.lv=cur+1;
      persistSave();
      if(GB.available)GB.reportScore(GAME_KEY,{metricValue:save.lv,metricExtra:save.best}).catch(function(){});
    }
    refresh();
    if(win)showWin(stars);else showFail();
  }
}
function stepGame(dt){
  T+=dt;
  if(charging)charge=Math.min(1,charge+dt/0.7);
  if(nextT>0){
    nextT-=dt;
    if(nextT<=0&&arrowNo<5)say("第 "+(arrowNo+1)+" 支 · 按住蓄力");
    return;
  }
  if(arrow){
    arrow.t+=dt;
    if(arrow.t>=arrow.ts){
      var ty=AM_MID+course.range*Math.sin(course.om*(arrow.tRel+arrow.ts)+course.ph);
      var sc=GEN.ringOf(arrow.yImp-ty);
      score+=sc;
      stick.push({x:AM_PLANE,y:arrow.yImp,sc:sc});
      say(sc>0?"中 "+sc+" 环！":"脱靶 · 落点偏 "+Math.round(arrow.yImp-ty)+"px");
      arrow=null;
      arrowNo++;
      refresh();
      nextT=0.55;
      checkDone();
    }
  }
}

/* ---------- 绘制 ---------- */
var GROUND_Y=414,fxT=0,fxLast=0,fxPulses=[],fxFloats=[],fxStickLen=0,fxScore=-1;
function sysFont(){return'-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';}
/* 天空（背景层） */
function drawSky(){
  var g=ctx.createLinearGradient(0,0,0,GROUND_Y);
  g.addColorStop(0,PAL.skyHi);g.addColorStop(.55,PAL.sky);g.addColorStop(1,PAL.skyLo);

  ctx.fillStyle=PAL.hill2;ctx.beginPath();ctx.moveTo(150,GROUND_Y);ctx.quadraticCurveTo(260,332,390,GROUND_Y);ctx.closePath();ctx.fill();
  cloud(64,58,1);
}
function cloud(x,y,s){
  ctx.globalAlpha=.8;ctx.fillStyle=PAL.cloud;ctx.beginPath();
  ctx.ellipse(x,y,24*s,10*s,0,0,7);ctx.ellipse(x+16*s,y+3*s,16*s,7*s,0,0,7);ctx.fill();ctx.globalAlpha=1;
}
/* 地面（地面层） */
function drawGround(){
  var g=ctx.createLinearGradient(0,GROUND_Y,0,NH);

  for(var i=0;i<16;i++){var x=10+i*24;ctx.beginPath();ctx.moveTo(x,GROUND_Y+12);ctx.lineTo(x+2.5,GROUND_Y+6);ctx.stroke();}
}
/* 滑轨（墙 / 支架层） */
function drawRail(){
  var x=AM_PLANE,g=ctx.createLinearGradient(x-3,0,x+3,0);
  g.addColorStop(0,PAL.woodLo);g.addColorStop(.5,PAL.wood);g.addColorStop(1,PAL.woodLo);

/* 靶：渐变环 + 顶光 + 投影 */
function ring(x,y,r,hi,lo){
  var g=ctx.createRadialGradient(x-r*.34,y-r*.38,r*.12,x,y,r*1.02);
  g.addColorStop(0,hi);g.addColorStop(1,lo);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
}
function drawTarget(ty){
  var x=AM_PLANE;
  ctx.save();ctx.shadowColor="rgba(0,0,0,.28)";ctx.shadowBlur=12;ctx.shadowOffsetY=4.8;
  ring(x,ty,64,PAL.ringA,PAL.ringALo);ctx.restore();
  ring(x,ty,45,PAL.warnHi,PAL.warnLo);ring(x,ty,28,PAL.dangHi,PAL.dangLo);
  ring(x,ty,13,PAL.ringA,PAL.ringALo);ring(x,ty,5,PAL.dangHi,PAL.dangLo);
  ctx.strokeStyle="rgba(0,0,0,.18)";ctx.lineWidth=1;
  for(var r=0;r<3;r++){ctx.beginPath();ctx.arc(x,ty,[45,28,13][r],0,7);ctx.stroke();}
  ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=2.5;

}
/* 中箭：箭杆 + 箭羽 */
function drawStuck(){
  for(var i=0;i<stick.length;i++){
    var s=stick[i],x=s.x,y=s.y;
    ctx.strokeStyle=PAL.wood;ctx.lineWidth=2.6;ctx.lineCap="round";

    ctx.fillStyle=PAL.dangHi;ctx.beginPath();ctx.moveTo(x-22,y-6);ctx.lineTo(x-15,y-11);ctx.lineTo(x-14,y-4);ctx.closePath();ctx.fill();
  }
}
/* 飞行中的箭：箭杆 + 箭头 + 箭羽 */
function drawArrow(){
  if(!arrow)return;
  var t=Math.min(arrow.t,arrow.ts);
  var ax=AM_X0+AM_VX*t+.5*arrow.wind*t*t,ay=AM_Y0+arrow.vy0*t+AM_G/2*t*t;
  var vx=AM_VX+arrow.wind*t,vy=arrow.vy0+AM_G*t,L=30,vd=Math.hypot(vx,vy),ux=vx/vd,uy=vy/vd;
  /* 轨迹拖尾 */
  var tg=ctx.createLinearGradient(ax-ux*24,ay-uy*24,ax-ux*8,ay-uy*8);
  tg.addColorStop(0,"rgba(255,255,255,0)");tg.addColorStop(1,sh(PAL.hero,.4));
  ctx.strokeStyle=tg;ctx.lineWidth=2.6;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(ax-ux*24,ay-uy*24);ctx.lineTo(ax-ux*8,ay-uy*8);ctx.stroke();
  ctx.strokeStyle=PAL.wood;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(ax-ux*L,ay-uy*L);ctx.lineTo(ax,ay);ctx.stroke();
  ctx.fillStyle=PAL.metal;ctx.beginPath();
  ctx.moveTo(ax+ux*7,ay+uy*7);ctx.lineTo(ax-ux*2-uy*4.5,ay-uy*2+ux*4.5);ctx.lineTo(ax-ux*2+uy*4.5,ay-uy*2-ux*4.5);ctx.closePath();ctx.fill();
  ctx.fillStyle=PAL.dangHi;ctx.beginPath();
  ctx.moveTo(ax-ux*L,ay-uy*L);ctx.lineTo(ax-ux*(L-6)-uy*5,ay-uy*(L-6)+ux*5);ctx.lineTo(ax-ux*(L-9),ay-uy*(L-9));ctx.closePath();ctx.fill();
}
/* 弓手：矢量角色（渐变 + 高光 + 落地投影），替代旧版细线圆弧 */
function drawArcher(){
  var pull=charging?charge*14:0,bx=70,by=AM_Y0;
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.18)";ctx.beginPath();ctx.ellipse(52,GROUND_Y+2,26,5,0,0,7);ctx.fill();
  ctx.fillStyle=PAL.heroLo;rr(38,394,8,20,3);ctx.fill();rr(50,394,8,20,3);ctx.fill();
  var bg=ctx.createLinearGradient(0,366,0,398);
  bg.addColorStop(0,PAL.heroHi);bg.addColorStop(1,PAL.heroLo);
  ctx.fillStyle=bg;rr(36,366,26,32,8);ctx.fill();
  ctx.strokeStyle=PAL.skin;ctx.lineWidth=4;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(54,378);ctx.lineTo(88,380);ctx.stroke();
  ctx.beginPath();ctx.moveTo(50,384);ctx.lineTo(bx-pull,by);ctx.stroke();
  ctx.fillStyle=PAL.skin;ctx.beginPath();ctx.arc(48,356,8.5,0,7);ctx.fill();
  ctx.fillStyle=PAL.heroLo;ctx.beginPath();ctx.arc(48,354,9.2,Math.PI*.92,Math.PI*2.08);ctx.closePath();ctx.fill();
  ctx.lineCap="round";
  var bgr=ctx.createLinearGradient(57,360,92,382);
  bgr.addColorStop(0,PAL.woodHi);bgr.addColorStop(.5,PAL.wood);bgr.addColorStop(1,PAL.woodLo);
  ctx.strokeStyle=bgr;ctx.lineWidth=4.5;ctx.beginPath();ctx.arc(bx,by,22,-1.5,1.5);ctx.stroke();
  var t1x=bx+22*Math.cos(1.5),t1y=by-22*Math.sin(1.5);

  ctx.beginPath();ctx.moveTo(t1x,t1y);ctx.lineTo(bx-pull,by);ctx.lineTo(t1x,by+22*Math.sin(1.5));ctx.stroke();
  ctx.restore();

/* 蓄力条：轨道 + 品牌绿渐变 + 满力描边 */
function drawCharge(){
  if(!charging&&charge<=0)return;
  var p=charge,x=26,y=292,w=128,h=16;
  ctx.fillStyle=PAL.surface2;rr(x,y,w,h,8);ctx.fill();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.border;rr(x+.5,y+.5,w-1,h-1,8);ctx.stroke();
  var fg=ctx.createLinearGradient(x,0,x+w,0);
  fg.addColorStop(0,PAL.primary);fg.addColorStop(1,PAL.deep);
  ctx.fillStyle=fg;rr(x+2,y+2,Math.max(4,(w-4)*p),h-4,6);ctx.fill();

  ctx.textAlign="left";ctx.textBaseline="alphabetic";ctx.fillText("蓄力",x,y-6);
}
/* HUD：风向 + 箭数 chip（矢量箭头） */
function drawHud(){
  var wind=course.winds[Math.min(arrowNo,4)],cw=126,ch=30,cx=NW-cw-10,cy=10;
  ctx.fillStyle=PAL.surface;rr(cx,cy,cw,ch,10);ctx.fill();
  var dir=wind>0?1:-1,ay=cy+ch/2,hx=cx+cw-16;
  ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(hx-dir*22,ay);ctx.lineTo(hx-dir*8,ay);ctx.stroke();
  ctx.fillStyle=PAL.deep;ctx.beginPath();
  ctx.moveTo(hx+dir*5,ay);ctx.lineTo(hx-dir*3,ay-4.5);ctx.lineTo(hx-dir*3,ay+4.5);ctx.closePath();ctx.fill();
  ctx.fillStyle=PAL.text;ctx.font="700 12px "+sysFont();
  ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText((wind>0?"顺风 ":"逆风 ")+Math.abs(wind),cx+12,ay+.5);
  ctx.fillStyle=PAL.surface;rr(10,10,96,ch,10);ctx.fill();
  ctx.fillStyle=PAL.text;ctx.font="700 12px "+sysFont();ctx.textAlign="left";
  ctx.fillText("箭 "+Math.min(arrowNo+(arrow||nextT>0?1:0),5)+" / 5",22,10+ch/2+.5);
}
/* 命中反馈：脉冲环 + 浮字（纯渲染层，由 stick / score 变化推导） */
function drawFx(){
  var i;
  for(i=0;i<fxPulses.length;i++){
    var q=fxPulses[i],k=q.life/q.ttl;
    ctx.globalAlpha=Math.max(0,1-k);ctx.strokeStyle=q.c;ctx.lineWidth=3*(1-k)+1;
    ctx.beginPath();ctx.arc(q.x,q.y,10+k*44,0,7);ctx.stroke();
  }
  ctx.globalAlpha=1;
  if(fxFloats.length){
    ctx.font="700 14px "+sysFont();ctx.textAlign="center";ctx.textBaseline="middle";
    for(i=0;i<fxFloats.length;i++){
      var f=fxFloats[i],k=f.life/f.ttl;
      ctx.globalAlpha=Math.max(0,1-k);ctx.fillStyle=f.c;
      ctx.fillText(f.txt,f.x,f.y-14-k*20);
    }
    ctx.globalAlpha=1;ctx.textBaseline="alphabetic";
  }
}
function fxUpdate(dt){
  var i;
  for(i=fxPulses.length-1;i>=0;i--){fxPulses[i].life+=dt;if(fxPulses[i].life>fxPulses[i].ttl)fxPulses.splice(i,1);}
  for(i=fxFloats.length-1;i>=0;i--){fxFloats[i].life+=dt;if(fxFloats[i].life>fxFloats[i].ttl)fxFloats.splice(i,1);}
}
function syncFx(){
  if(stick.length>fxStickLen){
    var s=stick[stick.length-1];
    if(!window.__gRM){
      fxPulses.push({x:s.x,y:s.y,c:s.sc>0?PAL.success:PAL.danger,life:0,ttl:.45});
      fxFloats.push({txt:(s.sc>0?"+":"")+s.sc+(s.sc>0?" 环":" 脱靶"),c:s.sc>0?PAL.success:PAL.danger,life:0,ttl:.9,x:s.x,y:s.y});
    }
  }
  fxStickLen=stick.length;
  if(score!==fxScore){
    if(fxScore>=0&&score>fxScore){
      var el=$("stScore");
      if(el&&!window.__gRM){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}
    }
    fxScore=score;
  }
  if(window.__gRM){fxPulses.length=0;fxFloats.length=0;}
}
function draw(){
  var now=performance.now(),dt=fxLast?Math.min(.05,(now-fxLast)/1000):0;
  fxLast=now;if(!window.__gRM)fxT+=dt;
  ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(offX,offY);ctx.scale(S,S);
  if(!course){
    ctx.restore();ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
    rr(offX+.5,offY+.5,NW*S-1,NH*S-1,10);ctx.stroke();return;
  }
  drawSky();drawGround();drawRail();
  var ty=AM_MID+course.range*Math.sin(course.om*T+course.ph);
  var tp=window.__gRM?1:Math.min(1,Math.max(0,(fxT-.05)/.3)),te=1-Math.pow(1-tp,2);
  ctx.save();ctx.globalAlpha=te;ctx.translate(AM_PLANE,ty);ctx.scale(.82+.18*te,.82+.18*te);ctx.translate(-AM_PLANE,-ty);
  drawTarget(ty);ctx.restore();
  drawStuck();
  var ap=window.__gRM?1:Math.min(1,Math.max(0,(fxT-.12)/.3)),ae=1-Math.pow(1-ap,2);
  ctx.save();ctx.globalAlpha=ae;ctx.translate(0,(1-ae)*10);drawArcher();ctx.restore();
  drawArrow();drawCharge();drawHud();syncFx();
  if(!window.__gRM)fxUpdate(dt);
  drawFx();
  ctx.restore();ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+.5,offY+.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

}
function retry(){loadLevel(cur);startPlay();}

/* ---------- 输入（画布被 CSS 缩放，但只用 press/release，无点位命中，故无需缩放补偿） ---------- */
cv.addEventListener("pointerdown",function(ev){press();ev.preventDefault();});
cv.addEventListener("pointerup",function(ev){releaseArrow();});
cv.addEventListener("pointercancel",function(ev){charging=false;});
window.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k===" "){
    e.preventDefault();
    if(state==="running"&&!paused){
      if(e.repeat)return;
      if(!charging)press();else releaseArrow();
    }else if(state==="ready"||state==="over")retry();
    else if(paused){paused=false;hideOverlay();}
  }
});
window.addEventListener("keyup",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k===" ")releaseArrow();
});
btnRetry.addEventListener("click",function(){retry();this.blur();});
btnLevels.addEventListener("click",function(){
  if(state==="running"&&!paused){paused=true;say("选关中");}
  openLevelSelect();this.blur();
});

/* 切后台自动暂停 */
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running"&&!paused&&!overlayEl.classList.contains("show")){
    paused=true;charging=false;showPause();
  }
});

/* ---------- 主循环与启动 ---------- */
var last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;
  var dt=Math.min(0.033,((ts-last)/1000)||0);
  last=ts;
  if(state==="running"&&!paused)stepGame(dt);
  draw();
}
/* 按钮图标：照抄本库 window.SW_ICON 范式，文字前内联 SVG，与文字基线对齐 */
btnRetry.insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
btnLevels.insertAdjacentHTML("afterbegin",window.SW_ICON("grid"));
fit();
refresh();
loadLevel(cur);
showStart();
syncLevelsFromServer();
syncSaveFromServer();
requestAnimationFrame(loop);
window.__validateLevels=GEN.validateLevelsAll;


/* ========== 关卡公共段（DB 下发优先 + localStorage 版本缓存 + 包内默认关兜底；仅函数声明，供游戏段调用） ========== */
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!d||typeof d.name!=="string"||!d.name.trim()||!Number.isInteger(d.no)||d.no<1||!Number.isInteger(d.seed))return null;
    if(seen[d.no])return null;
    seen[d.no]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||list.length<DEFAULT_LEVELS.length)return false;
  for(var i=0;i<list.length;i++){
    var d=list[i],lv;
    try{lv=GEN.gen(d.no,d.seed);}catch(e){return false;}
    if(!lv||!GEN.validate(lv).ok)return false;
  }
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length>=DEFAULT_LEVELS.length){
      for(var i=0;i<list.length;i++){var d=list[i];if(!d||!Number.isInteger(d.no)||!Number.isInteger(d.seed))return v;}
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      if(save.lv>LEVELS.length-1)save.lv=LEVELS.length-1;
      persistSave();loadLevel(cur);
    }
  }).catch(function(){});
}
function loadSaveData(){
  try{
    var s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    if(s&&typeof s==="object"){
      var done={};
      if(s.done&&typeof s.done==="object")for(var k in s.done){var v=parseInt(s.done[k],10);if(v>0)done[k]=v;}
      return{lv:Math.max(0,parseInt(s.lv,10)||0),done:done,best:Math.max(0,parseInt(s.best,10)||0)};
    }
  }catch(e){}
  return{lv:0,done:{},best:0};
}
function persistSave(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(remote.lv,10)||0;if(rl>save.lv){save.lv=rl;changed=true;}
      var rb=parseInt(remote.best,10)||0;if(rb>save.best){save.best=rb;changed=true;}
      if(remote.done&&typeof remote.done==="object")for(var k in remote.done){
        var rv=parseInt(remote.done[k],10)||0,mv=parseInt(save.done[k],10)||0;
        if(rv>mv){save.done[k]=rv;changed=true;}
      }
      if(changed){persistSave();}
    }catch(e){}
  }).catch(function(){});
}
function openLevelSelect(){
  var html='<p class="rt">选择关卡</p><p class="rs">已过关卡标绿，灰色未解锁</p><div class="lv-wrap"><div class="lv-grid">';
  for(var i=0;i<LEVELS.length;i++){
    var done=parseInt(save.done[i],10)>0;
    var locked=i>save.lv;
    html+='<button class="lv-chip'+(i===cur?" sel":"")+(done?" done":"")+'" data-i="'+i+'"'+(locked?" disabled":"")+' type="button">'+(i+1)+'</button>';
  }
  html+='</div></div><div class="rbtns"><button class="btn ghost" id="ovClose" type="button">'+SW_ICON("x")+'返回</button></div>';
  showPanel(html);
  var chips=panelEl.querySelectorAll(".lv-chip");
  for(var j=0;j<chips.length;j++){
    chips[j].addEventListener("click",function(){
      var i=parseInt(this.getAttribute("data-i"),10);
      hideOverlay();enterLevel(i);
    });
  }
  $("ovClose").addEventListener("click",function(){hideOverlay();selectClosed();});
}

})();
</script>
