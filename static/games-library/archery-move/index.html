/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 调色板（颜色全部经 CSS 变量读取，JS 零颜色字面量） ========== */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim();}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),text:v("--g-text"),
    muted:v("--g-muted"),faint:v("--g-faint"),border:v("--g-border"),hairline:v("--g-hairline"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    onSoft:v("--g-on-soft"),onPrimary:v("--g-on-primary"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),
    stA:v("--g-st-a"),stB:v("--g-st-b"),stC:v("--g-st-c"),stD:v("--g-st-d"),stE:v("--g-st-e"),stF:v("--g-st-f")};
}
window.__gOnTheme=function(){palLoad();if(typeof draw==="function")draw();};
palLoad();

/* ========== 通用工具与覆盖层面板 ========== */
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
var overlayEl=$("overlay"),panelEl=$("panel");
function showPanel(html){panelEl.innerHTML=html;overlayEl.classList.add("show");}
function hideOverlay(){overlayEl.classList.remove("show");}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}

/* ==================== 移靶射箭（移动靶 + 风向修正，关卡驱动） ==================== */
var GAME_KEY="archery-move",SAVE_KEY="sw.archerymove.v1";
var LEVELS_KEY="sw.archerymove.v1.levels",LEVELS_VER_KEY="sw.archerymove.v1.levels.ver";

/*XC-CORE-BEGIN*/
var GEN={};
function amSeed(no){return no*7669+7043;}
function amRng(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var AM_X0=60,AM_Y0=380,AM_VX=320,AM_G=520,AM_PLANE=330,AM_MID=200;
/* 弹道闭式解：x(t)=x0+vx*t+w/2*t^2，求到达靶面的时间与落点 */
GEN.flight=function(w,charge){
  var vy0=-80-charge*380;
  var a=w/2,b=AM_VX,c=AM_X0-AM_PLANE;
  var t;
  if(Math.abs(w)<0.01){t=-c/b;}
  else{
    var disc=b*b-4*a*c;
    if(disc<0)return null;
    var r1=(-b+Math.sqrt(disc))/(2*a),r2=(-b-Math.sqrt(disc))/(2*a);
    t=r1>0?r1:r2;
    if(t<=0)return null;
  }
  var y=AM_Y0+vy0*t+AM_G/2*t*t;
  return {t:t,y:y};
};
GEN.ringOf=function(off){
  var d=Math.abs(off);
  if(d<=13)return 10;
  if(d<=28)return 8;
  if(d<=45)return 6;
  if(d<=64)return 4;
  return 0;
};
/* 独立求解：枚举蓄力 × 出手时刻，验证每支箭都存在 ≥8 环的解并定标目标分 */
GEN.arrowMax=function(lv,windIdx){
  var wind=lv.winds[windIdx];
  var best=0;
  for(var c=0.4;c<=1.001;c+=0.04){
    for(var rt=0;rt<=2.6*Math.PI/lv.om;rt+=0.03){
      var fl=GEN.flight(wind,c);
      if(!fl)continue;
      var ty=AM_MID+lv.range*Math.sin(lv.om*(rt+fl.t)+lv.ph);
      var sc=GEN.ringOf(fl.y-ty);
      if(sc>best)best=sc;
      if(best===10)return best;
    }
  }
  return best;
};
GEN.gen=function(no,seed){
  var p=(no-1)/39;
  var range=90+p*60;
  var om=1.1+p*0.9;
  var wbase=30+p*110;
  var s=(seed==null?amSeed(no):seed);
  for(var att=0;att<60;att++){
    var rng=amRng(s+att*7919);
    var winds=[],i;
    for(i=0;i<5;i++)winds.push(Math.round((rng()<0.5?-1:1)*(wbase+rng()*20)));
    var lv={name:"射箭·"+(no<10?"0"+no:no),no:no,seed:s+att*7919,
      range:Math.round(range),om:Math.round(om*100)/100,ph:rng()*6.28,winds:winds};
    var sum=0,minRing=10;
    for(i=0;i<5;i++){
      var m=GEN.arrowMax(lv,i);
      sum+=m;if(m<minRing)minRing=m;
    }
    var need=Math.max(18,Math.min(40,Math.round(0.66*sum)));
    lv.need=need;
    if(minRing>=8&&need<=Math.round(0.7*sum)&&GEN.validate(lv).ok)return lv;
  }
  return {name:"射箭·01",no:no,seed:s,range:90,om:1.1,ph:1.0,winds:[40,-40,40,-40,40],need:18};
};
/* 独立验证器：每支箭在风场下均存在 ≥8 环解；目标分 ≤ 可达上限的 70% */
GEN.validate=function(lv){
  if(!lv||typeof lv!=="object")return{ok:false,why:"shape"};
  if(!(lv.range>=90&&lv.range<=150))return{ok:false,why:"range"};
  if(!(lv.om>=1.1&&lv.om<=2.0))return{ok:false,why:"om"};
  if(!Array.isArray(lv.winds)||lv.winds.length!==5)return{ok:false,why:"winds"};
  for(var i=0;i<5;i++)if(!(Math.abs(lv.winds[i])>=30&&Math.abs(lv.winds[i])<=160))return{ok:false,why:"wind"+i};
  if(!(Number.isInteger(lv.need)&&lv.need>=18&&lv.need<=40))return{ok:false,why:"need"};
  var sum=0;
  for(i=0;i<5;i++){
    var m=GEN.arrowMax(lv,i);
    if(m<8)return{ok:false,why:"arrow"+i+"="+m};
    sum+=m;
  }
  if(lv.need>Math.round(0.7*sum))return{ok:false,why:"need-tight"};
  return{ok:true,why:"",sum:sum};
};
GEN.validateLevelsAll=function(){
  var fails=[],n=0;
  for(var no=1;no<=40;no++){
    var lv=GEN.gen(no,amSeed(no));
    var r=GEN.validate(lv);
    if(!r.ok)fails.push(no+"("+r.why+")");
    n++;
  }
  return {total:n,fails:fails,allOk:fails.length===0};
};
globalThis.__XC=GEN;
/*XC-CORE-END*/

var btnRetry=$("btnRetry"),btnLevels=$("btnLevels");

/* ---------- 画布 ---------- */
var NW=390,NH=460,W=390,H=460,S=1,offX=0,offY=0;
var cv=$("cv"),ctx=cv.getContext("2d");
function rr(x0,y0,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x0+r,y0);
  ctx.arcTo(x0+w,y0,x0+w,y0+h,r);ctx.arcTo(x0+w,y0+h,x0,y0+h,r);
  ctx.arcTo(x0,y0+h,x0,y0,r);ctx.arcTo(x0,y0,x0+w,y0,r);
  ctx.closePath();
}
function fit(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));H=Math.max(300,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);offX=(W-NW*S)/2;offY=(H-NH*S)/2;
  draw();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);

/* ---------- 关卡流程 ---------- */
function loadLevel(idx){
  idx=Math.max(0,Math.min(idx,LEVELS.length-1));
  cur=idx;
  var d=LEVELS[idx];
  course=GEN.gen(d.no,d.seed==null?amSeed(d.no):d.seed);
  var chk=GEN.validate(course);
  if(!chk.ok)course=GEN.gen(d.no,amSeed(d.no));
  state="ready";paused=false;
  T=0;arrowNo=0;score=0;charge=0;charging=false;arrow=null;stick=[];nextT=0;
  refresh();
}

  state="running";paused=false;

function selectClosed(){showStart();}
function press(){
  if(state!=="running"||paused)return;
  if(arrow||nextT>0)return;
  charging=true;charge=0;
}
function releaseArrow(){
  if(!charging||state!=="running"||paused)return;
  charging=false;
  var wind=course.winds[arrowNo];
  var fl=GEN.flight(wind,charge);
  if(!fl){say("这箭飞不出去了");arrowNo++;checkDone();return;}
  arrow={t:0,ts:fl.t,yImp:fl.y,wind:wind,vy0:-80-charge*380,tRel:T};
  charge=0;
}
function checkDone(){
  if(arrowNo>=5){
    state="over";
    var win=score>=course.need;
    var stars=win?(score>=course.need+10?3:2):1;
    if(win){
      var old=parseInt(save.done[cur],10)||0;
      if(stars>old)save.done[cur]=stars;
      save.best=totalStars();
      if(cur+1>save.lv)save.lv=cur+1;
      persistSave();
      if(GB.available)GB.reportScore(GAME_KEY,{metricValue:save.lv,metricExtra:save.best}).catch(function(){});
    }
    refresh();
    if(win)showWin(stars);else showFail();
  }
}
function stepGame(dt){
  T+=dt;
  if(charging)charge=Math.min(1,charge+dt/0.7);
  if(nextT>0){
    nextT-=dt;
    if(nextT<=0&&arrowNo<5)say("第 "+(arrowNo+1)+" 支 · 按住蓄力");
    return;
  }
  if(arrow){
    arrow.t+=dt;
    if(arrow.t>=arrow.ts){
      var ty=AM_MID+course.range*Math.sin(course.om*(arrow.tRel+arrow.ts)+course.ph);
      var sc=GEN.ringOf(arrow.yImp-ty);
      score+=sc;
      stick.push({x:AM_PLANE,y:arrow.yImp,sc:sc});
      say(sc>0?"中 "+sc+" 环！":"脱靶 · 落点偏 "+Math.round(arrow.yImp-ty)+"px");
      arrow=null;
      arrowNo++;
      refresh();
      nextT=0.55;
      checkDone();
    }
  }
}

/* ---------- 绘制 ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(offX,offY);ctx.scale(S,S);
  if(!course){
    ctx.restore();
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
    rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
    return;
  }
  ctx.fillStyle=PAL.stB;ctx.fillRect(0,0,NW,NH);
  ctx.fillStyle=PAL.stA;
  rr(0,418,NW,42,0);ctx.fill();
  ctx.fillStyle=PAL.stD;
  for(var g=0;g<10;g++)ctx.fillRect(14+g*38,428,20,3);
  /* 靶 */
  var ty=AM_MID+course.range*Math.sin(course.om*T+course.ph);
  ctx.strokeStyle=PAL.stD;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(330,ty+70);ctx.lineTo(322,ty+96);ctx.moveTo(330,ty+70);ctx.lineTo(338,ty+96);ctx.stroke();
  ctx.fillStyle=PAL.stE;
  ctx.beginPath();ctx.arc(330,ty,64,0,6.3);ctx.fill();
  ctx.fillStyle=PAL.warning;
  ctx.beginPath();ctx.arc(330,ty,45,0,6.3);ctx.fill();
  ctx.fillStyle=PAL.danger;
  ctx.beginPath();ctx.arc(330,ty,28,0,6.3);ctx.fill();
  ctx.fillStyle=PAL.surface;
  ctx.beginPath();ctx.arc(330,ty,13,0,6.3);ctx.fill();
  ctx.fillStyle=PAL.danger;
  ctx.beginPath();ctx.arc(330,ty,5,0,6.3);ctx.fill();
  ctx.strokeStyle=PAL.stD;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(330,ty,64,0,6.3);ctx.stroke();
  ctx.beginPath();ctx.arc(330,ty,45,0,6.3);ctx.stroke();
  ctx.beginPath();ctx.arc(330,ty,28,0,6.3);ctx.stroke();
  ctx.beginPath();ctx.arc(330,ty,13,0,6.3);ctx.stroke();
  /* 中箭 */
  for(var s2=0;s2<stick.length;s2++){
    ctx.strokeStyle=PAL.stC;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(stick[s2].x-16,stick[s2].y-4);ctx.lineTo(stick[s2].x,stick[s2].y);ctx.stroke();
    ctx.fillStyle=PAL.stC;
    ctx.fillRect(stick[s2].x-1,stick[s2].y-2,2,4);
  }
  /* 飞行中的箭 */
  if(arrow){
    var t=Math.min(arrow.t,arrow.ts);
    var ax=AM_X0+AM_VX*t+0.5*arrow.wind*t*t;
    var ay=AM_Y0+arrow.vy0*t+AM_G/2*t*t;
    var vx=AM_VX+arrow.wind*t,vy=arrow.vy0+AM_G*t;
    var L=26,vd=Math.hypot(vx,vy);
    ctx.strokeStyle=PAL.stC;ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(ax-vx/vd*L,ay-vy/vd*L);
    ctx.lineTo(ax,ay);
    ctx.stroke();
    ctx.fillStyle=PAL.stC;
    ctx.beginPath();
    ctx.moveTo(ax,ay);
    ctx.lineTo(ax-vx/vd*8-vy/vd*4,ay-vy/vd*8+vx/vd*4);
    ctx.lineTo(ax-vx/vd*8+vy/vd*4,ay-vy/vd*8-vx/vd*4);
    ctx.closePath();ctx.fill();
  }
  /* 弓箭手 */
  ctx.strokeStyle=PAL.stC;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(70,380,22,-2.2,2.2);ctx.stroke();
  ctx.strokeStyle=PAL.text;ctx.lineWidth=1.5;
  var pull=charging?charge*14:0;
  ctx.beginPath();
  ctx.moveTo(70-22*Math.cos(2.2),380-22*Math.sin(2.2));
  ctx.lineTo(70-pull,380);
  ctx.lineTo(70-22*Math.cos(2.2),380+22*Math.sin(2.2));
  ctx.stroke();
  ctx.fillStyle=PAL.primary;
  ctx.beginPath();ctx.arc(56,376,9,0,6.3);ctx.fill();
  /* 蓄力条 */
  if(charging||charge>0){
    ctx.fillStyle=PAL.surface2;
    rr(30,300,120,12,6);ctx.fill();
    ctx.fillStyle=PAL.deep;
    rr(30,300,Math.max(3,120*charge),12,6);ctx.fill();
  }
  /* 风向 */
  var wind=course.winds[Math.min(arrowNo,4)];
  ctx.fillStyle=PAL.muted;
  ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  ctx.fillText((wind>0?"顺风 → ":"← 逆风 ")+Math.abs(wind),195,26);
  ctx.strokeStyle=PAL.stD;ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(195+wind*0.25,36);ctx.lineTo(195-wind*0.25,36);
  ctx.lineTo(195-wind*0.25-((wind>0)?1:-1)*8,31);
  ctx.moveTo(195-wind*0.25,36);ctx.lineTo(195-wind*0.25-((wind>0)?1:-1)*8,41);
  ctx.stroke();
  ctx.fillStyle=PAL.muted;
  ctx.textAlign="left";
  ctx.fillText("箭 "+Math.min(arrowNo+(arrow||nextT>0?1:0),5)+" / 5",14,46);
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

/* ---------- 覆盖层 ---------- */
function showStart(){
  showPanel(
    '<p class="rt">第 '+(cur+1)+' 关 · '+esc(course.name)+'</p>'+
    '<p class="rs">5 支箭 · 目标 <b>'+course.need+' 分</b> · 靶速 '+course.om.toFixed(1)+' · 摆幅 '+course.range+'</p>'+
    '<div class="rbtns"><button class="btn" id="ovMain" type="button">开始</button></div>'+
    '<p class="rhint">每箭风向不同：顺风飞得快、落点偏高，逆风飞得慢、掉得更多。蓄力越满弹道越高，提前量要算上箭的飞行时间。</p>'
  );
  $("ovMain").addEventListener("click",function(){startPlay();});
}
function showWin(stars){
  var last=cur>=LEVELS.length-1;
  showPanel(
    '<p class="rt">达标！</p>'+
    '<p class="rs">总分 <b>'+score+'</b> / 目标 '+course.need+' · 星星 '+stars+' / 3</p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovReplay" type="button">重射</button>'+
      '<button class="btn" id="ovNext" type="button">'+(last?"已完成全部":"下一关")+'</button>'+
    '</div>'
  );
  $("ovNext").addEventListener("click",function(){enterLevel(last?cur:cur+1);});
  $("ovReplay").addEventListener("click",function(){enterLevel(cur);});
}
function showFail(){
  showPanel(
    '<p class="rt">未达标</p>'+
    '<p class="rs">总分 '+score+' / 目标 '+course.need+'</p>'+
    '<p class="rhint">提示：盯住靶心等它摆到下沿折返时出手，那时靶在你面前停留最久；满蓄力 + 顺风最容易打出高环。</p>'+
    '<div class="rbtns"><button class="btn" id="ovRetryF" type="button">重射本关</button></div>'
  );
  $("ovRetryF").addEventListener("click",function(){retry();});
}
function showPause(){
  showPanel(
    '<p class="rt">已暂停</p>'+
    '<p class="rs">第 '+Math.min(arrowNo+1,5)+' 支 · 当前 '+score+' / '+course.need+'</p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovReP" type="button">重射本关</button>'+
      '<button class="btn" id="ovReR" type="button">继续</button>'+
    '</div>'
  );
  $("ovReR").addEventListener("click",function(){paused=false;hideOverlay();});
  $("ovReP").addEventListener("click",function(){retry();});
}
function retry(){loadLevel(cur);startPlay();}

/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(ev){press();ev.preventDefault();});
cv.addEventListener("pointerup",function(ev){releaseArrow();});
cv.addEventListener("pointercancel",function(ev){charging=false;});
window.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k===" "){
    e.preventDefault();
    if(state==="running"&&!paused){
      if(e.repeat)return;
      if(!charging)press();else releaseArrow();
    }else if(state==="ready"||state==="over")retry();
    else if(paused){paused=false;hideOverlay();}
  }
});
window.addEventListener("keyup",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k===" ")releaseArrow();
});
btnRetry.addEventListener("click",function(){retry();this.blur();});
btnLevels.addEventListener("click",function(){
  if(state==="running"&&!paused){paused=true;say("选关中");}
  openLevelSelect();this.blur();
});

/* 切后台自动暂停 */
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running"&&!paused&&!overlayEl.classList.contains("show")){
    paused=true;charging=false;showPause();
  }
});

/* ---------- 主循环与启动 ---------- */
var last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;
  var dt=Math.min(0.033,((ts-last)/1000)||0);
  last=ts;
  if(state==="running"&&!paused)stepGame(dt);
  draw();
}
fit();
refresh();
loadLevel(cur);
showStart();
syncLevelsFromServer();
syncSaveFromServer();
requestAnimationFrame(loop);
window.__validateLevels=GEN.validateLevelsAll;


/* ========== 关卡公共段（DB 下发优先 + localStorage 版本缓存 + 包内默认关兜底；仅函数声明，供游戏段调用） ========== */
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!d||typeof d.name!=="string"||!d.name.trim()||!Number.isInteger(d.no)||d.no<1||!Number.isInteger(d.seed))return null;
    if(seen[d.no])return null;
    seen[d.no]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||list.length<DEFAULT_LEVELS.length)return false;
  for(var i=0;i<list.length;i++){
    var d=list[i],lv;
    try{lv=GEN.gen(d.no,d.seed);}catch(e){return false;}
    if(!lv||!GEN.validate(lv).ok)return false;
  }
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length>=DEFAULT_LEVELS.length){
      for(var i=0;i<list.length;i++){var d=list[i];if(!d||!Number.isInteger(d.no)||!Number.isInteger(d.seed))return v;}
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      if(save.lv>LEVELS.length-1)save.lv=LEVELS.length-1;
      persistSave();loadLevel(cur);
    }
  }).catch(function(){});
}
function loadSaveData(){
  try{
    var s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    if(s&&typeof s==="object"){
      var done={};
      if(s.done&&typeof s.done==="object")for(var k in s.done){var v=parseInt(s.done[k],10);if(v>0)done[k]=v;}
      return{lv:Math.max(0,parseInt(s.lv,10)||0),done:done,best:Math.max(0,parseInt(s.best,10)||0)};
    }
  }catch(e){}
  return{lv:0,done:{},best:0};
}
function persistSave(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(remote.lv,10)||0;if(rl>save.lv){save.lv=rl;changed=true;}
      var rb=parseInt(remote.best,10)||0;if(rb>save.best){save.best=rb;changed=true;}
      if(remote.done&&typeof remote.done==="object")for(var k in remote.done){
        var rv=parseInt(remote.done[k],10)||0,mv=parseInt(save.done[k],10)||0;
        if(rv>mv){save.done[k]=rv;changed=true;}
      }
      if(changed){persistSave();}
    }catch(e){}
  }).catch(function(){});
}
function openLevelSelect(){
  var html='<p class="rt">选择关卡</p><p class="rs">已过关卡标绿，灰色未解锁</p><div class="lv-wrap"><div class="lv-grid">';
  for(var i=0;i<LEVELS.length;i++){
    var done=parseInt(save.done[i],10)>0;
    var locked=i>save.lv;
    html+='<button class="lv-chip'+(i===cur?" sel":"")+(done?" done":"")+'" data-i="'+i+'"'+(locked?" disabled":"")+' type="button">'+(i+1)+'</button>';
  }
  html+='</div></div><div class="rbtns"><button class="btn ghost" id="ovClose" type="button">返回</button></div>';
  showPanel(html);
  var chips=panelEl.querySelectorAll(".lv-chip");
  for(var j=0;j<chips.length;j++){
    chips[j].addEventListener("click",function(){
      var i=parseInt(this.getAttribute("data-i"),10);
      hideOverlay();enterLevel(i);
    });
  }
  $("ovClose").addEventListener("click",function(){hideOverlay();selectClosed();});
}

})();
</script>
