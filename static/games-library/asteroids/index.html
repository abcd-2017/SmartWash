<script>
(function(){
'use strict';
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 关卡数据：包内默认 + DB 下发（整批替换，任一条非法整批放弃） ========== */
var DEFAULT_LEVELS=[{"name":"近轨巡航·第1关","waves":1,"seed":104768,"lives":3},{"name":"近轨巡航·第2关","waves":1,"seed":201819,"lives":3},{"name":"近轨巡航·第3关","waves":1,"seed":298870,"lives":3},{"name":"近轨巡航·第4关","waves":1,"seed":395921,"lives":3},{"name":"近轨巡航·第5关","waves":1,"seed":492972,"lives":3},{"name":"近轨巡航·第6关","waves":1,"seed":590023,"lives":3},{"name":"近轨巡航·第7关","waves":1,"seed":687074,"lives":3},{"name":"近轨巡航·第8关","waves":1,"seed":784125,"lives":3},{"name":"近轨巡航·第9关","waves":1,"seed":881176,"lives":3},{"name":"近轨巡航·第10关","waves":1,"seed":978227,"lives":3},{"name":"近轨巡航·第11关","waves":1,"seed":1075278,"lives":3},{"name":"近轨巡航·第12关","waves":1,"seed":1172329,"lives":3}];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY="sw.asteroids.v1.levels",LEVELS_VER_KEY="sw.asteroids.v1.levels.ver";
function parseAsteroidsLevels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={},i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    var d;
    try{d=JSON.parse(item.dataJson)}catch(e){return null}
    if(!d||typeof d!=="object"||Array.isArray(d))return null;
    if(typeof d.name!=="string"||!d.name.length||d.name.length>32)return null;
    if(!isFinite(d.waves)||Math.floor(d.waves)!==d.waves||d.waves<1||d.waves>8)return null;
    if(!isFinite(d.seed)||Math.floor(d.seed)!==d.seed||d.seed<0||d.seed>2147483647)return null;
    if(!isFinite(d.lives)||Math.floor(d.lives)!==d.lives||d.lives<1||d.lives>5)return null;
    var no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=true;
    list.push({no:no,name:d.name,waves:d.waves,seed:d.seed,lives:d.lives});
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels("asteroids").then(function(res){
    var list=parseAsteroidsLevels(res);
    if(!list||!list.length)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      if(state==="ready"){updateHud();showStart();}
      else startLevel(cur);
    }
  }).catch(function(){});
}

/* ---------- 存档（本地 + 账号双写，账号更优才覆盖） ---------- */
var KEY="sw.asteroids.v1";
function loadSave(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.lv>=0)return{lv:Math.min(s.lv,LEVELS.length-1),best:parseInt(s.best,10)||0,bestLevel:parseInt(s.bestLevel,10)||0};}catch(e){}
  return{lv:0,best:0,bestLevel:0};
}
function save(){
  var data={lv:cur,best:best,bestLevel:bestLevel};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("asteroids",data).catch(function(){});
}
var saveData=loadSave(),best=saveData.best||0,bestLevel=saveData.bestLevel||0;
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("asteroids").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(r.lv,10),rb=parseInt(r.best,10),rbl=parseInt(r.bestLevel,10);
      if(isFinite(rl)&&rl>saveData.lv){saveData.lv=Math.min(rl,LEVELS.length-1);changed=true;}
      if(isFinite(rb)&&rb>best){best=rb;changed=true;}
      if(isFinite(rbl)&&rbl>bestLevel){bestLevel=rbl;changed=true;}
      if(changed){
        cur=Math.min(saveData.lv,LEVELS.length-1);
        save();
        if(state==="ready"){updateHud();showStart();}
        else startLevel(cur);
      }
    }catch(e){}
  }).catch(function(){});
}

/* ========== 确定性初始局面生成（校验器按标记抽取复现） ========== */
/*AST-CORE-BEGIN*/
var AST_MW=480,AST_MH=640;
var AST_RADII={3:46,2:26,1:14};
var AST_SHIP_HOME={x:240,y:320};
function astMulberry(seed){
  seed|=0;
  return function(){
    seed=(seed+0x6D2B79F5)|0;
    var t=Math.imul(seed^(seed>>>15),1|seed);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return((t^(t>>>14))>>>0)/4294967296;
  };
}
function astCount(w){return Math.min(3+w,10);}
function astSpeed(w){return 45+12*w;}
function astSizes(total){var large=total<=3?total:Math.ceil(total/2);return[large,total-large];}
function astVerts(rng){
  var n=9+Math.floor(rng()*3),v=[],i;
  for(i=0;i<n;i++)v.push(0.72+rng()*0.5);
  return v;
}
function astSpawnWave(seed,w){
  var rng=astMulberry(((seed>>>0)^Math.imul(w+1,2654435761))>>>0);
  var total=astCount(w),sizes=astSizes(total),out=[],i,j,r,size,x,y,dx,dy,ok,tries,need;
  for(i=0;i<total;i++){
    size=i<sizes[0]?3:2;
    r=AST_RADII[size];
    var placed=false;
    for(tries=0;tries<500;tries++){
      x=r+4+rng()*(AST_MW-2*r-8);
      y=r+4+rng()*(AST_MH-2*r-8);
      dx=x-AST_SHIP_HOME.x;dy=y-AST_SHIP_HOME.y;
      if(dx*dx+dy*dy<(175+r)*(175+r))continue;
      ok=true;need=tries<250?12:2;
      for(j=0;j<out.length;j++){
        var o=out[j];dx=x-o.x;dy=y-o.y;
        if(dx*dx+dy*dy<(r+o.r+need)*(r+o.r+need)){ok=false;break}
      }
      if(ok){placed=true;break}
    }
    if(!placed){
      for(tries=0;tries<500;tries++){
        x=r+4+rng()*(AST_MW-2*r-8);
        y=r+4+rng()*(AST_MH-2*r-8);
        dx=x-AST_SHIP_HOME.x;dy=y-AST_SHIP_HOME.y;
        if(dx*dx+dy*dy<(175+r)*(175+r))continue;
        ok=true;
        for(j=0;j<out.length;j++){var o2=out[j];dx=x-o2.x;dy=y-o2.y;need=r+o2.r;if(dx*dx+dy*dy<need*need){ok=false;break}}
        if(ok){placed=true;break}
      }
    }
    if(!placed){x=r+4+rng()*(AST_MW-2*r-8);y=r+4+rng()*(AST_MH-2*r-8);}
    var ang=rng()*6.283185307179586;
    var spd=astSpeed(w)*(size===2?1.15:1)*(0.7+0.6*rng());
    out.push({x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,r:r,size:size,
      rot:rng()*6.283185307179586,va:(rng()-0.5)*1.6,verts:astVerts(rng)});
  }
  return out;
}

/* 颜色工具 */
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
function shade(c,a){
  var s=String(c).trim(),m;
  if(s.charAt(0)==="#"){
    var h=s.slice(1),r,g,b;
    if(h.length===3){r=parseInt(h.charAt(0)+h.charAt(0),16);g=parseInt(h.charAt(1)+h.charAt(1),16);b=parseInt(h.charAt(2)+h.charAt(2),16);}
    else{r=parseInt(h.slice(0,2),16);g=parseInt(h.slice(2,4),16);b=parseInt(h.slice(4,6),16);}
    return"rgba("+r+","+g+","+b+","+(a).toFixed(3)+")";
  }
  m=s.match(/rgba?\(([^)]+)\)/);
  if(m){var p=m[1].split(",");return"rgba("+p[0]+","+p[1]+","+p[2]+","+(a).toFixed(3)+")";}
  return s;
}

/* ========== 工具 ========== */
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function moveWrap(o,r,dt){
  var ox=o.x,oy=o.y;
  o.x+=o.vx*dt;o.y+=o.vy*dt;
  var sx=0,sy=0;
  if(o.x<-r)sx=1;else if(o.x>AST_MW+r)sx=-1;
  if(o.y<-r)sy=1;else if(o.y>AST_MH+r)sy=-1;
  if(sx){o.x+=sx*(AST_MW+2*r);ox+=sx*(AST_MW+2*r);}
  if(sy){o.y+=sy*(AST_MH+2*r);oy+=sy*(AST_MH+2*r);}
  return[ox,oy];
}
function segDist2(ax,ay,bx,by,cx,cy){
  var dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy,t;
  t=l2>0?((cx-ax)*dx+(cy-ay)*dy)/l2:0;
  t=clamp(t,0,1);
  var ex=cx-(ax+dx*t),ey=cy-(ay+dy*t);
  return ex*ex+ey*ey;
}
function spawnPart(x,y,vx,vy,life,color,r){if(parts.length<220)parts.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,color:color,r:r});}
function explode(x,y,size){
  var cols=[PAL.danger,PAL.warning,PAL.rock1,PAL.bolt],n=10+size*6,i;
  for(i=0;i<n;i++){
    var a=Math.random()*6.283185307179586,sp=40+Math.random()*(60+size*40);
    spawnPart(x,y,Math.cos(a)*sp,Math.sin(a)*sp,0.5+Math.random()*0.5,cols[i%3],1.5+Math.random()*2);
  }
}
function updParts(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    var d=Math.exp(-0.6*dt);p.vx*=d;p.vy*=d;
    p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
}

/* ========== 流程 ========== */
function hideAll(){ovStart.classList.add("hide");ovPause.classList.add("hide");ovClear.classList.add("hide");ovOver.classList.add("hide");}
function updateHud(){
  hScore.textContent=String(score);
  hLevel.textContent=(cur+1)+"/"+LEVELS.length;
  hWave.textContent=(wave+1)+"/"+LEVELS[cur].waves;
  hLives.textContent=String(lives);
}
function showToast(t,dur){toastEl.textContent=t;toastEl.classList.add("show");toastT=dur||2.2;}
function resetShip(){
  ship.x=AST_SHIP_HOME.x;ship.y=AST_SHIP_HOME.y;ship.vx=0;ship.vy=0;ship.a=-Math.PI/2;ship.av=0;ship.invuln=2;
  // 重生时把贴得太近的小行星推到 150px 外，避免无敌时间结束后立刻二次撞击
  var i;
  for(i=0;i<asteroids.length;i++){
    var a=asteroids[i];
    var dx=a.x-AST_SHIP_HOME.x,dy=a.y-AST_SHIP_HOME.y;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<150){
      if(d<1){dx=1;dy=0;d=1;}
      a.x=AST_SHIP_HOME.x+dx/d*150;
      a.y=AST_SHIP_HOME.y+dy/d*150;
    }
  }
}
function loadWave(w,silent){
  wave=w;asteroids.length=0;
  var list=astSpawnWave(LEVELS[cur].seed,w),i;
  for(i=0;i<list.length;i++)asteroids.push(list[i]);
  updateHud();
  if(!silent&&state==="playing")showToast("第 "+(w+1)+" 波 · "+list.length+" 颗",1.6);
}
function startLevel(n){
  cur=clamp(n,0,LEVELS.length-1);
  var L=LEVELS[cur];
  lives=L.lives;score=0;waveTimer=0;fireCd=0;
  bullets.length=0;parts.length=0;
  resetShip();
  loadWave(0,true);
  state="playing";
  hideAll();
  if(cur+1>bestLevel)bestLevel=cur+1;
  showToast("第 "+(cur+1)+" 关 · "+L.name+" · 共 "+L.waves+" 波",2.4);
  updateHud();
  save();
}
function levelClear(){
  state="clear";
  var bonus=1000+150*wave;
  score+=bonus;
  if(score>best)best=score;
  save();
  if(GB.available)GB.reportScore("asteroids",{metricValue:Math.min(cur+2,LEVELS.length)}).catch(function(){});
  elClearTitle.textContent="第 "+(cur+1)+" 关完成";
  elClearScore.textContent=String(score);
  elClearSub.textContent="通关奖励 +"+bonus+" · 下一关生命 "+LEVELS[Math.min(cur+1,LEVELS.length-1)].lives;
  btnNext.textContent=cur<LEVELS.length-1?"进入第 "+(cur+2)+" 关":"再玩一遍";
  ovClear.classList.remove("hide");
  updateHud();
}
function gameOver(){
  state="over";
  var isNew=score>best;
  if(isNew)best=score;
  if(cur+1>bestLevel)bestLevel=cur+1;
  save();
  if(GB.available)GB.reportScore("asteroids",{metricValue:best,metricExtra:cur+1}).catch(function(){});
  elOverScore.textContent=String(score);
  elOverInfo.textContent=(isNew?"新纪录！ ":"")+"最高分 "+best+" · 最远第 "+bestLevel+" 关";
  elOverLv.textContent=String(cur+1);
  ovOver.classList.remove("hide");
  updateHud();
}
function loseLife(){
  lives--;
  explode(ship.x,ship.y,2);
  updateHud();
  if(lives<=0)gameOver();
  else resetShip();
}
function pauseGame(){if(state==="playing"){state="paused";ovPause.classList.remove("hide");rotIn=0;thrIn=fireIn=brakeIn=false;}}
function resumeGame(){if(state==="paused"){state="playing";ovPause.classList.add("hide");}}

/* ========== 输入 ========== */
var ctl={l:false,r:false,t:false,f:false},keys={};
function bindHold(id,key){
  var el=$(id);
  function on(e){e.preventDefault();e.stopPropagation();ctl[key]=true;try{el.setPointerCapture(e.pointerId)}catch(err){}}
  function off(e){e.preventDefault();e.stopPropagation();ctl[key]=false}
  el.addEventListener("pointerdown",on);
  el.addEventListener("pointerup",off);
  el.addEventListener("pointercancel",off);
  el.addEventListener("lostpointercapture",off);
}
bindHold("btnRotL","l");bindHold("btnRotR","r");bindHold("btnThrust","t");bindHold("btnFire","f");
document.addEventListener("keydown",function(e){
  keys[e.code]=true;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].indexOf(e.code)>=0)e.preventDefault();
});
document.addEventListener("keyup",function(e){keys[e.code]=false});
window.addEventListener("blur",function(){keys={};ctl.l=ctl.r=ctl.t=ctl.f=false;});
stage.addEventListener("contextmenu",function(e){e.preventDefault();});
function readCtl(){
  var kl=(ctl.l||keys.ArrowLeft||keys.KeyA)?1:0;
  var kr=(ctl.r||keys.ArrowRight||keys.KeyD)?1:0;
  rotIn=kr-kl;
  thrIn=!!(ctl.t||keys.ArrowUp||keys.KeyW);
  fireIn=!!(ctl.f||keys.Space);
  brakeIn=!!(keys.ArrowDown||keys.KeyS);
}

/* ========== 物理 / 判定 ========== */
function shoot(){
  var nx=ship.x+Math.cos(ship.a)*16,ny=ship.y+Math.sin(ship.a)*16;
  bullets.push({x:nx,y:ny,px:nx,py:ny,vx:ship.vx+Math.cos(ship.a)*540,vy:ship.vy+Math.sin(ship.a)*540,life:0.9});
  fireCd=0.16;
}
function destroyAst(idx){
  var a=asteroids[idx],k,childSize;
  score+=a.size===3?20:(a.size===2?50:100);
  explode(a.x,a.y,a.size);
  if(a.size>1){
    childSize=a.size-1;
    var baseAng=Math.atan2(a.vy,a.vx),sp0=Math.sqrt(a.vx*a.vx+a.vy*a.vy)*1.35;
    for(k=0;k<2;k++){
      var ang=baseAng+(k===0?-1:1)*(0.5+Math.random()*0.5);
      var sp=sp0*(0.85+Math.random()*0.3);
      asteroids.push({x:a.x,y:a.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:AST_RADII[childSize],size:childSize,
        rot:Math.random()*6.283185307179586,va:(Math.random()-0.5)*2,verts:astVerts(Math.random)});
    }
  }
  asteroids.splice(idx,1);
  updateHud();
}
function collideBullets(){
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i],hit=-1,j;
    for(j=0;j<asteroids.length;j++){
      var a=asteroids[j],rr=a.r+2;
      if(segDist2(b.px,b.py,b.x,b.y,a.x,a.y)<=rr*rr){hit=j;break}
    }
    if(hit>=0){destroyAst(hit);bullets.splice(i,1);}
  }
}
function collideShip(ox,oy){
  for(var j=0;j<asteroids.length;j++){
    var a=asteroids[j],rr=a.r+10;
    if(segDist2(ox,oy,ship.x,ship.y,a.x,a.y)<=rr*rr){loseLife();return}
  }
}
function step(dt){
  elapsed+=dt;
  var tgt=rotIn*3.4;
  ship.av+=(tgt-ship.av)*Math.min(1,dt*9);
  ship.a+=ship.av*dt;
  if(thrIn){
    ship.vx+=Math.cos(ship.a)*280*dt;
    ship.vy+=Math.sin(ship.a)*280*dt;
  }
  if(brakeIn){var bd=Math.exp(-2.2*dt);ship.vx*=bd;ship.vy*=bd;}
  var damp=Math.exp(-0.10*dt);
  ship.vx*=damp;ship.vy*=damp;
  var sp=Math.sqrt(ship.vx*ship.vx+ship.vy*ship.vy);
  if(sp>320){ship.vx*=320/sp;ship.vy*=320/sp;}
  var prev=moveWrap(ship,12,dt);
  if(ship.invuln>0)ship.invuln-=dt;

  var i;
  for(i=bullets.length-1;i>=0;i--){
    var b=bullets[i];
    b.px=b.x;b.py=b.y;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-2)b.x+=AST_MW+4;else if(b.x>AST_MW+2)b.x-=AST_MW+4;
    if(b.y<-2)b.y+=AST_MH+4;else if(b.y>AST_MH+2)b.y-=AST_MH+4;
    b.life-=dt;
    if(b.life<=0)bullets.splice(i,1);
  }
  fireCd-=dt;
  if(fireIn&&fireCd<=0&&bullets.length<7)shoot();

  for(i=0;i<asteroids.length;i++){
    var a=asteroids[i];
    moveWrap(a,a.r,dt);
    a.rot+=a.va*dt;
  }

  collideBullets();
  if(state==="playing"&&ship.invuln<=0)collideShip(prev[0],prev[1]);

  updParts(dt);

  if(asteroids.length===0&&state==="playing"){
    if(waveTimer<=0){
      waveTimer=1.2;
      if(wave+1<LEVELS[cur].waves)showToast("第 "+(wave+1)+" 波清空 · 准备",1.2);
      else showToast("全部波次清空！",1.2);
    }
    waveTimer-=dt;
    if(waveTimer<=0){
      if(wave+1<LEVELS[cur].waves)loadWave(wave+1,false);
      else levelClear();
    }
  }
}

/* ========== 绘制 ========== */
var TAU=6.283185307179586;
/* 星云：深空背景层次 */
function drawNebulas(){
  for(var i=0;i<nebs.length;i++){var nb=nebs[i];
    var g=ctx.createRadialGradient(nb.x,nb.y,0,nb.x,nb.y,nb.r);
    g.addColorStop(0,shade(PAL[nb.c],nb.a));g.addColorStop(1,shade(PAL[nb.c],0));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(nb.x,nb.y,nb.r,0,TAU);ctx.fill();}
}
function drawStars(){
  for(var i=0;i<stars.length;i++){var st=stars[i];
    ctx.globalAlpha=0.22+0.5*Math.abs(Math.sin(elapsed*0.8+st.p));
    ctx.fillStyle=PAL.star;ctx.fillRect(st.x,st.y,st.s,st.s);}
  ctx.globalAlpha=1;
}
/* 出生平台 */
function drawBase(){
  var x=AST_SHIP_HOME.x,y=AST_SHIP_HOME.y;
  var g=ctx.createRadialGradient(x,y,6,x,y,52);
  g.addColorStop(0,shade(PAL.base,0.42));g.addColorStop(1,shade(PAL.base,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,52,0,TAU);ctx.fill();
  ctx.save();ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=10;ctx.shadowOffsetY=3;
  var pg=ctx.createRadialGradient(x-8,y-10,4,x,y+4,32);
  pg.addColorStop(0,PAL.baseHi);pg.addColorStop(0.6,PAL.base);pg.addColorStop(1,colShade(PAL.base,-0.3));
  ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(x,y+4,30,15,0,0,TAU);ctx.fill();ctx.restore();
  ctx.lineWidth=2;ctx.strokeStyle=colShade(PAL.base,-0.32);
  ctx.beginPath();ctx.ellipse(x,y+4,30,15,0,0,TAU);ctx.stroke();
  ctx.setLineDash([5,5]);ctx.strokeStyle=shade(PAL.onPrimary,0.8);
  ctx.beginPath();ctx.ellipse(x,y+4,18,9,0,0,TAU);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=shade(WHITE,0.5);ctx.beginPath();ctx.ellipse(x-10,y-3,7,3.5,-0.35,0,TAU);ctx.fill();
}
/* 边界「墙」 */
function drawBounds(){
  ctx.lineWidth=8;ctx.strokeStyle=shade(PAL.base,0.34);ctx.strokeRect(4,4,AST_MW-8,AST_MH-8);
  ctx.lineWidth=2;ctx.strokeStyle=PAL.baseHi;ctx.strokeRect(1,1,AST_MW-2,AST_MH-2);
}
/* 航向轨迹 */
function drawHeading(){
  if(state!=="playing")return;
  var c=Math.cos(ship.a),s=Math.sin(ship.a);
  ctx.save();ctx.strokeStyle=shade(PAL.baseHi,0.55);ctx.lineWidth=2;ctx.setLineDash([3,6]);ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(ship.x+c*16,ship.y+s*16);ctx.lineTo(ship.x+c*44,ship.y+s*44);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
}
/* 目标环 */
function drawTarget(){
  if(state!=="playing"||!asteroids.length)return;
  var best=null,bd=1/0,i,dx,dy;
  for(i=0;i<asteroids.length;i++){dx=asteroids[i].x-ship.x;dy=asteroids[i].y-ship.y;var d=dx*dx+dy*dy;if(d<bd){bd=d;best=asteroids[i]}}
  if(!best)return;
  var r=best.r+8+Math.sin(elapsed*3)*1.6;
  ctx.save();ctx.strokeStyle=shade(PAL.danger,0.85);ctx.lineWidth=2;ctx.setLineDash([4,5]);
  ctx.beginPath();ctx.arc(best.x,best.y,r,0,TAU);ctx.stroke();ctx.restore();
}
/* 小行星 */
function drawAsteroids(){
  for(var i=0;i<asteroids.length;i++){
    var a=asteroids[i],n=a.verts.length,j;
    ctx.save();ctx.translate(a.x,a.y);
    ctx.save();ctx.globalAlpha=0.32;ctx.fillStyle=BLACK;
    ctx.beginPath();ctx.ellipse(3,5,a.r*0.92,a.r*0.72,0,0,TAU);ctx.fill();ctx.restore();
    ctx.rotate(a.rot);
    ctx.beginPath();
    for(j=0;j<n;j++){var ang=j/n*TAU,rr=a.r*a.verts[j];
      if(j===0)ctx.moveTo(Math.cos(ang)*rr,Math.sin(ang)*rr);
      else ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr);}
    ctx.closePath();
    ctx.save();ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=a.r*0.5;ctx.shadowOffsetY=a.r*0.22;
    var g=ctx.createRadialGradient(-a.r*0.34,-a.r*0.38,a.r*0.12,0,0,a.r*1.2);
    g.addColorStop(0,PAL.rockHi);g.addColorStop(0.45,PAL.rock1);g.addColorStop(1,PAL.rock2);
    ctx.fillStyle=g;ctx.fill();ctx.restore();
    ctx.lineWidth=Math.max(1.5,a.r*0.09);ctx.strokeStyle=colShade(PAL.rock2,-0.28);ctx.stroke();
    for(j=1;j<n;j+=3){
      var ca=j/n*TAU,cr=a.r*a.verts[j]*0.55,cx=Math.cos(ca)*cr,cy=Math.sin(ca)*cr;
      var rr2=a.r*(0.10+0.05*((j*7)%3));
      ctx.fillStyle=shade(PAL.rock2,0.5);ctx.beginPath();ctx.arc(cx,cy,rr2,0,TAU);ctx.fill();
      ctx.fillStyle=shade(PAL.rockHi,0.45);ctx.beginPath();ctx.arc(cx-rr2*0.3,cy-rr2*0.3,rr2*0.5,0,TAU);ctx.fill();
    }
    ctx.strokeStyle=shade(WHITE,0.32);ctx.lineWidth=Math.max(1,a.r*0.08);
    ctx.beginPath();ctx.arc(0,0,a.r*0.62,Math.PI*0.9,Math.PI*1.5);ctx.stroke();
    ctx.restore();
  }
}
/* 子弹 */
function drawBullets(){
  for(var i=0;i<bullets.length;i++){var b=bullets[i];
    ctx.strokeStyle=shade(PAL.bolt,0.45);ctx.lineWidth=2;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(b.px,b.py);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.save();ctx.shadowColor=shade(PAL.bolt,0.9);ctx.shadowBlur=8;
    var g=ctx.createRadialGradient(b.x-0.8,b.y-0.9,0.3,b.x,b.y,3.4);
    g.addColorStop(0,shade(WHITE,0.95));g.addColorStop(0.45,PAL.bolt);g.addColorStop(1,colShade(PAL.bolt,-0.3));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,2.8,0,TAU);ctx.fill();ctx.restore();}
}
/* 粒子：加色叠加 */
function drawParts(){
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<parts.length;i++){var p=parts[i],t=Math.max(0,p.life/p.max);
    ctx.globalAlpha=0.32*t;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.4,0,TAU);ctx.fill();
    ctx.globalAlpha=Math.min(1,t*1.25);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}
  ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;
}
/* 飞船 */
function drawShip(){
  if(state==="over")return;
  if(ship.invuln>0&&Math.floor(ship.invuln*8)%2===0)return;
  var bob=(state==="playing"&&!window.__gRM)?Math.sin(elapsed*2.2)*1.3:0;
  ctx.save();ctx.translate(ship.x,ship.y+bob);
  ctx.save();ctx.globalAlpha=0.3;ctx.fillStyle=BLACK;
  ctx.beginPath();ctx.ellipse(0,13,11,4.5,0,0,TAU);ctx.fill();ctx.restore();
  ctx.rotate(ship.a);
  if(thrIn&&state==="playing"){
    var fl=12+Math.random()*10;
    ctx.save();ctx.shadowColor=shade(PAL.flame2,0.85);ctx.shadowBlur=12;
    var fg=ctx.createLinearGradient(0,8,0,8+fl);
    fg.addColorStop(0,PAL.flame1);fg.addColorStop(1,PAL.flame2);
    ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(-5,8);ctx.lineTo(5,8);ctx.lineTo(0,8+fl);ctx.closePath();ctx.fill();
    ctx.restore();
    ctx.fillStyle=shade(WHITE,0.85);
    ctx.beginPath();ctx.moveTo(-2.4,8);ctx.lineTo(2.4,8);ctx.lineTo(0,8+fl*0.5);ctx.closePath();ctx.fill();
  }
  ctx.save();ctx.shadowColor="rgba(0,0,0,0.32)";ctx.shadowBlur=8;ctx.shadowOffsetY=3;
  var hg=ctx.createLinearGradient(0,-14,0,10);
  hg.addColorStop(0,PAL.shipHi);hg.addColorStop(0.45,PAL.ship1);hg.addColorStop(1,PAL.ship2);
  ctx.fillStyle=hg;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(-10,10);ctx.lineTo(0,5);ctx.lineTo(10,10);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.lineWidth=2;ctx.strokeStyle=colShade(PAL.ship2,-0.3);ctx.stroke();
  var cg=ctx.createRadialGradient(-1,-4,0.4,0,-2,4.2);
  cg.addColorStop(0,shade(WHITE,0.95));cg.addColorStop(0.5,PAL.bolt);cg.addColorStop(1,colShade(PAL.bolt,-0.35));
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,-2,3.2,0,TAU);ctx.fill();
  ctx.fillStyle=PAL.flame1;
  ctx.beginPath();ctx.arc(-9,9,1.4,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(9,9,1.4,0,TAU);ctx.fill();
  ctx.restore();
}
/* 得分浮字 */
function drawFloats(){
  for(var i=0;i<floats.length;i++){var f=floats[i],t=f.life/f.ttl,y=f.y-26*t;
    ctx.globalAlpha=Math.min(1,(1-t)*2.2);
    ctx.font="700 18px "+sysFont();ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.lineWidth=3;ctx.strokeStyle=shade(PAL.sky1,0.9);ctx.strokeText(f.txt,f.x,y);
    ctx.fillStyle=PAL.flame1;ctx.fillText(f.txt,f.x,y);}
  ctx.globalAlpha=1;
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!bgGrad)bgGradBuild();
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(OX,OY);ctx.scale(SC,SC);
  if(shakeT>0)ctx.translate((Math.random()-0.5)*shakeT*16,(Math.random()-0.5)*shakeT*16);
  ctx.beginPath();ctx.rect(0,0,AST_MW,AST_MH);ctx.clip();
  drawNebulas();drawStars();drawBase();drawHeading();drawAsteroids();drawTarget();
  drawBullets();drawParts();drawShip();drawBounds();drawFloats();
  ctx.restore();
  if(flashT>0){ctx.fillStyle=shade(PAL.danger,0.22);ctx.fillRect(0,0,W,H);}
}

/* ========== 主循环 ========== */
var lastT=performance.now();
function bumpStat(el){if(!el||window.__gRM)return;el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}
function findDestroyed(s){
  for(var i=0;i<s.length;i++){var a=s[i],j,f=0;
    for(j=0;j<asteroids.length;j++)if(asteroids[j]===a){f=1;break}
    if(!f)return a;}
  return null;
}
var pauseBtn=$("btnPause");
function syncPauseBtn(){
  if(pauseBtn.dataset.mode===state)return;
  pauseBtn.dataset.mode=state;
  pauseBtn.innerHTML=SW_ICON(state==="paused"?"play":"pause")+"<span>"+(state==="paused"?"继续":"暂停")+"</span>";
}
function frame(now){
  requestAnimationFrame(frame);
  var dt=(now-lastT)/1000;
  lastT=now;
  if(!(dt>0))dt=0;
  if(dt>0.05)dt=0.05;
  var snap=asteroids.slice();
  if(state==="playing"){readCtl();step(dt);}
  else{rotIn=0;thrIn=false;fireIn=false;brakeIn=false;}
  if(score>prevScore){   //得分浮字 + 记分轻弹
    var gone=findDestroyed(snap);
    if(gone)floats.push({x:gone.x,y:gone.y,txt:"+"+(score-prevScore),life:0,ttl:0.9});
    bumpStat(hScore.parentNode);
  }
  prevScore=score;
  if(lives<prevLives){shakeT=0.35;flashT=0.35}
  prevLives=lives;
  if(state!==prevState){   //过关 / 结束轻弹
    if(state==="clear")bumpStat(elClearScore.parentNode);
    else if(state==="over")bumpStat(elOverScore.parentNode);
    prevState=state;
  }
  var i;
  for(i=floats.length-1;i>=0;i--){var f=floats[i];f.life+=dt;if(f.life>=f.ttl)floats.splice(i,1);}
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt);
  if(flashT>0)flashT=Math.max(0,flashT-dt);
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove("show");}
  syncPauseBtn();
  draw();
}

/* ========== 尺寸 ========== */
function resize(){
  var r=stage.getBoundingClientRect();
  W=Math.max(1,r.width);H=Math.max(1,r.height);
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  SC=Math.min(W/AST_MW,H/AST_MH);
  OX=(W-AST_MW*SC)/2;
  OY=(H-AST_MH*SC)/2;
  bgGrad=null;
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",resize);

/* ========== 按钮 ========== */
$("btnStart").addEventListener("click",function(){startLevel(cur);});
$("btnRestart").addEventListener("click",function(){startLevel(cur);});
btnNext.addEventListener("click",function(){startLevel(cur<LEVELS.length-1?cur+1:0);});
$("btnResume").addEventListener("click",resumeGame);
$("btnPause").addEventListener("click",function(){
  if(state==="playing")pauseGame();
  else if(state==="paused")resumeGame();
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden)pauseGame();
});

/* ========== 启动 ========== */
function showStart(){
  elSBest.textContent=String(best);
  elSBestLv.textContent=String(bestLevel);
  elSCont.textContent=saveData.lv>0?("将从第 "+(Math.min(saveData.lv,LEVELS.length-1)+1)+" 关继续"):"共 "+LEVELS.length+" 关 · 清空全部波次即可过关";
  ovStart.classList.remove("hide");
}
/* 按钮文字前注入内联 SVG 图标 */
function paintIcons(){
  var els=document.querySelectorAll("[data-icon]"),i,el;
  for(i=0;i<els.length;i++){el=els[i];
    el.insertAdjacentHTML("afterbegin",SW_ICON(el.getAttribute("data-icon"),el.getAttribute("data-icon-style")||""));}
}
paintIcons();
resize();
updateHud();
showStart();
requestAnimationFrame(frame);
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
