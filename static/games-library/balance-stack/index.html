  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},

var DEFAULT_LEVELS_SRC=[{"name":"配重·01","weights":[2,2,1,4],"locked":[],"sol":[1,-2,-2,1],"difficulty":1},{"name":"配重·02","weights":[1,3,5,5],"locked":[-3],"sol":[1,3,-4,2],"difficulty":1},{"name":"配重·03","weights":[4,5,2,1],"locked":[],"sol":[2,0,-2,-4],"difficulty":1},{"name":"配重·04","weights":[1,5,2,3],"locked":[],"sol":[2,-1,3,-1],"difficulty":1},{"name":"配重·05","weights":[3,3,3,5],"locked":[2],"sol":[-2,3,-1,0],"difficulty":1},{"name":"配重·06","weights":[3,5,3,2],"locked":[2],"sol":[-1,-1,0,4],"difficulty":1},{"name":"配重·07","weights":[3,1,1,2],"locked":[-2],"sol":[1,-4,1,0],"difficulty":1},{"name":"配重·08","weights":[3,1,1,3],"locked":[-4],"sol":[2,4,-1,-3],"difficulty":2},{"name":"配重·09","weights":[5,4,5,5],"locked":[-4],"sol":[4,0,-3,-1],"difficulty":2},{"name":"配重·10","weights":[4,1,5,4],"locked":[1],"sol":[0,4,0,-1],"difficulty":2},{"name":"配重·11","weights":[4,5,5,2],"locked":[1],"sol":[-3,2,2,-4],"difficulty":2},{"name":"配重·12","weights":[2,5,3,4],"locked":[2],"sol":[-3,0,-2,3],"difficulty":2},{"name":"配重·13","weights":[5,5,5,3],"locked":[2],"sol":[-3,0,3,0],"difficulty":2},{"name":"配重·14","weights":[5,1,5,4],"locked":[-2],"sol":[0,1,-1,1],"difficulty":2},{"name":"配重·15","weights":[4,5,5,1,2],"locked":[-1,-2],"sol":[2,-3,0,1,3],"difficulty":3},{"name":"配重·16","weights":[2,1,1,5,4],"locked":[],"sol":[4,-2,-2,0,-1],"difficulty":3},{"name":"配重·17","weights":[3,4,2,4,4],"locked":[],"sol":[4,-2,4,1,-4],"difficulty":3},{"name":"配重·18","weights":[4,1,4,3,3],"locked":[-2,-4],"sol":[3,-3,0,0,-3],"difficulty":3},{"name":"配重·19","weights":[4,5,4,1,1],"locked":[2],"sol":[-3,0,3,-1,1],"difficulty":3},{"name":"配重·20","weights":[5,2,5,1,1],"locked":[0,-2],"sol":[1,1,-3,4,4],"difficulty":3},{"name":"配重·21","weights":[4,4,5,1,5],"locked":[1,3],"sol":[4,-2,-3,-3,2],"difficulty":3},{"name":"配重·22","weights":[2,4,5,5,4],"locked":[],"sol":[-4,-2,3,1,-1],"difficulty":4},{"name":"配重·23","weights":[4,3,2,1,5],"locked":[-2,0],"sol":[3,-4,2,1,-1],"difficulty":4},{"name":"配重·24","weights":[3,4,4,1,5],"locked":[3,4],"sol":[2,0,0,-1,-1],"difficulty":4},{"name":"配重·25","weights":[2,2,5,5,1],"locked":[3],"sol":[-1,-4,2,0,0],"difficulty":4},{"name":"配重·26","weights":[1,2,4,3,3],"locked":[-4,0],"sol":[1,2,1,-2,-1],"difficulty":4},{"name":"配重·27","weights":[1,2,2,3,5],"locked":[-1,-2],"sol":[-4,-4,1,0,2],"difficulty":4},{"name":"配重·28","weights":[1,4,4,3,1,3],"locked":[0,4],"sol":[3,-4,-1,3,2,2],"difficulty":5},{"name":"配重·29","weights":[3,5,4,2,1,2],"locked":[-3],"sol":[-1,1,0,2,-4,-1],"difficulty":5},{"name":"配重·30","weights":[4,1,5,4,2,1],"locked":[1],"sol":[-3,-1,3,-3,3,4],"difficulty":5},{"name":"配重·31","weights":[2,5,3,5,4,4],"locked":[],"sol":[3,0,-3,-1,3,-1],"difficulty":5},{"name":"配重·32","weights":[3,3,1,2,1,3],"locked":[0,4],"sol":[3,1,-2,-1,-2,-2],"difficulty":5},{"name":"配重·33","weights":[2,1,3,5,4,4],"locked":[],"sol":[-4,-2,3,1,3,-4],"difficulty":5},{"name":"配重·34","weights":[5,1,4,4,3,5],"locked":[],"sol":[-4,-1,3,3,4,-3],"difficulty":5},{"name":"配重·35","weights":[5,3,5,4,3,5],"locked":[-3],"sol":[3,1,3,-4,-4,-1],"difficulty":6},{"name":"配重·36","weights":[5,3,5,2,4,3],"locked":[],"sol":[1,-2,-2,4,3,-3],"difficulty":6},{"name":"配重·37","weights":[3,2,4,3,5,3],"locked":[0],"sol":[3,4,-1,-3,-2,2],"difficulty":6},{"name":"配重·38","weights":[4,2,1,2,4,2],"locked":[],"sol":[0,-4,-2,4,-1,3],"difficulty":6},{"name":"配重·39","weights":[4,4,5,4,3,5],"locked":[4,1],"sol":[-4,-3,3,3,2,-1],"difficulty":6},{"name":"配重·40","weights":[5,2,4,4,5,3],"locked":[4],"sol":[-3,1,2,3,1,-4],"difficulty":6}];
/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="balance-stack",SAVE_KEY="sw.balancestack.v1";
var DEFAULT_LEVELS=DEFAULT_LEVELS_SRC;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  levelOk=new Array(LEVELS.length);
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
var levelOk=new Array(LEVELS.length);
function verifyPending(){   // 后台逐关复核（分片避免卡顿）：坏关禁选、当前关即时告警
  var i=0;
  function step(){
    var t0=Date.now();
    while(i<LEVELS.length&&Date.now()-t0<40){
      if(levelOk[i]===undefined)levelOk[i]=verifyLevel(LEVELS[i]);
      i++;
    }
    if(i<LEVELS.length)setTimeout(step,0);
    else if(typeof renderLevels==="function")renderLevels();
  }
  setTimeout(step,0);
}
/* ---------- 存档（本地 + 账号双写） ---------- */

function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}

function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;

    if(!res||!res.stateJson)return;

      var remote=JSON.parse(res.stateJson);

      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}

}

  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡

    var list=parseDbLevels(res);

      if(typeof resize==="function")resize();
    }

}

/* ---------- 结构校验 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Array.isArray(d.weights)||d.weights.length<4||d.weights.length>6)return false;
  for(var i=0;i<d.weights.length;i++)if(!Number.isInteger(d.weights[i])||d.weights[i]<1||d.weights[i]>5)return false;
  if(!Array.isArray(d.locked)||d.locked.length>2)return false;
  var lockSet={};
  for(var j=0;j<d.locked.length;j++){
    if(!Number.isInteger(d.locked[j])||d.locked[j]<-4||d.locked[j]>4||lockSet[d.locked[j]])return false;
    lockSet[d.locked[j]]=1;
  }
  if(!Array.isArray(d.sol)||d.sol.length!==d.weights.length)return false;
  var sum=0;
  for(var k=0;k<d.sol.length;k++){
    if(!Number.isInteger(d.sol[k])||d.sol[k]<-4||d.sol[k]>4||lockSet[d.sol[k]])return false;
    sum+=d.weights[k]*d.sol[k];
  }
  return sum===0;
}
/* ---------- 独立验证器：剩余剪枝回溯（与交互逻辑分离） ---------- */
function bsPositions(L){
  var out=[];
  for(var p=-4;p<=4;p++){
    var isLock=false;
    for(var q=0;q<L.locked.length;q++)if(L.locked[q]===p)isLock=true;
    if(!isLock)out.push(p);
  }
  return out;
}
function verifyLevel(L){
  if(!validLevelData(L))return false;
  var pos=bsPositions(L);
  if(pos.length<L.weights.length)return false;
  var wts=L.weights.slice().sort(function(a,b){return b-a});   // 与参考解不同顺序搜索
  var suffix=new Array(wts.length+1).fill(0),maxAbs=4;
  for(var i=wts.length-1;i>=0;i--)suffix[i]=suffix[i+1]+wts[i]*maxAbs;
  var ok=false;
  function bt(idx,sum,used){
    if(ok)return;
    if(idx===wts.length){if(sum===0)ok=true;return}
    if(Math.abs(sum)>suffix[idx])return;
    for(var z=0;z<pos.length;z++){
      if(used[z])continue;
      used[z]=1;
      bt(idx+1,sum+wts[idx]*pos[z],used);
      used[z]=0;
      if(ok)return;
    }
  }
  bt(0,0,new Array(pos.length).fill(0));
  return ok;
}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),success:v("--g-success"),warning:v("--g-warning"),water:v("--g-water"),
    beam:v("--g-st-beam"),beam2:v("--g-st-beam2"),weight:v("--g-st-weight")};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,at=[],history=[],selW=-1,cur=0,done=false;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=230,dpr=1;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* ---------- 关卡 ---------- */
function loadLevel(n2){
  lv=Math.max(0,Math.min(n2,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return}
  at=new Array(L.weights.length).fill(null);
  history=[];selW=-1;done=false;
  while(L.locked.indexOf(cur)>=0)cur=(cur+9)%9-4;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  var ok=verifyLevel(L);   // 加载复核
  if(!ok)say("警告：内嵌验证器判定本关无法配平（数据异常）");
  else say("点托盘里的砝码选中，再点横梁钩位放置");
  renderTray();updStats();resize();
}
function torque(){
  var s=0;
  for(var i=0;i<at.length;i++)if(at[i]!==null)s+=L.weights[i]*at[i];
  return s;
}
function placedCount(){var c=0;for(var i=0;i<at.length;i++)if(at[i]!==null)c++;return c}
function updStats(){
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stPut").textContent=placedCount()+" / "+L.weights.length;
  var t=torque();
  $("stTor").textContent=t;
  $("stTor").className="val"+(t!==0?" low":"");
  $("btnUndo").disabled=!history.length||done;
}
function renderTray(){
  var tray=$("tray");tray.innerHTML="";
  for(var i=0;i<L.weights.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.type="button";
      b.className="btn wt"+(selW===i?" sel":"")+(at[i]!==null?" used":"");
      b.textContent=L.weights[i];
      b.addEventListener("click",function(){selectW(i)});
      tray.appendChild(b);
    })(i);
  }
}
function selectW(i){
  if(done)return;
  if(at[i]!==null){takeOff(i);return}
  selW=selW===i?-1:i;
  say(selW>=0?"砝码 "+L.weights[i]+" 已选中，点钩位放置":"已取消选中");
  renderTray();
}
function placeAt(pos){
  if(done)return;
  if(L.locked.indexOf(pos)>=0){say("这个钩位锁死了");return}
  var occ=-1;
  for(var i=0;i<at.length;i++)if(at[i]===pos)occ=i;
  if(occ>=0&&selW<0){takeOff(occ);return}
  if(selW<0){say("先从托盘选一个砝码");return}
  if(occ>=0){say("钩位上已有砝码，先点它取下");return}
  history.push({w:selW,prev:at[selW]});
  at[selW]=pos;
  selW=-1;
  renderTray();updStats();checkWin();
}
function takeOff(i){
  if(done||at[i]===null)return;
  history.push({w:i,prev:at[i]});
  at[i]=null;
  selW=-1;
  renderTray();updStats();say("砝码已收回");
}
function undo(){
  if(!history.length||done)return;
  var hh=history.pop();
  at[hh.w]=hh.prev;
  selW=-1;
  renderTray();updStats();say("撤销一步");
}
function hint(){
  if(done)return;
  // 用参考解补放一个砝码（若参考位被占则提示）
  for(var i=0;i<L.weights.length;i++){
    if(at[i]!==null)continue;
    var p=L.sol[i],occ=false;
    for(var q=0;q<at.length;q++)if(at[q]===p)occ=true;
    if(occ)continue;
    history.push({w:i,prev:null});
    at[i]=p;
    renderTray();updStats();checkWin();
    say("提示：砝码 "+L.weights[i]+" 挂在 "+p+" 号钩位");
    return;
  }
  say("按参考解已就位，检查力矩");
}
function checkWin(){
  if(done)return;
  if(placedCount()<L.weights.length)return;
  if(torque()!==0)return;
  done=true;
  save.done[lv]=true;
  if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:placedCount()}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"配平成功！";
  $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成 · "+L.weights.length+" 个砝码力矩归零"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
/* ---------- 绘制 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(wCss);H=230;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function beamGeom(){
  var bw=Math.min(W-70,420);
  return {cx:W/2,cy:150,bw:bw};
}
function draw(){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  if(!L)return;
  var g=beamGeom();
  var t=torque();
  var ang=Math.max(-0.22,Math.min(0.22,t/40));
  var step=g.bw/9;
  // 支点三角
  ctx.fillStyle=PAL.beam2;   // 素材支座
  ctx.beginPath();
  ctx.moveTo(g.cx,g.cy-14);ctx.lineTo(g.cx-22,g.cy+34);ctx.lineTo(g.cx+22,g.cy+34);
  ctx.closePath();ctx.fill();
  // 地面
  ctx.fillStyle=PAL.surface2;
  ctx.fillRect(20,g.cy+34,W-40,6);
  // 横梁（旋转）
  ctx.save();
  ctx.translate(g.cx,g.cy);
  ctx.rotate(ang);
  ctx.fillStyle=PAL.beam;   // 素材横梁
  ctx.beginPath();
  ctx.roundRect?ctx.roundRect(-g.bw/2,-8,g.bw,16,6):ctx.rect(-g.bw/2,-8,g.bw,16);
  ctx.fill();
  ctx.strokeStyle=PAL.beam2;ctx.lineWidth=2;
  ctx.beginPath();
  ctx.roundRect?ctx.roundRect(-g.bw/2,-8,g.bw,16,6):ctx.rect(-g.bw/2,-8,g.bw,16);
  ctx.stroke();
  for(var p=-4;p<=4;p++){
    var px=p*step;
    var locked=L.locked.indexOf(p)>=0;
    ctx.fillStyle=locked?PAL.danger:PAL.deep;
    ctx.beginPath();ctx.arc(px,-8,4.5,0,7);ctx.fill();
    if(!window.__gRM){
      ctx.strokeStyle=PAL.muted;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(px,-4);ctx.lineTo(px,10);ctx.stroke();
    }
    // 光标
    if(cur===p&&!done){
      ctx.strokeStyle=PAL.warning;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(px,-8,11,0,7);ctx.stroke();
    }
    // 已放砝码
    for(var q=0;q<at.length;q++){
      if(at[q]!==p)continue;
      var r=10+L.weights[q]*2;
      ctx.fillStyle=PAL.weight;   // 素材砝码
      ctx.beginPath();ctx.moveTo(px-r,10);ctx.lineTo(px+r,10);ctx.lineTo(px+r*0.7,10+r);ctx.lineTo(px-r*0.7,10+r);ctx.closePath();ctx.fill();
      ctx.strokeStyle=PAL.border;ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle=PAL.text;
      ctx.font="700 14px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(String(L.weights[q]),px,10+r*0.55);
    }
  }
  ctx.restore();
  // 力矩读数
  ctx.fillStyle=t===0?PAL.success:PAL.warning;
  ctx.font="700 14px sans-serif";ctx.textAlign="center";ctx.textBaseline="top";
  ctx.fillText("力矩 "+t+(t===0?" · 平衡":t>0?" · 右沉":" · 左沉"),g.cx,g.cy+48);
  requestAnimationFrame(draw);
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var r=cv.getBoundingClientRect();
  var g=beamGeom();
  var step=g.bw/9;
  var x=e.clientX-r.left-g.cx,y=e.clientY-r.top-(g.cy-8);
  // 点击钩位（近似未旋转位置）
  var p=Math.round(x/step);
  if(p<-4||p>4||Math.abs(y)>60)return;
  if(L.locked.indexOf(p)>=0){say("这个钩位锁死了");return}
  var occ=-1;
  for(var i=0;i<at.length;i++)if(at[i]===p)occ=i;
  if(occ>=0){takeOff(occ);return}
  if(selW>=0){placeAt(p)}
  else {cur=p;say("先从托盘选砝码，或点已有砝码取下")}
  e.preventDefault();
});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){at=new Array(L.weights.length).fill(null);history=[];selW=-1;renderTray();updStats();say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="6"){
    var i=+k-1;
    if(i<L.weights.length)selectW(i);
    e.preventDefault();
  }else if(k==="ArrowLeft"){cur=Math.max(-4,cur-1);e.preventDefault()}
  else if(k==="ArrowRight"){cur=Math.min(4,cur+1);e.preventDefault()}
  else if(k==="Enter"){
    if(L.locked.indexOf(cur)>=0){say("这个钩位锁死了")}
    else{
      var occ=-1;
      for(var q=0;q<at.length;q++)if(at[q]===cur)occ=q;
      if(occ>=0)takeOff(occ);
      else if(selW>=0)placeAt(cur);
      else say("先按 1-6 选砝码");
    }
    e.preventDefault();
  }
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){at=new Array(L.weights.length).fill(null);history=[];selW=-1;renderTray();updStats();say("本关已重置")}
});
function renderLevels(){}
/* ---------- 启动 ---------- */
var running=true;
document.addEventListener("visibilitychange",function(){
  if(document.hidden)running=false;
  else if(!running){running=true;requestAnimationFrame(draw)}
});
palLoad();loadLevel(save.lv);
requestAnimationFrame(draw);
verifyPending();syncLevelsFromServer();syncSaveFromServer();
window.addEventListener("resize",resize);

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
