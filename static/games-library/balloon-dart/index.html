<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>飞镖爆球</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材（st- 前缀：sky1/sky2/cloud/room）*/
  :root {
    --g-bg:#F5F6F3; --g-surface:#FFFFFF; --g-surface2:#EFF1EE;
    --g-primary:#2D9B6A; --g-primary-deep:#17734A;--g-btn-primary:#17734A; --g-primary-soft:#E8F6EF; --g-on-primary:#FFFFFF; --g-on-soft:#0B3625;
    --g-text:#1C1C1E; --g-muted:#6B6E73; --g-faint:#A9AEA9; --g-border:#E6E9E6; --g-hairline:#EFF1EE;
    --g-danger:#A83850; --g-warning:#9A6210; --g-success:#17734A; --g-water:#4A9FD4;
    --g-scrim:rgba(245,246,243,.9);
    --g-shadow:0 2px 12px rgba(20,40,30,.05);
    --g-radius:16px; --g-radius-btn:14px; --g-radius-inner:12px; --g-gap:16px;
    --g-st-sky1:#DCEEF6; --g-st-sky2:#F2FAFD; --g-st-room:#E7DCC8;
    color-scheme:light;
  }
  :root[data-theme=dark] {
    --g-bg:#141614; --g-surface:#1D201E; --g-surface2:#262A27;
    --g-primary-deep:#5BC894; --g-primary-soft:#1D3229; --g-on-soft:#B9E8CF;
    --g-text:#E6E9E6; --g-muted:#A9AEA9; --g-faint:#7E837D; --g-border:#2C312D; --g-hairline:#262A27;
    --g-danger:#DB7186; --g-warning:#E2A44E; --g-success:#4ADE6E; --g-water:#6BB4DE;
    --g-scrim:rgba(20,22,20,.9);
    --g-shadow:0 2px 12px rgba(0,0,0,.28);
    --g-st-sky1:#16232B; --g-st-sky2:#0F1518; --g-st-room:#3B3629;
    color-scheme:dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
  .scores { display: flex; gap: 8px; flex: 1; }
  .score-box {
    background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 12px;
    flex: 1; min-width: 0; padding: 5px 8px; text-align: center; line-height: 1.3;
  }
  .score-box .label { display: block; font-size: 12px; opacity: .85; white-space: nowrap; }
  .score-box .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .hint { margin: 0; font-size: 14px; color: var(--g-muted); }
  .btn {
    min-height: 44px; padding: 0 18px;
    border: 0; border-radius: 10px;
    background: var(--g-btn-primary); color: var(--g-on-primary);
    font-size: 16px; font-weight: 600; font-family: inherit;
    cursor: pointer; touch-action: manipulation;
  }
  .btn:active { opacity: .85; }
  .stage { position: relative; }
  canvas {
    display: block; width: 100%; aspect-ratio: 390 / 520; height: auto;
    background: var(--g-st-sky2);
    border: 1px solid var(--g-border); border-radius: 12px;
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0; border-radius: 12px;
    background: var(--g-scrim);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 16px; text-align: center;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .ov-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--g-primary-deep); }
  .ov-sub { margin: 0 0 12px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .overlay .btn { min-width: 132px; }
  .foot { margin: 14px 0 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="scores">
      <div class="score-box"><span class="label">分数</span><span class="val" id="score">0</span></div>
      <div class="score-box"><span class="label">最高分</span><span class="val" id="best">0</span></div>
      <div class="score-box"><span class="label">时间</span><span class="val" id="time">60</span></div>
    </div>
  </header>
  <div class="toolbar">
    <p class="hint">瞄准气球串，一镖连爆加成</p>
    <button class="btn" id="mainBtn">开始游戏</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="飞镖爆球游戏画面"></canvas>
    <div class="overlay" role="dialog" aria-modal="true" id="overlay">
      <p class="ov-title" id="ovTitle" role="status" aria-live="assertive">准备开始</p>
      <p class="ov-sub" id="ovSub">移动准心投向气球，一镖穿透越多连爆越高</p>
      <button class="btn" id="ovBtn">开始游戏</button>
    </div>
  </div>
  <p class="foot">操作：拖动瞄准 · 点击 / 空格投镖 · ←→ 微调准心 · 60 秒限时</p>
</div>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);}
  };
})();

/* ========== 画布与调色板 ========== */
var NW=390,NH=520,W=390,H=520,S=1,offX=0,offY=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),border:v("--g-border"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),danger:v("--g-danger"),warning:v("--g-warning"),
    water:v("--g-water"),success:v("--g-success"),onPrimary:v("--g-on-primary"),
    sky1:v("--g-st-sky1"),sky2:v("--g-st-sky2"),room:v("--g-st-room")};
}
window.__gOnTheme=function(){palLoad();grads=null;};
palLoad();
var grads=null;
function buildGrads(){grads=ctx.createLinearGradient(0,0,0,NH);grads.addColorStop(0,PAL.sky1);grads.addColorStop(1,PAL.sky2);}

/* ========== 音效 ========== */
var AC=null;
function beep(f,d,type,vol){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=f;g.gain.value=vol||0.05;
    o.connect(g);g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(d||0.1));
    o.start();o.stop(AC.currentTime+(d||0.1)+0.02);
  }catch(e){}
}

/* ========== 存档（裸最高分；本地 + 账号双写） ========== */
var KEY="sw.balloondart.v1";
var store={
  get:function(k){try{return window.localStorage.getItem(k)}catch(e){return null}},
  set:function(k,val){try{window.localStorage.setItem(k,val)}catch(e){}}
};
var best=parseInt(store.get(KEY)||"0",10)||0;
document.getElementById("best").textContent=best;
function persistBest(){
  store.set(KEY,String(best));
  if(GB.available)GB.saveState("balloon-dart",String(best)).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("balloon-dart").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rb=parseInt(JSON.parse(res.stateJson),10)||0;
      if(rb>best){best=rb;persistBest();document.getElementById("best").textContent=best;}
    }catch(e){}
  }).catch(function(){});
}

/* ========== 状态 ========== */
var ROUND=60,DART_V=560,GRAV=300;
var balloons=[],darts=[],parts=[],floats=[];
var score=0,maxChain=0,timeLeft=ROUND,spawnT=0,clock=0;
var state="ready";
var aim={x:NW*0.7,y:NH*0.35};
var LX=NW/2,LY=NH-26;
var keys={left:false,right:false};
var scoreEl=document.getElementById("score"),timeEl=document.getElementById("time");
var overlayEl=document.getElementById("overlay");
var ovTitle=document.getElementById("ovTitle"),ovSub=document.getElementById("ovSub");
var ovBtn=document.getElementById("ovBtn"),mainBtn=document.getElementById("mainBtn");

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rand(a,b){return a+Math.random()*(b-a)}
function showOverlay(t,s,b){ovTitle.textContent=t;ovSub.textContent=s;ovBtn.textContent=b;overlayEl.classList.add("show")}
function hideOverlay(){overlayEl.classList.remove("show")}

var BAL_COLORS=["primary","water","danger","warning","success"];
function spawnString(){
  var prog=clamp(clock/ROUND,0,1);
  var fromLeft=Math.random()<0.45;
  var n=2+((Math.random()*3)|0);
  var y0=rand(46,250),vy=rand(-8,10),vx=(fromLeft?1:-1)*rand(55,85+prog*95);
  var x0=fromLeft?-24:NW+24;
  var ci=(Math.random()*BAL_COLORS.length)|0;
  for(var i=0;i<n;i++){
    balloons.push({x:x0,y:y0+i*36,vx:vx,vy:vy,r:15,c:BAL_COLORS[(ci+i)%BAL_COLORS.length],
      ph:rand(0,6.28),dead:false});
  }
}
function resetRound(){
  balloons=[];darts=[];parts=[];floats=[];
  score=0;maxChain=0;timeLeft=ROUND;spawnT=0.4;clock=0;
  scoreEl.textContent="0";timeEl.textContent=String(ROUND);
  aim={x:NW*0.68,y:NH*0.35};
}
function startGame(){resetRound();state="running";hideOverlay();mainBtn.textContent="暂停";}

function endRound(){
  var isRecord=score>best&&score>0;
  if(isRecord){best=score;persistBest();document.getElementById("best").textContent=best;}
  if(GB.available)GB.reportScore("balloon-dart",{metricValue:best,metricExtra:maxChain}).catch(function(){});
  var extra=maxChain>0?" · 最高连爆 x"+maxChain:"";
  return (isRecord?" · 新纪录":"")+extra;
}
function finish(){
  state="over";
  showOverlay("时间到","得分 "+score+endRound(),"再来一局");
  mainBtn.textContent="再来一局";
}
function primary(){
  if(state==="running"){
    state="paused";showOverlay("已暂停","休息一下，随时继续","继续");mainBtn.textContent="继续";
  }else if(state==="paused"){
    state="running";hideOverlay();mainBtn.textContent="暂停";
  }else startGame();
}

/* ========== 更新 ========== */
function addFloat(x,y,txt,c){floats.push({x:x,y:y,txt:txt,c:c,life:0.8,max:0.8});}
function puff(x,y,c,n){
  for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:rand(-130,130),vy:rand(-160,60),r:rand(2,4),life:rand(0.25,0.55),max:0.55,c:c});
}
function throwDart(){
  if(state!=="running")return;
  var dx=aim.x-LX,dy=aim.y-LY,d=Math.sqrt(dx*dx+dy*dy)||1;
  darts.push({x:LX,y:LY,vx:dx/d*DART_V,vy:dy/d*DART_V,chain:0});
  beep(600,0.06,"square",0.04);
}
function popAt(b,chainN){
  b.dead=true;
  var gain=10*chainN;
  score+=gain;
  maxChain=Math.max(maxChain,chainN);
  scoreEl.textContent=String(score);
  var col=PAL[b.c]||PAL.primary;
  puff(b.x,b.y,col,10);
  addFloat(b.x,b.y-6,"+"+gain+(chainN>1?" 连爆x"+chainN:""),chainN>1?PAL.warning:PAL.deep);
  beep(500+chainN*140,0.09,"triangle",0.05);
}
function step(dt){
  clock+=dt;
  timeLeft-=dt;
  var tl=Math.max(0,Math.ceil(timeLeft));
  timeEl.textContent=String(tl);
  if(timeLeft<=0){finish();return;}
  var prog=clamp(clock/ROUND,0,1);
  spawnT-=dt;
  if(spawnT<=0){spawnString();spawnT=rand(1.15,1.7)-prog*0.55;}
  // 气球漂移（水平行进 + 正弦上下浮动）
  for(var i=balloons.length-1;i>=0;i--){
    var b=balloons[i];
    if(b.dead){balloons.splice(i,1);continue;}
    b.x+=b.vx*dt;
    b.y+=Math.sin(clock*1.7+b.ph)*14*dt+b.vy*dt;
  }
  // 出界清理
  for(var k=balloons.length-1;k>=0;k--){
    var w=balloons[k];
    if(w.x<-70||w.x>NW+70||w.y<-40||w.y>NH)balloons.splice(k,1);
  }
  // 飞镖运动 + 穿透判定
  for(var m=darts.length-1;m>=0;m--){
    var d=darts[m];
    var steps=3,h=dt/steps;
    for(var s=0;s<steps;s++){
      d.vy+=GRAV*h;
      d.x+=d.vx*h;d.y+=d.vy*h;
      for(var u=0;u<balloons.length;u++){
        var bb=balloons[u];
        if(bb.dead)continue;
        var ex=bb.x-d.x,ey=bb.y-d.y;
        if(ex*ex+ey*ey<(bb.r+5)*(bb.r+5)){
          d.chain++;
          popAt(bb,d.chain);
        }
      }
      if(d.x<-30||d.x>NW+30||d.y<-30||d.y>NH+30)break;
    }
    if(d.x<-30||d.x>NW+30||d.y<-30||d.y>NH+30)darts.splice(m,1);
  }
  // 粒子与浮字
  for(var p=parts.length-1;p>=0;p--){
    var pt=parts[p];
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=420*dt;pt.life-=dt;
    if(pt.life<=0)parts.splice(p,1);
  }
  for(var f=floats.length-1;f>=0;f--){
    var fl=floats[f];
    fl.y-=36*dt;fl.life-=dt;
    if(fl.life<=0)floats.splice(f,1);
  }
  // 键盘微调准心（沿发射点圆弧旋转，右旋顺时针）
  if(keys.left||keys.right){
    var ang=Math.atan2(aim.y-LY,aim.x-LX)+(keys.right?1.7:-1.7)*dt;
    ang=clamp(ang,-Math.PI+0.18,-0.18);
    var R=Math.sqrt((aim.x-LX)*(aim.x-LX)+(aim.y-LY)*(aim.y-LY))||170;
    aim.x=LX+Math.cos(ang)*R;
    aim.y=LY+Math.sin(ang)*R;
  }
}

/* ========== 绘制 ========== */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawBalloon(b){
  var bob=Math.sin(clock*1.7+b.ph)*3;
  var x=b.x,y=b.y+bob;
  // 球绳
  ctx.strokeStyle=PAL.muted;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(x,y+b.r);ctx.quadraticCurveTo(x+4,y+b.r+10,x,y+b.r+20);ctx.stroke();
  ctx.fillStyle=PAL[b.c]||PAL.primary;
  ctx.beginPath();ctx.ellipse(x,y,b.r*0.86,b.r,0,0,6.3);ctx.fill();
  ctx.strokeStyle=PAL.deep;ctx.lineWidth=1.2;ctx.stroke();
  // 高光（恒白，素材例外）
  ctx.fillStyle="rgba(255,255,255,.5)";
  ctx.beginPath();ctx.ellipse(x-b.r*0.3,y-b.r*0.34,3.4,5,-0.5,0,6.3);ctx.fill();
}
function drawDart(d){
  var ang=Math.atan2(d.vy,d.vx);
  ctx.save();ctx.translate(d.x,d.y);ctx.rotate(ang);
  ctx.strokeStyle=PAL.text;ctx.lineWidth=2.4;
  ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(6,0);ctx.stroke();
  ctx.fillStyle=PAL.danger;
  ctx.beginPath();ctx.moveTo(6,-3.4);ctx.lineTo(13,0);ctx.lineTo(6,3.4);ctx.closePath();ctx.fill();
  ctx.strokeStyle=PAL.muted;ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(-11,-3);ctx.lineTo(-15,-6);ctx.moveTo(-11,3);ctx.lineTo(-15,6);ctx.stroke();
  ctx.restore();
}
function drawAim(){
  var dx=aim.x-LX,dy=aim.y-LY,d=Math.sqrt(dx*dx+dy*dy)||1;
  // 虚线弹道（含重力坠差的粗略前段）
  ctx.strokeStyle=PAL.faint;ctx.lineWidth=1.6;
  ctx.setLineDash([5,6]);
  ctx.beginPath();ctx.moveTo(LX,LY);
  var px=LX,py=LY,vx=dx/d*560,vy=dy/d*560;
  for(var i=0;i<12;i++){
    vy+=300*0.026;px+=vx*0.026;py+=vy*0.026;
    ctx.lineTo(px,py);
    if(py>NH)break;
  }
  ctx.stroke();
  ctx.setLineDash([]);
  // 准心
  ctx.strokeStyle=PAL.danger;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(aim.x,aim.y,9,0,6.3);ctx.stroke();
  ctx.beginPath();ctx.moveTo(aim.x-13,aim.y);ctx.lineTo(aim.x-5,aim.y);
  ctx.moveTo(aim.x+5,aim.y);ctx.lineTo(aim.x+13,aim.y);
  ctx.moveTo(aim.x,aim.y-13);ctx.lineTo(aim.x,aim.y-5);
  ctx.moveTo(aim.x,aim.y+5);ctx.lineTo(aim.x,aim.y+13);
  ctx.stroke();
}
function drawLauncher(){
  ctx.fillStyle=PAL.room;
  rr(LX-16,NH-22,32,14,6);ctx.fill();
  ctx.strokeStyle=PAL.deep;ctx.lineWidth=3;ctx.lineCap="round";
  ctx.beginPath();ctx.arc(LX,NH-18,13,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(offX,offY);ctx.scale(S,S);
  if(!grads)buildGrads();
  ctx.fillStyle=grads;ctx.fillRect(0,0,NW,NH);
  // 地台
  ctx.fillStyle=PAL.room;
  ctx.fillRect(0,NH-10,NW,10);
  for(var i=0;i<balloons.length;i++)drawBalloon(balloons[i]);
  drawAim();
  drawLauncher();
  for(var m=0;m<darts.length;m++)drawDart(darts[m]);
  for(var p=0;p<parts.length;p++){
    var pt=parts[p];
    ctx.globalAlpha=Math.max(0,pt.life/pt.max);
    ctx.fillStyle=pt.c;
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,6.3);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.font="700 18px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  for(var f=0;f<floats.length;f++){
    var fl=floats[f];
    ctx.globalAlpha=Math.max(0,fl.life/fl.max);
    ctx.fillStyle=fl.c;
    ctx.fillText(fl.txt,fl.x,fl.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

/* ========== 输入 ========== */
function toNominal(ev){
  var r=cv.getBoundingClientRect();
  return{x:(ev.clientX-r.left-offX)/S,y:(ev.clientY-r.top-offY)/S};
}
var downPos=null;
cv.addEventListener("pointerdown",function(ev){
  var p=toNominal(ev);
  aim.x=clamp(p.x,10,NW-10);aim.y=clamp(p.y,10,NH-60);
  downPos={x:p.x,y:p.y,t:Date.now()};
  ev.preventDefault();
});
cv.addEventListener("pointermove",function(ev){
  var p=toNominal(ev);
  aim.x=clamp(p.x,10,NW-10);aim.y=clamp(p.y,10,NH-60);
  ev.preventDefault();
});
cv.addEventListener("pointerup",function(ev){
  if(downPos&&state==="running")throwDart();
  downPos=null;
  ev.preventDefault();
});
cv.addEventListener("pointercancel",function(){downPos=null;});

window.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowLeft"){e.preventDefault();keys.left=true;}
  else if(k==="ArrowRight"){e.preventDefault();keys.right=true;}
  else if(k===" "||k==="Enter"){e.preventDefault();if(state==="running")throwDart();else primary();}
});
window.addEventListener("keyup",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowLeft")keys.left=false;
  else if(k==="ArrowRight")keys.right=false;
});

document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running"){state="paused";showOverlay("已暂停","回到游戏继续投镖","继续");mainBtn.textContent="继续";}
});

/* ========== 主循环与启动 ========== */
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));
  H=Math.max(320,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);
  offX=(W-NW*S)/2;offY=(H-NH*S)/2;
}
window.addEventListener("resize",resize);

var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.033,(ts-last)/1000||0);
  last=ts;
  if(state==="running")step(dt);
  draw();
}

mainBtn.addEventListener("click",function(e){primary();e.currentTarget.blur();});
ovBtn.addEventListener("click",function(e){primary();e.currentTarget.blur();});

resize();
resetRound();
showOverlay("准备开始","移动准心投向气球，一镖穿透越多连爆越高","开始游戏");
syncSaveFromServer();
requestAnimationFrame(frame);
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
