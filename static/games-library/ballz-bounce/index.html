.btn{min-height:48px;padding:0 16px;border:0;border-radius:var(--g-radius-btn);background:linear-gradient(180deg,var(--g-primary),var(--g-btn-primary));color:var(--g-on-primary);font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--g-shadow);transition:transform .14s ease-out,box-shadow .16s ease-out,filter .16s ease-out}

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效；同时压 animation-delay，否则错落入场会变成整体延迟后闪现（动效层指令，不受 §4 主题层 matchMedia 禁令约束） */

window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/*BB-ENGINE-BEGIN*/
/* 弹球砖块引擎：固定步长纯反弹物理（无重力）、回合制发射、砖阵下压、道具球。
   逻辑坐标世界 360×540，所有随机来自关卡种子（确定性）。 */
var BB={
  NW:360,NH:540,GAP:4,TOPY:12,BRICKH:26,ROWH:30,DANGER:11,ROWS:12,
  BALLR:5,SPEED:460,STEP:2,AIMMAX:1.308996939,MAXSTEPS:6000,
  LX:180,LY:516,
  brickW:function(cols){return (this.NW-(cols+1)*this.GAP)/cols;},
  rect:function(cols,c,r){
    var w=(this.NW-(cols+1)*this.GAP)/cols;
    return {x:this.GAP+c*(w+this.GAP),y:this.TOPY+r*this.ROWH,w:w,h:this.BRICKH};
  },
  dangerY:function(){return this.TOPY+this.DANGER*this.ROWH;},
  bottomOf:function(r){return this.TOPY+r*this.ROWH+this.BRICKH;}
};
function bbRand(st){
  st.rs=(st.rs+0x6D2B79F5)|0;
  var t=Math.imul(st.rs^(st.rs>>>15),1|st.rs);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;
}
function bbBuildState(level){
  if(!level||typeof level!=="object")return null;
  var cols=level.cols,r,i,c;
  var hp=[],tp=[];
  for(r=0;r<BB.ROWS;r++){
    var hrow=[],trow=[];
    for(c=0;c<cols;c++){hrow.push(0);trow.push(0);}
    hp.push(hrow);tp.push(trow);
  }
  var list=level.bricks;
  if(!Array.isArray(list)||!list.length)return null;
  for(i=0;i<list.length;i++){
    var b=list[i];
    if(!Array.isArray(b)||b.length<3)return null;
    c=b[0];r=b[1];
    if(c<0||c>=cols||r<0||r>=BB.ROWS)return null;
    hp[r][c]=b[2];
    tp[r][c]=b.length>3?b[3]:0;
  }
  var st={cols:cols,rows:level.rows,hp:hp,tp:tp,rc:[],lowest:-1,
    balls:level.balls,target:level.target,turn:1,score:0,pending:0,
    seed:level.seed>>>0,rs:level.seed>>>0,fill:level.fill,power:level.power,hpCap:level.hpCap,
    over:false,won:false,lost:false,reason:""};
  bbRecalc(st);
  return st;
}
function bbClone(st){
  var hp=[],tp=[],r;
  for(r=0;r<st.hp.length;r++){hp.push(st.hp[r].slice());tp.push(st.tp[r].slice());}
  return {cols:st.cols,rows:st.rows,hp:hp,tp:tp,rc:st.rc.slice(),lowest:st.lowest,
    balls:st.balls,target:st.target,turn:st.turn,score:st.score,pending:st.pending,
    seed:st.seed,rs:st.rs,fill:st.fill,power:st.power,hpCap:st.hpCap,
    over:st.over,won:st.won,lost:st.lost,reason:st.reason};
}
function bbRecalc(st){
  var r,c;
  st.rc=[];
  for(r=0;r<st.hp.length;r++)st.rc.push(0);
  st.lowest=-1;
  for(r=0;r<st.hp.length;r++)for(c=0;c<st.cols;c++)if(st.hp[r][c]>0){st.rc[r]++;if(r>st.lowest)st.lowest=r;}
}
function bbCount(st){
  var n=0,r,c;
  for(r=0;r<st.hp.length;r++)for(c=0;c<st.cols;c++)if(st.hp[r][c]>0)n++;
  return n;
}
function bbTotalHp(st){
  var n=0,r,c;
  for(r=0;r<st.hp.length;r++)for(c=0;c<st.cols;c++)n+=st.hp[r][c];
  return n;
}
function bbSpawnRow(st){
  var c,placed=0;
  for(c=0;c<st.cols;c++){
    if(bbRand(st)<st.fill){
      var hp=1+Math.floor(bbRand(st)*st.hpCap);
      st.hp[0][c]=hp;
      st.tp[0][c]=bbRand(st)<st.power?1:0;
      if(st.tp[0][c]===1)st.hp[0][c]=1;
      placed++;
    }
  }
  if(!placed){
    c=Math.floor(bbRand(st)*st.cols);
    st.hp[0][c]=1+Math.floor(bbRand(st)*Math.min(3,st.hpCap));
    st.tp[0][c]=0;
  }
}
function bbApplyHit(st,c,r,hits,dist){
  var t=st.tp[r][c];
  if(t===1){st.pending+=1;st.score+=50;}
  st.hp[r][c]-=1;
  st.score+=10;
  if(hits)hits.push({c:c,r:r,hp:st.hp[r][c],t:t,d:dist});
  if(st.hp[r][c]<=0){
    st.hp[r][c]=0;st.tp[r][c]=0;st.rc[r]-=1;
    if(r===st.lowest){while(st.lowest>=0&&st.rc[st.lowest]<=0)st.lowest-=1;}
  }
}
/* 单球弹道：固定步长积分 + 库边镜像反弹 + 圆形/AABB 碰撞。
   record 为 true 时记录路径点（供预览与动画回放）；命中即时扣血（确定性）。 */
function bbComputePath(st,dx,dy,record){
  var x=BB.LX,y=BB.LY,vx=dx,vy=dy,R=BB.BALLR,STEP=BB.STEP,NW=BB.NW,NH=BB.NH;
  var cols=st.cols,bw=(NW-(cols+1)*BB.GAP)/cols,gx=BB.GAP;
  var pts=record?[[x,y]]:null,rec=0,hits=[],step;
  var hp=st.hp,tp=st.tp;
  for(step=0;step<BB.MAXSTEPS;step++){
    x+=vx*STEP;y+=vy*STEP;
    if(x<R){x=R;vx=-vx;}else if(x>NW-R){x=NW-R;vx=-vx;}
    if(y<R){y=R;vy=-vy;}
    if(y-R>NH)break;
    if(vy>0&&y-R>BB.bottomOf(st.lowest))break;
    var ri0=Math.floor((y-BB.TOPY)/BB.ROWH);
    var ci0=Math.floor((x-gx)/(bw+BB.GAP));
    var found=false,bc=0,br=0,bnx=0,bny=0,bax=0,bay=0,bd=1e9;
    for(var r=ri0-1;r<=ri0+1;r++){
      if(r<0||r>=hp.length)continue;
      var ry=BB.TOPY+r*BB.ROWH;
      for(var c=ci0-1;c<=ci0+1;c++){
        if(c<0||c>=cols)continue;
        if(hp[r][c]<=0)continue;
        var rx=gx+c*(bw+BB.GAP);
        var nx=x<rx?rx:(x>rx+bw?rx+bw:x);
        var ny=y<ry?ry:(y>ry+BB.BRICKH?ry+BB.BRICKH:y);
        var ax=x-nx,ay=y-ny,d2=ax*ax+ay*ay;
        if(d2<=R*R&&d2<bd){bd=d2;found=true;bc=c;br=r;bnx=nx;bny=ny;bax=ax;bay=ay;}
      }
    }
    if(found){
      if(Math.abs(bax)>Math.abs(bay)){
        vx=bax>0?Math.abs(vx):-Math.abs(vx);
        x=bax>0?(gx+bc*(bw+BB.GAP)+bw+R+0.01):(gx+bc*(bw+BB.GAP)-R-0.01);
      }else{
        vy=bay>0?Math.abs(vy):-Math.abs(vy);
        y=bay>0?(BB.TOPY+br*BB.ROWH+BB.BRICKH+R+0.01):(BB.TOPY+br*BB.ROWH-R-0.01);
      }
      bbApplyHit(st,bc,br,hits,step*STEP);
      if(record){pts.push([x,y]);rec=0;}
      continue;
    }
    if(record&&++rec>=4){pts.push([x,y]);rec=0;}
  }
  return {pts:pts,hits:hits};
}
/* 一排小球依次模拟（球间无碰撞，结果与发射顺序无关，逐球确定性） */
function bbVolley(st,angle){
  var dx=Math.sin(angle),dy=-Math.cos(angle),out=[],i;
  for(i=0;i<st.balls;i++)out.push(bbComputePath(st,dx,dy,true));
  return out;
}
/* 回合结束：清空/警戒/撑过目标判定，否则砖阵下压一行并补一行新砖 */
function bbAdvance(st){
  if(bbCount(st)===0){st.over=true;st.won=true;st.reason="clear";return st;}
  if(st.lowest>=BB.DANGER){st.over=true;st.lost=true;st.reason="danger";return st;}
  if(st.turn>=st.target){st.over=true;st.won=true;st.reason="survive";return st;}
  var r,c;
  for(r=BB.ROWS-1;r>=1;r--)for(c=0;c<st.cols;c++){st.hp[r][c]=st.hp[r-1][c];st.tp[r][c]=st.tp[r-1][c];}
  for(c=0;c<st.cols;c++){st.hp[0][c]=0;st.tp[0][c]=0;}
  bbSpawnRow(st);
  st.balls+=st.pending;st.pending=0;st.turn+=1;
  bbRecalc(st);
  if(st.lowest>=BB.DANGER){st.over=true;st.lost=true;st.reason="danger";}
  return st;
}
/* 关卡数据硬校验：结构 / 数值域 / 布局（不越界、不重叠），任一项不过整批放弃 */
function bbValidateLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.length||d.name.length>32)return false;
  function isInt(v){return typeof v==="number"&&isFinite(v)&&Math.floor(v)===v;}
  if(!isInt(d.cols)||d.cols<5||d.cols>8)return false;
  if(!isInt(d.rows)||d.rows<1||d.rows>BB.DANGER)return false;
  if(!isInt(d.balls)||d.balls<1||d.balls>60)return false;
  if(!isInt(d.target)||d.target<1||d.target>40)return false;
  if(!isInt(d.hpCap)||d.hpCap<1||d.hpCap>20)return false;
  if(typeof d.fill!=="number"||!isFinite(d.fill)||d.fill<0.05||d.fill>0.95)return false;
  if(typeof d.power!=="number"||!isFinite(d.power)||d.power<0||d.power>0.4)return false;
  if(!isInt(d.seed)||d.seed<0||d.seed>2147483647)return false;
  if(!Array.isArray(d.bricks)||!d.bricks.length)return false;
  var seen={},total=0,i,b,t;
  for(i=0;i<d.bricks.length;i++){
    b=d.bricks[i];
    if(!Array.isArray(b)||(b.length!==3&&b.length!==4))return false;
    if(!isInt(b[0])||!isInt(b[1])||!isInt(b[2]))return false;
    if(b[0]<0||b[0]>=d.cols||b[1]<0||b[1]>=d.rows||b[1]>=BB.DANGER)return false;
    if(b[2]<1||b[2]>d.hpCap)return false;
    t=b.length>3?b[3]:0;
    if(t!==0&&t!==1)return false;
    if(t===1&&b[2]!==1)return false;
    var k=b[0]+","+b[1];
    if(seen[k])return false;
    seen[k]=1;total+=b[2];
  }
  if(total<3||total>900)return false;
  return true;
}
function bbComboKey(d){
  var i,s="";
  for(i=0;i<d.bricks.length;i++){
    var b=d.bricks[i];
    s+=(i?";":"")+b[0]+","+b[1]+","+b[2]+(b.length>3?","+b[3]:"");
  }
  return d.name+"|"+d.cols+"|"+d.rows+"|"+d.balls+"|"+d.target+"|"+d.hpCap+"|"+d.fill+"|"+d.power+"|"+d.seed+"|"+s;
}
/* 线上关卡解析：任一条非法（含 JSON 坏、重复序号、重复组合）整批返回 null */
function parseBallzLevels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenNo={},seenCombo={},i,item,d,no,j,bricks,b;
  for(i=0;i<res.levels.length;i++){
    item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    if(typeof item.dataJson!=="string"||item.dataJson.length>65535)return null;
    try{d=JSON.parse(item.dataJson);}catch(e){return null;}
    if(!bbValidateLevelData(d))return null;
    no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seenNo[no])return null;
    seenNo[no]=1;
    var ck=bbComboKey(d);
    if(seenCombo[ck])return null;
    seenCombo[ck]=1;
    bricks=[];
    for(j=0;j<d.bricks.length;j++){
      b=d.bricks[j];
      bricks.push(b.length>3?[b[0],b[1],b[2],b[3]]:[b[0],b[1],b[2]]);
    }
    list.push({no:no,name:d.name,cols:d.cols,rows:d.rows,balls:d.balls,target:d.target,
      hpCap:d.hpCap,fill:d.fill,power:d.power,seed:d.seed,bricks:bricks});
  }
  list.sort(function(a,b){return a.no-b.no;});
  return list;
}

var PAL={};
/* 颜色工具：只由 PAL 色值做同色相明度推拉 / 相互混色，不引入新的颜色字面量 */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   //恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
function shade(c,a){
  var s=String(c).trim(),m;
  if(s.charAt(0)==="#"){var h=s.slice(1);if(h.length===3)h=h.charAt(0)+h.charAt(0)+h.charAt(1)+h.charAt(1)+h.charAt(2)+h.charAt(2);
    var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
    return"rgba("+r+","+g+","+b+","+a+")";}
  m=s.match(/rgba?\(([^)]+)\)/);
  if(m){var p=m[1].split(",");return"rgba("+p[0]+","+p[1]+","+p[2]+","+a+")";}
  return s;
}

  syncHud();syncDebug();
}

/* ---------- 发射与结算 ---------- */
function canAim(){return state==="aim"&&!flight&&st&&!st.over;}
function toLogical(ev){
  var r=cv.getBoundingClientRect();
  /* 用实际显示尺寸反算缩放（style.width 取整与 viewS 有亚像素差），保证命中与画面一致 */
  var s=(r.width/BB.NW)||viewS;
  return{x:(ev.clientX-r.left)/s,y:(ev.clientY-r.top)/s};
}
function updateAim(p){
  pointerPt=p;
  var dx=p.x-BB.LX,dy=p.y-BB.LY;
  aimAngle=clamp(Math.atan2(dx,-dy),-BB.AIMMAX,BB.AIMMAX);
  var sim=bbClone(st);
  sim.balls=1;
  var path=bbVolley(sim,aimAngle)[0];
  preview=path;
}
function fire(angle){
  var sim=bbClone(st);
  var paths=bbVolley(sim,angle);
  if(!paths||!paths.length)return;
  // 显示快照：飞行期间砖块按命中事件时间逐个扣血
  fh=st.hp.map(function(row){return row.slice();});
  ft=st.tp.map(function(row){return row.slice();});
  var hits=[],i,j;
  for(i=0;i<paths.length;i++){
    var hs=paths[i].hits;
    for(j=0;j<hs.length;j++){
      var h=hs[j];
      hits.push({t:i*0.05+h.d/BB.SPEED,c:h.c,r:h.r,hp:h.hp,t:h.t});
    }
  }
  hits.sort(function(a,b){return a.t-b.t;});
  var accs=paths.map(function(p){return pathAcc(p.pts);}),lastAcc=accs.length?accs[accs.length-1]:[0];
  var lastLen=lastAcc.length?lastAcc[lastAcc.length-1]:0;
  flight={paths:paths,accs:accs,sim:sim,hits:hits,hi:0,t0:clock,baseScore:st.score,
    lastEnd:(paths.length-1)*0.05+lastLen/BB.SPEED};
  preview=null;aiming=false;
  state="fly";
  setHint("弹球飞行中…");
  syncDebug();
}
function pointAt(acc,points,d){
  if(d<=0)return points[0];
  var i=1;
  while(i<acc.length-1&&acc[i]<d)i++;
  var seg=acc[i]-acc[i-1];
  var t=seg>0?(d-acc[i-1])/seg:0;
  return [points[i-1][0]+(points[i][0]-points[i-1][0])*t,points[i-1][1]+(points[i][1]-points[i-1][1])*t];
}
function pathAcc(points){
  var acc=[0];
  for(var i=1;i<points.length;i++){
    var dx=points[i][0]-points[i-1][0],dy=points[i][1]-points[i-1][1];
    acc.push(acc[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  return acc;
}
function puff(x,y,c,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28,sp=50+Math.random()*120;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,r:2+Math.random()*2.5,color:c,life:0,ttl:0.4+Math.random()*0.25});
  }
}
function addFloat(x,y,txt,c){floats.push({x:x,y:y,txt:txt,c:c,life:0,ttl:0.8});}
function commitFlight(){
  var sim=flight.sim,base=flight.baseScore;
  flight=null;
  st.hp=sim.hp;st.tp=sim.tp;st.rc=sim.rc;st.lowest=sim.lowest;
  st.score=sim.score;st.pending=sim.pending;st.balls=sim.balls;st.turn=sim.turn;
  fh=null;ft=null;parts=[];floats=[];flash={};
  bbAdvance(st);
  syncHud();
  if(st.score>base)bumpEl(ui.score);   // 得分轻弹
  if(st.won){onWin();}
  else if(st.lost){onLose();}
  else{state="aim";setHint("拖动瞄准 · 松手发射");}
  syncDebug();
}
function onWin(){
  state="won";
  var isNew=st.score>saveData.best;
  saveData.best=Math.max(saveData.best,st.score);
  saveData.lv=Math.max(saveData.lv,Math.min(cur+1,LEVELS.length-1));
  save();
  if(GB.available)GB.reportScore("ballz-bounce",{metricValue:saveData.best,metricExtra:saveData.lv}).catch(function(){});
  ui.winTitle.textContent=st.reason==="clear"?"清空砖块，过关！":"撑过目标回合，过关！";
  ui.winDesc.innerHTML="本局得分 <b>"+st.score+"</b> · 到达第 "+(cur+1)+" 关"+(isNew?"<br>新纪录！":"");
  ui.btnNext.style.display=cur<LEVELS.length-1?"":"none";
  endKind="win";endTimer=0.6;
  syncHud();syncDebug();
}
function onLose(){
  state="lost";
  if(st.score>saveData.best){
    saveData.best=st.score;save();
    if(GB.available)GB.reportScore("ballz-bounce",{metricValue:saveData.best,metricExtra:saveData.lv}).catch(function(){});
  }
  ui.loseDesc.textContent="砖块压到了警戒线，本局得分 "+st.score;
  endKind="lose";endTimer=0.6;
  syncHud();syncDebug();
}

/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
/* 球体：原点居中径向渐变（可缓存），调用前 translate 到球心 */
function buildBallGrad(){
  var R=BB.BALLR;
  ballGrad=ctx.createRadialGradient(-R*0.36,-R*0.40,R*0.12,0,0,R*1.05);
  ballGrad.addColorStop(0,colMix(PAL.ball,WHITE,0.92));
  ballGrad.addColorStop(0.45,colMix(PAL.ball,PAL.launch,0.14));
  ballGrad.addColorStop(1,colMix(PAL.ball,PAL.launch,0.46));
}
function drawBall(x,y,r,shaded){
  ctx.save();ctx.translate(x,y);
  if(shaded){ctx.fillStyle="rgba(0,0,0,0.26)";ctx.beginPath();ctx.ellipse(0,r*0.95,r*0.95,r*0.42,0,0,6.3);ctx.fill();}
  if(!ballGrad)buildBallGrad();
  ctx.fillStyle=ballGrad;ctx.beginPath();ctx.arc(0,0,r,0,6.3);ctx.fill();
  ctx.lineWidth=1;ctx.strokeStyle=colShade(PAL.launch,-0.18);ctx.stroke();
  ctx.fillStyle=shade(WHITE,0.85);ctx.beginPath();ctx.ellipse(-r*0.34,-r*0.40,r*0.26,r*0.15,-0.55,0,6.3);ctx.fill();
  ctx.restore();
}
/* 砖块渐变缓存；数字 / 浮字墨色按主题选深淡（两主题均 ≥4.5:1） */
function gradFor(r,b){
  var k=r+"|"+b,g=grads[k];
  if(!g){
    var y=BB.TOPY+r*BB.ROWH;
    g=ctx.createLinearGradient(0,y,0,y+BB.BRICKH);
    g.addColorStop(0,colShade(b,0.34));g.addColorStop(0.42,b);g.addColorStop(1,colShade(b,-0.24));
    grads[k]=g;
  }
  return g;
}
function brickInk(b){return PAL.dark?colShade(b,-0.58):PAL.text}
function floatInk(c){return PAL.dark?colShade(c,0.5):PAL.text}
function drawBrickCell(hp,t,c,r,cols,alpha,scale){
  var w=BB.brickW(cols),x=BB.GAP+c*(w+BB.GAP),y=BB.TOPY+r*BB.ROWH,cx=x+w/2,cy=y+BB.BRICKH/2;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,cy);ctx.scale(scale,scale);ctx.translate(-cx,-cy);
  var b=t===1?PAL.warning:PAL.bp[Math.min(7,Math.max(0,hp-1))];
  ctx.fillStyle="rgba(0,0,0,0.22)";rr(x+1.5,y+2.2,w,BB.BRICKH,6);ctx.fill();   //落地投影
  ctx.fillStyle=gradFor(r,b);rr(x,y,w,BB.BRICKH,6);ctx.fill();
  ctx.strokeStyle=shade(WHITE,0.55);ctx.lineWidth=1.1;rr(x+1.6,y+1.6,w-3.2,BB.BRICKH-3.2,4.6);ctx.stroke();
  ctx.lineWidth=1;ctx.strokeStyle=colShade(b,-0.42);rr(x+0.5,y+0.5,w-1,BB.BRICKH-1,5.6);ctx.stroke();
  if(t===1){
    /* 「+」道具：深底圆徽 + 矢量笔画 */
    ctx.fillStyle=colShade(b,-0.5);ctx.beginPath();ctx.arc(cx,cy,7,0,6.3);ctx.fill();
    ctx.strokeStyle=PAL.onPrimary;ctx.lineWidth=2.2;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(cx-4.2,cy);ctx.lineTo(cx+4.2,cy);ctx.moveTo(cx,cy-4.2);ctx.lineTo(cx,cy+4.2);ctx.stroke();ctx.lineCap="butt";
  }else{
    ctx.fillStyle=brickInk(b);ctx.font="700 14px "+sysFont();ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(String(hp),cx,cy+0.5);
  }
  var fk=r*100+c;
  if(flash[fk]){ctx.globalAlpha=alpha*Math.max(0,Math.min(0.55,flash[fk]/0.16*0.55));ctx.fillStyle=PAL.ball;rr(x,y,w,BB.BRICKH,6);ctx.fill();}
  ctx.restore();
}
/* 场景：场地面 / 库边墙 / 地面 / 危险区 / 警戒线——区分「地、墙、目标、轨迹」 */
function drawWalls(){
  var w=4,gl=ctx.createLinearGradient(0,0,0,BB.NH);
  gl.addColorStop(0,PAL.wallHi);gl.addColorStop(0.35,PAL.wall);gl.addColorStop(1,PAL.wallLo);
  ctx.fillStyle=gl;ctx.fillRect(0,0,w,BB.NH);ctx.fillRect(BB.NW-w,0,w,BB.NH);
  var gt=ctx.createLinearGradient(0,0,BB.NW,0);
  gt.addColorStop(0,PAL.wallHi);gt.addColorStop(0.5,PAL.wall);gt.addColorStop(1,PAL.wallLo);
  ctx.fillStyle=gt;ctx.fillRect(0,0,BB.NW,w);
  ctx.fillStyle=shade(WHITE,0.35);
  ctx.fillRect(w,0,1.2,BB.NH);ctx.fillRect(BB.NW-w-1.2,0,1.2,BB.NH);ctx.fillRect(0,w,BB.NW,1.2);
}
function drawScene(){
  var g=ctx.createLinearGradient(0,0,0,BB.NH);
  g.addColorStop(0,PAL.board);g.addColorStop(1,PAL.boardLo);
  ctx.fillStyle=g;ctx.fillRect(0,0,BB.NW,BB.NH);
  var dy=BB.dangerY(),dg=ctx.createLinearGradient(0,dy,0,BB.NH);
  dg.addColorStop(0,shade(PAL.danger,0.07));dg.addColorStop(1,shade(PAL.danger,0.015));
  ctx.fillStyle=dg;ctx.fillRect(4,dy,BB.NW-8,BB.NH-dy-12);
  drawWalls();
  var gg=ctx.createLinearGradient(0,BB.NH-12,0,BB.NH);
  gg.addColorStop(0,PAL.ground);gg.addColorStop(1,PAL.groundLo);
  ctx.fillStyle=gg;ctx.fillRect(0,BB.NH-12,BB.NW,12);
  ctx.fillStyle=shade(WHITE,0.5);ctx.fillRect(4,BB.NH-12,BB.NW-8,1.2);
  ctx.strokeStyle=PAL.danger;ctx.lineWidth=1.6;ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.moveTo(6,dy);ctx.lineTo(BB.NW-6,dy);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=PAL.danger;ctx.font="600 12px "+sysFont();ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.fillText("警戒线",8,dy-5);
}
/* 弹道：品牌色双点（光晕 + 亮芯）+ 末端箭头 */
function drawAim(){
  if(!preview||!preview.pts)return;
  var pts=preview.pts,prev=pts[0],acc=0,n=pts.length,i;
  ctx.save();ctx.fillStyle=PAL.launch;
  for(i=1;i<n;i++){
    var p=pts[i],dx=p[0]-prev[0],ddy=p[1]-prev[1];
    acc+=Math.sqrt(dx*dx+ddy*ddy);
    if(acc>=14){acc=0;
      ctx.globalAlpha=0.30;ctx.beginPath();ctx.arc(p[0],p[1],4.4,0,6.3);ctx.fill();
      ctx.globalAlpha=0.95;ctx.beginPath();ctx.arc(p[0],p[1],2.4,0,6.3);ctx.fill();}
    prev=p;
  }
  if(n>2){
    var a=pts[n-2],b=pts[n-1],ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
    ctx.globalAlpha=0.95;ctx.save();ctx.translate(b[0],b[1]);ctx.rotate(ang);
    ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-4,-4.6);ctx.lineTo(-4,4.6);ctx.closePath();ctx.fill();ctx.restore();
  }
  ctx.restore();
}
/* 发射器：底座「面」+ 投影 + 顶光 + 待发射球 + 球数 */
function drawLauncher(){
  var lx=BB.LX,ly=BB.LY;
  ctx.save();ctx.shadowColor="rgba(0,0,0,0.28)";ctx.shadowBlur=4;ctx.shadowOffsetY=1.6;
  var g=ctx.createLinearGradient(0,ly-2,0,ly+15);
  g.addColorStop(0,PAL.launchHi);g.addColorStop(0.35,PAL.launch);g.addColorStop(1,PAL.launchLo);
  ctx.fillStyle=g;rr(lx-20,ly-2,40,16,7);ctx.fill();ctx.restore();
  ctx.lineWidth=1;ctx.strokeStyle=colShade(PAL.launch,-0.45);rr(lx-20.5,ly-2.5,41,17,7);ctx.stroke();
  ctx.strokeStyle=shade(WHITE,0.5);ctx.lineWidth=1.1;rr(lx-16.5,ly+0.5,33,3.6,1.8);ctx.stroke();
  drawBall(lx,ly,BB.BALLR,true);
  ctx.fillStyle=PAL.muted;ctx.font="600 12px "+sysFont();ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText("×"+st.balls+(st.pending?"+"+st.pending:""),lx+24,ly+6);
}
/* 飞行弹球：沿弹道拖尾（越远越淡），位移走 translate */
function drawFlight(){
  if(!flight)return;
  for(var b=0;b<flight.paths.length;b++){
    var di=(clock-flight.t0-b*0.05)*BB.SPEED;
    if(di<0)continue;
    var acc=flight.accs[b],pts=flight.paths[b].pts;
    if(di>=acc[acc.length-1])continue;
    var pos=pointAt(acc,pts,di);
    if(!window.__gRM){
      for(var k=3;k>=1;k--){
        var dd=di-k*9;
        if(dd<=0)continue;
        var q=pointAt(acc,pts,dd);
        ctx.globalAlpha=0.34-k*0.08;ctx.fillStyle=PAL.launch;
        ctx.beginPath();ctx.arc(q[0],q[1],BB.BALLR*(0.62+0.12*k),0,6.3);ctx.fill();
      }
      ctx.globalAlpha=1;
    }
    drawBall(pos[0],pos[1],BB.BALLR,false);
  }
}
function drawParts(){
  for(var k=0;k<parts.length;k++){var pt=parts[k];
    ctx.globalAlpha=Math.max(0,1-pt.life/pt.ttl);ctx.fillStyle=pt.color;
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,6.3);ctx.fill();}
  ctx.globalAlpha=1;
}
function drawFloats(){
  ctx.font="700 14px "+sysFont();ctx.textAlign="center";ctx.textBaseline="middle";
  for(var m=0;m<floats.length;m++){var f=floats[m];
    ctx.globalAlpha=Math.max(0,1-f.life/f.ttl);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);}
  ctx.globalAlpha=1;
}
function draw(){
  drawScene();
  if(!st)return;
  var hp=(fh||st.hp),tp=(ft||st.tp),r,c;
  /* 砖阵入场错落：对角 35ms 阶梯 + 轻弹放大（reduced-motion 直接落位） */
  for(r=0;r<hp.length;r++)for(c=0;c<st.cols;c++){
    if(hp[r][c]<=0)continue;
    var age=animT-(0.03+((c+r*st.cols)%8)*0.035),p=1;
    if(window.__gRM)p=1;else if(age<0)continue;else p=Math.min(1,age/0.16);
    var e=1-Math.pow(1-p,2);
    drawBrickCell(hp[r][c],tp[r][c],c,r,st.cols,e,0.72+0.28*e);
  }
  if(state==="aim"&&aiming)drawAim();
  drawLauncher();drawFlight();drawParts();drawFloats();
}

/* ---------- 更新 ---------- */
function update(dt){
  clock+=dt;animT+=dt;
  if(flight){
    var elapsed=clock-flight.t0;
    while(flight.hi<flight.hits.length&&flight.hits[flight.hi].t<=elapsed){
      var h=flight.hits[flight.hi++];
      if(fh[h.r]&&fh[h.r][h.c]!==undefined){
        fh[h.r][h.c]=h.hp;
        if(h.hp<=0)ft[h.r][h.c]=0;
        var w=BB.brickW(st.cols),x=BB.GAP+h.c*(w+BB.GAP)+w/2,y=BB.TOPY+h.r*BB.ROWH+BB.BRICKH/2;
        /* 命中反馈：砖色粒子 + 闪白 + 浮字（得分 / 球数） */
        var col=h.t===1?PAL.warning:PAL.bp[Math.min(7,Math.max(0,(h.hp>0?h.hp:1)-1))];
        puff(x,y,col,h.t===1?12:7);
        flash[h.r*100+h.c]=0.16;
        if(h.hp<=0)addFloat(x,y-6,"+10",floatInk(col));
        else if(h.t===1)addFloat(x,y-6,"+1球",floatInk(PAL.warning));
      }
    }
    if(elapsed>=flight.lastEnd)commitFlight();
  }
  if(endKind){
    endTimer-=dt;
    if(endTimer<=0){show(endKind==="win"?"win":"lose");endKind=null;}
  }
  var i;
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life+=dt;
    if(p.life>=p.ttl)parts.splice(i,1);
  }
  for(i=floats.length-1;i>=0;i--){
    var f=floats[i];f.y-=30*dt;f.life+=dt;
    if(f.life>=f.ttl)floats.splice(i,1);
  }
  for(var fk in flash){flash[fk]-=dt;if(flash[fk]<=0)delete flash[fk];}
}

/* ---------- 主循环 ---------- */
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.033,(ts-last)/1000||0);
  last=ts;
  if(state==="aim"||state==="fly"||state==="won"||state==="lost")update(dt);
  /* 飞行中记分牌实时跟随模拟得分（仅显示层） */
  if(flight&&flight.sim.score!==shownScore){shownScore=flight.sim.score;ui.score.textContent=String(flight.sim.score);}
  draw();
  syncDebug();
}

/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(ev){
  if(!canAim())return;
  aiming=true;
  try{cv.setPointerCapture(ev.pointerId);}catch(e){}
  updateAim(toLogical(ev));
  ev.preventDefault();
});
cv.addEventListener("pointermove",function(ev){
  if(!aiming||!canAim())return;
  updateAim(toLogical(ev));
  ev.preventDefault();
});
cv.addEventListener("pointerup",function(ev){
  if(!aiming)return;
  aiming=false;
  if(canAim()&&pointerPt&&pointerPt.y<BB.LY-8)fire(aimAngle);
  preview=null;
  ev.preventDefault();
});
cv.addEventListener("pointercancel",function(){aiming=false;preview=null;});
cv.addEventListener("contextmenu",function(ev){ev.preventDefault();});

/* ---------- 按钮 ---------- */
document.getElementById("btnStart").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnNext").addEventListener("click",function(){startLevel(cur<LEVELS.length-1?cur+1:cur);});
document.getElementById("btnReplay").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnRetry").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnMenu1").addEventListener("click",toMenu);
document.getElementById("btnMenu2").addEventListener("click",toMenu);
/* 按钮图标：SW_ICON 范式，文字前内联 SVG（24 viewBox / currentColor / aria-hidden） */
function iconBtn(id,n,txt){var el=document.getElementById(id);if(el)el.innerHTML=window.SW_ICON(n)+txt;}
iconBtn("btnStart","play","开始游戏");
iconBtn("btnNext","arrow-right","下一关");
iconBtn("btnReplay","rotate","重玩");
iconBtn("btnRetry","rotate","重试本关");
iconBtn("btnMenu1","grid","选关");
iconBtn("btnMenu2","grid","选关");
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="fly"){/* 切后台暂停推进，回到前台继续 */}
});

/* ---------- 启动 ---------- */
resize();
loadLevel(Math.min(saveData.lv,LEVELS.length-1));
buildChips();
show("ready");
syncHud();
requestAnimationFrame(frame);
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
