<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/*BB-ENGINE-BEGIN*/
/* 弹球砖块引擎：固定步长纯反弹物理（无重力）、回合制发射、砖阵下压、道具球。
   逻辑坐标世界 360×540，所有随机来自关卡种子（确定性）。 */
var BB={
  NW:360,NH:540,GAP:4,TOPY:12,BRICKH:26,ROWH:30,DANGER:11,ROWS:12,
  BALLR:5,SPEED:460,STEP:2,AIMMAX:1.308996939,MAXSTEPS:6000,
  LX:180,LY:516,
  brickW:function(cols){return (this.NW-(cols+1)*this.GAP)/cols;},
  rect:function(cols,c,r){
    var w=(this.NW-(cols+1)*this.GAP)/cols;
    return {x:this.GAP+c*(w+this.GAP),y:this.TOPY+r*this.ROWH,w:w,h:this.BRICKH};
  },
  dangerY:function(){return this.TOPY+this.DANGER*this.ROWH;},
  bottomOf:function(r){return this.TOPY+r*this.ROWH+this.BRICKH;}
};
function bbRand(st){
  st.rs=(st.rs+0x6D2B79F5)|0;
  var t=Math.imul(st.rs^(st.rs>>>15),1|st.rs);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;
}
function bbBuildState(level){
  if(!level||typeof level!=="object")return null;
  var cols=level.cols,r,i,c;
  var hp=[],tp=[];
  for(r=0;r<BB.ROWS;r++){
    var hrow=[],trow=[];
    for(c=0;c<cols;c++){hrow.push(0);trow.push(0);}
    hp.push(hrow);tp.push(trow);
  }
  var list=level.bricks;
  if(!Array.isArray(list)||!list.length)return null;
  for(i=0;i<list.length;i++){
    var b=list[i];
    if(!Array.isArray(b)||b.length<3)return null;
    c=b[0];r=b[1];
    if(c<0||c>=cols||r<0||r>=BB.ROWS)return null;
    hp[r][c]=b[2];
    tp[r][c]=b.length>3?b[3]:0;
  }
  var st={cols:cols,rows:level.rows,hp:hp,tp:tp,rc:[],lowest:-1,
    balls:level.balls,target:level.target,turn:1,score:0,pending:0,
    seed:level.seed>>>0,rs:level.seed>>>0,fill:level.fill,power:level.power,hpCap:level.hpCap,
    over:false,won:false,lost:false,reason:""};
  bbRecalc(st);
  return st;
}
function bbClone(st){
  var hp=[],tp=[],r;
  for(r=0;r<st.hp.length;r++){hp.push(st.hp[r].slice());tp.push(st.tp[r].slice());}
  return {cols:st.cols,rows:st.rows,hp:hp,tp:tp,rc:st.rc.slice(),lowest:st.lowest,
    balls:st.balls,target:st.target,turn:st.turn,score:st.score,pending:st.pending,
    seed:st.seed,rs:st.rs,fill:st.fill,power:st.power,hpCap:st.hpCap,
    over:st.over,won:st.won,lost:st.lost,reason:st.reason};
}
function bbRecalc(st){
  var r,c;
  st.rc=[];
  for(r=0;r<st.hp.length;r++)st.rc.push(0);
  st.lowest=-1;
  for(r=0;r<st.hp.length;r++)for(c=0;c<st.cols;c++)if(st.hp[r][c]>0){st.rc[r]++;if(r>st.lowest)st.lowest=r;}
}
function bbCount(st){
  var n=0,r,c;
  for(r=0;r<st.hp.length;r++)for(c=0;c<st.cols;c++)if(st.hp[r][c]>0)n++;
  return n;
}
function bbTotalHp(st){
  var n=0,r,c;
  for(r=0;r<st.hp.length;r++)for(c=0;c<st.cols;c++)n+=st.hp[r][c];
  return n;
}
function bbSpawnRow(st){
  var c,placed=0;
  for(c=0;c<st.cols;c++){
    if(bbRand(st)<st.fill){
      var hp=1+Math.floor(bbRand(st)*st.hpCap);
      st.hp[0][c]=hp;
      st.tp[0][c]=bbRand(st)<st.power?1:0;
      if(st.tp[0][c]===1)st.hp[0][c]=1;
      placed++;
    }
  }
  if(!placed){
    c=Math.floor(bbRand(st)*st.cols);
    st.hp[0][c]=1+Math.floor(bbRand(st)*Math.min(3,st.hpCap));
    st.tp[0][c]=0;
  }
}
function bbApplyHit(st,c,r,hits,dist){
  var t=st.tp[r][c];
  if(t===1){st.pending+=1;st.score+=50;}
  st.hp[r][c]-=1;
  st.score+=10;
  if(hits)hits.push({c:c,r:r,hp:st.hp[r][c],t:t,d:dist});
  if(st.hp[r][c]<=0){
    st.hp[r][c]=0;st.tp[r][c]=0;st.rc[r]-=1;
    if(r===st.lowest){while(st.lowest>=0&&st.rc[st.lowest]<=0)st.lowest-=1;}
  }
}
/* 单球弹道：固定步长积分 + 库边镜像反弹 + 圆形/AABB 碰撞。
   record 为 true 时记录路径点（供预览与动画回放）；命中即时扣血（确定性）。 */
function bbComputePath(st,dx,dy,record){
  var x=BB.LX,y=BB.LY,vx=dx,vy=dy,R=BB.BALLR,STEP=BB.STEP,NW=BB.NW,NH=BB.NH;
  var cols=st.cols,bw=(NW-(cols+1)*BB.GAP)/cols,gx=BB.GAP;
  var pts=record?[[x,y]]:null,rec=0,hits=[],step;
  var hp=st.hp,tp=st.tp;
  for(step=0;step<BB.MAXSTEPS;step++){
    x+=vx*STEP;y+=vy*STEP;
    if(x<R){x=R;vx=-vx;}else if(x>NW-R){x=NW-R;vx=-vx;}
    if(y<R){y=R;vy=-vy;}
    if(y-R>NH)break;
    if(vy>0&&y-R>BB.bottomOf(st.lowest))break;
    var ri0=Math.floor((y-BB.TOPY)/BB.ROWH);
    var ci0=Math.floor((x-gx)/(bw+BB.GAP));
    var found=false,bc=0,br=0,bnx=0,bny=0,bax=0,bay=0,bd=1e9;
    for(var r=ri0-1;r<=ri0+1;r++){
      if(r<0||r>=hp.length)continue;
      var ry=BB.TOPY+r*BB.ROWH;
      for(var c=ci0-1;c<=ci0+1;c++){
        if(c<0||c>=cols)continue;
        if(hp[r][c]<=0)continue;
        var rx=gx+c*(bw+BB.GAP);
        var nx=x<rx?rx:(x>rx+bw?rx+bw:x);
        var ny=y<ry?ry:(y>ry+BB.BRICKH?ry+BB.BRICKH:y);
        var ax=x-nx,ay=y-ny,d2=ax*ax+ay*ay;
        if(d2<=R*R&&d2<bd){bd=d2;found=true;bc=c;br=r;bnx=nx;bny=ny;bax=ax;bay=ay;}
      }
    }
    if(found){
      if(Math.abs(bax)>Math.abs(bay)){
        vx=bax>0?Math.abs(vx):-Math.abs(vx);
        x=bax>0?(gx+bc*(bw+BB.GAP)+bw+R+0.01):(gx+bc*(bw+BB.GAP)-R-0.01);
      }else{
        vy=bay>0?Math.abs(vy):-Math.abs(vy);
        y=bay>0?(BB.TOPY+br*BB.ROWH+BB.BRICKH+R+0.01):(BB.TOPY+br*BB.ROWH-R-0.01);
      }
      bbApplyHit(st,bc,br,hits,step*STEP);
      if(record){pts.push([x,y]);rec=0;}
      continue;
    }
    if(record&&++rec>=4){pts.push([x,y]);rec=0;}
  }
  return {pts:pts,hits:hits};
}
/* 一排小球依次模拟（球间无碰撞，结果与发射顺序无关，逐球确定性） */
function bbVolley(st,angle){
  var dx=Math.sin(angle),dy=-Math.cos(angle),out=[],i;
  for(i=0;i<st.balls;i++)out.push(bbComputePath(st,dx,dy,true));
  return out;
}
/* 回合结束：清空/警戒/撑过目标判定，否则砖阵下压一行并补一行新砖 */
function bbAdvance(st){
  if(bbCount(st)===0){st.over=true;st.won=true;st.reason="clear";return st;}
  if(st.lowest>=BB.DANGER){st.over=true;st.lost=true;st.reason="danger";return st;}
  if(st.turn>=st.target){st.over=true;st.won=true;st.reason="survive";return st;}
  var r,c;
  for(r=BB.ROWS-1;r>=1;r--)for(c=0;c<st.cols;c++){st.hp[r][c]=st.hp[r-1][c];st.tp[r][c]=st.tp[r-1][c];}
  for(c=0;c<st.cols;c++){st.hp[0][c]=0;st.tp[0][c]=0;}
  bbSpawnRow(st);
  st.balls+=st.pending;st.pending=0;st.turn+=1;
  bbRecalc(st);
  if(st.lowest>=BB.DANGER){st.over=true;st.lost=true;st.reason="danger";}
  return st;
}
/* 关卡数据硬校验：结构 / 数值域 / 布局（不越界、不重叠），任一项不过整批放弃 */
function bbValidateLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.length||d.name.length>32)return false;
  function isInt(v){return typeof v==="number"&&isFinite(v)&&Math.floor(v)===v;}
  if(!isInt(d.cols)||d.cols<5||d.cols>8)return false;
  if(!isInt(d.rows)||d.rows<1||d.rows>BB.DANGER)return false;
  if(!isInt(d.balls)||d.balls<1||d.balls>60)return false;
  if(!isInt(d.target)||d.target<1||d.target>40)return false;
  if(!isInt(d.hpCap)||d.hpCap<1||d.hpCap>20)return false;
  if(typeof d.fill!=="number"||!isFinite(d.fill)||d.fill<0.05||d.fill>0.95)return false;
  if(typeof d.power!=="number"||!isFinite(d.power)||d.power<0||d.power>0.4)return false;
  if(!isInt(d.seed)||d.seed<0||d.seed>2147483647)return false;
  if(!Array.isArray(d.bricks)||!d.bricks.length)return false;
  var seen={},total=0,i,b,t;
  for(i=0;i<d.bricks.length;i++){
    b=d.bricks[i];
    if(!Array.isArray(b)||(b.length!==3&&b.length!==4))return false;
    if(!isInt(b[0])||!isInt(b[1])||!isInt(b[2]))return false;
    if(b[0]<0||b[0]>=d.cols||b[1]<0||b[1]>=d.rows||b[1]>=BB.DANGER)return false;
    if(b[2]<1||b[2]>d.hpCap)return false;
    t=b.length>3?b[3]:0;
    if(t!==0&&t!==1)return false;
    if(t===1&&b[2]!==1)return false;
    var k=b[0]+","+b[1];
    if(seen[k])return false;
    seen[k]=1;total+=b[2];
  }
  if(total<3||total>900)return false;
  return true;
}
function bbComboKey(d){
  var i,s="";
  for(i=0;i<d.bricks.length;i++){
    var b=d.bricks[i];
    s+=(i?";":"")+b[0]+","+b[1]+","+b[2]+(b.length>3?","+b[3]:"");
  }
  return d.name+"|"+d.cols+"|"+d.rows+"|"+d.balls+"|"+d.target+"|"+d.hpCap+"|"+d.fill+"|"+d.power+"|"+d.seed+"|"+s;
}
/* 线上关卡解析：任一条非法（含 JSON 坏、重复序号、重复组合）整批返回 null */
function parseBallzLevels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenNo={},seenCombo={},i,item,d,no,j,bricks,b;
  for(i=0;i<res.levels.length;i++){
    item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    if(typeof item.dataJson!=="string"||item.dataJson.length>65535)return null;
    try{d=JSON.parse(item.dataJson);}catch(e){return null;}
    if(!bbValidateLevelData(d))return null;
    no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seenNo[no])return null;
    seenNo[no]=1;
    var ck=bbComboKey(d);
    if(seenCombo[ck])return null;
    seenCombo[ck]=1;
    bricks=[];
    for(j=0;j<d.bricks.length;j++){
      b=d.bricks[j];
      bricks.push(b.length>3?[b[0],b[1],b[2],b[3]]:[b[0],b[1],b[2]]);
    }
    list.push({no:no,name:d.name,cols:d.cols,rows:d.rows,balls:d.balls,target:d.target,
      hpCap:d.hpCap,fill:d.fill,power:d.power,seed:d.seed,bricks:bricks});
  }
  list.sort(function(a,b){return a.no-b.no;});
  return list;
}

function canAim(){return state==="aim"&&!flight&&st&&!st.over;}
function toLogical(ev){
  var r=cv.getBoundingClientRect();
  return{x:(ev.clientX-r.left)/viewS,y:(ev.clientY-r.top)/viewS};
}
function updateAim(p){
  pointerPt=p;
  var dx=p.x-BB.LX,dy=p.y-BB.LY;
  aimAngle=clamp(Math.atan2(dx,-dy),-BB.AIMMAX,BB.AIMMAX);
  var sim=bbClone(st);
  sim.balls=1;
  var path=bbVolley(sim,aimAngle)[0];
  preview=path;
}
function fire(angle){
  var sim=bbClone(st);
  var paths=bbVolley(sim,angle);
  if(!paths||!paths.length)return;
  // 显示快照：飞行期间砖块按命中事件时间逐个扣血
  fh=st.hp.map(function(row){return row.slice();});
  ft=st.tp.map(function(row){return row.slice();});
  var hits=[],i,j;
  for(i=0;i<paths.length;i++){
    var hs=paths[i].hits;
    for(j=0;j<hs.length;j++){
      var h=hs[j];
      hits.push({t:i*0.05+h.d/BB.SPEED,c:h.c,r:h.r,hp:h.hp,t:h.t});
    }
  }
  hits.sort(function(a,b){return a.t-b.t;});
  var accs=paths.map(function(p){return pathAcc(p.pts);}),lastAcc=accs.length?accs[accs.length-1]:[0];
  var lastLen=lastAcc.length?lastAcc[lastAcc.length-1]:0;
  flight={paths:paths,accs:accs,sim:sim,hits:hits,hi:0,t0:clock,
    lastEnd:(paths.length-1)*0.05+lastLen/BB.SPEED};
  preview=null;aiming=false;
  state="fly";
  setHint("弹球飞行中…");
  syncDebug();
}
function pointAt(acc,points,d){
  if(d<=0)return points[0];
  var i=1;
  while(i<acc.length-1&&acc[i]<d)i++;
  var seg=acc[i]-acc[i-1];
  var t=seg>0?(d-acc[i-1])/seg:0;
  return [points[i-1][0]+(points[i][0]-points[i-1][0])*t,points[i-1][1]+(points[i][1]-points[i-1][1])*t];
}
function pathAcc(points){
  var acc=[0];
  for(var i=1;i<points.length;i++){
    var dx=points[i][0]-points[i-1][0],dy=points[i][1]-points[i-1][1];
    acc.push(acc[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  return acc;
}
function puff(x,y,c,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28,sp=50+Math.random()*120;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,r:2+Math.random()*2.5,color:c,life:0,ttl:0.4+Math.random()*0.25});
  }
}

function commitFlight(){
  var sim=flight.sim;

  st.hp=sim.hp;st.tp=sim.tp;st.rc=sim.rc;st.lowest=sim.lowest;
  st.score=sim.score;st.pending=sim.pending;st.balls=sim.balls;st.turn=sim.turn;
  fh=null;ft=null;parts=[];floats=[];

}
function onWin(){

  saveData.lv=Math.max(saveData.lv,Math.min(cur+1,LEVELS.length-1));

/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawBrickCell(hp,t,c,r,cols){
  var w=BB.brickW(cols),x=BB.GAP+c*(w+BB.GAP),y=BB.TOPY+r*BB.ROWH;
  var idx=Math.min(7,Math.floor((hp-1)/2));
  rr(x,y,w,BB.BRICKH,5);
  ctx.fillStyle=t===1?PAL.warning:PAL.bp[idx];
  ctx.fill();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.bshade;ctx.stroke();
  ctx.fillStyle=t===1?PAL.ball:PAL.text;
  ctx.font="700 14px "+sysFont();
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(t===1?"+":String(hp),x+w/2,y+BB.BRICKH/2+0.5);
}
function draw(){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,BB.NW,BB.NH);
  rr(0.5,0.5,BB.NW-1,BB.NH-1,10);
  ctx.fillStyle=PAL.surface;ctx.fill();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.border;ctx.stroke();
  // 警戒线
  var dy=BB.dangerY();
  ctx.strokeStyle=PAL.danger;ctx.lineWidth=1.5;ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.moveTo(6,dy);ctx.lineTo(BB.NW-6,dy);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=PAL.danger;ctx.font="600 12px "+sysFont();ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.fillText("警戒线",8,dy-5);
  if(!st)return;
  var hp=(fh||st.hp),tp=(ft||st.tp),r,c;
  for(r=0;r<hp.length;r++)for(c=0;c<st.cols;c++)if(hp[r][c]>0)drawBrickCell(hp[r][c],tp[r][c],c,r,st.cols);
  // 瞄准预览
  if(aiming&&preview&&preview.pts){
    ctx.fillStyle=PAL.warning;
    var acc=0,prev=preview.pts[0];
    for(var i=1;i<preview.pts.length;i++){
      var p=preview.pts[i];
      var dx=p[0]-prev[0],ddy=p[1]-prev[1];
      acc+=Math.sqrt(dx*dx+ddy*ddy);
      if(acc>=14){acc=0;ctx.beginPath();ctx.arc(p[0],p[1],2.6,0,6.3);ctx.fill();}
      prev=p;
    }
  }
  // 发射器
  var lx=BB.LX,ly=BB.LY;
  ctx.fillStyle=PAL.primaryDeep;
  ctx.beginPath();ctx.moveTo(lx-12,ly+18);ctx.lineTo(lx+12,ly+18);ctx.lineTo(lx,ly+3);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.arc(lx,ly,BB.BALLR,0,6.3);
  ctx.fillStyle=PAL.ball;ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=PAL.ballln;ctx.stroke();
  ctx.fillStyle=PAL.muted;ctx.font="600 12px "+sysFont();ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.fillText("×"+st.balls+(st.pending?"+"+st.pending:""),lx+BB.BALLR+8,ly+4);
  // 飞行中的弹球
  if(flight){
    for(var b=0;b<flight.paths.length;b++){
      var di=(clock-flight.t0-b*0.05)*BB.SPEED;
      if(di<0)continue;
      var acc=flight.accs[b];
      if(di>=acc[acc.length-1])continue;
      var pos=pointAt(acc,flight.paths[b].pts,di);
      ctx.beginPath();ctx.arc(pos[0],pos[1],BB.BALLR,0,6.3);
      ctx.fillStyle=PAL.ball;ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=PAL.ballln;ctx.stroke();
    }
  }
  // 粒子
  for(var k=0;k<parts.length;k++){
    var pt=parts[k];
    ctx.globalAlpha=Math.max(0,1-pt.life/pt.ttl);
    ctx.fillStyle=pt.color;
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,6.3);ctx.fill();
  }
  ctx.globalAlpha=1;
  // 浮字
  ctx.font="700 14px "+sysFont();ctx.textAlign="center";ctx.textBaseline="alphabetic";
  for(var m=0;m<floats.length;m++){
    var f=floats[m];
    ctx.globalAlpha=Math.max(0,1-f.life/f.ttl);
    ctx.fillStyle=f.c;
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

/* ---------- 更新 ---------- */
function update(dt){
  clock+=dt;
  if(flight){
    var elapsed=clock-flight.t0;
    while(flight.hi<flight.hits.length&&flight.hits[flight.hi].t<=elapsed){
      var h=flight.hits[flight.hi++];
      if(fh[h.r]&&fh[h.r][h.c]!==undefined){
        fh[h.r][h.c]=h.hp;
        if(h.hp<=0)ft[h.r][h.c]=0;
        var w=BB.brickW(st.cols),x=BB.GAP+h.c*(w+BB.GAP)+w/2,y=BB.TOPY+h.r*BB.ROWH+BB.BRICKH/2;
        puff(x,y,h.t===1?PAL.warning:PAL.primaryDeep,h.t===1?10:6);
        if(h.t===1)addFloat(x,y-8,"+1",PAL.primaryDeep);
      }
    }
    if(elapsed>=flight.lastEnd)commitFlight();
  }
  if(endKind){
    endTimer-=dt;
    if(endTimer<=0){show(endKind==="win"?"win":"lose");endKind=null;}
  }
  var i;
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life+=dt;
    if(p.life>=p.ttl)parts.splice(i,1);
  }
  for(i=floats.length-1;i>=0;i--){
    var f=floats[i];f.y-=30*dt;f.life+=dt;
    if(f.life>=f.ttl)floats.splice(i,1);
  }
}

/* ---------- 主循环 ---------- */
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.033,(ts-last)/1000||0);
  last=ts;
  if(state==="aim"||state==="fly"||state==="won"||state==="lost")update(dt);
  draw();
  syncDebug();
}

/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(ev){
  if(!canAim())return;
  aiming=true;
  try{cv.setPointerCapture(ev.pointerId);}catch(e){}
  updateAim(toLogical(ev));
  ev.preventDefault();
});
cv.addEventListener("pointermove",function(ev){
  if(!aiming||!canAim())return;
  updateAim(toLogical(ev));
  ev.preventDefault();
});
cv.addEventListener("pointerup",function(ev){
  if(!aiming)return;
  aiming=false;
  if(canAim()&&pointerPt&&pointerPt.y<BB.LY-8)fire(aimAngle);
  preview=null;
  ev.preventDefault();
});
cv.addEventListener("pointercancel",function(){aiming=false;preview=null;});
cv.addEventListener("contextmenu",function(ev){ev.preventDefault();});

/* ---------- 按钮 ---------- */
document.getElementById("btnStart").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnNext").addEventListener("click",function(){startLevel(cur<LEVELS.length-1?cur+1:cur);});
document.getElementById("btnReplay").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnRetry").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnMenu1").addEventListener("click",toMenu);
document.getElementById("btnMenu2").addEventListener("click",toMenu);
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="fly"){/* 切后台暂停推进，回到前台继续 */}
});

/* ---------- 启动 ---------- */
resize();
loadLevel(Math.min(saveData.lv,LEVELS.length-1));
buildChips();
show("ready");
syncHud();
requestAnimationFrame(frame);
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理：显示时聚焦首个可操作元素（dialog 语义配套，全库统一模板） */
(function(){var els=document.querySelectorAll(".overlay");if(!els.length)return;
function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
function focusFirst(el){if(el.dataset.foc)return;el.dataset.foc="1";var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();}
function watch(el){try{new MutationObserver(function(){if(shown(el))focusFirst(el);else delete el.dataset.foc}).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}}
for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}})();
</script>
