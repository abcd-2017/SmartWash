<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>节拍点按</title>
<style>
  /* token:GAME-THEME.md §2 + §3（bt- 轨道地面 / 隔行面 / 目标判定线） */
  :root{--g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-on-primary:#FFF;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-bt-stage1:#1C3A44;--g-bt-stage2:#0E242B;--g-bt-lane-hi:#2A4E5A;--g-bt-target:#8FE3B6;color-scheme:light}
  [data-theme="dark"]{--g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-bt-stage1:#0B1B21;--g-bt-stage2:#060F13;--g-bt-lane-hi:#142E37;--g-bt-target:#5BC894;color-scheme:dark}
  [hidden]{display:none!important}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--g-bg);color:var(--g-text);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:manipulation;
  }
  .app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:10px 12px calc(8px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .btn{min-height:44px;padding:0 14px;border:0;border-radius:var(--g-radius-btn);background:var(--g-btn-primary);color:var(--g-on-primary);font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .14s ease-out,opacity .16s ease-out,background .16s ease-out}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:var(--g-surface);color:var(--g-text);border:1px solid var(--g-border)}
  .btn:disabled{opacity:.4;cursor:default}
  .swi{display:inline-block;vertical-align:-.14em;flex:none}
  /* 极矮视口(横屏/小窗):flex-basis 让 stage 随视口收缩(上限 260px),把控制区/提示行让出来,
     避免 body overflow:hidden 下底部被裁;视口充足时 260px 保底不变 */
  .stage{position:relative;flex:1 1 260px;min-height:0;margin-top:16px;border:1px solid var(--g-border);border-radius:var(--g-radius);background:var(--g-bt-stage2);overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .overlay{position:absolute;inset:0;z-index:5;background:var(--g-scrim);display:flex;align-items:center;justify-content:center;padding:16px}
  .panel{width:100%;max-width:370px;max-height:100%;overflow:auto;background:var(--g-surface);border:1px solid var(--g-border);border-radius:var(--g-radius);box-shadow:var(--g-shadow);padding:18px;animation:pop .3s ease-out}
  .rt{margin:0 0 4px;font-size:18px;font-weight:700}
  .rs{margin:0 0 12px;font-size:12px;color:var(--g-muted)}
  .rhint{margin:12px 0 0;font-size:12px;color:var(--g-muted);line-height:1.6}
  .song{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;margin-top:8px;border:1px solid var(--g-border);border-radius:var(--g-radius-btn);background:var(--g-surface2);font:inherit;color:var(--g-text);text-align:left;cursor:pointer;animation:rise .3s ease-out both;transition:transform .14s ease-out,background .16s ease-out,border-color .16s ease-out}
  .song:active{transform:scale(.96)}
  .sic{flex:none;display:inline-flex;font-size:18px;color:var(--g-primary-deep)}
  .sidx{font-size:16px;font-weight:700;color:var(--g-muted);font-variant-numeric:tabular-nums}
  .smain{flex:1;min-width:0}
  .smain b{display:block;font-size:16px}
  .smain small{display:block;margin-top:2px;font-size:12px;color:var(--g-muted)}
  .sbest{font-size:12px;font-weight:700;color:var(--g-muted);white-space:nowrap}
  .sbest.g-S{color:var(--g-warning)} .sbest.g-A{color:var(--g-primary-deep)} .sbest.g-B{color:var(--g-water)}
  .grade{margin:6px 0 0;font-size:36px;line-height:1;text-align:center;font-weight:700;animation:btpop .4s ease-out}
  @keyframes btpop{from{transform:scale(.55)}to{transform:scale(1)}}
  .grade.g-S{color:var(--g-warning)} .grade.g-A{color:var(--g-primary-deep)} .grade.g-B{color:var(--g-water)} .grade.g-C{color:var(--g-muted)}
  .rscore{margin:6px 0 0;text-align:center;font-size:14px;color:var(--g-muted)}
  .rscore b{font-size:22px;color:var(--g-text);font-variant-numeric:tabular-nums}
  .newrec{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:16px;background:var(--g-surface2);color:var(--g-warning);font-size:12px;font-weight:700;vertical-align:2px;animation:pop .3s ease-out}
  .rstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
  .rstats span{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;background:var(--g-surface2);font-size:14px;color:var(--g-muted)}
  .rstats b{color:var(--g-text);font-variant-numeric:tabular-nums}
  .rbest{margin:10px 0 0;font-size:12px;color:var(--g-muted);text-align:center}
  .rbtns{display:flex;gap:10px;margin-top:14px}
  .rbtns .btn{flex:1}
  .pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .pad{--lc:var(--g-primary);position:relative;min-height:58px;border:1px solid var(--g-border);border-radius:var(--g-radius-btn);background:linear-gradient(180deg,var(--g-surface),var(--g-surface2));color:var(--g-text);font-family:inherit;cursor:pointer;touch-action:none;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 8px rgba(20,40,30,.06);transition:transform .14s ease-out,background .16s ease-out,box-shadow .16s ease-out}
  .pad[data-lane="1"]{--lc:var(--g-water)}
  .pad[data-lane="2"]{--lc:var(--g-warning)}
  .pad[data-lane="3"]{--lc:var(--g-danger)}
  .pad .pi{display:inline-flex;font-size:22px;line-height:1;color:var(--lc)}
  .pad .pk{font-size:14px;font-weight:700;color:var(--g-muted)}
  .pad i{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--lc)}
  .pad.on{transform:scale(.96);background:var(--g-surface2);box-shadow:inset 0 0 0 1.5px var(--lc),0 1px 4px rgba(20,40,30,.08)}
  .foot{margin:8px 0 0;font-size:12px;color:var(--g-muted);text-align:center;line-height:1.6}

  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束）
     同时压平 animation-duration 与 animation-delay，否则错落入场会变成整体延迟后闪现 */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important;animation-delay:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
/* SW 图标库：内联 SVG 线性图标（stroke=currentColor，24 viewBox，与 UI 令牌联动） */
window.SW_ICON=function(n,s){s=s||"";var P={
 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>','arrow-left':'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 'arrow-up':'<path d="M12 19V5M6 11l6-6 6 6"/>','arrow-down':'<path d="M12 5v14M6 13l6 6 6-6"/>',
 'rotate':'<path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>',
 'check':'<path d="M4 12.5l5 5L20 6.5"/>','x':'<path d="M6 6l12 12M18 6L6 18"/>',
 'star':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',
 'star-o':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',
 'circle':'<circle cx="12" cy="12" r="5.5"/>','circle-f':'<circle cx="12" cy="12" r="5.5"/>',
 'diamond':'<path d="M12 3l7 9-7 9-7-9z"/>','square':'<rect x="5" y="5" width="14" height="14" rx="2"/>',
 'tri-up':'<path d="M12 5l8 15H4z"/>','tri-down':'<path d="M12 19l-8-15h16z"/>','tri-left':'<path d="M5 12l15-8v16z"/>','tri-right':'<path d="M19 12L4 4v16z"/>',
 'music':'<path d="M9 18V6l10-2v11"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="15" r="2.5"/>',
 'sound':'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>',
 'mute':'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9l5 6M21 9l-5 6"/>',
 'grid':'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
 'pause':'<rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/>',
 'play':'<path d="M8 5v14l11-7z"/>',
 'backspace':'<path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z M12.5 9.5l5 5M17.5 9.5l-5 5"/>',
 'swap-h':'<path d="M7 4L3 8l4 4M3 8h14M17 12l4 4-4 4M21 16H7"/>'
};
var fill={ 'star':1,'circle-f':1,'diamond':1,'square':1,'tri-up':1,'tri-down':1,'tri-left':1,'tri-right':1,'pause':1,'play':1,'sound':1,'mute':1 };
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};
</script>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
try{SmartWashGameBridge&&SmartWashGameBridge.setChrome('immersive')}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>
</head>
<body>
<div class="app">
  <header>
    <button class="btn ghost" id="menuBtn" type="button">选曲</button>
    <button class="btn" id="pauseBtn" type="button" disabled>暂停</button>
    <button class="btn ghost" id="muteBtn" type="button" aria-pressed="false">静音</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="节拍游戏区" role="img"></canvas>
    <div class="overlay" role="dialog" aria-modal="true" id="overlay" aria-live="assertive">
      <div class="panel" id="vMenu">
        <p class="rt">选择曲目</p>
        <p class="rs">音乐由 WebAudio 现场合成 · 建议佩戴耳机</p>
        <div id="songList"></div>
        <p class="rhint">音符落至亮线时点击对应轨道：±60ms Perfect · ±120ms Good，越连越高分。</p>
      </div>
      <div class="panel" id="vPause" hidden>
        <p class="rt">已暂停</p>
        <p class="rs">节拍不会跑，随时回来。</p>
        <div class="rbtns">
          <button class="btn ghost" id="btnMenu2" type="button">返回选曲</button>
          <button class="btn" id="btnResume" type="button">继续</button>
        </div>
      </div>
      <div class="panel" id="vResult" hidden>
        <p class="rt" style="text-align:center">演奏结束</p>
        <div class="grade" id="resGrade">S</div>
        <p class="rscore"><b id="resScore">0</b> 分<span class="newrec" id="resNew" hidden>新纪录</span></p>
        <div class="rstats" id="resStats"></div>
        <p class="rbest" id="resBest"></p>
        <div class="rbtns">
          <button class="btn ghost" id="btnMenu3" type="button">返回选曲</button>
          <button class="btn" id="btnRetry" type="button">再来一次</button>
        </div>
      </div>
    </div>
  </div>
  <div class="pads">
    <button class="pad" data-lane="0" type="button"><span class="pi"></span><span class="pk">D</span><i></i></button>
    <button class="pad" data-lane="1" type="button"><span class="pi"></span><span class="pk">F</span><i></i></button>
    <button class="pad" data-lane="2" type="button"><span class="pi"></span><span class="pk">J</span><i></i></button>
    <button class="pad" data-lane="3" type="button"><span class="pi"></span><span class="pk">K</span><i></i></button>
  </div>
  <p class="foot">四色音符对应四条轨道 · 落至亮线时点击对应轨道<br>±60ms Perfect · ±120ms Good · 空格暂停 · 键盘 D F J K</p>
</div>
<script>
"use strict";
(() => {
  /* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
  var GB=(function(){
    var pending={},seq=0;
    window.__gOnGameBridgeResult=function(cbId,ok,payload){
      var cb=pending[cbId];if(!cb)return;
      delete pending[cbId];
      try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
    };
    function call(method,args){
      return new Promise(function(resolve,reject){
        var bridge=window.SmartWashGameBridge;
        if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
        var cbId="gb"+Date.now()+"_"+(++seq);
        pending[cbId]={resolve:resolve,reject:reject};
        try{bridge[method].apply(bridge,args.concat([cbId]));}
        catch(e){delete pending[cbId];reject(e);}
      });
    }
    return {
      available:!!window.SmartWashGameBridge,
      loadState:function(gameKey){return call("loadState",[gameKey]);},
      saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
      reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
      getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
      getLevels:function(gameKey){return call("getLevels",[gameKey]);}
    };
  })();
  // ===== 常量 =====
  const KEY = "sw_h5_beattap_records";
  const WIN_P = 60, WIN_G = 120;        // 判定窗口 ms:±60 Perfect / ±120 Good
  const APPROACH = 1500;                // 音符可见下落时长 ms
  const LANE_KEYS = ["D","F","J","K"];
  const LANE_OFF = [0,5,7,10];          // 轨道固定音高(五声音阶)
  const CHORDS = [0,-4,3,-2];           // Am F C G
  const FONT = "system-ui,sans-serif";
  // 轨道矢量字形（与 DOM 钮 SW_ICON 同一套形状，替代字符字形）
  const LANE_ICON = ["circle-f","diamond","tri-up","square"];

  // ===== 曲目(BPM 程序化生成固定谱:种子固定 → 谱面固定) =====
  const DEFAULT_LEVELS = [
    {id:"dew",  name:"晨露",     bpm:96,  bars:20, seed:8128,  base:57, grid:8,  tiers:[0.10,0.22,0.30,0.38], diff:"轻松"},
    {id:"fizz", name:"午后气泡", bpm:118, bars:24, seed:2718,  base:62, grid:8,  tiers:[0.14,0.28,0.38,0.48], diff:"进阶"},
    {id:"neon", name:"霓虹疾走", bpm:140, bars:28, seed:90125, base:64, grid:16, tiers:[0.08,0.15,0.21,0.28], diff:"狂热"}
  ];
  let LEVELS = DEFAULT_LEVELS;
  // ===== 关卡数据（DB 下发优先，本地缓存兜底） =====
  const LEVELS_KEY = "sw.beattap.v1.levels", LEVELS_VER_KEY = "sw.beattap.v1.levels.ver";
  function applyLevels(list, version){
    if(!Array.isArray(list) || !list.length) return false;
    LEVELS = list;
    try{ localStorage.setItem(LEVELS_KEY, JSON.stringify(list)); localStorage.setItem(LEVELS_VER_KEY, String(version || 0)); }catch(e){}
    return true;
  }
  function loadCachedLevels(){
    try{
      const v = parseInt(localStorage.getItem(LEVELS_VER_KEY), 10) || 0;
      const list = JSON.parse(localStorage.getItem(LEVELS_KEY) || "null");
      if(Array.isArray(list) && list.length){ LEVELS = list; return v; }
    }catch(e){}
    return 0;
  }
  loadCachedLevels();
  // 谱面配置解析（DB 下发结构 = 现有曲目结构；缺字段补默认，非法整批丢弃）
  function parseLevel(d, i){
    if(!d || typeof d !== "object") return null;
    const bpm = parseInt(d.bpm, 10), bars = parseInt(d.bars, 10), seed = parseInt(d.seed, 10);
    const base = parseInt(d.base, 10), grid = parseInt(d.grid, 10);
    if(!(bpm > 0) || !(bars > 0) || !isFinite(seed) || !isFinite(base) || !(grid > 0)) return null;
    let tiers = Array.isArray(d.tiers) && d.tiers.length === 4 ? d.tiers.map(Number) : null;
    if(!tiers || !tiers.every(t => isFinite(t))) tiers = [0.10, 0.22, 0.30, 0.38];
    return { id: String(d.id || ("song" + (i + 1))), name: String(d.name || ("曲目" + (i + 1))),
      bpm: bpm, bars: bars, seed: seed, base: base, grid: grid, tiers: tiers, diff: String(d.diff || "") };
  }
  function syncLevelsFromServer(){
    if(!GB.available || !GB.getLevels) return;   // 无桥：用默认/缓存曲目
    GB.getLevels("beat-tap").then(res => {
      if(!res || !Array.isArray(res.levels)) return;
      const list = [];
      for(let i = 0; i < res.levels.length; i++){
        let d;
        try{ d = JSON.parse(res.levels[i].dataJson); }catch(e){ return; }
        const def = parseLevel(d, i);
        if(!def) return;
        list.push(def);
      }
      if(applyLevels(list, res.version || 0)){
        charts = LEVELS.map(buildChart);
        buildMenu();
      }
    }).catch(() => {});
  }

  // ===== DOM =====
  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const overlay = $("overlay"), vMenu = $("vMenu"), vPause = $("vPause"), vResult = $("vResult");
  const songListEl = $("songList");
  const resGrade = $("resGrade"), resScore = $("resScore"), resNew = $("resNew");
  const resStats = $("resStats"), resBest = $("resBest");
  const menuBtn = $("menuBtn"), pauseBtn = $("pauseBtn"), muteBtn = $("muteBtn");
  const btnResume = $("btnResume"), btnMenu2 = $("btnMenu2"), btnMenu3 = $("btnMenu3"), btnRetry = $("btnRetry");
  const padEls = [...document.querySelectorAll(".pad")];

  // ===== 主题调色板:canvas 颜色全部读 CSS 变量 (GAME-THEME.md §3) =====
  const PAL = {};
  // 颜色工具：只做同色相明度推拉 / 透明度化，不引入新色相
  function colParse(c){
    c=String(c).trim();
    if(c.charAt(0)==="#")c=c.slice(1);
    if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
    if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
    const m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
    return m?[+m[1],+m[2],+m[3]]:[0,0,0];
  }
  function colMix(a,b,t){
    const A=colParse(a),B=colParse(b);
    return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
  }
  function colShade(c,t){return colMix(c,t<0?"rgb(0,0,0)":"rgb(255,255,255)",t<0?-t:t)}
  function shade(c,a){
    const s=String(c).trim();
    if(s.charAt(0)==="#"){
      const h=s.slice(1);let r,g,b;
      if(h.length===3){r=parseInt(h.charAt(0)+h.charAt(0),16);g=parseInt(h.charAt(1)+h.charAt(1),16);b=parseInt(h.charAt(2)+h.charAt(2),16);}
      else{r=parseInt(h.slice(0,2),16);g=parseInt(h.slice(2,4),16);b=parseInt(h.slice(4,6),16);}
      return "rgba("+r+","+g+","+b+","+a.toFixed(3)+")";
    }
    const m=s.match(/rgba?\(([^)]+)\)/);
    if(m){const p=m[1].split(",");return "rgba("+p[0]+","+p[1]+","+p[2]+","+a.toFixed(3)+")";}
    return s;
  }
  const PAL_MAP = {stage1:"--g-bt-stage1", stage2:"--g-bt-stage2", laneHi:"--g-bt-lane-hi",
    target:"--g-bt-target", border:"--g-border", text:"--g-text", muted:"--g-muted",
    perfect:"--g-primary-deep", good:"--g-water", danger:"--g-danger",
    primary:"--g-primary", warning:"--g-warning"};
  function palLoad(){
    const s = getComputedStyle(document.documentElement);
    for(const k in PAL_MAP){ const v = s.getPropertyValue(PAL_MAP[k]).trim(); if(v) PAL[k] = v; }
    PAL.lane = ["--g-primary","--g-water","--g-warning","--g-danger"].map(t => s.getPropertyValue(t).trim());
    // 派生：每条轨道的亮面 / 暗面（同色相明度推拉）
    PAL.laneHiC = PAL.lane.map(c => colShade(c, 0.38));
    PAL.laneLoC = PAL.lane.map(c => colShade(c, -0.34));
  }
  window.__gOnTheme = function(){ palLoad(); draw(); };
  palLoad();

  // ===== 谱面生成(mulberry32 固定种子) =====
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function buildChart(def){
    const rnd = mulberry32(def.seed);
    const beat = 60000 / def.bpm, barLen = beat * 4, slots = def.grid, slotLen = barLen / slots;
    const notes = [], events = [];
    const lastT = [-9e9,-9e9,-9e9,-9e9];
    for(let bar = 0; bar < def.bars; bar++){
      const t0 = bar * barLen;
      const tier = Math.min(3, Math.floor(bar / Math.max(1, def.bars - 2) * 4));
      // 鼓组
      events.push({t:t0, k:0}, {t:t0 + 2*beat, k:0});
      if(tier >= 1){
        events.push({t:t0 + beat, k:1}, {t:t0 + 3*beat, k:1});
        if(rnd() < 0.35) events.push({t:t0 + 3.5*beat, k:1});
      }
      for(let s = 0; s < slots; s += 2) events.push({t:t0 + s*slotLen, k:2, o:tier >= 2 && s === slots - 2 && rnd() < 0.5});
      // 贝斯(和弦进行)
      const root = def.base - 12 + CHORDS[bar % 4];
      if(tier === 0){
        events.push({t:t0, k:3, m:root, d:beat*1.7}, {t:t0 + 2*beat, k:3, m:root, d:beat*1.7});
      }else{
        for(let b = 0; b < 8; b++) events.push({t:t0 + b*beat/2, k:3, m:root + (b % 2 && rnd() < 0.35 ? 12 : 0), d:beat*0.42});
      }
      // 音符(即旋律)
      for(let s = 0; s < slots; s++){
        if(rnd() >= def.tiers[tier]) continue;
        const t = Math.round(t0 + s * slotLen);
        let lane = (rnd() * 4) | 0;
        if(t - lastT[lane] < 170) lane = (lane + 1 + ((rnd() * 3) | 0)) % 4;
        if(t - lastT[lane] < 170) continue;
        const m = def.base + LANE_OFF[lane] + (tier >= 2 && rnd() < 0.25 ? 12 : 0);
        notes.push({t, lane, m, judged:false});
        events.push({t, k:4, m});
        lastT[lane] = t;
        if(tier >= 2 && s % 4 === 0 && rnd() < 0.22){
          const l2 = (lane + 1 + ((rnd() * 3) | 0)) % 4;
          if(t - lastT[l2] >= 170){
            const m2 = def.base + LANE_OFF[l2];
            notes.push({t, lane:l2, m:m2, judged:false});
            events.push({t, k:4, m:m2});
            lastT[l2] = t;
          }
        }
      }
    }
    notes.sort((a,b) => a.t - b.t);
    events.sort((a,b) => a.t - b.t);
    const end = notes.length ? notes[notes.length-1].t + 1400 : def.bars * barLen;
    return {def, notes, events, end, duration:end + 600};
  }
  let charts = new Array(LEVELS.length).fill(null);

  // ===== WebAudio 合成(振荡器 + 噪声 + 包络,零外部音频) =====
  let actx = null, master = null, noiseBuf = null, audioFailed = false;
  function ensureAudio(){
    if(audioFailed) return;
    if(!actx){
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        actx = new AC();
        master = actx.createGain(); master.gain.value = muted?0:0.9;
        const comp = actx.createDynamicsCompressor();
        master.connect(comp); comp.connect(actx.destination);
        const len = actx.sampleRate | 0;
        noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
        const ch = noiseBuf.getChannelData(0);
        for(let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      }catch(e){ audioFailed = true; return; }
    }
    if(actx.state === "suspended") actx.resume().catch(() => {});
  }
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  function kick(at){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(150, at);
    o.frequency.exponentialRampToValueAtTime(48, at + 0.11);
    g.gain.setValueAtTime(0.85, at);
    g.gain.exponentialRampToValueAtTime(0.001, at + 0.18);
    o.connect(g); g.connect(master);
    o.start(at); o.stop(at + 0.2);
  }
  function snare(at){
    const s = actx.createBufferSource(); s.buffer = noiseBuf;
    const f = actx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1900; f.Q.value = 0.8;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.5, at);
    g.gain.exponentialRampToValueAtTime(0.001, at + 0.14);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(at); s.stop(at + 0.16);
    const o = actx.createOscillator(), g2 = actx.createGain();
    o.type = "triangle"; o.frequency.value = 185;
    g2.gain.setValueAtTime(0.28, at);
    g2.gain.exponentialRampToValueAtTime(0.001, at + 0.08);
    o.connect(g2); g2.connect(master);
    o.start(at); o.stop(at + 0.1);
  }
  function hat(at, open){
    const s = actx.createBufferSource(); s.buffer = noiseBuf;
    const f = actx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 7200;
    const g = actx.createGain(), d = open ? 0.22 : 0.045;
    g.gain.setValueAtTime(open ? 0.2 : 0.15, at);
    g.gain.exponentialRampToValueAtTime(0.001, at + d);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(at); s.stop(at + d + 0.02);
  }
  function bass(at, m, dur){
    const o = actx.createOscillator(), g = actx.createGain(), fl = actx.createBiquadFilter();
    o.type = "sawtooth"; o.frequency.value = midi(m);
    fl.type = "lowpass"; fl.frequency.value = 620; fl.Q.value = 1;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(0.3, at + 0.015);
    g.gain.setValueAtTime(0.24, at + Math.max(0.03, dur - 0.05));
    g.gain.exponentialRampToValueAtTime(0.001, at + dur + 0.05);
    o.connect(fl); fl.connect(g); g.connect(master);
    o.start(at); o.stop(at + dur + 0.08);
  }
  function pluck(at, m){
    const o = actx.createOscillator(), g = actx.createGain(), fl = actx.createBiquadFilter();
    o.type = "triangle"; o.frequency.value = midi(m);
    fl.type = "lowpass"; fl.frequency.value = 2600;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(0.27, at + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, at + 0.3);
    o.connect(fl); fl.connect(g); g.connect(master);
    o.start(at); o.stop(at + 0.35);
  }
  function blip(f, at, d, g0){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(g0, at);
    g.gain.exponentialRampToValueAtTime(0.001, at + d);

  }
  function tickFeedback(kind){
    if(!actx || actx.state !== "running") return;
    const t = actx.currentTime;
    if(kind === "p"){ blip(1318.5, t, 0.05, 0.16); blip(1760, t + 0.012, 0.05, 0.12); }
    else if(kind === "g"){ blip(880, t, 0.06, 0.15); }
    else { blip(196, t, 0.05, 0.08); }
  }
  function playEvent(ev, at){
    if(ev.k === 0) kick(at);
    else if(ev.k === 1) snare(at);
    else if(ev.k === 2) hat(at, ev.o);
    else if(ev.k === 3) bass(at, ev.m, ev.d / 1000);
    else pluck(at, ev.m);
  }

  // ===== 游戏状态 =====
  let state = "menu";          // menu | playing | paused | over
  let song = null, curIdx = 0, evCursor = 0;
  let score = 0, combo = 0, maxCombo = 0, cnt = {p:0, g:0, m:0};
  let startAt = 0, usePerf = false, perfStart = 0, perfPauseAt = 0;
  let floats = [], rings = [], padFlash = [0,0,0,0], comboPulse = 0;
  let parts = [], pScore = 0, scorePop = 0, ringMark = 0;
  let cw = 360, chh = 480, dpr = 1;
  let lastT = performance.now();

  const lineY = () => chh - Math.max(84, chh * 0.16);
  function songTime(){
    if(usePerf || !actx) return performance.now() - perfStart;
    return (actx.currentTime - startAt) * 1000;
  }

  // ===== 音乐调度器(lookahead,挂起时音频时钟冻结 → 天然暂停) =====
  function pump(){
    if(!actx || !song || state === "menu") return;
    const horizon = actx.currentTime + 0.16, evs = song.events;
    while(evCursor < evs.length && startAt + evs[evCursor].t / 1000 < horizon){
      playEvent(evs[evCursor], startAt + evs[evCursor].t / 1000);
      evCursor++;
    }
  }
  setInterval(pump, 30);

  // ===== 存档(localStorage,try/catch) =====
  function getRecords(){
    try{ return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }catch(e){ return {}; }
  }
  function saveRecords(r){
    try{ localStorage.setItem(KEY, JSON.stringify(r)); }catch(e){}
    if(GB.available) GB.saveState("beat-tap", r).catch(() => {});
  }
  // 账号存档：逐曲取历史最佳（本地与账号取更高分），然后刷新选曲页
  function syncSaveFromServer(){
    if(!GB.available || !GB.loadState) return;
    GB.loadState("beat-tap").then(res => {
      if(!res || !res.stateJson) return;
      try{
        const remote = JSON.parse(res.stateJson);
        if(!remote || typeof remote !== "object") return;
        const recs = getRecords();
        let changed = false;
        for(const id in remote){
          const r = remote[id];
          if(!r || typeof r.score === "undefined") continue;
          const rs = parseInt(r.score, 10) || 0;
          const mine = recs[id];
          if(!mine || rs > (parseInt(mine.score, 10) || 0)){
            recs[id] = {score: rs, grade: String(r.grade || (mine ? mine.grade : ""))};
            changed = true;
          }
        }
        if(changed){ saveRecords(recs); buildMenu(); }
      }catch(e){}
    }).catch(() => {});
  }

  // ===== 覆盖层视图 =====
  function showView(name){
    overlay.hidden = false;
    vMenu.hidden = name !== "menu";
    vPause.hidden = name !== "pause";
    vResult.hidden = name !== "result";
  }
  function hideOverlay(){ overlay.hidden = true; }
  function buildMenu(){
    const recs = getRecords();
    songListEl.innerHTML = LEVELS.map((s, i) => {
      const r = recs[s.id];
      const dur = Math.round((charts[i] ? charts[i].end : s.bars * 4 * 60000 / s.bpm) / 1000);
      const cls = r ? " g-" + r.grade : "";
      return `<button type="button" class="song" data-i="${i}" style="animation-delay:${i*40}ms">` +
        `<span class="sic">${SW_ICON("music")}</span>` +
        `<span class="sidx">0${i+1}</span>` +
        `<span class="smain"><b>${s.name}</b><small>${s.bpm} BPM · 约${dur}秒 · ${s.diff}</small></span>` +
        `<span class="sbest${cls}">${r ? r.score + " · " + r.grade : "未挑战"}</span></button>`;
    }).join("");
    songListEl.querySelectorAll(".song").forEach(b => b.addEventListener("click", () => startSong(+b.dataset.i)));
  }

  // ===== 流程 =====
  function startSong(i){
    curIdx = i;
    if(!charts[i]) charts[i] = buildChart(LEVELS[i]);
    song = charts[i];
    song.notes.forEach(n => { n.judged = false; });
    score = 0; combo = 0; maxCombo = 0; cnt = {p:0, g:0, m:0};
    floats = []; rings = []; padFlash = [0,0,0,0]; comboPulse = 0; evCursor = 0;
    parts = []; pScore = 0; scorePop = 0; ringMark = 0;

  }
  function pauseGame(){
    if(state !== "playing") return;

  }
  function resumeGame(){

  }
  function toMenu(){
    state = "menu"; song = null;

  }
  function finish(){
    if(state !== "playing") return;

    const acc = total ? (300 * cnt.p + 150 * cnt.g) / (300 * total) : 0;
    const grade = acc >= 0.95 ? "S" : acc >= 0.85 ? "A" : acc >= 0.7 ? "B" : "C";
    let isNew = false, best = null;
    try{
      const recs = getRecords();
      const prev = recs[song.def.id] || null;
      if(!prev || score > prev.score){
        recs[song.def.id] = {score, grade};
        saveRecords(recs);
        isNew = true;
      }
      best = getRecords()[song.def.id] || null;

    // 成绩上报（最高分 / 准确率%，desc：越大越好）
    if(GB.available) GB.reportScore("beat-tap", {metricValue: score, metricExtra: Math.round(acc * 100)}).catch(() => {});
    resGrade.textContent = grade;
    resGrade.className = "grade g-" + grade;
    resScore.textContent = String(score);
    resNew.hidden = !isNew;
    resStats.innerHTML =
      `<span>Perfect<b>${cnt.p}</b></span><span>Good<b>${cnt.g}</b></span>` +
      `<span>Miss<b>${cnt.m}</b></span><span>最大连击<b>${maxCombo}</b></span>` +
      `<span>准确率<b>${Math.round(acc * 100)}%</b></span><span>音符数<b>${total}</b></span>`;
    resBest.textContent = (best ? `本曲最佳 ${best.score} · ${best.grade}` : "") +

  }

  // ===== 判定 =====
  function hitLane(lane){
    padFlash[lane] = 1;
    if(state !== "playing") return;
    const st = songTime();
    let bestN = null, bd = 1e9;
    for(const n of song.notes){
      if(n.t > st + WIN_G) break;
      if(n.judged || n.lane !== lane) continue;
      const d = Math.abs(n.t - st);
      if(d < bd){ bd = d; bestN = n; }
    }
    if(!bestN){ tickFeedback("w"); return; }        // 空击:仅音效,不惩罚
    bestN.judged = true;
    const per = bd <= WIN_P;
    if(per) cnt.p++; else cnt.g++;
    combo++;
    if(combo > maxCombo) maxCombo = combo;
    score += per ? 300 + Math.min(combo, 50) * 2 : 150 + Math.min(combo, 50);
    rings.push({lane, life:1});
    floats.push({x:laneX(lane), y:lineY() - 28, text:per ? "PERFECT" : "GOOD", col:per ? PAL.perfect : PAL.good, life:1});
    if(combo % 25 === 0) floats.push({x:cw/2, y:chh*0.32, text:combo + " COMBO", col:PAL.warning, life:1.3});

  }
  const laneX = lane => cw / 4 * lane + cw / 8;

  // ===== 效果更新(dt) =====
  function updFx(dt){
    for(let i = 0; i < 4; i++) padFlash[i] = Math.max(0, padFlash[i] - dt * 5);
    comboPulse = Math.max(0, comboPulse - dt * 4);
    if(score !== pScore){ scorePop = 1; pScore = score; }
    scorePop = Math.max(0, scorePop - dt * 3.2);
    // 命中粒子：由 rings 新增触发（纯渲染层，不改判定）
    if(rings.length > ringMark){
      for(let i = ringMark; i < rings.length; i++){
        const r = rings[i], x = laneX(r.lane), y = lineY();
        for(let k = 0; k < 10; k++){
          const a = Math.random() * 6.28, sp = 40 + Math.random() * 120;
          parts.push({x:x, y:y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 30,
            r:1.4 + Math.random() * 2.4, c:PAL.lane[r.lane], life:0, ttl:.32 + Math.random() * .26});
        }
      }
      ringMark = rings.length;
    }
    if(rings.length < ringMark) ringMark = rings.length;
    floats = floats.filter(f => { f.y -= dt * 55; f.life -= dt * 1.3; return f.life > 0; });
    rings = rings.filter(r => { r.life -= dt * 2.4; return r.life > 0; });
    parts = parts.filter(p => {
      p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt;
      return p.life < p.ttl;
    });
  }

  // ===== 渲染 =====
  function rr(x, y, w, h, r){
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  // 轻立体三件套：投影 + 渐变体 + 高光（颜色全部取自 PAL，无字面色）
  function orb(x, y, r, a, b, c){
    const g = ctx.createRadialGradient(x - r * .34, y - r * .38, r * .1, x, y, r * 1.05);
    g.addColorStop(0, a); g.addColorStop(.45, b); g.addColorStop(1, c);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  /* 轨道矢量字形：与 DOM 钮 SW_ICON 同一形状语言，替代字符字形 */
  function laneGlyph(lane, x, y, s){
    if(lane === 3){ rr(x - s * .8, y - s * .8, s * 1.6, s * 1.6, s * .3); return; }
    ctx.beginPath();
    if(lane === 0) ctx.arc(x, y, s, 0, Math.PI * 2);
    else if(lane === 1){ ctx.moveTo(x, y - s); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s, y); ctx.closePath(); }
    else { ctx.moveTo(x, y - s); ctx.lineTo(x + s * .92, y + s * .75); ctx.lineTo(x - s * .92, y + s * .75); ctx.closePath(); }
  }
  /* 地面：赛道「面」渐变 + 顶部品牌光晕 + 隔行「面」+ 沟槽（墙） */
  function drawStage(w, h, lw){
    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, PAL.stage1); bg.addColorStop(1, PAL.stage2);
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    const glow = ctx.createRadialGradient(w / 2, -h * .18, 10, w / 2, -h * .18, h * .95);
    glow.addColorStop(0, shade(PAL.primary, .22)); glow.addColorStop(1, shade(PAL.primary, 0));
    ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = shade(PAL.laneHi, .42);
    ctx.fillRect(0, 0, lw, h); ctx.fillRect(lw * 2, 0, lw, h);
    for(let i = 1; i < 4; i++){
      ctx.fillStyle = shade(PAL.stage2, -.28); ctx.fillRect(i * lw - 1, 0, 2, h);
      ctx.fillStyle = shade(PAL.laneHi, .32); ctx.fillRect(i * lw + 1, 0, 1, h);
    }
  }
  /* 目标区：凹槽带（进深）+ 亮判定线 */
  function drawBand(w, ly){
    ctx.fillStyle = shade(PAL.stage2, -.26);
    ctx.fillRect(0, ly - 34, w, 34);
    ctx.fillStyle = shade(PAL.laneHi, .4);
    ctx.fillRect(0, ly - 34, w, 1);
    ctx.save();
    ctx.shadowColor = shade(PAL.target, .8); ctx.shadowBlur = 10;
    ctx.fillStyle = PAL.target; ctx.fillRect(0, ly - 1.5, w, 3);
    ctx.restore();
  }
  /* 目标：每轨道接收环 + 矢量字形（按下时填充反馈） */
  function drawReceptors(ly, size){
    const r = size * .46;
    for(let i = 0; i < 4; i++){
      const x = laneX(i);
      if(padFlash[i] > 0){
        ctx.globalAlpha = padFlash[i] * .38;
        ctx.fillStyle = PAL.lane[i];
        ctx.beginPath(); ctx.arc(x, ly, r, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.lineWidth = 2.5; ctx.strokeStyle = PAL.lane[i];
      ctx.beginPath(); ctx.arc(x, ly, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.92)";   // 恒白字形
      laneGlyph(i, x, ly, size * .26); ctx.fill();
    }
  }
  /* 轨迹：音符为渐变「面」+ 倒角 + 恒白高光 + 落地投影 + 矢量字形，上方带速度拖尾 */
  function drawNote(x, y, s, lane){
    const hw = s / 2, base = PAL.lane[lane];
    if(!window.__gRM){
      const tg = ctx.createLinearGradient(0, y - s * 1.7, 0, y);
      tg.addColorStop(0, shade(base, 0)); tg.addColorStop(1, shade(base, .38));
      ctx.fillStyle = tg;
      rr(x - hw * .45, y - s * 1.7, s * .9, s * 1.7, s * .45); ctx.fill();
    }
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.34)"; ctx.shadowBlur = s * .28; ctx.shadowOffsetY = s * .14;
    const g = ctx.createLinearGradient(0, y - hw, 0, y + hw);
    g.addColorStop(0, PAL.laneHiC[lane]); g.addColorStop(.55, base); g.addColorStop(1, PAL.laneLoC[lane]);
    ctx.fillStyle = g; rr(x - hw, y - hw, s, s, s * .3); ctx.fill();
    ctx.restore();
    ctx.lineWidth = Math.max(1.2, s * .05); ctx.strokeStyle = shade(PAL.laneLoC[lane], -.22);
    rr(x - hw, y - hw, s, s, s * .3); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.42)";   // 恒白高光
    ctx.beginPath(); ctx.ellipse(x - hw * .32, y - hw * .42, s * .26, s * .15, -.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.96)";   // 恒白字形
    laneGlyph(lane, x, y, s * .3); ctx.fill();
  }
  function draw(){
    const w = cw, h = chh, lw = w / 4, ly = lineY();
    const size = Math.min(64, lw * 0.7);
    ctx.clearRect(0, 0, w, h);
    drawStage(w, h, lw);
    drawBand(w, ly);
    drawReceptors(ly, size);
    if(state === "menu"){
      const t = performance.now() / 1000;
      for(let i = 0; i < 4; i++){
        ctx.globalAlpha = 0.3 + 0.25 * (1 + Math.sin(t * 2 + i * 1.4)) / 2;
        orb(laneX(i), ly, 13, PAL.laneHiC[i], PAL.lane[i], PAL.laneLoC[i]);
      }
      ctx.globalAlpha = 1;
      return;
    }
    const st = songTime();
    // 进度条（轨道顶缘）
    const prog = Math.max(0, Math.min(1, st / song.duration));
    ctx.fillStyle = shade(PAL.target, .16); rr(0, 0, w, 5, 2.5); ctx.fill();
    if(prog > 0.004){ ctx.fillStyle = PAL.primary; rr(0, 0, Math.max(5, w * prog), 5, 2.5); ctx.fill(); }
    // 音符（轨迹层）
    for(const n of song.notes){
      if(n.judged) continue;
      const frac = (n.t - st) / APPROACH;
      if(frac > 1) break;
      if(frac < -0.13) continue;
      drawNote(laneX(n.lane), ly - frac * (ly + size), size, n.lane);
    }
    // 命中涟漪
    for(const r of rings){
      ctx.globalAlpha = Math.max(0, r.life) * .8;
      ctx.strokeStyle = PAL.lane[r.lane]; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(laneX(r.lane), ly, 18 + (1 - r.life) * 44, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
    // 命中粒子
    for(const p of parts){
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.ttl);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 判定浮字
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.font = "700 14px " + FONT;
    for(const f of floats){
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
      ctx.fillStyle = f.col;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    if(combo >= 2){
      const s = 1 + comboPulse * .18;
      ctx.save(); ctx.translate(w / 2, h * .2); ctx.scale(s, s);
      ctx.fillStyle = PAL.perfect; ctx.font = "800 36px " + FONT; ctx.textAlign = "center";
      ctx.fillText(String(combo), 0, 0);
      ctx.fillStyle = PAL.muted; ctx.font = "600 12px " + FONT;
      ctx.fillText("COMBO", 0, 18);
      ctx.restore();
    }
    // HUD：曲名 / 分数（分数变化轻弹）
    ctx.textAlign = "left"; ctx.fillStyle = PAL.muted; ctx.font = "600 12px " + FONT;
    ctx.fillText(song.def.name + " · " + song.def.bpm + " BPM", 14, 22);
    ctx.textAlign = "right"; ctx.fillStyle = PAL.muted; ctx.font = "600 12px " + FONT;
    ctx.fillText("分数", w - 14, 22);
    ctx.save(); ctx.translate(w - 14, 46); ctx.scale(1 + scorePop * .18, 1 + scorePop * .18);
    ctx.fillStyle = PAL.text; ctx.font = "800 22px " + FONT; ctx.textAlign = "right";
    ctx.fillText(String(score), 0, 0); ctx.restore();
    if(st < song.notes[0].t - 300){
      ctx.fillStyle = PAL.muted; ctx.font = "600 14px " + FONT; ctx.textAlign = "center";
      ctx.fillText("音符落至亮线时 点击对应轨道", w / 2, h * .42);
    }
  }

  // ===== 输入 =====
  padEls.forEach(b => {
    const lane = +b.dataset.lane;
    b.addEventListener("pointerdown", e => {
      e.preventDefault();
      b.classList.add("on");
      ensureAudio();
      hitLane(lane);
    });
    const off = () => b.classList.remove("on");
    b.addEventListener("pointerup", off);
    b.addEventListener("pointercancel", off);
    b.addEventListener("pointerleave", off);
  });
  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    ensureAudio();
    if(state === "paused"){ resumeGame(); return; }
    if(state !== "playing") return;
    // 命中补偿：canvas 被 CSS 缩放时按显示尺寸反算逻辑坐标
    const r = cv.getBoundingClientRect();
    const sx = r.width ? cw / r.width : 1;
    const px = (e.clientX - r.left) * sx;
    const lane = Math.max(0, Math.min(3, Math.floor(px / (cw / 4))));
    hitLane(lane);
  });
  document.addEventListener("keydown", e => {
    if(e.repeat) return;
    const li = LANE_KEYS.indexOf(e.key.toUpperCase());
    if(li >= 0){ ensureAudio(); hitLane(li); return; }
    if(e.code === "Space"){
      e.preventDefault();
      if(state === "playing") pauseGame();
      else if(state === "paused") resumeGame();
    }else if(e.code === "Escape" && state !== "menu"){ toMenu(); }
  });
/* 静音:偏好独立存档键 sw.beattap.audio.v1(新键按现行规范),master 建立后也生效 */
  const MKEY = "sw.beattap.audio.v1";
  let muted = false;
  try { muted = JSON.parse(localStorage.getItem(MKEY)).muted === true; } catch(e) {}
  /* 按钮图标：文字前内联 SVG（SW_ICON 范式），仅变化时改写，避免每帧动 DOM */
  function syncBtns(){
    const mb = muteBtn, mw = muted ? "mute" : "sound";
    if(mb.dataset.ic !== mw){ mb.dataset.ic = mw; mb.innerHTML = SW_ICON(mw) + "<span>" + (muted ? "已静音" : "静音") + "</span>"; }
    mb.setAttribute("aria-pressed", String(muted));
    const pb = pauseBtn, pw = state === "paused" ? "play" : "pause";
    if(pb.dataset.ic !== pw){ pb.dataset.ic = pw; pb.innerHTML = SW_ICON(pw) + "<span>" + (state === "paused" ? "继续" : "暂停") + "</span>"; }
  }
  function applyMute() {
    if (master) master.gain.value = muted ? 0 : 0.9;
    syncBtns();
  }
  function saveMute() { try { localStorage.setItem(MKEY, JSON.stringify({ muted })); } catch(e) {} }
  muteBtn.addEventListener("click", () => { muted = !muted; saveMute(); applyMute(); });
  pauseBtn.addEventListener("click", () => { if(state === "playing") pauseGame(); else if(state === "paused") resumeGame(); });
  btnResume.addEventListener("click", resumeGame);
  btnMenu2.addEventListener("click", toMenu);
  btnMenu3.addEventListener("click", toMenu);
  btnRetry.addEventListener("click", () => startSong(curIdx));

  // 切后台自动暂停(音频挂起)
  document.addEventListener("visibilitychange", () => {
    if(document.hidden && state === "playing") pauseGame();
  });

  // ===== 画布尺寸 =====
  function fit(){
    const r = cv.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cw = Math.max(200, r.width); chh = Math.max(240, r.height);
    cv.width = Math.round(cw * dpr); cv.height = Math.round(chh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);

  // ===== 主循环(dt 效果 + 时钟驱动音符) =====
  function loop(now){
    requestAnimationFrame(loop);
    let dt = (now - lastT) / 1000; lastT = now;
    if(!(dt > 0)) dt = 0.016;
    if(dt > 0.1) dt = 0.1;
    if(state === "playing"){
      const st = songTime();
      for(const n of song.notes){
        if(!n.judged && st - n.t > WIN_G){
          n.judged = true; cnt.m++; combo = 0;
          floats.push({x:laneX(n.lane), y:lineY() + 26, text:"MISS", col:PAL.danger, life:1});
        }
      }
      if(st >= song.end) finish();
      updFx(dt);
    }else if(state === "over" || state === "paused"){
      updFx(dt * 0.4);
    }
    draw();
    if(state === "paused") syncBtns();
  }

  // ===== 启动 =====
  buildMenu();
  showView("menu");
  fit();
  // 按钮图标：文字前内联 SVG（SW_ICON 范式，24 viewBox / currentColor / aria-hidden）
  menuBtn.innerHTML = SW_ICON("grid") + "<span>选曲</span>";
  padEls.forEach(b => { b.querySelector(".pi").innerHTML = SW_ICON(LANE_ICON[+b.dataset.lane]); });
  btnMenu2.innerHTML = SW_ICON("grid") + "<span>返回选曲</span>";
  btnMenu3.innerHTML = SW_ICON("grid") + "<span>返回选曲</span>";
  btnResume.innerHTML = SW_ICON("play") + "<span>继续</span>";
  btnRetry.innerHTML = SW_ICON("rotate") + "<span>再来一次</span>";
  syncBtns();
  applyMute();
  requestAnimationFrame(loop);
  syncLevelsFromServer();syncSaveFromServer();

  // QA 钩子(自动化测试用,不影响玩法)
  window.__bt = {
    start: i => { startSong(i === undefined ? 0 : i); return {notes:song.notes.length, events:song.events.length, end:song.end}; },
    hit: hitLane, time: () => Math.round(songTime()),
    state: () => state, score: () => score
  };
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
