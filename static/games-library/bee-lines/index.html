<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（--g-bel-* 为本作素材色，深色为同色相压暗变体）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-bel-ground1:#EDF6E2;--g-bel-ground2:#D3E5BE;--g-bel-petal1:#F6C453;--g-bel-petal2:#C97A14;--g-bel-bee1:#F7D154;--g-bel-bee2:#C98F1E;--g-bel-hive1:#E0A95E;--g-bel-hive2:#9A621C;color-scheme:light }

  body {

    background: var(--g-surface2); color: var(--g-text);

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束）

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var BL={W:340,H:260,HIVE:[170,238],LEVEL_COUNT:40};
BL.dist=function(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1])};
/* Held-Karp：载重≤cap 且环路≤energy 时可采的最大蜜量（flowers[i]=[x,y,n]） */
BL.maxCollect=function(flowers,cap,energy,hive){
  var n=flowers.length,full=1<<n,i,j,m;
  var dh=[],dd=[];
  for(i=0;i<n;i++){
    dh.push(BL.dist(hive,flowers[i]));
    dd.push([]);
    for(j=0;j<n;j++)dd[i].push(BL.dist(flowers[i],flowers[j]));
  }
  var dp=[];
  for(m=0;m<full;m++)dp.push(new Array(n).fill(1e9));
  for(i=0;i<n;i++)dp[1<<i][i]=dh[i];
  var best=0,bestMask=0,bestLoop=0;
  for(m=1;m<full;m++){
    var load=0;
    for(i=0;i<n;i++)if(m>>i&1)load+=flowers[i][2];
    if(load>cap)continue;
    for(i=0;i<n;i++){
      if(!(m>>i&1))continue;
      var cur=dp[m][i];
      if(cur>1e8)continue;
      var loop=cur+dh[i];
      if(loop<=energy&&load>best){best=load;bestMask=m;bestLoop=loop;}
      for(j=0;j<n;j++){
        if(m>>j&1)continue;
        if(load+flowers[j][2]>cap)continue;
        var nm=m|(1<<j),nv=cur+dd[i][j];
        if(nv<dp[nm][j])dp[nm][j]=nv;
      }
    }
  }
  return {best:best,mask:bestMask,loop:Math.round(bestLoop*10)/10};
};
BL.routeDist=function(flowers,route,hive){
  var d=0,prev=hive;
  for(var i=0;i<route.length;i++){d+=BL.dist(prev,flowers[route[i]]);prev=flowers[route[i]];}
  return Math.round((d+BL.dist(prev,hive))*10)/10;
};
/* 生成：花位随机（间距约束），cap/体力由最优解回推，target=最优蜜量（必须满规划） */
BL.genLevel=function(no){
  for(var attempt=0;attempt<20;attempt++){
    var rng=mulberry32(77000+no*613+attempt*17);
    var n=4+Math.min(4,Math.floor((no-1)/8));
    var flowers=[],tries=0;
    while(flowers.length<n&&tries<300){
      tries++;
      var fx=30+rng()*280,fy=22+rng()*175;
      var p=[Math.round(fx),Math.round(fy)];
      if(BL.dist(p,BL.HIVE)<52)continue;
      var okP=true;
      for(var q=0;q<flowers.length;q++)if(BL.dist(p,flowers[q])<40){okP=false;break;}
      if(!okP)continue;
      p.push(1+Math.floor(rng()*3));
      flowers.push(p);
    }
    if(flowers.length<n)continue;
    var cap=Math.round((2.5+rng()*1.5+no*0.04)*2)/2;
    var total=0;
    for(var t2=0;t2<n;t2++)total+=flowers[t2][2];
    var inf=BL.maxCollect(flowers,cap,1e9,BL.HIVE);
    if(inf.best<3||total<inf.best+2)continue;   // 必须有取舍（载重约束生效）
    var slack=Math.max(4,26-no*0.5);
    var energy=Math.round((inf.loop+slack)*10)/10;
    var lv={name:"采蜜·"+(no<10?"0":"")+no,hive:BL.HIVE.slice(),flowers:flowers,
      cap:cap,energy:energy,target:inf.best,par:inf.best,difficulty:Math.min(9,1+Math.floor(no/5))};
    var re=BL.maxCollect(flowers,cap,energy,BL.HIVE);
    if(re.best<lv.target)continue;
    return lv;
  }
  return BL.genLevel(no>1?no-1:1);
};
/* 结构校验 */
BL.validate=function(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return{ok:false,why:"bad"};
  if(!Array.isArray(d.hive)||d.hive.length!==2)return{ok:false,why:"hive"};
  if(!Array.isArray(d.flowers)||d.flowers.length<3||d.flowers.length>10)return{ok:false,why:"flowers"};
  var total=0;
  for(var i=0;i<d.flowers.length;i++){
    var f=d.flowers[i];
    if(!Array.isArray(f)||f.length!==3)return{ok:false,why:"f"+i};
    if(!isFinite(f[0])||!isFinite(f[1])||f[0]<0||f[0]>BL.W||f[1]<0||f[1]>BL.H)return{ok:false,why:"fpos"+i};
    if(!Number.isInteger(f[2])||f[2]<1||f[2]>3)return{ok:false,why:"fn"+i};
    total+=f[2];
  }
  if(!isFinite(d.cap)||d.cap<=0||d.cap>20)return{ok:false,why:"cap"};
  if(!isFinite(d.energy)||d.energy<20)return{ok:false,why:"energy"};
  if(!isFinite(d.target)||d.target<1||d.target>total)return{ok:false,why:"target"};
  var best=BL.maxCollect(d.flowers,d.cap,d.energy,d.hive);
  if(best.best<d.target)return{ok:false,why:"unsolvable"};
  return{ok:true,why:"",best:best.best};
};
BL.validateAll=function(){
  var fails=[],tight=0,i;
  for(i=1;i<=BL.LEVEL_COUNT;i++){
    var L=BL.genLevel(i),r=BL.validate(L);
    if(!r.ok)fails.push(i+"("+r.why+")");
    if(r.best===L.target)tight++;
  }
  return {total:BL.LEVEL_COUNT,solvable:BL.LEVEL_COUNT-fails.length,fail:fails,tight:tight};
};
BL.runTests=function(){
  var pass=0,rows=[];
  function ck(name,ok,got){rows.push({name:name,ok:!!ok,got:got});if(ok)pass++;}
  var F=[[30,0,2],[0,40,3],[100,100,1]],H=[0,0];
  var a=BL.maxCollect(F,5,1e9,H);
  ck("锚点·载重约束最优 5",a.best===5&&a.loop===120,"best="+a.best+",loop="+a.loop);
  var b=BL.maxCollect(F,5,119,H);
  ck("锚点·体力约束最优 3",b.best===3,"best="+b.best);
  var c=BL.maxCollect(F,2,1e9,H);
  ck("锚点·小载重最优 2",c.best===2,"best="+c.best);
  var d1=BL.routeDist(F,[0,1],H);
  ck("锚点·航线距离 120",d1===120,d1);
  var L1=BL.genLevel(1),v1=BL.validate(L1);
  ck("第1关可解且达标",v1.ok&&v1.best>=L1.target,"best="+v1.best+"/"+L1.target);
  var r=BL.validateAll();
  ck("40 关全可解",r.fail.length===0,"fail="+r.fail.join(","));
  var L2=JSON.stringify(BL.genLevel(7)),L3=JSON.stringify(BL.genLevel(7));
  ck("生成确定性",L2===L3,"replay");
  return {total:7,pass:pass,rows:rows,levels:r};
};
globalThis.__XC=BL;
/*XC-CORE-END*/

/* ========== 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ========== */
var GAME_KEY="bee-lines",SAVE_KEY="sw.beelines.v1";
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=BL.LEVEL_COUNT;i++)list.push(BL.genLevel(i));
  return list;
}
var LEVELS=buildDefaultLevels();
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!BL.validate(d).ok)return null;
    var no=parseInt(row.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=1;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return BL.validate(d).ok})){
      LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      loadLevel(cur);
    }
  }).catch(function(){});
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:parseInt(s.lv,10)||0,best:parseInt(s.best,10)||1}}catch(e){return{lv:0,best:1}}}

/* ========== 调色板（canvas 颜色全部经 PAL 读 CSS 变量；派生色用同色相明度推拉） ========== */
var SYSFONT='-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
var PAL={};
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   //恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  var dark=document.documentElement.dataset.theme==="dark";
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),deep:v("--g-primary-deep"),
    ground1:v("--g-bel-ground1"),ground2:v("--g-bel-ground2"),
    petal1:v("--g-bel-petal1"),petal2:v("--g-bel-petal2"),
    bee1:v("--g-bel-bee1"),bee2:v("--g-bel-bee2"),
    hive1:v("--g-bel-hive1"),hive2:v("--g-bel-hive2")};
  PAL.groundHi=colShade(PAL.ground1,0.20);
  PAL.petalHi=colShade(PAL.petal1,0.38);
  PAL.beeHi=colShade(PAL.bee1,0.42);  PAL.beeLo=colShade(PAL.bee2,-0.30);
  PAL.honey=colMix(PAL.petal1,PAL.hive1,0.45);
  PAL.shadow=dark?"rgba(0,0,0,0.42)":"rgba(0,0,0,0.18)";
  PAL.badgeText=dark?PAL.bg:PAL.surface;
}
window.__gOnTheme=function(){palLoad();draw()};
palLoad();

var cv=document.getElementById("cv"),ctx=cv.getContext("2d");

var cur=save.lv,L=null,route=[],state="edit";
var fly=null;   // {s: 已飞距离, path:[[x,y]..], legs:[累计长度], collected}

function loadLevel(n){

/* ---------- 交互 ---------- */
function toggleFlower(i){
  if(state!=="edit")return;
  var at=route.indexOf(i);
  if(at>=0){route.splice(at,1);say("已从航线移除一朵");}
  else{
    if(loadOf(route)+L.flowers[i][2]>L.cap){say("超载了（载重 "+L.cap+"），先去掉一朵");return;}
    route.push(i);
    say("第 "+route.length+" 站已加入航线");
  }
  syncHud();draw();
}
function flyRoute(){
  if(state!=="edit")return;
  if(!route.length){say("先点花朵规划航线");return;}
  var d=BL.routeDist(L.flowers,route,L.hive);
  if(d>L.energy){say("航程 "+d+" 超出体力 "+L.energy+"，去掉一站试试");return;}
  //构造折线与累计腿长
  var path=[L.hive.slice()],legs=[0],acc2=0,prev=L.hive;
  for(var i=0;i<route.length;i++){
    var p=L.flowers[route[i]];
    acc2+=BL.dist(prev,p);legs.push(acc2);path.push(p.slice());prev=p;
  }
  acc2+=BL.dist(prev,L.hive);legs.push(acc2);path.push(L.hive.slice());

/* ========== 特效（纯渲染层：粒子 / 浮字 / 选中弹跳） ========== */
var parts=[],floats=[],selPop=[];
var fxCol=0,fxState="",fxBeePos=null;
var sceneT0=-1,lastLv=-1;
function sceneTime(){
  if(sceneT0<0||lastLv!==cur){sceneT0=performance.now();lastLv=cur;}
  return (performance.now()-sceneT0)/1000;
}
function puff(x,y,c,n,up){
  if(window.__gRM)return;
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28,sp=40+Math.random()*110;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(up||30),r:1.4+Math.random()*2.2,c:c,life:0,ttl:0.4+Math.random()*0.3});
  }
}
function addFloat(x,y,txt,c){if(!window.__gRM)floats.push({x:x,y:y,txt:txt,c:c,life:0,ttl:1.0})}
function bumpStat(el){
  if(!el||window.__gRM)return;
  el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");
}
function updateFx(dt){
  var i;
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.vy+=380*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life+=dt;if(p.life>=p.ttl)parts.splice(i,1);}
  for(i=floats.length-1;i>=0;i--){var f=floats[i];f.life+=dt;f.y-=18*dt;if(f.life>=f.ttl)floats.splice(i,1);}
  for(i=0;i<selPop.length;i++){
    var tgt=(route.indexOf(i)>=0)?1:0;
    selPop[i]=window.__gRM?tgt:selPop[i]+(tgt-selPop[i])*Math.min(1,dt*10);
  }
}

/* ========== 绘制 ========== */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawGround(){
  var g=ctx.createLinearGradient(0,0,0,NH);g.addColorStop(0,PAL.ground1);g.addColorStop(1,PAL.ground2);
  ctx.fillStyle=g;ctx.fillRect(0,0,NW,NH);
  ctx.save();ctx.globalAlpha=0.06;ctx.fillStyle=PAL.groundHi;
  for(var y=0;y<NH;y+=30)if(((y/30)|0)%2===0)ctx.fillRect(0,y,NW,15);
  ctx.restore();
}
function drawRoute(){
  if(!route.length)return;
  var pts=[L.hive],i;
  for(i=0;i<route.length;i++)pts.push(L.flowers[route[i]]);
  pts.push(L.hive);
  ctx.save();ctx.strokeStyle=PAL.deep;ctx.globalAlpha=0.5;ctx.lineWidth=2.4;ctx.lineCap="round";ctx.setLineDash([7,6]);
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
}
function drawHive(){
  var st=sceneTime(),p=window.__gRM?1:Math.max(0,Math.min(1,st/0.3)),e=1-Math.pow(1-p,2),s=0.6+0.4*e;
  ctx.save();ctx.globalAlpha=e;ctx.translate(L.hive[0],L.hive[1]);ctx.scale(s,s);
  ctx.fillStyle=PAL.shadow;ctx.beginPath();ctx.ellipse(0,15,19,6,0,0,7);ctx.fill();
  var ts=[[-18,-2,36,16,7],[-14,-12,28,12,6],[-9,-21,18,11,5]],i;
  for(i=0;i<ts.length;i++){var t=ts[i],g=ctx.createLinearGradient(0,t[1],0,t[1]+t[3]);g.addColorStop(0,PAL.hive1);g.addColorStop(1,PAL.hive2);ctx.fillStyle=g;rr(t[0],t[1],t[2],t[3],t[4]);ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=colShade(PAL.hive2,-0.25);ctx.stroke();}
  ctx.fillStyle=colShade(PAL.hive2,-0.55);ctx.beginPath();ctx.arc(0,7,5,0,7);ctx.fill();
  ctx.save();ctx.globalAlpha=e*0.28;ctx.fillStyle=WHITE;ctx.beginPath();ctx.ellipse(-7,-16,5,2.6,-0.5,0,7);ctx.fill();ctx.restore();
  ctx.restore();
}
function drawFlower(f,i){
  var x=f[0],y=f[1],n=f[2],at=route.indexOf(i),r=8+n*1.6;
  var st=sceneTime(),p=window.__gRM?1:Math.max(0,Math.min(1,(st-i*0.04)/0.22)),e=1-Math.pow(1-p,2);
  while(selPop.length<L.flowers.length)selPop.push(0);
  var rad=r*(0.5+0.5*e)*(1+0.10*(selPop[i]||0));
  ctx.save();ctx.globalAlpha=e;
  ctx.fillStyle=PAL.shadow;ctx.beginPath();ctx.ellipse(x,y+rad*0.62,rad*0.95,rad*0.34,0,0,7);ctx.fill();
  for(var k=0;k<5;k++){
    var a2=k/5*Math.PI*2-Math.PI/2+(at>=0?0.10:0),px=x+Math.cos(a2)*rad*0.70,py=y+Math.sin(a2)*rad*0.70;
    var pg=ctx.createRadialGradient(px-rad*0.14,py-rad*0.16,rad*0.05,px,py,rad*0.52);
    pg.addColorStop(0,PAL.petalHi);pg.addColorStop(0.55,PAL.petal1);pg.addColorStop(1,PAL.petal2);
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,rad*0.42,0,7);ctx.fill();
    ctx.lineWidth=1;ctx.strokeStyle=colShade(PAL.petal2,-0.28);ctx.stroke();
  }
  var cg=ctx.createLinearGradient(x,y-rad*0.4,x,y+rad*0.4);cg.addColorStop(0,PAL.surface);cg.addColorStop(1,PAL.surface2);
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(x,y,rad*0.5,0,7);ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle=PAL.border;ctx.stroke();
  ctx.fillStyle=PAL.text;ctx.font="700 12px "+SYSFONT;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(String(n),x,y+0.5);
  if(at>=0){
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(x,y,rad+5,0,7);ctx.stroke();
    var bx=x+rad+5,by=y-rad-5;
    ctx.fillStyle=PAL.deep;ctx.beginPath();ctx.arc(bx,by,8,0,7);ctx.fill();
    ctx.fillStyle=PAL.badgeText;ctx.fillText(String(at+1),bx,by+0.5);
  }
  ctx.restore();
}
function drawBee(bx,by,heading,t,flying){
  ctx.save();ctx.fillStyle=PAL.shadow;ctx.beginPath();ctx.ellipse(bx,by+7,6.5,3,0,0,7);ctx.fill();
  ctx.translate(bx,by);ctx.rotate(heading);
  var flap=flying?Math.sin(t*0.06)*0.5:Math.sin(t*0.006)*0.15;
  ctx.save();ctx.globalAlpha=0.55;ctx.fillStyle=WHITE;ctx.beginPath();ctx.ellipse(-1.5,-6.5,5.5,3+flap*2,-0.5,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(1.5,-6.5,5.5,3+flap*2,0.5,0,7);ctx.fill();ctx.restore();
  var g=ctx.createLinearGradient(0,-6,0,6);g.addColorStop(0,PAL.beeHi);g.addColorStop(1,PAL.beeLo);
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,7,5,0,0,7);ctx.fill();
  ctx.fillStyle=colShade(PAL.bee2,-0.5);ctx.beginPath();ctx.ellipse(-2.2,0,1.6,4.6,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(1.4,0,1.5,4.8,0,0,7);ctx.fill();
  ctx.fillStyle=colShade(PAL.bee2,-0.62);ctx.beginPath();ctx.arc(6.2,0,3.1,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-6.6,0);ctx.lineTo(-9.5,-1.6);ctx.lineTo(-9.5,1.6);ctx.closePath();ctx.fill();
  ctx.fillStyle=WHITE;ctx.beginPath();ctx.arc(7.2,-1,0.9,0,7);ctx.fill();
  ctx.restore();
}
function drawBeeActor(){
  var bx=L.hive[0],by=L.hive[1]-16,heading=-Math.PI/2,flying=false,now=performance.now();
  if(state==="fly"&&fly){
    var pos=posAt(fly);bx=pos[0];by=pos[1];flying=true;
    if(fxBeePos){var dx=bx-fxBeePos[0],dy=by-fxBeePos[1];if(dx*dx+dy*dy>0.01)heading=Math.atan2(dy,dx);}
    fxBeePos=[bx,by];
    if(!window.__gRM)by+=Math.sin(now*0.02)*1.2;
  }else{fxBeePos=[bx,by];if(!window.__gRM)by+=Math.sin(now*0.004)*0.8;}
  drawBee(bx,by,heading,now,flying);
}
function drawFx(){
  var i;
  for(i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.max(0,1-p.life/p.ttl);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="700 14px "+SYSFONT;
  for(i=0;i<floats.length;i++){var f=floats[i];ctx.globalAlpha=Math.max(0,1-f.life/f.ttl);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y);}
  ctx.globalAlpha=1;
}
function draw(){
  if(!L)return;
  ctx.save();ctx.translate(offX,offY);ctx.scale(S,S);
  drawGround();drawRoute();drawHive();
  for(var i=0;i<L.flowers.length;i++)drawFlower(L.flowers[i],i);
  drawBeeActor();drawFx();
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.strokeRect(offX+0.5,offY+0.5,NW*S-1,NH*S-1);
  if(state==="fly"&&fly){
    if(fly.collected!==fxCol){
      var fi=route[Math.max(0,fly.next-1)];
      if(fi!==undefined){var fp=L.flowers[fi];puff(fp[0],fp[1],PAL.honey,12,40);addFloat(fp[0],fp[1]-14,"+"+fp[2],PAL.deep);bumpStat($("stTarget"));}
      fxCol=fly.collected;
    }
  }else{
    if(fxState==="fly"){puff(L.hive[0],L.hive[1]-10,PAL.honey,16,70);addFloat(L.hive[0],L.hive[1]-30,"带回 "+flyCol+" 蜜",PAL.deep);bumpStat($("stTarget"));}
    fxCol=0;
  }
  fxState=state;
}
function posAt(fly){
  var s=fly.s;
  for(var i=1;i<fly.legs.length;i++){
    if(s<=fly.legs[i]){
      var t=(s-fly.legs[i-1])/Math.max(0.001,fly.legs[i]-fly.legs[i-1]);
      var a=fly.path[i-1],b=fly.path[i];
      return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
    }
  }
  return fly.path[fly.path.length-1];
}

/* ========== 步进（飞行动画推进；rAF + visibilitychange 停帧/续跑，dt 钳制） ========== */
var SPEED=72;
function step(dt){
  syncHud();
  if(state!=="fly"||!fly)return;
  fly.s+=SPEED*dt;
  while(fly.next<route.length&&fly.s>=fly.legs[fly.next+1]){
    fly.collected+=L.flowers[route[fly.next]][2];
    fly.next++;
  }
  if(fly.s>=fly.dist){
    flyCol=fly.collected;
    settle();
  }
}

/* ========== 主循环 ========== */
var rafPending=false,lastTs=0;
function frame(ts){
  rafPending=false;
  if(document.hidden)return;
  if(!lastTs)lastTs=ts;
  var dt=Math.min(0.05,(ts-lastTs)/1000||0);
  lastTs=ts;
  step(dt);updateFx(dt);draw();
  rafPending=true;requestAnimationFrame(frame);
}
function kick(){if(!rafPending&&!document.hidden){rafPending=true;requestAnimationFrame(frame);}}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){lastTs=0;}
  else{lastTs=0;kick();}
});

/* ========== 输入 ========== */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  /* CSS 缩放补偿：canvas 内逻辑坐标 = CSS 偏移 / 缩放比（S = cssWidth / NW） */
  var x=(e.clientX-rect.left-offX)/S,y=(e.clientY-rect.top-offY)/S;
  e.preventDefault();
  for(var i=0;i<L.flowers.length;i++){
    if(BL.dist([x,y],L.flowers[i])<26){toggleFlower(i);return;}
  }
});
$("btnFly").addEventListener("click",flyRoute);
$("btnReset").addEventListener("click",function(){
  if(state!=="edit")return;
  route=[];say("航线已清空");syncHud();draw();
});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(ovMode==="win"){
    if(cur>=LEVELS.length-1){cur=0;save.lv=0;persist();loadLevel(0);}
    else{cur++;loadLevel(cur);}
  }else if(ovMode==="fail"){
    openLevelSelect();
  }
});
$("ovRetry").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  route=[];syncHud();draw();
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="8"){var i=parseInt(k,10)-1;if(i<L.flowers.length)toggleFlower(i);e.preventDefault();}
  else if(k==="Enter"){e.preventDefault();flyRoute();}
  else if(k==="r"||k==="R"){if(state==="edit"){route=[];say("航线已清空");syncHud();draw();}}
  else if(k==="Backspace"){e.preventDefault();if(state==="edit"&&route.length){route.pop();syncHud();draw();}}
});

/* 调试验证入口 */
window.__validateLevels=function(){try{return BL.runTests()}catch(e){return {error:String(e)}}};

/* ========== 启动（续玩：从存档关卡起步） ========== */
cur=clamp(save.lv,0,LEVELS.length-1);
loadLevel(cur);
/* 按钮图标：照抄本库 window.SW_ICON 范式，文字前内联 SVG，与文字基线对齐 */
$("btnReset").insertAdjacentHTML("afterbegin",SW_ICON("rotate"));
$("btnFly").insertAdjacentHTML("afterbegin",SW_ICON("send"));
$("btnLv").insertAdjacentHTML("afterbegin",SW_ICON("grid"));
$("ovRetry").insertAdjacentHTML("afterbegin",SW_ICON("rotate"));
setOvBtn("下一关","arrow-right");
requestAnimationFrame(frame);
syncLevelsFromServer();
syncSaveFromServer();

})();
</script>
