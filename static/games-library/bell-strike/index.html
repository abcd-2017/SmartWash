<style>

  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-on-primary:#FFF;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gap:16px;--g-bs-sky1:#F8EFD8;--g-bs-sky2:#EDD8AC;--g-bs-beam:#A87C46;--g-bs-floor:#E6DCC4;--g-bs-b1:#1F8A5B;--g-bs-b2:#C0731F;--g-bs-b3:#2E86C4;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-bs-sky1:#1A1C17;--g-bs-sky2:#10120E;--g-bs-beam:#4A3520;--g-bs-floor:#22251F;--g-bs-b1:#5BC894;--g-bs-b2:#E8A44E;--g-bs-b3:#7FBFEC;color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .boxes { display: flex; gap: 8px; }
  /* 入场错落 30-50ms：三块记分依次浮起 */
  .box { background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 12px; min-width: 86px; padding: 5px 12px; text-align: center; line-height: 1.3; animation: rise .38s ease-out both; }
  .box:nth-child(2) { animation-delay: 40ms; }
  .box:nth-child(3) { animation-delay: 80ms; }
  .box.alt { background: var(--g-surface); color: var(--g-text); border: 1px solid var(--g-border); }
  .box .label { display: block; font-size: 12px; }
  .box b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .box b.bump { animation: bump .3s ease-out; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 16px 0 10px; }
  .hint { margin: 0; font-size: 14px; line-height: 1.5; color: var(--g-muted); }
  .btn { min-height: 44px; padding: 0 14px; border: 0; border-radius: var(--g-radius-btn); background: var(--g-btn-primary); color: var(--g-on-primary); font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; box-shadow: var(--g-shadow); transition: transform .14s ease-out, box-shadow .16s ease-out, filter .16s ease-out; }
  .btn.ghost { background: var(--g-surface); color: var(--g-text); border: 1px solid var(--g-border); box-shadow: none; }
  .btn:active { transform: scale(.96); }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .stage { position: relative; width: 100%; }
  canvas { display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: var(--g-radius-inner); border: 1px solid var(--g-border); background: var(--g-bs-sky1); touch-action: none; box-shadow: var(--g-shadow); }
  .overlay { position: absolute; inset: 0; border-radius: var(--g-radius-inner); background: var(--g-scrim); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; text-align: center; }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
  .card { width: 100%; max-width: 320px; max-height: 100%; overflow: auto; background: var(--g-surface); border: 1px solid var(--g-border); border-radius: var(--g-radius); box-shadow: var(--g-shadow); padding: 16px; animation: pop .3s ease-out; }
  .ov-kicker { margin: 0 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--g-muted); }
  .card h2 { margin: 0 0 8px; font-size: 18px; line-height: 1.25; color: var(--g-text); }
  .ov-text { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: var(--g-muted); }
  /* 三秒读懂：我控制什么 / 目标是什么 / 该点哪 */
  .ov-legend { display: flex; gap: 6px; margin: 0 0 12px; }
  .ov-legend .li { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 10px; background: var(--g-surface2); color: var(--g-muted); font-size: 12px; line-height: 1.3; }
  .ov-legend .li b { font-size: 12px; font-weight: 600; color: var(--g-text); }
  .ov-legend .swi { color: var(--g-primary-deep); }
  .ov-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 12px; }
  .ov-stats .st { background: var(--g-surface2); border-radius: 10px; padding: 7px 4px; }
  .ov-stats b { display: block; font-size: 18px; color: var(--g-primary-deep); font-variant-numeric: tabular-nums; }
  .ov-stats span { font-size: 12px; color: var(--g-muted); }
  .ov-btns { display: grid; gap: 8px; }
  .foot { margin: 14px 0 0; font-size: 12px; line-height: 1.6; color: var(--g-muted); text-align: center; }

  /* S2: 动效敏感用户降级（动效层指令，不受 §4 主题层 matchMedia 禁令约束）
     同时压平 animation-duration 与 animation-delay，否则错落入场会退化成整体延迟后闪现 */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:.01ms !important; transition-duration:.01ms !important} }
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>

window.SW_ICON=function(n,s){s=s||"";var P={
 'tap':'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>',
 'bell':'<path d="M12 4a5.5 5.5 0 0 0-5.5 5.5v3.2L4.5 16v1.2h15V16l-2-3.3V9.5A5.5 5.5 0 0 0 12 4z"/><path d="M10 19.5a2 2 0 0 0 4 0"/>',
 'target':'<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.6"/>',
 'pause':'<rect x="6.5" y="5" width="3.6" height="14" rx="1.1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.1"/>',
 'play':'<path d="M8 5v14l11-7z"/>',
 'rotate':'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>',
 'check':'<path d="M4 12.5l5 5L20 6.5"/>',
 'x':'<path d="M6 6l12 12M18 6L6 18"/>'
};
var fill={'play':1,'pause':1};
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};
</script>

function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}

try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  /* 工具钮图标：文字前内联 SVG（SW_ICON 范式） */
  var bp=document.getElementById("btnPause"),br=document.getElementById("btnReset");
  if(bp)bp.insertAdjacentHTML("afterbegin",window.SW_ICON("pause"));
  if(br)br.insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
})();
</script>

var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（投影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
function colAlpha(c,a){var p=colParse(c);return "rgba("+p[0]+","+p[1]+","+p[2]+","+a+")"}
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL.text=v("--g-text");PAL.muted=v("--g-muted");PAL.deep=v("--g-primary-deep");
  PAL.danger=v("--g-danger");PAL.warning=v("--g-warning");PAL.success=v("--g-success");
  PAL.dark=document.documentElement.dataset.theme==="dark";
  /* 素材基色：天空 / 木梁 / 地面 / 三口钟 */
  PAL.sky1=v("--g-bs-sky1");PAL.sky2=v("--g-bs-sky2");
  PAL.beam=v("--g-bs-beam");PAL.floor=v("--g-bs-floor");
  PAL.bell=["--g-bs-b1","--g-bs-b2","--g-bs-b3"].map(function(n){return v(n)});
  /* 派生：光晕 / 木梁与地面明暗面 / 轨道槽 / 远景 */
  PAL.skyHi=colShade(PAL.sky1,0.30);
  PAL.beamHi=colShade(PAL.beam,0.26);PAL.beamLo=colShade(PAL.beam,-0.32);
  PAL.floorHi=colShade(PAL.floor,0.22);PAL.floorLo=colShade(PAL.floor,-0.24);
  PAL.track=colMix(PAL.sky2,PAL.text,0.14);
  PAL.roofFar=colMix(PAL.beam,PAL.sky2,PAL.dark?0.30:0.62);
  PAL.roofNear=colShade(PAL.roofFar,-0.12);
  PAL.bellHi=PAL.bell.map(function(c){return colShade(c,0.44)});
  PAL.bellLo=PAL.bell.map(function(c){return colShade(c,-0.30)});
  PAL.bellInk=PAL.bell.map(function(c){return colShade(c,-0.46)});
}
window.__gOnTheme=function(){palLoad();draw();};

/* ---------- 钟声（WebAudio，首次手势解锁） ---------- */
var actx=null;
function ensureAudio(){
  if(!actx){
    try{var AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}catch(e){}
  }
  if(actx&&actx.state==="suspended"){try{actx.resume()}catch(e){}}
}
function bellTone(lane,hitQ){
  if(!actx)return;
  try{
    var t=actx.currentTime;
    var f=[392,523,659][lane];
    var o=actx.createOscillator(),g=actx.createGain();
    o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(hitQ>0?0.42:0.16,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.7);
    o.connect(g);g.connect(actx.destination);
    o.start(t);o.stop(t+0.75);
    var o2=actx.createOscillator(),g2=actx.createGain();
    o2.type="sine";o2.frequency.value=f*2.76;
    g2.gain.setValueAtTime(hitQ>0?0.15:0.05,t);
    g2.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    o2.connect(g2);g2.connect(actx.destination);
    o2.start(t);o2.stop(t+0.4);
  }catch(e){}
}
function thud(){
  if(!actx)return;

    var t=actx.currentTime;

    o.type="triangle";o.frequency.value=130;
    g.gain.setValueAtTime(0.3,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
    o.connect(g);g.connect(actx.destination);
    o.start(t);o.stop(t+0.2);
  }catch(e){}
}

/* ---------- 判定 ---------- */
function judge(t,lane,elapsed,note){
  var d=Math.abs(elapsed-t);
  var gr,pts,txt,col;
  if(d<=60){gr=2;pts=150;txt="Perfect";col=PAL.deep}
  else if(d<=130){gr=1;pts=80;txt="Good";col=PAL.success}
  else{gr=0;pts=30;txt="Poor";col=PAL.warning}
  if(gr>=1){
    S.combo++;
    S.maxCombo=Math.max(S.maxCombo,S.combo);
    pts=Math.round(pts*(1+0.02*Math.min(S.combo,25)));
  }
  S.score+=pts;
  if(gr===2)S.perfect++;else if(gr===1)S.good++;else S.poor++;
  note.hit=true;note.gr=gr;
  S.judges.push({x:(lane+0.5)*MW/3,y:LINE_Y-46,txt:txt+" +"+pts,col:col,t:.7});
  S.laneFlash[lane]=1;
  spawnHit(lane,gr);
  bellTone(lane,gr);
  syncHud();
}
function doMiss(note){
  note.hit=true;note.gr=-2;
  S.miss++;
  S.combo=0;
  S.hp--;
  S.missT=.4;
  spawnMiss(note.lane);
  thud();
  S.judges.push({x:(note.lane+0.5)*MW/3,y:LINE_Y-46,txt:"漏",col:PAL.danger,t:.7});
  syncHud();
  if(S.hp<=0)fail();
}
function strike(lane){
  if(S.phase!=="run"||S.paused)return;
  ensureAudio();
  S.laneFlash[lane]=1;
  var L=curChart();
  var best=null,bd=1e9;
  for(var i=S.ni;i<S.notes.length;i++){
    var nt=S.notes[i];
    if(nt.hit)continue;
    if(nt.t>S.elapsed+JUDGE)break;
    if(nt.lane!==lane)continue;
    var d=Math.abs(nt.t-S.elapsed);
    if(d<=JUDGE&&d<bd){bd=d;best=nt}
  }
  if(best)judge(best.t,lane,S.elapsed,best);
  else{
    S.combo=0;
    thud();
    S.judges.push({x:(lane+0.5)*MW/3,y:LINE_Y-46,txt:"空敲",col:PAL.muted,t:.5});
    syncHud();
  }
}
/* ---------- 结算 ---------- */
function win(){
  S.phase="over";
  var acc=S.perfect+S.good+S.poor+S.miss;
  var pRate=acc>0?Math.round((S.perfect+S.good)/acc*100):0;
  var next=false;
  if(chartIdx+1<LEVELS.length&&chartIdx+1>save.lv){save.lv=chartIdx+1;next=true}
  persist();
  if(GB.available)GB.reportScore("bell-strike",{metricValue:save.lv+1,metricExtra:"准确"+pRate+"%"}).catch(function(){});
  var hasNext=chartIdx+1<LEVELS.length;
  showOv({k:"CHART CLEAR",t:"第 "+(chartIdx+1)+" 谱完成",
    x:next?"解锁下一谱：节拍更密，耳朵比眼睛快。":"全部谱面完成，敲钟乐师！",
    stats:[["准确率",pRate+"%"],["最高连击",S.maxCombo],["分数",S.score]],
    btns:hasNext?[["下一谱","primary",function(){ensureAudio();loadChart(chartIdx+1)},"arrow-right"],["重敲本谱","ghost",function(){loadChart(chartIdx)},"rotate"]]
                :[["再来一轮","primary",function(){ensureAudio();loadChart(0)},"rotate"]]});
}
function fail(){

    stats:[["分数",S.score],["最高连击",S.maxCombo]],

/* ---------- 绘制 ---------- */
var SC=1;

/* ---------- 场景几何（天空/墙/地面/目标/轨迹） ---------- */
var BEAM_Y=26,BELL_Y=34,TRACK_TOP=116,FLOOR_Y=420,ORB_R=14;
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function roofPath(cx,baseY,halfW,rise){
  ctx.beginPath();
  ctx.moveTo(cx-halfW,baseY);
  ctx.quadraticCurveTo(cx-halfW*0.98,baseY-rise*0.86,cx-halfW*0.52,baseY-rise*0.82);
  ctx.quadraticCurveTo(cx,baseY-rise*1.06,cx+halfW*0.52,baseY-rise*0.82);
  ctx.quadraticCurveTo(cx+halfW*0.98,baseY-rise*0.86,cx+halfW,baseY);
  ctx.closePath();
}
/* 入场进度：reduced-motion 直接落位 */
function enter(t,start,dur){
  if(window.__gRM)return 1;
  var p=(t-start)/dur;p=p<0?0:p>1?1:p;
  return 1-Math.pow(1-p,3);
}
function drawBackdrop(){

/* 三栏落球凹槽（轨迹）：槽底 + 两侧棱线，敲钟时的 laneFlash 叠在槽内 */

/* 悬挂的钟（目标）：渐变钟体 + 口缘 + 钟锤 + 高光 + 投影 */

  ctx.quadraticCurveTo(-15*s,24*s,-21*s,31*s);

  ctx.quadraticCurveTo(15*s,24*s,14*s,10*s);

  ctx.closePath();ctx.fill();

/* 下落钟球：径向渐变球体 + 恒白高光 + 落地投影 + 速度尾迹 */
function drawOrb(x,y,r,lane,alpha){
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=r*0.7;ctx.shadowOffsetY=r*0.35;
  var g=ctx.createRadialGradient(x-r*0.34,y-r*0.38,r*0.12,x,y,r*1.05);
  g.addColorStop(0,PAL.bellHi[lane]);g.addColorStop(0.45,PAL.bell[lane]);g.addColorStop(1,PAL.bellLo[lane]);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.lineWidth=Math.max(1.2,r*0.14);ctx.strokeStyle=PAL.bellInk[lane];
  ctx.beginPath();ctx.arc(x,y,r-ctx.lineWidth*0.5,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=0.9*(alpha==null?1:alpha);ctx.fillStyle=WHITE;
  ctx.beginPath();ctx.ellipse(x-r*0.32,y-r*0.38,r*0.26,r*0.15,-0.55,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawTrail(x,y,r,lane){
  var h=54;
  var g=ctx.createLinearGradient(0,y-r-h,0,y-r);
  g.addColorStop(0,colAlpha(PAL.bell[lane],0));g.addColorStop(1,colAlpha(PAL.bell[lane],0.42));
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x-r*0.55,y-r);ctx.lineTo(x+r*0.55,y-r);
  ctx.lineTo(x+r*0.26,y-r-h);ctx.lineTo(x-r*0.26,y-r-h);
  ctx.closePath();ctx.fill();
}
/* 余钟（生命）：梁上三口小钟 */
function drawHp(){
  for(var i=0;i<3;i++)drawBell(MW-14-i*22,4,i%3,0.3,0,i<S.hp?1:0.4);
}
/* ---------- 命中反馈（渲染层） ---------- */
function spawnHit(lane,gr){
  if(window.__gRM)return;
  var cx=(lane+0.5)*MW/LANES;
  S.rings.push({x:cx,y:LINE_Y,r:10,vr:190,life:0,ttl:0.42,c:PAL.bell[lane],w:3});
  S.bellSwing[lane]=0.34;
  var n=gr===2?12:gr===1?8:5,i;
  for(i=0;i<n;i++){
    var a=-Math.PI/2+(Math.random()-0.5)*2.2,sp=90+Math.random()*160;
    S.parts.push({x:cx,y:LINE_Y-6,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      r:1.6+Math.random()*2.4,life:0,ttl:0.42+Math.random()*0.25,c:PAL.bell[lane]});
  }
}
function spawnMiss(lane){
  if(window.__gRM)return;
  var cx=(lane+0.5)*MW/LANES;
  S.rings.push({x:cx,y:LINE_Y,r:8,vr:150,life:0,ttl:0.5,c:PAL.danger,w:3});
  S.bellSwing[lane]=-0.22;
  S.redFlash=0.5;
}
function draw(){
  var t=S.animT;
  ctx.fillStyle=PAL.sky1;ctx.fillRect(0,0,MW,MH);
  drawBackdrop();
  /* 结构整体入场（地面/墙/梁/轨迹） */
  var pSt=enter(t,0,.30);
  ctx.save();ctx.globalAlpha=pSt;ctx.translate(0,(1-pSt)*10);
  drawFloor();drawPillar(0,14,false);drawPillar(MW-14,14,true);drawBeam();drawTracks();
  ctx.restore();
  /* 判定线 + 落点环：环随来球靠近亮起（该点哪） */
  var approach=[0,0,0],i,nt,dt;
  for(i=0;i<S.notes.length;i++){
    nt=S.notes[i];if(nt.hit)continue;
    dt=nt.t-S.elapsed;
    if(dt>TRAVEL)break;
    if(dt>0&&dt<320){var k=1-dt/320;if(k>approach[nt.lane])approach[nt.lane]=k}
  }
  ctx.save();ctx.globalAlpha=pSt;
  drawLine();
  for(i=0;i<LANES;i++)drawRing((i+0.5)*MW/LANES,i,S.laneFlash[i],approach[i]);
  ctx.restore();
  /* 悬挂的三口钟：入场错落 + 命中摆动 */
  for(i=0;i<LANES;i++){
    var cx=(i+0.5)*MW/LANES,p=enter(t,.16+i*.05,.34);
    ctx.save();
    ctx.globalAlpha=p;ctx.translate(0,(1-p)*-16);
    ctx.strokeStyle=PAL.beamLo;ctx.lineWidth=2.4;
    ctx.beginPath();ctx.moveTo(cx,BEAM_Y);ctx.lineTo(cx,BELL_Y+2);ctx.stroke();
    drawBell(cx,BELL_Y,i,1,(1-p)*0.6+S.bellSwing[i],p);
    ctx.restore();
  }
  /* 下落的钟球：尾迹 + 立体球体 */
  for(i=0;i<S.notes.length;i++){
    nt=S.notes[i];if(nt.hit)continue;
    dt=nt.t-S.elapsed;
    if(dt>TRAVEL)break;
    var y=LINE_Y-(dt/TRAVEL)*(LINE_Y-130);
    if(y>LINE_Y+16)continue;
    var ox=(nt.lane+0.5)*MW/LANES;
    if(y<LINE_Y-12)drawTrail(ox,y,ORB_R,nt.lane);
    drawOrb(ox,y,ORB_R,nt.lane,1);
  }
  /* 命中波环 / 粒子 */
  for(i=0;i<S.rings.length;i++){
    var rg=S.rings[i],k=rg.life/rg.ttl;
    ctx.globalAlpha=Math.max(0,1-k);
    ctx.lineWidth=rg.w*(1-k*0.5);ctx.strokeStyle=rg.c;
    ctx.beginPath();ctx.arc(rg.x,rg.y,rg.r,0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(i=0;i<S.parts.length;i++){
    var pt=S.parts[i];
    ctx.globalAlpha=Math.max(0,1-pt.life/pt.ttl);
    ctx.fillStyle=pt.c;
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  /* 判定浮字（轻弹） */
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  for(i=0;i<S.judges.length;i++){
    var j=S.judges[i];
    var sc=1+0.4*Math.max(0,Math.min(1,(j.t-0.5)/0.2));
    ctx.save();ctx.translate(j.x,j.y);ctx.scale(sc,sc);
    ctx.globalAlpha=Math.min(1,j.t*1.6);
    ctx.fillStyle=j.col;ctx.font="700 16px system-ui,sans-serif";
    ctx.fillText(j.txt,0,0);
    ctx.restore();
  }
  /* 余钟（生命） */
  drawHp();
  /* 受击红闪 */
  if(S.redFlash>0){
    var vg=ctx.createRadialGradient(MW/2,MH/2,MH*0.30,MW/2,MH/2,MH*0.72);
    vg.addColorStop(0,colAlpha(PAL.danger,0));
    vg.addColorStop(1,colAlpha(PAL.danger,0.35*S.redFlash));
    ctx.fillStyle=vg;ctx.fillRect(0,0,MW,MH);
  }
  if(S.missT>0){
    var sh=Math.sin(S.missT*40)*3*S.missT;
    ctx.save();ctx.translate(MW/2+sh,150);
    ctx.globalAlpha=Math.min(1,S.missT*3);
    ctx.fillStyle=PAL.danger;ctx.font="700 22px system-ui,sans-serif";ctx.textAlign="center";
    ctx.fillText("漏敲！",0,0);
    ctx.restore();ctx.globalAlpha=1;
  }
}
function stepFx(dt){
  for(var i=0;i<3;i++){
    if(S.laneFlash[i]>0)S.laneFlash[i]=Math.max(0,S.laneFlash[i]-dt*4);
    if(S.bellSwing[i]!==0){
      S.bellSwing[i]*=Math.pow(0.0018,dt);
      if(Math.abs(S.bellSwing[i])<0.002)S.bellSwing[i]=0;
    }
  }
  if(S.missT>0)S.missT-=dt;
  if(S.redFlash>0)S.redFlash=Math.max(0,S.redFlash-dt*1.8);
  for(i=S.rings.length-1;i>=0;i--){
    var rg=S.rings[i];rg.life+=dt;rg.r+=rg.vr*dt;
    if(rg.life>=rg.ttl)S.rings.splice(i,1);
  }
  for(i=S.parts.length-1;i>=0;i--){
    var pt=S.parts[i];pt.life+=dt;
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=620*dt;pt.vx*=Math.max(0,1-1.6*dt);
    if(pt.life>=pt.ttl)S.parts.splice(i,1);
  }
  for(i=S.judges.length-1;i>=0;i--){
    var j=S.judges[i];j.y-=26*dt;j.t-=dt;
    if(j.t<=0)S.judges.splice(i,1);
  }
}
/* ---------- 输入 ---------- */
function laneAt(x){
  var l=Math.floor(x/(MW/3));
  return Math.max(0,Math.min(2,l));
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  ensureAudio();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  var r=cv.getBoundingClientRect();
  strike(laneAt((e.clientX-r.left)/SC));
});
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("keydown",function(e){
  ensureAudio();
  var lane=-1;
  if(e.code==="KeyA"||e.code==="Digit1")lane=0;
  if(e.code==="KeyS"||e.code==="Digit2")lane=1;
  if(e.code==="KeyD"||e.code==="Digit3")lane=2;
  if(lane>=0){e.preventDefault();if(!e.repeat)strike(lane)}
  if(e.code==="KeyP"&&S.phase==="run"){S.paused?((S.paused=false),S.timeBase+=performance.now()-S.pa,hideOv()):pauseGame()}
  if(e.code==="KeyR"&&S.phase!=="menu")loadChart(chartIdx);
  if(e.code==="Enter"&&S.phase!=="run")loadChart(chartIdx);
});
$("btnPause").addEventListener("click",pauseGame);
$("btnReset").addEventListener("click",function(){loadChart(chartIdx)});
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&S.phase==="run"&&!S.paused)pauseGame();
});
/* ---------- 主循环 ---------- */
var lastT=0;
S.timeBase=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  var dt=Math.min(.05,(now-lastT)/1000);
  lastT=now;
  S.animT+=dt;   // 渲染层入场计时（不影响玩法）
  if(S.phase==="run"&&!S.paused){
    S.elapsed+=dt*1000;
    stepFx(dt);
    //漏敲检测
    while(S.ni<S.notes.length){
      var nt=S.notes[S.ni];
      if(nt.hit){S.ni++;continue}
      if(nt.t<S.elapsed-JUDGE){doMiss(nt);S.ni++}
      else break;
    }
    if(S.hp>0&&S.elapsed>S.dur+600)win();
  }
  draw();
}
/* ---------- 启动 ---------- */
palLoad();
syncHud();
showMenu();
resize();
window.addEventListener("resize",resize);
requestAnimationFrame(loop);
syncSaveFromServer();
syncLevelsFromServer();
})();
</script>
