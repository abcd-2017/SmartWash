<script>
/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
"use strict";
(() => {
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
var BS={};
function bsMulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
BS.genItems=function(level){
  var rng=bsMulberry32(level.seed||1),arr=[],i;
  for(i=0;i<level.items;i++)arr.push((rng()*level.cats)|0);
  return arr;
};
/* 可通关性验证：类别数 / 物品数 / 时间窗合法；全对可达（目标 ≤ 物品数）即视为可通关 */
BS.validate=function(level){
  if(!level||typeof level!=="object")return{ok:false,why:"bad"};
  if(!Number.isInteger(level.cats)||level.cats<3||level.cats>5)return{ok:false,why:"cats"};
  if(!Number.isInteger(level.items)||level.items<8||level.items>40)return{ok:false,why:"items"};
  if(!(level.interval>=0.8&&level.interval<=2))return{ok:false,why:"interval"};
  if(!(level.travel>=1.5&&level.travel<=3.5))return{ok:false,why:"travel"};
  if(!(level.time>=level.items*level.interval))return{ok:false,why:"time"};
  if(!Number.isInteger(level.target)||level.target<1||level.target>level.items)return{ok:false,why:"target"};
  var items=BS.genItems(level),i;
  for(i=0;i<items.length;i++)if(items[i]<0||items[i]>=level.cats)return{ok:false,why:"item"};
  if(level.target>items.length)return{ok:false,why:"target2"};
  return{ok:true,why:"",count:items.length};
};
BS.validateAll=function(list){
  var fails=[],i;
  for(i=0;i<list.length;i++){var r=BS.validate(list[i]);if(!r.ok)fails.push((i+1)+"("+r.why+")");}
  return {total:list.length,solvable:list.length-fails.length,fail:fails};
};
globalThis.__XC=BS;
/*XC-CORE-END*/

/* ---------- 调色板（canvas 颜色全经 PAL 读 CSS 变量） ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim();}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),onSoft:v("--g-on-soft"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),border:v("--g-border"),
    ground:v("--g-belt-ground"),band:v("--g-belt-band"),bandHi:v("--g-belt-band-hi"),drop:v("--g-belt-drop"),
    item:[v("--g-belt-item1"),v("--g-belt-item2"),v("--g-belt-item3"),v("--g-belt-item4"),v("--g-belt-item5")]};
}
/* ---------- 颜色工具：由 PAL 色值混合明暗，JS 内零颜色字面量 ---------- */
var WHITE="rgb(255,255,255)",BLACK="rgb(0,0,0)";   // 恒白高光 / 恒黑投影
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
window.__gOnTheme=function(){palLoad();fx=[];lastCorrect=correct;lastResolved=resolved;lastTime=timeLeft;draw();};

var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY="sw.belt-sort.v1.levels",LEVELS_VER_KEY="sw.belt-sort.v1.levels.ver";
function applyLevels(list,version){
  if(!Array.isArray(list)||list.length<40)return false;
  for(var i=0;i<list.length;i++)if(!BS.validate(list[i]).ok)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length>=40){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function parseLevels(res){
  if(!res||!Array.isArray(res.levels)||res.levels.length<40)return false;
  var list=[],i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item.dataJson!=="string")return false;
    var d;try{d=JSON.parse(item.dataJson);}catch(e){return false;}
    if(!BS.validate(d).ok)return false;
    list.push(d);
  }
  return list;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("belt-sort").then(function(res){
    var list=parseLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){setupLevel(Math.max(0,Math.min(cur,LEVELS.length-1)));showStart();}
  }).catch(function(){});
}

/* ---------- 存档 ---------- */
var KEY="sw.belt-sort.v1";
function loadSave(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&typeof s==="object"){
      var done={};
      if(s.done&&typeof s.done==="object")for(var k in s.done){var v=parseInt(s.done[k],10);if(v>0)done[k]=v;}
      return {lv:Math.max(0,parseInt(s.lv,10)||0),done:done,best:Math.max(0,parseInt(s.best,10)||0)};
    }
  }catch(e){}
  return {lv:0,done:{},best:0};
}
var saveData=loadSave();
var doneSave=saveData.done||{};
var best=saveData.best||0;
function totalBest(){var t=0,k;for(k in doneSave){var v=parseInt(doneSave[k],10)||0;if(v>0)t+=v;}return t;}
function save(){
  var data={lv:saveData.lv,done:doneSave,best:best};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("belt-sort",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("belt-sort").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(remote.lv,10)||0;if(rl>saveData.lv){saveData.lv=rl;changed=true;}
      var rb=parseInt(remote.best,10)||0;if(rb>best){best=rb;changed=true;}
      if(remote.done&&typeof remote.done==="object")for(var k in remote.done){
        var rv=parseInt(remote.done[k],10)||0,mv=parseInt(doneSave[k],10)||0;
        if(rv>mv){doneSave[k]=rv;changed=true;}
      }
      if(changed){best=Math.max(best,totalBest());save();refreshStats();}
    }catch(e){}
  }).catch(function(){});
}

function setupLevel(n){

  correct=0;resolved=0;timeLeft=L.time;over=false;paused=false;flash=0;

  state="running";paused=false;over=false;

}

  if(state!=="running")return;
  paused=!paused;

function refreshStats(){
  stLv.textContent=(cur+1)+"/"+LEVELS.length;

  stTime.textContent=Math.max(0,Math.ceil(timeLeft));
}
function sort(cat){
  if(state!=="running"||paused||over)return;
  var idx=-1,bestX=Infinity,i;
  for(i=0;i<items.length;i++){
    if(items[i].x>=dropX&&items[i].x<bestX){bestX=items[i].x;idx=i;}
  }
  if(idx<0){say("投放区还没有垃圾");return;}
  var it=items[idx];
  items.splice(idx,1);resolved++;
  if(it.cat===cat){correct++;say("分类正确 +1");}
  else{timeLeft=Math.max(0,timeLeft-2);flash=1;say("错分！扣 2 秒");}
  refreshStats();
  if(resolved>=seq.length||correct>=L.target&&items.length===0)endLevel();
  else if(items.length===0&&spawned>=seq.length)endLevel();
}
function endLevel(){
  if(over)return;
  over=true;state="over";btnPause.disabled=true;
  var pass=correct>=L.target;
  var sc=correct*10;
  var prev=doneSave[cur]||0;if(sc>prev)doneSave[cur]=sc;
  var tb=totalBest();if(tb>best)best=tb;
  if(pass&&cur+1>saveData.lv)saveData.lv=cur+1;
  save();
  if(GB.available)GB.reportScore("belt-sort",{metricValue:best,metricExtra:cur+1}).catch(function(){});
  refreshStats();
  if(pass)showWin(sc);else showFail();
}

/* ---------- 更新 ---------- */
function update(dt){
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;endLevel();return;}
  spawnT-=dt;
  if(spawned<seq.length&&spawnT<=0){
    items.push({cat:seq[spawned],x:-itemW});
    spawned++;spawnT=L.interval;
  }
  var speed=(W+itemW*2)/L.travel,i;
  for(i=items.length-1;i>=0;i--){
    items[i].x+=speed*dt;
    if(items[i].x>W+itemW){items.splice(i,1);resolved++;if(resolved>=seq.length)endLevel();}
  }
  flash=Math.max(0,flash-dt*2.5);
  refreshStats();
}

  if(window.__gRM)return;
  for(var i=fx.length-1;i>=0;i--){
    var f=fx[i],p=(now-f.t0)/f.dur;if(p>=1){fx.splice(i,1);continue;}
    if(f.type==="ring"){
      ctx.globalAlpha=1-p;ctx.strokeStyle=f.color;ctx.lineWidth=3*(1-p)+1;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r0+(f.r1-f.r0)*p,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
    }else{
      ctx.globalAlpha=1-p*p;ctx.fillStyle=f.color;ctx.font="700 18px -apple-system,'PingFang SC',sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(f.text,f.x,f.y-p*26);ctx.globalAlpha=1;
    }
  }
}
function draw(now){
  if(!L)return;now=now||performance.now();
  ctx.clearRect(0,0,W,H);
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.ground);g.addColorStop(1,colShade(PAL.ground,-0.12));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  drawBelt(now);drawDropZone(now);
  var i,targetIdx=-1,bestX=Infinity;
  for(i=0;i<items.length;i++)if(items[i].x>=dropX&&items[i].x<bestX){bestX=items[i].x;targetIdx=i;}
  for(i=0;i<items.length;i++)drawTrash(items[i].x,beltY,items[i].cat,i===targetIdx,now);
  drawFx(now);
  if(flash>0){ctx.globalAlpha=Math.min(0.4,flash*0.4);ctx.fillStyle=PAL.danger;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(state==="ready"){
    ctx.fillStyle=PAL.muted;ctx.font="700 18px -apple-system,'PingFang SC',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(L.name,W/2,H*0.3);
  }
  /* 事件感知：得分 / 错分 / 漏过 → 轻弹 + 浮字 + 抖屏 */
  if(correct!==lastCorrect){
    lastCorrect=correct;lastResolved=resolved;
    fx.push({type:"ring",x:dropX,y:beltY,r0:itemW*0.5,r1:itemW*1.5,t0:now,dur:360,color:PAL.success});
    fx.push({type:"float",x:dropX,y:beltY-itemW*1.7,text:"+1",t0:now,dur:800,color:PAL.success});
    bumpEl(stScore);
  }else if(resolved!==lastResolved){
    var penalty=(lastTime-timeLeft)>0.6;lastResolved=resolved;
    fx.push({type:"ring",x:dropX,y:beltY,r0:itemW*0.5,r1:itemW*1.2,t0:now,dur:300,color:PAL.danger});
    fx.push({type:"float",x:dropX,y:beltY-itemW*1.7,text:penalty?"-2s":"漏过",t0:now,dur:800,color:PAL.danger});
    shakeCanvas();
  }
  lastTime=timeLeft;
}

/* ---------- 覆盖层 ---------- */
function showPanel(html){panel.innerHTML=html;overlay.classList.add("show");}
function hideOverlay(){overlay.classList.remove("show");}
function showStart(){
  showPanel(
    '<p class="rt">'+esc(L.name)+'</p>'+
    '<p class="rs">分类 '+L.cats+' 类 · 垃圾 '+L.items+' 件 · 目标 <b>'+L.target+'</b> 件</p>'+
    '<div class="rbtns"><button class="btn" id="ovMain" type="button">'+SW_ICON('play')+'开始</button></div>'+
    '<p class="rhint">垃圾沿传送带进入右侧投放区后，点下方对应垃圾桶。投对得 1 件，投错扣 2 秒；限时内达到目标即过关。</p>'
  );
  $("ovMain").addEventListener("click",function(){startPlay();});
}
function showPause(){
  showPanel(
    '<p class="rt">已暂停</p>'+
    '<p class="rs">正确 '+correct+' / 目标 '+L.target+'</p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovRetryP" type="button">'+SW_ICON('rotate')+'重玩本关</button>'+
      '<button class="btn" id="ovResume" type="button">'+SW_ICON('play')+'继续</button>'+
    '</div>'
  );
  $("ovResume").addEventListener("click",function(){togglePause();});
  $("ovRetryP").addEventListener("click",function(){retryLevel();});
}
function showWin(sc){
  showPanel(
    '<p class="rt">过关！</p>'+
    '<p class="rs">正确 '+correct+' 件 · 得分 <b>'+sc+'</b></p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovReplay" type="button">'+SW_ICON('rotate')+'重玩本关</button>'+
      '<button class="btn" id="ovNext" type="button">'+SW_ICON('arrow-right')+'下一关</button>'+
    '</div>'
  );
  $("ovNext").addEventListener("click",function(){enterLevel(cur<LEVELS.length-1?cur+1:cur);});
  $("ovReplay").addEventListener("click",function(){enterLevel(cur);});
}
function showFail(){
  showPanel(
    '<p class="rt">未达标</p>'+
    '<p class="rs">正确 '+correct+' 件 · 目标 '+L.target+' 件</p>'+
    '<p class="rhint">提示：先看清楚垃圾类别再出手，错分扣时很伤。</p>'+
    '<div class="rbtns"><button class="btn" id="ovRetryF" type="button">'+SW_ICON('rotate')+'重试本关</button></div>'
  );
  $("ovRetryF").addEventListener("click",function(){retryLevel();});
}
function showLevels(){
  var html='<p class="rt">选择关卡</p><p class="rs">已过关卡显示为绿色</p><div class="lv-wrap"><div class="lv-grid">';
  for(var i=0;i<LEVELS.length;i++){
    var done=parseInt(doneSave[i],10)>0;
    var locked=i>saveData.lv;
    html+='<button class="lv-chip'+(i===cur?" sel":"")+(done?" done":"")+'" data-i="'+i+'"'+(locked?" disabled":"")+' type="button">'+(i+1)+'</button>';
  }
  html+='</div></div><div class="rbtns"><button class="btn ghost" id="ovClose" type="button">'+SW_ICON('x')+'返回</button></div>';
  showPanel(html);
  var chips=panel.querySelectorAll(".lv-chip");
  for(var j=0;j<chips.length;j++)chips[j].addEventListener("click",function(){enterLevel(parseInt(this.getAttribute("data-i"),10));});
  $("ovClose").addEventListener("click",function(){hideOverlay();if(state==="running"&&paused)showPause();});
}

/* ---------- 输入 ---------- */
document.addEventListener("keydown",function(e){
  if(e.repeat)return;
  var k=e.key;
  if(k>="1"&&k<="5"){var idx=parseInt(k,10)-1;if(idx<L.cats)sort(idx);return;}
  if(k===" "){e.preventDefault();if(state==="running")togglePause();else if(state==="ready"||state==="over")startPlay();}
});
btnPause.addEventListener("click",togglePause);
btnRetry.addEventListener("click",function(){if(state==="running"||state==="over")retryLevel();});
btnLevels.addEventListener("click",function(){if(state==="running"&&!paused){paused=true;btnPause.textContent="继续";}showLevels();});
document.addEventListener("visibilitychange",function(){if(document.hidden&&state==="running"&&!paused)togglePause();});

/* ---------- 主循环 ---------- */
function loop(now){
  requestAnimationFrame(loop);
  var dt=((now-lastFrame)/1000)||0.016;lastFrame=now;
  if(dt>0.05)dt=0.05;
  if(state==="running"&&!paused&&!over)update(dt);
  draw(now);
}

setupLevel(Math.max(0,Math.min(saveData.lv,LEVELS.length-1)));
requestAnimationFrame(loop);
syncLevelsFromServer();
syncSaveFromServer();
showStart();
window.__validateLevels=function(){
  try{return BS.validateAll(LEVELS);}catch(e){return {error:String(e)};}
};
/* 工具钮图标注入 */
$("btnPause").insertAdjacentHTML("afterbegin",SW_ICON("pause"));
$("btnLevels").insertAdjacentHTML("afterbegin",SW_ICON("grid"));
$("btnRetry").insertAdjacentHTML("afterbegin",SW_ICON("rotate"));
})();
</script>
