/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

};

function applyLevels(list,version){
  if(!Array.isArray(list)||list.length<40)return false;
  for(var i=0;i<list.length;i++)if(!BS.validate(list[i]).ok)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length>=40){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function parseLevels(res){
  if(!res||!Array.isArray(res.levels)||res.levels.length<40)return false;
  var list=[],i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item.dataJson!=="string")return false;
    var d;try{d=JSON.parse(item.dataJson);}catch(e){return false;}
    if(!BS.validate(d).ok)return false;
    list.push(d);
  }
  return list;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("belt-sort").then(function(res){
    var list=parseLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){setupLevel(Math.max(0,Math.min(cur,LEVELS.length-1)));showStart();}
  }).catch(function(){});
}

/* ---------- 存档 ---------- */
var KEY="sw.belt-sort.v1";
function loadSave(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&typeof s==="object"){
      var done={};
      if(s.done&&typeof s.done==="object")for(var k in s.done){var v=parseInt(s.done[k],10);if(v>0)done[k]=v;}
      return {lv:Math.max(0,parseInt(s.lv,10)||0),done:done,best:Math.max(0,parseInt(s.best,10)||0)};
    }
  }catch(e){}
  return {lv:0,done:{},best:0};
}
var saveData=loadSave();
var doneSave=saveData.done||{};
var best=saveData.best||0;
function totalBest(){var t=0,k;for(k in doneSave){var v=parseInt(doneSave[k],10)||0;if(v>0)t+=v;}return t;}
function save(){
  var data={lv:saveData.lv,done:doneSave,best:best};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("belt-sort",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("belt-sort").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(remote.lv,10)||0;if(rl>saveData.lv){saveData.lv=rl;changed=true;}
      var rb=parseInt(remote.best,10)||0;if(rb>best){best=rb;changed=true;}
      if(remote.done&&typeof remote.done==="object")for(var k in remote.done){
        var rv=parseInt(remote.done[k],10)||0,mv=parseInt(doneSave[k],10)||0;
        if(rv>mv){doneSave[k]=rv;changed=true;}
      }
      if(changed){best=Math.max(best,totalBest());save();refreshStats();}
    }catch(e){}
  }).catch(function(){});
}

/* ---------- 分类与状态 ---------- */
var CATS=["纸类","厨余","塑料","金属","有害"];
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var binsEl=document.getElementById("bins");
var stLv=document.getElementById("stLv"),stScore=document.getElementById("stScore"),stTime=document.getElementById("stTime");
var msgEl=document.getElementById("msg");
var btnPause=document.getElementById("btnPause"),btnLevels=document.getElementById("btnLevels"),btnRetry=document.getElementById("btnRetry");
var overlay=document.getElementById("overlay"),panel=document.getElementById("panel");
function $(id){return document.getElementById(id);}
function say(t){msgEl.textContent=t;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}

var cur=0,L=null,seq=[],items=[],spawned=0,spawnT=0;
var correct=0,resolved=0,timeLeft=0,state="ready",paused=false,over=false;
var W=0,H=0,dpr=1,itemW=34,beltY=0,dropX=0,flash=0,lastFrame=0;
function fit(){
  var r=cv.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(200,r.width);H=Math.max(200,r.width*3/4);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  beltY=H*0.52;dropX=W*0.76;
  draw();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);

function buildBins(){
  binsEl.innerHTML="";
  for(var i=0;i<L.cats;i++){
    var b=document.createElement("button");
    b.type="button";b.className="bin c"+i;
    b.innerHTML='<span class="dot"></span><span>'+CATS[i]+'</span>';
    b.addEventListener("click",function(idx){return function(){sort(idx);};}(i));
    binsEl.appendChild(b);
  }
}
function setupLevel(n){
  n=Math.max(0,Math.min(n,LEVELS.length-1));
  cur=n;L=LEVELS[n];
  seq=BS.genItems(L);items=[];spawned=0;spawnT=0;
  correct=0;resolved=0;timeLeft=L.time;over=false;paused=false;flash=0;
  buildBins();fit();refreshStats();
  btnPause.disabled=true;btnPause.textContent="暂停";
  say("点击「开始」开传送带");
}
function startPlay(){
  state="running";paused=false;over=false;
  hideOverlay();
  btnPause.disabled=false;btnPause.textContent="暂停";
  say("垃圾进入投放区后点对应垃圾桶");
}
function togglePause(){
  if(state!=="running")return;
  paused=!paused;
  btnPause.textContent=paused?"继续":"暂停";
  if(paused)showPause();else hideOverlay();
  say(paused?"已暂停":"已继续");
}
function retryLevel(){setupLevel(cur);startPlay();}
function enterLevel(n){setupLevel(n);showStart();}
function refreshStats(){
  stLv.textContent=(cur+1)+"/"+LEVELS.length;
  stScore.textContent=correct+"/"+L.target;
  stTime.textContent=Math.max(0,Math.ceil(timeLeft));
}
function sort(cat){
  if(state!=="running"||paused||over)return;
  var idx=-1,bestX=Infinity,i;
  for(i=0;i<items.length;i++){
    if(items[i].x>=dropX&&items[i].x<bestX){bestX=items[i].x;idx=i;}
  }
  if(idx<0){say("投放区还没有垃圾");return;}
  var it=items[idx];
  items.splice(idx,1);resolved++;
  if(it.cat===cat){correct++;say("分类正确 +1");}
  else{timeLeft=Math.max(0,timeLeft-2);flash=1;say("错分！扣 2 秒");}
  refreshStats();
  if(resolved>=seq.length||correct>=L.target&&items.length===0)endLevel();
  else if(items.length===0&&spawned>=seq.length)endLevel();
}
function endLevel(){
  if(over)return;
  over=true;state="over";btnPause.disabled=true;
  var pass=correct>=L.target;
  var sc=correct*10;
  var prev=doneSave[cur]||0;if(sc>prev)doneSave[cur]=sc;
  var tb=totalBest();if(tb>best)best=tb;
  if(pass&&cur+1>saveData.lv)saveData.lv=cur+1;
  save();
  if(GB.available)GB.reportScore("belt-sort",{metricValue:best,metricExtra:cur+1}).catch(function(){});
  refreshStats();
  if(pass)showWin(sc);else showFail();
}

/* ---------- 更新 ---------- */
function update(dt){
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;endLevel();return;}
  spawnT-=dt;
  if(spawned<seq.length&&spawnT<=0){
    items.push({cat:seq[spawned],x:-itemW});
    spawned++;spawnT=L.interval;
  }
  var speed=(W+itemW*2)/L.travel,i;
  for(i=items.length-1;i>=0;i--){
    items[i].x+=speed*dt;
    if(items[i].x>W+itemW){items.splice(i,1);resolved++;if(resolved>=seq.length)endLevel();}
  }
  flash=Math.max(0,flash-dt*2.5);
  refreshStats();
}

/* ---------- 渲染 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawItem(x,y,cat){
  var s=itemW;
  ctx.fillStyle=PAL.bin[cat];
  rr(x-s/2,y-s/2,s,s,6);ctx.fill();
  ctx.fillStyle=PAL.surface;
  if(cat===0){ctx.fillRect(x-s*0.22,y-s*0.24,s*0.44,3);ctx.fillRect(x-s*0.22,y-s*0.05,s*0.44,3);ctx.fillRect(x-s*0.22,y+s*0.14,s*0.3,3);}
  else if(cat===1){ctx.beginPath();ctx.arc(x,y,s*0.2,0,Math.PI*2);ctx.fill();}
  else if(cat===2){ctx.fillRect(x-s*0.14,y-s*0.24,s*0.28,s*0.48);ctx.fillRect(x-s*0.06,y-s*0.32,s*0.12,s*0.1);}
  else if(cat===3){ctx.beginPath();ctx.moveTo(x,y-s*0.24);ctx.lineTo(x+s*0.22,y);ctx.lineTo(x,y+s*0.24);ctx.lineTo(x-s*0.22,y);ctx.closePath();ctx.fill();}
  else{ctx.fillRect(x-s*0.05,y-s*0.24,s*0.1,s*0.3);ctx.fillRect(x-s*0.05,y+s*0.14,s*0.1,s*0.1);}
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.surface2;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=PAL.belt;ctx.fillRect(0,beltY-itemW*0.7,W,itemW*1.4);
  ctx.fillStyle=PAL.beltdot;
  for(var x=8;x<W;x+=18)ctx.fillRect(x,beltY-1,9,2);
  ctx.fillStyle=PAL.drop;
  ctx.fillRect(dropX,beltY-itemW*0.95,3,itemW*1.9);
  ctx.fillStyle=PAL.surface;
  ctx.font="700 12px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("投放区",dropX+22,beltY-itemW*1.05);
  for(var i=0;i<items.length;i++)drawItem(items[i].x,beltY,items[i].cat);
  if(flash>0){
    ctx.globalAlpha=Math.min(0.4,flash*0.4);
    ctx.fillStyle=PAL.danger;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
  if(state==="ready"){
    ctx.fillStyle=PAL.muted;ctx.font="700 18px system-ui,sans-serif";
    ctx.fillText("第 "+(cur+1)+" 关 · "+L.name,W/2,H*0.3);
  }
}

/* ---------- 覆盖层 ---------- */
function showPanel(html){panel.innerHTML=html;overlay.classList.add("show");}
function hideOverlay(){overlay.classList.remove("show");}
function showStart(){
  showPanel(
    '<p class="rt">第 '+(cur+1)+' 关 · '+esc(L.name)+'</p>'+
    '<p class="rs">分类 '+L.cats+' 类 · 垃圾 '+L.items+' 件 · 目标 <b>'+L.target+'</b> 件</p>'+
    '<div class="rbtns"><button class="btn" id="ovMain" type="button">开始</button></div>'+
    '<p class="rhint">垃圾沿传送带进入右侧投放区后，点下方对应垃圾桶。投对得 1 件，投错扣 2 秒；限时内达到目标即过关。</p>'
  );
  $("ovMain").addEventListener("click",function(){startPlay();});
}
function showPause(){
  showPanel(
    '<p class="rt">已暂停</p>'+
    '<p class="rs">正确 '+correct+' / 目标 '+L.target+'</p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovRetryP" type="button">重玩本关</button>'+
      '<button class="btn" id="ovResume" type="button">继续</button>'+
    '</div>'
  );
  $("ovResume").addEventListener("click",function(){togglePause();});
  $("ovRetryP").addEventListener("click",function(){retryLevel();});
}
function showWin(sc){
  showPanel(
    '<p class="rt">过关！</p>'+
    '<p class="rs">正确 '+correct+' 件 · 得分 <b>'+sc+'</b></p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovReplay" type="button">重玩本关</button>'+
      '<button class="btn" id="ovNext" type="button">下一关</button>'+
    '</div>'
  );
  $("ovNext").addEventListener("click",function(){enterLevel(cur<LEVELS.length-1?cur+1:cur);});
  $("ovReplay").addEventListener("click",function(){enterLevel(cur);});
}
function showFail(){
  showPanel(
    '<p class="rt">未达标</p>'+
    '<p class="rs">正确 '+correct+' 件 · 目标 '+L.target+' 件</p>'+
    '<p class="rhint">提示：先看清楚垃圾类别再出手，错分扣时很伤。</p>'+
    '<div class="rbtns"><button class="btn" id="ovRetryF" type="button">重试本关</button></div>'
  );
  $("ovRetryF").addEventListener("click",function(){retryLevel();});
}
function showLevels(){
  var html='<p class="rt">选择关卡</p><p class="rs">已过关卡显示为绿色</p><div class="lv-wrap"><div class="lv-grid">';
  for(var i=0;i<LEVELS.length;i++){
    var done=parseInt(doneSave[i],10)>0;
    var locked=i>saveData.lv;
    html+='<button class="lv-chip'+(i===cur?" sel":"")+(done?" done":"")+'" data-i="'+i+'"'+(locked?" disabled":"")+' type="button">'+(i+1)+'</button>';
  }
  html+='</div></div><div class="rbtns"><button class="btn ghost" id="ovClose" type="button">返回</button></div>';
  showPanel(html);
  var chips=panel.querySelectorAll(".lv-chip");
  for(var j=0;j<chips.length;j++)chips[j].addEventListener("click",function(){enterLevel(parseInt(this.getAttribute("data-i"),10));});
  $("ovClose").addEventListener("click",function(){hideOverlay();if(state==="running"&&paused)showPause();});
}

/* ---------- 输入 ---------- */
document.addEventListener("keydown",function(e){
  if(e.repeat)return;
  var k=e.key;
  if(k>="1"&&k<="5"){var idx=parseInt(k,10)-1;if(idx<L.cats)sort(idx);return;}
  if(k===" "){e.preventDefault();if(state==="running")togglePause();else if(state==="ready"||state==="over")startPlay();}
});
btnPause.addEventListener("click",togglePause);
btnRetry.addEventListener("click",function(){if(state==="running"||state==="over")retryLevel();});
btnLevels.addEventListener("click",function(){if(state==="running"&&!paused){paused=true;btnPause.textContent="继续";}showLevels();});
document.addEventListener("visibilitychange",function(){if(document.hidden&&state==="running"&&!paused)togglePause();});

/* ---------- 主循环 ---------- */
function loop(now){
  requestAnimationFrame(loop);
  var dt=((now-lastFrame)/1000)||0.016;lastFrame=now;
  if(dt>0.05)dt=0.05;
  if(state==="running"&&!paused&&!over)update(dt);
  draw();
}

setupLevel(Math.max(0,Math.min(saveData.lv,LEVELS.length-1)));
requestAnimationFrame(loop);
syncLevelsFromServer();
syncSaveFromServer();
showStart();
window.__validateLevels=function(){
  try{return BS.validateAll(LEVELS);}catch(e){return {error:String(e)};}
};
})();
</script>
