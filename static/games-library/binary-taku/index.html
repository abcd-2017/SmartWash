var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.n)||(d.n!==4&&d.n!==6&&d.n!==8&&d.n!==10))return false;
  if(!Array.isArray(d.g)||d.g.length!==d.n)return false;
  var i;
  for(i=0;i<d.n;i++){
    if(typeof d.g[i]!=="string"||d.g[i].length!==d.n||/[^01.]/.test(d.g[i]))return false;
  }
  if(typeof d.sol!=="string"||d.sol.length!==d.n*d.n||/[^01]/.test(d.sol))return false;
  return true;
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    var ck=d.sol;
    if(seen[ck])return null;seen[ck]=1;
    list.push({name:String(d.name),n:d.n,g:d.g.slice(),sol:d.sol});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData))LEVELS=list;
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      loadLevel(lv);
    }
  }).catch(function(){});
}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });

    })(i);

function hideOverlay(){$("overlay").classList.remove("show")}

/* ---------- 求解器（约束传播 + 回溯，统计解数上限 2） ---------- */
function countSolutions(n,given,cap){
  var count=0,nodes=0;
  function clone(g){return g.map(function(r){return r.slice()});}
  function propagate(g){
    var changed=true;
    while(changed){
      changed=false;
      var r,c,i;
      for(r=0;r<n;r++){
        var z=0,o=0,blanks=[];
        for(c=0;c<n;c++){if(g[r][c]===0)z++;else if(g[r][c]===1)o++;else blanks.push(c);}
        if(z===n/2&&blanks.length){for(i=0;i<blanks.length;i++)if(g[r][blanks[i]]===-1){g[r][blanks[i]]=1;changed=true;}}
        if(o===n/2&&blanks.length){for(i=0;i<blanks.length;i++)if(g[r][blanks[i]]===-1){g[r][blanks[i]]=0;changed=true;}}
        for(c=0;c+2<n;c++)if(g[r][c]>=0&&g[r][c]===g[r][c+1]&&g[r][c+2]===-1){g[r][c+2]=1-g[r][c];changed=true;}
        for(c=2;c<n;c++)if(g[r][c]>=0&&g[r][c]===g[r][c-1]&&g[r][c-2]===-1){g[r][c-2]=1-g[r][c];changed=true;}
        if(c>=n){c=n-1;}
      }
      for(c=0;c<n;c++){
        z=0;o=0;blanks=[];
        for(r=0;r<n;r++){if(g[r][c]===0)z++;else if(g[r][c]===1)o++;else blanks.push(r);}
        if(z===n/2&&blanks.length){for(i=0;i<blanks.length;i++)if(g[blanks[i]][c]===-1){g[blanks[i]][c]=1;changed=true;}}
        if(o===n/2&&blanks.length){for(i=0;i<blanks.length;i++)if(g[blanks[i]][c]===-1){g[blanks[i]][c]=0;changed=true;}}
        for(r=0;r+2<n;r++)if(g[r][c]>=0&&g[r][c]===g[r+1][c]&&g[r+2][c]===-1){g[r+2][c]=1-g[r][c];changed=true;}
        for(r=2;r<n;r++)if(g[r][c]>=0&&g[r][c]===g[r-1][c]&&g[r-2][c]===-1){g[r-2][c]=1-g[r][c];changed=true;}
      }
    }
    return g;
  }
  function validFull(g){
    var r,c;
    for(r=0;r<n;r++){
      var z=0,o=0;
      for(c=0;c<n;c++){if(g[r][c]===0)z++;else o++;}
      if(z!==o)return false;
      for(c=0;c+2<n;c++)if(g[r][c]===g[r][c+1]&&g[r][c]===g[r][c+2])return false;
    }
    for(c=0;c<n;c++){
      var z2=0,o2=0;
      for(r=0;r<n;r++){if(g[r][c]===0)z2++;else o2++;}
      if(z2!==o2)return false;
      for(r=0;r+2<n;r++)if(g[r][c]===g[r+1][c]&&g[r][c]===g[r+2][c])return false;
    }
    var rs={},cs2={};
    for(r=0;r<n;r++)if(rs[g[r].join("")])return false;else rs[g[r].join("")]=1;
    for(c=0;c<n;c++){var col=[];for(r=0;r<n;r++)col.push(g[r][c]);if(cs2[col.join("")])return false;cs2[col.join("")]=1;}
    return true;
  }
  function bt(g,idx){
    if(count>=cap||nodes>300000)return;
    nodes++;
    g=propagate(g);
    var i;
    for(i=idx;i<n*n;i++){
      var r=Math.floor(i/n),c=i%n;
      if(g[r][c]===-1){
        for(var val=0;val<2;val++){
          var g2=clone(g);
          g2[r][c]=val;
          bt(g2,i+1);
          if(count>=cap)return;
        }
        return;
      }
    }
    if(validFull(g))count++;
  }
  var g=[];
  for(var r=0;r<n;r++)g.push(given[r].split("").map(function(ch){return ch==="."?-1:Number(ch);}));
  bt(g,0);
  return count;
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,n=4,user=[],given=[],hist=[],sel=0,over=false,won=false;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(x){
  lv=Math.max(0,Math.min(x,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  n=L.n;
  given=[];user=[];
  for(var r=0;r<n;r++){
    given.push(L.g[r].split("").map(function(ch){return ch==="."?-1:1;}));
    user.push(L.g[r].split("").map(function(ch){return ch==="."?-1:Number(ch);}));
  }
  hist=[];sel=Math.floor(n*n/2);over=false;won=false;
  var cnt=countSolutions(n,L.g,2);
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=n+"阶"+(cnt===1?"":" · ⚠解数"+cnt);
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  buildBoard();updStats();
  if(cnt!==1)say("警告：内嵌求解器判定本关解不唯一（数据异常）");
  else say("点空格切换 0/1；每行每列 0/1 各半，不许三连，行列两两不同");
}
function buildBoard(){
  var box=$("board");
  box.innerHTML="";
  box.style.gridTemplateColumns="repeat("+n+",1fr)";
  for(var i=0;i<n*n;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="cell";
      b.setAttribute("aria-label","格"+(Math.floor(i/n)+1)+"-"+(i%n+1));
      b.addEventListener("click",function(){tapCell(i)});
      box.appendChild(b);
    })(i);
  }
  renderAll();
}
function conflicts(){
  var bad={},count=0,r,c,i;
  function scanLine(get){
    var vals=[],blanks=0;
    for(i=0;i<n;i++){var v=get(i);if(v===-1)blanks++;vals.push(v);}
    if(blanks)return 0;
    var z=0,o=0;
    for(i=0;i<n;i++){if(vals[i]===0)z++;else o++;}
    var bad3=0;
    for(i=0;i+2<n;i++)if(vals[i]===vals[i+1]&&vals[i]===vals[i+2])bad3++;
    return z!==o||bad3>0?1:0;
  }
  for(r=0;r<n;r++){
    if(scanLine(function(c2){return user[r][c2];})){
      for(c=0;c<n;c++)bad[r*n+c]=1;
      count++;
    }
  }
  for(c=0;c<n;c++){
    if(scanLine(function(r2){return user[r2][c];})){
      for(r=0;r<n;r++)bad[r*n+c]=1;
      count++;
    }
  }
  var seen={};
  for(r=0;r<n;r++){
    var key=user[r].join(",");
    if(user[r].indexOf(-1)<0){
      if(seen[key]!==undefined){
        for(c=0;c<n;c++){bad[r*n+c]=1;bad[seen[key]*n+c]=1;}
        count++;
      } else seen[key]=r;
    }
  }
  var cols={};
  for(c=0;c<n;c++){
    var col=[];
    for(r=0;r<n;r++)col.push(user[r][c]);
    if(col.indexOf(-1)>=0)continue;
    var key2=col.join(",");
    if(cols[key2]!==undefined){
      for(r=0;r<n;r++){bad[r*n+c]=1;bad[cols[key2]*n+c]=1;}
      count++;
    } else cols[key2]=c;
  }
  return {bad:bad,count:count};
}
function renderAll(){
  var cells=$("board").children;
  var cf=conflicts();
  for(var i=0;i<n*n;i++){
    var b=cells[i],v=user[Math.floor(i/n)][i%n];
    b.className="cell"+(v===0?" o0":"")+(v===1?" o1":"")+(given[Math.floor(i/n)][i%n]>=0?" fixed":"")+(i===sel?" sel":"")+(cf.bad[i]?" bad":"");
    b.textContent=v===0?"0":v===1?"1":"";
  }
}
function updStats(){
  var blank=0,r,c;
  for(r=0;r<n;r++)for(c=0;c<n;c++)if(user[r][c]===-1)blank++;
  $("stBlank").textContent=blank;
  $("stBad").textContent=conflicts().count;
  $("stBad").className="val"+(conflicts().count?" low":"");
  $("btnUndo").disabled=!hist.length||over;
}
function tapCell(i){
  if(over)return;
  var r=Math.floor(i/n),c=i%n;
  if(given[r][c]>=0){say("提示格不能改");return;}
  var nv=user[r][c]===-1?0:(user[r][c]===0?1:-1);
  hist.push({i:i,prev:user[r][c]});
  user[r][c]=nv;
  updStats();renderAll();checkWin();
}
function checkWin(){
  var blank=0,r,c;
  for(r=0;r<n;r++)for(c=0;c<n;c++)if(user[r][c]===-1)blank++;
  if(blank===0&&conflicts().count===0){
    over=true;won=true;
    if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:hist.length}).catch(function(){});
    $("ovTitle").textContent=(lv>=LEVELS.length-1?"全部通关！":"过关！");
    $("ovDesc").innerHTML="行/列均衡、无三连、两两不同！共填 "+hist.length+" 步。"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"");
    $("ovBtn").textContent=(lv>=LEVELS.length-1?"回到第 1 关":"下一关");
    $("overlay").classList.add("show");
    updStats();
  }
}
function undo(){
  if(!hist.length||over)return;
  var h=hist.pop();
  user[Math.floor(h.i/n)][h.i%n]=h.prev;
  updStats();renderAll();say("已撤销");
}
function hint(){
  if(over)return;
  if(sel<0){say("先选一个空格");return;}
  var r=Math.floor(sel/n),c=sel%n;
  if(given[r][c]>=0){say("提示格不能改");return;}
  var v=Number(L.sol[sel]);
  hist.push({i:sel,prev:user[r][c]});
  user[r][c]=v;
  updStats();renderAll();checkWin();
  say("已填入正确数字 "+v);
}
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(!over)openLevelSelect();});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(over){if(won&&lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0);}else loadLevel(won?lv+1:lv);}
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowUp"||k==="ArrowDown"||k==="ArrowLeft"||k==="ArrowRight"){
    if(sel<0)sel=0;
    var r=Math.floor(sel/n),c=sel%n;
    if(k==="ArrowUp")r=Math.max(0,r-1);
    if(k==="ArrowDown")r=Math.min(n-1,r+1);
    if(k==="ArrowLeft")c=Math.max(0,c-1);
    if(k==="ArrowRight")c=Math.min(n-1,c+1);
    sel=r*n+c;e.preventDefault();renderAll();
  }
  else if(k===" "||k==="Enter"){
    if($("overlay").classList.contains("show")){$("ovBtn").click();}
    else tapCell(sel);
    e.preventDefault();
  }
  else if(k==="0"||k==="1"){
    if(sel>=0&&given[Math.floor(sel/n)][sel%n]<0){
      hist.push({i:sel,prev:user[Math.floor(sel/n)][sel%n]});
      user[Math.floor(sel/n)][sel%n]=Number(k);
      updStats();renderAll();checkWin();
    }
    e.preventDefault();
  }
  else if(k==="u"||k==="U")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
/* ---------- 内嵌独立验证器（锚点用例 + 40 关全量复核） ---------- */
function selfTest(){
  var total=0,ok=0,fails=[];
  function chk(c,name){total++;if(c)ok++;else fails.push(name);}
  chk(DEFAULT_LEVELS.length===40,"关卡数=40");
  chk(DEFAULT_LEVELS.every(validLevelData),"关卡配置合法");
  /* 锚点①：手排 4 阶 Takuzu（手算：行列均衡、无三连、行列两两不同） */
  (function(){
    var sq=["0011","1100","0101","1010"];
    var cnt=countSolutions(4,sq,2);
    chk(cnt===1,"锚点:满格题唯一");
    // 挖 (0,0)(0,1)：行 0 = 0,0,1,1 → 前两格由均衡+三连规则强制回原值
    var g2=["..11","1100","0101","1010"];
    chk(countSolutions(4,g2,2)===1,"锚点:挖两格仍唯一");
    var g3=["....","....","....","...."];
    chk(countSolutions(4,g3,2)>=1,"锚点:空盘有解");
  })();
  /* 锚点②：规则矩阵——三连 / 不均衡 / 行重复 各自独立违规 */
  (function(){
    var g1=["0001","1100","0101","1010"];
    // 0001 三连 000 → 行违规
    var bad=false;
    var row="0001";
    for(var i=0;i+2<4;i++)if(row[i]===row[i+1]&&row[i]===row[i+2])bad=true;
    chk(bad,"锚点:三连识别");
    chk((function(){var z=0,o=0,s="0000";for(var i=0;i<4;i++){if(s[i]==="0")z++;else o++;}return z!==o;})(),"锚点:不均衡识别");
  })();
  /* 40 关全量复核：唯一解 + sol 一致 */
  (function(){
    var allOk=true;
    for(var li=0;li<LEVELS.length;li++){
      var d=LEVELS[li];
      if(!validLevelData(d)){allOk=false;break;}
      var grid=[];
      for(var r=0;r<d.n;r++)grid.push(d.g[r].split("").map(function(ch){return ch==="."?-1:Number(ch);}));
      // 约束传播 + 回溯首解
      var count=0,first=null,nodes=0;
      function prop(g){
        var changed=true;
        while(changed){
          changed=false;
          var r,c,i;
          for(r=0;r<d.n;r++){
            var z=0,o=0,bl=[];
            for(c=0;c<d.n;c++){if(g[r][c]===0)z++;else if(g[r][c]===1)o++;else bl.push(c);}
            if(z===d.n/2)for(i=0;i<bl.length;i++)if(g[r][bl[i]]===-1){g[r][bl[i]]=1;changed=true;}
            if(o===d.n/2)for(i=0;i<bl.length;i++)if(g[r][bl[i]]===-1){g[r][bl[i]]=0;changed=true;}
            for(c=0;c+2<d.n;c++)if(g[r][c]>=0&&g[r][c]===g[r][c+1]&&g[r][c+2]===-1){g[r][c+2]=1-g[r][c];changed=true;}
            for(c=2;c<d.n;c++)if(g[r][c]>=0&&g[r][c]===g[r][c-1]&&g[r][c-2]===-1){g[r][c-2]=1-g[r][c];changed=true;}
          }
          for(c=0;c<d.n;c++){
            z=0;o=0;bl=[];
            for(r=0;r<d.n;r++){if(g[r][c]===0)z++;else if(g[r][c]===1)o++;else bl.push(r);}
            if(z===d.n/2)for(i=0;i<bl.length;i++)if(g[bl[i]][c]===-1){g[bl[i]][c]=1;changed=true;}
            if(o===d.n/2)for(i=0;i<bl.length;i++)if(g[bl[i]][c]===-1){g[bl[i]][c]=0;changed=true;}
            for(r=0;r+2<d.n;r++)if(g[r][c]>=0&&g[r][c]===g[r+1][c]&&g[r+2][c]===-1){g[r+2][c]=1-g[r][c];changed=true;}
            for(r=2;r<d.n;r++)if(g[r][c]>=0&&g[r][c]===g[r-1][c]&&g[r-2][c]===-1){g[r-2][c]=1-g[r][c];changed=true;}
          }
        }
        return g;
      }
      function full(g){
        var r,c,z,o;
        for(r=0;r<d.n;r++){
          z=0;o=0;
          for(c=0;c<d.n;c++){if(g[r][c]===0)z++;else o++;}
          if(z!==o)return false;
          for(c=0;c+2<d.n;c++)if(g[r][c]===g[r][c+1]&&g[r][c]===g[r][c+2])return false;
        }
        for(c=0;c<d.n;c++){
          z=0;o=0;
          for(r=0;r<d.n;r++){if(g[r][c]===0)z++;else o++;}
          if(z!==o)return false;
          for(r=0;r+2<d.n;r++)if(g[r][c]===g[r+1][c]&&g[r][c]===g[r+2][c])return false;
        }
        var rs={},cs2={};
        for(r=0;r<d.n;r++)if(rs[g[r].join("")])return false;else rs[g[r].join("")]=1;
        for(c=0;c<d.n;c++){var col=[];for(r=0;r<d.n;r++)col.push(g[r][c]);if(cs2[col.join("")])return false;cs2[col.join("")]=1;}
        return true;
      }
      function bt(g,idx){
        if(count>=2||nodes++>300000)return;
        g=prop(g);
        for(var i=idx;i<d.n*d.n;i++){
          var r=Math.floor(i/d.n),c=i%d.n;
          if(g[r][c]===-1){
            for(var val=0;val<2;val++){
              var g2=g.map(function(row){return row.slice()});
              g2[r][c]=val;
              bt(g2,i+1);
              if(count>=2)return;
            }
            return;
          }
        }
        if(full(g)){
          count++;
          if(!first)first=g.map(function(row){return row.join("")}).join("");
        }
      }
      bt(grid,0);
      if(count!==1||first!==d.sol){allOk=false;break;}
    }
    chk(allOk,"40关:唯一解且sol一致");
  })();
  window.__gSelfTest={ok:ok,total:total,fails:fails};
  if(fails.length)say("警告：内嵌自检未全过（"+ok+"/"+total+"）");
}
/* ---------- 启动（续玩：从存档关卡起步） ---------- */
loadLevel(save.lv);selfTest();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
