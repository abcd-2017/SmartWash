<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>吞噬进化</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材（st- 前缀素材 token）*/
  :root {
    --g-bg:#F5F6F3; --g-surface:#FFFFFF; --g-surface2:#EFF1EE;
    --g-primary:#2D9B6A; --g-primary-deep:#17734A;--g-btn-primary:#17734A; --g-primary-soft:#E8F6EF; --g-on-primary:#FFFFFF; --g-on-soft:#0B3625;
    --g-text:#1C1C1E; --g-muted:#6B6E73; --g-faint:#A9AEA9; --g-border:#E6E9E6; --g-hairline:#EFF1EE;
    --g-danger:#A83850; --g-warning:#9A6210; --g-success:#17734A; --g-water:#4A9FD4;
    --g-scrim:rgba(245,246,243,.9);
    --g-shadow:0 2px 12px rgba(20,40,30,.05);
    --g-radius:16px; --g-radius-btn:14px; --g-radius-inner:12px; --g-gap:16px;
    --g-st-fluid1:#E3F1EA; --g-st-fluid2:#F4FAF6; --g-st-grid:#CFE3D8; --g-st-pellet:#4A9FD4;
    color-scheme:light;
  }
  :root[data-theme=dark] {
    --g-bg:#141614; --g-surface:#1D201E; --g-surface2:#262A27;
    --g-primary-deep:#5BC894; --g-primary-soft:#1D3229; --g-on-soft:#B9E8CF;
    --g-text:#E6E9E6; --g-muted:#A9AEA9; --g-faint:#7E837D; --g-border:#2C312D; --g-hairline:#262A27;
    --g-danger:#DB7186; --g-warning:#E2A44E; --g-success:#4ADE6E; --g-water:#6BB4DE;
    --g-scrim:rgba(20,22,20,.9);
    --g-shadow:0 2px 12px rgba(0,0,0,.28);
    --g-st-fluid1:#172420; --g-st-fluid2:#101513; --g-st-grid:#25302B; --g-st-pellet:#6BB4DE;
    color-scheme:dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.5; }
  .icon-btn {
    width: 44px; height: 44px; flex: 0 0 44px;
    border: 1px solid var(--g-border); border-radius: 12px;
    background: var(--g-surface); color: var(--g-text);
    display: grid; place-items: center; cursor: pointer; font: inherit;
    touch-action: manipulation;
  }
  .icon-btn:active { opacity: .8; }
  .scores { display: flex; gap: 8px; flex: 1; }
  .score-box {
    background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 12px;
    flex: 1; min-width: 0; padding: 5px 8px; text-align: center; line-height: 1.3;
  }
  .score-box .label { display: block; font-size: 12px; opacity: .85; white-space: nowrap; }
  .score-box .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; min-width: 0; background: var(--g-surface2); border-radius: 12px; padding: 5px 8px; text-align: center; line-height: 1.3; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); white-space: nowrap; }
  .stat .val { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .hint { margin: 0; font-size: 14px; color: var(--g-muted); }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: 14px;
    background: var(--g-btn-primary); color: var(--g-on-primary);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    touch-action: manipulation;
  }
  .btn:active { opacity: .85; }
  .btn.ghost { background: var(--g-surface2); color: var(--g-text); border: 1px solid var(--g-border); }
  .stage { position: relative; }
  canvas {
    display: block; width: 100%; aspect-ratio: 390 / 520; height: auto;
    background: var(--g-surface2);
    border: 1px solid var(--g-border); border-radius: 12px;
    touch-action: none;
  }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: absolute; inset: 0; z-index: 5;
    border-radius: 12px; background: var(--g-scrim);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 16px; text-align: center;
  }
  .overlay.show { display: flex; animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: translateY(0); } }
  .ov-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--g-primary-deep); max-width: 100%; }
  .ov-sub { margin: 0 0 6px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .btn-row { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .btn-row .btn { flex: 1; }
  .lv-wrap { width: 100%; max-width: 340px; max-height: 48vh; overflow-y: auto; }
  .lv-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .lv-chip {
    min-height: 44px; border: 1px solid var(--g-border); border-radius: 10px;
    background: var(--g-surface); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    touch-action: manipulation;
  }
  .lv-chip.sel { border-color: var(--g-primary); box-shadow: inset 0 0 0 1.5px var(--g-primary); background: var(--g-primary-soft); color: var(--g-on-soft); }
  .lv-chip.done { background: var(--g-btn-primary); border-color: var(--g-primary); color: var(--g-on-primary); }
  .lv-chip:disabled { opacity: .38; cursor: not-allowed; }
  .badge { display: none; margin: 0 0 4px; padding: 4px 12px; border-radius: 999px; background: var(--g-surface2); color: var(--g-warning); font-size: 12px; font-weight: 700; }
  .badge.show { display: inline-block; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="scores">
      <div class="score-box"><span class="label">分数</span><span class="val" id="score">0</span></div>
      <div class="score-box"><span class="label">最高分</span><span class="val" id="best">0</span></div>
      <div class="score-box"><span class="label">进化</span><span class="val" id="tier">Ⅰ</span></div>
    </div>
  </header>
  <div class="toolbar">
    <p class="hint">以小吃大、避大，吃满三级进化</p>
    <button class="btn" id="mainBtn">开始游戏</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="吞噬进化游戏画面"></canvas>
    <div class="overlay" role="dialog" aria-modal="true" id="overlay">
      <p class="ov-title" id="ovTitle" role="status" aria-live="assertive">准备开始</p>
      <p class="ov-sub" id="ovSub">吃比自己小的球变大，被大球吞掉即结束</p>
      <button class="btn" id="ovBtn">开始游戏</button>
    </div>
  </div>
  <p class="foot">操作：按住拖动 / 方向键 · WASD · 空格暂停</p>
</div>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 画布与调色板（颜色全部经 CSS 变量读取，JS 零颜色字面量） ========== */
var NW=390,NH=520,W=390,H=520,S=1,offX=0,offY=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),border:v("--g-border"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),danger:v("--g-danger"),warning:v("--g-warning"),
    water:v("--g-water"),success:v("--g-success"),onPrimary:v("--g-on-primary"),
    fluid1:v("--g-st-fluid1"),fluid2:v("--g-st-fluid2"),grid:v("--g-st-grid"),pellt:v("--g-st-pellet")};
}
window.__gOnTheme=function(){palLoad();grads=null;};
palLoad();
var grads=null;
function buildGrads(){grads=ctx.createLinearGradient(0,0,0,NH);grads.addColorStop(0,PAL.fluid1);grads.addColorStop(1,PAL.fluid2);}

/* ========== 音效 ========== */
var AC=null;
function beep(f,d,type,vol){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=f;g.gain.value=vol||0.05;
    o.connect(g);g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(d||0.1));
    o.start();o.stop(AC.currentTime+(d||0.1)+0.02);
  }catch(e){}
}

/* ========== 存档（裸最高分；本地 + 账号双写） ========== */
var KEY="sw.blobeat.v1";
var store={
  get:function(k){try{return window.localStorage.getItem(k)}catch(e){return null}},
  set:function(k,val){try{window.localStorage.setItem(k,val)}catch(e){}}
};
var best=parseInt(store.get(KEY)||"0",10)||0;
document.getElementById("best").textContent=best;
function persistBest(){
  store.set(KEY,String(best));
  if(GB.available)GB.saveState("blob-eat",String(best)).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("blob-eat").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rb=parseInt(JSON.parse(res.stateJson),10)||0;
      if(rb>best){best=rb;persistBest();document.getElementById("best").textContent=best;}
    }catch(e){}
  }).catch(function(){});
}

/* ========== 状态 ========== */
var AREA_K=Math.PI;
var player=null,ais=null,pellets=null,parts=null,floats=null;
var score=0,tier=1,clock=0,spawnT=0,thinkT=0;
var state="ready";
var keys={up:false,down:false,left:false,right:false};
var targetPt=null;
var AI_COLORS=["water","warning","danger","primary","success"];
var scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),tierEl=document.getElementById("tier");
var overlayEl=document.getElementById("overlay");
var ovTitle=document.getElementById("ovTitle"),ovSub=document.getElementById("ovSub");
var ovBtn=document.getElementById("ovBtn"),mainBtn=document.getElementById("mainBtn");

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rand(a,b){return a+Math.random()*(b-a)}
function dist2(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return dx*dx+dy*dy}
function showOverlay(t,s,b){ovTitle.textContent=t;ovSub.textContent=s;ovBtn.textContent=b;overlayEl.classList.add("show")}
function hideOverlay(){overlayEl.classList.remove("show")}
function addFloat(x,y,txt,c){floats.push({x:x,y:y,txt:txt,c:c,life:0.9,max:0.9});}
function puff(x,y,c,n){
  for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:rand(-120,120),vy:rand(-140,60),r:rand(2,4),life:rand(0.25,0.5),max:0.5,c:c});
}
function pSpeed(r){return clamp(215-r*2.4,86,215)+ (tier-1)*14}
function aiSpeed(r){return clamp(150-r*1.7,58,150)}
function tierOf(r){return r>=40?3:(r>=26?2:1)}
function tierName(t){return t===3?"Ⅲ":(t===2?"Ⅱ":"Ⅰ")}

function resetRound(){
  player={x:NW/2,y:NH/2,r:13};
  ais=[];pellets=[];parts=[];floats=[];
  score=0;tier=1;clock=0;spawnT=0;thinkT=0;
  scoreEl.textContent="0";tierEl.textContent=tierName(1);
  for(var i=0;i<26;i++)pellets.push({x:rand(12,NW-12),y:rand(12,NH-12),r:4});
  for(var j=0;j<6;j++)spawnAI(true);
}
function spawnAI(initial){
  var pr=player.r,u=Math.random();
  var r;
  if(u<(initial?0.75:0.55))r=Math.max(6,pr*rand(0.35,0.8));
  else r=Math.min(44,pr*rand(1.25,2.3));
  var edge=(Math.random()*4)|0,x,y;
  if(edge===0){x=rand(0,NW);y=-r-4;}
  else if(edge===1){x=rand(0,NW);y=NH+r+4;}
  else if(edge===2){x=-r-4;y=rand(0,NH);}
  else{x=NW+r+4;y=rand(0,NH);}
  ais.push({x:x,y:y,r:r,hd:rand(0,6.28),mode:0,timer:0,c:AI_COLORS[(Math.random()*AI_COLORS.length)|0],ph:rand(0,6.28)});
}
function startGame(){resetRound();state="running";hideOverlay();mainBtn.textContent="暂停";}

function endRound(){
  var isRecord=score>best&&score>0;
  if(isRecord){best=score;persistBest();bestEl.textContent=best;}
  if(GB.available)GB.reportScore("blob-eat",{metricValue:best,metricExtra:tier}).catch(function(){});
  return isRecord?" · 新纪录":"";
}
function die(){
  state="over";
  beep(160,0.3,"sawtooth",0.06);
  showOverlay("被吞掉了","得分 "+score+endRound(),"重新开始");
  mainBtn.textContent="重新开始";
}
function primary(){
  if(state==="running"){
    state="paused";showOverlay("已暂停","休息一下，随时继续","继续");mainBtn.textContent="继续";
  }else if(state==="paused"){
    state="running";hideOverlay();mainBtn.textContent="暂停";
  }else startGame();
}

/* ========== 更新 ========== */
function eatAI(ai){
  var gain=AREA_K*ai.r*ai.r*0.8;
  player.r=Math.min(48,Math.sqrt(player.r*player.r+gain/AREA_K));
  score+=Math.round(ai.r*1.5);
  scoreEl.textContent=String(score);
  puff(ai.x,ai.y,PAL[ai.c]||PAL.primary,8);
  addFloat(ai.x,ai.y,"+"+Math.round(ai.r*1.5),PAL.deep);
  beep(360+player.r*4,0.08,"triangle",0.05);
  var nt=tierOf(player.r);
  if(nt>tier){
    tier=nt;tierEl.textContent=tierName(tier);
    addFloat(player.x,player.y-24,"进化 "+tierName(tier),PAL.warning);
    beep(760,0.18,"square",0.06);
  }
}
function step(dt){
  clock+=dt;
  // 玩家移动：键盘优先，其次跟随触点
  var vx=0,vy=0;
  if(keys.left)vx-=1;if(keys.right)vx+=1;
  if(keys.up)vy-=1;if(keys.down)vy+=1;
  if(vx||vy){
    var m=Math.sqrt(vx*vx+vy*vy);
    vx/=m;vy/=m;
    targetPt=null;
  }else if(targetPt){
    var dx=targetPt.x-player.x,dy=targetPt.y-player.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d>4){vx=dx/d;vy=dy/d;}
  }
  var sp=pSpeed(player.r);
  player.x=clamp(player.x+vx*sp*dt,player.r*0.5,NW-player.r*0.5);
  player.y=clamp(player.y+vy*sp*dt,player.r*0.5,NH-player.r*0.5);
  // 吃胶粒
  for(var i=pellets.length-1;i>=0;i--){
    var pl=pellets[i];
    if(dist2(player.x,player.y,pl.x,pl.y)<(player.r+pl.r)*(player.r+pl.r)){
      player.r=Math.min(48,Math.sqrt(player.r*player.r+6));
      score+=1;scoreEl.textContent=String(score);
      pellets.splice(i,1);
      pellets.push({x:rand(12,NW-12),y:rand(12,NH-12),r:4});
    }
  }
  // AI 思考（节流）
  thinkT-=dt;
  if(thinkT<=0){
    thinkT=0.3;
    for(var a=0;a<ais.length;a++){
      var ai=ais[a];
      ai.timer-=0.3;
      if(ai.timer<=0){ai.timer=rand(0.8,1.8);ai.hd=rand(0,6.28);}
      var prey=null,pd2=1e9,pred=null,qd2=1e9;
      // 目标：比自己小的最近球（含玩家）
      if(player.r<ai.r*0.9){pd2=dist2(ai.x,ai.y,player.x,player.y);prey=player;}
      for(var b=0;b<ais.length;b++){
        var o=ais[b];
        if(o===ai)continue;
        var d2=dist2(ai.x,ai.y,o.x,o.y);
        if(o.r<ai.r*0.9&&d2<pd2){pd2=d2;prey=o;}
        if(o.r>ai.r*1.1&&d2<qd2){qd2=d2;pred=o;}
      }
      if(pred&&qd2<150*150){ai.mode=2;}
      else if(prey&&pd2<190*190){ai.mode=1;ai.prey=prey;}
      else ai.mode=0;
    }
  }
  // AI 移动
  for(var c=0;c<ais.length;c++){
    var ab=ais[c];
    var hx=0,hy=0;
    if(ab.mode===2&&pred){hx=ab.x-pred.x;hy=ab.y-pred.y;}
    else if(ab.mode===1&&ab.prey){hx=ab.prey.x-ab.x;hy=ab.prey.y-ab.y;}
    else{hx=Math.cos(ab.hd);hy=Math.sin(ab.hd);}
    var hm=Math.sqrt(hx*hx+hy*hy)||1;
    ab.x+=hx/hm*aiSpeed(ab.r)*dt;
    ab.y+=hy/hm*aiSpeed(ab.r)*dt;
    ab.x=clamp(ab.x,ab.r*0.5,NW-ab.r*0.5);
    ab.y=clamp(ab.y,ab.r*0.5,NH-ab.r*0.5);
  }
  // AI 互吃
  for(var p=0;p<ais.length;p++){
    var big=ais[p];
    for(var q=ais.length-1;q>p;q--){
      var sm=ais[q];
      if(big.r>sm.r*1.15&&dist2(big.x,big.y,sm.x,sm.y)<(big.r-sm.r*0.3)*(big.r-sm.r*0.3)){
        big.r=Math.min(48,Math.sqrt(big.r*big.r+sm.r*sm.r*0.55));
        ais.splice(q,1);
        if(big.prey===sm)big.mode=0;
      }
    }
  }
  // 玩家吃 AI / 被 AI 吃
  for(var u=ais.length-1;u>=0;u--){
    var t=ais[u];
    if(player.r>t.r*1.12&&dist2(player.x,player.y,t.x,t.y)<(player.r+t.r*0.25)*(player.r+t.r*0.25)){
      eatAI(t);
      ais.splice(u,1);
    }else if(t.r>player.r*1.12&&t.r>player.r&&dist2(t.x,t.y,player.x,player.y)<(t.r-player.r*0.35)*(t.r-player.r*0.35)){
      puff(player.x,player.y,PAL.primary,14);
      die();
      return;
    }
  }
  // 补充 AI
  spawnT-=dt;
  if(spawnT<=0){
    spawnT=rand(0.9,1.6);
    if(ais.length<9)spawnAI(false);
  }
  // 粒子与浮字
  for(var pa=parts.length-1;pa>=0;pa--){
    var pt=parts[pa];
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=380*dt;pt.life-=dt;
    if(pt.life<=0)parts.splice(pa,1);
  }
  for(var fl=floats.length-1;fl>=0;fl--){
    var f=floats[fl];
    f.y-=34*dt;f.life-=dt;
    if(f.life<=0)floats.splice(fl,1);
  }
}

/* ========== 绘制 ========== */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawBlob(x,y,r,fill,edge,isPlayer,t){
  ctx.fillStyle=fill;
  ctx.beginPath();ctx.arc(x,y,r,0,6.3);ctx.fill();
  ctx.strokeStyle=edge;ctx.lineWidth=isPlayer?2.4:1.6;ctx.stroke();
  if(isPlayer&&t>=2){
    ctx.strokeStyle=edge;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,y,r*0.62,0,6.3);ctx.stroke();
  }
  if(isPlayer&&t>=3){
    ctx.fillStyle=PAL.warning;
    for(var i=0;i<6;i++){
      var an=i*1.047+clock*0.6;
      ctx.beginPath();
      ctx.moveTo(x+Math.cos(an)*(r+1),y+Math.sin(an)*(r+1));
      ctx.lineTo(x+Math.cos(an)*(r+7),y+Math.sin(an)*(r+7));
      ctx.lineTo(x+Math.cos(an+0.28)*(r+1),y+Math.sin(an+0.28)*(r+1));
      ctx.closePath();ctx.fill();
    }
  }
  // 眼睛（恒白眼白，素材例外）
  var er=Math.max(2.4,r*0.16);
  ctx.fillStyle="rgba(255,255,255,.92)";
  ctx.beginPath();ctx.arc(x-r*0.3,y-r*0.25,er,0,6.3);ctx.arc(x+r*0.3,y-r*0.25,er,0,6.3);ctx.fill();
  ctx.fillStyle=PAL.text;
  ctx.beginPath();ctx.arc(x-r*0.28,y-r*0.22,er*0.5,0,6.3);ctx.arc(x+r*0.32,y-r*0.22,er*0.5,0,6.3);ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(offX,offY);ctx.scale(S,S);
  if(!grads)buildGrads();
  ctx.fillStyle=grads;ctx.fillRect(0,0,NW,NH);
  // 流体网格点
  ctx.fillStyle=PAL.grid;
  for(var gx=16;gx<NW;gx+=32)for(var gy=16;gy<NH;gy+=32){ctx.fillRect(gx-1,gy-1,2,2);}
  ctx.fillStyle=PAL.pellt;
  for(var i=0;i<pellets.length;i++){
    ctx.beginPath();ctx.arc(pellets[i].x,pellets[i].y,pellets[i].r,0,6.3);ctx.fill();
  }
  for(var a=0;a<ais.length;a++){
    var ai=ais[a];
    drawBlob(ai.x,ai.y+Math.sin(clock*2+ai.ph)*2,ai.r,PAL[ai.c]||PAL.water,PAL.muted,false,1);
  }
  drawBlob(player.x,player.y,player.r,PAL.primary,PAL.deep,true,tier);
  for(var p=0;p<parts.length;p++){
    var pt=parts[p];
    ctx.globalAlpha=Math.max(0,pt.life/pt.max);
    ctx.fillStyle=pt.c;
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,6.3);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.font="700 18px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  for(var f=0;f<floats.length;f++){
    var fl=floats[f];
    ctx.globalAlpha=Math.max(0,fl.life/fl.max);
    ctx.fillStyle=fl.c;
    ctx.fillText(fl.txt,fl.x,fl.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

/* ========== 输入 ========== */
function toNominal(ev){
  var r=cv.getBoundingClientRect();
  return{x:(ev.clientX-r.left-offX)/S,y:(ev.clientY-r.top-offY)/S};
}
cv.addEventListener("pointerdown",function(ev){
  if(state!=="running")return;
  targetPt=toNominal(ev);
  ev.preventDefault();
});
cv.addEventListener("pointermove",function(ev){
  if(state!=="running"||targetPt===null)return;
  targetPt=toNominal(ev);
  ev.preventDefault();
});
cv.addEventListener("pointerup",function(){targetPt=null;});
cv.addEventListener("pointercancel",function(){targetPt=null;});

window.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowUp"||k==="w"){e.preventDefault();keys.up=true;}
  else if(k==="ArrowDown"||k==="s"){e.preventDefault();keys.down=true;}
  else if(k==="ArrowLeft"||k==="a"){e.preventDefault();keys.left=true;}
  else if(k==="ArrowRight"||k==="d"){e.preventDefault();keys.right=true;}
  else if(k===" "){e.preventDefault();primary();}
});
window.addEventListener("keyup",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowUp"||k==="w")keys.up=false;
  else if(k==="ArrowDown"||k==="s")keys.down=false;
  else if(k==="ArrowLeft"||k==="a")keys.left=false;
  else if(k==="ArrowRight"||k==="d")keys.right=false;
});

document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running"){state="paused";showOverlay("已暂停","回到游戏继续吞噬","继续");mainBtn.textContent="继续";}
});

/* ========== 主循环与启动 ========== */
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));
  H=Math.max(320,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);
  offX=(W-NW*S)/2;offY=(H-NH*S)/2;
}
window.addEventListener("resize",resize);

var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.033,(ts-last)/1000||0);
  last=ts;
  if(state==="running")step(dt);
  draw();
}

mainBtn.addEventListener("click",function(e){primary();e.currentTarget.blur();});
ovBtn.addEventListener("click",function(e){primary();e.currentTarget.blur();});

resize();
resetRound();
showOverlay("准备开始","以小吃大、避大，吃满三级进化","开始游戏");
syncSaveFromServer();
requestAnimationFrame(frame);

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
