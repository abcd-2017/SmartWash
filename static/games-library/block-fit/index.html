  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-st-tile:#A98F6F;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-tile:#4E4636;color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);

  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }

  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }

  .btn {

  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}

//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();

  <div class="panel">
    <h2 id="ovTitle">完美嵌合！</h2>

<script>
/* ========== 关卡生成器 + 独立验证器（纯逻辑，无 DOM 依赖） ========== */
(function(){
"use strict";
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function norm(cells){
  var mx=cells[0][0],my=cells[0][1],i;
  for(i=1;i<cells.length;i++){if(cells[i][0]<mx)mx=cells[i][0];if(cells[i][1]<my)my=cells[i][1];}
  var out=[];
  for(i=0;i<cells.length;i++)out.push([cells[i][0]-mx,cells[i][1]-my]);
  out.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});
  return out;
}
function rotCW(cells){
  var mx=cells[0][0];
  for(var i=1;i<cells.length;i++)if(cells[i][0]>mx)mx=cells[i][0];
  var out=[];
  for(i=0;i<cells.length;i++)out.push([cells[i][1],mx-cells[i][0]]);
  return norm(out);
}
function flipV(cells){
  var my=cells[0][1];
  for(var i=1;i<cells.length;i++)if(cells[i][1]>my)my=cells[i][1];
  var out=[];
  for(i=0;i<cells.length;i++)out.push([cells[i][0],my-cells[i][1]]);
  return norm(out);
}
function key(cells){return cells.map(function(c){return c.join(",")}).join("|")}
/* 独立验证器：从存储朝向到缺口朝向的最少变换（旋转/翻转 BFS，朝向群 ≤8 元） */
function solveOps(gapKey,pieceCells){
  var seen={},q=[{c:pieceCells,ops:0}];
  while(q.length){
    var cur=q.shift(),k=key(norm(cur.c));
    if(k===gapKey)return cur.ops;
    if(seen[k]||cur.ops>6)continue;
    seen[k]=1;
    q.push({c:rotCW(cur.c),ops:cur.ops+1});
    q.push({c:flipV(cur.c),ops:cur.ops+1});
  }
  return -1;
}
function genLevels(){
  var rnd=mulberry(20261128);
  function rn(m){return (rnd()*m)|0}
  function randShape(size){
    var cells=[[0,0]],guard=0;
    while(cells.length<size&&guard++<500){
      var base=cells[rn(cells.length)];
      var dir=[[1,0],[-1,0],[0,1],[0,-1]][rn(4)];
      var nc=[base[0]+dir[0],base[1]+dir[1]];
      var dup=false;
      for(var i=0;i<cells.length;i++)if(cells[i][0]===nc[0]&&cells[i][1]===nc[1]){dup=true;break;}
      if(!dup)cells.push(nc);
    }
    return norm(cells);
  }
  var out=[];
  for(var i=0;i<40;i++){
    var size=4+Math.min(5,(i/8)|0);
    var got=false,gd=0;
    while(!got&&gd++<200){
      var shape=randShape(size);
      var bw=0,bh=0;
      for(var s=0;s<shape.length;s++){if(shape[s][0]+1>bw)bw=shape[s][0]+1;if(shape[s][1]+1>bh)bh=shape[s][1]+1;}
      var S=Math.max(bw,bh)+3+rn(2);
      var ox=rn(S-bw+1),oy=rn(S-bh+1);
      var gap=norm(shape.map(function(c){return [c[0]+ox,c[1]+oy]}));
      var stored=shape,r;
      if(i>=10)for(r=0;r<1+rn(3);r++)stored=rotCW(stored);
      if(i>=26&&rn(2))stored=flipV(stored);
      var ops=solveOps(key(norm(gap)),stored);
      if(i<10&&ops!==0)continue;
      if(i>=10&&ops<1)continue;
      out.push({name:"补形·"+(i+1<10?"0":"")+(i+1),cols:S,rows:S,g:gap,p:stored,par:ops,difficulty:Math.min(6,1+((i/7)|0))});
      got=true;
    }
    if(!got){i--;}
  }
  return out;
}
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim()||d.name.length>24)return false;
  if(!Number.isInteger(d.cols)||d.cols<6||d.cols>9)return false;
  if(!Number.isInteger(d.rows)||d.rows<6||d.rows>9)return false;
  function cellsOk(arr,maxX,maxY){
    if(!Array.isArray(arr)||arr.length<4||arr.length>9)return false;
    var seen={};
    for(var i=0;i<arr.length;i++){
      var c=arr[i];
      if(!Array.isArray(c)||c.length!==2)return false;
      if(!Number.isInteger(c[0])||!Number.isInteger(c[1]))return false;
      if(c[0]<0||c[0]>=maxX||c[1]<0||c[1]>=maxY)return false;
      var k=c.join(",");
      if(seen[k])return false;
      seen[k]=1;
    }
    return true;
  }
  if(!cellsOk(d.g,d.cols,d.rows))return false;
  if(!cellsOk(d.p,d.cols,d.rows))return false;
  // 缺口与嵌块允许同向（入门关纯放置），异向由生成期难度带控制
  return true;
}
function normalizeLevel(d){
  var ops=solveOps(key(norm(d.g)),d.p);
  var diff=Number.isInteger(d.difficulty)?Math.min(9,Math.max(1,d.difficulty)):3;
  var name=(d&&typeof d.name==="string"&&d.name.trim())?d.name:"补形·??";
  return {name:name,cols:d.cols,rows:d.rows,g:d.g,p:d.p,par:ops>=0?ops:0,difficulty:diff};
}
window.__BF={norm:norm,rotCW:rotCW,flipV:flipV,key:key,solveOps:solveOps,genLevels:genLevels,validLevelData:validLevelData,normalizeLevel:normalizeLevel};
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ========== */
var BF=window.__BF,GAME_KEY="block-fit",SAVE_KEY="sw.blockfit.v1";
var LEVELS=BF.genLevels();
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i],d;
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!BF.validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    var n=BF.normalizeLevel(d);
    if(!(n.par>=0))continue;
    list.push(n);
  }
  return list.length?list:null;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(BF.validLevelData)){
      LEVELS=list.map(BF.normalizeLevel).filter(function(x){return x.par>=0});
      if(LEVELS.length)return v;
      LEVELS=BF.genLevels();
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);resize();
    }
  }).catch(function(){});
}
/* ---------- 存档 ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,piece=null,px=0,py=0,done=false,moves=0,hintOrient=null,hintT=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,cell=0;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function gapSet(){
  var s={};
  for(var i=0;i<L.g.length;i++)s[L.g[i][0]+","+L.g[i][1]]=1;
  return s;
}
function inBounds(){
  for(var i=0;i<piece.length;i++){
    var x=px+piece[i][0],y=py+piece[i][1];
    if(x<0||x>=L.cols||y<0||y>=L.rows)return false;
  }
  return true;
}
function overlaps(){
  var gs=gapSet();
  for(var i=0;i<piece.length;i++){
    var x=px+piece[i][0],y=py+piece[i][1];
    if(!gs[x+","+y])return true;   // 压到实心块
  }
  return false;
}
function exactFit(){
  var gs=gapSet();
  if(piece.length!==L.g.length)return false;
  for(var i=0;i<piece.length;i++){
    if(!gs[(px+piece[i][0])+","+(py+piece[i][1])])return false;
  }
  return true;
}
function loadLevel(idx){
  lv=Math.max(0,Math.min(idx,LEVELS.length-1));
  L=LEVELS[lv];
  if(!BF.validLevelData({name:L.name,cols:L.cols,rows:L.rows,g:L.g,p:L.p})){say("关卡数据异常");return;}
  var ops=BF.solveOps(BF.key(BF.norm(L.g)),L.p);   // 加载复核
  piece=L.p.map(function(c){return [c[0],c[1]]});
  px=0;py=0;done=false;moves=0;hintOrient=null;
  $("lvTag").textContent="第 "+(lv+1)+" 关";
  $("lvRule").textContent=L.name+" · "+L.g.length+" 格缺块 · "+L.cols+"×"+L.rows;
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stPar").textContent=ops>=0?ops+" 变换":"-";
  if(!(ops>=0))say("警告：验证器判定本关无法成型（数据异常）");
  else if(ops===0)say("朝向已对，移动绿色嵌块对准虚线缺口嵌入");
  else say("需要至少 "+ops+" 次旋转/翻转，把绿色嵌块对准虚线缺口");
  updStats();resize();
}
function updStats(){$("stMoves").textContent=moves}
function rotate(){
  if(done)return;
  piece=BF.rotCW(piece);moves++;
  say("已旋转 90°");updStats();render();
}
function flip(){
  if(done)return;
  piece=BF.flipV(piece);moves++;
  say("已翻转");updStats();render();
}
function tryPlace(){
  if(done)return;
  if(!inBounds()){say("嵌块超出盘面，先移动位置");return;}
  if(overlaps()){say("绿色嵌块压到了实心块，放不进去");return;}
  if(exactFit()){
    done=true;moves++;
    if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:moves}).catch(function(){});
    $("ovTitle").textContent="完美嵌合！";
    $("ovDesc").innerHTML="操作 "+moves+" 次（参考最优 "+$("stPar").textContent+"）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
    $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
    $("overlay").classList.add("show");
    say("一次成型！");
    render();
    return;
  }
  moves++;updStats();
  say("形状不对——缺口是 "+L.g.length+" 格异形，再调整旋转 / 翻转");
}
function hint(){
  if(done)return;
  hintOrient=BF.norm(L.g);hintT=Date.now();
  say("缺口朝向已短暂高亮（黄色虚线加粗）——把嵌块变到这个朝向");
}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n2){return s.getPropertyValue(n2).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),primary:v("--g-primary"),
    tile:v("--g-st-tile")};
}
window.__gOnTheme=function(){palLoad();render()};//App 推送主题时刷新调色板并重绘
/* ---------- 绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);
  cell=Math.min(56,W/L.cols);
  H=Math.round(cell*L.rows);
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  render();
}
function render(){
  if(!L)return;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=PAL.surface2;ctx.fillRect(0,0,W,H);
  var gs=gapSet(),i;
  for(var y=0;y<L.rows;y++)for(var x=0;x<L.cols;x++){
    var pxp=x*cell,pyp=y*cell;
    if(gs[x+","+y]){
      ctx.fillStyle=PAL.surface;
      ctx.fillRect(pxp+1,pyp+1,cell-2,cell-2);
      ctx.strokeStyle=PAL.deep;ctx.lineWidth=1.5;
      ctx.setLineDash([4,3]);
      ctx.strokeRect(pxp+3,pyp+3,cell-6,cell-6);
      ctx.setLineDash([]);
    }else{
      ctx.fillStyle=PAL.tile;
      ctx.fillRect(pxp+1,pyp+1,cell-2,cell-2);
      ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
      ctx.strokeRect(pxp+1,pyp+1,cell-2,cell-2);
    }
  }
  //提示：缺口位置加粗脉冲
  if(hintOrient&&Date.now()-hintT<2600){
    var pulse=0.5+0.5*Math.sin((Date.now()-hintT)/170);
    ctx.strokeStyle=PAL.warning;ctx.lineWidth=3;ctx.globalAlpha=0.4+pulse*0.6;
    L.g.forEach(function(c){
      ctx.strokeRect(c[0]*cell+2,c[1]*cell+2,cell-4,cell-4);
    });
    ctx.globalAlpha=1;
  }
  //浮动的嵌块
  var valid=inBounds()&&!overlaps();
  var ghost=exactFit()?PAL.deep:valid?PAL.primary:PAL.danger;
  ctx.globalAlpha=0.6;
  for(i=0;i<piece.length;i++){
    ctx.fillStyle=ghost;
    ctx.fillRect((px+piece[i][0])*cell+2,(py+piece[i][1])*cell+2,cell-4,cell-4);
  }
  ctx.globalAlpha=1;
}
function loop(){render();requestAnimationFrame(loop)}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  if(done)return;
  var cx3=Math.floor(x/cell),cy3=Math.floor(y/cell);
  // 以嵌块锚点居中到点击处
  var ax=0,ay=0;
  for(var i=0;i<piece.length;i++){ax=Math.max(ax,piece[i][0]);ay=Math.max(ay,piece[i][1]);}
  px=Math.max(0,Math.min(L.cols-1,cx3-(ax/2|0)));
  py=Math.max(0,Math.min(L.rows-1,cy3-(ay/2|0)));
  render();
});
cv.addEventListener("pointercancel",function(){});
$("btnRot").addEventListener("click",rotate);
$("btnFlip").addEventListener("click",flip);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("btnPlace").addEventListener("click",tryPlace);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
function hideOverlay(){$("overlay").classList.remove("show")}
function openLevelSelect(){
  var ggrid=$("lvgrid");ggrid.hidden=false;
  ggrid.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      ggrid.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"){px=Math.max(0,px-1);e.preventDefault();}
  else if(k==="ArrowRight"){px=Math.min(L.cols-1,px+1);e.preventDefault();}
  else if(k==="ArrowUp"){py=Math.max(0,py-1);e.preventDefault();}
  else if(k==="ArrowDown"){py=Math.min(L.rows-1,py+1);e.preventDefault();}
  else if(k==="r"||k==="R"){if($("overlay").classList.contains("show")){loadLevel(lv);say("本关已重置");}else rotate();e.preventDefault();}
  else if(k==="f"||k==="F"){flip();e.preventDefault();}
  else if(k==="Enter"||k===" "){if($("overlay").classList.contains("show"))$("ovBtn").click();else tryPlace();e.preventDefault();}
  else if(k==="h"||k==="H")hint();
  render();
});
window.addEventListener("resize",resize);
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);resize();loop();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
