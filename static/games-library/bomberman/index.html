(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
function read(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function write(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var $=function(id){return document.getElementById(id)};

/* ========== 引擎块（docs/level-gen/tools/bomberman 生成器与校验器共用同一份口径） ========== */
/*BM-ENGINE-BEGIN*/
var BC={
  COLS:13,ROWS:13,
  PLAYER_SPAWN:[1,11],
  ENEMY_SPAWNS:[[1,1],[7,1],[11,1]],
  TYPE_KEYS:{normal:1,fast:1,chaser:1,heavy:1}
};
function bcMulberry32(a){a|=0;a=(a+0x6d2b79f5)|0;var t=0;return function(){a=(a+0x6d2b79f5)|0;t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function bcCharOk(c){return c==="."||c==="B"||c==="S";}
function bcParseMap(str){
  if(typeof str!=="string"||str.length!==BC.COLS*BC.ROWS)return null;
  var grid=[],i;
  for(i=0;i<BC.COLS*BC.ROWS;i++){
    if(!bcCharOk(str[i]))return null;
    grid.push(str[i]);
  }
  return grid;
}
/* 可通行判定：钢墙不可穿过；砖墙可被炸药摧毁，视为可通行（玩家可打通到达）。 */
function bcPassable(ch){return ch!=="S";}
/* BFS：从出生点可达的所有格子（钢墙阻挡，砖墙可炸通）。 */
function bcReach(grid,sx,sy){
  var W=BC.COLS,H=BC.ROWS,seen=new Array(W*H).fill(false),q=[[sx,sy]],out=[],i;
  seen[sy*W+sx]=true;
  while(q.length){
    var p=q.pop(),x=p[0],y=p[1];
    out.push(p);
    var nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    for(i=0;i<4;i++){
      var nx=nb[i][0],ny=nb[i][1];
      if(nx<0||ny<0||nx>=W||ny>=H)continue;
      var k=ny*W+nx;
      if(seen[k]||!bcPassable(grid[k]))continue;
      seen[k]=true;q.push([nx,ny]);
    }
  }
  return out;
}
function bcOpenNeighbors(grid,x,y){
  var n=0,i;
  var nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
  for(i=0;i<4;i++){
    var nx=nb[i][0],ny=nb[i][1];
    if(nx<0||ny<0||nx>=BC.COLS||ny>=BC.ROWS)continue;
    if(bcPassable(grid[ny*BC.COLS+nx]))n++;
  }
  return n;
}
/* 关卡数据硬校验：结构 / 尺寸 / 字符集 / 出生点安全 / 连通性 / 敌人配置（任一项不过即整批放弃） */
function bcValidateLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.length||d.name.length>32)return false;
  var grid=bcParseMap(d.map);
  if(!grid)return false;
  var ps=BC.PLAYER_SPAWN,i,bricks=0;
  if(!bcPassable(grid[ps[1]*BC.COLS+ps[0]]))return false;
  if(bcOpenNeighbors(grid,ps[0],ps[1])<2)return false;
  for(i=0;i<BC.ENEMY_SPAWNS.length;i++){
    var e=BC.ENEMY_SPAWNS[i];
    if(!bcPassable(grid[e[1]*BC.COLS+e[0]]))return false;
    if(bcOpenNeighbors(grid,e[0],e[1])<1)return false;
  }
  var reach=bcReach(grid,ps[0],ps[1]),mark={},j;
  for(j=0;j<reach.length;j++)mark[reach[j][1]*BC.COLS+reach[j][0]]=true;
  for(i=0;i<BC.ENEMY_SPAWNS.length;i++){
    var es=BC.ENEMY_SPAWNS[i];
    if(!mark[es[1]*BC.COLS+es[0]])return false;
  }
  if(reach.length<30)return false;
  for(i=0;i<grid.length;i++)if(grid[i]==="B")bricks++;
  if(bricks<6)return false;
  var en=d.enemies;
  if(!en||typeof en!=="object"||Array.isArray(en))return false;
  var total=0,k;
  for(k in en){
    if(!BC.TYPE_KEYS[k])return false;
    var n=en[k];
    if(!isFinite(n)||Math.floor(n)!==n||n<0||n>99)return false;
    total+=n;
  }
  if(total<1||total>24)return false;
  if(!isFinite(d.seed)||Math.floor(d.seed)!==d.seed||d.seed<0||d.seed>2147483647)return false;
  return true;
}
function bcComboKey(d){
  var en=d.enemies,keys=Object.keys(en).sort();
  return d.map+"|"+keys.map(function(k){return k+":"+en[k];}).join(",")+"|"+d.seed;
}
/*BM-ENGINE-END*/

/* 线上解析：与生成器/校验器共用 bcValidateLevelData，任一条非法返回 null（整批放弃） */
function parseBombermanLevels(res){

    try{d=JSON.parse(raw);}catch(e){return null;}
    if(!bcValidateLevelData(d))return null;
    var no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=true;
    if(seen[bcComboKey(d)])return null;
    seen[bcComboKey(d)]=1;
    var foes={},k;
    for(k in d.enemies)foes[k]=d.enemies[k];
    list.push({no:no,name:d.name,map:d.map,enemies:foes,seed:d.seed});
  }
  list.sort(function(a,b){return a.no-b.no;});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels("bomberman").then(function(res){
    var list=parseBombermanLevels(res);
    if(!list||!list.length)return;
    if(applyLevels(list,(res&&res.version)||0)){
      if(saveData.lv>LEVELS.length-1)saveData.lv=LEVELS.length-1;
      if(state==='ready')refreshStart();
      else if(cur>LEVELS.length-1)startLevel(LEVELS.length-1);
    }
  }).catch(function(){});
}

/* ========== 存档（本地 + 账号双写，取优合并） ========== */
var KEY="sw.bomberman.v1";
function loadSave(){
  try{
    var s=JSON.parse(read(KEY,null));
    if(s&&typeof s==="object"){
      var stars={};
      if(s.stars&&typeof s.stars==="object"&&!Array.isArray(s.stars)){
        for(var k in s.stars){
          var v=parseInt(s.stars[k],10);
          if(v>=1&&v<=3)stars[k]=v;
        }
      }
      return{lv:parseInt(s.lv,10)||0,best:parseInt(s.best,10)||0,stars:stars};
    }
  }catch(e){}
  return{lv:0,best:0,stars:{}};
}
var saveData=loadSave();
function save(){
  write(KEY,JSON.stringify(saveData));
  if(GB.available)GB.saveState('bomberman',saveData).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState('bomberman').then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson);
      if(!r||typeof r!=="object")return;
      var ch=false;
      var rlv=parseInt(r.lv,10)||0;
      if(rlv>saveData.lv){saveData.lv=Math.min(rlv,LEVELS.length-1);ch=true;}
      var rb=parseInt(r.best,10)||0;
      if(rb>(saveData.best||0)){saveData.best=rb;ch=true;}
      if(r.stars&&typeof r.stars==="object"&&!Array.isArray(r.stars)){
        for(var k in r.stars){
          var rv=parseInt(r.stars[k],10);
          if(rv>=1&&rv<=3&&(parseInt(saveData.stars[k],10)||0)<rv){saveData.stars[k]=rv;ch=true;}
        }
      }
      if(ch){save();if(state==='ready')refreshStart();}
    }catch(e){}
  }).catch(function(){});
}

/* ========== 常量与状态 ========== */
var TT={EMPTY:0,BRICK:1,STEEL:2};
var CH2T={'.':0,'B':1,'S':2};
var DX=[0,1,0,-1],DY=[-1,0,1,0];
var HS=0.34;
var BASE_SPEED=3.0,BASE_FIRE=2,BASE_BOMBS=1;
var BOMB_FUSE=1.9,FLAME_T=0.5;
var TYPES={
  normal:{speed:1.4,hp:1,score:100},
  fast:{speed:2.3,hp:1,score:150},
  chaser:{speed:1.75,hp:1,score:200},
  heavy:{speed:0.95,hp:3,score:300}
};
var GIFT_KINDS=['fire','bomb','speed'];
var MAX_ACTIVE=4,SPAWN_INTERVAL=1.5;
var W=0,H=0,CS=24,OX=0,OY=0;
var stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
var ovStart=$('ovStart'),ovWin=$('ovWin'),ovOver=$('ovOver'),ovPause=$('ovPause');
var stLv=$('stLv'),stLife=$('stLife'),stFoe=$('stFoe'),stScore=$('stScore'),statusEl=$('status');

var state='ready',cur=0,lives=3,score=0,deaths=0,pending=0;
var cellT=new Uint8Array(169);
var player=null,respawnT=0,enemies=[],bombs=[],flames=[],powerups=[],parts=[],floats=[];
var spawnQueue=[],spawned=0,totalFoes=0,spawnT=0,giftCount=0,winT=0,fireCool=0,fid=0;
var rng=bcMulberry32(1),statusTimer=0,chipCache={},eid=0;

function makePlayer(){
  return{x:BC.PLAYER_SPAWN[0]+0.5,y:BC.PLAYER_SPAWN[1]+0.5,dir:0,speed:BASE_SPEED,
    fire:BASE_FIRE,maxBombs:BASE_BOMBS,shieldT:2,cool:0.3};
}
function buildQueue(L){
  var arr=[],k;
  for(k in L.enemies)for(var i=0;i<L.enemies[k];i++)arr.push(k);
  var r=bcMulberry32((L.seed^((cur+1)*2654435761))>>>0);
  for(var i=arr.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr;
}
function unlocked(i){return i===0||(parseInt(saveData.stars[i-1],10)||0)>0;}

/* ========== 关卡流程 ========== */
function refreshStart(){
  var n=Math.min(saveData.lv,LEVELS.length-1);
  pending=n;
  stLv.textContent=(n+1)+'/'+LEVELS.length;
  $('startInfo').textContent='第 '+(n+1)+' 关'+(LEVELS[n]&&LEVELS[n].name?' · '+LEVELS[n].name:'');
  var foes=0,k;
  if(LEVELS[n])for(k in LEVELS[n].enemies)foes+=LEVELS[n].enemies[k];
  $('startDesc').textContent='敌方 '+foes+' 个 · 历史最高 '+saveData.best+' 分';
  renderChips();
}
function renderChips(){
  var box=$('lvRow');box.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement('button');
      b.className='lv-chip'+(i===pending?' on':'');
      b.textContent=String(i+1);
      b.disabled=!unlocked(i);
      b.setAttribute('aria-label','第 '+(i+1)+' 关');
      b.addEventListener('click',function(){if(unlocked(i)){pending=i;refreshStart();startLevel(i);}});
      box.appendChild(b);
    })(i);
  }
}
function startLevel(n){
  if(!LEVELS.length)return;
  n=Math.max(0,Math.min(n,LEVELS.length-1));
  var L=LEVELS[n],i;
  cur=n;lives=3;deaths=0;score=0;
  for(i=0;i<169;i++)cellT[i]=CH2T[L.map[i]]||0;
  heldDirs={};fireHeld=false;fireCool=0;
  player=makePlayer();respawnT=0;
  enemies=[];bombs=[];flames=[];powerups=[];parts=[];floats=[];
  spawnQueue=buildQueue(L);totalFoes=spawnQueue.length;spawned=0;spawnT=1.0;giftCount=0;winT=0;
  rng=bcMulberry32((L.seed^0x9e3779b9)>>>0);
  state='playing';
  ovStart.classList.add('hide');ovWin.classList.add('hide');ovOver.classList.add('hide');ovPause.classList.add('hide');
  setStatus('第 '+(n+1)+' 关 · 消灭全部敌人');
  updateChips();
}
function finishWin(){
  var bonus=lives*200;
  score+=bonus;
  if(score>(saveData.best||0))saveData.best=score;
  var stars=Math.max(1,lives);
  var prev=parseInt(saveData.stars[cur],10)||0;
  if(stars>prev)saveData.stars[cur]=stars;
  if(cur+1>saveData.lv)saveData.lv=Math.min(cur+1,LEVELS.length-1);
  save();
  if(GB.available)GB.reportScore('bomberman',{metricValue:cur+1,metricExtra:score}).catch(function(){});
  $('winInfo').textContent='得分 '+score+'（含生命奖励 '+bonus+'）';
  $('winDesc').textContent='第 '+(cur+1)+' 关完成 · '+stars+' 星 · 历史最高 '+saveData.best+' 分';
  $('btnNext').textContent=cur>=LEVELS.length-1?'再玩一遍':'下一关';
  state='win';ovWin.classList.remove('hide');
  updateChips();renderChips();
}
function gameOver(reason){
  if(score>(saveData.best||0))saveData.best=score;
  save();
  $('overInfo').textContent='得分 '+score;
  $('overDesc').textContent=reason+' · 坚持到第 '+(cur+1)+' 关 · 历史最高 '+saveData.best+' 分';
  $('btnRetry').textContent='再次挑战第 '+(cur+1)+' 关';
  state='over';ovOver.classList.remove('hide');
  updateChips();
}
function setStatus(msg){
  statusEl.textContent=msg;
  if(statusTimer)clearTimeout(statusTimer);
  statusTimer=setTimeout(function(){statusEl.textContent='';},2600);
}
function updateChips(){
  var vals={lv:(cur+1)+'/'+LEVELS.length,life:String(lives),foe:String(spawnQueue.length+enemies.length),score:String(score)};
  var k;
  for(k in vals)if(chipCache[k]!==vals[k]){chipCache[k]=vals[k];
    if(k==='lv')stLv.textContent=vals[k];else if(k==='life')stLife.textContent=vals[k];
    else if(k==='foe')stFoe.textContent=vals[k];else stScore.textContent=vals[k];}
}

/* ========== 碰撞 ========== */
function solidCell(idx,self){
  var t=cellT[idx];
  if(t===TT.STEEL||t===TT.BRICK)return true;
  var cx=idx%BC.COLS,cy=Math.floor(idx/BC.COLS),i;
  for(i=0;i<bombs.length;i++){
    var b=bombs[i];
    if(b.x===cx&&b.y===cy){
      if(self&&Math.floor(self.x)===cx&&Math.floor(self.y)===cy)continue;
      return true;
    }
  }
  return false;
}
function blockedAt(self,x,y){
  if(x<HS||y<HS||x>BC.COLS-HS||y>BC.ROWS-HS)return true;
  var x0=Math.floor(x-HS),x1=Math.floor(x+HS),y0=Math.floor(y-HS),y1=Math.floor(y+HS);
  var cx,cy,idx;
  for(cy=y0;cy<=y1;cy++)for(cx=x0;cx<=x1;cx++){
    idx=cy*BC.COLS+cx;
    if(idx>=0&&idx<169&&solidCell(idx,self))return true;
  }
  var others=player?[player]:[];
  for(cx=0;cx<others.length;cx++)if(others[cx]!==self&&Math.abs(others[cx].x-x)<0.72&&Math.abs(others[cx].y-y)<0.72)return true;
  for(cy=0;cy<enemies.length;cy++){var e=enemies[cy];if(e!==self&&Math.abs(e.x-x)<0.72&&Math.abs(e.y-y)<0.72)return true;}
  return false;
}
function freeDirs(self){
  var opts=[],d;
  for(d=0;d<4;d++)if(!blockedAt(self,self.x+DX[d]*0.55,self.y+DY[d]*0.55))opts.push(d);
  return opts;
}

/* ========== 炸弹与火焰 ========== */
function placeBomb(){
  if(!player)return;
  var bx=Math.floor(player.x),by=Math.floor(player.y),i;
  if(bx<0||by<0||bx>=BC.COLS||by>=BC.ROWS)return;
  for(i=0;i<bombs.length;i++)if(bombs[i].x===bx&&bombs[i].y===by)return;
  if(bombs.length>=player.maxBombs)return;
  bombs.push({x:bx,y:by,fuse:BOMB_FUSE,range:player.fire,t:0});
}
function explodeBomb(b){
  var i,d,step,nx,ny,idx,t;
  for(i=0;i<bombs.length;i++)if(bombs[i]===b){bombs.splice(i,1);break;}
  spawnFlame(b.x,b.y);
  for(d=0;d<4;d++){
    for(step=1;step<=b.range;step++){
      nx=b.x+DX[d]*step;ny=b.y+DY[d]*step;
      if(nx<0||ny<0||nx>=BC.COLS||ny>=BC.ROWS)break;
      idx=ny*BC.COLS+nx;t=cellT[idx];
      if(t===TT.STEEL)break;
      if(t===TT.BRICK){cellT[idx]=TT.EMPTY;spawnFlame(nx,ny);break;}
      spawnFlame(nx,ny);
    }
  }
  // 链式引爆：火焰吞没其它炸弹时使其提前爆炸
  for(i=bombs.length-1;i>=0;i--){
    var ob=bombs[i],fi;
    for(fi=0;fi<flames.length;fi++){
      if(flames[fi].x===ob.x&&flames[fi].y===ob.y){ob.fuse=Math.min(ob.fuse,0.07);break;}
    }
  }
}
function spawnFlame(x,y){
  var f={x:x,y:y,t:FLAME_T,id:++fid,hit:{}};
  flames.push(f);
  flameDamage(f);
}
function flameDamage(f){
  var i;
  if(player&&player.shieldT<=0&&Math.floor(player.x)===f.x&&Math.floor(player.y)===f.y&&!f.hit.p){
    f.hit.p=1;hitPlayer();
  }
  for(i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(e.spawnT>0)continue;
    if(Math.floor(e.x)===f.x&&Math.floor(e.y)===f.y&&!f.hit[e.id]){
      f.hit[e.id]=1;
      e.hp--;
      if(e.hp<=0)killEnemy(e,false);
    }
  }
}

/* ========== 敌人 ========== */
function pickSpawnPoint(){
  var i,p;
  for(i=0;i<3;i++){
    p=BC.ENEMY_SPAWNS[(spawned+i)%3];
    var ok=true,j;
    for(j=0;j<enemies.length;j++)if(Math.abs(enemies[j].x-(p[0]+0.5))<0.8&&Math.abs(enemies[j].y-(p[1]+0.5))<0.8){ok=false;break;}
    if(player&&Math.abs(player.x-(p[0]+0.5))<0.8&&Math.abs(player.y-(p[1]+0.5))<0.8)ok=false;
    if(ok){spawned=(spawned+i)%3;return p;}
  }
  return null;
}
function spawnEnemy(){
  var p=pickSpawnPoint();
  if(!p)return;
  var type=spawnQueue.shift();
  var isGift=(spawned%4===3)||type==='heavy';
  var kind=GIFT_KINDS[giftCount%3];giftCount++;
  enemies.push({x:p[0]+0.5,y:p[1]+0.5,dir:2,type:type,hp:TYPES[type].hp,speed:TYPES[type].speed,
    aiT:0.3+rng()*0.5,spawnT:0.9,gift:isGift,giftKind:isGift?kind:null,id:++eid});
  spawned++;
}
function aiThink(e){
  var opts=freeDirs(e);
  if(!opts.length)return;
  var r=rng(),dir=e.dir,i;
  if(e.type==='chaser'&&player&&r<0.7){
    var dx=player.x-e.x,dy=player.y-e.y,tryDirs=[];
    if(Math.abs(dx)>Math.abs(dy)){
      if(dx>0)tryDirs.push(1);else if(dx<0)tryDirs.push(3);
      if(dy>0)tryDirs.push(2);else if(dy<0)tryDirs.push(0);
    }else{
      if(dy>0)tryDirs.push(2);else if(dy<0)tryDirs.push(0);
      if(dx>0)tryDirs.push(1);else if(dx<0)tryDirs.push(3);
    }
    for(i=0;i<tryDirs.length;i++)if(opts.indexOf(tryDirs[i])>=0){dir=tryDirs[i];break;}
    if(dir===e.dir&&r<0.35)dir=opts[Math.floor(rng()*opts.length)];
  }else if(e.type==='fast'){
    if(!(r<0.35&&opts.indexOf(e.dir)>=0))dir=opts[Math.floor(rng()*opts.length)];
  }else if(e.type==='heavy'){
    if(!(r<0.7&&opts.indexOf(e.dir)>=0))dir=opts[Math.floor(rng()*opts.length)];
  }else{
    if(!(r<0.55&&opts.indexOf(e.dir)>=0))dir=opts[Math.floor(rng()*opts.length)];
  }
  e.dir=dir;
}
function killEnemy(e,silent){
  var i;
  for(i=0;i<enemies.length;i++)if(enemies[i]===e){enemies.splice(i,1);break;}
  explodeFx(e.x,e.y,e.type==='heavy');
  if(!silent){
    score+=TYPES[e.type].score;
    addFloat(e.x,e.y,'+'+TYPES[e.type].score,true);
    if(e.gift)dropPowerup(e.x,e.y,e.giftKind);
  }
  updateChips();
}
function dropPowerup(x,y,kind){
  powerups.push({x:Math.max(0,Math.min(BC.COLS-1,Math.floor(x)))+0.5,
    y:Math.max(0,Math.min(BC.ROWS-1,Math.floor(y)))+0.5,kind:kind,t:14});
}
function hitPlayer(){
  if(!player||player.shieldT>0)return;
  explodeFx(player.x,player.y,false);
  lives--;
  updateChips();
  if(lives<=0){player=null;gameOver('生命耗尽');return;}
  player=null;respawnT=1.0;
}
function explodeFx(x,y,big){
  var n=big?18:9,i;
  for(i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,v=(big?120:70)+Math.random()*(big?160:80);
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.4+Math.random()*0.4,r:1.5+Math.random()*(big?3:2)});
  }
}
function addFloat(x,y,txt,warn){
  floats.push({x:x,y:y,txt:txt,life:1.1,warn:warn});
}

/* ========== 更新 ========== */
function updatePlayer(dt){
  if(!player)return;
  player.cool-=dt;
  if(player.shieldT>0)player.shieldT-=dt;
  var want=inputDir();
  if(want>=0){
    var horiz=(want===1||want===3),align=6*dt;
    if(horiz){var ty=Math.floor(player.y)+0.5;var dy=ty-player.y;if(dy>align)dy=align;else if(dy<-align)dy=-align;player.y+=dy;}
    else{var tx=Math.floor(player.x)+0.5;var dx=tx-player.x;if(dx>align)dx=align;else if(dx<-align)dx=-align;player.x+=dx;}
    player.dir=want;
    var sp=player.speed*dt;
    var nx=player.x+DX[want]*sp,ny=player.y+DY[want]*sp;
    if(!blockedAt(player,nx,player.y))player.x=nx;
    if(!blockedAt(player,player.x,ny))player.y=ny;
  }
  if(fireHeld&&player.cool<=0){
    placeBomb();
    player.cool=0.35;
  }
}
function updateEnemies(dt){
  var i,e;
  for(i=enemies.length-1;i>=0;i--){
    e=enemies[i];
    if(e.spawnT>0){e.spawnT-=dt;continue;}
    e.aiT-=dt;
    if(e.aiT<=0){e.aiT=0.3+0.6*rng();aiThink(e);}
    var ox=e.x,oy=e.y;
    var sp=e.speed*dt;
    var nx=e.x+DX[e.dir]*sp,ny=e.y+DY[e.dir]*sp;
    if(!blockedAt(e,nx,e.y))e.x=nx;
    if(!blockedAt(e,e.x,ny))e.y=ny;
    if(Math.abs(e.x-ox)<sp*0.3&&Math.abs(e.y-oy)<sp*0.3)e.aiT=Math.min(e.aiT,0.05);
    // 接触玩家
    if(player&&player.shieldT<=0&&Math.abs(player.x-e.x)<0.6&&Math.abs(player.y-e.y)<0.6){
      hitPlayer();
      return;
    }
  }
}
function updateBombs(dt){
  var i;
  for(i=bombs.length-1;i>=0;i--){
    var b=bombs[i];
    b.fuse-=dt;b.t+=dt;
    if(b.fuse<=0)explodeBomb(b);
  }
}
function updateFlames(dt){
  var i;
  for(i=flames.length-1;i>=0;i--){
    var f=flames[i];
    f.t-=dt;
    flameDamage(f);
    if(f.t<=0)flames.splice(i,1);
  }
}
function updatePowerups(dt){
  var i;
  for(i=powerups.length-1;i>=0;i--){
    var p=powerups[i];
    p.t-=dt;
    if(p.t<=0){powerups.splice(i,1);continue;}
    if(player&&Math.abs(player.x-p.x)<0.55&&Math.abs(player.y-p.y)<0.55){
      if(p.kind==='fire'){player.fire=Math.min(6,player.fire+1);setStatus('火力提升！');}
      else if(p.kind==='bomb'){player.maxBombs=Math.min(6,player.maxBombs+1);setStatus('弹数提升！');}
      else{player.speed=Math.min(5.2,player.speed+0.5);setStatus('移速提升！');}
      addFloat(p.x,p.y,'+50',true);
      score+=50;
      powerups.splice(i,1);
      updateChips();
    }
  }
}
function updateFx(dt){
  var i;
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)parts.splice(i,1);}
  for(i=floats.length-1;i>=0;i--){var f=floats[i];f.life-=dt;f.y+=dt*0.9;if(f.life<=0)floats.splice(i,1);}
  if(parts.length>160)parts.splice(0,parts.length-160);
}
function update(dt){
  if(state!=='playing')return;
  var i;
  if(player)updatePlayer(dt);
  else if(lives>0){respawnT-=dt;
    if(respawnT<=0){
      var ps=BC.PLAYER_SPAWN,ok=true,j;
      for(j=0;j<enemies.length;j++)if(Math.abs(enemies[j].x-(ps[0]+0.5))<0.8&&Math.abs(enemies[j].y-(ps[1]+0.5))<0.8){ok=false;break;}
      if(ok){player=makePlayer();player.shieldT=2;}else respawnT=0.4;
    }
  }
  updateEnemies(dt);
  updateBombs(dt);
  updateFlames(dt);
  updatePowerups(dt);
  updateFx(dt);
  if(spawnQueue.length&&enemies.length<MAX_ACTIVE){
    spawnT-=dt;
    if(spawnT<=0){spawnEnemy();spawnT=SPAWN_INTERVAL;}
  }
  if(!spawnQueue.length&&!enemies.length){
    winT+=dt;
    if(winT>0.6)finishWin();
  }else winT=0;
  updateChips();
}

/* ========== 绘制 ========== */
function resize(){
  W=stage.clientWidth;H=stage.clientHeight;
  if(W<10||H<10)return;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  CS=Math.min(W/BC.COLS,H/BC.ROWS);
  OX=(W-CS*BC.COLS)/2;OY=(H-CS*BC.ROWS)/2;
}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawBrick(x,y){
  var s=CS;
  ctx.fillStyle=PAL.brick;
  ctx.fillRect(x,y,s+0.5,s+0.5);
  ctx.fillStyle=PAL.brickDark;
  ctx.fillRect(x,y,s,Math.max(1,s*0.06));
  ctx.fillRect(x,y+s*0.47,s,Math.max(1,s*0.06));
  ctx.fillRect(x+s*0.32,y,Math.max(1,s*0.05),s*0.47);
  ctx.fillRect(x+s*0.66,y+s*0.53,Math.max(1,s*0.05),s*0.47);
}
function drawSteel(x,y){
  var s=CS;
  ctx.fillStyle=PAL.steel;ctx.fillRect(x,y,s+0.5,s+0.5);
  ctx.fillStyle='rgba(255,255,255,.30)';//恒白高光 例外
  ctx.fillRect(x+s*0.08,y+s*0.08,s*0.84,s*0.28);
  ctx.fillStyle=PAL.gridLine;
  var r=Math.max(1.5,s*0.07),o=s*0.18;
  ctx.beginPath();ctx.arc(x+o,y+o,r,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+s-o,y+o,r,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+o,y+s-o,r,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+s-o,y+s-o,r,0,Math.PI*2);ctx.fill();
}
function drawPowerup(p,now){
  var cxp=OX+p.x*CS,cyp=OY+p.y*CS,s=CS*0.62;
  ctx.save();ctx.translate(cxp,cyp);
  if(p.t<2&&!window.__gRM)ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(now/90));
  ctx.fillStyle=PAL.surface;
  rr(-s/2,-s/2,s,s,s*0.22);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=Math.max(1,CS*0.04);ctx.stroke();
  if(p.kind==='fire'){
    ctx.fillStyle=PAL.danger;
    ctx.beginPath();
    ctx.moveTo(0,-s*0.26);
    ctx.quadraticCurveTo(s*0.22,-s*0.02,s*0.1,s*0.16);
    ctx.quadraticCurveTo(s*0.02,s*0.26,-s*0.12,s*0.14);
    ctx.quadraticCurveTo(-s*0.26,s*0.02,0,-s*0.26);
    ctx.fill();
    ctx.fillStyle=PAL.warning;
    ctx.beginPath();ctx.arc(0,s*0.1,s*0.08,0,Math.PI*2);ctx.fill();
  }else if(p.kind==='bomb'){
    ctx.fillStyle=PAL.text;
    ctx.beginPath();ctx.arc(0,s*0.04,s*0.22,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=PAL.warning;ctx.lineWidth=Math.max(1.2,s*0.08);
    ctx.beginPath();ctx.moveTo(s*0.08,-s*0.14);ctx.quadraticCurveTo(s*0.24,-s*0.28,s*0.28,-s*0.32);ctx.stroke();
  }else{
    ctx.strokeStyle=PAL.water;ctx.lineWidth=Math.max(1.5,s*0.1);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-s*0.2,-s*0.14);ctx.lineTo(-s*0.02,0);ctx.lineTo(-s*0.2,s*0.14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s*0.02,-s*0.14);ctx.lineTo(s*0.2,0);ctx.lineTo(s*0.02,s*0.14);ctx.stroke();
  }
  ctx.restore();
}
function drawBomb(b,now){
  var cxp=OX+(b.x+0.5)*CS,cyp=OY+(b.y+0.5)*CS;
  var pulse=window.__gRM?0:(b.fuse<0.6?Math.abs(Math.sin(now/45))*0.12:0);
  var r=CS*(0.3+pulse);
  ctx.fillStyle='rgba(0,0,0,.25)';//恒暗阴影 例外
  ctx.beginPath();ctx.ellipse(cxp,cyp+CS*0.22,CS*0.28,CS*0.1,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.bomb;
  ctx.beginPath();ctx.arc(cxp,cyp,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';//恒白高光 例外
  ctx.beginPath();ctx.arc(cxp-r*0.32,cyp-r*0.34,r*0.24,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=PAL.fuse;ctx.lineWidth=Math.max(1.2,CS*0.06);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cxp+r*0.3,cyp-r*0.3);ctx.quadraticCurveTo(cxp+r*0.55,cyp-r*0.6,cxp+r*0.42,cyp-r*0.72);ctx.stroke();
  ctx.fillStyle=PAL.warning;
  ctx.beginPath();ctx.arc(cxp+r*0.42,cyp-r*0.72,Math.max(1.2,CS*0.07+pulse*CS*0.4),0,Math.PI*2);ctx.fill();
}
function drawFlame(f,now){
  var cxp=OX+(f.x+0.5)*CS,cyp=OY+(f.y+0.5)*CS;
  var a=Math.max(0,Math.min(1,f.t/FLAME_T));
  var flick=window.__gRM?0:Math.sin(now/40+f.id)*0.08;
  var r=CS*(0.46+flick)*a+CS*0.1;
  ctx.globalAlpha=Math.max(0,a);
  ctx.fillStyle=PAL.flame;
  ctx.beginPath();ctx.arc(cxp,cyp,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.flameMid;
  ctx.beginPath();ctx.arc(cxp,cyp,r*0.66,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';//恒白高光 例外
  ctx.beginPath();ctx.arc(cxp,cyp,r*0.32,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}
function drawEnemy(e,now){
  var cxp=OX+e.x*CS,cyp=OY+e.y*CS;
  var body=e.type==='normal'?PAL.foeNormal:e.type==='fast'?PAL.foeFast:
    e.type==='chaser'?PAL.foeChaser:PAL.foeHeavy;
  var rad=CS*(e.type==='heavy'?0.4:0.32);
  ctx.save();ctx.translate(cxp,cyp);
  if(e.spawnT>0)ctx.globalAlpha=window.__gRM?1:0.35+0.4*Math.abs(Math.sin(now/70));
  ctx.fillStyle='rgba(0,0,0,.3)';//恒暗阴影 例外
  ctx.beginPath();ctx.ellipse(0,rad*0.9,rad*0.9,rad*0.32,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=body;
  ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.fill();
  // 眼睛朝向
  var ex=DX[e.dir]*rad*0.32,ey=DY[e.dir]*rad*0.32;
  ctx.fillStyle='#fff';//恒白高光 例外
  ctx.beginPath();ctx.arc(-rad*0.32+ex,-rad*0.12+ey,rad*0.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(rad*0.32+ex,-rad*0.12+ey,rad*0.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.text;
  ctx.beginPath();ctx.arc(-rad*0.32+ex*1.5,-rad*0.12+ey*1.5,rad*0.09,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(rad*0.32+ex*1.5,-rad*0.12+ey*1.5,rad*0.09,0,Math.PI*2);ctx.fill();
  if(e.type==='heavy'){
    ctx.strokeStyle=PAL.warning;ctx.lineWidth=Math.max(1.2,CS*0.05);
    for(var k=0;k<6;k++){
      var a=k*Math.PI/3+now/(window.__gRM?100000:400);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad);
      ctx.lineTo(Math.cos(a)*(rad+CS*0.08),Math.sin(a)*(rad+CS*0.08));
      ctx.stroke();
    }
  }
  ctx.restore();
  if(e.gift&&e.spawnT<=0){
    ctx.save();
    ctx.globalAlpha=window.__gRM?1:0.5+0.5*Math.abs(Math.sin(now/130));
    ctx.fillStyle=PAL.warning;
    ctx.translate(cxp,cyp-CS*0.7);
    ctx.rotate(Math.PI/4);
    ctx.fillRect(-CS*0.09,-CS*0.09,CS*0.18,CS*0.18);
    ctx.restore();
  }
}
function drawPlayer(p,now){
  var cxp=OX+p.x*CS,cyp=OY+p.y*CS,rad=CS*0.34;
  ctx.save();ctx.translate(cxp,cyp);
  ctx.fillStyle='rgba(0,0,0,.3)';//恒暗阴影 例外
  ctx.beginPath();ctx.ellipse(0,rad*0.9,rad*0.9,rad*0.32,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.player;
  ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.playerDeep;
  ctx.beginPath();ctx.arc(0,rad*0.34,rad*0.62,0,Math.PI);ctx.fill();
  var ex=DX[p.dir]*rad*0.3,ey=DY[p.dir]*rad*0.3;
  ctx.fillStyle='#fff';//恒白高光 例外
  ctx.beginPath();ctx.arc(-rad*0.3+ex,-rad*0.14+ey,rad*0.18,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(rad*0.3+ex,-rad*0.14+ey,rad*0.18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.text;
  ctx.beginPath();ctx.arc(-rad*0.3+ex*1.5,-rad*0.14+ey*1.5,rad*0.08,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(rad*0.3+ex*1.5,-rad*0.14+ey*1.5,rad*0.08,0,Math.PI*2);ctx.fill();
  ctx.restore();
  if(p.shieldT>0){
    ctx.save();
    ctx.globalAlpha=window.__gRM?1:0.5+0.3*Math.sin(now/120);
    ctx.strokeStyle=PAL.success;ctx.lineWidth=Math.max(1.5,CS*0.07);
    ctx.beginPath();ctx.arc(cxp,cyp,CS*0.46,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
}
function draw(now){
  if(W<10)return;
  var i,x,y;
  ctx.fillStyle=PAL.field;
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=PAL.gridLine;ctx.lineWidth=1;
  ctx.beginPath();
  for(i=0;i<=BC.COLS;i++){ctx.moveTo(OX+i*CS,OY);ctx.lineTo(OX+i*CS,OY+BC.ROWS*CS);}
  for(i=0;i<=BC.ROWS;i++){ctx.moveTo(OX,OY+i*CS);ctx.lineTo(OX+BC.COLS*CS,OY+i*CS);}
  ctx.stroke();
  for(i=0;i<169;i++){
    var t=cellT[i];
    if(!t)continue;
    x=OX+(i%BC.COLS)*CS;y=OY+Math.floor(i/BC.COLS)*CS;
    if(t===TT.BRICK)drawBrick(x,y);
    else drawSteel(x,y);
  }
  for(i=0;i<powerups.length;i++)drawPowerup(powerups[i],now);
  for(i=0;i<flames.length;i++)drawFlame(flames[i],now);
  for(i=0;i<bombs.length;i++)drawBomb(bombs[i],now);
  for(i=0;i<enemies.length;i++)drawEnemy(enemies[i],now);
  if(player)drawPlayer(player,now);
  for(i=0;i<parts.length;i++){
    var p=parts[i];
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2));
    ctx.fillStyle=PAL.warning;
    ctx.beginPath();ctx.arc(OX+p.x*CS,OY+p.y*CS,p.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  if(floats.length){
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='700 14px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    for(i=0;i<floats.length;i++){
      var f=floats[i];
      ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.4));
      ctx.fillStyle=f.warn?PAL.warning:PAL.text;
      ctx.fillText(f.txt,OX+f.x*CS,OY+f.y*CS);
    }
    ctx.globalAlpha=1;
  }
}

/* ========== 输入（虚拟方向键 + 放弹，按住连续） ========== */
var heldDirs={},fireHeld=false;
function inputDir(){
  return heldDirs.hasOwnProperty(0)?0:heldDirs.hasOwnProperty(1)?1:heldDirs.hasOwnProperty(2)?2:heldDirs.hasOwnProperty(3)?3:-1;
}
function bindPad(btn,dir){
  var id=null;
  btn.addEventListener('pointerdown',function(e){
    e.preventDefault();
    id=e.pointerId;
    heldDirs[dir]=true;
    btn.classList.add('held');
    try{btn.setPointerCapture(e.pointerId);}catch(err){}
  });
  function up(e){
    if(id!==null&&e.pointerId!==id)return;
    delete heldDirs[dir];id=null;btn.classList.remove('held');
  }
  btn.addEventListener('pointerup',up);
  btn.addEventListener('pointercancel',up);
  btn.addEventListener('lostpointercapture',up);
}
Array.prototype.forEach.call(document.querySelectorAll('.key'),function(btn){
  bindPad(btn,parseInt(btn.getAttribute('data-dir'),10));
});
(function(){
  var btn=$('btnFire'),id=null;
  btn.addEventListener('pointerdown',function(e){
    e.preventDefault();id=e.pointerId;fireHeld=true;
    try{btn.setPointerCapture(e.pointerId);}catch(err){}
  });
  function up(e){if(id!==null&&e.pointerId!==id)return;fireHeld=false;id=null;}
  btn.addEventListener('pointerup',up);
  btn.addEventListener('pointercancel',up);
  btn.addEventListener('lostpointercapture',up);
})();
var KEYMAP={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
window.addEventListener('keydown',function(e){
  if(KEYMAP.hasOwnProperty(e.code)){e.preventDefault();heldDirs[KEYMAP[e.code]]=true;}
  else if(e.code==='Space'||e.code==='KeyJ'){e.preventDefault();if(!e.repeat)fireHeld=true;}
});
window.addEventListener('keyup',function(e){
  if(KEYMAP.hasOwnProperty(e.code)){e.preventDefault();delete heldDirs[KEYMAP[e.code]];}
  else if(e.code==='Space'||e.code==='KeyJ'){e.preventDefault();fireHeld=false;}
});
window.addEventListener('blur',function(){heldDirs={};fireHeld=false;});
stage.addEventListener('contextmenu',function(e){e.preventDefault();});

/* ========== 覆盖层按钮 ========== */
$('btnStart').addEventListener('click',function(){startLevel(Math.min(pending,LEVELS.length-1));});
$('btnRetry').addEventListener('click',function(){startLevel(cur);});
$('btnReplay').addEventListener('click',function(){startLevel(cur);});
$('btnNext').addEventListener('click',function(){startLevel(cur>=LEVELS.length-1?0:cur+1);});
$('btnHome').addEventListener('click',function(){startLevel(0);});
$('btnResume').addEventListener('click',function(){
  if(state==='paused'){state='playing';ovPause.classList.add('hide');lastT=performance.now();}
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    if(state==='playing'){heldDirs={};fireHeld=false;state='paused';ovPause.classList.remove('hide');}
  }else if(state==='paused'){state='playing';ovPause.classList.add('hide');lastT=performance.now();}
});

/* ========== 主循环 ========== */
var lastT=performance.now();
window.__BM_STATE__={state:'ready'};
function frame(now){
  var dt=(now-lastT)/1000;
  lastT=now;
  if(!(dt>0))dt=0;
  if(dt>0.05)dt=0.05;
  if(W<10)resize();
  update(dt);
  draw(now);
  var st=window.__BM_STATE__;
  st.state=state;st.level=cur+1;st.lives=lives;st.score=score;
  st.foes=enemies.length;st.queue=spawnQueue.length;st.total=totalFoes;
  st.player=player?{x:+player.x.toFixed(2),y:+player.y.toFixed(2),dir:player.dir,shield:+player.shieldT.toFixed(1),fire:player.fire,bombs:player.maxBombs,speed:+player.speed.toFixed(2)}:null;
  st.enemies=enemies.map(function(e){return{x:+e.x.toFixed(2),y:+e.y.toFixed(2),dir:e.dir,type:e.type,spawn:e.spawnT>0};});
  st.bombs=bombs.map(function(b){return{x:b.x,y:b.y,fuse:+b.fuse.toFixed(2),range:b.range};});
  st.flames=flames.map(function(f){return{x:f.x,y:f.y};});
  st.powerups=powerups.map(function(p){return{x:p.x,y:p.y,kind:p.kind};});
  st.grid=Array.from(cellT);
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
resize();
refreshStart();
requestAnimationFrame(frame);
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
