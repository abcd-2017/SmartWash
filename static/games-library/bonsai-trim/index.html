<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var BT={W:11,H:13,LEVEL_COUNT:40};
/* 树结构：cells[i]=[x,y,parentIdx]（父在前）；children 邻接 */
BT.kids=function(cells){
  var k=cells.map(function(){return []});
  for(var i=0;i<cells.length;i++)if(cells[i][2]>=0)k[cells[i][2]].push(i);
  return k;
};
BT.subtree=function(cells,i){
  var k=BT.kids(cells),out=[];
  (function rec(v){out.push(v);for(var c=0;c<k[v].length;c++)rec(k[v][c]);})(i);
  return out;
};
/* 最少剪枝数 = 挂在「有保留枝节点」下的最大无保留子树个数 */
BT.minCuts=function(cells,targetSet){
  var k=BT.kids(cells),n=cells.length,hasT=new Array(n);
  for(var i=n-1;i>=0;i--){
    var ok=!!targetSet[i];
    for(var c=0;c<k[i].length;c++)if(hasT[k[i][c]])ok=true;
    hasT[i]=ok;
  }
  if(!hasT[0])return 0;
  var cuts=0;
  (function rec(v){
    for(var c=0;c<k[v].length;c++){
      if(hasT[k[v][c]])rec(k[v][c]);
      else cuts++;
    }
  })(0);
  return cuts;
};
/* 剪后剩余是否与目标一致 */
BT.matched=function(cells,cutMark,targetSet){
  for(var i=0;i<cells.length;i++)if(cutMark[i]===!!targetSet[i])return false;
  return true;
};
/* 生成：随机递归长树 → 随机整枝摘除 k 段得目标轮廓（par=k） */
BT.genLevel=function(no){
  for(var attempt=0;attempt<20;attempt++){
    var rng=mulberry32(55300+no*733+attempt*29);
    var maxDepth=4+Math.min(3,Math.floor((no-1)/10));
    var kidMax=1+(rng()<0.4+Math.min(0.4,no*0.01)?1:0)+(rng()<Math.min(0.35,no*0.009)?1:0);
    var cells=[[5,12,-1]],occ={};
    occ["5,12"]=1;
    var cap=18+no+attempt*2;   // 节点数上限（随尝试放宽）
    (function grow(x,y,depth,parent){
      if(depth<=0||cells.length>=cap)return;
      var dirs=[[-1,-1],[0,-1],[1,-1],[-1,0],[1,0]];
      var n=1+Math.floor(rng()*kidMax);
      for(var c=0;c<n;c++){
        if(cells.length>=cap)return;
        for(var tr=0;tr<6;tr++){
          var d=dirs[Math.floor(rng()*dirs.length)];
          var nx=x+d[0],ny=y+d[1],key=nx+","+ny;
          if(nx<1||nx>9||ny<2||ny>12||occ[key])continue;
          occ[key]=1;
          var idx=cells.length;
          cells.push([nx,ny,parent]);
          grow(nx,ny,depth-1,idx);
          break;
        }
      }
    })(5,12,maxDepth,0);
    if(cells.length<12)continue;
    var k=1+Math.min(3,Math.floor((no-1)/10));
    var targetSet={},tk=cells.length;
    for(var i2=0;i2<cells.length;i2++)targetSet[i2]=1;
    var picks=[];
    for(var p2=0;p2<k;p2++){
      var cand=[];
      for(var j=1;j<cells.length;j++){
        if(!targetSet[j])continue;
        var sub=BT.subtree(cells,j),allT=true;
        for(var s=0;s<sub.length;s++)if(!targetSet[sub[s]]){allT=false;break;}
        if(allT&&sub.length<tk-1)cand.push(j);
      }
      if(!cand.length)break;
      var pick=cand[Math.floor(rng()*cand.length)];
      var sub2=BT.subtree(cells,pick);
      for(var s2=0;s2<sub2.length;s2++)delete targetSet[sub2[s2]];
      picks.push(pick);
    }
    if(!picks.length)continue;
    var tArr=[];
    for(var i3=0;i3<cells.length;i3++)if(targetSet[i3])tArr.push(i3);
    if(tArr.length<6||tArr.length===cells.length)continue;
    var par=BT.minCuts(cells,targetSet);
    if(par<1||par!==picks.length)continue;
    return {name:"盆景·"+(no<10?"0":"")+no,w:BT.W,h:BT.H,cells:cells,target:tArr,
      budget:par+2,par:par,difficulty:Math.min(9,1+Math.floor(no/5))};
  }
  //兜底：确定性静态关（结构已验，par=1）
  return {name:"盆景·"+(no<10?"0":"")+no,w:BT.W,h:BT.H,
    cells:[[5,12,-1],[5,11,0],[5,10,1],[6,9,2],[6,8,3],[7,9,3]],target:[0,1,2],
    budget:3,par:1,difficulty:Math.min(9,1+Math.floor(no/5))};
};
/* 结构校验 */
BT.validate=function(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return{ok:false,why:"bad"};
  if(!Array.isArray(d.cells)||d.cells.length<6||d.cells.length>60)return{ok:false,why:"cells"};
  if(d.cells[0][2]!==-1)return{ok:false,why:"root"};
  var occ={};
  for(var i=0;i<d.cells.length;i++){
    var c=d.cells[i];
    if(!Array.isArray(c)||c.length!==3)return{ok:false,why:"cell"+i};
    if(c[0]<0||c[0]>=d.w||c[1]<0||c[1]>=d.h)return{ok:false,why:"cpos"+i};
    if(occ[c[0]+","+c[1]])return{ok:false,why:"dup"+i};
    occ[c[0]+","+c[1]]=1;
    if(!Number.isInteger(c[2])||c[2]>=i)return{ok:false,why:"par"+i};
  }
  if(!Array.isArray(d.target)||!d.target.length)return{ok:false,why:"target"};
  var targetSet={};
  for(var t=0;t<d.target.length;t++){
    var ti=d.target[t];
    if(!Number.isInteger(ti)||ti<0||ti>=d.cells.length)return{ok:false,why:"t"+t};
    if(targetSet[ti])return{ok:false,why:"tdup"+t};
    targetSet[ti]=1;
  }
  if(d.target.length===d.cells.length)return{ok:false,why:"full"};
  var par=BT.minCuts(d.cells,targetSet);
  if(par<1)return{ok:false,why:"par"};
  if(!Number.isInteger(d.budget)||d.budget<par)return{ok:false,why:"budget"};
  return{ok:true,why:"",par:par};
};
BT.validateAll=function(){
  var fails=[],i;
  for(i=1;i<=BT.LEVEL_COUNT;i++){
    var L=BT.genLevel(i),r=BT.validate(L);
    if(!r.ok)fails.push(i+"("+r.why+")");
  }
  return {total:BT.LEVEL_COUNT,solvable:BT.LEVEL_COUNT-fails.length,fail:fails};
};
BT.runTests=function(){
  var pass=0,rows=[];
  function ck(name,ok,got){rows.push({name:name,ok:!!ok,got:got});if(ok)pass++;}
  //锚点1：链+叉，摘一片叶 → par=1
  var t1={w:11,h:13,cells:[[5,12,-1],[5,11,0],[5,10,1],[6,9,2],[4,9,2],[6,8,3]],target:[0,1,2,3,5],budget:3};
  var r1=BT.validate(t1);
  ck("锚点·摘一叶 par=1",r1.ok&&r1.par===1,"par="+r1.par);
  //锚点2：目标=全树 → 不成关
  var t2={w:11,h:13,cells:[[5,12,-1],[5,11,0],[5,10,1],[6,9,2],[4,9,2],[6,8,3]],target:[0,1,2,3,4,5],budget:0};
  var r2=BT.validate(t2);
  ck("锚点·全保留不成关",!r2.ok,"why="+r2.why);
  //锚点3：两根兄弟枝全摘 → par=2
  var t3={w:11,h:13,cells:[[5,12,-1],[5,11,0],[6,10,1],[4,10,1],[6,9,2],[4,9,3]],target:[0,1],budget:4};
  var r3=BT.validate(t3);
  ck("锚点·双枝全摘 par=2",r3.ok&&r3.par===2,"par="+r3.par);
  //锚点4：剪在分枝深处仍会留残枝（配对检查，目标同锚点3=[0,1]）
  var cutDeep=new Array(6).fill(false);cutDeep[4]=true;
  var m4=BT.matched(t3.cells,cutDeep,{0:1,1:1});
  ck("锚点·深剪留残枝不吻合",m4===false,"matched="+m4);
  var r=BT.validateAll();
  ck("40 关结构+可解校验",r.fail.length===0,"fail="+r.fail.join(","));
  var L1=BT.genLevel(1),L2=BT.genLevel(1);
  ck("生成确定性",JSON.stringify(L1)===JSON.stringify(L2),"replay");
  return {total:6,pass:pass,rows:rows,levels:r};
};
globalThis.__XC=BT;
/*XC-CORE-END*/

/* ========== 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ========== */
var GAME_KEY="bonsai-trim",SAVE_KEY="sw.bonsaitrim.v1";
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=BT.LEVEL_COUNT;i++)list.push(BT.genLevel(i));
  return list;
}
var LEVELS=buildDefaultLevels();
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!BT.validate(d).ok)return null;
    var no=parseInt(row.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=1;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return BT.validate(d).ok})){
      LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      loadLevel(cur);
    }
  }).catch(function(){});
}

/* ========== 存档（本地 + 账号双写，账号更优才覆盖） ========== */
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:parseInt(s.lv,10)||0,best:parseInt(s.best,10)||1}}catch(e){return{lv:0,best:1}}}
var save=loadSave();
var unlocked=clamp(save.best,1,1);
function persist(){
  var data={lv:cur,best:unlocked};
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson||state!=="edit")return;
    try{
      var r=JSON.parse(res.stateJson),ch=false;
      var rl=parseInt(r.lv,10),rb=parseInt(r.best,10);
      if(isFinite(rl)&&rl>save.lv&&rl<LEVELS.length){save.lv=rl;ch=true;}
      if(isFinite(rb)&&rb>unlocked&&rb<=LEVELS.length){unlocked=rb;ch=true;}
      if(ch){cur=clamp(save.lv,0,LEVELS.length-1);persist();loadLevel(cur);}
    }catch(e){}
  }).catch(function(){});
}

/* ========== 调色板 ========== */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),
    bark:v("--g-st-bark"),bark2:v("--g-st-bark2"),leaf:v("--g-st-leaf"),pot:v("--g-st-pot")};
}
window.__gOnTheme=function(){palLoad()};
palLoad();

/* ========== 画布与状态 ========== */
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,cs=28,cur=save.lv,L=null;
var kids=[],targetSet={},cutMark=[],stack=[],cursor=0,state="edit",done=false;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);
  cs=Math.max(22,Math.min(30,Math.floor((W-12)/L.w)));
  var H=L.h*cs+14;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",function(){resize();draw();});
function loadLevel(n){
  cur=clamp(n,0,LEVELS.length-1);
  L=LEVELS[cur];
  var v=BT.validate(L);
  if(!v.ok){say("关卡数据异常");return;}
  L.par=v.par;
  kids=BT.kids(L.cells);
  targetSet={};
  for(var i=0;i<L.target.length;i++)targetSet[L.target[i]]=1;
  cutMark=new Array(L.cells.length).fill(false);
  stack=[];cursor=0;state="edit";done=false;
  $("lvTag").textContent="第 "+(cur+1)+" 关 · "+L.name;
  $("lvRule").textContent="剪 "+L.budget+" 刀内 · 参考 "+L.par+" 刀 · 留 "+L.target.length+" 节";
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  $("stPar").textContent=L.par;
  say("点枝条整段剪除（虚线圈 = 要保留的枝），剪到与轮廓完全一致");
  resize();syncHud();draw();
}
function syncHud(){
  $("stCut").textContent=stack.length+"/"+L.budget;
  $("stCut").className="val"+(stack.length>=L.budget?" low":"");
  var fit=0;
  for(var i=0;i<L.cells.length;i++)if(cutMark[i]!==targetSet[i])fit++;
  $("stFit").textContent=Math.round((L.cells.length-fit)/L.cells.length*100)+"%";
}
/* ---------- 交互 ---------- */
function cutNode(i){
  if(state!=="edit"||done)return;
  if(i===0){say("主干不能剪，盆景要从分枝下手");return;}
  if(cutMark[i]){say("这段已经剪掉了");return;}
  if(stack.length>=L.budget){say("剪刀用完了（"+L.budget+" 刀），先撤销再想");return;}
  var sub=BT.subtree(L.cells,i);
  for(var s=0;s<sub.length;s++)cutMark[sub[s]]=true;
  stack.push(i);
  say("剪掉 "+sub.length+" 节 · 还剩 "+(L.budget-stack.length)+" 刀");
  syncHud();draw();
  checkWin();
}
function undo(){
  if(state!=="edit"||!stack.length)return;
  var i=stack.pop();
  var sub=BT.subtree(L.cells,i);
  for(var s=0;s<sub.length;s++)cutMark[sub[s]]=false;
  say("已接回一段枝");
  syncHud();draw();
}
function checkWin(){
  if(BT.matched(L.cells,cutMark,targetSet)){
    done=true;
    var cuts=stack.length;
    if(cur<LEVELS.length-1&&cur+1>save.lv)save.lv=cur+1;
    if(cur+2>unlocked)unlocked=Math.min(LEVELS.length,cur+2);
    persist();
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:cur+1,metricExtra:cuts}).catch(function(){});
    $("ovTitle").textContent=(cur>=LEVELS.length-1)?"全部通关！":"造型完成！";
    $("ovDesc").innerHTML="用 "+cuts+" 刀（参考最少 "+L.par+"）"+(cur<LEVELS.length-1?"<br>已解锁第 "+(cur+2)+" 关":"<br>40 盆全部完成");
    $("ovBtn").textContent=(cur>=LEVELS.length-1)?"回到第 1 关":"下一关";
    $("ovRetry").hidden=true;
    ovMode="win";
    $("overlay").classList.add("show");
  }else if(stack.length>=L.budget){
    state="pause";
    $("ovTitle").textContent="剪刀用完";
    $("ovDesc").textContent="还差一点没剪到位。看看虚线圈，剪在分枝根部最省刀数。";
    $("ovBtn").textContent="选关";
    $("ovRetry").hidden=false;
    ovMode="fail";
    $("overlay").classList.add("show");
  }
}
function hint(){
  if(state!=="edit"||done)return;
  //解 = 有保留枝节点下的无保留子树顶
  var tops=[];
  (function rec(v){
    for(var c=0;c<kids[v].length;c++){
      if(subHasTarget(kids[v][c]))rec(kids[v][c]);
      else if(!cutMark[kids[v][c]])tops.push(kids[v][c]);
    }
  })(0);
  function subHasTarget(v){
    var sub=BT.subtree(L.cells,v);
    for(var s=0;s<sub.length;s++)if(targetSet[sub[s]])return true;
    return false;
  }
  if(!tops.length){say("剩下的都要保留，别再剪了");return;}
  var pick=tops[0];
  cutNode(pick);
  if(!done)say("提示：这一枝整段不要（"+(tops.length)+" 处待剪）");
}
var ovMode="select";
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<unlocked-1?" done":"");
      b.textContent=i+1;
      b.disabled=i>=unlocked;
      b.addEventListener("click",function(){
        cur=i;save.lv=Math.max(save.lv,cur);persist();
        $("overlay").classList.remove("show");
        loadLevel(cur);
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("ovRetry").hidden=true;
  ovMode="select";
  $("overlay").classList.add("show");
}

/* ========== 绘制 ========== */
function draw(){
  ctx.fillStyle=PAL.surface2;ctx.fillRect(0,0,W,L.h*cs+14);
  var ox=(W-L.w*cs)/2,oy=7;
  function cx(i){return ox+L.cells[i][0]*cs+cs/2}
  function cy(i){return oy+L.cells[i][1]*cs+cs/2}
  //盆
  ctx.fillStyle=PAL.pot;
  ctx.beginPath();
  ctx.moveTo(ox+3*cs,oy+L.h*cs-4);
  ctx.lineTo(ox+7*cs,oy+L.h*cs-4);
  ctx.lineTo(ox+6.5*cs,oy+L.h*cs+8);
  ctx.lineTo(ox+3.5*cs,oy+L.h*cs+8);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=PAL.bark2;ctx.lineWidth=1.5;ctx.stroke();
  //目标轮廓（虚线圈）
  ctx.strokeStyle=PAL.faint;ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
  for(var t=0;t<L.target.length;t++){
    ctx.beginPath();ctx.arc(cx(L.target[t]),cy(L.target[t]),cs*0.34,0,7);ctx.stroke();
  }
  ctx.setLineDash([]);
  //枝干（未剪的父子连线）
  for(var i=0;i<L.cells.length;i++){
    if(cutMark[i])continue;
    var p=L.cells[i][2];
    if(p<0||cutMark[p])continue;
    ctx.strokeStyle=PAL.bark2;ctx.lineWidth=Math.max(2,4-(i%5));
    ctx.beginPath();ctx.moveTo(cx(p),cy(p));ctx.lineTo(cx(i),cy(i));ctx.stroke();
  }
  //节点与叶
  for(var j=0;j<L.cells.length;j++){
    if(cutMark[j])continue;
    var leaf=kids[j].length===0;
    var isT=!!targetSet[j];
    ctx.fillStyle=leaf?PAL.leaf:PAL.bark;
    ctx.beginPath();ctx.arc(cx(j),cy(j),leaf?cs*0.3:cs*0.22,0,7);ctx.fill();
    ctx.strokeStyle=isT?PAL.deep:PAL.border;ctx.lineWidth=1.5;
    ctx.stroke();
    if(j===0){
      ctx.fillStyle=PAL.surface;
      ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText("干",cx(j),cy(j)+1);
    }
  }
  //光标
  if(state==="edit"&&!done){
    ctx.strokeStyle=PAL.primary;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx(cursor),cy(cursor),cs*0.42,0,7);ctx.stroke();
  }
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.strokeRect(0.5,0.5,W-1,L.h*cs+13);
}

/* ========== 主循环（纯事件驱动；rAF 仅重绘，切后台停帧不推进任何状态） ========== */
var rafPending=false,lastTs=0;
function frame(ts){
  rafPending=false;
  if(document.hidden)return;
  lastTs=ts;
  draw();
  rafPending=true;requestAnimationFrame(frame);
}
function kick(){if(!rafPending&&!document.hidden){rafPending=true;requestAnimationFrame(frame);}}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){lastTs=0;}
  else{lastTs=0;kick();}
});

/* ========== 输入 ========== */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  var ox=(W-L.w*cs)/2,oy=7;
  var best=-1,bd=1e9;
  for(var i=0;i<L.cells.length;i++){
    if(cutMark[i])continue;
    var d=Math.hypot(ox+L.cells[i][0]*cs+cs/2-x,oy+L.cells[i][1]*cs+cs/2-y);
    if(d<cs*0.5&&d<bd){bd=d;best=i;}
  }
  if(best>=0){cursor=best;cutNode(best);}
});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){
  cutMark=new Array(L.cells.length).fill(false);
  stack=[];state="edit";
  $("overlay").classList.remove("show");
  say("重新长回来了，再剪一次");
  syncHud();draw();
});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(ovMode==="win"){
    if(cur>=LEVELS.length-1){cur=0;save.lv=0;persist();loadLevel(0);}
    else{cur++;loadLevel(cur);}
  }else if(ovMode==="fail"){
    openLevelSelect();
  }
});
$("ovRetry").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  cutMark=new Array(L.cells.length).fill(false);
  stack=[];state="edit";
  syncHud();draw();
});
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowUp"){cursor=Math.max(0,cursor-1);draw();e.preventDefault();}
  else if(e.key==="ArrowDown"){cursor=Math.min(L.cells.length-1,cursor+1);draw();e.preventDefault();}
  else if(e.key==="ArrowLeft"){cursor=Math.max(0,cursor-1);draw();e.preventDefault();}
  else if(e.key==="ArrowRight"){cursor=Math.min(L.cells.length-1,cursor+1);draw();e.preventDefault();}
  else if(e.key==="Enter"){cutNode(cursor);e.preventDefault();}
  else if(e.key==="z"||e.key==="Z"||e.key==="u"||e.key==="U")undo();
  else if(e.key==="h"||e.key==="H")hint();
  else if(e.key==="r"||e.key==="R"){
    cutMark=new Array(L.cells.length).fill(false);
    stack=[];state="edit";
    $("overlay").classList.remove("show");
    syncHud();draw();
  }
});

/* 调试验证入口 */
window.__validateLevels=function(){try{return BT.runTests()}catch(e){return {error:String(e)}}};

/* ========== 启动（续玩：从存档关卡起步） ========== */
cur=clamp(save.lv,0,LEVELS.length-1);
loadLevel(cur);
requestAnimationFrame(frame);
syncLevelsFromServer();
syncSaveFromServer();

})();
</script>
