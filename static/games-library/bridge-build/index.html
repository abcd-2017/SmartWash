  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（动效层指令，不受主题层 matchMedia 禁令约束） */

window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
/*X3-ENGINE-BEGIN*/
var BB=(function(){
"use strict";
/* ===== 世界常量（逻辑坐标，确定性固定步长） ===== */
var W=480,H=320,DECK_Y=150,R_TRUCK=11,GRAV=380,DT=1/240,K_ROD=4200,C_ROD=26,
    M_NODE=1.3,M_TRUCK_BASE=26,DRIVE=320,VMAX=105,MAX_R=100,ROD_R=3,MAX_SIM=40;
/* ===== 关卡（公式化确定性生成，44 关） ===== */
function makeLevels(){
  var L=[],i;
  for(i=0;i<44;i++){
    var cl=96+(i%3)*8;
    var nc=6+(i>13?1:0)+(i>29?1:0);
    var bd=26+(i%4)*6;
    var strength=Math.max(0.09,0.16-i*0.0016);
    var truck=M_TRUCK_BASE+i*0.45;
    var bfactor=Math.max(1.0,1.14-i*0.0035);
    L.push({name:"造桥·"+(i<9?"0":"")+(i+1),cl:cl,nc:nc,bd:bd,strength:strength,truck:truck,bfactor:bfactor});
  }
  return L;
}
var LEVELS=makeLevels();
/* ===== 节点/标准解构造 ===== */
function buildNodes(lv){
  var span=W-2*lv.cl,st=span/(lv.nc-1),nodes=[],i;
  for(i=0;i<lv.nc;i++)nodes.push({x:lv.cl+st*i,y:DECK_Y,fixed:(i===0||i===lv.nc-1)?1:0,deck:1});
  if(lv.bd>0){for(i=0;i<lv.nc-1;i++)nodes.push({x:lv.cl+st*(i+0.5),y:DECK_Y+lv.bd,fixed:0,deck:0});}
  return nodes;
}
function solEdges(lv){
  var nc=lv.nc,edges=[],i,ob=nc;
  for(i=0;i<nc-1;i++)edges.push([i,i+1]);
  if(lv.bd>0){
    for(i=0;i<nc-1;i++){edges.push([i,ob+i]);edges.push([ob+i,i+1]);}
    for(i=0;i<nc-2;i++)edges.push([ob+i,ob+i+1]);
  }
  return edges;
}
function edgeCost(a,b){
  var d=Math.hypot(a.x-b.x,a.y-b.y);
  return Math.round(d);
}
function costOf(lv,edges){
  var nodes=buildNodes(lv),s=0,i;
  for(i=0;i<edges.length;i++)s+=edgeCost(nodes[edges[i][0]],nodes[edges[i][1]]);
  return s;
}
function finalizeLevel(lv){
  var edges=solEdges(lv),cost=costOf(lv,edges);
  return {name:lv.name,cl:lv.cl,nc:lv.nc,bd:lv.bd,strength:lv.strength,truck:lv.truck,
    budget:Math.round(cost*lv.bfactor),par:cost};
}
for(var fi=0;fi<LEVELS.length;fi++)LEVELS[fi]=finalizeLevel(LEVELS[fi]);
/* ===== 模拟 ===== */
function makeSim(lv,edges){
  var raw=buildNodes(lv),nodes=[],rods=[],i;
  for(i=0;i<raw.length;i++)nodes.push({x:raw[i].x,y:raw[i].y,vx:0,vy:0,fx:raw[i].fixed,deck:raw[i].deck});
  for(i=0;i<edges.length;i++){
    var a=nodes[edges[i][0]],b=nodes[edges[i][1]];
    rods.push({a:edges[i][0],b:edges[i][1],rest:Math.hypot(b.x-a.x,b.y-a.y),broken:false,strain:0});
  }
  return {lv:lv,nodes:nodes,rods:rods,t:0,state:"run",
    truck:{x:lv.cl*0.5,y:DECK_Y-R_TRUCK,vx:0,vy:0,done:false}};
}
function subStep(sim){
  var nodes=sim.nodes,rods=sim.rods,lv=sim.lv,dt=DT,i;
  for(i=0;i<nodes.length;i++){
    var n=nodes[i];
    if(n.fx)continue;
    n.vy+=GRAV*dt;
    n.vx*=0.999;n.vy*=0.999;
  }
  for(i=0;i<rods.length;i++){
    var r=rods[i];
    if(r.broken)continue;
    var a=nodes[r.a],b=nodes[r.b];
    var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.0001;
    r.strain=(d-r.rest)/r.rest;
    if(Math.abs(r.strain)>lv.strength){r.broken=true;continue;}
    var F=K_ROD*(d-r.rest);
    var rvx=b.vx-a.vx,rvy=b.vy-a.vy;
    var Fd=C_ROD*((rvx*dx+rvy*dy)/d);
    var fx=(F+Fd)*dx/d,fy=(F+Fd)*dy/d;
    if(!a.fx){a.vx+=fx/M_NODE*dt;a.vy+=fy/M_NODE*dt;}
    if(!b.fx){b.vx-=fx/M_NODE*dt;b.vy-=fy/M_NODE*dt;}
  }
  var t=sim.truck;
  if(!t.done){
    t.vx+=DRIVE*dt;
    if(t.vx>VMAX)t.vx=VMAX;
    t.vy+=GRAV*dt;
  }
  for(i=0;i<rods.length;i++){
    var r2=rods[i];
    if(r2.broken||t.done)continue;
    var a2=nodes[r2.a],b2=nodes[r2.b];
    var ex=b2.x-a2.x,ey=b2.y-a2.y,L2=ex*ex+ey*ey||0.0001;
    var u=((t.x-a2.x)*ex+(t.y-a2.y)*ey)/L2;
    u=u<0?0:(u>1?1:u);
    var cx=a2.x+ex*u,cy=a2.y+ey*u;
    var ddx=t.x-cx,ddy=t.y-cy,d2=Math.hypot(ddx,ddy)||0.0001;
    var lim=R_TRUCK+ROD_R;
    if(d2<lim&&t.y<=cy+2){
      /* 位置投影：卡车贴住杆面（质量比悬殊，力弹簧会穿透） */
      t.y=cy-lim;
      if(t.vy>0)t.vy*=0.25;
      /* 卡车重量按重心分摊压到杆端（速度增量=重力/m_node*dt） */
      var wLoad=lv.truck*GRAV*dt/M_NODE*0.5;
      var wa=1-u,wb=u;
      if(!a2.fx){a2.vy+=wLoad*wa;}
      if(!b2.fx){b2.vy+=wLoad*wb;}
    }
  }
  if(!t.done){
    t.x+=t.vx*dt;t.y+=t.vy*dt;
    var onCliff=(t.x<=lv.cl+1)||(t.x>=W-lv.cl-1);
    if(onCliff&&t.y>DECK_Y-R_TRUCK){t.y=DECK_Y-R_TRUCK;if(t.vy>0)t.vy=0;}
    if(t.y>H-26){sim.state="fail";t.done=true;return;}
    if(t.x>=W-lv.cl-6){sim.state="win";t.done=true;return;}
  }
  sim.t+=dt;
  if(sim.t>MAX_SIM&&sim.state==="run"){sim.state="fail";}
}
function runSim(lv,edges){
  var sim=makeSim(lv,edges),guard=MAX_SIM/DT*4;
  while(sim.state==="run"&&guard-->0)subStep(sim);
  return sim;
}
/* ===== 验证器（含锚点用例） ===== */
function verifyLevel(idx){
  var lv=LEVELS[idx];
  if(costOf(lv,solEdges(lv))>lv.budget)return {ok:false,why:"预算"};
  var sim=runSim(lv,solEdges(lv));
  return {ok:sim.state==="win",why:sim.state};
}
function verifyAll(){
  var res=[],i;
  for(i=0;i<LEVELS.length;i++)res.push(verifyLevel(i));
  return res;
}
function selfTest(){
  var out=[],lv0=LEVELS[0];
  out.push({name:"锚点1·第1关标准解可通关",pass:runSim(lv0,solEdges(lv0)).state==="win"});
  var half=solEdges(lv0).slice(0,2);   // 只留左半桥面：桥到跨中即断，卡车必坠
  out.push({name:"锚点2·只建半座桥则坠谷",pass:runSim(lv0,half).state==="fail"});
  var costOk=true;
  for(var i=0;i<LEVELS.length;i++)if(costOf(LEVELS[i],solEdges(LEVELS[i]))>LEVELS[i].budget)costOk=false;
  out.push({name:"锚点3·全关卡标准解造价不超预算",pass:costOk});
  var all=verifyAll(),bad=[];
  for(var j=0;j<all.length;j++)if(!all[j].ok)bad.push(j+1);
  out.push({name:"全关验证·44 关标准解模拟回放可通关",pass:bad.length===0,bad:bad.join(",")});
  return out;
}
return {W:W,H:H,DECK_Y:DECK_Y,R_TRUCK:R_TRUCK,ROD_R:ROD_R,MAX_R:MAX_R,M_TRUCK_BASE:M_TRUCK_BASE,
  LEVELS:LEVELS,buildNodes:buildNodes,solEdges:solEdges,edgeCost:edgeCost,costOf:costOf,
  makeSim:makeSim,subStep:subStep,runSim:runSim,verifyLevel:verifyLevel,verifyAll:verifyAll,selfTest:selfTest};
})();
/*X3-ENGINE-END*/
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="bridge-build",SAVE_KEY="sw.bridgebuild.v1";
var DEFAULT_LEVELS=BB.LEVELS;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!(d.cl>=80&&d.cl<=130))return false;
  if(!Number.isInteger(d.nc)||d.nc<5||d.nc>9)return false;
  if(!(d.bd>=20&&d.bd<=50))return false;
  if(!(d.strength>0.06&&d.strength<=0.2))return false;
  if(!(d.truck>=15&&d.truck<=60))return false;
  if(!Number.isInteger(d.budget)||d.budget<200)return false;
  if(!Number.isInteger(d.par)||d.par<150)return false;
  return true;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    if(!res||!Array.isArray(res.levels)||!res.levels.length)return;
    var list=[],seen={};
    for(var i=0;i<res.levels.length;i++){
      var row=res.levels[i];
      if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return;
      var d;try{d=JSON.parse(row.dataJson);}catch(e){return;}
      if(!validLevelData(d))return;
      if(seen[d.name])return;seen[d.name]=1;
      list.push(d);
    }
    if(list.length&&applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";$("ovBtn").style.background="var(--g-surface2)";$("ovBtn").style.color="var(--g-text)";
  $("ovRetry").hidden=true;
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 调色板：UI 走 token，崖壁/杆件/卡车为素材色 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),
    cliff:v("--g-st-cliff"),cliff2:v("--g-st-cliff2"),void_:v("--g-st-void"),
    rod:v("--g-st-rod"),rod2:v("--g-st-rod2"),truck:v("--g-st-truck"),truck2:v("--g-st-truck2")};
}
window.__gOnTheme=function(){palLoad()};
function shade(c,a){
  var s=String(c).trim(),m;
  if(s.charAt(0)==="#"){
    var h=s.slice(1),r,g,b;
    if(h.length===3){r=parseInt(h.charAt(0)+h.charAt(0),16);g=parseInt(h.charAt(1)+h.charAt(1),16);b=parseInt(h.charAt(2)+h.charAt(2),16);}
    else{r=parseInt(h.slice(0,2),16);g=parseInt(h.slice(2,4),16);b=parseInt(h.slice(4,6),16);}
    return"rgba("+r+","+g+","+b+","+(a).toFixed(3)+")";
  }
  m=s.match(/rgba?\(([^)]+)\)/);
  if(m){var p=m[1].split(",");return"rgba("+p[0]+","+p[1]+","+p[2]+","+a+")";}
  return s;
}
/* ---------- 状态（续玩：lv 起步即存档关） ---------- */
var lv=save.lv,L=null,nodes=[],edges=[],cost=0,sim=null,sel=-1,done=false;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=BB.W,H=BB.H;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  nodes=BB.buildNodes(L);edges=[];cost=0;sim=null;sel=-1;done=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent="强度 "+Math.round(L.strength*100)+"% · 卡车 "+Math.round(L.truck/BB.M_TRUCK_BASE*26)+"t";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stPar").textContent=L.par;
  updCost();
  say("点两个节点架一根杆（单杆≤"+BB.MAX_R+"），先铺桥面再加斜撑");
  updBtns();
}
function updCost(){
  $("stCost").textContent=cost+"/"+L.budget;
  $("stCost").classList.toggle("low",cost>L.budget);
  updBtns();
}
function updBtns(){
  $("btnUndo").disabled=!edges.length||!!sim;
  $("btnGo").disabled=!!sim;
}
/* ---------- 建造交互 ---------- */
function addEdge(a,b){
  if(a===b)return say("不能连自己");
  for(var i=0;i<edges.length;i++)if((edges[i][0]===a&&edges[i][1]===b)||(edges[i][0]===b&&edges[i][1]===a))return say("这两点之间已经有杆了");
  if(nodes[a].fx&&nodes[b].fx)return say("两点都固定在崖壁上，这根杆没有意义");
  var d=Math.hypot(nodes[a].x-nodes[b].x,nodes[a].y-nodes[b].y);
  if(d>BB.MAX_R)return say("距离太远，单杆最长 "+BB.MAX_R);
  var c=BB.edgeCost(nodes[a],nodes[b]);
  if(cost+c>L.budget)return say("预算不够（还需 "+c+"，剩 "+(L.budget-cost)+"）");
  edges.push([a,b]);cost+=c;sel=-1;
  updCost();say("已架一根杆（"+c+"）");
}
function undo(){
  if(!edges.length||sim)return;
  var e=edges.pop();cost-=BB.edgeCost(nodes[e[0]],nodes[e[1]]);
  sel=-1;updCost();say("已撤销一根杆");
}
function runBridge(){
  if(sim)return;
  if(!edges.length){say("先架几根杆再试跑");return;}
  sim=BB.makeSim(L,edges);sel=-1;updBtns();
  say("卡车过桥中……");
}
/* ---------- 胜负 ---------- */
function finish(st){
  done=true;updBtns();
  if(st==="win"){
    if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:cost}).catch(function(){});
    $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"过关！";
    $("ovDesc").innerHTML="卡车安全过谷，造价 "+cost+" / 预算 "+L.budget+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>44 关全部完成");
    $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
    $("ovBtn").style.background="var(--g-btn-primary)";$("ovBtn").style.color="#fff";
    $("ovRetry").hidden=true;
  }else{
    $("ovTitle").textContent="桥塌了！";
    $("ovDesc").textContent="卡车掉进山谷了。调整杆件布局或加斜撑再来。";
    $("ovBtn").textContent="重试本关";
    $("ovBtn").style.background="var(--g-btn-primary)";$("ovBtn").style.color="#fff";
    $("ovRetry").hidden=true;
  }
  $("overlay").classList.add("show");
}
/* ---------- 绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.height=Math.round(w*H/W)+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*H/W*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var sc=w/W;
  ctx.scale(sc,sc);
  ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
}
function rr(x,y,w2,h2,r){
  r=Math.min(r,w2/2,h2/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);
  ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();
}
function stressColor(str,limit){
  var t=Math.min(1,Math.abs(str)/limit);
  return t<0.5?PAL.success:PAL.danger;
}
function draw(ts){
  ctx.fillStyle=PAL.void_;ctx.fillRect(0,0,W,H);
  var lv=L.cl;
  ctx.fillStyle=PAL.cliff;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(lv,0);ctx.lineTo(lv,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W-lv,0);ctx.lineTo(W-lv,H);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  ctx.fillStyle=PAL.cliff2;
  ctx.fillRect(lv-4,0,4,H);ctx.fillRect(W-lv,0,4,H);
  ctx.fillStyle=PAL.water;
  ctx.fillRect(lv+4,H-10,W-2*lv-8,6);
  if(L&&nodes.length){
    var live=sim?sim.nodes:nodes;
    var rods=sim?sim.rods:edges.map(function(e,i){
      var a=live[e[0]],b=live[e[1]];
      return {a:e[0],b:e[1],broken:false,strain:0,rest:Math.hypot(b.x-a.x,b.y-a.y)};
    });
    for(var i=0;i<rods.length;i++){
      var r=rods[i];
      if(r.broken)continue;
      var a=live[r.a],b=live[r.b];
      ctx.strokeStyle=(sim&&r.strain)?stressColor(r.strain,L.strength):PAL.rod;
      ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      ctx.strokeStyle=PAL.rod2;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }
    for(var j=0;j<live.length;j++){
      var n=live[j];
      ctx.fillStyle=n.fx?PAL.deep:(n.deck?PAL.primary:PAL.warning);
      ctx.beginPath();ctx.arc(n.x,n.y,n.fx?7:5.5,0,7);ctx.fill();
      ctx.strokeStyle=PAL.border;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(n.x,n.y,n.fx?7:5.5,0,7);ctx.stroke();
      if(j===sel){
        ctx.strokeStyle=PAL.warning;ctx.lineWidth=2.5;
        ctx.beginPath();ctx.arc(n.x,n.y,11,0,7);ctx.stroke();
      }
    }
    var t=sim?sim.truck:{x:L.cl*0.5,y:BB.DECK_Y-BB.R_TRUCK};
    drawTruck(t.x,t.y);
  }
}
function drawTruck(x,y){
  var r=BB.R_TRUCK;
  ctx.fillStyle=PAL.truck;
  rr(x-r-4,y-r+2,2*r+8,r+2,4);ctx.fill();
  ctx.strokeStyle=PAL.truck2;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="rgba(0,0,0,.35)";   // 恒黑轮芯
  ctx.beginPath();ctx.arc(x-6,y+r-2,4.5,0,7);ctx.arc(x+6,y+r-2,4.5,0,7);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.85)";   // 恒白车窗
  ctx.fillRect(x+r-9,y-r+5,6,5);
}
/* ---------- 主循环（切后台停续，dt 钳制防穿透） ---------- */
var rafId=0,last=0,acc=0;
function frame(ts){
  rafId=requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.05,(ts-last)/1000||0);
  last=ts;
  if(sim&&sim.state==="run"){
    acc+=dt;
    var steps=0;
    while(acc>=BB.DT&&steps<14){BB.subStep(sim);acc-=BB.DT;steps++;}
    if(sim.state!=="run")finish(sim.state);
  }else acc=0;
  draw(ts);
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){if(rafId){cancelAnimationFrame(rafId);rafId=0;}}
  else if(!rafId){last=0;rafId=requestAnimationFrame(frame);}
});
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  if(sim)return;
  var rect=cv.getBoundingClientRect();
  var x=(e.clientX-rect.left)/rect.width*W,y=(e.clientY-rect.top)/rect.height*H;
  e.preventDefault();
  var best=-1,bd=1e9;
  for(var i=0;i<nodes.length;i++){
    var d=Math.hypot(nodes[i].x-x,nodes[i].y-y);
    if(d<26&&d<bd){bd=d;best=i;}
  }
  if(best<0)return;
  if(sel<0){sel=best;say("已选节点 "+(best+1)+"，再点一点架杆");}
  else addEdge(sel,best);
});
cv.addEventListener("pointercancel",function(){});
$("btnGo").addEventListener("click",runBridge);
$("btnUndo").addEventListener("click",undo);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done&&sim&&sim.state==="win"){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }else loadLevel(lv);
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k===" "||k==="Enter"){e.preventDefault();runBridge();}
  else if(k==="z"||k==="Z")undo();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
window.addEventListener("resize",resize);
/* ---------- 启动（loadLevel 以存档关续玩） ---------- */
palLoad();loadLevel(save.lv);resize();rafId=requestAnimationFrame(frame);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
