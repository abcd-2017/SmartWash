<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>泡泡连线</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材（--g-st- 前缀）*/
  :root {
    --g-bg:#F5F6F3; --g-surface:#FFFFFF; --g-surface2:#EFF1EE;
    --g-primary:#2D9B6A; --g-primary-deep:#17734A; --g-btn-primary:#17734A; --g-primary-soft:#E8F6EF; --g-on-primary:#FFFFFF; --g-on-soft:#0B3625;
    --g-text:#1C1C1E; --g-muted:#6B6E73; --g-faint:#A9AEA9; --g-border:#E6E9E6; --g-hairline:#EFF1EE;
    --g-danger:#A83850; --g-warning:#9A6210; --g-success:#17734A; --g-water:#4A9FD4;
    --g-scrim:rgba(245,246,243,.9);
    --g-shadow:0 2px 12px rgba(20,40,30,.05);
    --g-radius:16px; --g-radius-btn:14px; --g-radius-inner:12px; --g-gap:16px;
    --g-st-water:#DCEFF7; --g-st-water2:#C2E2F2; --g-st-line:#A9AEA9;
    --g-st-bub1:#7FA8D9; --g-st-bub2:#7BC57B; --g-st-bub3:#E0A33E; --g-st-bub4:#D97F8C;
    color-scheme:light;
  }
  :root[data-theme=dark] {
    --g-bg:#141614; --g-surface:#1D201E; --g-surface2:#262A27;
    --g-primary-deep:#5BC894; --g-primary-soft:#1D3229; --g-on-soft:#B9E8CF;
    --g-text:#E6E9E6; --g-muted:#A9AEA9; --g-faint:#7E837D; --g-border:#2C312D; --g-hairline:#262A27;
    --g-danger:#DB7186; --g-warning:#E2A44E; --g-success:#4ADE6E; --g-water:#6BB4DE;
    --g-scrim:rgba(20,22,20,.9);
    --g-shadow:0 2px 12px rgba(0,0,0,.28);
    --g-st-water:#1E3A4A; --g-st-water2:#274C5F; --g-st-line:#3A3F3B;
    --g-st-bub1:#93BCE6; --g-st-bub2:#8FD68F; --g-st-bub3:#E8B45A; --g-st-bub4:#E693A0;
    color-scheme:dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.5; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 12px;
    min-width: 74px; padding: 5px 10px; text-align: center; line-height: 1.3;
  }
  .score-box .label { display: block; font-size: 12px; opacity: .85; white-space: nowrap; }
  .score-box .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stage { position: relative; }
  canvas {
    display: block; width: 100%; aspect-ratio: 3 / 4; height: auto;
    background: var(--g-st-water);
    border: 1px solid var(--g-border); border-radius: 12px;
    touch-action: none;
  }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 16px; flex: 1;
    border: 0; border-radius: 14px;
    background: var(--g-btn-primary); color: var(--g-on-primary);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    touch-action: manipulation;
  }
  .btn:active { opacity: .85; }
  .btn.ghost { background: var(--g-surface2); color: var(--g-text); border: 1px solid var(--g-border); }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .panel {
    width: 100%; max-width: 320px; max-height: 100%; overflow: auto;
    background: var(--g-surface); border: 1px solid var(--g-border); border-radius: 16px;
    box-shadow: var(--g-shadow); padding: 22px 18px; text-align: center;
  }
  .rt { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
  .rs { margin: 0 0 14px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .rs b { color: var(--g-primary-deep); font-size: 22px; font-variant-numeric: tabular-nums; }
  .rbtns { display: flex; gap: 10px; margin-top: 16px; }
  .rbtns .btn { flex: 1; }
  .rhint { margin: 14px 0 0; font-size: 12px; color: var(--g-muted); line-height: 1.6; text-align: left; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（动效层指令，不受 §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见 */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <span class="sub">同色气泡三连上浮消除 · 连线吃分</span>
    <div class="scores">
      <div class="score-box"><span class="label">分数</span><span class="val" id="score">0</span></div>
      <div class="score-box"><span class="label">最高分</span><span class="val" id="best">0</span></div>
    </div>
  </header>
  <div class="stage"><canvas id="cv" role="img" aria-label="泡泡连线水面"></canvas></div>
  <p class="msg" id="msg" role="status" aria-live="polite">点击「开始」放泡泡</p>
  <div class="tools">
    <button class="btn ghost" id="btnPause" type="button" disabled>暂停</button>
    <button class="btn" id="btnMain" type="button">开始游戏</button>
  </div>
  <p class="foot">按住滑过相邻同色气泡连成 3 个以上松手消除 · 键盘方向键选泡、空格连/断、回车结算</p>
</div>
<div class="overlay" role="dialog" aria-modal="true" id="overlay">
  <div class="panel" id="panel"></div>
</div>
<script>
/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
"use strict";
(() => {
/* ========== 游戏桥适配层（存档/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim();}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),border:v("--g-border"),
    water:v("--g-st-water"),water2:v("--g-st-water2"),line:v("--g-st-line"),
    bub:[v("--g-st-bub1"),v("--g-st-bub2"),v("--g-st-bub3"),v("--g-st-bub4")]};
}
window.__gOnTheme=function(){palLoad();draw();};
palLoad();

var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var scoreEl=document.getElementById("score"),bestEl=document.getElementById("best");
var msgEl=document.getElementById("msg"),btnPause=document.getElementById("btnPause"),btnMain=document.getElementById("btnMain");
var overlay=document.getElementById("overlay"),panel=document.getElementById("panel");
function $(id){return document.getElementById(id);}
function say(t){msgEl.textContent=t;}

var KEY="sw.bubble-line.v1";
var store={
  get:function(k){try{return window.localStorage.getItem(k);}catch(e){return null;}},
  set:function(k,v){try{window.localStorage.setItem(k,v);}catch(e){}}
};
var best=0;
try{best=Math.max(0,parseInt(JSON.parse(store.get(KEY)||"null").best,10)||0);}catch(e){}
bestEl.textContent=best;
function persistBest(){
  store.set(KEY,JSON.stringify({best:best}));
  if(GB.available)GB.saveState("bubble-line",{best:best}).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("bubble-line").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rb=Math.max(0,parseInt(JSON.parse(res.stateJson).best,10)||0);
      if(rb>best){best=rb;bestEl.textContent=best;persistBest();}
    }catch(e){}
  }).catch(function(){});
}

/* ---------- 常量与状态 ---------- */
var R=16,LINK=72,TOP=44,MAXB=14;
var W=0,H=0,dpr=1;
var bubbles=[],score=0,state="ready",paused=false,lastFrame=0,spawnT=0;
var chain=[],chaining=false,cursor=-1,pointer=null;
function fit(){
  var r=cv.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(200,r.width);H=Math.max(200,r.width*4/3);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);

function resetRun(){
  bubbles=[];score=0;spawnT=0;chain=[];chaining=false;cursor=-1;pointer=null;
  state="ready";paused=false;
  scoreEl.textContent="0";
  for(var i=0;i<6;i++)spawnBubble(true);
  btnPause.disabled=true;btnPause.textContent="暂停";btnMain.textContent="开始游戏";
  say("点击「开始」放泡泡");
  draw();
}
function startGame(){
  state="running";paused=false;
  hideOverlay();
  btnPause.disabled=false;btnPause.textContent="暂停";btnMain.textContent="重新开始";
  say("滑过相邻同色气泡 · 3 个以上松手消除");
}
function togglePause(){
  if(state!=="running")return;
  paused=!paused;
  btnPause.textContent=paused?"继续":"暂停";
  if(paused)showPause();else hideOverlay();
  say(paused?"已暂停":"已继续");
}
function gameOver(){
  state="over";
  var isRecord=score>best&&score>0;
  if(isRecord){best=score;bestEl.textContent=best;persistBest();}
  if(GB.available)GB.reportScore("bubble-line",{metricValue:best}).catch(function(){});
  showOver(isRecord);
}
function spawnBubble(anywhere){
  var rise=18+Math.min(22,score/180);
  var b={
    x:20+Math.random()*(W-40),
    y:anywhere?(H*0.35+Math.random()*H*0.6):(H+24),
    vx:(Math.random()-0.5)*10,
    vy:-rise*(0.8+Math.random()*0.5),
    r:R,color:(Math.random()*PAL.bub.length)|0,pop:0
  };
  bubbles.push(b);
}

/* ---------- 连线 ---------- */
function bubbleAt(x,y){
  for(var i=bubbles.length-1;i>=0;i--){
    var b=bubbles[i];
    if(b.pop)continue;
    if(Math.hypot(x-b.x,y-b.y)<=b.r+8)return i;
  }
  return -1;
}
function tryAdd(idx){
  if(idx<0||chain.indexOf(idx)>=0)return;
  var b=bubbles[idx];if(!b||b.pop)return;
  if(!chain.length){chain.push(idx);return;}
  var last=bubbles[chain[chain.length-1]];
  if(b.color!==last.color)return;
  if(Math.hypot(b.x-last.x,b.y-last.y)>LINK)return;
  chain.push(idx);
}
function backtrack(idx){
  if(chain.length<2)return;
  if(chain[chain.length-2]===idx){chain.pop();}
}
function confirmChain(){
  if(chain.length>=3){
    var gain=chain.length*10+(chain.length-3)*5;
    score+=gain;scoreEl.textContent=String(score);
    for(var i=0;i<chain.length;i++)bubbles[chain[i]].pop=1;
    say("消除 "+chain.length+" 个 +"+gain);
    chain=[];chaining=false;
  }else{
    chain=[];chaining=false;
    if(state==="running")say("至少连 3 个同色气泡");
  }
}
function cancelChain(){chain=[];chaining=false;}

/* ---------- 更新 ---------- */
function update(dt){
  spawnT-=dt;
  if(spawnT<=0&&bubbles.filter(function(b){return!b.pop;}).length<MAXB){
    spawnBubble(false);spawnT=0.85;
  }
  for(var i=bubbles.length-1;i>=0;i--){
    var b=bubbles[i];
    if(b.pop){b.pop+=dt*6;if(b.pop>=1)bubbles.splice(i,1);continue;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);}
    if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);}
    if(b.y-b.r<TOP){say("泡泡顶到水面线！");gameOver();return;}
  }
}

/* ---------- 渲染 ---------- */
function drawBubble(b,alpha){
  var r=b.r*(b.pop?Math.max(0.2,1-b.pop):1);
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle=PAL.bub[b.color];
  ctx.beginPath();ctx.arc(b.x,b.y,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.45)";
  ctx.beginPath();ctx.arc(b.x-r*0.3,b.y-r*0.3,r*0.28,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.water;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=PAL.water2;
  for(var w=0;w<5;w++){
    var wy=TOP+30+w*((H-TOP-40)/5);
    ctx.fillRect(0,wy,W,2);
  }
  ctx.strokeStyle=PAL.line;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,TOP);ctx.lineTo(W,TOP);ctx.stroke();
  ctx.fillStyle=PAL.muted;ctx.font="700 12px system-ui,sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText("水面线",8,TOP-12);
  // 连线
  if(chain.length){
    ctx.strokeStyle=PAL.surface;ctx.lineWidth=4;ctx.lineCap="round";ctx.lineJoin="round";
    ctx.beginPath();
    for(var i=0;i<chain.length;i++){
      var b=bubbles[chain[i]];
      if(i===0)ctx.moveTo(b.x,b.y);else ctx.lineTo(b.x,b.y);
    }
    if(pointer&&chaining)ctx.lineTo(pointer.x,pointer.y);
    ctx.stroke();
  }
  for(var j=0;j<bubbles.length;j++)drawBubble(bubbles[j]);
  //  cursor
  if(cursor>=0&&bubbles[cursor]&&state==="running"&&!paused){
    var c=bubbles[cursor];
    ctx.strokeStyle=PAL.text;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(c.x,c.y,c.r+5,0,Math.PI*2);ctx.stroke();
  }
}

/* ---------- 覆盖层 ---------- */
function showPanel(html){panel.innerHTML=html;overlay.classList.add("show");}
function hideOverlay(){overlay.classList.remove("show");}
function showStart(){
  showPanel(
    '<p class="rt">准备开始</p>'+
    '<p class="rs">同色气泡三连上浮消除 · 最高分 <b>'+best+'</b></p>'+
    '<div class="rbtns"><button class="btn" id="ovMain" type="button">开始游戏</button></div>'+
    '<p class="rhint">按住并滑过相邻同色气泡，连成 3 个以上松手消除。气泡持续上浮，任何一颗顶到水面线即失败；连锁越长分越高。</p>'
  );
  $("ovMain").addEventListener("click",function(){startGame();});
}
function showPause(){
  showPanel(
    '<p class="rt">已暂停</p>'+
    '<p class="rs">当前分数 <b>'+score+'</b></p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovRetryP" type="button">重新开始</button>'+
      '<button class="btn" id="ovResume" type="button">继续</button>'+
    '</div>'
  );
  $("ovResume").addEventListener("click",function(){togglePause();});
  $("ovRetryP").addEventListener("click",function(){resetRun();startGame();});
}
function showOver(isRecord){
  showPanel(
    '<p class="rt">游戏结束</p>'+
    '<p class="rs">得分 <b>'+score+'</b>'+(isRecord?' · 新纪录':'')+'</p>'+
    '<p class="rs">最高分 '+best+'</p>'+
    '<div class="rbtns"><button class="btn" id="ovRetry" type="button">再来一局</button></div>'
  );
  $("ovRetry").addEventListener("click",function(){resetRun();startGame();});
}

/* ---------- 输入 ---------- */
function canvasPos(e){
  var r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  if(state!=="running"||paused)return;
  var p=canvasPos(e);pointer=p;
  var idx=bubbleAt(p.x,p.y);
  chaining=true;chain=[];
  if(idx>=0)tryAdd(idx);
  cursor=idx;
});
cv.addEventListener("pointermove",function(e){
  if(!chaining)return;
  var p=canvasPos(e);pointer=p;
  var idx=bubbleAt(p.x,p.y);
  if(idx<0)return;
  if(chain.length&&chain[chain.length-1]===idx)return;
  if(chain.length>=2&&chain[chain.length-2]===idx){backtrack(idx);return;}
  tryAdd(idx);
});
cv.addEventListener("pointerup",function(){
  if(!chaining)return;
  chaining=false;pointer=null;
  confirmChain();
});
cv.addEventListener("pointercancel",function(){chaining=false;pointer=null;cancelChain();});
function moveCursor(dx,dy){
  if(!bubbles.length)return;
  if(cursor<0){cursor=0;return;}
  var c=bubbles[cursor],best=-1,bd=1e9;
  for(var i=0;i<bubbles.length;i++){
    if(i===cursor||bubbles[i].pop)continue;
    var b=bubbles[i];
    var vx=b.x-c.x,vy=b.y-c.y;
    var dot=vx*dx+vy*dy;
    if(dot<=0)continue;
    var d=Math.hypot(vx,vy);
    var score=dot/d;
    if(score>0.3&&d<bd){bd=d;best=i;}
  }
  if(best>=0)cursor=best;
}
document.addEventListener("keydown",function(e){
  if(e.repeat)return;
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowLeft"||k==="a"){e.preventDefault();moveCursor(-1,0);}
  else if(k==="ArrowRight"||k==="d"){e.preventDefault();moveCursor(1,0);}
  else if(k==="ArrowUp"||k==="w"){e.preventDefault();moveCursor(0,-1);}
  else if(k==="ArrowDown"||k==="s"){e.preventDefault();moveCursor(0,1);}
  else if(k===" "||k==="Enter"){
    e.preventDefault();
    if(state!=="running"){if(state==="ready"||state==="over")startGame();return;}
    if(paused)return;
    if(!chaining){chaining=true;chain=[];if(cursor>=0)tryAdd(cursor);}
    else if(cursor>=0){tryAdd(cursor);}
    if(k==="Enter")confirmChain();
  }
  else if(k==="Backspace"){e.preventDefault();if(chain.length)chain.pop();}
  else if(k==="Escape"){cancelChain();}
});
btnPause.addEventListener("click",togglePause);
btnMain.addEventListener("click",function(){
  if(state==="running"){resetRun();startGame();}
  else startGame();
});
document.addEventListener("visibilitychange",function(){if(document.hidden&&state==="running"&&!paused)togglePause();});

/* ---------- 主循环 ---------- */
function loop(now){
  requestAnimationFrame(loop);
  var dt=((now-lastFrame)/1000)||0.016;lastFrame=now;
  if(dt>0.05)dt=0.05;
  if(state==="running"&&!paused)update(dt);
  draw();
}

fit();
resetRun();
requestAnimationFrame(loop);
syncSaveFromServer();
showStart();
})();
</script>
