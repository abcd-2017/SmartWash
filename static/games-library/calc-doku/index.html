    touch-action: manipulation; overscroll-behavior: none;

  .wrap { width: 100%; max-width: 480px; }

    display: none; align-items: center; justify-content: center; padding: 20px;
  }

  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;

    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;

  .panel .btn:last-child { margin-bottom: 0; }

  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;

  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;

      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},

})();

var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list.map(normalizeLevel);return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
      if(typeof resize==="function")resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层（lvgrid 通用） ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  var u=$("ovUndo");
  if(u)u.hidden=true;
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

/* 单条结构校验 */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.n)||d.n<3||d.n>9)return false;
  if(!Array.isArray(d.cages)||!d.cages.length)return false;
  var seenCell={};
  for(var i=0;i<d.cages.length;i++){
    var cg=d.cages[i];
    if(!cg||typeof cg!=="object"||Array.isArray(cg))return false;
    if(typeof cg.c!=="string")return false;
    var parts=cg.c.split(",");
    if(parts.length<1||parts.length>4)return false;
    for(var j=0;j<parts.length;j++){
      var x=+parts[j];
      if(!Number.isInteger(x)||x<0||x>=d.n*d.n)return false;
      if(seenCell[x])return false;   // 每格恰属一笼
      seenCell[x]=1;
    }
    if(["+","-","*","/","="].indexOf(cg.o)<0)return false;
    if(!Number.isInteger(cg.t)||cg.t<1||cg.t>999)return false;
    if(cg.o==="="&&parts.length!==1)return false;
    if((cg.o==="-"||cg.o==="/")&&parts.length!==2)return false;
  }
  if(Object.keys(seenCell).length!==d.n*d.n)return false;   // 全覆盖
  return true;
}
/* ---------- 独立求解器：行序回溯（用于加载复核与提示） ---------- */
function calcSolve(n,cages,grid,collectAll){
  var cageOf=new Array(n*n).fill(-1);
  var cageCells=cages.map(function(cg){return cg.c.split(",").map(Number)});
  cages.forEach(function(cg,i){cg.c.split(",").forEach(function(x){cageOf[+x]=i})});
  var rowUsed=Array.from({length:n},function(){return new Set()});
  var colUsed=Array.from({length:n},function(){return new Set()});
  var cageVals=cages.map(function(){return []});
  var sol=null,sols=[];
  function cageOk(i,d){
    var o=cages[i].o,t=cages[i].t;
    var vs=(d===null)?cageVals[i]:cageVals[i].concat(d);
    var k=cageCells[i].length;
    if(o==="+"){var s=vs.reduce(function(a,b){return a+b},0);return vs.length===k?s===t:s<t;}
    if(o==="*"){var p=vs.reduce(function(a,b){return a*b},1);return vs.length===k?p===t:(p>0&&t%p===0);}
    if(vs.length<k)return true;
    if(o==="-")return Math.abs(vs[0]-vs[1])===t;
    if(o==="/")return Math.max(vs[0],vs[1])/Math.min(vs[0],vs[1])===t;
    return vs[0]===t;
  }
  function dfs(cell){
    if(collectAll&&sols.length>=2)return;
    if(!collectAll&&sol)return;
    if(cell===n*n){
      for(var i=0;i<cages.length;i++)if(!cageOk(i,null))return;
      sol=grid.slice();
      if(collectAll)sols.push(grid.slice());
      return;
    }
    var r=Math.floor(cell/n),c=cell%n;
    for(var d=1;d<=n;d++){
      if(rowUsed[r].has(d)||colUsed[c].has(d))continue;
      var ci=cageOf[cell];
      if(ci>=0&&!cageOk(ci,d))continue;
      grid[cell]=d;
      rowUsed[r].add(d);colUsed[c].add(d);
      if(ci>=0)cageVals[ci].push(d);
      dfs(cell+1);
      if(ci>=0)cageVals[ci].pop();
      rowUsed[r].delete(d);colUsed[c].delete(d);
      grid[cell]=0;
    }
  }
  dfs(0);
  return collectAll?sols:sol;
}
function calcVerify(L){
  var grid=new Array(L.n*L.n).fill(0);
  var sol=calcSolve(L.n,L.cages,grid,false);
  return !!sol;
}
/* ---------- 调色板（DOM 直用 token） ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  PAL={deep:s.getPropertyValue("--g-primary-deep").trim()};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,n=0,cageOf=null,cageCells=null;
var grid=[],history=[],curCell=0,done=false;
var CGBG=["var(--g-st-cg1)","var(--g-st-cg2)","var(--g-st-cg3)","var(--g-st-cg4)"];
var OPSYM={"+":"+","-":"−","*":"×","/":"÷","=":"="};
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(nl){
  lv=Math.max(0,Math.min(nl,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  n=L.n;
  cageOf=new Array(n*n).fill(-1);
  cageCells=L.cages.map(function(cg){return cg.c.split(",").map(Number)});
  L.cages.forEach(function(cg,i){cg.c.split(",").forEach(function(x){cageOf[+x]=i})});
  var ok=calcVerify(L);   // 加载复核：唯一解关卡仍可解
  grid=new Array(n*n).fill(0);history=[];curCell=0;done=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=n+"×"+n+" · "+L.cages.length+" 笼";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stTotal").textContent=n*n;
  if(!ok)say("警告：内嵌求解器未能复核本关（数据异常）");
  else say("每行每列 1-"+n+" 不重复，各笼满足左上角运算目标");
  render();updStats();
}
function filled(){
  var c=0;for(var i=0;i<n*n;i++)if(grid[i])c++;
  return c;
}
function updStats(){
  $("stFilled").textContent=filled();
  $("btnUndo").disabled=!history.length||done;
}
function cageLabel(k){
  var ci=cageOf[k];
  if(ci<0)return "";
  var cg=L.cages[ci];
  var first=cageCells[ci][0];
  if(first!==k)return "";
  return cg.t+(OPSYM[cg.o]||cg.o);
}
function cageErr(ci){
  var cg=L.cages[ci],vs=[];
  for(var m=0;m<cageCells[ci].length;m++){
    var v=grid[cageCells[ci][m]];
    if(!v)return false;   // 未满不判错
    vs.push(v);
  }
  var o=cg.o,t=cg.t,k=vs.length;
  if(o==="+")return vs.reduce(function(a,b){return a+b},0)!==t;
  if(o==="*")return vs.reduce(function(a,b){return a*b},1)!==t;
  if(o==="-")return Math.abs(vs[0]-vs[1])!==t;
  if(o==="/")return Math.max(vs[0],vs[1])/Math.min(vs[0],vs[1])!==t;
  return vs[0]!==t;
}
function cellErr(k){
  var r=Math.floor(k/n),c=k%n,v=grid[k];
  if(!v)return false;
  for(var i=0;i<n;i++){
    if(i!==c&&grid[r*n+i]===v)return true;
    if(i!==r&&grid[i*n+c]===v)return true;
  }
  return cageErr(cageOf[k]);
}
/* ---------- 渲染 ---------- */
function render(){
  var board=$("cboard");
  board.style.gridTemplateColumns="repeat("+n+",1fr)";
  board.innerHTML="";
  var cageColIdx={};
  var colCount=0;
  for(var i=0;i<L.cages.length;i++){
    var first=cageCells[i][0];
    if(cageColIdx[first]===undefined)cageColIdx[first]=colCount++%4;
  }
  for(var k=0;k<n*n;k++){
    (function(k){
      var d=document.createElement("button");
      d.type="button";
      var cls="ccell";
      var r=Math.floor(k/n),c=k%n;
      // 笼底色与粗边框（与异笼相邻处加粗）
      var ci=cageOf[k];
      if(ci>=0){
        var fi=cageCells[ci][0];
        d.style.background=CGBG[cageColIdx[fi]||0];
        if(c>0&&cageOf[k-1]!==ci)d.style.boxShadow="inset 1px 0 0 var(--g-border)";
        if(c<n-1&&cageOf[k+1]!==ci)d.style.boxShadow="inset -1px 0 0 var(--g-border)";
        if(r>0&&cageOf[k-n]!==ci)d.style.boxShadow="inset 0 1px 0 var(--g-border)";
        if(r<n-1&&cageOf[k+n]!==ci)d.style.boxShadow="inset 0 -1px 0 var(--g-border)";
        if(c>0&&cageOf[k-1]!==ci&&r>0&&cageOf[k-n]!==ci)d.style.boxShadow="inset 1px 1px 0 var(--g-border)";
        if(c>0&&cageOf[k-1]!==ci&&r<n-1&&cageOf[k+n]!==ci)d.style.boxShadow="inset 1px -1px 0 var(--g-border)";
        if(c<n-1&&cageOf[k+1]!==ci&&r>0&&cageOf[k-n]!==ci)d.style.boxShadow="inset -1px 1px 0 var(--g-border)";
        if(c<n-1&&cageOf[k+1]!==ci&&r<n-1&&cageOf[k+n]!==ci)d.style.boxShadow="inset -1px -1px 0 var(--g-border)";
      }
      var lab=cageLabel(k);
      var val=grid[k];
      d.innerHTML=(lab?'<span class="ct">'+lab+'</span>':"")+(val?'<span class="cv">'+val+'</span>':"");
      if(cellErr(k))cls+=" err";
      if(curCell===k)cls+=" cur";
      d.className=cls;
      d.setAttribute("aria-label","格 "+(k+1));
      d.addEventListener("click",function(){curCell=k;render()});
      board.appendChild(d);
    })(k);
  }
  var keys=$("keys");keys.innerHTML="";
  for(var v2=1;v2<=n;v2++){
    (function(v2){
      var b=document.createElement("button");
      b.className="key";b.textContent=v2;
      b.addEventListener("click",function(){putNum(v2)});
      keys.appendChild(b);
    })(v2);
  }
  var bc=document.createElement("button");
  bc.className="key";bc.textContent="清";
  bc.addEventListener("click",function(){putNum(0)});
  keys.appendChild(bc);
}
function putNum(v){
  if(done)return;
  var k=curCell;
  if(grid[k]===v)return;
  history.push({k:k,prev:grid[k]});
  grid[k]=v;
  render();updStats();
  if(filled()===n*n){
    var allOk=true;
    for(var i=0;i<n*n;i++)if(cellErr(i)){allOk=false;break;}
    if(allOk){winLevel();return;}
    say("填满了，但还有冲突格（标红处）");
  }
}
function undo(){
  if(!history.length||done)return;
  var h=history.pop();
  grid[h.k]=h.prev;
  render();updStats();say("已撤销");
}
function hint(){
  if(done)return;
  var sols=calcSolve(n,L.cages,grid.slice(),true);
  if(!sols.length){say("内嵌求解器：当前局面无解，撤销几步再试");return;}
  // 取一个与当前盘面一致的确定格：多解时找所有解中同格同值的格
  var k=-1,v=0;
  if(sols.length===1){
    for(var i=0;i<n*n;i++){if(!grid[i]&&sols[0][i]){k=i;v=sols[0][i];break;}}
  }else{
    for(var i2=0;i2<n*n&&k<0;i2++){
      if(grid[i2])continue;
      var same=true;
      for(var s2=1;s2<sols.length;s2++)if(sols[s2][i2]!==sols[0][i2]){same=false;break;}
      if(same){k=i2;v=sols[0][i2];}
    }
    if(k<0){say("提示：当前还有多种可能，先从行列排除入手");return;}
  }
  var board=$("cboard").children;
  if(board[k]){
    board[k].classList.add("hintc");
    setTimeout(function(){if(board[k])board[k].classList.remove("hintc")},1600);
  }
  say("求解器建议：格 "+(k+1)+" 填 "+v);
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:history.length}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"解开了！";
  $("ovDesc").innerHTML=n+"×"+n+" 算独完成，用 "+history.length+" 步填入"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>44 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 输入 ---------- */
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(done)return;openLevelSelect()});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowUp"){curCell=Math.max(0,curCell-n);render();e.preventDefault();}
  else if(k==="ArrowDown"){curCell=Math.min(n*n-1,curCell+n);render();e.preventDefault();}
  else if(k==="ArrowLeft"){curCell=Math.max(0,curCell-1);render();e.preventDefault();}
  else if(k==="ArrowRight"){curCell=Math.min(n*n-1,curCell+1);render();e.preventDefault();}
  else if(k>="1"&&k<="9"){var v=parseInt(k,10);if(v<=n)putNum(v);e.preventDefault();}
  else if(k==="Backspace"||k==="Delete"||k==="0"){putNum(0);e.preventDefault();}
  else if(k===" "||k==="Enter"){if($("overlay").classList.contains("show"))$("ovBtn").click();e.preventDefault();}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);
syncLevelsFromServer();syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
