<head>

<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材（--g-st- 前缀素材 token，本游戏专用）*/
  :root {
    --g-bg:#F5F6F3; --g-surface:#FFFFFF; --g-surface2:#EFF1EE;
    --g-primary:#2D9B6A; --g-primary-deep:#17734A; --g-btn-primary:#17734A; --g-primary-soft:#E8F6EF; --g-on-primary:#FFFFFF; --g-on-soft:#0B3625;
    --g-text:#1C1C1E; --g-muted:#6B6E73; --g-faint:#A9AEA9; --g-border:#E6E9E6; --g-hairline:#EFF1EE;
    --g-danger:#A83850; --g-warning:#9A6210; --g-success:#17734A; --g-water:#4A9FD4;
    --g-scrim:rgba(245,246,243,.9);
    --g-shadow:0 2px 12px rgba(20,40,30,.05);
    --g-radius:16px; --g-radius-btn:14px; --g-radius-inner:12px; --g-gap:16px;
    /*素材:a=河面 b=浪带白沫 c=礁石 d=河底深水 e=原木 f=浪尖高光*/
    --g-st-a:#4A9FD4; --g-st-b:#EAF6FC; --g-st-c:#8A8F96; --g-st-d:#2E6E96; --g-st-e:#8A6E4A; --g-st-f:#FFFFFF;

    color-scheme:light;
  }
  :root[data-theme=dark] {
    --g-bg:#141614; --g-surface:#1D201E; --g-surface2:#262A27;
    --g-primary-deep:#5BC894; --g-primary-soft:#1D3229; --g-on-soft:#B9E8CF;
    --g-text:#E6E9E6; --g-muted:#A9AEA9; --g-faint:#7E837D; --g-border:#2C312D; --g-hairline:#262A27;
    --g-danger:#DB7186; --g-warning:#E2A44E; --g-success:#4ADE6E; --g-water:#6BB4DE;
    --g-scrim:rgba(20,22,20,.9);
    --g-shadow:0 2px 12px rgba(0,0,0,.28);
    --g-st-a:#2E6E96; --g-st-b:#3E5E74; --g-st-c:#565C64; --g-st-d:#1D4258; --g-st-e:#554833; --g-st-f:#B9D8EA;
/*==EXTRA==*/
  canvas#cv { aspect-ratio: 390/560; background: var(--g-st-a); }

    color-scheme:dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.5; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 12px;
    min-width: 70px; padding: 5px 8px; text-align: center; line-height: 1.3;
  }
  .score-box .label { display: block; font-size: 12px; white-space: nowrap; }
  .score-box .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stage { position: relative; }
  canvas {
    display: block; width: 100%; height: auto;
    border: 1px solid var(--g-border); border-radius: 12px;
    touch-action: none;
  }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 16px; flex: 1;
    border: 0; border-radius: 14px;
    background: var(--g-btn-primary); color: var(--g-on-primary);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    touch-action: manipulation;
  }
  .btn:active { opacity: .85; }
  .btn.ghost { background: var(--g-surface2); color: var(--g-text); border: 1px solid var(--g-border); }
  .btn:disabled { opacity: .4; cursor: default; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; max-height: 100%; overflow: auto;
    background: var(--g-surface); border: 1px solid var(--g-border); border-radius: 16px;
    box-shadow: var(--g-shadow); padding: 22px 18px; text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; }
  }
  .rt { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
  .rs { margin: 0 0 14px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .rs b { color: var(--g-primary-deep); font-size: 22px; font-variant-numeric: tabular-nums; }
  .rbtns { display: flex; gap: 10px; margin-top: 16px; }
  .rbtns .btn { flex: 1; }
  .rhint { margin: 14px 0 0; font-size: 12px; color: var(--g-muted); line-height: 1.6; text-align: left; }
  .lv-wrap { width: 100%; max-width: 320px; max-height: 46vh; overflow-y: auto; margin-top: 6px; }
  .lv-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .lv-chip {
    min-height: 44px; border: 1px solid var(--g-border); border-radius: 10px;
    background: var(--g-surface); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    touch-action: manipulation;
  }
  .lv-chip.sel { border-color: var(--g-primary); box-shadow: inset 0 0 0 1.5px var(--g-primary); background: var(--g-primary-soft); color: var(--g-on-soft); }
  .lv-chip.done { background: var(--g-btn-primary); border-color: var(--g-primary); color: var(--g-on-primary); }
  .lv-chip:disabled { opacity: .38; cursor: not-allowed; }
  canvas#cv { aspect-ratio: 390/560; background: var(--g-st-a); }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（动效层指令，不受 §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
  /* P2: 键盘焦点可见 */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<body>
<div class="wrap">
<header>
  <span class="sub">顺流而下 · 避礁借浪</span>
  <div class="scores">

<script>
/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 调色板（颜色全部经 CSS 变量读取，JS 零颜色字面量） ========== */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim();}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),text:v("--g-text"),
    muted:v("--g-muted"),faint:v("--g-faint"),border:v("--g-border"),hairline:v("--g-hairline"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    onSoft:v("--g-on-soft"),onPrimary:v("--g-on-primary"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),
    stA:v("--g-st-a"),stB:v("--g-st-b"),stC:v("--g-st-c"),stD:v("--g-st-d"),stE:v("--g-st-e"),stF:v("--g-st-f")};
}
window.__gOnTheme=function(){palLoad();if(typeof draw==="function")draw();};
palLoad();

/* ========== 通用工具与覆盖层面板 ========== */
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
var overlayEl=$("overlay"),panelEl=$("panel");
function showPanel(html){panelEl.innerHTML=html;overlayEl.classList.add("show");}
function hideOverlay(){overlayEl.classList.remove("show");}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}

/* ==================== 激流皮划艇（纵向水流 + 浮力节奏 + 横向流带，分数驱动） ==================== */
var GAME_KEY="canoe-rapids",SAVE_KEY="sw.canoerapids.v1";

/* ---------- 状态 ---------- */
var best=loadBestNum();
var NW=390,NH=560,W=390,H=560,S=1,offX=0,offY=0;
var cv=$("cv"),ctx=cv.getContext("2d");
var scoreEl=$("score"),bestEl=$("best"),hpEl=$("hp"),msgEl=$("msg"),mainBtn=$("mainBtn");
var state="ready",paused=false;
var camY=0,x=195,vx=0,hp=2,invuln=0,shakeT=0,burstT=0,burstCd=0;
var rocks=[],logs=[],whirls=[],waves=[],currents=[],nextY=560;
var keys={left:false,right:false};
var CAY=NH*0.62;
function say(t){msgEl.textContent=t;}
function flowV(){return 170+Math.min(130,camY/50)+(burstT>0?120:0);}
function curScore(){return Math.floor(camY/50);}
function refresh(){
  scoreEl.textContent=String(curScore());
  bestEl.textContent=String(best);
  hpEl.textContent=String(hp);
}

/* ---------- 画布 ---------- */
function rr(x0,y0,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x0+r,y0);
  ctx.arcTo(x0+w,y0,x0+w,y0+h,r);ctx.arcTo(x0+w,y0+h,x0,y0+h,r);
  ctx.arcTo(x0,y0+h,x0,y0,r);ctx.arcTo(x0,y0,x0+w,y0,r);
  ctx.closePath();
}
function fit(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));H=Math.max(300,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);offX=(W-NW*S)/2;offY=(H-NH*S)/2;
  draw();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);
function sy(wy){return wy-camY+CAY;}

/* ---------- 生成 ---------- */
function spawnAhead(){
  while(nextY<camY+(NH-CAY)+80){
    var roll=Math.random();
    if(roll<0.34)rocks.push({x:30+Math.random()*(NW-60),y:nextY,r:14+Math.random()*13});
    else if(roll<0.52)logs.push({x:40+Math.random()*(NW-150),y:nextY,w:60+Math.random()*50,h:14});
    else if(roll<0.66)whirls.push({x:60+Math.random()*(NW-120),y:nextY,r:32,spin:0});
    else if(roll<0.82)waves.push({y:nextY,h:48});
    else currents.push({y:nextY,h:64,dir:Math.random()<0.5?-1:1});
    nextY+=170+Math.random()*160;
  }
  function prune(arr,lim){for(var i=arr.length-1;i>=0;i--)if(sy(arr[i].y)<-70)arr.splice(i,1);}
  prune(rocks,0);prune(logs,0);prune(whirls,0);prune(waves,0);prune(currents,0);
}

/* ---------- 流程 ---------- */
function resetRound(){
  camY=0;x=195;vx=0;hp=2;invuln=0;shakeT=0;burstT=0;burstCd=0;
  rocks=[];logs=[];whirls=[];waves=[];currents=[];nextY=560;
  refresh();
}
function startGame(){
  resetRound();
  state="running";paused=false;
  hideOverlay();
  mainBtn.textContent="暂停";
  say("左右划桨避礁，浪带顺流加速");
}
function primary(){
  if(state==="running"){
    paused=!paused;
    if(paused){showPause();mainBtn.textContent="继续";}
    else{hideOverlay();mainBtn.textContent="暂停";}
  }else if(state==="paused"){
    paused=false;hideOverlay();mainBtn.textContent="暂停";
  }else startGame();
}
function damage(why){
  if(invuln>0)return;
  hp--;invuln=1.2;shakeT=0.35;
  refresh();
  say(why+"！剩余船体 "+hp);
  if(hp<=0)die();
}
function die(){
  if(state!=="running")return;
  state="over";
  var sc=curScore();
  var rec=sc>best&&sc>0;
  if(rec){best=sc;persistBestNum(best);}
  reportBest(best);
  refresh();
  mainBtn.textContent="重新开始";
  showOver(rec);
}
function burst(){
  if(state!=="running"||paused)return;
  if(burstCd<=0){burstT=0.5;burstCd=1.1;}
}

/* ---------- 更新 ---------- */
function step(dt){
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt);
  if(invuln>0)invuln=Math.max(0,invuln-dt);
  if(burstT>0)burstT-=dt;
  if(burstCd>0)burstCd-=dt;
  /* 浪带浮力：在浪中顺流更快 */
  var inWave=false;
  for(var wv0=0;wv0<waves.length;wv0++){
    if(Math.abs(sy(waves[wv0].y)-CAY)<waves[wv0].h/2){inWave=true;break;}
  }
  camY+=flowV()*dt+(inWave?85*dt:0);
  var ax=0;
  if(keys.left&&!keys.right)ax-=430;
  else if(keys.right&&!keys.left)ax+=430;
  else if(touchX!==null)ax=clamp(touchX-x,-1,1)*430;
  /* 横向流带推拽 */
  for(var ci=0;ci<currents.length;ci++){
    var cu=currents[ci];
    if(Math.abs(sy(cu.y)-CAY)<cu.h/2)ax+=cu.dir*115;
  }
  /* 漩涡吸附 */
  for(var wi=0;wi<whirls.length;wi++){
    var wh=whirls[wi];
    wh.spin+=dt*2.6;
    var dx=wh.x-x,dyc=sy(wh.y)-CAY,d=Math.hypot(dx,dyc);
    if(d<wh.r+34&&d>1){
      ax+=dx/d*150*(1-d/(wh.r+34));
      if(d<15)damage("卷入漩涡");
    }
  }
  vx+=ax*dt;
  vx*=Math.max(0,1-2.6*dt);
  x=clamp(x+vx*dt,18,NW-18);
  spawnAhead();
  /* 碰撞 */
  for(var ri=0;ri<rocks.length;ri++){
    var rk=rocks[ri];
    if(Math.hypot(rk.x-x,sy(rk.y)-CAY)<rk.r+13)damage("撞上礁石");
  }
  for(var li=0;li<logs.length;li++){
    var lg=logs[li];
    if(x+12>lg.x&&x-12<lg.x+lg.w&&Math.abs(sy(lg.y)-CAY)<lg.h/2+11)damage("撞上原木");
  }
  var ns=curScore();
  if(ns!==lastScore){lastScore=ns;scoreEl.textContent=String(ns);}
}
var lastScore=-1,touchX=null,touchT0=0,touchMoved=false;

/* ---------- 绘制 ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(offX,offY);ctx.scale(S,S);
  if(shakeT>0){var a=shakeT/0.35;ctx.translate(Math.sin(shakeT*46)*4*a,0);}
  ctx.fillStyle=PAL.stA;ctx.fillRect(0,0,NW,NH);
  /* 流水纹 */
  ctx.strokeStyle=PAL.stD;ctx.lineWidth=2;
  for(var l=0;l<8;l++){
    var lx=((l*55+ (l%2)*23)%(NW-20))+10;
    var ly=((l*173-camY*1.15)%NH+NH)%NH;
    ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,ly+34);ctx.stroke();
  }
  var i;
  /* 横向流带 */
  for(i=0;i<currents.length;i++){
    var cu=currents[i],cy2=sy(cu.y);
    if(cy2<-80||cy2>NH+80)continue;
    ctx.fillStyle=PAL.stD;
    ctx.globalAlpha=0.3;
    ctx.fillRect(0,cy2-cu.h/2,NW,cu.h);
    ctx.globalAlpha=1;
    ctx.fillStyle=PAL.stB;
    for(var ch=0;ch<6;ch++){
      var cx2=30+ch*62+cu.dir*40;
      cx2=((cx2%NW)+NW)%NW;
      ctx.beginPath();
      ctx.moveTo(cx2-cu.dir*8,cy2-7);ctx.lineTo(cx2+cu.dir*8,cy2);ctx.lineTo(cx2-cu.dir*8,cy2+7);
      ctx.closePath();ctx.fill();
    }
  }
  /* 浪带 */
  for(i=0;i<waves.length;i++){
    var wv=waves[i],wy2=sy(wv.y);
    if(wy2<-80||wy2>NH+80)continue;
    ctx.fillStyle=PAL.stB;
    ctx.globalAlpha=0.75;
    ctx.beginPath();
    ctx.moveTo(0,wy2-wv.h/2);
    for(var wx2=0;wx2<=NW;wx2+=26)ctx.lineTo(wx2,wy2-wv.h/2+Math.sin(wx2*0.08+wv.y)*7);
    for(var wx3=NW;wx3>=0;wx3-=26)ctx.lineTo(wx3,wy2+wv.h/2+Math.sin(wx3*0.07+wv.y*1.3)*7);
    ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle=PAL.stF;ctx.lineWidth=2;
    ctx.beginPath();
    for(var wx4=0;wx4<=NW;wx4+=26){
      var yy4=wy2-wv.h/2+Math.sin(wx4*0.08+wv.y)*7;
      if(wx4===0)ctx.moveTo(wx4,yy4);else ctx.lineTo(wx4,yy4);
    }
    ctx.stroke();
  }
  /* 原木 */
  for(i=0;i<logs.length;i++){
    var lg=logs[i],ly2=sy(lg.y);
    if(ly2<-60||ly2>NH+60)continue;
    ctx.fillStyle=PAL.stE;
    rr(lg.x,ly2-lg.h/2,lg.w,lg.h,7);ctx.fill();
    ctx.strokeStyle=PAL.stD;ctx.lineWidth=2;
    rr(lg.x,ly2-lg.h/2,lg.w,lg.h,7);ctx.stroke();
  }
  /* 礁石 */
  for(i=0;i<rocks.length;i++){
    var rk=rocks[i],ry2=sy(rk.y);
    if(ry2<-60||ry2>NH+60)continue;
    ctx.fillStyle=PAL.stC;
    ctx.beginPath();ctx.arc(rk.x,ry2,rk.r,0,6.3);ctx.fill();
    ctx.strokeStyle=PAL.stD;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(rk.x,ry2,rk.r,0,6.3);ctx.stroke();
    ctx.fillStyle=PAL.stB;
    ctx.beginPath();ctx.arc(rk.x-rk.r*0.3,ry2-rk.r*0.35,rk.r*0.35,0,6.3);ctx.fill();
  }
  /* 漩涡 */
  for(i=0;i<whirls.length;i++){
    var wh=whirls[i],why2=sy(wh.y);
    if(why2<-80||why2>NH+80)continue;
    ctx.strokeStyle=PAL.stD;ctx.lineWidth=3;
    for(var arm=0;arm<3;arm++){
      ctx.beginPath();
      for(var tt=0;tt<=1;tt+=0.1){
        var ang=wh.spin+arm*2.09+tt*4.2;
        var rad=wh.r*tt;
        var px2=wh.x+Math.cos(ang)*rad,py2=why2+Math.sin(ang)*rad*0.8;
        if(tt===0)ctx.moveTo(px2,py2);else ctx.lineTo(px2,py2);
      }
      ctx.stroke();
    }
  }
  /* 皮划艇（船头朝下游） */
  ctx.save();
  ctx.translate(x,CAY);
  if(invuln>0&&Math.floor(invuln*10)%2===0)ctx.globalAlpha=0.5;
  ctx.fillStyle=PAL.primary;
  ctx.beginPath();
  ctx.moveTo(0,19);
  ctx.quadraticCurveTo(-12,6,-11,-10);
  ctx.lineTo(11,-10);
  ctx.quadraticCurveTo(12,6,0,19);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;
  ctx.stroke();
  ctx.fillStyle=PAL.onPrimary;
  ctx.beginPath();ctx.arc(0,-2,4.5,0,6.3);ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
  /* 冲刺提示 */
  ctx.fillStyle=PAL.muted;
  ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.fillText(burstT>0?"冲刺！":(burstCd<=0?"冲刺就绪":"划桨中"),14,22);
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

/* ---------- 覆盖层 ---------- */
function showPanel2(title,sub,btn){
  showPanel(
    '<p class="rt">'+title+'</p>'+
    '<p class="rs">'+sub+'</p>'+
    '<div class="rbtns"><button class="btn" id="ovMain" type="button">'+btn+'</button></div>'
  );
  $("ovMain").addEventListener("click",function(){primary();});
}
function showStart(){
  showPanel2("准备开始","顺流避礁木，横向流带会推船，漩涡会吸船；轻点冲刺借浪加速","开始游戏");
  mainBtn.textContent="开始游戏";
}
function showPause(){
  showPanel2("已暂停","里程 "+curScore()+" m · 船体 "+hp,"继续");
  mainBtn.textContent="继续";
}
function showOver(rec){
  showPanel(
    '<p class="rt">'+(rec?"新纪录！":"翻船了")+'</p>'+
    '<p class="rs">里程 <b>'+curScore()+'</b> m</p>'+
    '<div class="rbtns"><button class="btn" id="ovMain" type="button">重新开始</button></div>'
  );
  $("ovMain").addEventListener("click",function(){primary();});
}

/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(ev){
  var r=cv.getBoundingClientRect();
  touchX=(ev.clientX-r.left-offX)/S;
  touchT0=Date.now();touchMoved=false;
  ev.preventDefault();
});
cv.addEventListener("pointermove",function(ev){
  if(touchX===null)return;
  var r=cv.getBoundingClientRect();
  var nx=(ev.clientX-r.left-offX)/S;
  if(Math.abs(nx-touchX)>14)touchMoved=true;
  touchX=nx;
});
cv.addEventListener("pointerup",function(ev){
  if(touchX!==null&&Date.now()-touchT0<180&&!touchMoved)burst();
  touchX=null;
});
cv.addEventListener("pointercancel",function(ev){touchX=null;});
window.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowLeft"||k==="a"){e.preventDefault();keys.left=true;}
  else if(k==="ArrowRight"||k==="d"){e.preventDefault();keys.right=true;}
  else if(k===" "){e.preventDefault();if(state==="running"&&!paused)burst();else primary();}
});
window.addEventListener("keyup",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowLeft"||k==="a")keys.left=false;
  else if(k==="ArrowRight"||k==="d")keys.right=false;
});
mainBtn.addEventListener("click",function(){primary();this.blur();});

/* 切后台自动暂停 */
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running"&&!paused){paused=true;touchX=null;showPause();}
});

/* ---------- 主循环与启动 ---------- */
var last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;
  var dt=Math.min(0.033,((ts-last)/1000)||0);
  last=ts;
  if(state==="running"&&!paused)step(dt);
  draw();
}
fit();
refresh();
showStart();
syncBestFromServer(function(rb){
  if(rb>best){best=rb;persistBestNum(best);refresh();}
});
requestAnimationFrame(loop);


/* ========== 分数驱动公共段（存档双写：本地 + 账号，冲突取高者；仅函数声明） ========== */
function lsGet(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}
function loadBestNum(){
  var v=parseInt(lsGet(SAVE_KEY)||"",10);
  return v>0?v:0;
}
function persistBestNum(b){
  lsSet(SAVE_KEY,String(b));
  if(GB.available)GB.saveState(GAME_KEY,String(b)).catch(function(){});
}
function syncBestFromServer(apply){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rb=parseInt(JSON.parse(res.stateJson),10)||0;
      if(rb>0)apply(rb);
    }catch(e){}
  }).catch(function(){});
}
function reportBest(b,extra){
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:b,metricExtra:extra||null}).catch(function(){});
}

})();
</script>
