/* 状态 = 当前力矩；每放一箱 ±w，要求每一步 |力矩|<=limit。可达集合非空即可平衡。 */
function reachableFrom(start,boxes,limit){
  var set={};set[start]=1;
  for(var i=0;i<boxes.length;i++){
    var nx={},w=boxes[i];
    for(var s in set){
      s=+s;
      if(Math.abs(s+w)<=limit)nx[s+w]=1;
      if(Math.abs(s-w)<=limit)nx[s-w]=1;
    }
    set=nx;
    if(!Object.keys(set).length)return [];
  }
  return Object.keys(set).map(Number);
}

  if(Math.abs(torque-w)<=limit&&reachableFrom(torque-w,rest.slice(1),limit).length)return -1;

}

    sky1:v("--g-cb-sky1"),sky2:v("--g-cb-sky2"),tray:v("--g-cb-tray"),trayHi:v("--g-cb-tray-hi")};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
/* ---------- 状态 ---------- */
var KEY="sw.cargobalance.v1";
function loadSave(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return s}catch(e){}return{}}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}
  if(GB.available)GB.saveState("cargo-balance",save).catch(function(){});
}
var save=loadSave();
save.lv=Math.min(Math.max(parseInt(save.lv,10)||0,0),LEVELS.length-1);
save.done=save.done||{};
var lv=save.lv,L=null,placed=[],idx=0,torque=0,tilt=0,over=false,shakeT=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,dpr=1;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* 覆盖层按钮：图标 + 文案一起重插，避免 textContent 抹掉已注入的 SVG */
function setOvBtn(t,icon){$("ovBtn").innerHTML=window.SW_ICON(icon)+t}
/* ---------- 布局 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=wCss;H=Math.round(W*0.82);
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
/* ---------- 统计 ---------- */
function updStats(){
  $("stLv").textContent=(lv+1)+" / "+LEVELS.length;
  $("stPut").textContent=idx+" / "+L.boxes.length;
  var t=$("stTorque");
  t.textContent=torque+" / "+L.limit;
  t.classList.toggle("low",Math.abs(torque)>L.limit*0.7);
  $("btnUndo").disabled=!placed.length||over;
  $("cLeft").disabled=over||idx>=L.boxes.length;
  $("cRight").disabled=over||idx>=L.boxes.length;
}
/* ---------- 关卡 ---------- */
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return}
  placed=[];idx=0;torque=0;tilt=0;over=false;
  window.__gLevelSolvable=!!levelSolvable(L);   // 开发期校验只挂 window，不进玩家界面
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.boxes.length+" 箱";
  say("点左盘或右盘放置货箱");
  updStats();
}
function place(side){
  if(over||idx>=L.boxes.length)return;
  var w=L.boxes[idx];
  torque+=side*w;
  placed.push({side:side,w:w});
  idx++;
  if(Math.abs(torque)>L.limit){
    over=true;shakeT=Date.now();updStats();
    $("ovTitle").textContent="货架倾覆";
    $("ovDesc").innerHTML="力矩 "+torque+" 超过限位 "+L.limit+"<br>调整放置顺序再试";
    setOvBtn("重试本关","rotate");
    $("overlay").classList.add("show");
    say("货架倾覆！力矩超限");return;
  }
  if(idx>=L.boxes.length){winLevel();return}
  updStats();
  say("已放 " + w + " 到"+(side<0?"左":"右")+"盘 · 力矩 "+torque);
}
function undo(){
  if(!placed.length||over)return;
  var p=placed.pop();
  torque-=p.side*p.w;idx--;
  updStats();say("撤销一步");
}
function hint(){
  if(over)return;
  var rest=L.boxes.slice(idx);
  var s=hintSide(torque,rest,L.limit);
  if(s===null){say("当前局面已无解，先撤销几步");return}
  say("提示：把这箱放到"+(s<0?"左":"右")+"盘仍可保持可平衡");
}
function winLevel(){
  over=true;
  save.done[lv]=true;
  if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
  persist();updStats();
  if(GB.available)GB.reportScore("cargo-balance",{metricValue:lv+1,metricExtra:L.boxes.length}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"过关！";
  $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成<br>最终力矩 "+torque+" / "+L.limit+" · 共 "+L.boxes.length+" 箱";
  setOvBtn((lv>=LEVELS.length-1)?"回到第 1 关":"下一关","play");
  $("overlay").classList.add("show");
}
function failRetry(){
  over=false;placed=[];idx=0;torque=0;tilt=0;
  loadLevel(lv);
}
/* ---------- 主循环（倾斜动画） ---------- */
var lastTs=0;
function step(ts){
  if(!lastTs)lastTs=ts;
  var dt=Math.min(0.05,(ts-lastTs)/1000);lastTs=ts;
  var target=L?Math.max(-1,Math.min(1,torque/L.limit))*0.20:0;
  tilt+=(target-tilt)*Math.min(1,dt*7);
  draw();
  requestAnimationFrame(step);
}
/* ---------- 绘制 ---------- */
/* 货箱：渐变 + 顶部亮面 + 落地投影 */
function drawBox(x,y,w,h,base){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.32)";ctx.shadowBlur=5;ctx.shadowOffsetY=2;
  var g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,colMix(base,WHITE,0.30));g.addColorStop(0.5,base);g.addColorStop(1,colMix(base,BLACK,0.22));
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  ctx.restore();
  ctx.strokeStyle=colMix(base,BLACK,0.4);ctx.lineWidth=1.2;ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  ctx.fillStyle=colMix(base,WHITE,0.5);ctx.fillRect(x+1.5,y+1.5,w-3,2);
}
/* 托盘：绳 + 承接面（亮边 + 面 + 投影）+ 左右标注 */
function drawPan(cx,topY,label){
  ctx.strokeStyle=PAL.beam2;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx,topY);ctx.lineTo(cx,topY+16);ctx.stroke();
  var pw=46,ph=7,py=topY+16;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=5;ctx.shadowOffsetY=2;
  var g=ctx.createLinearGradient(0,py,0,py+ph);
  g.addColorStop(0,PAL.trayHi);g.addColorStop(1,colMix(PAL.tray,BLACK,0.22));
  ctx.fillStyle=g;rr(cx-pw/2,py,pw,ph,3);ctx.fill();
  ctx.restore();
  ctx.strokeStyle=colMix(PAL.tray,BLACK,0.35);ctx.lineWidth=1;rr(cx-pw/2+.5,py+.5,pw-1,ph-1,2.5);ctx.stroke();
  ctx.fillStyle=PAL.muted;ctx.font="600 12px -apple-system,'PingFang SC',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="top";
  ctx.fillText(label,cx,py+ph+3);
}
function draw(){
  // 天地（渐变面）
  var sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,PAL.sky1);sky.addColorStop(1,PAL.sky2);
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  var fx=W/2,fy=Math.round(H*0.66);
  // 底座（渐变 + 投影）
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.28)";ctx.shadowBlur=10;ctx.shadowOffsetY=4;
  var fg=ctx.createLinearGradient(0,fy,0,fy+60);
  fg.addColorStop(0,colMix(PAL.ful,WHITE,0.14));fg.addColorStop(1,colMix(PAL.ful,BLACK,0.30));
  ctx.fillStyle=fg;
  ctx.beginPath();ctx.moveTo(fx-26,fy+52);ctx.lineTo(fx+26,fy+52);ctx.lineTo(fx,fy);ctx.closePath();ctx.fill();
  rr(fx-40,fy+52,80,8,3);ctx.fill();
  ctx.restore();
  // 横梁（随力矩倾斜）
  ctx.save();
  ctx.translate(fx,fy);ctx.rotate(tilt);
  var beamW=Math.min(W-30,300),beamH=14;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=8;ctx.shadowOffsetY=4;
  var bg2=ctx.createLinearGradient(0,-beamH/2,0,beamH/2);
  bg2.addColorStop(0,colMix(PAL.beam,WHITE,0.22));bg2.addColorStop(1,colMix(PAL.beam,BLACK,0.24));
  ctx.fillStyle=bg2;rr(-beamW/2,-beamH/2,beamW,beamH,4);ctx.fill();
  ctx.restore();
  ctx.fillStyle=colMix(PAL.beam,WHITE,0.30);ctx.fillRect(-beamW/2,-beamH/2,beamW,3);
  // 左右托盘（可落点）
  drawPan(-beamW/2+12,beamH/2,"左盘");
  drawPan(beamW/2-12,beamH/2,"右盘");
  // 已放货箱：左右按顺序码放
  var bw=Math.min(26,Math.floor((beamW/2-24)/7)),bh=bw;
  var lCount=0,rCount=0;
  for(var i=0;i<placed.length;i++){
    var p=placed[i];
    var slot=p.side<0?lCount++:rCount++;
    var x0=(p.side<0?-beamW/2+16-slot*bw:beamW/2-16-(slot+1)*bw);
    var y0=-beamH/2-bh;
    drawBox(x0,y0,bw-2,bh,PAL.boxes[i%4]);
    ctx.fillStyle=PAL.text;
    ctx.font="700 12px -apple-system,'PingFang SC',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(String(p.w),x0+(bw-2)/2,y0+bh/2);
  }
  // 当前货箱（横梁中点上方，呼吸选中环）
  if(!over&&idx<L.boxes.length){
    var w=L.boxes[idx];
    var cw=Math.min(40,Math.max(28,bw+8)),ch2=cw;
    var cx0=-cw/2,cy0=-beamH/2-ch2-26;
    drawBox(cx0,cy0,cw,ch2,PAL.boxes[idx%4]);
    var pu=1+0.05*Math.sin(performance.now()/220);
    ctx.globalAlpha=.9;ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;
    rr(cx0-3*pu,cy0-3*pu,cw+6*pu,ch2+6*pu,6);ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle=PAL.text;ctx.font="700 18px -apple-system,'PingFang SC',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(String(w),cx0+cw/2,cy0+ch2/2);
    ctx.fillStyle=PAL.muted;ctx.font="600 12px -apple-system,'PingFang SC',sans-serif";
    ctx.textBaseline="alphabetic";
    ctx.fillText("下一箱",0,cy0-10);
  }
  ctx.restore();
  // 力矩表（轨道 / 安全区 / 旋钮 / 限位）
  var gw=Math.min(240,W-40),gx=(W-gw)/2,gy=H-26;
  ctx.fillStyle=PAL.surface2;rr(gx,gy,gw,10,5);ctx.fill();
  ctx.fillStyle=colMix(PAL.surface2,BLACK,0.10);rr(gx+1,gy+5,gw-2,4,2);ctx.fill();
  ctx.fillStyle=colMix(PAL.success,WHITE,0.25);rr(gx+gw*0.2,gy+2,gw*0.6,6,3);ctx.fill();
  var k=Math.max(-1,Math.min(1,torque/L.limit));
  var knob=Math.abs(k)>0.85?PAL.danger:(Math.abs(k)>0.6?PAL.warning:PAL.success);
  var cw2=20,kx=gx+gw/2+k*(gw/2-cw2/2)-cw2/2;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.35)";ctx.shadowBlur=4;ctx.shadowOffsetY=2;
  var kg=ctx.createLinearGradient(0,gy-2,0,gy+12);
  kg.addColorStop(0,colMix(knob,WHITE,0.35));kg.addColorStop(1,colMix(knob,BLACK,0.18));
  ctx.fillStyle=kg;rr(kx,gy-2,cw2,14,7);ctx.fill();
  ctx.restore();
  ctx.strokeStyle=colMix(knob,BLACK,0.4);ctx.lineWidth=1;rr(kx+.5,gy-1.5,cw2-1,13,6.5);ctx.stroke();
  ctx.fillStyle=PAL.muted;ctx.fillRect(gx+gw/2-.5,gy-4,1,18);
  ctx.fillStyle=PAL.danger;
  ctx.fillRect(gx-2,gy-3,2,16);ctx.fillRect(gx+gw,gy-3,2,16);
  ctx.fillStyle=PAL.muted;ctx.font="600 12px -apple-system,'PingFang SC',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  ctx.fillText("力矩 "+torque+" / "+L.limit,W/2,gy-8);
  if(over&&Math.abs(torque)>L.limit){
    ctx.fillStyle=PAL.danger;ctx.font="700 28px -apple-system,'PingFang SC',sans-serif";
    ctx.textAlign="center";ctx.fillText("倾覆！",W/2,H*0.32);
  }
}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
/* ---------- 输入 ---------- */
$("cLeft").addEventListener("click",function(){place(-1)});
$("cRight").addEventListener("click",function(){place(1)});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    var b=document.createElement("button");
    b.className="lvbtn"+(save.done[i]?" done":"");
    b.textContent=i+1;
    b.disabled=i>save.lv;
    b.addEventListener("click",function(){
      lv=+this.textContent-1;loadLevel(lv);hideOverlay();save.lv=Math.max(save.lv,lv);persist();
    });
    g.appendChild(b);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="通关的关卡标绿";
  setOvBtn("取消","x");
  $("overlay").classList.add("show");
});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(over&&Math.abs(torque)<=L.limit){
    if(lv>=LEVELS.length-1){lv=0;loadLevel(0)}
    else loadLevel(lv+1);
  }else if(over){loadLevel(lv)}
});
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft"){place(-1);e.preventDefault()}
  else if(e.key==="ArrowRight"){place(1);e.preventDefault()}
  else if(e.key==="z"||e.key==="Z"){undo()}
  else if(e.key==="h"||e.key==="H"){hint()}
});
function hideOverlay(){$("overlay").classList.remove("show")}
window.addEventListener("resize",resize);
/* ---------- 启动 ---------- */
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("cargo-balance").then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    applyLevels(list,res.version||0);
    if(lv>LEVELS.length-1)lv=LEVELS.length-1;
    save.lv=Math.min(save.lv,lv);persist();
    loadLevel(lv);
  }).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("cargo-balance").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(r.lv,10)||0;
      if(rl>save.lv){save.lv=Math.min(LEVELS.length-1,rl);changed=true}
      if(r.done&&typeof r.done==="object")for(var k in r.done)if(r.done[k]&&!save.done[k]){save.done[k]=true;changed=true}
      if(changed){persist();loadLevel(save.lv)}
    }catch(e){}
  }).catch(function(){});
}
palLoad();resize();loadLevel(lv);setOvBtn("下一关","play");
requestAnimationFrame(step);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套） */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
/* 按钮图标注入（内联 SVG，零外链；已注入的按钮跳过，避免覆盖） */
(function(){
  function $(id){return document.getElementById(id)}
  var M=[["btnUndo","undo"],["btnHint","bulb"],["btnReset","rotate"],["btnLv","grid"],["cLeft","arrow-left"],["cRight","arrow-right"]],i;
  for(i=0;i<M.length;i++){var b=$(M[i][0]);if(b&&!b.querySelector("svg"))b.insertAdjacentHTML("afterbegin",window.SW_ICON(M[i][1]));}
})();
</script>
