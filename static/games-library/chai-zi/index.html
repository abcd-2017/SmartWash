<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>拆字找字</title>
<style>
  /*token:GAME-THEME.md §2 基线（UI 壳全部走 token；纯 DOM 无 canvas）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#1E8C5C;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#C9526B;--g-warning:#D98A26;--g-success:#2D9B6A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gap:16px;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 2px; text-align: center; line-height: 1.3; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); white-space: nowrap; }
  .board { background: var(--g-surface); border: 1px solid var(--g-border); border-radius: var(--g-radius); padding: 12px; margin-bottom: 10px; text-align: center; }
  /*大母字：字号守八档上限 36px，视觉放大由 transform 承担（不参与布局）*/
  .big { display: block; width: 128px; margin: 24px auto 28px; font-size: 36px; line-height: 1; font-weight: 700; color: var(--g-text); transform: scale(2.2); }
  .prompt { margin: 0 0 4px; font-size: 14px; color: var(--g-muted); }
  .prompt b { font-size: 18px; font-weight: 700; color: var(--g-primary-deep); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .cands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-primary); color: #fff;
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn:active { opacity: .85; }
  .btn.ghost { background: var(--g-surface2); color: var(--g-text); }
  .btn:disabled { opacity: .4; }
  .btn.cand { min-height: 56px; padding: 0; flex: none; font-size: 22px; font-weight: 600; background: var(--g-surface); color: var(--g-text); border: 1px solid var(--g-border); border-radius: var(--g-radius-inner); box-shadow: 0 1px 0 var(--g-border); }
  .btn.cand:active { opacity: .8; }
  .btn.cand.ok { background: var(--g-primary-soft); color: var(--g-on-soft); border-color: transparent; box-shadow: none; }
  .btn.cand.bad { animation: shake .26s ease-in-out; border-color: var(--g-danger); color: var(--g-danger); }
  .btn.cand.peek { box-shadow: inset 0 0 0 2px var(--g-warning); }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .tools { display: flex; gap: 8px; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-faint); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .panel {
    width: 100%; max-width: 320px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 22px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.7; }
  .panel .btn { width: 100%; }
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
paint(B||"light");
})();
</script>
</head>
<body>
<div class="wrap">
  <header><span class="sub">点选母字拆出的部件字 · 点错扣机会</span></header>
  <div class="stats">
    <div class="stat"><span class="label">关卡</span><span class="val" id="stLv">1/120</span></div>
    <div class="stat"><span class="label">部件</span><span class="val" id="stPart">0/2</span></div>
    <div class="stat"><span class="label">时间</span><span class="val" id="stTime">01:30</span></div>
    <div class="stat"><span class="label">机会</span><span class="val" id="stLife">●●●●</span></div>
  </div>
  <div class="board">
    <div class="big" id="big">驾</div>
    <p class="prompt" id="prompt">找出组成「<b>驾</b>」的部件字</p>
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <div class="cands" id="cands"></div>
  <div class="tools">
    <button class="btn ghost" id="btnHint">提示</button>
    <button class="btn ghost" id="btnReset">重玩本关</button>
  </div>
  <p class="foot">部件字＝母字一步拆出的成字部件，偏旁部首不算字<br>例：驾 → 加 + 马 · 湖 → 胡 → 古 + 月 · 进度自动保存</p>
</div>
<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">拆字找字</h2>
    <p class="desc" id="ovDesc"></p>
    <button class="btn" id="ovBtn">开始游戏</button>
  </div>
</div>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
window.__gOnTheme=function(){};//纯 DOM 游戏：颜色随 CSS 变量自动生效，无需重绘
/* ---------- 包内默认关卡（与 .levels.json 前 10 条逐字一致） ---------- */
var DEFAULT_LEVELS=[{"name":"热身·001「土」","char":"土","parts":["十","一"],"distractors":["什","汁","三","几","入","皮"],"time":90,"mistakes":4},{"name":"热身·002「劝」","char":"劝","parts":["又","力"],"distractors":["里","民","街","枝","军","万"],"time":90,"mistakes":4},{"name":"热身·003「功」","char":"功","parts":["工","力"],"distractors":["冰","走","多","身","九","是"],"time":90,"mistakes":4},{"name":"热身·004「叨」","char":"叨","parts":["口","刀"],"distractors":["船","无","衣","去","笔","骨"],"time":90,"mistakes":4},{"name":"热身·005「可」","char":"可","parts":["口","丁"],"distractors":["百","胃","宝","西","友","房"],"time":90,"mistakes":4},{"name":"热身·006「旦」","char":"旦","parts":["日","一"],"distractors":["胆","读","三","几","沙","二"],"time":90,"mistakes":4},{"name":"热身·007「目」","char":"目","parts":["口","二"],"distractors":["干","三","脸","镜","滩","睡"],"time":90,"mistakes":4},{"name":"热身·008「会」","char":"会","parts":["人","云"],"distractors":["亲","皇","窗","七","六","猴"],"time":90,"mistakes":4},{"name":"热身·009「厉」","char":"厉","parts":["厂","万"],"distractors":["原","厌","压","厅","树","外"],"time":90,"mistakes":4},{"name":"热身·010「圾」","char":"圾","parts":["土","及"],"distractors":["城","杯","坝","寺","尘","奶"],"time":90,"mistakes":4}];
/* ---------- 关卡数据（DB 下发优先，本地缓存兜底；任一条非法整批放弃） ---------- */
var LEVELS_KEY="sw.chaizi.v1.levels",LEVELS_VER_KEY="sw.chaizi.v1.levels.ver";
var LEVELS=DEFAULT_LEVELS.slice();
function validateLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return null;
  if(typeof d.name!=="string"||d.name.length<1||d.name.length>32)return null;
  if(typeof d.char!=="string"||d.char.length!==1)return null;
  if(!Array.isArray(d.parts)||d.parts.length<2||d.parts.length>6)return null;
  var i,p;
  for(i=0;i<d.parts.length;i++){p=d.parts[i];if(typeof p!=="string"||p.length!==1||p===d.char)return null;}
  if(new Set(d.parts).size!==d.parts.length)return null;
  if(!Array.isArray(d.distractors)||d.distractors.length<6||d.distractors.length>14)return null;
  for(i=0;i<d.distractors.length;i++){p=d.distractors[i];
    if(typeof p!=="string"||p.length!==1||p===d.char)return null;
    if(d.parts.indexOf(p)>=0)return null;}
  if(new Set(d.distractors).size!==d.distractors.length)return null;
  if(d.parts.length+d.distractors.length<8||d.parts.length+d.distractors.length>16)return null;
  if(!Number.isInteger(d.time)||d.time<30||d.time>600)return null;
  if(!Number.isInteger(d.mistakes)||d.mistakes<1||d.mistakes>5)return null;
  return {name:d.name,char:d.char,parts:d.parts.slice(),distractors:d.distractors.slice(),time:d.time,mistakes:d.mistakes};
}
/* 解析 DB 下发的关卡批次：任一条非法即整批放弃（返回 null） */
function parseLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var seen={},list=[],i,it,no,d;
  for(i=0;i<res.levels.length;i++){
    it=res.levels[i];
    if(!it||typeof it!=="object")return null;
    no=it.levelNo;
    if(typeof no!=="number"||!Number.isInteger(no)||no<1||seen[no])return null;
    try{d=JSON.parse(it.dataJson)}catch(e){return null}
    d=validateLevelData(d);
    if(!d)return null;
    seen[no]=true;
    list.push({no:no,d:d});
  }
  list.sort(function(a,b){return a.no-b.no});
  return list.map(function(x){return x.d});
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){
      var ok=true;
      for(var i=0;i<list.length;i++){if(!validateLevelData(list[i])){ok=false;break}}
      if(ok){LEVELS=list;return v}
    }
  }catch(e){}
  return 0;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels("chai-zi").then(function(res){
    var list=parseLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>=LEVELS.length)cur=LEVELS.length-1;
      startLevel(cur);
      if(overlayMode==="start"){state="idle";stopTimer();}//起始浮层未关闭不计时
    }
  }).catch(function(){});
}
/* ---------- 存档 ---------- */
var KEY="sw.chaizi.v1";
function loadSave(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return{lv:Math.max(0,parseInt(s.lv,10)||0),done:s.done&&typeof s.done==="object"?s.done:{},total:Math.max(0,parseInt(s.total,10)||0)}}catch(e){}return{lv:0,done:{},total:0}}
var saveData=loadSave();
function save(){
  var data={lv:saveData.lv,done:saveData.done,total:saveData.total};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("chai-zi",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("chai-zi").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=Math.max(0,parseInt(r.lv,10)||0),rt=Math.max(0,parseInt(r.total,10)||0);
      if(rl>saveData.lv){saveData.lv=Math.min(LEVELS.length-1,rl);changed=true}
      if(rt>saveData.total){saveData.total=rt;changed=true}
      if(r.done&&typeof r.done==="object"){
        for(var k in r.done){
          if(r.done[k]===true&&!saveData.done[k]){saveData.done[k]=true;changed=true}
        }
      }
      if(changed){save();if(cur>=LEVELS.length)cur=LEVELS.length-1;startLevel(cur);
        if(overlayMode==="start"){state="idle";stopTimer();}}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var cur=0,parts=[],found={},state="idle",over=true,paused=false;
var timeLeft=0,mistakes=0,hintsLeft=0,levelScore=0,wrongCount=0;
var totalScore=saveData.total,doneSave=saveData.done;
var timerId=null,lastTs=0,overlayMode="start";
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function fmtTime(t){var v=Math.max(0,Math.ceil(t));var m=Math.floor(v/60),s=v%60;return(m<10?"0":"")+m+":"+(s<10?"0":"")+s}
function mulberry(seed){var s=seed>>>0;return function(){s|=0;s=(s+0x6d2b79f5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(arr,rng){for(var k=arr.length-1;k>0;k--){var j=Math.floor(rng()*(k+1));var t=arr[k];arr[k]=arr[j];arr[j]=t}return arr}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function startTimer(){
  stopTimer();lastTs=performance.now();
  timerId=setInterval(function(){
    var now=performance.now();var dt=(now-lastTs)/1000;lastTs=now;
    if(paused||state!=="play")return;
    timeLeft-=dt;
    if(timeLeft<=0){timeLeft=0;updateStats();lose("时间到了");return}
    updateStats();
  },200);
}
function updateStats(){
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  $("stPart").textContent=Object.keys(found).length+"/"+parts.length;
  $("stTime").textContent=fmtTime(timeLeft);
  $("stLife").textContent="●".repeat(Math.max(0,mistakes));
  $("btnHint").disabled=hintsLeft<=0||over;
}
/* ---------- 关卡流程 ---------- */
function startLevel(n){
  if(n<0)n=0;if(n>=LEVELS.length)n=LEVELS.length-1;
  cur=n;
  var L=LEVELS[cur];
  parts=L.parts;timeLeft=L.time;mistakes=L.mistakes;hintsLeft=1;
  found={};levelScore=0;wrongCount=0;over=false;state="play";
  var rng=mulberry(1000+cur*7919);
  var cands=shuffle(L.parts.concat(L.distractors),rng);
  $("big").textContent=L.char;
  $("prompt").innerHTML="找出组成「<b>"+L.char+"</b>」的部件字";
  var cs=$("cands");cs.innerHTML="";
  cands.forEach(function(ch){
    var b=document.createElement("button");
    b.className="btn cand";b.textContent=ch;b.setAttribute("data-ch",ch);
    b.addEventListener("click",function(){pick(ch,b)});
    cs.appendChild(b);
  });
  updateStats();
  say("点选「"+L.char+"」拆出的部件字，共 "+parts.length+" 个");
  if(parts.length===0){win();return}//DB 脏数据兜底
  startTimer();
}
function findBtn(ch){
  var bs=$("cands").children;
  for(var i=0;i<bs.length;i++)if(bs[i].getAttribute("data-ch")===ch)return bs[i];
  return null;
}
function pick(ch,btn){
  if(over||state!=="play"||found[ch])return;
  if(parts.indexOf(ch)>=0){
    found[ch]=true;btn.classList.add("ok");btn.disabled=true;
    levelScore+=100;updateStats();
    var left=parts.length-Object.keys(found).length;
    if(left<=0){win();return}
    say("「"+ch+"」找对了！还剩 "+left+" 个部件");
  }else{
    mistakes--;wrongCount++;
    btn.classList.add("bad");
    setTimeout(function(){btn.classList.remove("bad")},260);
    updateStats();
    if(mistakes<=0){lose("机会用完了");return}
    say("「"+ch+"」不是部件，扣一次机会");
  }
}
function win(){
  over=true;state="over";stopTimer();
  var bonus=Math.ceil(timeLeft)*2+mistakes*30+hintsLeft*20;
  levelScore+=bonus;totalScore+=levelScore;
  doneSave[String(cur)]=true;
  if(cur+1<LEVELS.length)saveData.lv=Math.max(saveData.lv,cur+1);
  save();
  var doneCount=0;for(var k in doneSave)doneCount++;
  if(GB.available)GB.reportScore("chai-zi",{metricValue:doneCount,metricExtra:totalScore}).catch(function(){});
  $("ovTitle").textContent="过关！";
  $("ovDesc").innerHTML="「"+LEVELS[cur].char+"」 = "+parts.join(" + ")+"<br>本关得分 "+levelScore+"（含奖励 "+bonus+"）· 累计总分 "+totalScore;
  $("ovBtn").textContent=cur+1<LEVELS.length?"下一关":"再玩一次";
  overlayMode="win";showOverlay();
}
function lose(reason){
  over=true;state="over";stopTimer();
  $("ovTitle").textContent="本关失败";
  $("ovDesc").innerHTML=reason+"<br>已找到 "+Object.keys(found).length+"/"+parts.length+" · 累计总分 "+totalScore;
  $("ovBtn").textContent="重试本关";
  overlayMode="lose";showOverlay();
}
function showOverlay(){$("overlay").classList.add("show")}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 输入 ---------- */
$("btnHint").addEventListener("click",function(){
  if(over||state!=="play"||hintsLeft<=0)return;
  for(var i=0;i<parts.length;i++){
    if(!found[parts[i]]){
      var btn=findBtn(parts[i]);
      if(btn){btn.classList.add("peek");(function(b){setTimeout(function(){b.classList.remove("peek")},1500)})(btn);}
      hintsLeft--;updateStats();
      say("提示：「"+parts[i]+"」是部件之一");
      return;
    }
  }
});
$("btnReset").addEventListener("click",function(){startLevel(cur)});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(overlayMode==="start"){state="play";startTimer()}
  else if(overlayMode==="win"){startLevel(cur+1<LEVELS.length?cur+1:cur)}
  else{startLevel(cur)}
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden)paused=true;
  else{paused=false;lastTs=performance.now()}
});
/* ---------- 启动 ---------- */
loadCachedLevels();
var startIdx=Math.min(Math.max(saveData.lv,0),LEVELS.length-1);
startLevel(startIdx);
