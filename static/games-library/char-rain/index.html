<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>汉字雨</title>
<style>
  /*token:GAME-THEME.md §2 基线（值与基线一致）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; min-width: 0; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.low { color: var(--g-danger); }
  .themebar {
    display: flex; align-items: baseline; justify-content: center; gap: 8px;
    background: var(--g-primary-soft); color: var(--g-on-soft);
    border-radius: var(--g-radius-inner); padding: 8px 10px; margin-bottom: 10px;
    font-size: 14px;
  }
  .themebar b { font-size: 18px; }
  .stage { position: relative; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--g-btn-primary); color: #fff; }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .35; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .bigscore { font-size: 36px; font-weight: 700; color: var(--g-primary-deep); margin: 0 0 4px; font-variant-numeric: tabular-nums; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

</head>
<body>
<div class="wrap">
  <header><span class="sub">60 秒 · 接住当前主题的汉字</span><span class="sub" id="bestTag">最高分 0</span></header>
  <div class="stats">
    <div class="stat"><span class="label">分数</span><span class="val" id="stScore">0</span></div>
    <div class="stat"><span class="label">连击</span><span class="val" id="stCombo">0</span></div>
    <div class="stat"><span class="label">生命</span><span class="val" id="stLife">3</span></div>
  </div>
  <div class="themebar">主题：<b id="themeName">动物</b><span id="themeProg">0/5</span></div>
  <div class="stage"><canvas id="cv" aria-label="汉字雨游戏区：左右移动篮子接住主题汉字" role="img"></canvas></div>
  <p class="msg" id="msg" role="status" aria-live="polite">点「开始挑战」进入 60 秒限时赛</p>
  <div class="tools">
    <button class="btn primary" id="btnStart">开始挑战</button>
  </div>
  <p class="foot">触屏按住拖动篮子 · 键盘 ←→ / A D 移动、空格暂停 · 接错字扣一条命，共 3 条 · 切后台自动暂停 · 成绩自动保存</p>
</div>
<div class="overlay" role="dialog" aria-modal="true" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">时间到！</h2>
    <p class="bigscore" id="ovScore">0</p>
    <p class="desc" id="ovDesc"></p>
    <button class="btn primary" id="ovBtn">再来一局</button>
  </div>
</div>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 主题字库：12 主题 × 10 字（自撰，主题间两两互斥） ---------- */
var GAME_KEY="char-rain",SAVE_KEY="sw.charrain.v1";
var THEMES={
"动物":["猫","狗","马","牛","羊","虎","狼","鸟","鱼","虫"],
"植物":["花","草","树","松","梅","柳","竹","荷","枫","兰"],
"天气":["风","雪","雨","云","电","雷","霜","雾","晴","虹"],
"身体":["头","手","眼","耳","口","鼻","足","心","肩","背"],
"水果":["桃","李","梨","杏","橘","莓","蕉","柿","瓜","枣"],
"交通":["车","船","轮","帆","舟","艇","翼","轨","桥","灯"],
"颜色":["红","蓝","绿","黄","黑","紫","灰","金","银","白"],
"食物":["饭","菜","面","糖","盐","醋","茶","粥","饼","汤"],
"学习":["书","笔","纸","字","图","尺","墨","钟","铃","画"],
"自然":["山","石","土","田","林","泉","溪","瀑","湖","河"]
};
var TKEYS=[];for(var tk in THEMES)TKEYS.push(tk);
/* 独立验证器：主题库结构完整 + 两两互斥（每个字只属于一个主题，保证判定无争议） */
function auditThemes(){
  var bad=[],seen={};
  for(var i=0;i<TKEYS.length;i++){
    var arr=THEMES[TKEYS[i]];
    if(!Array.isArray(arr)||arr.length!==10){bad.push(TKEYS[i]);continue;}
    for(var k=0;k<arr.length;k++){
      var ch=arr[k];
      if(typeof ch!=="string"||ch.length!==1){bad.push(TKEYS[i]);break;}
      if(seen[ch]){bad.push(ch+"重复于"+seen[ch]+"与"+TKEYS[i]);break;}
      seen[ch]=TKEYS[i];
    }
  }
  return bad;
}
/* ---------- 调色板：UI 走 token，画布元素读 CSS 变量 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),soft:v("--g-primary-soft")};
}
window.__gOnTheme=function(){palLoad();paintFrame()};
/* ---------- 状态 ---------- */
var ROUND_MS=60000;
var state="idle";
var drops=[],spawnAt=0,theme="",themeCount=0,themeUsed=[];
var score=0,combo=0,maxCombo=0,lives=3,caught=0;
var deadline=0,pausedLeft=0;
var basketX=0,basketVX=0,lastT=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=360,H=320;
var BASKET_W=76,BASKET_H=30;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{best:parseInt(s.best,10)||0}}catch(e){return{best:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rb=parseInt(remote.best,10)||0;
      if(rb>save.best){save.best=rb;persist();paintBest();}
    }catch(e){}
  }).catch(function(){});
}
function paintBest(){$("bestTag").textContent="最高分 "+save.best}
/* ---------- 出题与判定 ---------- */
function otherPool(){
  var pool=[];
  for(var i=0;i<TKEYS.length;i++){
    if(TKEYS[i]===theme)continue;
    pool=pool.concat(THEMES[TKEYS[i]]);
  }
  return pool;
}
function nextTheme(){
  var i,guard=0;
  do{i=Math.floor(Math.random()*TKEYS.length);guard++;}while(themeUsed.indexOf(TKEYS[i])>=0&&guard<40);
  theme=TKEYS[i];themeCount=0;
  themeUsed.push(theme);if(themeUsed.length>6)themeUsed.shift();
  $("themeName").textContent=theme;
  $("themeProg").textContent="0/5";
}
function spawnDrop(){
  var isGood=Math.random()<0.55;
  var pool=isGood?THEMES[theme]:otherPool();
  var ch=pool[Math.floor(Math.random()*pool.length)];
  drops.push({ch:ch,good:isGood,x:24+Math.random()*(W-48),y:-16,v:64+Math.min(80,(ROUND_MS-(deadline-Date.now()))/1000*3.2),hit:false});
}
function catchJudge(d){
  if(d.good){
    combo++;maxCombo=Math.max(maxCombo,combo);
    score+=10+Math.min(combo,20)*2;
    caught++;themeCount++;
    $("themeProg").textContent=themeCount+"/5";
    if(themeCount>=5)nextTheme();
    paintStats();
  }else{
    combo=0;lives--;paintStats();
    say("「"+d.ch+"」不属于「"+theme+"」！命 -1");
    if(lives<=0)endRound();
  }
}
function missJudge(d){
  if(d.good)combo=0;
  paintStats();
}
/* ---------- 流程 ---------- */
function startRound(){
  drops=[];score=0;combo=0;maxCombo=0;lives=3;caught=0;themeUsed=[];
  nextTheme();
  deadline=Date.now()+ROUND_MS;
  spawnAt=Date.now()+400;
  basketX=W/2;
  state="playing";
  $("btnStart").disabled=true;
  $("btnStart").textContent="挑战中…";
  $("overlay").classList.remove("show");
  paintStats();say("接住「"+theme+"」的字！");
}
function pauseRound(){
  if(state!=="playing")return;
  pausedLeft=deadline-Date.now();
  state="paused";
  $("btnStart").textContent="继续";
  say("已暂停，点「继续」接着接");
}
function resumeRound(){
  if(state!=="paused")return;
  deadline=Date.now()+Math.max(0,pausedLeft);
  spawnAt+=0;   /* 下一滴按 deadline 推算 */
  state="playing";
  $("btnStart").textContent="挑战中…";
  say("继续！");
}
function endRound(){
  state="over";
  var isNew=score>save.best;
  if(isNew){save.best=score;persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:score,metricExtra:maxCombo}).catch(function(){});
  $("ovTitle").textContent=isNew?"新纪录！":(lives<=0?"篮子破了！":"时间到！");
  $("ovScore").textContent=score;
  $("ovDesc").innerHTML="接对 "+caught+" 个字 · 最大连击 "+maxCombo+"<br>最高分 "+save.best;
  $("btnStart").disabled=false;
  $("btnStart").textContent="开始挑战";
  $("overlay").classList.add("show");
}
function paintStats(){
  $("stScore").textContent=score;
  $("stCombo").textContent=combo;
  var l=$("stLife");l.textContent=lives;
  l.className="val"+(lives<=1?" low":"");
}
/* ---------- 绘制 ---------- */
var dpr=1;
function fit(){
  var w=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);H=320;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!basketX)basketX=W/2;
}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function paintFrame(){
  ctx.fillStyle=PAL.surface;ctx.fillRect(0,0,W,H);
  /* 顶栏刻度线 */
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,28);ctx.lineTo(W,28);ctx.stroke();
  /* 篮子导轨 */
  ctx.strokeStyle=PAL.surface2;ctx.lineWidth=3;
  var gy=H-BASKET_H-8;
  ctx.beginPath();ctx.moveTo(10,gy);ctx.lineTo(W-10,gy);ctx.stroke();
  /* 篮子 */
  var bx=basketX,by=gy;
  ctx.fillStyle=PAL.primary;
  ctx.beginPath();
  ctx.moveTo(bx-BASKET_W/2,by-BASKET_H);
  ctx.lineTo(bx+BASKET_W/2,by-BASKET_H);
  ctx.lineTo(bx+BASKET_W/2-10,by);
  ctx.lineTo(bx-BASKET_W/2+10,by);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=PAL.deep;
  ctx.fillRect(bx-BASKET_W/2,by-BASKET_H-4,BASKET_W,4);
  /* 掉落字 */
  for(var i=0;i<drops.length;i++){
    var d=drops[i];
    ctx.fillStyle=d.good?PAL.water:PAL.danger;
    rr(d.x-16,d.y-18,32,32,10);ctx.fill();
    ctx.fillStyle="#FFF";
    ctx.font="700 22px sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(d.ch,d.x,d.y);
  }
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.fillStyle=PAL.muted;ctx.font="600 12px sans-serif";
  var sec=Math.max(0,Math.ceil((deadline-Date.now())/1000));
  ctx.fillText(state==="playing"||state==="paused"?sec+" 秒":"",10,20);
}
function step(dt){
  /* 生成 */
  if(state==="playing"&&Date.now()>=spawnAt){
    spawnDrop();
    var left=Math.max(0,(deadline-Date.now())/ROUND_MS);
    spawnAt=Date.now()+520+520*left;   /* 越到后面越密 */
  }
  /* 移动 */
  var speed=(state==="playing"?260:0)*dt;
  if(keys.left)basketX-=speed;
  if(keys.right)basketX+=speed;
  basketX=Math.max(BASKET_W/2,Math.min(W-BASKET_W/2,basketX));
  /* 掉落 */
  for(var i=drops.length-1;i>=0;i--){
    var d=drops[i];
    d.y+=d.v*dt;
    var gy=H-BASKET_H-8;
    if(!d.hit&&d.y>=gy-BASKET_H&&d.y<=gy+8&&Math.abs(d.x-basketX)<BASKET_W/2){
      d.hit=true;drops.splice(i,1);catchJudge(d);continue;
    }
    if(d.y>H+16){drops.splice(i,1);missJudge(d);}
  }
}
var keys={left:false,right:false};
function loop(now){
  requestAnimationFrame(loop);
  var dt=(now-lastT)/1000;lastT=now;
  if(!(dt>0))dt=0.016;
  if(dt>0.05)dt=0.05;
  if(state==="playing"){
    if(Date.now()>=deadline){endRound();}
    else step(dt);
  }
  paintFrame();
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  basketX=e.clientX-rect.left;
  basketX=Math.max(BASKET_W/2,Math.min(W-BASKET_W/2,basketX));
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(e.buttons===0&&e.pointerType==="mouse")return;
  var rect=cv.getBoundingClientRect();
  basketX=e.clientX-rect.left;
  basketX=Math.max(BASKET_W/2,Math.min(W-BASKET_W/2,basketX));
  e.preventDefault();
});
document.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();
  if(k==="arrowleft"||k==="a"){keys.left=true;e.preventDefault();}
  else if(k==="arrowright"||k==="d"){keys.right=true;e.preventDefault();}
  else if(e.key===" "){
    e.preventDefault();
    if(state==="playing")pauseRound();
    else if(state==="paused")resumeRound();
  }
});
document.addEventListener("keyup",function(e){
  var k=e.key.toLowerCase();
  if(k==="arrowleft"||k==="a")keys.left=false;
  else if(k==="arrowright"||k==="d")keys.right=false;
});
$("btnStart").addEventListener("click",function(){
  if(state==="playing")return;
  if(state==="paused")resumeRound();
  else startRound();
});

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
