<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>国际跳棋</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（--g-ck-sq1/2 棋盘木面两格、--g-ck-you 象牙白棋身、--g-ck-ai 墨色棋身）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-on-primary:#FFFFFF;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-ck-sq1:#F2DFB6;--g-ck-sq2:#C08C4E;--g-ck-you:#FBF6E9;--g-ck-ai:#33302C;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-ck-sq1:#4A3A24;--g-ck-sq2:#2E2415;--g-ck-you:#ECE7D8;--g-ck-ai:#121517;color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 8px; text-align: center; line-height: 1.3; min-width: 0; animation: rise .38s ease-out both; }
  .stat:nth-child(2) { animation-delay: 40ms; }
  .stat:nth-child(3) { animation-delay: 80ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { display: inline-block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.low { color: var(--g-danger); }
  .stage { position: relative; animation: fadein .3s ease-out both; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); box-shadow: var(--g-shadow); }
  .legend { display: flex; gap: 8px; margin: 10px 2px 0; animation: rise .38s ease-out both; animation-delay: 120ms; }
  .lg-chip { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; background: var(--g-surface2); border-radius: 10px; padding: 5px 8px; font-size: 12px; color: var(--g-muted); line-height: 1.3; }
  .lg-chip b { color: var(--g-text); font-weight: 600; }
  .sw { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .sw.you { background: radial-gradient(circle at 35% 30%, #FFFFFF, var(--g-ck-you) 58%); box-shadow: inset 0 0 0 2px var(--g-primary-deep); }
  .sw.ai { background: radial-gradient(circle at 35% 30%, #8A857C, var(--g-ck-ai) 62%); box-shadow: inset 0 0 0 2px var(--g-danger); }
  .sw.dot { background: var(--g-ck-sq1); box-shadow: inset 0 0 0 1.5px var(--g-ck-sq2); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; transition: color .16s ease-out; }
  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn { min-height:44px; padding:0 8px; flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; border:0; border-radius:var(--g-radius-btn); background:var(--g-surface2); color:var(--g-text); font-family:inherit; font-size:16px; font-weight:600; cursor:pointer; transition:transform .14s ease-out, opacity .16s ease-out, background .16s ease-out; }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .35; }
  .btn.primary { background: var(--g-btn-primary); color: var(--g-on-primary); }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay { position: fixed; inset: 0; z-index: 10; background: var(--g-scrim); display: none; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .panel { width: 100%; max-width: 340px; padding: 22px 18px; background: var(--g-surface); border-radius: var(--g-radius); box-shadow: var(--g-shadow); text-align: center; animation: pop .3s ease-out; }
  .panel.win { animation: winpop .45s cubic-bezier(.18,.9,.3,1.4); }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes winpop { 0% { transform: scale(.86); opacity: 0; } 62% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.7; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn { min-height: 44px; border: 0; border-radius: var(--g-radius-inner); background: var(--g-surface2); color: var(--g-text); font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer; transition: transform .14s ease-out, background .16s ease-out; }
  .lvbtn:active { transform: scale(.96); }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（同时压 animation-duration 与 animation-delay） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见 */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
/* 内联图标库：照抄本库 window.SW_ICON 结构（24 viewBox / currentColor / aria-hidden / 零外链） */
window.SW_ICON=function(n,s){s=s||"";var P={
 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>',
 'undo':'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>',
 'rotate':'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
 'grid':'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
 'x':'<path d="M6 6l12 12M18 6L6 18"/>',
 'bulb':'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.7 1 1.5 1 2.5h6c0-1 .2-1.8 1-2.5A6 6 0 0 0 12 3z"/>'
};
var fill={};
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};

<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();

<body>
<div class="wrap">
  <header><span class="sub" id="lvTag">第 1 关</span><span class="sub" id="lvRule"></span></header>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 关卡数据（AI 段位 × 让子组合产关） ---------- */
var GAME_KEY="checkers",SAVE_KEY="sw.checkers.v1";
function pad2(n){return (n<10?"0":"")+n}
var DEFAULT_LEVELS=(function(){
  var a=[],i,skill,h,first;
  for(i=1;i<=40;i++){
    skill=i<=8?1:i<=16?2:i<=24?3:i<=32?4:i<=38?5:6;
    h=[0,1,2,3,0,1,2,3][(i-1)%8];
    first=(skill>=5&&h===0)?1:0;
    a.push({name:"跳棋·"+pad2(i),skill:skill,h:h,first:first});
  }
  return a;
})();
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=='object'||Array.isArray(d))return false;
  if(typeof d.name!=='string'||!d.name.trim())return false;
  if(!Number.isInteger(d.skill)||d.skill<1||d.skill>6)return false;
  if(!Number.isInteger(d.h)||d.h<0||d.h>3)return false;
  if(d.first!==0&&d.first!==1)return false;
  return true;
}
function normalizeLevel(d){
  return {name:String(d.name),skill:Math.min(6,Math.max(1,d.skill)),h:Math.min(3,Math.max(0,d.h)),first:d.first?1:0};
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d)||seen[d.name])return null;
    seen[d.name]=1;list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){LEVELS=list.map(normalizeLevel);return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();loadLevel(lv);
    }
  }).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;b.disabled=i>save.lv;
      b.addEventListener("click",function(){lv=i;persist();loadLevel(lv);hideOverlay();});
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  setOvBtn("取消","x");$("panel").classList.remove("win");$("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show");$("panel").classList.remove("win")}
/* ---------- 规则引擎（纯函数，独立于 UI，可单测） ---------- */
function sideOf(p){return p<=2?0:1}
function isKing(p){return p===2||p===4}
function dirsOf(p){
  if(isKing(p))return [[-1,-1],[-1,1],[1,-1],[1,1]];
  return p<=2?[[-1,-1],[-1,1]]:[[1,-1],[1,1]];
}
function inB(r,c){return r>=0&&r<8&&c>=0&&c<8}
function capSteps(bd,r,c){
  var p=bd[r*8+c],out=[];
  if(!p)return out;
  var ds=dirsOf(p);
  for(var i=0;i<ds.length;i++){
    var mr=r+ds[i][0],mc=c+ds[i][1],lr=r+2*ds[i][0],lc=c+2*ds[i][1];
    if(!inB(lr,lc))continue;
    var mid=bd[mr*8+mc];
    if(mid&&sideOf(mid)!==sideOf(p)&&!bd[lr*8+lc])out.push([ds[i][0],ds[i][1]]);
  }
  return out;
}
function capSeq(bd,r,c,path,out){
  var p=bd[r*8+c],steps=capSteps(bd,r,c),any=false;
  for(var i=0;i<steps.length;i++){
    var dr=steps[i][0],dc=steps[i][1];
    var mr=r+dr,mc=c+dc,lr=r+2*dr,lc=c+2*dc;
    var nb=bd.slice();
    nb[mr*8+mc]=0;nb[r*8+c]=0;
    var np=p,stop=false;
    if(!isKing(p)&&((p===1&&lr===0)||(p===3&&lr===7))){np=p+1;stop=true;}
    nb[lr*8+lc]=np;
    var np2=path.concat([[lr,lc]]);
    if(stop){out.push({path:np2,board:nb});any=true;}
    else{
      var before=out.length;
      capSeq(nb,lr,lc,np2,out);
      if(out.length===before)out.push({path:np2,board:nb});
      any=true;
    }
  }
  return any;
}
function genAll(bd,side){
  var caps=[];
  for(var r=0;r<8;r++)for(var c=0;c<8;c++){
    var p=bd[r*8+c];
    if(!p||sideOf(p)!==side)continue;
    var per=[];
    capSeq(bd,r,c,[],per);
    for(var i=0;i<per.length;i++)caps.push({from:[r,c],path:per[i].path,board:per[i].board});
  }
  if(caps.length)return caps;
  var mv=[];
  for(r=0;r<8;r++)for(c=0;c<8;c++){
    p=bd[r*8+c];
    if(!p||sideOf(p)!==side)continue;
    var ds=dirsOf(p);
    for(var i=0;i<ds.length;i++){
      var r2=r+ds[i][0],c2=c+ds[i][1];
      if(!inB(r2,c2)||bd[r2*8+c2])continue;
      var nb=bd.slice();nb[r*8+c]=0;
      var np=p;
      if(!isKing(p)&&((p===1&&r2===0)||(p===3&&r2===7)))np=p+1;
      nb[r2*8+c2]=np;
      mv.push({from:[r,c],path:[[r2,c2]],board:nb});
    }
  }
  return mv;
}
function applyCapStep(bd,r,c,dr,dc){
  var p=bd[r*8+c],lr=r+2*dr,lc=c+2*dc;
  bd[(r+dr)*8+(c+dc)]=0;bd[r*8+c]=0;
  var np=p;
  if(!isKing(p)&&((p===1&&lr===0)||(p===3&&lr===7)))np=p+1;
  bd[lr*8+lc]=np;
  return np;
}
function applySimple(bd,r,c,r2,c2){
  var p=bd[r*8+c];
  bd[r*8+c]=0;
  var np=p;
  if(!isKing(p)&&((p===1&&r2===0)||(p===3&&r2===7)))np=p+1;
  bd[r2*8+c2]=np;
  return np;
}
function countSide(bd,side){
  var n=0;
  for(var i=0;i<64;i++)if(bd[i]&&sideOf(bd[i])===side)n++;
  return n;
}
/* ---------- AI：negamax + α-β，评估=子力/推进/中心/守底 ---------- */
var NODES=0;
function evalBd(bd){
  var s=0,i,p;
  for(var r=0;r<8;r++)for(var c=0;c<8;c++){
    p=bd[r*8+c];
    if(!p)continue;
    var v=isKing(p)?175:100;
    if(!isKing(p)){

function search(bd,side,depth,alpha,beta,budget){
  NODES++;
  var mv=genAll(bd,side);
  if(!mv.length)return side===1?10000+depth:-10000-depth;
  if(depth<=0||NODES>budget)return side===1?evalBd(bd):-evalBd(bd);
  mv.sort(function(a,b){return b.path.length-a.path.length});
  var best=-99999;
  for(var i=0;i<mv.length;i++){
    var v=-search(mv[i].board,1-side,depth-1,-beta,-alpha,budget);
    if(v>best)best=v;
    if(best>alpha)alpha=best;
    if(alpha>=beta)break;
  }
  return best;
}
function aiPick(bd,side,skill){
  var mv=genAll(bd,side);

  NODES=0;
  var dep=[0,2,3,4,4,5,6][skill]||3;
  var scored=[];
  for(var i=0;i<mv.length;i++){
    var v=-search(mv[i].board,1-side,dep-1,-99999,99999,140000);
    scored.push({m:mv[i],v:v});
  }
  scored.sort(function(a,b){return b.v-a.v});
  if(skill<=3){
    var top=scored.filter(function(x){return scored[0].v-x.v<=30});
    return top[Math.floor(Math.random()*top.length)].m;

function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);

function playerTap(r,c){
  if(over||turn!==0)return;

    var pr=chain.from[0],pc=chain.from[1];
    var steps=capSteps(bd,pr,pc);
    for(i=0;i<steps.length;i++){
      var lr=pr+2*steps[i][0],lc=pc+2*steps[i][1];
      if(lr===r&&lc===c){
        var np=applyCapStep(bd,pr,pc,steps[i][0],steps[i][1]);
        fxCap(pr+steps[i][0],pc+steps[i][1]);fxLand(idx(lr,lc));

        drawNow();return;

    drawNow();return;
  }
  var p=bd[idx(r,c)];
  //点到己方子：已选中同一颗则取消，否则改选（强制跳吃时只能选能跳的子）
  if(p&&sideOf(p)===0){
    if(sel===idx(r,c)){sel=-1;drawNow();return;}
    var mine=genAll(bd,0).filter(function(m){return m.from&&m.from[0]===r&&m.from[1]===c});
    if(!mine.length&&!capSteps(bd,r,c).length){say("有跳吃时这颗子不能走，选能跳的子");drawNow();return;}
    sel=idx(r,c);hintM=null;say("已选中，点目标格走子/跳吃");drawNow();return;
  }

  if(sel<0){drawNow();return;}
  //已选中：点空格/敌子格 → 尝试走子/跳吃
  var all=genAll(bd,0).filter(function(m){return m.from&&m.from[0]===Math.floor(sel/8)&&m.from[1]===sel%8});
  var simple=all.find(function(m){return m.path.length===1&&m.path[0][0]===r&&m.path[0][1]===c});
  if(simple){snapshot();applySimple(bd,Math.floor(sel/8),sel%8,r,c);fxLand(idx(r,c));finishPlayer();return;}

    var lr2=Math.floor(sel/8)+2*steps[i][0],lc2=sel%8+2*steps[i][1];

function aiTurn(){

function rr(x,y,w,h,r){

function drawPiece(cx,cy,rad,p,scale){

function draw(now){
  now=now||performance.now();

  ctx.fillStyle=colMix(PAL.sq2,BLACK,0.55);ctx.fillRect(0,0,W,H);

  ctx.save();

  var gf=ctx.createLinearGradient(0,0,0,H);
  gf.addColorStop(0,colMix(PAL.sq2,BLACK,0.26));
  gf.addColorStop(1,colMix(PAL.sq2,BLACK,0.48));
  ctx.fillStyle=gf;rr(0.5,0.5,W-1,H-1,Math.min(12,W*0.03));ctx.fill();
  ctx.restore();
  ctx.lineWidth=Math.max(1,cell*0.03);ctx.strokeStyle=colMix(PAL.sq1,WHITE,0.30);

  for(r=0;r<8;r++)for(c=0;c<8;c++){

  }
  // 边线：可玩区外沿「面」（替代 1px 细线）
  ctx.lineWidth=Math.max(1.5,cell*0.045);ctx.strokeStyle=colMix(PAL.sq2,BLACK,0.40);

  if(sel>=0&&turn===0){sr=Math.floor(sel/8);sc=sel%8}
  // 提示着法：软绿底 + 水色环

  if(sr>=0&&!chain)allM=genAll(bd,0);
  // 目标：被选子可吃的敌子，红环标记
  if(allM){
    for(i=0;i<allM.length;i++){
      var am=allM[i];
      if(!am.from||am.from[0]!==sr||am.from[1]!==sc||am.path.length<2)continue;
      var jr=(am.from[0]+am.path[0][0])/2,jc=(am.from[1]+am.path[0][1])/2;

      var steps=capSteps(bd,sr,sc);
      for(i=0;i<steps.length;i++)opts.push({r:sr+2*steps[i][0],c:sc+2*steps[i][1],cap:true});
    }else{
      for(i=0;i<allM.length;i++){
        var m=allM[i];
        if(m.from&&(m.from[0]!==sr||m.from[1]!==sc))continue;
        opts.push({r:m.path[0][0],c:m.path[0][1],cap:m.path.length>1});
      }
    }
    for(i=0;i<opts.length;i++){
      var dx2=ox+(opts[i].c+.5)*cell,dy2=oy+(opts[i].r+.5)*cell;

      }else{
        ctx.fillStyle=PAL.sq1;
        ctx.beginPath();ctx.arc(dx2,dy2,cell*0.16,0,Math.PI*2);ctx.fill();
        ctx.lineWidth=1.2;ctx.strokeStyle=colMix(PAL.sq2,BLACK,0.35);

    var p=bd[idx(r,c)];
    if(!p)continue;

    }
  }
  // 吃子：扩散红环（240ms 淡出）
  for(i=capFx.length-1;i>=0;i--){

  ctx.restore();
}

window.addEventListener("keydown",function(e){
  var k=e.key,r=Math.floor(cursor/8),c=cursor%8;
  if(k==="ArrowUp"){if(r>0)cursor-=8;e.preventDefault();}
  else if(k==="ArrowDown"){if(r<7)cursor+=8;e.preventDefault();}
  else if(k==="ArrowLeft"){if(c>0)cursor--;e.preventDefault();}
  else if(k==="ArrowRight"){if(c<7)cursor++;e.preventDefault();}
  else if(k===" "||k==="Enter"){
    if($("overlay").classList.contains("show")){$("ovBtn").click();}
    else if(sel<0&&bd[cursor]&&sideOf(bd[cursor])===0)playerTap(r,c);
    else if(sel>=0)playerTap(r,c);
    e.preventDefault();
  }
  else if(k==="Escape"){sel=-1;drawNow();}
  else if(k==="u"||k==="U")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R")loadLevel(lv);
});
window.addEventListener("resize",function(){resize();drawNow()});
/* ---------- 切后台：AI 思考中断，轮次归还玩家 ---------- */
document.addEventListener("visibilitychange",function(){
  if(document.hidden){
    if(aiTimer){clearTimeout(aiTimer);aiTimer=null;}
    if(turn===1&&!over){turn=0;say("已切后台，电脑让先，请你行动");updCtl();}
  }else drawNow();
});
/* ---------- 内嵌独立验证器 ---------- */
function selfTest(){
  var total=0,ok=0,fails=[];
  function chk(c,name){total++;if(c)ok++;else fails.push(name);}
  chk(DEFAULT_LEVELS.length===40,"关卡数=40");
  chk(DEFAULT_LEVELS.every(validLevelData),"关卡配置合法");
  chk(DEFAULT_LEVELS[39].skill===6,"顶关卡位=6");
  //规则单元：强制跳吃
  var b1=new Array(64).fill(0);
  b1[idx(5,2)]=1;b1[idx(4,3)]=3;b1[idx(7,4)]=1;b1[idx(0,1)]=3;
  var mv1=genAll(b1,0);
  chk(mv1.length===1&&mv1[0].path.length===1&&mv1[0].path[0][0]===3&&mv1[0].path[0][1]===4,"强制跳吃");
  chk(mv1[0].board[idx(4,3)]===0&&mv1[0].board[idx(3,4)]===1,"跳吃吃子落子");
  //连跳
  var b2=new Array(64).fill(0);
  b2[idx(5,0)]=1;b2[idx(4,1)]=3;b2[idx(2,3)]=3;b2[idx(0,5)]=3;
  var caps2=[];
  capSeq(b2,5,0,[],caps2);
  chk(caps2.length===1&&caps2[0].path.length===2,"双连跳成链");
  //升王
  var b3=new Array(64).fill(0);
  b3[idx(1,2)]=1;b3[idx(0,5)]=3;
  var mv3=genAll(b3,0).filter(function(m){return m.path[0][0]===0&&m.path[0][1]===3});
  chk(mv3.length===1&&mv3[0].board[idx(0,3)]===2,"到底线升王");
  //王棋回吃
  var b4=new Array(64).fill(0);
  b4[idx(4,4)]=2;b4[idx(5,3)]=3;b4[idx(0,1)]=3;
  var mv4=genAll(b4,0);
  chk(mv4.length===1&&mv4[0].path[0][0]===6&&mv4[0].path[0][1]===2,"王棋后向跳吃");
  //每关初始局面合法
  var initOk=true,i;
  for(i=0;i<DEFAULT_LEVELS.length;i++){
    var ib=initBoard(DEFAULT_LEVELS[i].h);
    var pm=0,pk=0,am=0;
    for(var j=0;j<64;j++){
      if(ib[j]===1)pm++;else if(ib[j]===2)pk++;else if(ib[j]===3)am++;
    }
    if(pm+pk!==12+(DEFAULT_LEVELS[i].h===1?2:0))initOk=false;
    if(DEFAULT_LEVELS[i].h===2&&pk!==2)initOk=false;
    if(DEFAULT_LEVELS[i].h===3&&am!==10)initOk=false;
    if(DEFAULT_LEVELS[i].h!==3&&am!==12)initOk=false;
  }
  chk(initOk,"40 关初始局面合法");
  //AI 对拍：8 局低深度自战，校验每步来自 genAll、子数不增、可正常终局或循环判和
  function aiGame(skillA,skillB){
    var b=initBoard(0),side=0,plies=0,seen={};
    while(plies<300){
      var key=b.join(",")+":"+side;
      seen[key]=(seen[key]||0)+1;
      if(seen[key]>=3)return true;
      plies++;
      var before=countSide(b,0)+countSide(b,1);
      var m=aiPick(b,side,side===0?skillA:skillB);
      if(!m)return true;
      var r=m.from[0],cc=m.from[1];
      for(var s2=0;s2<m.path.length;s2++){
        var t=m.path[s2];
        if(Math.abs(t[0]-r)===2){
          if(!capSteps(b,r,cc).some(function(st){return r+2*st[0]===t[0]&&cc+2*st[1]===t[1]}))return false;
          applyCapStep(b,r,cc,Math.sign(t[0]-r),Math.sign(t[1]-cc));
        }else{
          if(b[t[0]*8+t[1]])return false;
          applySimple(b,r,cc,t[0],t[1]);
        }
        r=t[0];cc=t[1];
      }
      if(countSide(b,0)+countSide(b,1)>before)return false;
      if(!genAll(b,1-side).length)return true;
      side=1-side;
    }
    return true; //手数耗尽视为和局：对拍沿途已逐步校验合法性
  }
  for(i=0;i<8;i++)chk(aiGame(1+(i%2),1+(i%2)),"AI 对拍 局"+(i+1));
  window.__gSelfTest={ok:ok,total:total,fails:fails};
  // 自检结果只走控制台：玩家界面不出现开发期 HUD
  if(fails.length)console.warn("内嵌自检未全过（"+ok+"/"+total+"）: "+fails.join("，"));
}
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);resize();loop();selfTest();
/* 工具钮图标：内联 SVG（SW_ICON，24 viewBox / currentColor），文字前带图标 */
$("btnUndo").insertAdjacentHTML("afterbegin",window.SW_ICON("undo"));
$("btnHint").insertAdjacentHTML("afterbegin",window.SW_ICON("bulb"));
$("btnReset").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
$("btnLv").insertAdjacentHTML("afterbegin",window.SW_ICON("grid"));
setOvBtn("下一关","arrow-right");
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
