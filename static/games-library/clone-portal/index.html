  /*token:GAME-THEME.md §2 基线（值与基线一致）+ §3 素材 token（--g-st-ca/cb 双分身色、--g-st-pw 传送门色，深色为同色相压暗变体）*/

  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-ca:#5FA8D8;--g-st-cb:#D98E60;--g-st-pw:#947ECB;color-scheme:dark }

  * { box-sizing: border-box; }

  .btn {

  }
  .btn.gbtn { flex: 0 0 72px; }

  .tools { display: flex; gap: 8px; margin-bottom: 8px; }

  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;

  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}

<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<script>
/* ========== 关卡生成器 + 独立验证器（纯逻辑，无 DOM 依赖） ========== */
(function(){
"use strict";
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var DIRS=[[0,1],[0,-1],[1,0],[-1,0]];   // 下 上 右 左
/* 独立验证器：BFS(分身1,分身2) 双状态空间，父指针重建首着 */
function cpBFS(cells,twin,cols,rows,p1,p2){
  function key(a,b){return a*cols*rows+b}
  function step(pos,d){
    var x=pos%cols,y=(pos/cols)|0;
    var nx=x+DIRS[d][0],ny=y+DIRS[d][1];
    if(nx<0||nx>=cols||ny<0||ny>=rows)return pos;
    var t=ny*cols+nx;
    if(cells[t]===1)return pos;
    if(twin[t]!==undefined&&twin[t]>=0&&twin[t]!==pos)t=twin[t];
    return t;
  }
  function isWin(a,b){
    var ca=cells[a],cb=cells[b];
    return (ca===2&&cb===3)||(ca===3&&cb===2);
  }
  var dist={},parent={},q=[];
  var k0=key(p1,p2);
  dist[k0]=0;parent[k0]=null;
  q.push([p1,p2]);
  var winK=null;
  while(q.length){
    var cur=q.shift(),d=dist[key(cur[0],cur[1])];
    if(isWin(cur[0],cur[1])){winK=key(cur[0],cur[1]);break;}
    for(var dd=0;dd<4;dd++){
      var n1=step(cur[0],dd),n2=step(cur[1],dd);
      if(n1===cur[0]&&n2===cur[1])continue;
      var k=key(n1,n2);
      if(dist[k]!==undefined)continue;
      dist[k]=d+1;parent[k]=key(cur[0],cur[1]);
      q.push([n1,n2]);
    }
  }
  if(winK===null)return null;
  var k=winK,first=-1;
  while(parent[k]!==null&&parent[k]!==undefined){
    var prev=parent[k];
    var p1v=Math.floor(k/(cols*rows)),p2v=k%(cols*rows);
    var q1=Math.floor(prev/(cols*rows)),q2=prev%(cols*rows);
    for(var d2=0;d2<4;d2++){
      if(step(q1,d2)===p1v&&step(q2,d2)===p2v)first=d2;
    }
    k=prev;
  }
  return {par:dist[winK],first:first>=0?first:0};
}
function parseSpec(rows,cols){
  var cells=[],twin={},a=-1,b=-1,y,x;
  for(y=0;y<rows.length;y++)for(x=0;x<cols;x++){
    var ch=rows[y].charAt(x),i=y*cols+x;
    if(ch==="#")cells[i]=1;
    else if(ch==="1")cells[i]=2;
    else if(ch==="2")cells[i]=3;
    else if(ch==="P"||ch==="Q"){cells[i]=ch==="P"?4:5;twin[i]=-1;}
    else if(ch==="A"){cells[i]=10;a=i;}
    else if(ch==="B"){cells[i]=11;b=i;}
    else cells[i]=0;
  }
  var ps=[],qs=[];
  for(i=0;i<cols*rows;i++){
    if(cells[i]===4)ps.push(i);
    if(cells[i]===5)qs.push(i);
  }
  if(ps.length===2){twin[ps[0]]=ps[1];twin[ps[1]]=ps[0];}
  if(qs.length===2){twin[qs[0]]=qs[1];twin[qs[1]]=qs[0];}
  return {cells:cells,twin:twin,a:a,b:b};
}
function genLevels(){
  var rnd=mulberry(20261131);
  function rn(m){return (rnd()*m)|0}
  var out=[],seen={};
  function parseSpecLocal(rows,cols){
    var cells=[],twin={},a=-1,b=-1,y,x;
    for(y=0;y<rows.length;y++)for(x=0;x<cols;x++){
      var ch=rows[y].charAt(x),i=y*cols+x;
      if(ch==="#")cells[i]=1;
      else if(ch==="1")cells[i]=2;
      else if(ch==="2")cells[i]=3;
      else if(ch==="P"||ch==="Q"){cells[i]=ch==="P"?4:5;twin[i]=-1;}
      else if(ch==="A"){cells[i]=10;a=i;}
      else if(ch==="B"){cells[i]=11;b=i;}
      else cells[i]=0;
    }
    var ps=[],qs=[];
    for(i=0;i<cols*rows;i++){
      if(cells[i]===4)ps.push(i);
      if(cells[i]===5)qs.push(i);
    }
    if(ps.length===2){twin[ps[0]]=ps[1];twin[ps[1]]=ps[0];}
    if(qs.length===2){twin[qs[0]]=qs[1];twin[qs[1]]=qs[0];}
    return {cells:cells,twin:twin,a:a,b:b};
  }
  for(var i=0;i<90;i++){
    var size=6+Math.min(3,(i/22)|0);
    var nPortal=i<15?0:i<45?1:2;
    var dens=0.16+Math.min(0.14,(i/90)*0.14)+(rnd()*0.04);
    for(var t=0;t<250;t++){
      var cellsArr=new Array(size*size);
      for(var s=0;s<size*size;s++)cellsArr[s]=rnd()<dens?1:0;
      var free=[];
      for(s=0;s<size*size;s++)if(cellsArr[s]===0)free.push(s);
      if(free.length<8)continue;
      function take(){return free.splice(rn(free.length),1)[0]}
      var a=take(),b=take(),pl1=take(),pl2=take();
      cellsArr[a]=10;cellsArr[b]=11;cellsArr[pl1]=2;cellsArr[pl2]=3;
      for(var pi=0;pi<nPortal;pi++){
        if(free.length<2)break;
        var t1=take(),t2=take();
        cellsArr[t1]=4+pi;cellsArr[t2]=4+pi;
      }
      var spec=[];
      for(var y=0;y<size;y++){
        var r="";
        for(var x=0;x<size;x++){
          var c=cellsArr[y*size+x];
          r+=c===1?"#":c===2?"1":c===3?"2":c===4?"P":c===5?"Q":c===10?"A":c===11?"B":".";
        }
        spec.push(r);
      }
      var rowsStr=spec.join("|");
      if(seen[rowsStr])continue;
      var st=parseSpecLocal(spec,size);
      var v=cpBFS(st.cells,st.twin,size,size,st.a,st.b);
      if(!v||v.par<3||v.par>30)continue;
      seen[rowsStr]=1;
      out.push({rows:spec,par:v.par});
      break;
    }
  }
  out.sort(function(a,b){return a.par-b.par});
  var sel=[],stride=Math.max(1,Math.floor(out.length/40));
  for(i=0;i<out.length&&sel.length<40;i+=stride)sel.push(out[i]);
  for(i=0;i<sel.length;i++){
    sel[i].name="双行·"+(i+1<10?"0":"")+(i+1);
    sel[i].difficulty=Math.min(6,1+((i/8)|0));
  }
  return sel.map(function(x){return normalizeLevel(x)});
}
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim()||d.name.length>24)return false;
  if(!Array.isArray(d.rows)||d.rows.length<6||d.rows.length>9)return false;
  var cols=d.rows[0].length,a=0,b=0,l1=0,l2=0,y,x;
  for(y=0;y<d.rows.length;y++){
    if(typeof d.rows[y]!=="string"||d.rows[y].length!==cols)return false;
    for(x=0;x<cols;x++){
      var ch=d.rows[y].charAt(x);
      if(".#12PQAB".indexOf(ch)<0)return false;
      if(ch==="A")a++;
      if(ch==="B")b++;
      if(ch==="1")l1++;
      if(ch==="2")l2++;
    }
  }
  return a===1&&b===1&&l1===1&&l2===1;
}
function normalizeLevel(d){
  var cols=d.rows[0].length,rowsN=d.rows.length;
  var st=parseSpec(d.rows,cols);
  var v=cpBFS(st.cells,st.twin,cols,rowsN,st.a,st.b);
  var diff=Number.isInteger(d.difficulty)?Math.min(9,Math.max(1,d.difficulty)):3;
  return {name:String(d.name),rows:d.rows.slice(),cols:cols,rowsN:rowsN,par:v?v.par:0,difficulty:diff};
}
window.__CP={DIRS:DIRS,cpBFS:cpBFS,parseSpec:parseSpec,genLevels:genLevels,validLevelData:validLevelData,normalizeLevel:normalizeLevel};
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ========== */
var CP=window.__CP,GAME_KEY="clone-portal",SAVE_KEY="sw.cloneportal.v1";
var LEVELS=CP.genLevels();
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i],d;
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!CP.validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    var n=CP.normalizeLevel(d);
    if(!(n.par>0))continue;   // 验证器判不可达：不进关卡表
    list.push(n);
  }
  return list.length?list:null;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(CP.validLevelData)){
      LEVELS=list.map(CP.normalizeLevel).filter(function(x){return x.par>0});
      if(LEVELS.length)return v;
      LEVELS=CP.genLevels();
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);resize();
    }
  }).catch(function(){});
}
/* ---------- 存档 ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,cells=null,twin={},p1=0,p2=0,history=[],moves=0,done=false,hintDir=-1,hintT=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,cell=0;
var DIRNAMES=["下","上","右","左"];
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* 主逻辑：单步移动（与 cpBFS 验证器相互独立） */
function stepOne(pos,d){
  var x=pos%L.cols,y=(pos/L.cols)|0;
  var nx=x+CP.DIRS[d][0],ny=y+CP.DIRS[d][1];
  if(nx<0||nx>=L.cols||ny<0||ny>=L.rows)return pos;
  var t=ny*L.cols+nx;
  if(cells[t]===1)return pos;
  if(twin[t]!==undefined&&twin[t]>=0&&twin[t]!==pos)t=twin[t];
  return t;
}
function isWin(a,b){
  var ca=cells[a],cb=cells[b];
  return (ca===2&&cb===3)||(ca===3&&cb===2);
}
function loadLevel(idx){
  lv=Math.max(0,Math.min(idx,LEVELS.length-1));
  L=LEVELS[lv];
  if(!CP.validLevelData({name:L.name,rows:L.rows})){say("关卡数据异常");return;}
  var st=CP.parseSpec(L.rows,L.cols);
  cells=st.cells;twin=st.twin;p1=st.a;p2=st.b;
  var v=CP.cpBFS(cells,twin,L.cols,L.rowsN,p1,p2);   // 加载复核
  history=[];moves=0;done=false;hintDir=-1;
  $("lvTag").textContent="第 "+(lv+1)+" 关";
  $("lvRule").textContent=L.name+" · "+L.cols+"×"+L.rowsN+(Object.keys(twin).length?" · 有传送门":"");
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stPar").textContent=v?v.par+" 步":"-";
  if(!v)say("警告：验证器判定本关不可达（数据异常）");
  else say("让两个分身分别踩住两个机关环（参考最优 "+v.par+" 步）");
  updStats();resize();
}
function updStats(){
  $("stMoves").textContent=moves;
  $("btnUndo").disabled=!history.length||done;
}
function doMove(d){
  if(done)return;
  var n1=stepOne(p1,d),n2=stepOne(p2,d);
  if(n1===p1&&n2===p2){say("两个分身都卡住了，这个方向无效");return;}
  history.push([p1,p2]);
  p1=n1;p2=n2;moves++;
  hintDir=-1;
  updStats();
  if(isWin(p1,p2)){winLevel();return;}
  var w1=cells[p1]===2||cells[p1]===3,w2=cells[p2]===2||cells[p2]===3;
  say("已向「"+DIRNAMES[d]+"」· 机关 "+(w1?1:0)+"/"+(w2?1:0)+" 处踩住");
}
function undo(){
  if(!history.length||done)return;
  var h=history.pop();
  p1=h[0];p2=h[1];moves=history.length;
  say("已撤销一步");updStats();render();
}
function hint(){
  if(done)return;
  var v=CP.cpBFS(cells,twin,L.cols,L.rowsN,p1,p2);
  if(!v||!(v.par>0)){say("验证器：当前局面已无法达成，撤销几步吧");return;}
  hintDir=v.first;hintT=Date.now();
  say("建议下一步向「"+DIRNAMES[v.first]+"」（还需约 "+v.par+" 步）");
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:moves}).catch(function(){});
  $("ovTitle").textContent="机关全亮！";
  $("ovDesc").innerHTML="用 "+moves+" 步让双分身踩住机关（参考最优 "+$("stPar").textContent+" 步）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
function openLevelSelect(){
  var ggrid=$("lvgrid");ggrid.hidden=false;
  ggrid.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      ggrid.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n2){return s.getPropertyValue(n2).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),
    ca:v("--g-st-ca"),cb:v("--g-st-cb"),pw:v("--g-st-pw")};
}
window.__gOnTheme=function(){palLoad()};//App 推送主题时刷新调色板，rAF 自动重绘
/* ---------- 绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);
  cell=Math.min(56,Math.floor(W/L.cols));
  H=cell*L.rowsN;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function render(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=PAL.surface2;ctx.fillRect(0,0,W,H);
  var y,x;
  for(y=0;y<L.rowsN;y++)for(x=0;x<L.cols;x++){
    var c=cells[y*L.cols+x],px=x*cell,py=y*cell;
    if(c===1){
      ctx.fillStyle=PAL.muted;
      ctx.fillRect(px+1,py+1,cell-2,cell-2);
      continue;
    }
    if(c===2||c===3){
      ctx.strokeStyle=c===2?PAL.warning:PAL.success;
      ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(px+cell/2,py+cell/2,cell*0.3,0,7);ctx.stroke();
    }
    if(c===4||c===5){
      ctx.strokeStyle=PAL.pw;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(px+cell/2,py+cell/2,cell*0.28,0,7);ctx.stroke();
      ctx.fillStyle=PAL.pw;
      ctx.font="700 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(c===4?"P":"Q",px+cell/2,py+cell/2);
    }
  }
  //提示方向箭头
  if(hintDir>=0&&Date.now()-hintT<2600){
    var pulse=0.5+0.5*Math.sin((Date.now()-hintT)/170);
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=3;ctx.globalAlpha=0.4+pulse*0.6;
    [p1,p2].forEach(function(p){
      var ax=(p%L.cols)+CP.DIRS[hintDir][0]*0.8,ay=((p/L.cols)|0)+CP.DIRS[hintDir][1]*0.8;
      ctx.beginPath();ctx.arc(ax*cell+cell/2,ay*cell+cell/2,cell*0.16,0,7);ctx.stroke();
    });
    ctx.globalAlpha=1;
  }
  //双分身
  ctx.fillStyle=PAL.ca;
  ctx.beginPath();ctx.arc((p1%L.cols)*cell+cell*0.32,((p1/L.cols)|0)*cell+cell*0.32,cell*0.22,0,7);ctx.fill();
  ctx.strokeStyle=PAL.surface;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=PAL.cb;
  ctx.beginPath();ctx.arc((p2%L.cols)*cell+cell*0.32,((p2/L.cols)|0)*cell+cell*0.32,cell*0.22,0,7);ctx.fill();
  ctx.strokeStyle=PAL.surface;ctx.lineWidth=2;ctx.stroke();
  //重叠时偏移画第二个
  if(p1===p2){
    ctx.fillStyle=PAL.cb;
    ctx.beginPath();ctx.arc((p2%L.cols)*cell+cell*0.68,((p2/L.cols)|0)*cell+cell*0.68,cell*0.22,0,7);ctx.fill();
    ctx.strokeStyle=PAL.surface;ctx.lineWidth=2;ctx.stroke();
  }
}
function loop(){if(L)render(performance.now());requestAnimationFrame(loop)}
/* ---------- 输入 ---------- */
var swX=null,swY=null;
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  swX=e.clientX-rect.left;swY=e.clientY-rect.top;
  e.preventDefault();
});
cv.addEventListener("pointerup",function(e){
  if(swX===null||done)return;
  var rect=cv.getBoundingClientRect();
  var dx=(e.clientX-rect.left)-swX,dy=(e.clientY-rect.top)-swY;
  swX=swY=null;
  if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  if(Math.abs(dx)>Math.abs(dy))doMove(dx>0?2:3);
  else doMove(dy>0?0:1);
});
cv.addEventListener("pointercancel",function(){swX=swY=null});
$("gUp").addEventListener("click",function(){doMove(1)});
$("gDown").addEventListener("click",function(){doMove(0)});
$("gLeft").addEventListener("click",function(){doMove(3)});
$("gRight").addEventListener("click",function(){doMove(2)});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowDown"){doMove(0);e.preventDefault();}
  else if(k==="ArrowUp"){doMove(1);e.preventDefault();}
  else if(k==="ArrowRight"){doMove(2);e.preventDefault();}
  else if(k==="ArrowLeft"){doMove(3);e.preventDefault();}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
  else if(k===" "||k==="Enter"){if($("overlay").classList.contains("show"))$("ovBtn").click();e.preventDefault();}
});
window.addEventListener("resize",resize);
document.addEventListener("visibilitychange",function(){if(!document.hidden)resize()});
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);resize();loop();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
