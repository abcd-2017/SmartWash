try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/* 轨件：0平 1上 2下 3弯(限速) 4刹 5推；物理：v² 每段 -=2G(升)/+=2G(降)/-FR(平弯)/-BRAKE(刹)/+BOOST(推) */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var CB={G:0.9,FR:0.55,BRAKE:6,BOOST:3,V0:1.44,CURVE:6.76,ST_LO:1,ST_HI:4.84,
  NAMES:["平","上","下","弯","刹","推"],LEVEL_COUNT:40};
CB.sim=function(types){
  var v2=CB.V0,trace=[];
  for(var i=0;i<types.length;i++){
    var t=types[i];
    if(t===1)v2-=2*CB.G;
    else if(t===2)v2+=2*CB.G;
    else if(t===4)v2-=CB.BRAKE;
    else if(t===5)v2+=CB.BOOST;
    else v2-=CB.FR;
    if(v2<=0.05)return{ok:false,at:i,why:"stall",v2:0,trace:trace};
    if(t===3&&v2>CB.CURVE)return{ok:false,at:i,why:"derail",v2:v2,trace:trace};
    trace.push(Math.round(v2*1000)/1000);
  }
  if(v2<CB.ST_LO)return{ok:false,at:types.length-1,why:"slow",v2:v2,trace:trace};
  if(v2>CB.ST_HI)return{ok:false,at:types.length-1,why:"fast",v2:v2,trace:trace};
  return{ok:true,at:-1,why:"",v2:Math.round(v2*1000)/1000,trace:trace};
};
/* 生成：构造式引导（快了加刹/弯、慢了加下坡/推进），库存=参考解+1 件机动 */
CB.genLevel=function(no){
  for(var attempt=0;attempt<40;attempt++){
    var rng=mulberry32(48100+no*599+attempt*31);
    var N=6+Math.min(6,Math.floor((no-1)/7));
    var types=[],v2=CB.V0;
    for(var i=0;i<N;i++){
      var cand=[];
      if(v2>4.6)cand.push(4);
      if(v2>3.6)cand.push(3);
      if(v2<2.4){cand.push(2);cand.push(5);}
      if(v2<3.4)cand.push(0);
      if(v2>5.2)cand.push(4);
      if(!cand.length)cand=[4];
      var t=cand[Math.floor(rng()*cand.length)];
      types.push(t);
      if(t===1)v2-=2*CB.G;
      else if(t===2)v2+=2*CB.G;
      else if(t===4)v2-=CB.BRAKE;
      else if(t===5)v2+=CB.BOOST;
      else v2-=CB.FR;
      if(v2<=0.05)v2=1.0;   //引导式构造不判负，全量复验兜底
    }
    var r=CB.sim(types);
    if(!r.ok)continue;
    var inv=[0,0,0,0,0,0];
    for(var c=0;c<N;c++)inv[types[c]]++;
    var slack=Math.floor(rng()*6);
    inv[slack]++;
    if(inv[0]+inv[1]+inv[2]+inv[3]+inv[4]+inv[5]<N)continue;
    return {name:"过山车·"+(no<10?"0":"")+no,N:N,inv:inv,ref:types.slice(),
      difficulty:Math.min(9,1+Math.floor(no/5))};
  }
  return {name:"过山车·"+(no<10?"0":"")+no,N:6,inv:[0,0,5,0,1,0],ref:[2,2,2,2,4,2],
    difficulty:Math.min(9,1+Math.floor(no/5))};
};
/* 结构校验 */
CB.validate=function(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return{ok:false,why:"bad"};
  if(!Number.isInteger(d.N)||d.N<5||d.N>14)return{ok:false,why:"N"};
  if(!Array.isArray(d.inv)||d.inv.length!==6)return{ok:false,why:"inv"};
  var sum=0;
  for(var i=0;i<6;i++){if(!Number.isInteger(d.inv[i])||d.inv[i]<0||d.inv[i]>14)return{ok:false,why:"iv"+i};sum+=d.inv[i];}
  if(sum<d.N)return{ok:false,why:"short"};
  if(!Array.isArray(d.ref)||d.ref.length!==d.N)return{ok:false,why:"ref"};
  var need=[0,0,0,0,0,0];
  for(var r=0;r<d.ref.length;r++){
    if(!Number.isInteger(d.ref[r])||d.ref[r]<0||d.ref[r]>5)return{ok:false,why:"rt"+r};
    need[d.ref[r]]++;
  }
  for(var q=0;q<6;q++)if(need[q]>d.inv[q])return{ok:false,why:"cov"+q};
  var sim=CB.sim(d.ref);
  if(!sim.ok)return{ok:false,why:"unsolvable"};
  return{ok:true,why:"",v2:sim.v2};
};
CB.validateAll=function(){
  var fails=[],i;
  for(i=1;i<=CB.LEVEL_COUNT;i++){
    var L=CB.genLevel(i),r=CB.validate(L);
    if(!r.ok)fails.push(i+"("+r.why+")");
  }
  return {total:CB.LEVEL_COUNT,solvable:CB.LEVEL_COUNT-fails.length,fail:fails};
};
CB.runTests=function(){
  var pass=0,rows=[];
  function ck(name,ok,got){rows.push({name:name,ok:!!ok,got:got});if(ok)pass++;}
  //锚点1：下下平 → 到站 v²=4.49（1.44+1.8+1.8-0.55）
  var s1=CB.sim([2,2,0]);
  ck("锚点·下下平到站 4.49",s1.ok&&s1.v2===4.49,"v2="+s1.v2);
  //锚点2：单弯轨进站太慢 → 失速
  var s2=CB.sim([3]);
  ck("锚点·进站失速",!s2.ok&&s2.why==="slow","why="+s2.why);
  //锚点3：推推弯 → 弯道超速脱轨（v²=6.89>6.76）
  var s3=CB.sim([5,5,3]);
  ck("锚点·弯道脱轨",!s3.ok&&s3.why==="derail"&&s3.at===2,"why="+s3.why+",at="+s3.at);
  //锚点4：单上坡 → 爬坡失速（1.44-1.8<0）
  var s4=CB.sim([1]);
  ck("锚点·爬坡失速",!s4.ok&&s4.why==="stall","why="+s4.why);
  //锚点5：下下下刹下 → 刹后 0.84 再下坡 2.64 进站
  var s5=CB.sim([2,2,2,4,2]);
  ck("锚点·刹后补坡 2.64",s5.ok&&s5.v2===2.64,"v2="+s5.v2);
  var r=CB.validateAll();
  ck("40 关参考解可到站",r.fail.length===0,"fail="+r.fail.join(","));
  var L1=CB.genLevel(1),L2=CB.genLevel(1);
  ck("生成确定性",JSON.stringify(L1)===JSON.stringify(L2),"replay");
  return {total:7,pass:pass,rows:rows,levels:r};
};
globalThis.__XC=CB;
/*XC-CORE-END*/

/* ========== 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ========== */
var GAME_KEY="coaster-build",SAVE_KEY="sw.coasterbuild.v1";
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=CB.LEVEL_COUNT;i++)list.push(CB.genLevel(i));
  return list;
}
var LEVELS=buildDefaultLevels();
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!CB.validate(d).ok)return null;
    var no=parseInt(row.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=1;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return CB.validate(d).ok})){
      LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      loadLevel(cur);
    }
  }).catch(function(){});
}

/* ========== 存档（本地 + 账号双写，账号更优才覆盖） ========== */
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:parseInt(s.lv,10)||0,best:parseInt(s.best,10)||1}}catch(e){return{lv:0,best:1}}}
var save=loadSave();
var unlocked=clamp(save.best,1,1);
function persist(){
  var data={lv:cur,best:unlocked};
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson||state!=="edit")return;
    try{
      var r=JSON.parse(res.stateJson),ch=false;
      var rl=parseInt(r.lv,10),rb=parseInt(r.best,10);
      if(isFinite(rl)&&rl>save.lv&&rl<LEVELS.length){save.lv=rl;ch=true;}
      if(isFinite(rb)&&rb>unlocked&&rb<=LEVELS.length){unlocked=rb;ch=true;}
      if(ch){cur=clamp(save.lv,0,LEVELS.length-1);persist();loadLevel(cur);}
    }catch(e){}
  }).catch(function(){});
}

/* ========== 调色板 ========== */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),
    water:v("--g-water")};
  PAL.badgeText=document.documentElement.dataset.theme==="dark"?PAL.bg:PAL.surface;
}
window.__gOnTheme=function(){palLoad()};
palLoad();

/* ========== 画布与状态 ========== */
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,cur=save.lv,L=null;
var slots=[],cursor=0,attempts=0,state="edit",done=false;
var run=null;   // {trace, failAt, why, pos, v2}
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);var H=210;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",function(){resize();draw();});
function usedCount(t){
  var n=0;
  for(var i=0;i<slots.length;i++)if(slots[i]===t)n++;
  return n;
}
function loadLevel(n){
  cur=clamp(n,0,LEVELS.length-1);
  L=LEVELS[cur];
  if(!CB.validate(L).ok){say("关卡数据异常");return;}
  slots=new Array(L.N).fill(-1);
  cursor=0;attempts=0;state="edit";done=false;run=null;
  $("lvTag").textContent="第 "+(cur+1)+" 关 · "+L.name;
  $("lvRule").textContent=L.N+" 段轨 · 平/上/下/弯/刹/推 ×"+L.inv.join("/");
  say("给 "+L.N+" 个轨位放轨件（1-6 直接放，Enter 循环），然后试跑");
  resize();syncHud();draw();
}
function syncHud(){
  $("stInv").textContent=L.inv[0]+"/"+L.inv[1]+"/"+L.inv[2];
  $("stInv2").textContent=L.inv[3]+"/"+L.inv[4]+"/"+L.inv[5];
  $("stTry").textContent=attempts;
}
/* ---------- 交互 ---------- */
function placeAt(i,t){
  if(state!=="edit"||done)return;
  if(t>=0){
    var free=L.inv[t]-usedCount(t)+(slots[i]===t?1:0);
    if(free<=0){say(CB.NAMES[t]+"轨用完了（库存 "+L.inv[t]+"）");return;}
  }
  slots[i]=t;
  draw();
}
function cycleSlot(){
  if(state!=="edit"||done)return;
  var t=slots[cursor];
  var tries=0;
  while(tries<7){
    t=t+1;
    if(t>5)t=-1;
    if(t===-1){slots[cursor]=-1;say("轨位 "+(cursor+1)+" 已清空");draw();return;}
    var free=L.inv[t]-usedCount(t);
    if(free>0){slots[cursor]=t;say("轨位 "+(cursor+1)+"："+CB.NAMES[t]+"轨（剩 "+(free-1)+"）");draw();return;}
    tries++;
  }
  say("没有可换的轨件了");
}
function startRun(){
  if(state!=="edit"||done)return;
  for(var i=0;i<slots.length;i++)if(slots[i]<0){say("还有空轨位没放轨件");return;}
  var types=slots.slice();
  var r=CB.sim(types);
  attempts++;
  run={trace:r.trace,failAt:r.at,why:r.why,pos:0,ok:r.ok,v2:r.v2,prog:0};
  state="run";
  if(r.ok)say("试跑中…");
  else say("试跑中…（"+CB.NAMES[types[r.at]]+"轨出问题）");
  syncHud();draw();
}
function finishRun(){
  state="edit";run=null;
  if(done)return;
  say("继续调整后可再试跑");
}
function winLevel(){
  done=true;state="done";
  if(cur<LEVELS.length-1&&cur+1>save.lv)save.lv=cur+1;
  if(cur+2>unlocked)unlocked=Math.min(LEVELS.length,cur+2);
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:cur+1,metricExtra:attempts}).catch(function(){});
  $("ovTitle").textContent=(cur>=LEVELS.length-1)?"全部通关！":"到站成功！";
  $("ovDesc").innerHTML="试跑 "+attempts+" 次 · 进站速度 "+Math.sqrt(run.v2).toFixed(2)+"（限 1.0~2.2）"+(cur<LEVELS.length-1?"<br>已解锁第 "+(cur+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(cur>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("ovRetry").hidden=true;
  ovMode="win";
  $("overlay").classList.add("show");
}
function failRun(){
  var whyTxt={stall:"半路失速停了",derail:"弯道速度太快脱轨了",slow:"到站太慢没停稳",fast:"到站太快冲出去了"}[run.why]||"出事";
  state="edit";
  run=null;
  say(whyTxt+" · 调整轨件再试（试跑不限次）");
  draw();
}
var ovMode="select";
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<unlocked-1?" done":"");
      b.textContent=i+1;
      b.disabled=i>=unlocked;
      b.addEventListener("click",function(){
        cur=i;save.lv=Math.max(save.lv,cur);persist();
        $("overlay").classList.remove("show");
        loadLevel(cur);
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("ovRetry").hidden=true;
  ovMode="select";
  $("overlay").classList.add("show");
}

/* ========== 绘制 ========== */
function segGeom(){
  var pad=34,sw=(W-pad*2-10)/L.N;
  var pts=[],h=2;
  var x0=pad,y0=150;
  pts.push([x0,y0]);
  for(var i=0;i<L.N;i++){
    var t=slots[i];
    if(t===1)h=Math.max(0,h-1);
    else if(t===2)h=Math.min(5,h+1);
    pts.push([x0+sw*(i+1),y0+h*20]);
  }
  return {pts:pts,sw:sw};
}
function draw(){
  ctx.fillStyle=PAL.surface2;ctx.fillRect(0,0,W,210);
  var g=segGeom();
  //支架
  ctx.strokeStyle=PAL.faint;ctx.lineWidth=1;
  for(var s=0;s<g.pts.length;s++){
    ctx.beginPath();ctx.moveTo(g.pts[s][0],g.pts[s][1]);ctx.lineTo(g.pts[s][0],176);ctx.stroke();
  }
  ctx.fillStyle=PAL.surface;
  ctx.fillRect(10,176,W-20,6);
  //站台
  ctx.fillStyle=PAL.primary;
  ctx.fillRect(W-30,140,20,36);
  ctx.fillStyle=PAL.badgeText;
  ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("站",W-20,158);
  //轨道
  for(var i=0;i<L.N;i++){
    var a=g.pts[i],b=g.pts[i+1],t=slots[i];
    var filled=t>=0;
    ctx.strokeStyle=filled?PAL.deep:PAL.faint;
    ctx.lineWidth=filled?3:1.5;
    ctx.setLineDash(filled?[]:[4,3]);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    ctx.setLineDash([]);
    //轨件符号
    var mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
    ctx.fillStyle=cursor===i?PAL.warning:PAL.muted;
    ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(filled?CB.NAMES[t]:"·",mx,my-10);
    if(cursor===i&&state==="edit"){
      ctx.strokeStyle=PAL.warning;ctx.lineWidth=2;
      ctx.strokeRect(a[0]+1,Math.min(a[1],b[1])-2,g.sw-2,Math.abs(b[1]-a[1])+18);
    }
  }
  //试跑小车
  if(run){
    var f=Math.min(run.prog,L.N);
    var fi=Math.min(L.N-1,Math.floor(f)),fr=f-fi;
    var ca=g.pts[fi],cb2=g.pts[Math.min(L.N,fi+1)];
    var cx0=ca[0]+(cb2[0]-ca[0])*fr,cy0=ca[1]+(cb2[1]-ca[1])*fr;
    var vi=run.trace[Math.min(run.trace.length-1,fi)]||CB.V0;
    ctx.fillStyle=run.failAt>=0&&f>=run.failAt?PAL.danger:PAL.primary;
    ctx.beginPath();ctx.arc(cx0,cy0-5,7,0,7);ctx.fill();
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=PAL.text;
    ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText("v"+Math.sqrt(Math.max(0,vi)).toFixed(1),cx0,cy0-18);
  }
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.strokeRect(0.5,0.5,W-1,209);
}

/* ========== 步进（试跑为纯动画，结果已由确定性 sim 预定；rAF + visibilitychange 停帧/续跑） ========== */
var SPEED=2.6;
function step(dt){
  if(state!=="run"||!run)return;
  run.prog+=SPEED*dt;
  if(run.failAt>=0&&run.prog>=run.failAt+0.5){failRun();return;}
  if(run.prog>=L.N+0.6){
    if(run.ok)winLevel();
    else failRun();
  }
}

/* ========== 主循环 ========== */
var rafPending=false,lastTs=0;
function frame(ts){
  rafPending=false;
  if(document.hidden)return;
  if(!lastTs)lastTs=ts;
  var dt=Math.min(0.05,(ts-lastTs)/1000||0);
  lastTs=ts;
  step(dt);draw();
  rafPending=true;requestAnimationFrame(frame);
}
function kick(){if(!rafPending&&!document.hidden){rafPending=true;requestAnimationFrame(frame);}}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){lastTs=0;}
  else{lastTs=0;kick();}
});

/* ========== 输入 ========== */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  var g=segGeom();
  for(var i=0;i<L.N;i++){
    var a=g.pts[i],b=g.pts[i+1];
    if(x>=a[0]&&x<=b[0]){
      cursor=i;
      if(y>90)placeAt(i,(slots[i]+1>5?-1:slots[i]+1));
      draw();
      return;
    }
  }
});
$("btnPrev").addEventListener("click",function(){if(state==="edit"){cursor=(cursor+L.N-1)%L.N;draw();}});
$("btnCycle").addEventListener("click",cycleSlot);
$("btnRun").addEventListener("click",startRun);
$("btnReset").addEventListener("click",function(){
  slots=new Array(L.N).fill(-1);
  state="edit";run=null;done=false;
  $("overlay").classList.remove("show");
  say("轨道已清空");
  draw();
});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(ovMode==="win"){
    if(cur>=LEVELS.length-1){cur=0;save.lv=0;persist();loadLevel(0);}
    else{cur++;loadLevel(cur);}
  }else if(ovMode==="fail"){
    openLevelSelect();
  }
});
$("ovRetry").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  state="edit";
});
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft"){if(state==="edit"){cursor=(cursor+L.N-1)%L.N;draw();}e.preventDefault();}
  else if(e.key==="ArrowRight"){if(state==="edit"){cursor=(cursor+1)%L.N;draw();}e.preventDefault();}
  else if(e.key>="1"&&e.key<="6"){placeAt(cursor,parseInt(e.key,10)-1);e.preventDefault();}
  else if(e.key==="Enter"){cycleSlot();e.preventDefault();}
  else if(e.key===" "){startRun();e.preventDefault();}
  else if(e.key==="r"||e.key==="R"){
    slots=new Array(L.N).fill(-1);
    state="edit";run=null;done=false;
    $("overlay").classList.remove("show");
    draw();
  }
});

/* 调试验证入口 */
window.__validateLevels=function(){try{return CB.runTests()}catch(e){return {error:String(e)}}};

/* ========== 启动（续玩：从存档关卡起步） ========== */
cur=clamp(save.lv,0,LEVELS.length-1);
loadLevel(cur);
requestAnimationFrame(frame);
syncLevelsFromServer();
syncSaveFromServer();

})();
</script>
