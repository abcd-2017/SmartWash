<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>弹币入格</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（--g-st-* 为本作素材色，深色为同色相压暗变体）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-st-coin:#F2C14E;--g-st-coinln:#B8860B;--g-st-grid:#EFF1EE;--g-st-gridln:#C9CFC7;--g-st-zone:#E8F6EF;--g-st-aim:#2D9B6A;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-coin:#8A6A1E;--g-st-coinln:#C9A34A;--g-st-grid:#262A27;--g-st-gridln:#3A423C;--g-st-zone:#1D3229;--g-st-aim:#5BC894;color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 2px; text-align: center; line-height: 1.3; min-width: 0; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stage { position: relative; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); box-shadow: var(--g-shadow); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--g-btn-primary); color: #fff; }
  .btn:active { opacity: .85; }
  .btn[disabled] { opacity: .4; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay { position: fixed; inset: 0; z-index: 10; background: var(--g-scrim); display: none; align-items: center; justify-content: center; padding: 20px; }
  .overlay.show { display: flex; }
  .panel { width: 100%; max-width: 320px; padding: 22px 18px; background: var(--g-surface); border-radius: var(--g-radius); box-shadow: var(--g-shadow); text-align: center; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .desc b { color: var(--g-primary-deep); font-size: 28px; }
  .panel .btn { width: 100%; }

  /* S2: 动效敏感用户降级（动效层指令，不受 §4 主题层禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
/* SW 图标库：内联 SVG 线性图标（stroke=currentColor，24 viewBox，与 UI 令牌联动） */
window.SW_ICON=function(n,s){s=s||"";var P={
 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>','arrow-left':'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 'arrow-up':'<path d="M12 19V5M6 11l6-6 6 6"/>','arrow-down':'<path d="M12 5v14M6 13l6 6 6-6"/>',
 'rotate':'<path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>',
 'check':'<path d="M4 12.5l5 5L20 6.5"/>','x':'<path d="M6 6l12 12M18 6L6 18"/>',
 'star':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',
 'star-o':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',
 'circle':'<circle cx="12" cy="12" r="5.5"/>','circle-f':'<circle cx="12" cy="12" r="5.5"/>',
 'tri-up':'<path d="M12 5l8 15H4z"/>','tri-down':'<path d="M12 19l-8-15h16z"/>','tri-left':'<path d="M5 12l15-8v16z"/>','tri-right':'<path d="M19 12L4 4v16z"/>',
 'backspace':'<path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z M12.5 9.5l5 5M17.5 9.5l-5 5"/>',
 'swap-h':'<path d="M7 4L3 8l4 4M3 8h14M17 12l4 4-4 4M21 16H7"/>'
};
var fill={ 'star':1,'circle-f':1,'tri-up':1,'tri-down':1,'tri-left':1,'tri-right':1 };
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};
</script>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>
</head>
<body>
<div class="wrap">
  <header><span class="sub">向后拖拽蓄力，松手弹币入格</span><span class="sub" id="bestTag">最高 0</span></header>
  <div class="stats">
    <div class="stat"><span class="label">分数</span><span class="val" id="stScore">0</span></div>
    <div class="stat"><span class="label">硬币</span><span class="val" id="stCoins">20</span></div>
    <div class="stat"><span class="label">连中</span><span class="val" id="stCombo">0</span></div>
  </div>
  <div class="stage"><canvas id="cv" aria-label="弹币入格场地" role="img"></canvas></div>
  <p class="msg" id="msg" role="status" aria-live="polite">按住硬币向后拉，松手弹出</p>
  <div class="tools">
    <button class="btn" id="btnRestart" type="button">重开</button>
    <button class="btn" id="btnHint" type="button">提示</button>
    <button class="btn primary" id="btnFire" type="button">发射</button>
  </div>
  <p class="foot">触屏：按住硬币拖动蓄力松手 · 键盘：←/→ 调角度，↑/↓ 调力度，空格发射</p>
</div>
<div class="overlay" role="dialog" aria-modal="true" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">本局结束</h2>
    <p class="desc" id="ovDesc"></p>
    <button class="btn primary" id="ovBtn" type="button">再来一局</button>
  </div>
</div>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 调色板（canvas 颜色全部经 PAL 读 CSS 变量） ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    success:v("--g-success"),warning:v("--g-warning"),danger:v("--g-danger"),
    coin:v("--g-st-coin"),coinln:v("--g-st-coinln"),grid:v("--g-st-grid"),
    gridln:v("--g-st-gridln"),zone:v("--g-st-zone"),aim:v("--g-st-aim")};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 常量 ---------- */
var COLS=5,ROWS=3;
var ZONES=[
  [10,20,30,20,10],
  [20,50,30,50,20],
  [30,20,100,20,30]
];
var TOTAL_COINS=20;
var SAVE_KEY="sw.coinflick.v1";
/* ---------- 状态 ---------- */
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,dpr=1,cell=0,gridTop=0,gridBot=0,launchY=0,groundY=0;
var coin={x:0,y:0,vx:0,vy:0,r:16};
var drag={on:false,px:0,py:0};
var flying=false,settling=false,settleT=0;
var aimAng=-Math.PI/2,aimPow=0.6;
var score=0,coinsLeft=TOTAL_COINS,combo=0,best=0,over=false;
var floats=[];//飘字
var lastTs=0;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* ---------- 存档 ---------- */
function loadBest(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&typeof s.best==="number")return s.best;}catch(e){}return 0}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({best:best}));}catch(e){}
  if(GB.available)GB.saveState("coin-flick",{best:best}).catch(function(){});
}
best=loadBest();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("coin-flick").then(function(res){
    if(!res||!res.stateJson)return;
    try{var r=JSON.parse(res.stateJson);var rb=parseInt(r.best,10)||0;if(rb>best){best=rb;persist();updStats()}}catch(e){}
  }).catch(function(){});
}
/* ---------- 布局 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=wCss;H=Math.round(W*1.18);
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cell=Math.floor((W-24)/COLS);
  var gridH=cell*ROWS;
  gridTop=18;gridBot=gridTop+gridH;
  launchY=H-Math.round(H*0.16);
  groundY=H-14;
  coin.r=Math.max(13,Math.round(cell*0.30));
  if(!flying&&!drag.on)resetCoin();
}
function resetCoin(){coin.x=W/2;coin.y=launchY;coin.vx=0;coin.vy=0}
/* ---------- 统计 ---------- */
function updStats(){
  $("stScore").textContent=score;
  $("stCoins").textContent=coinsLeft;
  $("stCombo").textContent=combo;
  $("bestTag").textContent="最高 "+best;
}
/* ---------- 发射 ---------- */
function launch(){
  if(flying||over||drag.on)return;
  var sp=420+980*aimPow;
  coin.vx=Math.cos(aimAng)*sp;
  coin.vy=Math.sin(aimAng)*sp;
  flying=true;settling=false;
  say("硬币滑行中……");
}
/* ---------- 判定 ---------- */
function settle(){
  settling=false;flying=false;
  var cx=coin.x,cy=coin.y;
  var col=Math.floor((cx-12)/cell),row=Math.floor((cy-gridTop)/cell);
  var inGrid=col>=0&&col<COLS&&row>=0&&row<ROWS;
  if(inGrid){
    var val=ZONES[row][col];
    combo++;
    var gain=val+(combo-1)*5;
    score+=gain;
    floats.push({x:cx,y:cy,t:"+"+gain,ts:Date.now(),c:PAL.success});
    say("入格 "+val+" 分"+(combo>1?" · 连中 ×"+combo:""));
  }else{
    combo=0;
    floats.push({x:cx,y:cy,t:"未入格",ts:Date.now(),c:PAL.muted});
    say("未入格，连中清零");
  }
  coinsLeft--;
  updStats();
  if(coinsLeft<=0){endGame();return}
  setTimeout(function(){if(!over){resetCoin()}},420);
}
function endGame(){
  over=true;
  var isNew=score>best;
  if(isNew){best=score;persist()}
  if(GB.available)GB.reportScore("coin-flick",{metricValue:score,metricExtra:combo}).catch(function(){});
  $("ovTitle").textContent="本局结束";
  $("ovDesc").innerHTML="得分 <b>"+score+"</b>"+(isNew?" · 新纪录":"")+"<br>剩余硬币 "+coinsLeft+" · 最高 "+best;
  $("overlay").classList.add("show");
}
/* ---------- 主循环 ---------- */
function step(ts){
  if(!lastTs)lastTs=ts;
  var dt=Math.min(0.033,(ts-lastTs)/1000);lastTs=ts;
  if(flying){
    var damp=Math.pow(0.22,dt);
    coin.vx*=damp;coin.vy*=damp;
    coin.x+=coin.vx*dt;coin.y+=coin.vy*dt;
    var sp=Math.hypot(coin.vx,coin.vy);
    if(coin.x<coin.r+6){coin.x=coin.r+6;coin.vx=Math.abs(coin.vx)*0.55}
    if(coin.x>W-coin.r-6){coin.x=W-coin.r-6;coin.vx=-Math.abs(coin.vx)*0.55}
    if(coin.y<coin.r+6){coin.y=coin.r+6;coin.vy=Math.abs(coin.vy)*0.55}
    if(coin.y>groundY-coin.r){coin.y=groundY-coin.r;coin.vy=-Math.abs(coin.vy)*0.4}
    if(sp<34){settling=true;settleT=ts}
  }
  if(settling&&ts-settleT>260)settle();
  draw(ts);
  requestAnimationFrame(step);
}
/* ---------- 绘制 ---------- */
function draw(ts){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  //得分格
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    var x=12+c*cell,y=gridTop+r*cell;
    ctx.fillStyle=(r+c)%2?PAL.zone:PAL.grid;
    rr(x+2,y+2,cell-4,cell-4,10);ctx.fill();
    ctx.strokeStyle=PAL.gridln;ctx.lineWidth=1.5;rr(x+2,y+2,cell-4,cell-4,10);ctx.stroke();
    ctx.fillStyle=PAL.deep;ctx.font="700 "+(cell>=72?22:18)+"px -apple-system,'PingFang SC',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(String(ZONES[r][c]),x+cell/2,y+cell/2);
  }
  //发射线
  ctx.strokeStyle=PAL.faint;ctx.lineWidth=1.5;ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.moveTo(8,launchY+coin.r+8);ctx.lineTo(W-8,launchY+coin.r+8);ctx.stroke();
  ctx.setLineDash([]);
  //瞄准
  if(!flying&&!over){
    var len=40+90*aimPow;
    var ax=coin.x+Math.cos(aimAng)*len,ay=coin.y+Math.sin(aimAng)*len;
    ctx.strokeStyle=PAL.aim;ctx.lineWidth=3;ctx.setLineDash([8,6]);
    ctx.beginPath();ctx.moveTo(coin.x,coin.y);ctx.lineTo(ax,ay);ctx.stroke();ctx.setLineDash([]);
    //拖拽橡皮筋
    if(drag.on){
      ctx.strokeStyle=PAL.muted;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(coin.x,coin.y);ctx.lineTo(drag.px,drag.py);ctx.stroke();
      ctx.fillStyle=PAL.muted;
      ctx.font="600 14px -apple-system,'PingFang SC',sans-serif";
      ctx.textAlign="center";ctx.fillText("力度 "+Math.round(aimPow*100)+"%",coin.x,coin.y-coin.r-12);
    }
  }
  //硬币
  ctx.fillStyle=PAL.coin;ctx.beginPath();ctx.arc(coin.x,coin.y,coin.r,0,7);ctx.fill();
  ctx.strokeStyle=PAL.coinln;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(coin.x,coin.y,coin.r,0,7);ctx.stroke();
  ctx.fillStyle=PAL.coinln;ctx.beginPath();ctx.arc(coin.x,coin.y,coin.r*0.55,0,7);ctx.stroke();
  ctx.fillStyle=PAL.surface;
  ctx.font="700 "+Math.round(coin.r*0.7)+"px -apple-system,'PingFang SC',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("¥",coin.x,coin.y+1);
  //飘字
  var now=Date.now();
  floats=floats.filter(function(f){return now-f.ts<900});
  for(var i=0;i<floats.length;i++){
    var f=floats[i],k=(now-f.ts)/900;
    ctx.globalAlpha=1-k;
    ctx.fillStyle=f.c;ctx.font="700 18px -apple-system,'PingFang SC',sans-serif";
    ctx.textAlign="center";ctx.fillText(f.t,f.x,f.y-26-k*26);
    ctx.globalAlpha=1;
  }
  if(over){
    ctx.fillStyle=PAL.scrim;ctx.fillRect(0,0,W,H);
  }
}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
/* ---------- 输入 ---------- */
function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",function(e){
  if(over||flying)return;
  var p=pt(e);
  if(Math.hypot(p.x-coin.x,p.y-coin.y)>coin.r*2.6)return;
  drag.on=true;drag.px=p.x;drag.py=p.y;
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(!drag.on)return;
  var p=pt(e);drag.px=p.x;drag.py=p.y;
  var dx=coin.x-p.x,dy=coin.y-p.y;
  var len=Math.hypot(dx,dy);
  if(len>6){aimAng=Math.atan2(dy,dx)}
  aimPow=Math.max(0.08,Math.min(1,len/230));
  e.preventDefault();
});
function endDrag(e){
  if(!drag.on)return;
  drag.on=false;
  launch();
}
cv.addEventListener("pointerup",endDrag);
cv.addEventListener("pointercancel",function(){drag.on=false});
/* 键盘 */
window.addEventListener("keydown",function(e){
  if(over)return;
  var k=e.key;
  if(k==="ArrowLeft"){aimAng-=0.09;e.preventDefault()}
  else if(k==="ArrowRight"){aimAng+=0.09;e.preventDefault()}
  else if(k==="ArrowUp"){aimPow=Math.min(1,aimPow+0.05);e.preventDefault()}
  else if(k==="ArrowDown"){aimPow=Math.max(0.08,aimPow-0.05);e.preventDefault()}
  else if(k===" "||k==="Enter"){launch();e.preventDefault()}
});
$("btnFire").addEventListener("click",launch);
$("btnRestart").addEventListener("click",function(){
  score=0;coinsLeft=TOTAL_COINS;combo=0;over=false;flying=false;settling=false;floats=[];
  resetCoin();updStats();hideOverlay();say("新的一局，向后拖拽蓄力");
});
$("btnHint").addEventListener("click",function(){
  say("提示：拉力越长力度越大；瞄准高分格，连中有加成");
});
$("ovBtn").addEventListener("click",function(){$("btnRestart").click()});
function hideOverlay(){$("overlay").classList.remove("show")}
window.addEventListener("resize",resize);
palLoad();resize();updStats();resetCoin();
requestAnimationFrame(step);
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套） */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
