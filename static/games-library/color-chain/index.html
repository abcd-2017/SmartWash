<script>
/* ========== 独立验证器（纯逻辑，与交互判定互不引用）：逐簇 DFS 哈密顿路复核 ========== */
(function(){
"use strict";
var DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function cvParse(cells){
  var rows=cells.length,cols=cells[0].length,g=[];
  for(var y=0;y<rows;y++){
    var row=[];
    for(var x=0;x<cols;x++)row.push(parseInt(cells[y].charAt(x),10));
    g.push(row);
  }
  return {g:g,cols:cols,rows:rows};
}
function cvClusters(g,cols,rows){   // 广度优先泛洪分簇
  var seen={},clusters=[];
  for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
    var k=y*cols+x;
    if(seen[k]||!g[y][x])continue;
    var color=g[y][x],cl=[],q=[k];
    seen[k]=1;
    while(q.length){
      var p=q.shift();cl.push(p);
      var px=p%cols,py=(p/cols)|0;
      for(var d=0;d<4;d++){
        var nx=px+DIRS[d][0],ny=py+DIRS[d][1];
        if(nx<0||nx>=cols||ny<0||ny>=rows)continue;
        var k2=ny*cols+nx;
        if(seen[k2]||g[ny][nx]!==color)continue;
        seen[k2]=1;q.push(k2);
      }
    }
    clusters.push({color:color,cells:cl});
  }
  return clusters;
}
function cvHasHam(g,cols,rows,cl){   // 逐起点 DFS 找覆盖整簇的路径
  var n=cl.cells.length,idx={};
  for(var i=0;i<n;i++)idx[cl.cells[i]]=1;
  function dfs(path,visited){
    if(path.length===n)return true;
    var last=path[path.length-1],lx=last%cols,ly=(last/cols)|0;
    for(var d=0;d<4;d++){
      var nx=lx+DIRS[d][0],ny=ly+DIRS[d][1];
      if(nx<0||nx>=cols||ny<0||ny>=rows)continue;
      var k=ny*cols+nx;
      if(visited[k]||!idx[k])continue;
      visited[k]=1;path.push(k);
      if(dfs(path,visited))return true;
      delete visited[k];path.pop();
    }
    return false;
  }
  for(var s=0;s<cl.cells.length;s++){
    var v={};v[cl.cells[s]]=1;
    if(dfs([cl.cells[s]],v))return true;
  }
  return false;
}
function cvAllSolvable(g,cols,rows){
  var cls=cvClusters(g,cols,rows);
  for(var i=0;i<cls.length;i++)if(!cvHasHam(g,cols,rows,cls[i]))return false;
  return cls.length>0;
}
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(!Array.isArray(d.cells)||d.cells.length<5||d.cells.length>7)return false;
  var cols=d.cells[0].length;
  if(cols<5||cols>7)return false;
  for(var y=0;y<d.cells.length;y++){
    if(typeof d.cells[y]!=="string"||d.cells[y].length!==cols)return false;
    for(var x=0;x<cols;x++){
      var ch=d.cells[y].charAt(x);
      if(ch<"1"||ch>"4")return false;
    }
  }
  return true;
}
function normalizeLevel(d,idx){
  var p=cvParse(d.cells);
  var ok=cvAllSolvable(p.g,p.cols,p.rows);
  var name=(d&&typeof d.name==="string"&&d.name.trim())?d.name:"色链·"+String(idx+1).padStart(2,"0");
  return {name:name,cells:d.cells,cols:p.cols,rows:p.rows,par:ok?cvClusters(p.g,p.cols,p.rows).length:0,difficulty:Number.isInteger(d.difficulty)?Math.min(9,Math.max(1,d.difficulty)):3};
}
window.__CC={cvParse:cvParse,cvClusters:cvClusters,cvHasHam:cvHasHam,cvAllSolvable:cvAllSolvable,validLevelData:validLevelData,normalizeLevel:normalizeLevel};
})();
</script>

      if(g[ny][nx]===color)dfs(nx,ny);

  $("lvRule").textContent=L.name+" · "+cols+"×"+rows;
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  if(!ok)say("警告：验证器判定存在不可一笔画簇（数据异常）");
  else say("一笔连满同色一簇即可消除，清空全盘过关");
  updStats();resize();
}
function clusterCount(){
  var c=0,seen={},i,y,x;
  for(y=0;y<rows;y++)for(x=0;x<cols;x++){
    var k=y*cols+x;
    if(seen[k]||!g[y][x])continue;
    c++;
    var col=g[y][x],q=[k];seen[k]=1;
    var D=[[1,0],[-1,0],[0,1],[0,-1]];
    while(q.length){
      var p=q.shift(),px=p%cols,py=(p/cols)|0;
      for(i=0;i<4;i++){
        var nx=px+D[i][0],ny=py+D[i][1];
        if(nx<0||nx>=cols||ny<0||ny>=rows)continue;
        var k2=ny*cols+nx;
        if(seen[k2]||g[ny][nx]!==col)continue;
        seen[k2]=1;q.push(k2);
      }
    }
  }
  return c;
}
function updStats(){
  $("stMoves").textContent=moves;
  $("stCluster").textContent=clusterCount();
  $("btnUndo").disabled=!history.length||done;
}
var history=[];
function snapshot(){history.push(g.map(function(r){return r.slice()}))}
function undo(){
  if(!history.length||done)return;
  g=history.pop();moves=history.length+1;chain=[];
  say("已撤销一笔");updStats();render();
}
/* ---------- 链操作 ---------- */
function clusterSizeOf(k){
  var x=k%cols,y=(k/cols)|0;
  return pClusterOf(g,cols,rows,x,y).length;
}
function addToChain(k){
  if(done)return;
  if(g[(k/cols)|0][k%cols]===0){say("这里已经清空了");return;}
  if(chain.length===0){
    chain.push(k);
    say("起笔于第 "+(chain.length)+" 格");
    render();return;
  }
  if(chain.indexOf(k)>=0){say("已在这一格里");return;}
  var last=chain[chain.length-1];
  var lx=last%cols,ly=(last/cols)|0;
  var x=k%cols,y=(k/cols)|0;
  if(Math.abs(lx-x)+Math.abs(ly-y)!==1){say("只能连到相邻格");return;}
  if(g[y][x]!==g[ly][lx]){say("颜色不同，不能跨簇");return;}
  if(chain.length>=2&&k===chain[chain.length-2]){   // 走回上一格 = 回退一格
    chain.pop();say("回退一格，剩 "+chain.length);render();return;
  }
  chain.push(k);
  var need=clusterSizeOf(chain[0]);
  if(chain.length===need){
    // 连满整簇：消除
    snapshot();moves++;
    chain.forEach(function(k2){g[(k2/cols)|0][k2%cols]=0});
    chain=[];
    say("连满消除！还剩 "+clusterCount()+" 簇");
    updStats();render();
    if(clusterCount()===0){winLevel();return;}
  }else{
    say("已连 "+chain.length+" / 需 "+need);
    render();
  }
}
function popChain(){
  if(chain.length){chain.pop();say("回退一格，剩 "+chain.length);render();}
}
function cancelChain(){chain=[];say("本笔作废");render();}
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  save.solved++;persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:moves}).catch(function(){});
  $("ovTitle").textContent="清空全盘！";
  $("ovDesc").innerHTML="用 "+moves+" 笔清空全部色簇"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
  say("清空全盘！");
}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n2){return s.getPropertyValue(n2).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),
    c1:v("--g-st-c1"),c2:v("--g-st-c2"),c3:v("--g-st-c3"),c4:v("--g-st-c4")};
}
window.__gOnTheme=function(){palLoad();render()};//App 推送主题时刷新调色板并重绘
/* ---------- 绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);
  cell=Math.min(64,W/cols);
  H=Math.round(cell*rows);
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  render();
}
function colOf(c){
  return [PAL.c1,PAL.c2,PAL.c3,PAL.c4][c-1];
}
function render(){
  if(!g)return;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=PAL.surface2;ctx.fillRect(0,0,W,H);
  var y,x;
  for(y=0;y<rows;y++)for(x=0;x<cols;x++){
    var px=x*cell,py=y*cell,c=g[y][x];
    if(c){
      ctx.fillStyle=colOf(c);
      ctx.fillRect(px+1,py+1,cell-2,cell-2);
    }
  }
  //链上高亮
  for(var i=0;i<chain.length;i++){
    var k=chain[i],kx=k%cols,ky=(k/cols)|0;
    ctx.strokeStyle=PAL.text;ctx.lineWidth=3;
    ctx.strokeRect(kx*cell+3,ky*cell+3,cell-6,cell-6);
  }
  //提示簇脉冲
  if(hintCl&&Date.now()-hintT<2600){
    var pulse=0.5+0.5*Math.sin((Date.now()-hintT)/170);
    ctx.strokeStyle=PAL.warning;ctx.lineWidth=3;ctx.globalAlpha=0.4+pulse*0.6;
    hintCl.forEach(function(k){
      ctx.strokeRect((k%cols)*cell+4,((k/cols)|0)*cell+4,cell-8,cell-8);
    });
    ctx.globalAlpha=1;
  }
  //光标
  if(!done){
    var cx2=cursor%cols,cy2=(cursor/cols)|0;
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;
    ctx.strokeRect(cx2*cell+1.5,cy2*cell+1.5,cell-3,cell-3);
  }
}
function loop(){render();requestAnimationFrame(loop)}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  if(done)return;
  var cx3=Math.max(0,Math.min(cols-1,Math.floor(x/cell)));
  var cy3=Math.max(0,Math.min(rows-1,Math.floor(y/cell)));
  dragging=true;
  chain=[];
  addToChain(cy3*cols+cx3);
  cursor=cy3*cols+cx3;
});
cv.addEventListener("pointermove",function(e){
  if(!dragging||done)return;
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  var cx4=Math.max(0,Math.min(cols-1,Math.floor(x/cell)));
  var cy4=Math.max(0,Math.min(rows-1,Math.floor(y/cell)));
  var k=cy4*cols+cx4;
  if(chain.length&&k===chain[chain.length-2]){popChain();return;}
  if(chain.indexOf(k)>=0)return;
  var last=chain[chain.length-1];
  if(last===undefined)return;
  var lx=last%cols,ly=(last/cols)|0;
  if(Math.abs(lx-cx4)+Math.abs(ly-cy4)!==1)return;
  if(g[cy4][cx4]!==g[ly][lx])return;
  addToChain(k);
});
function endDrag(){
  if(!dragging)return;
  dragging=false;
  if(chain.length){
    var need=clusterSizeOf(chain[0]);
    if(chain.length<need){
      moves++;
      say("未连满整簇（"+chain.length+" / "+need+"），本笔作废");
      updStats();
    }
    chain=[];
  }
  render();
}
cv.addEventListener("pointerup",endDrag);
cv.addEventListener("pointercancel",endDrag);
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
function hint(){
  if(done)return;
  var cls=CC.cvClusters(g,cols,rows);
  if(!cls.length){say("已经清空了");return;}
  var cl=cls[0];
  for(var i=0;i<cls.length;i++){
    if(CC.cvHasHam(g,cols,rows,cls[i])){cl=cls[i];break;}
  }
  hintCl=cl.cells;hintT=Date.now();
  say("选了一个可一笔画完的簇（黄色描边提示）");
}
function hideOverlay(){$("overlay").classList.remove("show")}
function openLevelSelect(){
  var ggrid=$("lvgrid");ggrid.hidden=false;
  ggrid.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      ggrid.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"){cursor=cursor%cols>0?cursor-1:cursor;e.preventDefault();}
  else if(k==="ArrowRight"){cursor=cursor%cols<cols-1?cursor+1:cursor;e.preventDefault();}
  else if(k==="ArrowUp"){cursor=cursor-cols>=0?cursor-cols:cursor;e.preventDefault();}
  else if(k==="ArrowDown"){cursor=cursor+cols<cols*rows?cursor+cols:cursor;e.preventDefault();}
  else if(k==="Enter"||k===" "){if($("overlay").classList.contains("show"))$("ovBtn").click();else addToChain(cursor);e.preventDefault();}
  else if(k==="Backspace"||k==="z"||k==="Z"){if(chain.length)popChain();else undo();e.preventDefault();}
  else if(k==="Escape")cancelChain();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
  render();
});
window.addEventListener("resize",resize);
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);resize();loop();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
