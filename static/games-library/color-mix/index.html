<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>调色师</title>
<style>
  /*token:GAME-THEME.md §2 基线（值与基线一致）+ §3 素材 token（--g-st-p1..3 为三原色颜料，深色提亮）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-st-p1:#C9526B;--g-st-p2:#E0B13E;--g-st-p3:#4A9FD4;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-p1:#DB7186;--g-st-p2:#E2A44E;--g-st-p3:#6BB4DE;color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; min-width: 0; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.low { color: var(--g-danger); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--g-btn-primary); color: #fff; font-size: 16px; font-weight: 600; }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .35; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效 */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}

  /* 调色台 */
  .swatches { display: flex; gap: 10px; margin-bottom: 10px; }
  .sw { flex: 1; text-align: center; }
  .sw .box { height: 84px; border-radius: var(--g-radius-inner); border: 2px solid var(--g-border); }
  .sw .cap { font-size: 12px; color: var(--g-muted); padding-top: 4px; }
  .errbar { height: 10px; border-radius: 10px; background: var(--g-surface2); overflow: hidden; margin-bottom: 4px; }
  .errbar>div { height: 100%; width: 0; background: var(--g-primary); transition: width .15s; }
  .pig { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .pig .psw { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--g-border); flex: none; }
  .pig .pname { width: 44px; font-size: 16px; font-weight: 600; }
  .pig .pbtn {
    min-height: 44px; min-width: 52px; flex: 1; border: 0; padding: 0;
    border-radius: var(--g-radius-btn); cursor: pointer;
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 22px; font-weight: 700;
  }
  .pig .pbtn:active { opacity: .85; }
  .pig .pcount { width: 40px; text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .pig.sel .pcount { outline: 2px solid var(--g-primary-deep); outline-offset: 4px; border-radius: 4px; }
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="color-mix",SAVE_KEY="sw.colormix.v1";
var DEFAULT_LEVELS=[{"name":"调色·01","t":[2,2,0],"par":4,"difficulty":1},{"name":"调色·02","t":[1,0,2],"par":3,"difficulty":1},{"name":"调色·03","t":[2,3,0],"par":5,"difficulty":1},{"name":"调色·04","t":[3,0,1],"par":4,"difficulty":1},{"name":"调色·05","t":[3,0,1],"par":4,"difficulty":1},{"name":"调色·06","t":[3,0,3],"par":6,"difficulty":1},{"name":"调色·07","t":[2,3,0],"par":5,"difficulty":1},{"name":"调色·08","t":[3,2,0],"par":5,"difficulty":2},{"name":"调色·09","t":[3,1,0],"par":4,"difficulty":2},{"name":"调色·10","t":[3,0,3],"par":6,"difficulty":2},{"name":"调色·11","t":[0,3,2],"par":5,"difficulty":2},{"name":"调色·12","t":[3,2,0],"par":5,"difficulty":2},{"name":"调色·13","t":[0,3,2],"par":5,"difficulty":2},{"name":"调色·14","t":[3,3,1],"par":7,"difficulty":2},{"name":"调色·15","t":[3,3,3],"par":9,"difficulty":3},{"name":"调色·16","t":[3,1,2],"par":6,"difficulty":3},{"name":"调色·17","t":[1,0,2],"par":3,"difficulty":3},{"name":"调色·18","t":[2,0,1],"par":3,"difficulty":3},{"name":"调色·19","t":[1,3,0],"par":4,"difficulty":3},{"name":"调色·20","t":[2,0,1],"par":3,"difficulty":3},{"name":"调色·21","t":[2,1,2],"par":5,"difficulty":3},{"name":"调色·22","t":[2,3,2],"par":7,"difficulty":4},{"name":"调色·23","t":[3,3,2],"par":8,"difficulty":4},{"name":"调色·24","t":[2,0,2],"par":4,"difficulty":4},{"name":"调色·25","t":[1,2,2],"par":5,"difficulty":4},{"name":"调色·26","t":[1,2,2],"par":5,"difficulty":4},{"name":"调色·27","t":[1,3,7],"par":11,"difficulty":4},{"name":"调色·28","t":[5,5,1],"par":11,"difficulty":4},{"name":"调色·29","t":[4,4,7],"par":15,"difficulty":5},{"name":"调色·30","t":[1,6,5],"par":12,"difficulty":5},{"name":"调色·31","t":[1,3,2],"par":6,"difficulty":5},{"name":"调色·32","t":[5,6,3],"par":14,"difficulty":5},{"name":"调色·33","t":[1,3,7],"par":11,"difficulty":5},{"name":"调色·34","t":[1,6,7],"par":14,"difficulty":5},{"name":"调色·35","t":[4,1,6],"par":11,"difficulty":5},{"name":"调色·36","t":[6,7,5],"par":18,"difficulty":6},{"name":"调色·37","t":[4,5,6],"par":15,"difficulty":6},{"name":"调色·38","t":[3,7,7],"par":17,"difficulty":6},{"name":"调色·39","t":[6,4,6],"par":16,"difficulty":6},{"name":"调色·40","t":[7,7,3],"par":17,"difficulty":6}];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!verifyLevel(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return verifyLevel(d)})){
      LEVELS=list.map(normalizeLevel);return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

//__VERIFY__START
/* 调色师独立验证器：整数混合实现复算目标色（与运行时浮点加权实现互核） */
function cmParse(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return null;
  if(typeof d.name!=="string"||!d.name.trim())return null;
  if(!Array.isArray(d.t)||d.t.length!==3)return null;
  var sum=0,i;
  for(i=0;i<3;i++){
    if(!Number.isInteger(d.t[i])||d.t[i]<0||d.t[i]>10)return false;
    sum+=d.t[i];
  }
  if(sum<2)return false;   // 至少两滴，避免纯色无谜面
  return {name:d.name,t:d.t.slice(),sum:sum,
    par:Math.max(2,Number.isInteger(d.par)?d.par:sum)};
}
/* 验证器实现：整数向量累加后整除（与运行时除法加权不同路径） */
function cmMixInt(drops,pig){
  var out=[0,0,0],tot=0,i;
  for(i=0;i<3;i++)tot+=drops[i];
  if(!tot)return null;
  for(i=0;i<3;i++){
    for(var k=0;k<3;k++)out[k]+=drops[i]*pig[i][k];
  }
  return out.map(function(v){return Math.round(v/tot)});
}
function verifyLevel(d){
  var p=cmParse(d);
  if(!p)return false;
  // 深浅两套调色板常量分别复核：整数实现 vs 浮点加权实现误差 ≤1，且目标在色域内
  for(var pi=0;pi<CM_PIG_CONST.length;pi++){
    var pig=CM_PIG_CONST[pi];
    var target=cmMixInt(p.t,pig);
    if(!target)return false;
    for(var k=0;k<3;k++)if(!(target[k]>=0&&target[k]<=255))return false;
    var w=[p.t[0]/p.sum,p.t[1]/p.sum,p.t[2]/p.sum];
    var f=[0,0,0];
    for(var i=0;i<3;i++)for(var k2=0;k2<3;k2++)f[k2]+=w[i]*pig[i][k2];
    for(i=0;i<3;i++)if(Math.abs(Math.round(f[i])-target[i])>1)return false;
  }
  if(Number.isInteger(d.par)&&d.par!==p.sum)return false;
  return true;
}
function normalizeLevel(d){
  var p=cmParse(d);
  return {name:String(d.name),t:p.t,par:p.sum,
    difficulty:Math.min(9,Math.max(1,Number.isInteger(d.difficulty)?d.difficulty:5))};
}
var CM_PIG_CONST=[
  [[201,82,107],[224,177,62],[74,159,212]],   // 浅色：红/黄/蓝（与 --g-st-p1..3 一致）
  [[219,113,134],[226,164,78],[107,180,222]]  // 深色
];
//__VERIFY__END

/* ---------- 调色板 ---------- */
var PAL={},PIG=[];
function hex2rgb(h){
  var m=/^#([0-9a-fA-F]{6})$/.exec(h||"");
  if(!m)return [201,82,107];
  return [parseInt(m[1].slice(0,2),16),parseInt(m[1].slice(2,4),16),parseInt(m[1].slice(4,6),16)];
}
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),danger:v("--g-danger")};
  PIG=[];
  pigRGB=[];
  for(var i=1;i<=3;i++){
    PIG.push(s.getPropertyValue("--g-st-p"+i).trim());
    pigRGB.push(hex2rgb(PIG[i-1]));
  }
}
window.__gOnTheme=function(){palLoad();render()};
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,drops=[0,0,0],sel=0,done=false,curErr=-1;
var pigRGB=[];
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* 运行时混合：浮点加权平均（与验证器整数路径互核） */
function mixColor(dr){
  var tot=dr[0]+dr[1]+dr[2];
  if(!tot)return null;
  var out=[0,0,0];
  for(var i=0;i<3;i++){
    var w=dr[i]/tot;
    for(var k=0;k<3;k++)out[k]+=w*pigRGB[i][k];
  }
  return out.map(Math.round);
}
function rgbCss(c){return "rgb("+c[0]+","+c[1]+","+c[2]+")"}
function colorDist(a,b){
  var d=0;
  for(var k=0;k<3;k++)d+=(a[k]-b[k])*(a[k]-b[k]);
  return Math.sqrt(d);
}
function buildPigs(){
  var box=$("pigs");
  box.innerHTML="";
  var names=["红","黄","蓝"];
  for(var i=0;i<3;i++){
    (function(i){
      var row=document.createElement("div");
      row.className="pig"+(i===sel?" sel":"");
      row.innerHTML='<span class="psw" id="psw'+i+'"></span><span class="pname">'+names[i]+
        '</span><button type="button" class="pbtn" id="pm'+i+'">−</button>'+
        '<span class="pcount" id="pc'+i+'">0</span>'+
        '<button type="button" class="pbtn" id="pp'+i+'">＋</button>';
      box.appendChild(row);
      $("pm"+i).addEventListener("click",function(){adj(i,-1)});
      $("pp"+i).addEventListener("click",function(){adj(i,1)});
      $("psw"+i).addEventListener("click",function(){sel=i;buildPigs();render();});
    })(i);
  }
}
function adj(i,delta){
  if(done)return;
  var nv=drops[i]+delta;
  if(nv<0||nv>10)return;
  drops[i]=nv;
  sel=i;
  render();
}
function render(){
  var target=mixColor(L?L.t:[0,0,0]);
  var mine=mixColor(drops);
  $("boxT").style.background=target?rgbCss(target):PAL.surface2;
  $("boxM").style.background=mine?rgbCss(mine):PAL.surface2;
  if(target&&mine){
    curErr=colorDist(target,mine);
    var pct=Math.min(100,Math.round(curErr/441.67*100));
    $("stErr").textContent=pct+"%";
    $("errFill").style.width=pct+"%";
    $("errFill").style.background=pct<6?PAL.deep:(pct<18?PAL.muted:PAL.danger);
  }else{
    curErr=-1;
    $("stErr").textContent="-";
    $("errFill").style.width="0%";
  }
  var names=["红","黄","蓝"];
  for(var i=0;i<3;i++){
    $("pc"+i).textContent=drops[i];
    $("psw"+i).style.background=PIG[i];
    var row=$("pc"+i).parentElement;
    row.className="pig"+(i===sel?" sel":"");
    void names;
  }
}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!verifyLevel(L)){say("关卡数据异常");return;}
  drops=[0,0,0];sel=0;done=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent="目标由 "+L.t.reduce(function(a,b){return a+b},0)+" 滴颜料调出";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stPar").textContent=L.t[0]+L.t[1]+L.t[2]+" 滴";
  say("用红黄蓝三种颜料滴出目标色，越接近评分越高");
  buildPigs();render();
}
/* ---------- 胜负 ---------- */
function winLevel(err,stars){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:Math.round(err)}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"调色成功！";
  $("ovDesc").innerHTML="误差 "+Math.round(err)+"（"+stars+" 星）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
function submit(){
  if(done)return;
  var target=mixColor(L.t),mine=mixColor(drops);
  if(!mine){say("至少滴一滴颜料再交卷");return;}
  var err=colorDist(target,mine);
  var stars=err<=22?3:(err<=66?2:1);
  winLevel(err,stars);
}
/* ---------- 输入 ---------- */
$("btnSubmit").addEventListener("click",submit);
$("btnReset").addEventListener("click",function(){drops=[0,0,0];render();say("已清空")});
$("btnLv").addEventListener("click",function(){if(done)return;openLevelSelect()});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if($("overlay").classList.contains("show")){
    if(k===" "||k==="Enter"){$("ovBtn").click();e.preventDefault();}
    return;
  }
  if(k==="1"||k==="2"||k==="3"){sel=parseInt(k,10)-1;render();e.preventDefault();}
  else if(k==="ArrowUp"||k==="+"){adj(sel,1);e.preventDefault();}
  else if(k==="ArrowDown"||k==="-"){adj(sel,-1);e.preventDefault();}
  else if(k===" "||k==="Enter"){submit();e.preventDefault();}
  else if(k==="r"||k==="R"){drops=[0,0,0];render();say("已清空")}
});
/* ---------- 启动：逐关双实现互核 ---------- */
(function(){
  var ok=[];
  for(var i=0;i<LEVELS.length;i++){
    var pass=false;
    try{pass=verifyLevel(LEVELS[i])}catch(e){pass=false}
    if(pass)ok.push(LEVELS[i]);
  }
  if(ok.length)LEVELS=ok;
})();
palLoad();
loadLevel(save.lv);
syncLevelsFromServer();syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
