/* ---------- 结构校验 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.w)||d.w<7||d.w>8)return false;
  if(!Number.isInteger(d.h)||d.h<7||d.h>8)return false;
  var N=d.w*d.h;
  if(!Array.isArray(d.blocks))return false;
  var bl={};
  for(var i=0;i<d.blocks.length;i++){
    if(!Number.isInteger(d.blocks[i])||d.blocks[i]<0||d.blocks[i]>=N||bl[d.blocks[i]])return false;
    bl[d.blocks[i]]=1;
  }
  if(!Array.isArray(d.pairs)||d.pairs.length<2||d.pairs.length>4)return false;
  if(!Array.isArray(d.lens)||d.lens.length!==d.pairs.length)return false;
  var used={};
  for(var j=0;j<d.pairs.length;j++){
    var p=d.pairs[j];
    if(!Array.isArray(p)||p.length!==2)return false;
    for(var k=0;k<2;k++){
      if(!Number.isInteger(p[k])||p[k]<0||p[k]>=N||bl[p[k]]||used[p[k]])return false;
      used[p[k]]=1;
    }
    if(!Number.isInteger(d.lens[j])||d.lens[j]<5||d.lens[j]>15)return false;
  }
  return true;
}
/* ---------- 独立验证器：逐对 BFS 最短 + 组合回溯（与交互逻辑分离） ---------- */
function crNb(w,h,i){
  var x=i%w,y=(i/w)|0,out=[];
  if(x>0)out.push(i-1);
  if(x<w-1)out.push(i+1);
  if(y>0)out.push(i-w);
  if(y<h-1)out.push(i+w);
  return out;
}
function crBfs(w,h,blocked,src){
  var dist=new Array(w*h).fill(-1);
  dist[src]=0;
  var q=[src];
  for(var qi=0;qi<q.length;qi++){
    var list=crNb(w,h,q[qi]);
    for(var i=0;i<list.length;i++){
      var nb=list[i];
      if(dist[nb]<0&&!blocked[nb]){dist[nb]=dist[q[qi]]+1;q.push(nb)}
    }
  }
  return dist;
}
function crPaths(w,h,blocked,a,b,cap){
  var distB=crBfs(w,h,blocked,b);
  if(distB[a]<0)return null;
  var d=distB[a],paths=[];
  function dfs(cur,path){
    if(paths.length>=cap)return;
    if(cur===b){if(path.length===d+1)paths.push(path.slice());return}
    var list=crNb(w,h,cur);
    for(var i=0;i<list.length;i++){
      var nb=list[i];
      if(blocked[nb]||distB[nb]!==distB[cur]-1)continue;
      path.push(nb);
      dfs(nb,path);
      path.pop();
      if(paths.length>=cap)return;
    }
  }
  dfs(a,[a]);
  return {d:d,paths:paths};
}
function verifyLevel(L){
  if(!validLevelData(L))return false;
  var blocked={};
  for(var i=0;i<L.blocks.length;i++)blocked[L.blocks[i]]=1;
  var nodes=0,occ={},perPair=[];
  for(var p=0;p<L.pairs.length;p++){
    var r=crPaths(L.w,L.h,blocked,L.pairs[p][0],L.pairs[p][1],4000);
    if(!r||!r.paths.length)return false;
    if(r.d+1!==L.lens[p])return false;
    perPair.push(r.paths);
  }
  function rec(pi){
    if(++nodes>30000)return false;
    if(pi===perPair.length)return true;
    for(var z=0;z<perPair[pi].length;z++){
      var path=perPair[pi][z],ok=true,q;
      for(q=0;q<path.length;q++)if(occ[path[q]]){ok=false;break}
      if(!ok)continue;
      for(q=0;q<path.length;q++)occ[path[q]]=1;
      if(rec(pi+1))return true;
      for(q=0;q<path.length;q++)delete occ[path[q]];
    }

  }

}

/* ---------- 交互 ---------- */
function extend(p,cell){
  if(done||p<0)return;
  var r=route[p],a=L.pairs[p][0],b=L.pairs[p][1];
  if(!r.length){

    return;
  }
  if(r.length>=2&&cell===r[r.length-2]){
    history.push({p:p,prev:r.slice()});r.pop();moves++;updStats();checkWin();return;
  }
  if(r[r.length-1]===cell)return;
  if(r.indexOf(cell)>=0)return;
  if(occupiedOther(p,cell)){say("这一格被墙或别的路线占了");return}
  if(!npAdj(cell,r[r.length-1]))return;
  if(r.length>=L.lens[p]){say("已到理论最短长度，先回退再改道");return}
  if(cell===b&&r.length+1!==L.lens[p]){say("这条不够短，最短需要 "+L.lens[p]+" 格");return}
  history.push({p:p,prev:r.slice()});
  r.push(cell);moves++;
  if(r[r.length-1]===b&&r.length===L.lens[p]){say("这条最短路连通了！");routePop[p]=performance.now()}

    var list=crNb(w,h,cur);

  ctx.fillStyle=g;rr(x+gap,y+gap,w2,w2,rad);ctx.fill();
  var hl=ctx.createLinearGradient(0,y+gap,0,y+gap+w2*0.6);
  hl.addColorStop(0,"rgba(255,255,255,0.55)");hl.addColorStop(1,"rgba(255,255,255,0)");   // 恒白高光
  ctx.fillStyle=hl;rr(x+gap,y+gap,w2,w2,rad);ctx.fill();
  var sh=ctx.createLinearGradient(0,y+gap+w2*0.55,0,y+gap+w2);
  sh.addColorStop(0,"rgba(0,0,0,0)");sh.addColorStop(1,"rgba(0,0,0,0.10)");   // 恒黑阴影
  ctx.fillStyle=sh;rr(x+gap,y+gap,w2,w2,rad);ctx.fill();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.frame;rr(x+gap+0.5,y+gap+0.5,w2-1,w2-1,rad);ctx.stroke();
}
/* 墙块：灰绿面 + 顶光倒角 + 落地投影 */
function drawWall(x,y,gap,rad){
  var w2=cs-2*gap;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.28)";ctx.shadowBlur=cs*0.10;ctx.shadowOffsetY=cs*0.045;   // 恒黑阴影
  var g=ctx.createLinearGradient(0,y+gap,0,y+gap+w2);
  g.addColorStop(0,PAL.wallHi);g.addColorStop(0.4,PAL.wall1);g.addColorStop(1,PAL.wall2);
  ctx.fillStyle=g;rr(x+gap,y+gap,w2,w2,rad);ctx.fill();
  ctx.restore();
  ctx.lineWidth=Math.max(1,cs*0.03);ctx.strokeStyle=colMix(PAL.wallHi,WHITE,0.22);
  rr(x+gap+0.5,y+gap+0.5,w2-1,w2-1,rad);ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,0.35)";   // 恒白高光（顶面倒角）
  rr(x+gap+2,y+gap+2,w2-4,Math.max(2,w2*0.14),Math.min(rad*0.6,4));ctx.fill();
}
/* 目标端点（珠子）：径向渐变 + 高光 + 投影 + 描边 + 对号数字 */
function drawEnd(x,y,col,idx,scale){
  var r=cs*0.32*scale;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.40)";ctx.shadowBlur=r*0.85;ctx.shadowOffsetY=r*0.38;   // 恒黑阴影
  var g=ctx.createRadialGradient(x-r*0.35,y-r*0.42,r*0.12,x,y,r*1.05);
  g.addColorStop(0,colMix(col,WHITE,0.8));g.addColorStop(0.45,col);g.addColorStop(1,colShade(col,-0.36));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.lineWidth=Math.max(1.5,r*0.16);ctx.strokeStyle=colShade(col,-0.5);
  ctx.beginPath();ctx.arc(x,y,r-ctx.lineWidth*0.5,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=0.9;ctx.fillStyle=WHITE;   // 恒白高光
  ctx.beginPath();ctx.ellipse(x-r*0.34,y-r*0.44,r*0.26,r*0.15,-0.55,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle=WHITE;
  ctx.font="700 14px sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.lineWidth=3;ctx.lineJoin="round";ctx.strokeStyle=colShade(col,-0.55);
  ctx.strokeText(String(idx+1),x,y+1);
  ctx.fillText(String(idx+1),x,y+1);
}
function draw(){
  var t=performance.now();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,PAL.ground1);bg.addColorStop(1,PAL.ground2);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  if(!L){requestAnimationFrame(draw);return}
  ctx.lineWidth=2;ctx.strokeStyle=PAL.frame;rr(1.5,1.5,W-3,H-3,12);ctx.stroke();   // 2px 边界环
  var gap=Math.max(1.5,cs*0.055),rad=Math.min(10,cs*0.2),i,x,y,r,c;
  ctx.lineCap="round";ctx.lineJoin="round";
  // 地面 / 墙（方块轻立体）
  for(r=0;r<h;r++)for(c=0;c<w;c++){
    i=r*w+c;x=pad+c*cs;y=pad+r*cs;
    var e=tileEnter(i,t);
    if(e<=0)continue;
    ctx.save();
    ctx.globalAlpha=e;
    ctx.translate(x+cs/2,y+cs/2);ctx.scale(Math.max(.5,e),Math.max(.5,e));ctx.translate(-(x+cs/2),-(y+cs/2));
    if(blocked[i])drawWall(x,y,gap,rad);
    else drawTile(x,y,gap,rad,(r+c)%2===0);
    ctx.restore();
  }
  // 轨迹（路线）：暗边 + 主色 + 亮芯三层叠出圆管材质
  for(var q=0;q<route.length;q++){
    var rt=route[q];if(rt.length<1)continue;
    var col=PAL.r[q];
    ctx.globalAlpha=active===q?1:0.72;
    strokeRoute(rt,colShade(col,-0.30),cs*0.36);
    strokeRoute(rt,col,cs*0.26);
    strokeRoute(rt,colMix(col,WHITE,0.5),cs*0.09);
    ctx.globalAlpha=1;
  }
  // 目标端点（该线连通时轻弹一跳）
  for(var q2=0;q2<L.pairs.length;q2++){
    var scale=1,pt=routePop[q2];
    if(pt&&!window.__gRM){var pp=(t-pt)/200;if(pp>=0&&pp<1)scale=1+0.16*Math.sin(pp*Math.PI)}
    for(var e2=0;e2<2;e2++){
      var pe=centerOf(L.pairs[q2][e2]);
      drawEnd(pe.x,pe.y,PAL.r[q2],q2,scale);
    }
  }
  requestAnimationFrame(draw);
}
/* ---------- 输入 ---------- */
var lastCell=-1;
function cellAt(px,py){
  var x=Math.floor((px-pad)/cs),y=Math.floor((py-pad)/cs);
  if(x<0||y<0||x>=w||y>=h)return -1;
  return y*w+x;
}
function hitPair(cell){
  for(var q=0;q<L.pairs.length;q++){
    if(L.pairs[q][0]===cell||L.pairs[q][1]===cell)return q;
    if(route[q].indexOf(cell)>=0)return q;
  }
  return -1;
}
cv.addEventListener("pointerdown",function(e){
  if(done)return;
  var r=cv.getBoundingClientRect();
  var cell=cellAt(e.clientX-r.left,e.clientY-r.top);
  if(cell<0)return;
  var p=hitPair(cell);
  if(p>=0){
    active=p;
    if(cell===L.pairs[p][0]){route[p]=[];extend(p,cell)}
    else extend(p,cell);
  }
  lastCell=cell;
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(done||active<0)return;
  var r=cv.getBoundingClientRect();
  var cell=cellAt(e.clientX-r.left,e.clientY-r.top);
  if(cell<0||cell===lastCell)return;
  lastCell=cell;
  extend(active,cell);
});
cv.addEventListener("pointerup",function(){lastCell=-1});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){route=L.pairs.map(function(){return []});history=[];active=-1;routePop={};updStats();say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="4"){
    var q=+k-1;
    if(q<route.length){active=q;extend(q,L.pairs[q][0]);e.preventDefault()}
  }else if(k.indexOf("Arrow")===0&&active>=0){
    var tail=route[active][route[active].length-1];
    if(tail===undefined)tail=L.pairs[active][0];
    var x=tail%w,y=(tail/w)|0;
    if(k==="ArrowLeft")x--;
    else if(k==="ArrowRight")x++;
    else if(k==="ArrowUp")y--;
    else y++;
    if(x>=0&&y>=0&&x<w&&y<h)extend(active,y*w+x);
    e.preventDefault();
  }else if(k==="Backspace"&&active>=0){
    if(route[active].length>=2){history.push({p:active,prev:route[active].slice()});route[active].pop();moves++;updStats()}
    e.preventDefault();
  }else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){route=L.pairs.map(function(){return []});history=[];routePop={};updStats();say("本关已重置")}
});
function renderLevels(){}
/* ---------- 启动 ---------- */
var running=true;
document.addEventListener("visibilitychange",function(){
  if(document.hidden)running=false;
  else if(!running){running=true;requestAnimationFrame(draw)}
});
palLoad();loadLevel(save.lv);
setOvBtn("下一关","play");
requestAnimationFrame(draw);
verifyPending();syncLevelsFromServer();syncSaveFromServer();
window.addEventListener("resize",resize);

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  /* 按钮图标注入（内联 SVG，零外链） */
  function $(id){return document.getElementById(id)}
  $("btnUndo").insertAdjacentHTML("afterbegin",window.SW_ICON("undo"));
  $("btnHint").insertAdjacentHTML("afterbegin",window.SW_ICON("bulb"));
  $("btnReset").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
  $("btnLv").insertAdjacentHTML("afterbegin",window.SW_ICON("grid"));
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
