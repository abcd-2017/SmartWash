function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  levelOk=new Array(LEVELS.length);
  return true;
}

function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.w)||d.w<7||d.w>8)return false;

  var bl={};
  for(var i=0;i<d.blocks.length;i++){
    if(!Number.isInteger(d.blocks[i])||d.blocks[i]<0||d.blocks[i]>=N||bl[d.blocks[i]])return false;
    bl[d.blocks[i]]=1;
  }
  if(!Array.isArray(d.pairs)||d.pairs.length<2||d.pairs.length>4)return false;
  if(!Array.isArray(d.lens)||d.lens.length!==d.pairs.length)return false;
  var used={};
  for(var j=0;j<d.pairs.length;j++){
    var p=d.pairs[j];
    if(!Array.isArray(p)||p.length!==2)return false;
    for(var k=0;k<2;k++){
      if(!Number.isInteger(p[k])||p[k]<0||p[k]>=N||bl[p[k]]||used[p[k]])return false;
      used[p[k]]=1;
    }
    if(!Number.isInteger(d.lens[j])||d.lens[j]<5||d.lens[j]>15)return false;
  }
  return true;
}
/* ---------- 独立验证器：逐对 BFS 最短 + 组合回溯（与交互逻辑分离） ---------- */
function crNb(w,h,i){
  var x=i%w,y=(i/w)|0,out=[];
  if(x>0)out.push(i-1);
  if(x<w-1)out.push(i+1);
  if(y>0)out.push(i-w);
  if(y<h-1)out.push(i+w);
  return out;
}
function crBfs(w,h,blocked,src){
  var dist=new Array(w*h).fill(-1);
  dist[src]=0;
  var q=[src];
  for(var qi=0;qi<q.length;qi++){
    var list=crNb(w,h,q[qi]);
    for(var i=0;i<list.length;i++){
      var nb=list[i];
      if(dist[nb]<0&&!blocked[nb]){dist[nb]=dist[q[qi]]+1;q.push(nb)}
    }
  }
  return dist;
}
function crPaths(w,h,blocked,a,b,cap){
  var distB=crBfs(w,h,blocked,b);
  if(distB[a]<0)return null;
  var d=distB[a],paths=[];
  function dfs(cur,path){
    if(paths.length>=cap)return;
    if(cur===b){if(path.length===d+1)paths.push(path.slice());return}
    var list=crNb(w,h,cur);
    for(var i=0;i<list.length;i++){
      var nb=list[i];
      if(blocked[nb]||distB[nb]!==distB[cur]-1)continue;
      path.push(nb);
      dfs(nb,path);
      path.pop();
      if(paths.length>=cap)return;
    }
  }
  dfs(a,[a]);
  return {d:d,paths:paths};
}
function verifyLevel(L){
  if(!validLevelData(L))return false;
  var blocked={};
  for(var i=0;i<L.blocks.length;i++)blocked[L.blocks[i]]=1;
  var nodes=0,occ={},perPair=[];
  for(var p=0;p<L.pairs.length;p++){
    var r=crPaths(L.w,L.h,blocked,L.pairs[p][0],L.pairs[p][1],4000);
    if(!r||!r.paths.length)return false;
    if(r.d+1!==L.lens[p])return false;
    perPair.push(r.paths);
  }
  function rec(pi){
    if(++nodes>30000)return false;
    if(pi===perPair.length)return true;
    for(var z=0;z<perPair[pi].length;z++){
      var path=perPair[pi][z],ok=true,q;
      for(q=0;q<path.length;q++)if(occ[path[q]]){ok=false;break}
      if(!ok)continue;
      for(q=0;q<path.length;q++)occ[path[q]]=1;
      if(rec(pi+1))return true;
      for(q=0;q<path.length;q++)delete occ[path[q]];
    }
    return false;
  }
  return rec(0);
}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),success:v("--g-success"),warning:v("--g-warning"),
    r:[v("--g-st-r1"),v("--g-st-r2"),v("--g-st-r3"),v("--g-st-r4")],
    wall:v("--g-st-wall"),bg2:v("--g-st-bg2")};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,blocked={},route=[],active=-1,history=[],moves=0,done=false;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,dpr=1,w=7,h=7,cs=56;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function npAdj(a,b){
  var ax=a%w,bx=b%w,ay=(a/w)|0,by=(b/w)|0;
  return Math.abs(ax-bx)+Math.abs(ay-by)===1;
}
/* ---------- 关卡 ---------- */
function loadLevel(n2){
  lv=Math.max(0,Math.min(n2,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return}
  w=L.w;h=L.h;
  blocked={};
  for(var i=0;i<L.blocks.length;i++)blocked[L.blocks[i]]=1;
  route=L.pairs.map(function(){return []});
  active=-1;history=[];moves=0;done=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  var ok=verifyLevel(L);   // 加载复核：组合可解
  if(!ok)say("警告：内嵌验证器判定本关无组合解（数据异常）");
  else say("点一个彩色端点开始画线");
  updStats();resize();
}
function updStats(){
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  var dn=0;
  for(var q=0;q<route.length;q++)if(routeDone(q))dn++;
  $("stDone").textContent=dn+" / "+route.length;
  $("stMoves").textContent=moves;
  $("btnUndo").disabled=!history.length||done;
}
function routeDone(p){
  var r=route[p];
  return r.length===L.lens[p]&&r[0]===L.pairs[p][0]&&r[r.length-1]===L.pairs[p][1];
}
function occupiedOther(p,cell){
  if(blocked[cell])return true;
  for(var q=0;q<L.pairs.length;q++){
    if(q===p)continue;
    if(route[q].indexOf(cell)>=0)return true;
    if(L.pairs[q][0]===cell||L.pairs[q][1]===cell)return true;
  }
  return false;
}
/* ---------- 交互 ---------- */
function extend(p,cell){
  if(done||p<0)return;
  var r=route[p],a=L.pairs[p][0],b=L.pairs[p][1];
  if(!r.length){
    if(cell===a){history.push({p:p,prev:r.slice()});r.push(a);moves++;say("已选色对 "+(p+1)+"，拖向相邻格延伸")}
    return;
  }
  if(r.length>=2&&cell===r[r.length-2]){
    history.push({p:p,prev:r.slice()});r.pop();moves++;updStats();checkWin();return;
  }
  if(r[r.length-1]===cell)return;
  if(r.indexOf(cell)>=0)return;
  if(occupiedOther(p,cell)){say("这一格被墙或别的路线占了");return}
  if(!npAdj(cell,r[r.length-1]))return;
  if(r.length>=L.lens[p]){say("已到理论最短长度，先回退再改道");return}
  if(cell===b&&r.length+1!==L.lens[p]){say("这条不够短，最短需要 "+L.lens[p]+" 格");return}
  history.push({p:p,prev:r.slice()});
  r.push(cell);moves++;
  if(r[r.length-1]===b&&r.length===L.lens[p])say("这条最短路连通了！");
  updStats();checkWin();
}
function undo(){
  if(!history.length||done)return;
  var hh=history.pop();
  route[hh.p]=hh.prev.slice();
  moves=Math.max(0,moves-1);
  updStats();say("撤销一步");
}
function hint(){
  if(done)return;
  var p=active>=0?active:-1;
  if(p<0||routeDone(p)){
    for(var q=0;q<route.length;q++)if(!routeDone(q)){p=q;break}
  }
  if(p<0){say("全部路线都已就位");return}
  // 单对 DFS：避墙+避其他对，找一条最短路径并放置
  var distB=crBfs(w,h,blocked,L.pairs[p][1]);
  var occ={};
  for(var z=0;z<route.length;z++){
    if(z===p)continue;
    for(var q2=0;q2<route[z].length;q2++)occ[route[z][q2]]=1;
  }
  var found=null;
  function dfs(cur,path){
    if(found)return;
    if(cur===L.pairs[p][1]){if(path.length===L.lens[p])found=path.slice();return}
    var list=crNb(w,h,cur);
    for(var i=0;i<list.length;i++){
      var nb=list[i];
      if(blocked[nb]||occ[nb]||distB[nb]!==distB[cur]-1)continue;
      path.push(nb);dfs(nb,path);path.pop();
      if(found)return;
    }
  }
  dfs(L.pairs[p][0],[L.pairs[p][0]]);
  if(!found){say("内嵌求解器未找到该对的最短路（可能被已画路线挡住），先调整其他路线");return}
  history.push({p:p,prev:route[p].slice()});
  route[p]=found;
  say("提示：色对 "+(p+1)+" 的最短路已画出");
  updStats();checkWin();
}
function checkWin(){
  if(done)return;
  for(var q=0;q<route.length;q++)if(!routeDone(q))return;
  // 重叠检查（端点互异，路径格两两不同）
  var seen={};
  for(var p=0;p<route.length;p++)for(var i=0;i<route[p].length;i++){
    var c=route[p][i];
    if(seen[c])return;
    seen[c]=1;
  }
  done=true;
  save.done[lv]=true;
  if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:moves}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"全部最短连通！";
  $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成 · "+route.length+" 条最短路互不重叠"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
/* ---------- 绘制 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cs=Math.min(Math.floor((wCss-16)/w),60);
  W=cs*w+16;H=cs*h+16;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function centerOf(i){var x=i%w,y=(i/w)|0;return {x:8+x*cs+cs/2,y:8+y*cs+cs/2}}
function draw(){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  if(!L)return;
  for(var i=0;i<w*h;i++){
    var p=centerOf(i),x=i%w,y=(i/w)|0;
    ctx.fillStyle=blocked[i]?PAL.wall:PAL.bg2;   // 素材墙/地面
    ctx.beginPath();
    ctx.rect(8+x*cs+2,8+y*cs+2,cs-4,cs-4);
    ctx.fill();
    if(blocked[i]){
      ctx.fillStyle="rgba(0,0,0,.18)";   // 恒黑墙影
      ctx.fillRect(8+x*cs+2,8+y*cs+2,cs-4,cs-4);
    }
  }
  // 路径
  for(var q=0;q<route.length;q++){
    var r=route[q];
    if(r.length<1)continue;
    ctx.strokeStyle=PAL.r[q];
    ctx.lineWidth=cs*0.26;
    ctx.lineCap="round";ctx.lineJoin="round";
    ctx.globalAlpha=active===q?1:0.72;
    ctx.beginPath();
    var p0=centerOf(r[0]);
    ctx.moveTo(p0.x,p0.y);
    for(var z=1;z<r.length;z++){var pz=centerOf(r[z]);ctx.lineTo(pz.x,pz.y)}
    ctx.stroke();
    ctx.globalAlpha=1;
  }
  // 端点
  for(var q2=0;q2<L.pairs.length;q2++){
    for(var e=0;e<2;e++){
      var pe=centerOf(L.pairs[q2][e]);
      ctx.fillStyle=PAL.r[q2];
      ctx.beginPath();ctx.arc(pe.x,pe.y,cs*0.3,0,7);ctx.fill();
      ctx.strokeStyle=PAL.bg;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(pe.x,pe.y,cs*0.3,0,7);ctx.stroke();
      ctx.fillStyle=PAL.surface;
      ctx.font="700 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(String(q2+1),pe.x,pe.y);
    }
  }
  // 状态角标：各线进度
  ctx.font="700 12px sans-serif";ctx.textAlign="left";ctx.textBaseline="top";
  var parts=[];
  for(var q3=0;q3<route.length;q3++)parts.push((q3+1)+"号线 "+route[q3].length+"/"+L.lens[q3]);
  ctx.fillStyle=route.every(function(r){return routeDone(route.indexOf(r))})?PAL.success:PAL.muted;
  ctx.fillText(parts.join(" · "),10,H-16);
  requestAnimationFrame(draw);
}
/* ---------- 输入 ---------- */
var lastCell=-1;
function cellAt(px,py){
  var x=Math.floor((px-8)/cs),y=Math.floor((py-8)/cs);
  if(x<0||y<0||x>=w||y>=h)return -1;
  return y*w+x;
}
function hitPair(cell){
  for(var q=0;q<L.pairs.length;q++){
    if(L.pairs[q][0]===cell||L.pairs[q][1]===cell)return q;
    if(route[q].indexOf(cell)>=0)return q;
  }
  return -1;
}
cv.addEventListener("pointerdown",function(e){
  if(done)return;
  var r=cv.getBoundingClientRect();
  var cell=cellAt(e.clientX-r.left,e.clientY-r.top);
  if(cell<0)return;
  var p=hitPair(cell);
  if(p>=0){
    active=p;
    if(cell===L.pairs[p][0]){route[p]=[];extend(p,cell)}
    else extend(p,cell);
  }
  lastCell=cell;
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(done||active<0)return;
  var r=cv.getBoundingClientRect();
  var cell=cellAt(e.clientX-r.left,e.clientY-r.top);
  if(cell<0||cell===lastCell)return;
  lastCell=cell;
  extend(active,cell);
});
cv.addEventListener("pointerup",function(){lastCell=-1});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){route=L.pairs.map(function(){return []});history=[];active=-1;updStats();say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="4"){
    var q=+k-1;
    if(q<route.length){active=q;extend(q,L.pairs[q][0]);e.preventDefault()}
  }else if(k.indexOf("Arrow")===0&&active>=0){
    var tail=route[active][route[active].length-1];
    if(tail===undefined)tail=L.pairs[active][0];
    var x=tail%w,y=(tail/w)|0;
    if(k==="ArrowLeft")x--;
    else if(k==="ArrowRight")x++;
    else if(k==="ArrowUp")y--;
    else y++;
    if(x>=0&&y>=0&&x<w&&y<h)extend(active,y*w+x);
    e.preventDefault();
  }else if(k==="Backspace"&&active>=0){
    if(route[active].length>=2){history.push({p:active,prev:route[active].slice()});route[active].pop();moves++;updStats()}
    e.preventDefault();
  }else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){route=L.pairs.map(function(){return []});history=[];updStats();say("本关已重置")}
});
function renderLevels(){}
/* ---------- 启动 ---------- */
var running=true;
document.addEventListener("visibilitychange",function(){
  if(document.hidden)running=false;
  else if(!running){running=true;requestAnimationFrame(draw)}
});
palLoad();loadLevel(save.lv);
requestAnimationFrame(draw);
verifyPending();syncLevelsFromServer();syncSaveFromServer();
window.addEventListener("resize",resize);

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
