<!DOCTYPE html>

<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（木框 / 毡面 / 双方棋子，深色同色相压暗）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-on-primary:#FFFFFF;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-bp1:#F2B843;--g-bp3:#5AA7E8;--g-bshade:rgba(20,40,30,.10);--g-c4-frame1:#E0BE8A;--g-c4-frame2:#B08E62;--g-c4-board1:#2F8A66;--g-c4-board2:#17573C;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-bp1:#F5C45E;--g-bp3:#74BDF2;--g-bshade:rgba(0,0,0,.4);--g-c4-frame1:#4A3F2C;--g-c4-frame2:#2C2517;--g-c4-board1:#123A2C;--g-c4-board2:#0B2419;color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; background: var(--g-bg); color: var(--g-text); min-height: 100vh; display: flex; justify-content: center; padding: 16px 8px 30px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none; }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.4; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat { min-width: 0; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; animation: rise .38s ease-out both; }
  .stat:nth-child(2) { animation-delay: 40ms; }

  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { display: inline-block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stage { position: relative; animation: fadein .3s ease-out both; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius); }
  .legend { display: flex; gap: 8px; margin: 10px 2px 0; animation: rise .38s ease-out both; animation-delay: 120ms; }
  .lg-chip { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; background: var(--g-surface2); border-radius: 10px; padding: 5px 8px; font-size: 12px; color: var(--g-muted); line-height: 1.3; }
  .lg-chip b { color: var(--g-text); font-weight: 600; }
  .lg-disc { width: 18px; height: 18px; flex: none; }
  .lg-disc.d1 { color: var(--g-bp1); }
  .lg-disc.d2 { color: var(--g-bp3); }
  .lg-goal { width: 18px; height: 18px; flex: none; color: var(--g-warning); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; transition: color .16s ease-out; }
  .bar { display: flex; gap: 8px; margin-top: 8px; }
  .btn { min-height: 44px; padding: 0 14px; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: var(--g-radius-btn); background: var(--g-btn-primary); color: var(--g-on-primary); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out; }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .35; }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay { position: fixed; inset: 0; z-index: 10; background: var(--g-scrim); display: none; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  .panel { width: 100%; max-width: 320px; padding: 22px 18px; background: var(--g-surface); border-radius: var(--g-radius); box-shadow: var(--g-shadow); text-align: center; animation: pop .3s ease-out; }
  .panel.win { animation: winpop .45s cubic-bezier(.18,.9,.3,1.4); }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.7; }
  .panel .desc b { color: var(--g-primary-deep); font-size: 22px; }
  .panel.win .desc b { color: var(--g-warning); }
  .panel .btn { width: 100%; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes winpop { 0% { transform: scale(.86); opacity: 0; } 62% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（同时压 animation-duration 与 animation-delay） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }
  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>

 'rotate':'<path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>',

<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();

<body>
<div class="wrap">

<script>
(function(){
"use strict";
/* ---------- 常量与调色板（canvas 颜色全部经 CSS 变量读取，JS 零颜色字面量） ---------- */
var COLS=7,ROWS=6,AI_DEPTH=4,WIN=1000000;
var COLW=[3,4,5,7,5,4,3];//中列权重：越靠中越有价值
var DIRS=[[1,0],[0,1],[1,1],[1,-1]];//横、竖、主斜、副斜
var PAL={};
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),primary:v("--g-primary"),
    deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),warning:v("--g-warning"),
    bp1:v("--g-bp1"),bp3:v("--g-bp3"),shade:v("--g-bshade"),
    frame1:v("--g-c4-frame1"),frame2:v("--g-c4-frame2"),
    board1:v("--g-c4-board1"),board2:v("--g-c4-board2")};
  PAL.hole=colMix(PAL.board2,BLACK,0.52);      // 凹槽内凹底（毡面暗端压暗派生）
  PAL.holeHi=colMix(PAL.board1,WHITE,0.30);   // 凹槽顶部亮缘（毡面亮端提亮派生）
}
window.__gOnTheme=function(){palLoad()};//App 推送主题时刷新调色板，rAF 循环自动重绘
/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 存档（localStorage，try/catch 包裹） ---------- */
var KEY="sw.connectfour.v1";
function loadRec(){
  try{var s=JSON.parse(localStorage.getItem(KEY))||{};
    return{w:Math.max(0,parseInt(s.w,10)||0),l:Math.max(0,parseInt(s.l,10)||0),s:Math.max(0,parseInt(s.s,10)||0)}
  }catch(e){return{w:0,l:0,s:0}}
}
function saveRec(){try{localStorage.setItem(KEY,JSON.stringify(rec))}catch(e){}
  if(GB.available)GB.saveState("connect-four",rec).catch(function(){});}
var rec=loadRec();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("connect-four").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson);
      var rw=parseInt(r.w,10)||0;
      if(rw>rec.w){rec.w=rw;rec.l=parseInt(r.l,10)||0;rec.s=parseInt(r.s,10)||0;saveRec();updStats();}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var board=[],heights=[];//board[列][行]，行 0 = 最底；1 玩家（黄）2 AI（蓝）
var turn=1,busy=false,over=false,winLine=null,anim=null,landFx=null;
var hoverCol=-1,selCol=3,aiCol=-1;
var round=0,ovTimer=0;//回合代号：作废旧对局的延时回调
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var L={cell:0,pad:8,topH:0,boardX:0,boardY:0,boardW:0,boardH:0,fr:0,fx:0,fy:0,fw:0,fh:0,ax:0,ay:0,aw:0,ah:0,W:0,H:0};
var nodes=0;//AI 搜索节点计数（抽验用）
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function pieceColor(c){return c===1?PAL.bp1:PAL.bp3}
function cellCX(c){return L.boardX+c*L.cell+L.cell/2}
function cellCY(r){return L.boardY+(ROWS-1-r)*L.cell+L.cell/2}
function resetBoard(){
  board=[];heights=[];
  for(var c=0;c<COLS;c++){board.push([0,0,0,0,0,0]);heights.push(0)}
}
function isFull(){for(var c=0;c<COLS;c++)if(heights[c]<ROWS)return false;return true}
function viewCol(){
  if(over)return -1;
  if(turn===1)return hoverCol>=0?hoverCol:selCol;
  return aiCol;
}
/* ---------- 胜负判定：返回获胜四子坐标，未获胜返回 null ---------- */
function checkWin(c,r,color){
  for(var d=0;d<4;d++){
    var dc=DIRS[d][0],dr=DIRS[d][1],cells=[[c,r]],k,cc,rr;
    for(k=1;k<4;k++){cc=c+dc*k;rr=r+dr*k;
      if(cc<0||cc>=COLS||rr<0||rr>=ROWS||board[cc][rr]!==color)break;
      cells.push([cc,rr])}
    for(k=1;k<4;k++){cc=c-dc*k;rr=r-dr*k;
      if(cc<0||cc>=COLS||rr<0||rr>=ROWS||board[cc][rr]!==color)break;
      cells.push([cc,rr])}
    if(cells.length>=4)return cells;
  }
  return null;
}
/* ---------- AI：minimax + alpha-beta，深度 4 ---------- */
function validMoves(){
  var order=[3,2,4,1,5,0,6],m=[];
  for(var i=0;i<order.length;i++)if(heights[order[i]]<ROWS)m.push(order[i]);
  return m;//中列优先，兼作同分取舍
}
function win(a,b,c,d){//单个四格窗口的得分
  var arr=[a,b,c,d],ai=0,pl=0,empty=0,i;
  for(i=0;i<4;i++){if(arr[i]===2)ai++;else if(arr[i]===1)pl++;else empty++}
  if(ai&&pl)return 0;//双方混杂的死窗口
  if(ai===4)return 100000;
  if(ai===3&&empty===1)return 50;
  if(ai===2&&empty===2)return 10;
  if(pl===4)return -100000;
  if(pl===3&&empty===1)return -50;
  if(pl===2&&empty===2)return -10;
  return 0;
}
function evalBoard(){
  var score=0,c,r;
  for(c=0;c<COLS;c++){//中列权重加成
    var a=0,p=0;
    for(r=0;r<ROWS;r++){if(board[c][r]===2)a++;else if(board[c][r]===1)p++}
    score+=COLW[c]*(a-p);
  }
  for(c=0;c<COLS;c++)for(r=0;r<ROWS;r++){
    if(c<=COLS-4)score+=win(board[c][r],board[c+1][r],board[c+2][r],board[c+3][r]);//横
    if(r<=ROWS-4)score+=win(board[c][r],board[c][r+1],board[c][r+2],board[c][r+3]);//竖
    if(c<=COLS-4&&r<=ROWS-4)score+=win(board[c][r],board[c+1][r+1],board[c+2][r+2],board[c+3][r+3]);//主斜
    if(c<=COLS-4&&r>=3)score+=win(board[c][r],board[c+1][r-1],board[c+2][r-2],board[c+3][r-3]);//副斜
  }
  return score;
}
function search(depth,alpha,beta,maxi){
  nodes++;
  var moves=validMoves(),i,c,r,v;
  if(moves.length===0)return 0;//棋盘已满
  if(depth===0)return evalBoard();
  if(maxi){
    var best=-Infinity;
    for(i=0;i<moves.length;i++){
      c=moves[i];r=heights[c];
      board[c][r]=2;heights[c]++;
      v=checkWin(c,r,2)?WIN+depth:search(depth-1,alpha,beta,false);
      board[c][r]=0;heights[c]--;
      if(v>best)best=v;
      if(best>alpha)alpha=best;
      if(alpha>=beta)break;
    }
    return best;
  }
  var best2=Infinity;
  for(i=0;i<moves.length;i++){
    c=moves[i];r=heights[c];
    board[c][r]=1;heights[c]++;
    v=checkWin(c,r,1)?-(WIN+depth):search(depth-1,alpha,beta,true);
    board[c][r]=0;heights[c]--;
    if(v<best2)best2=v;
    if(best2<beta)beta=best2;
    if(alpha>=beta)break;
  }
  return best2;
}
function bestMove(){
  var moves=validMoves();
  if(!moves.length)return -1;
  nodes=0;
  var best=-Infinity,pick=moves[0],i,c,r,v;
  for(i=0;i<moves.length;i++){
    c=moves[i];r=heights[c];
    board[c][r]=2;heights[c]++;
    v=checkWin(c,r,2)?WIN+AI_DEPTH:search(AI_DEPTH-1,-Infinity,Infinity,false);
    board[c][r]=0;heights[c]--;
    if(v>best){best=v;pick=c}
  }
  return pick;
}
/* ---------- 落子与流程 ---------- */
function startDrop(color,c){
  anim={c:c,r:heights[c],color:color,t0:performance.now(),dur:260};
  busy=true;
}
function stepAnim(now){
  if(!anim)return;
  var t=(now-anim.t0)/anim.dur;
  if(t<1)return;
  var a=anim;anim=null;busy=false;
  board[a.c][a.r]=a.color;heights[a.c]++;
  if(!window.__gRM)landFx={c:a.c,r:a.r,t0:now,dur:150};//落子轻弹（纯渲染反馈）
  afterDrop(a.c,a.r,a.color);
}
function afterDrop(c,r,color){
  var line=checkWin(c,r,color);
  if(line){winLine=line;endGame(color===1?"win":"lose");return}
  if(isFull()){endGame("draw");return}
  if(color===1){turn=2;aiTurn()}else{turn=1;say("轮到你了 · 点击列落子")}
}
function aiTurn(){
  var rd=round;
  busy=true;aiCol=-1;
  say("AI 思考中…");
  setTimeout(function(){
    if(over||rd!==round)return;//已重开，丢弃旧回合的 AI 落子
    var c=bestMove();
    if(c<0){endGame("draw");return}
    aiCol=c;
    startDrop(2,c);
  },300+Math.random()*200);
}
function endGame(res){
  over=true;turn=0;busy=false;
  if(res==="win"){rec.w++;rec.s++;say("你赢了！")}
  else if(res==="lose"){rec.l++;rec.s=0;say("AI 获胜，再接再厉")}
  else{say("平局，棋盘已满")}
  saveRec();updStats();
  // 成绩上报（胜场，desc：越大越好）
  if(GB.available&&res==="win")GB.reportScore("connect-four",{metricValue:rec.w}).catch(function(){});
  clearTimeout(ovTimer);
  ovTimer=setTimeout(function(){showOverlay(res)},700);
}
function setOvBtn(t,icon){$("ovBtn").innerHTML=window.SW_ICON(icon)+t}
function showOverlay(res){
  var d=$("ovDesc"),panel=$("panel");
  panel.classList.remove("win");
  if(res==="win"){$("ovTitle").textContent="你赢了！";d.innerHTML="本局比分 你 <b>1</b> : 0 AI";panel.classList.add("win")}
  else if(res==="lose"){$("ovTitle").textContent="AI 获胜";d.innerHTML="本局比分 你 0 : <b>1</b> AI"}
  else{$("ovTitle").textContent="平局";d.innerHTML="本局比分 你 <b>0</b> : 0 AI"}
  d.innerHTML+="<br>累计 胜 "+rec.w+" / 负 "+rec.l+" / 连胜 "+rec.s;
  setOvBtn("再来一局","rotate");//重插图标，不覆盖式抹掉 SVG
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show");$("panel").classList.remove("win")}
function updStats(){
  $("stWin").textContent=rec.w;
  $("stLose").textContent=rec.l;
  $("stStreak").textContent=rec.s;
}
function newGame(){
  round++;
  clearTimeout(ovTimer);
  resetBoard();
  turn=1;busy=false;over=false;winLine=null;anim=null;landFx=null;
  hoverCol=-1;selCol=3;aiCol=-1;
  hideOverlay();
  say("轮到你了 · 点击列落子");
  updStats();
}
/* ---------- 几何与绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  L.pad=Math.max(6,Math.round(w*0.02));
  L.cell=Math.max(20,Math.floor((w-2*L.pad)/COLS));
  L.boardW=L.cell*COLS;L.boardH=L.cell*ROWS;
  L.boardX=(w-L.boardW)/2;
  L.fr=Math.max(6,Math.round(L.cell*0.20));//外框厚
  L.topH=Math.round(L.cell*0.64);//顶部列指示区
  L.boardY=L.topH+L.fr;
  L.fx=L.boardX-L.fr;L.fy=L.boardY-L.fr;L.fw=L.boardW+2*L.fr;L.fh=L.boardH+2*L.fr;
  var fi=Math.round(L.fr*0.30);//毡面内缩（外框露出 ~70% 宽的边）
  L.ax=L.boardX-fi;L.ay=L.boardY-fi;L.aw=L.boardW+2*fi;L.ah=L.boardH+2*fi;
  L.W=w;L.H=L.topH+L.boardH+2*L.fr+L.pad;
  cv.style.height=L.H+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(L.H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function rr(x,y,w2,h2,r){
  r=Math.max(0,Math.min(r,w2/2,h2/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);
  ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();
}
/* 外框「面」：木纹渐变 + 顶部亮线 + 落地投影，替代细线边框 */
function drawFrame(){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.28)";ctx.shadowBlur=L.cell*0.16;ctx.shadowOffsetY=L.cell*0.06;
  var g=ctx.createLinearGradient(0,L.fy,0,L.fy+L.fh);
  g.addColorStop(0,PAL.frame1);g.addColorStop(0.5,PAL.frame2);g.addColorStop(1,colMix(PAL.frame2,BLACK,0.22));
  ctx.fillStyle=g;rr(L.fx,L.fy,L.fw,L.fh,16);ctx.fill();
  ctx.restore();
  ctx.lineWidth=Math.max(1.2,L.cell*0.030);ctx.strokeStyle=colMix(PAL.frame1,WHITE,0.34);
  rr(L.fx+1.5,L.fy+1.5,L.fw-3,L.fh-3,14);ctx.stroke();
}
/* 毡面「面」：品牌绿渐变 + 顶部天光，玩法素材主色 */
function drawFelt(){
  var g=ctx.createLinearGradient(0,L.ay,0,L.ay+L.ah);
  g.addColorStop(0,PAL.board1);g.addColorStop(1,PAL.board2);
  ctx.fillStyle=g;rr(L.ax,L.ay,L.aw,L.ah,12);ctx.fill();
  var gl=ctx.createRadialGradient(L.W*0.5,L.ay+L.ah*0.08,L.W*0.05,L.W*0.5,L.ay+L.ah*0.08,L.W*0.8);
  gl.addColorStop(0,"rgba(255,255,255,0.16)");gl.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=gl;ctx.fillRect(L.ax,L.ay,L.aw,L.ah);
}
/* 凹槽：内凹底 + 顶部内阴影 + 底部亮缘（空位的「可落」读法） */
function drawHole(cx,cy,rad){
  ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);
  ctx.fillStyle=PAL.hole;ctx.fill();
  ctx.lineWidth=Math.max(1.5,rad*0.16);ctx.strokeStyle="rgba(0,0,0,0.34)";
  ctx.beginPath();ctx.arc(cx,cy-rad*0.06,rad*0.90,Math.PI*1.12,Math.PI*1.88);ctx.stroke();
  ctx.lineWidth=Math.max(1,rad*0.07);ctx.strokeStyle=PAL.holeHi;
  ctx.beginPath();ctx.arc(cx,cy+rad*0.10,rad*0.84,Math.PI*0.12,Math.PI*0.88);ctx.stroke();
}
/* 棋子：渐变球体 + 落地投影 + 恒白高光 + 深一档描边（轻立体） */
function drawDisc(cx,cy,rad,color,alpha){
  if(alpha==null)alpha=1;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.shadowColor="rgba(0,0,0,0.36)";ctx.shadowBlur=rad*0.55;ctx.shadowOffsetY=rad*0.22;
  var g=ctx.createRadialGradient(cx-rad*0.34,cy-rad*0.38,rad*0.14,cx,cy,rad*1.02);
  g.addColorStop(0,colMix(color,WHITE,0.72));
  g.addColorStop(0.45,color);
  g.addColorStop(1,colShade(color,-0.34));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.lineWidth=Math.max(1.2,rad*0.10);ctx.strokeStyle=colShade(color,-0.42);
  ctx.beginPath();ctx.arc(cx,cy,rad-ctx.lineWidth*0.5,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=alpha*0.9;ctx.fillStyle=WHITE;
  ctx.beginPath();ctx.ellipse(cx-rad*0.32,cy-rad*0.38,rad*0.24,rad*0.14,-0.55,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
/* 顶部列指示：当前列箭头（我控制什么 / 该点哪） */
function drawTop(vc){
  if(vc<0||over)return;
  var ax=cellCX(vc),ay=L.topH*0.42,aw=L.cell*0.18,ah=L.topH*0.30;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.25)";ctx.shadowBlur=4;ctx.shadowOffsetY=2;
  ctx.fillStyle=turn===1?PAL.bp1:PAL.bp3;
  ctx.beginPath();ctx.moveTo(ax-aw,ay-ah);ctx.lineTo(ax+aw,ay-ah);ctx.lineTo(ax,ay+ah);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.fillStyle="rgba(255,255,255,.55)";
  ctx.beginPath();ctx.ellipse(ax-aw*0.34,ay-ah*0.42,aw*0.22,ah*0.16,-0.5,0,Math.PI*2);ctx.fill();
}
function draw(now){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,L.W,L.H);
  drawFrame();
  drawFelt();
  var vc=viewCol();
  if(vc>=0&&!over&&!busy&&turn===1){//选中列：软底洗 + 深绿边线（可点范围）
    rr(L.boardX+vc*L.cell+2,L.boardY+2,L.cell-4,L.boardH-4,10);
    ctx.fillStyle=PAL.soft;ctx.globalAlpha=0.55;ctx.fill();ctx.globalAlpha=1;
    ctx.lineWidth=1.5;ctx.strokeStyle=PAL.deep;ctx.stroke();
  }
  var rad=L.cell*0.40,c,r,cx,cy;
  for(c=0;c<COLS;c++)for(r=0;r<ROWS;r++){
    cx=cellCX(c);cy=cellCY(r);
    if(landFx&&landFx.c===c&&landFx.r===r)continue;//落子轻弹期间由 fx 层绘制
    if(board[c][r]===0)drawHole(cx,cy,rad);
    else drawDisc(cx,cy,rad,pieceColor(board[c][r]));
  }
  if(turn===1&&!busy&&!over&&vc>=0&&heights[vc]<ROWS){//可落点：环 + 半透明 ghost
    var lx=cellCX(vc),ly=cellCY(heights[vc]);
    ctx.strokeStyle=colMix(PAL.bp1,WHITE,0.45);ctx.lineWidth=Math.max(2,L.cell*0.07);
    ctx.beginPath();ctx.arc(lx,ly,rad*1.04,0,Math.PI*2);ctx.stroke();
    drawDisc(lx,ly,rad,PAL.bp1,0.40);
  }
  if(anim){//缓落下落（ease-out，动效降级时直接到位）
    var t=(now-anim.t0)/anim.dur;
    t=t<0?0:t>1?1:t;
    var e=window.__gRM?1:1-Math.pow(1-t,3);
    var ty=cellCY(anim.r),sy=L.boardY-L.cell*0.5;
    drawDisc(cellCX(anim.c),sy+(ty-sy)*e,rad,pieceColor(anim.color));
  }
  if(landFx){//落子轻弹：轻微放大 + 扩散环
    var p=(now-landFx.t0)/landFx.dur;
    if(p>=1)landFx=null;
    else{
      var s=1+0.12*Math.sin(Math.PI*Math.max(0,p));
      var fx0=cellCX(landFx.c),fy0=cellCY(landFx.r);
      ctx.strokeStyle=colMix(PAL.warning,WHITE,0.5);ctx.globalAlpha=0.5*(1-p);
      ctx.lineWidth=Math.max(2,L.cell*0.06);
      ctx.beginPath();ctx.arc(fx0,fy0,rad*(1.05+0.25*p),0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;
      drawDisc(fx0,fy0,rad*s,pieceColor(board[landFx.c][landFx.r]));
    }
  }
  if(winLine){//获胜四子连线高亮（目标）
    var a=winLine[0],b=winLine[winLine.length-1];
    ctx.save();
    ctx.globalAlpha=0.65+0.30*Math.sin(now/160);
    ctx.strokeStyle=colMix(PAL.warning,WHITE,0.5);ctx.lineWidth=Math.max(3,L.cell*0.13);ctx.lineCap="round";
    ctx.shadowColor=WHITE;ctx.shadowBlur=L.cell*0.18;
    ctx.beginPath();
    ctx.moveTo(cellCX(a[0]),cellCY(a[1]));ctx.lineTo(cellCX(b[0]),cellCY(b[1]));
    ctx.stroke();
    ctx.restore();
  }
  drawTop(vc);
}
/* ---------- 主循环 ---------- */
function loop(ts){
  if(anim)stepAnim(ts);
  draw(ts||0);
  requestAnimationFrame(loop);
}
/* ---------- 输入 ---------- */
function colFromEvent(e){
  var rect=cv.getBoundingClientRect();
  var c=Math.floor((e.clientX-rect.left-L.boardX)/L.cell);
  return (c<0||c>=COLS)?-1:c;
}
cv.addEventListener("pointerdown",function(e){
  if(over||busy||turn!==1)return;
  var c=colFromEvent(e);
  if(c<0)return;
  playerDrop(c);
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  hoverCol=(over||busy||turn!==1)?-1:colFromEvent(e);
});
cv.addEventListener("pointerleave",function(){hoverCol=-1});
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
function playerDrop(c){
  if(over||busy||turn!==1)return;
  if(heights[c]>=ROWS){say("这一列已满，换一列");return}
  selCol=c;hoverCol=c;
  startDrop(1,c);
}
window.addEventListener("keydown",function(e){
  if(over||busy||turn!==1)return;
  var k=e.key;
  if(k==="ArrowLeft"){selCol=Math.max(0,selCol-1);hoverCol=-1;e.preventDefault()}
  else if(k==="ArrowRight"){selCol=Math.min(COLS-1,selCol+1);hoverCol=-1;e.preventDefault()}
  else if(k==="ArrowDown"||k===" "){playerDrop(selCol);e.preventDefault()}
});
$("btnNew").addEventListener("click",newGame);
$("ovBtn").addEventListener("click",newGame);
window.addEventListener("resize",resize);
window.addEventListener("load",resize);
palLoad();newGame();resize();
requestAnimationFrame(loop);
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）+ 按钮/图例图标注入（内联 SVG，零外链） */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(els.length){
    function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
    var lastFocus=null;
    function focusFirst(el){
      if(el.dataset.foc)return;el.dataset.foc="1";
      if(!lastFocus)lastFocus=document.activeElement;
      var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
    }
    function restore(el){
      if(!el.dataset.foc)return;delete el.dataset.foc;
      if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
    }
    function trap(el,e){
      if(e.key!=="Tab")return;
      var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
      if(!f.length)return;
      var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
      else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
    }
    function watch(el){
      try{new MutationObserver(function(){
        if(shown(el))focusFirst(el);else restore(el);
      }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
      el.addEventListener("keydown",function(e){trap(el,e)});
    }
    for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  }
  function $(id){return document.getElementById(id)}
  var DISC='<svg class="lg-disc" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"/><ellipse cx="9" cy="8.6" rx="3.2" ry="2" fill="rgba(255,255,255,.55)"/></svg>';
  $("btnNew").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
  $("lgYou").innerHTML=DISC.replace('lg-disc','lg-disc d1')+'<span><b>你</b> · 黄棋</span>';
  $("lgAi").innerHTML=DISC.replace('lg-disc','lg-disc d2')+'<span><b>对手</b> · 蓝棋</span>';
  $("lgGoal").innerHTML='<svg class="lg-goal" viewBox="0 0 24 24" aria-hidden="true"><circle cx="4.5" cy="19.5" r="2.6" fill="currentColor"/><circle cx="10" cy="14" r="2.6" fill="currentColor"/><circle cx="15.5" cy="8.5" r="2.6" fill="currentColor"/><circle cx="21" cy="3" r="2.6" fill="currentColor"/></svg><span><b>目标</b> · 先连成四子</span>';
})();
</script>
