<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3F0E9"/>
      <stop offset="0.55" stop-color="#C7E2D2"/>
      <stop offset="1" stop-color="#AED6C2"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E6B4E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#9CC6AC" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#88B29C" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M84 88 h11 M89.5 82.5 v11" stroke-width="3.2"/>
    <path d="M714 84 h12 M720 78 v12" stroke-width="3.4"/>
