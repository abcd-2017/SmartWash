<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6F2EA"/>
      <stop offset="0.55" stop-color="#CDE6D6"/>
      <stop offset="1" stop-color="#B5D7C4"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E6B4E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#A3CBB0" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#8FB79D" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 86 h11 M97.5 80.5 v11" stroke-width="3.2"/>
    <path d="M700 92 h12 M706 86 v12" stroke-width="3.4"/>
    <path d="M736 268 h9 M740.5 263.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M60 250 h9 M64.5 245.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF6EE" opacity="0.55">
    <circle cx="146" cy="140" r="4"/><circle cx="672" cy="140" r="3.4"/><circle cx="80" cy="320" r="3"/><circle cx="740" cy="330" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="408" rx="240" ry="20" fill="#5E9478" opacity="0.35"/>

  <!-- 背后 4x4 网格淡影 -->
  <g stroke="#FFFFFF" stroke-width="4" opacity="0.18" fill="none">
    <path d="M190 78 H610 M190 148 H610 M190 218 H610 M190 288 H610"/>
    <path d="M190 78 V358 M295 78 V358 M400 78 V358 M505 78 V358 M610 78 V358"/>
  </g>

  <!-- 两两相对的字卡（主视觉，双侧签名表情） -->
  <g stroke-linejoin="round">
    <!-- 左卡 -->
    <g transform="rotate(-6 285 260)">
      <rect x="205" y="165" width="160" height="190" rx="18" fill="#F6F3E8" stroke="#3A2A1E" stroke-width="9"/>
      <path d="M232 205 H312 M232 228 H292" stroke="#8A9A8C" stroke-width="7" stroke-linecap="round" fill="none"/>
      <circle cx="262" cy="272" r="10" fill="#1F1A14"/>
      <circle cx="308" cy="272" r="10" fill="#1F1A14"/>
      <path d="M268 298 Q286 312 302 297" stroke="#1F1A14" stroke-width="7" fill="none" stroke-linecap="round"/>
      <circle cx="230" cy="190" r="9" fill="#FFFFFF" opacity="0.4"/>
    </g>
    <!-- 右卡 -->
    <g transform="rotate(6 515 260)">
      <rect x="435" y="165" width="160" height="190" rx="18" fill="#F2B34C" stroke="#3A2A1E" stroke-width="9"/>
      <path d="M462 205 H542 M462 228 H522" stroke="#3A2A1E" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.7"/>
      <circle cx="492" cy="272" r="10" fill="#1F1A14"/>
      <circle cx="538" cy="272" r="10" fill="#1F1A14"/>
      <path d="M498 298 Q516 312 532 297" stroke="#1F1A14" stroke-width="7" fill="none" stroke-linecap="round"/>
      <circle cx="460" cy="190" r="9" fill="#FFFFFF" opacity="0.45"/>
    </g>
  </g>

  <!-- 反向双箭头 -->
  <g stroke-linecap="round">
    <path d="M352 226 H446" stroke="#17734A" stroke-width="12" fill="none"/>
    <path d="M444 210 L472 226 L444 242 Z" fill="#17734A" stroke="#17734A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M448 282 H354" stroke="#B8452E" stroke-width="12" fill="none"/>
    <path d="M356 266 L328 282 L356 298 Z" fill="#B8452E" stroke="#B8452E" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- 对撞小星 -->
  <path d="M400 168 h12 M406 162 v12" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- 两翼已消除的小对卡 -->
  <g stroke="#3A2A1E" stroke-width="6" stroke-linejoin="round">
    <rect x="56" y="180" width="58" height="72" rx="12" fill="#EFF2E2" transform="rotate(-8 85 216)"/>
    <rect x="76" y="200" width="58" height="72" rx="12" fill="#DFF0E4" transform="rotate(7 105 236)"/>
    <rect x="668" y="180" width="58" height="72" rx="12" fill="#EFF2E2" transform="rotate(8 697 216)"/>
    <rect x="688" y="200" width="58" height="72" rx="12" fill="#F7D774" transform="rotate(-7 717 236)"/>
  </g>
  <g stroke="#8A9A8C" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M72 200 H104 M72 216 H96" transform="rotate(-8 85 216)"/>
    <path d="M686 200 H718 M686 216 H704" transform="rotate(8 697 216)"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
