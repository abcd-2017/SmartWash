<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4EAE78"/>
      <stop offset="0.55" stop-color="#35925C"/>
      <stop offset="1" stop-color="#257E4C"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#14452B" stop-opacity="0.3"/>
    </radialGradient>
    <g id="chip">
      <circle cx="0" cy="0" r="21" fill="#F2C14E" stroke="#3A2A1E" stroke-width="5"/>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#3A2A1E" stroke-width="3" stroke-dasharray="6 5"/>
    </g>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M96 70 h11 M101.5 64.5 v11" stroke-width="3.2"/>
    <path d="M706 74 h12 M712 68 v12" stroke-width="3.4"/>
    <path d="M60 160 h9 M64.5 155.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M744 170 h9 M748.5 165.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF7EE" opacity="0.5">
    <circle cx="170" cy="110" r="4"/><circle cx="636" cy="110" r="3.4"/><circle cx="56" cy="140" r="3"/><circle cx="744" cy="140" r="2.6"/>
  </g>

  <!-- 弧形荷官桌 -->
  <path d="M56 450 Q56 232 400 218 Q744 232 744 450 Z" fill="#1E6E42" stroke="#3A2A1E" stroke-width="9"/>
  <path d="M84 450 Q84 254 400 240 Q716 254 716 450" fill="none" stroke="#E8D9A8" stroke-width="14" opacity="0.9"/>
  <path d="M56 450 Q56 232 400 218 Q744 232 744 450" fill="none" stroke="#F2C14E" stroke-width="5" opacity="0.9"/>
  <!-- 中线 -->
  <path d="M400 248 L400 420" stroke="#EAF7EE" stroke-width="5" stroke-dasharray="12 12" opacity="0.6" stroke-linecap="round"/>

  <!-- 左墩（闲家，4 点） -->
  <g>
    <g transform="translate(268 330) rotate(-4)">
      <rect x="-46" y="-63" width="92" height="126" rx="10" fill="#2D9B6A" stroke="#1E5038" stroke-width="6"/>
      <rect x="-35" y="-52" width="70" height="104" rx="7" fill="none" stroke="#EAF7EE" stroke-width="3.5" opacity="0.85"/>
      <path d="M0 -15 L15 0 L0 15 L-15 0 Z" fill="#EAF7EE" opacity="0.85"/>
    </g>
    <g transform="translate(292 316) rotate(3)">
      <rect x="-46" y="-63" width="92" height="126" rx="10" fill="#FDFBF4" stroke="#3A2A1E" stroke-width="7"/>
      <g fill="#2E2A26">
        <circle cx="-20" cy="-34" r="5.5"/><circle cx="0" cy="-34" r="5.5"/><circle cx="20" cy="-34" r="5.5"/>
        <circle cx="-20" cy="-4" r="5.5"/><circle cx="20" cy="-4" r="5.5"/>
        <circle cx="-20" cy="26" r="5.5"/><circle cx="0" cy="26" r="5.5"/><circle cx="20" cy="26" r="5.5"/>
      </g>
      <circle cx="-30" cy="-48" r="9" fill="#FFFFFF" opacity="0.4"/>
    </g>
  </g>

  <!-- 右墩（庄家，补牌 9 点带表情） -->
  <g>
    <g transform="translate(508 330) rotate(4)">
      <rect x="-46" y="-63" width="92" height="126" rx="10" fill="#2D9B6A" stroke="#1E5038" stroke-width="6"/>
      <rect x="-35" y="-52" width="70" height="104" rx="7" fill="none" stroke="#EAF7EE" stroke-width="3.5" opacity="0.85"/>
      <path d="M0 -15 L15 0 L0 15 L-15 0 Z" fill="#EAF7EE" opacity="0.85"/>
    </g>
    <g transform="translate(484 316) rotate(-3)">
      <rect x="-46" y="-63" width="92" height="126" rx="10" fill="#FDFBF4" stroke="#3A2A1E" stroke-width="7"/>
      <g fill="#C8465C">
        <circle cx="-18" cy="-32" r="5"/><circle cx="0" cy="-32" r="5"/><circle cx="18" cy="-32" r="5"/>
        <circle cx="-18" cy="-6" r="5"/><circle cx="0" cy="-6" r="5"/><circle cx="18" cy="-6" r="5"/>
        <circle cx="-18" cy="20" r="5"/><circle cx="0" cy="20" r="5"/><circle cx="18" cy="20" r="5"/>
      </g>
      <circle cx="-30" cy="-46" r="9" fill="#FFFFFF" opacity="0.4"/>
    </g>
    <g transform="translate(556 250) rotate(10)">
      <rect x="-42" y="-58" width="84" height="116" rx="10" fill="#FDFBF4" stroke="#3A2A1E" stroke-width="7"/>
      <g fill="#C8465C">
        <circle cx="-16" cy="-30" r="5"/><circle cx="0" cy="-30" r="5"/><circle cx="16" cy="-30" r="5"/>
        <circle cx="-16" cy="-8" r="5"/><circle cx="0" cy="-8" r="5"/><circle cx="16" cy="-8" r="5"/>
        <circle cx="-16" cy="14" r="5"/><circle cx="0" cy="14" r="5"/><circle cx="16" cy="14" r="5"/>
      </g>
      <circle cx="-11" cy="38" r="6" fill="#1F1A14"/>
      <circle cx="11" cy="38" r="6" fill="#1F1A14"/>
      <path d="M-8 48 Q0 55 8 46" stroke="#1F1A14" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="-27" cy="-44" r="8" fill="#FFFFFF" opacity="0.45"/>
    </g>
    <!-- 赢家金星 -->
    <path d="M614 210 L620 226 L604 226 Z" fill="#F2C14E" stroke="#3A2A1E" stroke-width="4" stroke-linejoin="round"/>
    <path d="M594 224 L600 240 L584 240 Z" fill="#F2C14E" stroke="#3A2A1E" stroke-width="4" stroke-linejoin="round" transform="rotate(180 592 232)"/>
  </g>

  <!-- 筹码 -->
  <use href="#chip" transform="translate(176 372)"/>
  <use href="#chip" transform="translate(206 356)"/>
  <use href="#chip" transform="translate(190 342)"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
