  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M76 62 h11 M81.5 56.5 v11" stroke-width="3.2"/>
    <path d="M724 58 h12 M730 52 v12" stroke-width="3.4"/>
    <path d="M44 220 h9 M48.5 215.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M756 240 h9 M760.5 235.5 v9" stroke-width="2.6" opacity="0.65"/>
