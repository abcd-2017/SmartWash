      <circle cx="-12" cy="-8" r="9" fill="#2E2A26"/>
      <circle cx="12" cy="-8" r="9" fill="#2E2A26"/>
      <path d="M-9 14 Q0 22 9 12" stroke="#2E2A26" stroke-width="6" fill="none" stroke-linecap="round"/>
