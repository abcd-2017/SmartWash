  <path d="M248 130 Q340 60 470 128" stroke="#F2FBF4" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 11" fill="none" opacity="0.9"/>
  <path d="M454 112 L474 130 L450 138 Z" fill="#F2FBF4" opacity="0.9"/>

