    <path d="M296 122 L384 122 L340 222 Z" fill="#7A5430"/>
    <path d="M416 122 L512 122 L464 222 Z" fill="#B98A54"/>
    <path d="M512 122 L608 122 L560 222 Z" fill="#7A5430"/>
    <path d="M608 122 L696 122 L652 222 Z" fill="#B98A54"/>
