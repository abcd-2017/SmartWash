<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEEF6"/>
      <stop offset="0.55" stop-color="#C2E2F0"/>
      <stop offset="1" stop-color="#A8D2E8"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E4254" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#8FB9D4" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#7CA6C2" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 96 h12 M102 90 v12" stroke-width="3.2"/>
    <path d="M300 70 h10 M305 65 v10" stroke-width="2.8"/>
    <path d="M120 250 h9 M124.5 245.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M700 320 h9 M704.5 315.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="170" cy="150" r="4"/><circle cx="260" cy="210" r="3.4"/><circle cx="70" cy="300" r="3"/><circle cx="742" cy="120" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="420" cy="404" rx="240" ry="20" fill="#5E88A6" opacity="0.32"/>

  <!-- 弹道虚线（飞镖 → 爆开的气球） -->
  <path d="M330 300 Q420 240 508 190" stroke="#1E2620" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 16" fill="none" opacity="0.55"/>
  <path d="M330 300 Q420 240 508 190" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 16" fill="none" opacity="0.8"/>

  <!-- 飞镖（左下，斜指右上） -->
  <g>
    <!-- 尾羽 -->
    <path d="M176 340 L150 322 L162 352 Z" fill="#D96A5A" stroke="#1E2620" stroke-width="6" stroke-linejoin="round"/>
    <path d="M184 352 L152 362 L178 374 Z" fill="#F2C14E" stroke="#1E2620" stroke-width="6" stroke-linejoin="round"/>
    <!-- 镖杆 -->
    <path d="M178 336 L318 288" stroke="#1E2620" stroke-width="14" stroke-linecap="round"/>
    <path d="M178 336 L318 288" stroke="#8A6A44" stroke-width="7" stroke-linecap="round"/>
    <!-- 镖头 -->
    <path d="M310 282 L368 258 L322 302 Z" fill="#C9CFC7" stroke="#1E2620" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="300" cy="292" r="5" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- 气球串（右上） -->
  <g>
    <!-- 气球绳 -->
    <path d="M600 236 Q616 290 604 348" stroke="#1E2620" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M688 220 Q700 268 692 316" stroke="#1E2620" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 爆开的气球：碎片放射 -->
    <g fill="#D96A5A" stroke="#1E2620" stroke-width="5" stroke-linejoin="round">
      <path d="M500 168 L522 146 L534 172 Z"/>
      <path d="M548 132 L572 140 L556 164 Z"/>
      <path d="M452 122 L478 118 L470 144 Z"/>
      <path d="M512 208 L540 202 L528 228 Z"/>
    </g>
    <g stroke="#1E2620" stroke-width="4" stroke-linecap="round" opacity="0.7">
      <path d="M470 176 L448 188"/>
      <path d="M560 190 L580 200"/>
      <path d="M520 118 L524 96"/>
    </g>
    <!-- 主气球（绿，带表情） -->
    <path d="M600 118 Q660 118 660 176 Q660 236 600 236 Q540 236 540 176 Q540 118 600 118 Z"
          fill="#5BC894" stroke="#1E2620" stroke-width="9" stroke-linejoin="round"/>
    <path d="M600 236 L592 250 L608 250 Z" fill="#5BC894" stroke="#1E2620" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="580" cy="156" r="13" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="584" cy="176" r="7" fill="#1F1A14"/>
    <circle cx="618" cy="176" r="7" fill="#1F1A14"/>
    <path d="M588 198 Q601 209 614 196" stroke="#1F1A14" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <!-- 黄气球 -->
    <path d="M688 108 Q740 108 740 162 Q740 218 688 218 Q636 218 636 162 Q636 108 688 108 Z"
          fill="#F2C14E" stroke="#1E2620" stroke-width="8" stroke-linejoin="round"/>
    <path d="M688 218 L681 230 L695 230 Z" fill="#F2C14E" stroke="#1E2620" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="671" cy="141" r="10" fill="#FFFFFF" opacity="0.4"/>
    <!-- 小红气球 -->
    <path d="M712 250 Q754 250 754 294 Q754 340 712 340 Q670 340 670 294 Q670 250 712 250 Z"
          fill="#E07A6A" stroke="#1E2620" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="698" cy="276" r="9" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="700" cy="292" r="5.5" fill="#1F1A14"/>
    <circle cx="724" cy="292" r="5.5" fill="#1F1A14"/>
    <path d="M702 308 Q712 316 722 306" stroke="#1F1A14" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 准星圈 -->
    <g stroke="#1E2620" stroke-width="6" fill="none" opacity="0.8">
      <circle cx="446" cy="272" r="30"/>
      <path d="M446 232 V246 M446 298 V312 M406 272 H420 M472 272 H486"/>
    </g>
    <circle cx="446" cy="272" r="5" fill="#1E2620"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
