<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3F1EA"/>
      <stop offset="0.55" stop-color="#CFE7DA"/>
      <stop offset="1" stop-color="#B4D6C2"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E4A34" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 流体网格淡纹 -->
  <g stroke="#9EC2B0" stroke-width="2" opacity="0.2" fill="none">
    <path d="M140 0 V450 M280 0 V450 M420 0 V450 M560 0 V450 M700 0 V450"/>
    <path d="M0 112 H800 M0 224 H800 M0 336 H800"/>
  </g>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#9EC2AC" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#8AB09A" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 96 h12 M102 90 v12" stroke-width="3.2"/>
    <path d="M694 84 h12 M700 78 v12" stroke-width="3.4"/>
    <path d="M118 300 h9 M122.5 295.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M704 300 h9 M708.5 295.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="170" cy="150" r="4"/><circle cx="712" cy="170" r="3.4"/><circle cx="66" cy="220" r="3"/><circle cx="740" cy="230" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="390" cy="402" rx="215" ry="20" fill="#4E7A5E" opacity="0.32"/>

  <!-- 小紫球（逃跑，速度线） -->
  <g>
    <path d="M96 232 H140 M88 252 H132" stroke="#1E2620" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
    <circle cx="184" cy="246" r="34" fill="#A97FD1" stroke="#1E2620" stroke-width="8"/>
    <circle cx="172" cy="232" r="10" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="175" cy="240" r="5" fill="#1F1A14"/>
    <circle cx="197" cy="240" r="5" fill="#1F1A14"/>
    <path d="M172 262 Q186 252 200 260" stroke="#1F1A14" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 中等 AI 球（橙，惊恐逼近） -->
  <g>
    <circle cx="660" cy="222" r="58" fill="#E8A45A" stroke="#1E2620" stroke-width="9"/>
    <circle cx="638" cy="196" r="14" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="642" cy="212" r="7" fill="#1F1A14"/>
    <circle cx="678" cy="212" r="7" fill="#1F1A14"/>
    <ellipse cx="660" cy="244" rx="12" ry="14" fill="#7A4210"/>
    <path d="M632 186 L620 174 M662 178 L666 164 M688 194 L700 182" stroke="#1E2620" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 大主球（绿，吃相开心，体内已吞小球） -->
  <g>
    <path d="M262 258 Q262 132 396 132 Q530 132 530 258 Q530 302 508 330 Q494 318 478 328 Q462 338 448 328 Q432 318 416 328 Q398 338 382 328 Q366 318 350 328 Q334 338 320 328 Q304 318 290 330 Q272 306 262 258 Z"
          fill="#3FB57F" stroke="#1E2620" stroke-width="10" stroke-linejoin="round"/>
    <!-- 体内已吞小球轮廓 -->
    <circle cx="336" cy="288" r="17" fill="#2D8A64" opacity="0.75"/>
    <circle cx="452" cy="280" r="13" fill="#2D8A64" opacity="0.75"/>
    <!-- 高光 -->
    <path d="M304 176 Q318 158 344 152" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="0.42"/>
    <circle cx="298" cy="206" r="13" fill="#FFFFFF" opacity="0.3"/>
    <!-- 表情 -->
    <circle cx="356" cy="212" r="11" fill="#1F1A14"/>
    <circle cx="436" cy="212" r="11" fill="#1F1A14"/>
    <path d="M366 244 Q396 276 426 242" stroke="#1F1A14" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M366 244 Q370 252 380 254 M426 242 Q422 250 412 254" stroke="#1F1A14" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 胶粒（蓝色小点） -->
  <g fill="#6BB4DE" stroke="#1E2620" stroke-width="6">
    <circle cx="556" cy="322" r="17"/>
    <circle cx="588" cy="352" r="12"/>
    <circle cx="146" cy="348" r="14"/>
    <circle cx="608" cy="130" r="11"/>
  </g>
  <circle cx="550" cy="316" r="6" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="600" cy="124" r="4" fill="#FFFFFF" opacity="0.4"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
