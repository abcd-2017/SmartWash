    <circle cx="560" cy="303" r="24" fill="#E2A44E" stroke="#1E2620" stroke-width="8"/>
    <rect x="400" y="282" width="160" height="42" rx="18" fill="#E2A44E" stroke="#1E2620" stroke-width="9"/>
    <circle cx="424" cy="296" r="9" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="502" cy="296" r="7" fill="#1F1A14"/>
