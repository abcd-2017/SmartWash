  <!-- 剪刀 -->
  <g>
    <path d="M620 250 L702 204 L706 214 L628 258 Z" fill="#C9CDD2" stroke="#3A2A1E" stroke-width="6" stroke-linejoin="round"/>
    <path d="M620 250 L702 296 L696 304 L614 260 Z" fill="#C9CDD2" stroke="#3A2A1E" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="600" cy="232" r="17" fill="none" stroke="#3A2A1E" stroke-width="8"/>
    <circle cx="600" cy="270" r="17" fill="none" stroke="#3A2A1E" stroke-width="8"/>
    <circle cx="620" cy="250" r="8" fill="#E8A13C" stroke="#3A2A1E" stroke-width="5"/>
