      <ellipse cx="424" cy="152" rx="78" ry="38" fill="#6E9C56"/>
      <ellipse cx="352" cy="112" rx="68" ry="32" fill="#5E8C4A"/>
    </g>
    <g stroke="#4A7038" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M268 188 Q300 176 340 190"/>
      <path d="M380 146 Q420 132 462 148"/>
      <path d="M316 106 Q348 94 384 108"/>
