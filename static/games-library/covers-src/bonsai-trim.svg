    <path d="M250 336 L490 336 L466 392 L274 392 Z" fill="#B98A4E" stroke="#3A2A1E" stroke-width="8" stroke-linejoin="round"/>
    <rect x="238" y="320" width="264" height="22" rx="9" fill="#8F6A3A" stroke="#3A2A1E" stroke-width="7"/>
    <!-- 盆签名表情 -->
    <circle cx="332" cy="364" r="10" fill="#1F1A14"/>
    <circle cx="408" cy="364" r="10" fill="#1F1A14"/>
    <circle cx="335" cy="361" r="3.2" fill="#FFFFFF"/>
    <circle cx="411" cy="361" r="3.2" fill="#FFFFFF"/>
    <path d="M348 382 Q370 392 392 381" stroke="#1F1A14" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <circle cx="270" cy="352" r="12" fill="#FFFFFF" opacity="0.4"/>
