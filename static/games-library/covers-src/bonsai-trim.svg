  <ellipse cx="370" cy="168" rx="188" ry="112" fill="none" stroke="#FFF3DC" stroke-width="6" stroke-dasharray="14 12" opacity="0.8"/>

  <!-- 盆景 -->
  <g>
    <!-- 树干 -->
    <path d="M370 330 C350 290 392 270 370 240 C350 210 382 190 370 158" stroke="#8A5A3A" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M370 262 Q410 250 436 226" stroke="#8A5A3A" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- 树冠 -->
    <g stroke="#3A2A1E" stroke-width="7" stroke-linejoin="round">
