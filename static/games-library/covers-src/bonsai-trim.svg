  <!-- 剪下的枝条 -->
  <g>
    <path d="M724 168 Q740 180 752 196" stroke="#8A5A3A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="742" cy="164" rx="18" ry="10" fill="#6E9C56" stroke="#3A2A1E" stroke-width="5" transform="rotate(-24 742 164)"/>
    <ellipse cx="762" cy="192" rx="16" ry="9" fill="#5E8C4A" stroke="#3A2A1E" stroke-width="5" transform="rotate(18 762 192)"/>
    <path d="M700 150 L684 138 M716 176 L704 168" stroke="#3A2A1E" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
