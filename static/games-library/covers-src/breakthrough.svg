      <stop offset="0" stop-color="#8CCB9C"/>
      <stop offset="0.55" stop-color="#66B27B"/>
      <stop offset="1" stop-color="#4C9C62"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
