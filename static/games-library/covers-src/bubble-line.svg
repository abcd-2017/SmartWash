<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEFF7"/>
      <stop offset="0.55" stop-color="#BFE0F0"/>
      <stop offset="1" stop-color="#9FCCE8"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E4254" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带（水底） -->
  <rect y="394" width="800" height="56" fill="#7FB0D0" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#6C9CBC" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 96 h12 M102 90 v12" stroke-width="3.2"/>
    <path d="M694 84 h12 M700 78 v12" stroke-width="3.4"/>
    <path d="M118 310 h9 M122.5 305.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M704 310 h9 M708.5 305.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="160" cy="160" r="4"/><circle cx="712" cy="150" r="3.4"/><circle cx="66" cy="220" r="3"/><circle cx="740" cy="240" r="2.6"/>
  </g>

  <!-- 水面波浪线 -->
  <path d="M40 372 Q80 356 120 372 Q160 388 200 372 Q240 356 280 372" stroke="#2E7EA8" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M520 372 Q560 356 600 372 Q640 388 680 372 Q720 356 760 372" stroke="#2E7EA8" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- 上浮小气泡 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.6">
    <circle cx="250" cy="340" r="9"/>
    <circle cx="228" cy="300" r="6"/>
    <circle cx="560" cy="336" r="8"/>
    <circle cx="582" cy="298" r="5"/>
  </g>

  <!-- 三连消除光带（绿） -->
  <rect x="176" y="150" width="424" height="128" rx="64" fill="#8FD68F" opacity="0.3"/>
  <rect x="176" y="150" width="424" height="128" rx="64" fill="none" stroke="#17734A" stroke-width="5" stroke-dasharray="14 12" opacity="0.7"/>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="404" rx="260" ry="18" fill="#4E88AC" opacity="0.3"/>

  <!-- 横向泡泡排（主视觉） -->
  <g>
    <!-- 绿泡 1（带表情） -->
    <circle cx="240" cy="214" r="56" fill="#8FD68F" stroke="#1E2620" stroke-width="9"/>
    <circle cx="240" cy="214" r="56" fill="url(#glass)"/>
    <path d="M212 178 Q222 168 238 164" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <circle cx="224" cy="206" r="7" fill="#1F1A14"/>
    <circle cx="258" cy="206" r="7" fill="#1F1A14"/>
    <path d="M230 228 Q241 237 252 227" stroke="#1F1A14" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <!-- 绿泡 2 -->
    <circle cx="356" cy="214" r="56" fill="#8FD68F" stroke="#1E2620" stroke-width="9"/>
    <circle cx="356" cy="214" r="56" fill="url(#glass)"/>
    <path d="M328 178 Q338 168 354 164" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <!-- 绿泡 3 -->
    <circle cx="472" cy="214" r="56" fill="#8FD68F" stroke="#1E2620" stroke-width="9"/>
    <circle cx="472" cy="214" r="56" fill="url(#glass)"/>
    <path d="M444 178 Q454 168 470 164" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <!-- 橙泡（左外） -->
    <circle cx="124" cy="230" r="44" fill="#E8B45A" stroke="#1E2620" stroke-width="8"/>
    <circle cx="124" cy="230" r="44" fill="url(#glass)"/>
    <path d="M104 202 Q112 194 124 191" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    <!-- 粉泡（右外） -->
    <circle cx="588" cy="230" r="44" fill="#E693A0" stroke="#1E2620" stroke-width="8"/>
    <circle cx="588" cy="230" r="44" fill="url(#glass)"/>
    <path d="M568 202 Q576 194 588 191" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    <!-- 蓝泡（右上小） -->
    <circle cx="668" cy="160" r="30" fill="#93BCE6" stroke="#1E2620" stroke-width="7"/>
    <circle cx="668" cy="160" r="30" fill="url(#glass)"/>
  </g>

  <!-- 上浮指示箭头 -->
  <path d="M240 322 V292 M232 300 L240 290 L248 300" stroke="#1E2620" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
