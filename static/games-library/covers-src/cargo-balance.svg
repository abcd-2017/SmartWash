<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B98C"/>
      <stop offset="0.55" stop-color="#C9A570"/>
      <stop offset="1" stop-color="#B28C56"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A3E1E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#9C7A46" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#8A6A38" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFF3DC" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 96 h12 M102 90 v12" stroke-width="3.2"/>
    <path d="M694 84 h12 M700 78 v12" stroke-width="3.4"/>
    <path d="M118 280 h9 M122.5 275.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M690 300 h9 M694.5 295.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFF3DC" opacity="0.5">
    <circle cx="170" cy="160" r="4"/><circle cx="712" cy="150" r="3.4"/><circle cx="70" cy="230" r="3"/><circle cx="740" cy="220" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="404" rx="245" ry="20" fill="#6E5028" opacity="0.35"/>

  <!-- 天平立柱与底座 -->
  <g>
    <rect x="376" y="352" width="48" height="52" rx="8" fill="#5E4A30" stroke="#3A2A1E" stroke-width="8"/>
    <path d="M330 404 H470" stroke="#3A2A1E" stroke-width="12" stroke-linecap="round"/>
    <path d="M330 404 H470" stroke="#8A6A44" stroke-width="6" stroke-linecap="round"/>
    <rect x="366" y="188" width="68" height="170" rx="10" fill="#8A6A44" stroke="#3A2A1E" stroke-width="8"/>
    <path d="M382 210 V340" stroke="#5E4A30" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 平衡指针 -->
  <path d="M400 214 V186 M394 196 L400 186 L406 196" stroke="#3A2A1E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="400" cy="186" r="9" fill="#F2C14E" stroke="#3A2A1E" stroke-width="5"/>

  <!-- 横梁（水平） -->
  <g>
    <rect x="112" y="170" width="576" height="30" rx="14" fill="#8A6A44" stroke="#3A2A1E" stroke-width="9"/>
    <path d="M140 185 H660" stroke="#5E4A30" stroke-width="5" stroke-linecap="round"/>
    <circle cx="400" cy="185" r="21" fill="#D9A55C" stroke="#3A2A1E" stroke-width="8"/>
    <circle cx="392" cy="178" r="6" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- 左吊链与吊盘 -->
  <g>
    <path d="M158 198 V252 M190 198 V252" stroke="#3A2A1E" stroke-width="7" stroke-linecap="round"/>
    <path d="M140 252 H208" stroke="#3A2A1E" stroke-width="10" stroke-linecap="round"/>
    <path d="M144 260 H204 L198 300 Q196 310 184 310 L164 310 Q152 310 150 300 Z"
