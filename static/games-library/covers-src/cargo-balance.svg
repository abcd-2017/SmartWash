    <path d="M150 278 H198" stroke="#5E4A30" stroke-width="5" stroke-linecap="round"/>
    <!-- 左盘货箱（木箱，带表情） -->
    <g>
      <rect x="140" y="212" width="66" height="44" rx="6" fill="#D9A55C" stroke="#3A2A1E" stroke-width="7"/>
      <path d="M140 226 H206 M173 212 V256" stroke="#3A2A1E" stroke-width="5" opacity="0.65"/>
      <circle cx="158" cy="236" r="5" fill="#1F1A14"/>
      <circle cx="184" cy="236" r="5" fill="#1F1A14"/>
      <path d="M164 246 Q171 252 178 245" stroke="#1F1A14" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <rect x="146" y="178" width="54" height="36" rx="6" fill="#C08A4A" stroke="#3A2A1E" stroke-width="7"/>
      <circle cx="160" cy="190" r="4.5" fill="#1F1A14"/>
      <circle cx="182" cy="190" r="4.5" fill="#1F1A14"/>
      <path d="M164 200 Q171 205 178 199" stroke="#1F1A14" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 右吊链与吊盘 -->
  <g>
    <path d="M610 198 V252 M642 198 V252" stroke="#3A2A1E" stroke-width="7" stroke-linecap="round"/>
    <path d="M592 252 H660" stroke="#3A2A1E" stroke-width="10" stroke-linecap="round"/>
    <path d="M596 260 H656 L650 300 Q648 310 636 310 L616 310 Q604 310 602 300 Z"
          fill="#7A5C28" stroke="#3A2A1E" stroke-width="8" stroke-linejoin="round"/>
    <path d="M602 278 H650" stroke="#5E4A30" stroke-width="5" stroke-linecap="round"/>
    <!-- 右盘货箱（蓝大箱） -->
    <rect x="596" y="208" width="60" height="48" rx="6" fill="#6BA8D9" stroke="#3A2A1E" stroke-width="7"/>
    <path d="M596 226 H656" stroke="#3A2A1E" stroke-width="5" opacity="0.65"/>
    <circle cx="612" cy="190" r="5" fill="#1F1A14"/>
    <circle cx="640" cy="190" r="5" fill="#1F1A14"/>
    <path d="M618 200 Q626 206 634 199" stroke="#1F1A14" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <rect x="598" y="158" width="56" height="52" rx="6" fill="#B58BD0" stroke="#3A2A1E" stroke-width="7"/>
    <circle cx="612" cy="172" r="6" fill="#FFFFFF" opacity="0.45"/>
    <path d="M598 176 H654" stroke="#3A2A1E" stroke-width="5" opacity="0.65"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
