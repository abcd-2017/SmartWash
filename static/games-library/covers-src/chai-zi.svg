<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F6EE"/>
      <stop offset="0.55" stop-color="#B7E0C8"/>
      <stop offset="1" stop-color="#79C49B"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.6" stop-color="#1E2620" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E2620" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect y="392" width="800" height="58" fill="#4E9B78" opacity="0.5"/>
  <rect y="392" width="800" height="6" fill="#3C7D60" opacity="0.5"/>

  <g fill="#FFFFFF" opacity="0.5">
    <path d="M96 84 h11 M101.5 78.5 v11" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M700 92 h12 M706 86 v12" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M664 292 h9 M668.5 287.5 v9" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M132 296 h9 M136.5 291.5 v9" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="188" cy="120" r="4"/><circle cx="612" cy="70" r="3.4"/><circle cx="90" cy="220" r="3"/><circle cx="740" cy="200" r="2.6"/>
  </g>

  <ellipse cx="400" cy="404" rx="232" ry="25" fill="#2F6E52" opacity="0.35"/>

  <!-- 漂浮的汉字零件块 -->
  <g stroke-linejoin="round">
    <!-- 口 -->
    <g transform="rotate(-8 250 190)">
      <rect x="190" y="130" width="120" height="120" rx="18" fill="#FFF6E6" stroke="#3A2A1E" stroke-width="9"/>
      <rect x="228" y="166" width="44" height="44" rx="8" fill="none" stroke="#2D9B6A" stroke-width="9"/>
      <circle cx="226" cy="228" r="7" fill="#1F1A14"/><circle cx="274" cy="228" r="7" fill="#1F1A14"/>
      <path d="M236 240 Q250 251 264 240" stroke="#1F1A14" stroke-width="6" stroke-linecap="round" fill="none"/>
      <ellipse cx="212" cy="152" rx="18" ry="10" fill="#FFFFFF" opacity="0.55"/>
    </g>
    <!-- 十 -->
    <g transform="rotate(6 410 150)">
      <rect x="350" y="90" width="120" height="120" rx="18" fill="#E8F6EF" stroke="#3A2A1E" stroke-width="9"/>
      <path d="M410 120 V180 M380 150 H440" stroke="#D98A26" stroke-width="11" stroke-linecap="round" fill="none"/>
      <circle cx="388" cy="196" r="7" fill="#1F1A14"/><circle cx="432" cy="196" r="7" fill="#1F1A14"/>
      <path d="M398 208 Q410 219 422 208" stroke="#1F1A14" stroke-width="6" stroke-linecap="round" fill="none"/>
      <ellipse cx="372" cy="112" rx="18" ry="10" fill="#FFFFFF" opacity="0.55"/>
    </g>
    <!-- 人 -->
    <g transform="rotate(-5 565 200)">
      <rect x="505" y="140" width="120" height="120" rx="18" fill="#FFF0F3" stroke="#3A2A1E" stroke-width="9"/>
      <path d="M565 170 L536 228 M565 170 L594 228" stroke="#4A9FD4" stroke-width="11" stroke-linecap="round" fill="none"/>
      <circle cx="541" cy="242" r="7" fill="#1F1A14"/><circle cx="589" cy="242" r="7" fill="#1F1A14"/>
      <path d="M551 254 Q565 265 579 254" stroke="#1F1A14" stroke-width="6" stroke-linecap="round" fill="none"/>
      <ellipse cx="527" cy="162" rx="18" ry="10" fill="#FFFFFF" opacity="0.55"/>
    </g>
    <!-- 一（小块） -->
    <g transform="rotate(10 660 110)">
      <rect x="622" y="72" width="76" height="76" rx="14" fill="#FFF6E6" stroke="#3A2A1E" stroke-width="8"/>
      <path d="M640 108 H680" stroke="#C9526B" stroke-width="10" stroke-linecap="round" fill="none"/>
      <circle cx="650" cy="128" r="4.6" fill="#1F1A14"/><circle cx="672" cy="128" r="4.6" fill="#1F1A14"/>
      <path d="M655 137 Q661 142 667 137" stroke="#1F1A14" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>
