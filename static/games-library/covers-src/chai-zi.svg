  <!-- 底板 -->
  <g stroke-linejoin="round">
    <rect x="170" y="330" width="460" height="72" rx="26" fill="#FFFFFF" stroke="#3A2A1E" stroke-width="10"/>
    <rect x="205" y="346" width="90" height="40" rx="12" fill="#F5F6F3" stroke="#E6E9E6" stroke-width="3"/>
    <rect x="355" y="346" width="90" height="40" rx="12" fill="#F5F6F3" stroke="#E6E9E6" stroke-width="3"/>
    <rect x="505" y="346" width="90" height="40" rx="12" fill="#F5F6F3" stroke="#E6E9E6" stroke-width="3"/>
    <ellipse cx="215" cy="342" rx="40" ry="8" fill="#FFFFFF" opacity="0.7"/>
