<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FC4AC"/>
      <stop offset="0.55" stop-color="#6AA88D"/>
      <stop offset="1" stop-color="#528E74"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E3A2E" stop-opacity="0.32"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#447D66" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#386B56" opacity="0.55"/>
  <!-- 雨丝与星尘 -->
  <g stroke="#DFF3E8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.42">
    <path d="M120 84 V116"/><path d="M158 140 V168"/><path d="M210 66 V92"/>
    <path d="M256 200 V228"/><path d="M660 210 V238"/><path d="M716 130 V158"/>
    <path d="M762 60 V88"/><path d="M492 56 V84"/><path d="M614 66 V94"/><path d="M96 260 V288"/>
  </g>
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M148 210 h10 M153 205 v10" stroke-width="3"/>
    <path d="M700 320 h10 M705 315 v10" stroke-width="3"/>
  </g>
  <g fill="#DFF3E8" opacity="0.5">
    <circle cx="92" cy="170" r="3.4"/><circle cx="748" cy="200" r="3"/><circle cx="690" cy="60" r="3"/><circle cx="230" cy="320" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="420" cy="400" rx="230" ry="20" fill="#2E5B48" opacity="0.4"/>

  <!-- 落下的主题字块 -->
  <g stroke-linejoin="round">
    <g transform="rotate(-12 280 120)">
      <rect x="248" y="88" width="64" height="64" rx="12" fill="#2D9B6A" stroke="#1E3026" stroke-width="7"/>
      <path d="M262 108 H298 M262 128 H284" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="rotate(8 430 80)">
      <rect x="398" y="48" width="64" height="64" rx="12" fill="#F2B34C" stroke="#1E3026" stroke-width="7"/>
      <path d="M412 68 H448 M412 88 H448" stroke="#1E3026" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.72"/>
    </g>
    <g transform="rotate(-6 560 160)">
      <rect x="528" y="128" width="64" height="64" rx="12" fill="#E88B5A" stroke="#1E3026" stroke-width="7"/>
      <path d="M542 148 H578 M542 168 H562" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="rotate(10 688 120)">
      <rect x="656" y="88" width="64" height="64" rx="12" fill="#3FAE7A" stroke="#1E3026" stroke-width="7"/>
      <path d="M670 108 H706 M670 128 H690" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
    <!-- 落速线 -->
    <g stroke="#DFF3E8" stroke-width="4" stroke-linecap="round" opacity="0.5" fill="none">
      <path d="M280 44 V64"/><path d="M430 10 V30"/><path d="M560 90 V110"/><path d="M688 50 V70"/>
    </g>
  </g>
  <!-- 接字弧线 -->
  <path d="M430 148 Q420 220 404 282" stroke="#DFF3E8" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 10" fill="none" opacity="0.7"/>

  <!-- 篮筐（主视觉，签名表情） -->
  <g stroke-linejoin="round">
    <ellipse cx="420" cy="296" rx="88" ry="18" fill="#6E4A26" stroke="#1E3026" stroke-width="8"/>
    <path d="M336 296 L306 380 L534 380 L504 296" fill="#A87944" stroke="#1E3026" stroke-width="9"/>
    <path d="M352 316 L490 316 M348 340 L494 340 M340 362 L502 362" stroke="#7A5230" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M376 306 L364 372 M420 306 L420 374 M464 306 L476 372" stroke="#7A5230" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- 签名表情（筐身） -->
    <circle cx="392" cy="322" r="9" fill="#1E3026"/>
    <circle cx="448" cy="322" r="9" fill="#1E3026"/>
    <path d="M400 344 Q420 358 440 343" stroke="#1E3026" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <circle cx="376" cy="310" r="8" fill="#FFFFFF" opacity="0.35"/>
  </g>
  <!-- 接住的小星 -->
  <path d="M556 372 h10 M561 367 v10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M286 372 h10 M291 367 v10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
