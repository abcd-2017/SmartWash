    <rect x="264" y="308" width="58" height="58"/><rect x="380" y="308" width="58" height="58"/><rect x="496" y="308" width="58" height="58"/>
    <rect x="206" y="366" width="58" height="58"/><rect x="322" y="366" width="58" height="58"/><rect x="438" y="366" width="58" height="58"/>
