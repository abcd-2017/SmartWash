  <!-- 云 -->
  <ellipse cx="170" cy="110" rx="55" ry="18" fill="#FFFFFF" opacity="0.5"/>
  <ellipse cx="240" cy="142" rx="40" ry="14" fill="#FFFFFF" opacity="0.4"/>
