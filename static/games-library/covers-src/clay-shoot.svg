    <path d="M712 92 h12 M718 86 v12" stroke-width="3.4"/>
    <path d="M470 170 h9 M474.5 165.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M560 320 h9 M564.5 315.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="440" cy="100" r="4"/><circle cx="700" cy="140" r="3.4"/><circle cx="360" cy="140" r="3"/><circle cx="740" cy="220" r="2.6"/>
