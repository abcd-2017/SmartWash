  <path d="M110 440 L330 258" stroke="#4E5860" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M150 458 L372 276" stroke="#4E5860" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M116 430 L322 254 M156 448 L364 272" stroke="#8A98A4" stroke-width="6" stroke-linecap="round" opacity="0.8" fill="none"/>
  <circle cx="330" cy="258" r="18" fill="#3A444C" stroke="#1E2620" stroke-width="7"/>
  <circle cx="330" cy="258" r="8" fill="#171C20"/>
  <circle cx="372" cy="276" r="18" fill="#3A444C" stroke="#1E2620" stroke-width="7"/>
