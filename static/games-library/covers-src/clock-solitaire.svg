  </g>

  <ellipse cx="400" cy="426" rx="252" ry="22" fill="#1E5E40" opacity="0.35"/>

  <!-- 钟面 -->
  <circle cx="400" cy="240" r="170" fill="#F7F3E4" stroke="#3A2A1E" stroke-width="9"/>
  <circle cx="400" cy="240" r="128" fill="none" stroke="#D9C9A0" stroke-width="4" opacity="0.9"/>
  <!-- 12 点位刻点 -->
  <g fill="#3A2A1E">
