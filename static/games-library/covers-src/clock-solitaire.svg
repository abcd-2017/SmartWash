    <g transform="translate(485 93) rotate(30)">
      <rect x="-22" y="-30" width="44" height="60" rx="6" fill="#FDFBF4" stroke="#3A2A1E" stroke-width="5.5"/>
      <use href="#pipH" transform="translate(0 -2) scale(1.5)" fill="#C8465C"/>
    </g>
    <use href="#back" transform="translate(547 155) rotate(60)"/>
    <use href="#back" transform="translate(570 240) rotate(90)"/>
    <use href="#back" transform="translate(547 325) rotate(120)"/>
    <g transform="translate(484 387) rotate(150)">
