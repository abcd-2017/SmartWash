      <use href="#pipC" transform="translate(0 -2) scale(1.4)" fill="#2E2A26"/>
    </g>
  </g>

  <!-- 中央 K 堆（指针牌，带签名表情） -->
  <g>
    <rect x="368" y="204" width="64" height="88" rx="7" fill="#2D9B6A" stroke="#1E5038" stroke-width="6"/>
    <rect x="376" y="212" width="48" height="72" rx="5" fill="none" stroke="#EAF7EE" stroke-width="3" opacity="0.85"/>
    <rect x="366" y="198" width="68" height="92" rx="8" fill="#FDFBF4" stroke="#3A2A1E" stroke-width="7"/>
    <use href="#pipH" transform="translate(400 228) scale(2.2)" fill="#C8465C"/>
    <circle cx="384" cy="254" r="6.5" fill="#1F1A14"/>
