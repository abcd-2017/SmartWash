    <circle cx="538" cy="304" r="5"/><circle cx="484" cy="361" r="5"/><circle cx="400" cy="382" r="5"/><circle cx="316" cy="361" r="5"/>
    <circle cx="262" cy="304" r="5"/><circle cx="240" cy="240" r="5"/><circle cx="262" cy="176" r="5"/><circle cx="316" cy="119" r="5"/>
  </g>

