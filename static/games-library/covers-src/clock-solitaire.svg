      <use href="#pipD" transform="translate(0 -2) scale(1.5)" fill="#C8465C"/>
    </g>
    <use href="#back" transform="translate(253 325) rotate(240)"/>
    <use href="#back" transform="translate(230 240) rotate(270)"/>
    <use href="#back" transform="translate(253 155) rotate(300)"/>
