  <g>
    <rect x="112" y="316" width="56" height="76" rx="7" fill="#2D9B6A" stroke="#1E5038" stroke-width="5.5" transform="rotate(-6 140 354)"/>
    <rect x="116" y="326" width="56" height="76" rx="7" fill="#2D9B6A" stroke="#1E5038" stroke-width="5.5" transform="rotate(-3 144 364)"/>
    <rect x="120" y="336" width="56" height="76" rx="7" fill="#2D9B6A" stroke="#1E5038" stroke-width="5.5" transform="rotate(2 148 374)"/>
    <rect x="634" y="300" width="56" height="76" rx="7" fill="#2D9B6A" stroke="#1E5038" stroke-width="5.5" transform="rotate(7 662 338)"/>
    <rect x="630" y="310" width="56" height="76" rx="7" fill="#2D9B6A" stroke="#1E5038" stroke-width="5.5" transform="rotate(3 658 348)"/>
    <rect x="626" y="320" width="56" height="76" rx="7" fill="#2D9B6A" stroke="#1E5038" stroke-width="5.5" transform="rotate(-2 654 358)"/>
