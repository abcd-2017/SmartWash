  <rect y="394" width="800" height="56" fill="#3B9166" opacity="0.6"/>
  <rect y="394" width="800" height="6" fill="#317C56" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 70 h11 M97.5 64.5 v11" stroke-width="3.2"/>
    <path d="M716 84 h12 M722 78 v12" stroke-width="3.4"/>
    <path d="M748 230 h9 M752.5 225.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M52 250 h9 M56.5 245.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF7EE" opacity="0.5">
