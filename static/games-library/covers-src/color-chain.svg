  <g fill="none" stroke="#C9CDD2" stroke-width="5">
    <circle cx="262" cy="254" r="8"/>
    <circle cx="317" cy="236" r="8"/>
    <circle cx="372" cy="227" r="8"/>
    <circle cx="428" cy="227" r="8"/>
    <circle cx="483" cy="236" r="8"/>
    <circle cx="538" cy="254" r="8"/>
  </g>

  <!-- 同色珠链 -->
  <g fill="#3F9D77" stroke="#1E2620" stroke-width="7">
    <circle cx="235" cy="267" r="30"/>
    <circle cx="290" cy="244" r="30"/>
    <circle cx="345" cy="230" r="30"/>
    <circle cx="455" cy="230" r="30"/>
    <circle cx="510" cy="244" r="30"/>
    <circle cx="565" cy="267" r="30"/>
