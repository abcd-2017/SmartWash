  <circle cx="400" cy="225" r="44" fill="#5CB892" stroke="#1E2620" stroke-width="8"/>
  <circle cx="400" cy="225" r="44" fill="url(#gloss)"/>
  <circle cx="384" cy="213" r="8.5" fill="#0B3625"/>
  <circle cx="416" cy="213" r="8.5" fill="#0B3625"/>
  <circle cx="381.5" cy="210.5" r="2.7" fill="#FFFFFF"/>
  <circle cx="413.5" cy="210.5" r="2.7" fill="#FFFFFF"/>
  <path d="M388 242 Q400 252 412 240" stroke="#0B3625" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <circle cx="378" cy="200" r="11" fill="#FFFFFF" opacity="0.5"/>

