  <circle cx="225" cy="256" r="8" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="280" cy="233" r="8" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="335" cy="219" r="8" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="445" cy="219" r="8" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="500" cy="233" r="8" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="555" cy="256" r="8" fill="#FFFFFF" opacity="0.4"/>

