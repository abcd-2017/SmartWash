<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6E9C"/>
      <stop offset="0.55" stop-color="#1E527A"/>
      <stop offset="1" stop-color="#143E60"/>
    </linearGradient>
    <radialGradient id="chainGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ED9A8" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#5CB892" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5CB892" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B2440" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect y="392" width="800" height="58" fill="#103450" opacity="0.55"/>
  <rect y="392" width="800" height="6" fill="#0D2C44" opacity="0.6"/>
  <g stroke="#BFE0F0" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 82 h11 M97.5 76.5 v11" stroke-width="3"/>
    <path d="M712 86 h12 M718 80 v12" stroke-width="3.4"/>
    <path d="M60 220 h9 M64.5 215.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M748 250 h9 M752.5 245.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#BFE0F0" opacity="0.5">
    <circle cx="140" cy="140" r="4"/><circle cx="676" cy="120" r="3.4"/><circle cx="70" cy="190" r="3"/><circle cx="752" cy="180" r="2.6"/>
  </g>

  <ellipse cx="400" cy="404" rx="250" ry="20" fill="#0D2C44" opacity="0.45"/>

  <!-- 链条光晕 -->
  <ellipse cx="400" cy="238" rx="270" ry="115" fill="url(#chainGlow)"/>
  <path d="M180 300 Q400 150 620 300" fill="none" stroke="#5CB892" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 18" opacity="0.4"/>

