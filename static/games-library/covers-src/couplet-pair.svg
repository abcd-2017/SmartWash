    <path d="M392 240 Q400 248 408 239" stroke="#1F1A14" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="382" cy="212" r="6" fill="#FFFFFF" opacity="0.4"/>
  </g>
  <path d="M472 130 h11 M477.5 124.5 v11" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M316 100 h11 M321.5 94.5 v11" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <rect width="800" height="450" fill="url(#vign)"/>
