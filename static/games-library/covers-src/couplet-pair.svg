    <path d="M600 344 V368" stroke="#3A2A1E" stroke-width="5" stroke-linecap="round"/>
    <path d="M592 368 L608 368 L600 392 Z" fill="#D8465F" stroke="#3A2A1E" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="572" cy="132" r="8" fill="#FFFFFF" opacity="0.4"/>
