  <!-- 中央同心结（签名表情） -->
  <g stroke-linejoin="round">
    <path d="M400 196 L436 232 L400 268 L364 232 Z" fill="#C9453C" stroke="#3A2A1E" stroke-width="8"/>
    <path d="M400 268 Q384 288 400 306 Q416 288 400 268" fill="none" stroke="#3A2A1E" stroke-width="6" stroke-linecap="round"/>
    <circle cx="388" cy="224" r="6" fill="#1F1A14"/>
