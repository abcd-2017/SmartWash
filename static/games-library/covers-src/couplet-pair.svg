<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F1E8"/>
      <stop offset="0.55" stop-color="#CFE4D5"/>
      <stop offset="1" stop-color="#B7D8C6"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E6B4E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#A2C9B2" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#8EB5A0" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 86 h11 M97.5 80.5 v11" stroke-width="3.2"/>
    <path d="M700 92 h12 M706 86 v12" stroke-width="3.4"/>
    <path d="M744 300 h9 M748.5 295.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M58 290 h9 M62.5 285.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF6EE" opacity="0.55">
    <circle cx="148" cy="150" r="4"/><circle cx="748" cy="170" r="3.4"/><circle cx="70" cy="200" r="3"/><circle cx="106" cy="340" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="408" rx="256" ry="20" fill="#5E9478" opacity="0.35"/>

  <!-- 对仗红线（先画线，牌压线） -->
  <g stroke="#C9453C" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M243 152 Q400 128 557 152"/>
    <path d="M243 312 Q400 288 557 312"/>
    <path d="M243 232 Q330 214 400 224"/>
    <path d="M400 240 Q470 252 557 232"/>
  </g>

  <!-- 左联串（主视觉之一） -->
  <g stroke-linejoin="round">
    <circle cx="200" cy="92" r="13" fill="#E9C87E" stroke="#3A2A1E" stroke-width="6"/>
    <path d="M200 105 V124" stroke="#3A2A1E" stroke-width="6" stroke-linecap="round"/>
    <rect x="157" y="120" width="86" height="64" rx="12" fill="#2D9B6A" stroke="#3A2A1E" stroke-width="8"/>
    <rect x="157" y="200" width="86" height="64" rx="12" fill="#3FAE7A" stroke="#3A2A1E" stroke-width="8"/>
    <rect x="157" y="280" width="86" height="64" rx="12" fill="#F2B34C" stroke="#3A2A1E" stroke-width="8"/>
    <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M174 140 H226 M174 158 H208"/>
      <path d="M174 220 H226 M174 238 H214"/>
    </g>
    <path d="M174 300 H226 M174 318 H208" stroke="#3A2A1E" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.72"/>
    <path d="M200 344 V368" stroke="#3A2A1E" stroke-width="5" stroke-linecap="round"/>
    <path d="M192 368 L208 368 L200 392 Z" fill="#D8465F" stroke="#3A2A1E" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="172" cy="132" r="8" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- 右联串 -->
  <g stroke-linejoin="round">
    <circle cx="600" cy="92" r="13" fill="#E9C87E" stroke="#3A2A1E" stroke-width="6"/>
    <path d="M600 105 V124" stroke="#3A2A1E" stroke-width="6" stroke-linecap="round"/>
    <rect x="557" y="120" width="86" height="64" rx="12" fill="#F6F3E8" stroke="#3A2A1E" stroke-width="8"/>
    <rect x="557" y="200" width="86" height="64" rx="12" fill="#E88B5A" stroke="#3A2A1E" stroke-width="8"/>
    <rect x="557" y="280" width="86" height="64" rx="12" fill="#3FAE7A" stroke="#3A2A1E" stroke-width="8"/>
    <g stroke-width="6" stroke-linecap="round" fill="none">
