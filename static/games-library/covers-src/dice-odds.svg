    <rect x="110" y="150" width="180" height="180" rx="26" fill="#F2E4BC" stroke="#3A2A1E" stroke-width="9"/>
    <rect x="110" y="150" width="180" height="180" rx="26" fill="url(#gloss)"/>
    <circle cx="150" cy="190" r="10" fill="#3A2A1E"/>
    <circle cx="250" cy="290" r="10" fill="#3A2A1E"/>
    <circle cx="168" cy="232" r="11" fill="#1F1A14"/>
    <circle cx="232" cy="232" r="11" fill="#1F1A14"/>
    <circle cx="171" cy="229" r="3.4" fill="#FFFFFF"/>
    <circle cx="235" cy="229" r="3.4" fill="#FFFFFF"/>
    <path d="M182 272 Q200 286 218 271" stroke="#1F1A14" stroke-width="7" fill="none" stroke-linecap="round"/>
