    <rect x="698" y="228" width="46" height="128" rx="8" fill="#C9CDD2"/>
  </g>
  <g fill="#3A2A1E">
    <circle cx="493" cy="278" r="6"/><circle cx="569" cy="238" r="6"/><circle cx="721" cy="218" r="6"/>
  </g>
  <circle cx="645" cy="186" r="8" fill="#FFF3DC" stroke="#3A2A1E" stroke-width="4"/>
  <!-- 选中箭头 -->
  <path d="M645 128 V168 M645 168 L634 156 M645 168 L656 156" stroke="#3A2A1E" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 大骰子（主视觉，签名表情） -->
