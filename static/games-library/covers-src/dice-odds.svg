    <rect x="450" y="356" width="330" height="10" rx="4" fill="#3A2A1E"/>
    <rect x="470" y="288" width="46" height="68" rx="8" fill="#C9CDD2"/>
    <rect x="546" y="248" width="46" height="108" rx="8" fill="#C9CDD2"/>
