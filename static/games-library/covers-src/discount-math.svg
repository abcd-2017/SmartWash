  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect y="392" width="800" height="58" fill="#9C6018" opacity="0.6"/>
  <rect y="392" width="800" height="6" fill="#824E12" opacity="0.6"/>
  <g stroke="#FFF3DC" stroke-linecap="round" fill="none" opacity="0.55">
