<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EDE0"/>
      <stop offset="0.55" stop-color="#E3D6C0"/>
      <stop offset="1" stop-color="#CFBFA2"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A4A2E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#B8A480" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#A4906C" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFF8EA" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 96 h12 M102 90 v12" stroke-width="3.2"/>
    <path d="M694 84 h12 M700 78 v12" stroke-width="3.4"/>
    <path d="M118 270 h9 M122.5 265.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M690 270 h9 M694.5 265.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFF8EA" opacity="0.5">
    <circle cx="170" cy="160" r="4"/><circle cx="712" cy="150" r="3.4"/><circle cx="70" cy="220" r="3"/><circle cx="740" cy="210" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="420" cy="404" rx="230" ry="20" fill="#7A643E" opacity="0.32"/>

  <!-- 餐台（木台面） -->
  <g>
    <rect x="200" y="336" width="440" height="46" rx="12" fill="#8A6A44" stroke="#3A2A1E" stroke-width="9"/>
    <path d="M222 352 H618" stroke="#5E4A30" stroke-width="6" stroke-linecap="round"/>
    <rect x="238" y="382" width="34" height="26" fill="#5E4A30" stroke="#3A2A1E" stroke-width="7"/>
    <rect x="568" y="382" width="34" height="26" fill="#5E4A30" stroke="#3A2A1E" stroke-width="7"/>
  </g>

  <!-- 盘塔（主视觉：微歪叠盘） -->
  <g>
    <!-- 第 1 层（底） -->
    <ellipse cx="414" cy="336" rx="132" ry="30" fill="#E6DBC6" stroke="#3A2A1E" stroke-width="8"/>
    <ellipse cx="414" cy="330" rx="100" ry="20" fill="#F4EDE0"/>
    <!-- 第 2 层 -->
    <ellipse cx="404" cy="296" rx="122" ry="27" fill="#DFE7DC" stroke="#3A2A1E" stroke-width="8"/>
    <ellipse cx="404" cy="290" rx="92" ry="18" fill="#F4F8F2"/>
    <!-- 第 3 层 -->
    <ellipse cx="420" cy="256" rx="112" ry="25" fill="#E6DBC6" stroke="#3A2A1E" stroke-width="8"/>
    <ellipse cx="420" cy="250" rx="84" ry="16" fill="#F7F0E0"/>
    <!-- 第 4 层 -->
    <ellipse cx="402" cy="216" rx="102" ry="23" fill="#DFE7DC" stroke="#3A2A1E" stroke-width="8"/>
    <ellipse cx="402" cy="210" rx="76" ry="15" fill="#F4F8F2"/>
    <!-- 第 5 层 -->
    <ellipse cx="418" cy="176" rx="92" ry="21" fill="#E6DBC6" stroke="#3A2A1E" stroke-width="8"/>
    <ellipse cx="418" cy="170" rx="68" ry="13" fill="#F7F0E0"/>
    <!-- 顶层（带表情） -->
    <ellipse cx="406" cy="136" rx="84" ry="20" fill="#DFE7DC" stroke="#3A2A1E" stroke-width="8"/>
    <ellipse cx="406" cy="131" rx="62" ry="13" fill="#F4F8F2"/>
    <ellipse cx="406" cy="136" rx="84" ry="20" fill="url(#gloss)"/>
    <circle cx="384" cy="122" r="6.5" fill="#1F1A14"/>
    <circle cx="422" cy="122" r="6.5" fill="#1F1A14"/>
    <path d="M392 138 Q403 146 414 137" stroke="#1F1A14" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 削下的盘沿碎片 -->
  <g stroke="#3A2A1E" stroke-width="6" stroke-linejoin="round">
    <path d="M256 372 Q276 350 306 356 Q292 372 284 388 Q268 384 256 372 Z" fill="#F4EDE0"/>
    <path d="M560 380 Q576 364 598 368 Q588 380 584 392 Q570 388 560 380 Z" fill="#DFE7DC"/>
  </g>

  <!-- 传送带来盘速度线 -->
  <g stroke="#3A2A1E" stroke-width="6" stroke-linecap="round" opacity="0.4" fill="none">
    <path d="M118 176 H190"/><path d="M138 204 H214"/><path d="M108 232 H180"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
