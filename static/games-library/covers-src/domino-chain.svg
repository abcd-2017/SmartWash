<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAE7DE"/>
      <stop offset="0.55" stop-color="#DAD4C4"/>
      <stop offset="1" stop-color="#C4BBA4"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A4028" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="396" width="800" height="54" fill="#A89E82" opacity="0.55"/>
  <rect y="396" width="800" height="6" fill="#948A6E" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFF8EA" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 96 h12 M102 90 v12" stroke-width="3.2"/>
    <path d="M694 84 h12 M700 78 v12" stroke-width="3.4"/>
    <path d="M108 260 h9 M112.5 255.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M692 260 h9 M696.5 255.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFF8EA" opacity="0.5">
    <circle cx="170" cy="150" r="4"/><circle cx="712" cy="150" r="3.4"/><circle cx="70" cy="210" r="3"/><circle cx="742" cy="220" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="402" rx="255" ry="18" fill="#6E6244" opacity="0.32"/>

  <!-- 已倒的骨牌（左侧 3 张躺平） -->
  <g stroke="#3A2A1E" stroke-linejoin="round">
    <rect x="108" y="322" width="150" height="52" rx="10" fill="#F6F1E4" transform="rotate(-2 183 348)"/>
    <rect x="216" y="330" width="146" height="50" rx="10" fill="#C9BC9C" transform="rotate(-3 289 355)"/>
    <rect x="318" y="336" width="140" height="48" rx="10" fill="#F6F1E4" transform="rotate(-4 388 360)"/>
  </g>
  <g fill="#4E4B42">
    <circle cx="150" cy="346" r="8"/><circle cx="196" cy="346" r="8"/>
    <circle cx="266" cy="352" r="7"/><circle cx="292" cy="352" r="7"/><circle cx="316" cy="352" r="7"/>
    <circle cx="372" cy="358" r="7"/><circle cx="408" cy="358" r="7"/>
  </g>

  <!-- 正在倒的骨牌（中间，瞬间倾斜，带表情） -->
  <g transform="rotate(-38 470 268)">
    <rect x="434" y="186" width="72" height="164" rx="12" fill="#F6F1E4" stroke="#3A2A1E" stroke-width="9"/>
    <path d="M434 268 H506" stroke="#3A2A1E" stroke-width="5" opacity="0.7"/>
    <circle cx="470" cy="232" r="9" fill="#B8452E"/>
    <circle cx="470" cy="308" r="9" fill="#4E4B42"/>
    <circle cx="470" cy="186" r="72" fill="url(#gloss)" opacity="0.3"/>
    <circle cx="456" cy="216" r="6.5" fill="#1F1A14"/>
    <circle cx="484" cy="216" r="6.5" fill="#1F1A14"/>
    <path d="M460 234 Q470 241 480 232" stroke="#1F1A14" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 倾倒冲击弧线 -->
  <g stroke="#3A2A1E" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M408 236 L392 218"/>
    <path d="M412 268 L394 262"/>
    <path d="M422 296 L404 300"/>
  </g>

  <!-- 立着的骨牌（右侧 3 张） -->
  <g stroke="#3A2A1E" stroke-linejoin="round">
    <rect x="546" y="216" width="70" height="158" rx="12" fill="#F6F1E4" stroke-width="9"/>
    <rect x="638" y="228" width="66" height="148" rx="12" fill="#C9BC9C" stroke-width="9"/>
    <rect x="724" y="240" width="58" height="138" rx="12" fill="#F6F1E4" stroke-width="8"/>
  </g>
  <g fill="#4E4B42">
    <circle cx="581" cy="258" r="8"/><circle cx="581" cy="300" r="8"/>
    <circle cx="671" cy="266" r="7"/><circle cx="671" cy="306" r="7"/><circle cx="671" cy="340" r="7"/>
    <circle cx="753" cy="278" r="6"/><circle cx="753" cy="318" r="6"/>
  </g>
  <circle cx="566" cy="240" r="14" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="658" cy="250" r="11" fill="#FFFFFF" opacity="0.4"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
