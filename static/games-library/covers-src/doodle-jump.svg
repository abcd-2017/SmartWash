<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFF2E8"/>
      <stop offset="0.55" stop-color="#C2E6D2"/>
      <stop offset="1" stop-color="#A0D8BA"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E4A34" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#88C4A4" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#74B090" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 96 h12 M102 90 v12" stroke-width="3.2"/>
    <path d="M694 84 h12 M700 78 v12" stroke-width="3.4"/>
    <path d="M110 250 h9 M114.5 245.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M700 260 h9 M704.5 255.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="170" cy="150" r="4"/><circle cx="712" cy="150" r="3.4"/><circle cx="70" cy="210" r="3"/><circle cx="742" cy="220" r="2.6"/>
  </g>

  <!-- 云朵 -->
  <g fill="#FFFFFF" opacity="0.7">
    <path d="M120 130 Q140 108 168 116 Q182 96 208 104 Q232 108 230 128 Q246 136 232 148 L128 148 Q108 142 120 130 Z"/>
    <path d="M600 200 Q620 180 648 188 Q662 170 686 178 Q708 182 706 200 Q720 208 708 218 L610 218 Q592 212 600 200 Z" opacity="0.8"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="405" cy="404" rx="180" ry="16" fill="#4E8A68" opacity="0.3"/>

  <!-- 易碎平台（棕，裂纹） -->
  <g>
    <rect x="128" y="288" width="130" height="26" rx="13" fill="#C08A4A" stroke="#1E2620" stroke-width="7"/>
    <path d="M170 288 L178 301 L168 314" stroke="#1E2620" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M212 288 L220 301 L212 312" stroke="#1E2620" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 高处普通平台 -->
  <g>
    <rect x="540" y="216" width="140" height="26" rx="13" fill="#3FB57F" stroke="#1E2620" stroke-width="7"/>
    <path d="M560 229 H660" stroke="#17734A" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <rect x="576" y="150" width="120" height="24" rx="12" fill="#2D9B6A" stroke="#1E2620" stroke-width="7"/>
    <circle cx="600" cy="162" r="5" fill="#17734A"/>
    <circle cx="640" cy="162" r="5" fill="#17734A"/>
  </g>

  <!-- 小绿角色（主视觉，起跳瞬间） -->
  <g>
    <!-- 上升速度线 -->
    <g stroke="#1E2620" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.4">
      <path d="M320 300 L306 326"/>
      <path d="M360 316 L352 344"/>
      <path d="M404 314 L410 342"/>
    </g>
    <!-- 弹簧板 -->
    <rect x="300" y="330" width="150" height="28" rx="14" fill="#2D9B6A" stroke="#1E2620" stroke-width="8"/>
    <path d="M336 358 Q330 376 340 390 Q348 400 342 408 M376 358 Q370 376 380 390 Q388 400 382 408 M414 358 Q408 376 418 390 Q426 400 420 408"
          stroke="#DB7186" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- 腿（蹬直） -->
    <path d="M356 282 L340 318 M392 282 L404 318" stroke="#1E2620" stroke-width="9" stroke-linecap="round"/>
    <path d="M356 282 L340 318 M392 282 L404 318" stroke="#3FB57F" stroke-width="5" stroke-linecap="round"/>
    <!-- 身体 -->
    <path d="M310 172 Q310 120 374 120 Q438 120 438 176 Q438 236 404 252 Q374 264 344 250 Q310 232 310 172 Z"
          fill="#3FB57F" stroke="#1E2620" stroke-width="9" stroke-linejoin="round"/>
    <circle cx="374" cy="186" r="64" fill="url(#gloss)"/>
    <path d="M328 148 Q340 134 362 130" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
    <!-- 手 -->
    <path d="M312 190 Q292 200 288 216 M438 188 Q458 198 462 214" stroke="#1E2620" stroke-width="9" stroke-linecap="round"/>
    <circle cx="286" cy="220" r="8" fill="#3FB57F" stroke="#1E2620" stroke-width="6"/>
    <circle cx="464" cy="218" r="8" fill="#3FB57F" stroke="#1E2620" stroke-width="6"/>
    <!-- 表情 -->
    <circle cx="350" cy="178" r="10" fill="#1F1A14"/>
    <circle cx="404" cy="178" r="10" fill="#1F1A14"/>
    <circle cx="353" cy="174" r="3.5" fill="#FFFFFF"/>
    <circle cx="407" cy="174" r="3.5" fill="#FFFFFF"/>
    <path d="M362 206 Q377 220 392 204" stroke="#1F1A14" stroke-width="6.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 顶部黑刺板（远离上方，警示小元素） -->
  <g>
    <rect x="300" y="40" width="150" height="20" rx="10" fill="#33363B" stroke="#1E2620" stroke-width="6"/>
    <path d="M314 60 L322 44 M340 60 L348 44 M366 60 L374 44 M392 60 L400 44 M418 60 L426 44" stroke="#33363B" stroke-width="7" stroke-linecap="round"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
