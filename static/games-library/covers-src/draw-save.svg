<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDE9F9"/>
      <stop offset="0.55" stop-color="#8CC8EE"/>
      <stop offset="1" stop-color="#4A9FD4"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.6" stop-color="#1E2620" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E2620" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect y="392" width="800" height="58" fill="#2E7CB0" opacity="0.55"/>
  <rect y="392" width="800" height="6" fill="#23648F" opacity="0.5"/>

  <g fill="#FFFFFF" opacity="0.5">
    <path d="M96 88 h11 M101.5 82.5 v11" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M704 74 h12 M710 68 v12" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M676 250 h9 M680.5 245.5 v9" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
  <g fill="#EAF7FF" opacity="0.55">
    <circle cx="170" cy="140" r="4"/><circle cx="632" cy="300" r="3.4"/><circle cx="86" cy="226" r="3"/><circle cx="748" cy="150" r="2.6"/>
  </g>

  <ellipse cx="400" cy="404" rx="236" ry="25" fill="#1E5C86" opacity="0.35"/>

  <!-- 两侧悬崖 -->
  <g stroke-linejoin="round">
    <rect x="140" y="235" width="170" height="215" rx="16" fill="#A7ADB2" stroke="#3A2A1E" stroke-width="9"/>
    <rect x="140" y="235" width="170" height="28" rx="14" fill="#7CB85C" stroke="#3A2A1E" stroke-width="8"/>
    <rect x="490" y="235" width="170" height="215" rx="16" fill="#A7ADB2" stroke="#3A2A1E" stroke-width="9"/>
    <rect x="490" y="235" width="170" height="28" rx="14" fill="#7CB85C" stroke="#3A2A1E" stroke-width="8"/>
    <ellipse cx="176" cy="252" rx="26" ry="9" fill="#FFFFFF" opacity="0.35"/>
    <ellipse cx="526" cy="252" rx="26" ry="9" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- 谷底水面 -->
  <g>
    <rect x="310" y="345" width="180" height="105" fill="#2E7CB0" opacity="0.9"/>
    <path d="M318 372 q18 -10 36 0 t36 0 t36 0 t36 0" stroke="#BFE3F5" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M318 404 q18 -10 36 0 t36 0 t36 0 t36 0" stroke="#BFE3F5" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- 画出的粗线桥 -->
  <path d="M310 250 Q400 320 490 250" stroke="#3A2A1E" stroke-width="27" stroke-linecap="round" fill="none"/>
  <path d="M310 250 Q400 320 490 250" stroke="#2D9B6A" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- 速度线 -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.75">
    <path d="M286 214 H330"/><path d="M278 238 H318"/><path d="M292 262 H326"/>
  </g>

  <!-- 线上跑的小人 -->
  <g stroke-linejoin="round">
    <circle cx="400" cy="233" r="21" fill="#F2C79B" stroke="#3A2A1E" stroke-width="7"/>
    <ellipse cx="389" cy="221" rx="9" ry="6" fill="#FFFFFF" opacity="0.45" transform="rotate(-20 389 221)"/>
    <path d="M382 224 Q400 208 418 224" stroke="#3A2A1E" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="392" cy="231" r="4" fill="#1F1A14"/><circle cx="406" cy="231" r="4" fill="#1F1A14"/>
    <path d="M392 241 Q399 247 406 241" stroke="#1F1A14" stroke-width="4.4" stroke-linecap="round" fill="none"/>
    <rect x="386" y="254" width="28" height="34" rx="11" fill="#E2A23B" stroke="#3A2A1E" stroke-width="7"/>
    <path d="M392 288 L382 306 M406 288 L416 306" stroke="#3A2A1E" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M392 262 L372 276 M406 262 L426 254" stroke="#3A2A1E" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 蓝球 -->
  <g stroke-linejoin="round">
    <circle cx="350" cy="270" r="17" fill="#4A9FD4" stroke="#3A2A1E" stroke-width="7"/>
    <circle cx="344" cy="264" r="5" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
