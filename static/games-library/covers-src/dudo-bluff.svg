      <circle cx="-15" cy="-15" r="7" fill="#2E2A26"/>
      <circle cx="15" cy="-15" r="7" fill="#2E2A26"/>
      <circle cx="-15" cy="15" r="7" fill="#2E2A26"/>
      <circle cx="15" cy="15" r="7" fill="#2E2A26"/>
      <circle cx="-11" cy="0" r="6" fill="#1F1A14"/>
      <circle cx="11" cy="0" r="6" fill="#1F1A14"/>
      <path d="M-7 12 Q0 18 7 10" stroke="#1F1A14" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <circle cx="-18" cy="-20" r="6.5" fill="#FFFFFF" opacity="0.5"/>
    </g>
    <g transform="translate(468 326) rotate(10)">
      <rect x="-33" y="-33" width="66" height="66" rx="14" fill="#FDFBF4" stroke="#1E2620" stroke-width="7"/>
      <g fill="#C8465C">
