      <g fill="#2E2A26">
        <circle cx="-12" cy="-14" r="6"/><circle cx="12" cy="-14" r="6"/>
        <circle cx="-12" cy="0" r="6"/><circle cx="12" cy="0" r="6"/>
        <circle cx="-12" cy="14" r="6"/><circle cx="12" cy="14" r="6"/>
      </g>
    </g>
    <circle cx="660" cy="122" r="11" fill="#2E2A26"/>
    <circle cx="660" cy="156" r="11" fill="#2E2A26"/>
