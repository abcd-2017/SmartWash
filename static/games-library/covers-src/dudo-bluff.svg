    <ellipse cx="0" cy="12" rx="78" ry="22" fill="#2F6E8C" stroke="#1E2620" stroke-width="8"/>
    <path d="M-56 -84 Q-52 -100 -36 -102" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.45"/>
