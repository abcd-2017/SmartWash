      <circle cx="-8" cy="-8" r="5.5" fill="#2E2A26"/><circle cx="8" cy="8" r="5.5" fill="#2E2A26"/>
      <circle cx="-12" cy="-12" r="5" fill="#FFFFFF" opacity="0.45"/>
