<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4EA386"/>
      <stop offset="0.55" stop-color="#358C6E"/>
      <stop offset="1" stop-color="#237458"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#123D2C" stop-opacity="0.32"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#1C6448" opacity="0.6"/>
  <rect y="394" width="800" height="6" fill="#16543C" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M84 66 h11 M89.5 60.5 v11" stroke-width="3.2"/>
    <path d="M120 200 h9 M124.5 195.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M52 260 h9 M56.5 255.5 v9" stroke-width="2.6" opacity="0.65"/>
    <path d="M752 250 h9 M756.5 245.5 v9" stroke-width="2.6" opacity="0.7"/>
  </g>
  <g fill="#EAF7EE" opacity="0.5">
    <circle cx="160" cy="110" r="4"/><circle cx="250" cy="80" r="3.4"/><circle cx="48" cy="160" r="3"/><circle cx="748" cy="310" r="2.6"/>
  </g>

  <!-- 木桌 -->
  <ellipse cx="400" cy="368" rx="322" ry="68" fill="#B98A54" stroke="#1E2620" stroke-width="8"/>
  <ellipse cx="400" cy="368" rx="322" ry="68" fill="url(#gloss)"/>
  <ellipse cx="400" cy="356" rx="286" ry="50" fill="#C99B62" opacity="0.55"/>

  <!-- 叫数气泡（2 个 6 点） -->
  <g>
    <circle cx="566" cy="196" r="14" fill="#FDFBF4" stroke="#1E2620" stroke-width="6"/>
    <circle cx="540" cy="212" r="9" fill="#FDFBF4" stroke="#1E2620" stroke-width="5"/>
    <ellipse cx="628" cy="142" rx="92" ry="58" fill="#FDFBF4" stroke="#1E2620" stroke-width="7"/>
