    <circle cx="510" cy="185" r="80" fill="#C4574A"/>
    <circle cx="290" cy="325" r="80" fill="#B8912E"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.25">
    <circle cx="290" cy="185" r="56"/>
    <circle cx="510" cy="185" r="56"/>
    <circle cx="290" cy="325" r="56"/>
  </g>
  <circle cx="262" cy="152" r="11" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="482" cy="152" r="11" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="262" cy="292" r="11" fill="#FFFFFF" opacity="0.4"/>

