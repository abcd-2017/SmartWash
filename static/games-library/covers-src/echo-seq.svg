  <circle cx="510" cy="325" r="58" fill="#5CB892"/>
  <circle cx="510" cy="325" r="80" fill="url(#gloss)"/>
  <circle cx="490" cy="312" r="8.5" fill="#0B3625"/>
  <circle cx="530" cy="312" r="8.5" fill="#0B3625"/>
