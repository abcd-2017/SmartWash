<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF4EC"/>
      <stop offset="0.55" stop-color="#D4E8D8"/>
      <stop offset="1" stop-color="#B8DAC2"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A5E48" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#9CC4A8" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#88B094" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 96 h12 M102 90 v12" stroke-width="3.2"/>
    <path d="M694 84 h12 M700 78 v12" stroke-width="3.4"/>
    <path d="M110 250 h9 M114.5 245.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M700 260 h9 M704.5 255.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="170" cy="150" r="4"/><circle cx="712" cy="150" r="3.4"/><circle cx="70" cy="210" r="3"/><circle cx="742" cy="220" r="2.6"/>
  </g>

  <!-- 抛蛋的楼（右上远景） -->
  <g>
    <rect x="620" y="60" width="150" height="180" rx="10" fill="#C9CFC7" stroke="#3A423C" stroke-width="7"/>
    <rect x="640" y="82" width="34" height="30" rx="5" fill="#4A544C" opacity="0.7"/>
    <rect x="690" y="82" width="34" height="30" rx="5" fill="#4A544C" opacity="0.7"/>
    <rect x="640" y="128" width="34" height="30" rx="5" fill="#4A544C" opacity="0.55"/>
    <rect x="690" y="128" width="34" height="30" rx="5" fill="#4A544C" opacity="0.55"/>
    <rect x="640" y="174" width="34" height="30" rx="5" fill="#4A544C" opacity="0.4"/>
    <rect x="690" y="174" width="34" height="30" rx="5" fill="#4A544C" opacity="0.4"/>
    <circle cx="628" cy="72" r="9" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- 抛物线轨迹 -->
  <path d="M600 130 Q470 60 380 190" stroke="#3A423C" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 14" fill="none" opacity="0.5"/>
  <path d="M600 130 Q470 60 380 190" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 14" fill="none" opacity="0.7"/>

  <!-- 地面阴影 -->
  <ellipse cx="360" cy="404" rx="190" ry="16" fill="#5E8E6E" opacity="0.3"/>

  <!-- 下落的蛋（主视觉，带表情） -->
  <g transform="rotate(12 400 240)">
    <path d="M400 158 Q466 214 466 288 Q466 348 400 348 Q334 348 334 288 Q334 214 400 158 Z"
          fill="#FFF7E8" stroke="#3A423C" stroke-width="9" stroke-linejoin="round"/>
    <path d="M364 196 Q376 182 396 176" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.7"/>
    <circle cx="378" cy="268" r="10" fill="#1F1A14"/>
    <circle cx="424" cy="268" r="10" fill="#1F1A14"/>
    <circle cx="381" cy="264" r="3.5" fill="#FFFFFF"/>
    <circle cx="427" cy="264" r="3.5" fill="#FFFFFF"/>
    <path d="M386 296 Q401 310 416 294" stroke="#1F1A14" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <circle cx="400" cy="248" r="66" fill="url(#gloss)" opacity="0.4"/>
  </g>
  <!-- 下落速度线 -->
  <g stroke="#3A423C" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.4">
    <path d="M466 216 L494 200"/>
    <path d="M482 252 L510 246"/>
    <path d="M486 290 L514 292"/>
  </g>

  <!-- 竹篮（左下，仰接） -->
  <g>
    <path d="M216 316 L250 390 Q254 398 266 398 L416 398 Q428 398 432 390 L466 316"
          fill="#C98A4B" stroke="#3A423C" stroke-width="9" stroke-linejoin="round"/>
    <ellipse cx="341" cy="316" rx="125" ry="26" fill="#A86B32" stroke="#3A423C" stroke-width="8"/>
    <ellipse cx="341" cy="316" rx="102" ry="18" fill="#7A4E20"/>
    <!-- 编织纹理 -->
    <path d="M250 336 Q296 352 341 352 Q386 352 432 336" stroke="#7A4E20" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M262 362 Q300 374 341 374 Q382 374 420 362" stroke="#7A4E20" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M280 346 L300 320 M330 352 L341 322 M390 348 L378 322" stroke="#7A4E20" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <!-- 篮中已接的蛋露头 -->
    <path d="M300 310 Q316 288 340 288 Q364 288 380 310 Q360 322 340 322 Q320 322 300 310 Z"
          fill="#FFF7E8" stroke="#3A423C" stroke-width="7"/>
    <circle cx="328" cy="304" r="4.5" fill="#1F1A14"/>
    <circle cx="356" cy="304" r="4.5" fill="#1F1A14"/>
    <path d="M334 312 Q342 317 350 311" stroke="#1F1A14" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
