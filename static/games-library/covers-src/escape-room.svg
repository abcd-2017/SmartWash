  <ellipse cx="350" cy="398" rx="90" ry="12" fill="#E2A44E" opacity="0.3"/>
  <circle cx="350" cy="325" r="26" fill="#8A5E32" stroke="#1E2620" stroke-width="6"/>
  <circle cx="350" cy="318" r="10" fill="#1E2620"/>
  <path d="M350 326 L342 348 L358 348 Z" fill="#1E2620"/>

  <!-- 大钥匙（主视觉，带签名表情） -->
  <circle cx="575" cy="250" r="50" fill="#E2A44E" stroke="#1E2620" stroke-width="9"/>
  <circle cx="575" cy="250" r="16" fill="#21402C" stroke="#1E2620" stroke-width="6"/>
  <rect x="618" y="238" width="86" height="24" rx="10" fill="#E2A44E" stroke="#1E2620" stroke-width="8"/>
  <rect x="662" y="262" width="16" height="22" rx="4" fill="#E2A44E" stroke="#1E2620" stroke-width="6"/>
  <rect x="684" y="262" width="14" height="16" rx="4" fill="#E2A44E" stroke="#1E2620" stroke-width="6"/>
  <circle cx="556" cy="224" r="11" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="559" cy="240" r="8" fill="#1F1A14"/>
  <circle cx="591" cy="240" r="8" fill="#1F1A14"/>
  <path d="M552 264 Q575 278 598 262" stroke="#1F1A14" stroke-width="6" fill="none" stroke-linecap="round"/>

  <rect width="800" height="450" fill="url(#vign)"/>
