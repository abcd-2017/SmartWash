<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A6249"/>
      <stop offset="0.55" stop-color="#2C4E38"/>
      <stop offset="1" stop-color="#21402C"/>
    </linearGradient>
    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#E2A44E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E2A44E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E2418" stop-opacity="0.32"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="398" width="800" height="52" fill="#1B3624" opacity="0.6"/>
  <rect y="398" width="800" height="6" fill="#14291C" opacity="0.55"/>
  <!-- 星尘点缀（萤火感） -->
  <g stroke="#FFE9B8" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M104 110 h11 M109.5 104.5 v11" stroke-width="3.2"/>
    <path d="M690 92 h12 M696 86 v12" stroke-width="3.4"/>
    <path d="M712 260 h9 M716.5 255.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M86 260 h9 M90.5 255.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFE9B8" opacity="0.5">
    <circle cx="170" cy="170" r="4"/><circle cx="700" cy="170" r="3.4"/><circle cx="72" cy="220" r="3"/><circle cx="742" cy="210" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="440" cy="420" rx="265" ry="20" fill="#0F2418" opacity="0.4"/>

  <!-- 机关齿轮 -->
  <g stroke="#1E2620" stroke-width="11" stroke-linecap="round">
    <path d="M184 368 L200 368"/><path d="M174 392 L185 403"/><path d="M150 402 L150 418"/>
    <path d="M126 392 L115 403"/><path d="M116 368 L100 368"/><path d="M126 344 L115 333"/>
    <path d="M150 334 L150 318"/><path d="M174 344 L185 333"/>
  </g>
  <circle cx="150" cy="368" r="34" fill="#8FA898" stroke="#1E2620" stroke-width="8"/>
  <circle cx="150" cy="368" r="12" fill="#21402C" stroke="#1E2620" stroke-width="5"/>

  <!-- 密室门 -->
  <rect x="215" y="95" width="270" height="320" rx="12" fill="#7E5A34" stroke="#1E2620" stroke-width="9"/>
  <rect x="235" y="115" width="230" height="280" rx="8" fill="#A8763E" stroke="#1E2620" stroke-width="8"/>
  <rect x="255" y="272" width="190" height="98" rx="10" fill="none" stroke="#8A5E32" stroke-width="6"/>
  <!-- 圆窗与暖光 -->
  <circle cx="350" cy="190" r="48" fill="#E2A44E" stroke="#1E2620" stroke-width="8"/>
  <circle cx="350" cy="190" r="30" fill="#FFE2A0" opacity="0.5"/>
  <path d="M302 190 H398 M350 142 V238" stroke="#1E2620" stroke-width="6" fill="none"/>
