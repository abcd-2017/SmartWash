    <g fill="#FDFBF4" stroke="#1E2620" stroke-width="6" stroke-linejoin="round">
      <path d="M382 330 Q330 320 296 342 Q336 358 384 348 Z"/>
      <path d="M390 296 Q336 282 302 300 Q344 320 392 312 Z"/>
      <path d="M398 262 Q348 244 316 258 Q356 282 402 274 Z"/>
      <path d="M406 228 Q362 206 332 218 Q372 242 412 238 Z"/>
      <path d="M414 194 Q376 168 348 178 Q388 202 420 204 Z"/>
      <path d="M422 160 Q390 132 364 140 Q404 162 430 170 Z"/>
      <path d="M430 128 Q404 98 380 104 Q418 124 440 136 Z"/>
      <path d="M438 98 Q420 68 398 72 Q430 88 446 102 Z"/>
      <path d="M392 342 Q448 336 490 354 Q452 372 400 360 Z"/>
      <path d="M400 308 Q456 300 496 314 Q458 334 404 322 Z"/>
      <path d="M408 274 Q466 266 502 276 Q464 298 412 288 Z"/>
      <path d="M416 240 Q474 232 508 238 Q470 262 420 252 Z"/>
      <path d="M424 206 Q480 196 512 200 Q476 224 428 218 Z"/>
      <path d="M432 172 Q486 160 514 162 Q480 186 436 182 Z"/>
      <path d="M440 138 Q490 126 514 126 Q484 148 444 148 Z"/>
      <path d="M446 106 Q492 94 512 92 Q486 112 450 116 Z"/>
    </g>
    <!-- 羽轴 -->
    <path d="M400 380 Q420 300 432 220 Q440 160 448 92" stroke="#1E2620" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M400 380 Q420 300 432 220 Q440 160 448 92" stroke="#FDFBF4" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- 羽根表情 -->
    <circle cx="388" cy="352" r="26" fill="#FDFBF4" stroke="#1E2620" stroke-width="7"/>
    <circle cx="381" cy="346" r="5" fill="#1F1A14"/>
    <circle cx="399" cy="346" r="5" fill="#1F1A14"/>
    <path d="M384 360 Q390 365 396 359" stroke="#1F1A14" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="378" cy="338" r="7" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- 露珠（蓝） -->
  <g>
    <path d="M560 180 Q572 196 560 210 Q548 196 560 180 Z" fill="#6BB4DE" stroke="#1E2620" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="556" cy="192" r="4" fill="#FFFFFF" opacity="0.6"/>
