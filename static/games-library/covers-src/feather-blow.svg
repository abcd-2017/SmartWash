<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3EE"/>
      <stop offset="0.55" stop-color="#D4E8DC"/>
      <stop offset="1" stop-color="#B8D8C6"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E5E44" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#98C2AC" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#84AE98" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 96 h12 M102 90 v12" stroke-width="3.2"/>
    <path d="M694 84 h12 M700 78 v12" stroke-width="3.4"/>
    <path d="M118 210 h9 M122.5 205.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M700 220 h9 M704.5 215.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="160" cy="150" r="4"/><circle cx="712" cy="140" r="3.4"/><circle cx="70" cy="270" r="3"/><circle cx="740" cy="260" r="2.6"/>
  </g>

  <!-- 气流弧线（左下→右上） -->
  <g fill="none" stroke-linecap="round">
    <path d="M120 350 Q220 330 300 350 Q380 370 470 356" stroke="#FFFFFF" stroke-width="8" opacity="0.7"/>
    <path d="M150 306 Q240 288 320 306 Q396 324 478 312" stroke="#FFFFFF" stroke-width="7" opacity="0.6"/>
    <path d="M186 262 Q262 246 336 262 Q406 278 470 268" stroke="#FFFFFF" stroke-width="6" opacity="0.55"/>
    <path d="M470 356 L500 344 M470 356 L498 364" stroke="#FFFFFF" stroke-width="8" opacity="0.7"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="406" rx="170" ry="14" fill="#5E8E70" opacity="0.3"/>

  <!-- 枝叶风障（右下） -->
  <g>
    <path d="M640 412 Q660 340 704 300" stroke="#3A2A1E" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M640 412 Q660 340 704 300" stroke="#8A6B4A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M668 356 Q700 336 712 360 Q690 372 668 356 Z" fill="#5E8C4A" stroke="#1E2620" stroke-width="6" stroke-linejoin="round"/>
    <path d="M692 320 Q722 306 730 328 Q708 336 692 320 Z" fill="#5E8C4A" stroke="#1E2620" stroke-width="6" stroke-linejoin="round"/>
    <path d="M654 392 Q624 378 620 402 Q640 410 654 392 Z" fill="#5E8C4A" stroke="#1E2620" stroke-width="6" stroke-linejoin="round"/>
  </g>

