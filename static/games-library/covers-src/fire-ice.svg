    <path d="M244 130 Q236 142 240 152" stroke="#D96A5A" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 身体 -->
    <path d="M216 200 Q216 240 240 246 Q270 250 284 236 Q296 220 288 200 Z"
