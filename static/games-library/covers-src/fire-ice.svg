    <circle cx="248" cy="222" r="30" fill="url(#gloss)"/>
    <!-- 手脚 -->
    <path d="M218 214 L178 226 M290 212 L308 220" stroke="#1E2620" stroke-width="8" stroke-linecap="round"/>
    <circle cx="172" cy="228" r="8" fill="#D96A5A" stroke="#1E2620" stroke-width="5"/>
    <circle cx="312" cy="222" r="8" fill="#D96A5A" stroke="#1E2620" stroke-width="5"/>
    <path d="M230 248 L224 272 M262 250 L268 272" stroke="#1E2620" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="222" cy="276" rx="12" ry="6" fill="#B8452E" stroke="#1E2620" stroke-width="5"/>
    <ellipse cx="270" cy="276" rx="12" ry="6" fill="#B8452E" stroke="#1E2620" stroke-width="5"/>
    <!-- 表情 -->
    <circle cx="232" cy="170" r="7" fill="#1F1A14"/>
    <circle cx="262" cy="170" r="7" fill="#1F1A14"/>
    <circle cx="234" cy="167" r="2.5" fill="#FFFFFF"/>
    <circle cx="264" cy="167" r="2.5" fill="#FFFFFF"/>
    <path d="M236 184 Q246 192 256 183" stroke="#1F1A14" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 冰灵（右路上，带表情） -->
  <g>
    <!-- 冰晶头发 -->
    <path d="M536 108 Q520 120 524 136 Q508 144 510 162 Q514 190 540 194 L580 194 Q602 188 600 164 Q598 146 584 140 Q588 118 568 106 Q552 116 536 108 Z"
