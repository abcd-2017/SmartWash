<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EDEA"/>
      <stop offset="0.55" stop-color="#D4DCD6"/>
      <stop offset="1" stop-color="#BCC9C0"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2A3630" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#9AA89C" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#86948A" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 96 h12 M102 90 v12" stroke-width="3.2"/>
    <path d="M694 84 h12 M700 78 v12" stroke-width="3.4"/>
    <path d="M110 240 h9 M114.5 235.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M690 240 h9 M694.5 235.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="170" cy="150" r="4"/><circle cx="712" cy="150" r="3.4"/><circle cx="70" cy="200" r="3"/><circle cx="740" cy="210" r="2.6"/>
  </g>

  <!-- 石墙砖纹 -->
  <g stroke="#A9B4AC" stroke-width="3" opacity="0.4" fill="none">
    <path d="M0 130 H800 M0 220 H800"/>
    <path d="M140 0 V130 M420 0 V130 M680 0 V130 M60 130 V220 M300 130 V220 M540 130 V220 M760 130 V220 M180 220 V394 M460 220 V394 M700 220 V394"/>
  </g>

  <!-- 顶部同色双出口门（左红右蓝） -->
  <g>
    <rect x="330" y="52" width="140" height="96" rx="12" fill="#4A5049" stroke="#1E2620" stroke-width="8"/>
    <rect x="342" y="64" width="58" height="72" rx="8" fill="#D96A5A" stroke="#1E2620" stroke-width="6"/>
    <rect x="400" y="64" width="58" height="72" rx="8" fill="#6BB4DE" stroke="#1E2620" stroke-width="6"/>
    <circle cx="371" cy="100" r="9" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="429" cy="100" r="9" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Y 型岔路（石板路） -->
  <g fill="#D9DFDB" stroke="#1E2620" stroke-width="7" stroke-linejoin="round">
    <path d="M356 394 Q360 330 330 282 Q300 240 244 216 L228 246 Q286 268 306 300 Q326 336 316 394 Z"/>
    <path d="M444 394 Q440 330 470 282 Q500 240 556 216 L572 246 Q514 268 494 300 Q474 336 484 394 Z"/>
  </g>
  <g stroke="#A9B4AC" stroke-width="4" stroke-linecap="round" opacity="0.7" fill="none">
    <path d="M312 340 H368 M282 296 H338 M254 258 H306"/>
    <path d="M432 340 H488 M462 296 H518 M494 258 H546"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="240" cy="248" rx="80" ry="12" fill="#5E6A5C" opacity="0.3"/>
  <ellipse cx="560" cy="248" rx="80" ry="12" fill="#5E6A5C" opacity="0.3"/>

  <!-- 火灵（左路上，带表情） -->
  <g>
