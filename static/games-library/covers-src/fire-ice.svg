    <path d="M552 124 L556 146 M570 122 L574 142" stroke="#4A9FD4" stroke-width="5" stroke-linecap="round"/>
    <!-- 身体 -->
    <path d="M522 194 Q520 236 544 244 Q574 250 590 234 Q602 218 594 194 Z"
          fill="#4A9FD4" stroke="#1E2620" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="554" cy="218" r="30" fill="url(#gloss)"/>
    <!-- 手脚 -->
    <path d="M524 208 L504 218 M596 206 L634 216" stroke="#1E2620" stroke-width="8" stroke-linecap="round"/>
    <circle cx="500" cy="220" r="8" fill="#4A9FD4" stroke="#1E2620" stroke-width="5"/>
    <circle cx="638" cy="218" r="8" fill="#4A9FD4" stroke="#1E2620" stroke-width="5"/>
    <path d="M534 246 L528 270 M566 248 L572 270" stroke="#1E2620" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="526" cy="274" rx="12" ry="6" fill="#2E7EA8" stroke="#1E2620" stroke-width="5"/>
    <ellipse cx="574" cy="274" rx="12" ry="6" fill="#2E7EA8" stroke="#1E2620" stroke-width="5"/>
    <!-- 表情 -->
    <circle cx="538" cy="164" r="7" fill="#1F1A14"/>
    <circle cx="568" cy="164" r="7" fill="#1F1A14"/>
    <circle cx="540" cy="161" r="2.5" fill="#FFFFFF"/>
    <circle cx="570" cy="161" r="2.5" fill="#FFFFFF"/>
    <path d="M542 178 Q552 186 562 177" stroke="#1F1A14" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 压力板（路上） -->
  <rect x="296" y="322" width="88" height="18" rx="9" fill="#B9BFC4" stroke="#1E2620" stroke-width="6"/>
  <rect x="428" y="322" width="88" height="18" rx="9" fill="#B9BFC4" stroke="#1E2620" stroke-width="6"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
