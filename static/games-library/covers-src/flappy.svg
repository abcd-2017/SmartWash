  <ellipse cx="400" cy="408" rx="240" ry="18" fill="#1E4E78" opacity="0.3"/>

  <!-- 管道 -->
  <rect x="565" y="0" width="80" height="166" fill="#43A056" stroke="#1E2620" stroke-width="8"/>
  <rect x="548" y="156" width="114" height="32" rx="8" fill="#43A056" stroke="#1E2620" stroke-width="8"/>
  <rect x="548" y="268" width="114" height="32" rx="8" fill="#43A056" stroke="#1E2620" stroke-width="8"/>
  <rect x="565" y="300" width="80" height="150" fill="#43A056" stroke="#1E2620" stroke-width="8"/>
  <path d="M580 12 L580 148" stroke="#FFFFFF" stroke-width="8" opacity="0.35" stroke-linecap="round"/>
  <path d="M580 312 L580 438" stroke="#FFFFFF" stroke-width="8" opacity="0.35" stroke-linecap="round"/>

