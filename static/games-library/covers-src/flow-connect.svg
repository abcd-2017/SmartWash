  <!-- 主端点（家族表情） -->
  <circle cx="244" cy="110" r="24" fill="url(#gloss)"/>
  <circle cx="235" cy="103" r="5.5" fill="#FFFFFF"/>
  <circle cx="253" cy="103" r="5.5" fill="#FFFFFF"/>
  <path d="M236 120 Q244 128 252 120" stroke="#FFFFFF" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <rect width="800" height="450" fill="url(#vign)"/>
