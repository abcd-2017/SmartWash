<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E8E8A"/>
      <stop offset="0.55" stop-color="#2F7370"/>
      <stop offset="1" stop-color="#235A57"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#123A38" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#1C4A47" opacity="0.6"/>
  <rect y="394" width="800" height="6" fill="#173E3B" opacity="0.55"/>

  <!-- 星尘点缀 -->
  <g stroke="#DCF2F0" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M96 104 h10 M101 99 v10" stroke-width="3"/>
    <path d="M690 92 h12 M696 86 v12" stroke-width="3.4"/>
    <path d="M716 220 h9 M720.5 215.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M84 260 h9 M88.5 255.5 v9" stroke-width="2.6" opacity="0.6"/>
  </g>
  <g fill="#DCF2F0" opacity="0.5">
    <circle cx="170" cy="168" r="4"/><circle cx="648" cy="176" r="3.4"/>
    <circle cx="70" cy="216" r="3"/><circle cx="748" cy="186" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="402" rx="250" ry="24" fill="#163C39" opacity="0.38"/>

  <!-- 棋盘底点 -->
  <g fill="#FFFFFF" opacity="0.16">
    <circle cx="244" cy="110" r="10"/><circle cx="322" cy="110" r="10"/><circle cx="400" cy="110" r="10"/><circle cx="478" cy="110" r="10"/><circle cx="556" cy="110" r="10"/>
    <circle cx="244" cy="182" r="10"/><circle cx="322" cy="182" r="10"/><circle cx="400" cy="182" r="10"/><circle cx="478" cy="182" r="10"/><circle cx="556" cy="182" r="10"/>
    <circle cx="244" cy="254" r="10"/><circle cx="322" cy="254" r="10"/><circle cx="400" cy="254" r="10"/><circle cx="478" cy="254" r="10"/><circle cx="556" cy="254" r="10"/>
    <circle cx="244" cy="326" r="10"/><circle cx="322" cy="326" r="10"/><circle cx="400" cy="326" r="10"/><circle cx="478" cy="326" r="10"/><circle cx="556" cy="326" r="10"/>
    <circle cx="244" cy="398" r="10"/><circle cx="322" cy="398" r="10"/><circle cx="400" cy="398" r="10"/><circle cx="478" cy="398" r="10"/><circle cx="556" cy="398" r="10"/>
  </g>

  <!-- 连线（描边 + 彩色内芯） -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M244 110 L322 110 L322 182 L400 182" stroke="#1E2620" stroke-width="22"/>
    <path d="M244 110 L322 110 L322 182 L400 182" stroke="#E04848" stroke-width="14"/>

    <path d="M556 110 L478 182 L478 254" stroke="#1E2620" stroke-width="22"/>
    <path d="M556 110 L478 182 L478 254" stroke="#3E7BE8" stroke-width="14"/>

    <path d="M244 398 L400 398 L400 326" stroke="#1E2620" stroke-width="22"/>
    <path d="M244 398 L400 398 L400 326" stroke="#F2C230" stroke-width="14"/>

    <path d="M556 398 L556 254" stroke="#1E2620" stroke-width="22"/>
    <path d="M556 398 L556 254" stroke="#3FA34D" stroke-width="14"/>
  </g>

  <!-- 端点圆点 -->
  <g stroke="#1E2620" stroke-width="7">
    <circle cx="244" cy="110" r="24" fill="#E04848"/>
    <circle cx="400" cy="182" r="22" fill="#E04848"/>
    <circle cx="556" cy="110" r="22" fill="#3E7BE8"/>
    <circle cx="478" cy="254" r="22" fill="#3E7BE8"/>
    <circle cx="244" cy="398" r="22" fill="#F2C230"/>
    <circle cx="400" cy="326" r="22" fill="#F2C230"/>
    <circle cx="556" cy="398" r="22" fill="#3FA34D"/>
    <circle cx="556" cy="254" r="22" fill="#3FA34D"/>
