  <path d="M280 252 A150 150 0 0 1 580 252 Z" fill="#3E9E4E" stroke="#1E2620" stroke-width="9" stroke-linejoin="round"/>
  <path d="M294 252 A136 136 0 0 1 566 252 Z" fill="#F5EDDC"/>
  <path d="M310 252 A120 120 0 0 1 550 252 Z" fill="#E86070"/>
  <g fill="#1F1A14">
    <ellipse cx="348" cy="186" rx="7" ry="11" transform="rotate(22 348 186)"/>
    <ellipse cx="512" cy="182" rx="7" ry="11" transform="rotate(-16 512 182)"/>
    <ellipse cx="430" cy="152" rx="6.5" ry="10" transform="rotate(6 430 152)"/>
    <ellipse cx="362" cy="234" rx="6.5" ry="10" transform="rotate(-14 362 234)"/>
    <ellipse cx="500" cy="238" rx="6.5" ry="10" transform="rotate(12 500 238)"/>
  </g>
  <circle cx="398" cy="200" r="10" fill="#1F1A14"/>
  <circle cx="462" cy="200" r="10" fill="#1F1A14"/>
