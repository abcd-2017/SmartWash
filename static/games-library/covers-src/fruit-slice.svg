<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4622A"/>
      <stop offset="0.55" stop-color="#B04E1E"/>
      <stop offset="1" stop-color="#96411A"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#CFE6F5" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5E2A10" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect y="396" width="800" height="54" fill="#8A3A16" opacity="0.55"/>
  <rect y="396" width="800" height="6" fill="#742F12" opacity="0.5"/>
  <g opacity="0.5">
    <path d="M130 88 h12 M136 82 v12" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M212 300 h9 M216.5 295.5 v9" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M690 320 h12 M696 314 v12" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M628 70 h9 M632.5 65.5 v9" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
  <g fill="#FFD9AE" opacity="0.5">
    <circle cx="80" cy="180" r="4"/><circle cx="730" cy="180" r="3.4"/><circle cx="160" cy="240" r="3"/><circle cx="716" cy="250" r="2.6"/>
  </g>

  <ellipse cx="430" cy="398" rx="212" ry="20" fill="#6E2A10" opacity="0.35"/>

