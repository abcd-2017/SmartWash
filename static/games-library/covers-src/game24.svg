  <!-- 卡2 -->
  <g transform="rotate(-2.5 338 231)">
    <rect x="278" y="144" width="120" height="174" rx="18" fill="#FFFDF6" stroke="#1E3A2C" stroke-width="8"/>
    <rect x="278" y="144" width="120" height="174" rx="18" fill="url(#gloss)"/>
    <text x="338" y="268" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="bold" fill="#E8683A" text-anchor="middle">2</text>
