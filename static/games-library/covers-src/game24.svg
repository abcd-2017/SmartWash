  <!-- 卡3 -->
  <g transform="rotate(2.5 468 231)">
    <rect x="408" y="144" width="120" height="174" rx="18" fill="#FFFDF6" stroke="#1E3A2C" stroke-width="8"/>
    <rect x="408" y="144" width="120" height="174" rx="18" fill="url(#gloss)"/>
    <text x="468" y="268" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="bold" fill="#3E77B8" text-anchor="middle">6</text>
    <circle cx="438" cy="176" r="8" fill="#FFFFFF" opacity="0.55"/>
  </g>
  <!-- 卡4 -->
  <g transform="rotate(7 598 237)">
    <rect x="538" y="150" width="120" height="174" rx="18" fill="#FFFDF6" stroke="#1E3A2C" stroke-width="8"/>
    <rect x="538" y="150" width="120" height="174" rx="18" fill="url(#gloss)"/>
    <text x="598" y="268" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="bold" fill="#F2A93B" text-anchor="middle">6</text>
