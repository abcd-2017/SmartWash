    <circle cx="655" cy="308" r="4.5"/><circle cx="655" cy="324" r="4.5"/>
  </g>

  <!-- 卡片阴影 -->
  <g fill="#122E22" opacity="0.4">
    <rect x="146" y="150" width="120" height="174" rx="18" transform="rotate(-7 206 237)"/>
    <rect x="278" y="144" width="120" height="174" rx="18" transform="rotate(-2.5 338 231)"/>
    <rect x="408" y="144" width="120" height="174" rx="18" transform="rotate(2.5 468 231)"/>
    <rect x="538" y="150" width="120" height="174" rx="18" transform="rotate(7 598 237)"/>
