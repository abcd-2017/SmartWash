  <g transform="rotate(-7 206 237)">
    <rect x="146" y="150" width="120" height="174" rx="18" fill="#FFFDF6" stroke="#1E3A2C" stroke-width="8"/>
    <rect x="146" y="150" width="120" height="174" rx="18" fill="url(#gloss)"/>
    <text x="206" y="268" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="bold" fill="#3E9E56" text-anchor="middle">1</text>
    <circle cx="176" cy="182" r="8" fill="#FFFFFF" opacity="0.55"/>
