<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E4D3A"/>
      <stop offset="0.55" stop-color="#143827"/>
      <stop offset="1" stop-color="#0E2A1E"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#071810" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect y="392" width="800" height="58" fill="#0A2015" opacity="0.55"/>
  <rect y="392" width="800" height="6" fill="#081B12" opacity="0.6"/>
  <g stroke="#A8CDBA" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 80 h11 M97.5 74.5 v11" stroke-width="3"/>
    <path d="M716 86 h12 M722 80 v12" stroke-width="3.4"/>
    <path d="M64 300 h9 M68.5 295.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M748 280 h9 M752.5 275.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#A8CDBA" opacity="0.5">
    <circle cx="140" cy="150" r="4"/><circle cx="680" cy="130" r="3.4"/><circle cx="70" cy="220" r="3"/><circle cx="752" cy="200" r="2.6"/>
  </g>

  <ellipse cx="440" cy="406" rx="250" ry="18" fill="#071810" opacity="0.5"/>

  <!-- 天花板与地板平台 -->
  <rect x="380" y="84" width="290" height="26" rx="8" fill="#8A7A5E" stroke="#1E2620" stroke-width="7"/>
  <rect x="230" y="360" width="300" height="26" rx="8" fill="#8A7A5E" stroke="#1E2620" stroke-width="7"/>

  <!-- 中部小平台 -->
  <rect x="450" y="240" width="90" height="18" rx="6" fill="#8A7A5E" stroke="#1E2620" stroke-width="6"/>
  <rect x="330" y="200" width="80" height="18" rx="6" fill="#8A7A5E" stroke="#1E2620" stroke-width="6"/>

  <!-- 目标环 -->
  <circle cx="640" cy="225" r="36" fill="none" stroke="#5CB892" stroke-width="9"/>
  <circle cx="640" cy="225" r="13" fill="#5CB892" opacity="0.7"/>
  <path d="M420 300 Q540 300 610 250" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 12" opacity="0.5"/>

  <!-- 重力箭头 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M560 240 V306" stroke="#E8F6EF" stroke-width="7" fill="none"/>
    <path d="M546 292 L560 310 L574 292" stroke="#E8F6EF" stroke-width="7" fill="none"/>
    <path d="M300 316 V252" stroke="#C9CDD2" stroke-width="6" fill="none" stroke-dasharray="10 9"/>
    <path d="M287 264 L300 247 L313 264" stroke="#C9CDD2" stroke-width="6" fill="none"/>
  </g>

  <!-- 天花板上的虚影球 -->
  <circle cx="480" cy="150" r="32" fill="none" stroke="#C9CDD2" stroke-width="5" stroke-dasharray="10 8" opacity="0.65"/>

  <!-- 小球角色（签名表情） -->
  <circle cx="390" cy="326" r="32" fill="#3F9D77" stroke="#1E2620" stroke-width="8"/>
  <circle cx="390" cy="326" r="32" fill="url(#gloss)"/>
  <circle cx="377" cy="316" r="7.5" fill="#0B3625"/>
  <circle cx="403" cy="316" r="7.5" fill="#0B3625"/>
  <circle cx="374.5" cy="313.5" r="2.4" fill="#FFFFFF"/>
  <circle cx="400.5" cy="313.5" r="2.4" fill="#FFFFFF"/>
  <path d="M380 340 Q390 348 400 338" stroke="#0B3625" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="372" cy="308" r="8" fill="#FFFFFF" opacity="0.5"/>

  <rect width="800" height="450" fill="url(#vign)"/>
