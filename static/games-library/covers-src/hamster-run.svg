      <stop offset="0" stop-color="#7CC79C"/>
      <stop offset="0.55" stop-color="#58AA7A"/>
      <stop offset="1" stop-color="#42915E"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#143E28" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
