<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E9CF"/>
      <stop offset="0.55" stop-color="#E9DCBC"/>
      <stop offset="1" stop-color="#DACBA3"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#7A6640" stop-opacity="0.26"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="392" width="800" height="58" fill="#C7B48A" opacity="0.7"/>
  <rect y="392" width="800" height="6" fill="#B2A075" opacity="0.6"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M108 106 h10 M113 101 v10" stroke-width="3"/>
    <path d="M680 96 h12 M686 90 v12" stroke-width="3.4"/>
    <path d="M710 250 h9 M714.5 245.5 v9" stroke-width="2.6" opacity="0.75"/>
    <path d="M92 290 h9 M96.5 285.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFDF2" opacity="0.55">
    <circle cx="186" cy="160" r="4"/><circle cx="640" cy="180" r="3.4"/><circle cx="72" cy="220" r="3"/><circle cx="730" cy="180" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="420" cy="404" rx="240" ry="24" fill="#99855C" opacity="0.35"/>

  <!-- 木绞架 -->
  <g stroke="#4A3520" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <rect x="300" y="378" width="210" height="26" rx="8" fill="#A87944"/>
    <rect x="330" y="118" width="24" height="262" rx="6" fill="#B98850"/>
    <path d="M342 121 L518 121" stroke-width="26"/>
    <path d="M342 121 L518 121" stroke="#B98850" stroke-width="14"/>
    <path d="M342 198 L402 138" stroke-width="24"/>
    <path d="M342 198 L402 138" stroke="#B98850" stroke-width="13"/>
  </g>
  <!-- 横杆端头 -->
  <circle cx="518" cy="121" r="10" fill="#8F6435" stroke="#4A3520" stroke-width="6"/>

  <!-- 绳子与吊牌小人 -->
  <g>
    <path d="M518 126 L518 168" stroke="#8A6A3F" stroke-width="7" stroke-linecap="round" fill="none"/>
    <g transform="rotate(4 520 232)">
      <rect x="462" y="166" width="116" height="132" rx="16" fill="#FFF8E8" stroke="#4A3520" stroke-width="8"/>
      <rect x="462" y="166" width="116" height="132" rx="16" fill="url(#gloss)"/>
      <!-- 绳结 -->
      <path d="M508 166 L508 184" stroke="#8A6A3F" stroke-width="6" stroke-linecap="round"/>
      <!-- 表情 -->
      <circle cx="496" cy="212" r="7.5" fill="#4A3520"/>
      <circle cx="530" cy="212" r="7.5" fill="#4A3520"/>
      <circle cx="499" cy="209" r="2.6" fill="#FFFFFF"/>
      <circle cx="533" cy="209" r="2.6" fill="#FFFFFF"/>
      <path d="M500 234 Q513 244 526 232" stroke="#4A3520" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- 空白下划线 -->
      <path d="M486 262 L554 262" stroke="#B49B6E" stroke-width="6" stroke-linecap="round"/>
      <path d="M486 280 L538 280" stroke="#B49B6E" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 字母瓷砖 -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle">
    <g transform="rotate(-8 148 344)">
      <rect x="118" y="312" width="60" height="60" rx="12" fill="#FFF8E8" stroke="#4A3520" stroke-width="7"/>
      <text x="148" y="356" font-size="38" fill="#4A3520">H</text>
    </g>
    <g transform="rotate(6 262 356)">
      <rect x="232" y="326" width="60" height="60" rx="12" fill="#F2A93B" stroke="#4A3520" stroke-width="7"/>
      <text x="262" y="370" font-size="38" fill="#4A3520">A</text>
    </g>
    <g transform="rotate(-4 376 342)">
      <rect x="346" y="312" width="60" height="60" rx="12" fill="#7ECB7E" stroke="#4A3520" stroke-width="7"/>
      <text x="376" y="356" font-size="38" fill="#2F5A2E">N</text>
    </g>
    <g transform="rotate(7 612 340)">
      <rect x="582" y="310" width="60" height="60" rx="12" fill="#6BA8E8" stroke="#4A3520" stroke-width="7"/>
      <text x="612" y="354" font-size="38" fill="#22456B">G</text>
    </g>
    <g transform="rotate(-6 700 360)">
      <rect x="670" y="330" width="60" height="60" rx="12" fill="#F08CA8" stroke="#4A3520" stroke-width="7"/>
      <text x="700" y="374" font-size="38" fill="#5E2A3C">M</text>
    </g>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
