<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEFEA"/>
      <stop offset="0.55" stop-color="#C2E2D8"/>
      <stop offset="1" stop-color="#A2D0C0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9B691"/>
      <stop offset="0.5" stop-color="#B8A276"/>
      <stop offset="1" stop-color="#A08C60"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E4A3E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#8CBEAC" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#78AA98" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 96 h12 M102 90 v12" stroke-width="3.2"/>
    <path d="M694 84 h12 M700 78 v12" stroke-width="3.4"/>
    <path d="M110 250 h9 M114.5 245.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M700 260 h9 M704.5 255.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="170" cy="150" r="4"/><circle cx="712" cy="150" r="3.4"/><circle cx="70" cy="210" r="3"/><circle cx="740" cy="220" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="396" rx="185" ry="18" fill="#4E8A76" opacity="0.32"/>

  <!-- 螺旋塔（主视觉） -->
  <g>
    <!-- 塔身 -->
    <path d="M300 130 L300 370 Q300 392 330 392 L470 392 Q500 392 500 370 L500 130 Z"
          fill="url(#core)" stroke="#3A2A1E" stroke-width="9" stroke-linejoin="round"/>
    <path d="M322 150 V372" stroke="#8A7A52" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <!-- 平台层（自下而上，交替绿安全/红危险，椭圆盘） -->
    <g stroke="#3A2A1E" stroke-linejoin="round">
      <path d="M282 352 Q400 322 518 352 Q400 386 282 352 Z" fill="#4ADE6E" stroke-width="8"/>
      <path d="M282 290 Q400 260 518 290 Q400 324 282 290 Z" fill="#E05A5A" stroke-width="8"/>
      <path d="M282 228 Q400 198 518 228 Q400 262 282 228 Z" fill="#4ADE6E" stroke-width="8"/>
      <path d="M282 166 Q400 136 518 166 Q400 200 282 166 Z" fill="#4ADE6E" stroke-width="8"/>
    </g>
    <!-- 危险段标记 -->
    <g fill="#FFFFFF" opacity="0.5">
      <circle cx="470" cy="288" r="7"/><circle cx="496" cy="292" r="7"/>
    </g>
    <!-- 平台高光 -->
    <path d="M300 160 Q360 148 420 152" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.35" fill="none"/>
    <!-- 塔顶 -->
    <ellipse cx="400" cy="130" rx="100" ry="24" fill="#D8C8A2" stroke="#3A2A1E" stroke-width="9"/>
    <ellipse cx="400" cy="124" rx="72" ry="15" fill="#E8DCC0"/>
  </g>

  <!-- 绕行小球（带表情） -->
  <g>
    <path d="M580 178 Q610 168 630 184" stroke="#1E2620" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 12" fill="none" opacity="0.6"/>
    <circle cx="572" cy="212" r="44" fill="#FFFFFF" stroke="#1E2620" stroke-width="9"/>
    <circle cx="572" cy="212" r="44" fill="url(#gloss)"/>
    <path d="M552 188 Q562 178 576 176" stroke="#1E2620" stroke-width="4" stroke-linecap="round" opacity="0.4" fill="none"/>
    <circle cx="560" cy="204" r="7" fill="#1F1A14"/>
    <circle cx="588" cy="204" r="7" fill="#1F1A14"/>
    <circle cx="562" cy="201" r="2.5" fill="#FFFFFF"/>
    <circle cx="590" cy="201" r="2.5" fill="#FFFFFF"/>
    <path d="M564 228 Q572 236 582 226" stroke="#1F1A14" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 落点提示（底部终点平台小旗） -->
  <g>
    <path d="M684 392 V332" stroke="#1E2620" stroke-width="8" stroke-linecap="round"/>
    <path d="M684 332 Q716 322 728 336 Q714 352 684 348 Z" fill="#17734A" stroke="#1E2620" stroke-width="7" stroke-linejoin="round"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
