  <g stroke="#1E2620" stroke-width="8" stroke-linejoin="round">
    <polygon points="325.7,16.6 400.2,59.6 400.2,145.6 325.7,188.6 251.2,145.6 251.2,59.6" fill="#F3F5F0"/>
    <polygon points="474.3,16.6 548.8,59.6 548.8,145.6 474.3,188.6 399.8,145.6 399.8,59.6" fill="#63C292"/>
    <polygon points="251.3,146 325.8,189 325.8,275 251.3,318 176.8,275 176.8,189" fill="#DDE2DB"/>
    <polygon points="548.7,146 623.2,189 623.2,275 548.7,318 474.2,275 474.2,189" fill="#F3F5F0"/>
    <polygon points="325.7,275.4 400.2,318.4 400.2,404.4 325.7,447.4 251.2,404.4 251.2,318.4" fill="#63C292"/>
    <polygon points="474.3,275.4 548.8,318.4 548.8,404.4 474.3,447.4 399.8,404.4 399.8,318.4" fill="#F3F5F0"/>
    <polygon points="400,146 474.5,189 474.5,275 400,318 325.5,275 325.5,189" fill="#2D9B6A"/>
