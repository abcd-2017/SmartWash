  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="396" width="800" height="54" fill="#37805A" opacity="0.6"/>
  <rect y="396" width="800" height="6" fill="#2C6C4A" opacity="0.55"/>
