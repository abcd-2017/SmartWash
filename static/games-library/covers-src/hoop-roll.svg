<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF4EC"/>
      <stop offset="0.55" stop-color="#D2E8C4"/>
      <stop offset="1" stop-color="#B0D69C"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E4A24" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 山道草地带 -->
  <rect y="380" width="800" height="70" fill="#7CB85C" opacity="0.6"/>
  <path d="M0 380 Q200 360 400 378 Q600 394 800 374 L800 450 L0 450 Z" fill="#5E9B46" opacity="0.5"/>
  <rect y="380" width="800" height="6" fill="#4E8A38" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 96 h12 M102 90 v12" stroke-width="3.2"/>
    <path d="M694 84 h12 M700 78 v12" stroke-width="3.4"/>
    <path d="M110 250 h9 M114.5 245.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M712 240 h9 M716.5 235.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="170" cy="150" r="4"/><circle cx="712" cy="150" r="3.4"/><circle cx="70" cy="210" r="3"/><circle cx="740" cy="200" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="390" cy="398" rx="180" ry="16" fill="#3E6A2C" opacity="0.35"/>

  <!-- 大铁环（主视觉，环心带表情） -->
  <g>
    <circle cx="380" cy="250" r="128" fill="none" stroke="#1E2620" stroke-width="26"/>
    <circle cx="380" cy="250" r="128" fill="none" stroke="#C9CFC7" stroke-width="14"/>
    <!-- 内圈细线 -->
    <circle cx="380" cy="250" r="112" fill="none" stroke="#1E2620" stroke-width="4" opacity="0.5"/>
    <!-- 辐条 -->
    <g stroke="#6B736B" stroke-width="8" stroke-linecap="round">
      <path d="M380 138 L380 250"/>
      <path d="M491 190 L380 250"/>
      <path d="M491 310 L380 250"/>
      <path d="M269 190 L380 250"/>
    </g>
    <!-- 辐条轮毂 -->
    <circle cx="380" cy="250" r="34" fill="#C9CFC7" stroke="#1E2620" stroke-width="8"/>
    <circle cx="380" cy="250" r="34" fill="url(#gloss)"/>
    <!-- 表情（轮毂） -->
    <circle cx="368" cy="242" r="7" fill="#1F1A14"/>
    <circle cx="394" cy="242" r="7" fill="#1F1A14"/>
    <circle cx="370" cy="239" r="2.5" fill="#FFFFFF"/>
    <circle cx="396" cy="239" r="2.5" fill="#FFFFFF"/>
    <path d="M370 262 Q381 271 392 260" stroke="#1F1A14" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 环高光 -->
    <path d="M288 176 Q310 148 350 136" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.45" fill="none"/>
  </g>

  <!-- 铁钩推杆（右上） -->
  <g>
    <path d="M640 118 L470 152" stroke="#1E2620" stroke-width="15" stroke-linecap="round"/>
    <path d="M640 118 L470 152" stroke="#8A6A44" stroke-width="8" stroke-linecap="round"/>
    <path d="M470 152 Q440 158 434 182 Q432 200 448 202" stroke="#1E2620" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M470 152 Q440 158 434 182 Q432 200 448 202" stroke="#C9CFC7" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 握把尾 -->
    <circle cx="650" cy="116" r="14" fill="#6B5236" stroke="#1E2620" stroke-width="7"/>
    <circle cx="645" cy="111" r="5" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- 滚动速度线与尘土 -->
  <g stroke="#1E2620" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.4">
    <path d="M212 300 L180 316"/>
    <path d="M228 330 L196 348"/>
    <path d="M256 356 L228 372"/>
  </g>
  <g fill="#5E9B46" opacity="0.6">
    <circle cx="238" cy="386" r="7"/><circle cx="258" cy="394" r="5"/><circle cx="220" cy="394" r="4"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
