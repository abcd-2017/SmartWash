<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2AC70"/>
      <stop offset="0.55" stop-color="#D18F52"/>
      <stop offset="1" stop-color="#BC7A3E"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#6E3E14" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="396" width="800" height="54" fill="#A86832" opacity="0.6"/>
  <rect y="396" width="800" height="6" fill="#965A28" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFF3DC" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M96 88 h11 M101.5 82.5 v11" stroke-width="3.2"/>
    <path d="M540 64 h12 M546 58 v12" stroke-width="3.4"/>
    <path d="M80 240 h9 M84.5 235.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M470 210 h9 M474.5 205.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFF3DC" opacity="0.5">
    <circle cx="170" cy="130" r="4"/><circle cx="560" cy="110" r="3.4"/><circle cx="66" cy="190" r="3"/><circle cx="430" cy="120" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="424" rx="230" ry="16" fill="#8A4E1E" opacity="0.3"/>

  <!-- 篮架 -->
  <rect x="688" y="120" width="24" height="300" fill="#8A6E4A" stroke="#3A2A1E" stroke-width="8"/>
  <rect x="656" y="412" width="88" height="16" rx="6" fill="#8A6E4A" stroke="#3A2A1E" stroke-width="8"/>
  <rect x="600" y="95" width="120" height="135" rx="10" fill="#E5BC80" stroke="#3A2A1E" stroke-width="9"/>
  <rect x="625" y="120" width="70" height="60" fill="none" stroke="#B87840" stroke-width="6"/>
  <!-- 篮筐与网 -->
  <ellipse cx="560" cy="240" rx="62" ry="16" fill="none" stroke="#E2A44E" stroke-width="10"/>
  <g stroke="#F5F6F3" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M505 252 L518 312 M536 257 L546 318 M566 258 L576 318 M598 253 L608 310"/>
    <path d="M512 284 Q560 300 604 282" opacity="0.85"/>
    <path d="M518 308 Q560 322 600 306" opacity="0.85"/>
  </g>

