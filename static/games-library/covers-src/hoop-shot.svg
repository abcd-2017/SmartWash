  <path d="M110 385 C220 130 420 130 548 235" stroke="#FFF3D6" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18" opacity="0.85" fill="none"/>

  <!-- 篮球（签名表情） -->
  <circle cx="300" cy="175" r="64" fill="#D9A868" stroke="#3A2A1E" stroke-width="9"/>
  <path d="M300 111 Q272 175 300 239 M300 111 Q328 175 300 239 M240 160 Q300 138 360 160" stroke="#8A5E32" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="272" cy="132" r="14" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="280" cy="162" r="9" fill="#1F1A14"/>
  <circle cx="322" cy="162" r="9" fill="#1F1A14"/>
  <path d="M272 192 Q301 210 330 190" stroke="#1F1A14" stroke-width="7" fill="none" stroke-linecap="round"/>

  <rect width="800" height="450" fill="url(#vign)"/>
