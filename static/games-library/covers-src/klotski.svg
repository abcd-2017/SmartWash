<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCA96C"/>
      <stop offset="0.55" stop-color="#CD9A59"/>
      <stop offset="1" stop-color="#BC894A"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#6E4A20" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="392" width="800" height="58" fill="#A9763F" opacity="0.7"/>
  <rect y="392" width="800" height="6" fill="#956636" opacity="0.6"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFF3DC" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M110 110 h10 M115 105 v10" stroke-width="3"/>
    <path d="M676 96 h12 M682 90 v12" stroke-width="3.4"/>
    <path d="M706 240 h9 M710.5 235.5 v9" stroke-width="2.6" opacity="0.75"/>
    <path d="M100 284 h9 M104.5 279.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFF3DC" opacity="0.5">
    <circle cx="186" cy="160" r="4"/><circle cx="642" cy="180" r="3.4"/><circle cx="76" cy="216" r="3"/><circle cx="728" cy="170" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="402" cy="408" rx="175" ry="22" fill="#7E5528" opacity="0.38"/>

  <!-- 棋盘木框（底部留出口缺口） -->
  <g>
    <path d="M242 44 L562 44 L562 372 L468 372 L468 396 L338 396 L338 372 L242 372 Z"
          fill="#8A5A2B" stroke="#4A2C15" stroke-width="9" stroke-linejoin="round"/>
    <rect x="262" y="64" width="280" height="308" fill="#E9D3A8" stroke="#4A2C15" stroke-width="7"/>
    <!-- 木纹点缀 -->
    <path d="M280 120 Q320 116 356 122 M500 220 Q530 216 536 222" stroke="#D2B685" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 曹操 2x2（绿色，带表情） -->
  <g>
    <rect x="268" y="70" width="126" height="126" rx="12" fill="#6DBB6A" stroke="#4A2C15" stroke-width="8"/>
    <rect x="268" y="70" width="126" height="126" rx="12" fill="url(#gloss)"/>
    <rect x="280" y="82" width="102" height="102" rx="8" fill="none" stroke="#3E8A3C" stroke-width="4"/>
    <circle cx="308" cy="118" r="9" fill="#1E3A1C"/>
    <circle cx="354" cy="118" r="9" fill="#1E3A1C"/>
    <circle cx="311" cy="115" r="3" fill="#FFFFFF"/>
    <circle cx="357" cy="115" r="3" fill="#FFFFFF"/>
    <path d="M314 142 Q331 154 348 140" stroke="#1E3A1C" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="296" cy="96" r="9" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- 张飞 2x1 竖（橙色） -->
  <g>
    <rect x="468" y="70" width="64" height="126" rx="10" fill="#F2994E" stroke="#4A2C15" stroke-width="8"/>
    <rect x="468" y="70" width="64" height="126" rx="10" fill="url(#gloss)"/>
    <rect x="478" y="80" width="44" height="106" rx="7" fill="none" stroke="#C9722E" stroke-width="4"/>
    <circle cx="490" cy="94" r="7" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- 蓝色小卒 1 -->
  <g>
    <rect x="268" y="270" width="64" height="64" rx="10" fill="#6BA8E8" stroke="#4A2C15" stroke-width="7"/>
    <rect x="268" y="270" width="64" height="64" rx="10" fill="url(#gloss)"/>
    <rect x="278" y="280" width="44" height="44" rx="7" fill="none" stroke="#3E77B8" stroke-width="4"/>
    <circle cx="288" cy="290" r="6" fill="#FFFFFF" opacity="0.45"/>
  </g>
  <!-- 蓝色小卒 2 -->
  <g>
    <rect x="468" y="270" width="64" height="64" rx="10" fill="#6BA8E8" stroke="#4A2C15" stroke-width="7"/>
    <rect x="468" y="270" width="64" height="64" rx="10" fill="url(#gloss)"/>
    <rect x="478" y="280" width="44" height="44" rx="7" fill="none" stroke="#3E77B8" stroke-width="4"/>
    <circle cx="488" cy="290" r="6" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- 出口虚线 -->
  <g stroke="#FFFDF6" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M403 352 L403 388" stroke-width="6" stroke-dasharray="2 12"/>
    <path d="M392 380 L403 394 L414 380" stroke-width="6"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
