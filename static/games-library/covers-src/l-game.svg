  <g>
    <path d="M510 172 H620 V418 H400 V336 H510 Z" fill="#4A9FD4" stroke="#3A2A1E" stroke-width="9" stroke-linejoin="round"/>
    <path d="M510 172 V336 M510 254 H620 M510 336 H620 M400 336 H510" stroke="#3A2A1E" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
    <circle cx="548" cy="208" r="12" fill="#FFFFFF" opacity="0.35"/>
