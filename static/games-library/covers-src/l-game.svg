  <!-- 中立中子：普通 -->
  <circle cx="455" cy="131" r="27" fill="#C9B691" stroke="#3A2A1E" stroke-width="8"/>
  <circle cx="446" cy="126" r="5" fill="#1F1A14"/>
  <circle cx="464" cy="126" r="5" fill="#1F1A14"/>
