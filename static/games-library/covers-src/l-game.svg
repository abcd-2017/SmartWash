    <circle cx="254" cy="124" r="9" fill="#1F1A14"/>
    <path d="M222 146 Q235 158 248 146" stroke="#1F1A14" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="200" cy="106" r="14" fill="#FFFFFF" opacity="0.4"/>
