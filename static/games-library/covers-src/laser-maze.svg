    <rect x="478" y="278" width="12" height="56" rx="6" fill="#44524A" stroke="#1E2620" stroke-width="5"/>
    <rect x="456" y="252" width="56" height="14" rx="7" transform="rotate(38 484 259)" fill="#DDE9E2" stroke="#1E2620" stroke-width="6"/>
