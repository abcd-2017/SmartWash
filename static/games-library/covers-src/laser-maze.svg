    <path d="M332 148 L420 240 L332 332 L244 240 Z" fill="#7FD4B0" opacity="0.35"/>
    <path d="M300 190 L276 216" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.6"/>
