    <path d="M740 210 h9 M744.5 205.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#BFE6D4" opacity="0.5">
    <circle cx="180" cy="140" r="4"/><circle cx="650" cy="120" r="3.4"/><circle cx="70" cy="320" r="3"/><circle cx="752" cy="320" r="2.6"/>
  </g>

  <ellipse cx="400" cy="406" rx="270" ry="20" fill="#07231A" opacity="0.4"/>

  <!-- 激光入射段 -->
