    <path d="M412 252 L566 194 L648 284" stroke="#E86E82" stroke-width="9"/>
    <path d="M412 252 L566 194 L648 284" stroke="#FFFFFF" stroke-width="3.5" opacity="0.85"/>
  </g>

  <!-- 靶心 -->
  <g>
    <rect x="622" y="306" width="52" height="12" rx="6" fill="#44524A" stroke="#1E2620" stroke-width="5"/>
    <circle cx="648" cy="288" r="42" fill="#E9CFA0" stroke="#1E2620" stroke-width="8"/>
    <circle cx="648" cy="288" r="27" fill="#C9526B" stroke="#1E2620" stroke-width="5"/>
    <circle cx="648" cy="288" r="11" fill="#F2EFE9" stroke="#1E2620" stroke-width="4"/>
    <circle cx="648" cy="288" r="66" fill="url(#hit)"/>
    <path d="M600 262 L588 250 M610 246 L604 236" stroke="#E2A44E" stroke-width="5" stroke-linecap="round"/>
