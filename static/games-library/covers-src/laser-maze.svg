    <path d="M110 208 L250 230" stroke="#C9526B" stroke-width="14" opacity="0.55"/>
    <path d="M110 208 L250 230" stroke="#E86E82" stroke-width="9"/>
    <path d="M110 208 L250 230" stroke="#FFFFFF" stroke-width="3.5" opacity="0.85"/>
