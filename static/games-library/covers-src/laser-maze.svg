<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#256B50"/>
      <stop offset="0.55" stop-color="#174A34"/>
      <stop offset="1" stop-color="#0F3524"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="hit" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD9A0" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#E2A44E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E2A44E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A2418" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect y="392" width="800" height="58" fill="#0C2B1D" opacity="0.55"/>
  <rect y="392" width="800" height="6" fill="#0A2418" opacity="0.6"/>
