    <path d="M198 232 Q172 250 168 272" stroke="#3FA34D" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="252" cy="222" rx="40" ry="28" fill="#3FA34D" stroke="#1E2620" stroke-width="9"/>
