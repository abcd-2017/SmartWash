<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2D8B8"/>
      <stop offset="0.55" stop-color="#D2C6A0"/>
      <stop offset="1" stop-color="#C0B28A"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A4A28" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#AC9E74" opacity="0.6"/>
  <rect y="394" width="800" height="6" fill="#9C8E64" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFF8E4" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M96 92 h11 M101.5 86.5 v11" stroke-width="3.2"/>
    <path d="M700 88 h12 M706 82 v12" stroke-width="3.4"/>
    <path d="M722 260 h9 M726.5 255.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M74 250 h9 M78.5 245.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFF8E4" opacity="0.5">
    <circle cx="168" cy="150" r="4"/><circle cx="704" cy="160" r="3.4"/><circle cx="62" cy="210" r="3"/><circle cx="738" cy="200" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="400" rx="242" ry="20" fill="#8A7A50" opacity="0.35"/>

  <!-- 折叠地图（半展开） -->
  <rect x="170" y="110" width="460" height="260" rx="10" fill="#F2ECDA" stroke="#3A2A1E" stroke-width="9"/>
  <rect x="322" y="110" width="154" height="260" fill="#E4DCC4"/>
  <path d="M322 110 V370 M476 110 V370" stroke="#B8A87E" stroke-width="5" stroke-linecap="round"/>
  <!-- 折痕山影 -->
  <polygon points="215,200 250,150 285,200" fill="#C9B98E" stroke="#3A2A1E" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="268,200 303,162 338,200" fill="#D8CBA4" stroke="#3A2A1E" stroke-width="6" stroke-linejoin="round"/>
  <!-- 寻宝路线与目标 -->
  <path d="M200 340 Q280 320 350 280" stroke="#B8452E" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10" fill="none"/>
  <path d="M420 190 L448 218 M448 190 L420 218" stroke="#B8452E" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- 罗盘（签名表情） -->
  <circle cx="398" cy="240" r="44" fill="#F7F1DE" stroke="#3A2A1E" stroke-width="7"/>
  <polygon points="398,206 390,220 406,220" fill="#B8452E"/>
  <circle cx="388" cy="236" r="6" fill="#1F1A14"/>
  <circle cx="408" cy="236" r="6" fill="#1F1A14"/>
  <path d="M383 252 Q398 261 413 250" stroke="#1F1A14" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- 掀起的一折 -->
  <path d="M476 362 H630" stroke="#8A7A54" stroke-width="9" opacity="0.4" stroke-linecap="round"/>
  <rect x="476" y="98" width="154" height="260" rx="10" fill="#F7F1DE" stroke="#3A2A1E" stroke-width="8"/>
  <path d="M496 130 H610 M496 160 H580" stroke="#C9B98E" stroke-width="5" stroke-linecap="round"/>
  <!-- 高光 -->
  <circle cx="200" cy="140" r="12" fill="#FFFFFF" opacity="0.4"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
