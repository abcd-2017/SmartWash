  <!-- 反馈小白圈：两行 -->
  <g stroke="#1E3226" stroke-width="4">
    <circle cx="310" cy="322" r="10" fill="#E8683A"/>
    <circle cx="390" cy="322" r="10" fill="#FFFDF6"/>
    <circle cx="470" cy="322" r="10" fill="#FFFDF6"/>
    <circle cx="550" cy="322" r="10" fill="none"/>
    <circle cx="310" cy="350" r="10" fill="#FFFDF6"/>
    <circle cx="390" cy="350" r="10" fill="none"/>
    <circle cx="470" cy="350" r="10" fill="none"/>
    <circle cx="550" cy="350" r="10" fill="none"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
