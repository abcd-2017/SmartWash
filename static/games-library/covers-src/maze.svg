<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C939E"/>
      <stop offset="0.55" stop-color="#6C828D"/>
      <stop offset="1" stop-color="#5B707B"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A4C56" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="392" width="800" height="58" fill="#4C606B" opacity="0.75"/>
  <rect y="392" width="800" height="6" fill="#415460" opacity="0.6"/>
  <!-- 星尘点缀 -->
  <g stroke="#E6EEF2" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M110 106 h10 M115 101 v10" stroke-width="3"/>
    <path d="M676 96 h12 M682 90 v12" stroke-width="3.4"/>
    <path d="M706 240 h9 M710.5 235.5 v9" stroke-width="2.6" opacity="0.75"/>
    <path d="M96 280 h9 M100.5 275.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#E6EEF2" opacity="0.5">
    <circle cx="190" cy="162" r="4"/><circle cx="644" cy="176" r="3.4"/><circle cx="74" cy="212" r="3"/><circle cx="724" cy="164" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="402" cy="404" rx="175" ry="22" fill="#33434E" opacity="0.4"/>

  <!-- 迷宫板 -->
  <rect x="250" y="60" width="300" height="320" rx="16" fill="#EAE6DA" stroke="#2A343A" stroke-width="8"/>
  <!-- 路面虚线装饰 -->
  <path d="M300 95 Q380 88 460 95" stroke="#D6D0C0" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- 外墙（左上入口 + 右下出口） -->
  <g fill="#3E4A50" stroke="#222B31" stroke-width="5" stroke-linejoin="round">
    <rect x="250" y="60" width="300" height="18" rx="7"/>
    <rect x="532" y="60" width="18" height="300" rx="7"/>
    <rect x="250" y="342" width="240" height="18" rx="7"/>
    <rect x="250" y="60" width="18" height="42" rx="7"/>
    <rect x="250" y="150" width="18" height="212" rx="7"/>
  </g>
  <!-- 内墙 -->
  <g fill="#3E4A50" stroke="#222B31" stroke-width="5" stroke-linejoin="round">
    <rect x="300" y="140" width="220" height="16" rx="7"/>
    <rect x="290" y="225" width="180" height="16" rx="7"/>
    <rect x="330" y="300" width="190" height="16" rx="7"/>
    <rect x="460" y="156" width="16" height="70" rx="7"/>
    <rect x="400" y="241" width="16" height="60" rx="7"/>
  </g>

  <!-- 出口区（缺口 490-532） -->
  <path d="M511 334 L511 372" stroke="#2A343A" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- 起点绿点（带表情） -->
  <g>
    <circle cx="285" cy="122" r="22" fill="#5FAE5B" stroke="#2A343A" stroke-width="7"/>
    <circle cx="285" cy="122" r="22" fill="url(#gloss)"/>
    <circle cx="277" cy="116" r="5" fill="#1F3A1E"/>
    <circle cx="293" cy="116" r="5" fill="#1F3A1E"/>
    <circle cx="279" cy="114" r="1.8" fill="#FFFFFF"/>
    <circle cx="295" cy="114" r="1.8" fill="#FFFFFF"/>
    <path d="M278 130 Q285 136 292 129" stroke="#1F3A1E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="274" cy="110" r="5" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- 红色小旗（出口） -->
  <g>
    <path d="M514 330 L514 292" stroke="#2A343A" stroke-width="7" stroke-linecap="round"/>
    <path d="M514 292 L548 302 L514 314 Z" fill="#E8683A" stroke="#2A343A" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="514" cy="334" rx="12" ry="5" fill="#2A343A" opacity="0.5"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
