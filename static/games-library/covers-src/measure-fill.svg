<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6F1E5"/>
      <stop offset="0.55" stop-color="#CDE6D6"/>
      <stop offset="1" stop-color="#B5D7C4"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E6B4E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#A0C9B0" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#8CB59D" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M84 96 h11 M89.5 90.5 v11" stroke-width="3.2"/>
    <path d="M712 86 h12 M718 80 v12" stroke-width="3.4"/>
    <path d="M748 260 h9 M752.5 255.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M56 240 h9 M60.5 235.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF6EE" opacity="0.55">
    <circle cx="140" cy="160" r="4"/><circle cx="744" cy="180" r="3.4"/><circle cx="66" cy="180" r="3"/><circle cx="120" cy="320" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="430" cy="392" rx="280" ry="20" fill="#5E9478" opacity="0.35"/>

  <!-- 量词短语卡（主视觉载体） -->
  <rect x="130" y="128" width="440" height="182" rx="18" fill="#FBF7E8" stroke="#3A2A1E" stroke-width="9"/>
  <circle cx="162" cy="152" r="10" fill="#FFFFFF" opacity="0.4"/>
  <!-- 数词砖「一」 -->
  <rect x="160" y="184" width="70" height="70" rx="12" fill="#3FAE7A" stroke="#3A2A1E" stroke-width="7"/>
  <path d="M178 219 H222" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- 待填缺口 -->
  <rect x="248" y="184" width="90" height="70" rx="12" fill="#FFFFFF" stroke="#17734A" stroke-width="6" stroke-dasharray="10 8"/>
  <!-- 量词对象：小马 -->
  <g stroke="#3A2A1E" stroke-linejoin="round">
    <ellipse cx="452" cy="222" rx="60" ry="34" fill="#A87944" stroke-width="8"/>
    <path d="M500 206 Q520 186 538 176" stroke="#A87944" stroke-width="24" stroke-linecap="round" fill="none"/>
    <circle cx="546" cy="172" r="17" fill="#A87944" stroke-width="8"/>
    <path d="M552 156 L560 148" stroke="#3A2A1E" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M394 210 Q372 218 380 242" stroke="#3A2A1E" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M414 252 V292 M438 254 V292 M464 254 V292 M486 250 V290" stroke="#8A5A30" stroke-width="11" stroke-linecap="round" fill="none"/>
    <circle cx="542" cy="168" r="5" fill="#1F1A14"/>
    <path d="M550 178 Q556 182 554 188" stroke="#1F1A14" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="428" cy="212" r="8" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- 飞入的量词砖（签名表情） -->
  <g stroke-linejoin="round">
    <rect x="250" y="52" width="86" height="86" rx="16" fill="#2D9B6A" stroke="#3A2A1E" stroke-width="8" transform="rotate(-7 293 95)"/>
    <circle cx="276" cy="86" r="8" fill="#1F1A14"/>
    <circle cx="308" cy="86" r="8" fill="#1F1A14"/>
    <path d="M282 108 Q293 118 302 107" stroke="#1F1A14" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="268" cy="70" r="8" fill="#FFFFFF" opacity="0.4"/>
  </g>
  <path d="M293 148 V176" stroke="#17734A" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 8" fill="none" opacity="0.85"/>
  <path d="M360 46 h11 M365.5 40.5 v11" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- 候选量词片 -->
  <g stroke-linejoin="round">
    <rect x="614" y="140" width="110" height="48" rx="12" fill="#F6F3E8" stroke="#3A2A1E" stroke-width="6"/>
    <path d="M632 156 H706" stroke="#8A9A8C" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M636 172 L692 190 M692 172 L636 190" stroke="#C9453C" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="614" y="206" width="110" height="48" rx="12" fill="#DFF0E4" stroke="#17734A" stroke-width="6"/>
    <path d="M632 222 H706" stroke="#17734A" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M640 262 l10 10 l20 -20" stroke="#17734A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
