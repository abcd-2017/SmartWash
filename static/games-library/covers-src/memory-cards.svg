    <g fill="#4EC9A0" opacity="0.9">
      <circle cx="215" cy="182" r="5"/><circle cx="262" cy="182" r="5"/><circle cx="309" cy="182" r="5"/>
      <circle cx="215" cy="212" r="5"/><circle cx="262" cy="212" r="5"/><circle cx="309" cy="212" r="5"/>
      <circle cx="215" cy="242" r="5"/><circle cx="262" cy="242" r="5"/><circle cx="309" cy="242" r="5"/>
      <circle cx="215" cy="272" r="5"/><circle cx="262" cy="272" r="5"/><circle cx="309" cy="272" r="5"/>
    </g>
