<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D9D2"/>
      <stop offset="0.55" stop-color="#E2A898"/>
      <stop offset="1" stop-color="#C4806E"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C89A6E"/>
      <stop offset="1" stop-color="#A8784E"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#6E3A2E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部吧台带 -->
  <rect y="390" width="800" height="60" fill="#A8685A" opacity="0.55"/>
  <rect y="390" width="800" height="6" fill="#94584C" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFF2EA" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 92 h11 M101.5 86.5 v11" stroke-width="3.2"/>
    <path d="M700 86 h12 M706 80 v12" stroke-width="3.4"/>
    <path d="M730 250 h9 M734.5 245.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M66 270 h9 M70.5 265.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFF2EA" opacity="0.55">
    <circle cx="166" cy="150" r="4"/><circle cx="656" cy="140" r="3.4"/><circle cx="72" cy="210" r="3"/><circle cx="740" cy="190" r="2.6"/>
  </g>

  <ellipse cx="360" cy="404" rx="230" ry="18" fill="#7E463A" opacity="0.35"/>

  <!-- 奶茶杯（主视觉，签名表情） -->
  <g>
    <path d="M262 138 L458 138 L442 396 L278 396 Z" fill="#FFF6E8" stroke="#3A2A1E" stroke-width="10" stroke-linejoin="round"/>
    <path d="M276 208 L446 208 L434 388 L286 388 Z" fill="url(#tea)" stroke="#3A2A1E" stroke-width="7"/>
    <!-- 珍珠 -->
    <g fill="#4E3826" stroke="#3A2A1E" stroke-width="4">
      <circle cx="308" cy="366" r="15"/><circle cx="338" cy="374" r="15"/><circle cx="370" cy="370" r="15"/>
      <circle cx="400" cy="362" r="14"/><circle cx="324" cy="344" r="13"/><circle cx="356" cy="348" r="13"/><circle cx="386" cy="342" r="12"/>
    </g>
    <circle cx="306" cy="360" r="4" fill="#8A6E5A"/>
    <circle cx="338" cy="368" r="4" fill="#8A6E5A"/>
    <!-- 表情 -->
    <circle cx="336" cy="268" r="9" fill="#3A2A1E"/>
    <circle cx="388" cy="268" r="9" fill="#3A2A1E"/>
    <circle cx="339" cy="264" r="3" fill="#FFFFFF"/>
    <circle cx="391" cy="264" r="3" fill="#FFFFFF"/>
    <path d="M344 292 Q362 304 380 290" stroke="#3A2A1E" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 杯身高光 -->
    <path d="M286 156 L296 372" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
    <path d="M310 160 L316 232" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
    <!-- 杯盖与封口 -->
    <rect x="254" y="120" width="212" height="26" rx="13" fill="#DB7186" stroke="#3A2A1E" stroke-width="9"/>
    <!-- 吸管 -->
    <path d="M396 84 L420 44 L448 56 L416 122" fill="#F2C230" stroke="#3A2A1E" stroke-width="8" stroke-linejoin="round"/>
    <path d="M400 100 L428 112 M408 82 L436 94" stroke="#3A2A1E" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 摇杯 -->
  <g transform="rotate(18 592 268)">
    <path d="M552 208 L632 208 L640 268 L544 268 Z" fill="#C9CFC7" stroke="#3A2A1E" stroke-width="8" stroke-linejoin="round"/>
    <rect x="544" y="268" width="96" height="72" rx="14" fill="#9AA3AD" stroke="#3A2A1E" stroke-width="8"/>
    <rect x="556" y="282" width="24" height="10" rx="5" fill="#FFFFFF" opacity="0.5"/>
    <path d="M560 236 Q592 224 624 236" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.55"/>
    <rect x="536" y="340" width="112" height="22" rx="11" fill="#6E7880" stroke="#3A2A1E" stroke-width="8"/>
  </g>
  <!-- 摇制弧线 -->
  <g stroke="#FFF2EA" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M508 200 Q524 176 548 166"/>
    <path d="M498 236 Q510 214 528 200" opacity="0.6"/>
  </g>

  <!-- 小料碗 -->
  <g stroke="#3A2A1E" stroke-linejoin="round">
    <path d="M96 352 Q100 336 118 336 L162 336 Q180 336 184 352 Z" fill="#E2A44E" stroke-width="7"/>
    <circle cx="122" cy="338" r="10" fill="#4E3826" stroke-width="5"/>
    <circle cx="142" cy="334" r="10" fill="#4E3826" stroke-width="5"/>
    <circle cx="160" cy="340" r="9" fill="#4E3826" stroke-width="5"/>
    <path d="M636 366 Q640 350 658 350 L702 350 Q720 350 724 366 Z" fill="#E8B45A" stroke-width="7"/>
    <rect x="656" y="334" width="18" height="18" rx="4" fill="#F2D8A0" stroke-width="5"/>
    <rect x="676" y="330" width="18" height="18" rx="4" fill="#F2D8A0" stroke-width="5" transform="rotate(12 685 339)"/>
  </g>

  <!-- 椰果粒散落 -->
  <g fill="#FFF6E8" stroke="#3A2A1E" stroke-width="4">
    <rect x="520" y="368" width="14" height="14" rx="4" transform="rotate(14 527 375)"/>
    <rect x="548" y="386" width="12" height="12" rx="4" transform="rotate(-10 554 392)"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
