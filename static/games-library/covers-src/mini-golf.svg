<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CB57E"/>
      <stop offset="0.55" stop-color="#449C63"/>
      <stop offset="1" stop-color="#317E4D"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#123A22" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#26653F" opacity="0.6"/>
  <rect y="394" width="800" height="6" fill="#1E5434" opacity="0.55"/>

  <!-- 星尘点缀 -->
  <g stroke="#E2F4E6" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M96 104 h10 M101 99 v10" stroke-width="3"/>
    <path d="M684 92 h12 M690 86 v12" stroke-width="3.4"/>
    <path d="M712 236 h9 M716.5 231.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M90 292 h9 M94.5 287.5 v9" stroke-width="2.6" opacity="0.6"/>
  </g>
  <g fill="#E2F4E6" opacity="0.5">
    <circle cx="170" cy="168" r="4"/><circle cx="640" cy="176" r="3.4"/>
    <circle cx="72" cy="216" r="3"/><circle cx="748" cy="186" r="2.6"/>
  </g>

  <!-- 果岭 -->
  <ellipse cx="400" cy="372" rx="342" ry="86" fill="#79C79A" stroke="#2C6B43" stroke-width="7"/>

  <!-- 沙坑 -->
  <ellipse cx="688" cy="392" rx="72" ry="15" fill="#E8D9A6" stroke="#C9B478" stroke-width="5"/>

  <!-- 球洞 -->
  <ellipse cx="556" cy="352" rx="36" ry="13" fill="#0E2A1C" stroke="#1E2620" stroke-width="7"/>

  <!-- 旗杆与旗 -->
  <path d="M556 352 L556 158" stroke="#1E2620" stroke-width="11" stroke-linecap="round"/>
  <path d="M556 352 L556 158" stroke="#F4F1E8" stroke-width="7" stroke-linecap="round"/>
  <path d="M556 158 L622 177 L556 200 Z" fill="#E04848" stroke="#1E2620" stroke-width="6" stroke-linejoin="round"/>

  <!-- 发球区球座阴影 -->
  <ellipse cx="268" cy="390" rx="64" ry="12" fill="#1E4E31" opacity="0.35"/>

  <!-- 高尔夫球（家族表情） -->
  <circle cx="268" cy="325" r="52" fill="#FFFFFF" stroke="#1E2620" stroke-width="9"/>
  <g fill="#DCE2DE">
    <circle cx="292" cy="300" r="4.2"/><circle cx="304" cy="322" r="4.2"/><circle cx="292" cy="344" r="4.2"/>
    <circle cx="268" cy="350" r="4.2"/><circle cx="246" cy="340" r="4.2"/><circle cx="308" cy="338" r="4.2"/>
  </g>
  <circle cx="250" cy="312" r="7.5" fill="#1F1A14"/>
  <circle cx="286" cy="312" r="7.5" fill="#1F1A14"/>
  <path d="M252 338 Q268 352 284 338" stroke="#1F1A14" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="250" cy="298" r="12" fill="#FFFFFF" opacity="0.7"/>

  <rect width="800" height="450" fill="url(#vign)"/>
