      <rect x="-26" y="-40" width="52" height="80" rx="6" fill="none" stroke="#EAF7EE" stroke-width="3" opacity="0.85"/>
      <path d="M0 -14 L14 0 L0 14 L-14 0 Z" fill="#EAF7EE" opacity="0.85"/>
    </g>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
