      <ellipse cx="232" cy="312" rx="32" ry="27" fill="#F2C99A" stroke="#3A2A1E" stroke-width="6"/>
      <circle cx="252" cy="296" r="9" fill="#F2C99A" stroke="#3A2A1E" stroke-width="5"/>
