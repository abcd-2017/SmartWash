  <circle cx="548" cy="88" r="6" fill="#C8465C" stroke="#3A2A1E" stroke-width="3.5"/>
  <circle cx="262" cy="120" r="5" fill="#2D9B6A" stroke="#3A2A1E" stroke-width="3.5"/>

