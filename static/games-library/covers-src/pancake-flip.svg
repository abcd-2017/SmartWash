<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4CE90"/>
      <stop offset="0.55" stop-color="#E2AC5C"/>
      <stop offset="1" stop-color="#C68E44"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5E3E14" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部灶台带 -->
  <rect y="392" width="800" height="58" fill="#A8702E" opacity="0.55"/>
  <rect y="392" width="800" height="6" fill="#96622A" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFF6E0" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M96 92 h11 M101.5 86.5 v11" stroke-width="3.2"/>
    <path d="M700 84 h12 M706 78 v12" stroke-width="3.4"/>
    <path d="M118 250 h9 M122.5 245.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M688 300 h9 M692.5 295.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFF6E0" opacity="0.55">
    <circle cx="170" cy="150" r="4"/><circle cx="646" cy="140" r="3.4"/><circle cx="72" cy="200" r="3"/><circle cx="736" cy="186" r="2.6"/>
  </g>

  <ellipse cx="430" cy="404" rx="240" ry="18" fill="#7E5218" opacity="0.35"/>

  <!-- 高度虚线 -->
  <path d="M430 210 V340" stroke="#FFF6E0" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 14" fill="none" opacity="0.75"/>
  <g stroke="#FFF6E0" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M414 176 H446 M414 190 H446"/>
  </g>

  <!-- 空中煎饼（签名表情） -->
  <g transform="rotate(-10 380 196)">
    <ellipse cx="380" cy="196" rx="96" ry="42" fill="#D89038" stroke="#3A2A1E" stroke-width="9"/>
    <ellipse cx="380" cy="188" rx="86" ry="34" fill="#E8B45A" stroke="#3A2A1E" stroke-width="6"/>
    <ellipse cx="352" cy="176" rx="30" ry="10" fill="#FFFFFF" opacity="0.4" transform="rotate(-6 352 176)"/>
    <circle cx="352" cy="188" r="8" fill="#1F1A14"/>
    <circle cx="408" cy="188" r="8" fill="#1F1A14"/>
    <circle cx="355" cy="185" r="3" fill="#FFFFFF"/>
    <circle cx="411" cy="185" r="3" fill="#FFFFFF"/>
    <path d="M356 206 Q380 222 404 204" stroke="#1F1A14" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="378" cy="216" rx="12" ry="7" fill="#C87830" stroke="#3A2A1E" stroke-width="4"/>
  </g>
  <!-- 翻面弧线 -->
  <path d="M282 220 Q240 120 340 88" stroke="#3A2A1E" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M322 74 L346 86 L340 110" stroke="#3A2A1E" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <path d="M498 176 Q540 130 500 92" stroke="#3A2A1E" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M488 100 L502 80 L522 96" stroke="#3A2A1E" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- 平底锅 -->
  <g>
    <ellipse cx="430" cy="356" rx="152" ry="42" fill="#4E565C" stroke="#3A2A1E" stroke-width="10"/>
    <ellipse cx="430" cy="348" rx="130" ry="30" fill="#3A4046" stroke="#3A2A1E" stroke-width="6"/>
    <ellipse cx="430" cy="346" rx="104" ry="22" fill="#556066"/>
    <ellipse cx="404" cy="342" rx="40" ry="10" fill="#FFFFFF" opacity="0.35"/>
    <path d="M578 332 L688 300" stroke="#3A2A1E" stroke-width="22" stroke-linecap="round"/>
    <path d="M578 332 L688 300" stroke="#7E5028" stroke-width="13" stroke-linecap="round"/>
    <circle cx="688" cy="300" r="10" fill="#3A2A1E"/>
  </g>
  <!-- 锅中糖浆反光 -->
  <path d="M340 350 Q380 362 424 352" stroke="#E8B45A" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- 力度提示 -->
  <g>
    <rect x="92" y="120" width="34" height="180" rx="17" fill="#F5F6F3" stroke="#3A2A1E" stroke-width="7"/>
    <rect x="99" y="210" width="20" height="82" rx="10" fill="#4ADE6E"/>
    <rect x="99" y="186" width="20" height="26" rx="10" fill="#E2A44E"/>
    <path d="M99 160 Q109 150 119 160" stroke="#3A2A1E" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- 油花 -->
  <g fill="#F2D8A0" stroke="#3A2A1E" stroke-width="4" opacity="0.9">
    <circle cx="600" cy="380" r="9"/><circle cx="632" cy="392" r="6"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
