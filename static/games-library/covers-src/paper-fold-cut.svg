  <ellipse cx="478" cy="222" rx="24" ry="17" fill="none" stroke="#DB7186" stroke-width="10" transform="rotate(-25 478 222)"/>
  <ellipse cx="486" cy="300" rx="24" ry="17" fill="none" stroke="#DB7186" stroke-width="10" transform="rotate(25 486 300)"/>

