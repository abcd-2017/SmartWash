  <g stroke-linecap="round">
    <path d="M415 262 L470 228" stroke="#7E8890" stroke-width="10" fill="none"/>
    <path d="M415 262 L478 292" stroke="#7E8890" stroke-width="10" fill="none"/>
    <path d="M415 262 L340 220" stroke="#7E8890" stroke-width="13" fill="none"/>
    <path d="M415 262 L348 302" stroke="#7E8890" stroke-width="13" fill="none"/>
