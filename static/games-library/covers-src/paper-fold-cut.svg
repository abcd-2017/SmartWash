  <path d="M265 150 V350" stroke="#B08A4E" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round"/>
  <path d="M265 232 Q243 196 221 216 Q206 234 226 260 L265 296" stroke="#DB7186" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="190" cy="176" r="11" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="243" cy="196" r="9" fill="#1F1A14"/>
  <circle cx="287" cy="196" r="9" fill="#1F1A14"/>
  <path d="M235 222 Q265 240 295 220" stroke="#1F1A14" stroke-width="6.5" fill="none" stroke-linecap="round"/>

