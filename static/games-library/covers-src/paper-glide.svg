<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9CDEE"/>
      <stop offset="0.55" stop-color="#7BA8D4"/>
      <stop offset="1" stop-color="#4E7FB0"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#22405E" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#3E6894" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#345C84" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 88 h11 M97.5 82.5 v11" stroke-width="3.2"/>
    <path d="M706 78 h12 M712 72 v12" stroke-width="3.4"/>
    <path d="M70 210 h9 M74.5 205.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M744 216 h9 M748.5 211.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF4FC" opacity="0.55">
    <circle cx="164" cy="140" r="4"/><circle cx="620" cy="120" r="3.4"/><circle cx="76" cy="290" r="3"/><circle cx="748" cy="300" r="2.6"/>
  </g>

  <!-- 云 -->
  <g fill="#FFFFFF" opacity="0.8">
    <ellipse cx="128" cy="236" rx="52" ry="20"/><ellipse cx="172" cy="224" rx="36" ry="15"/>
    <ellipse cx="688" cy="356" rx="48" ry="18"/><ellipse cx="724" cy="346" rx="30" ry="13"/>
  </g>

  <!-- 圆环阵（近大远小） -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="268" cy="150" rx="34" ry="42" stroke="#1E2620" stroke-width="16" opacity="0.55"/>
    <ellipse cx="268" cy="150" rx="34" ry="42" stroke="#8FD8B0" stroke-width="8"/>
    <ellipse cx="588" cy="188" rx="76" ry="92" stroke="#1E2620" stroke-width="22"/>
    <ellipse cx="588" cy="188" rx="76" ry="92" stroke="#2D9B6A" stroke-width="13"/>
    <ellipse cx="588" cy="188" rx="56" ry="72" stroke="#1E7E4E" stroke-width="5" opacity="0.5"/>
    <ellipse cx="708" cy="316" rx="48" ry="58" stroke="#1E2620" stroke-width="18" opacity="0.9"/>
    <ellipse cx="708" cy="316" rx="48" ry="58" stroke="#E2A44E" stroke-width="9"/>
  </g>
  <!-- 环高光 -->
  <path d="M540 130 Q560 106 596 100" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- 飞行轨迹 -->
  <path d="M96 320 Q180 268 268 214 Q340 172 420 190" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="3 18" opacity="0.85"/>

  <!-- 纸飞机（签名表情） -->
  <g transform="rotate(-12 430 218)">
    <path d="M330 240 L544 196 L472 252 Z" fill="#F5F6F3" stroke="#1E2620" stroke-width="8" stroke-linejoin="round"/>
    <path d="M472 252 L544 196 L500 286 Z" fill="#D8E2EA" stroke="#1E2620" stroke-width="8" stroke-linejoin="round"/>
    <path d="M330 240 L410 226 L442 236" fill="#FFFFFF" stroke="#1E2620" stroke-width="6" stroke-linejoin="round"/>
    <path d="M368 232 L500 210" stroke="#B8C4CE" stroke-width="4" opacity="0.8"/>
    <circle cx="446" cy="226" r="6" fill="#1E2620"/>
    <circle cx="470" cy="222" r="6" fill="#1E2620"/>
    <circle cx="448" cy="224" r="2.2" fill="#FFFFFF"/>
    <circle cx="472" cy="220" r="2.2" fill="#FFFFFF"/>
    <path d="M444 240 Q456 248 468 238" stroke="#1E2620" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="392" cy="218" rx="20" ry="7" fill="#FFFFFF" opacity="0.55" transform="rotate(-8 392 218)"/>
  </g>
  <!-- 速度线 -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <path d="M300 300 H372"/><path d="M282 326 H344"/>
  </g>

  <!-- 连击星星 -->
  <g fill="#F2C230" stroke="#1E2620" stroke-width="5" stroke-linejoin="round">
    <path d="M632 118 L641 140 L665 142 L647 157 L653 180 L632 168 L611 180 L617 157 L599 142 L623 140 Z"/>
  </g>
  <path d="M636 140 L660 144" stroke="#FFF2C0" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
