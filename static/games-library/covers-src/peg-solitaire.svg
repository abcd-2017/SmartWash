<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A6A4A"/>
      <stop offset="0.55" stop-color="#6F5339"/>
      <stop offset="1" stop-color="#57402B"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A2812" stop-opacity="0.3"/>
    </radialGradient>
    <pattern id="brd" width="52" height="52" patternUnits="userSpaceOnUse" x="244" y="94">
      <rect width="52" height="52" fill="#C9A06A"/>
      <circle cx="26" cy="26" r="13" fill="#3A2A1E"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#4A3520" opacity="0.6"/>
  <rect y="394" width="800" height="6" fill="#3C2B1A" opacity="0.55"/>

  <!-- 星尘点缀 -->
  <g stroke="#F0E2CC" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M96 104 h10 M101 99 v10" stroke-width="3"/>
    <path d="M690 92 h12 M696 86 v12" stroke-width="3.4"/>
    <path d="M716 220 h9 M720.5 215.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M84 260 h9 M88.5 255.5 v9" stroke-width="2.6" opacity="0.6"/>
  </g>
  <g fill="#F0E2CC" opacity="0.5">
    <circle cx="170" cy="168" r="4"/><circle cx="648" cy="176" r="3.4"/>
    <circle cx="70" cy="216" r="3"/><circle cx="748" cy="186" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="404" rx="250" ry="22" fill="#3E2C18" opacity="0.38"/>

  <!-- 十字棋盘 -->
  <path d="M244 198 H556 V302 H452 V406 H348 V302 H244 Z"
        fill="url(#brd)" stroke="#3A2A1E" stroke-width="9" stroke-linejoin="round"/>

  <!-- 棋子 -->
  <g stroke="#3A2A1E" stroke-width="6">
    <circle cx="296" cy="120" r="16" fill="#E8C88A"/>
    <circle cx="348" cy="120" r="16" fill="#E8C88A"/>
    <circle cx="400" cy="120" r="16" fill="#E8C88A"/>
    <circle cx="244" cy="224" r="16" fill="#E8C88A"/>
    <circle cx="296" cy="224" r="16" fill="#E8C88A"/>
    <circle cx="244" cy="276" r="16" fill="#E8C88A"/>
    <circle cx="504" cy="224" r="16" fill="#E8C88A"/>
    <circle cx="556" cy="276" r="16" fill="#E8C88A"/>
    <circle cx="400" cy="380" r="16" fill="#E8C88A"/>
    <circle cx="452" cy="380" r="16" fill="#E8C88A"/>
  </g>
  <g fill="#FFFFFF" opacity="0.35">
    <circle cx="290" cy="114" r="5"/><circle cx="342" cy="114" r="5"/><circle cx="394" cy="114" r="5"/>
    <circle cx="238" cy="218" r="5"/><circle cx="290" cy="218" r="5"/><circle cx="238" cy="270" r="5"/>
    <circle cx="498" cy="218" r="5"/><circle cx="550" cy="270" r="5"/>
    <circle cx="394" cy="374" r="5"/><circle cx="446" cy="374" r="5"/>
  </g>

  <!-- 主棋子（家族表情） -->
  <circle cx="400" cy="250" r="22" fill="#E8C88A" stroke="#3A2A1E" stroke-width="8"/>
  <circle cx="400" cy="250" r="22" fill="url(#gloss)"/>
  <circle cx="391" cy="243" r="5" fill="#3A2A1E"/>
  <circle cx="409" cy="243" r="5" fill="#3A2A1E"/>
  <path d="M390 259 Q400 268 410 259" stroke="#3A2A1E" stroke-width="5" fill="none" stroke-linecap="round"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
