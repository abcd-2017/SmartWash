<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E7E8E"/>
      <stop offset="0.55" stop-color="#2F6673"/>
      <stop offset="1" stop-color="#23505A"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#12333B" stop-opacity="0.3"/>
    </radialGradient>
    <pattern id="net" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 0 L26 26 M26 0 L0 26" stroke="#FFFFFF" stroke-width="2"/>
    </pattern>
    <clipPath id="ball"><circle cx="400" cy="292" r="60"/></clipPath>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#1E4A56" opacity="0.6"/>
  <rect y="394" width="800" height="6" fill="#183E48" opacity="0.55"/>

  <!-- 星尘点缀 -->
  <g stroke="#D8EEF0" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M96 104 h10 M101 99 v10" stroke-width="3"/>
    <path d="M690 92 h12 M696 86 v12" stroke-width="3.4"/>
    <path d="M716 220 h9 M720.5 215.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M84 260 h9 M88.5 255.5 v9" stroke-width="2.6" opacity="0.6"/>
  </g>
  <g fill="#D8EEF0" opacity="0.5">
    <circle cx="170" cy="168" r="4"/><circle cx="648" cy="176" r="3.4"/>
    <circle cx="70" cy="216" r="3"/><circle cx="748" cy="186" r="2.6"/>
  </g>

  <!-- 球门网 -->
  <rect x="184" y="134" width="432" height="240" fill="url(#net)" opacity="0.32"/>
  <!-- 球门框架 -->
  <g stroke="#1E2620" stroke-width="16" fill="none" stroke-linecap="round">
    <path d="M184 134 H616 V374"/>
  </g>
  <g stroke="#F4F1E8" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M184 134 H616 V374"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="372" rx="86" ry="14" fill="#173E47" opacity="0.4"/>

  <!-- 足球 -->
  <g clip-path="url(#ball)">
    <circle cx="400" cy="292" r="60" fill="#FFFFFF"/>
    <g fill="#2A2F38">
      <g transform="translate(400 292) rotate(-90)">
        <polygon points="0,-22 20.95,-6.81 13.09,17.82 -13.09,17.82 -20.95,-6.81"/>
      </g>
      <g transform="translate(400 254) rotate(-90)"><polygon points="0,-22 20.95,-6.81 13.09,17.82 -13.09,17.82 -20.95,-6.81"/></g>
      <g transform="translate(436 280) rotate(-90)"><polygon points="0,-22 20.95,-6.81 13.09,17.82 -13.09,17.82 -20.95,-6.81"/></g>
      <g transform="translate(422 322) rotate(-90)"><polygon points="0,-22 20.95,-6.81 13.09,17.82 -13.09,17.82 -20.95,-6.81"/></g>
      <g transform="translate(378 322) rotate(-90)"><polygon points="0,-22 20.95,-6.81 13.09,17.82 -13.09,17.82 -20.95,-6.81"/></g>
      <g transform="translate(364 280) rotate(-90)"><polygon points="0,-22 20.95,-6.81 13.09,17.82 -13.09,17.82 -20.95,-6.81"/></g>
    </g>
    <circle cx="400" cy="292" r="60" fill="url(#gloss)"/>
  </g>
  <circle cx="400" cy="292" r="60" fill="none" stroke="#1E2620" stroke-width="9"/>
  <!-- 表情 -->
  <circle cx="383" cy="284" r="7" fill="#1F1A14"/>
  <circle cx="417" cy="284" r="7" fill="#1F1A14"/>
  <path d="M386 310 Q400 322 414 310" stroke="#1F1A14" stroke-width="6" fill="none" stroke-linecap="round"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
