  <path d="M400 70 L286 400 M400 70 L514 400 M320 320 H480" stroke="#6E5330" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="400" cy="72" r="16" fill="#8F6A3A" stroke="#3A2A1E" stroke-width="7"/>

