<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2F1E8"/>
      <stop offset="0.55" stop-color="#C9E5D4"/>
      <stop offset="1" stop-color="#B1D6C2"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E6B4E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#9CC6AF" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#88B29C" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M86 92 h11 M91.5 86.5 v11" stroke-width="3.2"/>
    <path d="M706 84 h12 M712 78 v12" stroke-width="3.4"/>
    <path d="M740 268 h9 M744.5 263.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M58 250 h9 M62.5 245.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF6EE" opacity="0.55">
    <circle cx="136" cy="140" r="4"/><circle cx="742" cy="150" r="3.4"/><circle cx="64" cy="200" r="3"/><circle cx="120" cy="330" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="420" cy="406" rx="256" ry="22" fill="#5E9478" opacity="0.35"/>

  <!-- 拼音横线格卡（上） -->
  <rect x="140" y="60" width="520" height="142" rx="16" fill="#FBF7E8" stroke="#3A2A1E" stroke-width="9"/>
  <g stroke-linejoin="round">
    <rect x="170" y="88" width="110" height="88" rx="10" fill="#EFF4E6" stroke="#C9C2A8" stroke-width="5"/>
    <rect x="300" y="88" width="110" height="88" rx="10" fill="#EFF4E6" stroke="#C9C2A8" stroke-width="5"/>
    <rect x="430" y="88" width="110" height="88" rx="10" fill="#EFF4E6" stroke="#C9C2A8" stroke-width="5"/>
    <rect x="560" y="88" width="70" height="88" rx="10" fill="#FFFFFF" stroke="#17734A" stroke-width="5" stroke-dasharray="9 7"/>
  </g>
  <!-- 音节刻痕：短横 + 声调符 -->
  <g stroke-linecap="round" fill="none">
    <path d="M198 148 H252" stroke="#6B7A6F" stroke-width="9"/>
    <path d="M210 122 H240" stroke="#17734A" stroke-width="7"/>
    <path d="M328 150 H382" stroke="#6B7A6F" stroke-width="9"/>
    <path d="M326 138 L366 118" stroke="#17734A" stroke-width="7"/>
    <path d="M458 150 H512" stroke="#6B7A6F" stroke-width="9"/>
    <path d="M462 122 L486 140 L508 122" stroke="#17734A" stroke-width="7"/>
    <path d="M582 146 H620" stroke="#B7AA8A" stroke-width="8"/>
    <path d="M590 118 L614 134" stroke="#B7AA8A" stroke-width="7"/>
  </g>
  <circle cx="162" cy="80" r="10" fill="#FFFFFF" opacity="0.4"/>

  <!-- 汉字块槽位（下） -->
  <g stroke-linejoin="round">
    <rect x="190" y="248" width="100" height="100" rx="16" fill="#2D9B6A" stroke="#3A2A1E" stroke-width="8"/>
    <rect x="310" y="248" width="100" height="100" rx="16" fill="#3FAE7A" stroke="#3A2A1E" stroke-width="8"/>
    <rect x="430" y="248" width="100" height="100" rx="16" fill="#F2B34C" stroke="#3A2A1E" stroke-width="8"/>
    <rect x="550" y="248" width="100" height="100" rx="16" fill="#FFFFFF" stroke="#17734A" stroke-width="6" stroke-dasharray="11 9"/>
    <g stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M212 288 H268 M212 308 H244" stroke="#FFFFFF"/>
      <path d="M332 288 H388 M360 288 V328" stroke="#FFFFFF"/>
      <path d="M452 292 H508 M452 314 H480" stroke="#3A2A1E" opacity="0.72"/>
    </g>
  </g>

  <!-- 飞入的字块（签名表情） -->
  <g stroke-linejoin="round">
    <rect x="548" y="164" width="94" height="94" rx="16" fill="#E88B5A" stroke="#3A2A1E" stroke-width="8" transform="rotate(-6 595 211)"/>
    <circle cx="574" cy="200" r="8" fill="#1F1A14"/>
    <circle cx="606" cy="198" r="8" fill="#1F1A14"/>
    <path d="M580 220 Q592 230 602 219" stroke="#1F1A14" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="566" cy="184" r="8" fill="#FFFFFF" opacity="0.4"/>
  </g>
  <path d="M596 266 V286" stroke="#17734A" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 8" fill="none" opacity="0.85"/>
  <path d="M498 150 h11 M503.5 144.5 v11" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
