<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2DCD3"/>
      <stop offset="0.55" stop-color="#C1CEC3"/>
      <stop offset="1" stop-color="#AFBDAF"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#677A6B" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="392" width="800" height="58" fill="#9DAB9C" opacity="0.7"/>
  <rect y="392" width="800" height="6" fill="#89978A" opacity="0.6"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M112 104 h10 M117 99 v10" stroke-width="3"/>
    <path d="M678 96 h12 M684 90 v12" stroke-width="3.4"/>
    <path d="M706 240 h9 M710.5 235.5 v9" stroke-width="2.6" opacity="0.75"/>
    <path d="M96 278 h9 M100.5 273.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="192" cy="160" r="4"/><circle cx="646" cy="176" r="3.4"/><circle cx="76" cy="210" r="3"/><circle cx="726" cy="162" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="402" cy="398" rx="280" ry="24" fill="#7E8F7E" opacity="0.35"/>

  <!-- 管路 -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M96 178 L268 178 Q290 178 290 200 L290 280 Q290 302 312 302 L460 302 Q482 302 482 280 L482 162 Q482 140 504 140 L688 140"
          stroke="#3E4A3E" stroke-width="30"/>
    <path d="M96 178 L268 178 Q290 178 290 200 L290 280 Q290 302 312 302 L460 302 Q482 302 482 280 L482 162 Q482 140 504 140 L688 140"
          stroke="#9BA89C" stroke-width="18"/>
    <path d="M96 172 L268 172 Q284 172 284 190 L284 280 Q284 296 306 296 L460 296 Q476 296 476 280 L476 162 Q476 146 504 146 L688 146"
          stroke="#FFFFFF" stroke-width="4" opacity="0.35"/>
  </g>
  <!-- 法兰接头 -->
  <g fill="#7E8B7F" stroke="#3E4A3E" stroke-width="6">
    <rect x="180" y="158" width="18" height="40" rx="5"/>
    <rect x="374" y="282" width="18" height="40" rx="5"/>
    <rect x="600" y="120" width="18" height="40" rx="5"/>
  </g>
  <!-- 管口终点 -->
  <circle cx="694" cy="140" r="17" fill="#7E8B7F" stroke="#3E4A3E" stroke-width="6"/>

  <!-- 绿色阀门圈（带表情） -->
  <g>
    <circle cx="290" cy="240" r="34" fill="#5FAE5B" stroke="#2A3A2C" stroke-width="8"/>
    <circle cx="290" cy="240" r="24" fill="none" stroke="#2A3A2C" stroke-width="5"/>
    <path d="M290 206 L290 218 M290 262 L290 274 M266 240 L278 240 M302 240 L314 240" stroke="#2A3A2C" stroke-width="5"/>
    <circle cx="281" cy="234" r="5" fill="#1F3A1E"/>
    <circle cx="299" cy="234" r="5" fill="#1F3A1E"/>
    <circle cx="283" cy="232" r="1.8" fill="#FFFFFF"/>
    <circle cx="301" cy="232" r="1.8" fill="#FFFFFF"/>
    <path d="M282 248 Q290 254 298 247" stroke="#1F3A1E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="274" cy="222" r="6" fill="#FFFFFF" opacity="0.45"/>
