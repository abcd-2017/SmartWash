    <circle cx="272" cy="384" r="5" fill="#F2994E" opacity="0.7"/>
    <circle cx="306" cy="386" r="4" fill="#F2994E" opacity="0.6"/>
  </g>
  <!-- 漏滴 2：右上水平管下方 -->
  <g>
    <path d="M588 168 C 593 176 600 182 600 190 A 12 12 0 1 1 576 190 C 576 182 583 176 588 168 Z"
          fill="#F2994E" stroke="#8A4A1E" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="570" cy="210" r="5" fill="#F2994E" opacity="0.7"/>
    <circle cx="604" cy="212" r="4" fill="#F2994E" opacity="0.6"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
