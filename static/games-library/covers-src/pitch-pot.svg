    <path d="M356 246 Q314 254 328 296" stroke="#4A3520" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M356 246 Q314 254 328 296" stroke="#A87944" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M460 246 Q502 254 488 296" stroke="#4A3520" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M460 246 Q502 254 488 296" stroke="#A87944" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- 壶足 -->
    <rect x="374" y="352" width="68" height="24" rx="8" fill="#8F6435" stroke="#4A3520" stroke-width="7"/>
    <!-- 壶身 -->
    <path d="M388 182 L384 238 Q346 264 346 304 Q346 344 388 358 L428 358 Q470 344 470 304 Q470 264 432 238 L428 182 Z"
          fill="#B98A4E" stroke="#4A3520" stroke-width="9" stroke-linejoin="round"/>
    <path d="M388 182 L384 238 Q346 264 346 304 Q346 344 388 358 L428 358 Q470 344 470 304 Q470 264 432 238 L428 182 Z"
          fill="url(#gloss)"/>
    <!-- 弦纹 -->
    <path d="M366 268 Q408 282 450 268" stroke="#8F6435" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 口沿 -->
    <ellipse cx="408" cy="180" rx="38" ry="12" fill="#C79A5C" stroke="#4A3520" stroke-width="8"/>
    <!-- 表情 -->
    <circle cx="390" cy="308" r="9" fill="#3A2A1E"/>
    <circle cx="426" cy="308" r="9" fill="#3A2A1E"/>
    <circle cx="393" cy="305" r="3" fill="#FFFFFF"/>
    <circle cx="429" cy="305" r="3" fill="#FFFFFF"/>
    <path d="M396 328 Q408 338 420 326" stroke="#3A2A1E" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="376" cy="320" r="7" fill="#E88A6A" opacity="0.5"/>
    <circle cx="440" cy="320" r="7" fill="#E88A6A" opacity="0.5"/>
  </g>

  <!-- 入壶的箭 1 -->
  <g>
    <path d="M408 210 L408 106" stroke="#6B4A20" stroke-width="8" stroke-linecap="round"/>
    <path d="M398 110 L408 88 L418 110 Z" fill="#8C8268" stroke="#4A3520" stroke-width="5" stroke-linejoin="round"/>
    <path d="M396 132 L420 132" stroke="#E8683A" stroke-width="8" stroke-linecap="round"/>
    <path d="M398 122 L418 122" stroke="#F2A93B" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
