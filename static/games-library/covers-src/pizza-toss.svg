<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D98070"/>
      <stop offset="0.55" stop-color="#C05E4E"/>
      <stop offset="1" stop-color="#A04436"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5E2418" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部操作台带 -->
  <rect y="392" width="800" height="58" fill="#8A3828" opacity="0.55"/>
  <rect y="392" width="800" height="6" fill="#7A3022" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFE8DC" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 92 h11 M97.5 86.5 v11" stroke-width="3.2"/>
    <path d="M706 86 h12 M712 80 v12" stroke-width="3.4"/>
    <path d="M64 210 h9 M68.5 205.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M736 216 h9 M740.5 211.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFE8DC" opacity="0.5">
    <circle cx="160" cy="146" r="4"/><circle cx="648" cy="130" r="3.4"/><circle cx="70" cy="160" r="3"/><circle cx="742" cy="166" r="2.6"/>
  </g>

  <ellipse cx="400" cy="408" rx="250" ry="18" fill="#5E2418" opacity="0.35"/>

  <!-- 旋转面饼（主视觉，签名表情） -->
  <g>
    <ellipse cx="400" cy="322" rx="192" ry="72" fill="#E8B45A" stroke="#3A2A1E" stroke-width="10"/>
    <ellipse cx="400" cy="316" rx="164" ry="58" fill="#F2D8A7" stroke="#3A2A1E" stroke-width="7"/>
    <ellipse cx="400" cy="316" rx="136" ry="46" fill="#D96A50" stroke="#C05440" stroke-width="6"/>
    <ellipse cx="352" cy="300" rx="46" ry="14" fill="#FFFFFF" opacity="0.35" transform="rotate(-6 352 300)"/>
    <!-- 饼上已落的配料 -->
    <circle cx="356" cy="322" r="15" fill="#C8402E" stroke="#3A2A1E" stroke-width="5"/>
    <ellipse cx="436" cy="308" rx="17" ry="12" fill="#4E3826" stroke="#3A2A1E" stroke-width="5"/>
    <circle cx="408" cy="334" r="11" fill="none" stroke="#3E8E3C" stroke-width="7"/>
    <!-- 表情 -->
    <circle cx="366" cy="312" r="9" fill="#1F1A14"/>
    <circle cx="434" cy="312" r="9" fill="#1F1A14"/>
    <circle cx="369" cy="309" r="3" fill="#FFFFFF"/>
    <circle cx="437" cy="309" r="3" fill="#FFFFFF"/>
    <path d="M376 334 Q400 350 424 332" stroke="#1F1A14" stroke-width="6.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 旋转弧线 -->
  <path d="M168 300 Q140 258 190 220" stroke="#FFE8DC" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M180 234 L196 214 L216 234" stroke="#FFE8DC" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M632 300 Q664 260 618 222" stroke="#FFE8DC" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M608 236 L622 214 L644 230" stroke="#FFE8DC" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- 下落配料 -->
  <g stroke="#1E2620" stroke-linejoin="round">
    <!-- 口蘑 -->
    <path d="M238 96 Q238 66 274 66 Q310 66 310 96 L296 96 L296 112 Q296 118 288 118 L260 118 Q252 118 252 112 L252 96 Z" fill="#FFF2DC" stroke-width="7"/>
    <path d="M254 78 Q274 70 294 78" stroke="#D8B488" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 意肠 -->
    <circle cx="560" cy="92" r="26" fill="#C8402E" stroke-width="7"/>
    <path d="M548 84 Q560 78 572 84 M548 100 Q560 106 572 100" stroke="#8E2418" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- 青椒圈 -->
    <circle cx="330" cy="182" r="22" fill="none" stroke-width="10" stroke="#3E8E3C"/>
    <circle cx="330" cy="182" r="22" fill="none" stroke-width="3" stroke="#1E2620"/>
    <!-- 黑橄榄 -->
    <ellipse cx="488" cy="170" rx="16" ry="20" fill="#4E3826" stroke-width="6"/>
    <ellipse cx="488" cy="164" rx="6" ry="8" fill="#6E5240"/>
    <!-- 罗勒叶 -->
    <path d="M600 210 Q614 180 646 178 Q644 210 616 222 Q604 220 600 210 Z" fill="#4E9E4C" stroke-width="6"/>
  </g>
  <!-- 下落轨迹 -->
  <path d="M274 40 V56 M560 42 V54 M330 138 V152 M488 128 V142" stroke="#FFE8DC" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- 接饼师双手 -->
  <g>
    <circle cx="196" cy="388" r="24" fill="#F5DCC4" stroke="#3A2A1E" stroke-width="8"/>
    <circle cx="604" cy="388" r="24" fill="#F5DCC4" stroke="#3A2A1E" stroke-width="8"/>
    <path d="M216 372 L240 356 M584 372 L560 356" stroke="#3A2A1E" stroke-width="9" stroke-linecap="round"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
