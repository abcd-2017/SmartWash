<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6ECDC"/>
      <stop offset="0.55" stop-color="#AED8BC"/>
      <stop offset="1" stop-color="#84BC98"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E6E46" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部桌面带 -->
  <rect y="394" width="800" height="56" fill="#6EA482" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#5E9472" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 92 h11 M97.5 86.5 v11" stroke-width="3.2"/>
    <path d="M706 84 h12 M712 78 v12" stroke-width="3.4"/>
    <path d="M62 220 h9 M66.5 215.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M738 226 h9 M742.5 221.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="158" cy="148" r="4"/><circle cx="650" cy="130" r="3.4"/><circle cx="70" cy="176" r="3"/><circle cx="742" cy="172" r="2.6"/>
  </g>

  <ellipse cx="400" cy="406" rx="270" ry="18" fill="#3E7E56" opacity="0.32"/>

  <!-- 袖珍球盘 -->
  <rect x="128" y="112" width="544" height="272" rx="30" fill="#B48A52" stroke="#3A2A1E" stroke-width="11"/>
  <rect x="152" y="136" width="496" height="224" rx="20" fill="#7EBC8E" stroke="#3A2A1E" stroke-width="8"/>
  <!-- 盘角铆钉 -->
  <g fill="#E2A44E" stroke="#3A2A1E" stroke-width="6">
    <circle cx="152" cy="136" r="10"/><circle cx="648" cy="136" r="10"/>
    <circle cx="152" cy="360" r="10"/><circle cx="648" cy="360" r="10"/>
  </g>
  <!-- 果岭纹 -->
  <path d="M180 200 Q280 182 380 202 M420 320 Q500 300 610 318" stroke="#5EA46E" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- 小沙坑 -->
  <ellipse cx="228" cy="330" rx="44" ry="14" fill="#E8D9A6" stroke="#C9B478" stroke-width="5"/>

  <!-- 球洞与小旗 -->
  <ellipse cx="560" cy="252" rx="34" ry="13" fill="#123A26" stroke="#1E2620" stroke-width="7"/>
  <path d="M560 250 L560 168" stroke="#1E2620" stroke-width="9" stroke-linecap="round"/>
  <path d="M560 168 L606 181 L560 196 Z" fill="#E04848" stroke="#1E2620" stroke-width="6" stroke-linejoin="round"/>

  <!-- 推杆 -->
  <g>
    <path d="M210 96 L360 262" stroke="#3A2A1E" stroke-width="18" stroke-linecap="round"/>
    <path d="M210 96 L360 262" stroke="#C9CFC7" stroke-width="10" stroke-linecap="round"/>
    <rect x="186" y="76" width="44" height="26" rx="12" fill="#E2A44E" stroke="#3A2A1E" stroke-width="7" transform="rotate(34 208 89)"/>
    <rect x="330" y="252" width="64" height="30" rx="10" fill="#2D9B6A" stroke="#3A2A1E" stroke-width="8" transform="rotate(52 362 267)"/>
  </g>

  <!-- 小球（签名表情） -->
  <circle cx="430" cy="250" r="34" fill="#FFFFFF" stroke="#1E2620" stroke-width="9"/>
  <circle cx="430" cy="250" r="34" fill="url(#gloss)"/>
  <g fill="#DCE2DE">
    <circle cx="452" cy="230" r="4"/><circle cx="462" cy="248" r="4"/><circle cx="452" cy="266" r="4"/>
    <circle cx="430" cy="272" r="4"/><circle cx="410" cy="266" r="4"/>
  </g>
  <circle cx="418" cy="242" r="7" fill="#1F1A14"/>
  <circle cx="446" cy="242" r="7" fill="#1F1A14"/>
  <path d="M418 264 Q432 276 446 262" stroke="#1F1A14" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="416" cy="228" r="11" fill="#FFFFFF" opacity="0.7"/>
  <!-- 瞄准虚线 -->
  <path d="M470 250 Q512 250 522 252" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 12" fill="none" opacity="0.85"/>

  <!-- 加分星星 -->
  <g fill="#F2C230" stroke="#3A2A1E" stroke-width="5" stroke-linejoin="round">
    <path d="M300 176 L309 198 L333 200 L315 215 L321 238 L300 226 L279 238 L285 215 L267 200 L291 198 Z"/>
    <path d="M588 322 L594 336 L610 337 L598 347 L602 363 L588 355 L574 363 L578 347 L566 337 L582 336 Z"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
