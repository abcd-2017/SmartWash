<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93AEC2"/>
      <stop offset="0.55" stop-color="#7291A8"/>
      <stop offset="1" stop-color="#587690"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2A3E52" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部街道带 -->
  <rect y="398" width="800" height="52" fill="#4A6378" opacity="0.6"/>
  <path d="M60 432 H740" stroke="#D9D4C8" stroke-width="8" stroke-linecap="round" stroke-dasharray="40 34" opacity="0.5" fill="none"/>
  <!-- 星尘点缀 -->
  <g stroke="#F5F6F3" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M96 84 h11 M101.5 78.5 v11" stroke-width="3.2"/>
    <path d="M700 76 h12 M706 70 v12" stroke-width="3.4"/>
    <path d="M724 210 h9 M728.5 205.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M70 220 h9 M74.5 215.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <!-- 速度线 -->
  <g stroke="#F5F6F3" stroke-width="8" stroke-linecap="round" opacity="0.5">
    <path d="M120 130 H260"/><path d="M135 180 H270"/><path d="M150 240 H285"/>
  </g>
  <!-- 扬尘 -->
  <circle cx="250" cy="432" r="16" fill="#F5F6F3" opacity="0.5"/>
  <circle cx="282" cy="440" r="11" fill="#F5F6F3" opacity="0.5"/>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="442" rx="190" ry="12" fill="#22344A" opacity="0.35"/>

  <!-- 角色（后侧手臂） -->
  <path d="M498 168 L560 205" stroke="#E2A44E" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="566" cy="208" r="12" fill="#F2E2C8" stroke="#1E2620" stroke-width="6"/>
  <!-- 躯干与腿 -->
  <path d="M492 148 L438 232" stroke="#E2A44E" stroke-width="30" stroke-linecap="round" fill="none"/>
  <path d="M438 235 L398 288" stroke="#4E5E54" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M438 235 L462 278" stroke="#4E5E54" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M378 292 L420 292" stroke="#1E2620" stroke-width="10" stroke-linecap="round"/>
  <path d="M448 282 L482 282" stroke="#1E2620" stroke-width="10" stroke-linecap="round"/>
  <!-- 头（签名表情） -->
  <circle cx="505" cy="95" r="54" fill="#F2E2C8" stroke="#1E2620" stroke-width="9"/>
  <circle cx="482" cy="68" r="12" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="492" cy="86" r="8" fill="#1F1A14"/>
  <circle cx="522" cy="86" r="8" fill="#1F1A14"/>
  <path d="M486 108 Q507 122 528 106" stroke="#1F1A14" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- 前侧手臂握把 -->
  <path d="M485 162 L402 190" stroke="#E2A44E" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="400" cy="190" r="12" fill="#F2E2C8" stroke="#1E2620" stroke-width="6"/>
  <!-- 弹簧杆 -->
  <path d="M368 190 L432 190" stroke="#2D9B6A" stroke-width="14" stroke-linecap="round"/>
  <circle cx="368" cy="190" r="9" fill="#1E2620"/>
  <circle cx="432" cy="190" r="9" fill="#1E2620"/>
  <path d="M400 196 L394 396" stroke="#2D9B6A" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M394 398 L416 408 L374 416 L416 424 L374 432 L392 440" stroke="#8A8F96" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M360 442 L426 442" stroke="#1E2620" stroke-width="12" stroke-linecap="round"/>
  <!-- 弹跳弧 -->
  <path d="M345 405 Q330 425 340 442" stroke="#F5F6F3" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M445 400 Q462 420 452 440" stroke="#F5F6F3" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>

  <rect width="800" height="450" fill="url(#vign)"/>
