<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFF4E3"/>
      <stop offset="0.55" stop-color="#DAE9CD"/>
      <stop offset="1" stop-color="#C2DEC0"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A6B46" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#AACBAA" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#96B796" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 96 h11 M97.5 90.5 v11" stroke-width="3.2"/>
    <path d="M704 84 h12 M710 78 v12" stroke-width="3.4"/>
    <path d="M740 270 h9 M744.5 265.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M62 286 h9 M66.5 281.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#F2F7E2" opacity="0.55">
    <circle cx="140" cy="160" r="4"/><circle cx="730" cy="180" r="3.4"/><circle cx="70" cy="200" r="3"/><circle cx="752" cy="340" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="420" cy="406" rx="260" ry="22" fill="#6E9468" opacity="0.35"/>

  <!-- 卷轴卡片（挖空句） -->
  <rect x="156" y="94" width="44" height="282" rx="22" fill="#E9C87E" stroke="#3A2A1E" stroke-width="8"/>
  <rect x="180" y="110" width="440" height="250" rx="16" fill="#FBF7E8" stroke="#3A2A1E" stroke-width="9"/>
  <path d="M214 160 H470" stroke="#B9CDBC" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M214 270 H470" stroke="#B9CDBC" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M214 215 H336" stroke="#B9CDBC" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M462 215 H556" stroke="#B9CDBC" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- 挖空槽 -->
  <rect x="352" y="192" width="96" height="46" rx="10" fill="#FFFFFF" stroke="#17734A" stroke-width="6" stroke-dasharray="10 8"/>
  <circle cx="196" cy="132" r="10" fill="#FFFFFF" opacity="0.4"/>

  <!-- 填入的答案砖（签名表情） -->
  <g stroke-linejoin="round">
    <rect x="360" y="100" width="80" height="80" rx="14" fill="#2D9B6A" stroke="#3A2A1E" stroke-width="8"/>
    <circle cx="384" cy="132" r="8" fill="#1F1A14"/>
    <circle cx="416" cy="132" r="8" fill="#1F1A14"/>
    <path d="M390 152 Q400 162 410 151" stroke="#1F1A14" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="376" cy="116" r="7" fill="#FFFFFF" opacity="0.4"/>
  </g>
  <path d="M400 186 V206" stroke="#17734A" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 8" fill="none" opacity="0.85"/>
  <path d="M318 92 h12 M324 86 v12" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- 候选词条（一划掉一备选） -->
  <g stroke-linejoin="round">
    <rect x="648" y="140" width="96" height="46" rx="12" fill="#F6F3E8" stroke="#3A2A1E" stroke-width="6"/>
    <path d="M666 156 H726" stroke="#8A9A8C" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M668 172 L716 190 M716 172 L668 190" stroke="#C9453C" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="648" y="210" width="96" height="46" rx="12" fill="#DFF0E4" stroke="#17734A" stroke-width="6"/>
    <path d="M666 226 H726" stroke="#17734A" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M672 258 l10 10 l20 -20" stroke="#17734A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
