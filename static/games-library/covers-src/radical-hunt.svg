    <rect x="402" y="84" width="88" height="88" rx="12" fill="#F7D774" stroke="#3A2A1E" stroke-width="7"/>
    <rect x="504" y="84" width="88" height="88" rx="12" fill="#F6F3E8" stroke="#3A2A1E" stroke-width="6"/>
    <rect x="606" y="84" width="88" height="88" rx="12" fill="#EFF2E2" stroke="#3A2A1E" stroke-width="6"/>
    <rect x="300" y="186" width="88" height="88" rx="12" fill="#EFF2E2" stroke="#3A2A1E" stroke-width="6"/>
    <rect x="402" y="186" width="88" height="88" rx="12" fill="#F6F3E8" stroke="#3A2A1E" stroke-width="6"/>
    <rect x="504" y="186" width="88" height="88" rx="12" fill="#EFF2E2" stroke="#3A2A1E" stroke-width="6"/>
    <rect x="606" y="186" width="88" height="88" rx="12" fill="#F6F3E8" stroke="#3A2A1E" stroke-width="6"/>
    <rect x="300" y="288" width="88" height="88" rx="12" fill="#F6F3E8" stroke="#3A2A1E" stroke-width="6"/>
    <rect x="402" y="288" width="88" height="88" rx="12" fill="#EFF2E2" stroke="#3A2A1E" stroke-width="6"/>
    <rect x="504" y="288" width="88" height="88" rx="12" fill="#F6F3E8" stroke="#3A2A1E" stroke-width="6"/>
    <rect x="606" y="288" width="88" height="88" rx="12" fill="#EFF2E2" stroke="#3A2A1E" stroke-width="6"/>
