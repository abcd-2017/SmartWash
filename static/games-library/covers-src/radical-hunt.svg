  <!-- 放大镜（主视觉，签名表情在镜片上） -->
  <g>
    <path d="M292 322 L186 428" stroke="#3A2A1E" stroke-width="36" stroke-linecap="round" fill="none"/>
    <path d="M292 322 L186 428" stroke="#A87944" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="235" cy="255" r="95" fill="url(#glass)" stroke="#3A2A1E" stroke-width="10"/>
    <circle cx="235" cy="255" r="82" fill="none" stroke="#E9C87E" stroke-width="5" opacity="0.85"/>
    <!-- 签名表情 -->
    <circle cx="206" cy="238" r="10" fill="#1F1A14"/>
    <circle cx="266" cy="238" r="10" fill="#1F1A14"/>
    <path d="M212 264 Q238 284 262 262" stroke="#1F1A14" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M176 202 Q206 178 244 184" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.5"/>
    <circle cx="182" cy="216" r="7" fill="#FFFFFF" opacity="0.4"/>
