      <path d="M324 112 H364 M344 128 H364 M324 146 H356"/>
      <path d="M528 108 H568 M528 130 H568 M548 130 V152"/>
      <path d="M630 112 H670 M640 132 H660 M630 148 H670"/>
      <path d="M324 210 H364 M324 232 H364 M324 254 H344"/>
      <path d="M426 208 H466 M446 208 V254"/>
      <path d="M528 214 H568 M528 236 H556"/>
      <path d="M630 210 H670 M630 232 H670 M640 254 H660"/>
      <path d="M426 310 H466 M426 332 H466 M446 354 H466"/>
      <path d="M528 312 H568 M548 312 V354"/>
      <path d="M630 314 H670 M630 336 H658"/>
