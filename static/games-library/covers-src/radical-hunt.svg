<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E1F0E6"/>
      <stop offset="0.55" stop-color="#C9E5D5"/>
      <stop offset="1" stop-color="#B2D6C3"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E6B4E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#9CC3AC" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#88B29B" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M84 92 h11 M89.5 86.5 v11" stroke-width="3.2"/>
    <path d="M714 76 h12 M720 70 v12" stroke-width="3.4"/>
    <path d="M736 236 h9 M740.5 231.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M62 240 h9 M66.5 235.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF6EE" opacity="0.55">
    <circle cx="128" cy="150" r="4"/><circle cx="746" cy="150" r="3.4"/><circle cx="56" cy="300" r="3"/><circle cx="760" cy="300" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="440" cy="406" rx="248" ry="22" fill="#5E9478" opacity="0.35"/>

