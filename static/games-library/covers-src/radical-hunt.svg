    <g fill="#17734A">
      <circle cx="432" cy="112" r="9"/>
      <circle cx="428" cy="134" r="9"/>
      <circle cx="436" cy="156" r="9"/>
    </g>
    <path d="M462 112 V152" stroke="#17734A" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M460 166 H476" stroke="#17734A" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="420" cy="98" r="10" fill="#FFFFFF" opacity="0.4"/>
