<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4554A"/>
      <stop offset="0.55" stop-color="#A63F36"/>
      <stop offset="1" stop-color="#863028"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A1E18" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#73261F" opacity="0.6"/>
  <rect y="394" width="800" height="6" fill="#631F19" opacity="0.55"/>

  <!-- 星尘点缀 -->
  <g stroke="#FBE0D8" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M96 104 h10 M101 99 v10" stroke-width="3"/>
    <path d="M690 92 h12 M696 86 v12" stroke-width="3.4"/>
    <path d="M716 220 h9 M720.5 215.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M84 260 h9 M88.5 255.5 v9" stroke-width="2.6" opacity="0.6"/>
  </g>
  <g fill="#FBE0D8" opacity="0.5">
    <circle cx="170" cy="168" r="4"/><circle cx="648" cy="176" r="3.4"/>
    <circle cx="70" cy="216" r="3"/><circle cx="748" cy="186" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="404" rx="230" ry="22" fill="#631F19" opacity="0.4"/>

  <!-- 提手 -->
  <path d="M386 84 Q400 62 414 84" stroke="#3A2A1E" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- 灯笼主体 -->
  <ellipse cx="400" cy="222" rx="106" ry="126" fill="#E04848" stroke="#3A2A1E" stroke-width="10"/>
  <!-- 骨架经线 -->
  <g stroke="#3A2A1E" stroke-width="4" fill="none" opacity="0.45">
    <path d="M400 98 C336 158 336 286 400 346"/>
    <path d="M400 98 C464 158 464 286 400 346"/>
    <path d="M306 132 C360 190 360 254 306 312"/>
    <path d="M494 132 C440 190 440 254 494 312"/>
  </g>
  <ellipse cx="400" cy="222" rx="106" ry="126" fill="url(#gloss)"/>

  <!-- 上盖 / 下盖 -->
  <rect x="348" y="82" width="104" height="22" rx="9" fill="#3A2A1E"/>
  <rect x="356" y="340" width="88" height="20" rx="9" fill="#3A2A1E"/>

  <!-- 穗 -->
  <path d="M400 360 L400 384" stroke="#3A2A1E" stroke-width="7" stroke-linecap="round"/>
  <path d="M400 384 L386 410 L400 402 L414 410 Z" fill="#F2C230" stroke="#3A2A1E" stroke-width="5" stroke-linejoin="round"/>

  <!-- 表情 -->
  <circle cx="370" cy="210" r="11" fill="#3A2A1E"/>
  <circle cx="430" cy="210" r="11" fill="#3A2A1E"/>
  <path d="M376 248 Q400 270 424 248" stroke="#3A2A1E" stroke-width="8" fill="none" stroke-linecap="round"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
