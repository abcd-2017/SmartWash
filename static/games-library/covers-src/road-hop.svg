    <path d="M706 62 h12 M712 56 v12" stroke-width="3.4"/>
    <path d="M60 128 h9 M64.5 123.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M740 134 h9 M744.5 129.5 v9" stroke-width="2.6" opacity="0.65"/>
