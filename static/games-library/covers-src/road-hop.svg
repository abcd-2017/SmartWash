    <rect x="330" y="368" width="42" height="82" rx="6" transform="skewX(-8)"/>
    <rect x="450" y="368" width="42" height="82" rx="6" transform="skewX(-8)"/>
    <rect x="570" y="368" width="42" height="82" rx="6" transform="skewX(-8)"/>
    <rect x="690" y="368" width="42" height="82" rx="6" transform="skewX(-8)"/>
