  <rect y="202" width="800" height="76" fill="#54645A" opacity="0.85"/>
  <rect y="278" width="800" height="14" fill="#8A988C" opacity="0.9"/>
  <rect y="292" width="800" height="76" fill="#5E6E64" opacity="0.85"/>
