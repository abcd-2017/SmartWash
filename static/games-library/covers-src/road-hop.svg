    <circle cx="402" cy="258" r="18" fill="#3FA34D" stroke="#1E2620" stroke-width="8"/>
    <circle cx="446" cy="254" r="18" fill="#3FA34D" stroke="#1E2620" stroke-width="8"/>
    <circle cx="402" cy="258" r="9" fill="#FFFFFF"/>
    <circle cx="446" cy="254" r="9" fill="#FFFFFF"/>
    <circle cx="404" cy="260" r="4.5" fill="#1F1A14"/>
    <circle cx="444" cy="256" r="4.5" fill="#1F1A14"/>
    <path d="M412 296 Q424 306 436 294" stroke="#1F1A14" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="390" cy="278" rx="14" ry="7" fill="#FFFFFF" opacity="0.45" transform="rotate(-14 390 278)"/>
  </g>
