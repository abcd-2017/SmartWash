  <path d="M420 372 Q414 356 420 344" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="3 12" opacity="0.8"/>

  <rect width="800" height="450" fill="url(#vign)"/>
