    <path d="M410 262 Q440 244 452 226" stroke="#1E2620" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M410 262 Q440 244 452 226" stroke="#F5DCC4" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M300 238 Q326 250 340 268" stroke="#1E2620" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M300 238 Q326 250 340 268" stroke="#F5DCC4" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="330" y="256" width="92" height="76" rx="26" fill="#2D9B6A" stroke="#1E2620" stroke-width="9"/>
    <path d="M410 322 Q430 352 424 388" stroke="#1E2620" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M410 322 Q430 352 424 388" stroke="#2D9B6A" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M352 326 Q332 356 306 358" stroke="#1E2620" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M352 326 Q332 356 306 358" stroke="#2D9B6A" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="424" cy="388" r="11" fill="#E2A44E" stroke="#1E2620" stroke-width="6"/>
    <circle cx="306" cy="358" r="11" fill="#E2A44E" stroke="#1E2620" stroke-width="6"/>
    <circle cx="366" cy="216" r="34" fill="#F5DCC4" stroke="#1E2620" stroke-width="9"/>
    <!-- 安全帽 -->
    <path d="M334 206 Q340 178 366 176 Q394 178 398 204 L398 212 Q366 200 334 212 Z" fill="#E2A44E" stroke="#1E2620" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="366" cy="222" r="7" fill="#1F1A14"/>
    <circle cx="390" cy="222" r="7" fill="#1F1A14"/>
    <path d="M362 236 Q376 246 390 234" stroke="#1F1A14" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="352" cy="202" rx="12" ry="5" fill="#FFFFFF" opacity="0.5" transform="rotate(-12 352 202)"/>
    <!-- 镁粉袋 -->
    <path d="M336 322 L322 356 Q320 364 328 366 L352 366 Q360 364 358 356 L352 322" fill="#4A9FD4" stroke="#1E2620" stroke-width="7" stroke-linejoin="round"/>
    <path d="M340 318 Q344 310 350 318" stroke="#1E2620" stroke-width="5" fill="none"/>
  </g>
  <!-- 抓握粉雾 -->
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="458" cy="216" r="5"/><circle cx="470" cy="206" r="4"/><circle cx="464" cy="226" r="3.4"/>
  </g>

  <!-- 耐力槽 -->
  <g>
    <rect x="66" y="140" width="200" height="30" rx="15" fill="#F5F6F3" stroke="#1E2620" stroke-width="7"/>
    <rect x="73" y="147" width="130" height="16" rx="8" fill="#4ADE6E"/>
    <rect x="203" y="147" width="56" height="16" rx="8" fill="#F5F6F3" opacity="0.4"/>
    <rect x="73" y="147" width="26" height="16" rx="8" fill="#FFFFFF" opacity="0.45"/>
