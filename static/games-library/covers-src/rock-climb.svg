<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8D8E4"/>
      <stop offset="0.3" stop-color="#8CC4D4"/>
      <stop offset="1" stop-color="#A87848"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C89868"/>
      <stop offset="0.55" stop-color="#B08050"/>
      <stop offset="1" stop-color="#8E6038"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#4E3418" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 星尘点缀（空中） -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 56 h11 M97.5 50.5 v11" stroke-width="3.2"/>
    <path d="M706 50 h12 M712 44 v12" stroke-width="3.4"/>
    <path d="M150 96 h9 M154.5 91.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M640 92 h9 M644.5 87.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="220" cy="70" r="4"/><circle cx="580" cy="60" r="3.4"/>
  </g>

  <!-- 岩壁 -->
  <path d="M0 118 L60 100 L150 122 L250 96 L360 124 L470 98 L580 124 L690 100 L800 118 L800 450 L0 450 Z" fill="url(#rock)" stroke="#5E3E20" stroke-width="9" stroke-linejoin="round"/>
  <!-- 岩壁裂纹与棱线 -->
  <path d="M120 180 Q180 240 160 330 Q150 390 180 450 M420 140 Q450 220 430 320 Q418 400 448 450 M640 160 Q610 240 636 340 Q650 400 630 450" stroke="#7E5428" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M60 210 L120 230 M700 220 L760 204 M300 380 L250 420" stroke="#7E5428" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- 岩点 -->
  <g stroke="#3A2A1E">
    <circle cx="150" cy="200" r="20" fill="#E2A44E" stroke-width="7"/>
    <circle cx="252" cy="252" r="16" fill="#DB7186" stroke-width="7"/>
    <circle cx="220" cy="322" r="18" fill="#4A9FD4" stroke-width="7"/>
    <circle cx="348" cy="180" r="17" fill="#4ADE6E" stroke-width="7"/>
    <circle cx="452" cy="236" r="22" fill="#E2A44E" stroke-width="8"/>
    <circle cx="560" cy="180" r="16" fill="#DB7186" stroke-width="7"/>
    <circle cx="600" cy="300" r="19" fill="#4A9FD4" stroke-width="7"/>
    <circle cx="500" cy="352" r="16" fill="#4ADE6E" stroke-width="7"/>
    <circle cx="680" cy="380" r="18" fill="#E2A44E" stroke-width="7"/>
    <circle cx="90" cy="300" r="17" fill="#DB7186" stroke-width="7"/>
    <circle cx="700" cy="150" r="14" fill="#4A9FD4" stroke-width="6"/>
    <circle cx="380" cy="90" r="14" fill="#E2A44E" stroke-width="6"/>
  </g>
  <!-- 岩点高光 -->
  <g fill="#FFFFFF" opacity="0.4">
    <circle cx="144" cy="194" r="6"/><circle cx="446" cy="230" r="7"/><circle cx="594" cy="294" r="6"/><circle cx="344" cy="176" r="5"/>
