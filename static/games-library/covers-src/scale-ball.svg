<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0EAD8"/>
      <stop offset="0.55" stop-color="#BCD0B8"/>
      <stop offset="1" stop-color="#8CA892"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E5240" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#7A9484" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#6C8676" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 92 h11 M97.5 86.5 v11" stroke-width="3.2"/>
    <path d="M706 88 h12 M712 82 v12" stroke-width="3.4"/>
    <path d="M64 220 h9 M68.5 215.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M736 230 h9 M740.5 225.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="156" cy="146" r="4"/><circle cx="650" cy="134" r="3.4"/><circle cx="70" cy="170" r="3"/><circle cx="740" cy="176" r="2.6"/>
  </g>

  <ellipse cx="400" cy="404" rx="250" ry="18" fill="#52705E" opacity="0.32"/>

  <!-- 天平立柱与底座 -->
  <rect x="382" y="128" width="36" height="220" rx="14" fill="#D4A94E" stroke="#3A2A1E" stroke-width="9"/>
  <rect x="300" y="344" width="200" height="34" rx="16" fill="#C08E3E" stroke="#3A2A1E" stroke-width="9"/>
  <circle cx="322" cy="361" r="6" fill="#8E6420"/>
  <circle cx="478" cy="361" r="6" fill="#8E6420"/>

  <!-- 横梁（左沉右扬） -->
  <g transform="rotate(9 400 130)">
    <rect x="170" y="112" width="460" height="30" rx="15" fill="#E2B45E" stroke="#3A2A1E" stroke-width="9"/>
    <circle cx="400" cy="127" r="14" fill="#8E6420" stroke="#3A2A1E" stroke-width="6"/>
    <path d="M196 118 H240 M560 118 H604" stroke="#B8882E" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <ellipse cx="206" cy="122" rx="20" ry="8" fill="#FFFFFF" opacity="0.4" transform="rotate(-4 206 122)"/>
  </g>

  <!-- 吊链与左盘（低） -->
  <g>
    <path d="M212 168 L192 244 M212 168 L288 236" stroke="#3A2A1E" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M180 240 Q240 282 300 244 Q268 296 240 296 Q212 296 180 240 Z" fill="#C08E3E" stroke="#3A2A1E" stroke-width="9" stroke-linejoin="round"/>
    <path d="M186 246 Q240 274 294 246" stroke="#8E6420" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- 左盘球 -->
    <circle cx="220" cy="212" r="26" fill="#4A9FD4" stroke="#3A2A1E" stroke-width="7"/>
    <circle cx="220" cy="212" r="26" fill="url(#gloss)"/>
    <circle cx="264" cy="196" r="24" fill="#F5F6F3" stroke="#3A2A1E" stroke-width="7"/>
    <circle cx="264" cy="196" r="24" fill="url(#gloss)"/>
    <!-- 异常球（签名表情） -->
    <circle cx="240" cy="158" r="34" fill="#F2A93B" stroke="#3A2A1E" stroke-width="9"/>
    <circle cx="240" cy="158" r="34" fill="url(#gloss)"/>
    <circle cx="229" cy="150" r="6.5" fill="#1F1A14"/>
    <circle cx="252" cy="150" r="6.5" fill="#1F1A14"/>
    <path d="M228 170 Q240 180 253 168" stroke="#1F1A14" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <circle cx="224" cy="142" r="9" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- 吊链与右盘（高） -->
  <g>
    <path d="M592 148 L566 196 M592 148 L622 190" stroke="#3A2A1E" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M554 192 Q596 222 638 194 Q614 238 596 238 Q578 238 554 192 Z" fill="#C08E3E" stroke="#3A2A1E" stroke-width="9" stroke-linejoin="round"/>
    <path d="M560 196 Q596 216 632 196" stroke="#8E6420" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <circle cx="586" cy="172" r="24" fill="#F5F6F3" stroke="#3A2A1E" stroke-width="7"/>
    <circle cx="586" cy="172" r="24" fill="url(#gloss)"/>
    <circle cx="618" cy="164" r="22" fill="#DB7186" stroke="#3A2A1E" stroke-width="7"/>
    <circle cx="618" cy="164" r="22" fill="url(#gloss)"/>
  </g>

  <!-- 候选球排 -->
  <g>
    <circle cx="130" cy="374" r="22" fill="#F5F6F3" stroke="#3A2A1E" stroke-width="7"/>
    <circle cx="130" cy="374" r="22" fill="url(#gloss)"/>
    <circle cx="676" cy="374" r="22" fill="#F5F6F3" stroke="#3A2A1E" stroke-width="7"/>
    <circle cx="676" cy="374" r="22" fill="url(#gloss)"/>
    <circle cx="716" cy="386" r="16" fill="#4A9FD4" stroke="#3A2A1E" stroke-width="6"/>
    <circle cx="716" cy="386" r="16" fill="url(#gloss)"/>
  </g>

  <!-- 称量结果箭头 -->
  <g>
    <rect x="96" y="66" width="120" height="30" rx="15" fill="#F5F6F3" stroke="#1E2620" stroke-width="7"/>
    <circle cx="118" cy="81" r="9" fill="#4ADE6E"/>
    <circle cx="150" cy="81" r="9" fill="#F5F6F3" stroke="#1E2620" stroke-width="4"/>
    <circle cx="182" cy="81" r="9" fill="#F5F6F3" stroke="#1E2620" stroke-width="4"/>
    <path d="M246 84 L266 92 L250 104" stroke="#1E2620" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
