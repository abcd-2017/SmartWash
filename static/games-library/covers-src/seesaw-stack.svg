<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFF2E8"/>
      <stop offset="0.55" stop-color="#EAF7EF"/>
      <stop offset="1" stop-color="#F3FAF5"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3E4A42" stop-opacity="0.26"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect y="394" width="800" height="56" fill="#C9B691" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#A8956F" opacity="0.5"/>
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M96 96 h11 M101.5 90.5 v11" stroke-width="3.2"/>
    <path d="M694 84 h12 M700 78 v12" stroke-width="3.4"/>
    <path d="M716 240 h9 M720.5 235.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M78 250 h9 M82.5 245.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="160" cy="160" r="4"/><circle cx="712" cy="160" r="3.4"/><circle cx="64" cy="210" r="3"/><circle cx="740" cy="200" r="2.6"/>
  </g>

  <ellipse cx="400" cy="404" rx="252" ry="22" fill="#A8956F" opacity="0.35"/>

  <!-- 负载条 -->
  <rect x="104" y="196" width="26" height="196" rx="9" fill="#EFF1EE" stroke="#3A2A1E" stroke-width="6"/>
  <rect x="110" y="268" width="14" height="120" rx="6" fill="#C9626F"/>
  <path d="M104 240 H130 M104 300 H130 M104 360 H130" stroke="#3A2A1E" stroke-width="4" stroke-linecap="round"/>

  <!-- 支点 -->
  <path d="M400 348 L356 424 L444 424 Z" fill="#8F6A3A" stroke="#3A2A1E" stroke-width="9" stroke-linejoin="round"/>

  <!-- 跷板与箱堆（倾斜） -->
  <g transform="rotate(-6 400 330)">
    <rect x="180" y="318" width="440" height="26" rx="11" fill="#B98A4E" stroke="#3A2A1E" stroke-width="9"/>
    <path d="M204 331 H600" stroke="#8F6A3A" stroke-width="4" stroke-linecap="round"/>

    <!-- 左堆：三层 -->
    <rect x="210" y="262" width="58" height="56" rx="8" fill="#C9E5C4" stroke="#3A2A1E" stroke-width="7"/>
    <rect x="216" y="206" width="58" height="56" rx="8" fill="#8AC6A0" stroke="#3A2A1E" stroke-width="7"/>
    <!-- 顶层箱（主视觉，带签名表情） -->
    <g>
      <rect x="210" y="150" width="58" height="56" rx="8" fill="#D98A3B" stroke="#3A2A1E" stroke-width="8"/>
      <circle cx="230" cy="172" r="6" fill="#1F1A14"/>
      <circle cx="250" cy="172" r="6" fill="#1F1A14"/>
      <path d="M232 186 Q240 193 248 186" stroke="#1F1A14" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <circle cx="222" cy="162" r="8" fill="#FFFFFF" opacity="0.45"/>
    </g>
    <!-- 中堆：两层 -->
    <rect x="322" y="262" width="58" height="56" rx="8" fill="#8A93A0" stroke="#3A2A1E" stroke-width="7"/>
    <rect x="328" y="206" width="58" height="56" rx="8" fill="#C9626F" stroke="#3A2A1E" stroke-width="7"/>
    <!-- 右箱 -->
    <rect x="436" y="262" width="58" height="56" rx="8" fill="#8AC6A0" stroke="#3A2A1E" stroke-width="7"/>
    <rect x="540" y="262" width="58" height="56" rx="8" fill="#D98A3B" stroke="#3A2A1E" stroke-width="7"/>
  </g>

  <!-- 倾斜指示 -->
  <g stroke="#C9626F" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M640 260 Q660 280 656 304"/>
    <path d="M656 304 L648 290 M656 304 L666 292"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
