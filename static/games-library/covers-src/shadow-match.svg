<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54B283"/>
      <stop offset="0.55" stop-color="#3D9A6B"/>
      <stop offset="1" stop-color="#2B8053"/>
    </linearGradient>
    <linearGradient id="proj" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E6A62"/>
      <stop offset="1" stop-color="#49514A"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#143826" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="396" width="800" height="54" fill="#256B44" opacity="0.55"/>
  <rect y="396" width="800" height="6" fill="#1E5A38" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M104 100 h11 M109.5 94.5 v11" stroke-width="3.2"/>
    <path d="M676 84 h12 M682 78 v12" stroke-width="3.4"/>
    <path d="M706 250 h9 M710.5 245.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M92 280 h9 M96.5 275.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#D9F2E4" opacity="0.5">
    <circle cx="176" cy="164" r="4"/><circle cx="640" cy="150" r="3.4"/><circle cx="76" cy="210" r="3"/><circle cx="736" cy="176" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="420" cy="406" rx="258" ry="22" fill="#1A5C3A" opacity="0.35"/>

  <!-- 立体方块（主视觉，带签名表情） -->
  <g stroke="#1E2620" stroke-linejoin="round">
    <path d="M250 170 L300 120 L520 120 L470 170 Z" fill="#63C292" stroke-width="9"/>
    <path d="M470 170 L520 120 L520 340 L470 390 Z" fill="#28714E" stroke-width="9"/>
    <path d="M250 170 L470 170 L470 390 L250 390 Z" fill="#37996A" stroke-width="9"/>
  </g>
  <circle cx="292" cy="150" r="14" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="330" cy="262" r="11" fill="#1F1A14"/>
  <circle cx="390" cy="262" r="11" fill="#1F1A14"/>
  <path d="M322 296 Q360 318 398 294" stroke="#1F1A14" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- 投影形状（配对目标） -->
  <path d="M540 334 L640 296 L716 332 L616 374 Z" fill="url(#proj)" stroke="#1E2620" stroke-width="8" stroke-linejoin="round"/>
  <path d="M548 330 L638 298" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  <path d="M480 320 L528 316" stroke="#F5F6F3" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.75" fill="none"/>

  <rect width="800" height="450" fill="url(#vign)"/>
