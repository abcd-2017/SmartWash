<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#88CC9A"/>
      <stop offset="0.55" stop-color="#5FB37B"/>
      <stop offset="1" stop-color="#439B61"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1B5438" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#378653" opacity="0.6"/>
  <rect y="394" width="800" height="6" fill="#2D7145" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 58 h11 M97.5 52.5 v11" stroke-width="3.2"/>
    <path d="M716 66 h12 M722 60 v12" stroke-width="3.4"/>
    <path d="M52 210 h9 M56.5 205.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M748 230 h9 M752.5 225.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF7EE" opacity="0.5">
    <circle cx="150" cy="110" r="4"/><circle cx="650" cy="100" r="3.4"/><circle cx="46" cy="160" r="3"/><circle cx="750" cy="180" r="2.6"/>
  </g>

  <ellipse cx="400" cy="430" rx="250" ry="16" fill="#1B5438" opacity="0.35"/>

  <!-- 6×6 百格棋盘（示意） -->
  <rect x="206" y="70" width="348" height="348" fill="#F2E8CC"/>
  <g fill="#96CFA0">
    <rect x="264" y="70" width="58" height="58"/><rect x="380" y="70" width="58" height="58"/><rect x="496" y="70" width="58" height="58"/>
    <rect x="206" y="128" width="58" height="58"/><rect x="322" y="128" width="58" height="58"/><rect x="438" y="128" width="58" height="58"/>
    <rect x="264" y="186" width="58" height="58"/><rect x="380" y="186" width="58" height="58"/><rect x="496" y="186" width="58" height="58"/>
    <rect x="206" y="244" width="58" height="58"/><rect x="322" y="244" width="58" height="58"/><rect x="438" y="244" width="58" height="58"/>
    <rect x="264" y="302" width="58" height="58"/><rect x="380" y="302" width="58" height="58"/><rect x="496" y="302" width="58" height="58"/>
    <rect x="206" y="360" width="58" height="58"/><rect x="322" y="360" width="58" height="58"/><rect x="438" y="360" width="58" height="58"/>
  </g>
  <rect x="206" y="70" width="348" height="348" fill="none" stroke="#3A2A1E" stroke-width="9" stroke-linejoin="round"/>

  <!-- 终点小旗 -->
  <g>
    <path d="M548 70 L548 42" stroke="#3A2A1E" stroke-width="6" stroke-linecap="round"/>
    <path d="M548 42 L588 52 L548 62 Z" fill="#C04A5E" stroke="#3A2A1E" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- 梯子 -->
