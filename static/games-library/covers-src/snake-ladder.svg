  <g>
    <path d="M140 402 Q210 372 250 344 Q295 315 335 330 Q375 345 395 305 Q415 265 452 252" fill="none" stroke="#1E5030" stroke-width="24" stroke-linecap="round"/>
    <path d="M140 402 Q210 372 250 344 Q295 315 335 330 Q375 345 395 305 Q415 265 452 252" fill="none" stroke="#3E9C5C" stroke-width="13" stroke-linecap="round"/>
    <circle cx="464" cy="250" r="28" fill="#3E9C5C" stroke="#1E5030" stroke-width="6"/>
    <circle cx="456" cy="242" r="7" fill="#1F1A14"/>
    <circle cx="474" cy="242" r="7" fill="#1F1A14"/>
    <circle cx="458" cy="239" r="2.6" fill="#FFFFFF"/>
    <circle cx="476" cy="239" r="2.6" fill="#FFFFFF"/>
    <path d="M456 262 Q466 270 476 260" stroke="#1F1A14" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <path d="M490 258 Q500 254 508 249 M508 249 L517 243 M508 249 L516 255" stroke="#C8465C" stroke-width="4" fill="none" stroke-linecap="round"/>
