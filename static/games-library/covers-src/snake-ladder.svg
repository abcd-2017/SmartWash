  <!-- 掷出的骰子 -->
  <g transform="translate(610 382) rotate(8)">
    <rect x="-32" y="-32" width="64" height="64" rx="14" fill="#FDFBF4" stroke="#3A2A1E" stroke-width="7"/>
    <g fill="#2E2A26">
      <circle cx="-13" cy="-13" r="8"/><circle cx="13" cy="-13" r="8"/><circle cx="0" cy="0" r="8"/>
      <circle cx="-13" cy="13" r="8"/><circle cx="13" cy="13" r="8"/>
    </g>
    <circle cx="-20" cy="-20" r="7" fill="#FFFFFF" opacity="0.45"/>
  </g>
  <!-- 骰子落点弧线 -->
  <path d="M690 300 Q700 348 650 372" stroke="#F2FBF4" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="3 9" fill="none" opacity="0.8"/>

  <rect width="800" height="450" fill="url(#vign)"/>
