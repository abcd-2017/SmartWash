    <path d="M250 390 L430 150" stroke="#8A5A34" stroke-width="9" stroke-linecap="round"/>
    <path d="M282 402 L462 162" stroke="#8A5A34" stroke-width="9" stroke-linecap="round"/>
    <g stroke="#B98A54" stroke-width="7" stroke-linecap="round">
