    <g fill="#1E5030" opacity="0.55">
      <circle cx="228" cy="356" r="6"/><circle cx="290" cy="326" r="6"/><circle cx="368" cy="330" r="6"/><circle cx="400" cy="296" r="6"/>
    </g>
