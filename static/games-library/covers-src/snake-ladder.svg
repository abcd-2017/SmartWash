      <path d="M300.4 322.8 L326 342"/>
      <path d="M329.2 284.4 L354.8 303.6"/>
      <path d="M358 246 L383.6 265.2"/>
      <path d="M386.8 207.6 L412.4 226.8"/>
      <path d="M415.6 169.2 L441.2 188.4"/>
