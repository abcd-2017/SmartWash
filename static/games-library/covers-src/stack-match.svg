<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1EAF9"/>
      <stop offset="0.55" stop-color="#CFC2EE"/>
      <stop offset="1" stop-color="#A98FE0"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.6" stop-color="#1E2620" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E2620" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect y="392" width="800" height="58" fill="#8E7CC3" opacity="0.5"/>
  <rect y="392" width="800" height="6" fill="#7561AC" opacity="0.5"/>

  <g fill="#FFFFFF" opacity="0.5">
