      <rect x="418" y="162" width="44" height="8" rx="4"/><rect x="533" y="162" width="44" height="8" rx="4"/>
      <rect x="188" y="244" width="44" height="8" rx="4"/><rect x="303" y="244" width="44" height="8" rx="4"/>
      <rect x="418" y="244" width="44" height="8" rx="4"/><rect x="533" y="244" width="44" height="8" rx="4"/>
