  <g stroke="#B8C4BE" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M150 400 h44 M186 390 l12 10 -12 10"/>
    <path d="M560 402 h44 M596 392 l12 10 -12 10"/>
  </g>

  <!-- 目标盘（右端） -->
  <g>
    <ellipse cx="700" cy="322" rx="62" ry="18" fill="#F5F6F3" stroke="#1E2620" stroke-width="8"/>
    <ellipse cx="700" cy="318" rx="44" ry="11" fill="#C9E8D6" stroke="#2D9B6A" stroke-width="5"/>
  </g>

  <!-- 嫩豆腐（签名表情） -->
  <g>
    <path d="M312 200 L492 200 L492 312 L312 312 Z" fill="#FDFBF2" stroke="#1E2620" stroke-width="9" stroke-linejoin="round"/>
    <path d="M312 200 L344 168 L524 168 L492 200 Z" fill="#FFFFFF" stroke="#1E2620" stroke-width="8" stroke-linejoin="round"/>
    <path d="M492 200 L524 168 L524 280 L492 312 Z" fill="#EFEADC" stroke="#1E2620" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="366" cy="244" r="9" fill="#1F1A14"/>
    <circle cx="430" cy="244" r="9" fill="#1F1A14"/>
    <circle cx="369" cy="240" r="3" fill="#FFFFFF"/>
    <circle cx="433" cy="240" r="3" fill="#FFFFFF"/>
    <path d="M374 270 Q398 288 422 266" stroke="#1F1A14" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="340" cy="216" rx="22" ry="9" fill="#FFFFFF" opacity="0.65" transform="rotate(-6 340 216)"/>
    <!-- 汗滴 -->
    <path d="M506 232 Q514 246 506 254 Q498 246 506 232 Z" fill="#9ED8F0" stroke="#1E2620" stroke-width="4.5"/>
    <path d="M300 284 Q292 298 300 308 Q308 298 300 284 Z" fill="#9ED8F0" stroke="#1E2620" stroke-width="4.5" opacity="0.8"/>
