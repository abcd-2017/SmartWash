<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2E6DA"/>
      <stop offset="0.55" stop-color="#AACCB8"/>
      <stop offset="1" stop-color="#7EA896"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E5A48" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#6E947E" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#60866E" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 92 h11 M97.5 86.5 v11" stroke-width="3.2"/>
    <path d="M706 84 h12 M712 78 v12" stroke-width="3.4"/>
    <path d="M64 210 h9 M68.5 205.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M736 220 h9 M740.5 215.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="156" cy="146" r="4"/><circle cx="650" cy="130" r="3.4"/><circle cx="70" cy="176" r="3"/><circle cx="742" cy="176" r="2.6"/>
  </g>

  <!-- 传送带 -->
  <rect x="40" y="330" width="720" height="72" rx="20" fill="#4E5652" stroke="#1E2620" stroke-width="9"/>
  <rect x="58" y="342" width="684" height="12" rx="6" fill="#6E7874" opacity="0.8"/>
  <g fill="#3A423E" stroke="#1E2620" stroke-width="6">
    <circle cx="90" cy="366" r="20"/><circle cx="710" cy="366" r="20"/>
  </g>
  <g fill="#8A939B">
    <circle cx="84" cy="360" r="5"/><circle cx="704" cy="360" r="5"/>
  </g>
