      <path d="M282 216 Q270 232 282 248"/>
      <path d="M528 258 Q540 274 528 290"/>
    </g>
  </g>

  <!-- 筷子 -->
  <g stroke-linecap="round">
    <path d="M600 44 L364 196" stroke="#1E2620" stroke-width="17" fill="none"/>
    <path d="M600 44 L364 196" stroke="#D8B070" stroke-width="9" fill="none"/>
    <path d="M660 96 L452 208" stroke="#1E2620" stroke-width="17" fill="none"/>
    <path d="M660 96 L452 208" stroke="#D8B070" stroke-width="9" fill="none"/>
    <path d="M372 194 L366 186 M456 206 L450 198" stroke="#8A6234" stroke-width="7"/>
  </g>
  <!-- 夹持手感弧 -->
  <g stroke="#FFF6E0" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M340 156 Q332 170 340 184"/>
    <path d="M486 168 Q494 182 486 196"/>
