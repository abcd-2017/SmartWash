    <path d="M410 158 V182 M410 278 V298" stroke="#3A2A1E" stroke-width="6"/>
    <rect x="388" y="182" width="44" height="96" rx="7" fill="#2D9B6A" stroke="#3A2A1E" stroke-width="7"/>
    <circle cx="401" cy="216" r="6.5" fill="#1F1A14"/>
    <circle cx="419" cy="216" r="6.5" fill="#1F1A14"/>
