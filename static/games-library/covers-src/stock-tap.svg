  <g stroke="#D9C79A" stroke-width="3">
    <path d="M110 140 H690 M110 196 H690 M110 252 H690 M110 308 H690"/>
    <path d="M220 94 V356 M340 94 V356 M460 94 V356 M580 94 V356"/>
