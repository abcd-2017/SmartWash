    <rect x="157" y="234" width="26" height="56" rx="5" fill="#C4574A"/>
    <path d="M290 184 V202 M290 272 V290" stroke-width="5"/>
    <rect x="277" y="202" width="26" height="70" rx="5" fill="#2D9B6A"/>
