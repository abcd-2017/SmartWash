      <stop offset="0" stop-color="#88B8D4"/>
      <stop offset="0.55" stop-color="#6292B2"/>
      <stop offset="1" stop-color="#426A86"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
