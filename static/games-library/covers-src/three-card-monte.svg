<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74BF92"/>
      <stop offset="0.55" stop-color="#54A874"/>
      <stop offset="1" stop-color="#3C905C"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E5034" stop-opacity="0.3"/>
    </radialGradient>
    <g id="monteBack">
      <rect x="-55" y="-75" width="110" height="150" rx="11" fill="#2D9B6A" stroke="#1E5038" stroke-width="7"/>
      <rect x="-42" y="-62" width="84" height="124" rx="8" fill="none" stroke="#EAF7EE" stroke-width="4" opacity="0.85"/>
      <path d="M0 -20 L20 0 L0 20 L-20 0 Z" fill="#EAF7EE" opacity="0.85"/>
    </g>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部桌面 -->
  <rect y="352" width="800" height="98" fill="#B98A54" opacity="0.92"/>
  <rect y="352" width="800" height="8" fill="#8A6234" opacity="0.8"/>
  <rect y="394" width="800" height="56" fill="#9A7040" opacity="0.5"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M84 74 h11 M89.5 68.5 v11" stroke-width="3.2"/>
    <path d="M712 66 h12 M718 60 v12" stroke-width="3.4"/>
    <path d="M48 210 h9 M52.5 205.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M750 220 h9 M754.5 215.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF7EE" opacity="0.5">
    <circle cx="140" cy="120" r="4"/><circle cx="672" cy="110" r="3.4"/><circle cx="52" cy="160" r="3"/><circle cx="748" cy="160" r="2.6"/>
  </g>

  <!-- 三张牌投影 -->
  <g fill="#5E3A1C" opacity="0.3">
    <ellipse cx="196" cy="372" rx="58" ry="10"/>
    <ellipse cx="404" cy="368" rx="58" ry="10"/>
    <ellipse cx="614" cy="376" rx="58" ry="10"/>
  </g>

  <!-- 洗牌轨迹 -->
  <path d="M242 296 Q312 176 356 208" stroke="#F2FBF4" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 11" fill="none" opacity="0.85"/>
  <path d="M452 226 Q538 152 576 238" stroke="#F2FBF4" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 11" fill="none" opacity="0.85"/>
  <path d="M574 300 Q460 372 260 342" stroke="#F2FBF4" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="3 10" fill="none" opacity="0.7"/>

  <!-- 右牌（飞行中） -->
  <use href="#monteBack" transform="translate(614 262) rotate(-8)"/>
  <circle cx="578" cy="204" r="9" fill="#FFFFFF" opacity="0.4"/>
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.65">
    <path d="M672 196 L702 190"/>
    <path d="M676 220 L702 216"/>
  </g>

  <!-- 中牌（飞行中） -->
  <use href="#monteBack" transform="translate(402 232) rotate(7)"/>
  <circle cx="366" cy="174" r="9" fill="#FFFFFF" opacity="0.4"/>
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.65">
    <path d="M470 158 L498 152"/>
    <path d="M474 182 L500 178"/>
  </g>

  <!-- 目标牌（星标 + 签名表情） -->
  <g transform="translate(192 254) rotate(-13)">
    <rect x="-55" y="-75" width="110" height="150" rx="11" fill="#2D9B6A" stroke="#1E5038" stroke-width="8"/>
    <rect x="-42" y="-62" width="84" height="124" rx="8" fill="none" stroke="#EAF7EE" stroke-width="4" opacity="0.85"/>
    <path d="M0 -44 L5 -30.9 L19 -30.2 L8.1 -21.6 L11.8 -7.8 L0 -16.5 L-11.8 -7.8 L-8.1 -21.6 L-19 -30.2 L-5 -30.9 Z" fill="#C8465C" stroke="#5E1E30" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="-17" cy="18" r="7.5" fill="#1F1A14"/>
    <circle cx="17" cy="18" r="7.5" fill="#1F1A14"/>
    <circle cx="-14" cy="15" r="2.8" fill="#FFFFFF"/>
    <circle cx="20" cy="15" r="2.8" fill="#FFFFFF"/>
    <path d="M-12 40 Q0 50 12 38" stroke="#1F1A14" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="-36" cy="-52" r="10" fill="#FFFFFF" opacity="0.45"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.65">
    <path d="M116 226 L146 220"/>
    <path d="M118 252 L146 248"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
