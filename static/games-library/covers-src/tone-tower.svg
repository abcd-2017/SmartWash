<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFEFE6"/>
      <stop offset="0.55" stop-color="#C2E0CE"/>
      <stop offset="1" stop-color="#A8D3BC"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E6B4E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#8FBDA6" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#7BAA93" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M84 90 h11 M89.5 84.5 v11" stroke-width="3.2"/>
    <path d="M706 80 h12 M712 74 v12" stroke-width="3.4"/>
    <path d="M740 250 h9 M744.5 245.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M56 270 h9 M60.5 265.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF6EE" opacity="0.55">
    <circle cx="130" cy="150" r="4"/><circle cx="744" cy="150" r="3.4"/><circle cx="64" cy="210" r="3"/><circle cx="128" cy="320" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="430" cy="398" rx="286" ry="20" fill="#5E9478" opacity="0.35"/>

  <!-- 四声塔：调号形状的塔砖（主视觉，签名表情在基座） -->
  <g stroke-linejoin="round">
    <!-- 基座砖：阴平（平顶） -->
    <path d="M200 384 L200 314 Q200 304 210 304 L540 304 Q550 304 550 314 L550 384 Z" fill="#2D9B6A" stroke="#3A2A1E" stroke-width="9"/>
    <!-- 阳平砖：左低右高斜顶 -->
    <path d="M252 304 L252 262 L472 224 Q478 222 478 230 L478 304 Z" fill="#3FAE7A" stroke="#3A2A1E" stroke-width="9"/>
    <!-- 上声砖：顶部 V 形凹口 -->
    <path d="M300 250 L300 200 L352 220 L384 202 L414 222 L452 204 L452 240 Q452 248 444 248 L308 248 Q300 248 300 240 Z" fill="#F2B34C" stroke="#3A2A1E" stroke-width="8"/>
    <!-- 去声砖：右高左低斜顶 -->
    <path d="M340 202 L340 172 L398 136 Q404 132 404 140 L404 202 Z" fill="#E88B5A" stroke="#3A2A1E" stroke-width="8"/>
    <!-- 塔顶小旗 -->
    <path d="M372 132 V96" stroke="#3A2A1E" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M372 98 L414 110 L372 122 Z" fill="#D8465F" stroke="#3A2A1E" stroke-width="6"/>
    <!-- 签名表情（基座砖） -->
    <circle cx="330" cy="336" r="10" fill="#1F1A14"/>
    <circle cx="390" cy="336" r="10" fill="#1F1A14"/>
    <path d="M338 360 Q362 376 384 359" stroke="#1F1A14" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="312" cy="322" r="10" fill="#FFFFFF" opacity="0.4"/>
  </g>
  <!-- 各砖声调刻痕 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M282 272 L442 244" stroke-width="8"/>
    <path d="M330 216 L366 232 L404 212" stroke-width="8"/>
    <path d="M354 188 L392 166" stroke-width="8"/>
  </g>

  <!-- 待叠字块 -->
  <g stroke-linejoin="round">
    <rect x="600" y="300" width="92" height="92" rx="16" fill="#FBF7E8" stroke="#3A2A1E" stroke-width="8"/>
    <path d="M622 334 H670" stroke="#17734A" stroke-width="9" stroke-linecap="round" fill="none"/>
    <rect x="678" y="196" width="92" height="92" rx="16" fill="#F7D774" stroke="#3A2A1E" stroke-width="8" transform="rotate(7 724 242)"/>
    <path d="M696 218 L744 244" stroke="#3A2A1E" stroke-width="8" stroke-linecap="round" fill="none" transform="rotate(7 724 242)"/>
  </g>
  <!-- 归塔引导虚线 -->
  <path d="M594 342 Q560 348 548 350" stroke="#17734A" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 9" fill="none" opacity="0.8"/>
  <path d="M700 168 Q690 260 640 316" stroke="#C99A3A" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 9" fill="none" opacity="0.7"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
