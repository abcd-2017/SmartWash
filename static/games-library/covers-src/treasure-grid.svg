  <path d="M180 340 Q270 322 350 296" stroke="#B8452E" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 11" fill="none" opacity="0.8"/>

  <!-- 宝箱（主视觉，带签名表情） -->
  <path d="M470 272 Q580 212 690 272 L690 296 L470 296 Z" fill="#8A5E32" stroke="#3A2A1E" stroke-width="9" stroke-linejoin="round"/>
  <rect x="470" y="296" width="220" height="100" rx="12" fill="#A8763E" stroke="#3A2A1E" stroke-width="9"/>
  <rect x="470" y="318" width="220" height="20" fill="#D4A94E" stroke="#3A2A1E" stroke-width="6"/>
  <rect x="556" y="312" width="48" height="40" rx="8" fill="#D4A94E" stroke="#3A2A1E" stroke-width="7"/>
  <circle cx="580" cy="326" r="7" fill="#3A2A1E"/>
  <path d="M580 331 L575 342 L585 342 Z" fill="#3A2A1E"/>
  <circle cx="516" cy="246" r="12" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="552" cy="358" r="9" fill="#1F1A14"/>
  <circle cx="608" cy="358" r="9" fill="#1F1A14"/>
  <path d="M544 378 Q580 394 616 376" stroke="#1F1A14" stroke-width="6.5" fill="none" stroke-linecap="round"/>

