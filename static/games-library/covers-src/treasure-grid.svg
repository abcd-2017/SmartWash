  <circle cx="452" cy="370" r="13" fill="#D4A94E" stroke="#3A2A1E" stroke-width="6"/>
  <circle cx="426" cy="366" r="12" fill="#D4A94E" stroke="#3A2A1E" stroke-width="6"/>

  <rect width="800" height="450" fill="url(#vign)"/>
