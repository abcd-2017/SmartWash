  <g stroke="#B89A62" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M230 100 V370 M310 100 V370 M390 100 V370 M470 100 V370 M550 100 V370"/>
    <path d="M150 155 H650 M150 210 H650 M150 265 H650 M150 320 H650"/>
