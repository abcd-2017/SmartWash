    <circle cx="150" cy="240" r="30" fill="#E8B34A" stroke="#3A2A1E" stroke-width="9"/>
    <circle cx="150" cy="240" r="30" fill="url(#gloss)"/>
    <circle cx="138" cy="232" r="6" fill="#1F1A14"/>
    <circle cx="162" cy="232" r="6" fill="#1F1A14"/>
