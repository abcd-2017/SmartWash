<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5F0EA"/>
      <stop offset="0.55" stop-color="#C9E3D3"/>
      <stop offset="1" stop-color="#B0D6C3"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E6B4E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#9DC6AE" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#89B29C" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M80 84 h11 M85.5 78.5 v11" stroke-width="3.2"/>
    <path d="M708 76 h12 M714 70 v12" stroke-width="3.4"/>
    <path d="M748 300 h9 M752.5 295.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M52 320 h9 M56.5 315.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF6EE" opacity="0.55">
    <circle cx="122" cy="130" r="4"/><circle cx="744" cy="140" r="3.4"/><circle cx="60" cy="210" r="3"/><circle cx="130" cy="350" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="430" cy="406" rx="276" ry="22" fill="#5E9478" opacity="0.35"/>

  <!-- 绕圈声波（主视觉之一，签名表情在线圈中心） -->
  <g fill="none" stroke-linecap="round">
    <path d="M148 262 Q128 190 216 168 Q316 146 340 218 Q360 282 272 292 Q204 296 206 238 Q210 194 264 200" stroke="#2D9B6A" stroke-width="10"/>
    <path d="M118 176 Q132 148 162 136" stroke="#FFFFFF" stroke-width="6" opacity="0.5"/>
    <path d="M330 300 Q348 314 372 318" stroke="#FFFFFF" stroke-width="6" opacity="0.4"/>
  </g>
  <g>
    <circle cx="262" cy="232" r="36" fill="#FBF7E8" stroke="#3A2A1E" stroke-width="8"/>
    <circle cx="250" cy="224" r="7" fill="#1F1A14"/>
    <circle cx="276" cy="224" r="7" fill="#1F1A14"/>
    <path d="M254 244 Q264 254 272 243" stroke="#1F1A14" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <circle cx="248" cy="216" r="7" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- 绕口令卡片 -->
  <rect x="430" y="106" width="292" height="252" rx="16" fill="#FBF7E8" stroke="#3A2A1E" stroke-width="9"/>
  <g stroke-linejoin="round">
    <!-- 行 1 -->
    <rect x="454" y="132" width="54" height="54" rx="10" fill="#EFF4E6" stroke="#C9C2A8" stroke-width="5"/>
    <rect x="516" y="132" width="54" height="54" rx="10" fill="#EFF4E6" stroke="#C9C2A8" stroke-width="5"/>
    <rect x="578" y="132" width="54" height="54" rx="10" fill="#EFF4E6" stroke="#C9C2A8" stroke-width="5"/>
    <rect x="640" y="132" width="54" height="54" rx="10" fill="#DFF0E4" stroke="#2D9B6A" stroke-width="6"/>
    <!-- 行 2 -->
    <rect x="454" y="200" width="54" height="54" rx="10" fill="#EFF4E6" stroke="#C9C2A8" stroke-width="5"/>
    <rect x="516" y="200" width="54" height="54" rx="10" fill="#F8D8D0" stroke="#C9453C" stroke-width="6"/>
    <rect x="578" y="200" width="54" height="54" rx="10" fill="#EFF4E6" stroke="#C9C2A8" stroke-width="5"/>
    <rect x="640" y="200" width="54" height="54" rx="10" fill="#EFF4E6" stroke="#C9C2A8" stroke-width="5"/>
    <!-- 行 3 -->
    <rect x="454" y="268" width="54" height="54" rx="10" fill="#EFF4E6" stroke="#C9C2A8" stroke-width="5"/>
    <rect x="516" y="268" width="54" height="54" rx="10" fill="#EFF4E6" stroke="#C9C2A8" stroke-width="5"/>
    <rect x="578" y="268" width="54" height="54" rx="10" fill="#EFF4E6" stroke="#C9C2A8" stroke-width="5"/>
    <rect x="640" y="268" width="54" height="54" rx="10" fill="#EFF4E6" stroke="#C9C2A8" stroke-width="5"/>
  </g>
  <!-- 字块刻痕：普通=短横，异读=圆圈 -->
  <g stroke="#8A9A8C" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M464 156 H498 M464 172 H482"/><path d="M526 156 H560 M526 172 H546"/>
    <path d="M588 156 H622 M588 172 H604"/><path d="M650 158 H684"/>
    <path d="M464 224 H498 M464 240 H482"/><path d="M588 224 H622 M588 240 H604"/>
    <path d="M650 224 H684 M650 240 H668"/>
    <path d="M464 292 H498 M464 308 H482"/><path d="M526 292 H560 M526 308 H544"/>
    <path d="M588 292 H622 M588 308 H604"/><path d="M650 292 H684 M650 308 H666"/>
  </g>
  <circle cx="543" cy="227" r="13" fill="none" stroke="#C9453C" stroke-width="5"/>
  <path d="M652 158 l9 9 l16 -18" stroke="#2D9B6A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 找茬圈 -->
  <ellipse cx="543" cy="227" rx="40" ry="36" fill="none" stroke="#C9453C" stroke-width="8" transform="rotate(-6 543 227)"/>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
