<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFF0E5"/>
      <stop offset="0.55" stop-color="#C0DECB"/>
      <stop offset="1" stop-color="#A5D3BC"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E6B4E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 赛道 -->
  <rect y="340" width="800" height="54" fill="#6FA886" opacity="0.5"/>
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="34 24" fill="none" opacity="0.45">
    <path d="M40 356 H760"/><path d="M20 378 H740"/>
  </g>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#7FB08F" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#6B9C7C" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 88 h11 M97.5 82.5 v11" stroke-width="3.2"/>
    <path d="M704 76 h12 M710 70 v12" stroke-width="3.4"/>
    <path d="M746 250 h9 M750.5 245.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M56 240 h9 M60.5 235.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF6EE" opacity="0.55">
    <circle cx="140" cy="140" r="4"/><circle cx="748" cy="150" r="3.4"/><circle cx="66" cy="190" r="3"/><circle cx="108" cy="310" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="420" cy="390" rx="270" ry="20" fill="#4E7F62" opacity="0.4"/>

  <!-- 冲刺速度线 -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M84 210 H158"/><path d="M64 250 H148"/><path d="M92 292 H164"/>
  </g>

  <!-- 键盘（主视觉，签名表情） -->
  <g transform="rotate(-2 380 250)" stroke-linejoin="round">
    <rect x="160" y="165" width="440" height="170" rx="22" fill="#F6F3E8" stroke="#3A2A1E" stroke-width="9"/>
    <g fill="#E2E7D8" stroke="#3A2A1E" stroke-width="5">
      <rect x="180" y="183" width="44" height="32" rx="7"/><rect x="232" y="183" width="44" height="32" rx="7"/><rect x="284" y="183" width="44" height="32" rx="7"/><rect x="336" y="183" width="44" height="32" rx="7"/><rect x="388" y="183" width="44" height="32" rx="7"/><rect x="440" y="183" width="44" height="32" rx="7"/><rect x="492" y="183" width="44" height="32" rx="7"/>
      <rect x="180" y="223" width="44" height="32" rx="7"/><rect x="232" y="223" width="44" height="32" rx="7"/><rect x="284" y="223" width="44" height="32" rx="7" fill="#CFE9DB"/><rect x="336" y="223" width="44" height="32" rx="7"/><rect x="388" y="223" width="44" height="32" rx="7"/><rect x="440" y="223" width="44" height="32" rx="7"/><rect x="492" y="223" width="44" height="32" rx="7"/>
      <rect x="180" y="263" width="44" height="32" rx="7" fill="#F7E3B8"/><rect x="232" y="263" width="44" height="32" rx="7"/><rect x="492" y="263" width="44" height="32" rx="7"/>
    </g>
    <rect x="284" y="263" width="180" height="32" rx="9" fill="#CFE9DB" stroke="#3A2A1E" stroke-width="5"/>
