    <rect x="698" y="168" width="84" height="60" rx="6" fill="#FBF7E8" stroke="#3A2A1E" stroke-width="7"/>
    <g>
      <rect x="698" y="168" width="21" height="20" fill="#3A2A1E"/><rect x="740" y="168" width="21" height="20" fill="#3A2A1E"/>
      <rect x="719" y="188" width="21" height="20" fill="#3A2A1E"/><rect x="761" y="188" width="21" height="20" fill="#3A2A1E"/>
      <rect x="698" y="208" width="21" height="20" fill="#3A2A1E"/><rect x="740" y="208" width="21" height="20" fill="#3A2A1E"/>
    </g>
    <path d="M676 356 h10 M681 351 v10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
