    <circle cx="362" cy="308" r="7" fill="#1F1A14"/>
    <circle cx="398" cy="308" r="7" fill="#1F1A14"/>
    <path d="M368 320 Q380 329 392 319" stroke="#1F1A14" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <circle cx="190" cy="188" r="9" fill="#FFFFFF" opacity="0.4"/>
  </g>
  <!-- 已对齐输入提示砖 -->
  <g stroke-linejoin="round">
    <rect x="300" y="130" width="56" height="26" rx="8" fill="#2D9B6A" stroke="#17734A" stroke-width="4"/>
    <rect x="364" y="130" width="56" height="26" rx="8" fill="#3FAE7A" stroke="#17734A" stroke-width="4"/>
    <rect x="428" y="130" width="56" height="26" rx="8" fill="#F2B34C" stroke="#C99A3A" stroke-width="4"/>
  </g>

  <!-- 终点旗 -->
  <g stroke-linejoin="round">
