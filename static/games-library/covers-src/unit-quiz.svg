    <path d="M330 172 L344 160" stroke="#C4574A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="330" cy="172" r="4" fill="#3A2A1E"/>
    <circle cx="316" cy="152" r="7" fill="#FFFFFF" opacity="0.5"/>
