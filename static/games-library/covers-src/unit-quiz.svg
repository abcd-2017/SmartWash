  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect y="392" width="800" height="58" fill="#3E6E88" opacity="0.6"/>
  <rect y="392" width="800" height="6" fill="#335D74" opacity="0.6"/>
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
