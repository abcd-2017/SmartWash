    <circle cx="-34" cy="-56" r="9" fill="#1F1A14"/>
    <circle cx="34" cy="-56" r="9" fill="#1F1A14"/>
    <circle cx="-31" cy="-59" r="3.2" fill="#FFFFFF"/>
    <circle cx="37" cy="-59" r="3.2" fill="#FFFFFF"/>
    <use href="#pipH" transform="translate(0 6) scale(3.4)" fill="#C8465C"/>
    <path d="M-24 62 Q0 80 24 60" stroke="#1F1A14" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="-52" cy="-84" r="13" fill="#FFFFFF" opacity="0.45"/>
