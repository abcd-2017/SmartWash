<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#68BE86"/>
      <stop offset="0.55" stop-color="#4AA56A"/>
      <stop offset="1" stop-color="#338C53"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1B5A38" stop-opacity="0.3"/>
    </radialGradient>
    <path id="pipH" d="M0 3 C -1.5 -1 -6 -1 -6 2.5 C -6 5.5 -2 7.5 0 9.5 C 2 7.5 6 5.5 6 2.5 C 6 -1 1.5 -1 0 3 Z"/>
    <path id="pipS" d="M0 -9 C 2 -5 6.5 -3.5 6.5 0.5 C 6.5 3.5 2.5 4.8 0.8 3 L 2.4 9 L -2.4 9 L -0.8 3 C -2.5 4.8 -6.5 3.5 -6.5 0.5 C -6.5 -3.5 -2 -5 0 -9 Z"/>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#2A7A46" opacity="0.6"/>
  <rect y="394" width="800" height="6" fill="#22663A" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M88 64 h11 M93.5 58.5 v11" stroke-width="3.2"/>
    <path d="M712 66 h12 M718 60 v12" stroke-width="3.4"/>
    <path d="M52 210 h9 M56.5 205.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M748 230 h9 M752.5 225.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF7EE" opacity="0.5">
    <circle cx="150" cy="110" r="4"/><circle cx="672" cy="110" r="3.4"/><circle cx="46" cy="170" r="3"/><circle cx="750" cy="170" r="2.6"/>
  </g>

  <ellipse cx="400" cy="422" rx="286" ry="22" fill="#1B5A38" opacity="0.35"/>

