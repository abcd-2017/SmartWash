    <rect x="572" y="284" width="90" height="124" rx="9" fill="#A83850" stroke="#5E1E30" stroke-width="6"/>
    <rect x="582" y="294" width="70" height="104" rx="6" fill="none" stroke="#F7E3E8" stroke-width="3.5" opacity="0.85"/>
    <path d="M617 330 L631 344 L617 358 L603 344 Z" fill="#F7E3E8" opacity="0.85"/>
  </g>

  <!-- 左家大牌（签名表情 + 大红桃） -->
  <g transform="translate(300 168) rotate(-9)">
