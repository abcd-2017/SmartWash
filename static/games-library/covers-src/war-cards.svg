  <g>
    <rect x="140" y="200" width="90" height="124" rx="9" fill="#2D9B6A" stroke="#1E5038" stroke-width="6" transform="rotate(-2 185 262)"/>
    <rect x="142" y="214" width="90" height="124" rx="9" fill="#2D9B6A" stroke="#1E5038" stroke-width="6" transform="rotate(2 187 276)"/>
    <rect x="140" y="228" width="90" height="124" rx="9" fill="#2D9B6A" stroke="#1E5038" stroke-width="6" transform="rotate(-1 185 290)"/>
    <rect x="143" y="242" width="90" height="124" rx="9" fill="#2D9B6A" stroke="#1E5038" stroke-width="6" transform="rotate(1 188 304)"/>
    <rect x="141" y="256" width="90" height="124" rx="9" fill="#2D9B6A" stroke="#1E5038" stroke-width="6" transform="rotate(-2 186 318)"/>
    <rect x="142" y="270" width="90" height="124" rx="9" fill="#2D9B6A" stroke="#1E5038" stroke-width="6"/>
    <rect x="152" y="280" width="70" height="104" rx="6" fill="none" stroke="#EAF7EE" stroke-width="3.5" opacity="0.85"/>
