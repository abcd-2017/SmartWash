  <circle cx="400" cy="120" r="9" fill="#F2C14E" stroke="#3A2A1E" stroke-width="4"/>

  <!-- 出牌轨迹 -->
  <path d="M214 268 Q250 236 262 208" stroke="#F2FBF4" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 10" fill="none" opacity="0.85"/>
  <path d="M584 268 Q548 236 538 208" stroke="#F7E3E8" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 10" fill="none" opacity="0.85"/>

  <rect width="800" height="450" fill="url(#vign)"/>
