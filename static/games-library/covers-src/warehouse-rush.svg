    <circle cx="352" cy="302" r="10" fill="#1F1A14"/>
    <circle cx="396" cy="302" r="10" fill="#1F1A14"/>
    <circle cx="355" cy="299" r="3.2" fill="#FFFFFF"/>
    <circle cx="399" cy="299" r="3.2" fill="#FFFFFF"/>
    <path d="M362 328 Q374 338 388 327" stroke="#1F1A14" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <!-- 轮子 -->
    <circle cx="352" cy="362" r="22" fill="#3A2A1E"/>
    <circle cx="352" cy="362" r="8" fill="#C9CDD2"/>
    <circle cx="446" cy="362" r="22" fill="#3A2A1E"/>
    <circle cx="446" cy="362" r="8" fill="#C9CDD2"/>
    <circle cx="336" cy="290" r="11" fill="#FFFFFF" opacity="0.45"/>
