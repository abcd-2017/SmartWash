      <rect x="172" y="114" width="54" height="34" fill="#9CC4D8"/>
      <rect x="110" y="186" width="70" height="42" fill="#E8A13C"/>
      <rect x="192" y="194" width="44" height="34" fill="#C9A876"/>
      <rect x="104" y="266" width="64" height="42" fill="#9CC4D8"/>
      <rect x="180" y="274" width="54" height="34" fill="#E8A13C"/>
