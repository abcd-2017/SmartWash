    <rect x="576" y="100" width="12" height="262" fill="#8A5A3A" stroke="#3A2A1E" stroke-width="5"/>
    <rect x="736" y="100" width="12" height="262" fill="#8A5A3A" stroke="#3A2A1E" stroke-width="5"/>
    <rect x="576" y="148" width="172" height="10" fill="#A8763E" stroke="#3A2A1E" stroke-width="4"/>
    <rect x="576" y="228" width="172" height="10" fill="#A8763E" stroke="#3A2A1E" stroke-width="4"/>
    <rect x="576" y="308" width="172" height="10" fill="#A8763E" stroke="#3A2A1E" stroke-width="4"/>
