  <rect x="240" y="334" width="80" height="80" rx="8" fill="#8A6E4A" stroke="#3A2A1E" stroke-width="8"/>
  <rect x="348" y="316" width="92" height="98" rx="8" fill="#A8875A" stroke="#3A2A1E" stroke-width="8"/>
  <rect x="458" y="294" width="116" height="120" rx="8" fill="#C9B691" stroke="#3A2A1E" stroke-width="8"/>
  <circle cx="478" cy="316" r="11" fill="#FFFFFF" opacity="0.4"/>
