  <rect x="390" y="180" width="20" height="202" fill="#8A6E4A" stroke="#3A2A1E" stroke-width="8"/>
  <circle cx="400" cy="172" r="13" fill="#D4A94E" stroke="#3A2A1E" stroke-width="7"/>
