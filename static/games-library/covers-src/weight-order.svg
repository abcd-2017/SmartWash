    <path d="M96 96 h11 M101.5 90.5 v11" stroke-width="3.2"/>
    <path d="M704 92 h12 M710 86 v12" stroke-width="3.4"/>
    <path d="M726 260 h9 M730.5 255.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M68 270 h9 M72.5 265.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#FFF3DC" opacity="0.5">
    <circle cx="166" cy="156" r="4"/><circle cx="712" cy="164" r="3.4"/><circle cx="58" cy="220" r="3"/><circle cx="742" cy="212" r="2.6"/>
