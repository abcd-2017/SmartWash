  <path d="M235 190 L235 240 M565 190 L565 240" stroke="#3A2A1E" stroke-width="5" stroke-linecap="round"/>
  <rect x="218" y="220" width="34" height="22" rx="4" fill="#C9B691" stroke="#3A2A1E" stroke-width="6"/>
  <rect x="548" y="218" width="34" height="24" rx="4" fill="#6B5232" stroke="#3A2A1E" stroke-width="6"/>
  <path d="M203 242 Q235 272 267 242 Z" fill="#C9B691" stroke="#3A2A1E" stroke-width="7" stroke-linejoin="round"/>
  <path d="M533 242 Q565 272 597 242 Z" fill="#C9B691" stroke="#3A2A1E" stroke-width="7" stroke-linejoin="round"/>
