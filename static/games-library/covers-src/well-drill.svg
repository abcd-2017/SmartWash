<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE9F2"/>
      <stop offset="0.5" stop-color="#C9B088"/>
      <stop offset="1" stop-color="#6E5436"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#241A0C" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 地层剖面 -->
  <path d="M0 212 Q200 202 400 212 Q600 222 800 210 L800 286 Q600 296 400 286 Q200 276 0 288 Z" fill="#C9A876"/>
  <path d="M0 288 Q200 278 400 288 Q600 298 800 286 L800 356 Q600 366 400 356 Q200 346 0 358 Z" fill="#9A7B52"/>
  <path d="M0 358 Q200 348 400 358 Q600 368 800 356 L800 450 L0 450 Z" fill="#78766E"/>
