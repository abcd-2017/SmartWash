  <g stroke="#5E5C56" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M80 400 Q140 390 200 402 M300 420 Q360 410 420 422 M520 400 Q580 390 640 402 M180 436 Q240 426 300 438"/>
  </g>
  <!-- 草皮 -->
  <path d="M0 210 Q200 200 400 210 Q600 220 800 208 L800 220 L0 220 Z" fill="#5E8C4A"/>
