    <circle cx="378" cy="240" r="17" fill="#A87944" stroke="#4A3520" stroke-width="7"/>
    <circle cx="378" cy="240" r="8" fill="#E8A87E"/>
    <circle cx="438" cy="240" r="17" fill="#A87944" stroke="#4A3520" stroke-width="7"/>
    <circle cx="438" cy="240" r="8" fill="#E8A87E"/>
    <circle cx="408" cy="290" r="58" fill="#B98A5E" stroke="#4A3520" stroke-width="8"/>
    <circle cx="408" cy="290" r="58" fill="url(#gloss)"/>
    <circle cx="388" cy="278" r="8" fill="#3A2A1E"/>
    <circle cx="428" cy="278" r="8" fill="#3A2A1E"/>
    <circle cx="391" cy="275" r="2.8" fill="#FFFFFF"/>
    <circle cx="431" cy="275" r="2.8" fill="#FFFFFF"/>
    <ellipse cx="408" cy="298" rx="11" ry="8" fill="#E88A6A" stroke="#4A3520" stroke-width="5"/>
