<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FC76F"/>
      <stop offset="0.55" stop-color="#7DB55E"/>
      <stop offset="1" stop-color="#6BA34F"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3E6B2E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="392" width="800" height="58" fill="#58913F" opacity="0.85"/>
  <rect y="392" width="800" height="6" fill="#4A7F34" opacity="0.8"/>
  <!-- 草丛点缀 -->
  <g stroke="#3E7A2C" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M96 420 Q92 408 96 400 M96 420 Q102 410 106 404"/>
    <path d="M660 424 Q656 412 660 404 M660 424 Q666 414 670 408"/>
    <path d="M740 408 Q736 396 740 388 M740 408 Q746 398 750 392"/>
