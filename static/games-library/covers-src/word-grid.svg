<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E1F0E7"/>
      <stop offset="0.55" stop-color="#C7E3D3"/>
      <stop offset="1" stop-color="#AED5C1"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E6B4E" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 底部地面带 -->
  <rect y="394" width="800" height="56" fill="#94C4A6" opacity="0.55"/>
  <rect y="394" width="800" height="6" fill="#80B094" opacity="0.55"/>
  <!-- 星尘点缀 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M80 80 h11 M85.5 74.5 v11" stroke-width="3.2"/>
    <path d="M716 72 h12 M722 66 v12" stroke-width="3.4"/>
    <path d="M748 300 h9 M752.5 295.5 v9" stroke-width="2.6" opacity="0.7"/>
    <path d="M52 250 h9 M56.5 245.5 v9" stroke-width="2.6" opacity="0.65"/>
  </g>
  <g fill="#EAF6EE" opacity="0.55">
    <circle cx="130" cy="130" r="4"/><circle cx="748" cy="140" r="3.4"/><circle cx="60" cy="180" r="3"/><circle cx="700" cy="350" r="2.6"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="408" rx="252" ry="20" fill="#5E9478" opacity="0.35"/>

  <!-- 纵横词道 -->
  <rect x="368" y="28" width="64" height="372" rx="32" fill="#FFFFFF" opacity="0.4" stroke="#9CC3AC" stroke-width="6"/>
  <rect x="120" y="182" width="560" height="64" rx="32" fill="#FFFFFF" opacity="0.4" stroke="#9CC3AC" stroke-width="6"/>

  <!-- 十字格盘（主视觉，签名表情在中心格） -->
  <g stroke-linejoin="round">
    <rect x="345" y="34" width="110" height="110" rx="18" fill="#3FAE7A" stroke="#3A2A1E" stroke-width="8"/>
    <rect x="122" y="159" width="110" height="110" rx="18" fill="#2D9B6A" stroke="#3A2A1E" stroke-width="8"/>
    <rect x="568" y="159" width="110" height="110" rx="18" fill="#3FAE7A" stroke="#3A2A1E" stroke-width="8"/>
    <rect x="345" y="282" width="110" height="110" rx="18" fill="#E88B5A" stroke="#3A2A1E" stroke-width="8"/>
    <rect x="342" y="156" width="116" height="116" rx="20" fill="#F2B34C" stroke="#3A2A1E" stroke-width="9"/>
    <!-- 字块刻痕 -->
    <g stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M372 62 H428 M400 62 V92" stroke="#FFFFFF"/>
      <path d="M150 190 H206 M150 212 H182" stroke="#FFFFFF"/>
      <path d="M596 190 H650 M596 212 H628" stroke="#FFFFFF"/>
      <path d="M372 312 H428 M384 334 H420" stroke="#FFFFFF"/>
    </g>
    <!-- 签名表情（中心交叉格） -->
    <circle cx="376" cy="198" r="9" fill="#1F1A14"/>
    <circle cx="424" cy="198" r="9" fill="#1F1A14"/>
    <path d="M382 224 Q400 238 418 223" stroke="#1F1A14" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <circle cx="364" cy="182" r="9" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- 交叉亮星 -->
  <path d="M470 96 h11 M475.5 90.5 v11" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M322 336 h11 M327.5 330.5 v11" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- 字池余片 -->
  <g stroke-linejoin="round">
    <rect x="84" y="330" width="50" height="50" rx="10" fill="#EFF2E2" stroke="#3A2A1E" stroke-width="6"/>
    <rect x="142" y="330" width="50" height="50" rx="10" fill="#EFF2E2" stroke="#3A2A1E" stroke-width="6"/>
    <rect x="200" y="330" width="50" height="50" rx="10" fill="#DFF0E4" stroke="#17734A" stroke-width="6"/>
    <g stroke="#8A9A8C" stroke-width="4.5" stroke-linecap="round" fill="none">
      <path d="M94 344 H124 M94 360 H114"/>
      <path d="M152 344 H182 M167 344 V372"/>
      <path d="M210 346 H240 M210 362 H232"/>
    </g>
    <path d="M214 380 l8 8 l16 -16" stroke="#17734A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <rect width="800" height="450" fill="url(#vign)"/>
</svg>
