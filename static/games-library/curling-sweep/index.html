/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 调色板（颜色全部经 CSS 变量读取，JS 零颜色字面量） ========== */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim();}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),text:v("--g-text"),
    muted:v("--g-muted"),faint:v("--g-faint"),border:v("--g-border"),hairline:v("--g-hairline"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    onSoft:v("--g-on-soft"),onPrimary:v("--g-on-primary"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),
    stA:v("--g-st-a"),stB:v("--g-st-b"),stC:v("--g-st-c"),stD:v("--g-st-d"),stE:v("--g-st-e"),stF:v("--g-st-f")};
}
window.__gOnTheme=function(){palLoad();if(typeof draw==="function")draw();};
palLoad();

/* ========== 通用工具与覆盖层面板 ========== */
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
var overlayEl=$("overlay"),panelEl=$("panel");
function showPanel(html){panelEl.innerHTML=html;overlayEl.classList.add("show");}
function hideOverlay(){overlayEl.classList.remove("show");}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}

/* ==================== 冰壶擦冰（掷壶定力 + 擦冰控滑，关卡驱动） ==================== */
var GAME_KEY="curling-sweep",SAVE_KEY="sw.curlingsweep.v1";
var LEVELS_KEY="sw.curlingsweep.v1.levels",LEVELS_VER_KEY="sw.curlingsweep.v1.levels.ver";

/*XC-CORE-BEGIN*/
var GEN={};
function csSeed(no){return no*7727+6029;}
function csRng(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var CS_MU=150,CS_MU_SW=62,CS_CURL=22,CS_STOP=4,CS_R=13,CS_DT=1/120;
var CS_HX=195,CS_HY=100,CS_OX=195,CS_OY=470;
var CS_GRADES=[10,7,5,3,2,0];
GEN.scoreOf=function(d){
  if(d<=14)return 10;
  if(d<=26)return 7;
  if(d<=38)return 5;
  if(d<=50)return 3;
  if(d<=62)return 2;
  return 0;
};
GEN.gradeBelow=function(sc){
  var i=CS_GRADES.indexOf(sc);
  if(i<0||i>=CS_GRADES.length-1)return null;
  return CS_GRADES[i+1];
};
/* 物理世界单步（游戏与求解器共用）：摩擦 / 擦冰 / 旋度 / 边界 / 等质量弹性碰撞 */
GEN.physWorld=function(w,sweep,dt){
  var i,j;
  for(i=0;i<w.stones.length;i++){
    var s=w.stones[i];
    var sp=Math.hypot(s.vx,s.vy);
    if(sp<=0)continue;
    var mu=sweep&&s.active?CS_MU_SW:CS_MU;
    var ns=Math.max(0,sp-mu*dt);
    if(ns<CS_STOP){s.vx=0;s.vy=0;continue;}
    var k=ns/sp;
    s.vx*=k;s.vy*=k;
    var px=-s.vy/ns,py=s.vx/ns;
    s.vx+=px*w.curl*dt;s.vy+=py*w.curl*dt;
    s.x+=s.vx*dt;s.y+=s.vy*dt;
  }
  for(i=0;i<w.stones.length;i++){
    var s2=w.stones[i];
    if(s2.x<CS_R){s2.x=CS_R;s2.vx=Math.abs(s2.vx)*0.4;}
    if(s2.x>390-CS_R){s2.x=390-CS_R;s2.vx=-Math.abs(s2.vx)*0.4;}
    if(s2.y<CS_R){s2.y=CS_R;s2.vy=Math.abs(s2.vy)*0.4;}
    if(s2.y>520-CS_R){s2.y=520-CS_R;s2.vy=-Math.abs(s2.vy)*0.4;}
  }
  for(i=0;i<w.stones.length;i++)for(j=i+1;j<w.stones.length;j++){
    var a=w.stones[i],b=w.stones[j];
    var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<CS_R*2&&d>0.001){
      var nx=dx/d,ny=dy/d,ov=(CS_R*2-d)/2;
      a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
      var van=a.vx*nx+a.vy*ny,vbn=b.vx*nx+b.vy*ny;
      var j2=-(1+0.88)*(vbn-van)/2;
      a.vx+=j2*nx;a.vy+=j2*ny;
      b.vx-=j2*nx;b.vy-=j2*ny;
    }
  }
};
function csAllStopped(w){
  for(var i=0;i<w.stones.length;i++)if(w.stones[i].vx!==0||w.stones[i].vy!==0)return false;
  return true;
}
/* 求解：角度 ±10°（步 2°）× 力度 10 档 × 3 种擦冰节奏，取可达最高分 */
GEN.simulate=function(lv,aoff,power,pattern){
  var w={curl:CS_CURL*lv.curl,stones:[{x:CS_OX,y:CS_OY,vx:0,vy:0,active:true}]};
  for(var g=0;g<lv.guards.length;g++)w.stones.push({x:lv.guards[g].x,y:lv.guards[g].y,vx:0,vy:0,active:false});
  var rad=aoff*Math.PI/180;
  var v0=260+power*330;
  w.stones[0].vx=Math.sin(rad)*v0;
  w.stones[0].vy=-Math.cos(rad)*v0;
  var stamina=lv.stamina,sweepT=0,t=0;
  while(t<14){
    var sp=Math.hypot(w.stones[0].vx,w.stones[0].vy);
    var doSweep=false;
    if(sweepT<=0&&stamina>0){
      if(pattern===2){sweepT=0.25;stamina--;}
      else if(pattern===1&&sp<v0/2){sweepT=0.25;stamina--;}
    }
    if(sweepT>0){doSweep=true;sweepT-=CS_DT;}
    GEN.physWorld(w,doSweep,CS_DT);
    t+=CS_DT;
    if(csAllStopped(w))break;
  }
  var s0=w.stones[0];
  return GEN.scoreOf(Math.hypot(s0.x-CS_HX,s0.y-CS_HY));
};
GEN.solveBest=function(lv){
  var best=0,a,pi;
  for(a=-10;a<=10;a+=2)for(pi=0;pi<10;pi++){
    var power=0.08+pi*0.102;
    for(var pt=0;pt<3;pt++){
      var sc=GEN.simulate(lv,a,power,pt);
      if(sc>best)best=sc;
      if(best===10)return best;
    }
  }
  return best;
};
GEN.gen=function(no,seed){
  var p=(no-1)/39;
  var nGuards=Math.floor(p*3.99);
  var stamina=14-Math.floor(p*6);
  var s=(seed==null?csSeed(no):seed);
  for(var att=0;att<80;att++){
    var rng=csRng(s+att*7919);
    var guards=[],i;
    while(guards.length<nGuards){
      var gx=80+rng()*230,gy=180+rng()*140;
      if(Math.hypot(gx-CS_HX,gy-CS_HY)<95)continue;
      var bad=false;
      for(i=0;i<guards.length;i++)if(Math.hypot(gx-guards[i].x,gy-guards[i].y)<36){bad=true;break;}
      if(!bad)guards.push({x:Math.round(gx),y:Math.round(gy)});
    }
    var lv={name:"冰壶·"+(no<10?"0"+no:no),no:no,seed:s+att*7919,guards:guards,
      stamina:stamina,curl:rng()<0.5?1:-1};
    var best=GEN.solveBest(lv);
    var target=GEN.gradeBelow(best);
    if(best>=5&&target!=null&&target>=2){
      lv.target=target;
      lv.best=best;
      if(GEN.validate(lv).ok)return lv;
    }
  }
  return {name:"冰壶·01",no:no,seed:s,guards:[],stamina:14,curl:1,target:7,best:10};
};
/* 独立验证器：复跑求解器确认可达分 ≥5、target 恰为可达分的下一档、结构合法 */
GEN.validate=function(lv){
  if(!lv||typeof lv!=="object")return{ok:false,why:"shape"};
  if(!Array.isArray(lv.guards)||lv.guards.length>3)return{ok:false,why:"guards"};
  for(var i=0;i<lv.guards.length;i++){
    var g=lv.guards[i];
    if(!g||Math.hypot(g.x-CS_HX,g.y-CS_HY)<95)return{ok:false,why:"guard-pos"};
  }
  if(!(Number.isInteger(lv.stamina)&&lv.stamina>=8&&lv.stamina<=14))return{ok:false,why:"stamina"};
  if(lv.curl!==1&&lv.curl!==-1)return{ok:false,why:"curl"};
  if(!(Number.isInteger(lv.target)&&lv.target>=2&&lv.target<=7))return{ok:false,why:"target"};
  var best=GEN.solveBest(lv);
  if(best<5)return{ok:false,why:"unsolvable"};
  var tgt=GEN.gradeBelow(best);
  if(tgt==null||tgt<2||lv.target!==tgt)return{ok:false,why:"target"};
  return{ok:true,why:"",best:best};
};
GEN.validateLevelsAll=function(){
  var fails=[],n=0;
  for(var no=1;no<=40;no++){
    var lv=GEN.gen(no,csSeed(no));
    var r=GEN.validate(lv);
    if(!r.ok)fails.push(no+"("+r.why+")");
    n++;
  }
  return {total:n,fails:fails,allOk:fails.length===0};
};
globalThis.__XC=GEN;
/*XC-CORE-END*/

/* ---------- 默认关卡（确定性种子，40 关） ---------- */
var DEFAULT_LEVELS=[];
(function(){
  for(var no=1;no<=40;no++)DEFAULT_LEVELS.push({name:"冰壶·"+(no<10?"0"+no:no),no:no,seed:csSeed(no),difficulty:Math.min(6,1+Math.floor((no-1)/7))});
})();
var LEVELS=DEFAULT_LEVELS;
var save=loadSaveData();
var cur=Math.min(save.lv,LEVELS.length-1);

/* ---------- 状态 ---------- */
var course=null,state="ready",paused=false;
var phase="aim",oscT=0,aimLock=0,powerLock=0;
var world=null,sweepT=0,stamina=0,path=[];
var resultScore=0,shakeT=0;
var stLv=$("stLv"),stPow=$("stPow"),stStam=$("stStam"),msgEl=$("msg");
var btnRetry=$("btnRetry"),btnLevels=$("btnLevels");
function say(t){msgEl.textContent=t;}
function totalStars(){var t=0,k;for(k in save.done)t+=save.done[k];return t;}
function refresh(){
  stLv.textContent=(cur+1)+"/"+LEVELS.length;
  stPow.textContent=phase==="slide"||phase==="done"?Math.round(powerLock*100)+"%":"-";
  stStam.textContent=String(stamina);
}

/* ---------- 画布 ---------- */
var NW=390,NH=520,W=390,H=520,S=1,offX=0,offY=0;
var cv=$("cv"),ctx=cv.getContext("2d");
function rr(x0,y0,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x0+r,y0);
  ctx.arcTo(x0+w,y0,x0+w,y0+h,r);ctx.arcTo(x0+w,y0+h,x0,y0+h,r);
  ctx.arcTo(x0,y0+h,x0,y0,r);ctx.arcTo(x0,y0,x0+w,y0,r);
  ctx.closePath();
}
function fit(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));H=Math.max(300,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);offX=(W-NW*S)/2;offY=(H-NH*S)/2;
  draw();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);

/* ---------- 关卡流程 ---------- */
function loadLevel(idx){
  idx=Math.max(0,Math.min(idx,LEVELS.length-1));
  cur=idx;
  var d=LEVELS[idx];
  course=GEN.gen(d.no,d.seed==null?csSeed(d.no):d.seed);
  var chk=GEN.validate(course);
  if(!chk.ok)course=GEN.gen(d.no,csSeed(d.no));
  state="ready";paused=false;
  phase="aim";oscT=0;aimLock=0;powerLock=0;
  stamina=course.stamina;world=null;sweepT=0;path=[];resultScore=0;
  refresh();
}
function enterLevel(i){loadLevel(i);showStart();}
function startPlay(){
  state="running";paused=false;phase="aim";
  hideOverlay();
  say("点画布 / 空格锁定摆动的掷壶方向");
}
function selectClosed(){showStart();}
function buildWorld(){
  world={curl:22*course.curl,stones:[{x:195,y:470,vx:0,vy:0,active:true}]};
  for(var g=0;g<course.guards.length;g++)world.stones.push({x:course.guards[g].x,y:course.guards[g].y,vx:0,vy:0,active:false});
  var rad=aimLock*Math.PI/180;
  var v0=260+powerLock*330;
  world.stones[0].vx=Math.sin(rad)*v0;
  world.stones[0].vy=-Math.cos(rad)*v0;
}
function settle(){
  phase="done";
  var s0=world.stones[0];
  var d=Math.hypot(s0.x-195,s0.y-100);
  resultScore=GEN.scoreOf(d);
  if(resultScore>=course.target)winLevel(d,resultScore);
  else failLevel(d,resultScore);
}
function winLevel(d,sc){
  state="over";
  var stars=sc>=7?3:sc>=course.target?2:1;
  var old=parseInt(save.done[cur],10)||0;
  if(stars>old)save.done[cur]=stars;
  save.best=totalStars();
  if(cur+1>save.lv)save.lv=cur+1;
  persistSave();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:save.lv,metricExtra:save.best}).catch(function(){});
  refresh();
  showWin(d,sc,stars);
}
function failLevel(d,sc){
  state="over";
  showFail(d,sc);
}
function tapAction(){
  if(state!=="running"||paused)return;
  if(phase==="aim"){
    aimLock=Math.sin(2*Math.PI*oscT/1.6)*10;
    phase="power";oscT=0;
    say("方向锁定 "+aimLock.toFixed(1)+"° · 再点锁定力度");
  }else if(phase==="power"){
    powerLock=(Math.sin(2*Math.PI*oscT/1.3)+1)/2;
    buildWorld();
    phase="slide";
    say("擦冰！每点一次擦 0.25 秒");
  }else if(phase==="slide"){
    if(stamina>0&&sweepT<=0){sweepT=0.25;stamina--;refresh();}
  }
}
function stepGame(dt){
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt);
  if(phase==="aim"||phase==="power"){
    oscT+=dt;
    return;
  }
  if(phase!=="slide")return;
  if(sweepT>0)sweepT-=dt;
  var acc=dt;
  var guard=0;
  while(acc>0&&guard<40){
    var sub=Math.min(CS_DT,acc);
    GEN.physWorld(world,sweepT>0,sub);
    acc-=sub;guard++;
    var s0=world.stones[0];
    path.push({x:s0.x,y:s0.y});
    if(path.length>400)path.shift();
    if(csStopped(world)){settle();return;}
  }
}
function csStopped(w){
  for(var i=0;i<w.stones.length;i++)if(w.stones[i].vx!==0||w.stones[i].vy!==0)return false;
  return true;
}

/* ---------- 绘制 ---------- */
function drawStone(s,mine){
  ctx.fillStyle=mine?PAL.primary:PAL.stC;
  ctx.beginPath();ctx.arc(s.x,s.y,13,0,6.3);ctx.fill();
  ctx.strokeStyle=mine?PAL.deep:PAL.stD;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(s.x,s.y,13,0,6.3);ctx.stroke();
  ctx.fillStyle=mine?PAL.onPrimary:PAL.stD;
  ctx.beginPath();ctx.arc(s.x,s.y,5,0,6.3);ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(offX,offY);ctx.scale(S,S);
  if(!course){
    ctx.restore();
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
    rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
    return;
  }
  ctx.fillStyle=PAL.stA;ctx.fillRect(0,0,NW,NH);
  ctx.strokeStyle=PAL.stD;ctx.lineWidth=2;
  ctx.strokeRect(8,8,NW-16,NH-16);
  /* 大本营 */
  ctx.fillStyle=PAL.water;
  ctx.beginPath();ctx.arc(195,100,62,0,6.3);ctx.fill();
  ctx.fillStyle=PAL.surface;
  ctx.beginPath();ctx.arc(195,100,38,0,6.3);ctx.fill();
  ctx.fillStyle=PAL.danger;
  ctx.beginPath();ctx.arc(195,100,14,0,6.3);ctx.fill();
  ctx.strokeStyle=PAL.stD;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(195,100,62,0,6.3);ctx.stroke();
  ctx.beginPath();ctx.arc(195,100,50,0,6.3);ctx.stroke();
  ctx.beginPath();ctx.arc(195,100,38,0,6.3);ctx.stroke();
  ctx.beginPath();ctx.arc(195,100,26,0,6.3);ctx.stroke();
  ctx.beginPath();ctx.arc(195,100,14,0,6.3);ctx.stroke();
  /* 障碍壶 */
  for(var g=0;g<course.guards.length;g++){
    var gg=course.guards[g];
    var gv=world?world.stones[g+1]:null;
    drawStone(gv?gv:gg,false);
  }
  /* 掷壶轨迹 */
  if(world){
    ctx.strokeStyle=PAL.stD;ctx.lineWidth=2;
    ctx.beginPath();
    for(var p2=0;p2<path.length;p2++){
      if(p2===0)ctx.moveTo(path[p2].x,path[p2].y);else ctx.lineTo(path[p2].x,path[p2].y);
    }
    ctx.stroke();
  }
  /* 我方壶 */
  if(world)drawStone(world.stones[0],true);
  else{
    /* 瞄准阶段：起点 + 摆动指向 */
    var ang=phase==="aim"?Math.sin(2*Math.PI*oscT/1.6)*10:aimLock;
    var rad=ang*Math.PI/180;
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=3;
    ctx.setLineDash([8,7]);
    ctx.beginPath();
    ctx.moveTo(195,470);
    ctx.lineTo(195+Math.sin(rad)*210,470-Math.cos(rad)*210);
    ctx.stroke();
    ctx.setLineDash([]);
    drawStone({x:195,y:470},true);
    if(phase==="power"){
      var pw=(Math.sin(2*Math.PI*oscT/1.3)+1)/2;
      ctx.fillStyle=PAL.surface2;
      rr(330,180,26,260,10);ctx.fill();
      ctx.fillStyle=PAL.deep;
      rr(330,440-260*pw,26,260*pw,10);ctx.fill();
      ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
      rr(330,180,26,260,10);ctx.stroke();
    }
  }
  /* 擦冰特效 */
  if(sweepT>0&&world){
    var s0=world.stones[0];
    ctx.strokeStyle=PAL.stF;ctx.lineWidth=3;
    for(var sw=0;sw<3;sw++){
      ctx.beginPath();
      ctx.arc(s0.x+(sw-1)*10,s0.y+18+sw*4,9,0.2,2.8);
      ctx.stroke();
    }
  }
  /* 旋向提示 */
  ctx.fillStyle=PAL.muted;
  ctx.font="600 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.fillText("旋向 "+(course.curl>0?"右曲":"左曲")+" · 目标 "+course.target+" 分",14,26);
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

/* ---------- 覆盖层 ---------- */
function showStart(){
  showPanel(
    '<p class="rt">第 '+(cur+1)+' 关 · '+esc(course.name)+'</p>'+
    '<p class="rs">目标 <b>'+course.target+' 分</b>（圆心10 / 内圈7·5 / 中圈3 / 外圈2）· 擦冰体力 '+course.stamina+' · 旋向 '+(course.curl>0?"右":"左")+(course.guards.length?' · 障碍壶 '+course.guards.length+' 只':'')+'</p>'+
    '<div class="rbtns"><button class="btn" id="ovMain" type="button">开始</button></div>'+
    '<p class="rhint">壶走弧线，方向摆针锁定后还有力度摆条；滑行中连点擦冰可以少减速、滑得更远并压直弧线。</p>'
  );
  $("ovMain").addEventListener("click",function(){startPlay();});
}
function showWin(d,sc,stars){
  var last=cur>=LEVELS.length-1;
  showPanel(
    '<p class="rt">得分！</p>'+
    '<p class="rs">距圆心 '+Math.round(d)+'px · 得分 <b>'+sc+'</b> / 目标 '+course.target+' · 星星 '+stars+' / 3</p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovReplay" type="button">重掷</button>'+
      '<button class="btn" id="ovNext" type="button">'+(last?"已完成全部":"下一关")+'</button>'+
    '</div>'
  );
  $("ovNext").addEventListener("click",function(){enterLevel(last?cur:cur+1);});
  $("ovReplay").addEventListener("click",function(){enterLevel(cur);});
}
function showFail(d,sc){
  showPanel(
    '<p class="rt">差一点</p>'+
    '<p class="rs">距圆心 '+Math.round(d)+'px · 得分 '+sc+' / 目标 '+course.target+'</p>'+
    '<p class="rhint">提示：擦冰越早损失越少但弧线更直；想要大弧线绕开障碍壶就别急着擦。</p>'+
    '<div class="rbtns"><button class="btn" id="ovRetryF" type="button">重掷本关</button></div>'
  );
  $("ovRetryF").addEventListener("click",function(){retry();});
}
function showPause(){
  showPanel(
    '<p class="rt">已暂停</p>'+
    '<p class="rs">阶段：'+(phase==="aim"?"瞄准":phase==="power"?"力度":"滑行")+'</p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovReP" type="button">重掷本关</button>'+
      '<button class="btn" id="ovReR" type="button">继续</button>'+
    '</div>'
  );
  $("ovReR").addEventListener("click",function(){paused=false;hideOverlay();});
  $("ovReP").addEventListener("click",function(){retry();});
}
function retry(){loadLevel(cur);startPlay();}

/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(ev){tapAction();ev.preventDefault();});
window.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k===" "||k==="Enter"){
    e.preventDefault();
    if(state==="running"&&!paused)tapAction();
    else if(state==="ready"||state==="over")retry();
    else if(paused){paused=false;hideOverlay();}
  }
});
btnRetry.addEventListener("click",function(){retry();this.blur();});
btnLevels.addEventListener("click",function(){
  if(state==="running"&&!paused){paused=true;say("选关中");}
  openLevelSelect();this.blur();
});

/* 切后台自动暂停 */
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running"&&!paused&&!overlayEl.classList.contains("show")){
    paused=true;showPause();
  }
});

/* ---------- 主循环与启动 ---------- */
var last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;
  var dt=Math.min(0.033,((ts-last)/1000)||0);
  last=ts;
  if(state==="running"&&!paused)stepGame(dt);
  draw();
}
fit();
refresh();
loadLevel(cur);
showStart();
syncLevelsFromServer();
syncSaveFromServer();
requestAnimationFrame(loop);
window.__validateLevels=GEN.validateLevelsAll;


/* ========== 关卡公共段（DB 下发优先 + localStorage 版本缓存 + 包内默认关兜底；仅函数声明，供游戏段调用） ========== */
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!d||typeof d.name!=="string"||!d.name.trim()||!Number.isInteger(d.no)||d.no<1||!Number.isInteger(d.seed))return null;
    if(seen[d.no])return null;
    seen[d.no]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||list.length<DEFAULT_LEVELS.length)return false;
  for(var i=0;i<list.length;i++){
    var d=list[i],lv;
    try{lv=GEN.gen(d.no,d.seed);}catch(e){return false;}
    if(!lv||!GEN.validate(lv).ok)return false;
  }
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length>=DEFAULT_LEVELS.length){
      for(var i=0;i<list.length;i++){var d=list[i];if(!d||!Number.isInteger(d.no)||!Number.isInteger(d.seed))return v;}
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      if(save.lv>LEVELS.length-1)save.lv=LEVELS.length-1;
      persistSave();loadLevel(cur);
    }
  }).catch(function(){});
}
function loadSaveData(){
  try{
    var s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    if(s&&typeof s==="object"){
      var done={};
      if(s.done&&typeof s.done==="object")for(var k in s.done){var v=parseInt(s.done[k],10);if(v>0)done[k]=v;}
      return{lv:Math.max(0,parseInt(s.lv,10)||0),done:done,best:Math.max(0,parseInt(s.best,10)||0)};
    }
  }catch(e){}
  return{lv:0,done:{},best:0};
}
function persistSave(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(remote.lv,10)||0;if(rl>save.lv){save.lv=rl;changed=true;}
      var rb=parseInt(remote.best,10)||0;if(rb>save.best){save.best=rb;changed=true;}
      if(remote.done&&typeof remote.done==="object")for(var k in remote.done){
        var rv=parseInt(remote.done[k],10)||0,mv=parseInt(save.done[k],10)||0;
        if(rv>mv){save.done[k]=rv;changed=true;}
      }
      if(changed){persistSave();}
    }catch(e){}
  }).catch(function(){});
}
function openLevelSelect(){
  var html='<p class="rt">选择关卡</p><p class="rs">已过关卡标绿，灰色未解锁</p><div class="lv-wrap"><div class="lv-grid">';
  for(var i=0;i<LEVELS.length;i++){
    var done=parseInt(save.done[i],10)>0;
    var locked=i>save.lv;
    html+='<button class="lv-chip'+(i===cur?" sel":"")+(done?" done":"")+'" data-i="'+i+'"'+(locked?" disabled":"")+' type="button">'+(i+1)+'</button>';
  }
  html+='</div></div><div class="rbtns"><button class="btn ghost" id="ovClose" type="button">返回</button></div>';
  showPanel(html);
  var chips=panelEl.querySelectorAll(".lv-chip");
  for(var j=0;j<chips.length;j++){
    chips[j].addEventListener("click",function(){
      var i=parseInt(this.getAttribute("data-i"),10);
      hideOverlay();enterLevel(i);
    });
  }
  $("ovClose").addEventListener("click",function(){hideOverlay();selectClosed();});
}

})();
</script>
