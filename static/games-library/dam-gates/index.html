  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-dg-wall:#6E5330;--g-st-dg-wall2:#4E3B22;--g-st-dg-pipe:#6E7887;--g-st-dg-field:#33422F;color-scheme:dark }

  html, body { margin: 0; padding: 0; }

window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
/*X3-ENGINE-BEGIN*/
var DG=(function(){
"use strict";
/* ===== 离散 tick 水量模型：每 tick 水库进水 → 开着的闸按速率放水 → 洪溢/溢坝/缺水判定 ===== */
function fr(x){return x-Math.floor(x);}
/* 第 1 关为手工设计关（锚点基准），其余公式化生成 + 收敛调整（保证策略可通关，坏关不进表） */
var L1={name:"分水·01",ticks:20,w:5,gr:[3,2],zd:[30,20],zc:[36,26],rc:40,difficulty:1};
function genLevel(i){
  var G=2+Math.floor(i/13),T=22+Math.floor(i/2)*2,w=G+1+(i%3),gr=[],zd=[],zc=[],j;
  for(j=0;j<G;j++)gr.push(2+((i+3*j)%3));
  for(j=0;j<G;j++)zd.push(Math.max(4,Math.round(T*w/G*(0.55+0.35*fr(i*0.37+j*0.61)))));
  for(j=0;j<G;j++)zc.push(zd[j]+gr[j]*(2+(i+j)%3));
  var sc=0;for(j=0;j<G;j++)sc+=zc[j];
  var rc=Math.max(w*6,Math.round(w*T-sc)+w*2);
  var lv={name:"分水·"+(i<9?"0":"")+(i+1),ticks:T,w:w,gr:gr,zd:zd,zc:zc,rc:rc,difficulty:Math.min(6,1+Math.floor(i/7))};
  /* 收敛调整：策略回放不过关就抬高容量与库容（坏关不进表） */
  for(var tries=0;tries<8;tries++){
    if(replay(lv).win)break;
    for(j=0;j<G;j++)lv.zc[j]+=lv.gr[j];
    lv.rc+=w*2;
  }
  return lv;
}
function newState(lv){return {t:0,res:0,del:lv.zd.map(function(){return 0}),open:lv.gr.map(function(){return false}),auto:true,win:false,over:false,reason:null};}
/* 策略（验证器用）：先开「还缺水且不会溢区」的闸（缺口大者优先），蓄水吃紧再开安全闸泄压 */
function policyOpen(lv,st){
  var G=lv.gr.length,open=[],order=[],i;
  for(i=0;i<G;i++){open.push(false);order.push(i);}
  order.sort(function(a,b){return (lv.zd[b]-st.del[b])-(lv.zd[a]-st.del[a]);});
  var proj=st.res;
  for(var o=0;o<order.length;o++){
    var j=order[o];
    if(lv.zd[j]-st.del[j]>0&&st.del[j]+lv.gr[j]<=lv.zc[j]&&proj>0){open[j]=true;proj-=Math.min(proj,lv.gr[j]);}
  }
  for(var o2=0;o2<order.length;o2++){
    var j2=order[o2];
    if(!open[j2]&&proj>lv.rc*0.5&&st.del[j2]+lv.gr[j2]<=lv.zc[j2]&&proj>0){open[j2]=true;proj-=Math.min(proj,lv.gr[j2]);}
  }
  return open;
}
/* 推进一个 tick。forceAll=true 时全闸常开（锚点用例） */
function tick(lv,st,forceAll){
  if(st.over||st.win)return st;
  st.res+=lv.w;
  /* auto=true（验证回放）走策略；auto=false（玩家对局）尊重手动开关 */
  st.open=forceAll?lv.gr.map(function(){return true;}):(st.auto?policyOpen(lv,st):st.open);
  for(var j=0;j<lv.gr.length;j++){
    if(!st.open[j])continue;
    var mv=Math.min(st.res,lv.gr[j]);
    st.del[j]+=mv;st.res-=mv;
    if(st.del[j]>lv.zc[j]){st.over=true;st.reason="flood";return st;}
  }
  if(st.res>lv.rc){st.over=true;st.reason="overflow";return st;}
  st.t++;
  if(st.t>=lv.ticks){
    var ok=true;
    for(var k=0;k<lv.zd.length;k++)if(st.del[k]<lv.zd[k])ok=false;
    if(ok)st.win=true;else{st.over=true;st.reason="demand";}
  }
  return st;
}
function replay(lv,forceAll){
  var st=newState(lv),guard=lv.ticks+500;
  while(!st.over&&!st.win&&guard-->0)tick(lv,st,forceAll);
  return st;
}
/* ===== 关卡表 ===== */
var LEVELS=[L1];
for(var gi=1;gi<40;gi++)LEVELS.push(genLevel(gi));
/* ===== 验证器（含锚点用例） ===== */
function verifyAll(){
  var res=[],i;
  for(i=0;i<LEVELS.length;i++){var st=replay(LEVELS[i]);res.push({ok:st.win,reason:st.reason});}
  return res;
}
function selfTest(){
  var out=[];
  /* 锚点1：第 1 关策略回放 → 过关且各区恰好满容（手工推演结果：36/26） */
  var s1=replay(L1);
  out.push({name:"锚点1·第1关回放过关且供水36/26",pass:s1.win&&s1.del[0]===36&&s1.del[1]===26});
  /* 锚点2：第 1 关全开常开 → 第 13 tick 洪溢（手工推演：3×13=39>36） */
  var s2=replay(L1,true);
  out.push({name:"锚点2·第1关全闸常开必洪溢",pass:s2.over&&s2.reason==="flood"});
  /* 锚点3：全部 40 关策略回放可通关 */
  var all=verifyAll(),bad=[];
  for(var i=0;i<all.length;i++)if(!all[i].ok)bad.push(i+1);
  out.push({name:"全关验证·40关策略回放可通关",pass:bad.length===0,bad:bad.join(",")});
  return out;
}
return {LEVELS:LEVELS,newState:newState,tick:tick,replay:replay,policyOpen:policyOpen,verifyAll:verifyAll,selfTest:selfTest};
})();
window.DG=DG;
/*X3-ENGINE-END*/
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（DB 下发优先：须整表策略回放通过才接受；本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="dam-gates",SAVE_KEY="sw.damgates.v1";
var DEFAULT_LEVELS=DG.LEVELS;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.ticks)||d.ticks<10||d.ticks>120)return false;
  if(!Number.isInteger(d.w)||d.w<1||d.w<1)return false;
  if(!Array.isArray(d.gr)||d.gr.length<2||d.gr.length>4)return false;
  if(!Array.isArray(d.zd)||!Array.isArray(d.zc)||d.zd.length!==d.gr.length||d.zc.length!==d.gr.length)return false;
  for(var j=0;j<d.gr.length;j++){
    if(!Number.isInteger(d.gr[j])||d.gr[j]<1||d.gr[j]>9)return false;
    if(!Number.isInteger(d.zd[j])||d.zd[j]<1)return false;
    if(!Number.isInteger(d.zc[j])||d.zc[j]<=d.zd[j])return false;
  }
  if(!Number.isInteger(d.rc)||d.rc<1)return false;
  var probe=DG.replay({ticks:d.ticks,w:d.w,gr:d.gr,zd:d.zd,zc:d.zc,rc:d.rc});
  return probe.win===true;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  for(var i=0;i<list.length;i++)if(!validLevelData(list[i]))return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){
      var ok=true;
      for(var i=0;i<list.length;i++)if(!validLevelData(list[i])){ok=false;break;}
      if(ok){LEVELS=list;return v;}
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    if(!res||!Array.isArray(res.levels)||!res.levels.length)return;
    var list=[],seen={};
    for(var i=0;i<res.levels.length;i++){
      var row=res.levels[i];
      if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return;
      var d;try{d=JSON.parse(row.dataJson);}catch(e){return;}
      if(seen[d&&d.name])return;seen[d&&d.name]=1;
      list.push(d);
    }
    if(list.length&&applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);buildGateButtons();resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";$("ovBtn").style.background="var(--g-surface2)";$("ovBtn").style.color="var(--g-text)";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),
    wall:v("--g-st-dg-wall"),wall2:v("--g-st-dg-wall2"),pipe:v("--g-st-dg-pipe"),field:v("--g-st-dg-field")};
}
window.__gOnTheme=function(){palLoad()};
palLoad();
/* ---------- 状态（续玩：lv 起步即存档关） ---------- */
var lv=save.lv,L=null,st=null,state="running",gen=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=300;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function buildGateButtons(){
  var row=$("gateRow");row.innerHTML="";
  for(var j=0;j<L.gr.length;j++){
    (function(j){
      var b=document.createElement("button");
      b.className="gate";b.id="gate"+j;
      b.innerHTML="闸 "+(j+1)+"<small>"+L.gr[j]+"/tick</small>";
      b.addEventListener("click",function(){toggleGate(j)});
      row.appendChild(b);
    })(j);
  }
}
function toggleGate(j){
  if(state!=="running"||!st||st.over||st.win)return;
  st.open[j]=!st.open[j];
  updGateButtons();
}
function updGateButtons(){
  for(var j=0;j<L.gr.length;j++){
    var b=$("gate"+j);if(!b)continue;
    b.classList.toggle("on",!!st.open[j]);
  }
}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  st=DG.newState(L);st.auto=false;state="running";gen++;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=L.gr.length+" 区 · 限时 "+L.ticks+" tick";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  buildGateButtons();updStats();updGateButtons();
  $("btnPause").textContent="暂停";
  hideOverlay();
  say("点闸门开关放水：各区要喝够定额，又不能装过容量");
}
function gap(){
  var s=0;
  for(var j=0;j<L.zd.length;j++)s+=Math.max(0,L.zd[j]-st.del[j]);
  return s;
}
function updStats(){
  $("stTick").textContent=Math.max(0,L.ticks-st.t);
  $("stGap").textContent=gap();
  $("stGap").classList.toggle("low",gap()>0);
}
/* ---------- tick 节拍（rAF 驱动；切后台 rAF 停 → 时间自动冻结） ---------- */
var TICK_SEC=0.55,acc=0;
function doTick(){
  DG.tick(L,st,false);
  updGateButtons();updStats();
  if(st.over||st.win)finish();
}
function finish(){
  state="over";gen++;
  if(st.win){
    var tot=0;for(var j=0;j<st.del.length;j++)tot+=st.del[j];
    if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:tot}).catch(function(){});
    $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"配水完成！";
    $("ovDesc").innerHTML="各区定额全部满足，累计供水 "+tot+"（水库余 "+st.res+"）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
    $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
    $("ovBtn").style.background="var(--g-btn-primary)";$("ovBtn").style.color="#fff";
  }else{
    var why=st.reason==="flood"?"有区装水超过容量，决堤了":st.reason==="overflow"?"水库没及时泄水，溢坝了":"时间到还有区没喝够定额";
    $("ovTitle").textContent="调度失败";
    $("ovDesc").textContent=why+"。调整开关闸的时机再来。";
    $("ovBtn").textContent="重试本关";
    $("ovBtn").style.background="var(--g-btn-primary)";$("ovBtn").style.color="#fff";
  }
  $("overlay").classList.add("show");
}
/* ---------- 绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.height=Math.round(w*H/W)+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*H/W*dpr);
  var sc=w/W;
  ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
}
function rr(x,y,w2,h2,r){
  r=Math.min(r,w2/2,h2/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);
  ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();
}
function draw(){
  ctx.fillStyle=PAL.field;ctx.fillRect(0,0,W,H);
  if(!st)return;
  var G=L.gr.length;
  /* 水库（左） */
  var tx=24,ty=40,tw=86,th=150;
  ctx.fillStyle=PAL.wall;
  rr(tx-8,ty-14,tw+16,th+22,10);ctx.fill();
  ctx.strokeStyle=PAL.wall2;ctx.lineWidth=2;ctx.stroke();
  var wf=Math.min(1,st.res/L.rc);
  ctx.fillStyle=PAL.water;
  ctx.fillRect(tx,ty+th*(1-wf),tw,th*wf);
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.strokeRect(tx,ty,tw,th);
  ctx.fillStyle=PAL.text;
  ctx.font="700 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("水库 "+st.res+"/"+L.rc,tx+tw/2,ty-24);
  /* 闸门与管道 */
  var zx0=250,zgap=Math.min(64,(W-60-zx0)/G);
  for(var j=0;j<G;j++){
    var zy=44+j*((H-90)/Math.max(1,G));
    var zx=zx0+j*zgap;
    ctx.strokeStyle=PAL.pipe;ctx.lineWidth=6;
    ctx.beginPath();
    ctx.moveTo(tx+tw,ty+th*0.5);
    ctx.lineTo((tx+tw+zx)/2,ty+th*0.5);
    ctx.lineTo((tx+tw+zx)/2,zy+44);
    ctx.lineTo(zx,zy+44);
    ctx.stroke();
    /* 阀门方块 */
    var mx=(tx+tw+zx)/2,my=(j===0?ty+th*0.5:(ty+th*0.5+zy+44)/2);
    mx=(tx+tw+zx)/2;my=ty+th*0.5+((zy+44-ty-th*0.5)/2)*(j/G+0.35);
    ctx.fillStyle=st.open[j]?PAL.success:PAL.danger;
    rr(mx-11,my-11,22,22,6);ctx.fill();
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=PAL.surface;
    ctx.fillText(st.open[j]?"开":"关",mx,my+1);
    /* 受水区 */
    var cap=1-Math.min(1,st.del[j]/L.zc[j]);
    ctx.fillStyle=PAL.surface;
    rr(zx-6,zy,zgap>44?46:40,88,10);ctx.fill();
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=PAL.water;
    var fy=zy+4+80*cap;
    ctx.fillRect(zx-2,fy,(zgap>44?46:40)-4,Math.max(0,84-4-80*cap));
    /* 需求线 */
    var dm=1-Math.min(1,L.zd[j]/L.zc[j]);
    ctx.strokeStyle=PAL.success;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(zx-2,zy+4+80*dm);ctx.lineTo(zx+(zgap>44?46:40)-6,zy+4+80*dm);ctx.stroke();
    ctx.fillStyle=PAL.text;
    ctx.fillText(Math.floor(st.del[j])+"/"+L.zc[j],zx+(zgap>44?46:40)/2-2,zy+100);
  }
  ctx.fillStyle=PAL.muted;
  ctx.font="400 12px sans-serif";
  ctx.fillText("绿线=定额 · 水漫过区顶=决堤",W/2,H-12);
}
/* ---------- 主循环（切后台停续） ---------- */
var rafId=0,last=0;
function frame(ts){
  rafId=requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.05,(ts-last)/1000||0);
  last=ts;
  if(state==="running"){
    acc+=dt;
    var n=0;
    while(acc>=TICK_SEC&&n++<4){acc-=TICK_SEC;doTick();if(state!=="running")break;}
  }
  draw();
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){
    if(rafId){cancelAnimationFrame(rafId);rafId=0;}
    if(state==="running"){state="paused";$("btnPause").textContent="继续";say("已暂停——回到游戏继续调度");}
  }else if(!rafId){last=0;rafId=requestAnimationFrame(frame);}
});
/* ---------- 输入 ---------- */
$("btnPause").addEventListener("click",function(){
  if(state==="running"){state="paused";$("btnPause").textContent="继续";say("已暂停");}
  else if(state==="paused"){state="running";$("btnPause").textContent="暂停";say("继续调度");}
});
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(state!=="over")openLevelSelect();});
$("ovBtn").addEventListener("click",function(){
  if(st.win){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }else loadLevel(lv);
  $("ovBtn").style.background="var(--g-surface2)";$("ovBtn").style.color="var(--g-text)";
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="4"){var j=parseInt(k,10)-1;if(j<L.gr.length)toggleGate(j);e.preventDefault();}
  else if(k===" "){e.preventDefault();$("btnPause").click();}
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
window.addEventListener("resize",resize);
/* ---------- 启动（loadLevel 以存档关续玩） ---------- */
loadLevel(save.lv);resize();rafId=requestAnimationFrame(frame);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
