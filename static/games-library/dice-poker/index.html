<script>
(function(){

/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（配置型：tier 牌型档、rounds 轮数、target 目标；DB 下发优先 + 版本缓存 + 包内默认兜底） ---------- */
var GAME_KEY="dice-poker",SAVE_KEY="sw.dicepoker.v1";
var CAT_NAMES=["一点","二点","三点","四点","五点","六点","三条","四条","葫芦","小顺","大顺","快艇","机会"];

    DEFAULT_LEVELS.push({name:"骰扑·"+String(i+1).padStart(2,"0"),rounds:rounds,cats:cats,difficulty:Math.min(6,1+Math.floor(i/8))});

  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim()||d.name.length>24)return false;
  if(!Number.isInteger(d.rounds)||d.rounds<2||d.rounds>20)return false;
  if(!Number.isInteger(d.cats)||d.cats<6||d.cats>13)return false;
  if(d.difficulty!==undefined&&(!Number.isInteger(d.difficulty)||d.difficulty<1||d.difficulty>9))return false;

}

/* ---------- 独立验证器：计分三路一致（测试引擎 vs 权威用例 vs 上界） + 目标可达上界 ---------- */
/* 测试引擎（独立实现） */
function testScore(dice,cat){
  var i,cnt=[0,0,0,0,0,0,0],sum=0;
  for(i=0;i<5;i++){cnt[dice[i]]++;sum+=dice[i];}
  var faces=[],v;
  for(v=1;v<=6;v++)if(cnt[v])faces.push(v);
  var hasRun=function(len){var run=0,k;for(k=1;k<=6;k++){run=cnt[k]?run+1:0;if(run>=len)return true;}return false;};
  if(cat<6)return dice.filter(function(x){return x===cat+1}).length*(cat+1);
  if(cat===6)return faces.some(function(f){return cnt[f]>=3})?sum:0;
  if(cat===7)return faces.some(function(f){return cnt[f]>=4})?sum:0;
  if(cat===8)return faces.some(function(f){return cnt[f]===3})&&faces.some(function(f){return cnt[f]===2})?25:0;
  if(cat===9)return hasRun(4)?30:0;
  if(cat===10)return hasRun(5)?40:0;
  if(cat===11)return faces.length===1&&cnt[faces[0]]===5?50:0;
  return sum;
}

  [[1,1,2,2,3],8,0],[[1,1,2,2,3],12,9],
  [[1,1,1,2,2],8,25],[[1,1,1,2,2],6,7],[[1,1,1,2,2],7,0],
  [[1,1,1,1,2],7,6],[[1,1,1,1,2],6,6],
  [[3,3,3,3,3],7,15],[[3,3,3,3,3],11,50],[[3,3,3,3,3],8,0],
  [[6,6,6,2,2],5,18],[[2,2,3,4,4],9,0],[[2,2,3,4,4],12,15]
];
function catMax(cat){
  if(cat<6)return 5*(cat+1);
  if(cat===6)return 30;
  if(cat===7)return 30;
  if(cat===8)return 25;
  if(cat===9)return 30;
  if(cat===10)return 40;
  if(cat===11)return 50;
  return 30;
}
function levelTarget(d){
  /* 目标 = 可用档位前 rounds 大上界总和的 55%（上界校验：target ≤ 该总和） */
  var maxs=[],k;
  for(k=0;k<d.cats;k++)maxs.push(catMax(k));
  maxs.sort(function(a,b){return b-a});
  var bound=0,i;
  for(i=0;i<Math.min(d.rounds,maxs.length);i++)bound+=maxs[i];
  return Math.max(30,Math.floor(bound*0.55));
}
function verifyLevelData(d){
  if(!validLevelData(d))return false;
  /* ① 计分三路一致：游戏内引擎 gameScore 与测试引擎、权威用例逐条比对 */
  var i;
  for(i=0;i<SCORER_TESTS.length;i++){
    var t=SCORER_TESTS[i];
    if(gameScore(t[0],t[1])!==t[2])return false;
    if(testScore(t[0],t[1])!==t[2])return false;
  }
  /* ② 目标可达上界：target = 上界 55%，必须 ≤ 前 rounds 大档位上界之和 */
  var target=levelTarget(d),maxs=[],k;
  for(k=0;k<d.cats;k++)maxs.push(catMax(k));
  maxs.sort(function(a,b){return b-a});
  var bound=0;
  for(i=0;i<Math.min(d.rounds,maxs.length);i++)bound+=maxs[i];
  if(target>bound)return false;
  return {name:d.name,rounds:d.rounds,cats:d.cats,target:target,difficulty:d.difficulty||5};
}
var ACTIVE=[];
function buildActive(){
  ACTIVE=[];
  for(var i=0;i<LEVELS.length;i++){var v=verifyLevelData(LEVELS[i]);if(v)ACTIVE.push(v);}
  if(ACTIVE.length){
    lv=Math.min(save.lv,ACTIVE.length-1); /* 续玩：以存档进度为起点 */
    save.lv=Math.min(save.lv,lv);persist();
    loadLevel(lv);
  }
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push({name:String(d.name),rounds:d.rounds,cats:d.cats,target:levelTarget(d),difficulty:d.difficulty||5});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  buildActive();
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>ACTIVE.length-1)lv=ACTIVE.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
    }
  }).catch(function(){});
}

/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,parseInt(s.lv,10)||0)}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(ACTIVE.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}

/* ---------- 牌桌状态 ---------- */
var lv=0,L=null,dice=[1,2,3,4,5],held=[false,false,false,false,false],rollsLeft=3;
var used=[],total=0,roundsLeft=0,phase="roll",roundNum=0,pendingLv=0;
function $(id){return document.getElementById(id)}
function say(t,cls){var m=$("msg");m.textContent=t;m.className="msg"+(cls?" "+cls:"")}
/* 游戏内计分引擎 */
function gameScore(d,cat){
  var i,cnt=[0,0,0,0,0,0,0],sum=0;
  for(i=0;i<5;i++){cnt[d[i]]++;sum+=d[i];}
  if(cat<6)return (cnt[cat+1])*(cat+1);
  var f,c3=false,c2=false,c4=false;
  for(f=1;f<=6;f++){if(cnt[f]>=3)c3=true;if(cnt[f]===2)c2=true;if(cnt[f]>=4)c4=true;}
  if(cat===6)return c3?sum:0;
  if(cat===7)return c4?sum:0;
  if(cat===8)return (c3&&c2)?25:0;
  if(cat===9){var run=0,k;for(k=1;k<=6;k++){run=cnt[k]?run+1:0;if(run>=4)return 30;}return 0;}
  if(cat===10){var run2=0,k2;for(k2=1;k2<=6;k2++){run2=cnt[k2]?run2+1:0;if(run2>=5)return 40;}return 0;}
  if(cat===11){var f3;for(f3=1;f3<=6;f3++)if(cnt[f3]===5)return 50;return 0;}
  return sum;
}
/* ---------- 动效辅助（装饰层，prefers-reduced-motion 时整体空转） ---------- */
function bumpTotal(){
  if(window.__gRM)return;
  var v=$("stTotal");v.classList.remove("bump");void v.offsetWidth;v.classList.add("bump");
}
function rollDice(){
  if(phase!=="roll"||rollsLeft<=0)return;
  var i;
  for(i=0;i<5;i++)if(!held[i])dice[i]=1+Math.floor(Math.random()*6);
  rollsLeft--;
  say(rollsLeft>0?"还剩 "+rollsLeft+" 次掷骰，锁好想要的点数":"三次用完，从记分卡选一档计分");
  updStats();renderDice("roll");renderCard();
}
function assign(cat){
  if(phase!=="assign"&&!(phase==="roll"&&rollsLeft===0&&used[cat]===undefined)){
    if(phase!=="assign"){say("先掷骰（每轮最多 3 次），掷完再选档计分","err");return;}
  }
  if(used[cat]!==undefined)return;
  var pts=gameScore(dice,cat);
  used[cat]=pts;
  total+=pts;
  roundNum++;
  roundsLeft--;
  say("「"+CAT_NAMES[cat]+"」计 "+pts+" 分");
  held=[false,false,false,false,false];
  rollsLeft=3;
  phase="roll";
  updStats();
  if(roundsLeft<=0){endLevel();return;}
  renderDice();renderCard();
  rollDice();
  bumpTotal();
}
function endLevel(){
  var won=total>=L.target,last=lv>=ACTIVE.length-1;
  if(won){
    pendingLv=last?0:Math.min(lv+1,ACTIVE.length-1);
    save.lv=last?0:Math.max(save.lv,pendingLv);persist();
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:total}).catch(function(){});
    $("ovTitle").innerHTML=SW_ICON("star")+" "+(last?"全部通关！":"过关！");
    $("ovDesc").innerHTML="总分 <b>"+total+"</b> ≥ 目标 "+L.target+"！"+(last?"<br>"+ACTIVE.length+" 关全部完成":"<br>已解锁第 "+(pendingLv+1)+" 关");
    setOvBtn(last?"回到第 1 关":"下一关","arrow-right");
  }else{
    pendingLv=lv;
    $("ovTitle").innerHTML=SW_ICON("x")+" 未达目标";
    $("ovDesc").innerHTML="总分 <b>"+total+"</b>，目标 "+L.target+"。点「再战」重掷一局。";
    setOvBtn("再战本关","rotate");
  }
  $("overlay").classList.add("show");
}
function setOvBtn(txt,icon){var b=$("ovBtn");b.innerHTML=SW_ICON(icon)+txt;}
function updStats(){
  $("stTotal").textContent=total;
  $("stTarget").textContent=L.target;
  $("rollHint").textContent="剩余掷 "+rollsLeft+" 次 · 第 "+(roundNum+1)+"/"+L.rounds+" 轮 · 点骰子锁住要保留的点数";
  $("btnRoll").disabled=phase!=="roll"||rollsLeft<=0;
}
/* ---------- 渲染 ---------- */
/* 内联 SVG 骰点：24 viewBox 标准 1-6 点位，fill=currentColor 随令牌变色（统一视觉语言 #4） */
var DIE_PIPS={1:[[12,12]],2:[[6,6],[18,18]],3:[[6,6],[12,12],[18,18]],4:[[6,6],[18,6],[6,18],[18,18]],5:[[6,6],[18,6],[12,12],[6,18],[18,18]],6:[[6,6],[18,6],[6,12],[18,12],[6,18],[18,18]]};
function pipSvg(v,cls){
  var pts=DIE_PIPS[v]||DIE_PIPS[1],s="",i;
  for(i=0;i<pts.length;i++)s+='<circle cx="'+pts[i][0]+'" cy="'+pts[i][1]+'" r="2.7"/>';
  return '<svg class="'+cls+'" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">'+s+'</svg>';
}
function dieSvg(v){return pipSvg(v,"die-face")}
/* mode：enter=入场错落 / roll=滚动（仅未锁定骰） / 空=静置 */
function renderDice(mode){
  var h="",i;
  for(i=0;i<5;i++){
    var cls="die";
    if(held[i])cls+=" held";
    if(mode==="enter")cls+=" in";
    else if(mode==="roll"&&!held[i])cls+=" rolling";
    var st="";
    if(mode==="enter")st=' style="animation-delay:'+(i*40)+'ms"';
    else if(mode==="roll"&&!held[i])st=' style="animation-delay:'+(i*35)+'ms"';
    h+='<button class="'+cls+'"'+st+' data-die="'+i+'" aria-label="骰子 '+(i+1)+'：'+dice[i]+(held[i]?'（已锁）':'')+'">'
      +dieSvg(dice[i])+(held[i]?'<span class="heldtag">'+SW_ICON("lock")+'</span>':'')+'</button>';
  }
  $("dice").innerHTML=h;
}
function renderCard(){
  var h="",k,bestCat=-1,bestV=-1;
  for(k=0;k<L.cats;k++)if(used[k]===undefined&&gameScore(dice,k)>bestV){bestV=gameScore(dice,k);bestCat=k;}
  for(k=0;k<L.cats;k++){
    var u=used[k];
    var pv=u!==undefined?u:gameScore(dice,k);
    var tone=u!==undefined?"muted":CAT_TONE[k];
    var icon=u!==undefined?SW_ICON("check"):(typeof CAT_ICONS[k]==="number"?pipSvg(CAT_ICONS[k],"swi"):SW_ICON(CAT_ICONS[k]));
    h+='<button class="scat" data-cat="'+k+'" data-used="'+(u!==undefined?"1":"0")+'"'+(u!==undefined?" disabled":"")+(k===bestCat&&u===undefined&&rollsLeft===0?' data-best="1"':"")
      +' aria-label="'+CAT_NAMES[k]+(u!==undefined?' 已计 '+u+' 分':' 可计 '+pv+' 分')+'">'
      +'<span class="ci'+(tone==="deep"?"":" "+tone)+'">'+icon+'</span><span class="nm">'+CAT_NAMES[k]+'</span><span class="pv">'+pv+'</span></button>';
  }
  $("scorecard").innerHTML=h;
}
function loadLevel(n){
  if(!ACTIVE.length)return;
  lv=Math.max(0,Math.min(n,ACTIVE.length-1));
  L=ACTIVE[lv];
  dice=[1,2,3,4,5];held=[false,false,false,false,false];rollsLeft=3;
  used=[];total=0;roundsLeft=L.rounds;roundNum=0;phase="roll";
  save.lv=Math.max(save.lv,lv);persist();
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.rounds+" 轮 · 目标 "+L.target;
  $("stLv").textContent=(lv+1)+"/"+ACTIVE.length;
  say("第 "+(lv+1)+" 关开始");
  updStats();renderDice("enter");renderCard();
}
/* ---------- 输入 ---------- */
$("dice").addEventListener("click",function(e){
  var b=e.target.closest("[data-die]");
  if(!b||phase!=="roll"||rollsLeft<=0)return;
  if(rollsLeft===3){say("先掷骰，再点骰子锁住","err");return;}
  var i=parseInt(b.getAttribute("data-die"),10);
  held[i]=!held[i];
  renderDice();
});
$("btnRoll").addEventListener("click",rollDice);
$("scorecard").addEventListener("click",function(e){
  var b=e.target.closest("[data-cat]");
  if(!b)return;
  if(b.getAttribute("data-used")==="1")return;
  if(rollsLeft===3){say("至少掷一次再计分","err");return;}
  assign(parseInt(b.getAttribute("data-cat"),10));
});
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){
  overlayMode="lv";renderLvGrid();
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="绿色为已通关";
  setOvBtn("取消","x");
  $("overlay").classList.add("show");
});
var overlayMode="";
function renderLvGrid(){
  var g=$("lvgrid");
  if(overlayMode!=="lv"){g.hidden=true;return;}
  g.hidden=false;g.innerHTML="";
  for(var i=0;i<ACTIVE.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.addEventListener("click",function(){
        $("overlay").classList.remove("show");overlayMode="";
        loadLevel(i);say("第 "+(i+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
}
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(overlayMode==="lv"){overlayMode="";return;}
  loadLevel(pendingLv);
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(overlayMode==="lv"){if(k===" "||k==="Enter")$("ovBtn").click();return;}
  if(/^Digit[1-5]$/.test(e.code)){
    var i=parseInt(e.code.slice(5),10)-1;
    if(phase==="roll"&&rollsLeft>0&&rollsLeft<3){held[i]=!held[i];renderDice();}
    e.preventDefault();
  }
  else if(k==="r"||k==="R"){if(phase==="roll"&&rollsLeft>0)rollDice();}
});
/* ---------- 启动 ---------- */
/* 工具按钮与主 CTA 图标：文字前内联 SVG（SW_ICON 范式，1em 与文字基线对齐） */
$("btnRoll").innerHTML=SW_ICON("dice")+"掷骰";
$("btnReset").insertAdjacentHTML("afterbegin",SW_ICON("reset"));
$("btnLv").insertAdjacentHTML("afterbegin",SW_ICON("grid"));
buildActive();
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
