<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>叠盘塔</title>
<style>
  /*token:GAME-THEME.md§2（瓷盘三色素材 token 统一 --g-st- 前缀，§3 D2）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-on-primary:#FFF;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gap:16px;--g-st-dish1:#F4EDE0;--g-st-dish2:#E6DBC6;--g-st-dish3:#DFE7DC;--g-st-tile:#F0F1EC;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-dish1:#3E3B33;--g-st-dish2:#37342C;--g-st-dish3:#343A33;--g-st-tile:#1E2220;color-scheme:dark }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .boxes { display: flex; gap: 8px; }
  .box { background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 10px; min-width: 86px; padding: 5px 12px; text-align: center; line-height: 1.3; }
  .box.alt { background: var(--g-surface); color: var(--g-text); border: 1px solid var(--g-border); }
  .box .label { display: block; font-size: 12px; }
  .box b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .hint { margin: 0; font-size: 14px; color: var(--g-muted); }
  .btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--g-btn-primary); color: var(--g-on-primary); font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .btn.ghost { background: var(--g-surface); color: var(--g-text); border: 1px solid var(--g-border); }
  .btn:active { opacity: .85; }
  .stage { position: relative; width: 100%; }
  canvas { display: block; width: 100%; aspect-ratio: 6 / 7; border-radius: var(--g-radius-inner); border: 1px solid var(--g-border); background: var(--g-surface); touch-action: none; }
  .overlay { position: absolute; inset: 0; border-radius: var(--g-radius-inner); background: var(--g-scrim); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; text-align: center; }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .card { width: 100%; max-width: 320px; max-height: 100%; overflow: auto; background: var(--g-surface); border: 1px solid var(--g-border); border-radius: var(--g-radius); box-shadow: var(--g-shadow); padding: 16px; }
  .ov-kicker { margin: 0 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--g-muted); }
  .card h2 { margin: 0 0 8px; font-size: 18px; line-height: 1.25; color: var(--g-text); }
  .ov-text { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: var(--g-muted); }
  .ov-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 12px; }
  .ov-stats .st { background: var(--g-surface2); border-radius: 10px; padding: 7px 4px; }
  .ov-stats b { display: block; font-size: 18px; color: var(--g-primary-deep); font-variant-numeric: tabular-nums; }
  .ov-stats span { font-size: 12px; color: var(--g-muted); }
  .ov-btns { display: grid; gap: 8px; }
  .foot { margin: 14px 0 0; font-size: 12px; line-height: 1.6; color: var(--g-muted); text-align: center; }

  /* S2: 动效敏感用户降级（动效层指令，不受 §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<body>
<div class="wrap">
  <header>
    <div class="boxes">
      <div class="box"><span class="label">分数</span><b id="hudScore">0</b></div>
      <div class="box"><span class="label">层数</span><b id="hudFlo">0</b></div>

    </div>
  </header>
  <div class="toolbar">
    <p class="hint">点按把送来的餐盘叠上塔顶，出沿会被削圆边，全脱手就塌</p>

  <div class="stage">
    <canvas id="cv" role="img" aria-label="叠盘塔游戏画面"></canvas>
    <div class="overlay" role="dialog" aria-modal="true" id="ov" aria-live="assertive">
      <div class="card">
        <p class="ov-kicker" id="ovK"></p>
        <h2 id="ovT"></h2>
        <p class="ov-text" id="ovX"></p>

        <div class="ov-btns" id="ovB"></div>
      </div>
    </div>
  </div>
  <p class="foot">点屏幕或空格落盘 · 完美对齐补盘沿并叠连击 · 传送带越走越快 · 盘全脱手即塌 · P 暂停 · R 重开</p>
</div>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 常量与存档 ---------- */
var MW=480,MH=560,PH=26,GAP=4,BASE_Y=MH-96,W0=180;
var KEY="sw.dish-stack.v1";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function loadSave(){try{var s=JSON.parse(lsGet(KEY))||{};return{best:parseInt(s.best,10)||0}}catch(e){return{best:0}}}
var save=loadSave();
function persist(){
  try{lsSet(KEY,JSON.stringify(save))}catch(e){}
  if(GB.available)GB.saveState("dish-stack",save).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("dish-stack").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rb=parseInt(JSON.parse(res.stateJson).best,10)||0;
      if(rb>save.best){save.best=rb;S.best=rb;persist();syncHud();}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 调色板:CSS变量 → canvas ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL.bg=v("--g-bg");PAL.surface=v("--g-surface");PAL.surface2=v("--g-surface2");PAL.border=v("--g-border");
  PAL.text=v("--g-text");PAL.muted=v("--g-muted");PAL.faint=v("--g-faint");
  PAL.primary=v("--g-primary");PAL.deep=v("--g-primary-deep");PAL.soft=v("--g-primary-soft");PAL.onSoft=v("--g-on-soft");
  PAL.danger=v("--g-danger");PAL.warning=v("--g-warning");PAL.success=v("--g-success");
  PAL.tile=v("--g-st-tile");
  PAL.dish=["--g-st-dish1","--g-st-dish2","--g-st-dish3"].map(function(n){return s.getPropertyValue(n).trim()});
}
window.__gOnTheme=function(){palLoad();draw();};
/* ---------- DOM ---------- */
function $(id){return document.getElementById(id)}
var cv=$("cv"),ctx=cv.getContext("2d"),ov=$("ov");
var hudScore=$("hudScore"),hudFlo=$("hudFlo"),hudBest=$("hudBest");
var ovK=$("ovK"),ovT=$("ovT"),ovX=$("ovX"),ovS=$("ovS"),ovB=$("ovB");
/* ---------- 状态 ---------- */
var S={phase:"menu",paused:false,score:0,best:save.best,
  stack:[],cur:null,dir:1,speed:150,
  combo:0,maxCombo:0,perfects:0,
  debris:[],floats:[],shakeT:0,camOff:0,t:0,landT:0};
function syncHud(){
  hudScore.textContent=String(S.score);
  hudFlo.textContent=String(Math.max(0,S.stack.length-1));
  hudBest.textContent=String(S.best);
}
function startRun(){
  S.phase="run";S.paused=false;
  S.score=0;S.stack=[{x:MW/2,w:W0}];
  S.dir=1;S.speed=150;S.combo=0;S.maxCombo=0;S.perfects=0;
  S.debris.length=0;S.floats.length=0;
  S.camOff=0;S.shakeT=0;S.landT=0;
  spawnCur();
  syncHud();hideOv();
}
function spawnCur(){
  var top=S.stack[S.stack.length-1];
  S.cur={x:S.dir>0?40:MW-40,w:top.w};
}
function endRun(){
  S.phase="over";
  var isRec=S.score>save.best&&S.score>0;
  if(isRec){save.best=S.score;S.best=S.score;persist();syncHud();}
  if(GB.available)GB.reportScore("dish-stack",{metricValue:S.best,metricExtra:S.stack.length+"层"}).catch(function(){});
  syncHud();
  showOv({k:"TOPPLED",t:"塔塌了",
    x:isRec?"新纪录！完美对齐会补回盘沿，越连越宽。":"出沿部分会被削掉，盘越叠越窄；对齐了才补得回来。",
    stats:[["层数",Math.max(0,S.stack.length-1)],["完美",S.perfects],["最高分",S.best]],
    btns:[["再叠一次","primary",startRun]]});
}
/* ---------- 覆盖层 ---------- */
function showOv(o){
  ovK.textContent=o.k||"";ovT.textContent=o.t||"";ovX.textContent=o.x||"";
  var st=o.stats||[];
  ovS.style.display=st.length?"grid":"none";
  ovS.innerHTML=st.map(function(s){return '<div class="st"><b>'+s[1]+"</b><span>"+s[0]+"</span></div>"}).join("");
  ovB.innerHTML="";
  (o.btns||[]).forEach(function(b){
    var el=document.createElement("button");
    el.className="btn"+(b[1]==="ghost"?" ghost":"");
    el.textContent=b[0];el.addEventListener("click",b[2]);ovB.appendChild(el);
  });
  ov.classList.add("show");
}
function hideOv(){ov.classList.remove("show")}
function pauseGame(){
  if(S.phase!=="run"||S.paused)return;
  S.paused=true;
  showOv({k:"PAUSED",t:"已暂停",x:"传送带停了，回来接着叠。",
    btns:[["继续","primary",function(){S.paused=false;hideOv()}],["重开","ghost",startRun]]});
}
/* ---------- 落盘 ---------- */
function drop(){
  if(S.phase!=="run"||S.paused||!S.cur)return;
  var top=S.stack[S.stack.length-1];
  var L=Math.max(S.cur.x-S.cur.w/2,top.x-top.w/2);
  var R2=Math.min(S.cur.x+S.cur.w/2,top.x+top.w/2);
  var ow=R2-L;
  if(ow<=6){
    //全脱手
    S.debris.push({x:S.cur.x,y:topPlateY()-GAP-13,vx:S.dir*60,vy:-40,w:S.cur.w,rot:0,vr:S.dir*3,life:1.6});
    S.cur=null;
    S.shakeT=.4;
    endRun();
    return;
  }
  var isPerfect=Math.abs(S.cur.x-top.x)<=4;
  if(isPerfect){
    S.combo++;S.perfects++;
    S.maxCombo=Math.max(S.maxCombo,S.combo);
    S.score+=30;
    S.stack.push({x:top.x,w:Math.min(W0,ow+8)});
    S.floats.push({x:top.x,y:topPlateY()-40,txt:"完美 +30 ×"+S.combo,col:PAL.deep,t:.9});
  }else{
    S.combo=0;
    S.stack.push({x:(L+R2)/2,w:ow});
    S.score+=10;
    S.floats.push({x:(L+R2)/2,y:topPlateY()-40,txt:"+10",col:PAL.onSoft,t:.7});
    //削掉的边
    var leftOv=L-(S.cur.x-S.cur.w/2);
    if(leftOv>4)S.debris.push({x:L-leftOv/2,y:topPlateY()-GAP-13,vx:-70,vy:-60,w:leftOv,rot:-2,vr:-4,life:1.4});
    var rightOv=(S.cur.x+S.cur.w/2)-R2;
    if(rightOv>4)S.debris.push({x:R2+rightOv/2,y:topPlateY()-GAP-13,vx:70,vy:-60,w:rightOv,rot:2,vr:4,life:1.4});
  }
  S.landT=.12;
  S.dir=-S.dir;
  S.speed=Math.min(430,150+S.stack.length*9);
  S.cur=null;
  syncHud();
  setTimeout(function(){
    if(S.phase==="run"&&!S.cur)spawnCur();
  },140);
}
function topPlateY(){
  return BASE_Y-(S.stack.length-1)*(PH+GAP)+S.camOff;
}
/* ---------- 步进 ---------- */
function step(dt){
  S.t+=dt;
  if(S.landT>0)S.landT-=dt;
  if(S.shakeT>0)S.shakeT-=dt;
  if(S.cur){
    S.cur.x+=S.dir*S.speed*dt;
    var half=S.cur.w/2;
    if(S.cur.x-half<18){S.cur.x=18+half;S.dir=1}
    if(S.cur.x+half>MW-18){S.cur.x=MW-18-half;S.dir=-1}
  }
  //镜头
  var towerH=(S.stack.length-1)*(PH+GAP);
  var targetCam=Math.max(0,towerH-(MH-96-210));
  S.camOff+=(targetCam-S.camOff)*Math.min(1,dt*5);
  //碎块
  for(var i=S.debris.length-1;i>=0;i--){
    var d=S.debris[i];
    d.vy+=760*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt;d.life-=dt;
    if(d.life<=0||d.y>MH+60)S.debris.splice(i,1);
  }
  for(i=S.floats.length-1;i>=0;i--){
    var f=S.floats[i];f.y-=30*dt;f.t-=dt;
    if(f.t<=0)S.floats.splice(i,1);
  }
}
/* ---------- 绘制 ---------- */
var SC=1;
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  SC=r.width/MW;
  ctx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
}
function drawPlate(x,y,w,ci,squash){
  var s=squash||1;
  ctx.fillStyle=PAL.dish[ci%3];
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(x-w/2+8,y-PH*s/2);
  ctx.lineTo(x+w/2-8,y-PH*s/2);
  ctx.quadraticCurveTo(x+w/2,y-PH*s/2,x+w/2,y);
  ctx.quadraticCurveTo(x+w/2,y+PH*s/2,x+w/2-8,y+PH*s/2);
  ctx.lineTo(x-w/2+8,y+PH*s/2);
  ctx.quadraticCurveTo(x-w/2,y+PH*s/2,x-w/2,y);
  ctx.quadraticCurveTo(x-w/2,y-PH*s/2,x-w/2+8,y-PH*s/2);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=PAL.primary;
  ctx.globalAlpha=.75;
  ctx.fillRect(x-w/2+10,y+PH*s/2-5,Math.max(0,w-20),3);
  ctx.globalAlpha=1;
}
function draw(){
  var shx=S.shakeT>0?(Math.random()-.5)*6:0;
  ctx.save();ctx.translate(shx,0);
  //墙面
  ctx.fillStyle=PAL.tile;ctx.fillRect(-8,-8,MW+16,MH+16);
  ctx.fillStyle=PAL.surface2;
  for(var gy=30;gy<MH;gy+=64){
    for(var gx=(((gy/64)|0)%2)*40-40;gx<MW;gx+=80)ctx.fillRect(gx,gy,76,60);
  }
  //台座
  ctx.fillStyle=PAL.surface;
  ctx.beginPath();ctx.rect(0,BASE_Y+13,MW,MH-BASE_Y-13);ctx.fill();
  ctx.fillStyle=PAL.border;ctx.fillRect(0,BASE_Y+13,MW,2);
  //盘塔
  var i;
  for(i=0;i<S.stack.length;i++){
    var py=BASE_Y-i*(PH+GAP)+S.camOff;
    if(py<-40||py>MH+40)continue;
    var squash=(i===S.stack.length-1&&S.landT>0)?0.85:1;
    drawPlate(S.stack[i].x,py,S.stack[i].w,i,squash);
  }
  //当前盘
  if(S.cur){
    var cy=topPlateY()-GAP-PH;
    drawPlate(S.cur.x,cy,S.cur.w,S.stack.length,1);
    //对齐参考线
    var top=S.stack[S.stack.length-1];
    ctx.strokeStyle=PAL.faint;ctx.lineWidth=1.4;ctx.setLineDash([4,6]);
    ctx.beginPath();ctx.moveTo(top.x-top.w/2,cy-PH-6);ctx.lineTo(top.x-top.w/2,cy+PH+6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(top.x+top.w/2,cy-PH-6);ctx.lineTo(top.x+top.w/2,cy+PH+6);ctx.stroke();
    ctx.setLineDash([]);
  }
  //碎块
  for(i=0;i<S.debris.length;i++){
    var d=S.debris[i];
    ctx.save();
    ctx.translate(d.x,d.y);ctx.rotate(d.rot);
    ctx.globalAlpha=Math.max(0,Math.min(1,d.life));
    drawPlate(0,0,d.w,i+1,0.7);
    ctx.restore();
    ctx.globalAlpha=1;
  }
  ctx.restore();
  //速度条
  ctx.fillStyle=PAL.surface;ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.beginPath();ctx.rect(16,14,120,12);ctx.fill();ctx.stroke();
  ctx.fillStyle=S.speed>320?PAL.danger:(S.speed>240?PAL.warning:PAL.primary);
  ctx.beginPath();ctx.rect(17,15,118*Math.min(1,(S.speed-150)/280),10);ctx.fill();
  ctx.fillStyle=PAL.muted;ctx.font="700 12px system-ui,sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText("带速",142,20);
  //连击
  if(S.combo>1){
    ctx.fillStyle=PAL.deep;ctx.font="700 22px system-ui,sans-serif";ctx.textAlign="center";
    ctx.fillText("完美连击 ×"+S.combo,MW/2,44);
  }
  ctx.textBaseline="alphabetic";
  //浮字
  ctx.textAlign="center";ctx.font="700 16px system-ui,sans-serif";
  for(i=0;i<S.floats.length;i++){
    var f=S.floats[i];
    ctx.globalAlpha=Math.min(1,f.t*1.5);
    ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
/* ---------- 输入 ---------- */
function pos(e){
  var r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  drop();
});
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.code==="ArrowDown"||e.code==="Enter"){
    e.preventDefault();
    if(!e.repeat)drop();
  }
  if(e.code==="KeyP"&&S.phase==="run"){S.paused?((S.paused=false),hideOv()):pauseGame()}
  if(e.code==="KeyR"&&S.phase!=="menu")startRun();
});
$("btnPause").addEventListener("click",pauseGame);
$("btnReset").addEventListener("click",startRun);
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&S.phase==="run"&&!S.paused)pauseGame();
});
/* ---------- 主循环 ---------- */
var lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  var dt=Math.min(.05,(now-lastT)/1000);
  lastT=now;
  if(S.phase==="run"&&!S.paused)step(dt);
  draw();
}
/* ---------- 启动 ---------- */
palLoad();
syncHud();
showOv({k:"DISH STACK",t:"叠盘塔",
  x:"传送带送来餐盘，点按叠上塔顶；出沿的部分会被削圆边、盘越叠越窄，全脱手塔就塌。完美对齐补回盘沿并叠连击，带速逐层加快。",
  stats:[["最高分",S.best]],
  btns:[["开始叠盘","primary",startRun]]});
resize();
window.addEventListener("resize",resize);
requestAnimationFrame(loop);
syncSaveFromServer();
})();
</script>
