/* 覆盖层焦点管理（dialog 语义配套）：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

  PAL.primary=v("--g-primary");PAL.deep=v("--g-primary-deep");PAL.soft=v("--g-primary-soft");PAL.onSoft=v("--g-on-soft");
  PAL.danger=v("--g-danger");PAL.warning=v("--g-warning");PAL.success=v("--g-success");
  PAL.dom=v("--g-st-dom");PAL.dom2=v("--g-st-dom2");PAL.table=v("--g-st-table");PAL.table2=v("--g-st-table2");
}
window.__gOnTheme=function(){palLoad();draw();};
/* ---------- DOM ---------- */
function $(id){return document.getElementById(id)}
var cv=$("cv"),ctx=cv.getContext("2d"),ov=$("ov");
var hudTop=$("hudTop"),hudLeft=$("hudLeft"),hudLv=$("hudLv");
var ovK=$("ovK"),ovT=$("ovT"),ovX=$("ovX"),ovS=$("ovS"),ovB=$("ovB");
var lvIdx=Math.min(save.lv,LEVELS.length-1);
var S={phase:"menu",paused:false,placed:{},walls:{},start:[1,ROWS-2],
  budget:0,target:0,toppled:0,score:save.score,lvScore:0,
  sim:null,cur:[1,ROWS-2],useKey:false,parts:[],floats:[]};
function key(x,y){return x+","+y}
function curLv(){return LEVELS[Math.min(lvIdx,LEVELS.length-1)]}
function syncHud(){
  hudTop.textContent=S.toppled+"/"+S.target;
  hudLeft.textContent=String(S.budget-objectSize(S.placed));
  hudLv.textContent=(lvIdx+1)+"/"+LEVELS.length;
}
function objectSize(o){var n=0;for(var k in o)n++;return n}
function loadLevel(n){
  lvIdx=Math.max(0,Math.min(n,LEVELS.length-1));
  var L=curLv();
  S.phase="run";S.paused=false;
  S.walls={};for(var i=0;i<L.walls.length;i++)S.walls[key(L.walls[i][0],L.walls[i][1])]=1;
  S.start=L.start;S.budget=L.budget;S.target=L.target;
  S.placed={};S.toppled=0;S.lvScore=0;S.sim=null;S.cur=[L.start[0],L.start[1]];
  S.parts.length=0;S.floats.length=0;
  syncHud();hideOv();
}
/*PHYS-BEGIN*/
/* 连锁模拟：从 start 出发，被推倒的牌会推倒其正交相邻的立牌；返回 {order:[{x,y,dir,depth}]} */
function simulate(walls,placed,start){
  var fallen={},order=[],queue=[{x:start[0],y:start[1],depth:0,dir:[0,-1]}];
  fallen[key(start[0],start[1])]=1;
  while(queue.length){
    var d=queue.shift();
    order.push({x:d.x,y:d.y,dir:d.dir,depth:d.depth});
    var DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
    for(var i=0;i<4;i++){
      var nx=d.x+DIRS[i][0],ny=d.y+DIRS[i][1];
      var nk=key(nx,ny);
      if(fallen[nk]||walls[nk])continue;
      if(placed[nk]){
        fallen[nk]=1;
        queue.push({x:nx,y:ny,depth:d.depth+1,dir:DIRS[i]});
      }
    }
  }
  return {order:order};
}
/*PHYS-END*/
/* ---------- 覆盖层 ---------- */
function showOv(o){
  ovK.textContent=o.k||"";ovT.textContent=o.t||"";ovX.textContent=o.x||"";
  var st=o.stats||[];
  ovS.style.display=st.length?"grid":"none";
  ovS.innerHTML=st.map(function(s){return '<div class="st"><b>'+s[1]+"</b><span>"+s[0]+"</span></div>"}).join("");
  ovB.innerHTML="";
  (o.btns||[]).forEach(function(b){
    var el=document.createElement("button");
    el.className="btn"+(b[1]==="ghost"?" ghost":"");
    el.textContent=b[0];el.addEventListener("click",b[2]);ovB.appendChild(el);
  });
  ov.classList.add("show");
}
function hideOv(){ov.classList.remove("show")}
function pauseGame(){
  if(S.phase!=="run"||S.paused||S.sim)return;
  S.paused=true;
  showOv({k:"PAUSED",t:"已暂停",x:"布局先想好再推。",
    btns:[["继续","primary",function(){S.paused=false;hideOv()}],["重摆","ghost",function(){loadLevel(lvIdx)}]]});
}
function showMenu(){
  S.phase="menu";
  showOv({k:"DOMINO CHAIN",t:"多米诺",
    x:"点空格用有限的牌摆出连锁路线（正交相邻才传力），然后推倒首牌；倒牌数达到目标即过关。墙挡路，牌要省着用。",
    stats:[["进度",lvIdx+1+"/"+LEVELS.length],["总分",S.score]],
    btns:[["开始 · 第 "+(lvIdx+1)+" 关","primary",function(){loadLevel(lvIdx)}]]});
}
/* ---------- 摆牌与推倒 ---------- */
function tapCell(cx,cy){
  if(S.phase!=="run"||S.paused||S.sim)return;
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS)return;
  var k=key(cx,cy);
  if(S.walls[k])return;
  if(cx===S.start[0]&&cy===S.start[1])return;
  if(S.placed[k]){delete S.placed[k];syncHud();draw();return}
  if(objectSize(S.placed)>=S.budget){float_(cx*CELL+OX+CELL/2,cy*CELL+OY,"牌用完了",PAL.danger);draw();return}
  S.placed[k]=1;
  S.cur=[cx,cy];
  syncHud();draw();
}
function push(){
  if(S.phase!=="run"||S.paused||S.sim)return;
  S.sim=simulate(S.walls,S.placed,S.start);
  S.sim.t=0;
  S.sim.last=0;
  syncHud();
}
function simDone(){
  var n=S.sim.order.length-1;//首牌不计入目标
  S.toppled=n;
  var win=n>=S.target;
  S.lvScore=n*10+Math.max(0,S.budget-objectSize(S.placed))*5;
  syncHud();
  setTimeout(function(){
    S.sim=null;
    if(win){
      S.score+=S.lvScore;
      var next=false;
      if(lvIdx+1<LEVELS.length&&lvIdx+1>save.lv){save.lv=lvIdx+1;next=true}
      persist();
      if(GB.available)GB.reportScore("domino-chain",{metricValue:save.lv+1,metricExtra:"总分"+S.score}).catch(function(){});
      var hasNext=lvIdx+1<LEVELS.length;
      showOv({k:"CHAIN DONE",t:"连锁 "+n+" 块 · 达标",
        x:next?"解锁下一关：墙更多、牌更紧，路线要更精。":"全部关卡完成，多米诺大师！",
        stats:[["倒牌",n],["本关得分",S.lvScore],["总分",S.score]],
        btns:hasNext?[["下一关","primary",function(){loadLevel(lvIdx+1)}],["重玩本关","ghost",function(){loadLevel(lvIdx)}]]
                    :[["再来一轮","primary",function(){loadLevel(0)}]]});
    }else{
      showOv({k:"SHORT",t:"差 "+(S.target-n)+" 块",
        x:"只倒 "+n+" / 目标 "+S.target+"。牌会收回，调整路线再推一次。",
        stats:[["倒牌",n],["目标",S.target]],
        btns:[["调整重推","primary",function(){hideOv()}]]});
      S.placed={};S.toppled=0;
      syncHud();
    }
  },420);
}
/* ---------- 绘制 ---------- */
var SC=1;
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  SC=r.width/MW;
  ctx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
}
function drawTile(cx,cy,fill,stroke){
  var x=OX+cx*CELL,y=OY+cy*CELL;
  ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=1.4;
  ctx.beginPath();ctx.rect(x+11,y+9,18,22);ctx.fill();ctx.stroke();
  ctx.fillStyle=stroke;
  ctx.beginPath();ctx.arc(x+20,y+15,2.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+20,y+25,2.2,0,Math.PI*2);ctx.fill();
}
function draw(){
  ctx.fillStyle=PAL.table;ctx.fillRect(0,0,MW,MH);
  ctx.fillStyle=PAL.table2;
  for(var gy=0;gy<MH;gy+=52)ctx.fillRect(0,gy,MW,26);
  //目标条
  ctx.fillStyle=PAL.surface;ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.beginPath();ctx.rect(14,14,MW-28,64);ctx.fill();ctx.stroke();
  ctx.fillStyle=PAL.text;ctx.font="700 14px system-ui,sans-serif";ctx.textBaseline="middle";ctx.textAlign="left";
  ctx.fillText("目标：推倒 "+S.target+" 块（首牌免费）",26,32);
  ctx.fillStyle=PAL.muted;ctx.font="400 12px system-ui,sans-serif";
  ctx.fillText("可摆 "+S.budget+" 块 · 已摆 "+objectSize(S.placed)+" 块"+(S.sim?" · 连锁中…":""),26,56);
  ctx.fillStyle=PAL.deep;ctx.font="700 22px system-ui,sans-serif";ctx.textAlign="right";
  ctx.fillText("倒 "+S.toppled,MW-26,44);
  //棋盘
  var bx=OX,by=OY,bw=COLS*CELL,bh=ROWS*CELL;
  ctx.fillStyle=PAL.surface;
  ctx.beginPath();ctx.rect(bx-4,by-4,bw+8,bh+8);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.beginPath();ctx.rect(bx-4,by-4,bw+8,bh+8);ctx.stroke();
  ctx.strokeStyle=PAL.table2;ctx.lineWidth=1;
  for(var i=1;i<COLS;i++){ctx.beginPath();ctx.moveTo(bx+i*CELL,by);ctx.lineTo(bx+i*CELL,by+bh);ctx.stroke()}
  for(i=1;i<ROWS;i++){ctx.beginPath();ctx.moveTo(bx,by+i*CELL);ctx.lineTo(bx+bw,by+i*CELL);ctx.stroke()}
  //墙
  for(var k in S.walls){
    var wk=k.split(","),wx=+wk[0],wy=+wk[1];
    ctx.fillStyle=PAL.faint;
    ctx.beginPath();ctx.rect(OX+wx*CELL+6,OY+wy*CELL+6,CELL-12,CELL-12);ctx.fill();
    ctx.strokeStyle=PAL.table2;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(OX+wx*CELL+8,OY+wy*CELL+8);ctx.lineTo(OX+wx*CELL+CELL-10,OY+wy*CELL+CELL-10);ctx.stroke();
  }
  //光标
  if(S.useKey&&S.phase==="run"&&!S.sim){
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;
    ctx.beginPath();ctx.rect(OX+S.cur[0]*CELL+3,OY+S.cur[1]*CELL+3,CELL-6,CELL-6);ctx.stroke();
  }
  //摆牌（含倒下动画）
  var fallen={},anim={};
  if(S.sim){
    for(i=0;i<S.sim.order.length;i++){
      var o=S.sim.order[i];
      fallen[key(o.x,o.y)]=o;
      var showAt=o.depth*0.12;
      anim[key(o.x,o.y)]=Math.max(0,Math.min(1,(S.sim.t-showAt)/0.14));
    }
  }
  for(k in S.placed){
    var pk=k.split(","),px=+pk[0],py=+pk[1];
    var kk=key(px,py);
    if(S.sim&&fallen[kk]){
      var a=anim[kk],d=fallen[kk];
      if(a>=1){
        var cx2=OX+px*CELL+CELL/2,cy2=OY+py*CELL+CELL/2;
        ctx.save();ctx.translate(cx2,cy2);ctx.rotate(Math.atan2(d.dir[1],d.dir[0]));
        ctx.fillStyle=PAL.dom;ctx.strokeStyle=PAL.dom2;ctx.lineWidth=1.2;
        ctx.beginPath();ctx.rect(-14,-6,28,12);ctx.fill();ctx.stroke();
        ctx.restore();
      }else{
        drawTile(px,py,PAL.dom,PAL.dom2);
      }
    }else{
      drawTile(px,py,PAL.dom,PAL.dom2);
    }
  }
  //首牌
  drawTile(S.start[0],S.start[1],S.sim&&fallen[key(S.start[0],S.start[1])]?PAL.dom:PAL.primary,PAL.deep);
  var sx2=OX+S.start[0]*CELL,sy2=OY+S.start[1]*CELL;
  if(!(S.sim&&anim[key(S.start[0],S.start[1])]>=1)){
    ctx.fillStyle=PAL.onSoft;
    ctx.font="700 14px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("推",sx2+CELL/2,sy2+CELL/2);
  }
  ctx.textBaseline="alphabetic";
  //浮字
  ctx.textAlign="center";ctx.font="700 16px system-ui,sans-serif";
  for(i=0;i<S.floats.length;i++){
    var f2=S.floats[i];
    ctx.globalAlpha=Math.min(1,f2.t*1.5);
    ctx.fillStyle=f2.col;ctx.fillText(f2.txt,f2.x,f2.y);
  }
  ctx.globalAlpha=1;
}
function float_(x,y,txt,col){S.floats.push({x:x,y:y,txt:txt,col:col||PAL.danger,t:1});}
function stepFx(dt){
  for(var i=S.floats.length-1;i>=0;i--){
    var f=S.floats[i];f.y-=28*dt;f.t-=dt;
    if(f.t<=0)S.floats.splice(i,1);
  }
}
/* ---------- 输入 ---------- */
function pos(e){
  var r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  var p=pos(e);
  var cx=Math.floor((p.x-OX)/CELL),cy=Math.floor((p.y-OY)/CELL);
  tapCell(cx,cy);
});
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("keydown",function(e){
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","Enter"].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==="ArrowUp"&&S.cur[1]>0){S.cur[1]--;S.useKey=true}
  if(e.code==="ArrowDown"&&S.cur[1]<ROWS-1){S.cur[1]++;S.useKey=true}
  if(e.code==="ArrowLeft"&&S.cur[0]>0){S.cur[0]--;S.useKey=true}
  if(e.code==="ArrowRight"&&S.cur[0]<COLS-1){S.cur[0]++;S.useKey=true}
  if(e.code==="Space"&&S.phase==="run")tapCell(S.cur[0],S.cur[1]);
  if(e.code==="Enter"&&S.phase==="run")push();
  if(e.code==="KeyP"&&S.phase==="run"&&!S.sim){S.paused?((S.paused=false),hideOv()):pauseGame()}
  if(e.code==="KeyR"&&S.phase!=="menu")loadLevel(lvIdx);
  if(e.code==="Enter"&&S.phase!=="run")loadLevel(lvIdx);
});
$("btnPush").addEventListener("click",push);
$("btnClear").addEventListener("click",function(){if(!S.sim){S.placed={};S.toppled=0;syncHud();draw()}});
$("btnPause").addEventListener("click",pauseGame);
$("btnReset").addEventListener("click",function(){loadLevel(lvIdx)});
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&S.phase==="run"&&!S.paused&&!S.sim)pauseGame();
});
/* ---------- 主循环 ---------- */
var lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  var dt=Math.min(.05,(now-lastT)/1000);
  lastT=now;
  if(S.sim){
    S.sim.t+=dt;
    var total=S.sim.order.length*0.12+0.2;
    if(S.sim.t>=total&&!S.sim.done){S.sim.done=true;simDone()}
    stepFx(dt);
  }else if(S.phase==="run"){
    stepFx(dt);
  }
  draw();
}
/* ---------- 启动 ---------- */
palLoad();
syncHud();
showMenu();
resize();
window.addEventListener("resize",resize);
requestAnimationFrame(loop);
syncSaveFromServer();
syncLevelsFromServer();
})();
</script>
</body>
</html>
