  * { box-sizing:border-box;}

  .stat .val { display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--g-primary-deep);transition:color .16s ease-out;}
  .stat .val.bump { animation:bump .3s ease-out;}
  .toolbar { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .hint { margin:0;font-size:14px;line-height:1.5;color:var(--g-muted);}
  .tools { display:flex;gap:8px;flex:none;}
  .btn {
    min-height:44px;padding:0 14px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;

  .btn.ghost { background:var(--g-surface);border:1px solid var(--g-border);}

  .stage { position:relative;width:100%;}
  canvas { display:block;width:100%;aspect-ratio:24 / 22;border-radius:var(--g-radius-inner);border:1px solid var(--g-border);box-shadow:var(--g-shadow);touch-action:none;}

  .foot { margin:12px 2px 0;font-size:12px;line-height:1.6;color:var(--g-muted);text-align:center;}
  .overlay { position:absolute;inset:0;border-radius:var(--g-radius-inner);background:var(--g-scrim);display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center;}

  /* S2:动效敏感用户降级——同时压平 duration 与 delay（动效层指令，不受 §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important;animation-delay:.01ms !important;transition-duration:.01ms !important} }
  @keyframes fadein { from { opacity:0;} to { opacity:1;} }

  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  for(var i=0;i<list.length;i++){
    var o=list[i];
    if(!o||typeof o!=="object"||!(o.target>0)||!(o.budget>0)||!Array.isArray(o.walls))return false;
  }
  LEVELS=list;
  try{lsSet(LKEY,JSON.stringify(list));lsSet(VKEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){

    if(Array.isArray(list)&&list.length&&list[0]&&list[0].target>0){LEVELS=list;return v;}
  }catch(e){}

}

function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}

/* 连锁模拟：从 start 出发，被推倒的牌会推倒其正交相邻的立牌；返回 {order:[{x,y,dir,depth}]} */
function simulate(walls,placed,start){
  var fallen={},order=[],queue=[{x:start[0],y:start[1],depth:0,dir:[0,-1]}];
  fallen[key(start[0],start[1])]=1;
  while(queue.length){
    var d=queue.shift();
    order.push({x:d.x,y:d.y,dir:d.dir,depth:d.depth});
    var DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
    for(var i=0;i<4;i++){
      var nx=d.x+DIRS[i][0],ny=d.y+DIRS[i][1];
      var nk=key(nx,ny);
      if(fallen[nk]||walls[nk])continue;
      if(placed[nk]){
        fallen[nk]=1;
        queue.push({x:nx,y:ny,depth:d.depth+1,dir:DIRS[i]});
      }
    }
  }
  return {order:order};
}

  if(S.phase!=="run"||S.paused||S.sim)return;
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS)return;
  var k=key(cx,cy);
  if(S.walls[k])return;
  if(cx===S.start[0]&&cy===S.start[1])return;
  if(S.placed[k]){delete S.placed[k];syncHud();draw();return}
  if(objectSize(S.placed)>=S.budget){float_(cx*CELL+OX+CELL/2,cy*CELL+OY,"牌用完了",PAL.danger);draw();return}

}

  ctx.shadowColor="rgba(0,0,0,0.35)";ctx.shadowBlur=16;ctx.shadowOffsetY=7;
  rr(bx-7,by-7,bw+14,bh+14,14);ctx.fillStyle=PAL.floor2;ctx.fill();
  ctx.restore();
  var g=ctx.createLinearGradient(0,by,0,by+bh);
  g.addColorStop(0,PAL.floor1);g.addColorStop(1,colMix(PAL.floor1,PAL.floor2,0.55));
  rr(bx,by,bw,bh,10);ctx.fillStyle=g;ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle=colMix(PAL.floor1,WHITE,0.30);
  rr(bx+1,by+1,bw-2,bh-2,9);ctx.stroke();
  // 格砖地面
  var r,c,x,y,tint,a;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    a=cellIn(r);if(a<=0)continue;
    x=bx+c*CELL;y=by+r*CELL;
    tint=((r+c)%2===0)?colMix(PAL.floor1,WHITE,0.07):colMix(PAL.floor1,BLACK,0.05);
    ctx.globalAlpha=a;
    rr(x+3,y+3,CELL-6,CELL-6,7);ctx.fillStyle=tint;ctx.fill();
    ctx.lineWidth=1;ctx.strokeStyle=colMix(PAL.floor2,BLACK,0.22);ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawWalls(){
  var k,wk,wx,wy,x,y,a,g;
  for(k in S.walls){
    wk=k.split(",");wx=+wk[0];wy=+wk[1];
    a=cellIn(wy);if(a<=0)continue;
    x=OX+wx*CELL;y=OY+wy*CELL;
    g=ctx.createLinearGradient(0,y+5,0,y+CELL-5);
    g.addColorStop(0,colMix(PAL.muted,WHITE,0.22));
    g.addColorStop(0.5,PAL.muted);
    g.addColorStop(1,colMix(PAL.muted,BLACK,0.26));
    ctx.globalAlpha=a;
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=5;ctx.shadowOffsetY=2;
    rr(x+5,y+5,CELL-10,CELL-10,8);ctx.fillStyle=g;ctx.fill();
    ctx.restore();
    ctx.lineWidth=1.2;ctx.strokeStyle=colMix(PAL.muted,WHITE,0.30);
    rr(x+5.6,y+5.6,CELL-11.2,CELL-11.2,7.4);ctx.stroke();
    ctx.strokeStyle=colMix(PAL.muted,WHITE,0.45);ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(x+10,y+9.5);ctx.lineTo(x+CELL-10,y+9.5);ctx.stroke();
  }
  ctx.globalAlpha=1;
}
/* 骨牌 / 首牌：渐变「面」+ 顶光 + 落地投影（轻立体）；倒下 = 立姿转正 + 沿倒向偏移 */
function drawTile(cx,cy,o){
  var x=OX+cx*CELL+CELL/2,y=OY+cy*CELL+CELL/2;
  var w=o.w,h=o.h,s=o.scale==null?1:o.scale,alpha=o.alpha==null?1:o.alpha;
  ctx.save();
  ctx.translate(x+(o.ox||0),y+(o.oy||0));ctx.rotate(o.ang||0);ctx.scale(s,s);ctx.globalAlpha=alpha;
  if(o.pulse&&!window.__gRM){
    var pu=(S.now%1.6)/1.6;
    ctx.globalAlpha=alpha*(1-pu)*0.5;
    ctx.strokeStyle=PAL.onPrimary;ctx.lineWidth=2;
    rr(-w/2-3-pu*4,-h/2-3-pu*4,w+6+pu*8,h+6+pu*8,8);ctx.stroke();
    ctx.globalAlpha=alpha;
  }
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.38)";ctx.shadowBlur=6;ctx.shadowOffsetY=3;
  var g=ctx.createLinearGradient(0,-h/2,0,h/2);
  if(o.face==="start"){g.addColorStop(0,PAL.primary);g.addColorStop(1,PAL.deep);}
  else{g.addColorStop(0,PAL.dom1);g.addColorStop(1,PAL.dom2);}
  rr(-w/2,-h/2,w,h,6);ctx.fillStyle=g;ctx.fill();
  ctx.restore();
  ctx.lineWidth=1.2;
  ctx.strokeStyle=o.face==="start"?colMix(PAL.deep,BLACK,0.25):colMix(PAL.dom2,BLACK,0.30);
  rr(-w/2,-h/2,w,h,6);ctx.stroke();
  ctx.globalAlpha=alpha*0.55;
  rr(-w/2+2.5,-h/2+2.5,w-5,h*0.34,4);ctx.fillStyle=WHITE;ctx.fill();
  ctx.globalAlpha=alpha;
  if(o.face==="start"){
    // 矢量三角「推倒」标记（替代字符字形）
    ctx.fillStyle=PAL.onPrimary;
    ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(7,6);ctx.lineTo(-7,6);ctx.closePath();ctx.fill();
  }else if(o.pips==="x"){
    ctx.fillStyle=colMix(PAL.dom2,BLACK,0.62);
    ctx.beginPath();ctx.arc(-w/4,0,2.6,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(w/4,0,2.6,0,Math.PI*2);ctx.fill();
  }else{
    ctx.strokeStyle=colMix(PAL.dom2,BLACK,0.32);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-w/2+3,0);ctx.lineTo(w/2-3,0);ctx.stroke();
    ctx.fillStyle=colMix(PAL.dom2,BLACK,0.62);
    ctx.beginPath();ctx.arc(0,-h/4,2.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(0,h/4,2.4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
/* 连锁轨迹（画在砖下） */
function drawTrails(){
  var i,o,p,tx,ty;
  ctx.lineCap="round";ctx.strokeStyle=PAL.trail;ctx.lineWidth=3;
  for(i=0;i<S.sim.order.length;i++){
    o=S.sim.order[i];p=chainP(o.depth);
    if(p<1)continue;
    tx=OX+o.x*CELL+CELL/2;ty=OY+o.y*CELL+CELL/2;
    ctx.globalAlpha=0.5*p;
    ctx.beginPath();ctx.moveTo(tx-o.dir[0]*CELL*0.6,ty-o.dir[1]*CELL*0.6);ctx.lineTo(tx,ty);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.lineCap="butt";
}
function draw(){
  // 桌面（外圈深色毡面）
  var dg=ctx.createLinearGradient(0,0,0,MH);
  dg.addColorStop(0,colMix(PAL.floor2,BLACK,0.28));
  dg.addColorStop(1,colMix(PAL.floor2,BLACK,0.52));
  ctx.fillStyle=dg;ctx.fillRect(0,0,MW,MH);
  drawGoalCard();
  drawBoard();
  var i,k,pk,px,py,kk,fallen={},anim={};
  if(S.sim){
    for(i=0;i<S.sim.order.length;i++){
      var o=S.sim.order[i];
      fallen[key(o.x,o.y)]=o;
      anim[key(o.x,o.y)]=chainP(o.depth);
    }
    drawTrails();
  }
  drawWalls();
  // 光标
  if(S.useKey&&S.phase==="run"&&!S.sim){
    var cx0=OX+S.cur[0]*CELL,cy0=OY+S.cur[1]*CELL;
    ctx.lineWidth=2.5;ctx.strokeStyle=colMix(PAL.deep,WHITE,0.55);
    rr(cx0+3,cy0+3,CELL-6,CELL-6,8);ctx.stroke();
    ctx.lineWidth=1.2;ctx.strokeStyle=PAL.deep;
    rr(cx0+4.5,cy0+4.5,CELL-9,CELL-9,7);ctx.stroke();
  }
  // 新摆牌入场轻弹
  var oldFx=S.placeFx,nf={};
  for(k in S.placed){nf[k]=(k in oldFx)?oldFx[k]:S.now;}
  S.placeFx=nf;
  // 摆牌（含倒下动画）
  for(k in S.placed){
    pk=k.split(",");px=+pk[0];py=+pk[1];kk=key(px,py);
    var alpha=1,sc=1;
    if(S.placeFx[kk]!=null){
      var pp=(S.now-S.placeFx[kk])/PLACE_DUR;
      if(pp<1){
        var e=1-Math.pow(1-Math.max(0,pp),3);
        sc=0.55+0.45*e;alpha=Math.max(0,pp*1.6);
      }
    }
    if(S.sim&&fallen[kk]){
      var d=fallen[kk],e=anim[kk];
      drawTile(px,py,{face:"dom",alpha:alpha,w:32,h:22,pips:"x",ang:(-Math.PI/2)*(1-e),ox:d.dir[0]*12*e,oy:d.dir[1]*12*e});
    }else drawTile(px,py,{face:"dom",alpha:alpha,scale:sc,w:24,h:32});
  }
  // 首牌
  var sk=key(S.start[0],S.start[1]);
  if(S.sim&&fallen[sk]){
    var sd=fallen[sk],se=anim[sk];
    drawTile(S.start[0],S.start[1],{face:"start",w:32,h:22,pips:"x",ang:(-Math.PI/2)*(1-se),ox:sd.dir[0]*12*se,oy:sd.dir[1]*12*se});
  }
  else drawTile(S.start[0],S.start[1],{face:"start",w:24,h:32,pulse:true});
  // 浮字
  ctx.textAlign="center";ctx.font="700 16px system-ui,sans-serif";
  ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=4;
  for(i=0;i<S.floats.length;i++){
    var f2=S.floats[i];
    ctx.globalAlpha=Math.min(1,f2.t*1.5);
    ctx.fillStyle=f2.col;ctx.fillText(f2.txt,f2.x,f2.y);
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}
function float_(x,y,txt,col){S.floats.push({x:x,y:y,txt:txt,col:col||PAL.danger,t:1});}
function stepFx(dt){
  var i;
  for(i=S.floats.length-1;i>=0;i--){
    var f=S.floats[i];f.y-=28*dt;f.t-=dt;
    if(f.t<=0)S.floats.splice(i,1);
  }
}
/* ---------- 输入 ---------- */
function pos(e){
  var r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  var p=pos(e);
  var cx=Math.floor((p.x-OX)/CELL),cy=Math.floor((p.y-OY)/CELL);
  tapCell(cx,cy);
});
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("keydown",function(e){
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","Enter"].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==="ArrowUp"&&S.cur[1]>0){S.cur[1]--;S.useKey=true}
  if(e.code==="ArrowDown"&&S.cur[1]<ROWS-1){S.cur[1]++;S.useKey=true}
  if(e.code==="ArrowLeft"&&S.cur[0]>0){S.cur[0]--;S.useKey=true}
  if(e.code==="ArrowRight"&&S.cur[0]<COLS-1){S.cur[0]++;S.useKey=true}
  if(e.code==="Space"&&S.phase==="run")tapCell(S.cur[0],S.cur[1]);
  if(e.code==="Enter"&&S.phase==="run")push();
  if(e.code==="KeyP"&&S.phase==="run"&&!S.sim){S.paused?((S.paused=false),hideOv()):pauseGame()}
  if(e.code==="KeyR"&&S.phase!=="menu")loadLevel(lvIdx);
  if(e.code==="Enter"&&S.phase!=="run")loadLevel(lvIdx);
});
$("btnPush").addEventListener("click",push);
$("btnClear").addEventListener("click",function(){if(!S.sim){S.placed={};S.toppled=0;syncHud();draw()}});
$("btnPause").addEventListener("click",pauseGame);
$("btnReset").addEventListener("click",function(){loadLevel(lvIdx)});
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&S.phase==="run"&&!S.paused&&!S.sim)pauseGame();
});
/* ---------- 主循环 ---------- */
var lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  var dt=Math.min(.05,(now-lastT)/1000);
  lastT=now;
  S.now+=dt;S.boardT+=dt;
  if(S.sim){
    S.sim.t+=dt;
    var total=CHAIN_DELAY_MAX+CHAIN_DUR;
    if(S.sim.t>=total&&!S.sim.done){S.sim.done=true;simDone()}
    stepFx(dt);
  }else if(S.phase==="run"){
    stepFx(dt);
  }
  draw();
}
/* ---------- 启动 ---------- */
palLoad();
syncHud();
showMenu();
resize();
window.addEventListener("resize",resize);
requestAnimationFrame(loop);
syncSaveFromServer();
syncLevelsFromServer();
/* 按钮 / 图例图标注入 */
if(window.SW_ICON){
  var bp=[["btnPush","play"],["btnClear","undo"],["btnPause","pause"],["btnReset","rotate"]],i;
  for(i=0;i<bp.length;i++)$(bp[i][0]).insertAdjacentHTML("afterbegin",window.SW_ICON(bp[i][1]));
  var lg=[["lgStart","play","首牌 · 连锁起点"],["lgDom","domino","骨牌 · 点空格摆"],["lgWall","wall","墙 · 挡路"],["lgTrail","trail","绿痕 · 连锁轨迹"]];
  for(i=0;i<lg.length;i++)$(lg[i][0]).innerHTML=window.SW_ICON(lg[i][1])+lg[i][2];
}
})();
</script>
</body>
