<style>

  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-st-sky1:#EAF4EC;--g-st-sky2:#F5F6F3;--g-st-bld:#C9CFC7;--g-st-bld2:#A9AEA9;--g-st-egg:#FFF7E8;--g-st-eggln:#D9C683;--g-st-basket:#C98A4B;--g-st-basket2:#A86B32;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-sky1:#1B241E;--g-st-sky2:#141614;--g-st-bld:#3A423C;--g-st-bld2:#4A544C;--g-st-egg:#D9CFA8;--g-st-eggln:#8A7F56;--g-st-basket:#6B4A26;--g-st-basket2:#4E351B;color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 2px; text-align: center; line-height: 1.3; min-width: 0; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.low { color: var(--g-danger); }
  .stage { position: relative; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); box-shadow: var(--g-shadow); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--g-btn-primary); color: #fff; }
  .btn:active { opacity: .85; }
  .btn[disabled] { opacity: .4; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay { position: fixed; inset: 0; z-index: 10; background: var(--g-scrim); display: none; align-items: center; justify-content: center; padding: 20px; }
  .overlay.show { display: flex; }
  .panel { width: 100%; max-width: 320px; padding: 22px 18px; background: var(--g-surface); border-radius: var(--g-radius); box-shadow: var(--g-shadow); text-align: center; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .desc b { color: var(--g-primary-deep); font-size: 28px; }
  .panel .btn { width: 100%; }

  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
/* SW 图标库：内联 SVG 线性图标（stroke=currentColor，24 viewBox） */
window.SW_ICON=function(n,s){s=s||"";var P={
 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>','arrow-left':'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 'arrow-up':'<path d="M12 19V5M6 11l6-6 6 6"/>','arrow-down':'<path d="M12 5v14M6 13l6 6 6-6"/>',
 'rotate':'<path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>',
 'check':'<path d="M4 12.5l5 5L20 6.5"/>','x':'<path d="M6 6l12 12M18 6L6 18"/>',
 'star':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',
 'star-o':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',
 'circle':'<circle cx="12" cy="12" r="5.5"/>','circle-f':'<circle cx="12" cy="12" r="5.5"/>',
 'tri-up':'<path d="M12 5l8 15H4z"/>','tri-down':'<path d="M12 19l-8-15h16z"/>','tri-left':'<path d="M5 12l15-8v16z"/>','tri-right':'<path d="M19 12L4 4v16z"/>',
 'backspace':'<path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z M12.5 9.5l5 5M17.5 9.5l-5 5"/>',
 'swap-h':'<path d="M7 4L3 8l4 4M3 8h14M17 12l4 4-4 4M21 16H7"/>'
};
var fill={ 'star':1,'circle-f':1,'tri-up':1,'tri-down':1,'tri-left':1,'tri-right':1 };
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};

<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<body>
<div class="wrap">
  <header><span class="sub">拖动篮子接住落蛋，风速会变</span><span class="sub" id="bestTag">最高 0</span></header>
  <div class="stats">
    <div class="stat"><span class="label">分数</span><span class="val" id="stScore">0</span></div>
    <div class="stat"><span class="label">生命</span><span class="val" id="stLives">3</span></div>
    <div class="stat"><span class="label">风向</span><span class="val" id="stWind">0</span></div>
  </div>
  <div class="stage"><canvas id="cv" aria-label="接蛋篮场地" role="img"></canvas></div>
  <p class="msg" id="msg" role="status" aria-live="polite">左右拖动篮子，接住楼上抛下的蛋</p>
  <div class="tools">
    <button class="btn" id="btnRestart" type="button">重开</button>
    <button class="btn" id="btnHint" type="button">提示</button>
    <button class="btn primary" id="btnStart" type="button">开始</button>
  </div>
  <p class="foot">触屏：按住篮子左右拖动 · 键盘：←/→ 移动篮子 · 风向每几秒变化</p>
</div>
<div class="overlay" role="dialog" aria-modal="true" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">游戏结束</h2>
    <p class="desc" id="ovDesc"></p>
    <button class="btn primary" id="ovBtn" type="button">再来一局</button>
  </div>
</div>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层 ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    success:v("--g-success"),warning:v("--g-warning"),danger:v("--g-danger"),
    sky1:v("--g-st-sky1"),sky2:v("--g-st-sky2"),bld:v("--g-st-bld"),bld2:v("--g-st-bld2"),
    egg:v("--g-st-egg"),eggln:v("--g-st-eggln"),basket:v("--g-st-basket"),basket2:v("--g-st-basket2")};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 状态 ---------- */
var SAVE_KEY="sw.eggcatch.v1";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,dpr=1;
var basket={x:0,w:0,y:0,h:0};
var eggs=[],parts=[];
var score=0,lives=3,combo=0,best=0,over=false,running=false;
var wind=0,windTimer=0,spawnTimer=0,elapsed=0;
var dragging=false,lastTs=0;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function rnd(a,b){return a+Math.random()*(b-a)}
/* ---------- 存档 ---------- */
function loadBest(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&typeof s.best==="number")return s.best;}catch(e){}return 0}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({best:best}));}catch(e){}
  if(GB.available)GB.saveState("egg-catch",{best:best}).catch(function(){});
}
best=loadBest();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("egg-catch").then(function(res){
    if(!res||!res.stateJson)return;
    try{var r=JSON.parse(res.stateJson);var rb=parseInt(r.best,10)||0;if(rb>best){best=rb;persist();updStats()}}catch(e){}
  }).catch(function(){});
}
/* ---------- 布局 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=wCss;H=Math.round(W*1.25);
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  basket.w=Math.max(84,Math.round(W*0.22));basket.h=Math.round(basket.w*0.30);
  basket.y=H-Math.round(H*0.14);
  if(!dragging)basket.x=Math.max(basket.w/2,Math.min(W-basket.w/2,basket.x||W/2));
}
/* ---------- 统计 ---------- */
function updStats(){
  $("stScore").textContent=score;
  $("stLives").textContent=lives;
  $("stLives").classList.toggle("low",lives<=1);
  $("stWind").textContent=(wind>0?"→":wind<0?"←":"·")+" "+Math.abs(Math.round(wind/8));
  $("bestTag").textContent="最高 "+best;
}
/* ---------- 流程 ---------- */
function start(){
  eggs=[];parts=[];score=0;lives=3;combo=0;elapsed=0;wind=0;windTimer=2.5;spawnTimer=0.6;
  basket.x=W/2;running=true;over=false;hideOverlay();updStats();
  say("左右拖动篮子，接住楼上抛下的蛋");
}
function endGame(){
  running=false;over=true;
  var isNew=score>best;
  if(isNew){best=score;persist()}
  if(GB.available)GB.reportScore("egg-catch",{metricValue:score,metricExtra:combo}).catch(function(){});
  $("ovTitle").textContent="篮子翻啦";
  $("ovDesc").innerHTML="得分 <b>"+score+"</b>"+(isNew?" · 新纪录":"")+"<br>最高连中 "+combo+" · 历史最高 "+best;
  $("overlay").classList.add("show");
}
function spawnEgg(){
  var hard=Math.min(1,score/220);
  var x=rnd(40,W-40);
  eggs.push({
    x:x,y:34,vx:rnd(-30,30),vy:rnd(0,40),
    r:Math.max(10,Math.round(W*0.028)),
    g:380+hard*260,
    spin:rnd(-2,2),rot:0,
    golden:Math.random()<0.08
  });
}
/* ---------- 主循环 ---------- */
function step(ts){
  if(!lastTs)lastTs=ts;
  var dt=Math.min(0.033,(ts-lastTs)/1000);lastTs=ts;
  if(running){
    elapsed+=dt;
    //风速变化
    windTimer-=dt;
    if(windTimer<=0){
      var hard=Math.min(1,score/220);
      wind=rnd(-1,1)*(60+hard*90);
      windTimer=rnd(3.5,6.5);
      updStats();
    }
    //生成
    spawnTimer-=dt;
    if(spawnTimer<=0){
      var hard2=Math.min(1,score/220);
      spawnEgg();
      spawnTimer=Math.max(0.55,1.55-hard2*0.85)*rnd(0.75,1.25);
    }
    //蛋运动
    for(var i=eggs.length-1;i>=0;i--){
      var e=eggs[i];
      e.vy+=e.g*dt;
      e.vx+=wind*dt*0.35;
      e.x+=e.vx*dt;e.y+=e.vy*dt;e.rot+=e.spin*dt;
      if(e.x<e.r){e.x=e.r;e.vx=Math.abs(e.vx)*0.6}
      if(e.x>W-e.r){e.x=W-e.r;e.vx=-Math.abs(e.vx)*0.6}
      //接住
      if(e.vy>0&&Math.abs(e.x-basket.x)<basket.w/2+e.r*0.4&&e.y+e.r>=basket.y&&e.y<basket.y+basket.h+10){
        var gain=e.golden?50:10;
        combo++;score+=gain+(combo>1?Math.min(20,combo):0);
        for(var p=0;p<8;p++)parts.push({x:e.x,y:e.y,vx:rnd(-90,90),vy:rnd(-160,-30),t:Date.now(),c:e.golden?PAL.warning:PAL.egg});
        eggs.splice(i,1);updStats();
        say((e.golden?"金蛋 +":"接住 +")+gain+(combo>1?" · 连中 ×"+combo:""));
        continue;
      }
      //落地
      if(e.y>H+20){
        eggs.splice(i,1);combo=0;lives--;updStats();
        for(var p2=0;p2<10;p2++)parts.push({x:e.x,y:H-6,vx:rnd(-120,120),vy:rnd(-140,-20),t:Date.now(),c:PAL.danger});
        if(lives<=0){endGame();break}
        say("蛋碎了，连中清零");
      }
    }
    //碎蛋粒子
    var now=Date.now();
    parts=parts.filter(function(p){return now-p.t<700});
    for(var j=0;j<parts.length;j++){
      var q=parts[j];q.vy+=600*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    }
  }
  draw();
  requestAnimationFrame(step);
}
/* ---------- 绘制 ---------- */
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.sky1);g.addColorStop(1,PAL.sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  //楼
  ctx.fillStyle=PAL.bld;ctx.fillRect(0,0,W,44);
  ctx.fillStyle=PAL.bld2;
  var win=22,gap=34,n=Math.floor(W/gap);
  for(var i=0;i<n;i++){
    var x=i*gap+8;
    ctx.fillStyle=(i%3===0)?PAL.surface2:PAL.bld2;
    ctx.fillRect(x,12,win,20);
  }
  //风向箭头
  ctx.fillStyle=PAL.muted;ctx.font="600 14px -apple-system,'PingFang SC',sans-serif";
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  var wtxt=wind===0?"无风":(wind>0?"风向 →":"← 风向")+" "+Math.abs(Math.round(wind/8));
  ctx.fillText(wtxt,12,H-14);
  //蛋
  for(var e=0;e<eggs.length;e++){
    var eg=eggs[e];
    ctx.save();ctx.translate(eg.x,eg.y);ctx.rotate(eg.rot);
    ctx.fillStyle=eg.golden?PAL.warning:PAL.egg;
    ctx.beginPath();ctx.ellipse(0,0,eg.r*0.82,eg.r,0,0,7);ctx.fill();
    ctx.strokeStyle=eg.golden?PAL.danger:PAL.eggln;ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0,eg.r*0.82,eg.r,0,0,7);ctx.stroke();
    ctx.restore();
  }
  //篮子
  var bx=basket.x-basket.w/2,by=basket.y;
  ctx.fillStyle=PAL.basket;
  ctx.beginPath();
  ctx.moveTo(bx,by);ctx.lineTo(bx+basket.w,by);
  ctx.lineTo(bx+basket.w-10,by+basket.h);ctx.lineTo(bx+10,by+basket.h);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=PAL.basket2;ctx.lineWidth=2.5;ctx.stroke();
  ctx.strokeStyle=PAL.basket2;ctx.lineWidth=2;
  for(var s=1;s<4;s++){
    ctx.beginPath();ctx.moveTo(bx+s*basket.w/4,by+2);ctx.lineTo(bx+s*basket.w/4-2,by+basket.h-2);ctx.stroke();
  }
  //粒子
  var now=Date.now();
  for(var j=0;j<parts.length;j++){
    var q=parts[j],k=(now-q.t)/700;
    ctx.globalAlpha=1-k;ctx.fillStyle=q.c;
    ctx.beginPath();ctx.arc(q.x,q.y,3.5*(1-k)+1,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  if(!running&&!over){
    ctx.fillStyle=PAL.scrim;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=PAL.text;ctx.font="700 22px -apple-system,'PingFang SC',sans-serif";
    ctx.textAlign="center";ctx.fillText("准备接蛋",W/2,H/2-10);
    ctx.fillStyle=PAL.muted;ctx.font="500 14px -apple-system,'PingFang SC',sans-serif";
    ctx.fillText("点击「开始」",W/2,H/2+18);
  }
  if(over){ctx.fillStyle=PAL.scrim;ctx.fillRect(0,0,W,H)}
}
/* ---------- 输入 ---------- */
function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",function(e){
  if(!running)return;
  dragging=true;moveBasket(e);
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){if(dragging&&running)moveBasket(e)});
function moveBasket(e){
  var p=pt(e);
  basket.x=Math.max(basket.w/2,Math.min(W-basket.w/2,p.x));
}
cv.addEventListener("pointerup",function(){dragging=false});
cv.addEventListener("pointercancel",function(){dragging=false});
var keyDir=0;
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft"){keyDir=-1;e.preventDefault()}
  else if(e.key==="ArrowRight"){keyDir=1;e.preventDefault()}
  else if((e.key===" "||e.key==="Enter")&&!running){start();e.preventDefault()}
});
window.addEventListener("keyup",function(e){
  if(e.key==="ArrowLeft"&&keyDir===-1)keyDir=0;
  if(e.key==="ArrowRight"&&keyDir===1)keyDir=0;
});
setInterval(function(){
  if(running&&keyDir!==0){
    basket.x=Math.max(basket.w/2,Math.min(W-basket.w/2,basket.x+keyDir*9));
  }
},16);
$("btnStart").addEventListener("click",start);
$("btnRestart").addEventListener("click",start);
$("btnHint").addEventListener("click",function(){say("提示：金蛋 50 分；提前预判风向，连中有加成")});
$("ovBtn").addEventListener("click",start);
function hideOverlay(){$("overlay").classList.remove("show")}
window.addEventListener("resize",resize);
palLoad();resize();updStats();
requestAnimationFrame(step);
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套） */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
