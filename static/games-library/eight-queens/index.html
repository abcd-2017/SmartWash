  var pending={},seq=0;

    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},

34","n":8,"presets":[[2,2],[0,6]],"difficulty":3},{"name":"皇后·35","n":8,"presets":[[5,1],[3,0]],"difficulty":3},{"name":"皇后·36","n":8,"presets":[[5,7],[6,5]],"difficulty":3},{"name":"皇后·37","n":8,"presets":[[3,4],[6,6]],"difficulty":3},{"name":"皇后·38","n":8,"presets":[[1,7],[7,3]],"difficulty":3},{"name":"皇后·39","n":8,"presets":[[4,0],[0,7],[3,2]],"difficulty":3},{"name":"皇后·40","n":8,"presets":[[0,1],[2,0],[4,3]],"difficulty":3},{"name":"皇后·41","n":8,"presets":[[6,5],[7,2],[3,0]],"difficulty":3},{"name":"皇后·42","n":8,"presets":[[3,0],[6,5],[2,6]],"difficulty":3}];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;

  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}

}

/* 单条结构校验 */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.n)||d.n<4||d.n>9)return false;
  var presets=(d.presets===undefined)?[]:d.presets;
  if(!Array.isArray(presets)||presets.length>=d.n)return false;
  var seenRows={};
  for(var i=0;i<presets.length;i++){
    var p=presets[i];
    if(!Array.isArray(p)||p.length!==2)return false;
    if(!Number.isInteger(p[0])||!Number.isInteger(p[1]))return false;
    if(p[0]<0||p[0]>=d.n||p[1]<0||p[1]>=d.n)return false;
    if(seenRows[p[0]])return false;   // 每行至多一个预置子
    seenRows[p[0]]=1;
    for(var j=0;j<i;j++){
      if(Math.abs(presets[j][0]-p[0])===Math.abs(presets[j][1]-p[1]))return false;   // 预置子互不攻击
    }
  }
  return true;
}
/* ---------- 独立求解器：行序回溯（用于加载复核与提示） ----------
   queens: 数组下标=行，值=列（-1 未放）。返回一个完整解或 null（找解 + 冲突剪枝） */
function queensSolve(n,queens){
  var pos=queens.slice();
  function attacked(r,c){
    for(var pr=0;pr<n;pr++){
      if(pr===r||pos[pr]<0)continue;
      if(pos[pr]===c||Math.abs(pos[pr]-c)===Math.abs(pr-r))return true;
    }
    return false;
  }
  function dfs(r){
    if(r===n)return true;
    if(pos[r]>=0)return dfs(r+1);   // 已放（预置/玩家）行跳过，但需冲突检查
    for(var c=0;c<n;c++){
      if(!attacked(r,c)){
        pos[r]=c;
        if(dfs(r+1))return true;
        pos[r]=-1;
      }
    }
    return false;
  }
  // 先验证已放部分互不攻击
  for(var r=0;r<n;r++){
    if(pos[r]>=0&&attacked(r,pos[r]))return null;
  }
  return dfs(0)?pos:null;
}
function queensVerify(L){
  var presets=L.presets||[];
  var queens=new Array(L.n).fill(-1);
  for(var i=0;i<presets.length;i++)queens[presets[i][0]]=presets[i][1];
  return !!queensSolve(L.n,queens);
}

  var ok=queensVerify(L);   // 加载复核：预置约束下仍有完整解
  queens=new Array(n).fill(-1);
  presetSet.forEach(function(c,r){queens[r]=c});
  history=[];done=false;curR=0;curC=0;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=n+"×"+n+" 棋盘"+(presetSet.size?" · "+presetSet.size+" 枚预置后":"");
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stTotal").textContent=n;
  if(!ok)say("警告：内嵌求解器未能复核本关（数据异常）");
  else say("每行放一个皇后，共 "+n+" 枚（含预置后）");
  render();updStats();
}
function attacksAny(r,c,skipRow){
  for(var pr=0;pr<n;pr++){
    if(pr===skipRow||queens[pr]<0)continue;
    if(queens[pr]===c||Math.abs(queens[pr]-c)===Math.abs(pr-r))return true;
  }
  return false;
}
function attackedCells(){
  var atk=new Set();
  for(var pr=0;pr<n;pr++){
    if(queens[pr]<0)continue;
    for(var r=0;r<n;r++)for(var c=0;c<n;c++){
      if(r===pr&&c===queens[pr])continue;
      if(queens[pr]===c||Math.abs(queens[pr]-c)===Math.abs(pr-r))atk.add(r*n+c);
    }
  }
  return atk;
}
function placedCount(){
  var c=0;for(var i=0;i<n;i++)if(queens[i]>=0)c++;
  return c;
}
function updStats(){
  $("stPlaced").textContent=placedCount();
  $("btnUndo").disabled=!history.length||done;
}
/* ---------- 渲染 ---------- */
function render(){
  var atk=attackedCells();
  var board=$("qboard");
  board.style.gridTemplateColumns="repeat("+n+",1fr)";
  board.innerHTML="";
  for(var r=0;r<n;r++)for(var c=0;c<n;c++){
    (function(r,c){
      var d=document.createElement("button");
      d.type="button";
      var cls="qcell";
      if((r+c)%2===0)cls+=" lt";
      if(atk.has(r*n+c))cls+=" atk";
      var isPreset=presetSet.has(r)&&presetSet.get(r)===c;
      if(isPreset)cls+=" fixed";
      if(curR===r&&curC===c)cls+=" cur";
      d.className=cls;
      d.disabled=isPreset;
      if(queens[r]===c)d.innerHTML=QUEEN_SVG;
      d.setAttribute("aria-label","行 "+(r+1)+" 列 "+(c+1));
      d.addEventListener("click",function(){toggleQueen(r,c)});
      board.appendChild(d);
    })(r,c);
  }
}
function toggleQueen(r,c){
  if(done)return;
  if(presetSet.has(r)&&presetSet.get(r)===c){say("预置后不能移动");return;}
  if(queens[r]===c){
    history.push(r);
    queens[r]=-1;
    render();updStats();
    return;
  }
  if(attacksAny(r,c,r)){say("这里会被别的皇后攻击");return;}
  history.push(r);
  queens[r]=c;
  render();updStats();
  if(placedCount()===n){
    // 全放好：验证无攻击
    for(var pr=0;pr<n;pr++){
      if(attacksAny(pr,queens[pr],pr)){say("还有相互攻击的皇后，调整一下");return;}
    }
    winLevel();
  }
}
function undo(){
  if(!history.length||done)return;
  var r=history.pop();
  queens[r]=-1;
  render();updStats();say("已撤销");
}
function hint(){
  if(done)return;
  var sol=queensSolve(n,queens);
  if(!sol){say("内嵌求解器：当前局面无解，撤销几步再试");return;}
  for(var r=0;r<n;r++){
    if(queens[r]<0){
      var c=sol[r];
      var board=$("qboard").children;
      var cell=board[r*n+c];
      if(cell){
        cell.classList.add("hintc");
        setTimeout(function(){if(board[r*n+c])board[r*n+c].classList.remove("hintc")},1600);
      }
      say("求解器建议在 第"+(r+1)+"行 第"+(c+1)+"列 落后");
      return;
    }
  }
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:history.length}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"布阵成功！";
  $("ovDesc").innerHTML=n+" 枚皇后互不攻击（含 "+presetSet.size+" 枚预置）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>42 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 输入 ---------- */
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(done)return;openLevelSelect()});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowUp"){curR=(curR+n-1)%n;render();e.preventDefault();}
  else if(k==="ArrowDown"){curR=(curR+1)%n;render();e.preventDefault();}
  else if(k==="ArrowLeft"){curC=(curC+n-1)%n;render();e.preventDefault();}
  else if(k==="ArrowRight"){curC=(curC+1)%n;render();e.preventDefault();}
  else if(k===" "||k==="Enter"){
    if($("overlay").classList.contains("show"))$("ovBtn").click();
    else toggleQueen(curR,curC);
    e.preventDefault();
  }
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);
syncLevelsFromServer();syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
