  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);

var R=document.documentElement,B=null;

window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();

<script>
/*X3-ENGINE-BEGIN*/
var ER=(function(){
"use strict";
/* ===== 世界常量（离散 tick） ===== */
var W=480,H=380,MOVE=1;
/* ===== 确定性伪随机（mulberry32） ===== */
function makeRng(seed){return{s:seed|0};}
function rngNext(rng){
  rng.s=(rng.s+0x6D2B79F5)|0;
  var t=Math.imul(rng.s^(rng.s>>>15),1|rng.s);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;
}
/* 呼叫由种子确定性生成：在 [2, ticks-8] 内近似均布、带随机抖动 */
function genCalls(lv){
  var rng=makeRng(lv.seed>>>0),out=[],j,n=lv.target+4,avg=(lv.ticks-12)/n;
  for(j=0;j<n;j++){
    var tt=Math.round(2+j*avg+(rngNext(rng)-0.5)*avg*0.8);
    if(tt<2)tt=2;
    if(j>0&&tt<=out[j-1].t)tt=out[j-1].t+1;
    if(tt>lv.ticks-8)tt=lv.ticks-8;
    var from=Math.floor(rngNext(rng)*lv.F),to=Math.floor(rngNext(rng)*lv.F);
    if(to===from)to=(from+1+Math.floor(rngNext(rng)*(lv.F-1)))%lv.F;
    out.push({t:tt,from:from,to:to});
  }
  out.sort(function(a,b){return a.t-b.t;});
  return out;
}
/* ===== 对局状态 ===== */
function newState(lv){
  var elev=[],k;
  for(k=0;k<lv.elevs;k++)elev.push({f:0,cool:0,queue:[],riders:[]});
  var calls=[],m;
  for(m=0;m<lv.calls.length;m++){
    var c=lv.calls[m];
    calls.push({t:c.t,from:c.from,to:c.to,st:"new",born:c.t,elev:-1});
  }
  return {t:0,elev:elev,calls:calls,delivered:0,strikes:0,win:false,over:false,reason:null};
}
/* 派梯：给呼叫选最近（含队列长度惩罚）的电梯并追加取人任务 */
function assign(lv,st,cid){
  var c=st.calls[cid];
  if(!c||c.st!=="wait"||c.elev>=0)return false;
  var best=-1,bd=1e9,i;
  for(i=0;i<st.elev.length;i++){
    var e=st.elev[i],d=Math.abs(e.f-c.from)+e.queue.length*2;
    if(d<bd){bd=d;best=i;}
  }
  if(best<0)return false;
  c.elev=best;
  st.elev[best].queue.push({k:"pick",floor:c.from,c:cid});
  return true;
}
/* ===== 共享单步：到达呼叫 → 派梯 → 电梯运行 → 等待超时 → 胜负 ===== */
function simTick(lv,st,action){
  if(st.over||st.win)return st;
  var i,j,a;
  for(i=0;i<st.calls.length;i++)if(st.calls[i].st==="new"&&st.calls[i].t<=st.t)st.calls[i].st="wait";
  if(action==="all"){
    for(var z=0;z<st.calls.length;z++)assign(lv,st,z);
  }else if(action!=null)assign(lv,st,action);
  for(j=0;j<st.elev.length;j++){
    var e=st.elev[j];
    if(e.cool>0){e.cool--;continue;}
    if(!e.queue.length)continue;
    var tk=e.queue[0];
    if(e.f!==tk.floor){e.f+=Math.sign(tk.floor-e.f);e.cool=MOVE;continue;}
    e.queue.shift();
    if(tk.k==="pick"){
      var seated=0;
      for(a=0;a<st.calls.length;a++){
        var c=st.calls[a];
        if(c.st==="wait"&&c.elev===j&&c.from===e.f){
          if(e.riders.length>=lv.cap){seated=0;break;}
          c.st="ride";
          e.riders.push(c.to);
          e.queue.push({k:"drop",floor:c.to,c:a});
          seated++;
        }
      }
      if(seated===0){e.queue.push(tk);}   /* 客满：稍后重试 */
    }else{
      var before=e.riders.length;
      e.riders=e.riders.filter(function(d){return d!==tk.floor;});
      st.delivered+=before-e.riders.length;
    }
  }
  for(a=0;a<st.calls.length;a++){
    var cc=st.calls[a];
    if(cc.st==="wait"){
      if(st.t-cc.born>lv.patience){cc.st="lost";st.strikes++;}
    }
  }
  st.t++;
  if(st.strikes>=3){st.over=true;st.reason="strikes";return st;}
  if(st.delivered>=lv.target){st.win=true;return st;}
  if(st.t>=lv.ticks){st.over=true;st.reason="time";}
  return st;
}
/* ===== 验证器策略：每 tick 给最早未派的在等呼叫派最优梯 ===== */
function policySim(lv){
  var st=newState(lv),guard=lv.ticks+50;
  /* 策略：每 tick 给所有未派的在等呼叫派最优梯（等价于「一键派梯」） */
  while(!st.over&&!st.win&&guard-->0)simTick(lv,st,"all");
  return st;
}
/* ===== 关卡（第 1 关手工锚点关；其余公式化生成 + 策略回放收敛，坏关不进表） ===== */
var L1={name:"调度·01",seed:20261122,ticks:80,F:8,elevs:2,cap:4,move:MOVE,patience:52,
  span:7,target:6,difficulty:1,calls:null};
L1.calls=genCalls(L1);
function genLevel(i){
  var lv={name:"调度·"+(i<9?"0":"")+(i+1),seed:1000+i*77,
    ticks:80+Math.floor(i/2)*4,F:8+(i%5),elevs:2+(i>=20?1:0),
    cap:4,move:MOVE,patience:50+(i%4)*8,span:7,
    target:6+Math.floor(i/3),difficulty:Math.min(6,1+Math.floor(i/7)),calls:null};
  lv.calls=genCalls(lv);
  /* 收敛调整：抬耐心→降目标→加梯，直至策略回放可达成（坏关不进表） */
  for(var tries=0;tries<10;tries++){
    var st=policySim(lv);
    if(st.win&&!st.over)break;
    if(tries<4)lv.patience+=8;
    else if(tries<8)lv.target=Math.max(3,lv.target-1);
    else if(lv.elevs<4)lv.elevs++;
    else break;
  }
  return lv;
}
var LEVELS=[L1];
for(var gi=1;gi<40;gi++)LEVELS.push(genLevel(gi));
function verifyAll(){
  var res=[],i;
  for(i=0;i<LEVELS.length;i++){var st=policySim(LEVELS[i]);res.push({ok:st.win&&!st.over,out:st.delivered});}
  return res;
}
function selfTest(){
  var out=[];
  /* 锚点1：第 1 关策略回放恰好送达 6 人（目标值）且零跑单 */
  var s1=policySim(L1);
  out.push({name:"锚点1·第1关策略送达6人零跑单",pass:s1.win&&s1.delivered===6&&s1.strikes===0});
  /* 锚点2：合成超员关（6 个呼叫挤 1 部慢梯、耐心极短）→ 必跑满 3 单判负（人工推演：单梯往返远大于耐心） */
  var tiny={name:"tiny",seed:1,ticks:80,F:6,elevs:1,cap:2,move:MOVE,patience:6,span:2,target:6,difficulty:6,
    calls:[{t:0,from:0,to:5},{t:2,from:0,to:4},{t:4,from:0,to:3},{t:6,from:0,to:5},{t:8,from:0,to:2},{t:10,from:0,to:4}]};
  var st2=policySim(tiny);
  out.push({name:"锚点2·超员慢梯必跑满3单",pass:st2.over&&st2.reason==="strikes"});
  /* 锚点3：全部 40 关策略回放可达成 */
  var all=verifyAll(),bad=[];
  for(var i=0;i<all.length;i++)if(!all[i].ok)bad.push(i+1);
  out.push({name:"全关验证·40关策略回放可达成",pass:bad.length===0,bad:bad.join(",")});
  return out;
}
return {W:W,H:H,MOVE:MOVE,LEVELS:LEVELS,genCalls:genCalls,newState:newState,assign:assign,simTick:simTick,
  policySim:policySim,verifyAll:verifyAll,selfTest:selfTest};
})();
window.ER=ER;
/*X3-ENGINE-END*/
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（DB 下发优先：整表策略回放通过才接受；本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="elevator-rush",SAVE_KEY="sw.elevatorrush.v1";
var DEFAULT_LEVELS=ER.LEVELS;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.ticks)||d.ticks<20||d.ticks>200)return false;
  if(!Number.isInteger(d.F)||d.F<3||d.F>12)return false;
  if(!Number.isInteger(d.elevs)||d.elevs<1||d.elevs>4)return false;
  if(!Number.isInteger(d.cap)||d.cap<1||d.cap>8)return false;
  if(!Number.isInteger(d.move)||d.move<1||d.move>6)return false;
  if(!Number.isInteger(d.patience)||d.patience<5||d.patience>150)return false;
  if(!Number.isInteger(d.span)||d.span<1||d.span>20)return false;
  if(!Number.isInteger(d.target)||d.target<1)return false;
  if(!Array.isArray(d.calls)||d.calls.length<d.target)return false;
  for(var j=0;j<d.calls.length;j++){
    var c=d.calls[j];
    if(!c||!Number.isInteger(c.t)||!Number.isInteger(c.from)||!Number.isInteger(c.to))return false;
    if(c.t<0||c.t>=d.ticks||c.from<0||c.from>=d.F||c.to<0||c.to>=d.F||c.from===c.to)return false;
  }
  var probe=ER.policySim(d);
  return probe.win===true&&!probe.over;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  for(var i=0;i<list.length;i++)if(!validLevelData(list[i]))return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){
      var ok=true;
      for(var i=0;i<list.length;i++)if(!validLevelData(list[i])){ok=false;break;}
      if(ok){LEVELS=list;return v;}
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    if(!res||!Array.isArray(res.levels)||!res.levels.length)return;
    var list=[],seen={};
    for(var i=0;i<res.levels.length;i++){
      var row=res.levels[i];
      if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return;
      var d;try{d=JSON.parse(row.dataJson);}catch(e){return;}
      if(seen[d&&d.name])return;seen[d&&d.name]=1;
      list.push(d);
    }
    if(list.length&&applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";$("ovBtn").style.background="var(--g-surface2)";$("ovBtn").style.color="var(--g-text)";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),
    bld:v("--g-st-er-bld"),bld2:v("--g-st-er-bld2"),car:v("--g-st-er-car"),car2:v("--g-st-er-car2"),flr:v("--g-st-er-flr")};
}
window.__gOnTheme=function(){palLoad()};
palLoad();
/* ---------- 状态（续玩：lv 起步即存档关） ---------- */
var lv=save.lv,L=null,st=null,state="running",gen=0,selCall=-1,dotPos=[];
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=ER.W,H=ER.H;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  st=ER.newState(L);state="running";gen++;selCall=-1;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=L.F+" 层 · "+L.elevs+" 部梯";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  updStats();
  $("btnPause").textContent="暂停";
  hideOverlay();
  say("点候梯乘客派最近的空梯；等太久会跑单");
}
function updStats(){
  $("stSrv").textContent=st.delivered+"/"+L.target;
  $("stTick").textContent=Math.max(0,L.ticks-st.t);
  $("stStrike").textContent=st.strikes+"/3";
  $("stStrike").classList.toggle("low",st.strikes>0);
}
function finish(){
  state="over";gen++;
  if(st.win){
    if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:st.delivered}).catch(function(){});
    $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"交班！";
    $("ovDesc").innerHTML="安全送达 "+st.delivered+" 人，跑单 "+st.strikes+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
    $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
    $("ovBtn").style.background="var(--g-btn-primary)";$("ovBtn").style.color="#fff";
  }else{
    var why=st.reason==="strikes"?"跑单满 3 单，物业把你辞了":"时间到，还有人没送完";
    $("ovTitle").textContent="被投诉了";
    $("ovDesc").textContent=why+"。提前派梯、别让乘客干等。";
    $("ovBtn").textContent="重试本关";
    $("ovBtn").style.background="var(--g-btn-primary)";$("ovBtn").style.color="#fff";
  }
  $("overlay").classList.add("show");
}
/* ---------- 绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.height=Math.round(w*H/W)+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*H/W*dpr);
  var sc=w/W;
  ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
}
function rr(x,y,w2,h2,r){
  r=Math.min(r,w2/2,h2/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);
  ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();
}
function floorY(f){
  var top=26,bot=H-30;
  return bot-(bot-top)*(f/(L.F-1));
}
function draw(){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  if(!st)return;
  var rowH=(H-56)/(L.F-1),i,j;
  /* 楼层线与编号 */
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.fillStyle=PAL.muted;ctx.font="400 12px sans-serif";ctx.textAlign="right";ctx.textBaseline="middle";
  for(i=0;i<L.F;i++){
    var y=floorY(i);
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W-120,y);ctx.stroke();
    ctx.fillText(String(i),W-128,y);
  }
  /* 井道与轿厢 */
  var shaftX=16,shaftW=44,gap=14;
  for(j=0;j<st.elev.length;j++){
    var sx=shaftX+j*(shaftW+gap);
    ctx.fillStyle=PAL.flr;
    rr(sx,floorY(L.F-1)-rowH*0.6,shaftW,floorY(0)-floorY(L.F-1)+rowH,8);ctx.fill();
    ctx.strokeStyle=PAL.bld2;ctx.lineWidth=1.5;ctx.stroke();
    var e=st.elev[j];
    var ey=floorY(e.f);
    ctx.fillStyle=PAL.car;
    rr(sx+4,ey-rowH*0.45,shaftW-8,rowH*0.9,6);ctx.fill();
    ctx.strokeStyle=PAL.car2;ctx.lineWidth=2;ctx.stroke();
    /* 乘客点 */
    for(i=0;i<e.riders.length&&i<L.cap;i++){
      ctx.fillStyle=PAL.primary;
      ctx.beginPath();ctx.arc(sx+12+i*9,ey,3.5,0,7);ctx.fill();
    }
    /* 任务数 */
    if(e.queue.length){
      ctx.fillStyle=PAL.warning;
      ctx.font="700 12px sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
      ctx.fillText("×"+e.queue.length,sx+shaftW-2,floorY(L.F-1)-rowH*0.6-8);
    }
  }
  /* 候梯呼叫点（右栏，按楼层排布） */
  dotPos=[];
  var colX=W-92;
  for(i=0;i<st.calls.length;i++){
    var c=st.calls[i];
    if(c.st!=="wait"&&c.st!=="new")continue;
    var cy=floorY(c.from)+((i%2)?8:-8);
    dotPos.push({x:colX+((i%3)-1)*8,y:cy,id:i});
  }
  for(var k=0;k<dotPos.length;k++){
    var p=dotPos[k],c2=st.calls[p.id];
    var assigned=c2.elev>=0;
    var urgent=!assigned&&c2.st==="wait"&&(st.t-c2.born)>L.patience*0.6;
    ctx.fillStyle=assigned?PAL.success:(urgent?PAL.danger:PAL.water);
    ctx.beginPath();ctx.arc(p.x,p.y,14,0,7);ctx.fill();
    ctx.strokeStyle=k===selCall?PAL.warning:PAL.border;ctx.lineWidth=k===selCall?3:1.5;ctx.stroke();
    ctx.fillStyle=(!assigned&&!urgent)?(document.documentElement.dataset.theme==="dark"?PAL.surface:PAL.text):PAL.surface;
    ctx.font="700 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("→"+c2.to,p.x,p.y+1);
  }
  ctx.fillStyle=PAL.muted;
  ctx.font="400 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("圆点=候梯乘客 · 箭头上数字=目的层",W-92,H-14);
}
/* ---------- tick 节拍（rAF 驱动；切后台 rAF 停 → 时间自动冻结） ---------- */
var TICK_SEC=0.35,acc=0;
var rafId=0,last=0;
function frame(ts){
  rafId=requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.05,(ts-last)/1000||0);
  last=ts;
  if(state==="running"){
    acc+=dt;
    var n=0;
    while(acc>=TICK_SEC&&n++<4){
      acc-=TICK_SEC;
      ER.simTick(L,st,null);
      updStats();
      if(st.over||st.win){finish();break;}
    }
  }
  draw();
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){
    if(rafId){cancelAnimationFrame(rafId);rafId=0;}
    if(state==="running"){state="paused";$("btnPause").textContent="继续";say("已暂停——回到游戏继续调度");}
  }else if(!rafId){last=0;rafId=requestAnimationFrame(frame);}
});
/* ---------- 输入 ---------- */
function assignAll(){
  if(state!=="running"||!st)return;
  for(var a=0;a<st.calls.length;a++)if(st.calls[a].st==="wait"&&st.calls[a].elev<0)ER.assign(L,st,a);
}
function pickCall(ev){
  var r=cv.getBoundingClientRect();
  var x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;
  var best=-1,bd=1e9;
  for(var i=0;i<dotPos.length;i++){
    var d=Math.hypot(dotPos[i].x-x,dotPos[i].y-y);
    if(d<24&&d<bd){bd=d;best=i;}
  }
  if(best>=0){
    selCall=dotPos[best].id;
    ER.assign(L,st,dotPos[best].id);
  }
}
cv.addEventListener("pointerdown",function(e){pickCall(e);e.preventDefault();});
cv.addEventListener("pointercancel",function(){});
$("btnAuto").addEventListener("click",assignAll);
$("btnPause").addEventListener("click",function(){
  if(state==="running"){state="paused";$("btnPause").textContent="继续";say("已暂停");}
  else if(state==="paused"){state="running";$("btnPause").textContent="暂停";say("继续调度");}
});
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(state!=="over")openLevelSelect();});
$("ovBtn").addEventListener("click",function(){
  if(st.win){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }else loadLevel(lv);
  $("ovBtn").style.background="var(--g-surface2)";$("ovBtn").style.color="var(--g-text)";
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowUp"||k==="ArrowDown"){
    e.preventDefault();
    var dir=k==="ArrowUp"?-1:1,tries=0;
    if(!st)return;
    do{selCall=(selCall+dir+st.calls.length)%st.calls.length;tries++;}while(tries<st.calls.length&&st.calls[selCall].st!=="wait");
  }else if(k==="Enter"){e.preventDefault();if(selCall>=0)ER.assign(L,st,selCall);}
  else if(k===" "){e.preventDefault();assignAll();}
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
window.addEventListener("resize",resize);
/* ---------- 启动（loadLevel 以存档关续玩） ---------- */
loadLevel(save.lv);resize();rafId=requestAnimationFrame(frame);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
