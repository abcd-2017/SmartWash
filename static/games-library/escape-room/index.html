<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>单景密室</title>
<style>
  /*token:GAME-THEME.md §2 基线（值与基线一致）+ §3 素材 token（--g-st-* 为本作素材色，深色为同色相压暗变体）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-st-room:#EDEFEA;--g-st-card:#FFFFFF;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-room:#1A1D1A;--g-st-card:#1D201E;color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; min-width: 0; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.low { color: var(--g-danger); }
  .stage { position: relative; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); box-shadow: var(--g-shadow); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--g-btn-primary); color: #fff; font-size: 16px; font-weight: 600; }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .35; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* 动效敏感用户降级——保留状态切换，压平装饰动效（动效层指令，不受 §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* 键盘焦点可见 */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}

  .room { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .obj {
    min-height: 72px; border: 1px solid var(--g-border); border-radius: var(--g-radius-inner);
    background: var(--g-st-card); color: var(--g-text);
    font-family: inherit; cursor: pointer; padding: 8px 4px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .obj .ic { font-size: 22px; font-weight: 700; color: var(--g-primary-deep); line-height: 1.2; }
  .obj .nm { font-size: 12px; color: var(--g-muted); }
  .obj.locked { opacity: .55; }
  .obj.done { background: var(--g-primary-soft); border-color: var(--g-primary-soft); }
  .obj.done .ic { color: var(--g-success); }
  .obj:active { opacity: .8; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 2px 6px; min-height: 22px; }
  .chip { font-size: 12px; background: var(--g-surface2); border-radius: 10px; padding: 2px 10px; color: var(--g-muted); }
  .chip.inv { color: var(--g-on-soft); background: var(--g-primary-soft); }
  .padgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .pbtn { min-height: 44px; border: 1px solid var(--g-border); border-radius: var(--g-radius-btn); background: var(--g-surface); color: var(--g-text); font-family: inherit; font-size: 22px; font-weight: 600; cursor: pointer; }
  .pbtn:active { background: var(--g-primary-soft); }
  #padShow { font-size: 28px; font-weight: 700; color: var(--g-primary-deep); letter-spacing: 8px; }

</style>

//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

var GAME_KEY="escape-room",SAVE_KEY="sw.escaperoom.v1";
var DEFAULT_LEVELS=DEFAULT_LEVELS_SRC;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  levelOk=new Array(LEVELS.length);
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
var levelOk=new Array(LEVELS.length);
function verifyPending(){   // 后台逐关复核（分片避免卡顿）：坏关禁选、当前关即时告警
  var i=0;
  function step(){
    var t0=Date.now();
    while(i<LEVELS.length&&Date.now()-t0<40){
      if(levelOk[i]===undefined)levelOk[i]=verifyLevel(LEVELS[i]);
      i++;
    }
    if(i<LEVELS.length)setTimeout(step,0);
    else if(typeof renderLevels==="function")renderLevels();
  }
  setTimeout(step,0);
}

function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;

      var remote=JSON.parse(res.stateJson);

      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}

  }).catch(function(){});

function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡

    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();

      if(typeof resize==="function")resize();
    }
  }).catch(function(){});
}

/* ---------- 结构校验 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Array.isArray(d.objs)||d.objs.length<3||d.objs.length>9)return false;
  var ids={},doorN=0;
  for(var i=0;i<d.objs.length;i++){
    var o=d.objs[i];
    if(!o||typeof o!=="object")return false;
    if(typeof o.id!=="string"||ids[o.id])return false;
    ids[o.id]=1;
    if(["clue","take","lock","safe","door","lever","deco"].indexOf(o.kind)<0)return false;
    if(o.kind==="door")doorN++;
    if(!Array.isArray(o.reqItems)||!Array.isArray(o.reqObjs)||!Array.isArray(o.gives))return false;
  }
  return doorN===1;
}
/* ---------- 独立验证器：方程唯一解 + 机关链 BFS（与交互状态机分离） ---------- */
function erSolveSyms(eqs){
  var cnt=0,vs=null;
  for(var a=0;a<10;a++)for(var b=0;b<10;b++)for(var c=0;c<10;c++){
    var v=[a,b,c],ok=true;
    for(var q=0;q<eqs.length;q++){
      var e=eqs[q];
      if(e[2]*v[e[0]]+e[3]*v[e[1]]!==e[4]){ok=false;break}
    }
    if(ok){cnt++;if(cnt>1)break;vs=[a,b,c]}
  }
  return {count:cnt,vals:vs};
}
function erReachable(objs){
  var items=[],idx={},i,g;
  for(i=0;i<objs.length;i++)for(g=0;g<objs[i].gives.length;g++){
    var it=objs[i].gives[g];
    if(idx[it]===undefined){idx[it]=items.length;items.push(it)}
  }
  var doorBit=-1;
  for(i=0;i<objs.length;i++)if(objs[i].kind==="door")doorBit=i;
  var needBits=[];
  for(i=0;i<objs.length;i++){
    var m=0;
    for(g=0;g<objs[i].reqObjs.length;g++){
      for(var w=0;w<objs.length;w++)if(objs[w].id===objs[i].reqObjs[g])m|=1<<w;
    }
    needBits.push(m);
  }
  function givesMask(o){var m=0;for(var z=0;z<o.gives.length;z++)m|=1<<idx[o.gives[z]];return m}
  var seen={},queue=[[0,0]],covered=0;
  seen["0,0"]=1;
  var safeCodeOk=true;
  var eqs=[];
  for(i=0;i<objs.length;i++)if(objs[i].kind==="clue")eqs=eqs.concat(objs[i].eqs||[]);
  var sol=erSolveSyms(eqs);
  for(i=0;i<objs.length;i++)if(objs[i].kind==="safe"){
    if(sol.count!==1||!sol.vals||""+sol.vals[0]+sol.vals[1]+sol.vals[2]!==objs[i].code)safeCodeOk=false;
  }
  while(queue.length){
    var cur=queue.shift(),sm=cur[0],im=cur[1];
    covered|=sm;
    for(i=0;i<objs.length;i++){
      if(sm&(1<<i))continue;
      var o=objs[i];
      if(((sm&needBits[i])!==needBits[i]))continue;
      var ok=true;
      for(g=0;g<o.reqItems.length;g++)if(!(im&(1<<idx[o.reqItems[g]]))){ok=false;break}
      if(!ok)continue;
      var nsm=sm|(1<<i),nim=im|givesMask(o),key=nsm+","+nim;
      if(!seen[key]){seen[key]=1;queue.push([nsm,nim])}
    }
  }
  if(!(covered&(1<<doorBit)))return false;
  for(i=0;i<objs.length;i++){
    if(objs[i].kind==="deco"||objs[i].kind==="clue")continue;
    if(!(covered&(1<<i)))return false;
  }
  return safeCodeOk;
}
function verifyLevel(L){
  if(!validLevelData(L))return false;
  return erReachable(L.objs);
}

  if(!clues.length)cr.innerHTML='<span class="chip">尚未发现线索</span>';
  for(var j=0;j<clues.length;j++){
    var sp2=document.createElement("span");
    sp2.className="chip";
    sp2.textContent=clues[j];
    cr.appendChild(sp2);
  }
}
/* ---------- 交互 ---------- */
function act(i){
  if(done)return;
  var o=L.objs[i];
  if(o.kind==="deco"){say(o.flavor||"没什么特别的");return}
  if(o.kind==="clue"){
    if(clues.indexOf(o.text)<0){clues.push(o.text);say("发现线索："+o.text);renderChips();renderRoom()}
    else say("线索已记下：见下方线索条");
    return;
  }
  if(solved[i]){say(o.name+"已经打开了");return}
  if(!canAct(i)){say("「"+o.name+"」动不了——"+missText(i));return}
  if(o.kind==="take"||o.kind==="lock"||o.kind==="lever"){
    solved[i]=true;
    for(var g=0;g<o.gives.length;g++)inv[o.gives[g]]=true;
    say("「"+o.name+"」打开了"+(o.gives.length?"，获得 "+o.gives.map(function(x){return ITEM_NAME[x]||x}).join("、"):""));
    renderRoom();renderChips();return;
  }
  if(o.kind==="safe"){padFor=i;padBuf="";updPad();$("padov").classList.add("show");return}
  if(o.kind==="door"){
    solved[i]=true;renderRoom();winLevel();
  }
}
function updPad(){
  var s=padBuf;
  while(s.length<3)s+="—";
  $("padShow").textContent=s.split("").join(" ");
}
function buildPad(){
  var g=$("padgrid");g.innerHTML="";
  var keys=["1","2","3","4","5","6","7","8","9","清","0","确"];
  for(var i=0;i<keys.length;i++){
    (function(k){
      var b=document.createElement("button");
      b.className="pbtn";
      b.textContent=k;
      b.addEventListener("click",function(){
        if(k==="清")padBuf="";
        else if(k==="确")submitPad();
        else if(padBuf.length<3)padBuf+=k;
        updPad();
      });
      g.appendChild(b);
    })(keys[i]);
  }
}
function submitPad(){
  if(padFor<0)return;
  var o=L.objs[padFor];
  if(padBuf===o.code){
    solved[padFor]=true;
    for(var g=0;g<o.gives.length;g++)inv[o.gives[g]]=true;
    $("padov").classList.remove("show");
    say("密码正确！获得 "+o.gives.map(function(x){return ITEM_NAME[x]||x}).join("、"));
    renderRoom();renderChips();padFor=-1;
  }else{
    padBuf="";updPad();
    say("密码不对，再想想线索");
  }
}
function winLevel(){
  done=true;
  save.done[lv]=true;
  if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
  persist();
  var unlocked=0;
  for(var i=0;i<L.objs.length;i++)if(solved[i])unlocked++;
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:unlocked}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"逃出密室！";
  $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成 · 解开 "+unlocked+"/"+L.objs.length+" 个物件"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
/* ---------- 输入 ---------- */
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
$("padClose").addEventListener("click",function(){$("padov").classList.remove("show");padFor=-1});
window.addEventListener("keydown",function(e){
  if($("padov").classList.contains("show")){
    if(e.key>="0"&&e.key<="9"&&padBuf.length<3){padBuf+=e.key;updPad()}
    else if(e.key==="Enter")submitPad();
    else if(e.key==="Escape"){$("padov").classList.remove("show");padFor=-1}
    else if(e.key==="Backspace")padBuf=padBuf.slice(0,-1),updPad();
    e.preventDefault();
    return;
  }
  if(e.key>="1"&&e.key<="9"){
    var i=parseInt(e.key,10)-1;
    if(L&&i<L.objs.length)act(i);
    e.preventDefault();
  }else if(e.key==="Escape"&&$("overlay").classList.contains("show"))hideOverlay();
});
function renderLevels(){}
/* ---------- 启动 ---------- */
buildPad();
loadLevel(save.lv);
verifyPending();syncLevelsFromServer();syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
