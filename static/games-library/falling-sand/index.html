<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>元素落沙</title>
<style>
  /*token:GAME-THEME.md §2 + §3 素材 token(--g-fs-* 元素/地面/边界/闪光)*/
  :root{--g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-on-primary:#FFF;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-warning:#9A6210;--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;
    --g-fs-empty:#F6F3EB;--g-fs-sand:#E3B54E;--g-fs-wetsand:#B98B3E;--g-fs-water:#3D9FDB;--g-fs-stone:#7C7468;--g-fs-fire:#FF6A2B;--g-fs-smoke:#6E7B8A;--g-fs-plant:#3DBB62;--g-fs-oil:#7A5A34;--g-fs-steam:#C9DDE8;--g-fs-lava:#E84A24;--g-fs-glass:#9FD8DE;
    --g-fs-floor:#5E6A62;--g-fs-floor-hi:#82918A;--g-fs-wall:#C2CBBF;--g-fs-flash:#FFF3CE;color-scheme:light}
  [data-theme="dark"]{--g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-warning:#E2A44E;--g-shadow:0 2px 12px rgba(0,0,0,.28);
    --g-fs-empty:#171A17;--g-fs-sand:#E8C464;--g-fs-wetsand:#C79A52;--g-fs-water:#5CB4E8;--g-fs-stone:#A89E8E;--g-fs-fire:#FF8A50;--g-fs-smoke:#93A0AC;--g-fs-plant:#4ADE6E;--g-fs-oil:#9A7448;--g-fs-steam:#A7C2CE;--g-fs-lava:#F26838;--g-fs-glass:#8CC6CF;
    --g-fs-floor:#242A26;--g-fs-floor-hi:#3E4842;--g-fs-wall:#0E100E;--g-fs-flash:#F2D9A0;color-scheme:dark}
  [hidden]{display:none!important}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--g-bg);color:var(--g-text);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:manipulation;
  }
  .app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:10px 12px calc(8px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:flex-end;gap:10px;animation:rise .26s ease-out backwards}
  .hud{display:flex;gap:10px;font-size:12px;color:var(--g-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .toolbar{display:flex;align-items:center;gap:8px;margin:16px 0 8px;animation:rise .26s ease-out .03s backwards}
  .sp{flex:1}
  .btn{min-height:44px;padding:0 14px;border:0;border-radius:var(--g-radius-btn);background:var(--g-btn-primary);color:var(--g-on-primary);font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .14s ease-out,opacity .16s ease-out,background-color .16s ease-out}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:var(--g-surface);color:var(--g-text);border:1px solid var(--g-border)}
  .seg{display:flex;border:1px solid var(--g-border);border-radius:var(--g-radius-btn);overflow:hidden;background:var(--g-surface)}
  .seg button{min-width:44px;min-height:44px;padding:0 10px;border:0;background:transparent;color:var(--g-text);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:background-color .16s ease-out,color .16s ease-out,transform .14s ease-out}
  .seg button+button{border-left:1px solid var(--g-border)}
  .seg button.on{background:var(--g-primary-soft);color:var(--g-on-soft);box-shadow:inset 0 0 0 1px var(--g-primary)}
  .seg button:active{transform:scale(.96)}
  /* 极矮视口:stage 随视口收缩,把控制区/元素栏/提示行让出来 */
  .stage{position:relative;flex:1 1 240px;min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--g-border);border-radius:var(--g-radius);background:var(--g-surface2);overflow:hidden;animation:rise .26s ease-out .06s backwards}
  canvas{display:block;touch-action:none;border-radius:10px;box-shadow:inset 0 0 0 1px var(--g-fs-wall),inset 0 2px 10px rgba(20,40,30,.12)}
  .badge{position:absolute;top:10px;right:10px;padding:5px 10px;border:1px solid var(--g-border);border-radius:10px;background:var(--g-surface);color:var(--g-warning);font-size:12px;font-weight:700}
  .bar{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;min-height:46px;padding:6px 12px;border:1px solid var(--g-border);border-radius:var(--g-radius-btn);background:var(--g-surface);color:var(--g-text);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background-color .16s ease-out,color .16s ease-out,border-color .16s ease-out,box-shadow .16s ease-out,transform .14s ease-out;animation:rise .26s ease-out backwards}
  .chip.on{border-color:var(--g-primary);background:var(--g-primary-soft);color:var(--g-on-soft);box-shadow:inset 0 0 0 1px var(--g-primary)}
  .chip:active{transform:scale(.96)}
  .swi{display:inline-block;vertical-align:-.14em;flex:none}
  .foot{margin:6px 0 0;font-size:12px;color:var(--g-muted);text-align:center;min-height:34px;display:flex;flex-direction:column;gap:2px;animation:rise .24s ease-out .34s backwards}
  .foot .goal{display:inline-flex;align-items:center;justify-content:center;gap:5px}
  .foot b{color:var(--g-primary-deep);font-variant-numeric:tabular-nums}
  #toast.pop{animation:fspop .35s ease-out}
  #reactCount.bump{animation:valPop .18s ease-out}
  @keyframes fspop{from{transform:scale(1.3)}to{transform:scale(1)}}
  @keyframes valPop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* S2: reduced-motion 降级(动效层,不受 §4 主题层 matchMedia 禁令约束) */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见 */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
try{SmartWashGameBridge&&SmartWashGameBridge.setChrome('immersive')}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>
<script>
/* 内联图标库：照抄本库 window.SW_ICON 结构（24 viewBox / currentColor / 零外链） */
window.SW_ICON=function(n,s){s=s||"";var P={
 'play':'<path d="M8 5v14l11-7z"/>',
 'pause':'<rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/>',
 'trash':'<path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13M10 11v5M14 11v5"/>',
 'target':'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',
 'dot-s':'<circle cx="12" cy="12" r="3.2"/>','dot-m':'<circle cx="12" cy="12" r="5.2"/>','dot-l':'<circle cx="12" cy="12" r="7"/>',
 'sand':'<path d="M4 18h16M7 18l5-9 5 9"/><circle cx="9" cy="6.5" r=".9"/><circle cx="14.5" cy="4.5" r=".9"/>',
 'water':'<path d="M12 3.2s6 6.6 6 10.9a6 6 0 0 1-12 0c0-4.3 6-10.9 6-10.9z"/>',
 'stone':'<rect x="5.5" y="6" width="13" height="12" rx="3"/><path d="M9 10h6M9 14h6"/>',
 'fire':'<path d="M12 2.8c.9 3.6-3.6 5.2-3.6 9.4a5.6 5.6 0 0 0 11.2 0c0-4.2-4.5-5.8-7.6-9.4z"/>',
 'plant':'<path d="M20 4C11 4 4.5 10 4.5 19.5 13.5 18.5 19.5 12.5 20 4z"/><path d="M8 16c2.6-4 5.6-6.6 9-8.6"/>',
 'oil':'<rect x="6" y="4" width="12" height="16" rx="1.5"/><path d="M6 9h12M6 15h12"/>',
 'lava':'<path d="M12 2.8c.9 3.6-3.6 5.2-3.6 9.4a5.6 5.6 0 0 0 11.2 0c0-4.2-4.5-5.8-7.6-9.4z"/><path d="M9.5 18v2.5M14.5 18v2.5"/>',
 'smoke':'<path d="M7 18.5a4 4 0 0 1-.6-7.9A5.2 5.2 0 0 1 17 8.6a3.8 3.8 0 0 1 .4 7.4z"/>',
 'erase':'<path d="M5.5 14.5l7.5-7.5 6 6-4.5 4.5H9.5z"/><path d="M4 20h16"/>'
};
var fill={'play':1,'pause':1,'dot-s':1,'dot-m':1,'dot-l':1};
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};
</script>
</head>
<body>
<div class="app">
  <header>
    <div class="hud"><span id="fps" hidden>— FPS</span><span id="cnt">0 粒</span></div>
  </header>
  <div class="toolbar">
    <div class="seg" id="brushSeg">
      <button type="button" data-b="2">细</button>
      <button type="button" data-b="4" class="on">中</button>
      <button type="button" data-b="7">粗</button>
    </div>
    <span class="sp"></span>
    <button class="btn ghost" id="clearBtn" type="button">清屏</button>
    <button class="btn" id="pauseBtn" type="button"><span>暂停</span></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="元素落沙实验区" role="img"></canvas>
    <span class="badge" id="badge" hidden>已暂停</span>
  </div>
  <div class="bar" id="elemBar"></div>
  <p class="foot">
    <span class="goal"><span class="swi" id="goalIc"></span>目标 · 已发现 <b id="reactCount">0/9</b> 种反应</span>
    <span id="toast" role="status" aria-live="polite">拖拽画布倾倒元素，试着发现全部反应</span>
  </p>
</div>
<script>
"use strict";
(() => {
  // ===== 元胞自动机核心:typed array 网格 240x400 =====
  const GW = 240, GH = 400, NCELLS = GW * GH;
  const STEP = 1 / 60;
  const PREFS_KEY = "sw_h5_fallsand_prefs";
  const FLOOR_H = 12;                      // 地面带行数(仅渲染层:空格在此带内画成地面材质)
  // 元素 id:0空 1沙 2水 3石 4火 5烟 6植物 7油 8蒸汽 9岩浆 10玻璃 11湿沙
  const E = { EMPTY:0, SAND:1, WATER:2, STONE:3, FIRE:4, SMOKE:5, PLANT:6, OIL:7, STEAM:8, LAVA:9, GLASS:10, WETSAND:11 };
  const CAT  = [0,1,2,0,3,3,0,2,3,2,0,1];   // 0静态 1粉 2液 3气
  const DENS = [0,5,3,0,0,0,0,2,0,6,0,5];   // 粉/液密度,大者沉(沙沉入水/油,水沉入油,岩浆最重)
  const FLOW = [0,0,5,0,0,0,0,3,0,2,0,0];   // 液体横向铺展格数

  const REACT_NAMES = {
    steam:  "水火相克 · 蒸汽",
    quench: "水淬岩浆 · 岩石",
    wet:    "沙水相融 · 湿沙",
    grow:   "植物吸水 · 生长",
    ignite: "油液遇火 · 点燃",
    burn:   "植物燃烧",
    glass:  "高温熔砂 · 玻璃",
    crust:  "岩浆表面 · 结壳",
    rain:   "蒸汽冷凝 · 成雨"
  };
  const REACT_KEYS = Object.keys(REACT_NAMES);

  const grid  = new Uint8Array(NCELLS);
  const life  = new Uint8Array(NCELLS);   // 气体寿命
  const moved = new Uint8Array(NCELLS);   // 本步已移动标记,防双移
  const prev  = new Uint8Array(NCELLS);   // 上一帧快照:仅用于渲染层识别「命中/合成」cell
  const heat  = new Float32Array(NCELLS); // 反应闪光强度 0..1,逐帧衰减
  let frame = 0;

  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const stage = $("stage"), fpsEl = $("fps"), cntEl = $("cnt"), badge = $("badge");
  const clearBtn = $("clearBtn"), pauseBtn = $("pauseBtn"), elemBar = $("elemBar");
  const brushSeg = $("brushSeg"), reactCountEl = $("reactCount"), toastEl = $("toast");

  // 离屏 1:1 网格画布,主画布最近邻放大
  const off = document.createElement("canvas");
  off.width = GW; off.height = GH;
  const octx = off.getContext("2d");
  const img = octx.createImageData(GW, GH);

  // ===== 主题调色板:颜色全部读 CSS 变量(JS 零颜色字面量) =====
  const PAL = {};
  const colTab = [];
  const FS_DEFS = [
    [E.EMPTY,"empty"],[E.SAND,"sand"],[E.WETSAND,"wetsand"],[E.WATER,"water"],[E.STONE,"stone"],
    [E.FIRE,"fire"],[E.SMOKE,"smoke"],[E.PLANT,"plant"],[E.OIL,"oil"],[E.STEAM,"steam"],
    [E.LAVA,"lava"],[E.GLASS,"glass"]
  ];
  const EXTRA_DEFS = [["floor","floor"],["floorHi","floor-hi"],["wall","wall"],["flash","flash"]];
  // 恒黑:仅用于派生地面接触阴影(D2 例外),不做具体材质色
  const BLACK = [0,0,0];
  function hx(v){ return /^#[0-9a-fA-F]{6}$/.test(v) ? [parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)] : null; }
  function mixRGB(a,b,t){ return [Math.round(a[0]+(b[0]-a[0])*t), Math.round(a[1]+(b[1]-a[1])*t), Math.round(a[2]+(b[2]-a[2])*t)]; }
  function palLoad(){
    const s = getComputedStyle(document.documentElement);
    for(const def of FS_DEFS){
      const c = hx(s.getPropertyValue("--g-fs-" + def[1]).trim());
      if(c) colTab[def[0]] = c;
      else if(!colTab[def[0]]) colTab[def[0]] = [128,128,128];
    }
    for(const def of EXTRA_DEFS){
      const c = hx(s.getPropertyValue("--g-fs-" + def[1]).trim());
      if(c) PAL[def[0]] = c;
    }
    const mc = hx(s.getPropertyValue("--g-muted").trim());   // 橡皮光标环用中性色
    if(mc) PAL.muted = mc;
    if(PAL.floor) PAL.floorLo = mixRGB(PAL.floor, BLACK, .45);
  }
  window.__gOnTheme = function(){ palLoad(); render(); };
  palLoad();

  // ===== 可放置元素 =====
  const PLACE = [
    {id:E.SAND,  key:"sand",  name:"沙"},
    {id:E.WATER, key:"water", name:"水"},
    {id:E.STONE, key:"stone", name:"石"},
    {id:E.FIRE,  key:"fire",  name:"火"},
    {id:E.PLANT, key:"plant", name:"植物"},
    {id:E.OIL,   key:"oil",   name:"油"},
    {id:E.LAVA,  key:"lava",  name:"岩浆"},
    {id:E.SMOKE, key:"smoke", name:"烟"},
    {id:0,       key:"erase", name:"橡皮"}
  ];
  const PROB = [1, 0.8, 0.75, 0.95, 0.6, 0.5, 0.75, 0.75, 0, 0, 0, 0, 1];

  let curElem = E.SAND, brush = 4;
  let running = true, resumeOnVisible = false;
  let discovered = new Set();
  let dpr = 1;
  let cursorCell = null, cursorHot = false;

  // ===== 存档(localStorage,try/catch) =====
  /* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
  var GB=(function(){
    var pending={},seq=0;
    window.__gOnGameBridgeResult=function(cbId,ok,payload){
      var cb=pending[cbId];if(!cb)return;
      delete pending[cbId];
      try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
    };
    function call(method,args){
      return new Promise(function(resolve,reject){
        var bridge=window.SmartWashGameBridge;
        if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
        var cbId="gb"+Date.now()+"_"+(++seq);
        pending[cbId]={resolve:resolve,reject:reject};
        try{bridge[method].apply(bridge,args.concat([cbId]));}
        catch(e){delete pending[cbId];reject(e);}
      });
    }
    return {
      available:!!window.SmartWashGameBridge,
      loadState:function(gameKey){return call("loadState",[gameKey]);},
      saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
      reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
      getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
      getLevels:function(gameKey){return call("getLevels",[gameKey]);}
    };
  })();
  function loadPrefs(){
    try{
      const v = JSON.parse(localStorage.getItem(PREFS_KEY) || "null");
      if(v && typeof v === "object"){
        if(PLACE.some(p => p.id === v.e)) curElem = v.e;
        if(v.b === 2 || v.b === 4 || v.b === 7) brush = v.b;
        if(Array.isArray(v.d)) v.d.forEach(k => { if(REACT_NAMES[k]) discovered.add(k); });
      }
    }catch(e){}
  }
  function savePrefs(){
    try{ localStorage.setItem(PREFS_KEY, JSON.stringify({e:curElem, b:brush, d:[...discovered]})); }catch(e){}
    if(GB.available)GB.saveState("falling-sand",{e:curElem,b:brush,d:[...discovered]}).catch(function(){});
  }
  function syncSaveFromServer(){
    if(!GB.available||!GB.loadState)return;
    GB.loadState("falling-sand").then(function(res){
      if(!res||!res.stateJson)return;
      try{
        var r=JSON.parse(res.stateJson),changed=false;
        // 账号发现进度取并集（元素/笔刷偏好保留本地）
        if(Array.isArray(r.d)){
          for(var i=0;i<r.d.length;i++){
            var k=r.d[i];
            if(REACT_NAMES[k]&&!discovered.has(k)){discovered.add(k);changed=true;}
          }
        }
        if(changed){savePrefs();reactCountEl.textContent=discovered.size+"/"+REACT_KEYS.length;}
      }catch(e){}
    }).catch(function(){});
  }

  // ===== 气体生成(带寿命) =====
  function ignite(i){ grid[i] = E.FIRE;  life[i] = 30 + (Math.random()*40|0); }
  function smokeAt(i){ grid[i] = E.SMOKE; life[i] = 90 + (Math.random()*80|0); }
  function steamAt(i){ grid[i] = E.STEAM; life[i] = 240 + (Math.random()*240|0); }

  // ===== 反应发现提示 =====
  function note(k){
    if(discovered.has(k)) return;
    discovered.add(k);
    reactCountEl.textContent = discovered.size + "/" + REACT_KEYS.length;
    reactCountEl.classList.remove("bump"); void reactCountEl.offsetWidth; reactCountEl.classList.add("bump");
    toastEl.textContent = "新反应：" + REACT_NAMES[k];
    toastEl.classList.remove("pop"); void toastEl.offsetWidth; toastEl.classList.add("pop");
    savePrefs();
  }

  function trySwap(i, j){
    const g = grid[i]; grid[i] = grid[j]; grid[j] = g;
    const l = life[i]; life[i] = life[j]; life[j] = l;
    moved[i] = 1; moved[j] = 1;
  }

  // ===== 反应表(双元素接触) =====
  const RX = [1,-1,0,0], RY = [0,0,1,-1];
  function reactWater(i, x, y){
    for(let k = 0; k < 4; k++){
      if(grid[i] !== E.WATER) return;
      const nx = x + RX[k], ny = y + RY[k];
      if(nx < 0 || nx >= GW || ny < 0 || ny >= GH) continue;
      const j = i + RY[k]*GW + RX[k], n = grid[j], r = Math.random();
      if(n === E.FIRE){ if(r < 0.9){ steamAt(j); note("steam"); } }
      else if(n === E.LAVA){ if(r < 0.7){ grid[j] = E.STONE; moved[j] = 1; steamAt(i); note("quench"); } }
      else if(n === E.SAND){ if(r < 0.3){ grid[j] = E.WETSAND; moved[j] = 1; note("wet"); } else if(r > 0.9){ grid[i] = E.EMPTY; } }
      else if(n === E.PLANT){ if(r < 0.008){ grid[i] = E.PLANT; moved[i] = 1; note("grow"); } }
    }
  }
  function reactFire(i, x, y){
    for(let k = 0; k < 4; k++){
      if(grid[i] !== E.FIRE) return;
      const nx = x + RX[k], ny = y + RY[k];
      if(nx < 0 || nx >= GW || ny < 0 || ny >= GH) continue;
      const j = i + RY[k]*GW + RX[k], n = grid[j], r = Math.random();
      if(n === E.WATER){ if(r < 0.9){ steamAt(i); note("steam"); } }
      else if(n === E.PLANT){ if(r < 0.3){ ignite(j); note("burn"); } }
      else if(n === E.OIL){ if(r < 0.45){ ignite(j); note("ignite"); } }
    }
  }
  function reactLava(i, x, y){
    for(let k = 0; k < 4; k++){
      if(grid[i] !== E.LAVA) return;
      const nx = x + RX[k], ny = y + RY[k];
      if(nx < 0 || nx >= GW || ny < 0 || ny >= GH) continue;
      const j = i + RY[k]*GW + RX[k], n = grid[j], r = Math.random();
      if(n === E.SAND || n === E.WETSAND){ if(r < 0.06){ grid[j] = E.GLASS; moved[j] = 1; note("glass"); } }
      else if(n === E.WATER){ if(r < 0.7){ grid[i] = E.STONE; moved[i] = 1; steamAt(j); note("quench"); } }
      else if(n === E.OIL){ if(r < 0.4){ ignite(j); note("ignite"); } }
      else if(n === E.PLANT){ if(r < 0.5){ ignite(j); note("burn"); } }
    }
  }

  // ===== 运动规则(粉/液/气三类) =====
  function movePowder(i, x, y, v){
    if(y >= GH - 1) return;
    const dn = i + GW, b = grid[dn];
    if((b === E.EMPTY || CAT[b] === 3 || (CAT[b] === 2 && DENS[v] > DENS[b])) && !moved[dn]){ trySwap(i, dn); return; }
    if(v === E.WETSAND && Math.random() < 0.55) return;   // 湿沙黏滞:斜向概率减半
    const d = Math.random() < 0.5 ? 1 : -1;
    for(let k = 0; k < 2; k++){
      const dx = d * (k ? -1 : 1), nx = x + dx;
      if(nx < 0 || nx >= GW) continue;
      const j = dn + dx, c = grid[j];
      if((c === E.EMPTY || CAT[c] === 3 || (CAT[c] === 2 && DENS[v] > DENS[c])) && !moved[j]){ trySwap(i, j); return; }
    }
  }
  function moveLiquid(i, x, y, v){
    if(v === E.LAVA){
      if(y > 0 && grid[i - GW] === E.EMPTY && Math.random() < 0.0012){ grid[i] = E.STONE; moved[i] = 1; note("crust"); return; }
      if(frame & 1) return;                               // 岩浆迟滞:隔步流动
    }
    if(y < GH - 1){
      const dn = i + GW, b = grid[dn];
      if((b === E.EMPTY || CAT[b] === 3 || (CAT[b] === 2 && DENS[v] > DENS[b])) && !moved[dn]){ trySwap(i, dn); return; }
      const d = Math.random() < 0.5 ? 1 : -1;
      for(let k = 0; k < 2; k++){
        const dx = d * (k ? -1 : 1), nx = x + dx;
        if(nx < 0 || nx >= GW) continue;
        const j = dn + dx, c = grid[j];
        if(c === E.EMPTY && !moved[j]){ trySwap(i, j); return; }
      }
    }
    const flow = FLOW[v], d = Math.random() < 0.5 ? 1 : -1;
    let dest = -1;
    for(let k = 1; k <= flow; k++){
      const nx = x + d * k;
      if(nx < 0 || nx >= GW) break;
      const j = i + d * k;
      if(grid[j] === E.EMPTY && !moved[j]) dest = j; else break;
    }
    if(dest >= 0) trySwap(i, dest);
  }
  function moveGas(i, x, y, v){
    const L = life[i] - 1;
    if(L <= 0){
      if(v === E.FIRE){ if(Math.random() < 0.35) smokeAt(i); else grid[i] = E.EMPTY; }
      else if(v === E.STEAM){ grid[i] = E.WATER; note("rain"); }
      else grid[i] = E.EMPTY;
      moved[i] = 1; return;
    }
    life[i] = L;
    if(y === 0){
      if(v === E.STEAM && Math.random() < 0.03){ grid[i] = E.WATER; moved[i] = 1; note("rain"); }
      else if(Math.random() < 0.06){ grid[i] = E.EMPTY; moved[i] = 1; }
      return;
    }
    const up = i - GW, b = grid[up];
    if((b === E.EMPTY || (CAT[b] === 2 && v !== E.FIRE)) && Math.random() < (v === E.STEAM ? 0.95 : v === E.FIRE ? 0.8 : 0.7)){ trySwap(i, up); return; }
    const d = Math.random() < 0.5 ? 1 : -1, nx = x + d;
    if(nx >= 0 && nx < GW){
      const j = up + d, c = grid[j];
      if((c === E.EMPTY || (CAT[c] === 2 && v !== E.FIRE)) && Math.random() < 0.6){ trySwap(i, j); return; }
      if(grid[i + d] === E.EMPTY && Math.random() < 0.3){ trySwap(i, i + d); return; }
    }
  }

  // ===== 单步模拟:自底向上 + 逐行交替方向扫描 =====
  function step(){
    frame++;
    moved.fill(0);
    for(let y = GH - 1; y >= 0; y--){
      const ltr = (y + frame) & 1, row = y * GW;
      for(let q = 0; q < GW; q++){
        const x = ltr ? q : GW - 1 - q, i = row + x, v = grid[i];
        if(!v || moved[i]) continue;
        if(v === E.WATER){ reactWater(i, x, y); if(grid[i] !== E.WATER || moved[i]) continue; moveLiquid(i, x, y, v); }
        else if(v === E.FIRE){ reactFire(i, x, y); if(grid[i] !== E.FIRE || moved[i]) continue; moveGas(i, x, y, v); }
        else if(v === E.LAVA){ reactLava(i, x, y); if(grid[i] !== E.LAVA || moved[i]) continue; moveLiquid(i, x, y, v); }
        else if(v === E.SAND || v === E.WETSAND){ movePowder(i, x, y, v); }
        else if(v === E.OIL){ moveLiquid(i, x, y, v); }
        else if(v === E.SMOKE || v === E.STEAM){ moveGas(i, x, y, v); }
      }
    }
  }

  // ===== 渲染:ImageData 直写 + 最近邻放大;顺带统计粒子数 =====
  // 轻立体:每格按「左上受光 / 右下背光」混 hiTab/loTab,叠加地面接触阴影与反应闪光
  function render(){
    const d = img.data, t = frame & 1023;
    const floorTop = GH - FLOOR_H;
    const FC = PAL.flash, FLOOR = PAL.floor, FHI = PAL.floorHi, FLO = PAL.floorLo;
    const EMPTY = colTab[0];
    let count = 0;
    for(let y = 0; y < GH; y++){
      const row = y * GW, inFloor = y >= floorTop, depth = y / GH;
      for(let x = 0; x < GW; x++){
        const i = row + x, p = i * 4, v = grid[i];
        const pv = prev[i];
        if(pv !== v){                        // 命中/合成:非空格类型变化记一次闪光(纯渲染 diff,不改玩法)
          if(pv !== 0 && v !== 0) heat[i] = 1;
          prev[i] = v;
        }
        // 颗粒噪点:x/y 分别哈希(避免沿行周期横纹)
        const h = (x * 73856093) ^ (y * 19349663) ^ t;
        let n = ((h ^ (h >>> 6)) & 63) - 32;
        if(v !== E.FIRE && v !== E.LAVA && v !== E.STEAM && v !== E.SMOKE) n >>= 2;
        let r, g, b;
        if(v === 0){
          if(inFloor){                       // 地面带:基色+顶缘亮线+接触阴影
            const ab = y > 0 ? grid[i - GW] : 0;
            const f = (y === floorTop ? .55 : 0) - (ab !== 0 ? .5 : 0);
            const H = f > 0 ? FHI : FLO, k = f > 0 ? f : -f;
            r = FLOOR[0]; g = FLOOR[1]; b = FLOOR[2];
            r += (H[0]-r)*k; g += (H[1]-g)*k; b += (H[2]-b)*k;
            const mm = n >> 2; r += mm; g += mm; b += mm;
          }else{                             // 空腔:纸面底+噪点
            const m = n >> 3;
            r = EMPTY[0] + m; g = EMPTY[1] + m; b = EMPTY[2] + m;
          }
          d[p] = r; d[p+1] = g; d[p+2] = b; d[p+3] = 255;
          continue;
        }
        count++;
        const c = colTab[v], cat = CAT[v];
        const up = y > 0 ? grid[i - GW] : -1;
        const left = x > 0 ? grid[i - 1] : -1;
        const right = x < GW-1 ? grid[i + 1] : -1;
        // 统一「左上受光 / 右下背光」轻立体
        let f = (up !== v ? .5 : 0) + (left !== v ? .18 : 0) - (up === v && right === v ? .3 : 0);
        if(cat === 2) f -= .12 + .16 * depth;                       // 液体深度压暗
        else if(cat === 3) f += (v === E.FIRE || v === E.LAVA) ? .45 : .1;   // 火热 / 烟气柔光
        else f -= .06 + .10 * depth;                                // 粉/固体:轻微体积纵暗
        r = c[0]; g = c[1]; b = c[2];
        if(f > 0){ const k = f * .6; r += (255-r)*k; g += (255-g)*k; b += (255-b)*k; }       // 受光面 → 恒白
        else if(f < 0){ const k = -f * .45; r -= r*k; g -= g*k; b -= b*k; }                   // 背光面 → 恒黑
        r += n; g += n; b += n;
        const fl = heat[i];
        if(fl > .01){ r += (FC[0]-r)*fl; g += (FC[1]-g)*fl; b += (FC[2]-b)*fl; heat[i] = fl * .86; }
        else heat[i] = 0;
        d[p] = r; d[p+1] = g; d[p+2] = b; d[p+3] = 255;
      }
    }
    octx.putImageData(img, 0, 0);
    ctx.drawImage(off, 0, 0, cv.width, cv.height);
    drawCursor();
    return count;
  }
  // 落点光标:半径=笔刷尺寸,颜色=当前元素(按下加粗)
  function drawCursor(){
    if(!cursorCell) return;
    const c = curElem ? colTab[curElem] : PAL.muted;
    const col = "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
    const cw = cv.width / GW, ch = cv.height / GH;
    ctx.save();
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(2, cw * (cursorHot ? 1.8 : 1.2));
    ctx.shadowColor = col; ctx.shadowBlur = cursorHot ? 12 : 6;
    ctx.beginPath();
    ctx.arc((cursorCell.x + .5) * cw, (cursorCell.y + .5) * ch, (brush * 2 + 1) * cw / 2, 0, 6.2832);
    ctx.stroke();
    ctx.restore();
  }

  // ===== 画布尺寸(适配 stage,保持 3:5) =====
  function fit(){
    const r = stage.getBoundingClientRect();
    const aw = Math.max(120, r.width - 16), ah = Math.max(180, r.height - 16);
    let ch = ah, cw = ch * GW / GH;
    if(cw > aw){ cw = aw; ch = cw * GH / GW; }
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width = cw + "px"; cv.style.height = ch + "px";
    cv.width = Math.max(1, Math.round(cw * dpr));
    cv.height = Math.max(1, Math.round(ch * dpr));
    ctx.imageSmoothingEnabled = false;
  }

  // ===== 触控倾倒(多指 + 插值补点) + 落点光标 =====
  const pointers = new Map();
  function toCell(e){
    const r = cv.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(GW - 1, Math.floor((e.clientX - r.left) / r.width * GW))),
      y: Math.max(0, Math.min(GH - 1, Math.floor((e.clientY - r.top) / r.height * GH)))
    };
  }
  function stamp(cx, cy){
    const r = brush;
    for(let dy = -r; dy <= r; dy++){
      for(let dx = -r; dx <= r; dx++){
        if(dx*dx + dy*dy > r*r) continue;
        const px = cx + dx, py = cy + dy;
        if(px < 0 || px >= GW || py < 0 || py >= GH) continue;
        const i = py * GW + px;
        if(curElem === 0){ grid[i] = 0; life[i] = 0; continue; }
        if(Math.random() > PROB[curElem]) continue;
        grid[i] = curElem;
        if(curElem === E.FIRE) life[i] = 30 + (Math.random()*40|0);
        else if(curElem === E.SMOKE) life[i] = 90 + (Math.random()*80|0);
        else life[i] = 0;
      }
    }
  }
  function strokeLine(a, b){
    const n = Math.max(1, Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y)));
    for(let s = 1; s <= n; s++) stamp(Math.round(a.x + (b.x - a.x) * s / n), Math.round(a.y + (b.y - a.y) * s / n));
  }
  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    if(cv.setPointerCapture) try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    const c = toCell(e);
    cursorCell = c; cursorHot = true;
    pointers.set(e.pointerId, c);
    stamp(c.x, c.y);
  });
  cv.addEventListener("pointermove", e => {
    const c = toCell(e);
    cursorCell = c;
    if(!pointers.has(e.pointerId)) return;
    e.preventDefault();
    strokeLine(pointers.get(e.pointerId), c);
    pointers.set(e.pointerId, c);
  });
  const lift = e => { pointers.delete(e.pointerId); cursorHot = false; };
  cv.addEventListener("pointerup", lift);
  cv.addEventListener("pointercancel", lift);
  cv.addEventListener("pointerleave", () => { cursorCell = null; cursorHot = false; });

  // ===== 元素选择栏 / 笔刷 / 按钮 =====
  function buildChips(){
    elemBar.innerHTML = PLACE.map(p => {
      const on = p.id === curElem ? " on" : "";
      const col = p.id ? "var(--g-fs-" + p.key + ")" : "var(--g-muted)";
      return `<button type="button" class="chip${on}" data-id="${p.id}">` +
        window.SW_ICON(p.key, "color:" + col) + `<span>${p.name}</span></button>`;
    }).join("");
    elemBar.querySelectorAll(".chip").forEach((b, idx) => {
      b.style.animationDelay = (90 + idx * 30) + "ms";   // 入场错落 30ms,全程 ≤600ms
      b.addEventListener("click", () => {
        curElem = +b.dataset.id;
        elemBar.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", +x.dataset.id === curElem));
        savePrefs();
      });
    });
  }
  function syncBrush(){
    brushSeg.querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.b === brush));
  }
  brushSeg.querySelectorAll("button").forEach((b, idx) => {
    b.insertAdjacentHTML("afterbegin", window.SW_ICON(["dot-s","dot-m","dot-l"][idx] || "dot-m"));
    b.addEventListener("click", () => { brush = +b.dataset.b; syncBrush(); savePrefs(); });
  });
  function syncPause(){
    badge.hidden = running;
    pauseBtn.innerHTML = window.SW_ICON(running ? "pause" : "play") + "<span>" + (running ? "暂停" : "继续") + "</span>";
  }
  clearBtn.insertAdjacentHTML("afterbegin", window.SW_ICON("trash"));
  $("goalIc").innerHTML = window.SW_ICON("target");
  clearBtn.addEventListener("click", () => { grid.fill(0); life.fill(0); toastEl.textContent = "已清空画布"; });
  pauseBtn.addEventListener("click", () => { running = !running; resumeOnVisible = false; syncPause(); });

  // 切后台自动暂停,回前台恢复(除非用户手动暂停)
  document.addEventListener("visibilitychange", () => {
    if(document.hidden){
      if(running){ running = false; resumeOnVisible = true; syncPause(); }
    }else if(resumeOnVisible){
      resumeOnVisible = false; running = true; syncPause();
      last = performance.now(); acc = 0;
    }
  });
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);

  // ===== 主循环:dt 累积器驱动固定步长模拟 =====
  let last = performance.now(), acc = 0, frames = 0, hudT = 0;
  function loop(now){
    requestAnimationFrame(loop);
    let dt = (now - last) / 1000; last = now;
    if(!(dt > 0)) dt = 0.016;
    if(dt > 0.1) dt = 0.1;
    if(running){
      acc += dt;
      let n = 0;
      // A2 动效降级:系统「减少动效」时步频降为 1/3(__gRM 由主题运行时注入)
      const maxStep = window.__gRM ? 1 : 3;
      while(acc >= STEP && n < maxStep){ step(); acc -= STEP; n++; }
      if(acc > STEP) acc = 0;
    }
    const count = render();
    frames++;
    if(now - hudT > 500){
      fpsEl.textContent = Math.round(frames * 1000 / (now - hudT)) + " FPS";
      cntEl.textContent = count + " 粒";
      frames = 0; hudT = now;
    }
  }

  loadPrefs();
  buildChips();
  syncBrush();
  syncPause();
  reactCountEl.textContent = discovered.size + "/" + REACT_KEYS.length;
  fit();
  requestAnimationFrame(loop);
  syncSaveFromServer();

  // QA 钩子(自动化测试用,不影响玩法)
  window.__fs = { grid, life, step, render, stamp, GW, GH };
})();
</script>
</body>
</html>
