<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材（st- 前缀素材 token）*/
  :root {
    --g-bg:#F5F6F3; --g-surface:#FFFFFF; --g-surface2:#EFF1EE;
    --g-primary:#2D9B6A; --g-primary-deep:#17734A;--g-btn-primary:#17734A; --g-primary-soft:#E8F6EF; --g-on-primary:#FFFFFF; --g-on-soft:#0B3625;
    --g-text:#1C1C1E; --g-muted:#6B6E73; --g-faint:#A9AEA9; --g-border:#E6E9E6; --g-hairline:#EFF1EE;
    --g-danger:#A83850; --g-warning:#9A6210; --g-success:#17734A; --g-water:#4A9FD4;
    --g-scrim:rgba(245,246,243,.9);
    --g-shadow:0 2px 12px rgba(20,40,30,.05);
    --g-radius:16px; --g-radius-btn:14px; --g-radius-inner:12px; --g-gap:16px;
    --g-st-floor:#EFF1EE; --g-st-wall:#D9DFDB; --g-st-wall2:#E9EDEA; --g-st-door:#B9BFC4;
    color-scheme:light;
  }
  :root[data-theme=dark] {
    --g-bg:#141614; --g-surface:#1D201E; --g-surface2:#262A27;
    --g-primary-deep:#5BC894; --g-primary-soft:#1D3229; --g-on-soft:#B9E8CF;
    --g-text:#E6E9E6; --g-muted:#A9AEA9; --g-faint:#7E837D; --g-border:#2C312D; --g-hairline:#262A27;
    --g-danger:#DB7186; --g-warning:#E2A44E; --g-success:#4ADE6E; --g-water:#6BB4DE;
    --g-scrim:rgba(20,22,20,.9);
    --g-shadow:0 2px 12px rgba(0,0,0,.28);
    --g-st-floor:#1D201E; --g-st-wall:#343B36; --g-st-wall2:#282E2A; --g-st-door:#4A5049;
    color-scheme:dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;

  .wrap { width: 100%; max-width: 480px; }

  .icon-btn {
    width: 44px; height: 44px; flex: 0 0 44px;
    border: 1px solid var(--g-border); border-radius: 12px;

  .score-box .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

    display: block; width: 100%; aspect-ratio: 390 / 500; height: auto;

  }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: absolute; inset: 0; z-index: 5;

  }
  .overlay.show { display: flex; animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: translateY(0); } }
  .ov-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--g-primary-deep); max-width: 100%; }
  .ov-sub { margin: 0 0 6px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .btn-row { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .btn-row .btn { flex: 1; }
  .lv-wrap { width: 100%; max-width: 340px; max-height: 48vh; overflow-y: auto; }
  .lv-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .lv-chip {
    min-height: 44px; border: 1px solid var(--g-border); border-radius: 10px;
    background: var(--g-surface); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    touch-action: manipulation;
  }
  .lv-chip.sel { border-color: var(--g-primary); box-shadow: inset 0 0 0 1.5px var(--g-primary); background: var(--g-primary-soft); color: var(--g-on-soft); }
  .lv-chip.done { background: var(--g-btn-primary); border-color: var(--g-primary); color: var(--g-on-primary); }
  .lv-chip:disabled { opacity: .38; cursor: not-allowed; }
  .badge { display: none; margin: 0 0 4px; padding: 4px 12px; border-radius: 999px; background: var(--g-surface2); color: var(--g-warning); font-size: 12px; font-weight: 700; }
  .badge.show { display: inline-block; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>

var R=document.documentElement,B=null;

  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

  <p class="foot">火灵避水、冰灵避岩浆；踩压力板开门，双出口同到过关 · 操作：方向键 / WASD / 滑动 / 按钮，U 撤销</p>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var FI={GRID_CHARS:"#.wlpqDEFIfi"};
/* 解析并归一化关卡：网格字符集 #. w l p q D E F I f i；
   f/i 出生点，F/I 对应出口，w 灭火 l 灭冰，p→D q→E 机关门（踩板开门，离开即关） */
FI.parse=function(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return null;
  var cols=d.cols|0,rows=d.rows|0;
  if(cols<8||cols>16||rows<6||rows>14)return null;
  if(!Array.isArray(d.grid)||d.grid.length!==rows)return null;
  var g=[],counts={f:0,i:0,F:0,I:0};
  for(var r=0;r<rows;r++){
    var row=d.grid[r];
    if(typeof row!=="string"||row.length!==cols)return null;
    var out="";
    for(var c=0;c<cols;c++){
      var ch=row.charAt(c);
      if(FI.GRID_CHARS.indexOf(ch)<0)return null;
      if(counts.hasOwnProperty(ch))counts[ch]++;
      out+=ch;
    }
    g.push(out);
  }
  if(counts.f!==1||counts.i!==1||counts.F!==1||counts.I!==1)return null;
  var par=d.par|0;
  return {name:String(d.name||"").slice(0,32),cols:cols,rows:rows,grid:g,par:par<0?0:par};
};
/* 联合 BFS：状态=(火位,冰位)，每步同一方向各角色独立判定可走；
   门开=任一角色当前踩在对应压力板；致死格转换直接剪枝。返回 {ok,par} */
FI.solve=function(L){
  var cols=L.cols,rows=L.rows,g=L.grid;
  function at(c,r){return r<0||r>=rows||c<0||c>=cols?"#":g[r].charAt(c)}
  function find(ch){
    for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)if(at(c,r)===ch)return[c,r];
    return null;
  }
  var f0=find("f"),i0=find("i"),F=find("F"),I=find("I");
  if(!f0||!i0||!F||!I)return{ok:false,par:0};
  var DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
  function pressOpen(c,r){var ch=at(c,r);return ch==="p"||ch==="q"}
  function doorPass(ch,fp,ip){
    var plate=ch==="D"?"p":(ch==="E"?"q":null);
    if(!plate)return true;
    return at(fp[0],fp[1])===plate||at(ip[0],ip[1])===plate;
  }
  function canGo(ch,who,fp,ip){
    if(ch==="#")return false;
    if(who==="f"&&ch==="w")return false;
    if(who==="i"&&ch==="l")return false;
    return doorPass(ch,fp,ip);
  }
  var seen={},queue=[{f:f0,i:i0,d:0}],par=-1;
  seen[f0[1]*cols+f0[0]+"_"+(i0[1]*cols+i0[0])]=1;
  var head=0;
  while(head<queue.length){
    var s=queue[head++];
    if(s.f[0]===F[0]&&s.f[1]===F[1]&&s.i[0]===I[0]&&s.i[1]===I[1]){par=s.d;break;}
    for(var d=0;d<4;d++){
      var dx=DIRS[d][0],dy=DIRS[d][1];
      var fc=[s.f[0]+dx,s.f[1]+dy],ic=[s.i[0]+dx,s.i[1]+dy];
      var nf=canGo(at(fc[0],fc[1]),"f",s.f,s.i)?fc:s.f;
      var ni=canGo(at(ic[0],ic[1]),"i",s.f,s.i)?ic:s.i;
      // 致死剪枝（水面灭火 / 岩浆灭冰）
      if(nf!==s.f&&at(nf[0],nf[1])==="w")continue;
      if(ni!==s.i&&at(ni[0],ni[1])==="l")continue;
      var key=nf[1]*cols+nf[0]+"_"+(ni[1]*cols+ni[0]);
      if(seen[key])continue;
      seen[key]=1;
      queue.push({f:nf,i:ni,d:s.d+1});
    }
  }
  return {ok:par>=0,par:Math.max(0,par)};
};
/* 关卡生成：确定性（种子=f(no,attempt)），生成后即刻联合 BFS 验证，不达标重试 */
FI.LEVEL_COUNT=40;
FI.genLevel=function(no){
  var tier=no<=14?0:(no<=27?1:2);
  var cols=[11,13,13][tier],rows=[8,9,10][tier];
  for(var att=0;att<70;att++){
    var rng=mulberry32(9000+no*733+att*197);
    var g=[];
    for(var r=0;r<rows;r++){
      var row="";
      for(var c=0;c<cols;c++){
        row+=(r===0||r===rows-1||c===0||c===cols-1)?"#":(rng()<0.15+tier*0.05?"#":".");
      }
      g.push(row);
    }
    function setCh(c,r,ch){g[r]=g[r].substring(0,c)+ch+g[r].substring(c+1)}
    // 危险区（水/岩浆簇）
    var nHaz=1+tier;
    for(var hz=0;hz<nHaz*2;hz++){
      var ch=hz%2===0?"w":"l";
      var hc=[1+((rng()*(cols-2))|0),1+((rng()*(rows-2))|0)];
      var sz=2+((rng()*3)|0);
      for(var k=0;k<sz;k++){
        var cc=Math.min(cols-2,Math.max(1,hc[0]+((rng()*3)|0)-1));
        var cr=Math.min(rows-2,Math.max(1,hc[1]+((rng()*3)|0)-1));
        setCh(cc,cr,ch);
      }
    }
    // 机关门与压力板（中后段出现）
    if(tier>=1||att%3===0){
      var nDoor=1+((rng()*(tier>=2?2:1))|0);
      for(var dpr=0;dpr<nDoor;dpr++){
        var doorCh=dpr===0?"D":"E",plCh=dpr===0?"p":"q";
        var dc=[1+((rng()*(cols-2))|0),1+((rng()*(rows-2))|0)];
        var pc=[1+((rng()*(cols-2))|0),1+((rng()*(rows-2))|0)];
        if(g[dc[1]].charAt(dc[0])===".")setCh(dc[0],dc[1],doorCh);
        if(g[pc[1]].charAt(pc[0])===".")setCh(pc[0],pc[1],plCh);
      }
    }
    // 四角锚点（出生/出口）邻域清空后落子
    var anchors=[[1,1,"f","F"],[1,rows-2,"i","I"]];
    for(var a2=0;a2<anchors.length;a2++){
      var ar=anchors[a2][1];
      for(var cr2=Math.max(1,ar-1);cr2<=Math.min(rows-2,ar+1);cr2++)
        for(var cc2=Math.max(1,1-1+anchors[a2][0]);cc2<=Math.min(cols-2,anchors[a2][0]+1);cc2++)
          if(!(cc2===anchors[a2][0]&&cr2===ar))setCh(cc2,cr2,".");
      setCh(anchors[a2][0],ar,anchors[a2][2]);
      setCh(cols-2,ar,anchors[a2][3]);
    }
    var L=FI.parse({cols:cols,rows:rows,grid:g,name:"第"+no+"关"});
    if(!L)continue;
    var res=FI.solve(L);
    if(res.ok&&res.par>=5+((rng()*3)|0)){
      return {name:"第"+no+"关 · 冰火同行",cols:cols,rows:rows,grid:g,par:res.par};
    }
  }
  // 兜底关卡（空场，两角出生直达对面，必定可解）
  var fb=[];
  for(var fr=0;fr<8;fr++){
    var line="";
    for(var fc=0;fc<11;fc++){
      line+=fr===0||fr===7||fc===0||fc===10?"#":(fr===1&&fc===1?"f":(fr===1&&fc===9?"F":(fr===6&&fc===1?"i":(fr===6&&fc===9?"I":"."))));
    }
    fb.push(line);
  }
  return {name:"第"+no+"关 · 冰火同行",cols:11,rows:8,grid:fb,par:Math.max(8,10-no/4|0)};
};
FI.validateAll=function(){
  var fails=[],pars=[],i;
  for(i=1;i<=FI.LEVEL_COUNT;i++){
    var L=FI.genLevel(i);
    if(!L){fails.push(i);continue;}
    var r=FI.solve(L);
    if(!r.ok){fails.push(i);continue;}
    pars.push(r.par);
  }
  var mn=pars.length?Math.min.apply(null,pars):0;
  var mx=pars.length?Math.max.apply(null,pars):0;
  var sum=0;for(var k=0;k<pars.length;k++)sum+=pars[k];
  return {total:FI.LEVEL_COUNT,solvable:pars.length,fail:fails,minPar:mn,maxPar:mx,avgPar:pars.length?Math.round(sum/pars.length*10)/10:0};
};
globalThis.__XC=FI;
/*XC-CORE-END*/

/* ========== 画布与调色板 ========== */
var NW=390,NH=500,W=390,H=500,S=1,offX=0,offY=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),border:v("--g-border"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),danger:v("--g-danger"),warning:v("--g-warning"),
    water:v("--g-water"),success:v("--g-success"),onPrimary:v("--g-on-primary"),
    floor:v("--g-st-floor"),wall:v("--g-st-wall"),wall2:v("--g-st-wall2"),door:v("--g-st-door")};
}

palLoad();

/* ========== 音效 ========== */
var AC=null;
function beep(f,d,type,vol){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=f;g.gain.value=vol||0.05;
    o.connect(g);g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(d||0.1));
    o.start();o.stop(AC.currentTime+(d||0.1)+0.02);
  }catch(e){}
}

/* ========== 关卡数据：包内生成 + DB 下发（整批替换，任一条非法整批放弃） ========== */
var LEVELS=[],cur=0;
var LEVELS_KEY="sw.fireice.v1.levels",LEVELS_VER_KEY="sw.fireice.v1.levels.ver";
function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=FI.LEVEL_COUNT;i++)list.push(FI.genLevel(i));
  return list;
}
function parseFireIceLevels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={},i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    var d;
    try{d=JSON.parse(item.dataJson)}catch(e){return null}
    var L=FI.parse(d);
    if(!L)return null;
    if(!FI.solve(L).ok)return null;   // 下发关卡必须可解
    var no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=true;
    L.no=no;
    list.push(L);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;}
  }catch(e){}
  return 0;
}

/* ========== 存档（本地 + 账号双写，账号更优才覆盖） ========== */
var KEY="sw.fireice.v1";
function loadSave(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&typeof s==="object")return{lv:parseInt(s.lv,10)||0,best:parseInt(s.best,10)||1};
  }catch(e){}
  return{lv:0,best:1};
}
var saveData=loadSave();
function save(){
  var data={lv:cur,best:unlocked};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("fire-ice",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("fire-ice").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(r.lv,10),rb=parseInt(r.best,10);
      if(isFinite(rl)&&rl>saveData.lv){saveData.lv=Math.min(rl,LEVELS.length-1);changed=true;}
      if(isFinite(rb)&&rb>unlocked){unlocked=clamp(rb,1,LEVELS.length);changed=true;}
      if(changed){save();buildLevelChips();startLevel(saveData.lv);}
    }catch(e){}
  }).catch(function(){});
}

/* ========== 游戏状态 ========== */
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
var curSave=loadSave();
var unlocked=clamp(curSave.best,1,1);
var steps=0,par=0,state="running",history=[];
var G=null;   // 当前关运行时 {cols,rows,grid,fp,ip}
var DIRS={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};
var ui={
  lv:document.getElementById("stLv"),steps:document.getElementById("stSteps"),par:document.getElementById("stPar"),
  msg:document.getElementById("msg"),
  ovWin:document.getElementById("ovWin"),ovFail:document.getElementById("ovFail"),ovSelect:document.getElementById("ovSelect"),
  ovWinDesc:document.getElementById("ovWinDesc"),ovFailDesc:document.getElementById("ovFailDesc"),
  ovNew:document.getElementById("ovNew"),btnNext:document.getElementById("btnNext"),
  lvGrid:document.getElementById("lvGrid")
};
function say(t){ui.msg.textContent=t}

function cellAt(c,r){return r<0||r>=G.rows||c<0||c>=G.cols?"#":G.grid[r].charAt(c)}
function setCell(c,r,ch){G.grid[r]=G.grid[r].substring(0,c)+ch+G.grid[r].substring(c+1)}
function findCh(ch){
  for(var r=0;r<G.rows;r++)for(var c=0;c<G.cols;c++)if(cellAt(c,r)===ch)return[c,r];
  return null;
}
function startLevel(n){
  cur=clamp(n,0,Math.max(0,LEVELS.length-1));
  var L=LEVELS[cur];
  G={cols:L.cols,rows:L.rows,grid:L.grid.slice(),name:L.name};
  var f=findCh("f"),i2=findCh("i");
  G.fp=[f[0],f[1]];G.ip=[i2[0],i2[1]];
  steps=0;par=L.par||0;history=[];
  state="running";
  showOverlay(null);
  buildLevelChips();
  syncHud();
  say(L.name+" · 双角色同向移动，各回各色出口");
  save();
}
function doorOpen(ch){
  var plate=ch==="D"?"p":(ch==="E"?"q":null);
  if(!plate)return true;
  return cellAt(G.fp[0],G.fp[1])===plate||cellAt(G.ip[0],G.ip[1])===plate;
}
function canGo(ch,who){
  if(ch==="#")return false;
  if(who==="f"&&ch==="w")return false;
  if(who==="i"&&ch==="l")return false;
  return doorOpen(ch);
}
function finishWin(){
  var isNew=(cur+2)>unlocked;
  unlocked=Math.min(LEVELS.length,Math.max(unlocked,cur+2));
  save();
  buildLevelChips();
  ui.ovWinDesc.textContent="用时 "+steps+" 步 · 参考最优 "+par+" 步";
  ui.ovNew.classList.toggle("show",isNew);
  ui.btnNext.style.display=cur<LEVELS.length-1?"":"none";
  showOverlay("win");
  if(GB.available)GB.reportScore("fire-ice",{metricValue:cur+1,metricExtra:steps}).catch(function(){});
}
function failLevel(reason){
  state="failed";
  ui.ovFailDesc.textContent=reason;
  showOverlay("fail");
}
function showOverlay(name){
  ui.ovWin.classList.toggle("show",name==="win");
  ui.ovFail.classList.toggle("show",name==="fail");
  ui.ovSelect.classList.toggle("show",name==="select");
}
function buildLevelChips(){
  var html="";
  for(var i=0;i<LEVELS.length;i++){
    var cls="lv-chip"+(i===cur?" sel":"")+(i<unlocked?" done":"");
    var dis=i<unlocked?"":" disabled";
    html+='<button class="'+cls+'" type="button" data-lv="'+i+'"'+dis+'>'+(i+1)+'</button>';
  }
  ui.lvGrid.innerHTML=html;
  var btns=ui.lvGrid.querySelectorAll(".lv-chip");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var n=Number(this.getAttribute("data-lv"));
      showOverlay(null);
      startLevel(n);
    });
  }
}
function move(dir){
  if(state!=="running")return;
  var d=DIRS[dir];
  var fc=[G.fp[0]+d[0],G.fp[1]+d[1]],ic=[G.ip[0]+d[0],G.ip[1]+d[1]];
  var fch=cellAt(fc[0],fc[1]),ich=cellAt(ic[0],ic[1]);
  var nf=canGo(fch,"f")?fc:G.fp;
  var ni=canGo(ich,"i")?ic:G.ip;
  // 致死移动拦截（提示而非坠落）
  if(nf!==G.fp&&cellAt(nf[0],nf[1])==="w"){say("火灵不能碰水");return;}
  if(ni!==G.ip&&cellAt(ni[0],ni[1])==="l"){say("冰灵不能碰岩浆");return;}
  history.push({fp:[G.fp[0],G.fp[1]],ip:[G.ip[0],G.ip[1]]});
  G.fp=nf;G.ip=ni;
  steps++;
  syncHud();
  beep(300,0.05,"sine",0.03);
  if(cellAt(G.fp[0],G.fp[1])==="F"&&cellAt(G.ip[0],G.ip[1])==="I"){
    beep(700,0.16,"square",0.06);
    finishWin();
  }
}
function undo(){
  if(state!=="running"||!history.length)return;
  var h=history.pop();
  G.fp=h.fp;G.ip=h.ip;
  steps=Math.max(0,steps-1);
  syncHud();
}

/* ========== HUD ========== */
function syncHud(){
  ui.lv.textContent=(cur+1)+"/"+LEVELS.length;
  ui.steps.textContent=String(steps);
  ui.par.textContent=par?String(par):"-";
}

/* ========== 绘制 ========== */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
var CS=36,OX=0,OY=0;
function layoutGrid(){
  CS=Math.floor(Math.min((NW-20)/G.cols,(NH-20)/G.rows));
  OX=(NW-CS*G.cols)/2;
  OY=(NH-CS*G.rows)/2;
}
function drawChar(c,r,col,edge,label){
  var x=OX+c*CS+CS/2,y=OY+r*CS+CS/2;
  ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(x,y,CS*0.32,0,6.3);ctx.fill();
  ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.92)";   // 恒白眼白，素材例外
  ctx.beginPath();ctx.arc(x-CS*0.1,y-CS*0.08,CS*0.07,0,6.3);ctx.arc(x+CS*0.1,y-CS*0.08,CS*0.07,0,6.3);ctx.fill();
  ctx.fillStyle=PAL.text;
  ctx.beginPath();ctx.arc(x-CS*0.08,y-CS*0.06,CS*0.035,0,6.3);ctx.arc(x+CS*0.12,y-CS*0.06,CS*0.035,0,6.3);ctx.fill();
  ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle=PAL.text;
  ctx.fillText(label,x,y+CS*0.22);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(offX,offY);ctx.scale(S,S);
  layoutGrid();
  var r,c;
  for(r=0;r<G.rows;r++)for(c=0;c<G.cols;c++){
    var ch=cellAt(c,r),x=OX+c*CS,y=OY+r*CS;
    if(ch==="#"){
      ctx.fillStyle=PAL.wall;
      ctx.fillRect(x,y,CS,CS);
      ctx.fillStyle=PAL.wall2;
      ctx.fillRect(x+2,y+2,CS-4,CS-4);
    }else{
      ctx.fillStyle=PAL.floor;
      ctx.fillRect(x,y,CS,CS);
      ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
      ctx.strokeRect(x+0.5,y+0.5,CS-1,CS-1);
      if(ch==="w"){
        ctx.fillStyle=PAL.water;
        ctx.fillRect(x+2,y+2,CS-4,CS-4);
        ctx.strokeStyle="rgba(255,255,255,.45)";ctx.lineWidth=1.4;   // 恒白波纹，素材例外
        ctx.beginPath();ctx.moveTo(x+6,y+CS*0.45);ctx.quadraticCurveTo(x+CS/2,y+CS*0.3,x+CS-6,y+CS*0.45);ctx.stroke();
      }else if(ch==="l"){
        ctx.fillStyle=PAL.danger;
        ctx.fillRect(x+2,y+2,CS-4,CS-4);
        ctx.fillStyle="rgba(255,255,255,.3)";
        ctx.beginPath();ctx.moveTo(x+CS/2,y+6);ctx.lineTo(x+CS-8,y+CS-8);ctx.lineTo(x+8,y+CS-8);ctx.closePath();ctx.fill();
      }else if(ch==="p"||ch==="q"){
        ctx.strokeStyle=PAL.warning;ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(x+CS/2,y+CS/2,CS*0.26,0,6.3);ctx.stroke();
        ctx.fillStyle=PAL.warning;
        ctx.beginPath();ctx.arc(x+CS/2,y+CS/2,CS*0.09,0,6.3);ctx.fill();
      }else if(ch==="D"||ch==="E"){
        var open=doorOpen(ch);
        ctx.fillStyle=open?PAL.primary:PAL.door;
        ctx.fillRect(x+3,y+3,CS-6,CS-6);
        ctx.strokeStyle=open?PAL.deep:PAL.text;ctx.lineWidth=2;
        ctx.strokeRect(x+3,y+3,CS-6,CS-6);
        if(!open){
          ctx.fillStyle=PAL.floor;
          ctx.fillRect(x+CS*0.42,y+3,CS*0.16,CS-6);
        }
      }else if(ch==="F"||ch==="I"){
        var col=ch==="F"?PAL.danger:PAL.water;
        ctx.strokeStyle=col;ctx.lineWidth=2.4;
        ctx.beginPath();ctx.arc(x+CS/2,y+CS/2,CS*0.3,0,6.3);ctx.stroke();
        ctx.fillStyle=col;
        ctx.globalAlpha=0.28;
        ctx.beginPath();ctx.arc(x+CS/2,y+CS/2,CS*0.22,0,6.3);ctx.fill();
        ctx.globalAlpha=1;
      }
    }
  }
  drawChar(G.fp[0],G.fp[1],PAL.danger,PAL.deep,"火");
  drawChar(G.ip[0],G.ip[1],PAL.water,PAL.deep,"冰");
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

/* ========== 输入：双角色同向移动（触屏按钮 / 滑动手势 / 方向键） ========== */
window.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  var d=null;
  if(k==="ArrowUp"||k==="w")d="up";
  else if(k==="ArrowDown"||k==="s")d="down";
  else if(k==="ArrowLeft"||k==="a")d="left";
  else if(k==="ArrowRight"||k==="d")d="right";
  else if(k==="u")d="undo";
  else if(k===" "){e.preventDefault();return;}
  if(d){e.preventDefault();if(d==="undo")undo();else move(d);}
});
var sx=0,sy=0,tracking=false;
var SWIPE_MIN=24;
cv.addEventListener("touchstart",function(e){
  var t=e.changedTouches[0];
  sx=t.clientX;sy=t.clientY;tracking=true;
},{passive:true});
cv.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  if(!tracking)return;
  tracking=false;
  var t=e.changedTouches[0];
  var dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<SWIPE_MIN)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"));
});

document.getElementById("btnL").addEventListener("click",function(){move("left");});
document.getElementById("btnU").addEventListener("click",function(){move("up");});
document.getElementById("btnD").addEventListener("click",function(){move("down");});
document.getElementById("btnR").addEventListener("click",function(){move("right");});
document.getElementById("btnUndo").addEventListener("click",function(){undo();});

document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running"){say("已暂停 · 点按方向键继续");}
});

/* ========== 主循环与启动 ========== */
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));
  H=Math.max(320,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);
  offX=(W-NW*S)/2;offY=(H-NH*S)/2;
}
window.addEventListener("resize",resize);
function frame(){
  requestAnimationFrame(frame);
  draw();
}

document.getElementById("btnSelectTop").addEventListener("click",function(){buildLevelChips();showOverlay("select");});
document.getElementById("btnSelectWin").addEventListener("click",function(){buildLevelChips();showOverlay("select");});
document.getElementById("btnSelectFail").addEventListener("click",function(){buildLevelChips();showOverlay("select");});
document.getElementById("btnCloseSelect").addEventListener("click",function(){showOverlay(null);});
document.getElementById("btnNext").addEventListener("click",function(){startLevel(cur<LEVELS.length-1?cur+1:0);});
document.getElementById("btnReplayWin").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnRetry").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnRetryBottom").addEventListener("click",function(){startLevel(cur);});

/* 调试验证入口：程序化可解性自验（联合 BFS 逐关复现） */
window.__validateLevels=function(){
  try{return FI.validateAll()}catch(e){return {error:String(e)}}
};

resize();
LEVELS=buildDefaultLevels();
var cachedVer=loadCachedLevels();
cur=clamp(parseInt(curSave.lv,10)||0,0,Math.max(0,LEVELS.length-1));
unlocked=clamp(parseInt(curSave.best,10)||1,1,Math.max(1,LEVELS.length));
startLevel(cur);
requestAnimationFrame(frame);
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("fire-ice").then(function(res){
    var list=parseFireIceLevels(res);
    if(!list||!list.length)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      startLevel(cur);
    }
  }).catch(function(){});
}
syncLevelsFromServer();
syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
