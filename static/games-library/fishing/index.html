<html lang="zh-CN">
<head>

<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材（--g-fi-* 钓鱼素材：天空/水体/船木/鱼体；--g-st-weed 水草）*/
  :root {
    --g-bg:#F5F6F3; --g-surface:#FFFFFF; --g-surface2:#EFF1EE;
    --g-primary:#2D9B6A; --g-primary-deep:#17734A;--g-btn-primary:#17734A; --g-primary-soft:#E8F6EF; --g-on-primary:#FFFFFF; --g-on-soft:#0B3625;
    --g-text:#1C1C1E; --g-muted:#6B6E73; --g-faint:#A9AEA9; --g-border:#E6E9E6; --g-hairline:#EFF1EE;
    --g-danger:#A83850; --g-warning:#9A6210; --g-success:#17734A; --g-water:#4A9FD4;
    --g-scrim:rgba(245,246,243,.9);
    --g-shadow:0 2px 12px rgba(20,40,30,.05);
    --g-radius:16px; --g-radius-btn:14px; --g-radius-inner:12px; --g-gap:16px;
    --g-fi-sky:#DCEEF6; --g-fi-water:#2E6E8E; --g-fi-boat:#C07A4A; --g-fi-fish:#E8A33B; --g-st-weed:#2E5E45;
    color-scheme:light;
  }
  :root[data-theme=dark] {
    --g-bg:#141614; --g-surface:#1D201E; --g-surface2:#262A27;
    --g-primary-deep:#5BC894; --g-primary-soft:#1D3229; --g-on-soft:#B9E8CF;
    --g-text:#E6E9E6; --g-muted:#A9AEA9; --g-faint:#7E837D; --g-border:#2C312D; --g-hairline:#262A27;
    --g-danger:#DB7186; --g-warning:#E2A44E; --g-success:#4ADE6E; --g-water:#6BB4DE;
    --g-scrim:rgba(20,22,20,.9);
    --g-shadow:0 2px 12px rgba(0,0,0,.28);
    --g-fi-sky:#16232B; --g-fi-water:#1E3E52; --g-fi-boat:#6E4526; --g-fi-fish:#E2A44E; --g-st-weed:#1F3D2C;
    color-scheme:dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.5; }
  .icon-btn {
    width: 44px; height: 44px; flex: 0 0 44px;
    border: 1px solid var(--g-border); border-radius: 12px;
    background: var(--g-surface); color: var(--g-text);
    display: grid; place-items: center; cursor: pointer; font: inherit;
    touch-action: manipulation;
  }
  .icon-btn { transition: transform .14s ease-out, opacity .16s ease-out; }
  .icon-btn:active { transform: scale(.96); }
  .scores { display: flex; gap: 8px; flex: 1; }
  .score-box {
    background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 12px;
    flex: 1; min-width: 0; padding: 5px 8px; text-align: center; line-height: 1.3;
  }
  .score-box .label { display: block; font-size: 12px; opacity: .85; white-space: nowrap; }
  .score-box .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; min-width: 0; background: var(--g-surface2); border-radius: 12px; padding: 5px 8px; text-align: center; line-height: 1.3; animation: rise .38s ease-out both; }
  .stat:nth-child(2) { animation-delay: 40ms; }
  .stat:nth-child(3) { animation-delay: 80ms; }
  .stat:nth-child(4) { animation-delay: 120ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); white-space: nowrap; }
  .stat .val { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .hint { margin: 0; font-size: 14px; color: var(--g-muted); }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: 14px;
    background: var(--g-btn-primary); color: var(--g-on-primary);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(.96); }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .btn.ghost { background: var(--g-surface2); color: var(--g-text); border: 1px solid var(--g-border); }
  .stage { position: relative; }
  canvas {
    display: block; width: 100%; aspect-ratio: 390 / 520; height: auto;
    background: var(--g-surface2);
    border: 1px solid var(--g-border); border-radius: 12px;
    touch-action: none;
  }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: absolute; inset: 0; z-index: 5;
    border-radius: 12px; background: var(--g-scrim);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 16px; text-align: center;
  }
  .overlay.show { display: flex; animation: rise .18s ease-out; }
  .overlay.show .ov-title { animation: pop .3s ease-out; }
  .badge.show { animation: bump .3s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: translateY(0); } }
  @keyframes pop { 0% { transform: scale(.9); opacity: .4; } 60% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
  .stat .val.bump { animation: bump .24s ease-out; }
  .ov-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--g-primary-deep); max-width: 100%; }
  .ov-sub { margin: 0 0 6px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .btn-row { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .btn-row .btn { flex: 1; }
  .lv-wrap { width: 100%; max-width: 340px; max-height: 48vh; overflow-y: auto; }
  .lv-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .lv-chip {
    min-height: 44px; border: 1px solid var(--g-border); border-radius: 10px;
    background: var(--g-surface); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: transform .14s ease-out, background .16s ease-out, box-shadow .16s ease-out;
    touch-action: manipulation;
  }
  .lv-chip:active { transform: scale(.96); }
  .lv-chip.sel { border-color: var(--g-primary); box-shadow: inset 0 0 0 1.5px var(--g-primary); background: var(--g-primary-soft); color: var(--g-on-soft); }
  .lv-chip.done { background: var(--g-btn-primary); border-color: var(--g-primary); color: var(--g-on-primary); }
  .lv-chip:disabled { opacity: .38; cursor: not-allowed; }
  .badge { display: none; margin: 0 0 4px; padding: 4px 12px; border-radius: 999px; background: var(--g-surface2); color: var(--g-warning); font-size: 12px; font-weight: 700; }
  .badge.show { display: inline-block; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>
<script>
/* 内联图标库：照抄本库 window.SW_ICON 结构（24 viewBox / currentColor / aria-hidden / 零外链） */
window.SW_ICON=function(n,s){s=s||"";var P={
 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>',

 'grid':'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
 'play':'<path d="M8 5v14l11-7z"/>','x':'<path d="M6 6l12 12M18 6L6 18"/>'
};
var fill={'play':1};
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var FS={SPECIES:[
    {name:"小鲫鱼",band:[0.10,0.50],power:0.5,value:20},
    {name:"锦鲤",band:[0.20,0.70],power:0.7,value:35},
    {name:"河豚",band:[0.40,0.85],power:0.9,value:50},
    {name:"大鲤鱼",band:[0.30,0.80],power:1.0,value:60},
    {name:"鲶鱼",band:[0.60,0.95],power:1.1,value:70},
    {name:"龙虾",band:[0.70,1.00],power:1.2,value:90},
    {name:"鳜鱼",band:[0.50,0.90],power:1.3,value:120},
    {name:"神秘巨物",band:[0.80,1.00],power:1.5,value:200}
  ],REEL:62,TENSION_UP:24,TENSION_DOWN:40,PULL:18,BREAK_T:0.55};
/* 关卡生成：抛竿数 5→9、目标 45%→70% 命中率、QTE 窗口 900→420ms、鱼种池渐深 */
FS.LEVEL_COUNT=40;
FS.genLevel=function(no){
  var p=(no-1)/(FS.LEVEL_COUNT-1);
  var casts=5+Math.floor(no/9);                 // 5→9
  var need=Math.max(2,Math.round(casts*(0.45+p*0.25)));
  var poolSize=Math.min(FS.SPECIES.length,2+Math.floor(no/5));   // 2→8
  var pool=[];
  for(var i=0;i<poolSize;i++)pool.push(i);
  return {name:"第"+no+"关 · 钓鱼达人",casts:casts,need:need,
    win:Math.round(900-p*480),pool:pool,seed:33000+no*257};
};
FS.validate=function(level){
  if(!level||typeof level!=="object")return{ok:false,why:"bad"};
  if(!isFinite(level.casts)||level.casts<3||level.casts>15||level.casts!==(level.casts|0))return{ok:false,why:"casts"};
  if(!isFinite(level.need)||level.need<1||level.need>level.casts||level.need!==(level.need|0))return{ok:false,why:"need"};
  if(!isFinite(level.win)||level.win<300||level.win>1500)return{ok:false,why:"win"};
  if(!Array.isArray(level.pool)||level.pool.length<1||level.pool.length>FS.SPECIES.length)return{ok:false,why:"pool"};
  for(var i=0;i<level.pool.length;i++){
    var v=level.pool[i];
    if(!isFinite(v)||v<0||v>=FS.SPECIES.length||v!==(v|0))return{ok:false,why:"sp"+i};
  }
  return{ok:true,why:""};
};
/* 单杆状态机：power→深度；wait(咬钩)→bite(QTE 窗口)→fight(收线搏鱼)；深度不合带宽则晚咬 */
FS.createCast=function(level,castIdx,power){
  var rng=mulberry32((level.seed||1)+castIdx*97);
  var depth=clampf(power,0.06,1);
  var spIdx=level.pool[(rng()*level.pool.length)|0];
  var sp=FS.SPECIES[spIdx];
  var compatible=depth>=sp.band[0]-0.16&&depth<=sp.band[1]+0.16;
  if(!compatible){
    var cand=[];
    for(var i=0;i<level.pool.length;i++){
      var s2=FS.SPECIES[level.pool[i]];
      if(depth>=s2.band[0]-0.16&&depth<=s2.band[1]+0.16)cand.push(level.pool[i]);
    }
    if(cand.length){spIdx=cand[(rng()*cand.length)|0];sp=FS.SPECIES[spIdx];compatible=true;}
    else{spIdx=level.pool[(rng()*level.pool.length)|0];sp=FS.SPECIES[spIdx];}
  }
  var biteDelay=0.9+rng()*2.2+(compatible?0:2.5);
  var fightD=130+depth*80+sp.power*45;
  return {phase:"wait",t:0,biteDelay:biteDelay,winT:level.win/1000,species:spIdx,
    D:fightD,D0:fightD,tension:0.15,breakT:0,ph:rng()*6.28,depth:depth,
    reelTime:0,status:"run"};
};
function clampf(v,a,b){return Math.max(a,Math.min(b,v))}
/* 单步：holding=收线中；返回 "bite"/"hooked"/"caught"/"break"/"miss" */
FS.step=function(st,level,dt,holding){
  if(st.status!=="run")return st.status;
  st.t+=dt;
  if(st.phase==="wait"){
    st.biteDelay-=dt;
    if(st.biteDelay<=0){st.phase="bite";return "bite";}
    return "run";
  }
  if(st.phase==="bite"){
    st.winT-=dt;
    if(st.winT<=0){st.status="miss";return "miss";}
    return "run";
  }
  // fight：鱼挣扎节律（周期 4s，其中 1.6s 猛冲）
  var struggle=((st.t+st.ph)%4)<1.6;
  if(holding){
    st.D-=FS.REEL*(struggle?0.65:1)*dt;
    st.tension+=FS.TENSION_UP*FS.SPECIES[st.species].power*(struggle?1.7:1)*dt;
  }else{
    st.D+=FS.PULL*dt;
    st.tension-=FS.TENSION_DOWN*dt;
    if(st.tension<0.12)st.tension=0.12;
  }
  if(st.tension>=1){
    st.breakT+=dt;
    if(st.breakT>=FS.BREAK_T){st.status="break";return "break";}
  }else{
    st.breakT=Math.max(0,st.breakT-dt*1.5);
  }
  st.reelTime+=dt;
  if(st.D<=4){st.status="caught";return "caught";}
  if(st.reelTime>30){st.status="break";return "break";}   // 兜底：超长搏鱼判线断
  return "run";
};
/* 验证：完美策略回放——力量取鱼种带宽中点、QTE 点窗口正中、张力 <0.86 收线否则松手 */
FS.simLevel=function(level){
  var caught=0,value=0,perCast=[],i;
  for(i=0;i<level.casts;i++){
    var sp=FS.SPECIES[level.pool[0]];
    // 力量取池内最深鱼种带宽中点（完美信息）
    var best=level.pool[0],bd=-1;
    for(var k=0;k<level.pool.length;k++){
      var s2=FS.SPECIES[level.pool[k]];
      var mid=(s2.band[0]+s2.band[1])/2;
      if(mid>bd){bd=mid;best=level.pool[k];}
    }
    var power=(FS.SPECIES[best].band[0]+FS.SPECIES[best].band[1])/2;
    var st=FS.createCast(level,i,power);
    var guard=2400,res="run",tapped=false;
    while(guard-->0&&res==="run"){
      res=FS.step(st,level,1/60,st.phase==="fight"&&st.tension<0.86);
      if(res==="bite"){
        // QTE：窗口正中点下
        var wait=Math.max(0,(level.win/1000)/2-st.winT);
        st.winT-=wait;
        if(st.winT>0){st.phase="fight";res="run";}
        else{st.status="miss";res="miss";}
      }
    }
    if(st.status==="caught"){caught++;value+=FS.SPECIES[st.species].value;}
    perCast.push(st.status);
  }
  return {caught:caught,value:value,perCast:perCast.join(",")};
};
FS.validateAll=function(){
  var fails=[],i;
  for(i=1;i<=FS.LEVEL_COUNT;i++){
    var L=FS.genLevel(i);
    var chk=FS.validate(L);
    if(!chk.ok){fails.push(i+"("+chk.why+")");continue;}
    var r=FS.simLevel(L);
    if(r.caught<L.need)fails.push(i+"("+r.caught+"/"+L.need+")");

var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);

}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}

function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=FS.LEVEL_COUNT;i++)list.push(FS.genLevel(i));
  return list;
}
function parseFishLevels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={},i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    var d;
    try{d=JSON.parse(item.dataJson)}catch(e){return null}
    if(!FS.validate(d).ok)return null;
    if(FS.simLevel(d).caught<d.need)return null;   // 下发关卡必须可完成
    var no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=true;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}

    if(Array.isArray(list)&&list.length){LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;}
  }catch(e){}

}

      if(isFinite(rl)&&rl>curSave.lv){curSave.lv=Math.min(rl,LEVELS.length-1);changed=true;}

      if(Array.isArray(r.dex)){

function primaryTap(){

  }

  }

  if(state!=="running"||!G.st)return;
  if(v&&!holding)beep(220,0.05,"sine",0.03);

}

  G.castIdx++;

/* ========== 更新 ========== */
var last=0;
function step(dt){
  // 力度条摆动
  if(!G.st){
    G.meterT+=dt;
    G.power=0.5+0.48*Math.sin(G.meterT*2.6);
  }
  // 气泡
  for(var b=0;b<G.bubbles.length;b++){
    var bu=G.bubbles[b];
    bu.y-=bu.v*dt;
    if(bu.y<100){bu.y=NH-10;bu.x=Math.random()*NW;}
  }
  if(G.st){
    var res=FS.step(G.st,G.L,dt,holding&&G.st.phase==="fight");
    if(res==="caught"){
      var sp=FS.SPECIES[G.st.species];
      G.caught++;G.score+=sp.value;
      curSave.dex[G.st.species]=(curSave.dex[G.st.species]|0)+1;
      ui.score.classList.remove("bump");void ui.score.offsetWidth;ui.score.classList.add("bump");   // 得分轻弹
      save();
      addFloat(200,200,"钓到 "+sp.name+" +"+sp.value,PAL.success);
      beep(600,0.14,"triangle",0.06);
      syncHud();
      nextCast("继续下一竿");
    }else if(res==="miss"){
      addFloat(200,180,"鱼跑了…",PAL.danger);
      beep(240,0.15,"sawtooth",0.05);
      nextCast("鱼溜了，再抛一竿");
    }else if(res==="break"){
      addFloat(200,180,"线断了！",PAL.danger);
      beep(180,0.2,"sawtooth",0.06);
      nextCast("线断了，张力别拉满");
    }
    syncHud();
  }
  for(var f=G.floats.length-1;f>=0;f--){
    var fl=G.floats[f];
    fl.y-=30*dt;fl.life-=dt;
    if(fl.life<=0)G.floats.splice(f,1);
  }
}
function syncHud(){
  ui.lv.textContent=(cur+1)+"/"+LEVELS.length;
  ui.fish.textContent=G.caught+"/"+G.L.need;
  ui.casts.textContent=Math.max(0,G.L.casts-G.castIdx);

}

  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);

}
function draw(){

      ctx.strokeStyle=PAL.border;ctx.lineWidth=1.4;ctx.stroke();
      var tcol=st2.tension>0.85?PAL.danger:(st2.tension>0.6?PAL.warning:PAL.success);
      var th2=th*clampf(st2.tension,0,1);
      var tg=ctx.createLinearGradient(tx-8,0,tx+8,0);
      tg.addColorStop(0,colShade(tcol,-0.22));
      tg.addColorStop(0.4,tcol);
      tg.addColorStop(1,colMix(tcol,WHITE,0.22));
      ctx.fillStyle=tg;
      rr(tx-8,ty+th-th2,16,Math.max(4,th2),8);ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=1;   // 恒白顶光
      rr(tx-6,ty+th-th2+1.5,12,Math.max(2,th2-3),6);ctx.stroke();
      ctx.fillStyle=PAL.muted;
      ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.textAlign="center";ctx.textBaseline="alphabetic";
      ctx.fillText("张力",tx,ty-8);
      // 收线距离
      ctx.fillStyle=PAL.onPrimary;
      ctx.font="700 16px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(Math.round(st2.D)+"m",tx,ty+th+18);
      if(st2.breakT>0){
        ctx.fillStyle=PAL.danger;
        ctx.font="700 14px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
        ctx.fillText("危险！",tx,ty-24);
      }
    }
  }
  // 力度条（未抛竿时）
  if(!G.st){
    var px2=332,py2=120,ph2=260;
    ctx.fillStyle=colShade(PAL.surface,-0.10);
    rr(px2-10,py2,20,ph2,10);ctx.fill();
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1.4;ctx.stroke();
    // 鱼种深度带参考（目标区间）
    for(var s3=0;s3<G.L.pool.length;s3++){
      var sp2=FS.SPECIES[G.L.pool[s3]];
      ctx.fillStyle=PAL.sea;
      ctx.globalAlpha=0.28;
      rr(px2-9,py2+ph2*(1-sp2.band[1]),18,ph2*(sp2.band[1]-sp2.band[0]),6);ctx.fill();
      ctx.globalAlpha=1;
    }
    var py3=py2+ph2*(1-clampf(G.power,0,1));
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=6;ctx.shadowOffsetY=2;
    var hg=ctx.createLinearGradient(0,py3-5,0,py3+5);
    hg.addColorStop(0,colMix(PAL.warning,WHITE,0.35));
    hg.addColorStop(1,colShade(PAL.warning,-0.22));
    ctx.fillStyle=hg;
    rr(px2-8,py3-5,16,10,5);ctx.fill();
    ctx.restore();
    ctx.fillStyle=PAL.muted;
    ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="alphabetic";
    ctx.fillText("抛竿力度",px2,py2-8);
    ctx.fillStyle=PAL.text;
    ctx.font="700 16px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textBaseline="middle";
    ctx.fillText(Math.round(G.power*100)+"%",px2,py3);
  }
  // 浮漂
  if(G.st&&G.st.phase==="wait"){
    var bobY=92+Math.sin(G.meterT*3)*3;
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.32)";ctx.shadowBlur=5;ctx.shadowOffsetY=2;
    var bgrad2=ctx.createRadialGradient(198,bobY-2,1,200,bobY,7);
    bgrad2.addColorStop(0,colMix(PAL.danger,WHITE,0.6));
    bgrad2.addColorStop(0.55,PAL.danger);
    bgrad2.addColorStop(1,colShade(PAL.danger,-0.35));
    ctx.fillStyle=bgrad2;
    ctx.beginPath();ctx.arc(200,bobY,6,0,6.3);ctx.fill();
    ctx.restore();
    ctx.fillStyle=WHITE;   // 恒白高光
    ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.arc(198,bobY-2,2.2,0,6.3);ctx.fill();
    ctx.globalAlpha=1;
  }
  // 浮字
  ctx.font="700 18px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  for(var f2=0;f2<G.floats.length;f2++){
    var fl=G.floats[f2];
    ctx.globalAlpha=Math.max(0,fl.life/fl.max);
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.45)";ctx.shadowBlur=4;ctx.shadowOffsetY=1;   // 恒黑投影
    ctx.fillStyle=fl.c;
    ctx.fillText(fl.txt,fl.x,fl.y);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  syncHud();
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

});

    e.preventDefault();
    if(!e.repeat)primaryTap();

});

});

});

/* ========== 主循环与启动 ========== */
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));
  H=Math.max(320,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);
  offX=(W-NW*S)/2;offY=(H-NH*S)/2;
}
window.addEventListener("resize",resize);
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.033,(ts-last)/1000||0);
  last=ts;
  if(state==="running"&&G)step(dt);
  draw();
}

document.getElementById("btnSelectFail").addEventListener("click",function(){buildLevelChips();showOverlay("select");});

cur=clamp(parseInt(curSave.lv,10)||0,0,Math.max(0,LEVELS.length-1));
unlocked=clamp(parseInt(curSave.best,10)||1,1,Math.max(1,LEVELS.length));

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

})();
