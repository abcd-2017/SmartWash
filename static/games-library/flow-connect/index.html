//FC-PARSER-BEGIN
// 解析与校验（纯函数，供浏览器与单测共用；口径与 docs/level-gen/tools/flow-connect/lib.mjs 一致）
var FC_PARSE = (function(){
  function validData(d){
    if(!d||typeof d!=="object"||Array.isArray(d))return false;
    var n=d.size;
    if(!Number.isInteger(n)||n<5||n>9)return false;
    var ps=d.pairs;
    if(!Array.isArray(ps)||ps.length<4||ps.length>8)return false;
    var colors={},seen={};
    for(var i=0;i<ps.length;i++){
      var p=ps[i];
      if(!p||typeof p!=="object"||Array.isArray(p))return false;
      if(!Number.isInteger(p.c)||p.c<0||p.c>=ps.length)return false;
      if(colors[p.c])return false;
      colors[p.c]=1;
      for(var k=0;k<2;k++){
        var key=k===0?"a":"b",e=p[key];
        if(!Array.isArray(e)||e.length!==2)return false;
        if(!Number.isInteger(e[0])||!Number.isInteger(e[1]))return false;
        if(e[0]<0||e[0]>=n||e[1]<0||e[1]>=n)return false;
        var id=e[1]*n+e[0];
        if(seen[id])return false;
        seen[id]=1;
      }
      if(p.a[0]===p.b[0]&&p.a[1]===p.b[1])return false;
    }
    return true;
  }
  function parseLevels(res){
    if(!res||!Array.isArray(res.levels)||!res.levels.length)return false;
    var list=[];
    for(var i=0;i<res.levels.length;i++){
      var item=res.levels[i];
      if(!item||typeof item.dataJson!=="string")return false;
      var d;
      try{d=JSON.parse(item.dataJson);}catch(e){return false;}
      if(!validData(d))return false;
      var name=(typeof item.name==="string"&&item.name)?item.name:(typeof d.name==="string"&&d.name?d.name:("第"+(i+1)+"关"));
      if(name.length>32)return false;
      var pairs=[];
      for(var j=0;j<d.pairs.length;j++){
        pairs.push({c:d.pairs[j].c,a:d.pairs[j].a.slice(),b:d.pairs[j].b.slice()});
      }
      list.push({name:name,size:d.size,pairs:pairs});
    }
    return list;
  }
  return {validData:validData,parseLevels:parseLevels};
})();
//FC-PARSER-END
</script>

}

    if(Array.isArray(list)&&list.length){LEVELS=list;return v;}
  }catch(e){}

}

    var list=FC_PARSE.parseLevels(res);

var KEY="sw.flow-connect.v1";

  try{

    if(s&&typeof s==="object"){
      var done={};
      if(s.done&&typeof s.done==="object"){
        for(var k in s.done){
          var m=parseInt(s.done[k]&&s.done[k].m,10),st=parseInt(s.done[k]&&s.done[k].s,10);
          if(m>0)done[k]={m:m,s:st>0?st:1};
        }
      }
      return {lv:Math.max(0,parseInt(s.lv,10)||0),done:done};
    }
  }catch(e){}
  return {lv:0,done:{}};
}
function save(){
  var data={lv:saveData.lv,done:doneSave};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("flow-connect",data).catch(function(){});
}

  if(!GB.available||!GB.loadState)return;
  GB.loadState("flow-connect").then(function(res){

    try{
      var remote=JSON.parse(res.stateJson),changed=false;
      if(remote.done&&typeof remote.done==="object"){
        for(var k in remote.done){
          var rm=parseInt(remote.done[k]&&remote.done[k].m,10),rs=parseInt(remote.done[k]&&remote.done[k].s,10);
          if(!(rm>0))continue;

        }
      }
      var rl=parseInt(remote.lv,10)||0;
      if(rl>saveData.lv){saveData.lv=rl;changed=true;}
      if(changed){

}

function startLevel(n){

  size=L.size;
  colors=[];occ=new Int32Array(size*size).fill(-1);

    var p=L.pairs[i];
    var s=p.a[1]*size+p.a[0],t=p.b[1]*size+p.b[0];
    colors.push({start:s,target:t,path:[s],done:false});
    occ[s]=i;
  }
  dragging=-1;won=false;moves=0;
  $("btnNext").hidden=true;

  dragging=c;

function tryStep(w){
  var col=colors[dragging];
  var head=col.path[col.path.length-1];
  if(w===head)return true;
  if(Math.abs((w%size)-(head%size))+Math.abs(((w/size)|0)-((head/size)|0))!==1)return false;
  if(col.done)return false;
  if(w===col.target){
    col.path.push(w);occ[w]=dragging;col.done=true;
    moves++;updateStats();say("已连通 "+colorsDone()+"/"+colors.length);
    checkWin();
    return true;
  }
  var idx=col.path.indexOf(w);
  if(idx>=0){truncateColor(dragging,idx);return true;}
  if(occ[w]>=0)return false;
  for(var i=0;i<colors.length;i++){
    if(i===dragging)continue;
    if(colors[i].start===w||colors[i].target===w)return false;
  }
  col.path.push(w);occ[w]=dragging;
  return true;
}
function stepToward(v){
  var col=colors[dragging];
  if(col.done)return;
  var guard=0;
  while(guard++<size*size){
    var head=col.path[col.path.length-1];
    if(head===v)break;
    var hx=head%size,hy=(head/size)|0,vx=v%size,vy=(v/size)|0;
    var dx=vx-hx,dy=vy-hy,next;
    if(Math.abs(dx)>=Math.abs(dy)&&dx!==0)next=head+(dx>0?1:-1);

    else break;
    if(!tryStep(next))break;
  }

function colorsDone(){
  var c=0;for(var i=0;i<colors.length;i++)if(colors[i].done)c++;
  return c;
}
function checkWin(){
  if(won)return;
  var full=true;

  if(!(w>0))w=320;
  viewSize=Math.floor(w);
  cellPx=viewSize/(size||8);
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=viewSize+"px";cv.style.height=viewSize+"px";
  cv.width=Math.round(viewSize*dpr);cv.height=Math.round(viewSize*dpr);
  render();
}
/* ---------- 统计 / 解锁 ---------- */
function unlockedMax(){
  var m=0;
  for(var k in doneSave){
    var i=parseInt(k,10);
    if(doneSave[k]&&doneSave[k].m>0&&i+1>m)m=i+1;
  }
  return Math.min(m,LEVELS.length-1);
}
function updateStats(){
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  $("stDone").textContent=colorsDone()+"/"+colors.length;
  var rec=doneSave[cur];
  $("stBest").textContent=rec?String(rec.m):"-";
}
function starOf(m){
  var K=colors.length;
  if(m<=K)return 3;
  if(m<=K+2)return 2;
  return 1;
}
function onWin(){
  won=true;
  var rec=doneSave[cur];
  var stars=starOf(moves);
  if(!rec||moves<rec.m||(moves===rec.m&&stars>rec.s))doneSave[cur]={m:moves,s:stars};
  saveData.lv=Math.min(cur+1,LEVELS.length-1);
  save();updateStats();
  $("btnNext").hidden=false;
  var last=cur>=LEVELS.length-1;
  var html='<h2>通关！</h2><p class="desc">本关用了 <b>'+moves+'</b> 次连线<br>获得 '+stars+' 星 · 共 '+LEVELS.length+' 关</p>';
  html+='<button class="btn" data-act="next">'+(last?"再玩一遍":"下一关")+'</button>';
  html+='<button class="btn ghost" data-act="retry">重玩本关</button>';
  html+='<button class="btn ghost" data-act="close">关闭</button>';
  showOverlay(html);
  say("通关！用了 "+moves+" 次连线");
  if(GB.available)GB.reportScore("flow-connect",{metricValue:Object.keys(doneSave).length,metricExtra:moves}).catch(function(){});
}
/* ---------- 覆盖层 ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function showOverlay(html){$("panel").innerHTML=html;$("overlay").classList.add("show");}
function hideOverlay(){$("overlay").classList.remove("show");}
function openPicker(){
  var html='<h2>选择关卡</h2><p class="desc">已解锁 '+(unlockedMax()+1)+' / '+LEVELS.length+'</p><div class="lvgrid">';
  for(var i=0;i<LEVELS.length;i++){
    var cls="lvgrid-btn"+(doneSave[i]?" done":"")+(i===cur?" cur":"");
    var dis=i>unlockedMax()?" disabled":"";
    var label=doneSave[i]?("★"+doneSave[i].s):(i+1);
    html+='<button class="'+cls+'" data-act="lv" data-lv="'+i+'"'+dis+'>'+label+'</button>';
  }
  html+='</div><button class="btn ghost" data-act="close">关闭</button>';
  showOverlay(html);
}
$("panel").addEventListener("click",function(e){
  var t=e.target&&e.target.closest?e.target.closest("[data-act]"):null;
  if(!t)return;
  var act=t.getAttribute("data-act");
  if(act==="next"){hideOverlay();startLevel(cur<LEVELS.length-1?cur+1:0);}
  else if(act==="retry"){hideOverlay();startLevel(cur);}
  else if(act==="close"){hideOverlay();}
  else if(act==="lv"){var i=parseInt(t.getAttribute("data-lv"),10);hideOverlay();if(i<=unlockedMax())startLevel(i);}
});
/* ---------- 输入 ---------- */
function cellFromEvent(e){
  var rect=cv.getBoundingClientRect();
  var x=Math.floor((e.clientX-rect.left)/cellPx);
  var y=Math.floor((e.clientY-rect.top)/cellPx);
  if(x<0||y<0||x>=size||y>=size)return -1;
  return y*size+x;
}
cv.addEventListener("pointerdown",function(e){
  if(won)return;
  var v=cellFromEvent(e);
  if(v<0)return;
  e.preventDefault();
  var c=occ[v];
  if(c>=0){
    var col=colors[c],idx=col.path.indexOf(v);
    if(idx>=0){
      if(col.done&&(v===col.start||v===col.target)){
        if(v===col.target){var t0=col.start;col.start=col.target;col.target=t0;}
        beginDrag(c,v);
      }else{
        truncateColor(c,idx);
        dragging=c;
      }
      try{cv.setPointerCapture(e.pointerId);}catch(err){}
      render();return;
    }
  }
  for(var i=0;i<colors.length;i++){
    if(colors[i].done)continue;
    if(colors[i].start===v){beginDrag(i,v);render();return;}
    if(colors[i].target===v){
      var t=colors[i].start;colors[i].start=colors[i].target;colors[i].target=t;
      beginDrag(i,v);render();return;
    }
  }
});
cv.addEventListener("pointermove",function(e){
  if(dragging<0||won)return;
  e.preventDefault();
  var v=cellFromEvent(e);
  if(v<0)return;
  stepToward(v);
  render();
});
cv.addEventListener("pointerup",function(){dragging=-1;render();});
cv.addEventListener("pointercancel",function(){dragging=-1;render();});
cv.addEventListener("contextmenu",function(e){e.preventDefault();});
$("btnReset").addEventListener("click",function(){startLevel(cur);say("本关已重置");});
$("btnNext").addEventListener("click",function(){startLevel(cur<LEVELS.length-1?cur+1:0);});
$("btnPick").addEventListener("click",openPicker);
window.addEventListener("resize",resize);
window.addEventListener("load",resize);
document.addEventListener("visibilitychange",function(){if(!document.hidden)render();});
/* ---------- 启动 ---------- */
palLoad();
startLevel(Math.min(Math.max(saveData.lv,0),unlockedMax()));
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
</body>
</html>
