<script>

try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 关卡数据（需求之和恒等于 den；DB 下发优先） ---------- */
var GAME_KEY="fraction-pie",SAVE_KEY="sw.fractionpie.v1";
var DEFAULT_LEVELS=[{"name":"切饼·01","den":4,"need":[2,2],"contig":0},{"name":"切饼·02","den":4,"need":[1,1,2],"contig":0},{"name":"切饼·03","den":4,"need":[1,2,1],"contig":0},{"name":"切饼·04","den":5,"need":[2,3],"contig":0},{"name":"切饼·05","den":5,"need":[1,1,3],"contig":0},{"name":"切饼·06","den":5,"need":[1,2,2],"contig":0},{"name":"切饼·07","den":5,"need":[1,1,1,2],"contig":0},{"name":"切饼·08","den":6,"need":[3,3],"contig":0},{"name":"切饼·09","den":6,"need":[2,2,2],"contig":0},{"name":"切饼·10","den":6,"need":[1,2,3],"contig":0},{"name":"切饼·11","den":6,"need":[4,1,1],"contig":0},{"name":"切饼·12","den":6,"need":[1,1,1,3],"contig":0},{"name":"切饼·13","den":7,"need":[2,2,3],"contig":0},{"name":"切饼·14","den":7,"need":[1,3,3],"contig":0},{"name":"切饼·15","den":7,"need":[1,1,2,3],"contig":1},{"name":"切饼·16","den":7,"need":[3,2,2],"contig":1},{"name":"切饼·17","den":8,"need":[4,4],"contig":1},{"name":"切饼·18","den":8,"need":[2,2,4],"contig":1},{"name":"切饼·19","den":8,"need":[1,3,4],"contig":1},{"name":"切饼·20","den":8,"need":[2,3,3],"contig":1},{"name":"切饼·21","den":8,"need":[1,1,2,4],"contig":1},{"name":"切饼·22","den":8,"need":[1,1,3,3],"contig":1},{"name":"切饼·23","den":9,"need":[3,3,3],"contig":1},{"name":"切饼·24","den":9,"need":[2,3,4],"contig":1},{"name":"切饼·25","den":9,"need":[1,4,4],"contig":1},{"name":"切饼·26","den":9,"need":[1,2,6],"contig":1},{"name":"切饼·27","den":9,"need":[1,1,3,4],"contig":1},{"name":"切饼·28","den":9,"need":[2,2,2,3],"contig":1},{"name":"切饼·29","den":10,"need":[5,5],"contig":1},{"name":"切饼·30","den":10,"need":[2,3,5],"contig":1},{"name":"切饼·31","den":10,"need":[4,4,2],"contig":1},{"name":"切饼·32","den":10,"need":[1,4,5],"contig":1},{"name":"切饼·33","den":10,"need":[2,2,3,3],"contig":1},{"name":"切饼·34","den":10,"need":[1,1,3,5],"contig":1},{"name":"切饼·35","den":11,"need":[3,4,4],"contig":1},{"name":"切饼·36","den":11,"need":[2,4,5],"contig":1},{"name":"切饼·37","den":11,"need":[1,2,3,5],"contig":1},{"name":"切饼·38","den":12,"need":[4,4,4],"contig":1},{"name":"切饼·39","den":12,"need":[3,4,5],"contig":1},{"name":"切饼·40","den":12,"need":[2,3,3,4],"contig":1}];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.den)||d.den<4||d.den>12)return false;
  if(!Array.isArray(d.need)||d.need.length<2||d.need.length>5)return false;
  var sum=0,i;
  for(i=0;i<d.need.length;i++){
    if(!Number.isInteger(d.need[i])||d.need[i]<1||d.need[i]>d.den)return false;
    sum+=d.need[i];
  }
  if(sum!==d.den)return false;      // 需求之和必须等于整饼
  if(d.contig!==0&&d.contig!==1)return false;
  return true;
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    var ck=d.den+"|"+d.need.join(",")+"|"+d.contig;
    if(seen[ck])return null;seen[ck]=1;
    list.push({name:String(d.name),den:d.den,need:d.need.slice(),contig:d.contig});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData))LEVELS=list;
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      loadLevel(lv);resize();
    }
  }).catch(function(){});
}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

/* ---------- 引擎：环形连续判定（过渡次数 ≤2 即为一段弧） ---------- */
function contigOk(assign,den){
  var idx=[];
  for(var i=0;i<den;i++)if(assign[i]>=0)idx.push(i);
  if(!idx.length)return false;
  if(idx.length===den)return true;
  var transitions=0;
  for(i=0;i<den;i++){
    var a=assign[i]>=0,b=assign[(i+1)%den]>=0;
    if(a!==b)transitions++;
  }
  return transitions<=2;
}
function personOk(p){
  var cnt=0,i;
  for(i=0;i<den;i++)if(assign[i]===p)cnt++;
  if(cnt!==need[p])return false;
  if(L&&L.contig){
    var mine=[];
    for(i=0;i<den;i++)if(assign[i]===p)mine.push(i);
    if(mine.length===den)return true;
    var t=0;
    for(i=0;i<den;i++){
      var a=assign[i]===p,b=assign[(i+1)%den]===p;
      if(a!==b)t++;
    }
    if(t>2)return false;
  }
  return true;
}
function satisfiedCount(){
  var n=0;
  for(var p=0;p<need.length;p++)if(personOk(p))n++;
  return n;
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,den=4,need=[],assign=[],selP=0,over=false,won=false,hist=[];
var cv=document.getElementById("cv"),ctx=cv.getContext("2d"),W=0;
var PAL={};
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(x){
  lv=Math.max(0,Math.min(x,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  den=L.den;need=L.need.slice();
  assign=new Array(den).fill(-1);
  selP=0;over=false;won=false;hist=[];
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=den+" 块 · "+need.length+" 位客人"+(L.contig?" · 要求连片":"");
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("footContig").style.display=L.contig?"":"none";
  buildPersons();updStats();resize();
  say("选一位客人 → 点披萨块分给他/她（再点可收回）");
}
function buildPersons(){
  var box=$("persons");
  box.innerHTML="";
  for(var p=0;p<need.length;p++){
    (function(p){
      var b=document.createElement("button");
      b.className="pp";
      b.id="pp"+p;
      b.addEventListener("click",function(){selP=p;renderPersons();draw();});
      box.appendChild(b);
    })(p);
  }
  renderPersons();
}
function renderPersons(){
  for(var p=0;p<need.length;p++){
    var b=$("pp"+p),cnt=0,i;
    for(i=0;i<den;i++)if(assign[i]===p)cnt++;
    var okk=personOk(p);
    b.className="pp"+(p===selP?" sel":"")+(okk?" ok":"");
    b.textContent="客人"+(p+1)+" 要 "+need[p]+"/"+den+"（已 "+cnt+"）"+(okk?" ✓":"");
  }
}
function updStats(){
  var free=0,i;
  for(i=0;i<den;i++)if(assign[i]<0)free++;
  $("stDone").textContent=satisfiedCount()+"/"+need.length;
  $("stFree").textContent=free;
  $("btnUndo").disabled=!hist.length||over;
}
function tapSlice(i){
  if(over)return;
  if(assign[i]===selP){hist.push({a:assign.slice()});assign[i]=-1;updStats();renderPersons();draw();return;}
  if(assign[i]>=0){say("这块已经分给客人"+(assign[i]+1)+"了，先点他/她收回");return;}
  hist.push({a:assign.slice()});
  assign[i]=selP;
  updStats();renderPersons();draw();
  if(satisfiedCount()===need.length){endGame(true);return;}
  var cnt=0,k;
  for(k=0;k<den;k++)if(assign[k]===selP)cnt++;
  if(cnt>need[selP])say("客人"+(selP+1)+"已经够了，多拿的块要收回");
  else if(L.contig&&!personOk(selP))say("客人"+(selP+1)+"的块要连成一片（环形也算）");
  else say("已分给客人"+(selP+1)+" · "+satisfiedCount()+"/"+need.length+" 位客人满足");
}
function endGame(w){
  over=true;won=w;
  if(w&&lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:w?lv+1:lv,metricExtra:hist.length}).catch(function(){});
  $("ovTitle").textContent=w?(lv>=LEVELS.length-1?"全部通关！":"过关！"):"还没分完";
  $("ovDesc").innerHTML=w?"整块披萨全部分配完毕，每位客人都拿到了自己的分数！"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":""):"还有客人没满足。";
  $("ovBtn").textContent=w?(lv>=LEVELS.length-1?"回到第 1 关":"下一关"):"继续";
  $("overlay").classList.add("show");updStats();
}
function undo(){
  if(!hist.length||over)return;
  var h=hist.pop();
  assign=h.a.slice();
  updStats();renderPersons();draw();say("已撤销");
}
function autoAssign(){
  if(over)return;
  var p=selP;
  if(personOk(p)){say("客人"+(p+1)+"已经满足了");return;}
  var cnt=0,k;
  for(k=0;k<den;k++)if(assign[k]===p)cnt++;
  var needMore=need[p]-cnt;
  if(needMore<=0){say("先收回一些块（点自己已分的块）");return;}
  /* 找连续 needMore 个空块（环形） */
  for(var s=0;s<den;s++){
    var okArc=true;
    for(k=0;k<needMore;k++){
      if(assign[(s+k)%den]>=0){okArc=false;break;}
    }
    if(okArc){
      hist.push({a:assign.slice()});
      for(k=0;k<needMore;k++)assign[(s+k)%den]=p;
      updStats();renderPersons();draw();
      if(satisfiedCount()===need.length){endGame(true);return;}
      say("已自动配给客人"+(p+1)+" "+needMore+" 块");
      return;
    }
  }
  say("没有连成一片的空块了，先收回一些再试");
}
/* ---------- 绘制 ---------- */
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(k){return s.getPropertyValue(k).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),warning:v("--g-warning"),crust:v("--g-surface2"),
    i1:v("--g-st-i1"),i2:v("--g-st-i2"),i3:v("--g-st-i3"),i4:v("--g-st-i4"),i5:v("--g-st-i5"),i6:v("--g-st-i6")};
}
window.__gOnTheme=function(){palLoad();draw();};
function pcolor(p){
  var cols=[PAL.i1,PAL.i2,PAL.i3,PAL.i4,PAL.i5,PAL.i6];
  return cols[p%cols.length];
}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(220,Math.min(w,470));
  cv.style.height=W+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(W*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
function draw(){
  if(!ctx||!assign)return;
  var R=W*0.42,cx=W/2,cy=W/2,i;
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,W);
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx,cy,R+6,0,7);ctx.stroke();
  for(i=0;i<den;i++){
    var a0=-Math.PI/2+i*2*Math.PI/den,a1=a0+2*Math.PI/den;
    ctx.beginPath();
    ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();
    var owner=assign[i];
    ctx.fillStyle=owner>=0?pcolor(owner):PAL.crust;
    ctx.fill();
    ctx.strokeStyle=PAL.surface;ctx.lineWidth=2;ctx.stroke();
  }
  ctx.fillStyle=PAL.surface;
  ctx.beginPath();ctx.arc(cx,cy,R*0.18,0,7);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx,cy,R*0.18,0,7);ctx.stroke();
  ctx.fillStyle=PAL.text;
  ctx.font="700 16px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(den+" 块",cx,cy);
  /* 选中客人的需求弧示意 */
  if(!over&&need[selP]){
    ctx.strokeStyle=pcolor(selP);ctx.lineWidth=3;
    var half=need[selP]*2*Math.PI/den/2;
    var mid=-Math.PI/2-2*Math.PI/den/2;
    ctx.beginPath();ctx.arc(cx,cy,R+12,mid-half,mid+half);ctx.stroke();
  }
}
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  var cx=W/2,cy=W/2,R=W*0.42;
  var dx=x-cx,dy=y-cy;
  var d=Math.sqrt(dx*dx+dy*dy);
  if(d>R*1.12||d<R*0.18)return;
  var a=(Math.atan2(dy,dx)+Math.PI/2+2*Math.PI)%(2*Math.PI);
  var i=Math.floor(a/(2*Math.PI/den))%den;
  tapSlice(i);
});
cv.addEventListener("pointercancel",function(){});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",autoAssign);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(!over)openLevelSelect();});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(over){if(won&&lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0);}else loadLevel(won?lv+1:lv);}
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"||k==="ArrowRight"){
    selP=(selP+(k==="ArrowRight"?1:need.length-1))%need.length;
    renderPersons();draw();e.preventDefault();
  }
  else if(k===" "||k==="Enter"){
    if($("overlay").classList.contains("show")){$("ovBtn").click();}
    else autoAssign();
    e.preventDefault();
  }
  else if(k==="u"||k==="U")undo();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
window.addEventListener("resize",resize);
/* ---------- 切后台：纯事件驱动重绘（无计时/AI，不适用暂停逻辑） ---------- */
document.addEventListener("visibilitychange",function(){
  if(!document.hidden)draw();
});
/* ---------- 内嵌独立验证器（锚点用例 + 引擎一致性 + 40 关全量复核） ---------- */
function selfTest(){
  var total=0,ok=0,fails=[];
  function chk(c,name){total++;if(c)ok++;else fails.push(name);}
  chk(DEFAULT_LEVELS.length===40,"关卡数=40");
  chk(DEFAULT_LEVELS.every(validLevelData),"关卡配置合法（需求和=den）");
  /* 锚点①：环形连续判定（手推） */
  chk(contigOk([0,1,2,-1,-1,-1],6)===true,"锚点:连续弧真");
  chk(contigOk([0,-1,2,-1,4,-1],6)===false,"锚点:三段散块假");
  chk(contigOk([-1,-1,-1,-1,-1,-1],6)===false,"锚点:空盘假");
  chk(contigOk([1,1,1,1,1,1],6)===true,"锚点:全满真");
  chk(contigOk([1,1,-1,-1,1,1],6)===true,"锚点:环形绕回真");
  chk(contigOk([1,1,-1,1,1,-1],6)===false,"锚点:双段假");
  /* 锚点②：满足判定——den=6 need [3,2,1]，客人0 {0,1,2} 满足；客人1 {3,4} 满足；客人2 {5} 满足 → 全胜 */
  (function(){
    var keepDen=den,keepNeed=need,keepAssign=assign,keepContig=L?L.contig:0;
    den=6;need=[3,2,1];assign=[0,0,0,1,1,2];L={contig:0};
    chk(personOk(0)&&personOk(1)&&personOk(2),"锚点:标准分配三人满足");
    chk(satisfiedCount()===3,"锚点:满分配胜利判定");
    /* 多拿一块不满足 */
    assign=[0,0,0,0,1,2];
    chk(!personOk(0),"锚点:超额不满足");
    /* 连片要求：客人0 拿 {0,2,4} 不满足 */
    L={contig:1};assign=[0,-1,0,-1,0,1];
    chk(!personOk(0),"锚点:散块不满足");
    assign=[0,0,0,-1,1,1];
    chk(personOk(0),"锚点:连片满足");
    den=keepDen;need=keepNeed;assign=keepAssign;L={contig:keepContig};
  })();
  /* 40 关全量：贪心可解性（无连片：顺序贪心；连片：每人取连续弧） */
  (function(){
    var allOk=true;
    for(var li=0;li<LEVELS.length;li++){
      var d=LEVELS[li];
      if(!validLevelData(d)){allOk=false;break;}
      var a=new Array(d.den).fill(-1),p;
      for(p=0;p<d.need.length;p++){
        var placed=0;
        for(var s=0;s<d.den&&placed<d.need[p];s++){
          if(a[s]<0){a[s]=p;placed++;}
        }
        if(placed<d.need[p]){allOk=false;break;}
        if(d.contig){
          /* 连片时重排：每人占一段弧（贪心弧摆放） */
          a=new Array(d.den).fill(-1);
          var pos=0;
          for(var q=0;q<d.need.length;q++){
            for(var t=0;t<d.need[q];t++){a[pos%d.den]=q;pos++;}
          }
          break;
        }
      }
      if(d.contig){
        /* 校验弧摆放下每人满足 */
        var saveDen=den,saveNeed=need,saveAssign=assign,saveL=L;
        den=d.den;need=d.need;assign=a;L={contig:1};
        for(p=0;p<d.need.length;p++)if(!personOk(p)){allOk=false;break;}
        den=saveDen;need=saveNeed;assign=saveAssign;L={contig:saveL.contig};
        if(!allOk)break;
      }
    }
    chk(allOk,"40关:贪心/弧摆放可解");
  })();
  window.__gSelfTest={ok:ok,total:total,fails:fails};
  if(fails.length)say("警告：内嵌自检未全过（"+ok+"/"+total+"）");
}
/* ---------- 启动（续玩：从存档关卡起步） ---------- */
palLoad();loadLevel(save.lv);selfTest();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
