var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!verifyLevel(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return verifyLevel(d)})){
      LEVELS=list.map(normalizeLevel);return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
    }
  }).catch(function(){});
}

function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}

function syncSaveFromServer(){

    if(!res||!res.stateJson)return;

      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}

/* 剪线拆弹独立验证器：排列全枚举（N≤6 → ≤720），须恰有一个满足全部线索的剪序 */
function fcParse(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return null;
  if(typeof d.name!=="string"||!d.name.trim())return null;
  if(!Array.isArray(d.wires)||d.wires.length<4||d.wires.length>6)return null;
  var names={};
  for(var i=0;i<d.wires.length;i++){
    if(typeof d.wires[i]!=="string"||!d.wires[i]||d.wires[i].length>2||names[d.wires[i]])return null;
    names[d.wires[i]]=1;
  }
  var N=d.wires.length;
  if(!Array.isArray(d.clues)||!d.clues.length||d.clues.length>10)return null;
  var TYPES=["before","pos","notpos","adj","next"];
  for(i=0;i<d.clues.length;i++){
    var c=d.clues[i];
    if(!c||typeof c!=="object"||Array.isArray(c))return null;
    if(TYPES.indexOf(c.t)<0)return null;
    if(!Number.isInteger(c.a)||c.a<0||c.a>=N)return null;
    if((c.t==="before"||c.t==="adj"||c.t==="next")){
      if(!Number.isInteger(c.b)||c.b<0||c.b>=N||c.b===c.a)return null;
    }
    if(c.t==="pos"||c.t==="notpos"){
      if(!Number.isInteger(c.k)||c.k<1||c.k>N)return null;
    }
    if(c.t==="pos"&&c.b!==undefined)return null;
  }
  return {name:d.name,wires:d.wires.slice(),clues:d.clues.map(function(c){return JSON.parse(JSON.stringify(c))}),N:N};
}
function fcCheck(cl,order){
  // order[wireIdx]=剪序位置（1 起）
  var a=cl.a,b=cl.b,k=cl.k;
  if(cl.t==="before")return order[a]<order[b];
  if(cl.t==="pos")return order[a]===k;
  if(cl.t==="notpos")return order[a]!==k;
  if(cl.t==="adj")return Math.abs(order[a]-order[b])===1;
  if(cl.t==="next")return order[b]===order[a]+1;
  return false;
}
/* 全排列枚举：返回满足全部线索的剪序数量与首个解 */
function fcSolve(p,partial){
  var N=p.N,order=[],used=[];
  for(var i=0;i<N;i++){order.push(-1);used.push(false);}
  // partial：{posOf: {wireIdx: position}} 或 null
  var posOf=null;
  if(partial){
    posOf={};
    for(var w in partial)posOf[w]=partial[w];
  }
  var count=0,first=null;
  function dfs(d){
    if(count>1)return;
    if(d===N){
      var seq=[];
      for(var j=0;j<N;j++)seq[order[j]-1]=j;
      for(j=0;j<p.clues.length;j++)if(!fcCheck(p.clues[j],order))return;
      count++;
      if(!first)first=seq.slice();
      return;
    }
    for(var w=0;w<N;w++){
      if(used[w])continue;
      if(posOf&&posOf[w]!==undefined&&posOf[w]!==d+1)continue;
      used[w]=true;order[w]=d+1;
      // 提前剪枝：与该线相关的线索若已可判且必假则跳过
      var ok=true;
      for(var ci=0;ci<p.clues.length&&ok;ci++){
        var cl=p.clues[ci];
        var needA=order[cl.a]>0;
        var needB=(cl.b!==undefined)?order[cl.b]>0:false;
        if(cl.t==="before"&&needA&&needB&&order[cl.a]>=order[cl.b])ok=false;
        if(cl.t==="adj"&&needA&&needB&&Math.abs(order[cl.a]-order[cl.b])!==1)ok=false;
        if(cl.t==="next"&&needA&&needB&&order[cl.b]!==order[cl.a]+1)ok=false;
        if(cl.t==="next"&&needA&&order[cl.a]===N)ok=false;
      }
      if(ok)dfs(d+1);
      used[w]=false;order[w]=-1;
    }
  }
  dfs(0);
  return {count:count,first:first};
}
function verifyLevel(d){
  var p=fcParse(d);
  if(!p)return false;
  var s=fcSolve(p,null);
  return s.count===1&&!!s.first;
}
function normalizeLevel(d){
  var p=fcParse(d);
  return {name:String(d.name),wires:p.wires,clues:p.clues,
    difficulty:Math.min(9,Math.max(1,Number.isInteger(d.difficulty)?d.difficulty:5))};
}
//__VERIFY__END

/* 局面侧线索评估（与验证器不同实现：基于部分剪序推断 satisfied/violated/pending） */
function clueStatus(c){
  var pa=cutOrder.indexOf(c.a),pb=c.b!==undefined?cutOrder.indexOf(c.b):-2;
  var hasA=pa>=0,hasB=pb>=0;
  if(c.t==="before"){
    if(hasA&&hasB)return pa<pb?1:-1;
    return 0;
  }
  if(c.t==="pos")return hasA?(pa+1===c.k?1:-1):0;
  if(c.t==="notpos")return hasA?(pa+1!==c.k?1:-1):0;
  if(c.t==="adj"){
    if(hasA&&hasB)return Math.abs(pa-pb)===1?1:-1;
    return 0;
  }
  if(c.t==="next"){
    if(hasA&&hasB)return pb===pa+1?1:-1;
    if(hasA&&pa===N-1)return -1;
    return 0;
  }
  return 0;
}
function violatedClue(){
  for(var i=0;i<clues.length;i++)if(clueStatus(clues[i])<0)return i;
  return -1;
}
function render(){
  var box=$("wires");
  box.innerHTML="";
  for(var i=0;i<N;i++){
    (function(i){
      var b=document.createElement("button");
      b.type="button";
      b.className="wire"+(cutOrder.indexOf(i)>=0?" cut":"")+(cur===i&&!done?" cur":"");
      b.setAttribute("aria-label",wires[i]+"线");
      var cutN=cutOrder.indexOf(i);
      b.innerHTML='<span class="cap"></span>'+
        (cutN>=0?'<span class="ord">'+(cutN+1)+'</span>':"")+
        '<span class="bar" style="--wc:'+WCOLS[i]+'"></span>'+
        (cutN>=0?'<span class="gap"></span>':"")+
        '<span class="tag">'+wires[i]+'</span>';
      b.addEventListener("click",function(){cutWire(i)});
      box.appendChild(b);
    })(i);
  }
  var cl=$("clues");
  cl.innerHTML="";
  for(i=0;i<clues.length;i++){
    var d=document.createElement("div");
    var st=clueStatus(clues[i]);
    d.className="clue"+(st>0?" ok":(st<0?" bad":""));
    d.textContent=clueText(clues[i]);
    cl.appendChild(d);
  }
  $("stCut").textContent=cutOrder.length+"/"+N;
  $("btnUndo").disabled=!cutOrder.length||done;
}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  var p=fcParse(L);
  if(!p){say("关卡数据异常");return;}
  N=p.N;wires=p.wires;clues=p.clues;
  cutOrder=[];done=false;failed=false;cur=0;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=N+" 根线 · "+clues.length+" 条线索 · 唯一剪序";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stBoom").textContent=booms;
  say("读线索，按顺序点线剪断；剪错一条就爆炸");
  render();
}
function cutWire(i){
  if(done)return;
  if(failed){say("先撤销或重开");return;}
  if(cutOrder.indexOf(i)>=0){say("这根已经剪了");return;}
  cutOrder.push(i);
  var bad=violatedClue();
  render();
  if(bad>=0){
    failed=true;booms++;save.boom=booms;persist();
    $("stBoom").textContent=booms;
    if(!window.__gRM){
      var bomb=$("bomb");
      bomb.classList.remove("shake");
      void bomb.offsetWidth;
      bomb.classList.add("shake");
    }
    $("ovTitle").textContent="爆炸！";
    $("ovDesc").textContent="第 "+cutOrder.length+" 剪违反了线索："+clueText(clues[bad]);
    setOvBtn("重开本关","rotate");
    $("ovUndo").hidden=false;
    $("overlay").classList.add("show");
    return;
  }
  if(cutOrder.length===N)winLevel();
  else say("已剪 "+cutOrder.length+"/"+N+" · 继续推理");
}
function undo(){
  if(!cutOrder.length||done)return;
  cutOrder.pop();
  failed=false;
  hideOverlay();
  render();say("已撤销");
}
function hint(){
  if(done||failed)return;
  var partial={};
  for(var i=0;i<cutOrder.length;i++)partial[cutOrder[i]]=i+1;
  var p=fcParse(L);
  var s=fcSolve(p,partial);
  if(!s.count){say("内嵌验证器：当前剪序已无解，撤销几步再试");return;}
  var nxt=s.first[cutOrder.length];
  cur=nxt;
  render();
  say("验证器建议下一根剪「"+wires[nxt]+"」");
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:booms}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部拆除！":"拆除成功！";
  $("ovDesc").innerHTML=N+" 根线全部按线索剪对"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  setOvBtn((lv>=LEVELS.length-1)?"回到第 1 关":"下一关",(lv>=LEVELS.length-1)?"rotate":"arrow-right");
  $("ovUndo").hidden=true;
  $("overlay").classList.add("show");
}
/* ---------- 输入 ---------- */
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(done)return;openLevelSelect()});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(failed){failed=false;loadLevel(lv);return;}
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
$("ovUndo").addEventListener("click",function(){
  hideOverlay();
  undo();
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if($("overlay").classList.contains("show"))return;   // 覆盖层内按钮自行处理
  if(k==="ArrowUp"||k==="ArrowLeft"){cur=(cur+N-1)%N;render();e.preventDefault();}
  else if(k==="ArrowDown"||k==="ArrowRight"){cur=(cur+1)%N;render();e.preventDefault();}
  else if(k===" "||k==="Enter"){cutWire(cur);e.preventDefault();}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
/* ---------- 启动：逐关独立复核，非唯一解的关不入表 ---------- */
(function(){
  var ok=[];
  for(var i=0;i<LEVELS.length;i++){
    var pass=false;
    try{pass=verifyLevel(LEVELS[i])}catch(e){pass=false}
    if(pass)ok.push(LEVELS[i]);
  }
  if(ok.length)LEVELS=ok;
})();
wcolLoad();loadLevel(save.lv);updLegend();setOvBtn("下一关","arrow-right");
syncLevelsFromServer();syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
/* 工具按钮图标注入（内联 SVG，零外链；一次性注入，后续不改文案） */
(function(){
  function $(id){return document.getElementById(id)}
  var map=[["btnUndo","undo"],["btnHint","bulb"],["btnReset","rotate"],["btnLv","grid"],["ovUndo","undo"]];
  for(var i=0;i<map.length;i++){var el=$(map[i][0]);if(el)el.insertAdjacentHTML("afterbegin",window.SW_ICON(map[i][1]));}
})();
</script>
