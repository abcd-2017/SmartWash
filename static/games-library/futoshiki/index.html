  if(!Number.isInteger(d.n)||d.n<4||d.n>6)return false;

  for(i=0;i<d.n;i++){
    if(typeof d.g[i]!=="string"||d.g[i].length!==d.n||/[^0-9]/.test(d.g[i]))return false;

  for(i=0;i<d.n-1;i++){
    if(typeof d.v[i]!=="string"||d.v[i].length!==d.n||/[^0<>]/.test(d.v[i]))return false;

  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");

  }catch(e){}

}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;

    var list=parseDbLevels(res);

function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});

var save=loadSave();
function syncSaveFromServer(){

function openLevelSelect(){

function hideOverlay(){$("overlay").classList.remove("show")}

/* ---------- 求解器（独立实现）：统计解数（上限 2） ---------- */
function countSolutions(n,given,h,v,cap){
  var count=0,nodes=0;
  var usedR=[],usedC=[];
  for(var r=0;r<n;r++){usedR.push(new Array(n+1).fill(false));usedC.push(new Array(n+1).fill(false));}
  var grid=[];
  for(r=0;r<n;r++)grid.push(given[r].split("").map(Number));
  for(r=0;r<n;r++)for(var c=0;c<n;c++){if(grid[r][c]){usedR[r][grid[r][c]]=true;usedC[c][grid[r][c]]=true;}}
  function bt(idx){
    if(count>=cap||nodes>200000)return;
    nodes++;
    if(idx===n*n){count++;return;}
    var rr=Math.floor(idx/n),cc=idx%n;
    if(grid[rr][cc]){bt(idx+1);return;}
    for(var val=1;val<=n;val++){
      if(usedR[rr][val]||usedC[cc][val])continue;
      var ok=true;
      if(cc>0&&h[rr][cc-1]==="<"&&grid[rr][cc-1]&&grid[rr][cc-1]>=val)ok=false;
      if(ok&&cc>0&&h[rr][cc-1]===">"&&grid[rr][cc-1]&&grid[rr][cc-1]<=val)ok=false;
      if(ok&&cc<n-1&&h[rr][cc]==="<"&&grid[rr][cc+1]&&grid[rr][cc+1]<=val)ok=false;
      if(ok&&cc<n-1&&h[rr][cc]===">"&&grid[rr][cc+1]&&grid[rr][cc+1]>=val)ok=false;
      if(ok&&rr>0&&v[rr-1][cc]==="<"&&grid[rr-1][cc]&&grid[rr-1][cc]>=val)ok=false;
      if(ok&&rr>0&&v[rr-1][cc]===">"&&grid[rr-1][cc]&&grid[rr-1][cc]<=val)ok=false;
      if(ok&&rr<n-1&&v[rr][cc]==="<"&&grid[rr+1][cc]&&grid[rr+1][cc]<=val)ok=false;
      if(ok&&rr<n-1&&v[rr][cc]===">"&&grid[rr+1][cc]&&grid[rr+1][cc]>=val)ok=false;
      if(!ok)continue;
      grid[rr][cc]=val;usedR[rr][val]=true;usedC[cc][val]=true;
      bt(idx+1);
      grid[rr][cc]=0;usedR[rr][val]=false;usedC[cc][val]=false;
      if(count>=cap)return;
    }
  }
  bt(0);
  return count;
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,n=4,user=[],given=[],hist=[],sel=0,over=false,won=false;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(x){
  lv=Math.max(0,Math.min(x,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  n=L.n;
  given=[];user=[];
  for(var r=0;r<n;r++){
    given.push(L.g[r].split("").map(Number));
    user.push(L.g[r].split("").map(Number));
  }
  hist=[];sel=-1;over=false;won=false;
  var cnt=countSolutions(n,L.g,L.h,L.v,2);
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=n+"阶"+(cnt===1?"":" · ⚠解数"+cnt);
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  buildBoard();buildPad();updStats();
  if(cnt!==1)say("警告：内嵌求解器判定本关解不唯一（数据异常）");
  else say("选格 → 点数字填充；行列不得重复，且要满足全部不等号");
}
function cellEls(){return $("board").querySelectorAll(".cell");}
function buildBoard(){
  var box=$("board");
  box.innerHTML="";
  var cols="";
  for(var c=0;c<n;c++){
    if(c>0)cols+="16px ";
    cols+="1fr ";
  }
  box.style.gridTemplateColumns=cols.trim();
  box.style.gridAutoRows="minmax(44px,auto)";
  var rows=[];
  for(var r=0;r<n;r++){
    rows.push({type:"cell",r:r,c:0});
    for(c=1;c<n;c++){rows.push({type:"chip",r:r,c:c-1,dir:"h"});rows.push({type:"cell",r:r,c:c});}
    /* 行间垂直不等号行：紧跟本行单元格之后，符号落在单元格列上 */
    if(r<n-1){
      for(var vc=0;vc<n;vc++){
        rows.push({type:"vchip",r:r,c:vc});
        if(vc<n-1)rows.push({type:"voff"});
      }
    }
  }
  for(var item=0;item<rows.length;item++){
    (function(item){
      var it=rows[item];
      if(it.type==="chip"){
        var s=document.createElement("span");
        s.className="chip";
        s.id="chip"+it.r+"_"+it.c+"_"+it.dir;
        s.textContent="·";
        box.appendChild(s);
      } else if(it.type==="vchip"){
        var e=document.createElement("span");
        e.className="chip";
        e.id="chip"+it.r+"_"+it.c+"_v";
        e.textContent="·";
        box.appendChild(e);
      } else if(it.type==="voff"){
        var e2=document.createElement("span");e2.className="chip off";box.appendChild(e2);
      } else {
        var b=document.createElement("button");
        b.className="cell";
        b.id="cell"+it.r+"_"+it.c;
        b.setAttribute("aria-label","格"+(it.r+1)+"-"+(it.c+1));
        b.addEventListener("click",function(){sel=it.r*n+it.c;renderAll();});
        box.appendChild(b);
      }
    })(item);
  }
  renderAll();
}
function buildPad(){
  var box=$("pad");
  box.innerHTML="";
  for(var v=1;v<=n;v++){
    (function(v){
      var b=document.createElement("button");
      b.className="key";
      b.textContent=String(v);
      b.addEventListener("click",function(){inputNum(v)});
      box.appendChild(b);
    })(v);
  }
  var clr=document.createElement("button");
  clr.className="key";
  clr.textContent="清";
  clr.addEventListener("click",function(){inputNum(0)});
  box.appendChild(clr);
}
function inputNum(v){
  if(over||sel<0)return;
  var r=Math.floor(sel/n),c=sel%n;
  if(given[r][c]){say("提示格不能改");return;}
  hist.push({i:sel,prev:user[r][c]});
  user[r][c]=v;
  updStats();renderAll();checkWin();
}
function conflicts(){
  var bad={},i,j,count=0;
  for(i=0;i<n;i++){
    var seen={};
    for(j=0;j<n;j++){
      var v=user[i][j];
      if(!v)continue;
      if(seen[v]){bad[i*n+j]=1;bad[i*n+seen[v]]=1;count++;}
      else seen[v]=1;
    }
  }
  for(j=0;j<n;j++){
    var seen2={};
    for(i=0;i<n;i++){
      var v2=user[i][j];
      if(!v2)continue;
      if(seen2[v2]){bad[i*n+j]=1;bad[seen2[v2]*n+j]=1;count++;}
      else seen2[v2]=1;
    }
  }
  var r2,c2;
  for(r2=0;r2<n;r2++)for(c2=0;c2<n-1;c2++){
    var s=L.h[r2][c2],a=user[r2][c2],b=user[r2][c2+1];
    if(s==="<"&&a&&b&&a>=b){bad[r2*n+c2]=1;bad[r2*n+c2+1]=1;count++;}
    if(s===">"&&a&&b&&a<=b){bad[r2*n+c2]=1;bad[r2*n+c2+1]=1;count++;}
  }
  for(r2=0;r2<n-1;r2++)for(c2=0;c2<n;c2++){
    var s2=L.v[r2][c2],a2=user[r2][c2],b2=user[r2+1][c2];
    if(s2==="<"&&a2&&b2&&a2>=b2){bad[r2*n+c2]=1;bad[(r2+1)*n+c2]=1;count++;}
    if(s2===">"&&a2&&b2&&a2<=b2){bad[r2*n+c2]=1;bad[(r2+1)*n+c2]=1;count++;}
  }
  return {bad:bad,count:count};
}
function renderAll(){
  var cells=cellEls();
  var cf=conflicts();
  for(var r=0;r<n;r++)for(var c=0;c<n;c++){
    var b=cells[r*n+c],idx=r*n+c;
    b.className="cell"+(given[r][c]?" fixed":"")+(idx===sel?" sel":"")+(cf.bad[idx]?" bad":"");
    b.textContent=user[r][c]?String(user[r][c]):"";
  }
  for(r=0;r<n;r++)for(c=0;c<n-1;c++){
    var s=L.h[r][c];
    $("chip"+r+"_"+c+"_h").textContent=s==="0"?"·":s;
    $("chip"+r+"_"+c+"_h").className="chip"+(s==="0"?" off":"");
  }
  for(r=0;r<n-1;r++)for(c=0;c<n;c++){
    var s2=L.v[r][c];
    $("chip"+r+"_"+c+"_v").textContent=s2==="0"?"·":s2;
    $("chip"+r+"_"+c+"_v").className="chip"+(s2==="0"?" off":"");
  }
}
function updStats(){
  var blank=0;
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(!user[r][c])blank++;
  $("stBlank").textContent=blank;
  $("stBad").textContent=conflicts().count;
  $("stBad").className="val"+(conflicts().count?" low":"");
  $("btnUndo").disabled=!hist.length||over;
}
function checkWin(){
  var blank=0;
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(!user[r][c])blank++;
  if(blank===0&&conflicts().count===0){
    over=true;won=true;
    if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:hist.length}).catch(function(){});
    $("ovTitle").textContent=(lv>=LEVELS.length-1?"全部通关！":"过关！");
    $("ovDesc").innerHTML="不等号全部成立！共填 "+hist.length+" 步。"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"");
    $("ovBtn").textContent=(lv>=LEVELS.length-1?"回到第 1 关":"下一关");
    $("overlay").classList.add("show");
    updStats();
  }
}
function undo(){
  if(!hist.length||over)return;
  var h=hist.pop();
  user[Math.floor(h.i/n)][h.i%n]=h.prev;
  updStats();renderAll();say("已撤销");
}
function hint(){
  if(over)return;
  if(sel<0){say("先选一个空格");return;}
  var r=Math.floor(sel/n),c=sel%n;
  if(given[r][c]){say("提示格不能改");return;}
  var v=Number(L.sol[sel]);
  hist.push({i:sel,prev:user[r][c]});
  user[r][c]=v;
  updStats();renderAll();checkWin();
  say("已填入正确数字 "+v);
}
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(!over)openLevelSelect();});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(over){if(won&&lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0);}else loadLevel(won?lv+1:lv);}
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowUp"||k==="ArrowDown"||k==="ArrowLeft"||k==="ArrowRight"){
    if(sel<0)sel=Math.floor(n*n/2);
    var r=Math.floor(sel/n),c=sel%n;
    if(k==="ArrowUp")r=Math.max(0,r-1);
    if(k==="ArrowDown")r=Math.min(n-1,r+1);
    if(k==="ArrowLeft")c=Math.max(0,c-1);
    if(k==="ArrowRight")c=Math.min(n-1,c+1);
    sel=r*n+c;e.preventDefault();renderAll();
  }
  else if(/^[1-9]$/.test(k)){inputNum(parseInt(k,10));e.preventDefault();}
  else if(k==="0"||k==="Backspace"){inputNum(0);e.preventDefault();}
  else if(k==="u"||k==="U")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
/* ---------- 内嵌独立验证器（锚点用例 + 40 关全量复核） ---------- */
function selfTest(){
  var total=0,ok=0,fails=[];
  function chk(c,name){total++;if(c)ok++;else fails.push(name);}
  chk(DEFAULT_LEVELS.length===40,"关卡数=40");
  chk(DEFAULT_LEVELS.every(validLevelData),"关卡配置合法");
  /* 锚点①：手排 4 阶拉丁方 + 全部不等号（手算逐项核对）
     1 2 3 4 / 3 4 1 2 / 2 1 4 3 / 4 3 2 1 */
  (function(){
    var g=["1234","3412","2143","4321"];
    var h=["<<<","<><","><0",">>>"];
    var v=["<<>>",">><<","<<>>"];
    var cnt=countSolutions(4,g,h,v,2);
    chk(cnt===1,"锚点:满格题唯一");
    // 挖两格：(0,0) 与 (0,1)，列约束强制回原值
    var g2=["0034","3412","2143","4321"];
    var cnt2=countSolutions(4,g2,h,v,2);
    chk(cnt2===1,"锚点:挖两格仍唯一");
    var g3=["0000","0000","0000","0000"];
    var cnt3=countSolutions(4,g3,h,v,2);
    chk(cnt3>0,"锚点:空盘有解");
  })();
  /* 40 关全量复核：唯一解 + sol 即求解器首解 */
  (function(){
    var allOk=true;
    for(var i=0;i<LEVELS.length;i++){
      var d=LEVELS[i];
      if(!validLevelData(d)){allOk=false;break;}
      var grid=[];
      for(var r=0;r<d.n;r++)grid.push(d.g[r].split("").map(Number));
      // 求解器首解与 sol 比对
      var count=0,first=null;
      var usedR=[],usedC=[];
      for(var rr=0;rr<d.n;rr++){usedR.push(new Array(d.n+1).fill(false));usedC.push(new Array(d.n+1).fill(false));}
      for(rr=0;rr<d.n;rr++)for(var cc=0;cc<d.n;cc++)if(grid[rr][cc]){usedR[rr][grid[rr][cc]]=true;usedC[cc][grid[rr][cc]]=true;}
      function bt(idx){
        if(count>=2)return;
        if(idx===d.n*d.n){if(!first)first=grid.map(function(row){return row.join("")}).join("");count++;return;}
        var r2=Math.floor(idx/d.n),c2=idx%d.n;
        if(grid[r2][c2]){bt(idx+1);return;}
        for(var val=1;val<=d.n;val++){
          if(usedR[r2][val]||usedC[c2][val])continue;
          var ok=true;
          if(c2>0&&d.h[r2][c2-1]==="<"&&grid[r2][c2-1]&&grid[r2][c2-1]>=val)ok=false;
          if(ok&&c2>0&&d.h[r2][c2-1]===">"&&grid[r2][c2-1]&&grid[r2][c2-1]<=val)ok=false;
          if(ok&&c2<d.n-1&&d.h[r2][c2]==="<"&&grid[r2][c2+1]&&grid[r2][c2+1]<=val)ok=false;
          if(ok&&c2<d.n-1&&d.h[r2][c2]===">"&&grid[r2][c2+1]&&grid[r2][c2+1]>=val)ok=false;
          if(ok&&r2>0&&d.v[r2-1][c2]==="<"&&grid[r2-1][c2]&&grid[r2-1][c2]>=val)ok=false;
          if(ok&&r2>0&&d.v[r2-1][c2]===">"&&grid[r2-1][c2]&&grid[r2-1][c2]<=val)ok=false;
          if(ok&&r2<d.n-1&&d.v[r2][c2]==="<"&&grid[r2+1][c2]&&grid[r2+1][c2]<=val)ok=false;
          if(ok&&r2<d.n-1&&d.v[r2][c2]===">"&&grid[r2+1][c2]&&grid[r2+1][c2]>=val)ok=false;
          if(!ok)continue;
          grid[r2][c2]=val;usedR[r2][val]=true;usedC[c2][val]=true;
          bt(idx+1);
          grid[r2][c2]=0;usedR[r2][val]=false;usedC[c2][val]=false;
          if(count>=2)return;
        }
      }
      bt(0);
      if(count!==1||first!==d.sol){allOk=false;break;}
    }
    chk(allOk,"40关:唯一解且sol一致");
  })();
  window.__gSelfTest={ok:ok,total:total,fails:fails};
  if(fails.length)say("警告：内嵌自检未全过（"+ok+"/"+total+"）");
}
/* ---------- 启动（续玩：从存档关卡起步） ---------- */
loadLevel(save.lv);selfTest();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
