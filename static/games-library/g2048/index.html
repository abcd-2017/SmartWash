<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F6F3">
<title>2048</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（台面 / 格槽 / 目标金）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-btn-primary:#17734A;--g-on-primary:#FFFFFF;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-g2048-board1:#1E6B4A;--g-g2048-board2:#123A2C;--g-g2048-cell:#0D2A1F;--g-g2048-gold:#E8B45C;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-g2048-board1:#123A2C;--g-g2048-board2:#0B241A;--g-g2048-cell:#08170F;--g-g2048-gold:#E2A44E;color-scheme:dark }
  :root { --gap: clamp(6px, 2.2vw, 10px); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg);
    color: var(--g-text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--g-surface); border: 1px solid var(--g-border);
    border-radius: var(--g-radius-inner);
    min-width: 78px; padding: 6px 12px; text-align: center; line-height: 1.3;
    box-shadow: var(--g-shadow);
  }
  .score-box .label { display: block; font-size: 12px; color: var(--g-muted); }
  .score-box .val { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .score-box .val.bump { animation: bump .18s ease-out; }
  /* 目标 chip：金丸 = 2048 目标色，三秒读懂「目标是什么」 */
  .target-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
    border-radius: 10px; background: var(--g-primary-soft); color: var(--g-on-soft);
    font-size: 14px; font-weight: 600; white-space: nowrap; flex: none;
  }
  .target-chip .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: var(--g-g2048-gold);
    box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 1px 3px rgba(0,0,0,.28);
  }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .hint { margin: 0; font-size: 14px; color: var(--g-muted); line-height: 1.5; }
  .btn {
    min-height: 44px; padding: 0 16px; flex: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-btn-primary); color: var(--g-on-primary);
    font-size: 16px; font-weight: 600; font-family: inherit;
    cursor: pointer; box-shadow: var(--g-shadow);
    transition: transform .14s ease-out, box-shadow .16s ease-out, background .16s ease-out;
  }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: transparent; color: var(--g-primary-deep); box-shadow: inset 0 0 0 2px var(--g-primary-deep); }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .board-wrap { position: relative; }
  /* 台面（地面 / 边界）：品牌绿「面」渐变 + 顶缘高光 + 内凹底缘 + 卡片投影 */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap);
    padding: var(--gap);
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(155deg, var(--g-g2048-board1), var(--g-g2048-board2));
    border-radius: var(--g-radius);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.14), inset 0 -4px 0 rgba(0,0,0,.26), var(--g-shadow);
    touch-action: none;
  }
  /* 滑动方向反馈：台面整体轻移（transform，轨迹层） */
  .grid.nudge-l { animation: nudgeL .16s ease-out; }
  .grid.nudge-r { animation: nudgeR .16s ease-out; }
  .grid.nudge-u { animation: nudgeU .16s ease-out; }
  .grid.nudge-d { animation: nudgeD .16s ease-out; }
  @keyframes nudgeL { 35% { transform: translateX(-4px); } }
  @keyframes nudgeR { 35% { transform: translateX(4px); } }
  @keyframes nudgeU { 35% { transform: translateY(-4px); } }
  @keyframes nudgeD { 35% { transform: translateY(4px); } }
  /* 格槽（地面）：内凹底 + 顶影 + 底缘亮边 */
  .cell {
    position: relative;
    background: var(--g-g2048-cell);
    border-radius: var(--g-radius-inner);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.32), inset 0 -1px 0 rgba(255,255,255,.06);
    animation: cellIn .3s ease-out both;
    animation-delay: calc(var(--i, 0) * 40ms);
  }
  @keyframes cellIn {
    from { opacity: 0; transform: translateY(6px) scale(.96); }
    to { opacity: 1; transform: none; }
  }
  /* 方块（玩法素材）：顶光 sheen + 内凹底缘 + 落地投影 = 轻立体 */
  .tile {
    position: relative;
    width: 100%; height: 100%;
    border-radius: var(--g-radius-inner);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--tile-ink);
    background-color: var(--tile-base);
    background-image: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.06) 46%, rgba(0,0,0,.10));
    box-shadow: inset 0 2px 0 rgba(255,255,255,.42), inset 0 -3px 0 rgba(0,0,0,.20), 0 4px 10px rgba(0,0,0,.30);
    text-shadow: 0 1px 1px rgba(0,0,0,.16);
  }
  .f1 { font-size: 36px; }
  .f2 { font-size: 28px; }
  .f3 { font-size: 22px; }
  /* 方块素材色：2/4 米白、8–64 暖橙红、128–1024 蓝阶（蓝橙色盲安全、阶内亮度递减可区分）、
     2048 目标金、super 深蓝；字色对各自底 ≥4.5:1，方块体统一走 .tile 的 sheen + 内凹 + 投影 */
  .c2 { --tile-base: #EEE4DA; --tile-ink: #6B6156; }
  .c4 { --tile-base: #E7D7B8; --tile-ink: #6B573A; }
  .c8 { --tile-base: #F2B179; --tile-ink: #4A2A10; }
  .c16 { --tile-base: #F59563; --tile-ink: #3F1F08; }
  .c32 { --tile-base: #F67C5F; --tile-ink: #3A1208; }
  .c64 { --tile-base: #F65E3B; --tile-ink: #2A0803; }
  .c128 { --tile-base: #35709F; --tile-ink: #F4F8FC; }
  .c256 { --tile-base: #2E6390; --tile-ink: #F4F8FC; }
  .c512 { --tile-base: #27557F; --tile-ink: #F4F8FC; }
  .c1024 { --tile-base: #1F466E; --tile-ink: #F4F8FC; }
  /* 目标方块：金面 + 金环 + 金色外发光，棋盘上唯一持续强调的目标 */
  .c2048 { --tile-base: var(--g-g2048-gold); --tile-ink: #3A2A08;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.62), inset 0 -3px 0 rgba(0,0,0,.18), 0 0 0 2px var(--g-g2048-gold), 0 0 18px var(--g-g2048-gold); }
  .csuper { --tile-base: #1C3556; --tile-ink: #F4F8FC; }
  /* 新块落下 pop / 合成 merge 轻弹，均 180ms ease-out */
  .pop { animation: pop .18s ease-out; }
  @keyframes pop {
    from { transform: scale(.35); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .merge { animation: merge .18s ease-out; }
  @keyframes merge {
    0% { transform: scale(1); }
    45% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .overlay {
    position: absolute; inset: 0;
    border-radius: var(--g-radius);
    background: var(--g-scrim);
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 16px; text-align: center;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .ov-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--g-primary-deep); }
  .ov-sub { margin: 0 0 12px; font-size: 14px; color: var(--g-muted); }
  .overlay .btn { min-width: 132px; }
  .foot { margin: 14px 0 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（同时压 animation-duration 与 animation-delay；
     这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
/* SW 图标库：内联 SVG 线性图标（stroke=currentColor，24 viewBox，与 UI 令牌联动） */
window.SW_ICON=function(n,s){s=s||"";var P={
 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>','arrow-left':'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 'arrow-up':'<path d="M12 19V5M6 11l6-6 6 6"/>','arrow-down':'<path d="M12 5v14M6 13l6 6 6-6"/>',
 'rotate':'<path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>',
 'check':'<path d="M4 12.5l5 5L20 6.5"/>','x':'<path d="M6 6l12 12M18 6L6 18"/>',
 'star':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',
 'star-o':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',
 'circle':'<circle cx="12" cy="12" r="5.5"/>','circle-f':'<circle cx="12" cy="12" r="5.5"/>',
 'tri-up':'<path d="M12 5l8 15H4z"/>','tri-down':'<path d="M12 19l-8-15h16z"/>','tri-left':'<path d="M5 12l15-8v16z"/>','tri-right':'<path d="M19 12L4 4v16z"/>',
 'backspace':'<path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z M12.5 9.5l5 5M17.5 9.5l-5 5"/>',
 'swap-h':'<path d="M7 4L3 8l4 4M3 8h14M17 12l4 4-4 4M21 16H7"/>',
 'play':'<path d="M8 5v14l11-7z"/>'
};
var fill={ 'star':1,'circle-f':1,'tri-up':1,'tri-down':1,'tri-left':1,'tri-right':1,'play':1 };
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};

<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<body>
<div class="wrap">
  <header>
    <div class="scores">
      <div class="score-box"><span class="label">分数</span><span class="val" id="score">0</span></div>
      <div class="score-box"><span class="label">最高分</span><span class="val" id="best">0</span></div>
    </div>
    <div class="target-chip" title="目标：合成 2048 方块"><span class="dot" aria-hidden="true"></span>目标 2048</div>
  </header>
  <div class="toolbar">
    <p class="hint">相同数字相撞合并，凑出 2048</p>
    <button class="btn" id="restart">新游戏</button>
  </div>
  <div class="board-wrap">
    <div class="grid" id="grid"></div>
    <div class="overlay" role="dialog" aria-modal="true" id="overlay">
      <p class="ov-title" id="ovTitle" role="status" aria-live="assertive"></p>
      <p class="ov-sub" id="ovSub"></p>
      <button class="btn" id="ovMain">重新开始</button>
      <button class="btn ghost" id="ovMore">继续挑战</button>
    </div>
  </div>
  <p class="foot">操作：触屏滑动 · 键盘 <svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg> <svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg> <svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> <svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg> / WASD</p>
</div>
<script>
"use strict";
(() => {
  /* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
  var GB=(function(){
    var pending={},seq=0;
    window.__gOnGameBridgeResult=function(cbId,ok,payload){
      var cb=pending[cbId];if(!cb)return;
      delete pending[cbId];
      try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
    };
    function call(method,args){
      return new Promise(function(resolve,reject){
        var bridge=window.SmartWashGameBridge;
        if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
        var cbId="gb"+Date.now()+"_"+(++seq);
        pending[cbId]={resolve:resolve,reject:reject};
        try{bridge[method].apply(bridge,args.concat([cbId]));}
        catch(e){delete pending[cbId];reject(e);}
      });
    }
    return {
      available:!!window.SmartWashGameBridge,
      loadState:function(gameKey){return call("loadState",[gameKey]);},
      saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
      reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
      getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
      getLevels:function(gameKey){return call("getLevels",[gameKey]);}
    };
  })();
  const SIZE = 4;
  const WIN_VALUE = 2048;
  const BEST_KEY = "sw_h5_2048_best";
  const SWIPE_MIN = 30; // 滑动判定阈值（px）

  const gridEl = document.getElementById("grid");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlayEl = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovSub = document.getElementById("ovSub");
  const ovMain = document.getElementById("ovMain");
  const ovMore = document.getElementById("ovMore");
  const restartBtn = document.getElementById("restart");

  // localStorage 统一走 try/catch（隐私模式等场景会抛异常，静默降级）
  const store = {
    get(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } },
    set(key, val) { try { window.localStorage.setItem(key, val); } catch (e) { /* 忽略 */ } }
  };

  /* ---------- 账号存档（本地 + 账号双写，账号更优才覆盖） ---------- */
  function persistBest() {
    store.set(BEST_KEY, String(best));
    if (GB.available) GB.saveState("g2048", String(best)).catch(function () {});
  }
  function syncSaveFromServer() {
    if (!GB.available || !GB.loadState) return;
    GB.loadState("g2048").then(function (res) {
      if (!res || !res.stateJson) return;
      try {
        var rb = parseInt(JSON.parse(res.stateJson), 10) || 0;
        if (rb > best) { best = rb; persistBest(); bestEl.textContent = best; lastBest = best; }
      } catch (e) {}
    }).catch(function () {});
  }

  let grid, flagNew, flagMerge;
  let score = 0, startBest = 0, alive = true, wonShown = false;
  let best = parseInt(store.get(BEST_KEY) || "0", 10) || 0;
  let lastScore = -1, lastBest = -1;
  bestEl.textContent = best;
  // 得分 / 最高分轻弹（渲染反馈）
  function bump(el) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
  // 滑动方向反馈：台面整体轻移（transform，轨迹提示）
  function nudge(dir) {
    gridEl.classList.remove("nudge-l", "nudge-r", "nudge-u", "nudge-d");
    void gridEl.offsetWidth;
    gridEl.classList.add("nudge-" + dir);
  }

  // 预建 16 个底格，渲染时只改内容；--i = 行号，入场按行错落
  const cells = [];
  for (let i = 0; i < SIZE * SIZE; i++) {
    const d = document.createElement("div");
    d.className = "cell";
    d.style.setProperty("--i", String(Math.floor(i / SIZE)));
    gridEl.appendChild(d);
    cells.push(d);
  }

  const emptyMatrix = () => Array.from({ length: SIZE }, () => new Array(SIZE).fill(0));

  // 某方向下第 i 条折叠线的格子坐标（按折叠起点排序）
  function lineFor(dir, i) {
    const pts = [];
    for (let k = 0; k < SIZE; k++) {
      if (dir === "left") pts.push([i, k]);
      else if (dir === "right") pts.push([i, SIZE - 1 - k]);
      else if (dir === "up") pts.push([k, i]);
      else pts.push([SIZE - 1 - k, i]);
    }
    return pts;
  }

  function spawn() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) empty.push([r, c]);
      }
    }
    if (!empty.length) return;
    const p = empty[(Math.random() * empty.length) | 0];
    grid[p[0]][p[1]] = Math.random() < 0.9 ? 2 : 4;
    flagNew[p[0]][p[1]] = true;
  }

  function render() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        const cell = cells[r * SIZE + c];
        if (!v) { cell.innerHTML = ""; continue; }
        const cls = v <= 2048 ? "c" + v : "csuper";
        const f = "f" + Math.min(String(v).length, 3);
        const anim = flagNew[r][c] ? " pop" : flagMerge[r][c] ? " merge" : "";
        cell.innerHTML = '<div class="tile ' + cls + " " + f + anim + '">' + v + "</div>";
      }
    }
    if (score !== lastScore) { scoreEl.textContent = score; bump(scoreEl); lastScore = score; }
    if (best !== lastBest) { bestEl.textContent = best; bump(bestEl); lastBest = best; }
  }

  function canSlide() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (!v) return true;
        if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
      }
    }
    return false;
  }

  function maxTile() {
    let m = 0;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (grid[r][c] > m) m = grid[r][c];
    return m;
  }
  // 成绩上报（最高分 desc：越大越好；附最大方块值）
  function reportScore() {
    if (GB.available) GB.reportScore("g2048", { metricValue: best, metricExtra: maxTile() }).catch(function () {});
  }

  function showOverlay(title, sub, withMore) {
    ovTitle.textContent = title;
    ovSub.textContent = sub;
    ovMore.style.display = withMore ? "" : "none";
    overlayEl.classList.add("show");
  }

  const hideOverlay = () => overlayEl.classList.remove("show");

  function afterMove() {
    if (!wonShown && grid.some(row => row.some(v => v >= WIN_VALUE))) {
      alive = false;
      wonShown = true;
      showOverlay("达成 2048！", "当前分数 " + score, true);
      reportScore();
      return;
    }
    if (!canSlide()) {
      alive = false;
      const record = score > startBest && score > 0 ? " · 新纪录" : "";
      showOverlay("游戏结束", "分数 " + score + record, false);
      reportScore();
    }
  }

  function move(dir) {
    if (!alive) return;
    let moved = false, gained = 0;
    const mergeMark = emptyMatrix();
    for (let i = 0; i < SIZE; i++) {
      const pts = lineFor(dir, i);
      const vals = [];
      for (const p of pts) if (grid[p[0]][p[1]]) vals.push(grid[p[0]][p[1]]);
      const out = new Array(SIZE).fill(0);
      const merged = new Array(SIZE).fill(false);
      let j = 0;
      for (let k = 0; k < vals.length; k++) {
        if (k + 1 < vals.length && vals[k] === vals[k + 1]) {
          out[j] = vals[k] * 2;
          merged[j] = true;
          gained += out[j];
          k++; // 同一块每步只合并一次
        } else {
          out[j] = vals[k];
        }
        j++;
      }
      for (let idx = 0; idx < pts.length; idx++) {
        const r = pts[idx][0], c = pts[idx][1];
        if (grid[r][c] !== out[idx]) moved = true;
        grid[r][c] = out[idx];
        if (merged[idx]) mergeMark[r][c] = true;
      }
    }
    if (!moved) return;
    if (gained > 0) {
      score += gained;
      if (score > best) {
        best = score;
        persistBest();
      }
    }
    flagNew = emptyMatrix();
    spawn();
    flagMerge = mergeMark;
    render();
    nudge(dir);
    afterMove();
  }

  function restart() {
    grid = emptyMatrix();
    flagNew = emptyMatrix();
    flagMerge = emptyMatrix();
    score = 0;
    alive = true;
    wonShown = false;
    startBest = best;
    hideOverlay();
    spawn();
    spawn();
    render();
  }

  // 键盘：方向键 + WASD 兜底
  window.addEventListener("keydown", (e) => {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const map = {
      ArrowLeft: "left", ArrowUp: "up", ArrowRight: "right", ArrowDown: "down",
      a: "left", w: "up", d: "right", s: "down"
    };
    const dir = map[key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  // 触屏：touchstart 记录起点，touchend 按主轴位移判定方向
  let sx = 0, sy = 0, tracking = false;
  gridEl.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    sx = t.clientX;
    sy = t.clientY;
    tracking = true;
  }, { passive: true });
  gridEl.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
  gridEl.addEventListener("touchend", (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx;
    const dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
    else move(dy > 0 ? "down" : "up");
  });

  restartBtn.addEventListener("click", (e) => { restart(); e.currentTarget.blur(); });
  ovMain.addEventListener("click", (e) => { restart(); e.currentTarget.blur(); });
  ovMore.addEventListener("click", (e) => { alive = true; hideOverlay(); e.currentTarget.blur(); });

  restart();
  syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  /* 按钮图标注入：文字前内联 SVG（SW_ICON 范式，24 viewBox / currentColor / aria-hidden） */
  function $(id){return document.getElementById(id)}
  $("restart").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
  $("ovMain").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
  $("ovMore").insertAdjacentHTML("afterbegin",window.SW_ICON("play"));
})();
</script>
