<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F6F3">
<title>2048</title>
<style>
  /*token:GAME-THEME.md*/
  :root { --g-bg:#F5F6F3;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-primary:#2D9B6A;--g-on-primary:#FFF;--g-primary-deep:#17734A;--g-scrim:rgba(245,246,243,.9);--g-board:#BBADA0;--g-cell:#EEE4DA59;--g-tilesuper:#3C3A32;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-primary-deep:#5BC894;--g-scrim:rgba(20,22,20,.9);--g-board:#433A32;--g-cell:#FFFFFF12;--g-tilesuper:#6B6E73;color-scheme:dark }
  :root { --gap: clamp(6px, 2.2vw, 10px); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg);
    color: var(--g-text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--g-primary-deep); color: var(--g-on-primary); border-radius: 12px;
    min-width: 78px; padding: 5px 12px; text-align: center; line-height: 1.3;
  }
  .score-box .label { display: block; font-size: 12px; opacity: .85; }
  .score-box .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .hint { margin: 0; font-size: 14px; color: var(--g-muted); }
  .btn {
    min-height: 44px; padding: 0 18px;
    border: 0; border-radius: 10px;
    background: var(--g-primary); color: var(--g-on-primary);
    font-size:22px; font-weight:700; font-family: inherit;
    cursor: pointer;
  }
  .btn:active { opacity: .85; }
  .btn.ghost { background: transparent; color: var(--g-primary-deep); box-shadow: inset 0 0 0 2px var(--g-primary-deep); }
  .board-wrap { position: relative; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap);
    padding: var(--gap);
    width: 100%;
    aspect-ratio: 1;
    background: var(--g-board);
    border-radius: 12px;
    touch-action: none;
  }
  .cell {
    background: var(--g-cell);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .tile {
    width: 100%; height: 100%;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .f1 { font-size: clamp(24px, 8.5vw, 36px); }
  .f2 { font-size: clamp(20px, 7vw, 30px); }
  .f3 { font-size: clamp(15px, 5.4vw, 23px); }
  .c2 { background: #eee4da; color: #776e65; }
  .c4 { background: #ede0c8; color: #776e65; }
  /* 素材色(D2 修订 2026-11-07)：c8–c64 暖段改深棕字（对比 ≥4.5）；
     c128+ 由黄阶改蓝阶——蓝橙为色盲安全对、阶内亮度递减可区分，
     修复绿色盲下 128–2048 ΔE≈0.8 不可分辨与白字 1.4~1.6 对比失效 */
  .c8 { background: #f2b179; color: #5c3a1e; }
  .c16 { background: #f59563; color: #4d2a0e; }
  .c32 { background: #f67c5f; color: #4a1b0c; }
  .c64 { background: #f65e3b; color: #330d06; }
  .c128 { background: #3e7cb8; color: #f9f6f2; }
  .c256 { background: #35699e; color: #f9f6f2; }
  .c512 { background: #2c5685; color: #f9f6f2; }
  .c1024 { background: #24446c; color: #f9f6f2; }
  .c2048 { background: #1c3556; color: #f9f6f2; border: 2px solid rgba(76, 129, 184, .8); box-shadow: 0 2px 12px rgba(0, 0, 0, .28); }
  .csuper { background: var(--g-tilesuper); color: #f9f6f2; }
  .pop { animation: pop .18s ease-out; }
  @keyframes pop {
    from { transform: scale(.3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .overlay {
    position: absolute; inset: 0;
    border-radius: 12px;
    background: var(--g-scrim);
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 16px; text-align: center;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .ov-title { margin: 0; font-size: 22px; font-weight: 700; color: var(--g-primary-deep); }
  .ov-sub { margin: 0 0 12px; font-size: 14px; color: var(--g-muted); }
  .overlay .btn { min-width: 132px; }
  .foot { margin: 14px 0 0; font-size: 12px; color: var(--g-muted); text-align: center; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
/* SW 图标库：内联 SVG 线性图标（stroke=currentColor，24 viewBox，与 UI 令牌联动） */
window.SW_ICON=function(n,s){s=s||"";var P={
 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>','arrow-left':'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 'arrow-up':'<path d="M12 19V5M6 11l6-6 6 6"/>','arrow-down':'<path d="M12 5v14M6 13l6 6 6-6"/>',
 'rotate':'<path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>',
 'check':'<path d="M4 12.5l5 5L20 6.5"/>','x':'<path d="M6 6l12 12M18 6L6 18"/>',
 'star':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',
 'star-o':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',
 'circle':'<circle cx="12" cy="12" r="5.5"/>','circle-f':'<circle cx="12" cy="12" r="5.5"/>',
 'tri-up':'<path d="M12 5l8 15H4z"/>','tri-down':'<path d="M12 19l-8-15h16z"/>','tri-left':'<path d="M5 12l15-8v16z"/>','tri-right':'<path d="M19 12L4 4v16z"/>',
 'backspace':'<path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z M12.5 9.5l5 5M17.5 9.5l-5 5"/>',
 'swap-h':'<path d="M7 4L3 8l4 4M3 8h14M17 12l4 4-4 4M21 16H7"/>'
};
var fill={ 'star':1,'circle-f':1,'tri-up':1,'tri-down':1,'tri-left':1,'tri-right':1 };
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};
</script>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="scores">
      <div class="score-box"><span class="label">分数</span><span class="val" id="score">0</span></div>
      <div class="score-box"><span class="label">最高分</span><span class="val" id="best">0</span></div>
    </div>
  </header>
  <div class="toolbar">
    <p class="hint">相同数字相撞合并，凑出 2048</p>
    <button class="btn" id="restart">新游戏</button>
  </div>
  <div class="board-wrap">
    <div class="grid" id="grid"></div>
    <div class="overlay" id="overlay">
      <p class="ov-title" id="ovTitle" role="status" aria-live="assertive"></p>
      <p class="ov-sub" id="ovSub"></p>
      <button class="btn" id="ovMain">重新开始</button>
      <button class="btn ghost" id="ovMore">继续挑战</button>
    </div>
  </div>
  <p class="foot">操作：触屏滑动 · 键盘 <svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg> <svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg> <svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> <svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg> / WASD</p>
</div>
<script>
"use strict";
(() => {
  /* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
  var GB=(function(){
    var pending={},seq=0;
    window.__gOnGameBridgeResult=function(cbId,ok,payload){
      var cb=pending[cbId];if(!cb)return;
      delete pending[cbId];
      try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
    };
    function call(method,args){
      return new Promise(function(resolve,reject){
        var bridge=window.SmartWashGameBridge;
        if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
        var cbId="gb"+Date.now()+"_"+(++seq);
        pending[cbId]={resolve:resolve,reject:reject};
        try{bridge[method].apply(bridge,args.concat([cbId]));}
        catch(e){delete pending[cbId];reject(e);}
      });
    }
    return {
      available:!!window.SmartWashGameBridge,
      loadState:function(gameKey){return call("loadState",[gameKey]);},
      saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
      reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
      getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
      getLevels:function(gameKey){return call("getLevels",[gameKey]);}
    };
  })();
  const SIZE = 4;
  const WIN_VALUE = 2048;
  const BEST_KEY = "sw_h5_2048_best";
  const SWIPE_MIN = 30; // 滑动判定阈值（px）

  const gridEl = document.getElementById("grid");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlayEl = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovSub = document.getElementById("ovSub");
  const ovMain = document.getElementById("ovMain");
  const ovMore = document.getElementById("ovMore");
  const restartBtn = document.getElementById("restart");

  // localStorage 统一走 try/catch（隐私模式等场景会抛异常，静默降级）
  const store = {
    get(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } },
    set(key, val) { try { window.localStorage.setItem(key, val); } catch (e) { /* 忽略 */ } }
  };

  /* ---------- 账号存档（本地 + 账号双写，账号更优才覆盖） ---------- */
  function persistBest() {
    store.set(BEST_KEY, String(best));
    if (GB.available) GB.saveState("g2048", String(best)).catch(function () {});
  }
  function syncSaveFromServer() {
    if (!GB.available || !GB.loadState) return;
    GB.loadState("g2048").then(function (res) {
      if (!res || !res.stateJson) return;
      try {
        var rb = parseInt(JSON.parse(res.stateJson), 10) || 0;
        if (rb > best) { best = rb; persistBest(); bestEl.textContent = best; }
      } catch (e) {}
    }).catch(function () {});
  }

  let grid, flagNew, flagMerge;
  let score = 0, startBest = 0, alive = true, wonShown = false;
  let best = parseInt(store.get(BEST_KEY) || "0", 10) || 0;
  bestEl.textContent = best;

  // 预建 16 个底格，渲染时只改内容
  const cells = [];
  for (let i = 0; i < SIZE * SIZE; i++) {
    const d = document.createElement("div");
    d.className = "cell";
    gridEl.appendChild(d);
    cells.push(d);
  }

  const emptyMatrix = () => Array.from({ length: SIZE }, () => new Array(SIZE).fill(0));

  // 某方向下第 i 条折叠线的格子坐标（按折叠起点排序）
  function lineFor(dir, i) {
    const pts = [];
    for (let k = 0; k < SIZE; k++) {
      if (dir === "left") pts.push([i, k]);
      else if (dir === "right") pts.push([i, SIZE - 1 - k]);
      else if (dir === "up") pts.push([k, i]);
      else pts.push([SIZE - 1 - k, i]);
    }
    return pts;
  }

  function spawn() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) empty.push([r, c]);
      }
    }
    if (!empty.length) return;
    const p = empty[(Math.random() * empty.length) | 0];
    grid[p[0]][p[1]] = Math.random() < 0.9 ? 2 : 4;
    flagNew[p[0]][p[1]] = true;
  }

  function render() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        const cell = cells[r * SIZE + c];
        if (!v) { cell.innerHTML = ""; continue; }
        const cls = v <= 2048 ? "c" + v : "csuper";
        const f = "f" + Math.min(String(v).length, 3);
        const pop = flagNew[r][c] || flagMerge[r][c] ? " pop" : "";
        cell.innerHTML = '<div class="tile ' + cls + " " + f + pop + '">' + v + "</div>";
      }
    }
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function canSlide() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (!v) return true;
        if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
      }
    }
    return false;
  }

  function maxTile() {
    let m = 0;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (grid[r][c] > m) m = grid[r][c];
    return m;
  }
  // 成绩上报（最高分 desc：越大越好；附最大方块值）
  function reportScore() {
    if (GB.available) GB.reportScore("g2048", { metricValue: best, metricExtra: maxTile() }).catch(function () {});
  }

  function showOverlay(title, sub, withMore) {
    ovTitle.textContent = title;
    ovSub.textContent = sub;
    ovMore.style.display = withMore ? "" : "none";
    overlayEl.classList.add("show");
  }

  const hideOverlay = () => overlayEl.classList.remove("show");

  function afterMove() {
    if (!wonShown && grid.some(row => row.some(v => v >= WIN_VALUE))) {
      alive = false;
      wonShown = true;
      showOverlay("达成 2048！", "当前分数 " + score, true);
      reportScore();
      return;
    }
    if (!canSlide()) {
      alive = false;
      const record = score > startBest && score > 0 ? " · 新纪录" : "";
      showOverlay("游戏结束", "分数 " + score + record, false);
      reportScore();
    }
  }

  function move(dir) {
    if (!alive) return;
    let moved = false, gained = 0;
    const mergeMark = emptyMatrix();
    for (let i = 0; i < SIZE; i++) {
      const pts = lineFor(dir, i);
      const vals = [];
      for (const p of pts) if (grid[p[0]][p[1]]) vals.push(grid[p[0]][p[1]]);
      const out = new Array(SIZE).fill(0);
      const merged = new Array(SIZE).fill(false);
      let j = 0;
      for (let k = 0; k < vals.length; k++) {
        if (k + 1 < vals.length && vals[k] === vals[k + 1]) {
          out[j] = vals[k] * 2;
          merged[j] = true;
          gained += out[j];
          k++; // 同一块每步只合并一次
        } else {
          out[j] = vals[k];
        }
        j++;
      }
      for (let idx = 0; idx < pts.length; idx++) {
        const r = pts[idx][0], c = pts[idx][1];
        if (grid[r][c] !== out[idx]) moved = true;
        grid[r][c] = out[idx];
        if (merged[idx]) mergeMark[r][c] = true;
      }
    }
    if (!moved) return;
    if (gained > 0) {
      score += gained;
      if (score > best) {
        best = score;
        persistBest();
      }
    }
    flagNew = emptyMatrix();
    spawn();
    flagMerge = mergeMark;
    render();
    afterMove();
  }

  function restart() {
    grid = emptyMatrix();
    flagNew = emptyMatrix();
    flagMerge = emptyMatrix();
    score = 0;
    alive = true;
    wonShown = false;
    startBest = best;
    hideOverlay();
    spawn();
    spawn();
    render();
  }

  // 键盘：方向键 + WASD 兜底
  window.addEventListener("keydown", (e) => {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const map = {
      ArrowLeft: "left", ArrowUp: "up", ArrowRight: "right", ArrowDown: "down",
      a: "left", w: "up", d: "right", s: "down"
    };
    const dir = map[key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  // 触屏：touchstart 记录起点，touchend 按主轴位移判定方向
  let sx = 0, sy = 0, tracking = false;
  gridEl.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    sx = t.clientX;
    sy = t.clientY;
    tracking = true;
  }, { passive: true });
  gridEl.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
  gridEl.addEventListener("touchend", (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx;
    const dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
    else move(dy > 0 ? "down" : "up");
  });

  restartBtn.addEventListener("click", (e) => { restart(); e.currentTarget.blur(); });
  ovMain.addEventListener("click", (e) => { restart(); e.currentTarget.blur(); });
  ovMore.addEventListener("click", (e) => { alive = true; hideOverlay(); e.currentTarget.blur(); });

  restart();
  syncSaveFromServer();
})();
</script>
</body>
</html>
