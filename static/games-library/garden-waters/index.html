window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var GW={DT:0.25,RISE:10,FLOW:2.5,KS:0.6,KO:0.35,LEVEL_COUNT:40,
  TYPES:["小葱","薄荷","番茄","绣球","茉莉","兰草"]};
GW.newState=function(lv,bigTank){
  var ms=[],vals=[],stress=[];
  for(var i=0;i<lv.plants.length;i++){ms.push(60);vals.push(false);stress.push(0);}
  return {m:ms,valve:vals,stress:stress,tank:bigTank?1e9:lv.tank,t0:lv.time,dead:-1,maxStress:0,use:0};
};
/* 单步：valves=[bool..]；返回 "run"|"dead"|"done" */
GW.tick=function(st,lv,valves){
  var tankOut=st.tank<=0;
  for(var i=0;i<lv.plants.length;i++){
    var p=lv.plants[i];
    st.valve[i]=!!valves[i]&&!tankOut;
    if(st.valve[i]){st.m[i]+=GW.RISE*GW.DT;st.tank-=GW.FLOW*GW.DT;st.use+=GW.FLOW*GW.DT;}
    st.m[i]-=p.drain*GW.DT;
    if(st.m[i]<0)st.m[i]=0;
    if(st.m[i]<p.lo)st.stress[i]+=(p.lo-st.m[i])*GW.KS*GW.DT;
    else if(st.m[i]>p.hi)st.stress[i]+=(st.m[i]-p.hi)*GW.KO*GW.DT;
    if(st.stress[i]>st.maxStress)st.maxStress=st.stress[i];
    if(st.stress[i]>=100){st.dead=i;return"dead";}
  }
  st.t0-=GW.DT;
  if(st.t0<=0)return"done";
  return"run";
};
/* 参考策略：湿度落进下沿+4 开阀，到上沿-3 关阀（带回差） */
GW.policyValves=function(st,lv){
  var out=[];
  for(var i=0;i<lv.plants.length;i++){
    var p=lv.plants[i];
    if(st.valve[i]){if(st.m[i]>=p.hi-3)out.push(false);else out.push(true);}
    else out.push(st.m[i]<p.lo+4);
  }
  return out;
};
GW.runPolicy=function(lv,bigTank){
  var st=GW.newState(lv,bigTank),r="run";
  while(r==="run")r=GW.tick(st,lv,GW.policyValves(st,lv));
  return st;
};
/* 生成：株数/带宽/蒸腾随关递增；水箱预算=策略用量×1.25+4 */
GW.genLevel=function(no){
  var p=(no-1)/(GW.LEVEL_COUNT-1);
  for(var attempt=0;attempt<10;attempt++){
    var pe=p*(1-attempt*0.07);
    var rng=mulberry32(66200+no*911+attempt*37);
    var n=Math.min(6,3+Math.floor(pe*3.2));
    var width=Math.round(40-pe*18);
    var plants=[];
    for(var i=0;i<n;i++){
      var mid=38+rng()*24;
      var lo=Math.round(mid-width/2),hi=Math.round(mid+width/2);
      plants.push({drain:Math.round((1.0+pe*1.6+rng()*0.8)*100)/100,lo:lo,hi:hi});
    }
    var lv={name:"浇园·"+(no<10?"0":"")+no,time:Math.round(60+pe*30),
      plants:plants,tank:0,difficulty:Math.min(9,1+Math.floor(no/5))};
    var probe=GW.runPolicy(lv,true);
    if(probe.dead>=0)continue;
    lv.tank=Math.ceil(probe.use*1.25)+4;
    var st=GW.runPolicy(lv,false);
    if(st.dead>=0||st.maxStress>60)continue;
    return lv;
  }
  return GW.genLevel(no>1?no-1:1);
};
/* 结构校验 */
GW.validate=function(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return{ok:false,why:"bad"};
  if(!isFinite(d.time)||d.time<30||d.time>120)return{ok:false,why:"time"};
  if(!Array.isArray(d.plants)||d.plants.length<1||d.plants.length>6)return{ok:false,why:"plants"};
  for(var i=0;i<d.plants.length;i++){
    var p=d.plants[i];
    if(!p||typeof p!=="object")return{ok:false,why:"p"+i};
    if(!isFinite(p.drain)||p.drain<0.5||p.drain>4)return{ok:false,why:"drain"+i};
    if(!isFinite(p.lo)||!isFinite(p.hi)||p.lo<10||p.hi>90||p.hi-p.lo<12)return{ok:false,why:"band"+i};
  }
  if(!Number.isInteger(d.tank)||d.tank<10||d.tank>900)return{ok:false,why:"tank"};
  var st=GW.runPolicy(d,false);
  if(st.dead>=0||st.maxStress>70)return{ok:false,why:"unsolvable"};
  return{ok:true,why:"",use:st.use};
};
GW.validateAll=function(){
  var fails=[],i;
  for(i=1;i<=GW.LEVEL_COUNT;i++){
    var L=GW.genLevel(i),r=GW.validate(L);
    if(!r.ok)fails.push(i+"("+r.why+")");
  }
  return {total:GW.LEVEL_COUNT,solvable:GW.LEVEL_COUNT-fails.length,fail:fails};
};
GW.runTests=function(){
  var pass=0,rows=[];
  function ck(name,ok,got){rows.push({name:name,ok:!!ok,got:got});if(ok)pass++;}
  var lv={time:60,tank:500,plants:[{drain:2,lo:40,hi:60},{drain:1,lo:40,hi:60},{drain:3,lo:40,hi:60}]};
  //锚点1：低于下沿，单步旱胁迫 =（lo-(m-drain·dt))×0.6×0.25 = (40-37.5)×0.15 = 0.375
  var st1=GW.newState(lv,false);st1.m[0]=38;
  GW.tick(st1,lv,[false,false,false]);
  ck("锚点·旱胁迫单步 0.375",Math.abs(st1.stress[0]-0.375)<1e-9,st1.stress[0].toFixed(3));
  //锚点2：开阀充足水 → 湿度单步 +(10-2)×0.25=+2.0
  var st2=GW.newState(lv,false);st2.m[0]=38;var m0=st2.m[0];
  GW.tick(st2,lv,[true,false,false]);
  ck("锚点·开阀单步 +2.0",Math.abs((st2.m[0]-m0)-2.0)<1e-9,(st2.m[0]-m0).toFixed(3));
  //锚点3：水箱见底 → 开阀无效只蒸腾
  var st3=GW.newState(lv,false);st3.tank=0;st3.m[0]=38;m0=st3.m[0];
  GW.tick(st3,lv,[true,false,false]);
  ck("锚点·空箱只蒸腾 -0.5",Math.abs((st3.m[0]-m0)-(-0.5))<1e-9,(st3.m[0]-m0).toFixed(3));
  //锚点4：胁迫见顶一拍即死
  var st4=GW.newState(lv,false);st4.m[0]=30;st4.stress[0]=99.8;
  var r4=GW.tick(st4,lv,[false,false,false]);
  ck("锚点·枯死一拍判定",r4==="dead"&&st4.dead===0,"r="+r4);
  //锚点5：策略回放用量可复现
  var st5=GW.runPolicy(lv,false);
  ck("锚点·策略回放存活",st5.dead<0&&st5.use>0,"use="+st5.use.toFixed(1));
  var r=GW.validateAll();
  ck("40 关策略回放全部存活",r.fail.length===0,"fail="+r.fail.join(","));
  var L1=GW.genLevel(1),L2=GW.genLevel(1);
  ck("生成确定性",JSON.stringify(L1)===JSON.stringify(L2),"replay");
  return {total:7,pass:pass,rows:rows,levels:r};
};
globalThis.__XC=GW;
/*XC-CORE-END*/

/* ========== 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ========== */
var GAME_KEY="garden-waters",SAVE_KEY="sw.gardenwaters.v1";
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=GW.LEVEL_COUNT;i++)list.push(GW.genLevel(i));
  return list;
}
var LEVELS=buildDefaultLevels();
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!GW.validate(d).ok)return null;
    var no=parseInt(row.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=1;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return GW.validate(d).ok})){
      LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      if(state==="run")loadLevel(cur);
    }
  }).catch(function(){});
}

/* ========== 存档（本地 + 账号双写，账号更优才覆盖） ========== */
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:parseInt(s.lv,10)||0,best:parseInt(s.best,10)||1}}catch(e){return{lv:0,best:1}}}
var save=loadSave();
var unlocked=clamp(save.best,1,1);
function persist(){
  var data={lv:cur,best:unlocked};
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson||state!=="run")return;
    try{
      var r=JSON.parse(res.stateJson),ch=false;
      var rl=parseInt(r.lv,10),rb=parseInt(r.best,10);
      if(isFinite(rl)&&rl>save.lv&&rl<LEVELS.length){save.lv=rl;ch=true;}
      if(isFinite(rb)&&rb>unlocked&&rb<=LEVELS.length){unlocked=rb;ch=true;}
      if(ch){cur=clamp(save.lv,0,LEVELS.length-1);persist();loadLevel(cur);}
    }catch(e){}
  }).catch(function(){});
}

/* ========== 调色板 ========== */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),
    water:v("--g-water"),soil:v("--g-st-soil"),soil2:v("--g-st-soil2"),
    leaf:v("--g-st-leaf"),pot:v("--g-st-pot")};
}
window.__gOnTheme=function(){palLoad()};
palLoad();

/* ========== 画布与状态 ========== */
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,cur=save.lv,L=null,st=null;
var state="run";
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);var H=240;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",function(){resize();draw();});
function loadLevel(n){
  cur=clamp(n,0,LEVELS.length-1);
  L=LEVELS[cur];
  if(!GW.validate(L).ok){say("关卡数据异常");return;}
  st=GW.newState(L,false);
  state="run";
  $("btnPause").textContent="暂停";
  $("lvTag").textContent="第 "+(cur+1)+" 关 · "+L.name;
  $("lvRule").textContent=L.plants.length+" 株 · 水箱 "+L.tank+"L · 收工 "+L.time+"s";
  say("点植物开/关水阀（或按 1-"+L.plants.length+"），湿度稳在绿区直到收工");
  resize();syncHud();draw();
}
function syncHud(){
  $("stTime").textContent=Math.max(0,st.t0).toFixed(0)+"s";
  $("stTank").textContent=Math.max(0,Math.round(st.tank));
  $("stTank").className="val"+(st.tank<20?" low":"");
  var dry=0,worst=0;
  for(var i=0;i<L.plants.length;i++){
    if(st.m[i]<L.plants[i].lo)dry++;
    if(st.stress[i]>worst)worst=st.stress[i];
  }
  $("stDry").textContent=dry;
  $("stDry").className="val"+(dry>0?" low":"");
  $("stStress").textContent=Math.round(worst);
  $("stStress").className="val"+(worst>60?" low":"");
}
/* ---------- 交互 ---------- */
function toggleValve(i){
  if(state!=="run")return;
  st.valve[i]=!st.valve[i];
  say(GW.TYPES[i%6]+"（第 "+(i+1)+" 株）水阀"+(st.valve[i]?"开":"关"));
  draw();
}
function winLevel(){
  state="done";
  var margin=Math.round(100-st.maxStress);
  if(cur<LEVELS.length-1&&cur+1>save.lv)save.lv=cur+1;
  if(cur+2>unlocked)unlocked=Math.min(LEVELS.length,cur+2);
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:cur+1,metricExtra:margin}).catch(function(){});
  $("ovTitle").textContent=(cur>=LEVELS.length-1)?"全部通关！":"收工！";
  $("ovDesc").innerHTML="全园 "+L.plants.length+" 株安然 · 余水 "+Math.max(0,Math.round(st.tank))+"L · 最差状态 "+Math.round(st.maxStress)+(cur<LEVELS.length-1?"<br>已解锁第 "+(cur+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(cur>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("ovRetry").hidden=true;
  ovMode="win";
  $("overlay").classList.add("show");
}
function failLevel(){
  state="done";
  $("ovTitle").textContent="蔫了一株";
  $("ovDesc").textContent="第 "+(st.dead+1)+" 株没能撑住。湿度条出绿区会积累胁迫，见黄就要浇水，水阀别全开。";
  $("ovBtn").textContent="选关";
  $("ovRetry").hidden=false;
  ovMode="fail";
  $("overlay").classList.add("show");
}
var ovMode="select";
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<unlocked-1?" done":"");
      b.textContent=i+1;
      b.disabled=i>=unlocked;
      b.addEventListener("click",function(){
        cur=i;save.lv=Math.max(save.lv,cur);persist();
        $("overlay").classList.remove("show");
        loadLevel(cur);
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("ovRetry").hidden=true;
  ovMode="select";
  $("overlay").classList.add("show");
}

/* ========== 绘制 ========== */
function draw(){
  ctx.fillStyle=PAL.soil2;ctx.fillRect(0,0,W,240);
  var n=L.plants.length,cw=(W-20)/n;
  for(var i=0;i<n;i++){
    var p=L.plants[i],cx0=10+cw*i+cw/2;
    var mcl=st.m[i]<p.lo?PAL.danger:(st.m[i]>p.hi?PAL.water:PAL.success);
    var scl=st.stress[i]>60?PAL.danger:(st.stress[i]>30?PAL.warning:PAL.leaf);
    //茎叶
    var h=26+st.m[i]*0.16;
    ctx.strokeStyle=scl;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(cx0,168);ctx.lineTo(cx0,168-h);ctx.stroke();
    ctx.fillStyle=scl;
    ctx.beginPath();ctx.ellipse(cx0-7,168-h+3,7,4,-0.5,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx0+7,168-h+5,7,4,0.5,0,7);ctx.fill();
    //花盆
    ctx.fillStyle=PAL.pot;
    ctx.beginPath();
    ctx.moveTo(cx0-14,168);ctx.lineTo(cx0+14,168);ctx.lineTo(cx0+10,190);ctx.lineTo(cx0-10,190);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.stroke();
    //土壤湿度条（带绿区）
    var bx=cx0-cw*0.4,by=198,bw=cw*0.8;
    ctx.fillStyle=PAL.surface;
    ctx.beginPath();ctx.arc(cx0,by+8,4,0,7);ctx.fill();
    ctx.strokeStyle=st.valve[i]?PAL.water:PAL.border;ctx.lineWidth=st.valve[i]?2.5:1;ctx.stroke();
    ctx.fillStyle=PAL.bg;
    ctx.fillRect(bx,by,bw,10);
    var z0=bx+bw*p.lo/100,z1=bx+bw*p.hi/100;
    ctx.fillStyle=PAL.success;ctx.globalAlpha=0.3;
    ctx.fillRect(z0,by,z1-z0,10);
    ctx.globalAlpha=1;
    ctx.fillStyle=mcl;
    ctx.fillRect(bx,by,Math.max(2,bw*st.m[i]/100),10);
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
    ctx.strokeRect(bx+0.5,by+0.5,bw-1,9);
    //胁迫小三角
    if(st.stress[i]>30){
      ctx.fillStyle=st.stress[i]>60?PAL.danger:PAL.warning;
      ctx.beginPath();
      ctx.moveTo(bx+bw-8,by-4);ctx.lineTo(bx+bw-2,by-4);ctx.lineTo(bx+bw-5,by-10);
      ctx.closePath();ctx.fill();
    }
    //名签
    ctx.fillStyle=PAL.surface;
    ctx.font="12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(GW.TYPES[i%6],cx0,226);
    //键盘光标提示条
    if(i===cursorIdx&&state==="run"){
      ctx.strokeStyle=PAL.primary;ctx.lineWidth=2;
      ctx.strokeRect(bx-3,by-3,bw+6,16);
    }
  }
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.strokeRect(0.5,0.5,W-1,239);
}
var cursorIdx=0;

/* ========== 步进（固定 0.25s 确定性 tick；rAF + visibilitychange 停帧/续跑） ========== */
var acc=0;
function step(dt){
  if(state!=="run")return;
  acc+=dt;
  var guard=0;
  var vals=[];
  for(var i=0;i<L.plants.length;i++)vals.push(st.valve[i]);
  while(acc>=GW.DT&&state==="run"&&guard<40){
    acc-=GW.DT;guard++;
    var r=GW.tick(st,L,vals);
    syncHud();
    if(r==="dead"){failLevel();break;}
    if(r==="done"){winLevel();break;}
  }
}

/* ========== 主循环 ========== */
var rafPending=false,lastTs=0;
function frame(ts){
  rafPending=false;
  if(document.hidden)return;
  if(!lastTs)lastTs=ts;
  var dt=Math.min(0.05,(ts-lastTs)/1000||0);
  lastTs=ts;
  step(dt);draw();
  rafPending=true;requestAnimationFrame(frame);
}
function kick(){if(!rafPending&&!document.hidden){rafPending=true;requestAnimationFrame(frame);}}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){lastTs=0;if(state==="run")say("已暂停 · 切回继续浇园");}
  else{lastTs=0;kick();}
});

/* ========== 输入 ========== */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left;
  e.preventDefault();
  var n=L.plants.length,cw=(W-20)/n;
  var i=Math.floor((x-10)/cw);
  if(i>=0&&i<n)toggleValve(i);
});
$("btnPause").addEventListener("click",function(){
  if(state==="run"){state="pause";$("btnPause").textContent="继续";}
  else if(state==="pause"){state="run";$("btnPause").textContent="暂停";}
});
$("btnReset").addEventListener("click",function(){loadLevel(cur);});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(ovMode==="win"){
    if(cur>=LEVELS.length-1){cur=0;save.lv=0;persist();loadLevel(0);}
    else{cur++;loadLevel(cur);}
  }else if(ovMode==="fail"){
    openLevelSelect();
  }
});
$("ovRetry").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  loadLevel(cur);
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="6"){var i=parseInt(k,10)-1;if(i<L.plants.length){toggleValve(i);cursorIdx=i;}e.preventDefault();}
  else if(e.key==="ArrowLeft"){cursorIdx=Math.max(0,cursorIdx-1);draw();e.preventDefault();}
  else if(e.key==="ArrowRight"){cursorIdx=Math.min(L.plants.length-1,cursorIdx+1);draw();e.preventDefault();}
  else if(e.key==="Enter"){toggleValve(cursorIdx);e.preventDefault();}
  else if(k===" "){e.preventDefault();if(state==="run"){state="pause";$("btnPause").textContent="继续";}else if(state==="pause"){state="run";$("btnPause").textContent="暂停";}}
  else if(k==="r"||k==="R")loadLevel(cur);
});

/* 调试验证入口 */
window.__validateLevels=function(){try{return GW.runTests()}catch(e){return {error:String(e)}}};

/* ========== 启动（续玩：从存档关卡起步） ========== */
cur=clamp(save.lv,0,LEVELS.length-1);
loadLevel(cur);
requestAnimationFrame(frame);
syncLevelsFromServer();
syncSaveFromServer();

})();
</script>

</body>
</html>
