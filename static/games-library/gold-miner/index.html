<style>
  /*token:GAME-THEME.md §2 基线（UI 壳全部走 token；矿井/矿石为玩法素材另走 PAL/MAT）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gm-gold:#E2A23B;--g-gm-stone:#A7ADB2;--g-gm-dia:#5FC6DE;--g-gm-bag:#C29A5F;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-gm-gold:#E8B45C;--g-gm-stone:#B4BABE;--g-gm-dia:#7FD4E8;--g-gm-bag:#D2AE74;color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; align-items: stretch; }
  /* 入场错落 30-50ms：记分块依次浮起 */
  .stat { flex: 1; min-width: 0; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; animation: rise .38s ease-out both; }
  .stat:nth-child(2) { animation-delay: 30ms; }
  .stat:nth-child(3) { animation-delay: 60ms; }
  .stat:nth-child(4) { animation-delay: 90ms; }
  .stat:nth-child(5) { animation-delay: 120ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); white-space: nowrap; }
  .stat .val { display: block; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); white-space: nowrap; transition: color .16s ease-out; }
  .stat .val.warn { color: var(--g-danger); }
  .stat .val.bump { animation: bump .3s ease-out; }
  .icon-btn { width: 44px; height: 44px; flex: 0 0 44px; border: 1px solid var(--g-border); border-radius: 12px; background: var(--g-surface); color: var(--g-text); display: grid; place-items: center; cursor: pointer; font: inherit; transition: transform .14s ease-out, background .16s ease-out, border-color .16s ease-out; }
  .icon-btn:active { transform: scale(.96); }
  .stage { position: relative; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; transition: color .16s ease-out; }
  .tools { display: flex; gap: 8px; }
  .btn { min-height: 44px; padding: 0 14px; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: var(--g-radius-btn); background: linear-gradient(180deg, var(--g-primary), var(--g-btn-primary)); color: #fff; font-family: inherit; font-size: 16px; font-weight: 600; white-space: nowrap; cursor: pointer; box-shadow: var(--g-shadow); transition: transform .14s ease-out, box-shadow .16s ease-out, filter .16s ease-out; }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: var(--g-surface2); color: var(--g-text); box-shadow: inset 0 0 0 1px var(--g-border); }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay { position: absolute; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; background: var(--g-scrim); padding: 14px; }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  .panel { width: 100%; max-width: 340px; max-height: 100%; overflow-y: auto; background: var(--g-surface); border-radius: var(--g-radius); box-shadow: var(--g-shadow); padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; text-align: center; animation: pop .3s ease-out; }
  .panel h2 { margin: 0; font-size: 18px; font-weight: 700; color: var(--g-primary-deep); }
  .panel .desc { margin: 0; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .desc b { color: var(--g-primary-deep); }
  .badge { display: none; margin: 0 auto; padding: 4px 12px; border-radius: 999px; background:var(--g-surface2);color:var(--g-warning); font-size: 12px; font-weight: 700; }
  .badge.show { display: inline-block; animation: pop .3s ease-out; }
  .lv-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 6px; margin: 2px 0; }
  .lv-chip { min-height: 44px; border: 1px solid var(--g-border); border-radius: 10px; background: var(--g-surface2); color: var(--g-text); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform .14s ease-out, background .16s ease-out, box-shadow .16s ease-out; }
  .lv-chip:active { transform: scale(.96); }
  .lv-chip.sel { border-color: var(--g-primary); box-shadow: inset 0 0 0 1.5px var(--g-primary); background: var(--g-primary-soft); color: var(--g-on-soft); }
  .lv-chip.done { background: var(--g-primary-soft); border-color: var(--g-primary); color: var(--g-on-soft); font-weight:700}
  .lv-chip:disabled { opacity: .35; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn-row .btn { flex: 1 1 auto; padding: 0 10px; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }

  /* S2: 动效敏感用户降级（动效层指令，不受 §4 主题层 matchMedia 禁令约束）
     同时压平 animation-duration 与 animation-delay，否则错落入场会变成整体延迟后闪现 */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:.01ms !important; transition-duration:.01ms !important} }
  /* P2: 键盘焦点可见 */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>

<script>
/*GM-ENGINE-BEGIN*/
var GM=(function(){
"use strict";
/* ===== 世界几何（逻辑坐标 360×440，画布等比缩放；所有物理常量集中于此） ===== */
var W=360,H=440,GROUND=52;        /* 地表线：之上天空、之下土壤 */
var PX=180,PY=44;                 /* 钩子枢轴（井架滑轮） */
var AMP=1.32,PERIOD=2.6;          /* 摆幅（弧度）与全摆周期（秒），正弦摆 */
var SWING_LEN=28;                 /* 摆动期绳长：钩爪绕滑轮公转，摆角/朝向可读（< 物品到滑轮最小距离 32） */
var EXT_SPEED=330;                /* 放钩伸速（逻辑像素/秒） */
var EMPTY_SPEED=560;              /* 空钩回收速（恒快于任何负重） */
var HOOK_R=6;                     /* 钩爪判定半径 */
var MAX_LEN=430,PAD=10,EDGE=8,WALL_Y=434; /* 绳长上限 / 物品间距 / 墙内边距 / 底墙 */
/* ===== 物品表：value 分值 / weight 重量（收回速度与重量成反比）/ r 半径 ===== */
var TYPES={
  g1:{v:50,w:1.0,r:9},
  g2:{v:150,w:1.8,r:13},
  g3:{v:500,w:3.0,r:19},
  s1:{v:11,w:2.4,r:9},
  s2:{v:20,w:4.2,r:16},
  d:{v:600,w:0.7,r:8},
  m:{v:0,w:1.2,r:11}   /* 神秘袋：开袋定值 */
};
function itemKey(t,size){return (t==="g"||t==="s")?t+size:t;}
/* ===== 确定性伪随机（mulberry32） ===== */
function makeRng(seed){return{s:seed|0};}
function rngNext(rng){
  rng.s=(rng.s+0x6D2B79F5)|0;
  var t=Math.imul(rng.s^(rng.s>>>15),1|rng.s);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;
}
/* ===== 回收速度：与重量成反比（负重上限 520，恒慢于空钩 560） ===== */
function retSpeed(w){return Math.min(520,520/(0.42+0.58*w));}
/* ===== 神秘袋开袋（按关卡种子确定，整局可复现）：10% 空 / 12% 炸药+1 / 其余金币 ===== */
function openBag(rng){
  var r1=rngNext(rng);
  if(r1<0.10)return{money:0,dyn:0,txt:"空空如也…"};
  if(r1<0.22)return{money:0,dyn:1,txt:"炸药 +1"};
  var r2=rngNext(rng);
  var amt=r2<0.42?40:r2<0.72?120:r2<0.92?300:600;
  return{money:amt,dyn:0,txt:"+"+amt+" 元"};
}
/* ===== 关卡数据 → 运行时物品（神秘袋在此一次性开定） ===== */
function buildItems(level){
  var rng=makeRng(level.seed),out=[];
  for(var i=0;i<level.items.length;i++){
    var it=level.items[i],spec=TYPES[itemKey(it[0],it[3])];
    var rec={t:it[0],size:it[3],x:it[1],y:it[2],r:spec.r,val:spec.v,weight:spec.w,
      alive:true,bagMoney:0,bagDyn:0,bagTxt:""};
    if(it[0]==="m"){var o=openBag(rng);rec.bagMoney=o.money;rec.bagDyn=o.dyn;rec.bagTxt=o.txt;rec.val=o.money;}
    out.push(rec);
  }
  return out;
}
/* ===== 沿角度的最大伸绳长（左右墙 + 底墙 + 绳长上限取最小） ===== */
function reachLen(a){
  var s=Math.sin(a),c=Math.cos(a),l=MAX_LEN;
  if(s>1e-6)l=Math.min(l,(W-EDGE-PX)/s);
  else if(s<-1e-6)l=Math.min(l,(PX-EDGE)/(-s));
  if(c>1e-6)l=Math.min(l,(WALL_Y-PY)/c);
  return l;
}
/* ===== 布局合法性：摆动可达扇区内、互不重叠、不出墙（关卡下发整批校验用） ===== */
function checkLayout(items){
  for(var i=0;i<items.length;i++){
    var a=items[i],dx=a.x-PX,dy=a.y-PY,d=Math.sqrt(dx*dx+dy*dy);
    if(dy<=4)return false;
    var phi=Math.atan2(dx,dy);
    var aw=Math.asin(Math.min(1,(a.r+HOOK_R)/Math.max(1,d)));
    if(Math.abs(phi)+aw>AMP+1e-6)return false;
    if(d+a.r+HOOK_R>reachLen(phi)-2)return false;
    if(a.y-a.r<GROUND+16||a.y+a.r>WALL_Y-2)return false;
    if(a.x-a.r<EDGE||a.x+a.r>W-EDGE)return false;
    for(var j=i+1;j<items.length;j++){
      var b=items[j],ddx=a.x-b.x,ddy=a.y-b.y;
      if(Math.sqrt(ddx*ddx+ddy*ddy)<a.r+b.r+PAD)return false;
    }
  }
  return true;
}
function tipPos(ang,len){return{x:PX+Math.sin(ang)*len,y:PY+Math.cos(ang)*len};}
/* ===== 绳段 raycast：返回绳段扫过路径上首个命中的物品（遮挡判定同引擎） ===== */
function castRay(items,ang,l0,l1){
  var p0=tipPos(ang,l0),p1=tipPos(ang,l1),best=null,bl=Infinity;
  var dx=p1.x-p0.x,dy=p1.y-p0.y,dd=dx*dx+dy*dy;
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(!it.alive)continue;
    var t=dd>0?((it.x-p0.x)*dx+(it.y-p0.y)*dy)/dd:0;
    t=Math.max(0,Math.min(1,t));
    var qx=p0.x+t*dx,qy=p0.y+t*dy,ex=it.x-qx,ey=it.y-qy;
    var rr=it.r+HOOK_R;
    if(ex*ex+ey*ey<=rr*rr){
      var along=l0+(l1-l0)*t;
      if(along<bl){bl=along;best=it;}
    }
  }
  return best?{item:best,l:bl}:null;
}
/* ===== 对局状态 ===== */
function newGame(level){
  return{lv:level,items:buildItems(level),money:0,time:level.time,dyn:level.dyn,
    phase:0,ang:0,mode:"swing",len:0,item:null,pop:null,popT:0,shake:0,boom:null,
    over:false,won:false};
}
/* ===== 推进一帧：inp={drop:放钩请求, boom:引爆请求}（单帧消费） ===== */
function step(st,dt,inp){
  if(st.over)return;
  if(st.money>=st.lv.target){st.won=true;st.over=true;return;}
  st.time-=dt;
  if(st.time<=0){st.time=0;st.over=true;return;}
  if(st.mode==="swing"){
    st.phase+=dt*Math.PI*2/PERIOD;
    st.ang=AMP*Math.sin(st.phase);
    st.len=SWING_LEN;               /* 摆动期绳长恒定：钩爪公转，出钩从该长度起伸，无跳变 */
    if(inp&&inp.drop){st.mode="ext";}
  }else if(st.mode==="ext"){
    var prev=st.len;
    st.len=Math.min(MAX_LEN,prev+EXT_SPEED*dt);
    var hit=castRay(st.items,st.ang,prev,st.len);
    if(hit){hit.item.alive=false;st.item=hit.item;st.mode="ret";}
    else{
      var tip=tipPos(st.ang,st.len);
      if(st.len>=MAX_LEN||tip.x<EDGE||tip.x>W-EDGE||tip.y>WALL_Y)st.mode="ret";
    }
  }else{
    if(inp&&inp.boom&&st.item&&st.dyn>0){
      st.dyn--;
      var bx=tipPos(st.ang,st.len);
      st.boom={x:bx.x,y:bx.y,t:0.4};
      st.item=null;st.shake=0.3;
    }
    var sp=st.item?retSpeed(st.item.weight):EMPTY_SPEED;
    st.len-=sp*dt;
    if(st.len<=0){
      st.len=0;st.mode="swing";
      if(st.item){
        var it=st.item;st.item=null;
        if(it.t==="m"){
          st.money+=it.bagMoney;
          if(it.bagDyn)st.dyn+=it.bagDyn;
          st.pop=it.bagTxt;st.popT=1.0;
        }else{
          st.money+=it.val;
          st.pop="+"+it.val+" 元";st.popT=1.0;
        }
      }
    }
  }
  if(st.popT>0){st.popT-=dt;if(st.popT<=0)st.pop=null;}

    else{r=parseInt(h.slice(0,2),16);g=parseInt(h.slice(2,4),16);b=parseInt(h.slice(4,6),16);}
    return"rgba("+r+","+g+","+b+","+(a).toFixed(3)+")";
  }
  m=s.match(/rgba?\(([^)]+)\)/);

function colParse(c){

  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];

}
function colMix(a,b,t){

function intOK(v){return typeof v==="number"&&isFinite(v)&&Math.floor(v)===v;}
function parseGoldLevels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={},i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    var d;
    try{d=JSON.parse(item.dataJson);}catch(e){return null;}
    if(!d||typeof d!=="object"||Array.isArray(d))return null;
    if(typeof d.name!=="string"||!d.name.length||d.name.length>32)return null;
    if(!intOK(d.time)||d.time<30||d.time>90)return null;
    if(!intOK(d.target)||d.target<100||d.target>99999)return null;
    if(!intOK(d.seed)||d.seed<0||d.seed>2147483647)return null;
    if(!intOK(d.dyn)||d.dyn<0||d.dyn>4)return null;
    if(!Array.isArray(d.items)||d.items.length<6||d.items.length>16)return null;
    var items=[];
    for(var j=0;j<d.items.length;j++){
      var w=d.items[j];
      if(!Array.isArray(w)||w.length!==4)return null;
      var t=w[0];
      if(t!=="g"&&t!=="s"&&t!=="d"&&t!=="m")return null;
      if(!intOK(w[1])||w[1]<0||w[1]>359)return null;
      if(!intOK(w[2])||w[2]<60||w[2]>439)return null;
      var sz=w[3];
      if(t==="g"){if(sz!==1&&sz!==2&&sz!==3)return null;}
      else if(t==="s"){if(sz!==1&&sz!==2)return null;}
      else{if(sz!==1)return null;}
      items.push([t,w[1],w[2],sz]);
    }
    if(!GM.checkLayout(GM.buildItems({seed:d.seed,items:items})))return null;
    var no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=1;
    list.push({no:no,name:d.name,time:d.time,target:d.target,seed:d.seed,dyn:d.dyn,items:items});
  }
  list.sort(function(a,b){return a.no-b.no;});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  for(var i=0;i<list.length;i++){var L=list[i];if(typeof L!=="object"||!L||!Array.isArray(L.items)||!L.items.length)return false;}
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}

}

      '<div class="btn-row"><button class="btn" id="ovResume" type="button">'+SW_ICON("play")+'继续</button>'+
      '<button class="btn ghost" id="ovMenu" type="button">'+SW_ICON("grid")+'选关</button></div>';
    $("ovResume").addEventListener("click",resumeGame);

function toMenu(){

function pauseGame(){

/* ---------- HUD ---------- */
function say(t){$("msg").textContent=t;}
/* 入账轻弹：重启动画需先摘掉 class 再强制回流 */

}
function syncHud(){

/* ---------- 结算 ---------- */
function endLevel(){
  if(st.won){
    state="won";
    saveData.lv=Math.max(saveData.lv,Math.min(cur+1,LEVELS.length-1));
    saveData.best=Math.max(saveData.best,st.money);
    save();
    if(GB.available)GB.reportScore("gold-miner",{metricValue:cur+1,metricExtra:st.money}).catch(function(){});
    buildChips();
    endKind="win";endTimer=0.55;
  }else{
    state="lost";
    say("还差 "+(st.lv.target-st.money)+" 元，再试一次！");

  }

/* ---------- 特效 ---------- */
function puff(x,y,c,n,up){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28,sp=50+Math.random()*130;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(up||30),r:1.6+Math.random()*2.6,
      c:c,life:0,ttl:0.4+Math.random()*0.3});
  }
}
function addFloat(txt,c){floats.push({txt:txt,c:c,life:0,ttl:1.0});}
/* ---------- 更新 ---------- */
function update(dt){
  animT+=dt;
  var tipBefore=st.item;
  GM.step(st,dt,input);
  input.drop=false;input.boom=false;
  /* 抓中扬尘 */
  if(st.item&&!tipBefore){
    var t=GM.tipPos(st.ang,st.len);
    puff(t.x,t.y,PAL.dot,6,20);
  }
  /* 引爆 */
  if(st.boom&&st.boom!==prevBoom){
    puff(st.boom.x,st.boom.y,PAL.warning,10,60);
    puff(st.boom.x,st.boom.y,PAL.danger,6,80);
    puff(st.boom.x,st.boom.y,PAL.muted,10,10);
  }
  prevBoom=st.boom;
  /* 入账：金币喷泉 + 浮字 */
  if(st.money>prevMoney){
    puff(GM.PX,GM.GROUND-6,PAL.gold,10,90);
    bumpStat($("stMoney"));          //入账轻弹
    if(st.pop)addFloat(st.pop,PAL.deep);
  }
  prevMoney=st.money;
  var i;
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];p.vy+=420*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life+=dt;
    if(p.life>=p.ttl)parts.splice(i,1);
  }
  for(i=floats.length-1;i>=0;i--){
    var f=floats[i];f.life+=dt;
    if(f.life>=f.ttl)floats.splice(i,1);
  }
  if(st.over)endLevel();
}
/* ---------- 绘制 ---------- */
function poly(x,y,pts){
  ctx.beginPath();ctx.moveTo(x+pts[0][0],y+pts[0][1]);
  for(var i=1;i<pts.length;i++)ctx.lineTo(x+pts[i][0],y+pts[i][1]);
  ctx.closePath();
}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
/* 轻立体三件套：投影 + 渐变体 + 高光（颜色全部取自 PAL，无字面量） */
function itemShadow(r){
  ctx.shadowColor="rgba(0,0,0,0.30)";   //恒暗投影
  ctx.shadowBlur=r*0.55;ctx.shadowOffsetY=r*0.24;
}
function noShadow(){ctx.shadowColor="rgba(0,0,0,0)";ctx.shadowBlur=0;ctx.shadowOffsetY=0;}
/* 四芒星光斑：路径绘制，不用 ★ 字符充当图形 */
function sparkle(x,y,r){
  ctx.save();ctx.fillStyle=shade(WHITE,0.9);
  ctx.beginPath();
  ctx.moveTo(x,y-r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.quadraticCurveTo(x,y,x,y+r);
  ctx.quadraticCurveTo(x,y,x-r,y);
  ctx.quadraticCurveTo(x,y,x,y-r);
  ctx.closePath();ctx.fill();ctx.restore();
}
function drawItem(it,x,y){
  x=x===undefined?it.x:x;y=y===undefined?it.y:y;
  var r=it.r;
  if(it.t==="g"){
    poly(x,y,it.pts);
    itemShadow(r);
    var gg=ctx.createRadialGradient(x-r*0.34,y-r*0.38,r*0.12,x,y,r*1.25);
    gg.addColorStop(0,PAL.goldHi);gg.addColorStop(0.45,PAL.gold);gg.addColorStop(1,PAL.goldLo);
    ctx.fillStyle=gg;ctx.fill();
    noShadow();
    ctx.lineWidth=Math.max(1.2,r*0.10);ctx.strokeStyle=PAL.goldLo;ctx.stroke();
    ctx.strokeStyle=shade(PAL.goldLo,0.55);ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(x-r*0.52,y-r*0.08);ctx.lineTo(x+r*0.08,y+r*0.44);
    ctx.moveTo(x+r*0.44,y-r*0.30);ctx.lineTo(x+r*0.08,y+r*0.44);
    ctx.moveTo(x-r*0.60,y-r*0.26);ctx.lineTo(x-r*0.10,y+r*0.10);
    ctx.stroke();
    ctx.fillStyle=shade(WHITE,0.55);
    ctx.beginPath();ctx.ellipse(x-r*0.3,y-r*0.34,r*0.30,r*0.17,-0.6,0,7);ctx.fill();
  }else if(it.t==="s"){
    poly(x,y,it.pts);
    itemShadow(r);
    var sg=ctx.createRadialGradient(x-r*0.3,y-r*0.36,r*0.1,x,y,r*1.2);
    sg.addColorStop(0,PAL.stoneHi);sg.addColorStop(0.5,PAL.stone);sg.addColorStop(1,PAL.stoneLo);
    ctx.fillStyle=sg;ctx.fill();
    noShadow();
    ctx.lineWidth=Math.max(1.2,r*0.10);ctx.strokeStyle=PAL.stoneLo;ctx.stroke();
    ctx.fillStyle=shade(PAL.stoneLo,0.5);
    ctx.beginPath();ctx.arc(x+r*0.24,y-r*0.12,r*0.15,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x-r*0.30,y+r*0.26,r*0.11,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+r*0.05,y+r*0.40,r*0.09,0,7);ctx.fill();
    ctx.fillStyle=shade(WHITE,0.30);
    ctx.beginPath();ctx.ellipse(x-r*0.28,y-r*0.32,r*0.26,r*0.15,-0.6,0,7);ctx.fill();
  }else if(it.t==="d"){
    ctx.beginPath();
    ctx.moveTo(x,y-r*1.28);
    ctx.lineTo(x+r*0.98,y-r*0.12);
    ctx.lineTo(x+r*0.52,y+r*1.12);
    ctx.lineTo(x-r*0.52,y+r*1.12);
    ctx.lineTo(x-r*0.98,y-r*0.12);
    ctx.closePath();
    itemShadow(r*1.1);
    var dg=ctx.createLinearGradient(x,y-r*1.28,x,y+r*1.12);
    dg.addColorStop(0,PAL.diaHi);dg.addColorStop(0.5,PAL.dia);dg.addColorStop(1,PAL.diaLo);
    ctx.fillStyle=dg;ctx.fill();
    noShadow();
    ctx.lineWidth=Math.max(1.2,r*0.10);ctx.strokeStyle=PAL.diaLo;ctx.stroke();
    ctx.strokeStyle=shade(WHITE,0.6);ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(x-r*0.98,y-r*0.12);ctx.lineTo(x+r*0.98,y-r*0.12);
    ctx.moveTo(x,y-r*1.28);ctx.lineTo(x,y+r*1.12);
    ctx.moveTo(x-r*0.98,y-r*0.12);ctx.lineTo(x-r*0.52,y+r*1.12);
    ctx.moveTo(x+r*0.98,y-r*0.12);ctx.lineTo(x+r*0.52,y+r*1.12);
    ctx.stroke();
    sparkle(x-r*0.36,y-r*0.52,r*0.34);
  }else{
    itemShadow(r);
    var bg2=ctx.createRadialGradient(x-r*0.25,y-r*0.3,r*0.1,x,y+r*0.15,r*1.15);
    bg2.addColorStop(0,PAL.bagHi);bg2.addColorStop(0.5,PAL.bag);bg2.addColorStop(1,PAL.bagLo);
    ctx.fillStyle=bg2;
    ctx.beginPath();ctx.ellipse(x,y+r*0.16,r*0.92,r*0.98,0,0,7);ctx.fill();
    noShadow();
    ctx.lineWidth=Math.max(1.2,r*0.10);ctx.strokeStyle=PAL.bagLo;ctx.stroke();
    ctx.fillStyle=PAL.bagLo;
    ctx.fillRect(x-r*0.30,y-r*1.0,Math.max(2,r*0.6),r*0.34);
    ctx.beginPath();ctx.arc(x,y-r*1.0,r*0.26,0,7);ctx.fill();
    ctx.fillStyle=shade(WHITE,0.35);
    ctx.beginPath();ctx.ellipse(x-r*0.34,y-r*0.28,r*0.22,r*0.13,-0.6,0,7);ctx.fill();
    ctx.fillStyle=shade(PAL.bagHi,0.95);
    ctx.beginPath();ctx.ellipse(x,y+r*0.24,r*0.42,r*0.36,0,0,7);ctx.fill();
    ctx.lineWidth=1;ctx.strokeStyle=shade(PAL.bagLo,0.7);ctx.stroke();
    ctx.fillStyle=PAL.bagLo;
    ctx.font="700 12px "+sysFont();
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("?",x,y+r*0.26);
  }
}
/* 两侧与底部岩壁：用「面」表达边界，不用细线 */
function drawWalls(){
  var e=GM.EDGE+2,bottom=GM.H-12;
  var g=ctx.createLinearGradient(0,GM.GROUND,0,GM.H);
  g.addColorStop(0,PAL.soilLo);g.addColorStop(1,colShade(PAL.soilLo,-0.18));
  ctx.fillStyle=g;
  ctx.fillRect(-8,GM.GROUND,e,bottom-GM.GROUND);
  ctx.fillRect(GM.W-e,GM.GROUND,e,bottom-GM.GROUND);
  ctx.fillRect(-8,bottom,GM.W+16,GM.H-bottom+8);
  ctx.fillStyle=shade(PAL.soilHi,0.8);
  ctx.fillRect(e,GM.GROUND,2.5,bottom-GM.GROUND);
  ctx.fillRect(GM.W-e-2.5,GM.GROUND,2.5,bottom-GM.GROUND);
  ctx.fillRect(-8,bottom,GM.W+16,2.5);
}
/* ===== 瞄准系统：让「点击瞬间的出钩角度」与命中窗的关系一眼可读 =====
   ① 摆幅扇区：±AMP 淡色面，勾出钩子能摆到的角域（草皮/岩壁盖住边缘）
   ② 边界虚线：摆幅两个极限角，从滑轮一直画到两侧墙
   ③ 公转轨道：摆动期钩爪实际走过的弧（钩爪匀速公转，朝向即摆角）
   ④ 出钩预告线：摆动期沿当前角度射向可达边界的渐变线 + 箭头，点击即沿此线出钩
   颜色全部取自 PAL（结构 token），无颜色字面量 */
var AIM_R=112;   /* 扇区半径（逻辑像素）：足够大以辨向，又不铺满整个矿体 */
function aimFanPath(r){
  var N=28;
  ctx.beginPath();
  ctx.moveTo(GM.PX,GM.PY);
  for(var i=0;i<=N;i++){
    var a=-GM.AMP+2*GM.AMP*i/N;
    var p=GM.tipPos(a,r);
    ctx.lineTo(p.x,p.y);
  }
  ctx.closePath();
}
function drawAimRange(){
  /* ① 可达扇区 */
  aimFanPath(AIM_R);
  ctx.fillStyle=shade(PAL.primary,0.10);
  ctx.fill();
  ctx.save();
  /* ② 摆幅边界虚线（恢复 HEAD 行为并强化：更亮、更粗、延伸到墙） */
  ctx.strokeStyle=shade(PAL.deep,0.55);
  ctx.lineWidth=1.6;
  ctx.setLineDash([6,6]);
  for(var s=-1;s<=1;s+=2){
    var gl=GM.reachLen(s*GM.AMP);
    var gp=GM.tipPos(s*GM.AMP,gl);
    ctx.beginPath();ctx.moveTo(GM.PX,GM.PY);ctx.lineTo(gp.x,gp.y);ctx.stroke();
  }
  /* ③ 钩爪公转轨道 */
  ctx.strokeStyle=shade(PAL.deep,0.34);
  ctx.lineWidth=1.2;
  ctx.setLineDash([2,5]);
  ctx.beginPath();
  for(var i=0;i<=28;i++){
    var a2=-GM.AMP+2*GM.AMP*i/28;
    var q=GM.tipPos(a2,GM.SWING_LEN);
    if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
function drawAimRay(){
  var gl=GM.reachLen(st.ang);
  var tip=GM.tipPos(st.ang,gl);
  var lg=ctx.createLinearGradient(GM.PX,GM.PY,tip.x,tip.y);
  lg.addColorStop(0,shade(PAL.deep,0.9));
  lg.addColorStop(1,shade(PAL.deep,0.18));
  ctx.save();
  ctx.strokeStyle=lg;ctx.lineWidth=2.2;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(GM.PX,GM.PY);ctx.lineTo(tip.x,tip.y);ctx.stroke();
  /* 箭头：指明出钩方向 */
  var ux=Math.sin(st.ang),uy=Math.cos(st.ang);
  ctx.fillStyle=shade(PAL.deep,0.9);
  ctx.beginPath();
  ctx.moveTo(tip.x+ux*7,tip.y+uy*7);
  ctx.lineTo(tip.x-uy*4.5,tip.y+ux*4.5);
  ctx.lineTo(tip.x+uy*4.5,tip.y-ux*4.5);
  ctx.closePath();ctx.fill();
  ctx.restore();
}
/* 井架：木质渐变梁 + 金属滑轮 */
function drawFrame(){
  ctx.lineCap="round";
  var gl=ctx.createLinearGradient(GM.PX-17,GM.GROUND,GM.PX,GM.PY);
  gl.addColorStop(0,PAL.woodLo);gl.addColorStop(1,PAL.wood);

  ctx.beginPath();ctx.moveTo(GM.PX-20,GM.GROUND);ctx.lineTo(GM.PX,GM.PY);ctx.stroke();

  gr.addColorStop(0,PAL.woodLo);gr.addColorStop(1,PAL.wood);

  ctx.beginPath();ctx.moveTo(GM.PX+20,GM.GROUND);ctx.lineTo(GM.PX,GM.PY);ctx.stroke();

  ctx.strokeStyle=PAL.woodLo;ctx.lineWidth=3.5;

  var pg=ctx.createRadialGradient(GM.PX-1.5,GM.PY-1.5,0.5,GM.PX,GM.PY,6);

  ctx.fillStyle=colShade(PAL.metalLo,-0.4);

}
/* 矿工：工装渐变 + 皮肤 + 安全帽，站位在井架右侧 */
function drawMiner(){

function draw(ts){
  /* 天空（品牌色轻晕指明光源方向） */
  ctx.fillStyle=PAL.bg;
  ctx.fillRect(-8,-8,GM.W+16,GM.GROUND+8);
  var sky=ctx.createRadialGradient(GM.PX,GM.PY-12,6,GM.PX,GM.PY-12,190);
  sky.addColorStop(0,shade(PAL.primary,0.08));sky.addColorStop(1,shade(PAL.primary,0));
  ctx.fillStyle=sky;
  ctx.fillRect(-8,-8,GM.W+16,GM.GROUND+8);
  /* 土壤主体 */
  var ug=ctx.createLinearGradient(0,GM.GROUND,0,GM.H);
  ug.addColorStop(0,PAL.soilHi);
  ug.addColorStop(0.10,PAL.soil);
  ug.addColorStop(1,PAL.soilLo);
  ctx.fillStyle=ug;
  ctx.fillRect(-8,GM.GROUND,GM.W+16,GM.H-GM.GROUND+8);
  /* 地层：整块色面，不用细线 */
  ctx.globalAlpha=0.32;ctx.fillStyle=PAL.soilLo;
  ctx.fillRect(-8,GM.GROUND+74,GM.W+16,20);
  ctx.fillRect(-8,GM.GROUND+168,GM.W+16,26);
  ctx.globalAlpha=0.20;ctx.fillStyle=PAL.soilHi;
  ctx.fillRect(-8,GM.GROUND+120,GM.W+16,14);
  ctx.globalAlpha=1;
  drawAimRange();
  /* 草皮 */
  var gg=ctx.createLinearGradient(0,GM.GROUND,0,GM.GROUND+9);
  gg.addColorStop(0,PAL.grassHi);gg.addColorStop(1,PAL.grass);
  ctx.fillStyle=gg;ctx.fillRect(-8,GM.GROUND,GM.W+16,9);
  ctx.fillStyle=PAL.grassLo;ctx.fillRect(-8,GM.GROUND+9,GM.W+16,3);
  /* 土壤斑点 */
  ctx.fillStyle=PAL.dot;ctx.globalAlpha=0.5;
  for(var d=0;d<dots.length;d++){
    ctx.beginPath();ctx.arc(dots[d].x,dots[d].y,dots[d].r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  drawWalls();
  if(!st)return;
  /* 摆动期：沿当前角度画出钩预告线（在岩壁之上、矿石之下，指向明确） */
  if(st.mode==="swing")drawAimRay();
  /* 场上物品：入场错落 40ms/件，轻弹放大淡入（reduced-motion 直接落位） */
  for(var i=0;i<st.items.length;i++){
    var it=st.items[i];if(!it.alive)continue;
    var age=animT-(it.born||0),p=1;
    if(!window.__gRM){
      if(age<0)continue;
      p=Math.min(1,age/0.18);
    }
    var e2=1-Math.pow(1-p,2),sc=0.6+0.4*e2;
    ctx.save();
    ctx.globalAlpha=e2;
    ctx.translate(it.x,it.y);ctx.scale(sc,sc);ctx.translate(-it.x,-it.y);
    drawItem(it);
    ctx.restore();
  }
  /* 绳与钩：亮芯 + 暗边表现纤维圆柱，钩爪金属渐变 */
  var tip=GM.tipPos(st.ang,st.len);
  ctx.lineCap="round";
  ctx.strokeStyle=PAL.ropeLo;ctx.lineWidth=3.4;
  ctx.beginPath();ctx.moveTo(GM.PX,GM.PY);ctx.lineTo(tip.x,tip.y);ctx.stroke();
  ctx.strokeStyle=PAL.rope;ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(GM.PX,GM.PY);ctx.lineTo(tip.x,tip.y);ctx.stroke();
  ctx.save();
  ctx.translate(tip.x,tip.y);ctx.rotate(-st.ang);
  var hg=ctx.createLinearGradient(0,-4,0,9);
  hg.addColorStop(0,PAL.metalHi);hg.addColorStop(1,PAL.metalLo);
  ctx.fillStyle=hg;ctx.fillRect(-4,-4,8,5);
  ctx.strokeStyle=PAL.metal;ctx.lineWidth=2.6;ctx.lineCap="round";
  ctx.beginPath();
  if(st.item)ctx.arc(0,7,5,-0.35,Math.PI+0.35);
  else ctx.arc(0,8,5,0.1,Math.PI-0.1);
  ctx.stroke();
  ctx.restore();
  if(st.item){
    var cp=GM.tipPos(st.ang,st.len+10+st.item.r);
    drawItem(st.item,cp.x,cp.y);
  }
  drawFrame();
  drawMiner();
  /* 粒子 */
  for(var p2=0;p2<parts.length;p2++){
    var pt=parts[p2];
    ctx.globalAlpha=Math.max(0,1-pt.life/pt.ttl);
    ctx.fillStyle=pt.c;
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  /* 爆炸光圈 */
  if(st.boom){
    var k=1-st.boom.t/0.4;
    ctx.globalAlpha=Math.max(0,1-k);
    ctx.strokeStyle=PAL.warning;
    ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(st.boom.x,st.boom.y,4+k*26,0,7);ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* 浮字与入账提示 */
  ctx.font="700 14px "+sysFont();
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(var f=0;f<floats.length;f++){
    var fl=floats[f];
    ctx.globalAlpha=Math.max(0,1-fl.life/fl.ttl);
    ctx.fillStyle=fl.c;
    ctx.fillText(fl.txt,GM.PX,GM.GROUND-30-f.life*18);
  }
  if(st.pop&&st.popT>0){
    ctx.globalAlpha=Math.min(1,st.popT*2);
    ctx.fillStyle=PAL.warning;
    ctx.font="600 14px "+sysFont();
    ctx.fillText(st.pop,clamp(tip.x,50,GM.W-50),clamp(tip.y-20,70,GM.H-10));
    ctx.globalAlpha=1;
  }
  ctx.globalAlpha=1;
}
/* ---------- 主循环 ---------- */
var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.033,(ts-last)/1000||0);
  last=ts;
  if(state==="running")update(dt);
  if(endKind){
    endTimer-=dt;
    if(endTimer<=0){showOverlay(endKind==="win"?"won":"lost");endKind=null;}
  }
  draw(ts);
  syncHud();
}
/* ---------- 输入 ---------- */
function tryDrop(){
  if(state!=="running")return;
  if(!st||st.over)return;
  if(st.mode==="swing"){input.drop=true;}
  else if(st.mode==="ext"){say("钩子正伸出，稍等它收回");}
}
function tryBoom(){
  if(state!=="running"||!st||st.over)return;
  if(st.mode==="ret"&&st.item&&st.dyn>0){input.boom=true;}
  else if(st.dyn<=0){say("炸药用完了");}
  else{say("只有钩住物品收回时才能引爆");}
}
$("btnDrop").addEventListener("click",tryDrop);
$("btnBoom").addEventListener("click",tryBoom);
cv.addEventListener("pointerdown",function(e){
  tryDrop();
  e.preventDefault();
});
$("btnPause").addEventListener("click",function(){
  if(state==="running")pauseGame();
  else if(state==="paused")resumeGame();
});
window.addEventListener("keydown",function(e){
  if(e.target&&/^(BUTTON|INPUT|A)$/.test(e.target.tagName))return;//焦点在控件上时不抢键
  if(e.key===" "||e.key==="Enter"){tryDrop();e.preventDefault();}
  else if(e.key==="b"||e.key==="B")tryBoom();
  else if(e.key==="p"||e.key==="P"){
    if(state==="running")pauseGame();else if(state==="paused")resumeGame();
  }
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running")pauseGame();
});
/* ---------- 启动 ---------- */
/* 按钮图标：照抄本库 window.SW_ICON 范式，文字前内联 SVG，与文字基线对齐 */
$("btnDrop").innerHTML=SW_ICON("hook")+"放钩";
$("btnBoom").innerHTML=SW_ICON("bomb")+'<span id="boomTxt">引爆 ×0</span>';
$("btnPause").innerHTML=SW_ICON("pause");
resize();
loadLevel(Math.min(saveData.lv,LEVELS.length-1));
buildChips();
showOverlay("ready");
requestAnimationFrame(frame);
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
