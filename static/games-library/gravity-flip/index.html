  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-st-w:#8A7A5E;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-w:#4E4636;color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);

  .wrap { width: 100%; max-width: 480px; margin: 0 auto; }

  .stats { display: flex; gap: 8px; margin-bottom: 10px; }

  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }

  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }

  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;

  }
  .btn.gbtn { flex: 0 0 72px; }

  .tools { display: flex; gap: 8px; margin-bottom: 8px; }

    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}

<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<body>
<div class="wrap">

  </div>
  <p class="foot">规则：选定方向后小球一直滑到撞墙 / 出界 / 目标环为止，原地卡住的方向无效<br>键盘：方向键即重力方向 · Z 撤销 · H 提示 · R 重开 · 也可在盘面上滑动</p>

  <div class="panel">
    <h2 id="ovTitle">抵达目标！</h2>

<script>
/* ========== 关卡生成器 + 独立验证器（纯逻辑，无 DOM 依赖） ========== */
(function(){
"use strict";
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var DIRS=[[0,1],[0,-1],[1,0],[-1,0]];   // 0=下 1=上 2=右 3=左
/* 独立验证器：BFS(pos,重力) 双状态空间，父指针重建首着 */
function gfBFS(cells,cols,rows,start){
  function key(p,g){return p*4+g}
  function slide(pos,g){
    var x=pos%cols,y=(pos/cols)|0,nx=x,ny=y,moved=false;
    while(true){
      var tx=nx+DIRS[g][0],ty=ny+DIRS[g][1];
      if(tx<0||tx>=cols||ty<0||ty>=rows)break;
      if(cells[ty*cols+tx]===1)break;
      nx=tx;ny=ty;moved=true;
      if(cells[ny*cols+nx]===3)break;
    }
    return moved?ny*cols+nx:-1;
  }
  var dist={},parent={},q=[],gi;
  for(gi=0;gi<4;gi++){
    var p=slide(start,gi);
    if(p>=0){dist[key(p,gi)]=1;parent[key(p,gi)]=null;q.push([p,gi]);}
  }
  var goalState=null;
  while(q.length){
    var cur=q.shift(),d=dist[key(cur[0],cur[1])];
    if(cells[cur[0]]===3){goalState=cur;break;}
    for(gi=0;gi<4;gi++){
      var np=slide(cur[0],gi);
      if(np<0)continue;
      var k=key(np,gi);
      if(dist[k]!==undefined)continue;
      dist[k]=d+1;parent[k]=key(cur[0],cur[1]);
      q.push([np,gi]);
    }
  }
  if(!goalState)return null;
  var k=key(goalState[0],goalState[1]),first=-1;
  while(parent[k]!==null&&parent[k]!==undefined){
    for(var g2=0;g2<4;g2++)if(key(goalState[0],g2)===k)first=g2;
    k=parent[k];
  }
  return {par:dist[key(goalState[0],goalState[1])],first:first,slide:slide};
}
function genLevels(){
  var rnd=mulberry(20261130);
  function rn(m){return (rnd()*m)|0}
  var raw=[];
  for(var i=0;i<90;i++){
    var size=6+Math.min(3,(i/15)|0);
    var dens=0.30+Math.min(0.16,(i/90)*0.16)+(rnd()*0.05);
    for(var t=0;t<200;t++){
      var cells=new Array(size*size);
      for(var s=0;s<size*size;s++)cells[s]=rnd()<dens?1:0;
      var sIdx=rn(size*size),gIdx=rn(size*size);
      if(sIdx===gIdx)continue;
      cells[sIdx]=2;cells[gIdx]=3;
      var v=gfBFS(cells,size,size,sIdx);
      if(!v||v.par<4||v.par>40)continue;
      var rows=[];
      for(var y=0;y<size;y++){
        var r="";
        for(var x=0;x<size;x++){
          var c=cells[y*size+x];
          r+=c===1?"#":c===2?"S":c===3?"G":".";
        }
        rows.push(r);
      }
      if(raw.some(function(x0){return x0.rows.join("")===rows.join("")}))continue;
      raw.push({rows:rows,par:v.par});
      break;
    }
  }
  raw.sort(function(a,b){return a.par-b.par});
  var out=[],stride=raw.length/40;
  for(i=0;i<40;i++)out.push(raw[Math.min(raw.length-1,Math.floor(i*stride))]);
  for(i=0;i<out.length;i++){
    out[i].name="重力·"+(i+1<10?"0":"")+(i+1);
    out[i].difficulty=Math.min(6,1+((i/7)|0));
  }
  return out.map(function(x){return normalizeLevel(x)});   // 统一补齐 cols/rowsN/par
}
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim()||d.name.length>24)return false;
  if(!Array.isArray(d.rows)||d.rows.length<6||d.rows.length>9)return false;
  var cols=d.rows[0].length,ss=0,gg=0,y,x;
  for(y=0;y<d.rows.length;y++){
    if(typeof d.rows[y]!=="string"||d.rows[y].length!==cols)return false;
    for(x=0;x<cols;x++){
      var ch=d.rows[y].charAt(x);
      if(ch!=="."&&ch!=="#"&&ch!=="S"&&ch!=="G")return false;
      if(ch==="S")ss++;
      if(ch==="G")gg++;
    }
  }
  return ss===1&&gg===1;
}
function normalizeLevel(d){
  var rows=d.rows.length,cols=d.rows[0].length,cells=[],y,x;
  for(y=0;y<rows;y++)for(x=0;x<cols;x++){
    var ch=d.rows[y].charAt(x);
    cells.push(ch==="#"?1:ch==="S"?2:ch==="G"?3:0);
  }
  var v=gfBFS(cells,cols,rows,cells.indexOf(2));
  var diff=Number.isInteger(d.difficulty)?Math.min(9,Math.max(1,d.difficulty)):3;
  return {name:String(d.name),rows:d.rows.slice(),cols:cols,rowsN:rows,par:v?v.par:0,difficulty:diff};
}
window.__GF={DIRS:DIRS,gfBFS:gfBFS,genLevels:genLevels,validLevelData:validLevelData,normalizeLevel:normalizeLevel};
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ========== */
var GF=window.__GF,GAME_KEY="gravity-flip",SAVE_KEY="sw.gravityflip.v1";
var LEVELS=GF.genLevels();
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i],d;
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!GF.validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    var n=GF.normalizeLevel(d);
    if(!(n.par>0))continue;   // 验证器判不可达：不进关卡表
    list.push(n);
  }
  return list.length?list:null;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(GF.validLevelData)){
      LEVELS=list.map(GF.normalizeLevel).filter(function(x){return x.par>0});
      if(LEVELS.length)return v;
      LEVELS=GF.genLevels();
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);resize();
    }
  }).catch(function(){});
}
/* ---------- 存档 ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,cells=null,pos=0,grav=0,history=[],moves=0,done=false,hintDir=-1,hintT=0;
var dispX=0,dispY=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,cell=0;
var DIRNAMES=["下","上","右","左"];
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function slideTo(p,g){
  var nx=p%L.cols,ny=(p/L.cols)|0,moved=false;
  while(true){
    var tx=nx+GF.DIRS[g][0],ty=ny+GF.DIRS[g][1];
    if(tx<0||tx>=L.cols||ty<0||ty>=L.rows)break;
    if(cells[ty*L.cols+tx]===1)break;
    nx=tx;ny=ty;moved=true;
    if(cells[ty*L.cols+tx]===3)break;
  }
  return moved?ny*L.cols+nx:-1;
}
function loadLevel(idx){
  lv=Math.max(0,Math.min(idx,LEVELS.length-1));
  L=LEVELS[lv];
  if(!GF.validLevelData({name:L.name,rows:L.rows})){say("关卡数据异常");return;}
  cells=[];
  for(var y=0;y<L.rowsN;y++)for(var x=0;x<L.cols;x++){
    var ch=L.rows[y].charAt(x);
    cells.push(ch==="#"?1:ch==="S"?2:ch==="G"?3:0);
  }
  var v=GF.gfBFS(cells,L.cols,L.rowsN,cells.indexOf(2));   // 加载复核
  pos=cells.indexOf(2);grav=0;history=[];moves=0;done=false;hintDir=-1;
  dispX=pos%L.cols;dispY=(pos/L.cols)|0;
  $("lvTag").textContent="第 "+(lv+1)+" 关";
  $("lvRule").textContent=L.name+" · "+L.cols+"×"+L.rowsN;
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stPar").textContent=v?v.par+" 滑":"-";
  if(!v)say("警告：验证器判定本关不可达（数据异常）");
  else say("把小球滑到绿色目标环（参考最优 "+v.par+" 滑）");
  updStats();resize();
}
function updStats(){
  $("stMoves").textContent=moves;
  $("btnUndo").disabled=!history.length||done;
}
function doSlide(g){
  if(done)return;
  var np=slideTo(pos,g);
  if(np<0){say("「"+DIRNAMES[g]+"」方向卡住了，小球没有动");return;}
  history.push([pos,grav]);
  pos=np;grav=g;moves++;
  hintDir=-1;
  dispX=pos%L.cols;dispY=(pos/L.cols)|0;
  updStats();
  if(cells[pos]===3){winLevel();return;}
  say("滑到 "+DIRNAMES[g]+" 方向的落点 · 已滑 "+moves+" 次");
}
function undo(){
  if(!history.length||done)return;
  var h=history.pop();
  pos=h[0];grav=h[1];moves=history.length;
  dispX=pos%L.cols;dispY=(pos/L.cols)|0;
  say("已撤销一次滑动");updStats();render();
}
function hint(){
  if(done)return;
  var v=GF.gfBFS(cells,L.cols,L.rowsN,pos);
  if(!v||!(v.par>0)){say("验证器：当前局面已无法抵达目标，撤销几步吧");return;}
  if(v.par===1){say("沿当前选择再滑 1 次即可抵达");return;}
  hintDir=v.first;hintT=Date.now();
  if(v.first<0){say("先任选一个能滑动的方向");return;}
  say("建议下一步向「"+DIRNAMES[v.first]+"」（还需约 "+v.par+" 滑）");
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:moves}).catch(function(){});
  $("ovTitle").textContent="抵达目标！";
  $("ovDesc").innerHTML="用 "+moves+" 次滑动抵达目标环（参考最优 "+$("stPar").textContent+"）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
function openLevelSelect(){
  var ggrid=$("lvgrid");ggrid.hidden=false;
  ggrid.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      ggrid.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n2){return s.getPropertyValue(n2).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),
    w:v("--g-st-w")};
}
window.__gOnTheme=function(){palLoad()};//App 推送主题时刷新调色板，rAF 自动重绘
/* ---------- 绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);
  cell=Math.min(56,Math.floor(W/L.cols));
  H=cell*L.rowsN;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function draw(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=PAL.surface2;ctx.fillRect(0,0,W,H);
  var y,x;
  for(y=0;y<L.rowsN;y++)for(x=0;x<L.cols;x++){
    var c=cells[y*L.cols+x],px=x*cell,py=y*cell;
    if(c===1){
      ctx.fillStyle=PAL.w;
      ctx.fillRect(px+1,py+1,cell-2,cell-2);
    }else if(c===3){
      ctx.strokeStyle=PAL.success;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(px+cell/2,py+cell/2,cell*0.32,0,7);ctx.stroke();
    }
  }
  //提示方向箭头
  if(hintDir>=0&&Date.now()-hintT<2600){
    var pulse=0.5+0.5*Math.sin((Date.now()-hintT)/170);
    ctx.strokeStyle=PAL.warning;ctx.lineWidth=3;ctx.globalAlpha=0.4+pulse*0.6;
    var ax=dispX+GF.DIRS[hintDir][0]*0.9,ay=dispY+GF.DIRS[hintDir][1]*0.9;
    ctx.beginPath();ctx.arc(ax*cell+cell/2,ay*cell+cell/2,cell*0.2,0,7);ctx.stroke();
    ctx.globalAlpha=1;
  }
  //小球（缓动）
  var txp=dispX*cell+cell/2,typ=dispY*cell+cell/2;
  ctx.fillStyle=PAL.primary;
  ctx.beginPath();ctx.arc(txp,typ,cell*0.3,0,7);ctx.fill();
  ctx.strokeStyle=PAL.surface;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(txp,typ,cell*0.3,0,7);ctx.stroke();
  //重力指示
  ctx.fillStyle=PAL.text;
  var gx2=txp+GF.DIRS[grav][0]*cell*0.42,gy2=typ+GF.DIRS[grav][1]*cell*0.42;
  ctx.beginPath();ctx.arc(gx2,gy2,3,0,7);ctx.fill();
}
function loop(){
  if(L){
    //小球缓动
    var tx2=pos%L.cols,ty2=(pos/L.cols)|0;
    dispX+=(tx2-dispX)*0.3;dispY+=(ty2-dispY)*0.3;
    if(Math.abs(tx2-dispX)<0.02)dispX=tx2;
    if(Math.abs(ty2-dispY)<0.02)dispY=ty2;
    draw(performance.now());
  }
  requestAnimationFrame(loop);
}
/* ---------- 输入 ---------- */
var swX=null,swY=null;
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  swX=e.clientX-rect.left;swY=e.clientY-rect.top;
  e.preventDefault();
});
cv.addEventListener("pointerup",function(e){
  if(swX===null||done)return;
  var rect=cv.getBoundingClientRect();
  var dx=(e.clientX-rect.left)-swX,dy=(e.clientY-rect.top)-swY;
  swX=swY=null;
  if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  if(Math.abs(dx)>Math.abs(dy))doSlide(dx>0?2:3);
  else doSlide(dy>0?0:1);
});
cv.addEventListener("pointercancel",function(){swX=swY=null});
$("gUp").addEventListener("click",function(){doSlide(1)});
$("gDown").addEventListener("click",function(){doSlide(0)});
$("gLeft").addEventListener("click",function(){doSlide(3)});
$("gRight").addEventListener("click",function(){doSlide(2)});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowDown"){doSlide(0);e.preventDefault();}
  else if(k==="ArrowUp"){doSlide(1);e.preventDefault();}
  else if(k==="ArrowRight"){doSlide(2);e.preventDefault();}
  else if(k==="ArrowLeft"){doSlide(3);e.preventDefault();}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
  else if(k===" "||k==="Enter"){if($("overlay").classList.contains("show"))$("ovBtn").click();e.preventDefault();}
});
window.addEventListener("resize",resize);
document.addEventListener("visibilitychange",function(){if(!document.hidden)resize()});
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);resize();loop();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
