ansform .14s ease-out,background .16s ease-out,opacity .16s ease-out}.btn:active{transform:scale(.96)}.btn.primary{background:linear-gradient(180deg,var(--g-primary),var(--g-btn-primary));color:var(--g-on-primary);border-color:var(--g-primary-deep);box-shadow:0 4px 12px rgba(23,115,74,.30),inset 0 1px 0 var(--g-surface)}.btn:disabled{opacity:.4}.swi{display:inline-block;vertical-align:-.14em;flex:none}.foot{margin:12px 2px 0;font-size:12px;color:var(--g-muted);text-align:center;line-height:1.6}.overlay{position:fixed;inset:0;z-index:10;background:var(--g-scrim);display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}.overlay.show{display:flex;animation:fadein .2s ease-out}.panel{width:100%;max-width:320px;padding:22px 18px;background:linear-gradient(180deg,var(--g-hm-board1),var(--g-hm-board2));border:1px solid var(--g-border);border-radius:var(--g-radius);box-shadow:var(--g-shadow);text-align:center;animation:pop .3s ease-out}.panel h2{margin:0 0 6px;font-size:18px}.panel .word{margin:0 0 4px;font-size:28px;font-weight:700;color:var(--g-primary-deep);letter-spacing:2px}.panel .desc{margin:0 0 16px;font-size:14px;color:var(--g-muted);line-height:1.7}.panel .btn{width:100%}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fadein{from{opacity:0}to{opacity:1}}@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}@keyframes tileIn{from{opacity:0;transform:translateY(10px) scale(.86)}to{opacity:1;transform:none}}@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}:focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}</style>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 调色板：canvas 颜色全部经 CSS 变量读取，JS 零颜色字面量 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),
    border:v("--g-border"),text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),success:v("--g-success"),warning:v("--g-warning"),water:v("--g-water"),
    rail:v("--g-rail"),tile1:v("--g-hm-tile1"),tile2:v("--g-hm-tile2"),
    board1:v("--g-hm-board1"),board2:v("--g-hm-board2")};
}
window.__gOnTheme=function(){palLoad();draw();};
/* ---------- 颜色工具：仅由 PAL 色值混合明暗，JS 零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
/* ---------- 关卡数据（包内默认优先兜底，DB 下发覆盖） ---------- */
var DEFAULT_LEVELS=[{"name":"校园·01","word":"art","hint":"画画和手工制作一类的课程","topic":"校园","maxWrong":7},{"name":"校园·02","word":"bus","hint":"接送学生上下学的大型车辆","topic":"校园","maxWrong":7},{"name":"校园·03","word":"gym","hint":"室内上体育活动课的场馆","topic":"校园","maxWrong":7},{"name":"校园·04","word":"ink","hint":"钢笔吸的深色书写液体","topic":"校园","maxWrong":7},{"name":"校园·05","word":"lab","hint":"摆放仪器、做实验的房间","topic":"校园","maxWrong":7},{"name":"校园·06","word":"pen","hint":"用墨水书写、能夹在口袋里的工具","topic":"校园","maxWrong":7},{"name":"食物·07","word":"egg","hint":"母鸡产下的卵，常作早餐","topic":"食物","maxWrong":7},{"name":"食物·08","word":"jam","hint":"水果加糖熬成的涂抹酱","topic":"食物","maxWrong":7},{"name":"食物·09","word":"pie","hint":"带酥皮、内夹馅料的烘焙点心","topic":"食物","maxWrong":7},{"name":"校园·10","word":"bell","hint":"提示上课和下课的声响装置","topic":"校园","maxWrong":7}];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY="sw.hangman.v1.levels",LEVELS_VER_KEY="sw.hangman.v1.levels.ver";
/* 单条结构校验：全字母单词、非空中文提示、主题与名称非空、机会上限 4–7 */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.word!=="string"||!/^[A-Za-z]{2,10}$/.test(d.word))return false;
  if(typeof d.hint!=="string"||!d.hint.trim())return false;
  if(typeof d.topic!=="string"||!d.topic.trim())return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.maxWrong)||d.maxWrong<4||d.maxWrong>7)return false;
  return true;
}
/* 解析 DB 批次：任一条非法整批放弃（返回 null），词条唯一性一并校验 */
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    var w=d.word.toLowerCase();
    if(seen[w])return null;
    seen[w]=1;
    list.push({name:String(d.name),word:w,hint:String(d.hint),topic:String(d.topic),maxWrong:d.maxWrong});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
var syncLevelsToken=0,syncSaveToken=0;//异步同步局次守卫：关卡与存档各自独立，用户操作后旧回调失效
function syncLevelsFromServer(){var tk=++syncLevelsToken;
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels("hangman").then(function(res){if(tk!==syncLevelsToken)return;
    var list=parseDbLevels(res);
    if(!list)return;
    applyLevels(list,res.version||0);
    startLevel(Math.min(Math.max(cur,0),LEVELS.length-1));
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
var KEY="sw.hangman.v1";
function loadSave(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.lv>=0)return{lv:s.lv,done:s.done||{}};}catch(e){}return{lv:0,done:{}};}
var saveData=loadSave();
var done=saveData.done||{};
function save(){
  var data={lv:cur,done:done};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("hangman",data).catch(function(){});
}
function syncSaveFromServer(){var tk=++syncSaveToken;
  if(!GB.available||!GB.loadState)return;
  GB.loadState("hangman").then(function(res){if(tk!==syncSaveToken)return;
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rl=parseInt(remote.lv,10)||0,changed=false;
      if(rl>cur){cur=Math.min(Math.max(rl,0),LEVELS.length-1);changed=true;}
      if(remote.done&&typeof remote.done==="object"){
        for(var k in remote.done){
          if(remote.done[k]&&!done[k]){done[k]=1;changed=true;}
        }
      }
      if(changed){save();startLevel(cur);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var cur=Math.min(Math.max(saveData.lv||0,0),LEVELS.length-1);
var word="",hint="",topic="",maxWrong=6,guessed={},wrong=[],over=false,won=false;
var LETTERS="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var L={W:0,H:0};
var blanksEl=document.getElementById("blanks"),keysEl=document.getElementById("keys"),
    msgEl=document.getElementById("msg"),hintEl=document.getElementById("hintText"),
    missEl=document.getElementById("missText");
var keyEls={};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"\x27]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\x27":"&#39;"}[c]})}
function say(t){msgEl.textContent=t}
function hideOverlay(){$("overlay").classList.remove("show")}
function showOverlay(){$("overlay").classList.add("show")}
/* ---------- 渲染 ---------- */
function renderHint(){
  hintEl.textContent=hint;
  missEl.textContent=wrong.length?("已猜错："+wrong.join(" ")):"";
}
function renderBlanks(){
  blanksEl.innerHTML="";
  for(var i=0;i<word.length;i++){
    var ch=word[i],d=document.createElement("div");
    d.className="blank"+(guessed[ch]?" on":"");
    d.style.setProperty("--i",String(i));
    d.textContent=guessed[ch]?ch.toUpperCase():"";
    blanksEl.appendChild(d);
  }
}
/* 猜中：已亮字砖轻弹（连击反馈） */
function bumpBlanks(){
  var ts=blanksEl.querySelectorAll(".blank.on"),i,t;
  for(i=0;i<ts.length;i++){t=ts[i];t.classList.remove("bump");void t.offsetWidth;t.classList.add("bump")}
}
/* 猜错：舞台轻晃，给出即时负反馈 */
function shakeStage(){
  var st=cv.parentNode;
  st.classList.remove("shake");void st.offsetWidth;st.classList.add("shake");
}
/* 覆盖层按钮：图标 + 文字（更新文案时重插图标，不抹掉 SVG） */
function setOvBtn(text,icon){$("ovBtn").innerHTML=window.SW_ICON(icon)+esc(text)}
function buildKeys(){
  keysEl.innerHTML="";
  for(var i=0;i<LETTERS.length;i++){
    var ch=LETTERS[i],b=document.createElement("button");
    b.type="button";b.className="key";b.textContent=ch;
    (function(c){b.addEventListener("click",function(){guess(c);});})(ch.toLowerCase());
    keysEl.appendChild(b);
    keyEls[ch]=b;
  }
}
function renderKeys(){
  for(var i=0;i<LETTERS.length;i++){
    var ch=LETTERS[i],b=keyEls[ch],used=!!guessed[ch.toLowerCase()];
    b.className="key"+(used?(word.indexOf(ch.toLowerCase())>=0?" hit":" miss"):"");
    b.disabled=used||over;
  }
}
function clearedCount(){
  var n=0;for(var k in done)if(done[k])n++;
  return n;
}
function renderStats(){
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  $("stCh").textContent=Math.max(0,maxWrong-wrong.length);
  $("stDone").textContent=clearedCount();
}
function renderNav(){
  $("btnPrev").disabled=cur<=0;
  $("btnNext").disabled=cur>=LEVELS.length-1;
}
/* ---------- 画布绘制（自绘素材，零外链零文件；颜色全经 PAL 读 CSS 变量） ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
/* 木梁：暗边 + 本体两段（c 为 PAL 色） */
function beam(x1,y1,x2,y2,w,c,u){
  ctx.lineCap="round";
  ctx.strokeStyle=colMix(c,BLACK,0.22);ctx.lineWidth=w+2*u;line(x1,y1,x2,y2);
  ctx.strokeStyle=c;ctx.lineWidth=w;line(x1,y1,x2,y2);
}
/* 小人四肢：圆头粗线 */
function limb(x1,y1,x2,y2,w,u){
  ctx.lineCap="round";
  ctx.strokeStyle=PAL.text;ctx.lineWidth=w;line(x1,y1,x2,y2);
}
function drawFigure(cx,neckY,u){
  var parts=won?6:Math.min(wrong.length,6);
  var headR=16*u;
  var headY=neckY+headR;
  var bodyTop=headY+headR;
  var hipY=bodyTop+46*u;
  var e=5*u;
  if(parts>=2)limb(cx,bodyTop,cx,hipY,5*u,u);
  if(parts>=3)limb(cx,bodyTop+8*u,cx-24*u,bodyTop+28*u,4*u,u);
  if(parts>=4)limb(cx,bodyTop+8*u,cx+24*u,bodyTop+28*u,4*u,u);
  if(parts>=5)limb(cx,hipY,cx-18*u,hipY+34*u,4*u,u);
  if(parts>=6)limb(cx,hipY,cx+18*u,hipY+34*u,4*u,u);
  if(parts>=1){
    var hg=ctx.createRadialGradient(cx-headR*0.35,headY-headR*0.4,headR*0.15,cx,headY,headR*1.05);
    hg.addColorStop(0,colMix(PAL.tile1,WHITE,0.55));hg.addColorStop(0.55,PAL.tile1);hg.addColorStop(1,PAL.tile2);
    ctx.fillStyle=hg;ctx.beginPath();ctx.arc(cx,headY,headR,0,6.2832);ctx.fill();
    ctx.lineWidth=2*u;ctx.strokeStyle=PAL.text;ctx.stroke();
  }
  if(over&&!won){
    ctx.strokeStyle=PAL.danger;ctx.lineWidth=2*u;ctx.lineCap="round";
    line(cx-e-3*u,headY-4*u,cx-e+3*u,headY+4*u);
    line(cx-e-3*u,headY+4*u,cx-e+3*u,headY-4*u);
    line(cx+e-3*u,headY-4*u,cx+e+3*u,headY+4*u);
    line(cx+e-3*u,headY+4*u,cx+e+3*u,headY-4*u);
    ctx.beginPath();ctx.arc(cx,headY+9*u,4*u,1.15*Math.PI,1.85*Math.PI);ctx.stroke();
  }else if(won){
    ctx.fillStyle=PAL.text;
    ctx.beginPath();ctx.arc(cx-e,headY-2*u,1.8*u,0,6.2832);ctx.fill();
    ctx.beginPath();ctx.arc(cx+e,headY-2*u,1.8*u,0,6.2832);ctx.fill();
    ctx.strokeStyle=PAL.danger;ctx.lineWidth=2*u;ctx.lineCap="round";
    ctx.beginPath();ctx.arc(cx,headY+1*u,6*u,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  }else if(parts>=1){
    ctx.fillStyle=PAL.text;
    ctx.beginPath();ctx.arc(cx-e,headY-2*u,1.8*u,0,6.2832);ctx.fill();
    ctx.beginPath();ctx.arc(cx+e,headY-2*u,1.8*u,0,6.2832);ctx.fill();
    ctx.strokeStyle=PAL.text;ctx.lineWidth=1.6*u;ctx.lineCap="round";
    line(cx-3*u,headY+6*u,cx+3*u,headY+6*u);
  }
}
function draw(){
  if(!ctx||!L.W)return;
  var W=L.W,H=L.H,u=H/259;
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.board1);g.addColorStop(1,PAL.board2);
  ctx.fillStyle=g;rr(0.5,0.5,W-1,H-1,12*u);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.stroke();
  var gy=H-24*u,px=W*0.28,top=28*u,armX=W*0.72;
  ctx.fillStyle=colMix(PAL.board2,BLACK,0.10);
  ctx.beginPath();ctx.ellipse(W*0.5,gy+4*u,W*0.30,6*u,0,0,6.2832);ctx.fill();
  beam(14*u,gy,W-14*u,gy,5*u,PAL.rail,u);
  beam(px,gy,px,top,10*u,PAL.rail,u);
  beam(px,top,armX,top,9*u,PAL.rail,u);
  beam(px,top+34*u,px+(armX-px)*0.45,top,6*u,PAL.rail,u);
  ctx.strokeStyle=PAL.muted;ctx.lineWidth=3*u;ctx.lineCap="round";
  line(armX,top,armX,top+30*u);
  drawFigure(armX,top+30*u,u);
  if(won){
    var cols=[PAL.success,PAL.warning,PAL.water,PAL.danger];
    ctx.globalAlpha=.85;
    for(var i=0;i<18;i++){
      var fx=(i*97%100)/100*W;
      var fy=(i*53%100)/100*H*0.55;
      var fr=(2+(i%3))*u;
      ctx.fillStyle=cols[i%4];
      ctx.beginPath();ctx.arc(fx,fy,fr,0,6.2832);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  var h=Math.round(w*0.72);
  L.W=w;L.H=h;
  cv.style.height=h+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
/* ---------- 流程 ---------- */
function startLevel(n){syncLevelsToken++;syncSaveToken++;
  n=Math.max(0,Math.min(LEVELS.length-1,n));
  cur=n;
  var d=LEVELS[n]||{};
  word=String(d.word||"").toLowerCase();
  hint=String(d.hint||"");
  topic=String(d.topic||"");
  maxWrong=(Number.isInteger(d.maxWrong)&&d.maxWrong>=4&&d.maxWrong<=7)?d.maxWrong:6;
  guessed={};wrong=[];over=false;won=false;
  hideOverlay();
  msgEl.className="msg";
  $("topicText").textContent=topic||"-";
  renderHint();renderBlanks();renderKeys();renderStats();renderNav();draw();
  blanksEl.classList.add("enter");
  save();
  say("第 "+(n+1)+" 关 · "+topic+" · 单词共 "+word.length+" 个字母");
}
function revealedCount(){
  var n=0;for(var i=0;i<word.length;i++)if(guessed[word[i]])n++;
  return n;
}
function guess(ch){
  if(over||guessed[ch])return;
  guessed[ch]=true;
  blanksEl.classList.remove("enter");
  if(word.indexOf(ch)>=0){
    msgEl.className="msg good";
    if(revealedCount()===word.length){win();return;}
    say("猜对了！「"+ch.toUpperCase()+"」在单词里");
    renderBlanks();bumpBlanks();renderKeys();renderHint();renderStats();draw();
  }else{
    wrong.push(ch);
    msgEl.className="msg bad";
    if(wrong.length>=maxWrong){lose();return;}
    say("没有「"+ch.toUpperCase()+"」，还剩 "+(maxWrong-wrong.length)+" 次机会");
    renderKeys();renderHint();renderStats();draw();shakeStage();
  }
}
function win(){
  over=true;won=true;
  done[cur]=1;
  msgEl.className="msg good";
  save();renderStats();renderKeys();renderNav();draw();
  var sd=$("stDone");sd.classList.remove("bump");void sd.offsetWidth;sd.classList.add("bump");
  // 成绩上报（已过关卡 desc：越大越好）
  if(GB.available)GB.reportScore("hangman",{metricValue:clearedCount()}).catch(function(){});
  $("ovTitle").textContent="猜对了！";
  $("ovWord").textContent=word.toUpperCase();
  $("ovDesc").innerHTML="第 "+(cur+1)+" 关 · "+esc(topic)+"<br>"+esc(hint)+"<br>共用掉 "+wrong.length+" 次错误机会";
  setOvBtn(cur<LEVELS.length-1?"下一关":"再玩一轮",cur<LEVELS.length-1?"play":"rotate");
  showOverlay();
  say("猜对了！共用掉 "+wrong.length+" 次错误机会");
}
function lose(){
  over=true;won=false;
  msgEl.className="msg bad";
  renderKeys();renderHint();renderStats();renderNav();draw();
  $("ovTitle").textContent="机会用完";
  $("ovWord").textContent=word.toUpperCase();
  $("ovDesc").innerHTML="正确答案是上面的单词<br>释义："+esc(hint);
  setOvBtn("重玩本关","rotate");
  showOverlay();
  say("机会用完，正确答案是 "+word.toUpperCase());
}
/* ---------- 输入与按钮 ---------- */
window.addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var k=e.key;
  if(k&&k.length===1&&/[a-zA-Z]/.test(k))guess(k.toLowerCase());
});
$("btnPrev").addEventListener("click",function(){startLevel(cur-1);});
$("btnNext").addEventListener("click",function(){startLevel(cur+1);});
$("btnReset").addEventListener("click",function(){startLevel(cur);});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(won)startLevel(cur<LEVELS.length-1?cur+1:0);
  else startLevel(cur);
});
window.addEventListener("resize",resize);
/* ---------- 启动 ---------- */
buildKeys();
palLoad();resize();
startLevel(cur);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}

  /* 按钮 / 分区标签图标注入（内联 SVG，零外链；图标在文字前） */
  function $(id){return document.getElementById(id)}
  var dp=[["btnPrev","arrow-left"],["btnReset","rotate"],["btnNext","arrow-right"]],j;
  for(j=0;j<dp.length;j++)$(dp[j][0]).insertAdjacentHTML("afterbegin",window.SW_ICON(dp[j][1]));
  $("ovBtn").innerHTML=window.SW_ICON("play")+$("ovBtn").textContent;
  var dots=document.querySelectorAll("[data-ico]"),k;
  for(k=0;k<dots.length;k++)dots[k].innerHTML=window.SW_ICON(dots[k].getAttribute("data-ico"));
})();
</script>
