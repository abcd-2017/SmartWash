function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(!Number.isInteger(d.r)||d.r<4||d.r>10)return false;
  if(!Number.isInteger(d.c)||d.c<4||d.c>10)return false;
  if(!Array.isArray(d.islands)||d.islands.length<3)return false;
  var seen={};
  for(var i=0;i<d.islands.length;i++){
    var a=d.islands[i];
    if(!Array.isArray(a)||a.length!==3)return false;
    if(!Number.isInteger(a[0])||!Number.isInteger(a[1])||!Number.isInteger(a[2]))return false;
    if(a[0]<0||a[0]>=d.c||a[1]<0||a[1]>=d.r)return false;
    if(a[2]<1||a[2]>8)return false;
    var k=a[0]+","+a[1];if(seen[k])return false;seen[k]=1;
  }
  return true;
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    var ck=d.r+"x"+d.c+"|"+d.islands.map(function(a){return a.join(",")}).join(";");
    if(seen[ck])return null;seen[ck]=1;
    list.push({name:String(d.name||("第"+(i+1)+"关")),r:d.r,c:d.c,islands:d.islands.map(function(a){return [a[0],a[1],a[2]]})});
  }

}

function candidates(islands){
  var n=islands.length,edges=[];
  for(var i=0;i<n;i++)for(var j=i+1;j<n;j++){
    var a=islands[i],b=islands[j];
    if(a[1]===b[1]){
      var x0=Math.min(a[0],b[0]),x1=Math.max(a[0],b[0]),blocked=false;
      for(var k=0;k<n;k++)if(k!==i&&k!==j){var c=islands[k];if(c[1]===a[1]&&c[0]>x0&&c[0]<x1){blocked=true;break}}
      if(!blocked)edges.push({i:i,j:j,dir:"h",pos:a[1],lo:x0,hi:x1});
    }else if(a[0]===b[0]){
      var y0=Math.min(a[1],b[1]),y1=Math.max(a[1],b[1]),blocked2=false;
      for(var k2=0;k2<n;k2++)if(k2!==i&&k2!==j){var c2=islands[k2];if(c2[0]===a[0]&&c2[1]>y0&&c2[1]<y1){blocked2=true;break}}
      if(!blocked2)edges.push({i:i,j:j,dir:"v",pos:a[0],lo:y0,hi:y1});
    }
  }
  return edges;
}
function crosses(e1,e2){
  if(e1.dir===e2.dir)return false;
  var h=e1.dir==="h"?e1:e2,v=e1.dir==="h"?e2:e1;
  return v.pos>h.lo&&v.pos<h.hi&&h.pos>v.lo&&h.pos<v.hi;
}
/* ---------- 独立求解器：统计解数（上限 2），返回首个解的边数 ---------- */
function hashiSolve(islands,edges,clues,cap){
  var m=edges.length,n=islands.length;
  var cross=edges.map(function(){return []});
  for(var i=0;i<m;i++)for(var j=i+1;j<m;j++)if(crosses(edges[i],edges[j])){cross[i].push(j);cross[j].push(i)}
  var cnt=new Array(m).fill(0),deg=new Array(n).fill(0);
  var count=0,nodes=0,first=null;
  var MAX=cap||120000;
  function dfs(k){
    if(count>=2||nodes>MAX)return;
    if(k===m){
      for(var i2=0;i2<n;i2++)if(deg[i2]!==clues[i2])return;
      var parent=Array.from({length:n},function(_,x){return x});
      function find(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x]}return x}
      for(var e=0;e<m;e++)if(cnt[e]>0){var a=find(edges[e].i),b=find(edges[e].j);if(a!==b)parent[a]=b}
      var root=find(0);
      for(var i3=1;i3<n;i3++)if(find(i3)!==root)return;
      count++;if(!first)first=cnt.slice();
      return;
    }
    nodes++;
    var e=edges[k];
    for(var v=0;v<=2;v++){
      if(deg[e.i]+v>clues[e.i]||deg[e.j]+v>clues[e.j])continue;
      var ok=true;
      if(v>0)for(var q=0;q<cross[k].length;q++)if(cnt[cross[k][q]]>0){ok=false;break}
      if(!ok)continue;
      cnt[k]=v;deg[e.i]+=v;deg[e.j]+=v;
      var feasible=true;
      for(var i4=0;i4<n&&feasible;i4++){
        var maxAdd=0;
        for(var e2=k+1;e2<m;e2++)if(edges[e2].i===i4||edges[e2].j===i4)maxAdd+=2;
        if(deg[i4]+maxAdd<clues[i4])feasible=false;
      }
      if(feasible)dfs(k+1);
      cnt[k]=0;deg[e.i]-=v;deg[e.j]-=v;
      if(count>=2||nodes>MAX)return;
    }
  }
  dfs(0);
  return {count:count,nodes:nodes,sol:first};
}

}
function doneCount(){
  var d=0;for(var i=0;i<islands.length;i++)if(deg[i]===islands[i][2])d++;
  return d;
}
function updStats(){
  var bridges=0;for(var k=0;k<cnt.length;k++)bridges+=cnt[k];
  $("stLv").textContent=(lv+1)+" / "+LEVELS.length;
  $("stBr").textContent=bridges;
  $("stDone").textContent=doneCount()+" / "+islands.length;
  $("btnUndo").disabled=!history.length||over;
}
/* ---------- 关卡 ---------- */
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return}
  islands=L.islands.map(function(a){return [a[0],a[1],a[2]]});
  edges=candidates(islands);
  cross=edges.map(function(){return []});
  for(var i=0;i<edges.length;i++)for(var j=i+1;j<edges.length;j++)if(crosses(edges[i],edges[j])){cross[i].push(j);cross[j].push(i)}
  cnt=edges.map(function(){return 0});
  history=[];over=false;cur=0;
  calcDeg();
  $("lvTag").textContent="第 "+(lv+1)+" 关";
  $("lvRule").textContent=L.c+"×"+L.r+" · "+islands.length+" 岛";
  var r=hashiSolve(islands,edges,islands.map(function(a){return a[2]}),120000);
  if(r.count!==1)say("警告：内嵌求解器判定本关解不唯一（数据异常）");
  else say("点两座同排岛屿架桥，再点一次加双桥");
  resize();updStats();renderLevels();
}
function edgeBetween(i,j){
  for(var k=0;k<edges.length;k++)if((edges[k].i===i&&edges[k].j===j)||(edges[k].i===j&&edges[k].j===i))return k;
  return -1;
}
function cycleEdge(k){
  if(k<0||over)return;
  var e=edges[k],nv=(cnt[k]+1)%3;
  if(nv>0){
    if(deg[e.i]+nv>islands[e.i][2]){say("超出该岛所需桥数");return}
    if(deg[e.j]+nv>islands[e.j][2]){say("超出该岛所需桥数");return}
    for(var q=0;q<cross[k].length;q++)if(cnt[cross[k][q]]>0){say("桥梁不能交叉");return}
  }
  history.push({k:k,prev:cnt[k]});
  cnt[k]=nv;calcDeg();updStats();
  if(nv===2)say("已加双桥");else if(nv===1)say("已架单桥");else say("已拆除");
  checkWin();
}
function islandAt(px,py){
  var best=-1,bd=1e9;
  for(var i=0;i<islands.length;i++){
    var x=pad+islands[i][0]*cell+cell/2,y=pad+islands[i][1]*cell+cell/2;
    var d=Math.hypot(px-x,py-y);
    if(d<bd){bd=d;best=i}
  }
  if(bd<=cell*0.55)return best;
  return -1;
}
function undo(){
  if(!history.length||over)return;
  var h=history.pop();cnt[h.k]=h.prev;
  calcDeg();updStats();say("撤销一步");
}
function hint(){
  if(over)return;
  var r=hashiSolve(islands,edges,islands.map(function(a){return a[2]}),120000);
  if(r.count!==1||!r.sol){say("本关解不唯一，无法提示");return}
  for(var k=0;k<edges.length;k++)if(cnt[k]!==r.sol[k]){var pv=cnt[k];cnt[k]=r.sol[k];history.push({k:k,prev:pv});break}
  calcDeg();updStats();say("提示：已按解架了一座桥");
  checkWin();
}
function checkWin(){
  for(var i=0;i<islands.length;i++)if(deg[i]!==islands[i][2])return;
  var parent=islands.map(function(_,x){return x});
  function find(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x]}return x}
  for(var k=0;k<edges.length;k++)if(cnt[k]>0){var a=find(edges[k].i),b=find(edges[k].j);if(a!==b)parent[a]=b}
  var root=find(0);
  for(var i2=1;i2<islands.length;i2++)if(find(i2)!==root)return;
  winLevel();
}
function winLevel(){
  over=true;
  save.done[lv]=true;
  if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
  persist();updStats();renderLevels();
  if(GB.available)GB.reportScore("hashi-wire",{metricValue:lv+1,metricExtra:islands.length}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"过关！";
  $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成<br>"+islands.length+" 座岛全部连通";
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
function renderLevels(){
  var el=$("levels");el.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lv"+(i===lv?" cur":"")+(save.done[i]?" done":"");
      b.textContent=i+1;b.disabled=i>save.lv;
      b.addEventListener("click",function(){if(i===lv&&!over)return;lv=i;persist();hideOverlay();loadLevel(i)});
      el.appendChild(b);
    })(i);
  }
}
/* ---------- 绘制 ---------- */
function draw(){
  ctx.fillStyle=PAL.board;ctx.fillRect(0,0,W,H);
  if(!L)return;
  //点
  ctx.fillStyle=PAL.dot;
  for(var y=0;y<L.r;y++)for(var x=0;x<L.c;x++){
    ctx.beginPath();ctx.arc(pad+x*cell+cell/2,pad+y*cell+cell/2,2.5,0,7);ctx.fill();
  }
  //桥
  ctx.strokeStyle=PAL.br;ctx.lineCap="round";
  for(var k=0;k<edges.length;k++){
    if(!cnt[k])continue;
    var e=edges[k];
    var ax=pad+islands[e.i][0]*cell+cell/2,ay=pad+islands[e.i][1]*cell+cell/2;
    var bx=pad+islands[e.j][0]*cell+cell/2,by=pad+islands[e.j][1]*cell+cell/2;
    var dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len;
    ctx.lineWidth=3;
    for(var m=0;m<cnt[k];m++){
      var off=(m===0?-3:3);
      ctx.beginPath();ctx.moveTo(ax+nx*off,ay+ny*off);ctx.lineTo(bx+nx*off,by+ny*off);ctx.stroke();
    }
  }
  //岛
  for(var i=0;i<islands.length;i++){
    var cx=pad+islands[i][0]*cell+cell/2,cy=pad+islands[i][1]*cell+cell/2;
    var r=Math.max(12,cell*0.32);
    var done=deg[i]===islands[i][2];
    ctx.fillStyle=done?PAL.soft:PAL.isl;
    ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
    ctx.strokeStyle=i===cur?PAL.deep:PAL.islln;ctx.lineWidth=i===cur?3:2;
    ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
    ctx.fillStyle=done?PAL.deep:PAL.text;
    ctx.font="700 "+(r>=16?18:14)+"px -apple-system,'PingFang SC',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(String(islands[i][2]),cx,cy+1);
  }
  requestAnimationFrame(draw);
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  if(over)return;
  var rc=cv.getBoundingClientRect();
  var i=islandAt(e.clientX-rc.left,e.clientY-rc.top);
  if(i<0)return;
  if(cur===i){say("再点另一座同排的岛");return}
  var k=edgeBetween(cur,i);
  if(k>=0){cycleEdge(k);cur=i}
  else{cur=i;say("已选岛，再点同排另一座岛")}
  e.preventDefault();
});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){
  if(over)return;
  for(var k=0;k<cnt.length;k++)cnt[k]=0;
  history=[];calcDeg();updStats();say("已清空所有桥");
});
$("btnLv").addEventListener("click",function(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    var b=document.createElement("button");
    b.className="lvbtn"+(save.done[i]?" done":"");
    b.textContent=i+1;b.disabled=i>save.lv;
    b.addEventListener("click",function(){
      lv=+this.textContent-1;save.lv=Math.max(save.lv,lv);persist();loadLevel(lv);hideOverlay();
    });
    g.appendChild(b);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="通关的关卡标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(over){
    if(lv>=LEVELS.length-1){lv=0;loadLevel(0)}
    else loadLevel(lv+1);
  }
});
window.addEventListener("keydown",function(e){
  if(!L)return;
  var dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  var d=dirs[e.key];
  if(d){
    e.preventDefault();
    if(over)return;
    var x0=islands[cur][0],y0=islands[cur][1],t=-1,bd=1e9;
    for(var i=0;i<islands.length;i++){
      var dx=islands[i][0]-x0,dy=islands[i][1]-y0;
      if(d[0]!==0){if(dy!==0||dx*d[0]<=0)continue;if(Math.abs(dx)<bd){bd=Math.abs(dx);t=i}}
      else{if(dx!==0||dy*d[1]<=0)continue;if(Math.abs(dy)<bd){bd=Math.abs(dy);t=i}}
    }
    if(t<0){say("该方向没有岛屿");return}
    var k=edgeBetween(cur,t);
    if(k>=0){cycleEdge(k);cur=t}
    return;
  }
  if(e.key==="z"||e.key==="Z"){undo()}
  else if(e.key==="h"||e.key==="H"){hint()}
  else if(e.key==="Tab"){
    e.preventDefault();
    cur=(cur+(e.shiftKey?-1:1)+islands.length)%islands.length;
  }
});
function hideOverlay(){$("overlay").classList.remove("show")}
window.addEventListener("resize",resize);
/* ---------- 启动 ---------- */
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("hashi-wire").then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    applyLevels(list,res.version||0);
    if(lv>LEVELS.length-1)lv=LEVELS.length-1;
    save.lv=Math.min(save.lv,lv);persist();
    loadLevel(lv);
  }).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("hashi-wire").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(r.lv,10)||0;
      if(rl>save.lv){save.lv=Math.min(LEVELS.length-1,rl);changed=true}
      if(r.done&&typeof r.done==="object")for(var k in r.done)if(r.done[k]&&!save.done[k]){save.done[k]=true;changed=true}
      if(changed){persist();loadLevel(save.lv)}
    }catch(e){}
  }).catch(function(){});
}
palLoad();resize();loadLevel(lv);
requestAnimationFrame(draw);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套） */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
