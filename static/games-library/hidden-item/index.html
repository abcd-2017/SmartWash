<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  /*token:GAME-THEME.md §2 基线（值与基线一致）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; min-width: 0; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.low { color: var(--g-danger); }
  .stage { position: relative; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--g-btn-primary); color: #fff; font-size: 16px; font-weight: 600; }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .35; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }

  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效 */

  }

<script>

  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();

try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="hidden-item",SAVE_KEY="sw.hiddenitem.v1";
var DEFAULT_LEVELS=[{"name":"寻物·01","seed":962726,"m":3,"time":65,"difficulty":1},{"name":"寻物·02","seed":222981,"m":3,"time":65,"difficulty":1},{"name":"寻物·03","seed":113433,"m":3,"time":65,"difficulty":1},{"name":"寻物·04","seed":876753,"m":3,"time":65,"difficulty":1},{"name":"寻物·05","seed":461937,"m":3,"time":65,"difficulty":1},{"name":"寻物·06","seed":319106,"m":3,"time":60,"difficulty":1},{"name":"寻物·07","seed":660200,"m":3,"time":60,"difficulty":1},{"name":"寻物·08","seed":559610,"m":4,"time":60,"difficulty":2},{"name":"寻物·09","seed":798416,"m":4,"time":60,"difficulty":2},{"name":"寻物·10","seed":463296,"m":4,"time":60,"difficulty":2},{"name":"寻物·11","seed":242852,"m":4,"time":55,"difficulty":2},{"name":"寻物·12","seed":790649,"m":4,"time":55,"difficulty":2},{"name":"寻物·13","seed":960817,"m":4,"time":55,"difficulty":2},{"name":"寻物·14","seed":14962,"m":4,"time":55,"difficulty":2},{"name":"寻物·15","seed":391349,"m":5,"time":55,"difficulty":3},{"name":"寻物·16","seed":585529,"m":5,"time":50,"difficulty":3},{"name":"寻物·17","seed":57843,"m":5,"time":50,"difficulty":3},{"name":"寻物·18","seed":552663,"m":5,"time":50,"difficulty":3},{"name":"寻物·19","seed":656017,"m":5,"time":50,"difficulty":3},{"name":"寻物·20","seed":240095,"m":5,"time":50,"difficulty":3},{"name":"寻物·21","seed":449560,"m":5,"time":45,"difficulty":3},{"name":"寻物·22","seed":968436,"m":6,"time":45,"difficulty":4},{"name":"寻物·23","seed":61952,"m":6,"time":45,"difficulty":4},{"name":"寻物·24","seed":20660,"m":6,"time":45,"difficulty":4},{"name":"寻物·25","seed":192849,"m":6,"time":45,"difficulty":4},{"name":"寻物·26","seed":127416,"m":6,"time":40,"difficulty":4},{"name":"寻物·27","seed":364796,"m":6,"time":40,"difficulty":4},{"name":"寻物·28","seed":710518,"m":6,"time":40,"difficulty":4},{"name":"寻物·29","seed":211577,"m":7,"time":40,"difficulty":5},{"name":"寻物·30","seed":290536,"m":7,"time":40,"difficulty":5},{"name":"寻物·31","seed":571174,"m":7,"time":35,"difficulty":5},{"name":"寻物·32","seed":84586,"m":7,"time":35,"difficulty":5},{"name":"寻物·33","seed":318095,"m":7,"time":35,"difficulty":5},{"name":"寻物·34","seed":934444,"m":7,"time":35,"difficulty":5},{"name":"寻物·35","seed":891477,"m":7,"time":35,"difficulty":5},{"name":"寻物·36","seed":787655,"m":8,"time":35,"difficulty":6},{"name":"寻物·37","seed":764903,"m":8,"time":35,"difficulty":6},{"name":"寻物·38","seed":193874,"m":8,"time":35,"difficulty":6},{"name":"寻物·39","seed":319642,"m":8,"time":35,"difficulty":6},{"name":"寻物·40","seed":772836,"m":8,"time":35,"difficulty":6}];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!verifyLevel(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return verifyLevel(d)})){
      LEVELS=list.map(normalizeLevel);return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
      resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

//__VERIFY__START
/* 场景寻物独立验证器（模拟回放）：种子重建场景陈设与物品布点，
   校验物品在界内、两两及与陈设间距达标（点选无歧义），回放逐个点选可全部找到 */
var HI_GLYPHS=10;
var HI_NAMES=["星星","爱心","钥匙","月亮","小鱼","树叶","铃铛","水滴","闪电","杯子"];
function hiRng(seed){
  var a=seed>>>0;
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
/* 陈设：每关 12 个装饰件（随机形状/位置/大小） */
function hiBuildDecor(seed){
  var rng=hiRng(seed),decor=[];
  for(var i=0;i<12;i++){
    decor.push({t:Math.floor(rng()*5),
      x:0.08+rng()*0.84,y:0.1+rng()*0.78,
      s:0.06+rng()*0.09,c:Math.floor(rng()*5),r:rng()*6.28});
  }
  return decor;
}
/* 隐藏物品：m 件，类型取自清单（互不相同），布点远离彼此与陈设 */
function hiPlaceItems(decor,m,seed){
  var rng=hiRng(seed^0x51AB),types=[],pool=[];
  for(var i=0;i<HI_GLYPHS;i++)pool.push(i);
  for(i=0;i<HI_GLYPHS;i++){var j=Math.floor(rng()*HI_GLYPHS);var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  types=pool.slice(0,m);
  var items=[],guard=0;
  while(items.length<m&&guard++<600){
    var it={t:types[items.length],
      x:0.08+rng()*0.84,y:0.12+rng()*0.76,
      s:0.045+rng()*0.03,r:rng()*6.28};
    var ok=true;
    for(var k=0;k<items.length;k++){
      if(Math.hypot(items[k].x-it.x,items[k].y-it.y)<0.14){ok=false;break;}
    }
    if(ok)for(k=0;k<decor.length;k++){
      if(Math.hypot(decor[k].x-it.x,decor[k].y-it.y)<(decor[k].s+it.s)*0.9){ok=false;break;}
    }
    if(ok)items.push(it);
  }
  return items.length===m?items:null;
}
function verifyLevel(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.seed)||d.seed<0||d.seed>=1000000)return false;
  if(!Number.isInteger(d.m)||d.m<3||d.m>8)return false;
  if(!Number.isInteger(d.time)||d.time<20||d.time>180)return false;
  var decor=hiBuildDecor(d.seed);
  var items=hiPlaceItems(decor,d.m,d.seed);
  if(!items)return false;
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(it.x<0||it.x>1||it.y<0||it.y>1)return false;
    if(it.t<0||it.t>=HI_GLYPHS)return false;
  }
  // 回放：清单类型 = 布点类型集合（互不相同），逐个点选可找齐
  var types=items.map(function(it){return it.t}).sort();
  for(i=1;i<types.length;i++)if(types[i]===types[i-1])return false;
  return true;
}
function normalizeLevel(d){
  return {name:String(d.name),seed:d.seed,m:d.m,time:d.time,
    difficulty:Math.min(9,Math.max(1,Number.isInteger(d.difficulty)?d.difficulty:5))};
}
//__VERIFY__END

/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water")};
}
window.__gOnTheme=function(){palLoad();hcolLoad()};
var HCOLS=[];
function hcolLoad(){
  HCOLS=[PAL.primary,PAL.water,PAL.danger,PAL.warning,PAL.text];
}
/* ---------- 图形（清单图标与场景隐藏物共用） ---------- */
function glyphSVG(t){
  var c="currentColor",p="";
  if(t===0)p='<circle cx="12" cy="11" r="7" fill="'+c+'"/><path d="M12 18l-2 4h4z" fill="'+c+'"/>';
  else if(t===1)p='<path d="M12 20C6 14 4 10.5 4 8a4.4 4.4 0 0 1 8-2.4A4.4 4.4 0 0 1 20 8c0 2.5-2 6-8 12z" fill="'+c+'"/>';
  else if(t===2)p='<circle cx="8" cy="14" r="4.5" fill="none" stroke="'+c+'" stroke-width="2.6"/><path d="M11 11L20 4M16 6l3 3M13 9l2.4 2.4" stroke="'+c+'" stroke-width="2.4" fill="none"/>';
  else if(t===3)p='<path d="M17 4a9 9 0 1 0 3 12A8 8 0 0 1 17 4z" fill="'+c+'"/>';
  else if(t===4)p='<path d="M3 12c3-5 6-7 9-7s6 2 9 7c-3 5-6 7-9 7s-6-2-9-7z" fill="'+c+'"/><circle cx="12" cy="11" r="1.8" fill="var(--g-surface)"/>';
  else if(t===5)p='<path d="M12 3C7 8 5 12 5 15a7 7 0 0 0 14 0c0-3-2-7-7-12z" fill="'+c+'"/><path d="M12 7v12" stroke="var(--g-surface)" stroke-width="1.6"/>';
  else if(t===6)p='<path d="M12 3c0 4-5 6-5 11a5 5 0 0 0 10 0c0-5-5-7-5-11z" fill="'+c+'"/>';
  else if(t===7)p='<path d="M7 4h10l2 5-2 1v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-8L5 9z" fill="'+c+'"/>';
  else if(t===8)p='<path d="M13 2L5 14h5l-1 8 8-12h-5z" fill="'+c+'"/>';
  else p='<path d="M5 4h12v3a6 6 0 0 1-12 0zM4 19h14v3H4zM6 13h10v5H6z" fill="'+c+'"/>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
}
function drawGlyph(ctx,t,x,y,s,rot,col){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.fillStyle=col;
  ctx.strokeStyle=col;
  var u=s;
  if(t===0){
    ctx.beginPath();ctx.arc(0,-u*0.2,u*0.7,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,u*0.5);ctx.lineTo(0,u*1.1);ctx.stroke();
  }else if(t===1){
    ctx.beginPath();
    ctx.moveTo(0,u*0.8);
    ctx.bezierCurveTo(-u*1.2,0,-u*0.8,-u*0.8,0,-u*0.25);
    ctx.bezierCurveTo(u*0.8,-u*0.8,u*1.2,0,0,u*0.8);
    ctx.fill();
  }else if(t===2){
    ctx.lineWidth=u*0.35;
    ctx.beginPath();ctx.arc(-u*0.3,u*0.3,u*0.45,0,7);ctx.stroke();
    ctx.lineWidth=u*0.3;
    ctx.beginPath();ctx.moveTo(0,u*0.05);ctx.lineTo(u*0.75,-u*0.5);ctx.stroke();
  }else if(t===3){
    ctx.beginPath();
    ctx.arc(u*0.15,0,u*0.8,2.2,5.2);
    ctx.arc(u*0.5,-u*0.1,u*0.6,3.4,6.4);
    ctx.fill();
  }else if(t===4){
    ctx.beginPath();
    ctx.ellipse(0,0,u*0.9,u*0.5,0,0,7);
    ctx.moveTo(-u*0.9,0);
    ctx.lineTo(-u*1.4,-u*0.45);
    ctx.fill();
    ctx.fillStyle=PAL.surface;
    ctx.beginPath();ctx.arc(u*0.25,-u*0.1,u*0.14,0,7);ctx.fill();
  }else if(t===5){
    ctx.beginPath();
    ctx.moveTo(0,-u);
    ctx.bezierCurveTo(-u*0.7,-u*0.2,-u*0.7,u*0.5,0,u);
    ctx.bezierCurveTo(u*0.7,u*0.5,u*0.7,-u*0.2,0,-u);
    ctx.fill();
    ctx.strokeStyle=PAL.surface;ctx.lineWidth=u*0.16;
    ctx.beginPath();ctx.moveTo(0,-u*0.5);ctx.lineTo(0,u*0.5);ctx.stroke();
  }else if(t===6){
    ctx.beginPath();
    ctx.moveTo(0,-u);
    ctx.bezierCurveTo(-u*0.75,-u*0.1,-u*0.75,u*0.4,0,u*0.75);
    ctx.bezierCurveTo(u*0.75,u*0.4,u*0.75,-u*0.1,0,-u);
    ctx.fill();
  }else if(t===7){
    ctx.fillRect(-u*0.7,-u*0.7,u*1.4,u*0.5);
    ctx.beginPath();
    ctx.moveTo(-u*0.7,-u*0.2);ctx.lineTo(-u*0.5,-u*0.2);ctx.lineTo(-u*0.55,u*0.3);
    ctx.lineTo(u*0.55,u*0.3);ctx.lineTo(u*0.5,-u*0.2);ctx.lineTo(u*0.7,-u*0.2);
    ctx.closePath();ctx.fill();
    ctx.fillRect(-u*0.2,-u,u*0.4,u*0.35);
  }else if(t===8){
    ctx.beginPath();
    ctx.moveTo(u*0.2,-u);ctx.lineTo(-u*0.6,u*0.15);ctx.lineTo(-u*0.05,u*0.15);ctx.lineTo(-u*0.2,u);
    ctx.lineTo(u*0.6,-u*0.15);ctx.lineTo(u*0.05,-u*0.15);
    ctx.closePath();ctx.fill();
  }else{
    ctx.fillRect(-u*0.8,-u*0.8,u*1.6,u*0.4);
    ctx.fillRect(-u*0.7,-u*0.4,u*1.4,u*0.9);
    ctx.fillRect(-u*0.9,u*0.5,u*1.8,u*0.3);
  }
  ctx.restore();
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,decor=[],items=[],found=[],misses=0,done=false;
var mode="ready",selOpen=false,remain=0,lastT=0,probe=[0.5,0.5],lastMiss=null;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);
  H=Math.round(w*0.82);
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function draw(){
  ctx.fillStyle=PAL.bg;
  ctx.fillRect(0,0,W,H);
  // 房间底色
  ctx.fillStyle=PAL.surface;
  ctx.fillRect(0,0,W,H);
  // 地板线
  ctx.strokeStyle=PAL.border;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,H*0.72);ctx.lineTo(W,H*0.72);ctx.stroke();
  // 陈设
  for(var i=0;i<decor.length;i++){
    var d=decor[i];
    ctx.save();
    ctx.translate(d.x*W,d.y*H);
    ctx.rotate((d.r-3.14)*0.15);
    ctx.fillStyle=[PAL.surface2,PAL.primary,PAL.water,PAL.warning,PAL.faint][d.c];
    var u=d.s*W;
    if(d.t===0){ctx.fillRect(-u,-u*0.6,u*2,u*1.2);ctx.fillStyle=PAL.border;ctx.fillRect(-u,-u*0.6,u*2,u*0.18);}
    else if(d.t===1){ctx.beginPath();ctx.arc(0,0,u,0,7);ctx.fill();}
    else if(d.t===2){ctx.beginPath();ctx.ellipse(0,0,u*1.3,u*0.8,0,0,7);ctx.fill();}
    else if(d.t===3){ctx.fillRect(-u*0.8,-u*0.8,u*1.6,u*1.6);}
    else{ctx.beginPath();ctx.moveTo(-u,u*0.7);ctx.lineTo(0,-u*0.9);ctx.lineTo(u,u*0.7);ctx.closePath();ctx.fill();}
    ctx.restore();
  }
  // 隐藏物品
  for(i=0;i<items.length;i++){
    var it=items[i];
    drawGlyph(ctx,it.t,it.x*W,it.y*H,it.s*W,it.r,HCOLS[it.t%5]);
    if(found[i]){
      ctx.strokeStyle=PAL.success;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(it.x*W,it.y*H,it.s*W*1.9,0,7);ctx.stroke();
    }
  }
  // 失误点
  if(lastMiss&&performance.now()-lastMiss.t<400){
    ctx.fillStyle=PAL.danger;
    ctx.beginPath();ctx.arc(lastMiss.x*W,lastMiss.y*H,7,0,7);ctx.fill();
  }
  // 探针
  ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(probe[0]*W,probe[1]*H,10,0,7);ctx.stroke();
  // 计时条
  if(L){
    var frac=Math.max(0,Math.min(1,remain/L.time));
    ctx.fillStyle=PAL.surface2;
    ctx.fillRect(0,H-3,W,3);
    ctx.fillStyle=frac<0.25?PAL.danger:PAL.primary;
    ctx.fillRect(0,H-3,W*frac,3);
  }
}
function loop(t){
  if(mode==="playing"){
    var dt=(t-lastT)/1000;
    remain-=dt;
    if(remain<=0){remain=0;timeUp();}
  }
  lastT=t;
  draw();
  $("stTime").textContent=Math.ceil(remain);
  $("stTime").className="val"+(remain<10?" low":"");
  requestAnimationFrame(loop);
}
function updStats(){
  $("stFound").textContent=found.length+"/"+items.length;
}
function renderChips(){
  var box=$("chips");
  box.innerHTML="";
  for(var i=0;i<items.length;i++){
    var d=document.createElement("span");
    d.className="chip"+(found[i]?" found":"");
    d.innerHTML=glyphSVG(items[i].t)+"<span>"+HI_NAMES[items[i].t]+"</span>";
    box.appendChild(d);
  }
}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!verifyLevel(L)){say("关卡数据异常");return;}
  decor=hiBuildDecor(L.seed);
  items=hiPlaceItems(decor,L.m,L.seed);
  found=[];misses=0;done=false;probe=[0.5,0.5];remain=L.time;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent="找齐 "+items.length+" 件 · 限时 "+L.time+" 秒";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  updStats();renderChips();
  mode="ready";
  say("点「开始寻找」后计时开始；切后台自动暂停");
  showReady();
}
function showReady(){
  $("ovTitle").textContent="第 "+(lv+1)+" 关";
  $("ovDesc").textContent="限时 "+L.time+" 秒找齐 "+items.length+" 件物品";
  $("ovBtn").textContent="开始寻找";
  $("overlay").classList.add("show");
}
function startPlay(){
  hideOverlay();
  mode="playing";
  lastT=performance.now();
  say("对照上方清单，在场景里点出隐藏物品");
}
function timeUp(){
  mode="over";
  $("ovTitle").textContent="时间到！";
  $("ovDesc").textContent="还差 "+(items.length-found.length)+" 件没找到";
  $("ovBtn").textContent="重试本关";
  $("overlay").classList.add("show");
}
function probeAt(x,y){
  if(mode!=="playing"||done)return;
  for(var i=0;i<items.length;i++){
    if(found[i])continue;
    var it=items[i];
    if(Math.hypot(it.x-x,it.y-y)<Math.max(0.09,it.s*1.4)){
      found[i]=true;
      renderChips();updStats();
      if(found.length===items.length)winLevel();
      else say("找到了「"+HI_NAMES[it.t]+"」！还差 "+(items.length-found.length)+" 件");
      return;
    }
  }
  misses++;
  lastMiss={x:x,y:y,t:performance.now()};
  say("这里没有目标物品（已错 "+misses+" 次）");
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;mode="over";
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:Math.ceil(remain)}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"火眼金睛！";
  $("ovDesc").innerHTML="剩 "+Math.ceil(remain)+" 秒找齐 "+items.length+" 件（失误 "+misses+" 次）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=(e.clientX-rect.left)/W,y=(e.clientY-rect.top)/H;
  e.preventDefault();
  if(mode!=="playing")return;
  probe=[x,y];
  probeAt(x,y);
});
$("btnLv").addEventListener("click",function(){
  selOpen=true;
  openLevelSelect();
  if(mode==="playing")mode="paused";
});
$("ovBtn").addEventListener("click",function(){
  if(mode==="ready"&&!selOpen){startPlay();return;}
  if(mode==="paused"){
    selOpen=false;
    hideOverlay();
    if($("ovBtn").textContent==="继续"){mode="playing";lastT=performance.now();return;}
    loadLevel(lv);
    return;
  }
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }else{
    loadLevel(lv);
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if($("overlay").classList.contains("show"))return;
  if(k==="ArrowUp"&&probe[1]>0.03){probe[1]-=0.05;e.preventDefault();}
  else if(k==="ArrowDown"&&probe[1]<0.97){probe[1]+=0.05;e.preventDefault();}
  else if(k==="ArrowLeft"&&probe[0]>0.03){probe[0]-=0.05;e.preventDefault();}
  else if(k==="ArrowRight"&&probe[0]<0.97){probe[0]+=0.05;e.preventDefault();}
  else if(k===" "||k==="Enter"){probeAt(probe[0],probe[1]);e.preventDefault();}
});
/* 切后台自动暂停（计时类硬要求） */
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&mode==="playing"&&!selOpen){
    mode="paused";
    $("ovTitle").textContent="已暂停";
    $("ovDesc").textContent="回到游戏点「继续」";
    $("ovBtn").textContent="继续";
    $("overlay").classList.add("show");
  }
});
window.addEventListener("resize",resize);
/* ---------- 启动：逐关回放复核 ---------- */
(function(){
  var ok=[];
  for(var i=0;i<LEVELS.length;i++){
    var pass=false;
    try{pass=verifyLevel(LEVELS[i])}catch(e){pass=false}
    if(pass)ok.push(LEVELS[i]);
  }
  if(ok.length)LEVELS=ok;
})();
palLoad();hcolLoad();loadLevel(save.lv);resize();
requestAnimationFrame(loop);
syncLevelsFromServer();syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
