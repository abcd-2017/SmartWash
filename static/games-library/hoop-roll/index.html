<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（--g-st-* 为本作素材色，深色为同色相压暗变体）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-st-sky1:#EAF4EC;--g-st-sky2:#F5F6F3;--g-st-gnd:#7CB85C;--g-st-gnd2:#5E9B46;--g-st-hoop:#C9CFC7;--g-st-hook:#8A6A44;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-sky1:#1B241E;--g-st-sky2:#141614;--g-st-gnd:#3E5A30;--g-st-gnd2:#2E4423;--g-st-hoop:#6B736B;--g-st-hook:#6B5236;color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 2px; text-align: center; line-height: 1.3; min-width: 0; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.low { color: var(--g-danger); }
  .stage { position: relative; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); box-shadow: var(--g-shadow); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--g-btn-primary); color: #fff; }
  .btn:active { opacity: .85; }
  .btn[disabled] { opacity: .4; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay { position: fixed; inset: 0; z-index: 10; background: var(--g-scrim); display: none; align-items: center; justify-content: center; padding: 20px; }
  .overlay.show { display: flex; }
  .panel { width: 100%; max-width: 320px; padding: 22px 18px; background: var(--g-surface); border-radius: var(--g-radius); box-shadow: var(--g-shadow); text-align: center; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .desc b { color: var(--g-primary-deep); font-size: 28px; }
  .panel .btn { width: 100%; }

  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>

window.SW_ICON=function(n,s){s=s||"";var P={
 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>','arrow-left':'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 'arrow-up':'<path d="M12 19V5M6 11l6-6 6 6"/>','arrow-down':'<path d="M12 5v14M6 13l6 6 6-6"/>',

 'star-o':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',

<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<body>
<div class="wrap">
  <header><span class="sub">长按左右两侧扶正铁环，滚得越远越好</span><span class="sub" id="bestTag">最高 0 m</span></header>
  <div class="stats">
    <div class="stat"><span class="label">距离</span><span class="val" id="stDist">0 m</span></div>
    <div class="stat"><span class="label">速度</span><span class="val" id="stSpeed">0</span></div>
    <div class="stat"><span class="label">平衡</span><span class="val" id="stBal">稳</span></div>
  </div>
  <div class="stage"><canvas id="cv" aria-label="滚铁环山道" role="img"></canvas></div>
  <p class="msg" id="msg" role="status" aria-live="polite">长按屏幕左/右半或 ←/→ 键施加推力</p>
  <div class="tools">
    <button class="btn" id="btnRestart" type="button">重开</button>
    <button class="btn" id="btnHint" type="button">提示</button>
    <button class="btn primary" id="btnStart" type="button">开始</button>
  </div>
  <p class="foot">铁环会随坡度晃动，反向轻推即可回正 · 速度越快的山道越颠</p>
</div>
<div class="overlay" role="dialog" aria-modal="true" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">摔倒啦</h2>
    <p class="desc" id="ovDesc"></p>
    <button class="btn primary" id="ovBtn" type="button">再来一次</button>
  </div>
</div>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层 ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    success:v("--g-success"),warning:v("--g-warning"),danger:v("--g-danger"),
    sky1:v("--g-st-sky1"),sky2:v("--g-st-sky2"),gnd:v("--g-st-gnd"),gnd2:v("--g-st-gnd2"),
    hoop:v("--g-st-hoop"),hook:v("--g-st-hook")};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 常量与状态 ---------- */
var SAVE_KEY="sw.hooproll.v1";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,dpr=1;
var baseY=0,amp=40;
var worldX=0,dist=0,speed=0,theta=0,thetaV=0;
var input=0,running=false,over=false,best=0;
var seed=1,linePts=[];
var lastTs=0;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* 确定性伪随机 */
function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
/* 山道高度：控制点 + 余弦插值 */
function groundY(x){
  var step=150,i=Math.floor(x/step),f=x/step-i;
  var a=ctrl(i),b=ctrl(i+1);
  var t=(1-Math.cos(f*Math.PI))/2;
  return baseY-(a+(b-a)*t);
}
var ctrlCache={};
function ctrl(i){
  if(ctrlCache[i]!==undefined)return ctrlCache[i];
  var v=0;
  if(i<=0)v=0;
  else if(i===1)v=(rnd()-0.5)*amp;
  else{
    var prev=ctrl(i-1);
    v=prev+(rnd()-0.5)*amp*0.9;
    v=Math.max(-amp,Math.min(amp*1.2,v));
  }
  ctrlCache[i]=v;return v;
}
/* ---------- 存档 ---------- */
function loadBest(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&typeof s.best==="number")return s.best;}catch(e){}return 0}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({best:best}));}catch(e){}
  if(GB.available)GB.saveState("hoop-roll",{best:best}).catch(function(){});
}
best=loadBest();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("hoop-roll").then(function(res){
    if(!res||!res.stateJson)return;
    try{var r=JSON.parse(res.stateJson);var rb=parseInt(r.best,10)||0;if(rb>best){best=rb;persist();updStats()}}catch(e){}
  }).catch(function(){});
}
/* ---------- 布局 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=wCss;H=Math.round(W*0.72);
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  baseY=Math.round(H*0.68);amp=Math.max(28,Math.round(H*0.12));
}
/* ---------- 统计 ---------- */
function updStats(){
  $("stDist").textContent=Math.floor(dist)+" m";
  $("stSpeed").textContent=Math.round(speed/12);
  var bal=$("stBal");
  var a=Math.abs(theta);
  if(a<0.18){bal.textContent="稳";bal.classList.remove("low")}
  else if(a<0.42){bal.textContent="晃";bal.classList.remove("low")}
  else{bal.textContent="危险";bal.classList.add("low")}
  $("bestTag").textContent="最高 "+Math.floor(best)+" m";
}
/* ---------- 流程 ---------- */
function start(){
  seed=(Date.now()%100000)|0;ctrlCache={};linePts=[];
  worldX=0;dist=0;speed=0;theta=0;thetaV=0;input=0;
  running=true;over=false;hideOverlay();
  say("长按屏幕左/右半或 ←/→ 键施加推力");
}
function endGame(){
  running=false;over=true;
  var isNew=dist>best;
  if(isNew){best=dist;persist()}
  if(GB.available)GB.reportScore("hoop-roll",{metricValue:Math.floor(dist),metricExtra:Math.round(speed)}).catch(function(){});
  $("ovTitle").textContent="铁环倒了";
  $("ovDesc").innerHTML="滚出 <b>"+Math.floor(dist)+"</b> m"+(isNew?" · 新纪录":"")+"<br>最高 "+Math.floor(best)+" m";
  $("overlay").classList.add("show");
}
/* ---------- 主循环 ---------- */
function step(ts){
  if(!lastTs)lastTs=ts;
  var dt=Math.min(0.033,(ts-lastTs)/1000);lastTs=ts;
  if(running){
    speed=90+Math.min(170,dist*0.30);
    worldX+=speed*dt;
    dist=worldX/48;
    var e=6;
    var slope=(groundY(worldX+e)-groundY(worldX-e))/(2*e);
    var disturb=slope*1.35+Math.sin(worldX*0.012)*0.18;
    var acc=disturb*3.0-2.4*theta-1.5*thetaV+input*5.2;
    thetaV+=acc*dt;
    theta+=thetaV*dt;
    if(Math.abs(theta)>0.72)endGame();
    updStats();
  }
  draw();
  requestAnimationFrame(step);
}
/* ---------- 绘制 ---------- */
function draw(){
  //天空
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.sky1);g.addColorStop(1,PAL.sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var hx=W*0.32;
  //地面
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(var sx=0;sx<=W;sx+=6){
    var wx=worldX+(sx-hx);
    ctx.lineTo(sx,groundY(wx));
  }
  ctx.lineTo(W,H);ctx.closePath();
  ctx.fillStyle=PAL.gnd;ctx.fill();
  ctx.strokeStyle=PAL.gnd2;ctx.lineWidth=3;
  ctx.beginPath();
  for(var sx2=0;sx2<=W;sx2+=6){
    var wy=groundY(worldX+(sx2-hx));
    if(sx2===0)ctx.moveTo(sx2,wy);else ctx.lineTo(sx2,wy);
  }
  ctx.stroke();
  //草点
  ctx.fillStyle=PAL.gnd2;
  for(var gx=0;gx<W;gx+=34){
    var gwx=worldX+(gx-hx),gy=groundY(gwx);
    ctx.fillRect(gx,gy+8,3,6);
  }
  var hy=groundY(worldX);
  //铁钩
  ctx.strokeStyle=PAL.hook;ctx.lineWidth=4;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(hx+34,hy-52);ctx.lineTo(hx+8,hy-16);ctx.stroke();
  ctx.beginPath();ctx.arc(hx+6,hy-12,7,Math.PI*0.2,Math.PI*1.3);ctx.stroke();
  //铁环（随倾斜角摆动）
  ctx.save();
  ctx.translate(hx,hy-24);
  ctx.rotate(theta*0.9);
  ctx.strokeStyle=PAL.hoop;ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.stroke();
  ctx.strokeStyle=PAL.text;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.stroke();
  ctx.restore();
  //平衡指示
  var bw=Math.min(220,W-40),bx=(W-bw)/2,by=H-22;
  ctx.fillStyle=PAL.surface2;rr(bx,by,bw,10,5);ctx.fill();
  var k=Math.max(-1,Math.min(1,theta/0.72));
  ctx.fillStyle=Math.abs(k)>0.6?PAL.danger:(Math.abs(k)>0.32?PAL.warning:PAL.success);
  var cw=22;
  rr(bx+bw/2+k*(bw/2-cw/2)-cw/2,by-2,cw,14,7);ctx.fill();
  ctx.fillStyle=PAL.muted;ctx.font="600 12px -apple-system,'PingFang SC',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  ctx.fillText("平衡",W/2,by-6);
  if(!running&&!over){
    ctx.fillStyle=PAL.scrim;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=PAL.text;ctx.font="700 22px -apple-system,'PingFang SC',sans-serif";
    ctx.textAlign="center";ctx.fillText("准备就绪",W/2,H/2-10);
    ctx.fillStyle=PAL.muted;ctx.font="500 14px -apple-system,'PingFang SC',sans-serif";
    ctx.fillText("点击「开始」滚铁环",W/2,H/2+18);
  }
  if(over){ctx.fillStyle=PAL.scrim;ctx.fillRect(0,0,W,H)}
}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
/* ---------- 输入 ---------- */
var ptrSide=0;
cv.addEventListener("pointerdown",function(e){
  if(!running)return;
  var r=cv.getBoundingClientRect();
  ptrSide=e.clientX-r.left<r.width/2?-1:1;
  input=ptrSide;
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(!running||!ptrSide)return;
  var r=cv.getBoundingClientRect();
  input=(e.clientX-r.left<r.width/2)?-1:1;
});
function relPtr(){ptrSide=0;input=0}
cv.addEventListener("pointerup",relPtr);
cv.addEventListener("pointercancel",relPtr);
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft"){input=-1;e.preventDefault()}
  else if(e.key==="ArrowRight"){input=1;e.preventDefault()}
  else if((e.key===" "||e.key==="Enter")&&!running){start();e.preventDefault()}
});
window.addEventListener("keyup",function(e){
  if(e.key==="ArrowLeft"&&input===-1)input=0;
  if(e.key==="ArrowRight"&&input===1)input=0;
});
$("btnStart").addEventListener("click",start);
$("btnRestart").addEventListener("click",start);
$("btnHint").addEventListener("click",function(){
  say("提示：向铁环倾斜的反方向轻推，幅度不要过猛");
});
$("ovBtn").addEventListener("click",start);
function hideOverlay(){$("overlay").classList.remove("show")}
window.addEventListener("resize",resize);
palLoad();resize();updStats();
requestAnimationFrame(step);
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套） */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
</body>
</html>
