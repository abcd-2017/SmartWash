/* 解析 DB 下发的关卡批次：任一条非法即整批放弃（返回 null） */
function parseLevels(res,wordSet){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var seen={},list=[];
  for(var i=0;i<res.levels.length;i++){
    var it=res.levels[i];
    if(!it||typeof it!=="object")return null;
    var no=it.levelNo;
    if(typeof no!=="number"||!Number.isInteger(no)||no<1||seen[no])return null;
    var d;
    try{d=JSON.parse(it.dataJson)}catch(e){return null}
    if(!d||typeof d!=="object"||Array.isArray(d))return null;
    if(typeof d.name!=="string"||d.name.length<1||d.name.length>32)return null;
    if(typeof d.start!=="string"||d.start.length!==4||!wordSet.has(d.start))return null;
    var len=d.length,tm=d.time,hi=d.hints,mk=d.mask;
    if(typeof len!=="number"||!Number.isInteger(len)||len<3||len>20)return null;
    if(typeof tm!=="number"||!Number.isInteger(tm)||tm<30||tm>600)return null;
    if(typeof hi!=="number"||!Number.isInteger(hi)||hi<0||hi>10)return null;
    if(typeof mk!=="number"||!Number.isInteger(mk)||!(mk===0||mk===1))return null;
    seen[no]=true;
    list.push({no:no,name:d.name,start:d.start,length:len,time:tm,hints:hi,mask:mk});
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){
      var ok=true;
      for(var i=0;i<list.length;i++){
        var d=list[i];
        if(!d||typeof d!=="object"||typeof d.start!=="string"||d.start.length!==4||!WORD_SET.has(d.start)){ok=false;break}
      }
      if(ok){LEVELS=list;return v}
    }
  }catch(e){}
  return 0;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels("idiom-chain").then(function(res){
    var list=parseLevels(res,WORD_SET);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>=LEVELS.length)cur=LEVELS.length-1;
      startLevel(cur);
    }
  }).catch(function(){});
}
/* ---------- 存档 ---------- */
var KEY="sw.idiomchain.v1";
function loadSave(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return{lv:Math.max(0,parseInt(s.lv,10)||0),done:s.done&&typeof s.done==="object"?s.done:{},total:Math.max(0,parseInt(s.total,10)||0)}}catch(e){}return{lv:0,done:{},total:0}}
var saveData=loadSave();
function save(){
  var data={lv:saveData.lv,done:saveData.done,total:saveData.total};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("idiom-chain",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("idiom-chain").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=Math.max(0,parseInt(r.lv,10)||0),rt=Math.max(0,parseInt(r.total,10)||0);
      if(rl>saveData.lv){saveData.lv=Math.min(LEVELS.length-1,rl);changed=true}
      if(rt>saveData.total){saveData.total=rt;changed=true}
      if(r.done&&typeof r.done==="object"){
        for(var k in r.done){
          if(r.done[k]===true&&!saveData.done[k]){saveData.done[k]=true;changed=true}
        }
      }
      if(changed){save();if(cur>=LEVELS.length)cur=LEVELS.length-1;startLevel(cur)}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var cur=0,chain=[],usedSet=new Set(),targetLen=0,effLen=0,timeLeft=0,hintsLeft=0,attempts=3,wrongCount=0;
var levelScore=0,totalScore=saveData.total,over=true,paused=false,solution=null,correctWord="",state="idle";
var timerId=null,lastTs=0,baseSeed=1,overlayMode="start";
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function tailChar(){return chain.length?chain[chain.length-1].charAt(chain[chain.length-1].length-1):""}
function fmtTime(t){var v=Math.max(0,Math.ceil(t));var m=Math.floor(v/60),s=v%60;return(m<10?"0":"")+m+":"+(s<10?"0":"")+s}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function startTimer(){
  stopTimer();lastTs=performance.now();
  timerId=setInterval(function(){
    var now=performance.now();var dt=(now-lastTs)/1000;lastTs=now;
    if(paused||state!=="play")return;
    timeLeft-=dt;
    if(timeLeft<=0){timeLeft=0;updateStats();lose("时间到了");return}
    updateStats();
  },200);
}
/* ---------- 关卡流程 ---------- */
function startLevel(n){
  if(n<0)n=0;if(n>=LEVELS.length)n=LEVELS.length-1;
  cur=n;
  var L=LEVELS[cur];
  targetLen=L.length;timeLeft=L.time;hintsLeft=L.hints;attempts=3;wrongCount=0;levelScore=0;
  over=false;paused=false;chain=[L.start];usedSet=new Set([L.start]);solution=null;correctWord="";
  baseSeed=1000+cur*131+targetLen*17;
  var p=findPath(L.start,targetLen,baseSeed);
  if(p){solution=p;effLen=targetLen}
  else{
    for(var t=targetLen-1;t>=3;t--){p=findPath(L.start,t,baseSeed+t*7);if(p)break}
    if(p){solution=p;effLen=p.length}
    else if(cur+1<LEVELS.length){startLevel(cur+1);return}//词库无任何可接续链（仅非法 DB 数据），跳关
    else{solution=[L.start];effLen=1}
  }
  state="play";
  renderBoard();updateStats();
  say("从候选成语中挑出以「"+tailChar()+"」开头的一个");
  if(chain.length>=effLen){win();return}//DB 脏数据兜底：起始即满足目标长度
  startTimer();
}
function buildCandidates(){
  var need=tailChar();
  var correct=solution[chain.length];
  correctWord=correct||"";
  var words=[];
  if(correct&&!usedSet.has(correct))words.push(correct);
  var pool=[];
  for(var i=0;i<WORDS.length;i++){
    var wd=WORDS[i];
    if(usedSet.has(wd))continue;
    if(wd.charAt(0)!==need)pool.push(wd);
  }
  var rnd=mulberry(baseSeed+chain.length*977);
  shuffleArr(pool,rnd);
  for(var k=0;k<pool.length&&words.length<6;k++)words.push(pool[k]);
  shuffleArr(words,rnd);
  return words;
}
function renderBoard(){
  var cEl=$("chain");cEl.innerHTML="";
  for(var i=0;i<chain.length;i++){
    var chip=document.createElement("span");
    chip.className="chip"+(i===chain.length-1?" tail":"");
    chip.textContent=chain[i];
    cEl.appendChild(chip);
  }
  cEl.scrollTop=cEl.scrollHeight;
  paintPrompt();
  var cs=$("cands");cs.innerHTML="";
  var L=LEVELS[cur];
  var words=buildCandidates();
  for(var j=0;j<words.length;j++){
    (function(wd){
      var btn=document.createElement("button");
      btn.className="btn cand";
      btn.textContent=L.mask===1?("＿"+wd.slice(1)):wd;
      btn.setAttribute("data-word",wd);
      btn.addEventListener("click",function(){pick(wd,btn)});
      cs.appendChild(btn);
    })(words[j]);
  }
}
function paintPrompt(){
  $("prompt").innerHTML="下一成语须以「<b>"+tailChar()+"</b>」字开头 · 机会 "+"●".repeat(Math.max(0,attempts));
}
function updateStats(){
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  $("stProg").textContent=chain.length+"/"+effLen;
  $("stTime").textContent=fmtTime(timeLeft);
  $("stHint").textContent=hintsLeft;
  $("btnHint").disabled=hintsLeft<=0||over;
  paintPrompt();
}
function pick(wd,btn){
  if(over||state!=="play")return;
  if(wd===correctWord){
    chain.push(wd);usedSet.add(wd);levelScore+=100;
    if(chain.length>=effLen){updateStats();win();return}
    say("接得好！「"+wd+"」→ 再找以「"+tailChar()+"」开头的成语");
    renderBoard();updateStats();
  }else{
    attempts--;wrongCount++;
    btn.classList.add("bad");
    setTimeout(function(){btn.classList.remove("bad")},260);
    if(attempts<=0){lose("机会用完了");return}
    say("「"+wd+"」不是以「"+tailChar()+"」开头，再想想");
    updateStats();
  }
}
function win(){
  over=true;state="over";stopTimer();
  var bonus=Math.ceil(timeLeft)*2+hintsLeft*50+attempts*30;
  levelScore+=bonus;totalScore+=levelScore;
  saveData.done[String(cur)]=true;
  if(cur+1<LEVELS.length)saveData.lv=Math.max(saveData.lv,cur+1);
  save();
  var doneCount=Object.keys(saveData.done).length;
  if(GB.available)GB.reportScore("idiom-chain",{metricValue:doneCount,metricExtra:totalScore}).catch(function(){});
  $("ovTitle").textContent="过关！";
  $("ovDesc").innerHTML="接龙 "+chain.length+" 个 · 本关得分 "+levelScore+"（含奖励 "+bonus+"）<br>累计总分 "+totalScore;
  $("ovBtn").textContent=cur+1<LEVELS.length?"下一关":"再玩一次";
  overlayMode="win";showOverlay();
}
function lose(reason){
  over=true;state="over";stopTimer();
  $("ovTitle").textContent="本关失败";
  $("ovDesc").innerHTML=reason+"<br>本局得分 "+levelScore+" · 累计 "+totalScore;
  $("ovBtn").textContent="重试本关";
  overlayMode="lose";showOverlay();
}
function showOverlay(){$("overlay").classList.add("show")}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 输入 ---------- */
$("btnHint").addEventListener("click",function(){
  if(over||state!=="play"||hintsLeft<=0)return;
  hintsLeft--;
  var btns=$("cands").children;
  for(var i=0;i<btns.length;i++){
    if(btns[i].getAttribute("data-word")===correctWord){btns[i].classList.add("ok");break}
  }
  say("提示：「"+correctWord+"」 · "+GLOSS[correctWord]);
  updateStats();
});
$("btnReset").addEventListener("click",function(){startLevel(cur)});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(overlayMode==="start"){state="play";startTimer()}
  else if(overlayMode==="win"){startLevel(cur+1<LEVELS.length?cur+1:cur)}
  else{startLevel(cur)}
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden)paused=true;
  else{paused=false;lastTs=performance.now()}
});
/* ---------- 启动 ---------- */
LEVELS=DEFAULT_LEVELS.map(normLevel);
loadCachedLevels();
var startIdx=Math.min(Math.max(saveData.lv,0),LEVELS.length-1);
startLevel(startIdx);
state="idle";stopTimer();
$("ovTitle").textContent="成语接龙";
$("ovDesc").innerHTML="规则：下一个成语的首字，必须与上一个成语的尾字相同。<br>在限定时间内接满目标长度即可过关，点「提示」可高亮正确候选。";
$("ovBtn").textContent="开始游戏";
overlayMode="start";showOverlay();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
