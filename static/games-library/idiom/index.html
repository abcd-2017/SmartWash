var LEVELS=DEFAULT_LEVELS;
/* ---------- 关卡数据（DB 下发优先，本地缓存兜底） ---------- */
var LEVELS_KEY="sw.idiom.v1.levels",LEVELS_VER_KEY="sw.idiom.v1.levels.ver";
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存词库
  GB.getLevels("idiom").then(function(res){
    if(!res||!Array.isArray(res.levels))return;
    var list=[];
    for(var i=0;i<res.levels.length;i++){
      try{
        var d=JSON.parse(res.levels[i].dataJson);
        if(!d||typeof d.word!=="string"||d.word.length!==4)return;   // 游戏按四字成语硬编码
        list.push([d.word,String(d.meaning||"")]);
      }catch(e){return;}
    }
    if(applyLevels(list,res.version||0)){
      if(recent.length>=LEVELS.length)recent=[];   // 词库收缩时避免抽取死循环
    }
  }).catch(function(){});
}
/* ---------- 存档 ---------- */
var KEY="sw.idiom.v1";
function loadStats(){try{var s=JSON.parse(localStorage.getItem(KEY))||{};return{played:s.played||0,streak:s.streak||0,best:s.best||0}}catch(e){return{played:0,streak:0,best:0}}}
function saveStats(s){
  try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}
  if(GB.available)GB.saveState("idiom",s).catch(function(){});
}
var stats=loadStats();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("idiom").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var changed=false;
      var rp=parseInt(remote.played,10)||0,rs=parseInt(remote.streak,10)||0,rb=parseInt(remote.best,10)||0;
      if(rp>stats.played){stats.played=rp;changed=true}
      if(rs>stats.streak){stats.streak=rs;changed=true}
      if(rb>stats.best){stats.best=rb;changed=true}
      if(changed){saveStats(stats);paintStats()}
    }catch(e){}
  }).catch(function(){});
}

function pickIdiom(){
  var i,n=LEVELS.length;
  do{i=Math.floor(Math.random()*n)}while(recent.indexOf(i)>=0);
  recent.push(i);if(recent.length>15)recent.shift();
  return LEVELS[i];
}
function newRound(){
  var it=pickIdiom();
  target=it[0];meaning=it[1];hinted=false;guess=[];row=0;over=false;
  history=[];fbOf=[];
  //字库 = 答案去重字 + 干扰字（取自其他成语，保证不在答案里）
  var uniq=[];
  for(var i=0;i<4;i++)if(uniq.indexOf(target[i])<0)uniq.push(target[i]);
  var pool=[];
  for(var j=0;j<LEVELS.length;j++){
    if(LEVELS[j][0]===target)continue;
    var w=LEVELS[j][0];
    for(var k=0;k<4;k++)pool.push(w[k]);
  }
  keys=uniq.slice();
  var guard=0;
  while(keys.length<16&&guard++<800){
    var c=pool[Math.floor(Math.random()*pool.length)];
    if(keys.indexOf(c)<0)keys.push(c);
  }
  shuffle(keys);
  buildBoard();buildKeys();
  $("btnHint").disabled=false;
  say("从字库里挑四个字，拼出藏起来的成语");
}
/* ---------- 渲染 ---------- */
var cells=[];
function buildBoard(){
  var b=$("board");b.innerHTML="";cells=[];
  for(var r=0;r<ROWS;r++){
    var rowEl=document.createElement("div");rowEl.className="row";cells.push([]);
    for(var c=0;c<4;c++){
      var d=document.createElement("div");d.className="cell";
      rowEl.appendChild(d);cells[r].push(d);
    }
    b.appendChild(rowEl);
  }
}
function buildKeys(){
  var k=$("keys");k.innerHTML="";
  keys.forEach(function(ch){
    var btn=document.createElement("button");btn.className="key";btn.textContent=ch;
    btn.addEventListener("click",function(){type(ch)});
    k.appendChild(btn);
  });
}
function paintInput(){
  for(var i=0;i<4;i++){
    var el=cells[row][i];
    el.textContent=guess[i]||"";
    el.className="cell"+(guess[i]?" fill":"");
    if(guess[i]&&i===guess.length-1)el.classList.add("bump");
  }
}
function paintHistory(){
  //键盘状态取历次反馈的最好成绩（2>1>0）
  var best={};
  keys.forEach(function(ch){best[ch]=-1});
  for(var r=0;r<history.length;r++){
    for(var i=0;i<4;i++){
      var ch=history[r][i],s=fbOf[r][i];
      if(s>best[ch])best[ch]=s;
    }
  }
  var btns=$("keys").children;
  keys.forEach(function(ch,i){
    var lv=best[ch];
    btns[i].className="key"+(lv===2?" hit":lv===1?" near":lv===0?" miss":"");
  });
}
function paintRow(r,g,fb){
  for(var i=0;i<4;i++){
    var el=cells[r][i];
    el.textContent=g[i];
    el.className="cell "+(fb[i]===2?"hit":fb[i]===1?"near":"miss");
    el.style.transitionDelay=(i*70)+"ms";
  }
}
/* ---------- 规则 ---------- */
function feedback(g){
  var res=[0,0,0,0],rem={};
  for(var i=0;i<4;i++){
    if(g[i]===target[i])res[i]=2;
    else rem[target[i]]=(rem[target[i]]||0)+1;
  }
  for(var j=0;j<4;j++){
    if(res[j]!==2&&rem[g[j]]>0){res[j]=1;rem[g[j]]--}
  }
  return res;
}
function type(ch){
  if(over||guess.length>=4)return;
  guess.push(ch);paintInput();
}
function del(){
  if(over||!guess.length)return;
  guess.pop();paintInput();
}
function submit(){
  if(over)return;
  if(guess.length<4){say("还差 "+(4-guess.length)+" 个字");return}
  var fb=feedback(guess);
  history.push(guess.slice());fbOf.push(fb);
  paintRow(row,guess,fb);
  paintHistory();
  row++;guess=[];
  var win=true;
  for(var i=0;i<4;i++)if(fb[i]!==2)win=false;
  if(win){endRound(true);return}
  if(row>=ROWS){endRound(false);return}
  say("第 "+(row+1)+" / "+ROWS+" 次");
}
function endRound(win){
  over=true;
  stats.played++;
  if(win){
    stats.streak++;if(stats.streak>stats.best)stats.best=stats.streak;
    $("ovTitle").textContent="猜对了！";
    $("ovDesc").innerHTML="用了 "+row+" / "+ROWS+" 次机会"+(hinted?"（看过提示）":"")+"<br>当前连胜 "+stats.streak+" 局";
  }else{
    stats.streak=0;
    $("ovTitle").textContent="差一点";
    $("ovDesc").innerHTML="六次没猜中，连胜结束<br>释义："+meaning;
  }
  saveStats(stats);paintStats();
  // 成绩上报（连胜 / 最佳连胜，desc：越大越好）
  if(GB.available)GB.reportScore("idiom",{metricValue:stats.streak,metricExtra:stats.best}).catch(function(){});
  $("ovWord").textContent=target;
  $("ovBtn").textContent="下一局";
  $("overlay").classList.add("show");
}
function paintStats(){
  $("stPlayed").textContent=stats.played;
  $("stStreak").textContent=stats.streak;
  $("stBest").textContent=stats.best;
}
/* ---------- 输入 ---------- */
$("btnGo").addEventListener("click",submit);
$("btnDel").addEventListener("click",del);
$("btnHint").addEventListener("click",function(){
  if(over||hinted)return;
  hinted=true;$("btnHint").disabled=true;
  say("释义提示："+meaning);
});
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  newRound();
});
paintStats();newRound();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
