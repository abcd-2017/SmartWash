var LEVELS=DEFAULT_LEVELS;
/* ---------- 关卡数据（DB 下发优先，本地缓存兜底） ---------- */
var LEVELS_KEY="sw.idiom.v1.levels",LEVELS_VER_KEY="sw.idiom.v1.levels.ver";
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存词库
  GB.getLevels("idiom").then(function(res){
    if(!res||!Array.isArray(res.levels))return;
    var list=[];
    for(var i=0;i<res.levels.length;i++){
      try{
        var d=JSON.parse(res.levels[i].dataJson);
        if(!d||typeof d.word!=="string"||d.word.length!==4)continue;   // 游戏按四字成语硬编码；脏行跳过，不拖累整批
        list.push([d.word,String(d.meaning||"")]);
      }catch(e){continue;}
    }
    if(applyLevels(list,res.version||0)){
      if(recent.length>=LEVELS.length)recent=[];   // 词库收缩时避免抽取死循环
    }
  }).catch(function(){});
}
/* ---------- 存档 ---------- */
var KEY="sw.idiom.v1";
function loadStats(){try{var s=JSON.parse(localStorage.getItem(KEY))||{};return{played:s.played||0,streak:s.streak||0,best:s.best||0}}catch(e){return{played:0,streak:0,best:0}}}
function saveStats(s){
  try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}
  if(GB.available)GB.saveState("idiom",s).catch(function(){});
}
var stats=loadStats();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("idiom").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var changed=false;
      var rp=parseInt(remote.played,10)||0,rs=parseInt(remote.streak,10)||0,rb=parseInt(remote.best,10)||0;
      if(rp>stats.played){stats.played=rp;changed=true}
      if(rs>stats.streak){stats.streak=rs;changed=true}
      if(rb>stats.best){stats.best=rb;changed=true}
      if(changed){saveStats(stats);paintStats()}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var ROWS=6,target="",meaning="",keys=[],guess=[],row=0,over=false,hinted=false;
var history=[],fbOf=[],recent=[];
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
/* ---------- 词盘 ---------- */
function pickIdiom(){
  var i,n=LEVELS.length;
  do{i=Math.floor(Math.random()*n)}while(recent.indexOf(i)>=0);
  recent.push(i);if(recent.length>15)recent.shift();
  return LEVELS[i];
}
function newRound(){
  var it=pickIdiom();
  target=it[0];meaning=it[1];hinted=false;guess=[];row=0;over=false;
  history=[];fbOf=[];
  //字库 = 答案四字（含重复字，否则含重复字的成语永远拼不出）+ 干扰字（取自其他成语）
  var pool=[];
  for(var j=0;j<LEVELS.length;j++){
    if(LEVELS[j][0]===target)continue;
    var w=LEVELS[j][0];
    for(var k=0;k<4;k++)pool.push(w[k]);
  }
  keys=target.split("");
  var guard=0;
  while(keys.length<16&&guard++<800){
    var c=pool[Math.floor(Math.random()*pool.length)];
    if(keys.indexOf(c)<0)keys.push(c);
  }
  shuffle(keys);
  buildBoard();buildKeys();
  $("btnHint").disabled=false;
  $("promptText").textContent="目标：从字库挑 4 个字，拼出藏起来的四字成语";
  $("prompt").classList.remove("hinted");
  say("从字库里挑四个字，拼出藏起来的成语");
  paintInput();paintCur();
}
/* ---------- 渲染 ---------- */
var cells=[];
function buildBoard(){
  var b=$("board");b.innerHTML="";cells=[];
  for(var r=0;r<ROWS;r++){
    var rowEl=document.createElement("div");rowEl.className="row";rowEl.style.animationDelay=(r*45)+"ms";cells.push([]);
    for(var c=0;c<4;c++){
      var d=document.createElement("div");d.className="cell";
      rowEl.appendChild(d);cells[r].push(d);
    }
    b.appendChild(rowEl);
  }
}
function paintCur(){
  for(var r=0;r<ROWS;r++){cells[r][0].parentElement.classList.toggle("cur",r===row&&!over)}
}
function buildKeys(){
  var k=$("keys");k.innerHTML="";
  keys.forEach(function(ch,i){
    var btn=document.createElement("button");btn.className="key";btn.textContent=ch;
    btn.style.animationDelay=(Math.floor(i/4)*40)+"ms";
    btn.addEventListener("click",function(){type(ch)});
    k.appendChild(btn);
  });
}
function paintInput(){
  for(var i=0;i<4;i++){
    var el=cells[row][i];
    el.textContent=guess[i]||"";
    el.className="cell";
    if(guess[i]&&i===guess.length-1)el.classList.add("bump");
  }
}
function paintHistory(){
  //键盘状态取历次反馈的最好成绩（2>1>0）
  var best={};
  keys.forEach(function(ch){best[ch]=-1});
  for(var r=0;r<history.length;r++){
    for(var i=0;i<4;i++){
      var ch=history[r][i],s=fbOf[r][i];
      if(s>best[ch])best[ch]=s;
    }
  }
  var btns=$("keys").children;
  keys.forEach(function(ch,i){
    var b=btns[i],lv=best[ch];
    b.classList.remove("hit","near","miss");
    if(lv===2)b.classList.add("hit");else if(lv===1)b.classList.add("near");else if(lv===0)b.classList.add("miss");
  });
}
function paintRow(r,g,fb){
  for(var i=0;i<4;i++){
    var el=cells[r][i];
    el.textContent=g[i];
    el.className="cell "+(fb[i]===2?"hit":fb[i]===1?"near":"miss");
    el.style.animationDelay=(i*70)+"ms";
    el.style.transitionDelay=(i*70)+"ms";
    el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");
  }
}
/* ---------- 规则 ---------- */
function feedback(g){
  var res=[0,0,0,0],rem={};
  for(var i=0;i<4;i++){
    if(g[i]===target[i])res[i]=2;
    else rem[target[i]]=(rem[target[i]]||0)+1;
  }
  for(var j=0;j<4;j++){
    if(res[j]!==2&&rem[g[j]]>0){res[j]=1;rem[g[j]]--}
  }
  return res;
}
function type(ch){
  if(over||guess.length>=4)return;
  guess.push(ch);paintInput();
}
function del(){
  if(over||!guess.length)return;
  guess.pop();paintInput();
}
function submit(){
  if(over)return;
  if(guess.length<4){say("还差 "+(4-guess.length)+" 个字");return}
  var fb=feedback(guess);
  history.push(guess.slice());fbOf.push(fb);
  paintRow(row,guess,fb);
  paintHistory();
  row++;guess=[];
  paintCur();
  var win=true;
  for(var i=0;i<4;i++)if(fb[i]!==2)win=false;
  if(win){endRound(true);return}
  if(row>=ROWS){endRound(false);return}
  say("第 "+(row+1)+" / "+ROWS+" 次");
}
function endRound(win){
  over=true;
  stats.played++;
  if(win){
    stats.streak++;if(stats.streak>stats.best)stats.best=stats.streak;
    $("ovTitle").textContent="猜对了！";
    $("ovDesc").innerHTML="用了 "+row+" / "+ROWS+" 次机会"+(hinted?"（看过提示）":"")+"<br>当前连胜 "+stats.streak+" 局";
  }else{
    stats.streak=0;
    $("ovTitle").textContent="差一点";
    $("ovDesc").innerHTML="六次没猜中，连胜结束<br>释义："+meaning;
  }
  saveStats(stats);paintStats();
  // 成绩上报（连胜 / 最佳连胜，desc：越大越好）
  if(GB.available)GB.reportScore("idiom",{metricValue:stats.streak,metricExtra:stats.best}).catch(function(){});
  var chars=target.split(""),ow=$("ovWord");ow.innerHTML="";
  for(var i=0;i<chars.length;i++){
    var t=document.createElement("span");t.className="t";t.textContent=chars[i];
    t.style.animationDelay=(i*60)+"ms";ow.appendChild(t);
  }
  var res=$("res");res.className="res "+(win?"win":"lose");
  res.innerHTML=window.SW_ICON(win?"check":"x");
  setOvBtn("下一局","play");
  $("overlay").classList.add("show");
  paintCur();
}
function paintStats(){
  bumpVal("stPlayed",stats.played);bumpVal("stStreak",stats.streak);bumpVal("stBest",stats.best);
}
function bumpVal(id,v){
  var e=$(id),t=String(v);
  if(e.textContent===t)return;
  e.textContent=t;e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump");
}
function setOvBtn(text,icon){$("ovBtn").innerHTML=window.SW_ICON(icon)+"<span>"+text+"</span>"}
/* ---------- 输入 ---------- */
$("btnGo").addEventListener("click",submit);
$("btnDel").addEventListener("click",del);
$("btnHint").addEventListener("click",function(){
  if(over||hinted)return;
  hinted=true;$("btnHint").disabled=true;
  $("promptText").textContent="释义："+meaning;
  $("prompt").classList.add("hinted");
  say("已揭示释义提示");
});
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  newRound();
});
/* ---------- 启动 ---------- */
paintStats();newRound();
setOvBtn("下一局","play");
$("lvTagIco").innerHTML=window.SW_ICON("tile");
$("promptIco").innerHTML=window.SW_ICON("hint");
$("btnHint").insertAdjacentHTML("afterbegin",window.SW_ICON("hint"));
$("btnDel").insertAdjacentHTML("afterbegin",window.SW_ICON("backspace"));
$("btnGo").insertAdjacentHTML("afterbegin",window.SW_ICON("check"));
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
