<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>星空保卫战</title>
<style>
  /*token:GAME-THEME.md §2 + §3（星空底/面板走 token；敌阵怪兽色为玩法素材保留字面）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#1E8C5C;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#C9526B;--g-warning:#D98A26;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 6px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 2px; text-align: center; line-height: 1.3; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stage { position: relative; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn:active { opacity: .85; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-faint); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .panel {
    width: 100%; max-width: 320px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 22px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .desc b { color: var(--g-primary-deep); font-size: 22px; }
  .panel .btn { width: 100%; }
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
paint(B||"light");
})();
</script>
</head>
<body>
<div class="wrap">
  <header><span class="sub">按住屏幕移动 · 自动开火守底线</span></header>
  <div class="stats">
    <div class="stat"><span class="label">分数</span><span class="val" id="stScore">0</span></div>
    <div class="stat"><span class="label">最高分</span><span class="val" id="stBest">0</span></div>
    <div class="stat"><span class="label">波次</span><span class="val" id="stWave">1</span></div>
    <div class="stat"><span class="label">生命</span><span class="val" id="stLives">×3</span></div>
  </div>
  <div class="stage"><canvas id="cv" aria-label="星空保卫战战场"></canvas></div>
  <p class="msg" id="msg">飞船跟随手指 · 火力全自动 · 别让敌阵压到地面</p>
  <div class="tools"><button class="btn" id="btnPause">暂停</button></div>
  <p class="foot">顶排 30 分 · 中排 20 · 底排 10 · 神秘飞碟 +100 · 掩体能挡子弹也会被打穿</p>
</div>
<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">准备防守</h2>
    <p class="desc" id="ovDesc">按住屏幕左右移动飞船，火力自动<br>吃掉神秘飞碟有高分，守住底线！</p>
    <button class="btn" id="ovBtn">开始防守</button>
  </div>
</div>
<script>
(function(){
"use strict";
/* ---------- 调色板：UI 走 token，敌阵/飞碟为玩法素材保留字面 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),warning:v("--g-warning")};
}
window.__gOnTheme=function(){palLoad()};//App 推送主题时刷新调色板，rAF 循环自动重绘
/* ---------- 存档 ---------- */
var KEY="sw.invaders.v1";
function loadBest(){try{var s=JSON.parse(localStorage.getItem(KEY))||{};return{best:Math.max(0,parseInt(s.best,10)||0),wave:Math.max(1,parseInt(s.wave,10)||1)}}catch(e){return{best:0,wave:1}}}
function saveBest(){try{localStorage.setItem(KEY,JSON.stringify({best:best,wave:wave}))}catch(e){}}
/* ---------- 常量 ---------- */
var COLSN=8,ROWSN=5;
var ROWPTS=[30,20,20,10,10];
var ROWCOL=["#4FC3D9","#9B7BE0","#9B7BE0","#7BC57B","#7BC57B"];//敌阵素材色（玩法素材，保留字面）
var SPR=[
  ["0010100","0111110","1101011","1111111","0100010","1000001"],
  ["0010100","0111110","1101011","1111111","0010100","0100010"]
];
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var L={W:0,H:0,gw:0};
var score=0,best=loadBest(),wave=1,lives=3,over=false,state="idle";
var grid={ox:0,oy:0,dir:1,stepT:0,frame:0,alive:[]};
var ship={x:0,tx:0,cool:0,inv:0};
var pBullets=[],eBullets=[],ufo=null,ufoT=8000,fireT=0;
var bunkers=[];
var stars=[];
var fx=[];
var waveT=0;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* ---------- 几何 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=window.devicePixelRatio||1;
  L.W=w;L.H=Math.round(w*1.18);L.gw=w/COLSN;
  cv.style.height=L.H+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(L.H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!stars.length)for(var i=0;i<26;i++)stars.push({x:Math.random(),y:Math.random()*0.55,r:Math.random()*1.3+0.5});
  ship.x=ship.tx=L.W/2;
}
function shipY(){return L.H-L.gw*0.9}
function alienX(c){return grid.ox+c*L.gw+L.gw/2}
function alienY(r){return grid.oy+r*L.gw*0.92+L.gw*0.5}
/* ---------- 波次与实体 ---------- */
function spawnAliens(){
  grid.ox=L.gw*0.4;grid.oy=L.gw*1.7;grid.dir=1;grid.stepT=0;grid.frame=0;
  grid.alive=[];
  for(var r=0;r<ROWSN;r++){grid.alive.push([]);for(var c=0;c<COLSN;c++)grid.alive[r].push(true)}
}
function spawnBunkers(){
  bunkers=[];
  var bw=L.gw*0.9;
  for(var b=0;b<3;b++){
    var bx=L.W*(b+1)/4-bw*3,by=L.H-L.gw*2.6,cells=[];
    for(var r=0;r<4;r++){cells.push([]);for(var c=0;c<6;c++)cells[r].push(r===0?(c>0&&c<5):1)}
    bunkers.push({x:bx,y:by,cells:cells,bw:bw});
  }
}
function stepInterval(){
  var aliveN=0;
  for(var r=0;r<ROWSN;r++)for(var c=0;c<COLSN;c++)if(grid.alive[r][c])aliveN++;
  return Math.max(90,(620-wave*45)*(aliveN/40+0.12));
}
function aliveCount(){
  var n=0;
  for(var r=0;r<ROWSN;r++)for(var c=0;c<COLSN;c++)if(grid.alive[r][c])n++;
  return n;
}
function newGame(){
  score=0;lives=3;wave=1;over=false;state="play";
  pBullets=[];eBullets=[];fx=[];ufo=null;ufoT=8000;fireT=0;ship.inv=0;
  ship.x=ship.tx=L.W/2;ship.cool=0;
  spawnAliens();spawnBunkers();
  $("stScore").textContent="0";$("stWave").textContent="1";$("stLives").textContent="×3";
  hideOverlay();say("第 1 波 · 按住屏幕移动飞船");
}
function nextWave(){
  wave++;saveBest();
  $("stWave").textContent=wave;
  pBullets=[];eBullets=[];
  spawnAliens();spawnBunkers();
  state="play";
  say("第 "+wave+" 波 · 敌人更快了");
}
function addScore(n,x,y){
  score+=n;$("stScore").textContent=score;
  if(score>best.best){best.best=score;saveBest();$("stBest").textContent=best.best}
  if(x!==undefined)fx.push({t:"+"+n,x:x,y:y,ts:performance.now(),c:PAL.deep});
}
function hitShip(){
  if(ship.inv>0)return;
  lives--;$("stLives").textContent="×"+Math.max(0,lives);
  if(lives<=0){gameOver();return}
  ship.inv=1.5;say("被击中！还剩 "+lives+" 条命");
}
function gameOver(){
  over=true;state="idle";
  saveBest();
  $("ovTitle").textContent="防线失守";
  $("ovDesc").innerHTML="坚守到第 <b>"+wave+"</b> 波<br>本局得分 <b>"+score+"</b><br>"+(score>=best.best&&score>0?"新纪录！最高分 "+best.best:"历史最高分 "+best.best);
  $("ovBtn").textContent="再战一局";
  showOverlay();
}
function showOverlay(){$("overlay").classList.add("show")}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 更新 ---------- */
function update(dt,ts){
  if(state!=="play")return;
  //飞船跟随 + 无敌闪烁
  ship.x+=(ship.tx-ship.x)*Math.min(1,dt*10);
  ship.x=Math.max(L.gw*0.5,Math.min(L.W-L.gw*0.5,ship.x));
  if(ship.inv>0)ship.inv-=dt;
  //玩家自动开火（同屏 2 发）
  ship.cool-=dt;
  if(ship.cool<=0&&pBullets.length<2){
    pBullets.push({x:ship.x,y:shipY()-L.gw*0.5});
    ship.cool=Math.max(0.32,0.62-wave*0.03);
  }
  //敌阵步进
  grid.stepT+=dt*1000;
  if(grid.stepT>=stepInterval()){
    grid.stepT=0;grid.frame^=1;
    var edge=false;
    for(var r=0;r<ROWSN;r++){
      var lc=-1,rc=-1;
      for(var c=0;c<COLSN;c++)if(grid.alive[r][c]){if(lc<0)lc=c;rc=c}
      if(lc<0)continue;
      if(grid.dir>0&&alienX(rc)+L.gw*0.45>L.W-4)edge=true;
      if(grid.dir<0&&alienX(lc)-L.gw*0.45<4)edge=true;
    }
    if(edge){grid.dir*=-1;grid.oy+=L.gw*0.5;chewBunkers()}
    else grid.ox+=grid.dir*L.gw*0.38;
  }
  //入侵判定：敌阵压到飞船线
  for(var r2=0;r2<ROWSN;r2++)for(var c2=0;c2<COLSN;c2++)
    if(grid.alive[r2][c2]&&alienY(r2)+L.gw*0.3>=shipY()){gameOver();return}
  //敌阵开火
  fireT-=dt;
  if(fireT<=0&&eBullets.length<4){
    var shooters=[];
    for(var cc=0;cc<COLSN;cc++)for(var rr=ROWSN-1;rr>=0;rr--)
      if(grid.alive[rr][cc]){shooters.push([rr,cc]);break}
    if(shooters.length){
      var s=shooters[Math.floor(Math.random()*shooters.length)];
      eBullets.push({x:alienX(s[1]),y:alienY(s[0])+L.gw*0.4,wob:0});
    }
    fireT=Math.max(0.4,1.35-wave*0.09)+Math.random()*0.4;
  }
  //UFO
  ufoT-=dt*1000;
  if(!ufo&&ufoT<=0){
    var ltr=Math.random()<0.5;
    ufo={x:ltr?-L.gw:L.W+L.gw,v:(ltr?1:-1)*L.W*(0.22+Math.random()*0.08)};
  }
  if(ufo){
    ufo.x+=ufo.v*dt;
    if(ufo.x<-L.gw*1.5||ufo.x>L.W+L.gw*1.5){ufo=null;ufoT=8000+Math.random()*6000}
  }
  //子弹推进
  var i;
  for(i=pBullets.length-1;i>=0;i--){
    var pb=pBullets[i];pb.y-=L.H*0.85*dt;
    if(pb.y<-10){pBullets.splice(i,1);continue}
    if(hitAlien(pb.x,pb.y)){pBullets.splice(i,1);continue}
    if(hitBunker(pb.x,pb.y,true)){pBullets.splice(i,1);continue}
    if(ufo&&Math.abs(pb.x-ufo.x)<L.gw*0.55&&Math.abs(pb.y-L.gw*0.9)<L.gw*0.4){
      addScore(100,ufo.x,L.gw*0.9);ufo=null;ufoT=9000+Math.random()*6000;
      pBullets.splice(i,1);continue;
    }
  }
  for(i=eBullets.length-1;i>=0;i--){
    var eb=eBullets[i];eb.y+=L.H*(0.42+wave*0.03)*dt;eb.wob+=dt*14;
    if(eb.y>L.H+10){eBullets.splice(i,1);continue}
    if(Math.abs(eb.x-ship.x)<L.gw*0.42&&Math.abs(eb.y-shipY())<L.gw*0.42){
      eBullets.splice(i,1);hitShip();continue;
    }
    if(hitBunker(eb.x,eb.y,false)){eBullets.splice(i,1);continue}
  }
}
function hitAlien(x,y){
  for(var r=ROWSN-1;r>=0;r--)for(var c=0;c<COLSN;c++){
    if(!grid.alive[r][c])continue;
    var ax=alienX(c),ay=alienY(r);
    if(Math.abs(x-ax)<L.gw*0.42&&Math.abs(y-ay)<L.gw*0.36){
      grid.alive[r][c]=false;
      addScore(ROWPTS[r],ax,ay);
      return true;
    }
  }
  return false;
}
function hitBunker(x,y,isPlayer){
  for(var b=0;b<3;b++){
    var bk=bunkers[b];
    if(x<bk.x||x>bk.x+bk.bw*6||y<bk.y||y>bk.y+bk.bw*4)continue;
    var c=Math.floor((x-bk.x)/bk.bw),r=Math.floor((y-bk.y)/bk.bw);
    if(r<0||r>3||c<0||c>5||!bk.cells[r][c])continue;
    erode(bk,r,c,isPlayer);
    return true;
  }
  return false;
}
function erode(bk,r0,c0,isPlayer){
  var rad=isPlayer?1:1.4;
  for(var r=0;r<4;r++)for(var c=0;c<6;c++){
    var dx=c-c0,dy=r-r0;
    if(dx*dx+dy*dy<=rad*rad)bk.cells[r][c]=0;
  }
}
function chewBunkers(){
  for(var b=0;b<3;b++){
    var bk=bunkers[b];
    for(var r=0;r<ROWSN;r++)for(var c=0;c<COLSN;c++){
      if(!grid.alive[r][c])continue;
      var ax=alienX(c),ay=alienY(r);
      if(Math.abs(ax-(bk.x+bk.bw*3))<bk.bw*3+L.gw*0.4&&Math.abs(ay-(bk.y+bk.bw*2))<bk.bw*2+L.gw*0.4){
        for(var rr=0;rr<4;rr++)for(var cc=0;cc<6;cc++)bk.cells[rr][cc]=0;
      }
    }
  }
}
/* ---------- 绘制 ---------- */
function rr2(x,y,w2,h2,r){
  r=Math.min(r,w2/2,h2/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);
  ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();
}
function text(s,x,y,size,c){
  ctx.fillStyle=c;ctx.font="700 "+size+"px -apple-system,'PingFang SC',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(s,x,y);
}
function draw(ts){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,L.W,L.H);
  //星空底
  ctx.fillStyle=PAL.faint;
  stars.forEach(function(st){
    ctx.globalAlpha=0.5;
    ctx.fillRect(st.x*L.W,st.y*L.H,st.r,st.r);
  });
  ctx.globalAlpha=1;
  //UFO
  if(ufo){
    ctx.fillStyle=PAL.warning;
    rr2(ufo.x-L.gw*0.55,L.gw*0.72,L.gw*1.1,L.gw*0.36,L.gw*0.18);ctx.fill();
    rr2(ufo.x-L.gw*0.3,L.gw*0.52,L.gw*0.6,L.gw*0.26,L.gw*0.13);ctx.fill();
  }
  //敌阵
  var spr=SPR[grid.frame];
  for(var r=0;r<ROWSN;r++)for(var c=0;c<COLSN;c++){
    if(!grid.alive[r][c])continue;
    drawSprite(spr,alienX(c),alienY(r),L.gw*0.075,ROWCOL[r]);
  }
  //掩体
  bunkers.forEach(function(bk){
    ctx.fillStyle=PAL.primary;
    for(var r=0;r<4;r++)for(var c=0;c<6;c++)
      if(bk.cells[r][c])ctx.fillRect(bk.x+c*bk.bw,bk.y+r*bk.bw,bk.bw+0.5,bk.bw+0.5);
  });
  //飞船
  if(!(ship.inv>0&&(ts/90|0)%2===0)){
    var sy=shipY();
    ctx.fillStyle=PAL.primary;
    rr2(ship.x-L.gw*0.5,sy-L.gw*0.18,L.gw,L.gw*0.34,L.gw*0.14);ctx.fill();
    ctx.fillRect(ship.x-L.gw*0.1,sy-L.gw*0.42,L.gw*0.2,L.gw*0.3);
    ctx.fillStyle=PAL.deep;
    rr2(ship.x-L.gw*0.22,sy-L.gw*0.06,L.gw*0.44,L.gw*0.14,L.gw*0.07);ctx.fill();
  }
  //子弹
  ctx.fillStyle=PAL.deep;
  pBullets.forEach(function(pb){ctx.fillRect(pb.x-1.5,pb.y-7,3,9)});
  ctx.fillStyle=PAL.danger;
  eBullets.forEach(function(eb){
    ctx.fillRect(eb.x-1.5+Math.sin(eb.wob)*2,eb.y-6,3,9);
  });
  //飘字
  fx=fx.filter(function(f){return ts-f.ts<900});
  fx.forEach(function(f){
    var k=(ts-f.ts)/900;
    ctx.globalAlpha=1-k*k;
    text(f.t,f.x,f.y-k*24,14,f.c);
    ctx.globalAlpha=1;
  });
  //波次横幅
  if(state==="wave")text("第 "+wave+" 波来袭！",L.W/2,L.H/2,22,PAL.text);
}
function drawSprite(spr,cx,cy,px,color){
  ctx.fillStyle=color;
  var w2=spr[0].length*px,h2=spr.length*px;
  for(var r=0;r<spr.length;r++)for(var c=0;c<spr[r].length;c++)
    if(spr[r][c]==="1")ctx.fillRect(cx-w2/2+c*px,cy-h2/2+r*px,px+0.5,px+0.5);
}
/* ---------- 主循环 ---------- */
var last=0;
function loop(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  update(dt,ts);
  draw(ts);
  requestAnimationFrame(loop);
}
/* ---------- 输入：按住即移动 ---------- */
var holding=false;
cv.addEventListener("pointerdown",function(e){
  holding=true;ship.tx=e.clientX-cv.getBoundingClientRect().left;
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(holding)ship.tx=e.clientX-cv.getBoundingClientRect().left;
});
cv.addEventListener("pointerup",function(){holding=false});
cv.addEventListener("pointercancel",function(){holding=false});
var keys={};
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft"){keys.l=true;e.preventDefault()}
  else if(e.key==="ArrowRight"){keys.r=true;e.preventDefault()}
  else if(e.key==="p"||e.key==="P"){togglePause()}
});
window.addEventListener("keyup",function(e){
  if(e.key==="ArrowLeft")keys.l=false;
  else if(e.key==="ArrowRight")keys.r=false;
});
setInterval(function(){
  if(!holding&&state==="play"){
    var v=L.W*0.62;
    if(keys.l)ship.tx=Math.max(L.gw*0.5,ship.tx-v*0.05);
    if(keys.r)ship.tx=Math.min(L.W-L.gw*0.5,ship.tx+v*0.05);
  }
},16);
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="play")togglePause();
});
function togglePause(){
  if(over)return;
  if(state==="play"){
    state="pause";$("btnPause").textContent="继续";
    $("ovTitle").textContent="已暂停";
    $("ovDesc").innerHTML="飞船悬停，敌阵冻结<br>回来继续守";
    $("ovBtn").textContent="继续防守";
    showOverlay();
  }else if(state==="pause"){
    state="play";$("btnPause").textContent="暂停";hideOverlay();
  }
}
$("btnPause").addEventListener("click",togglePause);
$("ovBtn").addEventListener("click",function(){
  if(state==="pause")togglePause();else newGame();
});
window.addEventListener("resize",resize);
palLoad();resize();spawnAliens();spawnBunkers();
$("stBest").textContent=best.best;
showOverlay();
requestAnimationFrame(loop);
})();
</script>
