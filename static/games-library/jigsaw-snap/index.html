<style>
  /*token:GAME-THEME.md §2 基线（值与基线一致）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;

  .wrap { width: 100%; max-width: 480px; }

  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="jigsaw-snap",SAVE_KEY="sw.jigsawsnap.v1";
var DEFAULT_LEVELS=[{"name":"拼合·01","n":3,"seed":896941,"difficulty":1},{"name":"拼合·02","n":3,"seed":780186,"difficulty":1},{"name":"拼合·03","n":3,"seed":333338,"difficulty":1},{"name":"拼合·04","n":3,"seed":838423,"difficulty":1},{"name":"拼合·05","n":3,"seed":277637,"difficulty":1},{"name":"拼合·06","n":3,"seed":871271,"difficulty":1},{"name":"拼合·07","n":3,"seed":969704,"difficulty":1},{"name":"拼合·08","n":3,"seed":397469,"difficulty":2},{"name":"拼合·09","n":3,"seed":213005,"difficulty":2},{"name":"拼合·10","n":3,"seed":279402,"difficulty":2},{"name":"拼合·11","n":3,"seed":818014,"difficulty":2},{"name":"拼合·12","n":3,"seed":226668,"difficulty":2},{"name":"拼合·13","n":3,"seed":14910,"difficulty":2},{"name":"拼合·14","n":3,"seed":918383,"difficulty":2},{"name":"拼合·15","n":3,"seed":876553,"difficulty":3},{"name":"拼合·16","n":3,"seed":168906,"difficulty":3},{"name":"拼合·17","n":3,"seed":457510,"difficulty":3},{"name":"拼合·18","n":3,"seed":764299,"difficulty":3},{"name":"拼合·19","n":3,"seed":677043,"difficulty":3},{"name":"拼合·20","n":3,"seed":82399,"difficulty":3},{"name":"拼合·21","n":3,"seed":411220,"difficulty":3},{"name":"拼合·22","n":3,"seed":426400,"difficulty":4},{"name":"拼合·23","n":4,"seed":271744,"difficulty":4},{"name":"拼合·24","n":4,"seed":929765,"difficulty":4},{"name":"拼合·25","n":4,"seed":978497,"difficulty":4},{"name":"拼合·26","n":4,"seed":337469,"difficulty":4},{"name":"拼合·27","n":4,"seed":662003,"difficulty":4},{"name":"拼合·28","n":4,"seed":937538,"difficulty":4},{"name":"拼合·29","n":4,"seed":274575,"difficulty":5},{"name":"拼合·30","n":4,"seed":857207,"difficulty":5},{"name":"拼合·31","n":4,"seed":627911,"difficulty":5},{"name":"拼合·32","n":4,"seed":244788,"difficulty":5},{"name":"拼合·33","n":4,"seed":929119,"difficulty":5},{"name":"拼合·34","n":4,"seed":825884,"difficulty":5},{"name":"拼合·35","n":4,"seed":814163,"difficulty":5},{"name":"拼合·36","n":4,"seed":191934,"difficulty":6},{"name":"拼合·37","n":4,"seed":178238,"difficulty":6},{"name":"拼合·38","n":4,"seed":585067,"difficulty":6},{"name":"拼合·39","n":4,"seed":598347,"difficulty":6},{"name":"拼合·40","n":4,"seed":356677,"difficulty":6}];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!verifyLevel(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return verifyLevel(d)})){
      LEVELS=list.map(normalizeLevel);return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
      resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

//__VERIFY__START
/* 碎图拼合独立验证器（模拟回放）：按种子重建碎片序列，校验归属映射为双射、
   回放「逐块放到归属格」可走通到全铺满 */
var JS_NMIN=3,JS_NMAX=4;
function jsRng(seed){
  var a=seed>>>0;
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function jsShuffle(arr,rng){
  for(var i=arr.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr;
}
/* 碎片顺序 = 种子洗牌后的归属格序列；顺序即拼盘难度（先放谁后放谁） */
function jsPieceOrder(n,seed){
  var rng=jsRng(seed),cells=[];
  for(var i=0;i<n*n;i++)cells.push([Math.floor(i/n),i%n]);
  return jsShuffle(cells,rng);
}
function verifyLevel(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.n)||d.n<JS_NMIN||d.n>JS_NMAX)return false;
  if(!Number.isInteger(d.seed)||d.seed<0||d.seed>=1000000)return false;
  var order=jsPieceOrder(d.n,d.seed);
  // 双射：每个归属格恰好出现一次（模拟回放的前提）
  var seen={};
  for(var i=0;i<order.length;i++){
    var key=order[i][0]*JS_NMAX+order[i][1];
    if(seen[key])return false;
    seen[key]=1;
  }
  if(Object.keys(seen).length!==d.n*d.n)return false;
  // 回放：按顺序逐块放置，每一步归属格都在棋盘内 → 最终铺满
  for(i=0;i<order.length;i++){
    var r=order[i][0],c=order[i][1];
    if(r<0||r>=d.n||c<0||c>=d.n)return false;
  }
  return true;
}
function normalizeLevel(d){
  return {name:String(d.name),n:d.n,seed:d.seed,
    difficulty:Math.min(9,Math.max(1,Number.isInteger(d.difficulty)?d.difficulty:5))};
}
//__VERIFY__END

/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water")};
}
window.__gOnTheme=function(){palLoad();buildPicture();draw(performance.now())};
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,n=3,order=[],placed=[],curPiece=0,curCell=[0,0],misses=0,done=false;
var dragIdx=-1,dragPos=[0,0],dragOff=[0,0],bounce=null,bounceT=0;
var off=document.createElement("canvas"),offctx=off.getContext("2d");
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,S=0,trayH=0,ts=0,tTray=0,trayPos=[];
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* 种子画作：天空/山/水/田地分层 + 每格保证一个可辨识特征 */
function buildPicture(){
  off.width=W;off.height=W;
  var rng=jsRng(L?L.seed:1);
  var sky=PAL.water,ground=PAL.primary,ground2=PAL.deep;
  // 天空带
  offctx.fillStyle=sky;
  offctx.fillRect(0,0,W,W*0.42);
  offctx.fillStyle=PAL.surface2;
  offctx.fillRect(0,W*0.42,W,W*0.2);
  offctx.fillStyle=ground;
  offctx.fillRect(0,W*0.62,W,W*0.38);
  // 太阳
  offctx.fillStyle=PAL.warning;
  offctx.beginPath();
  offctx.arc(W*0.78,W*0.16,W*0.1,0,7);
  offctx.fill();
  // 山
  offctx.fillStyle=PAL.muted;
  offctx.beginPath();
  offctx.moveTo(0,W*0.62);offctx.lineTo(W*0.3,W*0.3);offctx.lineTo(W*0.62,W*0.62);
  offctx.closePath();offctx.fill();
  offctx.fillStyle=PAL.faint;
  offctx.beginPath();
  offctx.moveTo(W*0.4,W*0.62);offctx.lineTo(W*0.68,W*0.36);offctx.lineTo(W,W*0.62);
  offctx.closePath();offctx.fill();
  // 河
  offctx.fillStyle=sky;
  offctx.beginPath();
  offctx.moveTo(0,W*0.72);
  offctx.bezierCurveTo(W*0.3,W*0.64,W*0.6,W*0.84,W,W*0.74);
  offctx.lineTo(W,W*0.86);
  offctx.bezierCurveTo(W*0.6,W*0.96,W*0.3,W*0.76,0,W*0.84);
  offctx.closePath();offctx.fill();
  // 每格一个特征（圆/三角/条），保证碎块可辨识
  var cols=[PAL.danger,PAL.warning,PAL.text,PAL.surface,PAL.deep];
  for(var r=0;r<n;r++)for(var c=0;c<n;c++){
    var x0=c*(W/n),y0=r*(W/n);
    var col=cols[Math.floor(rng()*cols.length)];
    var kind=Math.floor(rng()*3);
    var px=x0+(0.2+rng()*0.6)*(W/n),py=y0+(0.2+rng()*0.6)*(W/n);
    if(kind===0){
      offctx.fillStyle=col;
      offctx.beginPath();offctx.arc(px,py,(0.08+rng()*0.08)*W,0,7);offctx.fill();
    }else if(kind===1){
      offctx.fillStyle=col;
      offctx.beginPath();
      var s2=(0.1+rng()*0.1)*W;
      offctx.moveTo(px,py-s2);offctx.lineTo(px+s2,py+s2*0.8);offctx.lineTo(px-s2,py+s2*0.8);
      offctx.closePath();offctx.fill();
    }else{
      offctx.strokeStyle=col;
      offctx.lineWidth=W*0.03;
      offctx.beginPath();
      offctx.moveTo(x0+rng()*(W/n),y0);
      offctx.lineTo(x0+rng()*(W/n),y0+W/n);
      offctx.stroke();
    }
  }
  // 外框
  offctx.strokeStyle=PAL.text;
  offctx.lineWidth=W*0.02;
  offctx.strokeRect(W*0.01,W*0.01,W*0.98,W*0.98);
}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);
  S=W;
  ts=S/n;
  tTray=Math.max(40,Math.round(ts*0.5));
  var perRow=Math.max(3,Math.floor((W-20)/(tTray+8)));
  var rows=Math.ceil(n*n/perRow);
  trayH=rows*(tTray+10)+14;
  // 托盘槽位
  trayPos=[];
  for(var i=0;i<n*n;i++){
    var row=Math.floor(i/perRow),col=i%perRow;
    trayPos.push([10+col*(tTray+8),S+8+row*(tTray+10)]);
  }
  var H=S+trayH;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(L)buildPicture();
}
function draw(tsNow){
  ctx.fillStyle=PAL.bg;
  ctx.fillRect(0,0,W,S+trayH);
  // 棋盘底 + 参考幽灵图
  ctx.fillStyle=PAL.surface;
  ctx.fillRect(0,0,S,S);
  ctx.globalAlpha=0.13;
  ctx.drawImage(off,0,0,S,S);
  ctx.globalAlpha=1;
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  for(var i=0;i<=n;i++){
    ctx.beginPath();ctx.moveTo(i*ts,0);ctx.lineTo(i*ts,S);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*ts);ctx.lineTo(S,i*ts);ctx.stroke();
  }
  // 键盘光标格
  if(!done&&dragIdx<0){
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;
    ctx.strokeRect(curCell[1]*ts+2,curCell[0]*ts+2,ts-4,ts-4);
  }
  // 已锁定
  for(i=0;i<n*n;i++){
    if(!placed[i])continue;
    var home=order[i];
    ctx.drawImage(off,home[1]*(W/n),home[0]*(W/n),W/n,W/n,home[1]*ts,home[0]*ts,ts,ts);
    ctx.strokeStyle=PAL.surface;ctx.lineWidth=2;
    ctx.strokeRect(home[1]*ts+1,home[0]*ts+1,ts-2,ts-2);
  }
  // 托盘
  ctx.fillStyle=PAL.surface;
  ctx.fillRect(0,S,W,trayH);
  ctx.strokeStyle=PAL.border;
  ctx.beginPath();ctx.moveTo(0,S);ctx.lineTo(W,S);ctx.stroke();
  for(i=0;i<n*n;i++){
    if(placed[i]||i===dragIdx)continue;
    var p=trayPos[i];
    // 回弹动画
    if(bounce&&bounce.i===i&&!window.__gRM){
      var f=(tsNow-bounce.t0)/240;
      if(f>=1){bounce=null;}
      else{
        var e=1-f;
        p=[bounce.from[0]+(p[0]-bounce.from[0])*(1-e),bounce.from[1]+(p[1]-bounce.from[1])*(1-e)];
      }
    }
    ctx.drawImage(off,order[i][1]*(W/n),order[i][0]*(W/n),W/n,W/n,p[0],p[1],tTray,tTray);
    ctx.strokeStyle=i===curPiece&&!done?PAL.deep:PAL.border;
    ctx.lineWidth=i===curPiece&&!done?2:1;
    ctx.strokeRect(p[0],p[1],tTray,tTray);
  }
  // 拖拽中的碎片
  if(dragIdx>=0){
    ctx.drawImage(off,order[dragIdx][1]*(W/n),order[dragIdx][0]*(W/n),W/n,W/n,
      dragPos[0]-tTray/2,dragPos[1]-tTray/2,tTray,tTray);
    ctx.strokeStyle=PAL.warning;ctx.lineWidth=2;
    ctx.strokeRect(dragPos[0]-tTray/2,dragPos[1]-tTray/2,tTray,tTray);
  }
  // 状态行
  ctx.fillStyle=PAL.muted;
  ctx.font="12px sans-serif";
  ctx.textAlign="left";ctx.textBaseline="top";
  ctx.fillText("碎片 "+placedCount()+"/"+(n*n),6,S+2);
}
function placedCount(){var c=0;for(var i=0;i<n*n;i++)if(placed[i])c++;return c}
function loop(t){draw(t);requestAnimationFrame(loop)}
function updStats(){
  $("stPut").textContent=placedCount()+"/"+(n*n);
  $("stMiss").textContent=misses;
}
function loadLevel(nl){
  lv=Math.max(0,Math.min(nl,LEVELS.length-1));
  L=LEVELS[lv];
  if(!verifyLevel(L)){say("关卡数据异常");return;}
  n=L.n;
  order=jsPieceOrder(n,L.seed);
  placed=new Array(n*n).fill(false);
  curPiece=0;curCell=[0,0];misses=0;done=false;dragIdx=-1;bounce=null;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=n+"×"+n+" 拼图 · 碎片已打乱";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  say("把下方碎片拖到棋盘上的原位，放错会弹回");
  resize();updStats();
}
function tryPlace(i,r,c){
  if(placed[i]||done)return;
  if(order[i][0]===r&&order[i][1]===c){
    placed[i]=true;
    // 自动把光标切到下一个未拼碎片
    for(var k=0;k<n*n;k++)if(!placed[k]){curPiece=k;break;}
    updStats();
    if(placedCount()===n*n)winLevel();
    else say("拼对了！还差 "+(n*n-placedCount())+" 块");
  }else{
    misses++;
    updStats();
    say("这里不对，弹回了");
  }
}
function hint(){
  if(done)return;
  for(var i=0;i<n*n;i++){
    if(!placed[i]){
      curPiece=i;
      curCell=[order[i][0],order[i][1]];
      say("提示：高亮碎片应放在光标格（行 "+(order[i][0]+1)+" 列 "+(order[i][1]+1)+"），按回车放置");
      return;
    }
  }
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:misses}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"拼合完成！";
  $("ovDesc").innerHTML=n+"×"+n+" 全部归位，失误 "+misses+" 次"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  if(done)return;
  // 托盘命中
  for(var i=0;i<n*n;i++){
    if(placed[i])continue;
    var p=trayPos[i];
    if(x>=p[0]-6&&x<=p[0]+tTray+6&&y>=p[1]-6&&y<=p[1]+tTray+6){
      dragIdx=i;curPiece=i;
      dragPos=[x,y];dragOff=[p[0]-x,p[1]-y];
      cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
      return;
    }
  }
});
cv.addEventListener("pointermove",function(e){
  if(dragIdx<0)return;
  var rect=cv.getBoundingClientRect();
  dragPos=[e.clientX-rect.left,e.clientY-rect.top];
});
cv.addEventListener("pointerup",function(e){
  if(dragIdx<0)return;
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  var i=dragIdx;
  dragIdx=-1;
  if(done)return;
  if(x>=0&&x<S&&y>=0&&y<S){
    var c=Math.min(n-1,Math.max(0,Math.floor(x/ts)));
    var r=Math.min(n-1,Math.max(0,Math.floor(y/ts)));
    curCell=[r,c];
    if(order[i][0]===r&&order[i][1]===c){
      placed[i]=true;
      for(var k=0;k<n*n;k++)if(!placed[k]){curPiece=k;break;}
      updStats();
      if(placedCount()===n*n){winLevel();return;}
      say("拼对了！还差 "+(n*n-placedCount())+" 块");
    }else{
      misses++;
      bounce={i:i,from:[x-tTray/2,y-tTray/2],t0:performance.now()};
      updStats();
      say("这里不对，弹回了");
    }
  }
});
cv.addEventListener("pointercancel",function(){dragIdx=-1});
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(done)return;openLevelSelect()});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if($("overlay").classList.contains("show")){
    if(k===" "||k==="Enter"){$("ovBtn").click();e.preventDefault();}
    return;
  }
  if(k==="ArrowUp"&&curCell[0]>0){curCell[0]--;e.preventDefault();}
  else if(k==="ArrowDown"&&curCell[0]<n-1){curCell[0]++;e.preventDefault();}
  else if(k==="ArrowLeft"&&curCell[1]>0){curCell[1]--;e.preventDefault();}
  else if(k==="ArrowRight"&&curCell[1]<n-1){curCell[1]++;e.preventDefault();}
  else if(k==="p"||k==="P"){
    for(var s=1;s<=n*n;s++){
      var cand=(curPiece+s)%(n*n);
      if(!placed[cand]){curPiece=cand;break;}
    }
    say("当前碎片："+(curPiece+1));
    e.preventDefault();
  }
  else if(k===" "||k==="Enter"){
    if(!placed[curPiece])tryPlace(curPiece,curCell[0],curCell[1]);
    e.preventDefault();
  }
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
window.addEventListener("resize",function(){resize()});
/* ---------- 启动：逐关模拟回放复核 ---------- */
(function(){
  var ok=[];
  for(var i=0;i<LEVELS.length;i++){
    var pass=false;
    try{pass=verifyLevel(LEVELS[i])}catch(e){pass=false}
    if(pass)ok.push(LEVELS[i]);
  }
  if(ok.length)LEVELS=ok;
})();
palLoad();loadLevel(save.lv);loop(performance.now());
syncLevelsFromServer();syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
