<html lang="zh-CN">

<title>数谜</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（--g-kro-* 棋盘边框面 / 线索板 / 白格 / 选中段轨迹）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-on-primary:#FFFFFF;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-kro-frame1:#3B434C;--g-kro-frame2:#2C333B;--g-kro-clue1:#8A6A2C;--g-kro-clue2:#6E5420;--g-kro-cell1:#FFFFFF;--g-kro-cell2:#EDF2EE;--g-kro-track:rgba(45,155,106,.16);color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-kro-frame1:#232A30;--g-kro-frame2:#151A1E;--g-kro-clue1:#6E4F1C;--g-kro-clue2:#4C3712;--g-kro-cell1:#242927;--g-kro-cell2:#1B1F1D;--g-kro-track:rgba(91,200,148,.20);color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.4; text-align: right; }
  /* 关卡标签：品牌绿软底 chip，与记分块拉开层次 */
  .lvtag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 10px; background: var(--g-primary-soft); color: var(--g-on-soft); font-size: 18px; font-weight: 700; line-height: 1.3; white-space: nowrap; }
  /* 关卡条：chip 轻立体（渐变 + 顶光 + 投影），可点态品牌绿软底 */
  .levels { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
  .levels::-webkit-scrollbar { display: none; }
  .lv {
    flex: 0 0 auto; min-width: 48px; min-height: 44px; padding: 4px 8px;
    border: 1px solid var(--g-border); border-radius: var(--g-radius-inner);
    background: linear-gradient(165deg, var(--g-surface), var(--g-surface2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 1px 2px rgba(20,40,30,.06);
    color: var(--g-muted); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: transform .14s ease-out, background .16s ease-out, color .16s ease-out;
  }
  .lv:active { transform: scale(.96); }
  .lv.cur { border-color: var(--g-primary); color: var(--g-on-soft); background: var(--g-primary-soft); box-shadow: inset 0 0 0 1px var(--g-primary), 0 2px 8px rgba(20,40,30,.10); }
  .lv.done { color: var(--g-primary-deep); }
  .lv:disabled { opacity: .45; cursor: default; }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat {
    flex: 1; min-width: 0; background: var(--g-surface2); border-radius: var(--g-radius-inner);
    padding: 6px 2px; text-align: center; line-height: 1.3;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
    animation: rise .38s ease-out both;
  }
  /* 入场错落 40ms（30-50ms 区间） */
  .stat:nth-child(2) { animation-delay: 40ms; }
  .stat:nth-child(3) { animation-delay: 80ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { display: inline-block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.low { color: var(--g-danger); }
  .stat .val.bump { animation: valpop .24s ease-out; }
  @keyframes valpop { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
  .stage { position: relative; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); box-shadow: var(--g-shadow); }
  /* 图例：三秒看懂「我控制什么 / 目标是什么 / 该点哪」 */
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 2px 0; animation: rise .38s ease-out both; animation-delay: 120ms; }
  .lg-chip { flex: 1 1 30%; display: flex; align-items: center; gap: 4px; min-width: 0; background: var(--g-surface2); border-radius: 10px; padding: 4px 5px; font-size: 12px; color: var(--g-muted); line-height: 1.3; }
  .lg-chip .lg-ico { width: 18px; height: 18px; flex: none; }
  .lg-chip b { color: var(--g-text); font-weight: 600; }
  .msg { min-height: 20px; margin: 10px 2px 8px; font-size: 14px; color: var(--g-muted); text-align: center; transition: color .16s ease-out; }
  .pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 8px; }
  .op {
    min-height: 44px; border: 1px solid var(--g-border); border-radius: var(--g-radius-btn);
    background: linear-gradient(165deg, var(--g-kro-cell1), var(--g-kro-cell2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 1px 2px rgba(20,40,30,.06);
    color: var(--g-text); font-family: inherit; font-size: 22px; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    transition: transform .14s ease-out, background .16s ease-out, box-shadow .16s ease-out;
  }
  .op:active { transform: scale(.96); background: var(--g-primary-soft); box-shadow: inset 0 0 0 1px var(--g-primary); }
  .op.erase { font-size: 16px; font-weight: 600; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 12px; flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out;
  }
  .btn:active { transform: scale(.96); }
  .btn[disabled] { opacity: .4; }
  .btn.primary { background: var(--g-btn-primary); color: var(--g-on-primary); box-shadow: 0 2px 8px rgba(20,40,30,.18); }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .tools .btn .swi { font-size: 18px; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay { position: fixed; inset: 0; z-index: 10; background: var(--g-scrim); display: none; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .panel { width: 100%; max-width: 340px; padding: 22px 18px; background: var(--g-surface); border-radius: var(--g-radius); box-shadow: var(--g-shadow); text-align: center; animation: pop .3s ease-out; }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  /* 过关轻弹：仅过关面板挂 .win（选关/取消不挂，保持克制） */
  .panel.win { animation: winpop .45s cubic-bezier(.18,.9,.3,1.4); }
  @keyframes winpop { 0% { transform: scale(.86); opacity: 0; } 62% { transform: scale(1.045); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .desc b { color: var(--g-primary-deep); font-size: 28px; }
  .panel.win .desc b { color: var(--g-warning); }
  .panel .btn { width: 100%; }
  .lvgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: transform .12s ease-out, background .16s ease-out;
  }
  .lvbtn:active { transform: scale(.96); }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效与延迟（§6.1 模板） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }
  /* P2: 键盘焦点可见 */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>

(function(){
"use strict";
/* ========== 游戏桥适配层 ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},

    getLevels:function(gameKey){return call("getLevels",[gameKey]);}

})();

function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(!Number.isInteger(d.n)||d.n<4||d.n>9)return false;
  if(!Array.isArray(d.g)||d.g.length!==d.n)return false;
  for(var i=0;i<d.n;i++){
    var toks=String(d.g[i]).split(" ");
    if(toks.length!==d.n)return false;
    for(var j=0;j<toks.length;j++){
      var t=toks[j];
      if(t==="#"||t===".")continue;
      if(!/^\d*\\\d*$/.test(t))return false;
    }
  }
  if(typeof d.sol!=="string"||!/^\d*$/.test(d.sol))return false;
  return true;
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    var ck=d.n+"|"+d.g.join("|");
    if(seen[ck])return null;seen[ck]=1;
    list.push({name:String(d.name||("第"+(i+1)+"关")),n:d.n,g:d.g,sol:d.sol});
  }
  return list;
}

}

function parseLevel(L){
  var n=L.n,cells=[],clues=[],whiteIdx={};
  for(var y=0;y<n;y++){
    var toks=String(L.g[y]).split(" ");
    for(var x=0;x<n;x++){
      var t=toks[x],c={x:x,y:y,type:"black",a:0,d:0,val:0,err:false};
      if(t===".")c.type="white";
      else if(t!=="#"){
        var parts=t.split("\\");
        c.type="clue";c.a=parts[0]?+parts[0]:0;c.d=parts.length>1&&parts[1]?+parts[1]:0;
      }
      cells.push(c);
    }
  }
  var wi=0;
  for(var i=0;i<cells.length;i++)if(cells[i].type==="white"){whiteIdx[i]=wi++;cells[i].sol=+L.sol[wi-1]||0}
  var runs=[];
  for(var y2=0;y2<n;y2++){var x2=0;while(x2<n){var c2=cells[y2*n+x2];if(c2.type==="white"){var st=x2;while(x2<n&&cells[y2*n+x2].type==="white")x2++;if(x2-st>=2){var cl=cells[y2*n+st-1];runs.push({cells:Array.from({length:x2-st},(_,k)=>y2*n+st+k),sum:cl.type==="clue"?cl.a:0,dir:"h"})}}else x2++}}
  for(var x3=0;x3<n;x3++){var y3=0;while(y3<n){var c3=cells[y3*n+x3];if(c3.type==="white"){var st2=y3;while(y3<n&&cells[y3*n+x3].type==="white")y3++;if(y3-st2>=2){var cl2=cells[(st2-1)*n+x3];runs.push({cells:Array.from({length:y3-st2},(_,k)=>(st2+k)*n+x3),sum:cl2.type==="clue"?cl2.d:0,dir:"v"})}}else y3++}}
  var cellRuns=new Array(n*n).fill(0).map(()=>[]);
  runs.forEach((r,ri)=>r.cells.forEach(c=>cellRuns[c].push(ri)));
  return {n:n,cells:cells,runs:runs,cellRuns:cellRuns,whiteCount:wi};
}
/* ---------- 独立穷举求解器：统计解数（上限 2），返回首个解 ---------- */
function kakuroSolve(P,cap){
  var n=P.n,cells=P.cells,runs=P.runs,cellRuns=P.cellRuns;
  var whites=[];
  for(var i=0;i<n*n;i++)if(cells[i].type==="white")whites.push(i);
  var sol=new Array(n*n).fill(0);
  var count=0,nodes=0,first=null;
  var MAX=cap||200000;
  function runState(ri){var sum=0,un=0,used=0;var mask=0;
    var r=runs[ri];
    for(var k=0;k<r.cells.length;k++){var c=r.cells[k];if(sol[c]){sum+=sol[c];mask|=1<<sol[c]}else un++}
    return {sum:sum,un:un,mask:mask};
  }
  function candMask(c){var m=0;var cr=cellRuns[c];for(var k=0;k<cr.length;k++){var r=runs[cr[k]];for(var j=0;j<r.cells.length;j++){var v=sol[r.cells[j]];if(v)m|=1<<v}}return m}
  function dfs(){
    if(count>=2||nodes>MAX)return;
    nodes++;
    var best=-1,bmask=0,bn=10;
    for(var q=0;q<whites.length;q++){var c=whites[q];if(sol[c])continue;
      var m=candMask(c),cnt=0;for(var d=1;d<=9;d++)if(!(m&(1<<d)))cnt++;
      if(cnt===0)return;
      if(cnt<bn){bn=cnt;best=c;bmask=m;if(cnt===1)break}
    }
    if(best===-1){count++;if(!first){first=sol.slice()}return}
    for(var d=1;d<=9;d++){
      if(bmask&(1<<d))continue;
      sol[best]=d;
      var ok=true,cr=cellRuns[best];
      for(var k=0;k<cr.length&&ok;k++){
        var st=runState(cr[k]),r=runs[cr[k]];
        if(st.sum>r.sum)ok=false;
        else if(st.un===0&&st.sum!==r.sum)ok=false;
        else if(st.un>0){
          var rem=r.sum-st.sum,avail=0,min=0,max=0;
          for(var v=1;v<=9;v++)if(!(st.mask&(1<<v)))avail++;
          if(avail<st.un){ok=false;break}
          var low=[],high=[];
          for(var v2=9;v2>=1;v2--)if(!(st.mask&(1<<v2))){low.push(v2)}
          var tmp=low.slice().sort((a,b)=>a-b);
          for(var z=0;z<st.un;z++)min+=tmp[z];
          for(var z2=0;z2<st.un;z2++)max+=tmp[tmp.length-1-z2];
          if(rem<min||rem>max)ok=false;
        }
      }
      if(ok)dfs();
      sol[best]=0;
      if(count>=2||nodes>MAX)return;
    }
  }
  dfs();
  return {count:count,nodes:nodes,sol:first};
}

/* ---------- 颜色工具：仅由 PAL 色值混合出明暗（恒白高光为 rgba 字面） ---------- */
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}

  var filled=0,errs=0;
  for(var i=0;i<P.cells.length;i++){
    var c=P.cells[i];
    if(c.type!=="white")continue;
    if(c.val)filled++;
    if(c.err)errs++;
  }
  setStat("stLv",(lv+1)+" / "+LEVELS.length);
  setStat("stFill",filled+" / "+P.whiteCount);
  setStat("stErr",errs);
  $("stErr").classList.toggle("low",errs>0);
  $("btnUndo").disabled=!history.length||over;
}
/* ---------- 关卡 ---------- */
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  var L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return}
  P=parseLevel(L);
  sel=-1;history=[];over=false;
  enterStart=performance.now();selT=0;trackT=0;popT={};
  $("lvTag").textContent="第 "+(lv+1)+" 关";
  $("lvRule").textContent=P.n+"×"+P.n+" · "+P.runs.length+" 段";
  var r=kakuroSolve(P,200000);
  if(r.count!==1)say("警告：内嵌求解器判定本关解不唯一（数据异常）");
  else say("点白格填 1-9；绿段标出它所在的横竖两段");
  resize();updStats();renderLevels();
}
function cellAt(px,py){
  var x=Math.floor((px-ox)/cell),y=Math.floor((py-oy)/cell);
  if(x<0||y<0||x>=P.n||y>=P.n)return -1;
  return y*P.n+x;
}
function select(i){
  if(i<0||over)return;
  if(P.cells[i].type!=="white"){say("请点选白格");return}
  sel=i;selT=trackT=performance.now();updStats();
}
function setVal(v){
  if(sel<0||over)return;
  var c=P.cells[sel];
  if(c.val===v){return}
  history.push({i:sel,prev:c.val});
  c.val=v;
  popT[sel]=performance.now();
  recheck();
  updStats();
  if(v>0)say("已填 "+v);
  checkWin();
}
function undo(){
  if(!history.length||over)return;
  var h=history.pop();
  P.cells[h.i].val=h.prev;
  sel=h.i;selT=trackT=performance.now();popT[h.i]=selT;
  recheck();updStats();say("撤销一步");
}
function recheck(){
  for(var i=0;i<P.cells.length;i++)P.cells[i].err=false;
  var errs=0;
  for(var ri=0;ri<P.runs.length;ri++){
    var r=P.runs[ri],seen={},bad=false,sum=0,un=0;
    for(var k=0;k<r.cells.length;k++){
      var c=P.cells[r.cells[k]];
      if(!c.val){un++;continue}
      sum+=c.val;
      if(seen[c.val])bad=true;seen[c.val]=1;
    }
    if(bad||sum>r.sum||(un===0&&sum!==r.sum)){
      for(var k2=0;k2<r.cells.length;k2++){var c2=P.cells[r.cells[k2]];if(c2.val){c2.err=true;errs++}}
    }
  }
  return errs;
}
function hint(){
  if(over)return;
  var r=kakuroSolve(P,200000);
  if(r.count!==1){say("本关解不唯一，无法提示");return}
  var empties=[];
  for(var i=0;i<P.cells.length;i++)if(P.cells[i].type==="white"&&!P.cells[i].val)empties.push(i);
  if(!empties){say("已填满，检查一下冲突");return}
  var target=sel>=0&&P.cells[sel].type==="white"&&!P.cells[sel].val?sel:empties[Math.floor(Math.random()*empties.length)];
  history.push({i:target,prev:P.cells[target].val});
  P.cells[target].val=r.sol[target];
  sel=target;selT=trackT=performance.now();popT[target]=selT;
  recheck();updStats();say("提示：此格填 "+r.sol[target]);
  checkWin();
}
function checkWin(){
  for(var i=0;i<P.cells.length;i++)if(P.cells[i].type==="white"&&!P.cells[i].val)return;
  for(var ri=0;ri<P.runs.length;ri++){
    var r=P.runs[ri],seen={},sum=0;
    for(var k=0;k<r.cells.length;k++){var c=P.cells[r.cells[k]];if(seen[c.val])return;seen[c.val]=1;sum+=c.val}
    if(sum!==r.sum)return;
  }
  winLevel();
}
function winLevel(){
  over=true;
  save.done[lv]=true;
  if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
  persist();updStats();renderLevels();
  if(GB.available)GB.reportScore("kakuro",{metricValue:lv+1,metricExtra:P.whiteCount}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"过关！";
  $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成<br>白格 "+P.whiteCount+" · 共 "+P.runs.length+" 段";
  setOvBtn((lv>=LEVELS.length-1)?"回到第 1 关":"下一关",(lv>=LEVELS.length-1)?"rotate":"arrow-right");
  $("panel").classList.add("win");
  $("overlay").classList.add("show");
}
/* 覆盖层主 CTA：文字前内联 SVG 图标（render 层呈现） */
function setOvBtn(t,icon){$("ovBtn").innerHTML=SW_ICON(icon)+t}
/* ---------- 关卡选择 ---------- */
function renderLevels(){
  var el=$("levels");el.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lv"+(i===lv?" cur":"")+(save.done[i]?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){if(i===lv&&!over)return;lv=i;persist();hideOverlay();loadLevel(i)});
      el.appendChild(b);
    })(i);
  }
}
/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
/* 入场错落：逐格 36ms 淡入并上移落位（reduced-motion 下瞬时到位） */
function entOf(i,now){
  if(window.__gRM)return{a:1,dy:0};
  var d=(now-enterStart-i*36)/240;
  d=Math.max(0,Math.min(1,d));
  return {a:d,dy:(1-d)*10};
}
/* 段的首格 → 该段线索板下标（目标态描边用） */
function clueIndexOf(ri){
  var r=P.runs[ri],first=r.cells[0],y=Math.floor(first/P.n),x=first%P.n;
  return r.dir==="h" ? y*P.n+(x-1) : (y-1)*P.n+x;
}
function draw(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  /* 外框「面」：石墨渐变 + 顶部高光 + 落地投影，替代 1px 细线边界 */
  ctx.fillStyle=PAL.frame2;rr(0,2,W,H,14);ctx.fill();
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.frame1);g.addColorStop(1,PAL.frame2);
  ctx.fillStyle=g;rr(0,0,W,H,14);ctx.fill();
  var gh=ctx.createLinearGradient(0,0,0,H*0.5);
  gh.addColorStop(0,"rgba(255,255,255,0.10)");gh.addColorStop(1,"rgba(255,255,255,0)");   // 恒白高光
  ctx.fillStyle=gh;rr(0,0,W,H,14);ctx.fill();
  if(!P){requestAnimationFrame(draw);return}
  var now=performance.now();
  var gap=Math.max(3,Math.min(6,cell*0.085)),rad=Math.min(10,cell*0.22);
  var fs=cell>=56?16:(cell>=44?14:12);
  var vfs=cell>=52?28:(cell>=40?22:18);
  var i,c,x,y,e,ea,edy,k,m,ri2;
  /* 选中段（轨迹）：绿软面标出选中格所在的横竖两段 */
  var act=null;
  if(sel>=0&&!over){
    act=[];
    var cr=P.cellRuns[sel];
    for(k=0;k<cr.length;k++)act.push(cr[k]);
  }
  /* 格子层：白格=地面（凸面），线索板=目标（琥珀面 + 对角线），#=外框镂空（界外） */
  for(i=0;i<P.cells.length;i++){
    c=P.cells[i];x=ox+c.x*cell;y=oy+c.y*cell;e=entOf(i,now);ea=e.a;edy=e.dy;
    if(ea<=0||c.type==="black")continue;
    ctx.save();ctx.globalAlpha=ea;ctx.translate(0,edy);
    if(c.type==="clue"){
      var g2=ctx.createLinearGradient(0,y,0,y+cell);
      g2.addColorStop(0,PAL.clue1);g2.addColorStop(1,PAL.clue2);
      ctx.fillStyle=g2;rr(x,y,cell,cell,rad);ctx.fill();
      ctx.strokeStyle=colMix(PAL.clue1,PAL.onPrimary,0.28);ctx.lineWidth=Math.max(1.5,cell*0.045);
      ctx.beginPath();ctx.moveTo(x+1.5,y+1.5);ctx.lineTo(x+cell-1.5,y+cell-1.5);ctx.stroke();
    }else{
      ctx.shadowColor="rgba(0,0,0,0.22)";ctx.shadowBlur=cell*0.10;ctx.shadowOffsetY=cell*0.04;   // 恒黑阴影
      var g3=ctx.createLinearGradient(0,y,0,y+cell);
      g3.addColorStop(0,PAL.cell1);g3.addColorStop(1,PAL.cell2);
      ctx.fillStyle=g3;rr(x,y,cell,cell,rad);ctx.fill();
      var g4=ctx.createLinearGradient(0,y,0,y+cell*0.5);
      g4.addColorStop(0,"rgba(255,255,255,0.55)");g4.addColorStop(1,"rgba(255,255,255,0)");   // 恒白高光
      ctx.fillStyle=g4;rr(x,y,cell,cell,rad);ctx.fill();
    }
    ctx.restore();
  }
  /* 轨迹：叠在格子之上（120-200ms ease-out 淡入） */
  if(act){
    var ta=window.__gRM?1:Math.max(0,Math.min(1,(now-trackT)/160));
    if(ta>0){
      ctx.save();ctx.globalAlpha=ta;ctx.fillStyle=PAL.track;
      for(k=0;k<act.length;k++){
        var rc=P.runs[act[k]].cells;
        for(m=0;m<rc.length;m++){
          ri2=rc[m];
          ctx.fillRect(ox+(ri2%P.n)*cell+gap*0.5,oy+Math.floor(ri2/P.n)*cell+gap*0.5,cell-gap,cell-gap);
        }
      }
      ctx.restore();
    }
  }
  /* 选中态：淡绿软面 + 品牌绿环（160ms 淡入） */
  if(sel>=0&&!over){
    var sc2=P.cells[sel],sx=ox+sc2.x*cell,sy=oy+sc2.y*cell;
    var pa=window.__gRM?1:Math.max(0,Math.min(1,(now-selT)/160));
    ctx.save();ctx.globalAlpha=pa;
    ctx.fillStyle=PAL.soft;rr(sx+1,sy+1,cell-2,cell-2,rad);ctx.fill();
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=Math.max(2.5,cell*0.07);
    rr(sx+2,sy+2,cell-4,cell-4,rad);ctx.stroke();
    ctx.restore();
  }
  /* 目标态：选中段对应的线索板描白环 */
  if(act){
    ctx.save();ctx.strokeStyle=PAL.onPrimary;ctx.lineWidth=Math.max(2,cell*0.055);
    for(k=0;k<act.length;k++){
      var ci=clueIndexOf(act[k]),cc=P.cells[ci];
      rr(ox+cc.x*cell+1.5,oy+cc.y*cell+1.5,cell-3,cell-3,rad);ctx.stroke();
    }
    ctx.restore();
  }
  /* 数字层：线索数字（右上=横向和 / 左下=纵向和）与填数（填数轻弹 180ms） */
  for(i=0;i<P.cells.length;i++){
    c=P.cells[i];x=ox+c.x*cell;y=oy+c.y*cell;e=entOf(i,now);ea=e.a;edy=e.dy;
    if(ea<=0||c.type==="black")continue;
    ctx.save();ctx.globalAlpha=ea;ctx.translate(0,edy);
    if(c.type==="clue"){
      ctx.fillStyle=PAL.onPrimary;ctx.font="700 "+fs+"px -apple-system,'PingFang SC',sans-serif";
      if(c.a){ctx.textAlign="right";ctx.textBaseline="top";ctx.fillText(String(c.a),x+cell-3,y+3)}
      if(c.d){ctx.textAlign="left";ctx.textBaseline="bottom";ctx.fillText(String(c.d),x+3,y+cell-3)}
    }else if(c.val){
      var sc3=1;
      if(popT[i]){var pq=(now-popT[i])/180;if(pq<1)sc3=0.7+0.3*(1-Math.pow(1-pq,2))}
      ctx.translate(x+cell/2,y+cell/2);ctx.scale(sc3,sc3);
      ctx.fillStyle=c.err?PAL.danger:PAL.text;
      ctx.font="700 "+vfs+"px -apple-system,'PingFang SC',sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(String(c.val),0,1);
    }
    ctx.restore();
    if(c.type==="white"&&c.err){
      ctx.save();ctx.strokeStyle=PAL.danger;ctx.lineWidth=Math.max(2,cell*0.06);
      rr(x+2.5,y+2.5,cell-5,cell-5,rad);ctx.stroke();ctx.restore();
    }
  }
  requestAnimationFrame(draw);
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  if(over)return;
  var r=cv.getBoundingClientRect();
  var i=cellAt(e.clientX-r.left,e.clientY-r.top);
  if(i>=0)select(i);
  e.preventDefault();
});
$("pad").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  setVal(+b.getAttribute("data-n"));
});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){
  if(over)return;
  for(var i=0;i<P.cells.length;i++)if(P.cells[i].type==="white")P.cells[i].val=0;
  history=[];sel=-1;recheck();updStats();say("本关已清空");
});
$("btnLv").addEventListener("click",function(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    var b=document.createElement("button");
    b.className="lvbtn"+(save.done[i]?" done":"");
    b.textContent=i+1;
    b.disabled=i>save.lv;
    b.addEventListener("click",function(){
      lv=+this.textContent-1;save.lv=Math.max(save.lv,lv);persist();loadLevel(lv);hideOverlay();
    });
    g.appendChild(b);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="通关的关卡标绿";
  setOvBtn("取消","x");
  $("panel").classList.remove("win");
  $("overlay").classList.add("show");
});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(over){
    if(lv>=LEVELS.length-1){lv=0;loadLevel(0)}
    else loadLevel(lv+1);
  }
});
window.addEventListener("keydown",function(e){
  if(e.key>="1"&&e.key<="9"){setVal(+e.key);e.preventDefault()}
  else if(e.key==="Backspace"||e.key==="Delete"||e.key==="0"){setVal(0);e.preventDefault()}
  else if(e.key==="ArrowUp"||e.key==="ArrowDown"||e.key==="ArrowLeft"||e.key==="ArrowRight"){
    if(sel<0){for(var z=0;z<P.cells.length;z++)if(P.cells[z].type==="white"){select(z);break}e.preventDefault();return}
    var c=P.cells[sel],nx=c.x,ny=c.y;
    if(e.key==="ArrowUp")ny--;else if(e.key==="ArrowDown")ny++;
    else if(e.key==="ArrowLeft")nx--;else nx++;
    if(nx<0||ny<0||nx>=P.n||ny>=P.n){e.preventDefault();return}
    var ni=ny*P.n+nx;
    if(P.cells[ni].type==="white")select(ni);
    e.preventDefault();
  }
  else if(e.key==="z"||e.key==="Z"){undo()}
  else if(e.key==="h"||e.key==="H"){hint()}
});
function hideOverlay(){$("overlay").classList.remove("show")}
window.addEventListener("resize",resize);
/* ---------- 启动 ---------- */
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("kakuro").then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    applyLevels(list,res.version||0);
    if(lv>LEVELS.length-1)lv=LEVELS.length-1;
    save.lv=Math.min(save.lv,lv);persist();
    loadLevel(lv);
  }).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("kakuro").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(r.lv,10)||0;
      if(rl>save.lv){save.lv=Math.min(LEVELS.length-1,rl);changed=true}
      if(r.done&&typeof r.done==="object")for(var k in r.done)if(r.done[k]&&!save.done[k]){save.done[k]=true;changed=true}
      if(changed){persist();loadLevel(save.lv)}
    }catch(e){}
  }).catch(function(){});
}
palLoad();resize();loadLevel(lv);
requestAnimationFrame(draw);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套） */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  /* 按钮图标：文字前内联 SVG（SW_ICON，24 viewBox / currentColor / aria-hidden，零外链） */
  function $(id){return document.getElementById(id)}
  $("btnUndo").insertAdjacentHTML("afterbegin",window.SW_ICON("undo"));
  $("btnHint").insertAdjacentHTML("afterbegin",window.SW_ICON("lightbulb"));
  $("btnReset").insertAdjacentHTML("afterbegin",window.SW_ICON("reset"));
  $("btnLv").insertAdjacentHTML("afterbegin",window.SW_ICON("grid"));
  $("btnErase").insertAdjacentHTML("afterbegin",window.SW_ICON("backspace"));
  $("ovBtn").innerHTML=window.SW_ICON("arrow-right")+"下一关";
})();
</script>
