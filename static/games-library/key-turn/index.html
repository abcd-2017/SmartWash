<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 常量与存档 ---------- */
var MW=480,MH=480;
var RAD=Math.PI/180;
var KEY="sw.key-turn.v1",LKEY="sw.key-turn.v1.levels",VKEY="sw.key-turn.v1.levels.ver";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

n":33,"speed":266,"tol":47,"angles":[135,30,100],"picks":2},{"n":34,"speed":269,"tol":45,"angles":[354,270,94],"picks":2},{"n":35,"speed":273,"tol":44,"angles":[37,34,288],"picks":2},{"n":36,"speed":276,"tol":43,"angles":[182,9,52],"picks":2},{"n":37,"speed":280,"tol":41,"angles":[15,55,255],"picks":2},{"n":38,"speed":283,"tol":40,"angles":[262,193,35],"picks":2},{"n":39,"speed":287,"tol":38,"angles":[302,57,105],"picks":2},{"n":40,"speed":290,"tol":37,"angles":[198,28,323],"picks":2},{"n":41,"speed":294,"tol":35,"angles":[165,189,131],"picks":2},{"n":42,"speed":297,"tol":33,"angles":[118,226,291],"picks":2}];
var LEVELS=DEFAULT_LEVELS;
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  for(var i=0;i<list.length;i++){
    var o=list[i];
    if(!o||typeof o!=="object"||!(o.speed>0)||!(o.tol>0)||!Array.isArray(o.angles)||o.angles.length<3)return false;
  }
  LEVELS=list;
  try{lsSet(LKEY,JSON.stringify(list));lsSet(VKEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(lsGet(VKEY),10)||0;
    var list=JSON.parse(lsGet(LKEY)||"null");
    if(Array.isArray(list)&&list.length&&list[0]&&list[0].speed>0){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("key-turn").then(function(res){
    if(!res||!Array.isArray(res.levels))return;
    var list=[];
    for(var i=0;i<res.levels.length;i++){
      try{list.push(JSON.parse(res.levels[i].dataJson));}catch(e){return;}
    }
    if(applyLevels(list,res.version||0)){
      if(lvIdx>LEVELS.length-1)lvIdx=LEVELS.length-1;
      save.lv=Math.min(save.lv,lvIdx);persist();
      loadLevel(lvIdx);
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(lsGet(KEY))||{};return{lv:Math.max(0,parseInt(s.lv,10)||0)}}catch(e){return{lv:0}}}
var save=loadSave();

  try{lsSet(KEY,JSON.stringify(save))}catch(e){}
  if(GB.available)GB.saveState("key-turn",save).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("key-turn").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rlv=parseInt(JSON.parse(res.stateJson).lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(rlv,LEVELS.length-1);persist();}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 调色板:CSS变量 → canvas ---------- */

function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL.bg=v("--g-bg");PAL.surface=v("--g-surface");PAL.surface2=v("--g-surface2");PAL.border=v("--g-border");

/* ---------- DOM ---------- */
function $(id){return document.getElementById(id)}
var cv=$("cv"),ctx=cv.getContext("2d"),ov=$("ov");
var hudRing=$("hudRing"),hudPick=$("hudPick"),hudLv=$("hudLv");
var ovK=$("ovK"),ovT=$("ovT"),ovX=$("ovX"),ovS=$("ovS"),ovB=$("ovB");
var lvIdx=Math.min(save.lv,LEVELS.length-1);
var S={phase:"menu",paused:false,locked:[false,false,false],picks:3,
  angle:0,score:save.score||0,flashT:0,flashCol:"",parts:[],floats:[]};
function curLv(){return LEVELS[Math.min(lvIdx,LEVELS.length-1)]}
function syncHud(){
  hudRing.textContent=S.locked.filter(function(x){return x}).length+"/3";
  hudPick.textContent=String(S.picks);
  hudLv.textContent=(lvIdx+1)+"/"+LEVELS.length;
}
function loadLevel(n){
  lvIdx=Math.max(0,Math.min(n,LEVELS.length-1));
  S.phase="run";S.paused=false;
  S.locked=[false,false,false];
  S.picks=curLv().picks;
  S.angle=0;
  S.parts.length=0;S.floats.length=0;
  syncHud();hideOv();
}
/* ---------- 覆盖层 ---------- */
function showOv(o){
  ovK.textContent=o.k||"";ovT.textContent=o.t||"";ovX.textContent=o.x||"";
  var st=o.stats||[];
  ovS.style.display=st.length?"grid":"none";
  ovS.innerHTML=st.map(function(s){return '<div class="st"><b>'+s[1]+"</b><span>"+s[0]+"</span></div>"}).join("");
  ovB.innerHTML="";
  (o.btns||[]).forEach(function(b){
    var el=document.createElement("button");
    el.className="btn"+(b[1]==="ghost"?" ghost":"");
    el.textContent=b[0];el.addEventListener("click",b[2]);ovB.appendChild(el);
  });
  ov.classList.add("show");
}
function hideOv(){ov.classList.remove("show")}
function pauseGame(){
  if(S.phase!=="run"||S.paused)return;
  S.paused=true;
  showOv({k:"PAUSED",t:"已暂停",x:"锁芯停转，回来接着对位。",
    btns:[["继续","primary",function(){S.paused=false;hideOv()}],["重开本关","ghost",function(){loadLevel(lvIdx)}]]});
}
function showMenu(){
  S.phase="menu";
  showOv({k:"KEY TURN",t:"开锁时机",
    x:"指针绕锁芯扫动，看准当前亮环的缺口位置点按：对上即锁定该环，三环全开过锁；失手扣一次机会，机会用完锁死重来。转速逐关加快、缺口逐关变窄。",
    stats:[["进度",lvIdx+1+"/"+LEVELS.length]],
    btns:[["开始 · 第 "+(lvIdx+1)+" 关","primary",function(){loadLevel(lvIdx)}]]});
}
/* ---------- 对位 ---------- */
function angDist(a,b){
  var d=Math.abs(((a-b)%(2*Math.PI)+2*Math.PI)%(2*Math.PI));
  return d>Math.PI?2*Math.PI-d:d;
}
function tryLock(){
  if(S.phase!=="run"||S.paused)return;
  var L=curLv();
  var active=S.locked.indexOf(false);
  if(active<0)return;
  var notch=L.angles[active]*RAD;
  var tol=L.tol*RAD;
  if(angDist(S.angle,notch)<=tol/2){
    S.locked[active]=true;
    flashRing(active);
    syncHud();
    if(S.locked.every(function(x){return x}))win();
  }else{
    S.picks--;
    syncHud();
    S.flashT=.3;S.flashCol=PAL.danger;
    if(S.picks<=0)lose();
  }
}
function flashRing(i){
  S.flashT=.3;S.flashCol=PAL.success;
  S.floats.push({x:MW/2,y:120,txt:"第 "+(i+1)+" 环锁定",col:PAL.deep,t:.9});
}
function win(){
  S.phase="over";
  var next=false;
  if(lvIdx+1<LEVELS.length&&lvIdx+1>save.lv){save.lv=lvIdx+1;next=true}
  persist();
  if(GB.available)GB.reportScore("key-turn",{metricValue:save.lv+1,metricExtra:"余"+S.picks+"次"}).catch(function(){});
  var hasNext=lvIdx+1<LEVELS.length;
  showOv({k:"UNLOCKED",t:"开锁成功",
    x:next?"解锁下一关：转速更快、窗口更窄，靠节奏不靠眼睛。":"全部关卡完成，开锁师傅！",
    stats:[["剩余机会",S.picks],["转速",curLv().speed+"°/s"],["缺口",curLv().tol+"°"]],
    btns:hasNext?[["下一关","primary",function(){loadLevel(lvIdx+1)}],["重玩本关","ghost",function(){loadLevel(lvIdx)}]]
                :[["再来一轮","primary",function(){loadLevel(0)}]]});
}
function lose(){
  S.phase="over";
  showOv({k:"LOCKED OUT",t:"机会用完",
    x:"缺口窗口只有 "+curLv().tol+"°，指针 "+curLv().speed+"°/s——窗口约 "+Math.round(curLv().tol/curLv().speed*1000)+"ms，按节奏点。",
    stats:[["已开环",S.locked.filter(function(x){return x}).length]],
    btns:[["重试本关","primary",function(){loadLevel(lvIdx)}]]});
}
/* ---------- 绘制 ---------- */
var SC=1;
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  SC=r.width/MW;
  ctx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
}
function draw(){
  var L=curLv();
  ctx.fillStyle=PAL.plate;ctx.fillRect(0,0,MW,MH);
  ctx.fillStyle=PAL.plate;
  ctx.globalAlpha=.6;
  ctx.fillRect(0,0,MW,MH);
  ctx.globalAlpha=1;
  var cx=MW/2,cy=MH/2+10;
  var rings=[{r:150,w:22},{r:108,w:22},{r:66,w:22}];
  var active=S.locked.indexOf(false);
  for(var i=0;i<3;i++){
    var rg=rings[i],locked=S.locked[i];
    var isAct=i===active;
    var col=locked?PAL.primary:(isAct?PAL.lock:PAL.lock2);
    var a0=L.angles[i]*RAD,tol=L.tol*RAD;
    //环体（缺口处断开）
    ctx.strokeStyle=col;ctx.lineWidth=rg.w;ctx.lineCap="butt";
    ctx.beginPath();
    ctx.arc(cx,cy,rg.r,a0+tol/2,a0-tol/2+2*Math.PI);
    ctx.stroke();
    if(locked){
      ctx.strokeStyle=PAL.deep;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(cx,cy,rg.r,a0+tol/2,a0-tol/2+2*Math.PI);ctx.stroke();
    }
    //缺口高亮（当前环）
    if(isAct&&!S.paused){
      var blink=.5+.5*Math.sin(S.angle*9);
      ctx.globalAlpha=.35+.4*blink;
      ctx.strokeStyle=PAL.warning;ctx.lineWidth=rg.w-6;
      ctx.beginPath();
      ctx.arc(cx,cy,rg.r,a0-tol/2,a0+tol/2);
      ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  //指针
  ctx.strokeStyle=S.flashT>0?S.flashCol:PAL.text;ctx.lineWidth=5;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(S.angle)*170,cy+Math.sin(S.angle)*170);ctx.stroke();
  ctx.fillStyle=PAL.text;
  ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.plate;
  ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fill();
  //顶部信息
  ctx.fillStyle=PAL.muted;ctx.font="700 14px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("转速 "+L.speed+"°/s · 缺口 "+L.tol+"°（约 "+Math.round(L.tol/L.speed*1000)+"ms）",MW/2,30);
  //机会钥匙
  for(i=0;i<curLv().picks;i++){
    var kx=MW/2+(i-(curLv().picks-1)/2)*36;
    ctx.fillStyle=i<S.picks?PAL.lock:PAL.faint;
    ctx.beginPath();ctx.arc(kx,MH-26,8,0,Math.PI*2);ctx.fill();
    ctx.fillRect(kx-2,MH-26,4,14);
  }
  ctx.textBaseline="alphabetic";
  //浮字
  ctx.textAlign="center";ctx.font="700 18px system-ui,sans-serif";
  for(i=0;i<S.floats.length;i++){
    var f=S.floats[i];
    ctx.globalAlpha=Math.min(1,f.t*1.5);
    ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
function step(dt){
  if(S.flashT>0)S.flashT-=dt;
  var L=curLv();
  var dir=(S.locked[0]?-1:1);
  S.angle+=dir*L.speed*RAD*dt;
  if(S.angle>2*Math.PI)S.angle-=2*Math.PI;
  if(S.angle<0)S.angle+=2*Math.PI;
  for(var i=S.floats.length-1;i>=0;i--){
    var f=S.floats[i];f.y-=24*dt;f.t-=dt;
    if(f.t<=0)S.floats.splice(i,1);
  }
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  tryLock();
});
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("keydown",function(e){
  if(e.code==="Space"){e.preventDefault();if(!e.repeat)tryLock()}
  if(e.code==="Enter"&&S.phase!=="run")loadLevel(lvIdx);
  if(e.code==="KeyP"&&S.phase==="run"){S.paused?((S.paused=false),hideOv()):pauseGame()}
  if(e.code==="KeyR"&&S.phase!=="menu")loadLevel(lvIdx);
});
$("btnPause").addEventListener("click",pauseGame);
$("btnReset").addEventListener("click",function(){loadLevel(lvIdx)});
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&S.phase==="run"&&!S.paused)pauseGame();
});
/* ---------- 主循环 ---------- */
var lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  var dt=Math.min(.05,(now-lastT)/1000);
  lastT=now;
  if(S.phase==="run"&&!S.paused)step(dt);
  draw();
}
/* ---------- 启动 ---------- */
palLoad();
syncHud();
showMenu();
resize();
window.addEventListener("resize",resize);
requestAnimationFrame(loop);
syncSaveFromServer();
syncLevelsFromServer();
})();
</script>
</body>
