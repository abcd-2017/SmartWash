  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-kl-counter:#5E5340;--g-st-kl-counter2:#453D2E;--g-st-kl-board:#6E5330;color-scheme:dark }

window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
/*X3-ENGINE-BEGIN*/
var KL=(function(){
"use strict";
/* ===== 食材总表 ===== */
var ING=["面","蛋","菜","肉","酱","芝","米","海"];
/* ===== 确定性伪随机（mulberry32） ===== */
function makeRng(seed){return{s:seed|0};}
function rngNext(rng){
  rng.s=(rng.s+0x6D2B79F5)|0;
  var t=Math.imul(rng.s^(rng.s>>>15),1|rng.s);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;
}
/* 订单由种子确定性派生（DB 存参数即可复现） */
function genOrders(lv){
  var rng=makeRng(lv.seed>>>0),out=[],count=lv.target+8;
  for(var i=0;i<count;i++){
    var len=lv.seqMin+Math.floor(rngNext(rng)*(lv.seqMax-lv.seqMin+1));
    var seq=[];
    for(var j=0;j<len;j++)seq.push(lv.set[Math.floor(rngNext(rng)*lv.set.length)]);
    out.push({seq:seq,arrive:2+i*lv.arr});
  }
  return out;
}
/* ===== 对局状态 ===== */
function newState(lv){
  return {t:0,active:[],served:0,missed:0,spawnIdx:0,penalties:0,
    orders:genOrders(lv),win:false,over:false,reason:null,lastTap:null};
}
/* ===== 共享单步：投料 → 出餐 → 耐心衰减 → 胜负判定（玩家与验证器共用同一实现） ===== */
function simTick(lv,st,tap){
  if(st.over||st.win)return st;
  while(st.spawnIdx<st.orders.length&&st.orders[st.spawnIdx].arrive<=st.t&&st.active.length<lv.slots){
    var o=st.orders[st.spawnIdx++];
    st.active.push({need:o.seq.slice(),pat:lv.patience,seq:o.seq});
  }
  st.lastTap=tap;
  if(tap!=null){
    var hit=false;
    for(var i=0;i<st.active.length;i++){
      if(st.active[i].need[0]===tap){st.active[i].need.shift();hit=true;break;}
    }
    if(!hit){for(var j=0;j<st.active.length;j++)st.active[j].pat-=1;st.penalties++;}
  }
  for(var k=st.active.length-1;k>=0;k--){
    if(!st.active[k].need.length){st.served++;st.active.splice(k,1);}
  }
  for(var m=st.active.length-1;m>=0;m--){
    st.active[m].pat--;
    if(st.active[m].pat<=0){st.missed++;st.active.splice(m,1);}
  }
  st.t++;
  if(st.missed>=3){st.over=true;st.reason="miss";return st;}
  if(st.served>=lv.target){st.win=true;return st;}
  if(st.t>=lv.ticks){st.over=true;st.reason="time";}
  return st;
}
/* ===== 验证器：完美策略回放（每 tick 按最老订单的下一味投料，人类可达的下限节奏） ===== */
function policySim(lv){
  var st=newState(lv),guard=lv.ticks+50;
  while(!st.over&&!st.win&&guard-->0){
    var tap=st.active.length?st.active[0].need[0]:null;
    simTick(lv,st,tap);
  }
  return st;
}
/* ===== 关卡（第 1 关手工锚点关；其余公式化生成 + 策略回放收敛，坏关不进表） ===== */
var L1={name:"流水线·01",seed:20261122,ticks:36,target:8,slots:2,patience:7,arr:4,
  set:[0,1,2],seqMin:2,seqMax:3,difficulty:1};
function genLevel(i){
  var ticks=36+Math.floor(i/2)*2;
  var lv={name:"流水线·"+(i<9?"0":"")+(i+1),seed:1000+i*77,ticks:ticks,
    target:Math.max(3,Math.floor(ticks/3*0.72)),
    slots:2+(i>=12?1:0),patience:7,
    arr:4-(i>=20?1:0),
    set:i>=16?[0,1,2,3]:[0,1,2],
    seqMin:2,seqMax:2+(i>=8?1:0)+(i>=24?1:0),
    difficulty:Math.min(6,1+Math.floor(i/7))};
  /* 收敛调整：策略回放不过就抬耐心→降目标（坏关不进表） */
  for(var tries=0;tries<8;tries++){
    var st=policySim(lv);
    if(st.win&&!st.over)break;
    if(st.over==="miss"||st.missed>0)lv.patience=Math.min(12,lv.patience+1);
    else lv.target=Math.max(3,lv.target-1);
  }
  return lv;
}
var LEVELS=[L1];
for(var gi=1;gi<40;gi++)LEVELS.push(genLevel(gi));
function verifyAll(){
  var res=[],i;
  for(i=0;i<LEVELS.length;i++){var st=policySim(LEVELS[i]);res.push({ok:st.win&&!st.over,served:st.served});}
  return res;
}
function selfTest(){
  var out=[];
  /* 锚点1：第 1 关完美策略回放 → 恰好出到目标份数、零砸单（策略每 tick 投一味，出餐数=目标） */
  var s1=policySim(L1);
  out.push({name:"锚点1·第1关策略回放出餐8份且零砸单",pass:s1.win&&s1.served===8&&s1.missed===0});
  /* 锚点2：点错一味 → 全部在制订单耐心-1（手工推演：耐心5→扣1→衰减1=3） */
  var lvStub={ticks:99,target:99,slots:3,orders:[],patience:5,arr:4,seqMin:2,seqMax:3,set:[0,1,2]};
  var st2={t:0,active:[{need:[0,1],pat:5,seq:[0,1]}],served:0,missed:0,spawnIdx:99,penalties:0,orders:[],win:false,over:false,reason:null,lastTap:null};
  simTick(lvStub,st2,2);
  out.push({name:"锚点2·错投扣耐心(5→3)",pass:st2.penalties===1&&st2.active[0].pat===3});
  /* 锚点3：全部 40 关策略回放可达成 */
  var all=verifyAll(),bad=[];
  for(var i=0;i<all.length;i++)if(!all[i].ok)bad.push(i+1);
  out.push({name:"全关验证·40关策略回放可达成",pass:bad.length===0,bad:bad.join(",")});
  return out;
}
return {ING:ING,LEVELS:LEVELS,genOrders:genOrders,newState:newState,simTick:simTick,
  policySim:policySim,verifyAll:verifyAll,selfTest:selfTest};
})();
window.KL=KL;
/*X3-ENGINE-END*/
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（DB 下发优先：整表策略回放通过才接受；本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="kitchen-line",SAVE_KEY="sw.kitchenline.v1";
var DEFAULT_LEVELS=KL.LEVELS;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.seed)||d.seed<0)return false;
  if(!Number.isInteger(d.ticks)||d.ticks<15||d.ticks>150)return false;
  if(!Number.isInteger(d.target)||d.target<1||d.target>60)return false;
  if(!Number.isInteger(d.slots)||d.slots<1||d.slots>4)return false;
  if(!Number.isInteger(d.patience)||d.patience<3||d.patience>20)return false;
  if(!Number.isInteger(d.arr)||d.arr<1||d.arr>8)return false;
  if(!Array.isArray(d.set)||d.set.length<2||d.set.length>6)return false;
  for(var j=0;j<d.set.length;j++)if(!Number.isInteger(d.set[j])||d.set[j]<0||d.set[j]>7)return false;
  if(!Number.isInteger(d.seqMin)||!Number.isInteger(d.seqMax)||d.seqMin<1||d.seqMax<d.seqMin||d.seqMax>6)return false;
  var probe=KL.policySim(d);
  return probe.win===true&&!probe.over;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  for(var i=0;i<list.length;i++)if(!validLevelData(list[i]))return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){
      var ok=true;
      for(var i=0;i<list.length;i++)if(!validLevelData(list[i])){ok=false;break;}
      if(ok){LEVELS=list;return v;}
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    if(!res||!Array.isArray(res.levels)||!res.levels.length)return;
    var list=[],seen={};
    for(var i=0;i<res.levels.length;i++){
      var row=res.levels[i];
      if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return;
      var d;try{d=JSON.parse(row.dataJson);}catch(e){return;}
      if(seen[d&&d.name])return;seen[d&&d.name]=1;
      list.push(d);
    }
    if(list.length&&applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);buildIngButtons();resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";$("ovBtn").style.background="var(--g-surface2)";$("ovBtn").style.color="var(--g-text)";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),
    counter:v("--g-st-kl-counter"),counter2:v("--g-st-kl-counter2"),board:v("--g-st-kl-board")};
}
window.__gOnTheme=function(){palLoad()};
palLoad();
/* ---------- 状态（续玩：lv 起步即存档关） ---------- */
var lv=save.lv,L=null,st=null,state="running",gen=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=280;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function buildIngButtons(){
  var row=$("ingRow");row.innerHTML="";
  for(var j=0;j<L.set.length;j++){
    (function(j){
      var id=L.set[j];
      var b=document.createElement("button");
      b.className="btn";b.id="ing"+id;
      b.textContent=KL.ING[id];
      b.addEventListener("click",function(){feed(id)});
      row.appendChild(b);
    })(j);
  }
}
function feed(id){
  if(state!=="running"||!st||st.over||st.win)return;
  KL.simTick(L,st,id);
  if(st.lastTap===null){}
  updStats();
  if(st.over||st.win)finish();
}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  st=KL.newState(L);state="running";gen++;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=L.slots+" 单位 · 限时 "+L.ticks+" tick";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  buildIngButtons();updStats();
  $("btnPause").textContent="暂停";
  hideOverlay();
  say("按订单上的投料顺序点食材，做完自动出餐");
}
function updStats(){
  $("stSrv").textContent=st.served+"/"+L.target;
  $("stTick").textContent=Math.max(0,L.ticks-st.t);
  $("stMiss").textContent=st.missed+"/3";
  $("stMiss").classList.toggle("low",st.missed>0);
}
function finish(){
  state="over";gen++;
  if(st.win){
    if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:st.served}).catch(function(){});
    $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"收市！";
    $("ovDesc").innerHTML="目标达成：出餐 "+st.served+" 份，砸单 "+st.missed+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
    $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
    $("ovBtn").style.background="var(--g-btn-primary)";$("ovBtn").style.color="#fff";
  }else{
    var why=st.reason==="miss"?"砸单满 3 单，老板娘请你喝茶":"时间到，出餐还没凑够目标";
    $("ovTitle").textContent="收摊了";
    $("ovDesc").textContent=why+"。手要快，更要准。";
    $("ovBtn").textContent="重试本关";
    $("ovBtn").style.background="var(--g-btn-primary)";$("ovBtn").style.color="#fff";
  }
  $("overlay").classList.add("show");
}
/* ---------- 绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.height=Math.round(w*H/W)+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*H/W*dpr);
  var sc=w/W;
  ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
}
function rr(x,y,w2,h2,r){
  r=Math.min(r,w2/2,h2/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);
  ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();
}
function draw(){
  ctx.fillStyle=PAL.counter;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=PAL.counter2;ctx.fillRect(0,0,W,26);
  if(!st)return;
  ctx.fillStyle=PAL.text;
  ctx.font="600 12px sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText("订单台",12,13);
  var slots=L.slots,sw=(W-40)/slots;
  for(var s=0;s<slots;s++){
    var x0=16+s*sw;
    var o=st.active[s];
    ctx.fillStyle=PAL.surface;
    rr(x0+4,36,sw-8,170,12);ctx.fill();
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.stroke();
    if(!o){
      ctx.fillStyle=PAL.faint;
      ctx.font="400 14px sans-serif";ctx.textAlign="center";
      ctx.fillText("空位",x0+sw/2,120);
      continue;
    }
    /* 菜名与投料 chips */
    ctx.fillStyle=PAL.text;
    ctx.font="600 14px sans-serif";ctx.textAlign="center";
    var name="";
    for(var q=0;q<o.seq.length;q++)name+=KL.ING[o.seq[q]];
    ctx.fillText(name,x0+sw/2,60);
    for(var q2=0;q2<o.seq.length;q2++){
      var needIdx=o.need.indexOf(o.seq[q2]);
      var done=q2<o.seq.length-o.need.length;
      var isNext=!done&&o.need[0]===o.seq[q2];
      var cx=x0+sw/2-(o.seq.length*30)/2+15+q2*30;
      ctx.fillStyle=done?PAL.success:(isNext?PAL.warning:PAL.surface2);
      rr(cx-13,76,26,26,8);ctx.fill();
      ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle=done?PAL.surface:PAL.text;
      ctx.font="600 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(KL.ING[o.seq[q2]],cx,89);
    }
    /* 耐心条 */
    var pr=Math.max(0,o.pat/L.patience);
    ctx.fillStyle=PAL.surface2;
    rr(x0+12,116,sw-24,10,5);ctx.fill();
    ctx.fillStyle=o.pat<=2?PAL.danger:(pr<0.5?PAL.warning:PAL.success);
    rr(x0+12,116,(sw-24)*pr,10,5);ctx.fill();
    ctx.fillStyle=PAL.muted;
    ctx.font="400 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("耐心 "+Math.max(0,o.pat),x0+sw/2,142);
    /* 出餐箭头 */
    if(!o.need.length){}
  }
  ctx.fillStyle=PAL.muted;
  ctx.font="400 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("黄框=下一味 · 耐心条走完即砸单",W/2,H-14);
}
/* ---------- tick 节拍（rAF 驱动；切后台 rAF 停 → 时间自动冻结） ---------- */
var TICK_SEC=0.45,acc=0;
function frame(ts){
  var raf=ts;
  if(!frame.last)frame.last=ts;
  var dt=Math.min(0.05,(ts-frame.last)/1000||0);
  frame.last=ts;
  if(state==="running"){
    acc+=dt;
    var n=0;
    while(acc>=TICK_SEC&&n++<4){acc-=TICK_SEC;KL.simTick(L,st,null);updStats();if(st.over||st.win){finish();break;}}
  }
  draw();
}
function startLoop(){
  requestAnimationFrame(function ts_(t){
    if(state!=="over")frame(t);
    rafId=requestAnimationFrame(ts_);
  });
}
var rafId=0;
document.addEventListener("visibilitychange",function(){
  if(document.hidden){
    if(rafId){cancelAnimationFrame(rafId);rafId=0;}
    if(state==="running"){state="paused";$("btnPause").textContent="继续";say("已暂停——回到游戏继续出餐");}
  }else if(!rafId){frame.last=0;rafId=requestAnimationFrame(function ts_(t){frame(t);rafId=requestAnimationFrame(ts_);});}
});
/* ---------- 输入 ---------- */
$("btnPause").addEventListener("click",function(){
  if(state==="running"){state="paused";$("btnPause").textContent="继续";say("已暂停");}
  else if(state==="paused"){state="running";$("btnPause").textContent="暂停";say("继续出餐");}
});
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(state!=="over")openLevelSelect();});
$("ovBtn").addEventListener("click",function(){
  if(st.win){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }else loadLevel(lv);
  $("ovBtn").style.background="var(--g-surface2)";$("ovBtn").style.color="var(--g-text)";
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="6"){
    var idx=parseInt(k,10)-1;
    if(idx<L.set.length)feed(L.set[idx]);
    e.preventDefault();
  }
  else if(k===" "){e.preventDefault();$("btnPause").click();}
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
window.addEventListener("resize",resize);
/* ---------- 启动（loadLevel 以存档关续玩） ---------- */
loadLevel(save.lv);resize();
frame.last=0;
rafId=requestAnimationFrame(function ts_(t){frame(t);rafId=requestAnimationFrame(ts_);});
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
