<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材（st- 前缀素材 token）*/
  :root {
    --g-bg:#F5F6F3; --g-surface:#FFFFFF; --g-surface2:#EFF1EE;
    --g-primary:#2D9B6A; --g-primary-deep:#17734A;--g-btn-primary:#17734A; --g-primary-soft:#E8F6EF; --g-on-primary:#FFFFFF; --g-on-soft:#0B3625;
    --g-text:#1C1C1E; --g-muted:#6B6E73; --g-faint:#A9AEA9; --g-border:#E6E9E6; --g-hairline:#EFF1EE;
    --g-danger:#A83850; --g-warning:#9A6210; --g-success:#17734A; --g-water:#4A9FD4;
    --g-scrim:rgba(245,246,243,.9);
    --g-shadow:0 2px 12px rgba(20,40,30,.05);
    --g-radius:16px; --g-radius-btn:14px; --g-radius-inner:12px; --g-gap:16px;
    --g-st-sky1:#CFE9F4; --g-st-sky2:#EEF7FB; --g-st-cloud:#FFFFFF; --g-st-myline:#17734A; --g-st-ailine:#A83850;
    color-scheme:light;
  }
  :root[data-theme=dark] {
    --g-bg:#141614; --g-surface:#1D201E; --g-surface2:#262A27;
    --g-primary-deep:#5BC894; --g-primary-soft:#1D3229; --g-on-soft:#B9E8CF;
    --g-text:#E6E9E6; --g-muted:#A9AEA9; --g-faint:#7E837D; --g-border:#2C312D; --g-hairline:#262A27;
    --g-danger:#DB7186; --g-warning:#E2A44E; --g-success:#4ADE6E; --g-water:#6BB4DE;
    --g-scrim:rgba(20,22,20,.9);
    --g-shadow:0 2px 12px rgba(0,0,0,.28);
    --g-st-sky1:#152229; --g-st-sky2:#0E1418; --g-st-cloud:rgba(255,255,255,.12); --g-st-myline:#5BC894; --g-st-ailine:#DB7186;
    color-scheme:dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.5; }
  .icon-btn {
    width: 44px; height: 44px; flex: 0 0 44px;
    border: 1px solid var(--g-border); border-radius: 12px;
    background: var(--g-surface); color: var(--g-text);
    display: grid; place-items: center; cursor: pointer; font: inherit;
    touch-action: manipulation;
  }
  .icon-btn:active { opacity: .8; }
  .scores { display: flex; gap: 8px; flex: 1; }
  .score-box {
    background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 12px;
    flex: 1; min-width: 0; padding: 5px 8px; text-align: center; line-height: 1.3;
  }
  .score-box .label { display: block; font-size: 12px; opacity: .85; white-space: nowrap; }
  .score-box .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; min-width: 0; background: var(--g-surface2); border-radius: 12px; padding: 5px 8px; text-align: center; line-height: 1.3; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); white-space: nowrap; }
  .stat .val { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }

  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;

  .stage { position: relative; }
  canvas {
    display: block; width: 100%; aspect-ratio: 390 / 520; height: auto;
    background: var(--g-surface2);

  }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: absolute; inset: 0; z-index: 5;
    border-radius: 12px; background: var(--g-scrim);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 16px; text-align: center;
  }
  .overlay.show { display: flex; animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: translateY(0); } }
  .ov-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--g-primary-deep); max-width: 100%; }
  .ov-sub { margin: 0 0 6px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .btn-row { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .btn-row .btn { flex: 1; }
  .lv-wrap { width: 100%; max-width: 340px; max-height: 48vh; overflow-y: auto; }
  .lv-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .lv-chip {
    min-height: 44px; border: 1px solid var(--g-border); border-radius: 10px;
    background: var(--g-surface); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    touch-action: manipulation;
  }
  .lv-chip.sel { border-color: var(--g-primary); box-shadow: inset 0 0 0 1.5px var(--g-primary); background: var(--g-primary-soft); color: var(--g-on-soft); }
  .lv-chip.done { background: var(--g-btn-primary); border-color: var(--g-primary); color: var(--g-on-primary); }
  .lv-chip:disabled { opacity: .38; cursor: not-allowed; }
  .badge { display: none; margin: 0 0 4px; padding: 4px 12px; border-radius: 999px; background: var(--g-surface2); color: var(--g-warning); font-size: 12px; font-weight: 700; }
  .badge.show { display: inline-block; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();

<div class="wrap">

  <p class="foot">我的线（绿）剪中红线即胜，被红剪中即败 · 操作：按住拖动指向 / ←→ A D 转向 · 60 秒内取胜</p>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var KD={NW:390,NH:520,PSPEED:132,PTURN:2.6,MAXLEN:430,DT:1/60,TIME:60,
  ANCHOR_P:[100,498],ANCHOR_A:[290,498]};
/* 关卡生成：AI 速度 100→140、转向 1.2→2.0、反应 1.0→0.55s、风 6→22 */
KD.LEVEL_COUNT=40;
KD.genLevel=function(no){
  var p=(no-1)/(KD.LEVEL_COUNT-1);
  return {name:"第"+no+"关 · 风筝斗线",
    aiSpeed:Math.round(100+p*40),
    aiTurn:Math.round((1.2+p*0.8)*100)/100,
    aiReact:Math.round((1.0-p*0.45)*100)/100,
    wind:Math.round(6+p*16),
    windAng:-Math.PI/2+(no%3-1)*0.4,
    seed:61000+no*149};
};
KD.validate=function(level){
  if(!level||typeof level!=="object")return{ok:false,why:"bad"};
  if(!isFinite(level.aiSpeed)||level.aiSpeed<60||level.aiSpeed>200)return{ok:false,why:"aiSpeed"};
  if(!isFinite(level.aiTurn)||level.aiTurn<0.4||level.aiTurn>4)return{ok:false,why:"aiTurn"};
  if(!isFinite(level.aiReact)||level.aiReact<0.2||level.aiReact>2)return{ok:false,why:"aiReact"};
  if(!isFinite(level.wind)||level.wind<0||level.wind>80)return{ok:false,why:"wind"};
  if(!isFinite(level.windAng)||level.windAng<-4||level.windAng>4)return{ok:false,why:"windAng"};
  return{ok:true,why:""};
};
function kdSegHit(ax,ay,bx,by,cx2,cy2,dx2,dy2){
  var d1x=bx-ax,d1y=by-ay,d2x=dx2-cx2,d2y=dy2-cy2;
  var den=d1x*d2y-d1y*d2x;
  if(Math.abs(den)<0.0001)return false;
  var t=((cx2-ax)*d2y-(cy2-ay)*d2x)/den;
  var u=((cx2-ax)*d1y-(cy2-ay)*d1x)/den;
  return t>=0&&t<=1&&u>=0&&u<=1;
}
/* 剪线判定：跳过落在对方线轴保护区（锚点 60px）内的段——锚点处线被手握住剪不到 */
function kdTrailHit(trail,ax,ay,bx,by,protectPt,protectR){
  for(var i=0;i<trail.length-1;i++){
    if(protectPt){
      var mx=(trail[i][0]+trail[i+1][0])/2,my=(trail[i][1]+trail[i+1][1])/2;
      var dxp=mx-protectPt[0],dyp=my-protectPt[1];
      if(dxp*dxp+dyp*dyp<protectR*protectR)continue;
    }
    if(kdSegHit(ax,ay,bx,by,trail[i][0],trail[i][1],trail[i+1][0],trail[i+1][1]))return true;
  }
  return false;
}
function kdMove(k,anchor,speed,heading,wind,windAng,dt){
  var nx=k.x+Math.cos(heading)*speed*dt+Math.cos(windAng)*wind*dt;
  var ny=k.y+Math.sin(heading)*speed*dt+Math.sin(windAng)*wind*dt;
  var dx=nx-anchor[0],dy=ny-anchor[1];
  var d=Math.sqrt(dx*dx+dy*dy);
  if(d>KD.MAXLEN){nx=anchor[0]+dx*KD.MAXLEN/d;ny=anchor[1]+dy*KD.MAXLEN/d;}
  if(nx<14)nx=14;if(nx>KD.NW-14)nx=KD.NW-14;
  if(ny<14)ny=14;if(ny>KD.NH-14)ny=KD.NH-14;
  return [nx,ny];
}
function kdAppend(trail,pos){
  var last=trail[trail.length-1];
  var dx=pos[0]-last[0],dy=pos[1]-last[1];
  if(dx*dx+dy*dy>64)trail.push([pos[0],pos[1]]);
}
function kdTurn(cur,desired,rate,dt){
  var d=desired-cur;
  while(d>Math.PI)d-=Math.PI*2;
  while(d<-Math.PI)d+=Math.PI*2;
  var m=rate*dt;
  if(d>m)cur+=m;
  else if(d<-m)cur-=m;
  else cur=desired;
  return cur;
}
/* AI 选目标：我方线上离我风筝 >30 且离其自身 >20 的最近点；无则绕自家锚点 */
function kdAiTarget(run){
  var best=-1,bd=1e9;
  for(var i=0;i<run.pTrail.length;i++){
    var pt=run.pTrail[i];
    var dxm=pt[0]-run.pk.x,dym=pt[1]-run.pk.y;
    if(dxm*dxm+dym*dym<30*30)continue;
    var dxp=pt[0]-KD.ANCHOR_P[0],dyp=pt[1]-KD.ANCHOR_P[1];
    if(dxp*dxp+dyp*dyp<60*60)continue;   // 锚点保护区
    var dxa=pt[0]-run.ak.x,dya=pt[1]-run.ak.y;
    var d2=dxa*dxa+dya*dya;
    if(d2<bd){bd=d2;best=i;}
  }
  return best>=0?[run.pTrail[best][0],run.pTrail[best][1]]:null;
}
/* 对局单步：steer=-1/0/1；风筝动段跨过对方线即剪。返回 win/lose/timeout/run */
KD.step=function(run,steer){
  if(run.status!=="run")return run.status;
  var dt=KD.DT;
  run.t+=dt;
  // 我方风筝
  run.pk.h+=steer*KD.PTURN*dt;
  var old=[run.pk.x,run.pk.y];
  var np=kdMove(run.pk,KD.ANCHOR_P,KD.PSPEED,run.pk.h,run.level.wind,run.level.windAng,dt);
  run.pk.x=np[0];run.pk.y=np[1];
  kdAppend(run.pTrail,np);
  if(kdTrailHit(run.aTrail,old[0],old[1],np[0],np[1],KD.ANCHOR_A,60)){run.status="win";return "win";}
  // AI：按反应间隔追剪我方线
  run.aiTimer-=dt;
  if(run.aiTimer<=0){
    run.aiTimer=run.level.aiReact;
    var tgt=kdAiTarget(run);
    if(tgt)run.aiTarget=tgt;
  }
  var ak=run.ak;
  var desired;
  if(run.aiTarget){
    var tx=run.aiTarget[0]-ak.x,ty=run.aiTarget[1]-ak.y;
    if(tx*tx+ty*ty<16*16){run.aiTimer=0;desired=ak.h;}
    else desired=Math.atan2(ty,tx);
  }else{
    // 兜底：绕自家锚点巡航
    var vx=ak.x-KD.ANCHOR_A[0],vy=ak.y-KD.ANCHOR_A[1];
    var theta=Math.atan2(vy,vx);
    desired=theta+Math.PI/2;
    var vd=Math.sqrt(vx*vx+vy*vy);
    if(vd>140)desired-=0.5;
    if(vd<110)desired+=0.5;
  }
  ak.h=kdTurn(ak.h,desired,run.level.aiTurn,dt);
  var aold=[ak.x,ak.y];
  var na=kdMove(ak,KD.ANCHOR_A,run.level.aiSpeed,ak.h,run.level.wind,run.level.windAng,dt);
  ak.x=na[0];ak.y=na[1];
  kdAppend(run.aTrail,na);
  if(kdTrailHit(run.pTrail,aold[0],aold[1],na[0],na[1],KD.ANCHOR_P,60)){run.status="lose";return "lose";}
  if(run.t>=KD.TIME){run.status="timeout";return "timeout";}
  return "run";
};
KD.createRun=function(level){
  return {level:level,t:0,status:"run",aiTimer:0.4,aiTarget:null,
    pk:{x:KD.ANCHOR_P[0]+40,y:KD.ANCHOR_P[1]-70,h:-Math.PI/2},
    ak:{x:KD.ANCHOR_A[0]-40,y:KD.ANCHOR_A[1]-70,h:-Math.PI/2},
    pTrail:[[KD.ANCHOR_P[0],KD.ANCHOR_P[1]],[KD.ANCHOR_P[0]+40,KD.ANCHOR_P[1]-70]],
    aTrail:[[KD.ANCHOR_A[0],KD.ANCHOR_A[1]],[KD.ANCHOR_A[0]-40,KD.ANCHOR_A[1]-70]]};
};
/* 验证：参考策略——飞向对方线上离其风筝 ≥40px 的最近点并穿过（每帧重选） */
KD.refSim=function(level){
  var run=KD.createRun(level);
  var guard=Math.ceil(KD.TIME/KD.DT)+5;
  while(guard-->0&&run.status==="run"){
    var steer=0,best=null,bd=1e9;
    for(var i=0;i<run.aTrail.length;i++){
      var pt=run.aTrail[i];
      var dxa=pt[0]-run.ak.x,dya=pt[1]-run.ak.y;
      if(dxa*dxa+dya*dya<40*40)continue;
      var dxp=pt[0]-KD.ANCHOR_A[0],dyp=pt[1]-KD.ANCHOR_A[1];
      if(dxp*dxp+dyp*dyp<60*60)continue;
      var dxm=pt[0]-run.pk.x,dym=pt[1]-run.pk.y;
      var d2=dxm*dxm+dym*dym;
      if(d2<bd){bd=d2;best=pt;}
    }
    if(best){
      var desired=Math.atan2(best[1]-run.pk.y,best[0]-run.pk.x);
      var d=desired-run.pk.h;
      while(d>Math.PI)d-=Math.PI*2;
      while(d<-Math.PI)d+=Math.PI*2;
      if(d>0.12)steer=1;
      else if(d<-0.12)steer=-1;
    }else{
      // 无可剪目标：绕自家锚点 130 半径盘旋待机
      var vx=run.pk.x-KD.ANCHOR_P[0],vy=run.pk.y-KD.ANCHOR_P[1];
      var theta=Math.atan2(vy,vx);
      var want=theta-Math.PI/2;
      var vd=Math.sqrt(vx*vx+vy*vy);
      if(vd>150)want-=0.5;
      if(vd<110)want+=0.5;
      var d2b=want-run.pk.h;
      while(d2b>Math.PI)d2b-=Math.PI*2;
      while(d2b<-Math.PI)d2b+=Math.PI*2;
      if(d2b>0.12)steer=1;
      else if(d2b<-0.12)steer=-1;
    }
    var res=KD.step(run,steer);
    if(res!=="run")return {status:res,t:run.t};
  }
  return {status:run.status,t:run.t};
};
KD.validateAll=function(){
  var fails=[],tSum=0,i;
  for(i=1;i<=KD.LEVEL_COUNT;i++){
    var L=KD.genLevel(i);
    var chk=KD.validate(L);
    if(!chk.ok){fails.push(i+"("+chk.why+")");continue;}
    var r=KD.refSim(L);
    if(r.status!=="win"){fails.push(i+"("+r.status+"@"+Math.round(r.t)+"s)");}
    else tSum+=r.t;
  }
  return {total:KD.LEVEL_COUNT,solvable:KD.LEVEL_COUNT-fails.length,fail:fails,
    avgCut:Math.round(tSum/KD.LEVEL_COUNT*10)/10};
};
globalThis.__XC=KD;
/*XC-CORE-END*/

/* ========== 画布与调色板 ========== */
var NW=390,NH=520,W=390,H=520,S=1,offX=0,offY=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),border:v("--g-border"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),danger:v("--g-danger"),warning:v("--g-warning"),
    water:v("--g-water"),success:v("--g-success"),onPrimary:v("--g-on-primary"),surface:v("--g-surface"),
    sky1:v("--g-st-sky1"),sky2:v("--g-st-sky2"),cloud:v("--g-st-cloud"),myline:v("--g-st-myline"),ailine:v("--g-st-ailine")};
}
window.__gOnTheme=function(){palLoad();grads=null;};
palLoad();
var grads=null;
function buildGrads(){grads=ctx.createLinearGradient(0,0,0,NH);grads.addColorStop(0,PAL.sky1);grads.addColorStop(1,PAL.sky2);}

/* ========== 音效 ========== */
var AC=null;
function beep(f,d,type,vol){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=f;g.gain.value=vol||0.05;
    o.connect(g);g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(d||0.1));
    o.start();o.stop(AC.currentTime+(d||0.1)+0.02);
  }catch(e){}
}

/* ========== 关卡数据：包内生成 + DB 下发（整批替换，任一条非法整批放弃） ========== */
var LEVELS=[],cur=0;
var LEVELS_KEY="sw.kiteduel.v1.levels",LEVELS_VER_KEY="sw.kiteduel.v1.levels.ver";
function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=KD.LEVEL_COUNT;i++)list.push(KD.genLevel(i));
  return list;
}
function parseKiteLevels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={},i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    var d;
    try{d=JSON.parse(item.dataJson)}catch(e){return null}
    if(!KD.validate(d).ok)return null;
    if(KD.refSim(d,65).status!=="win")return null;   // 下发关卡必须可胜
    var no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=true;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;}
  }catch(e){}
  return 0;
}

/* ========== 存档（本地 + 账号双写，账号更优才覆盖） ========== */
var KEY="sw.kiteduel.v1";
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
var curSave=(function(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return{lv:parseInt(s.lv,10)||0,best:parseInt(s.best,10)||1};}catch(e){}
  return{lv:0,best:1};
})();
var unlocked=clamp(curSave.best,1,1);
function save(){
  var data={lv:cur,best:unlocked};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("kite-duel",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("kite-duel").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(r.lv,10),rb=parseInt(r.best,10);
      if(isFinite(rl)&&rl>curSave.lv){curSave.lv=Math.min(rl,LEVELS.length-1);changed=true;}
      if(isFinite(rb)&&rb>unlocked){unlocked=clamp(rb,1,LEVELS.length);changed=true;}
      if(changed){save();buildLevelChips();startLevel(curSave.lv);}
    }catch(e){}
  }).catch(function(){});
}

/* ========== 游戏状态 ========== */
var G=null;
var state="running";
var steer=0,steerKey=0,steerPt=null;
var ui={
  lv:document.getElementById("stLv"),wind:document.getElementById("stWind"),
  time:document.getElementById("stTime"),msg:document.getElementById("msg"),
  ovWin:document.getElementById("ovWin"),ovFail:document.getElementById("ovFail"),ovSelect:document.getElementById("ovSelect"),
  ovWinDesc:document.getElementById("ovWinDesc"),ovFailDesc:document.getElementById("ovFailDesc"),
  ovNew:document.getElementById("ovNew"),btnNext:document.getElementById("btnNext"),
  lvGrid:document.getElementById("lvGrid")
};
function say(t){ui.msg.textContent=t}
function startLevel(n){
  cur=clamp(n,0,Math.max(0,LEVELS.length-1));
  var L=LEVELS[cur];
  G=KD.createRun(L);
  steer=0;steerKey=0;steerPt=null;
  state="running";
  showOverlay(null);
  buildLevelChips();
  syncHud();
  say(L.name+" · 缠住对方风筝线，先剪断者胜");
  save();
}
function finishWin(){
  var isNew=(cur+2)>unlocked;
  unlocked=Math.min(LEVELS.length,Math.max(unlocked,cur+2));
  save();
  buildLevelChips();
  ui.ovWinDesc.textContent="剪断用时 "+G.t.toFixed(1)+" 秒";
  ui.ovNew.classList.toggle("show",isNew);
  ui.btnNext.style.display=cur<LEVELS.length-1?"":"none";
  showOverlay("win");
  if(GB.available)GB.reportScore("kite-duel",{metricValue:cur+1,metricExtra:Math.round(G.t*10)}).catch(function(){});
}
function failLevel(reason){
  state="failed";
  ui.ovFailDesc.textContent=reason;
  showOverlay("fail");
}
function showOverlay(name){
  ui.ovWin.classList.toggle("show",name==="win");
  ui.ovFail.classList.toggle("show",name==="fail");
  ui.ovSelect.classList.toggle("show",name==="select");
}
function buildLevelChips(){
  var html="";
  for(var i=0;i<LEVELS.length;i++){
    var cls="lv-chip"+(i===cur?" sel":"")+(i<unlocked?" done":"");
    var dis=i<unlocked?"":" disabled";
    html+='<button class="'+cls+'" type="button" data-lv="'+i+'"'+dis+'>'+(i+1)+'</button>';
  }
  ui.lvGrid.innerHTML=html;
  var btns=ui.lvGrid.querySelectorAll(".lv-chip");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var n=Number(this.getAttribute("data-lv"));
      showOverlay(null);
      startLevel(n);
    });
  }
}

/* ========== 更新与 HUD ========== */
function step(dt){
  // 触点转向优先，其次键盘
  if(steerPt!==null){
    var desired=Math.atan2(steerPt.y-G.pk.y,steerPt.x-G.pk.x);
    var d=desired-G.pk.h;
    while(d>Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;
    steer=d>0.1?1:(d<-0.1?-1:0);
  }else steer=steerKey;
  var acc=0;
  var steps=Math.max(1,Math.round(dt/KD.DT));
  var h=dt/steps;
  for(var i=0;i<steps;i++){
    var res=KD.step(G,steer);
    acc++;
    if(res==="win"){
      state="won";
      beep(700,0.16,"square",0.06);
      finishWin();
      return;
    }else if(res==="lose"){
      state="failed";
      failLevel("风筝线被对方剪断了");
      return;
    }else if(res==="timeout"){
      state="failed";
      failLevel("缠斗超时，换条路线再试");
      return;
    }
  }
  syncHud();
}
function syncHud(){
  ui.lv.textContent=(cur+1)+"/"+LEVELS.length;
  ui.wind.textContent=G.level.wind+" 级";
  ui.time.textContent=G.t.toFixed(0)+"s";
}

/* ========== 绘制 ========== */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawKite(k,col,edge){
  ctx.save();
  ctx.translate(k.x,k.y);ctx.rotate(k.h+Math.PI/2);
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(0,-14);ctx.lineTo(11,4);ctx.lineTo(0,10);ctx.lineTo(-11,4);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=edge;ctx.lineWidth=1.8;ctx.stroke();
  ctx.strokeStyle=edge;ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,10);ctx.moveTo(-11,4);ctx.lineTo(11,4);ctx.stroke();
  // 尾巴
  ctx.strokeStyle=col;ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(0,10);
  ctx.quadraticCurveTo(6,20,Math.sin(k.h*3)*4,26);
  ctx.stroke();
  ctx.restore();
}
function drawTrail(trail,col){
  ctx.strokeStyle=col;ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(trail[0][0],trail[0][1]);
  for(var i=1;i<trail.length;i++)ctx.lineTo(trail[i][0],trail[i][1]);
  ctx.stroke();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(offX,offY);ctx.scale(S,S);
  if(!grads)buildGrads();
  ctx.fillStyle=grads;ctx.fillRect(0,0,NW,NH);
  // 云
  ctx.fillStyle=PAL.cloud;
  var t=G?G.t:0;
  cloud(80+Math.sin(t*0.3)*6,110,20,0.5);
  cloud(300+Math.sin(t*0.24+2)*8,190,16,0.4);
  cloud(160+Math.sin(t*0.27+4)*6,300,18,0.35);
  function cloud(x,y,r,a){
    ctx.globalAlpha=a;
    ctx.beginPath();
    ctx.arc(x,y,r,0,6.3);ctx.arc(x+r*0.9,y+4,r*0.7,0,6.3);ctx.arc(x-r*0.9,y+5,r*0.64,0,6.3);
    ctx.fill();
    ctx.globalAlpha=1;
  }
  if(G){
    drawTrail(G.aTrail,PAL.ailine);
    drawTrail(G.pTrail,PAL.myline);
    // 线轴锚点
    ctx.fillStyle=PAL.surface;
    rr(KD.ANCHOR_P[0]-10,KD.ANCHOR_P[1]-6,20,14,6);ctx.fill();
    ctx.strokeStyle=PAL.myline;ctx.lineWidth=2;ctx.stroke();
    rr(KD.ANCHOR_A[0]-10,KD.ANCHOR_A[1]-6,20,14,6);ctx.fill();
    ctx.strokeStyle=PAL.ailine;ctx.lineWidth=2;ctx.stroke();
    drawKite(G.ak,PAL.danger,PAL.deep);
    drawKite(G.pk,PAL.primary,PAL.deep);
    syncHud();
  }
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

/* ========== 输入：按住拖动指向 / 左右键转向 ========== */
function toNominal(ev){
  var r=cv.getBoundingClientRect();
  return{x:(ev.clientX-r.left-offX)/S,y:(ev.clientY-r.top-offY)/S};
}
cv.addEventListener("pointerdown",function(ev){
  steerPt=toNominal(ev);
  try{cv.setPointerCapture(ev.pointerId)}catch(e){}
  ev.preventDefault();
});
cv.addEventListener("pointermove",function(ev){
  if(steerPt!==null)steerPt=toNominal(ev);
  ev.preventDefault();
});
cv.addEventListener("pointerup",function(){steerPt=null;});
cv.addEventListener("pointercancel",function(){steerPt=null;});
window.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowLeft"||k==="a"){e.preventDefault();steerKey=-1;}
  else if(k==="ArrowRight"||k==="d"){e.preventDefault();steerKey=1;}
});
window.addEventListener("keyup",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowLeft"||k==="a"){if(steerKey===-1)steerKey=0;}
  else if(k==="ArrowRight"||k==="d"){if(steerKey===1)steerKey=0;}
});

document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running"){say("已暂停 · 切回继续缠斗");steerPt=null;}
});

/* ========== 主循环与启动 ========== */
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));
  H=Math.max(320,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);
  offX=(W-NW*S)/2;offY=(H-NH*S)/2;
}
window.addEventListener("resize",resize);
var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.033,(ts-last)/1000||0);
  last=ts;
  if(state==="running"&&G)step(dt);
  draw();
}

document.getElementById("btnSelectTop").addEventListener("click",function(){buildLevelChips();showOverlay("select");});
document.getElementById("btnSelectWin").addEventListener("click",function(){buildLevelChips();showOverlay("select");});
document.getElementById("btnSelectFail").addEventListener("click",function(){buildLevelChips();showOverlay("select");});
document.getElementById("btnCloseSelect").addEventListener("click",function(){showOverlay(null);});
document.getElementById("btnNext").addEventListener("click",function(){startLevel(cur<LEVELS.length-1?cur+1:0);});
document.getElementById("btnReplayWin").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnRetry").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnRetryBottom").addEventListener("click",function(){startLevel(cur);});

/* 调试验证入口：参考绕圈策略逐关复现（60s 内剪中对方线） */
window.__validateLevels=function(){
  try{return KD.validateAll()}catch(e){return {error:String(e)}}
};

resize();
LEVELS=buildDefaultLevels();
loadCachedLevels();
cur=clamp(parseInt(curSave.lv,10)||0,0,Math.max(0,LEVELS.length-1));
unlocked=clamp(parseInt(curSave.best,10)||1,1,Math.max(1,LEVELS.length));
startLevel(cur);
requestAnimationFrame(frame);
(function(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("kite-duel").then(function(res){
    var list=parseKiteLevels(res);
    if(!list||!list.length)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      startLevel(cur);
    }
  }).catch(function(){});
})();
syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
