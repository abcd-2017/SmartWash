<title>骑士巡游</title>
<style>

  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-st-sq1:#FFFFFF;--g-st-sq2:#EFF1EE;--g-st-hole:#3A3F3B;--g-st-trail:#CFE7D9;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-sq1:#1D201E;--g-st-sq2:#262A27;--g-st-hole:#0C0E0C;--g-st-trail:#24402F;color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;

    min-height: 44px; padding: 0 14px; flex: 1;

    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;

  .btn.ghost { background: transparent; color: var(--g-primary-deep); box-shadow: inset 0 0 0 2px var(--g-primary-deep); }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .35; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .lvbtn[disabled] { opacity: .35; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}

  .board {
    display: grid; gap: 3px; background: var(--g-border); padding: 3px;

  .cellk {

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="knight-tour",SAVE_KEY="sw.knighttour.v1";
var DEFAULT_LEVELS=[{"name":"巡游·01","rows":5,"cols":5,"start":24,"difficulty":1},{"name":"巡游·02","rows":5,"cols":5,"start":16,"difficulty":1},{"name":"巡游·03","rows":5,"cols":5,"start":22,"difficulty":1},{"name":"巡游·04","rows":5,"cols":5,"start":14,"difficulty":1},{"name":"巡游·05","rows":5,"cols":5,"start":0,"difficulty":1},{"name":"巡游·06","rows":5,"cols":5,"start":10,"difficulty":1},{"name":"巡游·07","rows":5,"cols":5,"start":18,"difficulty":1},{"name":"巡游·08","rows":5,"cols":5,"start":2,"difficulty":1},{"name":"巡游·09","rows":5,"cols":6,"start":25,"difficulty":2},{"name":"巡游·10","rows":5,"cols":6,"start":9,"difficulty":2},{"name":"巡游·11","rows":5,"cols":6,"start":19,"difficulty":2},{"name":"巡游·12","rows":5,"cols":6,"start":12,"difficulty":2},{"name":"巡游·13","rows":6,"cols":6,"start":14,"holes":[30,35],"difficulty":2},{"name":"巡游·14","rows":6,"cols":6,"start":31,"holes":[21,1],"difficulty":2},{"name":"巡游·15","rows":6,"cols":6,"start":19,"holes":[25,33],"difficulty":3},{"name":"巡游·16","rows":6,"cols":6,"start":19,"holes":[34,11],"difficulty":3},{"name":"巡游·17","rows":6,"cols":6,"start":4,"holes":[1,23],"difficulty":3},{"name":"巡游·18","rows":6,"cols":6,"start":15,"holes":[29,24],"difficulty":3},{"name":"巡游·19","rows":6,"cols":6,"start":32,"holes":[26,8,0,30],"difficulty":3},{"name":"巡游·20","rows":6,"cols":6,"start":10,"holes":[4,20,3,24],"difficulty":3},{"name":"巡游·21","rows":6,"cols":6,"start":30,"holes":[19,25,33,1],"difficulty":3},{"name":"巡游·22","rows":6,"cols":6,"start":23,"holes":[6,3,4,33],"difficulty":3},{"name":"巡游·23","rows":6,"cols":6,"start":22,"holes":[4,8,35,25],"difficulty":3},{"name":"巡游·24","rows":6,"cols":6,"start":5,"holes":[6,23,34,2],"difficulty":3},{"name":"巡游·25","rows":7,"cols":7,"start":20,"holes":[34,21,36],"difficulty":4},{"name":"巡游·26","rows":7,"cols":7,"start":45,"holes":[2,21,24],"difficulty":4},{"name":"巡游·27","rows":7,"cols":7,"start":12,"holes":[22,23,20],"difficulty":4},{"name":"巡游·28","rows":7,"cols":7,"start":33,"holes":[16,32,21],"difficulty":4},{"name":"巡游·29","rows":7,"cols":7,"start":22,"holes":[43,14,0],"difficulty":4},{"name":"巡游·30","rows":7,"cols":7,"start":14,"holes":[2,15,41,24,45,48],"difficulty":4},{"name":"巡游·31","rows":7,"cols":7,"start":3,"holes":[42,32,30,1,46,21],"difficulty":4},{"name":"巡游·32","rows":7,"cols":7,"start":41,"holes":[14,28,1,44,43,16],"difficulty":4},{"name":"巡游·33","rows":7,"cols":7,"start":38,"holes":[13,0,7,8,14,47],"difficulty":4},{"name":"巡游·34","rows":7,"cols":7,"start":1,"holes":[20,17,13,42,32,40],"difficulty":4},{"name":"巡游·35","rows":8,"cols":8,"start":27,"holes":[11,58,48,56],"difficulty":5},{"name":"巡游·36","rows":8,"cols":8,"start":2,"holes":[7,63,16,8],"difficulty":5},{"name":"巡游·37","rows":8,"cols":8,"start":44,"holes":[42,63,6,30],"difficulty":5},{"name":"巡游·38","rows":8,"cols":8,"start":53,"holes":[30,4,34,49],"difficulty":5},{"name":"巡游·39","rows":8,"cols":8,"start":45,"holes":[61,36,30,16,33,23,3,32],"difficulty":5},{"name":"巡游·40","rows":8,"cols":8,"start":38,"holes":[11,8,55,14,51,59,0,31],"difficulty":5},{"name":"巡游·41","rows":8,"cols":8,"start":12,"holes":[45,27,40,56,44,31,36,58],"difficulty":5},{"name":"巡游·42","rows":6,"cols":6,"start":4,"closed":1,"difficulty":5},{"name":"巡游·43","rows":6,"cols":6,"start":20,"closed":1,"difficulty":5},{"name":"巡游·44","rows":6,"cols":6,"start":18,"closed":1,"difficulty":5},{"name":"巡游·45","rows":8,"cols":8,"start":50,"closed":1,"difficulty":5},{"name":"巡游·46","rows":8,"cols":8,"start":13,"closed":1,"difficulty":5},{"name":"巡游·47","rows":8,"cols":8,"start":22,"closed":1,"difficulty":5}];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list.map(normalizeLevel);return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
      if(typeof resize==="function")resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层（lvgrid 通用） ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  var u=$("ovUndo");
  if(u)u.hidden=true;
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

/* 单条结构校验 */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.rows)||d.rows<5||d.rows>10)return false;
  if(!Number.isInteger(d.cols)||d.cols<5||d.cols>10)return false;
  var total=d.rows*d.cols;
  if(!Number.isInteger(d.start)||d.start<0||d.start>=total)return false;
  var holes=(d.holes===undefined)?[]:d.holes;
  if(!Array.isArray(holes)||holes.length>total-9)return false;
  for(var i=0;i<holes.length;i++){
    if(!Number.isInteger(holes[i])||holes[i]<0||holes[i]>=total||holes[i]===d.start)return false;
  }
  return true;
}
/* ---------- 独立求解器：Warnsdorff 启发 + 预算回溯（用于加载复核与提示） ---------- */
var KNIGHT_MOVES=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
/* 从 startMask（已有访问集合 path[0..]）继续找完整巡游；返回完整路径或 null */
function knightSolve(rows,cols,path,holeSet,closed,budget){
  var total=rows*cols;
  var holeCnt=holeSet.size;
  var freeCnt=total-holeCnt;
  if(path.length>=freeCnt)return null;
  var visited=new Array(total).fill(false);
  for(var i=0;i<path.length;i++)visited[path[i]]=true;
  var nodes=0;
  function deg(cell){
    var r=Math.floor(cell/cols),c=cell%cols,d=0;
    for(var m=0;m<8;m++){
      var nr=r+KNIGHT_MOVES[m][0],nc=c+KNIGHT_MOVES[m][1];
      if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
      var ncell=nr*cols+nc;
      if(!visited[ncell]&&!holeSet.has(ncell))d++;
    }
    return d;
  }
  function dfs(cell,step){
    if(++nodes>budget)return false;
    if(step===freeCnt){
      if(!closed)return true;
      var r=Math.floor(cell/cols),c=cell%cols,sr=Math.floor(path[0]/cols),sc=path[0]%cols;
      for(var m=0;m<8;m++){
        if(r+KNIGHT_MOVES[m][0]===sr&&c+KNIGHT_MOVES[m][1]===sc)return true;
      }
      return false;
    }
    var r=Math.floor(cell/cols),c=cell%cols,cands=[];
    for(var m2=0;m2<8;m2++){
      var nr2=r+KNIGHT_MOVES[m2][0],nc2=c+KNIGHT_MOVES[m2][1];
      if(nr2<0||nr2>=rows||nc2<0||nc2>=cols)continue;
      var nc2cell=nr2*cols+nc2;
      if(visited[nc2cell]||holeSet.has(nc2cell))continue;
      cands.push([deg(nc2cell),Math.random(),nc2cell]);
    }
    cands.sort(function(a,b){return a[0]-b[0]||a[1]-b[1];});
    for(var t=0;t<cands.length;t++){
      var nb=cands[t][2];
      visited[nb]=true;path.push(nb);
      if(dfs(nb,step+1))return true;
      path.pop();visited[nb]=false;
    }
    return false;
  }
  var ok=dfs(path[path.length-1],path.length);
  return ok?path:null;
}
function knightVerify(L){
  var holes=new Set(L.holes||[]);
  var total=L.rows*L.cols;
  if(holes.has(L.start))return false;
  // Warnsdorff 平序随机打破，单次搜索可能落空；多次重试直至找到完整巡游
  for(var t=0;t<8;t++){
    var path=[L.start];
    var res=knightSolve(L.rows,L.cols,path,holes,!!L.closed,200000);
    if(res&&res.length===total-holes.size)return true;
  }
  return false;
}
/* ---------- 调色板（DOM 直用 token） ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  PAL={deep:s.getPropertyValue("--g-primary-deep").trim()};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,rows=0,cols=0,holeSet=new Set(),freeCnt=0;
var path=[],done=false,stuck=false;
var KNIGHT_SVG='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.5 21h12v-2.2c-1.8-.2-2.8-1-2.8-2 2-2 3.3-4.8 3.3-7.3 0-4.3-3.9-7-7.6-7l.9-1.9H9.9L8.7 3.9C6.3 5 4.4 7.9 4.4 11.4c0 2 .8 3.6.8 4.7 0 1.4-.9 2.6-2.7 3.4l1.6 1.5h2.4z"/></svg>';
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(nl){
  lv=Math.max(0,Math.min(nl,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  rows=L.rows;cols=L.cols;
  holeSet=new Set(L.holes||[]);
  freeCnt=rows*cols-holeSet.size;
  var ok=knightVerify(L);   // 加载复核：从起点确有完整巡游
  path=[L.start];done=false;stuck=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=rows+"×"+cols+(holeSet.size?" · "+holeSet.size+" 缺口":"")+(L.closed?" · 闭环巡游":" · 开放巡游");
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stTotal").textContent=freeCnt;
  if(!ok)say("警告：内嵌求解器未能复核本关（数据异常）");
  else say("马走「日」字，踏遍全盘 "+freeCnt+" 个空格");
  render();updStats();
}
function legalMoves(){
  var out=[],r=Math.floor(path[path.length-1]/cols),c=path[path.length-1]%cols;
  for(var m=0;m<8;m++){
    var nr=r+KNIGHT_MOVES[m][0],nc=c+KNIGHT_MOVES[m][1];
    if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
    var cell=nr*cols+nc;
    if(holeSet.has(cell)||path.indexOf(cell)>=0)continue;
    out.push({m:m,cell:cell});
  }
  return out;
}
function updStats(){
  $("stMoves").textContent=path.length;
  $("btnUndo").disabled=path.length<=1||done;
}
/* ---------- 渲染 ---------- */
function render(){
  var board=$("board");
  board.style.gridTemplateColumns="repeat("+cols+",1fr)";
  board.innerHTML="";
  var legal=legalMoves(),dst={};
  for(var i=0;i<legal.length;i++)dst[legal[i].cell]=1;
  for(var cell=0;cell<rows*cols;cell++){
    var d=document.createElement("button");
    d.type="button";
    var cls="cellk";
    var r=Math.floor(cell/cols),c=cell%cols;
    if((r+c)%2===0)cls+=" lt";
    var idx=path.indexOf(cell);
    if(holeSet.has(cell))cls+=" hole";
    else if(idx>=0)cls+=" vis";
    if(cell===path[path.length-1])cls+=" cur";
    if(dst[cell])cls+=" dst";
    d.className=cls;
    d.disabled=holeSet.has(cell);
    if(idx>=0&&idx<path.length-1)d.innerHTML='<span class="mv">'+(idx+1)+'</span>';
    if(cell===path[path.length-1])d.innerHTML=KNIGHT_SVG;
    if(idx>=0||holeSet.has(cell)||!dst[cell])d.tabIndex=-1;
    d.setAttribute("aria-label","格 "+(cell+1));
    d.addEventListener("click",function(){
      var cc=cell;
      return function(){tryMove(cc)};
    }());
    board.appendChild(d);
  }
  var mvs=$("moves");mvs.innerHTML="";
  for(var m2=0;m2<8;m2++){
    (function(m2){
      var b=document.createElement("button");
      b.className="mvbtn";
      b.textContent=m2+1;
      var legalIdx=-1;
      for(var i2=0;i2<legal.length;i2++)if(legal[i2].m===m2)legalIdx=i2;
      b.disabled=legalIdx<0||done;
      b.setAttribute("aria-label","马步方向 "+(m2+1));
      b.addEventListener("click",function(){tryMove(legal[legalIdx].cell)});
      mvs.appendChild(b);
    })(m2);
  }
}
function tryMove(cell){
  if(done)return;
  var legal=legalMoves(),ok=false;
  for(var i=0;i<legal.length;i++)if(legal[i].cell===cell)ok=true;
  if(!ok){say("这不是马步能到的格（或已走过）");return;}
  path.push(cell);
  stuck=false;
  render();updStats();
  if(path.length===freeCnt){
    var last=path[path.length-1],first=path[0];
    var closedOk=true;
    if(L.closed){
      var lr=Math.floor(last/cols),lc=last%cols,fr=Math.floor(first/cols),fc=first%cols;
      closedOk=false;
      for(var m=0;m<8;m++){
        if(lr+KNIGHT_MOVES[m][0]===fr&&lc+KNIGHT_MOVES[m][1]===fc)closedOk=true;
      }
    }
    if(closedOk){winLevel();return;}
  }
  if(!legalMoves().length){
    stuck=true;
    $("ovTitle").textContent="无路可走";
    $("ovDesc").textContent="走了 "+path.length+" / "+freeCnt+" 格。马步被堵死了，撤销几步换个走法。";
    $("ovBtn").textContent="重开本关";
    $("ovUndo").hidden=false;
    $("overlay").classList.add("show");
  }
}
function undo(){
  if(path.length<=1||done)return;
  path.pop();stuck=false;
  hideOverlay();render();updStats();say("已撤销一步");
}
function hint(){
  if(done)return;
  var res=null;
  for(var t=0;t<8&&!res;t++)res=knightSolve(rows,cols,path.slice(),holeSet,!!L.closed,200000);
  if(!res){say(stuck?"当前局面已无法完成巡游，建议撤销":"内嵌求解器没找到路线，再走几步试试");return;}
  var next=res[path.length];
  var board=$("board").children;
  if(board[next]){
    board[next].classList.add("hintc");
    setTimeout(function(){if(board[next])board[next].classList.remove("hintc")},1600);
  }
  say("求解器建议走 "+(next+1)+" 格（ Warnsdorff 启发+回溯）");
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:path.length}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"巡游完成！";
  $("ovDesc").innerHTML=(L.closed?"闭环":"开放")+"巡游踏遍 "+freeCnt+" 格"+(L.closed?"，末格回到起点旁":"")+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>47 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("ovUndo").hidden=true;
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 输入 ---------- */
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(done)return;openLevelSelect()});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(stuck){loadLevel(lv);return;}
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
var ovUndoEl=$("ovUndo");
if(ovUndoEl)ovUndoEl.addEventListener("click",undo);
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="8"){
    var m=parseInt(k,10)-1;
    var legal=legalMoves();
    for(var i=0;i<legal.length;i++)if(legal[i].m===m){tryMove(legal[i].cell);break;}
    e.preventDefault();
  }
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
  else if(k===" "||k==="Enter"){if($("overlay").classList.contains("show"))$("ovBtn").click();e.preventDefault();}
});
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);
syncLevelsFromServer();syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
