var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list.map(normalizeLevel);return v;
    }
  }catch(e){}
  return 0;
}

/* 单条结构校验 */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.rows)||d.rows<5||d.rows>10)return false;
  if(!Number.isInteger(d.cols)||d.cols<5||d.cols>10)return false;
  var total=d.rows*d.cols;
  if(!Number.isInteger(d.start)||d.start<0||d.start>=total)return false;
  var holes=(d.holes===undefined)?[]:d.holes;
  if(!Array.isArray(holes)||holes.length>total-9)return false;
  for(var i=0;i<holes.length;i++){
    if(!Number.isInteger(holes[i])||holes[i]<0||holes[i]>=total||holes[i]===d.start)return false;
  }
  return true;
}
/* ---------- 独立求解器：Warnsdorff 启发 + 预算回溯（用于加载复核与提示） ---------- */
var KNIGHT_MOVES=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
/* 从 startMask（已有访问集合 path[0..]）继续找完整巡游；返回完整路径或 null */
function knightSolve(rows,cols,path,holeSet,closed,budget){
  var total=rows*cols;
  var holeCnt=holeSet.size;
  var freeCnt=total-holeCnt;
  if(path.length>=freeCnt)return null;
  var visited=new Array(total).fill(false);
  for(var i=0;i<path.length;i++)visited[path[i]]=true;
  var nodes=0;
  function deg(cell){
    var r=Math.floor(cell/cols),c=cell%cols,d=0;
    for(var m=0;m<8;m++){
      var nr=r+KNIGHT_MOVES[m][0],nc=c+KNIGHT_MOVES[m][1];
      if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
      var ncell=nr*cols+nc;
      if(!visited[ncell]&&!holeSet.has(ncell))d++;
    }
    return d;
  }
  function dfs(cell,step){
    if(++nodes>budget)return false;
    if(step===freeCnt){
      if(!closed)return true;
      var r=Math.floor(cell/cols),c=cell%cols,sr=Math.floor(path[0]/cols),sc=path[0]%cols;
      for(var m=0;m<8;m++){
        if(r+KNIGHT_MOVES[m][0]===sr&&c+KNIGHT_MOVES[m][1]===sc)return true;
      }
      return false;
    }
    var r=Math.floor(cell/cols),c=cell%cols,cands=[];
    for(var m2=0;m2<8;m2++){
      var nr2=r+KNIGHT_MOVES[m2][0],nc2=c+KNIGHT_MOVES[m2][1];
      if(nr2<0||nr2>=rows||nc2<0||nc2>=cols)continue;
      var nc2cell=nr2*cols+nc2;
      if(visited[nc2cell]||holeSet.has(nc2cell))continue;
      cands.push([deg(nc2cell),Math.random(),nc2cell]);
    }
    cands.sort(function(a,b){return a[0]-b[0]||a[1]-b[1];});
    for(var t=0;t<cands.length;t++){
      var nb=cands[t][2];
      visited[nb]=true;path.push(nb);
      if(dfs(nb,step+1))return true;
      path.pop();visited[nb]=false;
    }
    return false;
  }
  var ok=dfs(path[path.length-1],path.length);
  return ok?path:null;
}
function knightVerify(L){
  var holes=new Set(L.holes||[]);
  var total=L.rows*L.cols;
  if(holes.has(L.start))return false;
  // Warnsdorff 平序随机打破，单次搜索可能落空；多次重试直至找到完整巡游
  for(var t=0;t<8;t++){
    var path=[L.start];
    var res=knightSolve(L.rows,L.cols,path,holes,!!L.closed,200000);
    if(res&&res.length===total-holes.size)return true;
  }
  return false;
}

function loadLevel(nl){

  freeCnt=rows*cols-holeSet.size;
  var ok=knightVerify(L);   // 加载复核：从起点确有完整巡游

  $("lvRule").textContent=rows+"×"+cols+(holeSet.size?" · "+holeSet.size+" 缺口":"")+(L.closed?" · 闭环巡游":" · 开放巡游");
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stTotal").textContent=freeCnt;
  if(!ok)say("警告：内嵌求解器未能复核本关（数据异常）");

function legalMoves(){
  var out=[],r=Math.floor(path[path.length-1]/cols),c=path[path.length-1]%cols;
  for(var m=0;m<8;m++){
    var nr=r+KNIGHT_MOVES[m][0],nc=c+KNIGHT_MOVES[m][1];
    if(nr<0||nr>=rows||nc<0||nc>=cols)continue;
    var cell=nr*cols+nc;
    if(holeSet.has(cell)||path.indexOf(cell)>=0)continue;
    out.push({m:m,cell:cell});
  }
  return out;
}

  var enter=board.classList.contains("enter");

      mvs.appendChild(b);
    })(m2);

}
function tryMove(cell){
  if(done)return;
  var legal=legalMoves(),ok=false;
  for(var i=0;i<legal.length;i++)if(legal[i].cell===cell)ok=true;
  if(!ok){say("这不是马步能到的格（或已走过）");return;}
  path.push(cell);
  stuck=false;
  var b=$("board");b.classList.remove("enter");clearTimeout(enterBoard._t);
  render();updStats();
  if(path.length===freeCnt){
    var last=path[path.length-1],first=path[0];
    var closedOk=true;
    if(L.closed){
      var lr=Math.floor(last/cols),lc=last%cols,fr=Math.floor(first/cols),fc=first%cols;
      closedOk=false;
      for(var m=0;m<8;m++){
        if(lr+KNIGHT_MOVES[m][0]===fr&&lc+KNIGHT_MOVES[m][1]===fc)closedOk=true;
      }
    }
    if(closedOk){winLevel();return;}
  }
  if(!legalMoves().length){
    stuck=true;
    $("ovTitle").textContent="无路可走";
    $("ovDesc").textContent="走了 "+path.length+" / "+freeCnt+" 格。马步被堵死了，撤销几步换个走法。";
    setOvBtn("重开本关","rotate");
    $("ovUndo").hidden=false;
    $("overlay").classList.add("show");
  }
}
function undo(){
  if(path.length<=1||done)return;
  path.pop();stuck=false;
  hideOverlay();render();updStats();say("已撤销一步");
}
function hint(){
  if(done)return;
  var res=null;
  for(var t=0;t<8&&!res;t++)res=knightSolve(rows,cols,path.slice(),holeSet,!!L.closed,200000);
  if(!res){say(stuck?"当前局面已无法完成巡游，建议撤销":"内嵌求解器没找到路线，再走几步试试");return;}
  var next=res[path.length];
  var board=$("board").children;
  if(board[next]){
    board[next].classList.add("hintc");
    setTimeout(function(){if(board[next])board[next].classList.remove("hintc")},1600);
  }
  say("求解器建议走 "+(next+1)+" 格（ Warnsdorff 启发+回溯）");
}

  if(k>="1"&&k<="8"){
    var m=parseInt(k,10)-1;
    var legal=legalMoves();
    for(var i=0;i<legal.length;i++)if(legal[i].m===m){tryMove(legal[i].cell);break;}
    e.preventDefault();
  }
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
  else if(k===" "||k==="Enter"){if($("overlay").classList.contains("show"))$("ovBtn").click();e.preventDefault();}
});

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
/* 按钮图标注入（内联 SVG；文案与图标分节点，更新文案不抹图标） */

  $("btnHint").insertAdjacentHTML("afterbegin",window.SW_ICON("bulb"));
  $("btnReset").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
  $("btnLv").insertAdjacentHTML("afterbegin",window.SW_ICON("grid"));
  $("ovBtn").innerHTML=window.SW_ICON("play")+"下一关";
  $("ovUndo").insertAdjacentHTML("afterbegin",window.SW_ICON("undo"));
})();
</script>
