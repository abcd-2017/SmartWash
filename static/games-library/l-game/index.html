<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-on-primary:#FFFFFF;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-lg-board1:#F2D9A6;--g-lg-board2:#E0BE82;--g-lg-frame:#C9A468;--g-lg-coin:#E2A23B;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-lg-board1:#4A3D26;--g-lg-board2:#382D1B;--g-lg-frame:#2C2517;--g-lg-coin:#E8B45C;color-scheme:dark }

  .stage { position: relative; animation: fadein .3s ease-out both; }

  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn { min-height: 44px; padding: 0 10px; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: var(--g-radius-btn); background: var(--g-surface2); color: var(--g-text); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out; }

  .overlay { position: fixed; inset: 0; z-index: 10; background: var(--g-scrim); display: none; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .panel { width: 100%; max-width: 340px; padding: 22px 18px; background: var(--g-surface); border-radius: var(--g-radius); box-shadow: var(--g-shadow); text-align: center; animation: pop .3s ease-out; }
  .panel.win { animation: winpop .45s cubic-bezier(.18,.9,.3,1.4); }   /* 过关轻弹 */
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes winpop { 0% { transform: scale(.86); opacity: 0; } 62% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn { min-height: 44px; border: 0; border-radius: var(--g-radius-inner); background: var(--g-surface2); color: var(--g-text); font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer; transition: transform .14s ease-out, background .16s ease-out; }
  .lvbtn:active { transform: scale(.96); }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* S2: 动效降级——保留状态切换，同压 duration 与 delay */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

<script>

 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>','arrow-left':'<path d="M19 12H5M11 6l-6 6 6 6"/>',

})();

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="l-game",SAVE_KEY="sw.lgame.v1";
var DEFAULT_LEVELS=[{"name":"L博弈·01","depth":1,"rand":2,"first":1,"coins":[5,10]},{"name":"L博弈·02","depth":1,"rand":2,"first":1,"coins":[5,10]},{"name":"L博弈·03","depth":1,"rand":1,"first":1,"coins":[6,9]},{"name":"L博弈·04","depth":1,"rand":1,"first":0,"coins":[5,10]},{"name":"L博弈·05","depth":1,"rand":0,"first":1,"coins":[5,10]},{"name":"L博弈·06","depth":1,"rand":0,"first":0,"coins":[6,9]},{"name":"L博弈·07","depth":2,"rand":2,"first":1,"coins":[5,10]},{"name":"L博弈·08","depth":2,"rand":1,"first":1,"coins":[6,9]},{"name":"L博弈·09","depth":2,"rand":1,"first":0,"coins":[5,10]},{"name":"L博弈·10","depth":2,"rand":0,"first":1,"coins":[5,10]},{"name":"L博弈·11","depth":2,"rand":0,"first":0,"coins":[6,9]},{"name":"L博弈·12","depth":2,"rand":2,"first":1,"coins":[6,9]},{"name":"L博弈·13","depth":2,"rand":1,"first":1,"coins":[5,10]},{"name":"L博弈·14","depth":2,"rand":1,"first":0,"coins":[5,10]},{"name":"L博弈·15","depth":2,"rand":0,"first":1,"coins":[6,9]},{"name":"L博弈·16","depth":3,"rand":2,"first":1,"coins":[5,10]},{"name":"L博弈·17","depth":3,"rand":1,"first":1,"coins":[5,10]},{"name":"L博弈·18","depth":3,"rand":1,"first":0,"coins":[6,9]},{"name":"L博弈·19","depth":3,"rand":0,"first":1,"coins":[5,10]},{"name":"L博弈·20","depth":3,"rand":0,"first":0,"coins":[5,10]},{"name":"L博弈·21","depth":3,"rand":2,"first":1,"coins":[6,9]},{"name":"L博弈·22","depth":3,"rand":1,"first":1,"coins":[6,9]},{"name":"L博弈·23","depth":3,"rand":1,"first":0,"coins":[5,10]},{"name":"L博弈·24","depth":3,"rand":0,"first":1,"coins":[6,9]},{"name":"L博弈·25","depth":3,"rand":0,"first":0,"coins":[5,10]},{"name":"L博弈·26","depth":3,"rand":0,"first":1,"coins":[5,10]},{"name":"L博弈·27","depth":3,"rand":1,"first":1,"coins":[5,10]},{"name":"L博弈·28","depth":3,"rand":0,"first":0,"coins":[6,9]},{"name":"L博弈·29","depth":3,"rand":0,"first":1,"coins":[5,10]},{"name":"L博弈·30","depth":3,"rand":0,"first":1,"coins":[6,9]},{"name":"L博弈·31","depth":3,"rand":1,"first":0,"coins":[5,10]},{"name":"L博弈·32","depth":3,"rand":0,"first":1,"coins":[5,10]},{"name":"L博弈·33","depth":3,"rand":0,"first":0,"coins":[5,10]},{"name":"L博弈·34","depth":3,"rand":1,"first":1,"coins":[6,9]},{"name":"L博弈·35","depth":3,"rand":0,"first":1,"coins":[5,10]},{"name":"L博弈·36","depth":3,"rand":0,"first":0,"coins":[6,9]},{"name":"L博弈·37","depth":3,"rand":1,"first":1,"coins":[5,10]},{"name":"L博弈·38","depth":3,"rand":0,"first":0,"coins":[5,10]},{"name":"L博弈·39","depth":3,"rand":0,"first":1,"coins":[6,9]},{"name":"L博弈·40","depth":3,"rand":0,"first":0,"coins":[5,10]}];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.depth)||d.depth<1||d.depth>3)return false;
  if(!Number.isInteger(d.rand)||d.rand<0||d.rand>2)return false;
  if(d.first!==0&&d.first!==1)return false;
  if(!Array.isArray(d.coins)||d.coins.length!==2)return false;
  for(var i=0;i<2;i++){if(!Number.isInteger(d.coins[i])||d.coins[i]<0||d.coins[i]>15||d.coins[0]===d.coins[1])return false;}
  return true;
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    var ck=d.depth+"|"+d.rand+"|"+d.first+"|"+d.coins.join(",");
    if(seen[ck])return null;seen[ck]=1;
    list.push({name:String(d.name),depth:d.depth,rand:d.rand,first:d.first,coins:[d.coins[0],d.coins[1]]});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData))LEVELS=list;
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      loadLevel(lv);resize();
    }
  }).catch(function(){});
}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  setOvBtn("取消","x");
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show");$("panel").classList.remove("win")}

/* ---------- 规则引擎：4x4，g[i] 0空/1我绿/2AI蓝/3中子；8 种 L 摆向 ---------- */
var ORI=[
  [[0,0],[1,0],[2,0],[0,1]],
  [[0,1],[1,1],[2,1],[0,0]],
  [[0,0],[1,0],[2,0],[2,1]],
  [[0,1],[1,1],[2,1],[2,0]],
  [[0,0],[0,1],[0,2],[1,0]],
  [[1,0],[1,1],[1,2],[0,0]],
  [[0,0],[0,1],[0,2],[1,2]],
  [[1,0],[1,1],[1,2],[0,2]]
];
/* 全部理论摆位（去重后 48 个）：独立于对局状态，供锚点与枚举共用 */
var ALLPL=(function(){
  var seen={},list=[];
  for(var o=0;o<8;o++){
    var w=0,h=0,p;
    for(var t=0;t<4;t++){p=ORI[o][t];if(p[0]+1>w)w=p[0]+1;if(p[1]+1>h)h=p[1]+1;}
    for(var x=0;x<=4-w;x++)for(var y=0;y<=4-h;y++){
      var cells=[];
      for(var t2=0;t2<4;t2++){p=ORI[o][t2];cells.push((y+p[1])*4+(x+p[0]));}
      var key=cells.slice().sort(function(a,b){return a-b}).join(",");
      if(!seen[key]){seen[key]=1;list.push({cells:cells,key:key});}
    }
  }

  gf.addColorStop(0,colMix(PAL.frame,WHITE,.18));gf.addColorStop(.5,PAL.frame);gf.addColorStop(1,colMix(PAL.frame,BLACK,.3));
  ctx.fillStyle=gf;rr2(.5,.5,W-1,W-1,Math.min(12,W*.03));ctx.fill();ctx.restore();
  var gb=ctx.createLinearGradient(0,iy,0,iy+ih);gb.addColorStop(0,PAL.board1);gb.addColorStop(1,PAL.board2);
  ctx.fillStyle=gb;rr2(ix,iy,iw,ih,Math.min(10,W*.026));ctx.fill();
  var gl=ctx.createRadialGradient(W*.5,W*.08,W*.05,W*.5,W*.1,W*.8);
  gl.addColorStop(0,"rgba(255,255,255,.2)");gl.addColorStop(1,"rgba(255,255,255,0)");ctx.fillStyle=gl;ctx.fillRect(0,0,W,W);
  for(r=0;r<4;r++)for(c=0;c<4;c++){ctx.fillStyle=((r+c)%2==0)?ck1:ck2;ctx.fillRect(ix+c*cs+gap,iy+r*cs+gap,cs-2*gap,cs-2*gap)}
  ctx.strokeStyle=colMix(PAL.board2,BLACK,.34);ctx.lineWidth=1.2;ctx.beginPath();
  for(i=0;i<=4;i++){ctx.moveTo(ix+i*cs,iy);ctx.lineTo(ix+i*cs,iy+ih);ctx.moveTo(ix,iy+i*cs);ctx.lineTo(ix+iw,iy+i*cs)}
  ctx.stroke()}
/* 可落点 / 选中 / 目标 */
function drawGhosts(){var i,cs=geom().cs;if(side!==1)return;
  if(phase==1){
    if(hintM)drawPiece(hintM.cells,PAL.warning,{alpha:.32,ring:PAL.warning,dash:true,shadow:false});
    else for(i=0;i<legalPl.length;i++){var sel=(i===selIdx);
      drawPiece(legalPl[i].cells,PAL.deep,sel?{alpha:.95,ring:PAL.deep,scale:1.05}:{alpha:.2,ring:PAL.deep,dash:true,shadow:false})}
  }else if(phase==2){
    if(pend)drawPiece(pend.cells,PAL.deep,{alpha:.95,ring:PAL.deep,scale:1.05});
    if(hintM&&hintM.cf>=0){var a=cellRect(hintM.cf);
      ctx.strokeStyle=PAL.warning;ctx.lineWidth=Math.max(2,cs*.06);
      ctx.beginPath();ctx.arc(a[0]+a[2]/2,a[1]+a[3]/2,Math.max(3,cs*.11),0,Math.PI*2);ctx.stroke()}
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=Math.max(1.5,cs*.045);
    for(i=0;i<16;i++)if(g[i]===0){var r0=cellRect(i);ctx.globalAlpha=.6;
      ctx.beginPath();ctx.arc(r0[0]+r0[2]/2,r0[1]+r0[3]/2,Math.max(3,cs*.1),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}}}
function drawEntities(){var i,cs=geom().cs,me=[],ai=[];
  for(i=0;i<16;i++){if(g[i]===1)me.push(i);else if(g[i]===2)ai.push(i)}
  var sm=1,dm=0,sa=1,da=0;
  if(fxDrop){var p=Math.min(1,(performance.now()-fxDrop.t0)/240),e=easeOutBack(p),dy=-(1-p)*cs*.16;
    if(fxDrop.who===1){sm=e;dm=dy}else{sa=e;da=dy}}
  drawPiece(ai,PAL.water,{scale:sa,dy:da});drawPiece(me,PAL.deep,{scale:sm,dy:dm});
  for(i=0;i<16;i++)if(g[i]===3){var r0=cellRect(i);
    drawCoin(r0[0]+r0[2]/2,r0[1]+r0[3]/2,cs*.19,{ring:pickCoin===i?PAL.warning:null})}}
/* 轻弹动画（reduced-motion 跳过） */
var fxDrop=null,fxRunning=false;
function easeOutBack(p){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)}
function fxStart(){if(window.__gRM||fxRunning)return;fxRunning=true;requestAnimationFrame(fxFrame)}
function fxFrame(now){var active=false;
  if(fxDrop){if((now-fxDrop.t0)/240>=1)fxDrop=null;else active=true}
  draw();if(active)requestAnimationFrame(fxFrame);else{fxRunning=false;draw()}}
function draw(){if(!g||!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,W);drawBoard();drawGhosts();drawEntities()}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  var G=geom(),c=Math.floor((x-G.ix)/G.cs),r=Math.floor((y-G.iy)/G.cs);
  if(r<0||r>3||c<0||c>3)return;   // 点在外框木面不算落子
  tapCell(r*4+c);
});
cv.addEventListener("pointercancel",function(){});
$("btnPrev").addEventListener("click",function(){
  if(phase===1&&legalPl.length){selIdx=(selIdx-1+legalPl.length)%legalPl.length;draw();}
});
$("btnNext").addEventListener("click",function(){
  if(phase===1&&legalPl.length){selIdx=(selIdx+1)%legalPl.length;draw();}
});
$("btnAct").addEventListener("click",function(){
  if(over||side!==1)return;
  if(phase===0)startMove();
  else if(phase===1)confirmPlacement();
  else if(phase===2)skipCoin();
});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本局已重置")});
$("btnLv").addEventListener("click",function(){if(!over)openLevelSelect();});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(over){if(won&&lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0);}else loadLevel(won?lv+1:lv);}
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"||k==="ArrowUp"){
    if(phase===1&&legalPl.length){selIdx=(selIdx-1+legalPl.length)%legalPl.length;draw();}
    e.preventDefault();
  }
  else if(k==="ArrowRight"||k==="ArrowDown"){
    if(phase===1&&legalPl.length){selIdx=(selIdx+1)%legalPl.length;draw();}
    e.preventDefault();
  }
  else if(k===" "||k==="Enter"){
    if($("overlay").classList.contains("show")){$("ovBtn").click();}
    else if(phase===0)startMove();
    else if(phase===1)confirmPlacement();
    else if(phase===2)skipCoin();
    e.preventDefault();
  }
  else if(k==="Escape"){
    if(phase>0){phase=0;pend=null;pickCoin=-1;selIdx=-1;legalPl=[];updStats();draw();}
  }
  else if(k==="u"||k==="U")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本局已重置")}
});
window.addEventListener("resize",resize);
/* ---------- 切后台：AI 思考作废，轮次归还玩家（纯事件重绘，无 rAF/计时器） ---------- */
document.addEventListener("visibilitychange",function(){
  if(document.hidden){cancelAI();if(side===2&&!over){side=1;say("已切后台，电脑让先，请行动");updStats();}}
  else draw();
});
/* ---------- 内嵌独立验证器（锚点用例 + 规则矩阵 + AI 对拍） ---------- */
function selfTest(){
  var total=0,ok=0,fails=[];
  function chk(c,name){total++;if(c)ok++;else fails.push(name);}
  chk(DEFAULT_LEVELS.length===40,"关卡数=40");
  chk(DEFAULT_LEVELS.every(validLevelData),"关卡配置合法");
  /* 锚点①：空盘理论摆位 48（8 摆向 × 6 位置，去重后手算） */
  chk(ALLPL.length===48,"锚点:空盘摆位48");
  /* 锚点②：经典开局玩家 5 摆位（含镜像手，独立枚举器核对；允许与自身旧位重叠换位） */
  (function(){
    var e=new Int8Array(16);
    e[12]=1;e[13]=1;e[14]=1;e[8]=1;e[3]=2;e[6]=2;e[7]=2;e[11]=2;e[5]=3;e[10]=3;
    var p=placementsFor(e,1);
    chk(p.length===5,"锚点:开局摆位=5");
    chk(p.some(function(x){return x.key==="0,1,2,4"}),"锚点:镜像L在合法摆位中");
    var ms=genMoves(e,1);
    chk(ms.length===65,"锚点:开局全走法=65（5摆位×(1+2中子×空格)，独立枚举器核对）");
  })();
  /* 锚点③：挤满局面仍有 4 摆位（自身重叠换位规则，独立枚举器核对） */
  (function(){
    var e=new Int8Array(16);
    e[0]=1;e[1]=1;e[2]=1;e[4]=1;
    e[15]=2;e[14]=2;e[13]=2;e[11]=2;
    e[5]=3;e[10]=3;
    chk(placementsFor(e,1).length===4,"锚点:挤满局面4摆位");
    chk(genMoves(e,1).length===52,"锚点:挤满局面全走法52");
  })();
  /* 锚点④：局面3 双方各 4 摆位（独立枚举器核对） */
  (function(){
    var e=new Int8Array(16);
    e[12]=1;e[13]=1;e[14]=1;e[8]=1;
    e[0]=2;e[1]=2;e[2]=2;e[4]=2;
    e[5]=3;e[10]=3;
    chk(placementsFor(e,1).length===4,"锚点:局面3玩家4摆位");
    chk(placementsFor(e,2).length===4,"锚点:局面3电脑4摆位");
  })();
  /* 中子移动语义：cf/ct 生效且 L 不动 */
  (function(){
    var e=new Int8Array(16);
    e[12]=1;e[13]=1;e[14]=1;e[8]=1;e[3]=2;e[6]=2;e[7]=2;e[11]=2;e[5]=3;e[10]=3;
    var m={cells:[0,1,2,4],key:"0,1,2,4",cf:5,ct:15};
    applyMove(e,m,1);
    chk(e[5]===0&&e[15]===3,"锚点:中子搬运生效");
    chk(e[0]===1&&e[4]===1&&e[8]===0&&e[12]===0,"锚点:L换位生效");
    chk(e[3]===2&&e[7]===2,"锚点:对方L不受影响");
  })();
  /* AI 对拍 4 局：合法推进、子数守恒（4+4+2）、必有终局 */
  var gi;
  for(gi=0;gi<4;gi++)chk(aiGame(),"AI 对拍 局"+(gi+1));
  window.__gSelfTest={ok:ok,total:total,fails:fails};
  if(fails.length)say("警告：内嵌自检未全过（"+ok+"/"+total+"）");
}
function aiGame(){
  var keepG=g,keepSide=side;
  g=new Int8Array(16);
  g[12]=1;g[13]=1;g[14]=1;g[8]=1;g[3]=2;g[6]=2;g[7]=2;g[11]=2;g[5]=3;g[10]=3;
  var s=1,ply=0,res=null;
  while(ply<120){
    var r=aiBestMove(s,1,ply%3===0?1:0);
    if(!r){res=true;break;}
    applyMove(g,r.m,s);ply++;
    if(placementsFor(g,3-s).length===0){res=true;break;}
    if(ply>=DRAWPLY){res=true;break;}
    s=3-s;
  }
  g=keepG;side=keepSide;
  return res!==null;
}
/* ---------- 启动（续玩：从存档关卡起步） ---------- */
palLoad();updLegend();loadLevel(save.lv);selfTest();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){if(el.dataset.foc)return;el.dataset.foc="1";if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus()}
  function restore(el){if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null}}
  function trap(el,e){if(e.key!=="Tab")return;var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;var a=f[0],b=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){b.focus();e.preventDefault()}
    else if(!e.shiftKey&&document.activeElement===b){a.focus();e.preventDefault()}}
  function watch(el){try{new MutationObserver(function(){if(shown(el))focusFirst(el);else restore(el)})
    .observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)})}
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i])}
})();
</script>

/* 工具钮图标注入（内联 SVG，零外链；文案走 .btxt 文本节点，更新文案不抹图标） */

  ic("btnPrev","arrow-left");ic("btnAct","play");ic("btnNext","arrow-right");ic("btnUndo","undo");ic("btnHint","bulb");ic("btnReset","rotate");ic("btnLv","grid")})();
</script>
