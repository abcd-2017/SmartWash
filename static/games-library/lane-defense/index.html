window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var LD={COLS:6,ROWS:3,CELL_W:60,CELL_H:64,OX:16,OY:110,PEA_V:230,
  PLANTS:[
    {name:"向日葵",cost:50,hp:100,sunEvery:4.5,sunAmt:25},
    {name:"豌豆",cost:100,hp:120,shootEvery:1.3,dmg:28},
    {name:"坚果",cost:50,hp:420},
    {name:"三连",cost:200,hp:120,shootEvery:1.3,dmg:25,shots:3}
  ],
  ZKINDS:[{hp:55,spd:12,r:14},{hp:42,spd:22,r:12},{hp:178,spd:8,r:17}]};
/* 关卡生成：波数 2→6、每波 4→14 只、快慢种解锁、全局血 / 速乘子递增 */
LD.LEVEL_COUNT=40;
LD.genLevel=function(no){
  var rng=mulberry32(66000+no*1789);
  var wc=2+Math.floor(no/9);
  var waves=[];
  for(var w=0;w<wc;w++){
    var n=4+Math.floor(no*0.25);
    var kind=0;
    if(no>6&&rng()<0.35)kind=1;
    if(no>12&&rng()<0.4)kind=2;
    waves.push({n:n,kind:kind,
      gap:Math.max(2.6,3.6-no*0.025),
      delay:Math.max(2.5,7-no*0.09)});
  }
  return {name:"第"+no+"关 · 菜园保卫",no:no,sun0:300,
    hpm:Math.round((1+no*0.008)*100)/100,spdm:Math.round((1+no*0.005)*100)/100,
    waves:waves,seed:44000+no*131};
};
/* 出怪时间表（确定性）：波间 delay，波内 gap 逐只排布，车道由种子决定 */
LD.events=function(level){
  var rng=mulberry32(level.seed||1);
  var events=[],t=0;
  var no=level.no||Math.max(1,Math.round((level.hpm-1)/0.008));
  for(var w=0;w<level.waves.length;w++){
    var wv=level.waves[w];
    t+=wv.delay;
    for(var i=0;i<wv.n;i++){
      t+=wv.gap;
      var lane=(rng()*LD.ROWS)|0;
      var kind=wv.kind;
      if(no>6){
        var r2=rng();
        var pT=Math.min(0.32,0.08+no*0.006),pF=Math.min(0.30,0.04+no*0.006);
        if(r2<pT)kind=2;
        else if(r2<pT+pF)kind=1;
      }
      events.push({t:t,lane:lane,kind:kind});
    }
  }
  return events;
};
LD.validate=function(level){
  if(!level||typeof level!=="object")return{ok:false,why:"bad"};
  if(!Array.isArray(level.waves)||level.waves.length<1||level.waves.length>10)return{ok:false,why:"waves"};
  for(var i=0;i<level.waves.length;i++){
    var w=level.waves[i];
    if(!w||typeof w!=="object")return{ok:false,why:"wave"+i};
    if(!isFinite(w.n)||w.n<1||w.n>30||w.n!==(w.n|0))return{ok:false,why:"n"+i};
    if(!isFinite(w.kind)||w.kind<0||w.kind>2||w.kind!==(w.kind|0))return{ok:false,why:"kind"+i};
    if(!isFinite(w.gap)||w.gap<0.8||w.gap>12)return{ok:false,why:"gap"+i};
    if(!isFinite(w.delay)||w.delay<1||w.delay>20)return{ok:false,why:"delay"+i};
  }
  if(!isFinite(level.hpm)||level.hpm<0.5||level.hpm>3)return{ok:false,why:"hpm"};
  if(!isFinite(level.spdm)||level.spdm<0.5||level.spdm>3)return{ok:false,why:"spdm"};
  if(!isFinite(level.sun0)||level.sun0<0||level.sun0>1000)return{ok:false,why:"sun0"};
  return{ok:true,why:""};
};
LD.createRun=function(level){
  return {level:level,rng:mulberry32(level.seed||1),t:0,sun:level.sun0,
    plants:[],zombies:[],peas:[],suns:[],skyT:3,lives:3,
    events:LD.events(level),evIdx:0,status:"run",spawned:0,
    buildQ:[]};
};
function ldPlantAt(run,col,row,type){
  if(col<0||col>=LD.COLS||row<0||row>=LD.ROWS)return false;
  for(var i=0;i<run.plants.length;i++){
    if(run.plants[i].col===col&&run.plants[i].row===row)return false;
  }
  var def=LD.PLANTS[type];
  run.plants.push({type:type,col:col,row:row,hp:def.hp,shootT:0.4,sunT:def.sunEvery||0});
  return true;
}
LD.plant=function(run,type,col,row){
  var def=LD.PLANTS[type];
  if(run.sun<def.cost)return false;
  if(!ldPlantAt(run,col,row,type))return false;
  run.sun-=def.cost;
  return true;
};
LD.removePlant=function(run,col,row){
  for(var i=0;i<run.plants.length;i++){
    if(run.plants[i].col===col&&run.plants[i].row===row){run.plants.splice(i,1);return true;}
  }
  return false;
};
/* 单步：天降阳光 / 出怪 / 车道推进 / 进食 / 射豌豆 / 结算（gameplay 与验证共用） */
LD.step=function(run,dt,autoCollectDelay){
  if(run.status!=="run")return run.status;
  run.t+=dt;
  var L=run.level;
  // 出怪
  while(run.evIdx<run.events.length&&run.events[run.evIdx].t<=run.t){
    var ev=run.events[run.evIdx++];
    var zk=LD.ZKINDS[ev.kind];
    run.zombies.push({x:LD.OX+LD.COLS*LD.CELL_W+24,row:ev.lane,kind:ev.kind,
      hp:zk.hp*L.hpm,maxhp:zk.hp*L.hpm,spd:zk.spd*L.spdm,r:zk.r,eat:0});
    run.spawned++;
  }
  // 天降阳光
  run.skyT-=dt;
  if(run.skyT<=0){
    run.skyT=5.5;
    run.suns.push({x:40+run.rng()*(LD.OX+LD.COLS*LD.CELL_W-60),y:LD.OY-40,vy:34,age:0});
  }
  for(var s=run.suns.length-1;s>=0;s--){
    var sn=run.suns[s];
    sn.age+=dt;
    if(sn.y<340)sn.y+=sn.vy*dt;
    if(autoCollectDelay!=null&&sn.age>=autoCollectDelay){run.sun+=25;run.suns.splice(s,1);}
    else if(sn.age>9)run.suns.splice(s,1);   // 过期消散
  }
  // 豌豆飞行
  for(var p=run.peas.length-1;p>=0;p--){
    var pe=run.peas[p];
    pe.x+=LD.PEA_V*dt;
    if(pe.x>LD.OX+LD.COLS*LD.CELL_W+30){run.peas.splice(p,1);continue;}
    for(var z2=run.zombies.length-1;z2>=0;z2--){
      var zz=run.zombies[z2];
      if(zz.row===pe.row&&Math.abs(zz.x-pe.x)<zz.r){
        zz.hp-=pe.dmg;
        run.peas.splice(p,1);
        if(zz.hp<=0){run.sun+=14;run.zombies.splice(z2,1);}
        break;
      }
    }
  }
  // 植物行为
  for(var i=run.plants.length-1;i>=0;i--){
    var pl=run.plants[i];
    var def=LD.PLANTS[pl.type];
    var px=LD.OX+pl.col*LD.CELL_W+LD.CELL_W/2,py=LD.OY+pl.row*LD.CELL_H+LD.CELL_H/2;
    if(def.sunEvery){
      pl.sunT-=dt;
      if(pl.sunT<=0){pl.sunT=def.sunEvery;run.sun+=def.sunAmt;}
    }
    if(def.shootEvery){
      var hasTarget=false;
      for(var k=0;k<run.zombies.length;k++)if(run.zombies[k].row===pl.row&&run.zombies[k].x>px-6){hasTarget=true;break;}
      if(hasTarget){
        pl.shootT-=dt;
        if(pl.shootT<=0){
          pl.shootT=def.shootEvery;
          run.peas.push({x:px+12,y:py,row:pl.row,dmg:def.dmg});
          if(def.shots>=2)run.peas.push({x:px-2,y:py,row:pl.row,dmg:def.dmg});
        }
      }
    }
    if(pl.hp<=0){
      run.plants.splice(i,1);
      run.buildQ.push({type:pl.type,col:pl.col,row:pl.row});   // 重建队列
    }
  }
  // 僵尸推进 / 进食
  for(var z=run.zombies.length-1;z>=0;z--){
    var zv=run.zombies[z];
    var front=zv.x-zv.r;
    var col=Math.floor((front-LD.OX)/LD.CELL_W);
    var eating=null;
    if(col>=0&&col<LD.COLS){
      for(var m=0;m<run.plants.length;m++){
        var tp=run.plants[m];
        if(tp.row===zv.row&&tp.col===col){eating=tp;break;}
      }
    }
    if(eating){
      eating.hp-=30*dt;
    }else{
      zv.x-=zv.spd*dt;
    }
    if(zv.x<LD.OX-8){
      run.zombies.splice(z,1);
      run.lives--;
      if(run.lives<=0){run.status="fail";return "fail";}
    }
  }
  if(run.evIdx>=run.events.length&&run.zombies.length===0){run.status="win";return "win";}
  return "run";
};
/* 验证：贪心布防策略（向日葵 → 豌豆 → 坚果 → 双发，被吃即重建）+ 阳光延迟 1s 收取 */
LD.BUILD_Q=[[0,0,0],[0,0,1],[0,0,2],[1,2,0],[1,2,1],[1,2,2],
  [2,5,0],[2,5,1],[2,5,2],[3,3,0],[3,3,1],[3,3,2],
  [0,1,0],[0,1,1],[0,1,2],[1,4,0],[1,4,1],[1,4,2]];
LD.policySim=function(level){
  var run=LD.createRun(level);
  run.buildQ=LD.BUILD_Q.map(function(q){return {type:q[0],col:q[1],row:q[2]};});
  var guard=9000;   // 450s@0.05 上限
  while(guard-->0&&run.status==="run"){
    // 建造：队列头可负担即种（占据则跳过）
    for(var qi=0;qi<run.buildQ.length;qi++){
      var it=run.buildQ[qi];
      var def=LD.PLANTS[it.type];
      var occupied=false;
      for(var i=0;i<run.plants.length;i++)if(run.plants[i].col===it.col&&run.plants[i].row===it.row){occupied=true;break;}
      if(occupied){run.buildQ.splice(qi,1);qi--;continue;}
      if(run.sun>=def.cost){if(LD.plant(run,it.type,it.col,it.row))run.buildQ.splice(qi,1);break;}
    }
    LD.step(run,0.05,1.0);
  }
  return {status:run.status,lives:run.lives,t:run.t,spawned:run.spawned};
};
LD.validateAll=function(){
  var fails=[],lifeSum=0,i;
  for(i=1;i<=LD.LEVEL_COUNT;i++){
    var L=LD.genLevel(i);
    var chk=LD.validate(L);
    if(!chk.ok){fails.push(i+"("+chk.why+")");continue;}
    var r=LD.policySim(L);
    lifeSum+=r.lives;
    if(r.status!=="win"||r.lives<1)fails.push(i+"("+r.status+",lives"+r.lives+")");
  }
  return {total:LD.LEVEL_COUNT,solvable:LD.LEVEL_COUNT-fails.length,fail:fails,
    avgLives:Math.round(lifeSum/LD.LEVEL_COUNT*100)/100};
};

/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}

var AC=null;
function beep(f,d,type,vol){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=f;g.gain.value=vol||0.05;
    o.connect(g);g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(d||0.1));
    o.start();o.stop(AC.currentTime+(d||0.1)+0.02);
  }catch(e){}
}

function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=LD.LEVEL_COUNT;i++)list.push(LD.genLevel(i));
  return list;
}
function parseLaneLevels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={},i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    var d;
    try{d=JSON.parse(item.dataJson)}catch(e){return null}
    if(!LD.validate(d).ok)return null;
    if(LD.policySim(d).status!=="win")return null;   // 下发关卡必须可守
    var no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=true;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){

    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;}
  }catch(e){}
  return 0;
}

function rr(x,y,w,h,r){

function drawPlant(pl){
  var x=LD.OX+pl.col*LD.CELL_W+LD.CELL_W/2,y=LD.OY+pl.row*LD.CELL_H+LD.CELL_H/2;

  ctx.shadowColor="rgba(0,0,0,0.28)";ctx.shadowBlur=8;ctx.shadowOffsetY=4;   // 恒黑落地投影

    for(var i=0;i<8;i++){
      var an=i*Math.PI/4,px=x+Math.cos(an)*10,py=y+Math.sin(an)*10;
      var pg=ctx.createRadialGradient(px-1.5,py-1.5,1,px,py,6);
      pg.addColorStop(0,colMix(PAL.warning,WHITE,0.45));pg.addColorStop(1,PAL.warning);

    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(x,y,8.5,0,6.3);ctx.fill();
    ctx.restore();
    ctx.fillStyle=WHITE;ctx.beginPath();ctx.arc(x-3,y-3,2,0,6.3);ctx.fill();   // 恒白高光
  }else if(pl.type===1||pl.type===3){
    // 豌豆 / 三连：茎 + 径向渐变头 + 瞳 + 恒白高光
    ctx.strokeStyle=colShade(PAL.primary,-0.2);ctx.lineWidth=4;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(x-4,y+16);ctx.quadraticCurveTo(x-2,y+6,x,y);ctx.stroke();
    var heads=pl.type===3?[[x,y-4,10],[x-11,y-2,7]]:[[x,y-4,10]];
    for(var h=0;h<heads.length;h++){
      var hx=heads[h][0],hy=heads[h][1],hr=heads[h][2];
      var hg=ctx.createRadialGradient(hx-3,hy-3,1,hx,hy,hr+1);
      hg.addColorStop(0,PAL.plantHi);hg.addColorStop(0.6,PAL.primary);hg.addColorStop(1,colShade(PAL.primary,-0.35));
      ctx.fillStyle=hg;ctx.beginPath();ctx.arc(hx,hy,hr,0,6.3);ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle=colShade(PAL.deep,-0.4);ctx.beginPath();ctx.arc(x-6,y-8,3,0,6.3);ctx.fill();
    ctx.fillStyle=WHITE;ctx.beginPath();ctx.arc(x-3,y-9,2.2,0,6.3);ctx.fill();   // 恒白高光
  }else{
    // 坚果：土壤渐变体 + 顶光 + 深描边
    var ng=ctx.createRadialGradient(x-4,y-4,2,x,y+2,17);
    ng.addColorStop(0,colMix(PAL.soil,WHITE,0.35));ng.addColorStop(1,colShade(PAL.soil,-0.3));
    ctx.fillStyle=ng;ctx.beginPath();ctx.ellipse(x,y+2,13,16,0,0,6.3);ctx.fill();
    ctx.strokeStyle=colShade(PAL.soil,-0.4);ctx.lineWidth=1.6;ctx.stroke();
    ctx.restore();
    ctx.fillStyle=WHITE;ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(x-4,y-6,3,0,6.3);ctx.fill();ctx.globalAlpha=1;   // 恒白高光
  }
  if(pl.hp<LD.PLANTS[pl.type].hp){
    ctx.fillStyle="rgba(0,0,0,0.18)";ctx.fillRect(x-12,y-24,24,3.5);   // 恒暗轨道
    ctx.fillStyle=PAL.success;ctx.fillRect(x-12,y-24,24*Math.max(0,pl.hp/LD.PLANTS[pl.type].hp),3.5);
  }
}
function drawZombie(z){
  var body=z.kind===2?PAL.danger:(z.kind===1?PAL.warning:PAL.zbody);
  var hi=z.kind===2?colMix(PAL.danger,WHITE,0.35):(z.kind===1?colMix(PAL.warning,WHITE,0.35):PAL.zombieHi);
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.3)";ctx.shadowBlur=8;ctx.shadowOffsetY=4;   // 恒黑落地投影
  var g=ctx.createLinearGradient(0,z.y-16,0,z.y+10);
  g.addColorStop(0,hi);g.addColorStop(0.55,body);g.addColorStop(1,colShade(body,-0.32));
  ctx.fillStyle=g;rr(z.x-9,z.y-16,18,26,8);ctx.fill();
  ctx.restore();
  ctx.lineWidth=1.6;ctx.strokeStyle=colShade(body,-0.45);rr(z.x-9,z.y-16,18,26,8);ctx.stroke();
  // 手臂
  ctx.strokeStyle=colShade(body,-0.25);ctx.lineWidth=3;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(z.x-9,z.y-2);ctx.lineTo(z.x-15,z.y+2);ctx.stroke();
  // 眼（恒白底 + 墨瞳）
  ctx.fillStyle=WHITE;ctx.beginPath();ctx.arc(z.x-3,z.y-10,3,0,6.3);ctx.arc(z.x+5,z.y-10,3,0,6.3);ctx.fill();
  ctx.fillStyle=PAL.text;ctx.beginPath();ctx.arc(z.x-3,z.y-10,1.4,0,6.3);ctx.arc(z.x+5,z.y-10,1.4,0,6.3);ctx.fill();
  if(z.hp<z.maxhp){
    ctx.fillStyle="rgba(0,0,0,0.18)";ctx.fillRect(z.x-11,z.y-24,22,3.5);   // 恒暗轨道
    ctx.fillStyle=PAL.danger;ctx.fillRect(z.x-11,z.y-24,22*Math.max(0,z.hp/z.maxhp),3.5);
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(offX,offY);ctx.scale(S,S);
  // 菜地托盘「面」：圆角底 + 落地投影
  ctx.fillStyle=PAL.surface2;
  rr(LD.OX-6,LD.OY-6,LD.COLS*LD.CELL_W+12,LD.ROWS*LD.CELL_H+12,10);ctx.fill();
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.20)";ctx.shadowBlur=14;ctx.shadowOffsetY=6;   // 恒黑落地投影
  ctx.strokeStyle=PAL.border;ctx.lineWidth=2;
  rr(LD.OX-6,LD.OY-6,LD.COLS*LD.CELL_W+12,LD.ROWS*LD.CELL_H+12,10);ctx.stroke();
  ctx.restore();
  // 地面「面」:渐变 + 棋盘格 + 顶光
  ctx.fillStyle=grads;ctx.fillRect(LD.OX,LD.OY,LD.COLS*LD.CELL_W,LD.ROWS*LD.CELL_H);
  ctx.fillStyle=PAL.lawn2;
  for(var r=0;r<LD.ROWS;r++)for(var c=0;c<LD.COLS;c++)if((r+c)%2===1)ctx.fillRect(LD.OX+c*LD.CELL_W,LD.OY+r*LD.CELL_H,LD.CELL_W,LD.CELL_H);
  ctx.fillStyle=lawnTop;ctx.fillRect(LD.OX,LD.OY,LD.COLS*LD.CELL_W,LD.ROWS*LD.CELL_H);
  // 车道沟槽（边线「面」）
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  for(var r2=1;r2<LD.ROWS;r2++){ctx.beginPath();ctx.moveTo(LD.OX,LD.OY+r2*LD.CELL_H);ctx.lineTo(LD.OX+LD.COLS*LD.CELL_W,LD.OY+r2*LD.CELL_H);ctx.stroke();}
  ctx.strokeStyle=PAL.border;ctx.lineWidth=2;ctx.strokeRect(LD.OX+1,LD.OY+1,LD.COLS*LD.CELL_W-2,LD.ROWS*LD.CELL_H-2);
  // 家园（目标）：左侧旗 + 旗杆
  ctx.fillStyle=PAL.deep;ctx.fillRect(LD.OX-10,LD.OY,6,LD.ROWS*LD.CELL_H);
  ctx.strokeStyle=PAL.success;ctx.lineWidth=2.4;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(LD.OX-7,LD.OY+6);ctx.lineTo(LD.OX-7,LD.OY-16);ctx.stroke();
  ctx.fillStyle=PAL.success;
  ctx.beginPath();ctx.moveTo(LD.OX-7,LD.OY-16);ctx.lineTo(LD.OX+6,LD.OY-12);ctx.lineTo(LD.OX-7,LD.OY-8);ctx.closePath();ctx.fill();
  // 可落点：选中卡后面空槽位轻染软底，光标格描边
  if(state==="running"&&selCard>=0&&selCard<4){
    ctx.fillStyle=PAL.soft;ctx.globalAlpha=.55;
    for(var r3=0;r3<LD.ROWS;r3++)for(var c3=0;c3<LD.COLS;c3++)if(!LDOccupied(c3,r3))ctx.fillRect(LD.OX+c3*LD.CELL_W+3,LD.OY+r3*LD.CELL_H+3,LD.CELL_W-6,LD.CELL_H-6);
    ctx.globalAlpha=1;
  }
  if(selCard>=0&&state==="running"){
    var cx=LD.OX+cursor.col*LD.CELL_W,cy=LD.OY+cursor.row*LD.CELL_H;
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.25)";ctx.shadowBlur=6;ctx.shadowOffsetY=2;   // 恒黑投影
    ctx.strokeStyle=selCard===4?PAL.danger:PAL.primary;ctx.lineWidth=3;
    rr(cx+2,cy+2,LD.CELL_W-4,LD.CELL_H-4,8);ctx.stroke();
    ctx.restore();
    ctx.strokeStyle=WHITE;ctx.lineWidth=1.2;rr(cx+4.5,cy+4.5,LD.CELL_W-9,LD.CELL_H-9,6);ctx.stroke();   // 恒白衬底
  }
  if(G){
    for(var i=0;i<G.plants.length;i++)drawPlant(G.plants[i]);
    // 豌豆：径向渐变弹体 + 恒白高光
    for(var p=0;p<G.peas.length;p++){
      var px2=G.peas[p].x,py2=G.peas[p].y;
      ctx.save();ctx.shadowColor="rgba(0,0,0,0.3)";ctx.shadowBlur=5;ctx.shadowOffsetY=2;
      var pgb=ctx.createRadialGradient(px2-1.5,py2-1.5,0.5,px2,py2,6);
      pgb.addColorStop(0,PAL.pea);pgb.addColorStop(1,colShade(PAL.primary,-0.3));
      ctx.fillStyle=pgb;ctx.beginPath();ctx.arc(px2,py2,5,0,6.3);ctx.fill();ctx.restore();
      ctx.fillStyle=WHITE;ctx.beginPath();ctx.arc(px2-1.5,py2-1.5,1.4,0,6.3);ctx.fill();
    }
    for(var z=0;z<G.zombies.length;z++)drawZombie(G.zombies[z]);
    // 阳光：径向渐变球 + 光芒 + 恒白高光
    for(var s2=0;s2<G.suns.length;s2++){
      var sn=G.suns[s2];
      ctx.save();ctx.shadowColor="rgba(0,0,0,0.25)";ctx.shadowBlur=6;ctx.shadowOffsetY=3;
      var sg=ctx.createRadialGradient(sn.x-3,sn.y-3,1,sn.x,sn.y,12);
      sg.addColorStop(0,colMix(PAL.sun,WHITE,0.5));sg.addColorStop(1,PAL.sun);
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sn.x,sn.y,11,0,6.3);ctx.fill();ctx.restore();
      ctx.strokeStyle=colMix(PAL.sun,WHITE,0.3);ctx.lineWidth=1.6;ctx.lineCap="round";
      for(var k=0;k<8;k++){var a2=k*Math.PI/4;ctx.beginPath();ctx.moveTo(sn.x+Math.cos(a2)*13,sn.y+Math.sin(a2)*13);ctx.lineTo(sn.x+Math.cos(a2)*17,sn.y+Math.sin(a2)*17);ctx.stroke();}
      ctx.fillStyle=WHITE;ctx.beginPath();ctx.arc(sn.x-3,sn.y-3,2.2,0,6.3);ctx.fill();
    }
    syncHud();
  }
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

/* ========== 输入：选卡 → 点格布防 / 铲除，点阳光收取 ========== */
function toNominal(ev){
  var r=cv.getBoundingClientRect();
  return{x:(ev.clientX-r.left-offX)/S,y:(ev.clientY-r.top-offY)/S};
}
function cellAt(x,y){
  var col=Math.floor((x-LD.OX)/LD.CELL_W),row=Math.floor((y-LD.OY)/LD.CELL_H);
  if(col<0||col>=LD.COLS||row<0||row>=LD.ROWS)return null;
  return{col:col,row:row};
}
cv.addEventListener("pointerdown",function(ev){
  if(state!=="running")return;
  var p=toNominal(ev);
  // 阳光优先
  for(var i=G.suns.length-1;i>=0;i--){
    var sn=G.suns[i];
    var dx=p.x-sn.x,dy=p.y-sn.y;
    if(dx*dx+dy*dy<20*20){G.sun+=25;G.suns.splice(i,1);beep(700,0.07,"triangle",0.04);return;}
  }
  var cell=cellAt(p.x,p.y);
  if(!cell)return;
  cursor=cell;
  if(selCard>=0&&selCard<4){
    var def=LD.PLANTS[selCard];
    if(G.sun>=def.cost&&LD.plant(G,selCard,cell.col,cell.row)){
      beep(520,0.07,"triangle",0.04);
      selCard=-1;
    }else say(G.sun<def.cost?"阳光不足":"这格已有植物");
  }else if(selCard===4){
    if(LD.removePlant(G,cell.col,cell.row)){beep(300,0.08,"square",0.04);selCard=-1;}
  }
  ev.preventDefault();
});
function selectCard(i){
  if(state!=="running")return;
  selCard=selCard===i?-1:i;
  for(var c=0;c<5;c++)ui.cardBtns[c].classList.toggle("sel",selCard===c);
}
for(var cb=0;cb<4;cb++){
  (function(idx){
    ui.cardBtns[idx].addEventListener("click",function(){selectCard(idx);});
  })(cb);
}
ui.cardBtns[4].addEventListener("click",function(){selectCard(4);});

window.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="1")selectCard(0);
  else if(k==="2")selectCard(1);
  else if(k==="3")selectCard(2);
  else if(k==="4")selectCard(3);
  else if(k==="x")selectCard(4);
  else if(k==="ArrowLeft"&&cursor.col>0){e.preventDefault();cursor.col--;}
  else if(k==="ArrowRight"&&cursor.col<LD.COLS-1){e.preventDefault();cursor.col++;}
  else if(k==="ArrowUp"&&cursor.row>0){e.preventDefault();cursor.row--;}
  else if(k==="ArrowDown"&&cursor.row<LD.ROWS-1){e.preventDefault();cursor.row++;}
  else if(k==="Enter"||k===" "){
    e.preventDefault();
    if(selCard>=0&&selCard<4){
      var def=LD.PLANTS[selCard];
      if(G.sun>=def.cost&&LD.plant(G,selCard,cursor.col,cursor.row)){beep(520,0.07,"triangle",0.04);selCard=-1;}
      else say(G.sun<def.cost?"阳光不足":"这格已有植物");
    }else if(selCard===4){
      if(LD.removePlant(G,cursor.col,cursor.row)){beep(300,0.08,"square",0.04);selCard=-1;}
    }
  }
});

document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running"){say("已暂停 · 切回继续防守");}
});

/* ========== 主循环与启动 ========== */
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));
  H=Math.max(300,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);
  offX=(W-NW*S)/2;offY=(H-NH*S)/2;
}
window.addEventListener("resize",resize);
var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.033,(ts-last)/1000||0);
  last=ts;
  if(state==="running"&&G)step(dt);
  draw();
}

document.getElementById("btnSelectTop").addEventListener("click",function(){buildLevelChips();showOverlay("select");});
document.getElementById("btnSelectWin").addEventListener("click",function(){buildLevelChips();showOverlay("select");});
document.getElementById("btnSelectFail").addEventListener("click",function(){buildLevelChips();showOverlay("select");});
document.getElementById("btnCloseSelect").addEventListener("click",function(){showOverlay(null);});
document.getElementById("btnNext").addEventListener("click",function(){startLevel(cur<LEVELS.length-1?cur+1:0);});
document.getElementById("btnReplayWin").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnRetry").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnRetryBottom").addEventListener("click",function(){startLevel(cur);});

/* 调试验证入口：贪心布防策略确定性模拟逐关复现 */
window.__validateLevels=function(){
  try{return LD.validateAll()}catch(e){return {error:String(e)}}
};

resize();
buildGrads();
LEVELS=buildDefaultLevels();
loadCachedLevels();
cur=clamp(parseInt(curSave.lv,10)||0,0,Math.max(0,LEVELS.length-1));
unlocked=clamp(parseInt(curSave.best,10)||1,1,Math.max(1,LEVELS.length));
startLevel(cur);
requestAnimationFrame(frame);
(function(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("lane-defense").then(function(res){
    var list=parseLaneLevels(res);
    if(!list||!list.length)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      startLevel(cur);
    }
  }).catch(function(){});
})();
syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
/* 按钮图标注入（内联 SVG，零外链）；卡片文案更新走 .btxt，避免抹掉已注入图标 */
(function(){
  function $(id){return document.getElementById(id)}
  function setLabel(btn,txt){var s=btn.querySelector(".btxt");if(s)s.textContent=txt;else btn.textContent=txt;}
  window.__setBtnLabel=setLabel;
  function inject(id,icon){
    var b=$(id);if(!b)return;
    var t=b.textContent;
    b.innerHTML=window.SW_ICON(icon)+'<span class="btxt"></span>';
    setLabel(b,t);
  }
  var map=[["btnSelectTop","grid"],["card0","sun"],["card1","pea"],["card2","nut"],["card3","tri"],["card4","shovel"],["btnRetryBottom","rotate"],["btnNext","play"],["btnReplayWin","rotate"],["btnSelectWin","grid"],["btnRetry","rotate"],["btnSelectFail","grid"],["btnCloseSelect","x"]];
  for(var i=0;i<map.length;i++)inject(map[i][0],map[i][1]);
})();
</script>
