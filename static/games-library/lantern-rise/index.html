<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 常量与存档 ---------- */
var MW=480,MH=600,GRAV=190,LIFT=470,WALL=34;
var OIL_MAX=100,OIL_BURN=6.5,OIL_THRUST=7;
var KEY="sw.lantern-rise.v1";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function loadSave(){try{var s=JSON.parse(lsGet(KEY))||{};return{best:parseInt(s.best,10)||0}}catch(e){return{best:0}}}
var save=loadSave();
function persist(){
  try{lsSet(KEY,JSON.stringify(save))}catch(e){}
  if(GB.available)GB.saveState("lantern-rise",save).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("lantern-rise").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rb=parseInt(JSON.parse(res.stateJson).best,10)||0;
      if(rb>save.best){save.best=rb;S.best=rb;persist();syncHud();}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 调色板:CSS变量 → canvas ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL.bg=v("--g-bg");PAL.surface=v("--g-surface");PAL.surface2=v("--g-surface2");PAL.border=v("--g-border");
  PAL.text=v("--g-text");PAL.muted=v("--g-muted");PAL.faint=v("--g-faint");
  PAL.primary=v("--g-primary");PAL.deep=v("--g-primary-deep");PAL.soft=v("--g-primary-soft");
  PAL.danger=v("--g-danger");PAL.warning=v("--g-warning");PAL.success=v("--g-success");PAL.water=v("--g-water");
  PAL.paper=v("--g-lr-paper");PAL.paper2=v("--g-lr-paper2");PAL.rock=v("--g-lr-rock");PAL.rock2=v("--g-lr-rock2");
  PAL.sky1=v("--g-lr-sky1");PAL.sky2=v("--g-lr-sky2");PAL.flame1=v("--g-lr-flame1");PAL.flame2=v("--g-lr-flame2");
}
window.__gOnTheme=function(){palLoad();skyGrad=null;rockGrad=null;groundGrad=null;draw();};
/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
/* ---------- DOM ---------- */
function $(id){return document.getElementById(id)}
var cv=$("cv"),ctx=cv.getContext("2d"),ov=$("ov");
var hudAlt=$("hudAlt"),hudScore=$("hudScore"),hudBest=$("hudBest");
var ovK=$("ovK"),ovT=$("ovT"),ovX=$("ovX"),ovS=$("ovS"),ovB=$("ovB");
/* ---------- 状态 ---------- */
var S={phase:"menu",paused:false,hp:3,score:0,best:save.best,
  lt:{x:MW/2,wy:-20,vx:0,vy:0,tilt:0},
  oil:OIL_MAX,burn:false,steer:0,steerTouch:0,
  camY:0,maxAlt:0,pouch:0,inv:0,t:0,shakeT:0,
  gust:0,gustDir:0,gustT:0,calmT:4,warnT:0,
  items:[],nextY:-260,parts:[],floats:[]};
function alt(){return Math.max(0,(-S.lt.wy)/45)}
function baseWind(wy){var a=-wy;return Math.sin(a*0.013)*18+Math.sin(a*0.031)*10}
function windNow(){return baseWind(S.lt.wy)+S.gust}
function sy(wy){return wy-S.camY}
function startRun(){
  S.phase="run";S.paused=false;S.hp=3;S.score=0;S.pouch=0;
  S.lt={x:MW/2,wy:-20,vx:0,vy:0,tilt:0};
  S.oil=OIL_MAX;S.maxAlt=0;S.inv=0;S.gust=0;S.gustDir=1;S.gustT=0;S.calmT=4;S.warnT=0;
  S.camY=0;S.items=[];S.nextY=-260;S.parts.length=0;S.floats.length=0;
  syncHud();hideOv();
}
function endRun(){
  S.phase="over";
  var isRec=S.score>save.best&&S.score>0;
  if(isRec){save.best=S.score;S.best=S.score;persist();syncHud();}
  if(GB.available)GB.reportScore("lantern-rise",{metricValue:S.best,metricExtra:Math.round(S.maxAlt)+"m"}).catch(function(){});
  syncHud();
  showOv({k:"FLAME OUT",t:"灯火熄了",
    x:isRec?"新纪录！阵风越来越野，留意预警箭头提前回正。":"歪了的灯升力会掉，看到预警箭头就提前往反方向压。",
    stats:[["高度",Math.round(S.maxAlt)+"m"],["油袋",S.pouch],["最高分",S.best]],
    btns:[["再放一盏","primary",startRun,"play"]]});
}
function bump(el){var s=String(el.textContent);if(el.__last===s)return;el.__last=s;el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");}
function syncHud(){
  hudAlt.textContent=Math.round(Math.max(alt(),S.maxAlt))+"m";
  hudScore.textContent=String(S.score);
  hudBest.textContent=String(S.best);
  bump(hudAlt);bump(hudScore);
}
/* ---------- 覆盖层 ---------- */
function showOv(o){
  ovK.textContent=o.k||"";ovT.textContent=o.t||"";ovX.textContent=o.x||"";
  var st=o.stats||[];
  ovS.style.display=st.length?"grid":"none";
  ovS.innerHTML=st.map(function(s){return '<div class="st"><b>'+s[1]+"</b><span>"+s[0]+"</span></div>"}).join("");
  ovB.innerHTML="";
  (o.btns||[]).forEach(function(b){
    var el=document.createElement("button");
    el.className="btn"+(b[1]==="ghost"?" ghost":"");
    el.innerHTML=window.SW_ICON(b[3]||"play")+'<span class="btxt"></span>';
    el.querySelector(".btxt").textContent=b[0];
    el.addEventListener("click",b[2]);ovB.appendChild(el);
  });
  ov.classList.add("show");
}
function hideOv(){ov.classList.remove("show")}
function pauseGame(){
  if(S.phase!=="run"||S.paused)return;
  S.paused=true;
  showOv({k:"PAUSED",t:"已暂停",x:"风口小憩，回来接着放。",
    btns:[["继续","primary",function(){S.paused=false;hideOv()},"play"],["重开","ghost",startRun,"rotate"]]});
}
/* ---------- 粒子/浮字 ---------- */
function puff(x,y,n,col,spd){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28,sp=(spd||60)*(0.3+Math.random());
    S.parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.4+Math.random()*.3,max:.7,r:1.5+Math.random()*2.2,col:col});
  }
}
function float_(x,y,txt,col){S.floats.push({x:x,y:y,txt:txt,col:col||PAL.deep,t:1})}
/* ---------- 受击 ---------- */
function hurt(msg){
  if(S.inv>0)return;
  S.hp--;S.inv=1.3;S.shakeT=.3;
  puff(S.lt.x,sy(S.lt.wy),12,PAL.paper2,110);
  float_(S.lt.x,sy(S.lt.wy)-30,msg||("灯纸破了 ×"+S.hp),PAL.danger);
  if(S.hp<=0)endRun();
}
/* ---------- 生成 ---------- */
function spawnUpTo(topWorldY){
  while(S.nextY>topWorldY){
    var a=-S.nextY;
    var gap=Math.max(128,230-a*0.028);
    var side=Math.random()<0.5?"L":"R";
    var shelfW=Math.max(90,MW-WALL*2-gap-60-Math.random()*60);
    S.items.push({kind:"shelf",side:side,wy:S.nextY,w:shelfW});
    if(Math.random()<0.55){
      var gx=WALL+shelfW+(MW-WALL*2-shelfW)*(side==="L"?0.55+Math.random()*0.4:0.05+Math.random()*0.4);
      S.items.push({kind:"oil",x:gx,wy:S.nextY-60,r:10});
    }
    S.nextY-=gap+90+Math.random()*70;
  }
}
/* ---------- 物理步进 ---------- */
function step(dt){
  S.t+=dt;
  if(S.inv>0)S.inv-=dt;
  if(S.shakeT>0)S.shakeT-=dt;
  //阵风事件：平静 → 预警 → 吹 2.5s → 回到平静
  if(S.warnT>0){S.warnT-=dt;if(S.warnT<=0){S.gust=S.gustDir*(70+Math.random()*50);S.gustT=2.5}}
  else if(S.gustT>0){S.gustT-=dt;if(S.gustT<=0){S.gust=0;S.calmT=5+Math.random()*6}}
  else if(S.calmT>0){S.calmT-=dt}
  else{S.gustDir=Math.random()<0.5?1:-1;S.warnT=0.8}
  //油
  var thrusting=Math.abs(S.steer)>0||Math.abs(S.steerTouch)>0;
  if(S.burn&&S.oil>0){
    S.oil-=OIL_BURN*dt;
    if(thrusting)S.oil-=OIL_THRUST*dt;
    if(Math.random()<0.6)puff(S.lt.x-Math.sin(S.lt.tilt)*16,sy(S.lt.wy)+22,1,PAL.warning,36);
  }
  if(S.oil<0)S.oil=0;
  //灯体
  var lt=S.lt,w=windNow();
  var tiltTarget=Math.max(-1.15,Math.min(1.15,(w*0.011-(S.steer||S.steerTouch)*0.85)));
  lt.tilt+=(tiltTarget-lt.tilt)*Math.min(1,dt*3);
  var lift=S.burn&&S.oil>0?LIFT*Math.cos(lt.tilt):0;
  lt.vy+=GRAV*dt-lift*dt;
  lt.vy=Math.max(-150,Math.min(130,lt.vy));
  lt.vx+=w*dt*0.9+(S.steer||S.steerTouch)*210*dt;
  lt.vx*=(1-1.1*dt);
  lt.x+=lt.vx*dt;lt.wy+=lt.vy*dt;
  //峡谷岩壁
  if(lt.x<WALL+16){lt.x=WALL+16;lt.vx=Math.abs(lt.vx)*0.4+30;hurt("撞上岩壁 ×"+S.hp)}
  if(lt.x>MW-WALL-16){lt.x=MW-WALL-16;lt.vx=-Math.abs(lt.vx)*0.4-30;hurt("撞上岩壁 ×"+S.hp)}
  //镜头
  var targetCam=lt.wy-MH*0.6;
  S.camY+=(targetCam-S.camY)*Math.min(1,dt*4);
  //高度与得分
  var a=alt();
  if(a>S.maxAlt){S.maxAlt=a;S.score=Math.floor(S.maxAlt)*10+S.pouch*30;syncHud()}
  //道具与石台
  spawnUpTo(S.camY-80);
  for(var i=S.items.length-1;i>=0;i--){
    var it=S.items[i],iy=sy(it.wy);
    if(iy>MH+80){S.items.splice(i,1);continue}
    if(it.kind==="oil"){
      if(Math.hypot(it.x-lt.x,iy-sy(lt.wy))<34){
        S.items.splice(i,1);
        S.pouch++;S.oil=Math.min(OIL_MAX,S.oil+32);
        S.score=Math.floor(S.maxAlt)*10+S.pouch*30;
        float_(it.x,iy-16,"油 +32",PAL.water);
        puff(it.x,iy,8,PAL.water,70);
        syncHud();
      }
    }else{
      var shX=it.side==="L"?WALL+it.w/2:MW-WALL-it.w/2;
      var dx=Math.abs(shX-lt.x)-it.w/2,dy=Math.abs(iy-sy(lt.wy))-9;
      if(dx<17&&dy<11){
        lt.vy=Math.max(lt.vy,120);lt.vx=(lt.x<shX?-1:1)*90;
        hurt("磕上石台 ×"+S.hp);
      }
    }
  }
  //落回地面：没油就算收灯
  if(lt.wy>-10&&lt.vy>0){
    if(S.oil<=0&&!S.burn){endRun();return}
    lt.wy=-10;lt.vy=-40;
  }
  //粒子/浮字
  for(i=S.parts.length-1;i>=0;i--){
    var q=S.parts[i];
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy-=60*dt;q.life-=dt;
    if(q.life<=0)S.parts.splice(i,1);
  }
  for(i=S.floats.length-1;i>=0;i--){
    var fl=S.floats[i];fl.y-=30*dt;fl.t-=dt;
    if(fl.t<=0)S.floats.splice(i,1);
  }
}
/* ---------- 绘制 ---------- */
var SC=1,skyGrad=null,rockGrad=null,groundGrad=null;
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  SC=r.width/MW;
  ctx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
}
function rrect(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function draw(){
  var shx=S.shakeT>0?(Math.random()-.5)*7:0,shy=S.shakeT>0?(Math.random()-.5)*7:0;
  ctx.save();ctx.translate(shx,shy);
  if(!skyGrad){
    skyGrad=ctx.createLinearGradient(0,0,0,MH);
    skyGrad.addColorStop(0,PAL.sky1);skyGrad.addColorStop(1,PAL.sky2);
    rockGrad=ctx.createLinearGradient(0,0,0,MH);
    rockGrad.addColorStop(0,PAL.rock);rockGrad.addColorStop(1,colShade(PAL.rock,-0.25));
    groundGrad=ctx.createLinearGradient(0,0,0,MH);
    groundGrad.addColorStop(0,PAL.rock2);groundGrad.addColorStop(1,colShade(PAL.rock2,-0.3));
  }
  ctx.fillStyle=skyGrad;ctx.fillRect(-8,-8,MW+16,MH+16);
  // 顶部天光晕（恒白柔光）
  var halo=ctx.createRadialGradient(MW/2,-40,10,MW/2,-40,MW*0.8);
  halo.addColorStop(0,"rgba(255,255,255,0.20)");halo.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=halo;ctx.fillRect(0,0,MW,MH*0.6);
  var i,lt=S.lt,ly=sy(lt.wy);
  // 峡谷岩壁：渐变「面」+ 顶缘亮线 + 落地投影
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.28)";ctx.shadowBlur=10;ctx.shadowOffsetY=4;   // 恒黑落地投影
  ctx.fillStyle=rockGrad;
  ctx.fillRect(0,-8,WALL,MH+16);ctx.fillRect(MW-WALL,-8,WALL,MH+16);
  ctx.restore();
  ctx.fillStyle=colMix(PAL.rock,WHITE,0.25);
  ctx.fillRect(0,-8,WALL,3);ctx.fillRect(MW-WALL,-8,WALL,3);   // 顶缘亮线
  ctx.fillStyle=PAL.rock2;
  for(var ry=-40;ry<MH+40;ry+=64){
    ctx.fillRect(WALL-8,ry+((S.camY*0.4)%64),8,34);
    ctx.fillRect(MW-WALL,ry+64-((S.camY*0.4)%64),8,34);
  }
  // 地面「面」+ 亮缘
  var gY=sy(0);
  if(gY<MH+40){
    ctx.fillStyle=groundGrad;ctx.fillRect(WALL-8,gY,MW-WALL*2+16,MH-gY+8);
    ctx.fillStyle=colMix(PAL.rock2,WHITE,0.2);ctx.fillRect(WALL-8,gY,MW-WALL*2+16,2);   // 地面亮缘
    ctx.fillStyle=PAL.muted;ctx.font="700 12px system-ui,sans-serif";ctx.textAlign="center";
    ctx.fillText("放飞点",MW/2,gY+16);
  }
  // 石台与油袋
  for(i=0;i<S.items.length;i++){
    var it=S.items[i],iy=sy(it.wy);
    if(iy<-60||iy>MH+60)continue;
    if(it.kind==="oil"){
      // 油袋：径向渐变球 + 恒白高光 + 落地投影
      ctx.save();ctx.shadowColor="rgba(0,0,0,0.28)";ctx.shadowBlur=6;ctx.shadowOffsetY=3;
      var og=ctx.createRadialGradient(it.x-3,iy-3,1,it.x,iy,11);
      og.addColorStop(0,colMix(PAL.water,WHITE,0.5));og.addColorStop(1,colShade(PAL.water,-0.25));
      ctx.fillStyle=og;ctx.beginPath();ctx.arc(it.x,iy,10,0,Math.PI*2);ctx.fill();ctx.restore();
      ctx.strokeStyle=colShade(PAL.water,-0.4);ctx.lineWidth=1.2;
      ctx.beginPath();ctx.arc(it.x,iy,10,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=WHITE;ctx.beginPath();ctx.arc(it.x-3,iy-3,2.6,0,Math.PI*2);ctx.fill();   // 恒白高光
    }else{
      var sx=it.side==="L"?WALL:MW-WALL-it.w;
      // 石台：渐变「面」+ 顶缘亮线 + 落地投影
      ctx.save();ctx.shadowColor="rgba(0,0,0,0.28)";ctx.shadowBlur=7;ctx.shadowOffsetY=3;
      var sg=ctx.createLinearGradient(0,iy-9,0,iy+9);
      sg.addColorStop(0,colMix(PAL.rock,WHITE,0.2));sg.addColorStop(0.5,PAL.rock);sg.addColorStop(1,colShade(PAL.rock,-0.3));
      ctx.fillStyle=sg;rrect(sx,iy-9,it.w,18,7);ctx.fill();ctx.restore();
      ctx.fillStyle=PAL.rock2;rrect(sx,iy-9,Math.min(14,it.w),18,7);ctx.fill();
      ctx.fillStyle=colMix(PAL.rock,WHITE,0.35);ctx.fillRect(sx,iy-9,it.w,2);   // 顶缘亮线
    }
  }
  // 孔明灯
  var blink=S.inv>0&&Math.sin(S.t*24)<0;
  if(!blink){
    // 灯体光晕（恒白暖光）
    var gl=ctx.createRadialGradient(lt.x,ly,4,lt.x,ly,60);
    gl.addColorStop(0,"rgba(255,255,255,0.28)");gl.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(lt.x,ly,60,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.translate(lt.x,ly);ctx.rotate(lt.tilt);
    ctx.shadowColor="rgba(0,0,0,0.3)";ctx.shadowBlur=10;ctx.shadowOffsetY=5;   // 恒黑落地投影
    // 灯纸渐变体
    var pg=ctx.createLinearGradient(0,-22,0,20);
    pg.addColorStop(0,colMix(PAL.paper,WHITE,0.35));pg.addColorStop(0.55,PAL.paper);pg.addColorStop(1,PAL.paper2);
    ctx.fillStyle=pg;ctx.strokeStyle=colShade(PAL.paper2,-0.3);ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-18,14);
    ctx.quadraticCurveTo(-24,-14,0,-22);
    ctx.quadraticCurveTo(24,-14,18,14);
    ctx.quadraticCurveTo(0,20,-18,14);
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();
    // 纸面骨架线 + 恒白高光 + 提绳 + 火焰
    ctx.save();ctx.translate(lt.x,ly);ctx.rotate(lt.tilt);
    ctx.strokeStyle=colShade(PAL.paper2,-0.15);ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(-14,12);ctx.quadraticCurveTo(-16,-8,0,-16);
    ctx.moveTo(14,12);ctx.quadraticCurveTo(16,-8,0,-16);ctx.stroke();
    ctx.fillStyle=WHITE;ctx.globalAlpha=.5;
    ctx.beginPath();ctx.ellipse(-7,-8,5,8,-0.4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;   // 恒白高光
    ctx.strokeStyle=PAL.muted;ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(-13,17);ctx.lineTo(-9,26);ctx.moveTo(13,17);ctx.lineTo(9,26);ctx.stroke();
    if(S.burn&&S.oil>0){
      var fl=8+Math.sin(S.t*12)*3;
      var fg=ctx.createLinearGradient(0,26,0,26+fl);
      fg.addColorStop(0,PAL.flame2);fg.addColorStop(1,PAL.flame1);
      ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(-7,26);ctx.quadraticCurveTo(0,26+fl,7,26);ctx.closePath();ctx.fill();
      ctx.fillStyle=WHITE;ctx.globalAlpha=.85;
      ctx.beginPath();ctx.moveTo(-3,26);ctx.quadraticCurveTo(0,26+fl*.6,3,26);ctx.closePath();ctx.fill();ctx.globalAlpha=1;   // 恒白焰芯
    }
    ctx.restore();
    //倾角警示
    var tiltDeg=Math.abs(lt.tilt)*57.3;
    if(tiltDeg>40){
      ctx.fillStyle=PAL.danger;ctx.font="700 12px system-ui,sans-serif";ctx.textAlign="center";
      ctx.fillText("灯身歪 "+Math.round(tiltDeg)+"° 快回正",lt.x,ly-40);
    }
  }
  //油量槽：内凹轨道 + 渐变液柱
  ctx.fillStyle=PAL.surface;ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rrect(48,90,14,200,7);ctx.fill();ctx.stroke();
  var op=S.oil/OIL_MAX;
  if(op>0.01){
    var og2=ctx.createLinearGradient(0,90+(200-196*op),0,90+200);
    og2.addColorStop(0,PAL.water);og2.addColorStop(1,colShade(PAL.water,-0.35));
    ctx.fillStyle=og2;rrect(50,90+(200-196*op),10,196*op,5);ctx.fill();
  }
  ctx.fillStyle=PAL.muted;ctx.font="700 12px system-ui,sans-serif";ctx.textAlign="center";
  ctx.fillText("油",55,80);
  //阵风预警
  if(S.warnT>0){
    ctx.fillStyle=PAL.warning;ctx.font="700 14px system-ui,sans-serif";ctx.textAlign="center";
    var arrow=S.gustDir>0?"阵风 →":"← 阵风";
    ctx.fillText(arrow,MW/2,44);
  }else if(S.gustT>0){
    ctx.fillStyle=PAL.warning;ctx.font="700 14px system-ui,sans-serif";ctx.textAlign="center";
    ctx.fillText(S.gust>0?"→→ 阵风中":"←← 阵风中",MW/2,44);
  }
  //灯余量：小灯笼渐变
  for(i=0;i<S.hp;i++){
    ctx.save();ctx.translate(MW-24-i*24,28);
    var hg=ctx.createLinearGradient(0,-8,0,8);
    hg.addColorStop(0,colMix(PAL.paper,WHITE,0.4));hg.addColorStop(1,PAL.paper2);
    ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(0,0,6,8,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=colShade(PAL.paper2,-0.3);ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  //粒子/浮字
  for(i=0;i<S.parts.length;i++){
    var q=S.parts[i];
    ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.fillStyle=q.col;
    ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign="center";ctx.font="700 16px system-ui,sans-serif";
  for(i=0;i<S.floats.length;i++){
    var f2=S.floats[i];
    ctx.globalAlpha=Math.min(1,f2.t*1.5);
    ctx.fillStyle=f2.col;ctx.fillText(f2.txt,f2.x,f2.y);
  }
  ctx.globalAlpha=1;
}
/* ---------- 输入 ---------- */
var keys={},touchX=null;
function pos(e){
  var r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  touchX=pos(e).x;
  S.burn=true;
});
cv.addEventListener("pointermove",function(e){
  if(touchX==null)return;
  var x=pos(e).x,d=x-touchX;
  S.steerTouch=Math.max(-1,Math.min(1,d/70));
});
function pointerEnd(){touchX=null;S.steerTouch=0;S.burn=false}
cv.addEventListener("pointerup",pointerEnd);
cv.addEventListener("pointercancel",pointerEnd);
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
window.addEventListener("blur",function(){keys={};S.burn=false;S.steerTouch=0});
document.addEventListener("keydown",function(e){
  keys[e.code]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==="Space"||e.code==="KeyW")S.burn=true;
  if(e.code==="KeyP"&&S.phase==="run"){S.paused?((S.paused=false),hideOv()):pauseGame()}
  if(e.code==="KeyR"&&S.phase!=="menu")startRun();
  if(e.code==="Enter"&&S.phase!=="run")startRun();
});
document.addEventListener("keyup",function(e){
  keys[e.code]=false;
  if(e.code==="Space"||e.code==="KeyW")S.burn=false;
});
$("btnPause").addEventListener("click",pauseGame);
$("btnReset").addEventListener("click",startRun);
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&S.phase==="run"&&!S.paused)pauseGame();
});
/* ---------- 主循环 ---------- */
var lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  var dt=Math.min(.05,(now-lastT)/1000);
  lastT=now;
  if(S.phase==="run"&&!S.paused)step(dt);
  draw();
}
/* ---------- 启动 ---------- */
palLoad();
S.camY=S.lt.wy-MH*0.6;
syncHud();
showOv({k:"LANTERN RISE",t:"灯升风变",
  x:"按住控火让孔明灯升空；阵风来临前有预警箭头，横向推压可以回正灯身——灯越歪升力越低。油袋补燃料，撞岩壁石台会破灯纸，三盏灯放完结算。",
  stats:[["最高分",S.best]],
  btns:[["点火放飞","primary",startRun,"flame"]]});
resize();
window.addEventListener("resize",function(){skyGrad=null;rockGrad=null;groundGrad=null;resize();});
window.addEventListener("orientationchange",function(){skyGrad=null;rockGrad=null;groundGrad=null;resize();});
requestAnimationFrame(loop);
syncSaveFromServer();
})();
</script>
<script>
/* 按钮图标注入（内联 SVG，零外链） */
(function(){
  function $(id){return document.getElementById(id)}
  function inject(id,icon){
    var b=$(id);if(!b)return;
    var t=b.textContent;
    b.innerHTML=window.SW_ICON(icon)+'<span class="btxt"></span>';
    b.querySelector(".btxt").textContent=t;
  }
  inject("btnPause","pause");inject("btnReset","rotate");
})();
</script>
