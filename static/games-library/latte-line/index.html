/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("latte-line").then(function(res){
    var list=parseLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){setupLevel(Math.max(0,Math.min(cur,LEVELS.length-1)));showStart();}
  }).catch(function(){});
}

/* ---------- 存档 ---------- */
var KEY="sw.latte-line.v1";
function loadSave(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&typeof s==="object"){
      var done={};
      if(s.done&&typeof s.done==="object")for(var k in s.done){var v=parseInt(s.done[k],10);if(v>0)done[k]=v;}
      return {lv:Math.max(0,parseInt(s.lv,10)||0),done:done,best:Math.max(0,parseInt(s.best,10)||0)};
    }
  }catch(e){}
  return {lv:0,done:{},best:0};
}
var saveData=loadSave();
var doneSave=saveData.done||{};
var best=saveData.best||0;
function totalBest(){var t=0,k;for(k in doneSave){var v=parseInt(doneSave[k],10)||0;if(v>0)t+=v;}return t;}
function save(){
  var data={lv:saveData.lv,done:doneSave,best:best};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("latte-line",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("latte-line").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(remote.lv,10)||0;if(rl>saveData.lv){saveData.lv=rl;changed=true;}
      var rb=parseInt(remote.best,10)||0;if(rb>best){best=rb;changed=true;}
      if(remote.done&&typeof remote.done==="object")for(var k in remote.done){
        var rv=parseInt(remote.done[k],10)||0,mv=parseInt(doneSave[k],10)||0;
        if(rv>mv){doneSave[k]=rv;changed=true;}
      }
      if(changed){best=Math.max(best,totalBest());save();refreshStats();}
    }catch(e){}
  }).catch(function(){});
}

/* ---------- 状态 ---------- */
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var stLv=document.getElementById("stLv"),stScore=document.getElementById("stScore"),stTime=document.getElementById("stTime");
var msgEl=document.getElementById("msg");
var btnPause=document.getElementById("btnPause"),btnLevels=document.getElementById("btnLevels"),btnDone=document.getElementById("btnDone");
var overlay=document.getElementById("overlay"),panel=document.getElementById("panel");
function $(id){return document.getElementById(id);}
function say(t){msgEl.textContent=t;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}

var cur=0,L=null,path=[],samples=[],trace=[];
var timeLeft=0,state="ready",paused=false,over=false,drawing=false;
var pen={x:0,y:0,down:false};
var W=0,H=0,dpr=1,boxX=0,boxY=0,boxW=0,boxH=0,lastFrame=0;
function fit(){
  var r=cv.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(200,r.width);H=Math.max(200,r.width*3/4);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  boxW=Math.min(W*0.82,320);boxH=boxW*LL_BOXH/LL_BOXW;
  boxX=(W-boxW)/2;boxY=(H-boxH)/2;
  buildPath();
  draw();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);
function buildPath(){
  var local=LL.genPath(L.no,L.seed),i;
  path=[];
  for(i=0;i<local.length;i++)path.push([boxX+(local[i][0]+LL_BOXW/2)*boxW/LL_BOXW,boxY+(local[i][1]+LL_BOXH/2)*boxH/LL_BOXH]);
  samples=[];
  var total=LL.pathLength(local),step=total/200;
  for(i=0;i<local.length-1;i++){
    var a=local[i],b=local[i+1];
    var seg=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(seg/step));
    for(var k=0;k<n;k++){
      var t=k/n;
      samples.push([boxX+(a[0]+(b[0]-a[0])*t+LL_BOXW/2)*boxW/LL_BOXW,boxY+(a[1]+(b[1]-a[1])*t+LL_BOXH/2)*boxH/LL_BOXH]);
    }
  }
  samples.push(path[path.length-1]);
}
function setupLevel(n){
  n=Math.max(0,Math.min(n,LEVELS.length-1));
  cur=n;L=LEVELS[n];
  trace=[];timeLeft=L.time;over=false;paused=false;drawing=false;
  fit();
  pen={x:path.length?path[0][0]:W/2,y:path.length?path[0][1]:H/2,down:false};
  refreshStats();
  btnPause.disabled=true;btnPause.textContent="暂停";btnDone.disabled=true;
  say("点击「开始」出品拿铁");
}
function startPlay(){
  state="running";paused=false;over=false;
  pen={x:path.length?path[0][0]:W/2,y:path.length?path[0][1]:H/2,down:false};
  hideOverlay();
  btnPause.disabled=false;btnPause.textContent="暂停";btnDone.disabled=false;
  say("沿浅色图案描线 · 覆盖越全分越高");
}
function togglePause(){
  if(state!=="running")return;
  paused=!paused;
  btnPause.textContent=paused?"继续":"暂停";
  if(paused)showPause();else hideOverlay();
  say(paused?"已暂停":"已继续");
}
function retryLevel(){setupLevel(cur);startPlay();}
function enterLevel(n){setupLevel(n);showStart();}
function refreshStats(){
  stLv.textContent=(cur+1)+"/"+LEVELS.length;
  stScore.textContent=String(doneSave[cur]||0);
  stTime.textContent=Math.max(0,Math.ceil(timeLeft));
}
function distSeg(px,py,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1;
  var l2=dx*dx+dy*dy;
  if(l2===0)return Math.hypot(px-x1,py-y1);
  var t=((px-x1)*dx+(py-y1)*dy)/l2;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function distToPath(x,y){
  var best=1e9;
  for(var i=1;i<path.length;i++){
    var d=distSeg(x,y,path[i-1][0],path[i-1][1],path[i][0],path[i][1]);
    if(d<best)best=d;
  }
  return best;
}
function scoreTrace(){
  if(trace.length<5)return{score:0,coverage:0,avg:999};
  var sum=0,i,j;
  for(i=0;i<trace.length;i++)sum+=distToPath(trace[i][0],trace[i][1]);
  var avg=sum/trace.length;
  var hit=0;
  for(i=0;i<samples.length;i++){
    var ok=false;
    for(j=0;j<trace.length;j++){
      if(Math.hypot(samples[i][0]-trace[j][0],samples[i][1]-trace[j][1])<=L.tol*1.5){ok=true;break;}
    }
    if(ok)hit++;
  }
  var coverage=hit/samples.length;
  var fit=Math.max(0,1-avg/(L.tol*2));
  var score=Math.round(100*coverage*fit);
  return{score:score,coverage:coverage,avg:avg};
}
function finish(){
  if(over||state!=="running")return;
  over=true;state="over";btnPause.disabled=true;btnDone.disabled=true;
  var r=scoreTrace();
  var pass=r.score>=60&&r.coverage>=0.7;
  var prev=doneSave[cur]||0;if(r.score>prev)doneSave[cur]=r.score;
  var tb=totalBest();if(tb>best)best=tb;
  if(pass&&cur+1>saveData.lv)saveData.lv=cur+1;
  save();
  if(GB.available)GB.reportScore("latte-line",{metricValue:best,metricExtra:cur+1}).catch(function(){});
  refreshStats();
  if(pass)showWin(r);else showFail(r);
}

/* ---------- 更新 ---------- */
function update(dt){
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;refreshStats();finish();return;}
  refreshStats();
}

/* ---------- 渲染 ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.coffee;ctx.fillRect(0,0,W,H);
  // 杯口
  ctx.fillStyle=PAL.cup;
  ctx.beginPath();ctx.ellipse(W/2,H/2,boxW*0.62,boxH*0.72,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.coffee;
  ctx.beginPath();ctx.ellipse(W/2,H/2,boxW*0.55,boxH*0.64,0,0,Math.PI*2);ctx.fill();
  // 目标图案（浅色虚线）
  ctx.strokeStyle=PAL.milk;ctx.lineWidth=2;ctx.setLineDash([5,5]);
  ctx.beginPath();
  for(var i=0;i<path.length;i++){if(i===0)ctx.moveTo(path[i][0],path[i][1]);else ctx.lineTo(path[i][0],path[i][1]);}
  ctx.stroke();ctx.setLineDash([]);
  // 描线
  if(trace.length>1){
    ctx.strokeStyle=PAL.latte;ctx.lineWidth=4;ctx.lineCap="round";ctx.lineJoin="round";
    ctx.beginPath();ctx.moveTo(trace[0][0],trace[0][1]);
    for(var j=1;j<trace.length;j++)ctx.lineTo(trace[j][0],trace[j][1]);
    ctx.stroke();
  }
  // 键盘画笔
  if(state==="running"&&!paused&&!over){
    ctx.strokeStyle=pen.down?PAL.danger:PAL.muted;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(pen.x,pen.y,pen.down?8:6,0,Math.PI*2);ctx.stroke();
  }
}

/* ---------- 覆盖层 ---------- */
function showPanel(html){panel.innerHTML=html;overlay.classList.add("show");}
function hideOverlay(){overlay.classList.remove("show");}
function showStart(){
  showPanel(
    '<p class="rt">第 '+(cur+1)+' 关 · '+esc(L.name)+'</p>'+
    '<p class="rs">限时 '+L.time+' 秒 · 容差 '+L.tol+'px · 本关最佳 <b>'+(doneSave[cur]||0)+'</b></p>'+
    '<div class="rbtns"><button class="btn" id="ovMain" type="button">开始</button></div>'+
    '<p class="rhint">按住画面沿浅色虚线描出拉花图案。评分看两件事：覆盖了多少图案、偏离有多大；时间到自动评分，也可提前点「完成」。</p>'
  );
  $("ovMain").addEventListener("click",function(){startPlay();});
}
function showPause(){
  showPanel(
    '<p class="rt">已暂停</p>'+
    '<p class="rs">剩余 '+Math.ceil(timeLeft)+' 秒</p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovRetryP" type="button">重玩本关</button>'+
      '<button class="btn" id="ovResume" type="button">继续</button>'+
    '</div>'
  );
  $("ovResume").addEventListener("click",function(){togglePause();});
  $("ovRetryP").addEventListener("click",function(){retryLevel();});
}
function showWin(r){
  showPanel(
    '<p class="rt">过关！</p>'+
    '<p class="rs">贴合度 <b>'+r.score+'</b> 分 · 覆盖 '+Math.round(r.coverage*100)+'%</p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovReplay" type="button">重玩本关</button>'+
      '<button class="btn" id="ovNext" type="button">下一关</button>'+
    '</div>'
  );
  $("ovNext").addEventListener("click",function(){enterLevel(cur<LEVELS.length-1?cur+1:cur);});
  $("ovReplay").addEventListener("click",function(){enterLevel(cur);});
}
function showFail(r){
  showPanel(
    '<p class="rt">未达标</p>'+
    '<p class="rs">贴合度 '+r.score+' 分 · 覆盖 '+Math.round(r.coverage*100)+'%</p>'+
    '<p class="rhint">提示：先把整个图案轮廓走一遍，再补齐细节；偏离越小分越高。</p>'+
    '<div class="rbtns"><button class="btn" id="ovRetryF" type="button">重试本关</button></div>'
  );
  $("ovRetryF").addEventListener("click",function(){retryLevel();});
}
function showLevels(){
  var html='<p class="rt">选择关卡</p><p class="rs">已过关卡显示为绿色</p><div class="lv-wrap"><div class="lv-grid">';
  for(var i=0;i<LEVELS.length;i++){
    var done=parseInt(doneSave[i],10)>0;
    var locked=i>saveData.lv;
    html+='<button class="lv-chip'+(i===cur?" sel":"")+(done?" done":"")+'" data-i="'+i+'"'+(locked?" disabled":"")+' type="button">'+(i+1)+'</button>';
  }
  html+='</div></div><div class="rbtns"><button class="btn ghost" id="ovClose" type="button">返回</button></div>';
  showPanel(html);
  var chips=panel.querySelectorAll(".lv-chip");
  for(var j=0;j<chips.length;j++)chips[j].addEventListener("click",function(){enterLevel(parseInt(this.getAttribute("data-i"),10));});
  $("ovClose").addEventListener("click",function(){hideOverlay();if(state==="running"&&paused)showPause();});
}

/* ---------- 输入 ---------- */
function canvasPos(e){
  var r=cv.getBoundingClientRect();
  return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  if(state!=="running"||paused||over)return;
  drawing=true;
  var p=canvasPos(e);trace.push(p);
});
cv.addEventListener("pointermove",function(e){
  if(!drawing)return;
  var p=canvasPos(e),last=trace[trace.length-1];
  if(!last||Math.hypot(p[0]-last[0],p[1]-last[1])>2)trace.push(p);
});
cv.addEventListener("pointerup",function(){drawing=false;});
cv.addEventListener("pointercancel",function(){drawing=false;});
document.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowLeft"||k==="a"){e.preventDefault();penMove(-14,0);return;}
  if(k==="ArrowRight"||k==="d"){e.preventDefault();penMove(14,0);return;}
  if(k==="ArrowUp"||k==="w"){e.preventDefault();penMove(0,-14);return;}
  if(k==="ArrowDown"||k==="s"){e.preventDefault();penMove(0,14);return;}
  if(e.repeat)return;
  if(k==="Enter"){e.preventDefault();if(state==="running"&&!paused){pen.down=!pen.down;if(pen.down)trace.push([pen.x,pen.y]);}else if(state==="ready"||state==="over")startPlay();return;}
  if(k===" "){e.preventDefault();if(state==="running")togglePause();else if(state==="ready"||state==="over")startPlay();}
});
function penMove(dx,dy){
  if(state!=="running"||paused||over)return;
  pen.x=Math.max(0,Math.min(W,pen.x+dx));
  pen.y=Math.max(0,Math.min(H,pen.y+dy));
  if(pen.down){var last=trace[trace.length-1];if(!last||Math.hypot(pen.x-last[0],pen.y-last[1])>2)trace.push([pen.x,pen.y]);}
}
btnPause.addEventListener("click",togglePause);
btnDone.addEventListener("click",function(){if(state==="running"&&!paused)finish();});
btnLevels.addEventListener("click",function(){if(state==="running"&&!paused){paused=true;btnPause.textContent="继续";}showLevels();});
document.addEventListener("visibilitychange",function(){if(document.hidden&&state==="running"&&!paused)togglePause();});

/* ---------- 主循环 ---------- */
function loop(now){
  requestAnimationFrame(loop);
  var dt=((now-lastFrame)/1000)||0.016;lastFrame=now;
  if(dt>0.05)dt=0.05;
  if(state==="running"&&!paused&&!over)update(dt);
  draw();
}

setupLevel(Math.max(0,Math.min(saveData.lv,LEVELS.length-1)));
requestAnimationFrame(loop);
syncLevelsFromServer();
syncSaveFromServer();
showStart();
window.__validateLevels=function(){
  try{return LL.validateAll(LEVELS);}catch(e){return {error:String(e)};}
};
})();
</script>
</body>
</html>
