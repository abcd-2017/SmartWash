<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>扶梯闪避</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材（--g-st- 前缀）*/
  :root {
    --g-bg:#F5F6F3; --g-surface:#FFFFFF; --g-surface2:#EFF1EE;
    --g-primary:#2D9B6A; --g-primary-deep:#17734A; --g-btn-primary:#17734A; --g-primary-soft:#E8F6EF; --g-on-primary:#FFFFFF; --g-on-soft:#0B3625;
    --g-text:#1C1C1E; --g-muted:#6B6E73; --g-faint:#A9AEA9; --g-border:#E6E9E6; --g-hairline:#EFF1EE;
    --g-danger:#A83850; --g-warning:#9A6210; --g-success:#17734A; --g-water:#4A9FD4;
    --g-scrim:rgba(245,246,243,.9);
    --g-shadow:0 2px 12px rgba(20,40,30,.05);
    --g-radius:16px; --g-radius-btn:14px; --g-radius-inner:12px; --g-gap:16px;
    --g-st-shaft:#E4E7E2; --g-st-step:#C9CCC7; --g-st-stepline:#A9AEA9;
    --g-st-crowd:#D97F8C; --g-st-crowd2:#B95A68;
    --g-st-hero:#2D9B6A; --g-st-herodark:#17734A;
    color-scheme:light;
  }
  :root[data-theme=dark] {
    --g-bg:#141614; --g-surface:#1D201E; --g-surface2:#262A27;
    --g-primary-deep:#5BC894; --g-primary-soft:#1D3229; --g-on-soft:#B9E8CF;
    --g-text:#E6E9E6; --g-muted:#A9AEA9; --g-faint:#7E837D; --g-border:#2C312D; --g-hairline:#262A27;
    --g-danger:#DB7186; --g-warning:#E2A44E; --g-success:#4ADE6E; --g-water:#6BB4DE;
    --g-scrim:rgba(20,22,20,.9);
    --g-shadow:0 2px 12px rgba(0,0,0,.28);
    --g-st-shaft:#1B1E1C; --g-st-step:#2A2E2B; --g-st-stepline:#3A3F3B;
    --g-st-crowd:#E693A0; --g-st-crowd2:#C96A78;
    --g-st-hero:#5BC894; --g-st-herodark:#4ADE6E;
    color-scheme:dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.5; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 12px;
    min-width: 74px; padding: 5px 10px; text-align: center; line-height: 1.3;
  }
  .score-box .label { display: block; font-size: 12px; opacity: .85; white-space: nowrap; }
  .score-box .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stage { position: relative; }
  canvas {
    display: block; width: 100%; aspect-ratio: 3 / 4; height: auto;
    background: var(--g-st-shaft);
    border: 1px solid var(--g-border); border-radius: 12px;
    touch-action: none;
  }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 16px; flex: 1;
    border: 0; border-radius: 14px;
    background: var(--g-btn-primary); color: var(--g-on-primary);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    touch-action: manipulation;
  }
  .btn:active { opacity: .85; }
  .btn.ghost { background: var(--g-surface2); color: var(--g-text); border: 1px solid var(--g-border); }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .panel {
    width: 100%; max-width: 320px; max-height: 100%; overflow: auto;
    background: var(--g-surface); border: 1px solid var(--g-border); border-radius: 16px;
    box-shadow: var(--g-shadow); padding: 22px 18px; text-align: center;
  }
  .rt { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
  .rs { margin: 0 0 14px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .rs b { color: var(--g-primary-deep); font-size: 22px; font-variant-numeric: tabular-nums; }
  .rbtns { display: flex; gap: 10px; margin-top: 16px; }
  .rbtns .btn { flex: 1; }
  .rhint { margin: 14px 0 0; font-size: 12px; color: var(--g-muted); line-height: 1.6; text-align: left; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（动效层指令，不受 §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见 */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <span class="sub">电梯井跳跃 · 躲避升降人流 · 上行限力</span>
    <div class="scores">
      <div class="score-box"><span class="label">高度</span><span class="val" id="score">0</span></div>
      <div class="score-box"><span class="label">最高</span><span class="val" id="best">0</span></div>
    </div>
  </header>
  <div class="stage"><canvas id="cv" role="img" aria-label="扶梯井"></canvas></div>
  <p class="msg" id="msg" role="status" aria-live="polite">点击「开始」进入电梯井</p>
  <div class="tools">
    <button class="btn ghost" id="btnPause" type="button" disabled>暂停</button>
    <button class="btn" id="btnMain" type="button">开始游戏</button>
  </div>
  <p class="foot">左右闪避 · 上跳攀高 · 下跃回撤 · 力槽有限，注意节奏</p>
</div>
<div class="overlay" role="dialog" aria-modal="true" id="overlay">
  <div class="panel" id="panel"></div>
</div>
<script>
/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
"use strict";
(() => {
/* ========== 游戏桥适配层（存档/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim();}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),border:v("--g-border"),
    shaft:v("--g-st-shaft"),step:v("--g-st-step"),stepine:v("--g-st-stepline"),
    crowd:v("--g-st-crowd"),crowd2:v("--g-st-crowd2"),hero:v("--g-st-hero"),herodark:v("--g-st-herodark")};
}
window.__gOnTheme=function(){palLoad();draw();};
palLoad();

var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var scoreEl=document.getElementById("score"),bestEl=document.getElementById("best");
var msgEl=document.getElementById("msg"),btnPause=document.getElementById("btnPause"),btnMain=document.getElementById("btnMain");
var overlay=document.getElementById("overlay"),panel=document.getElementById("panel");
function $(id){return document.getElementById(id);}
function say(t){msgEl.textContent=t;}

var KEY="sw.lift-dodge.v1";
var store={
  get:function(k){try{return window.localStorage.getItem(k);}catch(e){return null;}},
  set:function(k,v){try{window.localStorage.setItem(k,v);}catch(e){}}
};
var best=0;
try{best=Math.max(0,parseInt(JSON.parse(store.get(KEY)||"null").best,10)||0);}catch(e){}
bestEl.textContent=best;
function persistBest(){
  store.set(KEY,JSON.stringify({best:best}));
  if(GB.available)GB.saveState("lift-dodge",{best:best}).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("lift-dodge").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rb=Math.max(0,parseInt(JSON.parse(res.stateJson).best,10)||0);
      if(rb>best){best=rb;bestEl.textContent=best;persistBest();}
    }catch(e){}
  }).catch(function(){});
}

/* ---------- 常量 ---------- */
var COLS=6,ROWS=8,TICK=200;
var W=0,H=0,dpr=1,cellW=0,cellH=0;
var hero={x:2,y:0},stam=3,maxStam=3,tInt=0,score=0,maxY=0;
var state="ready",paused=false,lastFrame=0,acc=0,queued=null;
var topY=0;

function hashRand(r,i){var x=Math.sin(r*127.1+i*311.7)*43758.5453;return x-Math.floor(x);}
function rowDir(r){return r%2===0?1:-1;}
function rowMask(r){
  if(r<=0)return 0;
  if(r%4===0)return 0;          // 休息平台
  var n=Math.min(COLS-2,1+Math.floor(r/5)+(hashRand(r,1)<0.45?1:0));
  var mask=0,i,c;
  for(i=0;i<n;i++){
    c=Math.floor(hashRand(r,2+i)*COLS);
    mask|=(1<<c);
  }
  // 保证至少 2 个空位
  var guard=0;
  while(((mask.toString(2).match(/1/g)||[]).length>COLS-2)&&guard<8){
    c=Math.floor(hashRand(r,20+guard)*COLS);mask&=~(1<<c);guard++;
  }
  return mask;
}
function personAt(r,c,t){
  var m=rowMask(r);if(!m)return false;
  var sh=rowDir(r)*2*t;
  var idx=(c-sh)%COLS;idx=((idx%COLS)+COLS)%COLS;
  return ((m>>idx)&1)===1;
}

function fit(){
  var r=cv.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(200,r.width);H=Math.max(200,r.width*4/3);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cellW=W/COLS;cellH=H/ROWS;
  draw();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);
function sy(wy){return H-(wy-topY+1)*cellH;}

/* ---------- 流程 ---------- */
function resetRun(){
  hero={x:2,y:0};stam=maxStam;tInt=0;score=0;maxY=0;topY=0;queued=null;
  state="ready";paused=false;
  scoreEl.textContent="0";
  btnPause.disabled=true;btnPause.textContent="暂停";btnMain.textContent="开始游戏";
  say("点击「开始」进入电梯井");
  draw();
}
function startGame(){
  state="running";paused=false;
  hideOverlay();
  btnPause.disabled=false;btnPause.textContent="暂停";btnMain.textContent="重新开始";
  say("左右闪避人流 · 上跳攀高");
}
function togglePause(){
  if(state!=="running")return;
  paused=!paused;
  btnPause.textContent=paused?"继续":"暂停";
  if(paused)showPause();else hideOverlay();
  say(paused?"已暂停":"已继续");
}
function gameOver(){
  state="over";
  var isRecord=score>best&&score>0;
  if(isRecord){best=score;bestEl.textContent=best;persistBest();}
  if(GB.available)GB.reportScore("lift-dodge",{metricValue:best}).catch(function(){});
  showOver(isRecord);
}
function tick(){
  tInt++;
  if(queued){
    var dx=queued.dx,dy=queued.dy;queued=null;
    if(dy>0){
      if(stam<2){say("力槽不足，稍等恢复");}
      else{stam-=2;hero.y++;}
    }else if(dy<0){hero.y--;}
    if(dx!==0)hero.x+=dx;
  }
  hero.x+=rowDir(hero.y);
  hero.x=((hero.x%COLS)+COLS)%COLS;
  if(hero.y<0){say("跌出井底！");gameOver();return;}
  if(personAt(hero.y,hero.x,tInt)){say("撞到人流！");gameOver();return;}
  if(hero.y>maxY){maxY=hero.y;score=maxY;scoreEl.textContent=String(score);}
  topY=Math.max(0,hero.y-3);
  var regen=(hero.y%4===0)?2:1;
  stam=Math.min(maxStam,stam+regen);
}

/* ---------- 渲染 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.shaft;ctx.fillRect(0,0,W,H);
  var r,c;
  for(r=topY;r<topY+ROWS+1;r++){
    var y=sy(r);
    if(y>H||y+cellH<0)continue;
    var landing=(r%4===0);
    ctx.fillStyle=landing?PAL.step:PAL.shaft;
    ctx.fillRect(0,y,W,cellH);
    ctx.fillStyle=PAL.stepine;
    for(c=0;c<COLS;c++)ctx.fillRect(c*cellW+cellW*0.1,y+cellH/2-1,cellW*0.8,2);
    if(rowDir(r)>0){
      ctx.fillStyle=PAL.stepine;
      ctx.fillRect(W-14,y+cellH*0.25,10,3);
      ctx.fillRect(W-14,y+cellH*0.65,10,3);
    }else{
      ctx.fillStyle=PAL.stepine;
      ctx.fillRect(4,y+cellH*0.25,10,3);
      ctx.fillRect(4,y+cellH*0.65,10,3);
    }
    for(c=0;c<COLS;c++){
      if(!personAt(r,c,tInt))continue;
      var cx=c*cellW+cellW/2,cy=y+cellH/2;
      ctx.fillStyle=PAL.crowd;
      ctx.beginPath();ctx.arc(cx,cy,cellW*0.26,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=PAL.crowd2;
      ctx.beginPath();ctx.arc(cx,cy-cellH*0.12,cellW*0.1,0,Math.PI*2);ctx.fill();
    }
  }
  // 主角
  var hx=hero.x*cellW+cellW/2,hy=sy(hero.y)+cellH/2;
  ctx.fillStyle=PAL.herodark;
  ctx.beginPath();ctx.arc(hx,hy,cellW*0.24,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.hero;
  ctx.beginPath();ctx.arc(hx,hy+cellH*0.08,cellW*0.17,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(hx-3,hy-2,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hx+3,hy-2,2,0,Math.PI*2);ctx.fill();
  // 力槽
  ctx.fillStyle=PAL.surface2;
  ctx.fillRect(0,0,W,5);
  ctx.fillStyle=PAL.primary;
  ctx.fillRect(0,0,W*(stam/maxStam),5);
}

/* ---------- 覆盖层 ---------- */
function showPanel(html){panel.innerHTML=html;overlay.classList.add("show");}
function hideOverlay(){overlay.classList.remove("show");}
function showStart(){
  showPanel(
    '<p class="rt">准备开始</p>'+
    '<p class="rs">电梯井中躲避升降人流 · 最高 <b>'+best+'</b></p>'+
    '<div class="rbtns"><button class="btn" id="ovMain" type="button">开始游戏</button></div>'+
    '<p class="rhint">每拍人物与扶梯移动一次。上跳消耗 2 格力槽，力槽每拍恢复（休息平台加倍）；撞人或跌出井底即失败。高度越大分值越高。</p>'
  );
  $("ovMain").addEventListener("click",function(){startGame();});
}
function showPause(){
  showPanel(
    '<p class="rt">已暂停</p>'+
    '<p class="rs">当前高度 <b>'+score+'</b></p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovRetryP" type="button">重新开始</button>'+
      '<button class="btn" id="ovResume" type="button">继续</button>'+
    '</div>'
  );
  $("ovResume").addEventListener("click",function(){togglePause();});
  $("ovRetryP").addEventListener("click",function(){resetRun();startGame();});
}
function showOver(isRecord){
  showPanel(
    '<p class="rt">游戏结束</p>'+
    '<p class="rs">到达高度 <b>'+score+'</b>'+(isRecord?' · 新纪录':'')+'</p>'+
    '<p class="rs">最高纪录 '+best+'</p>'+
    '<div class="rbtns"><button class="btn" id="ovRetry" type="button">再来一局</button></div>'
  );
  $("ovRetry").addEventListener("click",function(){resetRun();startGame();});
}

/* ---------- 输入 ---------- */
function queue(dx,dy){
  if(state!=="running"||paused)return;
  queued={dx:dx,dy:dy};
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  if(state!=="running"||paused)return;
  var r=cv.getBoundingClientRect();
  var px=(e.clientX-r.left)/r.width*W;
  var py=(e.clientY-r.top)/r.height*H;
  var hx=hero.x*cellW+cellW/2,hy=sy(hero.y)+cellH/2;
  var dx=px-hx,dy=py-hy;
  if(Math.abs(dx)>Math.abs(dy))queue(dx>0?1:-1,0);
  else queue(0,dy<0?1:-1);
});
var sx=0,sy0=0,tracking=false;
cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];sx=t.clientX;sy0=t.clientY;tracking=true;},{passive:true});
cv.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  if(!tracking)return;tracking=false;
  var t=e.changedTouches[0];
  var dx=t.clientX-sx,dy=t.clientY-sy0;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24){queue(0,1);return;}
  if(Math.abs(dx)>Math.abs(dy))queue(dx>0?1:-1,0);
  else queue(0,dy<0?1:-1);
});
document.addEventListener("keydown",function(e){
  if(e.repeat)return;
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowUp"||k==="w"){e.preventDefault();queue(0,1);}
  else if(k==="ArrowDown"||k==="s"){e.preventDefault();queue(0,-1);}
  else if(k==="ArrowLeft"||k==="a"){e.preventDefault();queue(-1,0);}
  else if(k==="ArrowRight"||k==="d"){e.preventDefault();queue(1,0);}
  else if(k===" "){e.preventDefault();if(state==="running")togglePause();else if(state==="ready"||state==="over")startGame();}
});
btnPause.addEventListener("click",togglePause);
btnMain.addEventListener("click",function(){
  if(state==="running"){resetRun();startGame();}
  else startGame();
});
document.addEventListener("visibilitychange",function(){if(document.hidden&&state==="running"&&!paused)togglePause();});

/* ---------- 主循环 ---------- */
function loop(now){
  requestAnimationFrame(loop);
  var dt=((now-lastFrame)/1000)||0.016;lastFrame=now;
  if(dt>0.05)dt=0.05;
  if(state==="running"&&!paused){
    acc+=dt*1000;
    while(acc>=TICK){acc-=TICK;tick();if(state!=="running")break;}
  }
  draw();
}

fit();
resetRun();
requestAnimationFrame(loop);
syncSaveFromServer();
showStart();
})();
</script>
