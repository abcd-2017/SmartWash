<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>点灯谜阵</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（棋盘外框 / 灯室地面 / 灯罩 / 灯光 / 目标星标）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-on-primary:#FFFFFF;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-hairline:#EFF1EE;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gap:16px;--g-lo-frame1:#C6D0C6;--g-lo-frame2:#98A79B;--g-lo-frame-hi:#E4EBE3;--g-lo-floor1:#F4F6F3;--g-lo-floor2:#E5EAE4;--g-lo-floor-hi:#FFFFFF;--g-lo-shade:#B98A2E;--g-lo-glow:#F6C945;--g-lo-glow-hi:#FFF0BE;--g-lo-target:#E8A44E;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-lo-frame1:#171A18;--g-lo-frame2:#0E110F;--g-lo-frame-hi:#39423C;--g-lo-floor1:#262A27;--g-lo-floor2:#1B1F1C;--g-lo-floor-hi:#4E5750;--g-lo-shade:#D9A84E;--g-lo-glow:#F2C14E;--g-lo-glow-hi:#FBE0A0;--g-lo-target:#E2A44E;color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 12px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.5; }
  .legend { display: inline-flex; align-items: center; gap: 5px; flex: none; font-size: 12px; color: var(--g-muted); }
  .legend .lamp-chip {
    width: 18px; height: 18px; border-radius: 6px; display: inline-block; flex: none;
    background: linear-gradient(160deg, var(--g-lo-floor1), var(--g-lo-floor2));
    box-shadow: inset 0 1px 0 var(--g-lo-floor-hi), inset 0 -1px 0 rgba(0,0,0,.14), var(--g-shadow);
  }
  .legend .lamp-chip.lit { background: linear-gradient(160deg, var(--g-lo-glow-hi), var(--g-lo-glow)); box-shadow: 0 2px 8px rgba(246,201,69,.45), inset 0 1px 0 var(--g-lo-glow-hi); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat {
    background: var(--g-surface2); border-radius: var(--g-radius-inner);
    padding: 6px 4px; text-align: center; line-height: 1.3; min-width: 0;
    animation: rise .38s ease-out both;
  }
  .stat:nth-child(2) { animation-delay: 40ms; }
  .stat:nth-child(3) { animation-delay: 80ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  /* 棋盘外框 = 厚边「面」+ 顶光 + 投影（替代细线表格感）；格室内凹「面」承载灯罩 */
  .board {
    position: relative; width: min(420px, 100%); margin: 0 auto;
    padding: 8px; border-radius: 16px;
    background: linear-gradient(180deg, var(--g-lo-frame1), var(--g-lo-frame2));
    box-shadow: 0 3px 14px rgba(20,40,30,.14), inset 0 1px 0 var(--g-lo-frame-hi), inset 0 -2px 0 rgba(0,0,0,.12);
    touch-action: manipulation;
  }
  .grid5 {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    padding: 2px;
  }
  .lamp {
    position: relative; aspect-ratio: 1; border: 0; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--g-lo-floor1), var(--g-lo-floor2));
    box-shadow: inset 0 1px 0 var(--g-lo-floor-hi), inset 0 -2px 0 rgba(0,0,0,.14), var(--g-shadow);
    transition: transform .14s ease-out, background .16s ease-out, box-shadow .16s ease-out, filter .16s ease-out;
    animation: rise .36s ease-out both;
  }
  .lamp:active { transform: scale(.96); }
  /* 亮灯：灯罩「面」渐变 + 顶光 + 外发光 + 落地投影 */
  .lamp.on {
    background: linear-gradient(160deg, var(--g-lo-glow-hi), var(--g-lo-glow) 55%, var(--g-lo-shade));
    box-shadow: 0 2px 14px rgba(246,201,69,.5), inset 0 1px 0 var(--g-lo-glow-hi), inset 0 -2px 0 rgba(120,80,10,.28);
  }
  .lamp .swi { font-size: clamp(16px, 5vw, 22px); line-height: 1; pointer-events: none; }
  /* 灯罩内灯泡：浅端 --g-text 近黑，对亮金黄灯罩渐变三档 5.46/10.82/14.96:1 达标；
     深端灯罩同为亮金黄渐变，近白 --g-text 仅 1.05/1.37/1.78:1（状态标识失效），
     故深端改深色 --g-bg，对同一渐变三档 8.37/10.84/14.09:1，亮/灭核心标识恢复可辨 */
  .lamp.on .swi { color: var(--g-text); }
  :root[data-theme=dark] .lamp.on .swi { color: var(--g-bg); }
  /* 目标态：灯罩右上角标目标星，提示「最优解本关」（角标为装饰标记，不是可点元素） */
  .lamp.star .mark {
    position: absolute; right: 5px; top: 5px; width: 9px; height: 9px;
    background: var(--g-lo-target); border-radius: 50% 50% 50% 4px;
    transform: rotate(45deg); pointer-events: none;
    box-shadow: 0 1px 3px rgba(120,80,10,.4), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .msg { min-height: 20px; margin: 12px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 10px; flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out;
  }
  .btn.primary { background: var(--g-btn-primary); color: var(--g-on-primary); }
  .btn:active { transform: scale(.96); }
  .btn[disabled] { opacity: .45; }
  .btn.on { background: var(--g-primary-soft); color: var(--g-on-soft); }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .3s ease-out;
  }
  .panel.win { animation: winpop .45s cubic-bezier(.18,.9,.3,1.4); }   /* 过关轻弹 */
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes winpop { 0% { transform: scale(.86); opacity: 0; } 62% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes valPop { 0% { transform: scale(1); } 45% { transform: scale(1.28); } 100% { transform: scale(1); } }
  .val-pop { display: inline-block; animation: valPop .34s ease-out; }   /* 战绩轻弹 */
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.7; }
  .panel .desc b { color: var(--g-primary-deep); font-size: 22px; }
  .panel .btn { width: 100%; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
/* SW 图标库：内联 SVG 线性图标（stroke=currentColor，24 viewBox，与 UI 令牌联动） */
window.SW_ICON=function(n,s){s=s||"";var P={
 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>','arrow-left':'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 'arrow-up':'<path d="M12 19V5M6 11l6-6 6 6"/>','arrow-down':'<path d="M12 5v14M6 13l6 6 6-6"/>',

 'star-o':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',
 'sun':'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>',

 'circle':'<circle cx="12" cy="12" r="5.5"/>','circle-f':'<circle cx="12" cy="12" r="5.5"/>',
 'tri-up':'<path d="M12 5l8 15H4z"/>','tri-down':'<path d="M12 19l-8-15h16z"/>','tri-left':'<path d="M5 12l15-8v16z"/>','tri-right':'<path d="M19 12L4 4v16z"/>',
 'backspace':'<path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z M12.5 9.5l5 5M17.5 9.5l-5 5"/>',
 'swap-h':'<path d="M7 4L3 8l4 4M3 8h14M17 12l4 4-4 4M21 16H7"/>'

var fill={ 'star':1,'circle-f':1,'tri-up':1,'tri-down':1,'tri-left':1,'tri-right':1 };
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};

<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<div class="wrap">
  <header><span class="sub">点灯会连带翻转十字五格 · 把亮灯全熄灭过关</span><span class="legend"><span class="lamp-chip lit" aria-hidden="true"></span>亮灯=要熄灭</span></header>
  <div class="stats">
    <div class="stat"><span class="label">关卡</span><span class="val" id="stLv">1</span></div>
    <div class="stat"><span class="label">步数</span><span class="val" id="stMoves">0</span></div>

  </div>

  <p class="msg" id="msg" role="status" aria-live="polite">点任意灯，十字五格一起翻转；亮灯全灭即过关</p>

</div>
<div class="overlay" role="dialog" aria-modal="true" id="overlay">

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 存档（本地 + 账号双写） ---------- */
var KEY="sw.lightsout.v1";
function loadSave(){try{var s=JSON.parse(localStorage.getItem(KEY))||{};
  return{lv:Math.max(1,parseInt(s.lv,10)||1),flags:Array.isArray(s.flags)?s.flags:[],daily:(s.daily&&typeof s.daily==="object")?s.daily:{}}}catch(e){return{lv:1,flags:[],daily:{}}}}
function pruneDaily(){var ks=Object.keys(save.daily).sort();while(ks.length>30)delete save.daily[ks.shift()]}
function saveGame(){pruneDaily();try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}
  if(GB.available)GB.saveState("lights-out",save).catch(function(){});}
var save=loadSave();
pruneDaily();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("lights-out").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),rlv=Math.max(1,parseInt(r.lv,10)||1),lvUp=false,starUp=false,dailyCh=false;
      if(rlv>save.lv){save.lv=rlv;lv=rlv;lvUp=true}
      if(Array.isArray(r.flags)){
        for(var i=0;i<r.flags.length;i++)if(r.flags[i]&&!flags[i]){flags[i]=true;save.flags=flags;starUp=true}
      }
      // 每日挑战：同日取更优（done/★ 优先，步数短者胜）
      if(r.daily&&typeof r.daily==="object"){for(var dk in r.daily){var rr=r.daily[dk];
        if(!rr||typeof rr!=="object")continue;
        var m=save.daily[dk]||(save.daily[dk]={done:false,moves:0,ref:0,star:false});
        var rm=+rr.moves||0;if(rr.done)m.done=true;if(rr.star)m.star=true;
        if(rm>0&&(!m.moves||rm<m.moves))m.moves=rm;dailyCh=true}
        pruneDaily()}
      if(lvUp||starUp||dailyCh){saveGame();if(dailyMode)paint();else if(lvUp)startLevel();else paint()}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 关卡数据（DB 下发优先，本地缓存兜底） ---------- */
var LEVELS_KEY="sw.lightsout.v1.levels",LEVELS_VER_KEY="sw.lightsout.v1.levels.ver",LEVELS=[];
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function parseLevels(res){
  if(!res||!Array.isArray(res.levels))return false;
  var list=[],i,j,d,n,lit;
  for(i=0;i<res.levels.length;i++){
    try{d=JSON.parse(res.levels[i].dataJson);}catch(e){return false}
    n=d&&d.n;lit=d&&d.lit;
    if(!Number.isInteger(n)||n<5||n>7||!Array.isArray(lit)||lit.length!==n*n)return false;
    for(j=0;j<lit.length;j++)if(lit[j]!==0&&lit[j]!==1)return false;
    list.push({n:n,lit:lit.slice()});
  }
  return list.length?list:false;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用缓存/程序化生成
  GB.getLevels("lights-out").then(function(res){
    var list=parseLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)&&!dailyMode)startLevel();
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var N=5,lamp=[],lit=[],moves=0,ref=0,lv=save.lv,flags=save.flags,done=false,builtN=5;
var dailyMode=false,dailyDate="";
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* 本地 UTC+8 日期，每日挑战唯一时间源 */
function todayStr(){return new Date(Date.now()+8*3600e3).toISOString().slice(0,10).replace(/-/g,"")}
function updDailyBtn(){
  var ds=todayStr(),rec=save.daily[ds],fin=!!(rec&&rec.done),b=$("btnDaily");
  b.innerHTML=SW_ICON('calendar')+"每日 "+ds.slice(4,6)+"-"+ds.slice(6)+(fin?SW_ICON('check'):"");
  b.classList.toggle("on",fin||dailyMode);
}
function starOn(){return dailyMode?!!(save.daily[dailyDate]&&save.daily[dailyDate].star):!!flags[lv-1]}
function kOf(n){return Math.min(20,6+n)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
/* ---------- 生成：从全灭反向执行 k 步，参考最优 = 出现奇数次的格数 ---------- */
function generate(){
  var k=kOf(lv),guard=0;
  do{
    lit=[];for(var i=0;i<N*N;i++)lit.push(false);
    var odd={},n;
    for(var s=0;s<k;s++){
      n=Math.floor(Math.random()*N*N);
      flipSim(n);
      odd[n]=!odd[n];
    }
    ref=0;for(var key in odd)if(odd[key])ref++;
  }while(ref<Math.min(6,k)&&guard++<60);
  moves=0;done=false;
}
function flipSim(n){
  var r=Math.floor(n/N),c=n%N;
  toggle(n);
  if(r>0)toggle(n-N);if(r<N-1)toggle(n+N);
  if(c>0)toggle(n-1);if(c<N-1)toggle(n+1);
}
function toggle(n){lit[n]=!lit[n]}
/* ---------- 参考最优 + 每日挑战纯函数块 ---------- */
/*DAILY-PURE-BEGIN*/
function hashKey(s){var h=0;for(var i=0;i<s.length;i++)h+=s.charCodeAt(i);return h%1000}
function seedForDate(ds){return(+ds)*31+hashKey("lights-out")}
function prng32(a){return function(){a=(a*1664525+1013904223)>>>0;return a/4294967296}}
/* 参考最优：GF(2) 解 A·x=lit 的权重（自由变量取 0；无解返回 -1） */
function refOf(l,n){
  var m=n*n,A=[],i,j,c,r,p,w=0;
  for(i=0;i<m;i++){r=(i/n)|0;c=i%n;var row=new Array(m+1);
    for(j=0;j<m;j++)row[j]=0;
    row[i]=1;if(r>0)row[i-n]=1;if(r<n-1)row[i+n]=1;if(c>0)row[i-1]=1;if(c<n-1)row[i+1]=1;
    row[m]=l[i];A.push(row);}
  for(c=0;c<m;c++){p=-1;for(r=w;r<m;r++)if(A[r][c]){p=r;break}
    if(p<0)continue;var t=A[w];A[w]=A[p];A[p]=t;
    for(r=0;r<m;r++)if(r!==w&&A[r][c])for(j=c;j<=m;j++)A[r][j]^=A[w][j];w++;}
  var cnt=0;
  for(r=0;r<m;r++){if(r<w){if(A[r][m])cnt++}else if(A[r][m])return -1}
  return cnt;
}
function flipCell(l,n,N){var r=(n/N)|0,c=n%N;l[n]=!l[n];
  if(r>0)l[n-N]=!l[n-N];if(r<N-1)l[n+N]=!l[n+N];if(c>0)l[n-1]=!l[n-1];if(c<N-1)l[n+1]=!l[n+1]}
/* 每日：seed→k=6+seed%15，反向走 k 步保证可解 */
function dailyGenerate(seed){
  var N=5,k=6+(seed%15),rnd=prng32(seed>>>0),lit=[],i,s,n;
  lit=[];for(i=0;i<N*N;i++)lit.push(false);
  for(s=0;s<k;s++){n=Math.floor(rnd()*N*N);flipCell(lit,n,N)}
  return{lit:lit,ref:refOf(lit,N)};
}
/* 每日挑战：按日期 seed 生成，失败 seed+1 重试 */
function dailyBoardFor(ds,tries){
  var t=tries||8,s=seedForDate(ds),r=null,i;
  for(i=0;i<t;i++){r=dailyGenerate(s+i);if(r.ref>=3)break;r=null}
  return r?{lit:r.lit,ref:r.ref,seed:s}:null;
}
/*DAILY-PURE-END*/
/* ---------- 渲染 ---------- */
function buildGrid(){
  var g=$("grid");g.innerHTML="";lamp=[];
  g.style.gridTemplateColumns="repeat("+N+",1fr)";builtN=N;
  for(var i=0;i<N*N;i++){
    var b=document.createElement("button");
    b.className="lamp";
    b.setAttribute("aria-label","灯 "+i+"，灭");
    b.addEventListener("click",function(){
      if(done)return;
      var i=+this.dataset.i;
      flipSim(i);moves++;paint();updStats("moves");checkWin();
    });
    b.dataset.i=i;
    g.appendChild(b);lamp.push(b);
  }
}
function litCount(){var n=0,i;for(i=0;i<N*N;i++)if(lit[i])n++;return n}
function paint(){
  var st=starOn();
  for(var i=0;i<N*N;i++){
    lamp[i].className="lamp"+(lit[i]?" on":"")+(st?" star":"");
    lamp[i].innerHTML=(lit[i]?SW_ICON('bulb'):"")+(st?'<span class="mark" aria-hidden="true"></span>':"");
    lamp[i].setAttribute("aria-label","灯 "+i+"，"+(lit[i]?"亮":"灭"));
  }
}
/* 数据数字轻弹：步数/剩余变化时给一下「得分/过关轻弹」反馈（reduced-motion 时跳过） */
function popVal(id){
  if(window.__gRM)return;
  var el=$(id);if(!el)return;
  el.classList.remove("val-pop");void el.offsetWidth;el.classList.add("val-pop");
}
function updStats(pop){
  $("stLv").textContent=lv;
  $("stMoves").textContent=moves;
  $("stLit").textContent=litCount();
  $("btnPrev").disabled=dailyMode||lv<=1;
  $("btnReset").innerHTML=SW_ICON('rotate')+(dailyMode?"重玩本日":"重开本关");
  if(pop)popVal(pop==="moves"?"stMoves":"stLit");
}
function checkWin(){
  var allOff=true;
  for(var i=0;i<N*N;i++)if(lit[i]){allOff=false;break}
  if(!allOff)return;
  done=true;
  var best=ref;
  if(dailyMode){
    // 每日挑战：只写本地/账号存档，不进排行榜
    var rec=save.daily[dailyDate]||(save.daily[dailyDate]={done:false,moves:0,ref:ref,star:false});
    rec.done=true;
    if(!rec.moves||moves<rec.moves)rec.moves=moves;
    if(moves<=ref)rec.star=true;
    saveGame();paint();
    $("ovTitle").innerHTML="每日挑战完成 "+SW_ICON('check');
    $("ovDesc").innerHTML="每日 "+dailyDate.slice(4,6)+"-"+dailyDate.slice(6)+
      "<br>用步 <b>"+moves+"</b> / 参考最优 "+best+(moves<=ref?"<br>"+SW_ICON('star')+" 最优解！":"");
    $("ovBtn").innerHTML=SW_ICON('rotate')+"再玩本日";
  }else{
    if(moves<=ref)flags[lv-1]=true;
    saveGame();paint();
    // 成绩上报（最高关卡 desc：越大越好；附 ★ 数）
    if(GB.available)GB.reportScore("lights-out",{metricValue:lv,metricExtra:flags.filter(Boolean).length}).catch(function(){});
    $("ovTitle").textContent="第 "+lv+" 关 过关！";
    $("ovDesc").innerHTML="用步 <b>"+moves+"</b> / 参考最优 "+best+
      (moves<=ref?"<br>"+SW_ICON('star')+" 最优解！":"<br>试试更少的步数拿 "+SW_ICON('star'))+
      (lv>50?"<br>无尽模式 · 随机阵型":"");
    $("ovBtn").innerHTML=SW_ICON('arrow-right')+"下一关";
  }
  var panel=document.querySelector(".panel");
  if(panel&&!window.__gRM){panel.classList.remove("win");void panel.offsetWidth;panel.classList.add("win");}
  $("overlay").classList.add("show");
  say("漂亮！"+(moves<=ref?"最优过关":"用了 "+moves+" 步"));
  updDailyBtn();
}
/* 进关入场：棋盘格错落浮起一次（reduced-motion 时跳过） */
function staggerIn(){
  if(window.__gRM)return;
  for(var i=0;i<lamp.length;i++)lamp[i].style.animationDelay=(i%N)*36+"ms";
  setTimeout(function(){for(var j=0;j<lamp.length;j++)lamp[j].style.animationDelay=""},420);
}
function startLevel(){
  var d=LEVELS.length&&lv<=LEVELS.length?LEVELS[lv-1]:null;
  if(d){N=d.n;lit=d.lit.slice();ref=refOf(lit,N);}
  else{N=5;generate();}
  moves=0;done=false;
  if(builtN!==N)buildGrid();
  paint();updStats();
  var endless=!d;
  $("stLv").textContent=endless?lv+" · 无尽":lv;
  say("第 "+lv+" 关 · 参考最优 "+ref+" 步");
  staggerIn();
}
/* 每日挑战：本地 seed 生成，绕过 DB 关卡 */
function startDaily(){
  var ds=todayStr(),b=dailyBoardFor(ds);
  if(!b){say("每日挑战题目生成失败，请稍后重试");return}
  dailyMode=true;dailyDate=ds;
  N=5;lit=b.lit.slice();ref=b.ref;moves=0;done=false;
  if(builtN!==N)buildGrid();
  paint();updStats();
  $("stLv").textContent="每日 "+ds.slice(4,6)+"-"+ds.slice(6);
  say("每日挑战 · 参考最优 "+ref+" 步");
  updDailyBtn();
  staggerIn();
}
/* ---------- 输入 ---------- */
$("btnReset").addEventListener("click",function(){dailyMode?startDaily():startLevel()});
$("btnPrev").addEventListener("click",function(){
  if(!dailyMode&&lv>1){lv--;saveGame();startLevel()}
});
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(dailyMode)startDaily();
  else{lv++;saveGame();startLevel()}
});
$("btnDaily").addEventListener("click",startDaily);
buildGrid();startLevel();updDailyBtn();
syncSaveFromServer();syncLevelsFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  function $(id){return document.getElementById(id)}
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  /* 静态标签按钮文字前注入内联 SVG 图标（SW_ICON：24 viewBox / currentColor / aria-hidden）；
     btnReset / btnDaily 的标签会随模式改写，图标由 updStats / updDailyBtn 自带 */
  function icon(id,name){var b=$(id);if(b)b.insertAdjacentHTML("afterbegin",window.SW_ICON(name));}
  icon("btnPrev","arrow-left");
  var ft=document.querySelector(".foot .swi");
  if(ft)ft.outerHTML=window.SW_ICON("star");
})();
</script>
