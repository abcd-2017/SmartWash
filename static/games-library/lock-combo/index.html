/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 调色板（颜色全部经 CSS 变量读取，JS 零颜色字面量） ========== */

    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    onSoft:v("--g-on-soft"),onPrimary:v("--g-on-primary"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),

/* ========== 通用工具与覆盖层面板 ========== */
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
var overlayEl=$("overlay"),panelEl=$("panel");
function showPanel(html){panelEl.innerHTML=html;overlayEl.classList.add("show");}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}

/* ==================== 密码推理（条件线索消元，关卡驱动，纯 DOM） ==================== */
var GAME_KEY="lock-combo",SAVE_KEY="sw.lockcombo.v1";
var LEVELS_KEY="sw.lockcombo.v1.levels",LEVELS_VER_KEY="sw.lockcombo.v1.levels.ver";

/*XC-CORE-BEGIN*/
var GEN={};
function lcSeed(no){return no*7907+2017;}
function lcRng(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
/* 线索语义（生成器与验证器共用同一含义表，独立于玩法交互） */
function lcSat(c,a){
  switch(c.t){
    case "pd":return a[c.p-1]===c.d;
    case "pp":return (a[c.p-1]%2===0)===(c.par===0);
    case "pg":return c.gt?a[c.p-1]>c.d:a[c.p-1]<c.d;
    case "ct":return a.indexOf(c.d)>=0;
    case "nc":return a.indexOf(c.d)<0;
    case "sa":return a[0]+a[1]+a[2]===c.s;
    case "nr":return a[0]!==a[1]&&a[1]!==a[2]&&a[0]!==a[2];
    case "rp":return a[0]===a[1]||a[1]===a[2]||a[0]===a[2];
    case "mx":return Math.max(a[0],a[1],a[2])===c.d;
    case "mn":return Math.min(a[0],a[1],a[2])===c.d;
    case "po":return a[c.i-1]>a[c.j-1];
    default:return false;
  }
}
function lcText(c){
  switch(c.t){
    case "pd":return "第"+c.p+"位是 "+c.d;
    case "pp":return "第"+c.p+"位是"+(c.par===0?"偶数":"奇数");
    case "pg":return "第"+c.p+"位"+(c.gt?"大于":"小于")+" "+c.d;
    case "ct":return "密码中含有数字 "+c.d;
    case "nc":return "密码中不含数字 "+c.d;
    case "sa":return "三位数字之和为 "+c.s;
    case "nr":return "三位数字互不重复";
    case "rp":return "密码中有重复数字";
    case "mx":return "最大数字是 "+c.d;
    case "mn":return "最小数字是 "+c.d;
    case "po":return "第"+c.i+"位比第"+c.j+"位大";
    default:return "?";
  }
}
/* 枚举 1..hi 的全部三位组合，返回满足全部线索的解列表 */
function lcSolutions(clues,hi){
  var out=[],a,i,ok;
  for(var x=1;x<=hi;x++)for(var y=1;y<=hi;y++)for(var z=1;z<=hi;z++){
    a=[x,y,z];ok=true;
    for(i=0;i<clues.length;i++)if(!lcSat(clues[i],a)){ok=false;break;}
    if(ok)out.push(a);
  }
  return out;
}
function lcClueWellFormed(c,hi){
  if(!c||typeof c.t!=="string")return false;
  function dgt(v){return Number.isInteger(v)&&v>=1&&v<=hi;}
  switch(c.t){
    case "pd":case "pp":case "pg":return dgt(c.p)&&c.p<=3&&(c.t==="pp"?c.par===0||c.par===1:dgt(c.d))&&(c.t!=="pg"||(c.gt===true||c.gt===false));
    case "ct":case "nc":case "mx":case "mn":return dgt(c.d);
    case "sa":return Number.isInteger(c.s)&&c.s>=3&&c.s<=hi*3;
    case "nr":case "rp":return c.v===1;
    case "po":return dgt(c.i)&&dgt(c.j)&&c.i!==c.j;
    default:return false;
  }
}
/* 生成：随机密码 → 收集全部真线索 → 贪心加入直至解空间收敛到唯一 */
GEN.gen=function(no,seed){
  var p=(no-1)/39;
  var hi=5+Math.floor(p*4);
  var maxClues=2+Math.floor(p*4);
  var s=(seed==null?lcSeed(no):seed);
  for(var att=0;att<120;att++){
    var lv=GEN.build(no,s+att*7919,hi,maxClues,no>10);
    if(lv&&GEN.validate(lv).ok)return lv;
  }
  return GEN.build(no,987654,5,6,false);
};
GEN.build=function(no,seed,hi,maxClues,allowDirect){
  var rng=lcRng(seed);
  var code=[1+Math.floor(rng()*hi),1+Math.floor(rng()*hi),1+Math.floor(rng()*hi)];
  var pool=[],i,j,d;
  if(allowDirect)for(i=1;i<=3;i++)pool.push({t:"pd",p:i,d:code[i-1]});
  for(i=1;i<=3;i++)pool.push({t:"pp",p:i,par:code[i-1]%2});
  for(i=1;i<=3;i++)for(d=1;d<hi;d++){
    if(code[i-1]>d)pool.push({t:"pg",p:i,d:d,gt:true});
    if(code[i-1]<d)pool.push({t:"pg",p:i,d:d,gt:false});
  }
  var hasDup=code[0]===code[1]||code[1]===code[2]||code[0]===code[2];
  for(d=1;d<=hi;d++){
    if(code.indexOf(d)>=0)pool.push({t:"ct",d:d});
    else pool.push({t:"nc",d:d});
  }
  pool.push({t:"sa",s:code[0]+code[1]+code[2]});
  pool.push(hasDup?{t:"rp",v:1}:{t:"nr",v:1});
  pool.push({t:"mx",d:Math.max(code[0],code[1],code[2])});
  pool.push({t:"mn",d:Math.min(code[0],code[1],code[2])});
  for(i=1;i<=3;i++)for(j=1;j<=3;j++)if(i!==j&&code[i-1]>code[j-1])pool.push({t:"po",i:i,j:j});
  /* 洗牌 */
  for(i=pool.length-1;i>0;i--){var k=Math.floor(rng()*(i+1)),tmp=pool[i];pool[i]=pool[k];pool[k]=tmp;}
  var clues=[],sols=lcSolutions(clues,hi).length;
  for(i=0;i<pool.length&&clues.length<maxClues&&sols>1;i++){
    var best=-1,bestCnt=sols;
    for(j=i;j<pool.length;j++){
      var trial=clues.concat([pool[j]]);
      var c=lcSolutions(trial,hi).length;
      if(c<bestCnt){bestCnt=c;best=j;if(c===1)break;}
    }
    if(best<0)break;
    var sw=pool[i];pool[i]=pool[best];pool[best]=sw;
    clues.push(pool[i]);
    sols=bestCnt;
  }
  if(sols!==1||clues.length<2)return null;
  var fin=lcSolutions(clues,hi);
  if(fin.length!==1||fin[0][0]!==code[0]||fin[0][1]!==code[1]||fin[0][2]!==code[2])return null;
  return {name:"密码·"+(no<10?"0"+no:no),no:no,seed:seed,hi:hi,code:code,clues:clues};
};
/* 独立验证器：线索结构合法 + 全枚举复核解唯一且等于密码 */
GEN.validate=function(lv){
  if(!lv||typeof lv!=="object")return{ok:false,why:"shape"};
  if(!Number.isInteger(lv.hi)||lv.hi<5||lv.hi>9)return{ok:false,why:"hi"};
  if(!Array.isArray(lv.code)||lv.code.length!==3)return{ok:false,why:"code"};
  for(var i=0;i<3;i++)if(!(Number.isInteger(lv.code[i])&&lv.code[i]>=1&&lv.code[i]<=lv.hi))return{ok:false,why:"digit"};
  if(!Array.isArray(lv.clues)||lv.clues.length<2||lv.clues.length>6)return{ok:false,why:"clues"};
  for(i=0;i<lv.clues.length;i++)if(!lcClueWellFormed(lv.clues[i],lv.hi))return{ok:false,why:"clue"+i};
  var sols=lcSolutions(lv.clues,lv.hi);
  if(sols.length!==1)return{ok:false,why:"sols"+sols.length};
  if(sols[0][0]!==lv.code[0]||sols[0][1]!==lv.code[1]||sols[0][2]!==lv.code[2])return{ok:false,why:"mismatch"};
  return{ok:true,why:""};
};
GEN.validateLevelsAll=function(){
  var fails=[],n=0;
  for(var no=1;no<=40;no++){
    var lv=GEN.gen(no,lcSeed(no));
    var r=GEN.validate(lv);
    if(!r.ok)fails.push(no+"("+r.why+")");
    n++;
  }
  return {total:n,fails:fails,allOk:fails.length===0};
};
globalThis.__XC=GEN;
/*XC-CORE-END*/

/* ---------- 默认关卡（确定性种子，40 关） ---------- */
var DEFAULT_LEVELS=[];
(function(){
  for(var no=1;no<=40;no++)DEFAULT_LEVELS.push({name:"密码·"+(no<10?"0"+no:no),no:no,seed:lcSeed(no),difficulty:Math.min(6,1+Math.floor((no-1)/7))});
})();
var LEVELS=DEFAULT_LEVELS;
var save=loadSaveData();
var cur=Math.min(save.lv,LEVELS.length-1);

/* ---------- 状态 ---------- */
var course=null,mistakes=0,state="ready",paused=false;
var guess=[1,1,1],selPos=0,badTimer=null;
var stLv=$("stLv"),stClue=$("stClue"),stMiss=$("stMiss"),msgEl=$("msg"),cluesEl=$("clues");
var btnSubmit=$("btnSubmit"),btnLevels=$("btnLevels");
var dEls=[$("d0"),$("d1"),$("d2")];
function say(t){msgEl.textContent=t;}
function totalStars(){var t=0,k;for(k in save.done)t+=save.done[k];return t;}
function refresh(){
  stLv.textContent=(cur+1)+"/"+LEVELS.length;
  stClue.textContent=course?String(course.clues.length):"0";
  stMiss.textContent=mistakes+"/3";
}

/* ---------- 关卡流程 ---------- */
function loadLevel(idx){
  idx=Math.max(0,Math.min(idx,LEVELS.length-1));
  cur=idx;
  var d=LEVELS[idx];
  course=GEN.gen(d.no,d.seed==null?lcSeed(d.no):d.seed);
  var chk=GEN.validate(course);
  if(!chk.ok)course=GEN.gen(d.no,lcSeed(d.no));
  mistakes=0;state="ready";paused=false;
  guess=[1,1,1];selPos=0;
  if(badTimer){clearTimeout(badTimer);badTimer=null;}
  refresh();renderClues();renderDigits();
}
function enterLevel(i){loadLevel(i);showStart();}
function startPlay(){
  state="running";paused=false;
  hideOverlay();
  say("读线索，调数字，回车验证");
}
function selectClosed(){showStart();}
function totalStarsNow(){return totalStars();}
function winLevel(){
  state="over";
  var stars=mistakes===0?3:mistakes===1?2:1;
  var old=parseInt(save.done[cur],10)||0;
  if(stars>old)save.done[cur]=stars;
  save.best=totalStars();
  if(cur+1>save.lv)save.lv=cur+1;
  persistSave();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:save.lv,metricExtra:save.best}).catch(function(){});
  refresh();
  showWin(stars);
}
function failLevel(){
  state="over";
  showFail();
}
function submitGuess(){
  if(state!=="running"||paused||!course)return;
  var hit=guess[0]===course.code[0]&&guess[1]===course.code[1]&&guess[2]===course.code[2];
  if(hit){winLevel();return;}
  var bad=[];
  for(var i=0;i<course.clues.length;i++)if(!lcSat(course.clues[i],guess))bad.push(i);
  mistakes++;refresh();
  var chips=cluesEl.querySelectorAll(".clue");
  for(var j=0;j<bad.length;j++)if(chips[bad[j]])chips[bad[j]].classList.add("bad");
  if(badTimer)clearTimeout(badTimer);
  badTimer=setTimeout(function(){
    for(var j=0;j<chips.length;j++)chips[j].classList.remove("bad");
  },1600);
  if(mistakes>=3){failLevel();return;}
  say("不正确 · 违反第 "+bad.map(function(x){return x+1;}).join("、")+" 条线索 · 剩余 "+(3-mistakes)+" 次");
}

/* ---------- DOM 渲染 ---------- */
function renderClues(){
  var html="";
  for(var i=0;i<course.clues.length;i++){
    html+='<div class="clue"><span class="no">'+(i+1)+'</span><span>'+esc(lcText(course.clues[i]))+'</span></div>';
  }
  cluesEl.innerHTML=html;
}
function renderDigits(){
  var hi=course?course.hi:9;
  for(var i=0;i<3;i++){
    dEls[i].textContent=String(guess[i]);
    dEls[i].classList.toggle("cur",i===selPos);
    $("d"+i+"u").disabled=guess[i]>=hi;
    $("d"+i+"d").disabled=guess[i]<=1;
  }
}
function nudge(pos,delta){
  if(state!=="running"||paused||!course)return;
  var hi=course.hi;
  guess[pos]=clamp(guess[pos]+delta,1,hi);
  renderDigits();
}
function setPos(p){selPos=p;renderDigits();}

/* ---------- 输入 ---------- */
(function bind(){
  for(var i=0;i<3;i++){
    (function(i){
      $("d"+i+"u").addEventListener("click",function(){nudge(i,1);this.blur();});
      $("d"+i+"d").addEventListener("click",function(){nudge(i,-1);this.blur();});
      dEls[i].addEventListener("pointerdown",function(){setPos(i);});
    })(i);
  }
})();
window.addEventListener("keydown",function(e){
  if(e.repeat)return;
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowLeft"){e.preventDefault();setPos((selPos+2)%3);}
  else if(k==="ArrowRight"){e.preventDefault();setPos((selPos+1)%3);}
  else if(k==="ArrowUp"){e.preventDefault();nudge(selPos,1);}
  else if(k==="ArrowDown"){e.preventDefault();nudge(selPos,-1);}
  else if(k>="1"&&k<="9"){
    if(course&&parseInt(k,10)<=course.hi&&state==="running"&&!paused){
      guess[selPos]=parseInt(k,10);
      selPos=(selPos+1)%3;
      renderDigits();
    }
  }
  else if(k==="Backspace"){e.preventDefault();selPos=(selPos+2)%3;renderDigits();}
  else if(k==="Enter"||k===" "){
    if(state==="running"&&!paused){e.preventDefault();submitGuess();}
    else if(state==="ready"||state==="over"){e.preventDefault();retry();}
  }
});
btnSubmit.addEventListener("click",function(){submitGuess();this.blur();});
btnLevels.addEventListener("click",function(){
  if(state==="running"&&!paused){paused=true;say("选关中");}
  openLevelSelect();this.blur();
});

/* ---------- 覆盖层 ---------- */
function showStart(){
  showPanel(
    '<p class="rt">第 '+(cur+1)+' 关 · '+esc(course.name)+'</p>'+
    '<p class="rs">'+course.clues.length+' 条线索 · 数字范围 1-'+course.hi+' · '+3+' 次机会</p>'+
    '<div class="rbtns"><button class="btn" id="ovMain" type="button">开始</button></div>'+
    '<p class="rhint">所有线索同时为真的三位密码只有一组。猜错时会标红违反的线索，帮你排除错误方向。</p>'
  );
  $("ovMain").addEventListener("click",function(){startPlay();});
}
function showWin(stars){
  var last=cur>=LEVELS.length-1;
  showPanel(
    '<p class="rt">破译成功！</p>'+
    '<p class="rs">密码 <b>'+course.code.join("")+'</b> · 星星 '+stars+' / 3</p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovReplay" type="button">重玩</button>'+
      '<button class="btn" id="ovNext" type="button">'+(last?"已完成全部":"下一关")+'</button>'+
    '</div>'
  );
  $("ovNext").addEventListener("click",function(){enterLevel(last?cur:cur+1);});
  $("ovReplay").addEventListener("click",function(){enterLevel(cur);});
}
function showFail(){
  showPanel(
    '<p class="rt">本关失败</p>'+
    '<p class="rs">3 次尝试均不正确</p>'+
    '<p class="rhint">提示：先排除「不含」「大于 / 小于」这类范围线索，再用求和与奇偶收口。</p>'+
    '<div class="rbtns"><button class="btn" id="ovRetryF" type="button">重试本关</button></div>'
  );
  $("ovRetryF").addEventListener("click",function(){retry();});
}
function showPause(){
  showPanel(
    '<p class="rt">已暂停</p>'+
    '<p class="rs">线索 '+course.clues.length+' 条 · 已用 '+mistakes+' / 3 次机会</p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovReP" type="button">重玩本关</button>'+
      '<button class="btn" id="ovReR" type="button">继续</button>'+
    '</div>'
  );
  $("ovReR").addEventListener("click",function(){paused=false;hideOverlay();});
  $("ovReP").addEventListener("click",function(){retry();});
}
function retry(){loadLevel(cur);startPlay();}

/* 切后台自动暂停 */
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running"&&!paused&&!overlayEl.classList.contains("show")){
    paused=true;showPause();
  }
});

/* ---------- 启动 ---------- */
refresh();
loadLevel(cur);
showStart();
syncLevelsFromServer();
syncSaveFromServer();
window.__validateLevels=GEN.validateLevelsAll;


/* ========== 关卡公共段（DB 下发优先 + localStorage 版本缓存 + 包内默认关兜底；仅函数声明，供游戏段调用） ========== */
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!d||typeof d.name!=="string"||!d.name.trim()||!Number.isInteger(d.no)||d.no<1||!Number.isInteger(d.seed))return null;
    if(seen[d.no])return null;
    seen[d.no]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||list.length<DEFAULT_LEVELS.length)return false;
  for(var i=0;i<list.length;i++){
    var d=list[i],lv;
    try{lv=GEN.gen(d.no,d.seed);}catch(e){return false;}
    if(!lv||!GEN.validate(lv).ok)return false;
  }
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length>=DEFAULT_LEVELS.length){
      for(var i=0;i<list.length;i++){var d=list[i];if(!d||!Number.isInteger(d.no)||!Number.isInteger(d.seed))return v;}
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      if(save.lv>LEVELS.length-1)save.lv=LEVELS.length-1;
      persistSave();loadLevel(cur);
    }
  }).catch(function(){});
}
function loadSaveData(){
  try{
    var s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    if(s&&typeof s==="object"){
      var done={};
      if(s.done&&typeof s.done==="object")for(var k in s.done){var v=parseInt(s.done[k],10);if(v>0)done[k]=v;}
      return{lv:Math.max(0,parseInt(s.lv,10)||0),done:done,best:Math.max(0,parseInt(s.best,10)||0)};
    }
  }catch(e){}
  return{lv:0,done:{},best:0};
}
function persistSave(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(remote.lv,10)||0;if(rl>save.lv){save.lv=rl;changed=true;}
      var rb=parseInt(remote.best,10)||0;if(rb>save.best){save.best=rb;changed=true;}
      if(remote.done&&typeof remote.done==="object")for(var k in remote.done){
        var rv=parseInt(remote.done[k],10)||0,mv=parseInt(save.done[k],10)||0;
        if(rv>mv){save.done[k]=rv;changed=true;}
      }
      if(changed){persistSave();}
    }catch(e){}
  }).catch(function(){});
}
function openLevelSelect(){
  var html='<p class="rt">选择关卡</p><p class="rs">已过关卡标绿，灰色未解锁</p><div class="lv-wrap"><div class="lv-grid">';
  for(var i=0;i<LEVELS.length;i++){
    var done=parseInt(save.done[i],10)>0;
    var locked=i>save.lv;
    html+='<button class="lv-chip'+(i===cur?" sel":"")+(done?" done":"")+'" data-i="'+i+'"'+(locked?" disabled":"")+' type="button">'+(i+1)+'</button>';
  }
  html+='</div></div><div class="rbtns"><button class="btn ghost" id="ovClose" type="button">返回</button></div>';
  showPanel(html);
  var chips=panelEl.querySelectorAll(".lv-chip");
  for(var j=0;j<chips.length;j++){
    chips[j].addEventListener("click",function(){
      var i=parseInt(this.getAttribute("data-i"),10);
      hideOverlay();enterLevel(i);
    });
  }
  $("ovClose").addEventListener("click",function(){hideOverlay();selectClosed();});
}

})();
</script>
