<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>踩木过河</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材（--g-st- 前缀）*/
  :root {
    --g-bg:#F5F6F3; --g-surface:#FFFFFF; --g-surface2:#EFF1EE;
    --g-primary:#2D9B6A; --g-primary-deep:#17734A; --g-btn-primary:#17734A; --g-primary-soft:#E8F6EF; --g-on-primary:#FFFFFF; --g-on-soft:#0B3625;
    --g-text:#1C1C1E; --g-muted:#6B6E73; --g-faint:#A9AEA9; --g-border:#E6E9E6; --g-hairline:#EFF1EE;
    --g-danger:#A83850; --g-warning:#9A6210; --g-success:#17734A; --g-water:#4A9FD4;
    --g-scrim:rgba(245,246,243,.9);
    --g-shadow:0 2px 12px rgba(20,40,30,.05);
    --g-radius:16px; --g-radius-btn:14px; --g-radius-inner:12px; --g-gap:16px;
    --g-st-water:#A9D4EE; --g-st-water2:#C8E6F7; --g-st-log:#B08356; --g-st-logline:#7A5A38;
    --g-st-bank:#8FC98A; --g-st-frog:#2D9B6A; --g-st-frogdark:#17734A;
    color-scheme:light;
  }
  :root[data-theme=dark] {
    --g-bg:#141614; --g-surface:#1D201E; --g-surface2:#262A27;
    --g-primary-deep:#5BC894; --g-primary-soft:#1D3229; --g-on-soft:#B9E8CF;
    --g-text:#E6E9E6; --g-muted:#A9AEA9; --g-faint:#7E837D; --g-border:#2C312D; --g-hairline:#262A27;
    --g-danger:#DB7186; --g-warning:#E2A44E; --g-success:#4ADE6E; --g-water:#6BB4DE;
    --g-scrim:rgba(20,22,20,.9);
    --g-shadow:0 2px 12px rgba(0,0,0,.28);
    --g-st-water:#1E3A4A; --g-st-water2:#274C5F; --g-st-log:#6B4E32; --g-st-logline:#4A3420;
    --g-st-bank:#2A4630; --g-st-frog:#5BC894; --g-st-frogdark:#4ADE6E;
    color-scheme:dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.5; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 12px;
    min-width: 74px; padding: 5px 10px; text-align: center; line-height: 1.3;
  }
  .score-box .label { display: block; font-size: 12px; opacity: .85; white-space: nowrap; }
  .score-box .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stage { position: relative; }
  canvas {
    display: block; width: 100%; aspect-ratio: 3 / 4; height: auto;
    background: var(--g-st-water);
    border: 1px solid var(--g-border); border-radius: 12px;
    touch-action: none;
  }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 16px; flex: 1;
    border: 0; border-radius: 14px;
    background: var(--g-btn-primary); color: var(--g-on-primary);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    touch-action: manipulation;
  }
  .btn:active { opacity: .85; }
  .btn.ghost { background: var(--g-surface2); color: var(--g-text); border: 1px solid var(--g-border); }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .panel {
    width: 100%; max-width: 320px; max-height: 100%; overflow: auto;
    background: var(--g-surface); border: 1px solid var(--g-border); border-radius: 16px;
    box-shadow: var(--g-shadow); padding: 22px 18px; text-align: center;
  }
  .rt { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
  .rs { margin: 0 0 14px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .rs b { color: var(--g-primary-deep); font-size: 22px; font-variant-numeric: tabular-nums; }
  .rbtns { display: flex; gap: 10px; margin-top: 16px; }
  .rbtns .btn { flex: 1; }
  .rhint { margin: 14px 0 0; font-size: 12px; color: var(--g-muted); line-height: 1.6; text-align: left; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（动效层指令，不受 §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见 */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <span class="sub">跳上滚动原木横渡 · 站不住即落水</span>
    <div class="scores">
      <div class="score-box"><span class="label">分数</span><span class="val" id="score">0</span></div>
      <div class="score-box"><span class="label">最高分</span><span class="val" id="best">0</span></div>
    </div>
  </header>
  <div class="stage"><canvas id="cv" role="img" aria-label="踩木过河河面"></canvas></div>
  <p class="msg" id="msg" role="status" aria-live="polite">点击「开始」下河</p>
  <div class="tools">
    <button class="btn ghost" id="btnPause" type="button" disabled>暂停</button>
    <button class="btn" id="btnMain" type="button">开始游戏</button>
  </div>
  <p class="foot">上/下 hop 换行 · 左/右 调整站位 · 落水或被原木带出屏幕即失败</p>
</div>
<div class="overlay" role="dialog" aria-modal="true" id="overlay">
  <div class="panel" id="panel"></div>
</div>
<script>
/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
"use strict";
(() => {
/* ========== 游戏桥适配层（存档/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 调色板：canvas 颜色全部读 CSS 变量，JS 零颜色字面量 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim();}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),border:v("--g-border"),
    water:v("--g-st-water"),water2:v("--g-st-water2"),log:v("--g-st-log"),logline:v("--g-st-logline"),
    bank:v("--g-st-bank"),frog:v("--g-st-frog"),frogdark:v("--g-st-frogdark")};
}
window.__gOnTheme=function(){palLoad();draw();};
palLoad();

var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var scoreEl=document.getElementById("score"),bestEl=document.getElementById("best");
var msgEl=document.getElementById("msg"),btnPause=document.getElementById("btnPause"),btnMain=document.getElementById("btnMain");
var overlay=document.getElementById("overlay"),panel=document.getElementById("panel");
function $(id){return document.getElementById(id);}
function say(t){msgEl.textContent=t;}

var KEY="sw.loghop.v1";
var store={
  get:function(k){try{return window.localStorage.getItem(k);}catch(e){return null;}},
  set:function(k,v){try{window.localStorage.setItem(k,v);}catch(e){}}
};
var best=0;
try{best=Math.max(0,parseInt(JSON.parse(store.get(KEY)||"null").best,10)||0);}catch(e){}
bestEl.textContent=best;
function persistBest(){
  store.set(KEY,JSON.stringify({best:best}));
  if(GB.available)GB.saveState("log-hop",{best:best}).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("log-hop").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rb=Math.max(0,parseInt(JSON.parse(res.stateJson).best,10)||0);
      if(rb>best){best=rb;bestEl.textContent=best;persistBest();}
    }catch(e){}
  }).catch(function(){});
}

/* ---------- 常量与状态 ---------- */
var LANES=8,BANK=36,HOP_MS=170;
var W=0,H=0,dpr=1,rowH=0,riverTop=0,riverBottom=0;
var logs=[],frog={x:0,y:0,lane:0},hop=null,score=0,crossings=0;
var state="ready",paused=false,lastFrame=0,spawnTimers=[];
var difficulty=0;
function laneY(lane){return riverTop+(lane+0.5)*rowH;}
function topBankY(){return BANK*0.5;}
function bottomBankY(){return H-BANK*0.5;}

function fit(){
  var r=cv.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(200,r.width);H=Math.max(200,r.width*4/3);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  riverTop=BANK;riverBottom=H-BANK;rowH=(riverBottom-riverTop)/LANES;
  draw();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);

/* ---------- 原木 ---------- */
function spawnLog(lane,edge){
  var dir=edge||(Math.random()<0.5?1:-1);
  var len=Math.max(40,86-difficulty*3-Math.random()*16);
  var sp=(46+difficulty*7+Math.random()*26)*dir;
  var x=dir>0?-len/2-8:W+len/2+8;
  return {lane:lane,x:x,len:len,speed:sp};
}
function seedLogs(){
  logs=[];spawnTimers=[];
  for(var i=0;i<LANES;i++){
    var n=2+((Math.random()*2)|0);
    for(var j=0;j<n;j++){
      var dir=Math.random()<0.5?1:-1;
      var len=Math.max(48,92-difficulty*3-Math.random()*14);
      logs.push({lane:i,x:Math.random()*W,len:len,speed:(46+difficulty*7+Math.random()*24)*dir});
    }
    spawnTimers.push(0.2+Math.random()*0.8);
  }
}
function updateLogs(dt){
  for(var i=logs.length-1;i>=0;i--){
    var l=logs[i];l.x+=l.speed*dt;
    if(l.speed>0&&l.x-l.len/2>W+12)logs.splice(i,1);
    else if(l.speed<0&&l.x+l.len/2<-12)logs.splice(i,1);
  }
  for(var lane=0;lane<LANES;lane++){
    spawnTimers[lane]-=dt;
    var count=0;
    for(var k=0;k<logs.length;k++)if(logs[k].lane===lane)count++;
    if(spawnTimers[lane]<=0&&count<4){
      logs.push(spawnLog(lane));
      spawnTimers[lane]=Math.max(0.28,0.9-difficulty*0.05)+Math.random()*0.7;
    }
  }
}
function logUnder(lane,x){
  for(var i=0;i<logs.length;i++){
    var l=logs[i];
    if(l.lane!==lane)continue;
    if(x>=l.x-l.len/2-4&&x<=l.x+l.len/2+4)return l;
  }
  return null;
}

/* ---------- 关卡流（分数制） ---------- */
function resetRun(){
  score=0;crossings=0;difficulty=0;scoreEl.textContent="0";
  seedLogs();
  frog={x:W/2,y:bottomBankY(),lane:LANES};
  hop=null;state="ready";paused=false;
  btnPause.disabled=true;btnPause.textContent="暂停";btnMain.textContent="开始游戏";
  say("点击「开始」下河");
  draw();
}
function startGame(){
  state="running";paused=false;
  hideOverlay();
  btnPause.disabled=false;btnPause.textContent="暂停";btnMain.textContent="重新开始";
  say("上/下 hop 换行 · 左/右 调整站位");
}
function togglePause(){
  if(state!=="running")return;
  paused=!paused;
  btnPause.textContent=paused?"继续":"暂停";
  if(paused)showPause();else hideOverlay();
  say(paused?"已暂停":"已继续");
}
function gameOver(){
  state="over";
  var isRecord=score>best&&score>0;
  if(isRecord){best=score;bestEl.textContent=best;persistBest();}
  if(GB.available)GB.reportScore("log-hop",{metricValue:best,metricExtra:crossings}).catch(function(){});
  showOver(isRecord);
}

/* ---------- 动作 ---------- */
function hopTo(delta){
  if(state!=="running"||paused||hop)return;
  var target=frog.lane-delta;   // delta=1 向上（lane 减小）
  if(target<-1||target>LANES)return;
  hop={from:frog.lane,to:target,t:0};
}
function moveSide(dir){
  if(state!=="running"||paused||hop)return;
  if(frog.lane<0||frog.lane>LANES)return;
  frog.x+=dir*18;
  frog.x=Math.max(10,Math.min(W-10,frog.x));
}
function land(){
  var lane=hop.to;hop=null;
  frog.lane=lane;
  if(lane<0){
    crossings++;
    score+=LANES+10;
    scoreEl.textContent=String(score);
    difficulty=Math.min(10,crossings);
    frog.x=W/2;frog.y=bottomBankY();frog.lane=LANES;
    seedLogs();
    say("成功过河 +"+ (LANES+10) +" 分");
    return;
  }
  frog.y=laneY(lane);
  if(!logUnder(lane,frog.x)){splash();return;}
}
function splash(){
  if(state!=="running")return;
  say("落水了！");
  gameOver();
}

/* ---------- 更新 ---------- */
function update(dt){
  updateLogs(dt);
  if(hop){
    hop.t+=dt*1000/HOP_MS;
    var k=Math.min(1,hop.t);
    var y0=hop.from>=LANES?bottomBankY():(hop.from<0?topBankY():laneY(hop.from));
    var y1=hop.to>=LANES?bottomBankY():(hop.to<0?topBankY():laneY(hop.to));
    frog.y=y0+(y1-y0)*k;
    if(k>=1)land();
  }else if(frog.lane>=0&&frog.lane<LANES){
    var l=logUnder(frog.lane,frog.x);
    if(!l){splash();return;}
    frog.x+=l.speed*dt;
    if(frog.x<-8||frog.x>W+8){say("被原木带出屏幕！");gameOver();return;}
  }
}

/* ---------- 渲染 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.water;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=PAL.water2;
  for(var w=0;w<6;w++){
    var wy=riverTop+ (w+0.5)*(riverBottom-riverTop)/6;
    ctx.fillRect(0,wy-1,W,2);
  }
  ctx.fillStyle=PAL.bank;
  ctx.fillRect(0,0,W,BANK);
  ctx.fillRect(0,H-BANK,W,BANK);
  ctx.fillStyle=PAL.surface;
  for(var i=0;i<8;i++){ctx.fillRect(i*W/8+6,8,W/8-12,4);ctx.fillRect(i*W/8+6,H-12,W/8-12,4);}
  // 原木
  for(var k=0;k<logs.length;k++){
    var l=logs[k],ly=laneY(l.lane);
    ctx.fillStyle=PAL.log;
    rr(l.x-l.len/2,ly-rowH*0.24,l.len,rowH*0.48,Math.min(8,rowH*0.18));
    ctx.fill();
    ctx.fillStyle=PAL.logline;
    ctx.fillRect(l.x-l.len/2+3,ly-1,l.len-6,2);
  }
  // 小蛙
  var fx=frog.x,fy=frog.y;
  var hopK=hop?Math.sin(Math.min(1,hop.t)*Math.PI):0;
  fy-=hopK*10;
  ctx.fillStyle=PAL.frogdark;
  ctx.beginPath();ctx.arc(fx-7,fy-8,5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(fx+7,fy-8,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.frog;
  ctx.beginPath();ctx.arc(fx,fy,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(fx-5,fy-4,3.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(fx+5,fy-4,3.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.text;
  ctx.beginPath();ctx.arc(fx-5,fy-4,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(fx+5,fy-4,1.5,0,Math.PI*2);ctx.fill();
}

/* ---------- 覆盖层 ---------- */
function showPanel(html){panel.innerHTML=html;overlay.classList.add("show");}
function hideOverlay(){overlay.classList.remove("show");}
function showStart(){
  showPanel(
    '<p class="rt">准备开始</p>'+
    '<p class="rs">跳上滚动原木横渡河面 · 最高分 <b>'+best+'</b></p>'+
    '<div class="rbtns"><button class="btn" id="ovMain" type="button">开始游戏</button></div>'+
    '<p class="rhint">上/下 hop 换行，左/右 调整站位。原木会带着你移动，站出屏幕或落到水里即失败；每过一次河分数与难度同时提升。</p>'
  );
  $("ovMain").addEventListener("click",function(){startGame();});
}
function showPause(){
  showPanel(
    '<p class="rt">已暂停</p>'+
    '<p class="rs">当前分数 <b>'+score+'</b></p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovRetryP" type="button">重新开始</button>'+
      '<button class="btn" id="ovResume" type="button">继续</button>'+
    '</div>'
  );
  $("ovResume").addEventListener("click",function(){togglePause();});
  $("ovRetryP").addEventListener("click",function(){resetRun();startGame();});
}
function showOver(isRecord){
  showPanel(
    '<p class="rt">游戏结束</p>'+
    '<p class="rs">得分 <b>'+score+'</b>'+(isRecord?' · 新纪录':'')+'</p>'+
    '<p class="rs">成功过河 '+crossings+' 次 · 最高分 '+best+'</p>'+
    '<div class="rbtns"><button class="btn" id="ovRetry" type="button">再来一局</button></div>'
  );
  $("ovRetry").addEventListener("click",function(){resetRun();startGame();});
}

/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  if(state!=="running"||paused)return;
  var r=cv.getBoundingClientRect();
  var py=(e.clientY-r.top)/r.height*H;
  if(py<frog.y)hopTo(1);else if(py>frog.y+rowH*0.6)hopTo(-1);
});
var sx=0,sy0=0,tracking=false;
cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];sx=t.clientX;sy0=t.clientY;tracking=true;},{passive:true});
cv.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  if(!tracking)return;tracking=false;
  var t=e.changedTouches[0];
  var dx=t.clientX-sx,dy=t.clientY-sy0;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24){hopTo(1);return;}
  if(Math.abs(dx)>Math.abs(dy))moveSide(dx>0?1:-1);
  else hopTo(dy<0?1:-1);
});
document.addEventListener("keydown",function(e){
  if(e.repeat)return;
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowUp"||k==="w"){e.preventDefault();hopTo(1);}
  else if(k==="ArrowDown"||k==="s"){e.preventDefault();hopTo(-1);}
  else if(k==="ArrowLeft"||k==="a"){e.preventDefault();moveSide(-1);}
  else if(k==="ArrowRight"||k==="d"){e.preventDefault();moveSide(1);}
  else if(k===" "){e.preventDefault();if(state==="running")togglePause();else if(state==="ready"||state==="over")startGame();}
});
btnPause.addEventListener("click",togglePause);
btnMain.addEventListener("click",function(){
  if(state==="running"){resetRun();startGame();}
  else if(state==="paused"){paused=false;hideOverlay();startGame();}
  else startGame();
});
document.addEventListener("visibilitychange",function(){if(document.hidden&&state==="running"&&!paused)togglePause();});

/* ---------- 主循环 ---------- */
function loop(now){
  requestAnimationFrame(loop);
  var dt=((now-lastFrame)/1000)||0.016;lastFrame=now;
  if(dt>0.05)dt=0.05;
  if(state==="running"&&!paused)update(dt);
  draw();
}

fit();
resetRun();
requestAnimationFrame(loop);
syncSaveFromServer();
showStart();
})();
</script>
</body>
</html>
