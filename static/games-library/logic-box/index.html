<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>密盒开锁</title>
<style>
  /*token:GAME-THEME.md §2 基线（值与基线一致）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; min-width: 0; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.low { color: var(--g-danger); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--g-btn-primary); color: #fff; font-size: 16px; font-weight: 600; }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .35; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效 */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}

  /* 密盒 */
  .boxface {
    background: var(--g-surface); border: 2px solid var(--g-border);
    border-radius: var(--g-radius); padding: 14px 12px;
    box-shadow: var(--g-shadow); min-height: 230px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .boxface.shake { animation: shake .4s ease-out; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  .clue { font-size: 14px; color: var(--g-text); background: var(--g-surface2); border-radius: 10px; padding: 8px 10px; line-height: 1.5; }
  .stagebar { font-size: 12px; color: var(--g-muted); text-align: center; }
  .symrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .stbtn {
    min-width: 64px; min-height: 72px; border: 0; cursor: pointer;
    border-radius: var(--g-radius-inner); background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .stbtn .g { font-size: 22px; line-height: 1; }
  .stbtn .n { font-size: 14px; color: var(--g-muted); }
  .stbtn:active { opacity: .85; }
  .stbtn.used { opacity: .35; }
  .dialrow { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .dialval {
    width: 76px; height: 60px; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  .pbtn {
    min-height: 44px; min-width: 56px; flex: none; border: 0; cursor: pointer;
    border-radius: var(--g-radius-btn); background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 22px; font-weight: 700;
  }
  .pbtn:active { opacity: .85; }
  .lampgrid { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; justify-content: center; }
  .lcell {
    width: 64px; height: 64px; border: 0; cursor: pointer; padding: 0;
    border-radius: var(--g-radius-inner); background: var(--g-surface2);
  }
  .lcell.on { background: var(--g-warning); }
</style>

}

  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return verifyLevel(d)})){
      LEVELS=list.map(normalizeLevel);return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

//__VERIFY__START
/* 密盒开锁独立验证器（模拟回放）：按数据推演每个机关的标准答案，
   逐段「作答」走完整个开锁流程，任何一段推演不出答案即判无效 */
var LB_GLYPHS=5;
var LB_GNAMES=["圆","三角","方","星","菱"];
function lbOrderAnswer(st){
  // 顺序机关：按点数升/降排序，点数必须互异且覆盖全部钮
  if(!Array.isArray(st.items)||st.items.length<3||st.items.length>5)return null;
  var seen={},ns=[];
  for(var i=0;i<st.items.length;i++){
    var it=st.items[i];
    if(!it||typeof it!=="object")return null;
    if(!Number.isInteger(it.g)||it.g<0||it.g>=LB_GLYPHS)return null;
    if(!Number.isInteger(it.n)||it.n<1||it.n>5)return null;
    if(seen[it.n])return null;
    seen[it.n]=1;ns.push(it.n);
  }
  var idx=st.items.map(function(_,i){return i});
  idx.sort(function(a,b){return st.rule==="desc"?st.items[b].n-st.items[a].n:st.items[a].n-st.items[b].n});
  return idx;
}
function lbDialAnswer(st,stages){
  // 密码盘：由先前顺序机关推演（求和 / 最大 / 指定符号计数），必须落在 0-9
  if(!Number.isInteger(st.src)||st.src<0||st.src>=stages.length||st.src===undefined)return null;
  var src=stages[st.src];
  if(!src||src.t!=="order"||!Array.isArray(src.items))return null;
  var code;
  if(st.mode==="sum")code=src.items.reduce(function(a,b){return a+b.n},0);
  else if(st.mode==="max")code=Math.max.apply(null,src.items.map(function(it){return it.n}));
  else if(st.mode==="count")code=src.items.filter(function(it){return it.g===st.g}).length;
  else return null;
  if(st.mode==="count"&&(!Number.isInteger(st.g)||st.g<0||st.g>=LB_GLYPHS))return null;
  if(!Number.isInteger(code)||code<0||code>9)return null;
  return code;
}
function lbPatternAnswer(st){
  // 灯阵：3-5 个亮格且互不相同
  if(!Array.isArray(st.lit)||st.lit.length<3||st.lit.length>5)return null;
  var seen={};
  for(var i=0;i<st.lit.length;i++){
    var c=st.lit[i];
    if(!Number.isInteger(c)||c<0||c>8||seen[c])return null;
    seen[c]=1;
  }
  return st.lit.slice().sort(function(a,b){return a-b});
}
function verifyLevel(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Array.isArray(d.stages)||d.stages.length<2||d.stages.length>3)return false;
  // 回放：逐段推演标准答案（密码盘依赖更早的顺序机关）
  for(var i=0;i<d.stages.length;i++){
    var st=d.stages[i];
    if(!st||typeof st!=="object")return false;
    if(st.t==="order"){
      if(!lbOrderAnswer(st))return false;
    }else if(st.t==="dial"){
      if(!Number.isInteger(st.src)||st.src>=i)return false;   // 密码盘只能引用更早的机关
      if(lbDialAnswer(st,d.stages)===null)return false;
    }else if(st.t==="pattern"){
      if(!lbPatternAnswer(st))return false;
    }else return false;
  }
  return true;
}
function normalizeLevel(d){
  return {name:String(d.name),stages:JSON.parse(JSON.stringify(d.stages)),
    difficulty:Math.min(9,Math.max(1,Number.isInteger(d.difficulty)?d.difficulty:5))};
}
//__VERIFY__END

/* ---------- 状态 ---------- */
var lv=save.lv,L=null,stageIdx=0,misses=0,done=false;
var orderDone=[],dialVal=0,lampOn=[],lampShow=false,lampShowT=0,curLamp=0;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function shakeBox(){
  if(window.__gRM)return;
  var b=$("boxface");
  b.classList.remove("shake");
  void b.offsetWidth;
  b.classList.add("shake");
}
function miss(){
  misses++;
  $("stMiss").textContent=misses;
  shakeBox();
}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!verifyLevel(L)){say("关卡数据异常");return;}
  stageIdx=0;misses=0;done=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=L.stages.length+" 道机关";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stMiss").textContent=misses;
  say("按线索依次解开盒面上的机关，全部解开盒子弹开");
  renderStage();
}
function stageClue(st,cur){
  if(st.t==="order")return st.rule==="desc"?"按点数从多到少依次按下符号钮":"按点数从少到多依次按下符号钮";
  if(st.t==="dial"){
    var src=L.stages[st.src];
    var what=st.mode==="sum"?"所有点数之和":(st.mode==="max"?"最大的点数":"「"+LB_GNAMES[st.g]+"」符号的个数");
    return "密码 = 上一道符号机关中"+what+"（0-9）"+(cur?"":"");
  }
  if(st.t==="pattern")return "先记住亮起的格子（2.5 秒后熄灭），再原样复现";
  return "";
}
function renderStage(){
  if(done)return;
  var st=L.stages[stageIdx];
  $("stStage").textContent=(stageIdx+1)+"/"+L.stages.length;
  $("stagebar").textContent="机关 "+(stageIdx+1)+" / "+L.stages.length;
  $("clue").textContent=stageClue(st,true);
  var area=$("stageArea");
  area.innerHTML="";
  if(st.t==="order"){
    orderDone=[];
    var row=document.createElement("div");
    row.className="symrow";
    for(var i=0;i<st.items.length;i++){
      (function(i){
        var b=document.createElement("button");
        b.type="button";
        b.className="stbtn";
        b.id="stb"+i;
        var dots=new Array(st.items[i].n+1).join("●");
        b.innerHTML='<span class="g">'+["●","▲","■","★","◆"][st.items[i].g]+'</span><span class="n">'+dots+'</span>';
        b.addEventListener("click",function(){pressSym(i)});
        row.appendChild(b);
      })(i);
    }
    area.appendChild(row);
  }else if(st.t==="dial"){
    dialVal=0;
    var wrap=document.createElement("div");
    wrap.className="dialrow";
    wrap.innerHTML='<button type="button" class="pbtn" id="dMinus">−</button>'+
      '<div class="dialval" id="dVal">0</div>'+
      '<button type="button" class="pbtn" id="dPlus">＋</button>';
    var cf=document.createElement("button");
    cf.type="button";cf.className="btn primary";cf.textContent="转动";cf.style.marginTop="4px";
    cf.addEventListener("click",confirmDial);
    area.appendChild(wrap);
    area.appendChild(cf);
    $("dMinus").addEventListener("click",function(){dialTurn(-1)});
    $("dPlus").addEventListener("click",function(){dialTurn(1)});
  }else if(st.t==="pattern"){
    lampOn=new Array(9).fill(false);
    lampShow=true;lampShowT=performance.now();curLamp=0;
    var grid=document.createElement("div");
    grid.className="lampgrid";
    for(i=0;i<9;i++){
      (function(i){
        var b=document.createElement("button");
        b.type="button";
        b.className="lcell";
        b.id="lc"+i;
        b.addEventListener("click",function(){toggleLamp(i)});
        grid.appendChild(b);
      })(i);
    }
    var cf2=document.createElement("button");
    cf2.type="button";cf2.className="btn primary";cf2.textContent="这组就是";cf2.style.marginTop="4px";
    cf2.addEventListener("click",confirmPattern);
    area.appendChild(grid);
    area.appendChild(cf2);
    // 2.5 秒后熄灭（reduced-motion 下同样熄灭——灯阵只靠状态切换）
    setTimeout(function(){
      lampShow=false;
      for(var k=0;k<9;k++)updateLamp(k);
      say("灯灭了，凭记忆复现亮格");
    },2500);
  }
  refreshLamps();
}
function updateLamp(i){
  var el=$("lc"+i);
  if(!el)return;
  var lit=lampShow?L.stages[stageIdx].lit.indexOf(i)>=0:lampOn[i];
  el.className="lcell"+(lit?" on":"");
  el.style.outline=curLamp===i&&!lampShow?"2px solid var(--g-primary-deep)":"";
  el.style.outlineOffset="-2px";
}
function refreshLamps(){
  for(var k=0;k<9;k++)updateLamp(k);
}
function pressSym(i){
  if(done)return;
  var st=L.stages[stageIdx];
  var ans=lbOrderAnswer(st);
  var pos=orderDone.length;
  var btn=$("stb"+i);
  if(orderDone.indexOf(i)>=0){say("这个钮已经按过了");return;}
  if(ans[pos]!==i){
    miss();
    orderDone=[];
    say("按错了，符号钮全部复位，重新来");
    renderStage();
    return;
  }
  orderDone.push(i);
  btn.classList.add("used");
  if(orderDone.length===st.items.length){
    stageIdx++;
    nextStageOrWin("咔哒一声，符号机关解开了");
  }else{
    say("已按对 "+orderDone.length+"/"+st.items.length);
  }
}
function dialTurn(d){
  if(done)return;
  dialVal=(dialVal+d+10)%10;
  $("dVal").textContent=dialVal;
}
function confirmDial(){
  if(done)return;
  var st=L.stages[stageIdx];
  var code=lbDialAnswer(st,L.stages);
  if(dialVal!==code){
    miss();
    say("密码盘弹回 0，重新推算");
    dialVal=0;
    $("dVal").textContent=dialVal;
    return;
  }
  stageIdx++;
  nextStageOrWin("咔哒一声，密码盘解开了");
}
function toggleLamp(i){
  if(done||lampShow)return;
  lampOn[i]=!lampOn[i];
  curLamp=i;
  refreshLamps();
}
function confirmPattern(){
  if(done||lampShow)return;
  var st=L.stages[stageIdx];
  var ok=true;
  for(var i=0;i<9;i++)if(lampOn[i]!==(st.lit.indexOf(i)>=0)){ok=false;break;}
  if(!ok){
    miss();
    lampOn=new Array(9).fill(false);
    say("复现错了，灯阵清空，再看一遍线索");
    refreshLamps();
    return;
  }
  stageIdx++;
  nextStageOrWin("咔哒一声，灯阵机关解开了");
}
function nextStageOrWin(msgText){
  if(stageIdx>=L.stages.length){winLevel();return;}
  say(msgText);
  renderStage();
}
function hint(){
  if(done)return;
  var st=L.stages[stageIdx];
  if(!st){return;}
  if(st.t==="order"){
    var ans=lbOrderAnswer(st);
    var names=ans.map(function(i){return ["●","▲","■","★","◆"][st.items[i].g]}).join(" → ");
    say("验证器推演顺序："+names);
  }else if(st.t==="dial"){
    say("验证器推演密码是 "+lbDialAnswer(st,L.stages));
  }else if(st.t==="pattern"){
    if(lampShow){say("亮格还亮着，快记！");return;}
    lampShow=true;lampShowT=performance.now();
    refreshLamps();
    say("验证器又亮了一次目标灯阵，3 秒后熄灭");
    setTimeout(function(){lampShow=false;refreshLamps();},3000);
  }
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:misses}).catch(function(){});
  $("boxface").style.borderColor="var(--g-success)";
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"盒子弹开了！";
  $("ovDesc").innerHTML=L.stages.length+" 道机关全部解开（失误 "+misses+" 次）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
/* ---------- 输入 ---------- */
$("btnReset").addEventListener("click",function(){stageIdx=0;misses=0;$("stMiss").textContent=misses;$("boxface").style.borderColor="var(--g-border)";renderStage();say("本关已重置")});
$("btnHint").addEventListener("click",hint);
$("btnLv").addEventListener("click",function(){if(done)return;openLevelSelect()});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if($("overlay").classList.contains("show")){
    if(k===" "||k==="Enter"){$("ovBtn").click();e.preventDefault();}
    return;
  }
  var st=L?L.stages[stageIdx]:null;
  if(!st||done)return;
  if(st.t==="order"&&k>="1"&&k<="5"){
    var i=parseInt(k,10)-1;
    if(i<st.items.length)pressSym(i);
    e.preventDefault();
  }else if(st.t==="dial"){
    if(k==="+"||k==="="){dialTurn(1);e.preventDefault();}
    else if(k==="-"){dialTurn(-1);e.preventDefault();}
    else if(k===" "||k==="Enter"){confirmDial();e.preventDefault();}
  }else if(st.t==="pattern"){
    if(k==="ArrowUp"&&curLamp>=3){curLamp-=3;refreshLamps();e.preventDefault();}
    else if(k==="ArrowDown"&&curLamp<6){curLamp+=3;refreshLamps();e.preventDefault();}
    else if(k==="ArrowLeft"&&curLamp%3>0){curLamp--;refreshLamps();e.preventDefault();}
    else if(k==="ArrowRight"&&curLamp%3<2){curLamp++;refreshLamps();e.preventDefault();}
    else if(k===" "){toggleLamp(curLamp);e.preventDefault();}
    else if(k==="Enter"){confirmPattern();e.preventDefault();}
  }
});
/* ---------- 启动：逐关模拟回放复核 ---------- */
(function(){
  var ok=[];
  for(var i=0;i<LEVELS.length;i++){
    var pass=false;
    try{pass=verifyLevel(LEVELS[i])}catch(e){pass=false}
    if(pass)ok.push(LEVELS[i]);
  }
  if(ok.length)LEVELS=ok;
})();
loadLevel(save.lv);
syncLevelsFromServer();syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
