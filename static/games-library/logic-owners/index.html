<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡（种子制：genLevel 生成 + 独立验证器逐关复核 + 缓存） ---------- */
var GAME_KEY="logic-owners",SAVE_KEY="sw.logicowners.v1";
var LEVELS=[];for(var _i=0;_i<40;_i++)LEVELS.push(1001+_i*7);
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
var LEVELS_VER=3;
function applySeeds(seeds,ver){
  if(!Array.isArray(seeds)||seeds.length<8||!seeds.every(function(s){return Number.isInteger(s)&&s>0&&s<1e9;}))return false;
  LEVELS=seeds.slice();
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(LEVELS));localStorage.setItem(LEVELS_VER_KEY,String(ver||0));}catch(e){}
  return true;
}
function loadCachedSeeds(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length>=8&&list.every(function(s){return Number.isInteger(s)&&s>0&&s<1e9;})){
      LEVELS=list;return true;
    }
  }catch(e){}
  return false;
}
loadCachedSeeds();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    if(!res||!Array.isArray(res.levels)||!res.levels.length)return;
    var seeds=[];
    for(var i=0;i<res.levels.length;i++){
      var row=res.levels[i];
      if(!row||typeof row.dataJson!=="string")return;
      try{var d=JSON.parse(row.dataJson);if(!d||!Number.isInteger(d.seed))return;seeds.push(d.seed);}catch(e){return;}
    }
    if(applySeeds(seeds,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  setLbl("ovBtn","取消");setBtnIcon("ovBtn","x");
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

/* ---------- 生成器基础 ---------- */
var PETS=["狗","猫","鸟","鱼","马"],DRINKS=["茶","咖啡","牛奶","汽水","果汁"],COLORS=["红","蓝","绿","白","黄"];
var CAT_NAMES=["宠物","饮料","颜色"];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rng){for(var i=arr.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function permList(N){
  var out=[],idx=[];
  for(var i=0;i<N;i++)idx.push(i);
  function rec(cur,left){
    if(!left.length){out.push(cur.slice());return;}
    for(var i=0;i<left.length;i++){
      cur.push(left[i]);
      var rest=left.slice();rest.splice(i,1);
      rec(cur,rest);cur.pop();
    }
  }
  rec([],idx);return out;
}
/* 难度曲线：3房2类 → 4房2类 → 4房3类 → 5房3类 */
function diffOf(idx){
  if(idx<8)return [3,2];
  if(idx<20)return [4,2];
  if(idx<32)return [4,3];
  return [5,3];
}
function clueTarget(idx){
  if(idx<8)return 3;
  if(idx<20)return 4;
  return 5;
}
/* 生成器：从真解导出真实线索，收敛到唯一解并删冗余 */
function genLevel(seed,idx,attempt){
  attempt=attempt||0;
  var rng=mulberry32(seed);
  var dc=diffOf(idx),N=dc[0],m=dc[1];
  var pets=shuffle(PETS.slice(),rng).slice(0,N);
  if(pets.indexOf("鱼")<0)pets[0]="鱼";
  var drinks=shuffle(DRINKS.slice(),rng).slice(0,N);
  var colors=shuffle(COLORS.slice(),rng).slice(0,N);
  var pools=[pets,drinks,colors];
  var sol=[];
  for(var c=0;c<m;c++){
    var idxs=[];for(var v=0;v<N;v++)idxs.push(v);
    sol.push(shuffle(idxs,rng));
  }
  function pos(c,v){return sol[c].indexOf(v);}
  var clues=[];
  clues.push({t:0,p:Math.floor(rng()*N),c:Math.floor(rng()*m),v:0});
  clues[0].v=sol[clues[0].c][clues[0].p];
  var pool=[];
  for(var c1=0;c1<m;c1++)for(var v1=0;v1<N;v1++)for(var c2=0;c2<m;c2++)for(var v2=0;v2<N;v2++){
    if(c1===c2)continue;
    var p1=pos(c1,v1),p2=pos(c2,v2);
    if(Math.abs(p1-p2)===1)pool.push({t:1,c1:c1,v1:v1,c2:c2,v2:v2});
    if(p1<p2)pool.push({t:2,c1:c1,v1:v1,c2:c2,v2:v2});
  }
  /* B/C 阶段：样本贪心，每轮选排除随机样本解最多的相对线索 */
  var target=clueTarget(idx);
  for(var g2=0;g2<target;g2++){
    var sols0=countSols(N,m,clues,24,rng).sols;
    if(sols0.length<=1)break;
    var tsols0=[];
    for(var s0=0;s0<sols0.length;s0++){
      var asg0=sols0[s0],ts0=[];
      for(var c0=0;c0<m;c0++){ts0.push([]);for(var p0=0;p0<N;p0++)ts0[c0].push(asg0[c0][p0]);}
      tsols0.push(ts0);
    }
    var best=-1,bestScore=0;
    for(var k3=0;k3<pool.length;k3++){
      var sc=0;
      for(var s3=0;s3<tsols0.length;s3++)if(clueViolates(pool[k3],tsols0[s3],N))sc++;
      if(sc>bestScore){bestScore=sc;best=k3;}
    }
    if(best<0)break;
    clues.push(pool[best]);pool.splice(best,1);
  }
  /* 区分阶段：逐轮加入「排除假解最多」的直接线索，直至解集唯一（构造性保证收敛） */
  var guard=0,usedA={};
  while(guard++<16){
    var r=countSols(N,m,clues,200);
    if(r.count<=1)break;
    var sols=r.sols,tsols=[];
    for(var s=0;s<sols.length;s++){
      var asg=sols[s],ts=[];
      for(var cc=0;cc<m;cc++){ts.push([]);for(var pp=0;pp<N;pp++)ts[cc].push(asg[cc][pp]);}
      tsols.push(ts);
    }
    var best=null,bestKey=null,bestScore=0;
    for(var p=0;p<N;p++)for(var c=0;c<m;c++){
      var key=c+"_"+p;
      if(usedA[key])continue;
      var cand={t:0,p:p,c:c,v:sol[c][p]},sc=0;
      for(var s2=0;s2<tsols.length;s2++)if(clueViolates(cand,tsols[s2],N))sc++;
      if(sc>bestScore){bestScore=sc;best=cand;bestKey=key;}
    }
    if(!best)break;
    usedA[bestKey]=1;clues.push(best);
  }
  /* 极小化：删冗余线索（删除后仍唯一才删） */
  for(var i=clues.length-1;i>=3;i--){
    var tmp=clues.slice();tmp.splice(i,1);
    if(countSols(N,m,tmp,2).count===1)clues=tmp;
  }
  if(clues.length<3||clues.length>12||countSols(N,m,clues,2).count!==1){
    if(attempt>=6){
      var fb=[];
      for(var fp=0;fp<N;fp++)fb.push({t:0,p:fp,c:0,v:sol[0][fp]});
      return {n:N,cats:m,pets:pets,drinks:drinks,colors:colors,clues:fb,sol:sol,seed:seed};
    }
    return genLevel((seed*31+17)%1000000007,idx,attempt+1);
  }
  return {n:N,cats:m,pets:pets,drinks:drinks,colors:colors,clues:clues,sol:sol,seed:seed};
}
function clueViolates(cl,sol,N){
  if(cl.t===0)return sol[cl.c][cl.p]!==cl.v;
  function pos(c,v){for(var p=0;p<N;p++)if(sol[c][p]===v)return p;return -1;}
  var p1=pos(cl.c1,cl.v1),p2=pos(cl.c2,cl.v2);
  if(cl.t===1)return Math.abs(p1-p2)!==1;
  return p1>=p2;
}
/* 求解计数（生成器路径：按类别枚举排列，A 硬剪 + B/C 分层剪枝，收集解集） */
function countSols(N,m,clues,cap,rng){
  var rel=[];
  for(var i=0;i<clues.length;i++)if(clues[i].t!==0)rel.push(clues[i]);
  var perms=permList(N);
  var cur=[],sols=[],count=0;
  function relCheck(){
    for(var r=0;r<rel.length;r++){
      var q=rel[r],p1=cur[q.c1].indexOf(q.v1),p2=cur[q.c2].indexOf(q.v2);
      if(q.t===1&&Math.abs(p1-p2)!==1)return false;
      if(q.t===2&&p1>=p2)return false;
    }
    return true;
  }
  (function byCat(c){
    if(count>=cap)return;
    if(c===m){if(relCheck()){count++;sols.push(cur.map(function(x){return x.slice();}));}return;}
    var ord=null;
    if(rng){ord=[];for(var oi=0;oi<perms.length;oi++)ord.push(oi);shuffle(ord,rng);}
    for(var ki=0;ki<perms.length;ki++){
      var per=perms[ord?ord[ki]:ki],ok=true;
      for(var i=0;i<clues.length;i++){
        var cl=clues[i];
        if(cl.t===0&&cl.c===c&&per[cl.p]!==cl.v){ok=false;break;}
      }
      if(!ok)continue;
      cur.push(per);
      for(var r=0;r<rel.length;r++){
        var q=rel[r];
        if(Math.max(q.c1,q.c2)!==c)continue;
        var p1=cur[q.c1].indexOf(q.v1),p2=cur[q.c2].indexOf(q.v2);
        if(q.t===1&&Math.abs(p1-p2)!==1){ok=false;break;}
        if(q.t===2&&p1>=p2){ok=false;break;}
      }
      if(ok)byCat(c+1);
      cur.pop();
      if(count>=cap)return;
    }
  })(0);
  return {count:count,sols:sols};
}
/* 线索满足检查（独立路径：全部线索逐条对解校验） */
function cluesSat(d,assign){
  var N=d.n,m=d.cats;
  function pos(c,v){for(var p=0;p<N;p++)if(assign[c][p]===v)return p;return -1;}
  for(var i=0;i<d.clues.length;i++){
    var cl=d.clues[i];
    if(cl.t===0){if(assign[cl.c][cl.p]!==cl.v)return false;}
    else{
      var p1=pos(cl.c1,cl.v1),p2=pos(cl.c2,cl.v2);
      if(cl.t===1&&Math.abs(p1-p2)!==1)return false;
      if(cl.t===2&&p1>=p2)return false;
    }
  }
  return true;
}
/* 独立验证器（按类别维度枚举排列，A 硬剪 + B/C 分层剪枝） */
function verifyLevelData(d){
  if(!d||typeof d!=="object")return "数据异常";
  var N=d.n,m=d.cats;
  if(!Number.isInteger(N)||N<3||N>5)return "房数越界";
  if(!Number.isInteger(m)||m<2||m>3)return "类别数越界";
  if(!Array.isArray(d.clues)||d.clues.length<3||d.clues.length>12)return "线索数异常";
  if(!Array.isArray(d.sol)||d.sol.length!==m)return "解结构异常";
  for(var c=0;c<m;c++){
    if(!Array.isArray(d.sol[c])||d.sol[c].length!==N)return "解结构异常";
    var seen={};
    for(var p=0;p<N;p++){
      var v=d.sol[c][p];
      if(!Number.isInteger(v)||v<0||v>=N||seen[v])return "解非排列";
      seen[v]=1;
    }
  }
  if(!cluesSat(d,d.sol))return "真解不满足线索";
  var perms=permList(N);
  var relByMax=[];
  for(var i=0;i<d.clues.length;i++){
    var cl=d.clues[i];
    if(cl.t===0)continue;
    var mx=Math.max(cl.c1,cl.c2);
    (relByMax[mx]||(relByMax[mx]=[])).push(cl);
  }
  var count=0,cur=[];
  (function byCat(c){
    if(count>1)return;
    if(c===m){
      if(cluesSat(d,cur))count++;
      return;
    }
    for(var k=0;k<perms.length;k++){
      var per=perms[k],ok=true;
      for(var i=0;i<d.clues.length;i++){
        var cl=d.clues[i];
        if(cl.t===0&&cl.c===c&&per[cl.p]!==cl.v){ok=false;break;}
      }
      if(!ok)continue;
      cur.push(per);
      var rl=relByMax[c];
      if(rl)for(var r=0;r<rl.length;r++){
        var cl2=rl[r];
        var p1=cur[cl2.c1].indexOf(cl2.v1),p2=cur[cl2.c2].indexOf(cl2.v2);
        if(cl2.t===1&&Math.abs(p1-p2)!==1){ok=false;break;}
        if(cl2.t===2&&p1>=p2){ok=false;break;}
      }
      if(ok)byCat(c+1);
      cur.pop();
      if(count>1)return;
    }
  })(0);
  if(count!==1)return "解数="+count+"（应为 1）";
  return null;
}
/* 标准锚点用例（人工核对的已知答案） */
function verifyAnchors(){
  /* 锚点1：唯一解检测（3 房 1 类，手工推演唯一：房1狗、猫<鱼 → 房2猫房3鱼） */
  var a1={n:3,cats:1,clues:[{t:0,p:0,c:0,v:0},{t:2,c1:0,v1:2,c2:0,v2:1}],sol:[[0,2,1]]};
  if(countSols(3,1,a1.clues,2).count!==1)return "锚点1 求解数≠1";
  /* 锚点2：非唯一检测（狗猫相邻+鱼钉房3 → 狗猫占房1房2 有 2 种） */
  var a2={n:3,cats:1,clues:[{t:1,c1:0,v1:0,c2:0,v2:1},{t:0,p:2,c:0,v:2}],sol:null};
  if(countSols(3,1,a2.clues,5).count!==2)return "锚点2 非唯一检测失效";
  /* 锚点3：2 类全路径（真解：房1猫+牛奶、房2狗+茶、房3鱼+咖啡） */
  var a3={n:3,cats:2,clues:[
    {t:0,p:1,c:0,v:1},
    {t:2,c1:1,v1:0,c2:0,v2:1},
    {t:1,c1:0,v1:0,c2:1,v2:1},
    {t:1,c1:0,v1:1,c2:1,v2:2},
    {t:2,c1:0,v1:2,c2:1,v2:2}
  ],sol:[[2,1,0],[0,1,2]]};
  if(!cluesSat(a3,a3.sol))return "锚点3 真解不满足线索";
  if(countSols(3,2,a3.clues,2).count!==1)return "锚点3 求解数≠1";
  var e3=verifyLevelData(a3);if(e3)return "锚点3 "+e3;
  /* 锚点4：3 类全路径（真解：房1狗+牛奶+蓝、房2鱼+茶+红、房3猫+咖啡+绿） */
  var a4={n:3,cats:3,clues:[
    {t:0,p:0,c:0,v:0},
    {t:0,p:1,c:1,v:1},
    {t:0,p:2,c:2,v:2},
    {t:0,p:2,c:1,v:2},
    {t:1,c1:0,v1:1,c2:1,v2:0},
    {t:2,c1:2,v1:1,c2:0,v2:2},
    {t:1,c1:0,v1:2,c2:2,v2:0}
  ],sol:[[0,1,2],[0,1,2],[1,0,2]]};
  if(!cluesSat(a4,a4.sol))return "锚点4 真解不满足线索";
  if(countSols(3,3,a4.clues,2).count!==1)return "锚点4 求解数≠1";
  var e4=verifyLevelData(a4);if(e4)return "锚点4 "+e4;
  return null;
}
function selfCheck(){
  var err=verifyAnchors();
  for(var i=0;i<LEVELS.length;i++){
    var e=safeVerify(LEVELS[i],i);
    if(e&&!err)err="第 "+(i+1)+" 关 "+e;
  }
  if(err&&window.console&&console.warn)console.warn("逻辑校验："+err);   // 开发期自检只进控制台，不占用玩家界面
}
function safeVerify(seed,idx){
  try{
    var d=genLevel(seed,idx);
    return verifyLevelData(d);
  }catch(e){return "生成异常";}
}
/* ---------- 状态与渲染 ---------- */
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* 动态按钮文案只改 .lbl 文本节点，避免抹掉已注入的 SVG 图标 */
function setLbl(id,txt){var b=$(id),s=b?b.querySelector(".lbl"):null;if(s)s.textContent=txt;else if(b)b.textContent=txt}
function popVal(id){var e=$(id);if(!e)return;e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}
var lv=save.lv,L=null,table=[],curR=0,curC=0,chances=3,done=false,panelOpen=false;
var CATKEYS=["pets","drinks","colors"];
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  var d=null;
  for(var t=0;t<3;t++){
    d=genLevel(LEVELS[lv]+t*9973,lv);
    if(!verifyLevelData(d))break;
    d=null;
  }
  if(!d){say("本关数据异常，已回退");if(lv>0){lv--;save.lv=Math.min(save.lv,lv);persist();loadLevel(lv);return;}return;}
  L=d;
  table=[];for(var c=0;c<L.cats;c++){table.push([]);for(var p=0;p<L.n;p++)table[c].push(-1);}
  curR=0;curC=0;chances=3;done=false;panelOpen=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关";

  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  updStats();renderGrid();renderClues();renderChips();
  $("chips").hidden=true;
  say("点格子填表，线索都为真；填完提交（问：谁养鱼？）");
}
function filled(){
  for(var c=0;c<L.cats;c++)for(var p=0;p<L.n;p++)if(table[c][p]<0)return false;
  return true;
}
function updStats(){
  $("stClue").textContent=L?L.clues.length:0;
  var ch=$("stCh");ch.textContent=Math.max(0,chances);
  if(chances<=1)ch.classList.add("low");else ch.classList.remove("low");
  $("btnSubmit").disabled=!L||!filled()||done;
}
function renderGrid(){
  var g=$("pgrid");g.innerHTML="";
  var head=document.createElement("div");head.className="prow";
  head.style.gridTemplateColumns="56px repeat("+L.cats+",1fr)";
  var corner=document.createElement("div");corner.className="chead";corner.textContent="房子";
  head.appendChild(corner);
  for(var c=0;c<L.cats;c++){
    var h=document.createElement("div");h.className="chead";h.textContent=CAT_NAMES[c]+"↓";
    head.appendChild(h);
  }
  g.appendChild(head);
  for(var p=0;p<L.n;p++){
    var row=document.createElement("div");row.className="prow";
    row.style.gridTemplateColumns="56px repeat("+L.cats+",1fr)";
    var tag=document.createElement("div");tag.className="phouse";tag.textContent=(p+1)+" 号";
    row.appendChild(tag);
    (function(p){
      for(var c=0;c<L.cats;c++){
        (function(c){
          var b=document.createElement("button");

          b.setAttribute("data-p",p);b.setAttribute("data-c",c);

        })(c);

function paintCells(){
  var cells=$("pgrid").querySelectorAll(".cell");
  for(var i=0;i<cells.length;i++){
    var c=+cells[i].getAttribute("data-c"),p=+cells[i].getAttribute("data-p");
    var v=table[c][p];
    cells[i].textContent=v<0?"？":poolsOf()[c][v];
    cells[i].className="cell"+(v<0?" empty":"")+(c===curC&&p===curR&&!done?" cur":"");
  }
}
function poolsOf(){return [L.pets,L.drinks,L.colors];}
function desc(c,v){
  var pools=poolsOf();
  if(c===0)return "养"+pools[0][v]+"的";
  if(c===1)return "喝"+pools[1][v]+"的";
  return "住"+pools[2][v]+"色房子的";
}
function clueText(cl){
  if(cl.t===0){
    var pools=poolsOf(),v=pools[cl.c][cl.v];
    if(cl.c===0)return (cl.p+1)+" 号房子养"+v;
    if(cl.c===1)return (cl.p+1)+" 号房子的人喝"+v;
    return (cl.p+1)+" 号房子是"+v+"色的";
  }
  return desc(cl.c1,cl.v1)+"人和"+desc(cl.c2,cl.v2)+"的人"+(cl.t===1?"相邻（左右挨着）":"不在同一房，且前者在后者左边");
}
function renderClues(){

    li.style.animationDelay=Math.min(i*30,240)+"ms";

function renderChips(){

function openCell(c,p){
  if(done)return;
  curC=c;curR=p;panelOpen=true;

}
function setCell(c,p,v){
  if(done)return;
  table[c][p]=v;
  panelOpen=false;
  paintCells();renderChips();updStats();
  if(filled())say("表已填满，可以提交了");
}
/* ---------- 交互 ---------- */
function submit(){
  if(done||!filled())return;
  var ok=true;
  for(var c=0;c<L.cats;c++)for(var p=0;p<L.n;p++)if(table[c][p]!==L.sol[c][p])ok=false;
  if(ok){winLevel();return;}
  chances--;updStats();popVal("stCh");
  if(chances<=0){failLevel("表中还有矛盾，机会用完了");return;}
  say("提交的表有矛盾（对照线索逐条检查），还剩 "+chances+" 次机会");
}
function hint(){
  if(done||!L)return;
  /* 提示只作用于已选中的空格：面板未打开或光标格已填时不动表，避免覆盖已填值 */
  if(!panelOpen){say("先点选一个格子再用提示");return;}
  if(table[curC][curR]>=0){say("光标格已填，提示留给空格");return;}
  table[curC][curR]=L.sol[curC][curR];
  paintCells();renderChips();updStats();
  say("已把光标格填上正确答案；想想为什么");

function winLevel(){

  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"过关！";
  $("ovDesc").innerHTML=(L.cats===2?"宠物×饮料":"宠物×饮料×颜色")+" "+L.n+" 号房子全推出 · 剩余机会 "+chances+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  setLbl("ovBtn",(lv>=LEVELS.length-1)?"回到第 1 关":"下一关");

/* ---------- 键盘 ---------- */
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"||k==="ArrowRight"||k==="ArrowUp"||k==="ArrowDown"){
    if(!L||done)return;
    if(k==="ArrowLeft")curC=Math.max(0,curC-1);
    if(k==="ArrowRight")curC=Math.min(L.cats-1,curC+1);
    if(k==="ArrowUp")curR=Math.max(0,curR-1);
    if(k==="ArrowDown")curR=Math.min(L.n-1,curR+1);
    paintCells();e.preventDefault();
  }else if(k==="Enter"||k===" "){
    if($("overlay").classList.contains("show")){$("ovBtn").click();e.preventDefault();return;}
    if(!L||done)return;
    if(panelOpen){panelOpen=false;renderChips();}
    else if(filled())submit();
    else{panelOpen=true;renderChips();}
    e.preventDefault();
  }else if(k>="1"&&k<="5"){
    if(!L||done)return;
    var v=parseInt(k,10)-1;
    if(panelOpen){if(v<L.n)setCell(curC,curR,v);}
    e.preventDefault();
  }else if(k==="Escape"){
    if(panelOpen){panelOpen=false;renderChips();e.preventDefault();}
  }else if(k==="h"||k==="H"){hint();}
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置");}
  else if(k==="l"||k==="L"){if(!done)openLevelSelect();}
});
$("btnHint").addEventListener("click",hint);
$("btnClear").addEventListener("click",function(){
  if(done||!L)return;
  for(var c=0;c<L.cats;c++)for(var p=0;p<L.n;p++)table[c][p]=-1;
  paintCells();renderChips();updStats();say("已清空表格");
});
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置");});
$("btnLv").addEventListener("click",function(){if(!done)openLevelSelect();});
$("btnSubmit").addEventListener("click",submit);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(chances<=0){loadLevel(lv);return;}
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0);}
    else{lv++;save.lv=Math.max(save.lv,lv);persist();loadLevel(lv);}
  }else loadLevel(lv);
});
/* ---------- 启动 ---------- */
loadLevel(save.lv);
selfCheck();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
