/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="magnet-poles",SAVE_KEY="sw.magnetpoles.v1";
var DEFAULT_LEVELS=DEFAULT_LEVELS_SRC;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  levelOk=new Array(LEVELS.length);
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
var levelOk=new Array(LEVELS.length);
function verifyPending(){   // 后台逐关复核（分片避免卡顿）：坏关禁选、当前关即时告警
  var i=0;

    var t0=Date.now();
    while(i<LEVELS.length&&Date.now()-t0<40){
      if(levelOk[i]===undefined)levelOk[i]=verifyLevel(LEVELS[i]);
      i++;
    }
    if(i<LEVELS.length)setTimeout(step,0);
    else if(typeof renderLevels==="function")renderLevels();
  }
  setTimeout(step,0);
}

/* ---------- 结构校验 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.w)||d.w<6||d.w>7)return false;
  if(!Number.isInteger(d.h)||d.h<6||d.h>7)return false;
  var N=d.w*d.h;
  if(!Array.isArray(d.slots)||d.slots.length<4||d.slots.length>16||d.slots.length%2)return false;
  var seen={};
  for(var i=0;i<d.slots.length;i++){
    if(!Number.isInteger(d.slots[i])||d.slots[i]<0||d.slots[i]>=N||seen[d.slots[i]])return false;
    seen[d.slots[i]]=1;
  }
  if(!Array.isArray(d.rowN)||d.rowN.length!==d.h)return false;
  if(!Array.isArray(d.colN)||d.colN.length!==d.w)return false;
  var rs=new Array(d.h).fill(0);
  for(var z=0;z<d.slots.length;z++)rs[(d.slots[z]/d.w)|0]++;
  for(var y2=0;y2<d.h;y2++){if(!Number.isInteger(d.rowN[y2])||d.rowN[y2]<0||d.rowN[y2]>rs[y2])return false}
  for(var x2=0;x2<d.w;x2++){if(!Number.isInteger(d.colN[x2])||d.colN[x2]<0||d.colN[x2]>d.h)return false}
  if(!Array.isArray(d.sol)||d.sol.length!==d.slots.length/2)return false;
  var cov={};
  for(var j=0;j<d.sol.length;j++){
    var s=d.sol[j];
    if(!s||typeof s!=="object")return false;
    if(!Number.isInteger(s.a)||!Number.isInteger(s.b)||s.a<0||s.b<0||s.a>=N||s.b>=N)return false;
    if(!seen[s.a]||!seen[s.b]||cov[s.a]||cov[s.b])return false;
    if(Math.abs(s.a% d.w-(s.b% d.w))+Math.abs(((s.a/d.w)|0)-((s.b/d.w)|0))!==1)return false;
    if(s.dir!==0&&s.dir!==1)return false;
    cov[s.a]=1;cov[s.b]=1;
  }
  var tmp={};
  for(var q3=0;q3<d.sol.length;q3++){tmp[d.sol[q3].a]=d.sol[q3].dir;tmp[d.sol[q3].b]=1-d.sol[q3].dir}
  for(var y3=0;y3<d.h;y3++){
    var cnt=0;
    for(var x3=0;x3<d.w;x3++)if(tmp[y3*d.w+x3]===0)cnt++;
    if(cnt!==d.rowN[y3])return false;
  }
  for(var x4=0;x4<d.w;x4++){
    var cnt2=0;
    for(var y4=0;y4<d.h;y4++)if(tmp[y4*d.w+x4]===0)cnt2++;
    if(cnt2!==d.colN[x4])return false;
  }
  return true;
}

    for(var q=0;q<list.length;q++){
      var nb=list[q];
      if(!slots[nb]||pol[nb]!==undefined)continue;
      for(var dir=0;dir<2;dir++){
        if(conflict(cur,dir)||conflict(nb,1-dir))continue;
        var r2=(nb/w)|0;
        if(dir===0&&rowU[r]+1>rowN[r])continue;
        if(dir===1&&rowU[r2]+1>rowN[r2])continue;
        if(dir===0&&rowS[r2]+1>rs[r2]-rowN[r2])continue;
        if(dir===1&&rowS[r]+1>rs[r]-rowN[r])continue;
        pol[cur]=dir;pol[nb]=1-dir;
        if(dir===0){rowU[r]++;rowS[r2]++}else{rowS[r]++;rowU[r2]++}
        bt();
        delete pol[cur];delete pol[nb];
        if(dir===0){rowU[r]--;rowS[r2]--}else{rowS[r]--;rowU[r2]--}
        if(count>=cap)return;
      }
    }
  }
  bt();
  return count;
}
function verifyLevel(L){
  if(!validLevelData(L))return false;
  return mpCount(L.w,L.h,L.slots,L.rowN,L.colN,2)>=1;
}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),success:v("--g-success"),warning:v("--g-warning"),
    np:v("--g-st-np"),sp:v("--g-st-sp"),slot:v("--g-st-slot"),slot2:v("--g-st-slot2")};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,slotSet={},placements=[],history=[],sel=-1,cur=-1,done=false;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,dpr=1,w=6,h=6,cs=56;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function mpAdj(a,b){return Math.abs(a%w-b%w)+Math.abs(((a/w)|0)-((b/w)|0))===1}
/* ---------- 关卡 ---------- */
function loadLevel(n2){
  lv=Math.max(0,Math.min(n2,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return}
  w=L.w;h=L.h;
  slotSet={};
  for(var i=0;i<L.slots.length;i++)slotSet[L.slots[i]]=1;
  placements=[];history=[];sel=-1;cur=-1;done=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  var ok=verifyLevel(L);   // 加载复核：可解
  if(!ok)say("警告：内嵌验证器判定本关无解（数据异常）");
  else say("把所有高亮槽位用磁体两两占满，且没有同极相邻");
  updStats();resize();
}
function covered(){
  var c={},i;
  for(i=0;i<placements.length;i++){c[placements[i].a]=1;c[placements[i].b]=1}
  return c;
}
function conflicts(){
  var pol={},errs=0;
  for(var i=0;i<placements.length;i++){
    var p=placements[i];
    pol[p.a]=p.dir;pol[p.b]=1-p.dir;
  }
  for(var key in pol){
    var list=mpNb(w,h,+key);
    for(var q=0;q<list.length;q++){
      if(pol[list[q]]!==undefined&&pol[list[q]]===pol[key]&&+list[q]>+key)errs++;
    }
  }
  var rowU=new Array(h).fill(0),colU=new Array(w).fill(0);
  for(var k2 in pol)if(pol[k2]===0){rowU[(+k2/w)|0]++;colU[(+k2)%w]++}
  for(var y=0;y<h;y++)if(rowU[y]>L.rowN[y])errs++;
  for(var x=0;x<w;x++)if(colU[x]>L.colN[x])errs++;
  return errs;
}
function updStats(){
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stMg").textContent=placements.length+" / "+(L.slots.length/2);
  $("stErr").textContent=conflicts();
  $("btnUndo").disabled=!history.length||done;
}
/* ---------- 交互 ---------- */
function tapSlot(i){
  if(done)return;
  var cov=covered();
  if(cov[i]){
    var pi=-1;
    for(var q=0;q<placements.length;q++)if(placements[q].a===i||placements[q].b===i)pi=q;
    if(pi<0)return;
    var p=placements[pi];
    var flips=(p._taps||0);
    if(flips===0){
      history.push({prev:snapshot()});
      placements[pi]={a:p.a,b:p.b,dir:1-p.dir,_taps:1};
      say("磁体已翻转（再点一次收回）");
    }else{
      history.push({prev:snapshot()});
      placements.splice(pi,1);
      say("磁体已收回");
    }
    updStats();checkWin();return;
  }
  if(!slotSet[i])return;
  if(sel<0){sel=i;say("已选槽位，再点相邻槽放置磁体");return}
  if(sel===i){sel=-1;return}
  if(!mpAdj(sel,i)){say("两个槽位不相邻，组不成一个磁体");return}
  history.push({prev:snapshot()});
  placements.push({a:sel,b:i,dir:0,_taps:0});
  sel=-1;
  say("磁体放置成功，注意同极相邻");
  updStats();checkWin();
}
function snapshot(){
  return placements.map(function(p){return {a:p.a,b:p.b,dir:p.dir}});
}
function undo(){
  if(!history.length||done)return;
  var hh=history.pop();
  placements=hh.prev.map(function(p){return {a:p.a,b:p.b,dir:p.dir,_taps:0}});
  sel=-1;
  updStats();say("撤销一步");
}
function hint(){
  if(done)return;
  // 用内嵌解补一个磁体：优先纠正覆盖错误的磁体
  var cov=covered();
  for(var i=0;i<placements.length;i++){
    var p=placements[i],ref=null;
    for(var q=0;q<L.sol.length;q++){
      var s=L.sol[q];
      if(s.a===p.a&&s.b===p.b&&s.dir===p.dir){ref=s;break}
      if(s.a===p.b&&s.b===p.a&&s.dir===1-p.dir){ref=s;break}
    }
    if(!ref){
      history.push({prev:snapshot()});
      placements.splice(i,1);
      say("提示：这个磁体的位置或极性不在参考解里，已收回");
      updStats();return;
    }
  }
  for(var q2=0;q2<L.sol.length;q2++){
    var s2=L.sol[q2];
    if(!cov[s2.a]&&!cov[s2.b]){
      history.push({prev:snapshot()});
      placements.push({a:s2.a,b:s2.b,dir:s2.dir,_taps:0});
      say("提示：参考解在此放置了一个磁体");
      updStats();checkWin();return;
    }
  }
  say("已与参考解一致，检查极性");
}
function checkWin(){
  if(done)return;
  var cov=covered();
  if(Object.keys(cov).length<L.slots.length)return;
  for(var i=0;i<L.slots.length;i++)if(!cov[L.slots[i]])return;
  if(conflicts()>0)return;
  var pol2={},rowF=new Array(h).fill(0),colF=new Array(w).fill(0);
  for(var q2=0;q2<placements.length;q2++){pol2[placements[q2].a]=placements[q2].dir;pol2[placements[q2].b]=1-placements[q2].dir}
  for(var k3 in pol2)if(pol2[k3]===0){rowF[(+k3/w)|0]++;colF[(+k3)%w]++}
  for(var y3=0;y3<h;y3++)if(rowF[y3]!==L.rowN[y3])return;
  for(var x3=0;x3<w;x3++)if(colF[x3]!==L.colN[x3])return;
  done=true;
  save.done[lv]=true;
  if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:placements.length}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"磁场稳定了！";
  $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成 · "+placements.length+" 个磁体无一互斥"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
/* ---------- 绘制 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cs=Math.min(Math.floor((wCss-16)/w),60);
  W=cs*w+16;H=cs*h+16;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function centerOf(i){var x=i%w,y=(i/w)|0;return {x:8+x*cs+cs/2,y:8+y*cs+cs/2}}
function draw(){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  if(!L)return;
  var cov=covered(),pol={};
  for(var i=0;i<placements.length;i++){
    pol[placements[i].a]=placements[i].dir;
    pol[placements[i].b]=1-placements[i].dir;
  }
  for(var s=0;s<w*h;s++){
    var p=centerOf(s),x=s%w,y=(s/w)|0;
    var isSlot=!!slotSet[s];
    ctx.fillStyle=isSlot?PAL.slot2:PAL.bg;
    ctx.fillRect(8+x*cs+3,8+y*cs+3,cs-6,cs-6);
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
    ctx.strokeRect(8+x*cs+3.5,8+y*cs+3.5,cs-7,cs-7);
    if(isSlot&&cov[s]===undefined){
      ctx.fillStyle=PAL.slot;   // 素材空槽内芯
      ctx.fillRect(8+x*cs+8,8+y*cs+8,cs-16,cs-16);
    }
  }
  // 磁体：逐格画极性块
  for(var key in pol){
    var p2=centerOf(+key),x2=(+key)%w,y2=(+key/w)|0;
    var isN=pol[key]===0;
    ctx.fillStyle=isN?PAL.np:PAL.sp;   // 素材 N/S 极
    ctx.beginPath();
    ctx.rect(8+x2*cs+5,8+y2*cs+5,cs-10,cs-10);
    ctx.fill();
    ctx.fillStyle=PAL.surface;
    ctx.font="700 "+Math.min(18,cs*0.3)+"px sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(isN?"N":"S",p2.x,p2.y);
  }
  // 同极相邻红框
  var list=mpNb(w,h,0);
  for(var key2 in pol){
    var nb2=mpNb(w,h,+key2);
    for(var q=0;q<nb2.length;q++){
      if(pol[nb2[q]]!==undefined&&pol[nb2[q]]===pol[key2]&&+nb2[q]>+key2){
        var bad=centerOf(+key2),bx=(+key2)%w,by=(+key2/w)|0;
        ctx.strokeStyle=PAL.danger;ctx.lineWidth=3;
        ctx.strokeRect(8+bx*cs+4,8+by*cs+4,cs-8,cs-8);
      }
    }
  }
  // 行/列 N 计数线索
  var polNow={};
  for(var k4 in pol)polNow[k4]=pol[k4];
  ctx.font="700 12px sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(var y5=0;y5<h;y5++){
    var cN=0;
    for(var x5=0;x5<w;x5++)if(polNow[y5*w+x5]===0)cN++;
    ctx.fillStyle=cN>L.rowN[y5]?PAL.danger:(cov[y5*w]!==undefined||cov[y5*w+w-1]!==undefined?PAL.success:PAL.muted);
    ctx.fillText(String(L.rowN[y5]),8+w*cs-6,8+y5*cs+cs/2);
  }
  for(var x6=0;x6<w;x6++){
    var cN2=0;
    for(var y6=0;y6<h;y6++)if(polNow[y6*w+x6]===0)cN2++;
    ctx.fillStyle=cN2>L.colN[x6]?PAL.danger:PAL.muted;
    ctx.fillText(String(L.colN[x6]),8+x6*cs+cs/2,8+h*cs-8);
  }
  // 选中/光标
  var hi=sel>=0?sel:cur;
  if(hi>=0&&!done){
    var hp=centerOf(hi);
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=2.5;
    ctx.strokeRect(8+(hi%w)*cs+3,8+((hi/w)|0)*cs+3,cs-6,cs-6);
  }
  requestAnimationFrame(draw);
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var r=cv.getBoundingClientRect();
  var x=Math.floor((e.clientX-r.left-8)/cs),y=Math.floor((e.clientY-r.top-8)/cs);
  if(x>=0&&y>=0&&x<w&&y<h){cur=y*w+x;tapSlot(cur)}
  e.preventDefault();
});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){placements=[];history=[];sel=-1;updStats();say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k.indexOf("Arrow")===0){
    if(cur<0)cur=0;
    else{
      var x=cur%w,y=(cur/w)|0;
      if(k==="ArrowLeft")x=Math.max(0,x-1);
      else if(k==="ArrowRight")x=Math.min(w-1,x+1);
      else if(k==="ArrowUp")y=Math.max(0,y-1);
      else y=Math.min(h-1,y+1);
      cur=y*w+x;
    }
    e.preventDefault();
  }else if(k==="Enter"||k===" "){if(cur>=0)tapSlot(cur);e.preventDefault()}
  else if(k==="Delete"||k==="Backspace"){
    var cov=covered();
    if(cur>=0&&cov[cur]){
      for(var q=0;q<placements.length;q++)if(placements[q].a===cur||placements[q].b===cur){
        history.push({prev:snapshot()});
        placements.splice(q,1);
        say("磁体已收回");break;
      }
      updStats();
    }
    e.preventDefault();
  }
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){placements=[];history=[];sel=-1;updStats();say("本关已重置")}
});
function renderLevels(){}
/* ---------- 启动 ---------- */
var running=true;
document.addEventListener("visibilitychange",function(){
  if(document.hidden)running=false;
  else if(!running){running=true;requestAnimationFrame(draw)}
});
palLoad();loadLevel(save.lv);
requestAnimationFrame(draw);
verifyPending();syncLevelsFromServer();syncSaveFromServer();
window.addEventListener("resize",resize);

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
