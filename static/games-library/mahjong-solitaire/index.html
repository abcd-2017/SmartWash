function constructPairs(cells){

    var z=cells[i].z;

  var zs=[...layers.keys()].sort(function(a,b){return a-b;});
  for(var zi=0;zi<zs.length;zi++){

    var p=tilePos(t),px=p[0],py=p[1];
    if(shaking&&!window.__gRM){
      var hit=shakeCells[0]===i||shakeCells[1]===i;
      if(hit){var ph=(shakeUntil-now)/200*Math.PI*4;px+=Math.sin(ph)*3;}
    }
    var opt=null;
    if(enterActive&&!window.__gRM){
      var dl=Math.min(entOrder[i]*36,480),ep=(now-enterT0-dl)/260;
      if(ep<0)opt={alpha:0,scale:0.86,lift:-8};
      else if(ep<1){var e=1-Math.pow(1-ep,2);opt={alpha:e,scale:0.86+0.14*e,lift:-8*(1-e)};}
    }
    if(sel===i&&!window.__gRM){
      var sp=Math.min(1,(now-selT0)/140),se=1-Math.pow(1-sp,3);
      opt=opt||{};opt.lift=(opt.lift||0)-Math.round(3*se);
    }
    drawTileAt(i,px,py,now,opt);
    if(hintPair&&(hintPair[0]===i||hintPair[1]===i)){
      var pulse=window.__gRM?0.9:0.55+0.4*Math.sin(now/170);
      ctx.save();ctx.globalAlpha=pulse;ctx.lineWidth=2;ctx.strokeStyle=PAL.warning;
      rr(px-3,py-3,tile+6,tile+6,Math.max(4,tile*0.14+3));ctx.stroke();ctx.restore();
    }
  }
  for(var gi=gone.length-1;gi>=0;gi--){
    var g=gone[gi],gp=(now-g.t0)/180;
    if(gp>=1){gone.splice(gi,1);continue;}
    var ge=1-Math.pow(1-gp,2),p2=tilePos(g.t);
    drawTileAt(g.i,p2[0],p2[1]-10*ge,now,{alpha:1-ge,scale:1+0.06*ge,free:true});
  }
}
/* ---------- 动效调度（空闲即停） ---------- */
var enterActive=false,enterT0=0,entOrder=[],selT0=0,hasEntered=false;
var gone=[],animUntil=0,rafId=null;
function kickAnim(dur){
  if(window.__gRM){render();return;}
  animUntil=Math.max(animUntil,performance.now()+dur);
  if(!rafId)rafId=requestAnimationFrame(frame);
}
function frame(now){
  render();
  if(now<animUntil)rafId=requestAnimationFrame(frame);
  else{rafId=null;render();}
}
/* ---------- 交互 ---------- */
function handleTap(clientX,clientY){
  var rect=cv.getBoundingClientRect();
  var x=(clientX-rect.left-view.tx)/view.scale;
  var y=(clientY-rect.top-view.ty)/view.scale;
  var idx=hitTile(x,y);
  if(idx<0)return;
  if(!freeIdx(idx)){
    shakeCells=[idx,-1];shakeUntil=performance.now()+200;
    say("这张牌被压住或两侧被挡，先消除旁边的牌","err");
    render();kickAnim(220);
    setTimeout(function(){shakeUntil=0;shakeCells=[];render();},210);
    return;
  }
  if(sel<0){sel=idx;hintPair=null;selT0=performance.now();say("已选中，再点一张相同图案的自由牌");render();kickAnim(160);return;}
  if(sel===idx){sel=-1;selT0=performance.now();say("已取消选中");render();kickAnim(160);return;}
  if(tiles[sel].t!==tiles[idx].t){sel=idx;hintPair=null;selT0=performance.now();say("图案不同，已改选这张");render();kickAnim(160);return;}
  var a=sel,b=idx;
  removePair(a,b);
}
function hitTile(bx,by){
  var pad=Math.max(6,tile*0.25);
  for(var di=drawOrder.length-1;di>=0;di--){
    var i=drawOrder[di],t=tiles[i];
    if(!t.alive)continue;
    var px=M+maxZs*sx+t.c*tile-t.z*sx;
    var py=M+maxZs*sy+t.r*tile-t.z*sy;
    if(bx>=px-pad&&bx<=px+tile+pad&&by>=py-pad&&by<=py+tile+pad)return i;
  }
  return -1;
}
function removePair(a,b){
  tmap.delete(K(tiles[a].c,tiles[a].r,tiles[a].z));
  tmap.delete(K(tiles[b].c,tiles[b].r,tiles[b].z));
  tiles[a].alive=false;tiles[b].alive=false;
  remaining-=2;paired++;
  sel=-1;hintPair=null;
  updStats();
  if(!window.__gRM){var gp=performance.now();gone.push({i:a,t:tiles[a],t0:gp},{i:b,t:tiles[b],t0:gp});}
  if(remaining===0){say("全部消除！","win");winLevel();kickAnim(220);return;}
  if(!findHint())shuffleBoard(false);
  else say("消除成功，还剩 "+remaining+" 张","win");
  render();kickAnim(220);
}
/* ---------- 胜利 ---------- */
function winLevel(){
  stopTimer();
  cleared=Math.max(cleared,cur+1);
  var rec=parseInt(best[cur],10)||0;
  if(!rec||elapsed<rec)best[cur]=elapsed;
  saveGame();
  if(GB.available)GB.reportScore("mahjong-solitaire",{metricValue:cleared,metricExtra:elapsed}).catch(function(){});
  var last=cur>=LEVELS.length-1;
  $("ovTitle").textContent=last?"全部通关！":"过关！";
  $("ovDesc").innerHTML="第 <b>"+(cur+1)+"</b> 关完成 · 用时 "+fmt(elapsed)+"<br>已通关 "+cleared+" / "+LEVELS.length+" 关";
  setOvBtn(last?"rotate":"arrow-right",last?"再玩一遍":"下一关");
  $("overlay").querySelector(".panel").classList.add("win");
  $("overlay").classList.add("show");
  render();
}
function hideOverlay(){$("overlay").classList.remove("show")}
$("ovBtn").addEventListener("click",function(){
  startLevel(cur<LEVELS.length-1?cur+1:0);
});
/* ---------- 选关 ---------- */
function openLevels(){
  var grid=$("lvGrid");
  grid.innerHTML="";
  var maxOk=Math.min(cleared,LEVELS.length-1);
  for(var i=0;i<LEVELS.length;i++){
    var b=document.createElement("button");
    b.className="lvbtn"+(i===cur?" on":"");
    b.textContent=String(i+1);
    b.disabled=i>maxOk;
    b.addEventListener("click",(function(idx){
      return function(){startLevel(idx);$("lvOverlay").classList.remove("show");};
    })(i));
    grid.appendChild(b);
  }
  $("lvDesc").textContent="已通关 "+cleared+" / "+LEVELS.length+" 关 · 点数字进入对应关卡";
  $("lvOverlay").classList.add("show");
}
$("lvClose").addEventListener("click",function(){$("lvOverlay").classList.remove("show")});
/* ---------- 按钮 ---------- */
function setOvBtn(icon,label){$("ovBtn").innerHTML=SW_ICON(icon)+label;}
$("btnHint").addEventListener("click",function(){
  var h=findHint();
  if(!h){say("当前没有可消除的牌，试试洗牌","err");return;}
  hintPair=h;sel=-1;
  say("已高亮一对可消除的牌","win");
  render();kickAnim(700);
});
$("btnShuffle").addEventListener("click",function(){shuffleBoard(true)});
$("btnLevels").addEventListener("click",openLevels);
$("btnRestart").addEventListener("click",function(){startLevel(cur)});
/* ---------- 触摸：点按 + 双指缩放 + 拖动 ---------- */
var pointers=new Map(),gesture=null,lastTap=0,lastX=0,lastY=0;
function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function clampView(){
  var w=boardW*view.scale,h=boardH*view.scale;
  view.tx=w<=boardW?0:clamp(view.tx,boardW-w,0);
  view.ty=h<=boardH?0:clamp(view.ty,boardH-h,0);
}
function setScale(ns,focusX,focusY){
  var rect=cv.getBoundingClientRect();
  var fx=focusX-rect.left,fy=focusY-rect.top;
  var bx=(fx-view.tx)/view.scale,by=(fy-view.ty)/view.scale;
  view.scale=clamp(ns,1,3);
  view.tx=fx-bx*view.scale;view.ty=fy-by*view.scale;
  clampView();
  render();
}
cv.addEventListener("pointerdown",function(e){
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  var aw=stage.clientWidth||360;
  if(Math.abs(aw-lastAvail)>2)resize();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    gesture={x:e.clientX,y:e.clientY,moved:false,t:performance.now(),tx0:view.tx,ty0:view.ty,pinch:false};
  }else if(pointers.size===2){
    var pts=[...pointers.values()];
    gesture={pinch:true,d0:dist(pts[0],pts[1]),s0:view.scale,moved:true};
  }
});
cv.addEventListener("pointermove",function(e){
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2&&gesture&&gesture.pinch){
    var pts=[...pointers.values()];
    var d=dist(pts[0],pts[1]);
    if(d>0)setScale(gesture.s0*d/gesture.d0,(pts[0].x+pts[1].x)/2,(pts[0].y+pts[1].y)/2);
  }else if(pointers.size===1&&gesture&&!gesture.pinch){
    var dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;
    if(Math.abs(dx)+Math.abs(dy)>8)gesture.moved=true;
    if(gesture.moved){view.tx=gesture.tx0+dx;view.ty=gesture.ty0+dy;clampView();render();}
  }
});
function endPointer(e){
  if(!pointers.has(e.pointerId))return;
  pointers.delete(e.pointerId);
  if(pointers.size<2&&gesture&&gesture.pinch){gesture=null;return;}
  if(pointers.size===0){
    if(gesture&&!gesture.moved&&!gesture.pinch&&performance.now()-gesture.t<500){
      var now=performance.now();
      var rect=cv.getBoundingClientRect();
      var x=e.clientX-rect.left,y=e.clientY-rect.top;
      if(now-lastTap<300&&Math.abs(x-lastX)<30&&Math.abs(y-lastY)<30){
        view.scale=1;view.tx=0;view.ty=0;clampView();render();lastTap=0;
      }else{
        lastTap=now;lastX=x;lastY=y;
        handleTap(e.clientX,e.clientY);
      }
    }
    gesture=null;
  }
}
cv.addEventListener("pointerup",endPointer);
cv.addEventListener("pointercancel",endPointer);
stage.addEventListener("contextmenu",function(e){e.preventDefault();});
window.addEventListener("resize",function(){resize();});
if(typeof ResizeObserver!=="undefined")new ResizeObserver(function(){resize();}).observe(stage);
document.addEventListener("visibilitychange",function(){if(!document.hidden)render();});
/* ---------- 启动 ---------- */
palLoad();
cur=clamp(saveData.lv||0,0,LEVELS.length-1);
startLevel(cur);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 按钮 / 工具图标：内联 SVG（SW_ICON），零外链 */
(function(){
  function $(id){return document.getElementById(id)}
  var pairs=[["btnHint","hint"],["btnShuffle","swap-h"],["btnLevels","grid"],["btnRestart","rotate"]],i;
  for(i=0;i<pairs.length;i++){var el=$(pairs[i][0]);if(el)el.insertAdjacentHTML("afterbegin",window.SW_ICON(pairs[i][1]));}
  var lc=$("lvClose");if(lc)lc.insertAdjacentHTML("afterbegin",window.SW_ICON("x"));
  var ob=$("ovBtn");if(ob)ob.innerHTML=window.SW_ICON("arrow-right")+"下一关";
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
