/* ---------- 编码与结构 ---------- */
function decChar(ch){
  var c=ch.charCodeAt(0);
  if(c>=48&&c<=57)return c-48;
  if(c>=65&&c<=90)return c-55;
  return -99;
}
function encChar(v){return v<10?String(v):String.fromCharCode(55+v);}
function K(c,r,z){return c+","+r+","+z}
function buildMap(d){
  if(!d||typeof d!=="object")return null;
  if(!Number.isInteger(d.w)||d.w<2||d.w>35)return null;
  if(!Number.isInteger(d.h)||d.h<2||d.h>35)return null;
  if(!Number.isInteger(d.p)||d.p<1)return null;
  if(typeof d.g!=="string"||d.g.length!==d.p*7)return null;
  var map=new Map(),i,ch;
  for(i=0;i<d.g.length;i++){ch=d.g[i];if(decChar(ch)<0)return null;}
  for(i=0;i<d.p;i++){
    var o=i*7;
    var c1=decChar(d.g[o]),r1=decChar(d.g[o+1]),z1=decChar(d.g[o+2]);
    var c2=decChar(d.g[o+3]),r2=decChar(d.g[o+4]),z2=decChar(d.g[o+5]),t=decChar(d.g[o+6]);
    if(c1>=d.w||r1>=d.h||c2>=d.w||r2>=d.h||z1>15||z2>15)return null;
    var k1=K(c1,r1,z1),k2=K(c2,r2,z2);
    if(k1===k2||map.has(k1)||map.has(k2))return null;
    map.set(k1,t);map.set(k2,t);
  }
  return map;
}
function freeSet(map){
  var out=new Set();
  for(var k of map.keys()){
    var p=k.split(","),c=+p[0],r=+p[1],z=+p[2];
    if(map.has(K(c,r,z+1)))continue;
    var L=map.has(K(c-1,r,z)),R=map.has(K(c+1,r,z));
    if(!L||!R)out.add(k);
  }
  return out;
}
/* 独立回溯求解器（节点预算；超限返回 null 表示无法证伪） */
function isSolvable(map,budget){
  var memo=new Set(),nodes=0,overflow=false;
  function key(m){
    var a=[];
    for(var e of m)a.push(e[0]+":"+e[1]);
    a.sort();return a.join("|");
  }
  function rec(m){
    if(m.size===0)return true;
    var kk=key(m);
    if(memo.has(kk))return false;
    var free=freeSet(m);
    var byType=new Map();
    for(var k of free){
      var t=m.get(k);
      if(!byType.has(t))byType.set(t,[]);
      byType.get(t).push(k);
    }
    var groups=[...byType.entries()].sort(function(a,b){return a[1].length-b[1].length;});
    for(var gi=0;gi<groups.length;gi++){
      var ks=groups[gi][1];
      for(var i=0;i<ks.length;i++)for(var j=i+1;j<ks.length;j++){
        var a=ks[i],b=ks[j],ta=m.get(a),tb=m.get(b);
        m.delete(a);m.delete(b);nodes++;
        if(nodes>budget){m.set(a,ta);m.set(b,tb);overflow=true;return false;}
        var ok=rec(m);
        m.set(a,ta);m.set(b,tb);
        if(ok)return true;
        if(overflow)return false;
      }
    }
    memo.add(kk);
    return false;
  }
  var ok=rec(new Map(map));
  return overflow?null:(ok?true:false);
}
function validLevel(d,quick){
  var map=buildMap(d);
  if(!map)return false;
  var counts=new Map();
  for(var e of map){
    var t=e[1];
    counts.set(t,(counts.get(t)||0)+1);
    var p=e[0].split(","),c=+p[0],r=+p[1],z=+p[2];
    if(z>0&&!map.has(K(c,r,z-1)))return false;   // 悬空
  }
  for(var n of counts.values())if(n%2)return false;
  if(quick)return true;                          // 缓存快校验：DB 下发时已完整验证过
  var sv=isSolvable(map,30000);
  return sv!==false;
}

}

  if(!map)return false;
  level={w:def.data.w,h:def.data.h,maxZ:1};
  tiles=[];tmap.clear();drawOrder=[];
  for(var e of map){
    var p=e[0].split(","),c=+p[0],r=+p[1],z=+p[2];
    if(z+1>level.maxZ)level.maxZ=z+1;
    tmap.set(e[0],tiles.length);
    tiles.push({c:c,r:r,z:z,t:e[1],alive:true});
  }
  drawOrder=[];
  for(var i=0;i<tiles.length;i++)drawOrder.push(i);
  drawOrder.sort(function(a,b){
    var A=tiles[a],B=tiles[b];
    return A.z-B.z||A.r-B.r||A.c-B.c;
  });
  remaining=tiles.length;paired=0;sel=-1;hintPair=null;shakeCells=[];shakeUntil=0;
  return true;
}
function startLevel(n){
  cur=clamp(n,0,LEVELS.length-1);
  if(!buildLevel(LEVELS[cur])){say("关卡数据异常");return;}
  resize();
  startTimer();
  updStats();
  hideOverlay();
  say("第"+(cur+1)+"关 · "+LEVELS[cur].name+" · 点选一张自由牌");
  saveGame();
}
/* ---------- 自由牌判定 ---------- */
function freeIdx(i){
  var t=tiles[i];
  if(!t.alive)return false;
  if(tmap.has(K(t.c,t.r,t.z+1)))return false;
  var L=tmap.has(K(t.c-1,t.r,t.z)),R=tmap.has(K(t.c+1,t.r,t.z));
  return !L||!R;
}
function findHint(){
  var byType=new Map(),i;
  for(i=0;i<tiles.length;i++){
    if(!freeIdx(i))continue;
    var t=tiles[i].t;
    if(!byType.has(t))byType.set(t,[]);
    byType.get(t).push(i);
  }
  for(var arr of byType.values()){
    for(var a=0;a<arr.length;a++)for(var b=a+1;b<arr.length;b++)return [arr[a],arr[b]];
  }
  return null;
}
/* ---------- 构造式重排（任意几何都保证可解） ---------- */
function constructPairs(cells){
  var layers=new Map(),i;
  for(i=0;i<cells.length;i++){
    var z=cells[i].z;
    if(!layers.has(z))layers.set(z,new Map());
    var row=layers.get(z);
    var r=cells[i].r;
    if(!row.has(r))row.set(r,[]);
    row.get(r).push(cells[i].c);
  }
  var pairs=[];
  var zs=[...layers.keys()].sort(function(a,b){return a-b;});
  for(var zi=0;zi<zs.length;zi++){
    var rowMap=layers.get(zs[zi]);
    var rs=[...rowMap.keys()].sort(function(a,b){return a-b;});
    var leftovers=[],rowPairs=[];
    for(var ri=0;ri<rs.length;ri++){
      var cols=rowMap.get(rs[ri]).slice().sort(function(a,b){return a-b;});
      var rest=cols;
      if(cols.length%2===1){
        var mid=cols.length>>1;
        leftovers.push([cols[mid],rs[ri],zs[zi]]);
        rest=cols.slice(0,mid).concat(cols.slice(mid+1));
      }
      var m=rest.length/2;
      for(var k=1;k<=m;k++)rowPairs.push([[rest[m-k],rs[ri],zs[zi]],[rest[m+k-1],rs[ri],zs[zi]]]);
    }
    for(var li=0;li+1<leftovers.length;li+=2)pairs.push([leftovers[li],leftovers[li+1]]);
    for(var pi=0;pi<rowPairs.length;pi++)pairs.push(rowPairs[pi]);
  }
  return pairs;
}
function shuffleBoard(manual){
  if(remaining<2)return;
  var cells=[],bag=[],counts=new Map(),i;
  for(i=0;i<tiles.length;i++){
    if(!tiles[i].alive)continue;
    cells.push({c:tiles[i].c,r:tiles[i].r,z:tiles[i].z});
    var t=tiles[i].t;
    counts.set(t,(counts.get(t)||0)+1);
  }
  for(var e of counts){for(var k=0;k<e[1]/2;k++)bag.push(e[0]);}
  for(i=bag.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),tmp=bag[i];bag[i]=bag[j];bag[j]=tmp;}
  var pairs=constructPairs(cells);
  if(pairs.length!==bag.length)return;
  for(i=0;i<pairs.length;i++){
    var A=pairs[i][0],B=pairs[i][1];
    var ia=tmap.get(K(A[0],A[1],A[2])),ib=tmap.get(K(B[0],B[1],B[2]));
    if(ia===undefined||ib===undefined)return;
    tiles[ia].t=bag[i];tiles[ib].t=bag[i];
  }
  sel=-1;hintPair=null;
  updStats();
  say(manual?"已洗牌（保底可解）":"没有可消除的牌，自动洗牌");
}
/* ---------- 计时 ---------- */
function fmt(s){var m=Math.floor(s/60),ss=s%60;return (m<10?"0":"")+m+":"+(ss<10?"0":"")+ss}
function startTimer(){
  stopTimer();startTs=Date.now();elapsed=0;
  $("stTime").textContent="00:00";
  timer=setInterval(function(){
    elapsed=Math.floor((Date.now()-startTs)/1000);
    $("stTime").textContent=fmt(elapsed);
  },500);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
/* ---------- 统计 ---------- */
function updStats(){
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  $("stLeft").textContent=remaining;
}
/* ---------- 几何 ---------- */
function resize(){
  var avail=stage.clientWidth||360;
  lastAvail=avail;
  var mMath=Math.max(6,Math.round(avail*0.03));
  var cols=level.w,rows=level.h,maxZ=level.maxZ;
  var t0=Math.floor((avail-2*mMath)/(cols+maxZ*0.12));
  t0=clamp(t0,18,44);
  var sx0=Math.max(2,Math.round(t0*0.10)),sy0=Math.max(2,Math.round(t0*0.14));
  var bw=cols*t0+maxZ*sx0;
  if(bw>avail-2*mMath){
    t0=Math.max(14,Math.floor((avail-2*mMath-maxZ*sx0)/cols));
    sx0=Math.max(2,Math.round(t0*0.10));sy0=Math.max(2,Math.round(t0*0.14));
    bw=cols*t0+maxZ*sx0;
  }
  var bh=rows*t0+maxZ*sy0;
  dpr=Math.min(window.devicePixelRatio||1,2);
  tile=t0;M=mMath;sx=sx0;sy=sy0;boardW=bw;boardH=bh;maxZs=maxZ;
  cv.style.width=bw+"px";cv.style.height=bh+"px";
  cv.width=Math.round(bw*dpr);cv.height=Math.round(bh*dpr);
  view.scale=1;view.tx=0;view.ty=0;
  render();
}
/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawChar(ch,cx,cy,size,color){
  ctx.fillStyle=color;
  ctx.font="700 "+Math.round(size)+"px "+FONT;
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(ch,cx,cy);
}
function drawBamboo(n,cx,cy,size){
  var cols=n<=1?1:(n<=4?2:3),rows=Math.ceil(n/cols);
  var sw=size*0.16,sh=size*0.44,gx=size*0.14,gy=size*0.16;
  var w=cols*sw+(cols-1)*gx,h=rows*sh+(rows-1)*gy;
  var x0=cx-w/2,y0=cy-h/2;
  for(var i=0;i<n;i++){
    var cc=i%cols,rw=Math.floor(i/cols);
    var x=x0+cc*(sw+gx),y=y0+rw*(sh+gy);
    ctx.fillStyle=PAL.success;rr(x,y,sw,sh,sw*0.4);ctx.fill();
    ctx.globalAlpha=0.35;ctx.fillStyle=PAL.border;
    ctx.fillRect(x+sw*0.15,y+sh*0.47,sw*0.7,Math.max(1,size*0.03));
    ctx.globalAlpha=1;
  }
}
function drawDots(n,cx,cy,size){
  var cols=n<=1?1:(n<=4?2:3),rows=Math.ceil(n/cols);
  var rad=n===1?size*0.2:size*0.1,gx=size*0.26,gy=size*0.26;
  var w=cols*2*rad+(cols-1)*gx,h=rows*2*rad+(rows-1)*gy;
  var x0=cx-w/2,y0=cy-h/2;
  ctx.strokeStyle=PAL.water;ctx.lineWidth=Math.max(1.5,size*0.05);
  ctx.fillStyle=PAL.water;
  for(var i=0;i<n;i++){
    var cc=i%cols,rw=Math.floor(i/cols);
    var x=x0+cc*(2*rad+gx)+rad,y=y0+rw*(2*rad+gy)+rad;
    ctx.beginPath();ctx.arc(x,y,rad,0,6.2832);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,Math.max(1,rad*0.32),0,6.2832);ctx.fill();
  }
}
function drawSymbol(t,cx,cy,size){
  if(t<9){drawChar(CN[t],cx,cy-size*0.18,size*0.44,PAL.danger);drawChar("万",cx,cy+size*0.26,size*0.26,PAL.muted);}
  else if(t<18)drawBamboo(t-8,cx,cy,size);
  else if(t<27)drawDots(t-17,cx,cy,size);
  else if(t<31)drawChar(FENG[t-27],cx,cy,size*0.5,PAL.text);
  else{
    var k=t-31;
    if(k===0)drawChar("中",cx,cy,size*0.5,PAL.danger);
    else if(k===1)drawChar("发",cx,cy,size*0.5,PAL.success);
    else{ctx.strokeStyle=PAL.faint;ctx.lineWidth=Math.max(1.5,size*0.05);rr(cx-size*0.26,cy-size*0.26,size*0.52,size*0.52,size*0.1);ctx.stroke();}
  }
}
function render(){
  if(!cv.width)return;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*view.scale,0,0,dpr*view.scale,dpr*view.tx,dpr*view.ty);
  ctx.fillStyle=PAL.board;
  rr(M-2,M-2,boardW-2*M+4,boardH-2*M+4,10);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.stroke();
  var now=performance.now();
  var shaking=now<shakeUntil;
  for(var di=0;di<drawOrder.length;di++){
    var i=drawOrder[di],t=tiles[i];
    if(!t.alive)continue;
    var px=M+maxZs*sx+t.c*tile-t.z*sx;
    var py=M+maxZs*sy+t.r*tile-t.z*sy;
    if(shaking){
      var hit=shakeCells[0]===i||shakeCells[1]===i;
      if(hit){var ph=(shakeUntil-now)/200*Math.PI*4;px+=Math.sin(ph)*3;}
    }
    var edge=Math.max(2,Math.round(tile*0.07));
    var rad=Math.max(2,tile*0.12);
    ctx.fillStyle=PAL.border;rr(px+edge,py+edge,tile,tile,rad);ctx.fill();
    var free=freeIdx(i);
    ctx.fillStyle=!free?PAL.surface2:(sel===i?PAL.soft:PAL.surface);
    rr(px,py,tile,tile,rad);ctx.fill();
    ctx.lineWidth=sel===i?2:1;
    ctx.strokeStyle=sel===i?PAL.deep:PAL.border;
    rr(px,py,tile,tile,rad);ctx.stroke();
    if(hintPair&&(hintPair[0]===i||hintPair[1]===i)){
      ctx.lineWidth=2;ctx.strokeStyle=PAL.warning;
      rr(px-3,py-3,tile+6,tile+6,8);ctx.stroke();
    }
    drawSymbol(t.t,px+tile/2,py+tile/2,tile);
  }
}
/* ---------- 交互 ---------- */
function handleTap(clientX,clientY){
  var rect=cv.getBoundingClientRect();
  var x=(clientX-rect.left-view.tx)/view.scale;
  var y=(clientY-rect.top-view.ty)/view.scale;
  var idx=hitTile(x,y);
  if(idx<0)return;
  if(!freeIdx(idx)){
    shakeCells=[idx,-1];shakeUntil=performance.now()+200;
    say("这张牌被压住或两侧被挡，先消除旁边的牌");
    render();
    setTimeout(function(){shakeUntil=0;shakeCells=[];render();},210);
    return;
  }
  if(sel<0){sel=idx;hintPair=null;say("已选中，再点一张相同图案的自由牌");render();return;}
  if(sel===idx){sel=-1;say("已取消选中");render();return;}
  if(tiles[sel].t!==tiles[idx].t){sel=idx;hintPair=null;say("图案不同，已改选这张");render();return;}
  var a=sel,b=idx;
  removePair(a,b);
}
function hitTile(bx,by){
  var pad=Math.max(6,tile*0.25);
  for(var di=drawOrder.length-1;di>=0;di--){
    var i=drawOrder[di],t=tiles[i];
    if(!t.alive)continue;
    var px=M+maxZs*sx+t.c*tile-t.z*sx;
    var py=M+maxZs*sy+t.r*tile-t.z*sy;
    if(bx>=px-pad&&bx<=px+tile+pad&&by>=py-pad&&by<=py+tile+pad)return i;
  }
  return -1;
}
function removePair(a,b){
  tmap.delete(K(tiles[a].c,tiles[a].r,tiles[a].z));
  tmap.delete(K(tiles[b].c,tiles[b].r,tiles[b].z));
  tiles[a].alive=false;tiles[b].alive=false;
  remaining-=2;paired++;
  sel=-1;hintPair=null;
  updStats();
  if(remaining===0){say("全部消除！");winLevel();return;}
  if(!findHint())shuffleBoard(false);
  else say("消除成功，还剩 "+remaining+" 张");
  render();
}
/* ---------- 胜利 ---------- */
function winLevel(){
  stopTimer();
  cleared=Math.max(cleared,cur+1);
  var rec=parseInt(best[cur],10)||0;
  if(!rec||elapsed<rec)best[cur]=elapsed;
  saveGame();
  if(GB.available)GB.reportScore("mahjong-solitaire",{metricValue:cleared,metricExtra:elapsed}).catch(function(){});
  var last=cur>=LEVELS.length-1;
  $("ovTitle").textContent=last?"全部通关！":"过关！";
  $("ovDesc").innerHTML="第 <b>"+(cur+1)+"</b> 关完成 · 用时 "+fmt(elapsed)+"<br>已通关 "+cleared+" / "+LEVELS.length+" 关";
  $("ovBtn").textContent=last?"再玩一遍":"下一关";
  $("overlay").classList.add("show");
  render();
}
function hideOverlay(){$("overlay").classList.remove("show")}
$("ovBtn").addEventListener("click",function(){
  startLevel(cur<LEVELS.length-1?cur+1:0);
});
/* ---------- 选关 ---------- */
function openLevels(){
  var grid=$("lvGrid");
  grid.innerHTML="";
  var maxOk=Math.min(cleared,LEVELS.length-1);
  for(var i=0;i<LEVELS.length;i++){
    var b=document.createElement("button");
    b.className="lvbtn"+(i===cur?" on":"");
    b.textContent=String(i+1);
    b.disabled=i>maxOk;
    b.addEventListener("click",(function(idx){
      return function(){startLevel(idx);$("lvOverlay").classList.remove("show");};
    })(i));
    grid.appendChild(b);
  }
  $("lvDesc").textContent="已通关 "+cleared+" / "+LEVELS.length+" 关 · 点数字进入对应关卡";
  $("lvOverlay").classList.add("show");
}
$("lvClose").addEventListener("click",function(){$("lvOverlay").classList.remove("show")});
/* ---------- 按钮 ---------- */
$("btnHint").addEventListener("click",function(){
  var h=findHint();
  if(!h){say("当前没有可消除的牌，试试洗牌");return;}
  hintPair=h;sel=-1;
  say("已高亮一对可消除的牌");
  render();
});
$("btnShuffle").addEventListener("click",function(){shuffleBoard(true)});
$("btnLevels").addEventListener("click",openLevels);
$("btnRestart").addEventListener("click",function(){startLevel(cur)});
/* ---------- 触摸：点按 + 双指缩放 + 拖动 ---------- */
var pointers=new Map(),gesture=null,lastTap=0,lastX=0,lastY=0;
function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function clampView(){
  var w=boardW*view.scale,h=boardH*view.scale;
  view.tx=w<=boardW?0:clamp(view.tx,boardW-w,0);
  view.ty=h<=boardH?0:clamp(view.ty,boardH-h,0);
}
function setScale(ns,focusX,focusY){
  var rect=cv.getBoundingClientRect();
  var fx=focusX-rect.left,fy=focusY-rect.top;
  var bx=(fx-view.tx)/view.scale,by=(fy-view.ty)/view.scale;
  view.scale=clamp(ns,1,3);
  view.tx=fx-bx*view.scale;view.ty=fy-by*view.scale;
  clampView();
  render();
}
cv.addEventListener("pointerdown",function(e){
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  var aw=stage.clientWidth||360;
  if(Math.abs(aw-lastAvail)>2)resize();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    gesture={x:e.clientX,y:e.clientY,moved:false,t:performance.now(),tx0:view.tx,ty0:view.ty,pinch:false};
  }else if(pointers.size===2){
    var pts=[...pointers.values()];
    gesture={pinch:true,d0:dist(pts[0],pts[1]),s0:view.scale,moved:true};
  }
});
cv.addEventListener("pointermove",function(e){
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2&&gesture&&gesture.pinch){
    var pts=[...pointers.values()];
    var d=dist(pts[0],pts[1]);
    if(d>0)setScale(gesture.s0*d/gesture.d0,(pts[0].x+pts[1].x)/2,(pts[0].y+pts[1].y)/2);
  }else if(pointers.size===1&&gesture&&!gesture.pinch){
    var dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;
    if(Math.abs(dx)+Math.abs(dy)>8)gesture.moved=true;
    if(gesture.moved){view.tx=gesture.tx0+dx;view.ty=gesture.ty0+dy;clampView();render();}
  }
});
function endPointer(e){
  if(!pointers.has(e.pointerId))return;
  pointers.delete(e.pointerId);
  if(pointers.size<2&&gesture&&gesture.pinch){gesture=null;return;}
  if(pointers.size===0){
    if(gesture&&!gesture.moved&&!gesture.pinch&&performance.now()-gesture.t<500){
      var now=performance.now();
      var rect=cv.getBoundingClientRect();
      var x=e.clientX-rect.left,y=e.clientY-rect.top;
      if(now-lastTap<300&&Math.abs(x-lastX)<30&&Math.abs(y-lastY)<30){
        view.scale=1;view.tx=0;view.ty=0;clampView();render();lastTap=0;
      }else{
        lastTap=now;lastX=x;lastY=y;
        handleTap(e.clientX,e.clientY);
      }
    }
    gesture=null;
  }
}
cv.addEventListener("pointerup",endPointer);
cv.addEventListener("pointercancel",endPointer);
stage.addEventListener("contextmenu",function(e){e.preventDefault();});
window.addEventListener("resize",function(){resize();});
if(typeof ResizeObserver!=="undefined")new ResizeObserver(function(){resize();}).observe(stage);
document.addEventListener("visibilitychange",function(){if(!document.hidden)render();});
/* ---------- 启动 ---------- */
palLoad();
cur=clamp(saveData.lv||0,0,LEVELS.length-1);
startLevel(cur);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
</body>
