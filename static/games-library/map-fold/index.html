<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>折纸对位</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（--g-mf-p1..p4 为四色纸面，深色为同色相压暗变体）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-on-primary:#FFFFFF;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-hairline:#EFF1EE;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-mf-p1:#E0708A;--g-mf-p2:#E8B84A;--g-mf-p3:#5AA7E8;--g-mf-p4:#8E6FC0;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-hairline:#262A27;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-mf-p1:#E88CA2;--g-mf-p2:#F0C96A;--g-mf-p3:#74BDF2;--g-mf-p4:#A98CD6;color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 8px; text-align: center; line-height: 1.3; min-width: 0; animation: rise .38s ease-out both; }
  .stat:nth-child(2) { animation-delay: 40ms; }
  .stat:nth-child(3) { animation-delay: 80ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { display: inline-block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.low { color: var(--g-danger); }
  .stat .val.pop { animation: valpop .24s ease-out; }
  .stage { position: relative; animation: fadein .3s ease-out both; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); box-shadow: var(--g-shadow); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 2px 0; }
  .lg-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--g-surface2); border-radius: 10px; padding: 4px 8px; font-size: 12px; color: var(--g-muted); line-height: 1.3; }
  .lg-chip .sw { width: 12px; height: 12px; border-radius: 4px; flex: none; }
  .lg-chip .sw.p1 { background: var(--g-mf-p1); }
  .lg-chip .sw.p2 { background: var(--g-mf-p2); }
  .lg-chip .sw.back { background: var(--g-surface2); border: 1px solid var(--g-border); }
  .lg-chip .sw.tgt { background: var(--g-surface); border: 1px solid var(--g-border); }
  .lg-chip .sw.fold { width: 16px; height: 2px; border-radius: 1px; background: repeating-linear-gradient(90deg, var(--g-warning) 0 4px, transparent 4px 7px); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out;
  }
  .btn.primary { background: var(--g-btn-primary); color: var(--g-on-primary); font-size: 16px; font-weight: 600; }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .35; }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes valpop { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
    transition: transform .14s ease-out, background .16s ease-out;
  }
  .lvbtn:active { transform: scale(.96); }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* 动效敏感用户降级——保留状态切换，压平装饰动效（同时压 animation-duration 与 animation-delay） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

  /* 键盘焦点可见 */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}

  .ctlrow { display: flex; gap: 8px; margin-bottom: 8px; }
  .foldpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .fp { min-height: 44px; border: 0; border-radius: var(--g-radius-btn); background: var(--g-surface2); color: var(--g-text); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .14s ease-out, background .16s ease-out; }
  .fp:active { transform: scale(.96); }

</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<div class="wrap">

</div>

  </div>
</div>

var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };

/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="map-fold",SAVE_KEY="sw.mapfold.v1";
var DEFAULT_LEVELS=DEFAULT_LEVELS_SRC;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  levelOk=new Array(LEVELS.length);
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
var levelOk=new Array(LEVELS.length);
function verifyPending(){   // 后台逐关复核（分片避免卡顿）：坏关禁选、当前关即时告警
  var i=0;
  function step(){
    var t0=Date.now();
    while(i<LEVELS.length&&Date.now()-t0<40){
      if(levelOk[i]===undefined)levelOk[i]=verifyLevel(LEVELS[i]);
      i++;
    }
    if(i<LEVELS.length)setTimeout(step,0);
    else if(typeof renderLevels==="function")renderLevels();
  }
  setTimeout(step,0);
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0)),done:(s.done&&typeof s.done==="object")?s.done:{}}}catch(e){return{lv:0,done:{}}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
      if(typeof resize==="function")resize();
    }
  }).catch(function(){});
}
/* ---------- 选关浮层（lvgrid 通用） ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(save.done[i]?" done":"");
      b.textContent=i+1;
      b.disabled=(levelOk[i]===false)||(i>save.lv);   // 验证失败的关禁选；未验证的关乐观放行
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  setOvBtn("取消","x");
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 结构校验 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.w)||d.w<6||d.w>7)return false;
  if(!Number.isInteger(d.h)||d.h<6||d.h>7)return false;
  var N=d.w*d.h;
  if(!Array.isArray(d.init)||d.init.length!==N)return false;
  for(var i=0;i<N;i++)if(!Number.isInteger(d.init[i])||d.init[i]<0||d.init[i]>3)return false;
  if(!Number.isInteger(d.tw)||d.tw<2||d.tw>d.w)return false;
  if(!Number.isInteger(d.th)||d.th<2||d.th>d.h)return false;
  if(d.th*d.tw<6)return false;
  if(!Array.isArray(d.target)||d.target.length!==d.th*d.tw)return false;
  for(var j=0;j<d.target.length;j++)if(!Number.isInteger(d.target[j])||d.target[j]<0||d.target[j]>3)return false;
  if(!Number.isInteger(d.folds)||d.folds<1||d.folds>3)return false;
  return true;
}
/* ---------- 独立验证器：折叠转移 BFS（与交互逻辑分离） ---------- */
function mfFoldOnce(top,oh,ow,op){
  var line=op.line,y,x,row;
  if(op.axis==="h"){
    if(op.dir==="a"){
      var newOh=oh-line,out=[];
      for(y=0;y<newOh;y++){
        var absY=y+line,srcY=2*line-1-absY;
        out.push((srcY>=0&&srcY<line)?top[srcY]:top[absY]);
      }
      return {top:out,oh:newOh,ow:ow};
    }else{
      var out2=[];
      for(y=0;y<line;y++){
        var srcY2=2*line-1-y;
        out2.push((srcY2>=line&&srcY2<oh)?top[srcY2]:top[y]);
      }
      return {top:out2,oh:line,ow:ow};
    }
  }else{
    if(op.dir==="a"){
      var newOw=ow-line,out3=[];
      for(y=0;y<oh;y++){
        row=[];
        for(x=0;x<newOw;x++){
          var absX=x+line,srcX=2*line-1-absX;
          row.push((srcX>=0&&srcX<line)?top[y][srcX]:top[y][absX]);
        }
        out3.push(row);
      }
      return {top:out3,oh:oh,ow:newOw};
    }else{
      var out4=[];
      for(y=0;y<oh;y++){
        row=[];
        for(x=0;x<line;x++){
          var srcX2=2*line-1-x;
          row.push((srcX2>=line&&srcX2<ow)?top[y][srcX2]:top[y][x]);
        }
        out4.push(row);
      }
      return {top:out4,oh:oh,ow:line};
    }
  }
}
function mfKey(st){return st.oh+","+st.ow+","+st.top.map(function(r){return r.join("")}).join("|")}
function verifyLevel(L){
  if(!validLevelData(L))return false;
  var top=[];
  for(var y=0;y<L.h;y++){
    var row=[];
    for(var x=0;x<L.w;x++)row.push(L.init[y*L.w+x]);
    top.push(row);
  }
  var tKey=L.th+","+L.tw+","+L.target.map(function(v){return String(v)}).join("");
  var frontier=[{top:top,oh:L.h,ow:L.w}],seen={},depth=0;
  seen[mfKey(frontier[0])]=1;
  while(depth<L.folds){
    var next=[];
    for(var f=0;f<frontier.length;f++){
      var st=frontier[f];
      var ops=[];
      for(var k=1;k<st.oh;k++){
        if(2*k<=st.oh)ops.push({axis:"h",line:k,dir:"a"});
        if(2*(st.oh-k)<=st.oh)ops.push({axis:"h",line:k,dir:"b"});
      }
      for(var k2=1;k2<st.ow;k2++){
        if(2*k2<=st.ow)ops.push({axis:"v",line:k2,dir:"a"});
        if(2*(st.ow-k2)<=st.ow)ops.push({axis:"v",line:k2,dir:"b"});
      }
      for(var o=0;o<ops.length;o++){
        var ns=mfFoldOnce(st.top,st.oh,st.ow,ops[o]),key=mfKey(ns);
        if(seen[key])continue;
        seen[key]=1;
        var tFlat="",nFlat="";
        for(var q=0;q<L.th;q++)for(var q2=0;q2<L.tw;q2++)tFlat+=L.target[q*L.tw+q2];
        for(var q3=0;q3<ns.oh;q3++)nFlat+=ns.top[q3].join("");
        if(ns.oh===L.th&&ns.ow===L.tw&&nFlat===tFlat)return true;
        next.push(ns);
      }
    }
    frontier=next;
    depth++;
  }
  return false;
}

var PAL={};
function palLoad(){

  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),success:v("--g-success"),warning:v("--g-warning"),

/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
function rr(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

    for(var x=0;x<L.w;x++)row.push(L.init[y*L.w+x]);

/* ---------- 折叠 ---------- */
function foldOnceG(op){
  var out=[],y,x,row;
  if(op.axis==="h"){
    var line=op.line;
    if(op.dir==="a"){
      var newOh=oh-line;
      for(y=0;y<newOh;y++){
        var absY=y+line,srcY=2*line-1-absY;
        out.push((srcY>=0&&srcY<line)?top[srcY]:top[absY]);
      }
      top=out;oh=newOh;
    }else{
      for(y=0;y<line;y++){
        var srcY2=2*line-1-y;
        out.push((srcY2>=line&&srcY2<oh)?top[srcY2]:top[y]);
      }
      top=out;oh=line;
    }
  }else{
    var line2=op.line;
    if(op.dir==="a"){
      var newOw=ow-line2;
      for(y=0;y<oh;y++){
        row=[];
        for(x=0;x<newOw;x++){
          var absX=x+line2,srcX=2*line2-1-absX;
          row.push((srcX>=0&&srcX<line2)?top[y][srcX]:top[y][absX]);
        }
        out.push(row);
      }
      top=out;ow=newOw;
    }else{
      for(y=0;y<oh;y++){
        row=[];
        for(x=0;x<line2;x++){
          var srcX2=2*line2-1-x;
          row.push((srcX2>=line2&&srcX2<ow)?top[y][srcX2]:top[y][x]);
        }
        out.push(row);
      }
      top=out;ow=line2;
    }
  }
}
function doFold(op){
  if(done)return;
  var max=op.axis==="h"?oh-1:ow-1;
  if(op.line<1||op.line>max){say("折线位置不对");return}
  if(op.axis==="h"&&op.dir==="a"&&2*op.line>oh){say("上半太宽，折不过去");return}
  if(op.axis==="h"&&op.dir==="b"&&2*(oh-op.line)>oh){say("下半太宽，折不过去");return}
  if(op.axis==="v"&&op.dir==="a"&&2*op.line>ow){say("左半太宽，折不过去");return}
  if(op.axis==="v"&&op.dir==="b"&&2*(ow-op.line)>ow){say("右半太宽，折不过去");return}
  history.push({top:snapshot(),oh:oh,ow:ow});
  foldOnceG(op);
  steps++;
  selLineH=Math.min(selLineH,oh-1)||1;
  selLineV=Math.min(selLineV,ow-1)||1;
  updCtl();updStats();checkWin();
}
function snapshot(){
  return top.map(function(r){return r.slice()});
}
function undo(){
  if(!history.length||done)return;
  var hh=history.pop();
  top=hh.top;oh=hh.oh;ow=hh.ow;steps--;
  selLineH=Math.min(selLineH,oh-1)||1;
  selLineV=Math.min(selLineV,ow-1)||1;
  updCtl();updStats();say("展开一步");
}
function checkWin(){
  if(done)return;
  if(oh!==L.th||ow!==L.tw)return;
  for(var y=0;y<L.th;y++)for(var x=0;x<L.tw;x++)
    if(top[y][x]!==L.target[y*L.tw+x])return;
  done=true;
  save.done[lv]=true;
  if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:steps}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"折出目标！";
  $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成 · 折了 "+steps+" 步（参考 "+L.folds+" 步）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  setOvBtn((lv>=LEVELS.length-1)?"回到第 1 关":"下一关",(lv>=LEVELS.length-1)?"rotate":"play");
  $("overlay").classList.add("show");
}
/* ---------- 绘制 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cs=Math.min(Math.floor((wCss-140)/Math.max(L?L.w:6,L?L.w:6)),48);
  W=Math.round(wCss);H=Math.round(Math.max(L?L.h:6,(L?L.th:4))*cs+24);
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function draw(){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  if(!L)return;
  var ox=8,oy=8;
  var pw=L.w*cs,ph=L.h*cs;
  // 托盘（地面 / 边界）：内凹底 + 顶缘亮线 + 落地投影
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.20)";ctx.shadowBlur=14;ctx.shadowOffsetY=5;
  var gt=ctx.createLinearGradient(0,oy-6,0,oy+ph+6);
  gt.addColorStop(0,colMix(PAL.surface2,BLACK,0.06));
  gt.addColorStop(1,colMix(PAL.surface2,BLACK,0.14));
  ctx.fillStyle=gt;rr(ox-6,oy-6,pw+12,ph+12,12);ctx.fill();
  ctx.restore();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.border;
  rr(ox-5.5,oy-5.5,pw+11,ph+11,11);ctx.stroke();
  ctx.fillStyle=WHITE;ctx.globalAlpha=0.35;
  ctx.fillRect(ox-4,oy-4,pw+8,2);ctx.globalAlpha=1;
  // 已折走区域：凹槽底（比托盘再暗一档）
  ctx.fillStyle=colMix(PAL.surface2,BLACK,0.16);
  if(oh<L.h)ctx.fillRect(ox,oy+oh*cs,pw,(L.h-oh)*cs);
  if(ow<L.w)ctx.fillRect(ox+ow*cs,oy,(L.w-ow)*cs,oh*cs);
  // 当前纸格：渐变面 + 顶光 + 落地投影
  var gap=Math.max(1.5,cs*0.055),rad=Math.min(10,cs*0.18);
  for(var y=0;y<oh;y++)for(var x=0;x<ow;x++){
    var cx=ox+x*cs,cy=oy+y*cs,w=cs-2*gap;
    var col=PAL.f[top[y][x]]||PAL.f[0];
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.20)";ctx.shadowBlur=cs*0.09;ctx.shadowOffsetY=cs*0.035;
    var g=ctx.createLinearGradient(0,cy+gap,0,cy+gap+w);
    g.addColorStop(0,colMix(col,WHITE,0.34));
    g.addColorStop(0.45,col);
    g.addColorStop(1,colShade(col,-0.24));
    ctx.fillStyle=g;rr(cx+gap,cy+gap,w,w,rad);ctx.fill();
    ctx.restore();
    ctx.fillStyle=WHITE;ctx.globalAlpha=0.30;
    rr(cx+gap+2,cy+gap+1.5,w-4,Math.max(2,w*0.16),Math.min(6,rad*0.7));ctx.fill();
    ctx.globalAlpha=1;
    ctx.lineWidth=1;ctx.strokeStyle=colMix(col,BLACK,0.22);
    rr(cx+gap+0.5,cy+gap+0.5,w-1,w-1,rad);ctx.stroke();
  }
  // 折线指示（虚线 + 柔光）
  if(!done){
    ctx.save();
    ctx.strokeStyle=PAL.warning;ctx.lineWidth=2.5;ctx.lineCap="round";
    ctx.setLineDash([7,6]);
    ctx.shadowColor="rgba(0,0,0,0.18)";ctx.shadowBlur=3;ctx.shadowOffsetY=1;
    ctx.beginPath();
    if(selAxis==="h"){
      var fy=oy+selLineH*cs;
      ctx.moveTo(ox,fy);ctx.lineTo(ox+pw,fy);
    }else{
      var fx=ox+selLineV*cs;
      ctx.moveTo(fx,oy);ctx.lineTo(fx,oy+ph);
    }
    ctx.stroke();
    ctx.restore();
    ctx.setLineDash([]);
  }
  // 目标图案（右上）：小卡面 + 渐变格
  var ts=Math.max(18,Math.min(26,Math.floor(cs*0.6)));
  var tox=W-8-L.tw*ts,toy=8;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.16)";ctx.shadowBlur=10;ctx.shadowOffsetY=4;
  var tg=ctx.createLinearGradient(0,toy-4,0,toy+L.th*ts+22);
  tg.addColorStop(0,PAL.surface);tg.addColorStop(1,PAL.surface2);
  ctx.fillStyle=tg;rr(tox-6,toy-4,L.tw*ts+12,L.th*ts+26,10);ctx.fill();
  ctx.restore();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.border;rr(tox-5.5,toy-3.5,L.tw*ts+11,L.th*ts+25,9);ctx.stroke();
  ctx.fillStyle=PAL.muted;ctx.font="700 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="top";
  ctx.fillText("目标 "+L.tw+"×"+L.th,tox+L.tw*ts/2,toy+L.th*ts+4);
  var tgap=1.5,trad=Math.min(6,ts*0.2);
  for(var ty=0;ty<L.th;ty++)for(var tx=0;tx<L.tw;tx++){
    var col2=PAL.f[L.target[ty*L.tw+tx]]||PAL.f[0];
    var tx0=tox+tx*ts+tgap,ty0=toy+ty*ts+tgap,tw2=ts-2*tgap;
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.16)";ctx.shadowBlur=3;ctx.shadowOffsetY=1;
    var g2=ctx.createLinearGradient(0,ty0,0,ty0+tw2);
    g2.addColorStop(0,colMix(col2,WHITE,0.30));
    g2.addColorStop(0.5,col2);
    g2.addColorStop(1,colShade(col2,-0.22));
    ctx.fillStyle=g2;rr(tx0,ty0,tw2,tw2,trad);ctx.fill();
    ctx.restore();
    ctx.lineWidth=1;ctx.strokeStyle=colMix(col2,BLACK,0.22);
    rr(tx0+0.5,ty0+0.5,tw2-1,tw2-1,trad);ctx.stroke();
  }
  requestAnimationFrame(draw);
}

/* S4：隐藏时停 rAF 循环，恢复时续跑并重绘（rAF 在隐藏页本就被浏览器挂起，此处保证恢复续跑） */

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
