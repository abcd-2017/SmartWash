<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

var LEVELS=DEFAULT_LEVELS;
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  for(var i=0;i<list.length;i++){
    var o=list[i];
    if(!o||typeof o!=="object"||!o.spawn||!o.bucket||!Array.isArray(o.walls)||!o.inv)return false;
  }
  LEVELS=list;
  try{lsSet(LKEY,JSON.stringify(list));lsSet(VKEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(lsGet(VKEY),10)||0;
    var list=JSON.parse(lsGet(LKEY)||"null");
    if(Array.isArray(list)&&list.length&&list[0]&&list[0].spawn){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}

function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("marble-run").then(function(res){
    if(!res||!Array.isArray(res.levels))return;
    var list=[];
    for(var i=0;i<res.levels.length;i++){
      try{list.push(JSON.parse(res.levels[i].dataJson));}catch(e){return;}
    }
    if(applyLevels(list,res.version||0)){
      if(lvIdx>LEVELS.length-1)lvIdx=LEVELS.length-1;
      save.lv=Math.min(save.lv,lvIdx);persist();
      loadLevel(lvIdx);

  }).catch(function(){});
}

var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
function rr(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/* 弹珠物理（棋盘内局部坐标）：斜轨反射、弹珠台弹射、墙块碰撞、木桶捕获 */
var MR=8,GRAV=780,REST=0.38,FRIC=0.992;
function rampSeg(cx,cy,type){
  var x0=cx*CELL,y0=cy*CELL;
  if(type==="r")return[x0,y0+CELL,x0+CELL,y0];
  return[x0,y0,x0+CELL,y0+CELL];
}
function collideSeg(st,ax,ay,bx,by,rest,fric){
  var dx=bx-ax,dy=by-ay,len2=dx*dx+dy*dy;
  if(len2===0)return;
  var t=((st.x-ax)*dx+(st.y-ay)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  var px=ax+dx*t,py=ay+dy*t;
  var nx=st.x-px,ny=st.y-py;
  var d=Math.sqrt(nx*nx+ny*ny);
  if(d>MR)return;
  if(d<0.001){nx=0;ny=-1}else{nx/=d;ny/=d}
  if(ny>0){nx=-nx;ny=-ny}
  st.x=px+nx*(MR+0.4);st.y=py+ny*(MR+0.4);
  var vn=st.vx*nx+st.vy*ny;
  if(vn<0){
    st.vx-=(1+rest)*vn*nx;
    st.vy-=(1+rest)*vn*ny;
    st.vx*=fric;st.vy*=fric;
  }
}
function collideBox(st,bx,by,bw,bh){
  var inside=(st.x>bx&&st.x<bx+bw&&st.y>by&&st.y<by+bh);
  var cx=Math.max(bx,Math.min(st.x,bx+bw));
  var cy=Math.max(by,Math.min(st.y,by+bh));
  var dx=st.x-cx,dy=st.y-cy,d2=dx*dx+dy*dy;
  if(!inside&&d2>=MR*MR)return;
  if(inside||d2<0.001){
    var l=st.x-bx,r2=bx+bw-st.x,tp=st.y-by,bt=by+bh-st.y;
    var m=Math.min(l,r2,tp,bt);
    if(m===l){st.x=bx-MR;st.vx=-Math.abs(st.vx)*0.3}
    else if(m===r2){st.x=bx+bw+MR;st.vx=Math.abs(st.vx)*0.3}
    else if(m===tp){st.y=by-MR;st.vy=-Math.abs(st.vy)*0.3}
    else{st.y=by+bh+MR;st.vy=Math.abs(st.vy)*0.3}
    return;
  }
  var d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
  st.x=cx+nx*MR;st.y=cy+ny*MR;
  var vn=st.vx*nx+st.vy*ny;
  if(vn<0){st.vx-=(1+0.3)*vn*nx;st.vy-=(1+0.3)*vn*ny}
}
function hitPiece(st,cx,cy,type){
  if(type==="b"){
    var bx=cx*CELL+CELL/2,by=cy*CELL+CELL/2;
    var dx=st.x-bx,dy=st.y-by,d=Math.sqrt(dx*dx+dy*dy);
    var rr=MR+13;
    if(d<rr){
      if(d<0.001){dx=0;dy=-1}else{dx/=d;dy/=d}
      st.x=bx+dx*(rr+0.4);st.y=by+dy*(rr+0.4);
      st.vx=dx*250;st.vy=dy*250;
    }
    return;
  }
  var sg=rampSeg(cx,cy,type);
  collideSeg(st,sg[0],sg[1],sg[2],sg[3],REST,FRIC);
}
function stepMarble(st,dt,L,placed){
  var sub=2,h=dt/sub;
  for(var s=0;s<sub;s++){
    st.vy+=GRAV*h;
    st.x+=st.vx*h;st.y+=st.vy*h;
    if(st.x<MR){st.x=MR;st.vx=Math.abs(st.vx)*0.4}
    if(st.x>COLS*CELL-MR){st.x=COLS*CELL-MR;st.vx=-Math.abs(st.vx)*0.4}
    var i,pc;
    for(i=0;i<L.pre.length;i++){pc=L.pre[i];hitPiece(st,pc[0],pc[1],pc[2])}
    for(var k in placed)hitPiece(st,+k.split(",")[0],+k.split(",")[1],placed[k]);
    for(i=0;i<L.walls.length;i++){
      var w=L.walls[i];
      collideBox(st,w[0]*CELL,w[1]*CELL,CELL,CELL);
    }
    var b=L.bucket,bcx=b[0]*CELL+CELL/2,bty=b[1]*CELL;
    if(st.vy>0&&Math.abs(st.x-bcx)<15&&st.y>bty-8&&st.y<bty+30)return "win";
    if(st.y>ROWS*CELL+60)return "fail";
  }
  return "run";
}

  showOv({k:"MARBLE RUN",t:"弹珠轨道",
    x:"部件有限：斜轨改弹道、弹珠台重新弹射。铺一条从落珠口到木桶的轨道再放珠；弹珠掉出底部或超时即失败，铺过的件可拆回重用。",
    stats:[["进度",lvIdx+1+"/"+LEVELS.length],["总分",S.score]],
    btns:[["开始 · 第 "+(lvIdx+1)+" 关","primary",function(){loadLevel(lvIdx)}]]});
}
/* ---------- 铺设与放珠 ---------- */
function tapCell(cx,cy){
  if(S.phase!=="run"||S.paused||S.marble)return;
  var L=curLv();
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS)return;
  var k=key(cx,cy);
  if(cx===L.spawn[0]&&cy===L.spawn[1]){S.msg="落珠口不能铺";flashMsg();return}
  if(cx===L.bucket[0]&&cy===L.bucket[1]){S.msg="木桶不能铺";flashMsg();return}
  for(var i=0;i<L.walls.length;i++)if(L.walls[i][0]===cx&&L.walls[i][1]===cy){S.msg="墙块不能铺";flashMsg();return}
  for(i=0;i<L.pre.length;i++)if(L.pre[i][0]===cx&&L.pre[i][1]===cy){S.msg="固定件不能拆";flashMsg();return}
  if(S.placed[k]){delete S.placed[k];syncHud();return}
  if(invLeft(S.sel)<=0){S.msg="该部件用完了";flashMsg();return}
  S.placed[k]=S.sel;S.cur=[cx,cy];
  syncHud();
}
function flashMsg(){S.floats.push({x:MW/2,y:OY+ROWS*CELL+24,txt:S.msg,col:PAL.danger,t:1})}
function release(){
  if(S.phase!=="run"||S.paused||S.marble)return;
  var L=curLv();
  var drift=L.drift||0;
  S.marble={x:L.spawn[0]*CELL+CELL/2,y:L.spawn[1]*CELL+MR+4,vx:drift,vy:0};
  S.rollT=0;
}
function rollEnd(win){
  var L=curLv();
  S.marble=null;
  if(win){
    S.lvScore=100+invLeft("r")*8+invLeft("l")*8+invLeft("b")*8;
    S.score+=S.lvScore;
    var next=false;
    if(lvIdx+1<LEVELS.length&&lvIdx+1>save.lv){save.lv=lvIdx+1;next=true}
    persist();
    if(GB.available)GB.reportScore("marble-run",{metricValue:save.lv+1,metricExtra:"总分"+S.score}).catch(function(){});
    var hasNext=lvIdx+1<LEVELS.length;
    showOv({k:"IN THE BUCKET",t:"进桶！",
      x:next?"解锁下一关：路径更长、墙更多，省下的部件都算分。":"全部关卡完成，轨道大师！",
      stats:[["本关得分",S.lvScore],["总分",S.score],["用时",S.rollT.toFixed(1)+"s"]],
      btns:hasNext?[["下一关","primary",function(){loadLevel(lvIdx+1)}],["重玩本关","ghost",function(){loadLevel(lvIdx)}]]
                  :[["再来一轮","primary",function(){loadLevel(0)}]]});
  }else{
    showOv({k:"MISS",t:"弹珠掉出了",
      x:"弹珠没能进桶。轨道可以拆了重铺，再放一次试试。",
      stats:[["用时",S.rollT.toFixed(1)+"s"]],
      btns:[["调整重放","primary",function(){hideOv()}]]});
  }
}
/* ---------- 绘制 ---------- */
var SC=1;
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  SC=r.width/MW;
  ctx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
}
function drawRail(cx,cy,type,ghost){
  var x0=OX+cx*CELL,y0=OY+cy*CELL;
  var sg=type==="r"?[x0,y0+CELL,x0+CELL,y0]:[x0,y0,x0+CELL,y0+CELL];
  var mx=(sg[0]+sg[2])/2,my=(sg[1]+sg[3])/2;
  if(ghost)ctx.globalAlpha=0.4;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.28)";ctx.shadowBlur=4;ctx.shadowOffsetY=2;
  var g=ctx.createLinearGradient(sg[0],sg[1],sg[2],sg[3]);
  g.addColorStop(0,colMix(PAL.rail,WHITE,0.28));
  g.addColorStop(0.5,PAL.rail);
  g.addColorStop(1,colShade(PAL.rail,-0.28));
  ctx.strokeStyle=g;ctx.lineWidth=6;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(sg[0],sg[1]);ctx.lineTo(sg[2],sg[3]);ctx.stroke();
  ctx.restore();
  ctx.strokeStyle=WHITE;ctx.globalAlpha=(ghost?0.4:1)*0.32;ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(sg[0]-1.5,sg[1]-1.5);ctx.lineTo(sg[2]-1.5,sg[3]-1.5);ctx.stroke();
  ctx.globalAlpha=ghost?0.4:1;
  ctx.strokeStyle=colShade(PAL.rail,-0.35);ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx,my+9);ctx.stroke();
  ctx.globalAlpha=1;
}
function drawBouncer(cx,cy,ghost){
  var x=OX+cx*CELL+CELL/2,y=OY+cy*CELL+CELL/2;
  if(ghost)ctx.globalAlpha=0.4;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=5;ctx.shadowOffsetY=2;
  var g=ctx.createRadialGradient(x-4,y-5,2,x,y,14);
  g.addColorStop(0,colMix(PAL.rail,WHITE,0.45));
  g.addColorStop(0.55,PAL.rail);
  g.addColorStop(1,colShade(PAL.rail,-0.40));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.lineWidth=2.4;ctx.strokeStyle=colShade(PAL.rail,-0.45);
  ctx.beginPath();ctx.arc(x,y,15.5,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=WHITE;ctx.globalAlpha=(ghost?0.4:1)*0.5;
  ctx.beginPath();ctx.arc(x-4,y-5,3,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}
function drawWall(cx,cy){
  var x=OX+cx*CELL+3,y=OY+cy*CELL+3,w=CELL-6;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=5;ctx.shadowOffsetY=2;
  var g=ctx.createLinearGradient(0,y,0,y+w);
  g.addColorStop(0,colMix(PAL.rail,BLACK,0.22));
  g.addColorStop(1,colMix(PAL.rail,BLACK,0.52));
  ctx.fillStyle=g;rr(x,y,w,w,6);ctx.fill();
  ctx.restore();
  ctx.fillStyle=WHITE;ctx.globalAlpha=0.16;
  rr(x+2,y+1.5,w-4,Math.max(2,w*0.16),4);ctx.fill();
  ctx.globalAlpha=1;
  ctx.lineWidth=1;ctx.strokeStyle=colMix(PAL.rail,BLACK,0.55);
  rr(x+0.5,y+0.5,w-1,w-1,6);ctx.stroke();
}
function drawPiece(cx,cy,type){
  if(type==="b"){drawBouncer(cx,cy,false);return;}
  drawRail(cx,cy,type,false);
}
function draw(){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,MW,MH);
  var L=curLv();
  //信息条（卡面「面」+ 顶光 + 落地投影）
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.14)";ctx.shadowBlur=10;ctx.shadowOffsetY=3;
  var ig=ctx.createLinearGradient(0,10,0,68);
  ig.addColorStop(0,PAL.surface);ig.addColorStop(1,PAL.surface2);
  ctx.fillStyle=ig;rr(14,10,MW-28,58,12);ctx.fill();
  ctx.restore();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.border;rr(14.5,10.5,MW-29,57,11);ctx.stroke();
  ctx.fillStyle=PAL.text;ctx.font="700 14px system-ui,sans-serif";ctx.textBaseline="middle";ctx.textAlign="left";
  ctx.fillText(S.marble?("滚珠中 "+S.rollT.toFixed(1)+"s"):"铺设轨道，让弹珠进桶",26,30);
  ctx.fillStyle=PAL.muted;ctx.font="400 12px system-ui,sans-serif";
  ctx.fillText("已铺 "+placedCount("r")+placedCount("l")+" 件斜轨 + "+placedCount("b")+" 台 · 点部件芯片切换",26,52);
  //棋盘（地面 / 边界）
  var bx=OX,by=OY,bw=COLS*CELL,bh=ROWS*CELL;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.28)";ctx.shadowBlur=14;ctx.shadowOffsetY=5;
  var bgr=ctx.createLinearGradient(0,by,0,by+bh);
  bgr.addColorStop(0,PAL.board1);bgr.addColorStop(1,PAL.board2);
  ctx.fillStyle=bgr;rr(bx-4,by-4,bw+8,bh+8,12);ctx.fill();
  ctx.restore();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.border;rr(bx-3.5,by-3.5,bw+7,bh+7,11);ctx.stroke();
  //沟槽格线（暗线 + 亮缘）
  var groove=colMix(PAL.board2,BLACK,0.35),glow=colMix(PAL.board1,WHITE,0.10);
  ctx.lineWidth=1;
  for(var i=1;i<COLS;i++){
    ctx.strokeStyle=groove;ctx.beginPath();ctx.moveTo(bx+i*CELL,by);ctx.lineTo(bx+i*CELL,by+bh);ctx.stroke();
    ctx.strokeStyle=glow;ctx.beginPath();ctx.moveTo(bx+i*CELL+1,by);ctx.lineTo(bx+i*CELL+1,by+bh);ctx.stroke();
  }
  for(i=1;i<ROWS;i++){
    ctx.strokeStyle=groove;ctx.beginPath();ctx.moveTo(bx,by+i*CELL);ctx.lineTo(bx+bw,by+i*CELL);ctx.stroke();
    ctx.strokeStyle=glow;ctx.beginPath();ctx.moveTo(bx,by+i*CELL+1);ctx.lineTo(bx+bw,by+i*CELL+1);ctx.stroke();
  }
  //墙块
  for(i=0;i<L.walls.length;i++)drawWall(L.walls[i][0],L.walls[i][1]);
  //固定件
  ctx.globalAlpha=.8;
  for(i=0;i<L.pre.length;i++)drawPiece(L.pre[i][0],L.pre[i][1],L.pre[i][2]);
  ctx.globalAlpha=1;
  //已铺件
  for(var k in S.placed)drawPiece(+k.split(",")[0],+k.split(",")[1],S.placed[k]);
  //光标 + 选中件 ghost 预览（可落点）
  if(!S.marble&&S.phase==="run"){
    var cxp=bx+S.cur[0]*CELL,cyp=by+S.cur[1]*CELL;
    ctx.save();
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;ctx.setLineDash([5,4]);
    rr(cxp+2.5,cyp+2.5,CELL-5,CELL-5,7);ctx.stroke();
    ctx.restore();
    if(S.sel==="b")drawBouncer(S.cur[0],S.cur[1],true);
    else drawRail(S.cur[0],S.cur[1],S.sel,true);
  }
  //落珠口
  var sp=L.spawn,spx=OX+sp[0]*CELL+CELL/2,spy=OY+sp[1]*CELL;
  ctx.fillStyle=PAL.muted;ctx.font="700 12px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("落珠",spx,spy-12);
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.25)";ctx.shadowBlur=4;ctx.shadowOffsetY=2;
  var ag=ctx.createLinearGradient(0,spy+4,0,spy+26);
  ag.addColorStop(0,PAL.deep);ag.addColorStop(1,PAL.primary);
  ctx.fillStyle=ag;ctx.beginPath();
  ctx.moveTo(spx-13,spy+6);ctx.lineTo(spx+13,spy+6);ctx.lineTo(spx,spy+26);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.fillStyle=WHITE;ctx.globalAlpha=0.35;
  ctx.beginPath();ctx.moveTo(spx-6,spy+8);ctx.lineTo(spx+2,spy+8);ctx.lineTo(spx-2,spy+20);ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;
  //木桶（目标）
  var bk=L.bucket,bkx=OX+bk[0]*CELL+CELL/2,bky=OY+bk[1]*CELL;
  ctx.save();
  ctx.strokeStyle=PAL.warning;ctx.globalAlpha=0.55;ctx.lineWidth=2;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.arc(bkx,bky+18,22,0,Math.PI*2);ctx.stroke();
  ctx.restore();
  ctx.setLineDash([]);
  ctx.fillStyle=PAL.muted;ctx.font="700 12px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("木桶 · 目标",bkx,bky-12);
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=6;ctx.shadowOffsetY=3;
  var bkg=ctx.createLinearGradient(0,bky+4,0,bky+36);
  bkg.addColorStop(0,colMix(PAL.rail,WHITE,0.22));
  bkg.addColorStop(0.5,PAL.rail);
  bkg.addColorStop(1,colShade(PAL.rail,-0.40));
  ctx.fillStyle=bkg;ctx.beginPath();
  ctx.moveTo(bkx-17,bky+6);ctx.lineTo(bkx-13,bky+34);ctx.lineTo(bkx+13,bky+34);ctx.lineTo(bkx+17,bky+6);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.strokeStyle=colShade(PAL.rail,-0.45);ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(bkx-15,bky+12);ctx.lineTo(bkx-14,bky+32);ctx.moveTo(bkx+15,bky+12);ctx.lineTo(bkx+14,bky+32);ctx.stroke();
  ctx.lineWidth=2.4;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(bkx-18,bky+6);ctx.lineTo(bkx+18,bky+6);ctx.stroke();
  ctx.strokeStyle=WHITE;ctx.globalAlpha=0.35;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(bkx-16,bky+7.5);ctx.lineTo(bkx+16,bky+7.5);ctx.stroke();
  ctx.globalAlpha=1;
  //弹珠
  if(S.marble){
    var mx2=OX+S.marble.x,my2=OY+S.marble.y;
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.40)";ctx.shadowBlur=6;ctx.shadowOffsetY=3;
    var mg=ctx.createRadialGradient(mx2-3,my2-3.5,1,mx2,my2,MR);
    mg.addColorStop(0,colMix(PAL.marble,WHITE,0.72));
    mg.addColorStop(0.45,PAL.marble);
    mg.addColorStop(1,colShade(PAL.marble,-0.34));
    ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx2,my2,MR,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.fillStyle=WHITE;ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.arc(mx2-2.5,my2-3,2.4,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  //浮字
  ctx.textAlign="center";ctx.font="700 16px system-ui,sans-serif";
  for(i=0;i<S.floats.length;i++){
    var f2=S.floats[i];
    ctx.globalAlpha=Math.min(1,f2.t*1.5);
    ctx.fillStyle=f2.col;ctx.fillText(f2.txt,f2.x,f2.y);
  }
  ctx.globalAlpha=1;
  ctx.textBaseline="alphabetic";
}
function stepFx(dt){
  for(var i=S.floats.length-1;i>=0;i--){
    var f=S.floats[i];f.y-=28*dt;f.t-=dt;
    if(f.t<=0)S.floats.splice(i,1);
  }
}
/* ---------- 输入 ---------- */
function pos(e){
  var r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  var p=pos(e);
  var cx=Math.floor((p.x-OX)/CELL),cy=Math.floor((p.y-OY)/CELL);
  tapCell(cx,cy);
});
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
function select(t){
  if(S.marble)return;
  S.sel=t;syncHud();
}
chipR.addEventListener("click",function(){select("r")});
chipL.addEventListener("click",function(){select("l")});
chipB.addEventListener("click",function(){select("b")});
$("btnGo").addEventListener("click",release);
$("btnWipe").addEventListener("click",function(){if(!S.marble){S.placed={};syncHud()}});
$("btnPause").addEventListener("click",pauseGame);
$("btnReset").addEventListener("click",function(){loadLevel(lvIdx)});
document.addEventListener("keydown",function(e){
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","Enter"].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==="Digit1")select("r");
  if(e.code==="Digit2")select("l");
  if(e.code==="Digit3")select("b");
  if(e.code==="ArrowUp"&&S.cur[1]>0)S.cur[1]--;
  if(e.code==="ArrowDown"&&S.cur[1]<ROWS-1)S.cur[1]++;
  if(e.code==="ArrowLeft"&&S.cur[0]>0)S.cur[0]--;
  if(e.code==="ArrowRight"&&S.cur[0]<COLS-1)S.cur[0]++;
  if(e.code==="Space"&&S.phase==="run")tapCell(S.cur[0],S.cur[1]);
  if(e.code==="Enter"&&S.phase==="run")release();
  if(e.code==="KeyP"&&S.phase==="run"&&!S.marble){S.paused?((S.paused=false),hideOv()):pauseGame()}
  if(e.code==="KeyR"&&S.phase!=="menu")loadLevel(lvIdx);
  if(e.code==="Enter"&&S.phase!=="run")loadLevel(lvIdx);
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&S.phase==="run"&&!S.paused&&!S.marble)pauseGame();
});
/* ---------- 主循环 ---------- */
var lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  var dt=Math.min(.05,(now-lastT)/1000);
  lastT=now;
  if(S.phase==="run"&&!S.paused){
    stepFx(dt);
    if(S.marble){
      S.rollT+=dt;
      var L=curLv();
      var r=stepMarble(S.marble,dt,L,S.placed);
      if(r==="win")rollEnd(true);
      else if(r==="fail"||S.rollT>12)rollEnd(false);
    }
  }
  draw();
}
/* ---------- 启动 ---------- */
palLoad();
injectIcons();
syncHud();
showMenu();
resize();
window.addEventListener("resize",resize);
requestAnimationFrame(loop);
syncSaveFromServer();
syncLevelsFromServer();
})();
</script>
</body>
