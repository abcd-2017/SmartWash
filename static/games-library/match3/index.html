<script>
/*M3-ENGINE-BEGIN*/
var M3=(function(){
  "use strict";
  var N=8;
  function rngNext(rng){
    rng.s=(rng.s+0x6D2B79F5)|0;
    var t=Math.imul(rng.s^(rng.s>>>15),1|rng.s);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  }
  function makeRng(seed){ return {s:(seed|0)}; }
  function cloneGrid(g){
    var o=[],i;
    for(i=0;i<N;i++)o.push(g[i].slice());
    return o;
  }
  function inBounds(r,c){ return r>=0&&r<N&&c>=0&&c<N; }
  function findMatches(g){
    var mark={},r,c,run,k;
    for(r=0;r<N;r++){
      run=1;
      for(c=1;c<=N;c++){
        if(c<N&&g[r][c]>=0&&g[r][c]===g[r][c-1])run++;
        else{ if(run>=3){for(k=c-run;k<c;k++)mark[r*N+k]=1;} run=1; }
      }
    }
    for(c=0;c<N;c++){
      run=1;
      for(r=1;r<=N;r++){
        if(r<N&&g[r][c]>=0&&g[r][c]===g[r-1][c])run++;
        else{ if(run>=3){for(k=r-run;k<r;k++)mark[k*N+c]=1;} run=1; }
      }
    }
    var out=[],key;
    for(key in mark)out.push([Math.floor(+key/N),+key%N]);
    return out;
  }
  function hasMatch(g){ return findMatches(g).length>0; }
  function swapCells(g,r,c,r2,c2){ var t=g[r][c];g[r][c]=g[r2][c2];g[r2][c2]=t; }
  function validMoves(st){
    var g=st.grid,out=[],r,c;
    for(r=0;r<N;r++)for(c=0;c<N;c++){
      if(c+1<N){ swapCells(g,r,c,r,c+1); if(hasMatch(g))out.push([r,c,r,c+1]); swapCells(g,r,c,r,c+1); }
      if(r+1<N){ swapCells(g,r,c,r+1,c); if(hasMatch(g))out.push([r,c,r+1,c]); swapCells(g,r,c,r+1,c); }
    }
    return out;
  }
  function generateBoard(rng,K){
    var g=[],r,c,col;
    for(r=0;r<N;r++){
      g.push([]);
      for(c=0;c<N;c++){
        var forbid={};
        if(c>=2&&g[r][c-1]===g[r][c-2])forbid[g[r][c-1]]=1;
        if(r>=2&&g[r-1][c]===g[r-2][c])forbid[g[r-1][c]]=1;
        do{ col=Math.floor(rngNext(rng)*K); }while(forbid[col]);
        g[r].push(col);
      }
    }
    return g;
  }
  function generatePlayable(rng,K){
    var g=null,i;
    for(i=0;i<2000;i++){
      g=generateBoard(rng,K);
      if(validMoves({grid:g}).length>0)return g;
    }
    return g;
  }
  function reshuffle(st,events){
    st.grid=generatePlayable(st.rng,st.colors);
    if(events)events.reshuffled=true;
    return true;
  }
  function newGame(level){
    var g=[],i,j,row;
    for(i=0;i<N;i++){
      row=[];
      for(j=0;j<N;j++)row.push(level.board.charCodeAt(i*N+j)-48);
      g.push(row);
    }
    var st={grid:g,movesLeft:level.moves,score:0,colors:level.colors,target:level.target,
      rng:makeRng(level.seed),over:false,won:false};
    if(validMoves(st).length===0)reshuffle(st,null);
    return st;
  }
  function trySwap(st,r,c,r2,c2){
    if(!inBounds(r,c)||!inBounds(r2,c2))return {ok:false};
    if(Math.abs(r-r2)+Math.abs(c-c2)!==1)return {ok:false};
    var g=st.grid;
    swapCells(g,r,c,r2,c2);
    if(!hasMatch(g)){ swapCells(g,r,c,r2,c2); return {ok:false}; }
    st.movesLeft--;
    var events={cleared:[],fell:[],spawned:[],depth:0,gain:0,reshuffled:false};
    var depth=0;
    while(true){
      var matches=findMatches(g);
      if(!matches.length)break;
      depth++;
      var i;
      for(i=0;i<matches.length;i++){
        events.cleared.push({r:matches[i][0],c:matches[i][1],color:g[matches[i][0]][matches[i][1]],depth:depth});
      }
      for(i=0;i<matches.length;i++)g[matches[i][0]][matches[i][1]]=-1;
      var gain=matches.length*10;
      events.gain+=gain;st.score+=gain;
      var col,row,write;
      for(col=0;col<N;col++){
        write=N-1;
        for(row=N-1;row>=0;row--){
          if(g[row][col]!==-1){
            if(write!==row){
              g[write][col]=g[row][col];
              g[row][col]=-1;
              events.fell.push({from:row,to:write,c:col,color:g[write][col]});
            }
            write--;
          }
        }
        for(row=write;row>=0;row--){
          var nc=Math.floor(rngNext(st.rng)*st.colors);
          g[row][col]=nc;
          events.spawned.push({r:row,c:col,color:nc});
        }
      }
      events.depth=depth;
    }
    st.won=st.score>=st.target;
    st.over=st.won||st.movesLeft<=0;
    if(!st.over&&validMoves(st).length===0)reshuffle(st,events);
    return {ok:true,events:events,won:st.won,over:st.over};
  }
  return {N:N,rngNext:rngNext,makeRng:makeRng,cloneGrid:cloneGrid,findMatches:findMatches,
    hasMatch:hasMatch,validMoves:validMoves,generateBoard:generateBoard,generatePlayable:generatePlayable,
    newGame:newGame,trySwap:trySwap};
})();
/*M3-ENGINE-END*/
</script>

(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}

})();

var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY="sw.match3.v1.levels",LEVELS_VER_KEY="sw.match3.v1.levels.ver";
function parseMatch3Levels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={},i,j;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    var d;
    try{d=JSON.parse(item.dataJson)}catch(e){return null}
    if(!d||typeof d!=="object"||Array.isArray(d))return null;
    if(typeof d.name!=="string"||!d.name.length||d.name.length>32)return null;
    if(!isFinite(d.moves)||Math.floor(d.moves)!==d.moves||d.moves<5||d.moves>40)return null;
    if(!isFinite(d.target)||Math.floor(d.target)!==d.target||d.target<100||d.target>100000)return null;
    if(!isFinite(d.colors)||Math.floor(d.colors)!==d.colors||d.colors<4||d.colors>6)return null;
    if(!isFinite(d.seed)||Math.floor(d.seed)!==d.seed||d.seed<0||d.seed>2147483647)return null;
    if(typeof d.board!=="string"||d.board.length!==M3.N*M3.N)return null;
    var flat=[],ch,v;
    for(j=0;j<d.board.length;j++){
      ch=d.board.charAt(j);
      if(ch<"0"||ch>"9")return null;
      v=ch.charCodeAt(0)-48;
      if(v>=d.colors)return null;
      flat.push(v);
    }
    var g=[];
    for(j=0;j<M3.N;j++)g.push(flat.slice(j*M3.N,(j+1)*M3.N));
    if(M3.findMatches(g).length>0)return null;
    if(M3.validMoves({grid:g,colors:d.colors}).length===0)return null;
    var no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=true;
    list.push({no:no,name:d.name,moves:d.moves,target:d.target,colors:d.colors,seed:d.seed,board:d.board});
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}

}

function resize(){

  cv.style.height=L.H+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(L.H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function cellXY(r,c){return{x:L.boardX+c*L.cell,y:L.boardY+r*L.cell}}
function pt(e){var rect=cv.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top}}
/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawGem(shape,cx,cy,rad,color,alpha,scale){
  ctx.save();
  ctx.globalAlpha=alpha===undefined?1:alpha;
  ctx.translate(cx,cy);
  ctx.scale(scale||1,scale||1);
  ctx.fillStyle=color;
  ctx.beginPath();
  if(shape===0){ctx.arc(0,0,rad,0,Math.PI*2);}
  else if(shape===1){rr(-rad*0.85,-rad*0.85,rad*1.7,rad*1.7,rad*0.35);}
  else if(shape===2){ctx.moveTo(0,-rad);ctx.lineTo(rad*0.95,rad*0.75);ctx.lineTo(-rad*0.95,rad*0.75);ctx.closePath();}
  else if(shape===3){ctx.moveTo(0,-rad);ctx.lineTo(rad*0.8,0);ctx.lineTo(0,rad);ctx.lineTo(-rad*0.8,0);ctx.closePath();}
  else if(shape===4){for(var i=0;i<6;i++){var a=Math.PI/6+i*Math.PI/3;var x=rad*Math.cos(a),y=rad*Math.sin(a);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.closePath();}
  else{for(var j=0;j<10;j++){var a2=-Math.PI/2+j*Math.PI/5;var r2=(j%2===0)?rad:rad*0.45;var x2=r2*Math.cos(a2),y2=r2*Math.sin(a2);if(j===0)ctx.moveTo(x2,y2);else ctx.lineTo(x2,y2);}ctx.closePath();}
  ctx.fill();
  ctx.globalAlpha=(alpha===undefined?1:alpha)*0.4;
  ctx.fillStyle="rgba(255,255,255,.9)";//恒白高光
  ctx.beginPath();
  ctx.arc(-rad*0.28,-rad*0.32,rad*0.26,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function draw(now){
  if(!st)return;
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,L.W,L.H);
  rr(L.boardX-6,L.boardY-6,L.boardW+12,L.boardW+12,12);
  ctx.fillStyle=PAL.surface;ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.stroke();
  var r,c,px,py;
  for(r=0;r<M3.N;r++)for(c=0;c<M3.N;c++){
    px=L.boardX+c*L.cell;py=L.boardY+r*L.cell;
    rr(px+1,py+1,L.cell-2,L.cell-2,6);
    ctx.fillStyle=((r+c)&1)?PAL.surface2:PAL.surface;
    ctx.fill();
  }
  if(selected&&st&&!st.over){
    px=L.boardX+selected.c*L.cell;py=L.boardY+selected.r*L.cell;
    ctx.strokeStyle=PAL.primary;ctx.lineWidth=3;
    rr(px+2,py+2,L.cell-4,L.cell-4,8);ctx.stroke();
  }
  var rad=L.cell*0.34;
  for(r=0;r<M3.N;r++)for(c=0;c<M3.N;c++){
    if(swapAnim&&((r===swapAnim.ar&&c===swapAnim.ac)||(r===swapAnim.br&&c===swapAnim.bc)))continue;
    var color=st.grid[r][c];
    if(color<0)continue;
    var pos=cellXY(r,c),alpha=1,scale=1;
    var an=anims[r*M3.N+c];
    if(an){
      if(an.type==="fell"){
        var k=(now-an.t0)/160;
        if(k>=1)delete anims[r*M3.N+c];
        else{var fromY=L.boardY+an.from*L.cell;pos.y=fromY+(pos.y-fromY)*easeOut(k);}
      }else if(an.type==="spawn"){
        var k2=(now-an.t0)/200;
        if(k2>=1)delete anims[r*M3.N+c];
        else{alpha=k2;scale=0.5+0.5*k2;}
      }
    }
    drawGem(color%6,pos.x+L.cell/2,pos.y+L.cell/2,rad,PAL.bp[color],alpha,scale);
  }
  if(swapAnim){
    var kk=(now-swapAnim.t0)/SWAP_MS;if(kk>1)kk=1;
    var e=easeOut(kk);
    var a=cellXY(swapAnim.ar,swapAnim.ac),b=cellXY(swapAnim.br,swapAnim.bc);
    var cA=st.grid[swapAnim.ar][swapAnim.ac],cB=st.grid[swapAnim.br][swapAnim.bc];
    drawGem(cA%6,a.x+L.cell/2+(b.x-a.x)*e,a.y+L.cell/2+(b.y-a.y)*e,rad,PAL.bp[cA],1,1);
    drawGem(cB%6,b.x+L.cell/2+(a.x-b.x)*e,b.y+L.cell/2+(a.y-b.y)*e,rad,PAL.bp[cB],1,1);
  }
  var i;
  for(i=0;i<flashes.length;i++){
    var f=flashes[i],kf=(now-f.t0)/260;
    if(kf>=1)continue;
    var p2=cellXY(f.r,f.c);
    drawGem(f.color%6,p2.x+L.cell/2,p2.y+L.cell/2,rad*(1+0.4*kf),PAL.bp[f.color],1-kf,1);
  }
  flashes=flashes.filter(function(f){return now-f.t0<260;});
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<popups.length;i++){
    var p=popups[i],kp=(now-p.t0)/900;
    if(kp>=1)continue;
    ctx.globalAlpha=1-kp*kp;
    ctx.fillStyle=p.big?PAL.warning:PAL.success;
    ctx.font="700 18px -apple-system,'PingFang SC',sans-serif";
    ctx.fillText(p.text,p.x,p.y-kp*26);
    ctx.globalAlpha=1;
  }
  popups=popups.filter(function(p){return now-p.t0<900;});
}
/* ---------- 事件与动画 ---------- */
function applyEvents(ev){
  var now=performance.now(),i;
  anims={};flashes=[];popups=[];
  for(i=0;i<ev.cleared.length;i++){
    var cl=ev.cleared[i];
    flashes.push({r:cl.r,c:cl.c,color:cl.color,t0:now});
  }
  for(i=0;i<ev.fell.length;i++){
    var f=ev.fell[i];
    anims[f.to*M3.N+f.c]={type:"fell",from:f.from,t0:now};
  }
  for(i=0;i<ev.spawned.length;i++){
    var sp=ev.spawned[i];
    anims[sp.r*M3.N+sp.c]={type:"spawn",t0:now};
  }
  if(ev.gain>0){
    var cx=0,cy=0;
    for(i=0;i<ev.cleared.length;i++){var p=cellXY(ev.cleared[i].r,ev.cleared[i].c);cx+=p.x+L.cell/2;cy+=p.y+L.cell/2;}
    if(ev.cleared.length){cx/=ev.cleared.length;cy/=ev.cleared.length;}
    popups.push({text:"+"+ev.gain,x:cx,y:cy,t0:now,big:false});
    if(ev.depth>=2)popups.push({text:"连锁 x"+ev.depth,x:cx,y:cy+20,t0:now,big:true});
  }
  if(ev.reshuffled)say("无可走步，已自动重排");
  rebuildMoveSet();
}
function rebuildMoveSet(){
  moveSet={};
  if(!st)return;
  var ms=M3.validMoves(st);
  for(var i=0;i<ms.length;i++){
    moveSet[ms[i].join(",")]=1;
    moveSet[[ms[i][2],ms[i][3],ms[i][0],ms[i][1]].join(",")]=1;
  }
}
function isValidMove(ar,ac,br,bc){
  return !!moveSet[[ar,ac,br,bc].join(",")];
}
/* ---------- 关卡流 ---------- */
function updateStats(){
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  $("stMoves").textContent=Math.max(0,st.movesLeft);
  $("stScore").textContent=st.score;
  $("stTarget").textContent=level.target;
  $("btnNext").hidden=!st.won;
}
function startLevel(n){
  if(!LEVELS.length)return;
  cur=Math.max(0,Math.min(n,LEVELS.length-1));
  level=LEVELS[cur];
  st=M3.newGame(level);
  selected=null;busy=false;swapAnim=null;anims={};flashes=[];popups=[];moveSet={};
  rebuildMoveSet();
  updateStats();
  say("第"+(cur+1)+"关 · "+level.name+" · "+level.colors+" 色 · "+level.moves+" 步内达 "+level.target+" 分");
  save();
  hideOverlay();
}
function onWin(){
  saveData.lv=Math.min(cur+1,LEVELS.length-1);
  save();
  if(GB.available)GB.reportScore("match3",{metricValue:cur+1,metricExtra:st.score}).catch(function(){});
  setTimeout(function(){
    if(!st||!st.won)return;// 期间已重开/切关则不再弹胜利层
    $("ovTitle").textContent="过关！";
    $("ovDesc").innerHTML="得分 <b>"+st.score+"</b> · 剩余 "+Math.max(0,st.movesLeft)+" 步"+(cur<LEVELS.length-1?"<br>已解锁第 "+(cur+2)+" 关":"<br>全部关卡完成！");
    $("ovBtn").textContent=cur<LEVELS.length-1?"下一关":"再玩一遍";
    showOverlay();
  },650);
}
function onLose(){
  setTimeout(function(){
    if(!st||!st.over||st.won)return;// 期间已重开/切关则不再弹失败层
    $("ovTitle").textContent="步数用完";
    $("ovDesc").innerHTML="得分 "+st.score+" / 目标 "+level.target+"<br>再试一次吧";
    $("ovBtn").textContent="重试本关";
    showOverlay();
  },650);
}
function showOverlay(){$("overlay").classList.add("show")}
function hideOverlay(){$("overlay").classList.remove("show")}
function attemptSwap(ar,ac,br,bc){
  if(busy||!st||st.over)return;
  if(Math.abs(ar-br)+Math.abs(ac-bc)!==1)return;
  if(!isValidMove(ar,ac,br,bc)){say("这一步不能消除，换一个试试");return;}
  busy=true;selected=null;
  swapAnim={ar:ar,ac:ac,br:br,bc:bc,t0:performance.now()};
  say("");
}
/* ---------- 主循环 ---------- */
function loop(now){
  requestAnimationFrame(loop);
  if(swapAnim&&now-swapAnim.t0>=SWAP_MS){
    var a=swapAnim;swapAnim=null;
    var res=M3.trySwap(st,a.ar,a.ac,a.br,a.bc);
    if(res.ok){
      applyEvents(res.events);
      updateStats();
      if(res.won)onWin();else if(res.over)onLose();
    }
    busy=false;
  }
  draw(now);
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  if(!st||st.over||busy)return;
  var p=pt(e);
  var c=Math.floor((p.x-L.boardX)/L.cell),r=Math.floor((p.y-L.boardY)/L.cell);
  if(r<0||c<0||r>=M3.N||c>=M3.N)return;
  pDown={r:r,c:c,x:p.x,y:p.y,used:false};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(!pDown||pDown.used||busy||!st||st.over)return;
  var p=pt(e);
  var dx=p.x-pDown.x,dy=p.y-pDown.y,thr=L.cell*0.3;
  if(Math.abs(dx)<thr&&Math.abs(dy)<thr)return;
  pDown.used=true;
  var dr=0,dc=0;
  if(Math.abs(dx)>Math.abs(dy))dc=dx>0?1:-1;else dr=dy>0?1:-1;
  var r2=pDown.r+dr,c2=pDown.c+dc;
  if(r2<0||c2<0||r2>=M3.N||c2>=M3.N)return;
  attemptSwap(pDown.r,pDown.c,r2,c2);
});
cv.addEventListener("pointerup",function(){
  if(!pDown)return;
  var pd=pDown;pDown=null;
  if(pd.used||busy||!st||st.over)return;
  if(selected){
    if(selected.r===pd.r&&selected.c===pd.c){selected=null;}
    else if(Math.abs(selected.r-pd.r)+Math.abs(selected.c-pd.c)===1){attemptSwap(selected.r,selected.c,pd.r,pd.c);}
    else{selected={r:pd.r,c:pd.c};}
  }else{selected={r:pd.r,c:pd.c};}
});
cv.addEventListener("pointercancel",function(){pDown=null;});
/* ---------- 按钮 ---------- */
$("btnRetry").addEventListener("click",function(){startLevel(cur);});
$("btnNext").addEventListener("click",function(){startLevel(cur<LEVELS.length-1?cur+1:0);});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(st&&st.won)startLevel(cur<LEVELS.length-1?cur+1:0);
  else startLevel(cur);
});
/* ---------- 启动 ---------- */
window.addEventListener("resize",resize);
palLoad();
resize();
startLevel(saveData.lv<LEVELS.length?saveData.lv:0);
requestAnimationFrame(loop);
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
