ttom:10px;}.chip{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--g-surface2);border-radius:10px;padding:7px 4px;font-size:14px;font-variant-numeric:tabular-nums;line-height:1;}.chip i{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;}.chip i.ice{border-radius:3px;background:var(--g-surface);border:2px solid var(--g-water);}.chip i.star{width:9px;height:9px;border:2px solid var(--g-warning);background:none;}.chip.done{color:var(--g-success);font-weight:600;}.stage{position:relative;}canvas{display:block;width:100%;touch-action:none;border-radius:var(--g-radius-inner);}.msg{min-height:20px;margin:10px 2px;font-size:14px;color:var(--g-muted);text-align:center;}.tools{display:flex;gap:8px;}.btn{min-height:44px;padding:0 14px;flex:1;border:0;border-radius:var(--g-radius-btn);background:var(--g-primary);color:#fff;font-family:inherit;font-size:22px;font-weight:700;cursor:pointer;}.btn:active{opacity:.85;}.btn.ghost{background:var(--g-surface2);color:var(--g-text);}.foot{margin:12px 2px 0;font-size:12px;color: var(--g-muted);text-align:center;line-height:1.6;}.overlay{position:fixed;inset:0;z-index:10;background:var(--g-scrim);display:none;align-items:center;justify-content:center;padding:20px;}.overlay.show{display:flex;}.panel{width:100%;max-width:320px;padding:22px 18px;background:var(--g-surface);border-radius:var(--g-radius);box-shadow:var(--g-shadow);text-align:center;animation:pop .25s ease-out;}@keyframes pop{from{transform:scale(.92);}to{transform:scale(1);opacity:1;}}.panel h2{margin:0 0 6px;font-size:22px;}.panel .desc{margin:0 0 16px;font-size:14px;color:var(--g-muted);line-height:1.6;}.panel .desc b{color:var(--g-primary-deep);font-size:22px;}.panel .btn{width:100%;}

<script>
/*M3-ENGINE-BEGIN*/
var M3=(function(){
  "use strict";
  var N=8;
  function rngNext(rng){
    rng.s=(rng.s+0x6D2B79F5)|0;
    var t=Math.imul(rng.s^(rng.s>>>15),1|rng.s);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  }
  function makeRng(seed){ return {s:(seed|0)}; }
  function cloneGrid(g){
    var o=[],i;
    for(i=0;i<N;i++)o.push(g[i].slice());
    return o;
  }
  function inBounds(r,c){ return r>=0&&r<N&&c>=0&&c<N; }
  function swapCells(g,r,c,r2,c2){ var t=g[r][c];g[r][c]=g[r2][c2];g[r2][c2]=t; }
  function findRuns(g){
    var runs=[],r,c,s,v;
    for(r=0;r<N;r++){
      s=0;
      for(c=1;c<=N;c++){
        v=c<N?g[r][c]:-9;
        if(v>=0&&v===g[r][s])continue;
        if(c-s>=3)runs.push({h:1,r:r,c0:s,len:c-s});
        s=c;
      }
    }
    for(c=0;c<N;c++){
      s=0;
      for(r=1;r<=N;r++){
        v=r<N?g[r][c]:-9;
        if(v>=0&&v===g[s][c])continue;
        if(r-s>=3)runs.push({h:0,r:c,c0:s,len:r-s});
        s=r;
      }
    }
    return runs;
  }
  function runCell(run,k){ return run.h?[run.r,run.c0+k]:[run.c0+k,run.r]; }
  function findMatches(g){
    var runs=findRuns(g),out=[],seen={},i,j,rc;
    for(i=0;i<runs.length;i++)for(j=0;j<runs[i].len;j++){
      rc=runCell(runs[i],j);
      if(!seen[rc[0]*N+rc[1]]){seen[rc[0]*N+rc[1]]=1;out.push(rc);}
    }
    return out;
  }
  function hasMatch(g){ return findRuns(g).length>0; }
  function pickCell(run,pt){
    var i,rc;
    if(pt)for(i=0;i<run.len;i++){rc=runCell(run,i);if(rc[0]===pt.r&&rc[1]===pt.c)return rc;}
    return runCell(run,run.len>>1);
  }
  function planSpecial(runs,pt){
    var out=[],used=[],i,j,seen={},res=[],a,b,k;
    for(i=0;i<runs.length;i++)if(runs[i].len>=5){used[i]=1;out.push({cell:pickCell(runs[i],pt),kind:4});}
    for(i=0;i<runs.length;i++){
      a=runs[i];
      if(used[i]||!a.h)continue;
      for(j=0;j<runs.length;j++){
        b=runs[j];
        if(used[j]||b.h)continue;
        if(a.r>=b.c0&&a.r<b.c0+b.len&&b.r>=a.c0&&b.r<a.c0+a.len){
          used[i]=1;used[j]=1;
          out.push({cell:[a.r,b.r],kind:3});
        }
      }
    }
    for(i=0;i<runs.length;i++)if(!used[i]&&runs[i].len===4)out.push({cell:pickCell(runs[i],pt),kind:runs[i].h?1:2});
    for(i=0;i<out.length;i++){
      k=out[i].cell[0]*N+out[i].cell[1];
      if(!seen[k]){seen[k]=1;res.push({r:out[i].cell[0],c:out[i].cell[1],kind:out[i].kind});}
    }
    return res;
  }
  function validMoves(st){
    var g=st.grid,sp=st.spec||null,out=[],r,c,d,r2,c2,sa,sb;
    for(r=0;r<N;r++)for(c=0;c<N;c++)for(d=0;d<2;d++){
      r2=r+d;c2=c+1-d;
      if(r2>=N||c2>=N)continue;
      sa=sp?sp[r][c]:0;sb=sp?sp[r2][c2]:0;
      if(sa===4||sb===4||(sa>0&&sb>0))out.push([r,c,r2,c2]);
      else{swapCells(g,r,c,r2,c2);if(hasMatch(g))out.push([r,c,r2,c2]);swapCells(g,r,c,r2,c2);}
    }
    return out;
  }
  function generateBoard(rng,K){
    var g=[],r,c,col;
    for(r=0;r<N;r++){
      g.push([]);
      for(c=0;c<N;c++){
        var forbid={};
        if(c>=2&&g[r][c-1]===g[r][c-2])forbid[g[r][c-1]]=1;
        if(r>=2&&g[r-1][c]===g[r-2][c])forbid[g[r-1][c]]=1;
        do{ col=Math.floor(rngNext(rng)*K); }while(forbid[col]);
        g[r].push(col);
      }
    }
    return g;
  }
  function generatePlayable(rng,K){
    var g=null,i;
    for(i=0;i<2000;i++){
      g=generateBoard(rng,K);
      if(validMoves({grid:g}).length>0)return g;
    }
    return g;
  }
  function reshuffle(st,events){
    st.grid=generatePlayable(st.rng,st.colors);
    var r,c;
    for(r=0;r<N;r++)for(c=0;c<N;c++)st.spec[r][c]=0;
    if(events)events.reshuffled=true;
    return true;
  }
  function newGame(level){
    var g=[],ice=[],sp=[],i,j,row,irow,srow,colors=0,tot=0,v,w;
    for(i=0;i<N;i++){
      row=[];irow=[];srow=[];
      for(j=0;j<N;j++){
        v=level.board.charCodeAt(i*N+j)-48;
        if(v>colors)colors=v;
        row.push(v);srow.push(0);
        w=level.ice?level.ice.charCodeAt(i*N+j)-48:0;
        irow.push(w);tot+=w;
      }
      g.push(row);ice.push(irow);sp.push(srow);
    }
    colors++;
    var goals=[];
    for(i=0;i<level.goals.length;i++){
      v=level.goals[i];
      goals.push({type:v.type,value:v.value,color:v.color,count:v.count,n:0});
    }
    var st={grid:g,spec:sp,ice:ice,movesLeft:level.moves,score:0,colors:colors,
      goals:goals,iceTotal:tot,iceLeft:tot,rng:makeRng(level.seed),over:false,won:false};
    if(validMoves(st).length===0)reshuffle(st,null);
    return st;
  }
  function trySwap(st,r,c,r2,c2){
    if(!inBounds(r,c)||!inBounds(r2,c2))return {ok:false};
    if(Math.abs(r-r2)+Math.abs(c-c2)!==1)return {ok:false};
    var g=st.grid,sp=st.spec;
    var ka=sp[r][c],kb=sp[r2][c2],A=g[r][c],B=g[r2][c2];
    var combo=(A===-2&&B===-2)?1:(A===-2||B===-2)?2:(ka>0&&kb>0)?3:0;
    if(!combo){
      swapCells(g,r,c,r2,c2);
      if(!hasMatch(g)){ swapCells(g,r,c,r2,c2); return {ok:false}; }
    }
    st.movesLeft--;
    var events={cleared:[],fell:[],spawned:[],made:[],depth:0,gain:0,reshuffled:false,iceBroken:0};
    var del=combo?{}:null,queue=[],gotCol={};
    function addDel(rr,cc){
      if(rr<0||rr>=N||cc<0||cc>=N)return;
      var k=rr*N+cc;
      if(del[k])return;
      del[k]=1;
      var kk=sp[rr][cc];
      if(kk>0)queue.push({r:rr,c:cc,k:kk});
    }
    var i,j,rr,cc;
    if(combo===1){ 
      for(rr=0;rr<N;rr++)for(cc=0;cc<N;cc++)if(g[rr][cc]!==-1)addDel(rr,cc);
    }else if(combo===2){ 
      var t=A===-2?B:A,kb2=A===-2?kb:ka;
      del[(A===-2?r:r2)*N+(A===-2?c:c2)]=1;
      if(kb2===1||kb2===2){
        var d2=1;
        for(rr=0;rr<N;rr++)for(cc=0;cc<N;cc++)if(g[rr][cc]===t){
          if(sp[rr][cc]>0)queue.push({r:rr,c:cc,k:sp[rr][cc]});
          else{sp[rr][cc]=d2;queue.push({r:rr,c:cc,k:d2});d2=d2===1?2:1;}
        }
      }else{
        for(rr=0;rr<N;rr++)for(cc=0;cc<N;cc++)if(g[rr][cc]===t)addDel(rr,cc);
      }
    }else if(combo===3){ 
      addDel(r,c);addDel(r2,c2);
      var e3=(ka===3?1:0)+(kb===3?1:0);
      if(e3===0){ for(cc=0;cc<N;cc++)addDel(r2,cc); for(rr=0;rr<N;rr++)addDel(rr,c2); }
      else if(e3===1){
        for(i=-1;i<=1;i++){ for(cc=0;cc<N;cc++)addDel(r2+i,cc); for(rr=0;rr<N;rr++)addDel(rr,c2+i); }
      }else{
        for(i=-2;i<=2;i++)for(j=-2;j<=2;j++)addDel(r2+i,c2+j);
      }
    }
    var depth=0,pt={r:r,c:c},won=true;
    while(true){
      depth++;
      var made=[];
      if(!del){
        var runs=findRuns(g);
        if(!runs.length)break;
        del={};
        for(i=0;i<runs.length;i++)for(j=0;j<runs[i].len;j++){
          var rc=runCell(runs[i],j);
          addDel(rc[0],rc[1]);
        }
        made=planSpecial(runs,depth===1?pt:null);
      }
      while(queue.length){ 
        var tq=queue.shift(),tr=tq.r,tc=tq.c,tk=tq.k;
        if(tk===1)for(cc=0;cc<N;cc++)addDel(tr,cc);
        else if(tk===2)for(rr=0;rr<N;rr++)addDel(rr,tc);
        else if(tk===3)for(i=-1;i<=1;i++)for(j=-1;j<=1;j++)addDel(tr+i,tc+j);
        else if(tk===4){ 
          var cnt={},mx=0,mc=-1;
          for(rr=0;rr<N;rr++)for(cc=0;cc<N;cc++){var vv=g[rr][cc];if(vv>=0){cnt[vv]=(cnt[vv]||0)+1;if(cnt[vv]>mx){mx=cnt[vv];mc=vv;}}}
          if(mc>=0)for(rr=0;rr<N;rr++)for(cc=0;cc<N;cc++)if(g[rr][cc]===mc)addDel(rr,cc);
        }
      }
      var cells=[],key;
      for(key in del)cells.push([Math.floor(key/N),key%N]);
      if(!cells.length)break;
      var gain=cells.length*10;
      events.gain+=gain;st.score+=gain;
      for(i=0;i<cells.length;i++){
        var cr=cells[i][0],cbc=cells[i][1],vv2=g[cr][cbc];
        if(vv2>=0)gotCol[vv2]=(gotCol[vv2]||0)+1;
        events.cleared.push({r:cr,c:cbc,color:vv2,depth:depth});
      }
      var iced={},dr,dc; 
      for(i=0;i<cells.length;i++){
        for(dr=-1;dr<=1;dr++)for(dc=-1;dc<=1;dc++){
          if(dr!==0&&dc!==0)continue;
          var nr=cells[i][0]+dr,nc=cells[i][1]+dc;
          if(!inBounds(nr,nc))continue;
          var kk2=nr*N+nc;
          if(!iced[kk2]&&st.ice[nr][nc]>0){iced[kk2]=1;st.ice[nr][nc]--;st.iceLeft--;events.iceBroken++;}
        }
      }
      var mk={};
      for(i=0;i<made.length;i++)mk[made[i].r*N+made[i].c]=1;
      for(key in del){
        if(mk[key])continue;
        var kr=Math.floor(key/N),kc=key%N;
        g[kr][kc]=-1;sp[kr][kc]=0;
      }
      for(i=0;i<made.length;i++){
        var mm=made[i];
        sp[mm.r][mm.c]=mm.kind;
        if(mm.kind===4)g[mm.r][mm.c]=-2;
        events.made.push({r:mm.r,c:mm.c,kind:mm.kind});
      }
      var col,row,write;
      for(col=0;col<N;col++){
        write=N-1;
        for(row=N-1;row>=0;row--){
          if(g[row][col]!==-1){
            if(write!==row){
              g[write][col]=g[row][col];sp[write][col]=sp[row][col];sp[row][col]=0;g[row][col]=-1;
              events.fell.push({from:row,to:write,c:col});
            }
            write--;
          }
        }
        for(row=write;row>=0;row--){
          var nc2=Math.floor(rngNext(st.rng)*st.colors);
          g[row][col]=nc2;sp[row][col]=0;
          events.spawned.push({r:row,c:col});
        }
      }
      events.depth=depth;
      del=null;queue=[];
    }
    for(i=0;i<st.goals.length;i++){
      var gl=st.goals[i];
      if(gl.type==="score")gl.n=st.score;
      else if(gl.type==="collect")gl.n+=gotCol[gl.color]||0;
      else gl.n=st.iceTotal-st.iceLeft;
      if(gl.n<(gl.type==="score"?gl.value:gl.count))won=false;
    }
    st.won=won;
    st.over=won||st.movesLeft<=0;
    if(!st.over&&validMoves(st).length===0)reshuffle(st,events);
    return {ok:true,events:events,won:st.won,over:st.over};
  }
  return {N:N,makeRng:makeRng,rngNext:rngNext,cloneGrid:cloneGrid,findRuns:findRuns,runCell:runCell,
    findMatches:findMatches,hasMatch:hasMatch,validMoves:validMoves,generateBoard:generateBoard,
    generatePlayable:generatePlayable,reshuffle:reshuffle,newGame:newGame,trySwap:trySwap};
})();
/*M3-ENGINE-END*/
</script>
<script>
(function(){
"use strict";
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,

  saveData.lv=Math.min(cur+1,LEVELS.length-1);
  save();
  if(GB.available)GB.reportScore("match3",{metricValue:cur+1,metricExtra:st.score}).catch(function(){});
  setTimeout(function(){
    if(!st||!st.won)return;
    var stars="★★★".slice(0,s)+"☆☆☆".slice(0,3-s);
    $("ovTitle").textContent="过关！";
    $("ovDesc").innerHTML="获得 <b>"+stars+"</b> 星<br>得分 "+st.score+" · 剩余 "+Math.max(0,st.movesLeft)+" 步"+(cur<LEVELS.length-1?"<br>已解锁第 "+(cur+2)+" 关":"<br>全部关卡完成！");
    $("ovBtn").textContent=cur<LEVELS.length-1?"下一关":"再玩一遍";
    showOverlay();
  },650);
}
function onLose(){
  setTimeout(function(){
    if(!st||!st.over||st.won)return;
    $("ovTitle").textContent="步数用完";
    $("ovDesc").innerHTML="目标未全部达成<br>再试一次吧";
    $("ovBtn").textContent="重试本关";
    showOverlay();
  },650);
}
function showOverlay(){$("overlay").classList.add("show")}
function hideOverlay(){$("overlay").classList.remove("show")}
function attemptSwap(ar,ac,br,bc){
  if(busy||!st||st.over)return;
  if(Math.abs(ar-br)+Math.abs(ac-bc)!==1)return;
  if(!isValidMove(ar,ac,br,bc)){say("这一步不能消除，换一个试试");return;}
  busy=true;selected=null;
  swapAnim={ar:ar,ac:ac,br:br,bc:bc,t0:performance.now()};
  say("");
}
function loop(now){
  requestAnimationFrame(loop);
  if(swapAnim&&now-swapAnim.t0>=SWAP_MS){
    var a=swapAnim;swapAnim=null;
    var res=M3.trySwap(st,a.ar,a.ac,a.br,a.bc);
    if(res.ok){
      applyEvents(res.events);
      updateStats();
      if(res.won)onWin();else if(res.over)onLose();
    }
    busy=false;
  }
  draw(now);
}
cv.addEventListener("pointerdown",function(e){
  if(!st||st.over||busy)return;
  var p=pt(e);
  var c=Math.floor((p.x-L.boardX)/L.cell),r=Math.floor((p.y-L.boardY)/L.cell);
  if(r<0||c<0||r>=M3.N||c>=M3.N)return;
  pDown={r:r,c:c,x:p.x,y:p.y,used:false};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(!pDown||pDown.used||busy||!st||st.over)return;
  var p=pt(e);
  var dx=p.x-pDown.x,dy=p.y-pDown.y,thr=L.cell*0.3;
  if(Math.abs(dx)<thr&&Math.abs(dy)<thr)return;
  pDown.used=true;
  var dr=0,dc=0;
  if(Math.abs(dx)>Math.abs(dy))dc=dx>0?1:-1;else dr=dy>0?1:-1;
  var r2=pDown.r+dr,c2=pDown.c+dc;
  if(r2<0||c2<0||r2>=M3.N||c2>=M3.N)return;
  attemptSwap(pDown.r,pDown.c,r2,c2);
});
cv.addEventListener("pointerup",function(){
  if(!pDown)return;
  var pd=pDown;pDown=null;
  if(pd.used||busy||!st||st.over)return;
  if(selected){
    if(selected.r===pd.r&&selected.c===pd.c){selected=null;}
    else if(Math.abs(selected.r-pd.r)+Math.abs(selected.c-pd.c)===1){attemptSwap(selected.r,selected.c,pd.r,pd.c);}
    else{selected={r:pd.r,c:pd.c};}
  }else{selected={r:pd.r,c:pd.c};}
});
cv.addEventListener("pointercancel",function(){pDown=null;});
$("btnRetry").addEventListener("click",function(){startLevel(cur);});
$("btnNext").addEventListener("click",function(){startLevel(cur<LEVELS.length-1?cur+1:0);});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(st&&st.won)startLevel(cur<LEVELS.length-1?cur+1:0);
  else startLevel(cur);
});
window.addEventListener("resize",resize);
palLoad();
resize();
startLevel(saveData.lv<LEVELS.length?saveData.lv:0);
requestAnimationFrame(loop);
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
</body>
</html>
