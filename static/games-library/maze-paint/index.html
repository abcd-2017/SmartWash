function parseLevel(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return null;
  if(typeof d.name!=="string"||!d.name.trim())return null;
  var cols=d.cols,rows=d.rows,i,ch,open=0;

    if(sr<0||sr>=rows||sc<0||sc>=cols||d.cells.charAt(sr*cols+sc)!=="0")return null;

  return list.length?list:null;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return parseLevel(d)})){
      LEVELS=list.map(function(d){return parseLevel(d)});return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
      resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){
  try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};
    return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0)),
           best:(s.best&&typeof s.best==="object")?s.best:{}}}
  catch(e){return{lv:0,best:{}}}
}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),rlv=parseInt(r.lv,10)||0,ch=false,i;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);ch=true}
      if(r.best&&typeof r.best==="object"){
        for(i in r.best){var rv=parseInt(r.best[i],10)||0;var lv2=parseInt(i,10)||0;
          if(rv>0&&(!save.best[lv2]||rv<save.best[lv2])){save.best[lv2]=rv;ch=true}}
      }
      if(ch){persist();loadLevel(save.lv)}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 调色板（canvas 颜色全部经 PAL 读 CSS 变量） ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),
    floor:v("--g-mzp-floor"),wall:v("--g-mzp-wall"),wallHi:v("--g-mzp-wall-hi"),start:v("--g-mzp-start"),
    balls:[v("--g-mzp-ball1"),v("--g-mzp-ball2"),v("--g-mzp-ball3"),v("--g-mzp-ball4")]};
  PAL.ball=(PAL.balls&&PAL.balls[lv%4])||PAL.balls[0];
  applyBallAccent();
}
/* 本关球色 → chrome 次级强调：soft = 球色与 surface 的浅/深 tint，deep = 球色的深/浅一档。
   浅色 deep 取球色压黑 0.80、深色 deep 取球色提亮 0.30，均与 soft 底对比 ≥4.5:1。 */
function applyBallAccent(){
  var dark=document.documentElement.dataset.theme==="dark";
  var soft=dark?colMix(PAL.ball,PAL.surface,0.70):colMix(PAL.ball,PAL.surface,0.12);
  var deep=dark?colMix(PAL.ball,WHITE,0.30):colMix(PAL.ball,BLACK,0.80);
  var st=document.documentElement.style;
  st.setProperty("--g-mzp-cur",PAL.ball);
  st.setProperty("--g-mzp-cur-soft",soft);
  st.setProperty("--g-mzp-cur-deep",deep);
}
window.__gOnTheme=function(){palLoad();draw()};
/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
/* ---------- 状态 ---------- */
var DIRS=[[-1,0],[1,0],[0,-1],[0,1]];   // 上 下 左 右
var lv=save.lv,L=null,rows=4,cols=4,cells="",wallArr=null,startIdx=0,totalOpen=0;
var pos=0,painted=null,history=[],steps=0,done=false,anim=false;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,cs=64,pad=8;
var ballX=0,ballY=0,ballScale=1;
var startTs=0,timer=null;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function isWall(i){return wallArr[i]===1}
function cellCenter(i){return{x:pad+(i%cols)*cs+cs/2,y:pad+Math.floor(i/cols)*cs+cs/2}}
function fmtTime(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return(m<10?"0":"")+m+":"+(s<10?"0":"")+s}
/* ---------- 几何 ---------- */
function resize(){
  if(!wallArr)return;
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  cs=Math.floor((w-pad*2)/cols);
  if(cs>92)cs=92;
  if(cs<26)cs=26;
  W=cols*cs+pad*2;H=rows*cs+pad*2;
  cv.style.width=W+"px";cv.style.height=H+"px";
  cv.width=Math.max(1,Math.round(W*dpr));cv.height=Math.max(1,Math.round(H*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  snapBall();draw();
}
function snapBall(){var p=cellCenter(pos);ballX=p.x;ballY=p.y;ballScale=1}
/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
/* 已染色格：小球颜色实铺 + 深一档描边，格与格之间仍有边界 */
function drawTile(x,y,gap,rad,color){
  var w=cs-2*gap;
  ctx.fillStyle=color;rr(x+gap,y+gap,w,w,rad);ctx.fill();
  ctx.lineWidth=Math.max(1,cs*0.03);ctx.strokeStyle=colMix(color,BLACK,0.16);
  rr(x+gap+0.5,y+gap+0.5,w-1,w-1,rad);ctx.stroke();
}
/* 未染色格：中性双色（地面色 / surface2），不掺球色——未染色与已染色一眼可分 */
function drawFloor(x,y,gap,rad,tint){
  var w=cs-2*gap;
  ctx.fillStyle=tint||PAL.floor;rr(x+gap,y+gap,w,w,rad);ctx.fill();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.border;
  rr(x+gap+0.5,y+gap+0.5,w-1,w-1,rad);ctx.stroke();
}
function drawWall(x,y,gap,rad){
  var w=cs-2*gap;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.28)";ctx.shadowBlur=cs*0.10;ctx.shadowOffsetY=cs*0.045;
  var g=ctx.createLinearGradient(0,y+gap,0,y+gap+w);
  g.addColorStop(0,PAL.wallHi);g.addColorStop(0.42,PAL.wall);g.addColorStop(1,colShade(PAL.wall,-0.26));
  ctx.fillStyle=g;rr(x+gap,y+gap,w,w,rad);ctx.fill();
  ctx.restore();
  ctx.lineWidth=Math.max(1,cs*0.035);ctx.strokeStyle=colMix(PAL.wallHi,WHITE,0.18);
  rr(x+gap+0.5,y+gap+0.5,w-1,w-1,rad);ctx.stroke();
}
function drawBall(x,y,r){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.40)";ctx.shadowBlur=r*0.75;ctx.shadowOffsetY=r*0.36;
  var g=ctx.createRadialGradient(x-r*0.36,y-r*0.40,r*0.12,x,y,r*1.02);
  g.addColorStop(0,colMix(PAL.ball,WHITE,0.78));
  g.addColorStop(0.42,PAL.ball);
  g.addColorStop(1,colShade(PAL.ball,-0.34));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // 深色描边 + 底部反光：让小球在同色已染色格上仍然看得清
  ctx.lineWidth=Math.max(1.5,r*0.16);ctx.strokeStyle=colShade(PAL.ball,-0.46);
  ctx.beginPath();ctx.arc(x,y,r-ctx.lineWidth*0.5,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=0.92;ctx.fillStyle=WHITE;   // 恒白高光
  ctx.beginPath();ctx.ellipse(x-r*0.34,y-r*0.42,r*0.26,r*0.15,-0.55,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}
function draw(){
  if(!wallArr)return;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=PAL.floor;ctx.fillRect(0,0,W,H);
  var gap=Math.max(1.5,cs*0.05),rad=Math.min(10,cs*0.2),i,r,c,x,y;
  for(r=0;r<rows;r++)for(c=0;c<cols;c++){
    i=r*cols+c;x=pad+c*cs;y=pad+r*cs;
    if(wallArr[i])drawWall(x,y,gap,rad);
    else if(painted[i])drawTile(x,y,gap,rad,PAL.ball);
    else drawFloor(x,y,gap,rad,((r+c)%2===0)?PAL.surface2:null);
  }
  var sp=cellCenter(startIdx);
  ctx.strokeStyle=PAL.start;ctx.lineWidth=Math.max(2,cs*0.06);ctx.lineCap="round";
  ctx.beginPath();ctx.arc(sp.x,sp.y,cs*0.42,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=PAL.start;
  ctx.beginPath();ctx.arc(sp.x,sp.y,cs*0.075,0,Math.PI*2);ctx.fill();
  drawBall(ballX,ballY,cs*0.32*ballScale);
  ctx.lineCap="butt";
}
/* ---------- 统计 ---------- */
function filledCount(){var n=0,i;for(i=0;i<rows*cols;i++)if(!wallArr[i]&&painted[i])n++;return n}
function updStats(){
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stFill").textContent=filledCount();
  $("stTotal").textContent=totalOpen;
  $("stSteps").textContent=steps;
  $("stBest").textContent=save.best[lv]||"-";
  $("btnUndo").disabled=done||anim||!history.length;
}
/* ---------- 计时 ---------- */
function ensureTimer(){
  if(startTs)return;
  startTs=Date.now();
  $("stTime").textContent="00:00";
  timer=setInterval(function(){$("stTime").textContent=fmtTime(Date.now()-startTs)},500);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
/* ---------- 关卡装载 ---------- */
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  rows=L.rows;cols=L.cols;cells=L.cells;
  wallArr=new Uint8Array(rows*cols);
  var i,ch;
  totalOpen=0;
  for(i=0;i<cells.length;i++){ch=cells.charAt(i);wallArr[i]=ch==="1"?1:0;if(ch==="0")totalOpen++}
  startIdx=L.start[0]*cols+L.start[1];   // start = [行, 列]
  painted=new Uint8Array(rows*cols);painted[startIdx]=1;
  pos=startIdx;history=[];steps=0;done=false;anim=false;
  PAL.ball=PAL.balls[lv%4]||PAL.balls[0];
  applyBallAccent();
  stopTimer();startTs=0;
  $("stTime").textContent="00:00";
  $("lvTagText").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=cols+"×"+rows+" · "+totalOpen+" 格";
  say("点方向或滑动屏幕：小球一路滑到被墙挡住，把经过的格子染成它的颜色");
  resize();updStats();
}
/* ---------- 滑动 ---------- */
function tryMove(d){
  if(done||anim||!wallArr)return;
  var r=Math.floor(pos/cols),c=pos%cols,dr=DIRS[d][0],dc=DIRS[d][1];
  var nr=r,nc=c,path=[pos],ti;
  while(true){
    var tr=nr+dr,tc=nc+dc;
    if(tr<0||tr>=rows||tc<0||tc>=cols)break;
    ti=tr*cols+tc;
    if(wallArr[ti])break;
    nr=tr;nc=tc;path.push(ti);
  }
  if(path.length===1){say("这个方向被墙或边界挡住了");nudge(d);return}
  ensureTimer();
  var newCells=[],i;
  for(i=0;i<path.length;i++)if(!painted[path[i]])newCells.push(path[i]);
  history.push({pos:pos,newCells:newCells});
  steps++;
  pos=path[path.length-1];
  say("已染色 "+(filledCount()+newCells.length)+" / "+totalOpen+" 格");
  anim=true;updStats();
  animateSlide(path,newCells,function(){if(allPainted())winLevel()});
}
function animateSlide(path,newCells,cb){
  var total=path.length-1,i,k,q;
  if(window.__gRM){          // 动效降级：瞬时落子，染色一次到位
    for(i=0;i<newCells.length;i++)painted[newCells[i]]=1;
    q=cellCenter(path[total]);ballX=q.x;ballY=q.y;
    anim=false;draw();updStats();cb();return;
  }
  var dur=Math.max(110,Math.min(360,60*total)),t0=performance.now();
  function frame(now){
    // rAF 时间戳可能略早于调度前采集的 t0，需夹到 [0,1] 否则进度为负会让插值跑出 NaN
    var p=Math.max(0,Math.min(1,(now-t0)/dur)),e=1-Math.pow(1-p,2),f=e*total;
    var i2=Math.floor(f),frac=f-i2;
    for(k=0;k<=i2&&k<=total;k++)painted[path[k]]=1;
    var a=cellCenter(path[i2]),b=cellCenter(path[Math.min(i2+1,total)]);
    ballX=a.x+(b.x-a.x)*frac;ballY=a.y+(b.y-a.y)*frac;
    draw();updStats();
    if(p<1)requestAnimationFrame(frame);
    else{
      for(k=0;k<newCells.length;k++)painted[newCells[k]]=1;
      var q2=cellCenter(path[total]);ballX=q2.x;ballY=q2.y;
      anim=false;draw();updStats();ballPop();cb();
    }
  }
  requestAnimationFrame(frame);
}
/* 停步弹跳：小球到位时轻轻一跳，给出「停住了」的反馈（reduced-motion 时跳过） */
function ballPop(){
  if(window.__gRM)return;
  var t0=performance.now();
  function f(now){
    var p=Math.min(1,(now-t0)/150);
    ballScale=1+0.14*Math.sin(p*Math.PI);
    draw();
    if(p<1)requestAnimationFrame(f);else{ballScale=1;draw()}
  }
  requestAnimationFrame(f);
}
/* 被墙挡住：小球原地轻顿一下，给出「此路不通」的反馈 */
function nudge(d){
  if(window.__gRM||anim)return;
  anim=true;
  var dx=DIRS[d][1],dy=DIRS[d][0],t0=performance.now(),bx=ballX,by=ballY;
  function f(now){
    var p=Math.max(0,Math.min(1,(now-t0)/140)),e=Math.sin(p*Math.PI)*cs*0.10;
    ballX=bx+dx*e;ballY=by+dy*e;draw();
    if(p<1)requestAnimationFrame(f);else{ballX=bx;ballY=by;anim=false;draw();updStats()}
  }
  requestAnimationFrame(f);
}
function allPainted(){for(var i=0;i<rows*cols;i++)if(!wallArr[i]&&!painted[i])return false;return true}
function undo(){
  if(anim||done||!history.length)return;
  var h=history.pop(),i;
  for(i=0;i<h.newCells.length;i++)painted[h.newCells[i]]=0;
  pos=h.pos;steps--;
  snapBall();updStats();draw();say("已撤销一步");
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;stopTimer();
  $("lvgrid").hidden=true;   // 选关浮层不许带进过关遮罩
  var isNew=!save.best[lv]||steps<save.best[lv];
  if(isNew)save.best[lv]=steps;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1)}   // 过关推进存档（刷新/选关依赖它）
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:steps}).catch(function(){});
  var last=lv>=LEVELS.length-1;
  $("ovTitle").textContent=last?"全部通关！":"过关！";
  $("ovDesc").innerHTML="染色 <b>"+filledCount()+"</b>/"+totalOpen+" 格 · 步数 <b>"+steps+"</b> · 用时 <b>"+fmtTime(Date.now()-startTs)+"</b>"+
    (isNew?"<br>新纪录！":"<br>本关最佳 "+save.best[lv]+" 步")+
    (last?"<br>"+LEVELS.length+" 关全部完成":"");
  setOvBtn(last?"回到第 1 关":"下一关",last?"rotate":"play");
  $("overlay").classList.add("show");
  updStats();
}
function setOvBtn(text,icon){$("ovBtn").innerHTML=SW_ICON(icon)+text}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        save.lv=Math.max(save.lv,i);persist();
        loadLevel(i);hideOverlay();say("第 "+(i+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  setOvBtn("取消","x");
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show");$("lvgrid").hidden=true}
/* ---------- 输入 ---------- */
var dirBtns=[["btnUp",0],["btnDown",1],["btnLeft",2],["btnRight",3]],bi;
for(bi=0;bi<dirBtns.length;bi++){
  $(dirBtns[bi][0]).addEventListener("click",function(d){return function(){tryMove(d)}}(dirBtns[bi][1]));
}
$("btnUndo").addEventListener("click",undo);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(!done)openLevelSelect()});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){save.lv=0;persist();loadLevel(0)}
    else loadLevel(lv+1);
  }
});
var touching=false,touchX=0,touchY=0;
cv.addEventListener("pointerdown",function(e){touching=true;touchX=e.clientX;touchY=e.clientY});
cv.addEventListener("pointerup",function(e){
  if(!touching)return;touching=false;
  var dx=e.clientX-touchX,dy=e.clientY-touchY;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?3:2);else tryMove(dy>0?1:0);
});
cv.addEventListener("pointercancel",function(){touching=false});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if($("overlay").classList.contains("show")){
    if(k===" "||k==="Enter"){$("ovBtn").click();e.preventDefault()}
    else if(k==="Escape")hideOverlay();
    return;
  }
  if(k==="ArrowUp"){tryMove(0);e.preventDefault()}
  else if(k==="ArrowDown"){tryMove(1);e.preventDefault()}
  else if(k==="ArrowLeft"){tryMove(2);e.preventDefault()}
  else if(k==="ArrowRight"){tryMove(3);e.preventDefault()}
  else if(k==="z"||k==="Z")undo();
  else if(k==="r"||k==="R")loadLevel(lv);
});
window.addEventListener("resize",function(){resize()});
/* ---------- 启动 ---------- */
palLoad();
loadLevel(save.lv);
setOvBtn("下一关","play");
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）+ 按钮图标注入（内联 SVG，零外链） */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(els.length){
    function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
    var lastFocus=null;
    function focusFirst(el){
      if(el.dataset.foc)return;el.dataset.foc="1";
      if(!lastFocus)lastFocus=document.activeElement;
      var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
    }
    function restore(el){
      if(!el.dataset.foc)return;delete el.dataset.foc;
      if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
    }
    function trap(el,e){
      if(e.key!=="Tab")return;
      var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
      if(!f.length)return;
      var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
      else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
    }
    function watch(el){
      try{new MutationObserver(function(){
        if(shown(el))focusFirst(el);else restore(el);
      }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
      el.addEventListener("keydown",function(e){trap(el,e)});
    }
    for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  }
  function $(id){return document.getElementById(id)}
  var dp=[["btnUp","arrow-up"],["btnDown","arrow-down"],["btnLeft","arrow-left"],["btnRight","arrow-right"]],j;
  for(j=0;j<dp.length;j++)$(dp[j][0]).innerHTML=window.SW_ICON(dp[j][1]);
  $("btnUndo").insertAdjacentHTML("afterbegin",window.SW_ICON("undo"));
  $("btnReset").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
  $("btnLv").insertAdjacentHTML("afterbegin",window.SW_ICON("grid"));
})();
</script>
