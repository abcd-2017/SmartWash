function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!verifyLevel(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;

  return true;

//__VERIFY__START
/* 迷宫填色独立验证器：开口位掩码解析 → 对称性校验 → Warnsdorff 启发 DFS 找哈密顿通路 */
var MP_BUDGET=60000;
function mpParse(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return null;
  if(typeof d.name!=="string"||!d.name.trim())return null;
  var cols=d.cols,rows=d.rows;
  if(!Number.isInteger(cols)||!Number.isInteger(rows)||cols<4||cols>6||rows<4||rows>7)return null;
  if(typeof d.open!=="string"||d.open.length!==cols*rows)return null;
  var open=[],i,ch;
  for(i=0;i<d.open.length;i++){
    ch=d.open.charCodeAt(i);
    if(ch>=48&&ch<=57)open.push(ch-48);
    else if(ch>=97&&ch<=122)open.push(ch-97+10);
    else return null;
  }
  function inG(x,y){return x>=0&&x<cols&&y>=0&&y<rows}
  if(!Array.isArray(d.start)||d.start.length!==2||!inG(d.start[0],d.start[1]))return null;
  // 位含义：1=北 2=东 4=南 8=西；越界开口与不对称开口均为非法
  for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
    var m=open[y*cols+x];
    if(m<0||m>15)return null;
    if((m&1)&&(y===0||(open[(y-1)*cols+x]&4)===0))return null;
    if((m&2)&&(x===cols-1||(open[y*cols+x+1]&8)===0))return null;
    if((m&4)&&(y===rows-1||(open[(y+1)*cols+x]&1)===0))return null;
    if((m&8)&&(x===0||(open[y*cols+x-1]&2)===0))return null;
    if(m===0)return null;
  }
  return {cols:cols,rows:rows,open:open,start:[d.start[0],d.start[1]],total:cols*rows};
}
function mpAdj(p){
  var adj=[],x,y;
  for(y=0;y<p.rows;y++)for(x=0;x<p.cols;x++){
    var m=p.open[y*p.cols+x],list=[];
    if(m&1)list.push((y-1)*p.cols+x);
    if(m&2)list.push(y*p.cols+x+1);
    if(m&4)list.push((y+1)*p.cols+x);
    if(m&8)list.push(y*p.cols+x-1);
    adj.push(list);
  }
  return adj;
}
/* Warnsdorff DFS：优先走「后续出口最少」的邻格；返回哈密顿通路或 null（aborted=预算耗尽） */
function mpHam(p,adj){
  var total=p.total,visited=new Array(total).fill(false),path=[];
  var nodes=0,aborted=false;
  function onward(c){
    var cnt=0;
    for(var i=0;i<adj[c].length;i++)if(!visited[adj[c][i]])cnt++;
    return cnt;
  }
  function dfs(cur){
    if(++nodes>MP_BUDGET){aborted=true;return false;}
    visited[cur]=true;path.push(cur);
    if(path.length===total)return true;
    var nbs=adj[cur].slice().sort(function(a,b){return onward(a)-onward(b)});
    for(var i=0;i<nbs.length;i++){
      if(!visited[nbs[i]]&&dfs(nbs[i]))return true;
    }
    visited[cur]=false;path.pop();
    return false;
  }
  var start=p.start[1]*p.cols+p.start[0];
  return dfs(start)?path.slice():null;
}
function verifyLevel(d){
  var p=mpParse(d);
  if(!p)return false;
  var path=mpHam(p,mpAdj(p));
  if(!path)return false;   // 无解或预算耗尽（无法确认可解）都不入表
  return path.length===p.total;
}
function normalizeLevel(d){
  var p=mpParse(d);
  return {name:String(d.name),cols:p.cols,rows:p.rows,open:d.open,start:[d.start[0],d.start[1]],
    difficulty:Math.min(9,Math.max(1,Number.isInteger(d.difficulty)?d.difficulty:5))};
}
//__VERIFY__END

/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water")};
}
window.__gOnTheme=function(){palLoad();draw()};
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,cols=4,rows=5,adj=[],trail=[],start=0,steps=0,done=false;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,cs=48;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function visited(idx){return trail.indexOf(idx)>=0}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  cs=Math.floor(w/cols);
  W=Math.round(w);
  H=rows*cs;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function cx(i){return (i%cols)*cs+cs/2}
function cy(i){return Math.floor(i/cols)*cs+cs/2}
function draw(){
  ctx.fillStyle=PAL.bg;
  ctx.fillRect(0,0,W,H);
  // 可走格淡底
  ctx.fillStyle=PAL.surface2;
  ctx.fillRect(0,0,W,H);
  // 已填色：顺序渐入
  for(var i=0;i<trail.length;i++){
    var t=Math.min(1,(i+1)/trail.length);
    ctx.fillStyle=PAL.primary;
    ctx.globalAlpha=0.35+0.55*t;
    ctx.fillRect((trail[i]%cols)*cs+1,Math.floor(trail[i]/cols)*cs+1,cs-2,cs-2);
  }
  ctx.globalAlpha=1;
  // 墙（未开口的边画粗线）
  ctx.strokeStyle=PAL.text;ctx.lineWidth=3;
  ctx.beginPath();
  for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
    var m=L.open[y*cols+x],px=x*cs,py=y*cs;
    if(!(m&1)){ctx.moveTo(px,py);ctx.lineTo(px+cs,py);}
    if(!(m&2)){ctx.moveTo(px+cs,py);ctx.lineTo(px+cs,py+cs);}
    if(!(m&4)){ctx.moveTo(px,py+cs);ctx.lineTo(px+cs,py+cs);}
    if(!(m&8)){ctx.moveTo(px,py);ctx.lineTo(px,py+cs);}
  }
  ctx.stroke();
  // 入口标记
  ctx.strokeStyle=PAL.success;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx(start),cy(start),cs*0.28,0,7);ctx.stroke();
  // 轨迹连线 + 轨迹头
  ctx.strokeStyle=PAL.deep;ctx.lineWidth=4;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();
  for(i=0;i<trail.length;i++){
    if(i===0)ctx.moveTo(cx(trail[i]),cy(trail[i]));
    else ctx.lineTo(cx(trail[i]),cy(trail[i]));
  }
  ctx.stroke();
  if(trail.length&&!window.__gRM){
    var a=0.5+0.5*Math.sin(performance.now()/240);
    ctx.fillStyle=PAL.text;
    ctx.beginPath();ctx.arc(cx(trail[trail.length-1]),cy(trail[trail.length-1]),cs*0.14+a*2,0,7);ctx.fill();
  }else if(trail.length){
    ctx.fillStyle=PAL.text;
    ctx.beginPath();ctx.arc(cx(trail[trail.length-1]),cy(trail[trail.length-1]),cs*0.14,0,7);ctx.fill();
  }
}
function updStats(){
  $("stFill").textContent=trail.length+"/"+(cols*rows);
  $("stTotal").textContent=cols*rows;
  $("btnUndo").disabled=trail.length<=1||done;
}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  var p=mpParse(L);
  if(!p){say("关卡数据异常");return;}
  cols=p.cols;rows=p.rows;
  adj=mpAdj(p);
  start=p.start[1]*cols+p.start[0];
  trail=[start];steps=0;done=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=cols+"×"+rows+" · 一笔 "+(cols*rows)+" 格";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  say("从绿色入口出发，一笔走遍所有格子，不重复不漏格");
  resize();updStats();draw();
}
function stepTo(idx){
  if(done)return;
  var cur=trail[trail.length-1];
  if(idx===cur)return;
  if(trail.length>=2&&trail[trail.length-2]===idx){
    trail.pop();steps++;
    updStats();draw();
    return;
  }
  if(visited(idx)){say("这格已经走过（沿原路拖回可回退）");return;}
  if(adj[cur].indexOf(idx)<0){say("这两格之间没有通道");return;}
  trail.push(idx);steps++;
  updStats();draw();
  if(trail.length===cols*rows)winLevel();
}
function undo(){
  if(trail.length<=1||done)return;
  trail.pop();
  updStats();draw();say("已撤销");
}
function hint(){
  if(done)return;
  var path=mpHam({cols:cols,rows:rows,open:L.open,start:[start%cols,Math.floor(start/cols)],total:cols*rows},adj);
  if(!path){say("内嵌验证器：当前进度下无法继续一笔走完，请撤销");return;}
  // 找到当前轨迹在验证器路径中的对齐点，提示下一格
  if(path.length>trail.length){
    var nxt=path[trail.length];
    say("验证器建议下一格走到高亮位置");
    var prev=trail[trail.length-1];
    ctx.fillStyle=PAL.warning;
    ctx.fillRect((nxt%cols)*cs+cs*0.3,Math.floor(nxt/cols)*cs+cs*0.3,cs*0.4,cs*0.4);
    void prev;
  }
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:steps}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"一笔走完！";
  $("ovDesc").innerHTML="全部 "+(cols*rows)+" 格填满（移动 "+steps+" 步）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
/* ---------- 输入 ---------- */
var dragging=false;
function cellFromEvent(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  var c=Math.floor(x/cs),r=Math.floor(y/cs);
  if(c<0||c>=cols||r<0||r>=rows)return -1;
  return r*cols+c;
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  if(done)return;
  dragging=true;
  var idx=cellFromEvent(e);
  if(idx>=0)stepTo(idx);
});
cv.addEventListener("pointermove",function(e){
  if(!dragging||done)return;
  var idx=cellFromEvent(e);
  if(idx>=0){
    var cur=trail[trail.length-1];
    if(idx!==cur)stepTo(idx);
  }
});
window.addEventListener("pointerup",function(){dragging=false});
window.addEventListener("pointercancel",function(){dragging=false});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){trail=[start];steps=0;done=false;updStats();draw();say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(done)return;openLevelSelect()});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if($("overlay").classList.contains("show")){
    if(k===" "||k==="Enter"){$("ovBtn").click();e.preventDefault();}
    return;
  }
  var cur=trail[trail.length-1],r=Math.floor(cur/cols),c=cur%cols;
  if(k==="ArrowUp"&&r>0){stepTo(cur-cols);e.preventDefault();}
  else if(k==="ArrowDown"&&r<rows-1){stepTo(cur+cols);e.preventDefault();}
  else if(k==="ArrowLeft"&&c>0){stepTo(cur-1);e.preventDefault();}
  else if(k==="ArrowRight"&&c<cols-1){stepTo(cur+1);e.preventDefault();}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){trail=[start];steps=0;done=false;updStats();draw();say("本关已重置")}
});
window.addEventListener("resize",function(){resize();draw()});
/* ---------- 启动：逐关独立复核，无哈密顿通路的关不入表 ---------- */
(function(){
  var ok=[];
  for(var i=0;i<LEVELS.length;i++){
    var pass=false;
    try{pass=verifyLevel(LEVELS[i])}catch(e){pass=false}
    if(pass)ok.push(LEVELS[i]);
  }
  if(ok.length)LEVELS=ok;
})();
palLoad();loadLevel(save.lv);
syncLevelsFromServer();syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
