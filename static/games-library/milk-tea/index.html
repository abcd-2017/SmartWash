<style>

  :root {

    --g-primary:#2D9B6A; --g-primary-deep:#17734A;--g-btn-primary:#17734A; --g-primary-soft:#E8F6EF; --g-on-primary:#FFFFFF; --g-on-soft:#0B3625;

    --g-text:#E6E9E6; --g-muted:#A9AEA9; --g-faint:#7E837D; --g-border:#2C312D; --g-hairline:#262A27;

  .lv-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .lv-chip {
    min-height: 44px; border: 1px solid var(--g-border); border-radius: 10px;
    background: var(--g-surface); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;

  }
  .lv-chip.sel { border-color: var(--g-primary); box-shadow: inset 0 0 0 1.5px var(--g-primary); background: var(--g-primary-soft); color: var(--g-on-soft); }
  .lv-chip.done { background: var(--g-btn-primary); border-color: var(--g-primary); color: var(--g-on-primary); }
  .lv-chip:disabled { opacity: .38; cursor: not-allowed; }
  .badge { display: none; margin: 0 0 4px; padding: 4px 12px; border-radius: 999px; background: var(--g-surface2); color: var(--g-warning); font-size: 12px; font-weight: 700; }
  .badge.show { display: inline-block; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */

function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var MT={TAP:0.28,REACT:0.9};
/* 单单最少耗时：反应 + 杯型/茶底/加料/出餐点按 + 摇制 */
MT.needTime=function(o){
  var n=(o.tops&&o.tops.length)||0;
  return MT.REACT+(3+n)*MT.TAP+(o.shake||0)+0.3;
};
/* 关卡生成：订单数 / 加料数 / 摇制时长递增，时间余量递减 */
MT.LEVEL_COUNT=40;
MT.genLevel=function(no){
  var p=(no-1)/(MT.LEVEL_COUNT-1);
  var rng=mulberry32(52000+no*3571);
  var nOrders=Math.round(6+p*8);            // 6→14
  var k=2.2-p*0.75;                          // 时间倍率 2.2→1.45
  var shakeBase=0.8+p*1.4;                   // 摇制 0.8→2.2s
  var orders=[],sumNeed=0,i;
  for(i=0;i<nOrders;i++){
    var nTops=i<2?0:((rng()*(p>0.3?3:2))|0);
    if(nTops>2)nTops=2;
    var tops=[];
    while(tops.length<nTops){
      var t=(rng()*3)|0;
      if(tops.indexOf(t)<0)tops.push(t);
    }
    var o={cup:(rng()*3)|0,base:(rng()*3)|0,tops:tops,
      shake:Math.round((shakeBase+rng()*0.5)*10)/10};
    o.limit=Math.round(MT.needTime(o)*k*10)/10;
    if(o.limit<MT.needTime(o)+1.5)o.limit=Math.round((MT.needTime(o)+1.5)*10)/10;
    sumNeed+=MT.needTime(o);
    orders.push(o);
  }
  var time=Math.round((sumNeed*1.4+5)*10)/10;
  return {name:"第"+no+"关 · 奶茶小铺",time:time,orders:orders};
};
/* 可完成性验证：逐单「最少交互耗时 + 余量」与总时长两项判定 */
MT.validate=function(level){
  if(!level||typeof level!=="object")return{ok:false,why:"bad"};
  if(!Array.isArray(level.orders)||level.orders.length<3||level.orders.length>30)return{ok:false,why:"orders"};
  if(!isFinite(level.time)||level.time<15)return{ok:false,why:"time"};
  var sum=0,i;
  for(i=0;i<level.orders.length;i++){
    var o=level.orders[i];
    if(!o||typeof o!=="object")return{ok:false,why:"order"+i};
    if(!isFinite(o.cup)||o.cup<0||o.cup>2||o.cup!==(o.cup|0))return{ok:false,why:"cup"+i};
    if(!isFinite(o.base)||o.base<0||o.base>2||o.base!==(o.base|0))return{ok:false,why:"base"+i};
    if(!Array.isArray(o.tops)||o.tops.length>3)return{ok:false,why:"tops"+i};
    for(var t=0;t<o.tops.length;t++){
      var v=o.tops[t];
      if(!isFinite(v)||v<0||v>2||o.tops.indexOf(v)!==t)return{ok:false,why:"top"+i};
    }
    if(!isFinite(o.shake)||o.shake<0.4||o.shake>3)return{ok:false,why:"shake"+i};
    if(!isFinite(o.limit)||o.limit<MT.needTime(o)+0.5)return{ok:false,why:"limit"+i};
    sum+=MT.needTime(o);
  }
  if(level.time<sum*1.15+3)return{ok:false,why:"total"};
  return{ok:true,why:""};
};
MT.validateAll=function(){
  var fails=[],marginSum=0,i;
  for(i=1;i<=MT.LEVEL_COUNT;i++){
    var L=MT.genLevel(i);
    var r=MT.validate(L);
    if(!r.ok){fails.push(i+"("+r.why+")");continue;}
    var mg=1e9,sum=0,j;
    for(j=0;j<L.orders.length;j++){
      var m=L.orders[j].limit-MT.needTime(L.orders[j]);
      if(m<mg)mg=m;
      sum+=MT.needTime(L.orders[j]);
    }
    marginSum+=mg;
    if(L.time<sum*1.15+3)fails.push(i+"(total)");
  }
  return {total:MT.LEVEL_COUNT,solvable:MT.LEVEL_COUNT-fails.length,fail:fails,
    avgMargin:Math.round(marginSum/MT.LEVEL_COUNT*100)/100};
};
globalThis.__XC=MT;
/*XC-CORE-END*/

/* ========== 画布与调色板 ========== */
var NW=390,NH=430,W=390,H=430,S=1,offX=0,offY=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),border:v("--g-border"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),danger:v("--g-danger"),warning:v("--g-warning"),
    water:v("--g-water"),success:v("--g-success"),onPrimary:v("--g-on-primary"),surface:v("--g-surface"),surface2:v("--g-surface2"),
    milk:v("--g-st-milk"),cocoa:v("--g-st-cocoa"),pud:v("--g-st-pud"),pearl:v("--g-st-pearl")};
}
window.__gOnTheme=function(){palLoad();};
palLoad();

/* ========== 音效 ========== */
var AC=null;
function beep(f,d,type,vol){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=f;g.gain.value=vol||0.05;
    o.connect(g);g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(d||0.1));
    o.start();o.stop(AC.currentTime+(d||0.1)+0.02);
  }catch(e){}
}

/* ========== 关卡数据：包内生成 + DB 下发（整批替换，任一条非法整批放弃） ========== */
var LEVELS=[],cur=0;
var LEVELS_KEY="sw.milktea.v1.levels",LEVELS_VER_KEY="sw.milktea.v1.levels.ver";
function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=MT.LEVEL_COUNT;i++)list.push(MT.genLevel(i));
  return list;
}
function parseMilkLevels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={},i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    var d;
    try{d=JSON.parse(item.dataJson)}catch(e){return null}
    if(!MT.validate(d).ok)return null;   // 下发关卡必须可完成
    var no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=true;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;}
  }catch(e){}
  return 0;
}

/* ========== 存档（本地 + 账号双写，账号更优才覆盖） ========== */
var KEY="sw.milktea.v1";
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
var curSave=(function(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return{lv:parseInt(s.lv,10)||0,best:parseInt(s.best,10)||1};}catch(e){}
  return{lv:0,best:1};
})();
var unlocked=clamp(curSave.best,1,1);
function save(){
  var data={lv:cur,best:unlocked};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("milk-tea",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("milk-tea").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(r.lv,10),rb=parseInt(r.best,10);
      if(isFinite(rl)&&rl>curSave.lv){curSave.lv=Math.min(rl,LEVELS.length-1);changed=true;}
      if(isFinite(rb)&&rb>unlocked){unlocked=clamp(rb,1,LEVELS.length);changed=true;}
      if(changed){save();buildLevelChips();startLevel(curSave.lv);}
    }catch(e){}
  }).catch(function(){});
}

/* ========== 游戏状态 ========== */
var CUPS=["S 杯","M 杯","L 杯"],BASES=["奶茶","绿茶","可可"],TOPS=["珍珠","椰果","布丁"];
var G=null;
var state="running";
var build=null;   // {cup,base,tops:[],shakeT,shakeOk}
var ui={
  lv:document.getElementById("stLv"),orders:document.getElementById("stOrders"),
  time:document.getElementById("stTime"),miss:document.getElementById("stMiss"),
  msg:document.getElementById("msg"),
  ovWin:document.getElementById("ovWin"),ovFail:document.getElementById("ovFail"),ovSelect:document.getElementById("ovSelect"),
  ovWinDesc:document.getElementById("ovWinDesc"),ovFailDesc:document.getElementById("ovFailDesc"),
  ovNew:document.getElementById("ovNew"),btnNext:document.getElementById("btnNext"),
  lvGrid:document.getElementById("lvGrid")
};
function say(t){ui.msg.textContent=t}
function startLevel(n){
  cur=clamp(n,0,Math.max(0,LEVELS.length-1));
  var L=LEVELS[cur];
  G={L:L,oi:0,time:L.time,served:0,miss:0,score:0,
    oT:0,   // 当前订单已耗时
    clock:0};
  build={cup:-1,base:-1,tops:[],shakeT:0,shakeOk:false};
  state="running";
  showOverlay(null);
  buildLevelChips();
  syncHud();
  say(L.name+" · 看单选杯加料摇制出餐，别让客人等太久");
  save();
}
function curOrder(){return G&&G.oi<G.L.orders.length?G.L.orders[G.oi]:null}
function finishWin(){
  var isNew=(cur+2)>unlocked;
  unlocked=Math.min(LEVELS.length,Math.max(unlocked,cur+2));
  save();
  buildLevelChips();
  ui.ovWinDesc.textContent="出餐 "+G.served+" 杯 · 失误 "+G.miss+" · 得分 "+G.score;
  ui.ovNew.classList.toggle("show",isNew);
  ui.btnNext.style.display=cur<LEVELS.length-1?"":"none";
  showOverlay("win");
  if(GB.available)GB.reportScore("milk-tea",{metricValue:cur+1,metricExtra:G.score}).catch(function(){});
}
function failLevel(reason){
  state="failed";
  ui.ovFailDesc.textContent=reason;
  showOverlay("fail");
}
function showOverlay(name){
  ui.ovWin.classList.toggle("show",name==="win");
  ui.ovFail.classList.toggle("show",name==="fail");
  ui.ovSelect.classList.toggle("show",name==="select");
}
function buildLevelChips(){
  var html="";
  for(var i=0;i<LEVELS.length;i++){
    var cls="lv-chip"+(i===cur?" sel":"")+(i<unlocked?" done":"");
    var dis=i<unlocked?"":" disabled";
    html+='<button class="'+cls+'" type="button" data-lv="'+i+'"'+dis+'>'+(i+1)+'</button>';
  }
  ui.lvGrid.innerHTML=html;
  var btns=ui.lvGrid.querySelectorAll(".lv-chip");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var n=Number(this.getAttribute("data-lv"));
      showOverlay(null);
      startLevel(n);
    });
  }
}
function mistake(reason){
  G.miss++;
  beep(200,0.2,"sawtooth",0.06);
  say(reason+" · 失误 "+G.miss+"/3");
  nextOrder();
  if(G.miss>=3){
    failLevel("失误 3 次，小店打烊了");
  }
}
function nextOrder(){
  G.oi++;
  build={cup:-1,base:-1,tops:[],shakeT:0,shakeOk:false};
  G.oT=0;
  if(G.oi>=G.L.orders.length){
    state="won";
    beep(660,0.12,"square",0.06);beep(880,0.16,"square",0.05);
    finishWin();
  }
}
function pickCup(i){
  if(state!=="running"||!curOrder())return;
  build.cup=i;
  beep(430,0.05,"sine",0.04);
}
function pickBase(i){
  if(state!=="running"||!curOrder())return;
  build.base=i;
  beep(380,0.05,"sine",0.04);
}
function toggleTop(i){
  if(state!=="running"||!curOrder())return;
  var at=build.tops.indexOf(i);
  if(at>=0)build.tops.splice(at,1);
  else{build.tops.push(i);build.tops.sort();}
  beep(340,0.05,"sine",0.04);
}
function shakeStart(){
  if(state!=="running"||!curOrder())return;
  build.holding=true;
}
function shakeEnd(){
  if(!build||!build.holding)return;
  build.holding=false;
  var o=curOrder();
  if(!o)return;
  var dev=Math.abs(build.shakeT-o.shake);
  if(dev<=0.45){build.shakeOk=true;beep(720,0.1,"triangle",0.05);say("摇制完美！");}
  else if(dev<=1.1){build.shakeOk=true;beep(600,0.08,"triangle",0.04);say("摇制合格");}
  else{build.shakeT=0;build.shakeOk=false;say("摇过头了，重新摇");}
}
function serve(){
  if(state!=="running"||!curOrder())return;
  var o=curOrder();
  if(!build.shakeOk){mistake("这杯还没摇好");return;}
  var ok=build.cup===o.cup&&build.base===o.base&&
    build.tops.length===o.tops.length&&
    build.tops.every(function(t,idx){return o.tops.indexOf(t)===idx});
  if(ok){
    var tip=Math.max(0,Math.round((1-G.oT/o.limit)*50));
    var sc=100+tip;
    G.score+=sc;G.served++;
    beep(560,0.1,"triangle",0.05);
    say("出餐 +"+sc+(tip>0?"（小费 "+tip+"）":""));
    nextOrder();
  }else{
    mistake("配方不对");
  }
}
function trash(){
  if(state!=="running")return;
  build={cup:-1,base:-1,tops:[],shakeT:0,shakeOk:false};
  say("倒掉重做");
}

/* ========== 更新 ========== */
function step(dt){
  G.clock+=dt;
  G.time-=dt;
  G.oT+=dt;
  if(build.holding)build.shakeT+=dt;
  syncHud();
  var o=curOrder();
  if(o&&G.oT>=o.limit){
    mistake("客人等太久走了");
    return;
  }
  if(G.time<=0&&state==="running"){
    failLevel("营业时间结束，还有订单没做完");
  }
}
function syncHud(){
  var o=curOrder();
  ui.lv.textContent=(cur+1)+"/"+LEVELS.length;
  ui.orders.textContent=(G.oi+(o?1:0))+"/"+G.L.orders.length;
  ui.time.textContent=Math.max(0,G.time).toFixed(0)+"s";
  ui.miss.textContent=G.miss+"/3";
}

/* ========== 绘制 ========== */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function baseColor(b){return b===0?PAL.milk:(b===1?PAL.primary:PAL.cocoa)}
function topColor(t){return t===0?PAL.pearl:(t===1?PAL.water:PAL.pud)}
function drawTicket(o,ox,oy,ow,oh,expired){
  ctx.globalAlpha=expired?0.4:1;
  ctx.fillStyle=PAL.surface;
  rr(ox,oy,ow,oh,10);ctx.fill();
  ctx.strokeStyle=expired?PAL.danger:PAL.border;ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=PAL.text;
  ctx.font="700 14px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.fillText("订单 "+(G.oi+1)+"/"+G.L.orders.length,ox+12,oy+20);
  ctx.font="16px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText(CUPS[o.cup]+" · "+BASES[o.base],ox+12,oy+42);
  var tops=o.tops.length?o.tops.map(function(t){return TOPS[t]}).join("+"):"不加料";
  ctx.fillStyle=PAL.muted;
  ctx.font="14px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText("加料："+tops,ox+12,oy+62);
  ctx.fillText("摇制 "+o.shake.toFixed(1)+"s · 限时 "+o.limit.toFixed(0)+"s",ox+12,oy+82);
  // 剩余时间条
  var frac=Math.max(0,1-G.oT/o.limit);
  ctx.fillStyle=PAL.surface2;
  rr(ox+12,oy+oh-12,ow-24,6,3);ctx.fill();
  ctx.fillStyle=frac>0.5?PAL.success:(frac>0.25?PAL.warning:PAL.danger);
  rr(ox+12,oy+oh-12,Math.max(4,(ow-24)*frac),6,3);ctx.fill();
  ctx.globalAlpha=1;
}
function drawCup(cx,cy){
  var o=curOrder();
  var w=build.cup===0?44:(build.cup===1?54:64);
  var h=build.cup===0?52:(build.cup===1?64:76);
  ctx.fillStyle=PAL.surface;
  rr(cx-w/2,cy-h,w,h,6);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1.5;ctx.stroke();
  if(build.base>=0){
    var fh=build.cup===0?h-16:(build.cup===1?h-20:h-24);
    ctx.fillStyle=baseColor(build.base);
    ctx.globalAlpha=0.85;
    rr(cx-w/2+3,cy-h+8,w-6,fh,4);ctx.fill();
    ctx.globalAlpha=1;
    // 加料沉底圆点
    for(var t=0;t<build.tops.length;t++){
      ctx.fillStyle=topColor(build.tops[t]);
      ctx.beginPath();
      ctx.arc(cx-8+t*8,cy-8,3.4,0,6.3);ctx.fill();
    }
  }
  ctx.fillStyle=PAL.muted;
  ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  ctx.fillText(build.cup>=0?CUPS[build.cup]:"选杯型",cx,cy+16);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(offX,offY);ctx.scale(S,S);
  if(G){
    var o=curOrder();
    // 吧台背景
    ctx.fillStyle=PAL.surface2;
    ctx.fillRect(0,NH-70,NW,70);
    if(o)drawTicket(o,10,10,180,102,G.oT>=o.limit);
    // 队列指示
    ctx.fillStyle=PAL.muted;
    ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="right";ctx.textBaseline="alphabetic";
    ctx.fillText("待出餐 "+Math.max(0,G.L.orders.length-G.oi)+" 杯",NW-12,26);
    // 当前制作
    drawCup(NW/2+40,NH-96);
    // 摇制条
    if(o){
      var bw=180,bx=NW-12-bw,by=52;
      ctx.fillStyle=PAL.text;
      ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.textAlign="right";
      ctx.fillText("摇制节奏",bx+bw,by-6);
      ctx.fillStyle=PAL.surface;
      rr(bx,by,bw,18,9);ctx.fill();
      ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.stroke();
      // 目标区（±0.45s）
      var pps=bw/2.6;
      var z0=bx+bw/2+(o.shake-0.45)*pps,z1=bx+bw/2+(o.shake+0.45)*pps;
      ctx.fillStyle=PAL.primary;
      ctx.globalAlpha=0.5;
      rr(z0,by+2,Math.max(4,z1-z0),14,7);ctx.fill();
      ctx.globalAlpha=1;
      // 当前摇制进度
      var px2=bx+Math.min(bw,build.shakeT*pps);
      ctx.fillStyle=build.shakeOk?PAL.success:PAL.warning;
      rr(bx+2,by+2,Math.max(4,Math.min(bw-4,px2-bx)),14,7);ctx.fill();
      // 完成标记
      ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(bx+bw/2+o.shake*pps,by);ctx.lineTo(bx+bw/2+o.shake*pps,by+18);ctx.stroke();
    }
    // 得分
    ctx.fillStyle=PAL.deep;
    ctx.font="700 22px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
    ctx.fillText(String(G.score),10,NH-20);
    ctx.fillStyle=PAL.muted;
    ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText("营业额",10,NH-44);
    syncHud();
  }
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

/* ========== 输入 ========== */
function bindBtn(id,fn){
  var el=document.getElementById(id);
  if(el)el.addEventListener("click",function(e){fn();e.currentTarget.blur();});
}
bindBtn("btnCup0",function(){pickCup(0)});
bindBtn("btnCup1",function(){pickCup(1)});
bindBtn("btnCup2",function(){pickCup(2)});
bindBtn("btnBase0",function(){pickBase(0)});
bindBtn("btnBase1",function(){pickBase(1)});
bindBtn("btnBase2",function(){pickBase(2)});
bindBtn("btnTop0",function(){toggleTop(0)});
bindBtn("btnTop1",function(){toggleTop(1)});
bindBtn("btnTop2",function(){toggleTop(2)});
bindBtn("btnServe",serve);
bindBtn("btnTrash",trash);
var shakeBtn=document.getElementById("btnShake");
shakeBtn.addEventListener("pointerdown",function(e){shakeStart();e.preventDefault();});
shakeBtn.addEventListener("pointerup",function(e){shakeEnd();e.preventDefault();});
shakeBtn.addEventListener("pointercancel",function(){shakeEnd();});
shakeBtn.addEventListener("pointerleave",function(){if(build&&build.holding)shakeEnd();});

window.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="1")pickCup(0);
  else if(k==="2")pickCup(1);
  else if(k==="3")pickCup(2);
  else if(k==="q")pickBase(0);
  else if(k==="w")pickBase(1);
  else if(k==="e")pickBase(2);
  else if(k==="a")toggleTop(0);
  else if(k==="s")toggleTop(1);
  else if(k==="d")toggleTop(2);
  else if(k===" "){
    e.preventDefault();
    if(state==="running"&&!build.holding)shakeStart();
    else if(state!=="running")return;
  }
  else if(k==="Enter"){e.preventDefault();serve();}
  else if(k==="Backspace"){e.preventDefault();trash();}
});
window.addEventListener("keyup",function(e){
  if(e.key===" "){e.preventDefault();shakeEnd();}
});

document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running"){say("已暂停 · 切回继续营业");}
});

/* ========== 主循环与启动 ========== */
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));
  H=Math.max(280,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);
  offX=(W-NW*S)/2;offY=(H-NH*S)/2;
}
window.addEventListener("resize",resize);
var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.033,(ts-last)/1000||0);
  last=ts;
  if(state==="running"&&G)step(dt);
  draw();
}

document.getElementById("btnSelectTop").addEventListener("click",function(){buildLevelChips();showOverlay("select");});
document.getElementById("btnSelectWin").addEventListener("click",function(){buildLevelChips();showOverlay("select");});
document.getElementById("btnSelectFail").addEventListener("click",function(){buildLevelChips();showOverlay("select");});
document.getElementById("btnCloseSelect").addEventListener("click",function(){showOverlay(null);});
document.getElementById("btnNext").addEventListener("click",function(){startLevel(cur<LEVELS.length-1?cur+1:0);});
document.getElementById("btnReplayWin").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnRetry").addEventListener("click",function(){startLevel(cur);});
document.getElementById("btnRetryBottom").addEventListener("click",function(){startLevel(cur);});

/* 调试验证入口：可完成性自验（逐单耗时余量 + 总时长） */
window.__validateLevels=function(){
  try{return MT.validateAll()}catch(e){return {error:String(e)}}
};

resize();
LEVELS=buildDefaultLevels();
loadCachedLevels();
cur=clamp(parseInt(curSave.lv,10)||0,0,Math.max(0,LEVELS.length-1));
unlocked=clamp(parseInt(curSave.best,10)||1,1,Math.max(1,LEVELS.length));
startLevel(cur);
requestAnimationFrame(frame);
(function(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("milk-tea").then(function(res){
    var list=parseMilkLevels(res);
    if(!list||!list.length)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      startLevel(cur);
    }
  }).catch(function(){});
})();
syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
