<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F6F3">
<title>扫雷</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（--g-ms-frame1/2 木框、--g-ms-ground 沙土地面、--g-ms-cur 选中环）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-on-primary:#FFFFFF;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-ms-frame1:#C9A468;--g-ms-frame2:#A87F3F;--g-ms-ground:#CFC4AA;--g-ms-cur:#17734A;--g-cell1:#E7EBE6;--g-cell2:#C0C9C1;--g-cellhi:rgba(255,255,255,.9);--g-celllo:rgba(60,80,70,.22);--g-open:#E2DAC6;--g-openln:rgba(120,110,88,.30);--g-n1:#1D47B8;--g-n2:#1F6B2A;--g-n3:#B52A22;--g-n4:#4A2170;--g-n5:#7A241A;--g-n6:#00606E;--g-n7:#26343C;--g-n8:#4A5A64;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-ms-frame1:#4A3F2C;--g-ms-frame2:#2C2517;--g-ms-ground:#191C19;--g-ms-cur:#5BC894;--g-cell1:#39423C;--g-cell2:#2E352F;--g-cellhi:rgba(255,255,255,.10);--g-celllo:rgba(0,0,0,.5);--g-open:#262A27;--g-openln:rgba(255,255,255,.07);--g-n1:#7B9FF2;--g-n2:#6FCF8E;--g-n3:#F08A80;--g-n4:#B794E0;--g-n5:#E89A8E;--g-n6:#5BC8D6;--g-n7:#B7C4CC;--g-n8:#8FA3AD;color-scheme:dark }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg);
    color: var(--g-text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; max-width: 442px; margin: 0 auto 16px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; align-items: center; justify-content: space-between; gap: 8px; max-width: 442px; margin: 0 auto 10px; }
  .stat {
    background: var(--g-surface2); border-radius: var(--g-radius-inner);
    padding: 4px 10px; min-width: 86px; text-align: center; line-height: 1.3;
    animation: rise .38s ease-out backwards;
  }
  .stat:nth-of-type(2) { animation-delay: 40ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { display: inline-block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.bump { animation: valpop .24s ease-out; }
  .btn {
    min-height: 44px; min-width: 64px; padding: 0 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-btn-primary); color: var(--g-on-primary);
    font-size: 16px; font-weight: 600; font-family: inherit;
    cursor: pointer;
    transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out;
  }
  .btn:active { transform: scale(.96); }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .stage { position: relative; width: 100%; max-width: 442px; margin: 0 auto; animation: fadein .3s ease-out backwards; }
  /* 棋盘四层：木框（渐变描边）/ 沙土地面（内底）/ 石盖格（凸面）/ 翻开沙坑（内凹） */
  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    gap: 3px;
    width: 100%;
    aspect-ratio: 1;
    padding: 7px;
    border: 7px solid transparent;
    border-radius: var(--g-radius);
    background:
      linear-gradient(160deg, var(--g-ms-ground), var(--g-open)) padding-box,
      linear-gradient(160deg, var(--g-ms-frame1), var(--g-ms-frame2)) border-box;
    box-shadow: var(--g-shadow), inset 0 1px 0 var(--g-cellhi);
    touch-action: none;
  }
  .cell {
    position: relative;
    border-radius: 10px;
    background: linear-gradient(160deg, var(--g-cell1), var(--g-cell2));
    box-shadow: inset 0 1px 0 var(--g-cellhi), inset 0 -2px 0 var(--g-celllo), inset 0 0 0 1px rgba(0,0,0,.04);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(14px, 5vw, 22px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    animation: cellenter .3s ease-out backwards;
    animation-delay: calc(var(--r, 0) * 30ms);
    transition: transform .14s ease-out, box-shadow .16s ease-out, background .16s ease-out, filter .16s ease-out;
  }
  .cell:not(.open):hover { filter: brightness(1.06); transform: translateY(-1px); }
  .cell:not(.open):active { transform: scale(.96); }
  /* 选中（键盘光标）：内嵌环 + 外发光，与凸面「可落点」区分 */
  .cell.cur::after {
    content: ""; position: absolute; inset: 2px; border-radius: 8px;
    border: 2px solid var(--g-ms-cur);
    box-shadow: 0 0 0 2px var(--g-cellhi), 0 2px 8px rgba(0,0,0,.18);
    pointer-events: none;
  }
  /* 翻开：内凹沙坑 + 顶部内阴影 + 底部亮缘，数字描影增可读性 */
  .cell.open {
    background: var(--g-open);
    box-shadow: inset 0 2px 5px var(--g-celllo), inset 0 -1px 0 var(--g-cellhi), inset 0 0 0 1px var(--g-openln);
    cursor: default;
    text-shadow: 0 1px 1px var(--g-celllo);
    animation: cellopen .18s ease-out backwards;
    animation-delay: 0ms;
  }
  .cell.open:active { filter: none; transform: none; }
  /* 踩雷：危险色实底 + 内凹 + 白色内环 */
  .cell.boom { background: var(--g-danger); box-shadow: inset 0 2px 6px rgba(0,0,0,.35), inset 0 0 0 2px var(--g-cellhi); animation: boomin .26s ease-out backwards; }
  .cell svg { pointer-events: none; }
  /* 旗：插旗后石面微微泛绿（已标记态），旗面落地轻弹 */
  .cell.flag { background: linear-gradient(160deg, var(--g-primary-soft), var(--g-cell2)); }
  .cell.flag svg.flag { display: block; width: 68%; height: 68%; filter: drop-shadow(0 1px 1px rgba(0,0,0,.28)); animation: flagpop .2s ease-out backwards; }
  .n1 { color: var(--g-n1); }
  .n2 { color: var(--g-n2); }
  .n3 { color: var(--g-n3); }
  .n4 { color: var(--g-n4); }
  .n5 { color: var(--g-n5); }
  .n6 { color: var(--g-n6); }
  .n7 { color: var(--g-n7); }
  .n8 { color: var(--g-n8); }
  .cell.wrong { background: var(--g-open); box-shadow: inset 0 2px 5px var(--g-celllo), inset 0 0 0 1px var(--g-openln); }
  .cell.wrong svg.flag { opacity: .38; }
  .cell.wrong .swi {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    color: var(--g-danger);
    width: 1em; height: 1em;
    font-size: clamp(16px, 5.5vw, 22px);
  }
  /* 图例：三秒读懂「我控制什么 / 目标是什么 / 该点哪」 */
  .legend { display: flex; gap: 8px; max-width: 442px; margin: 10px auto 0; animation: rise .38s ease-out backwards; animation-delay: 120ms; }
  .lg-chip { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; background: var(--g-surface2); border-radius: 10px; padding: 5px 8px; font-size: 12px; color: var(--g-muted); line-height: 1.3; }
  .lg-chip b { color: var(--g-text); font-weight: 600; }
  .lg-chip svg { width: 20px; height: 20px; flex: none; }
  .foot { margin: 12px 0 0; font-size: 12px; color: var(--g-muted); text-align: center; animation: rise .38s ease-out backwards; animation-delay: 160ms; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px; overflow-y: auto;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 320px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .3s ease-out;
  }
  .panel.win { animation: winpop .45s cubic-bezier(.18,.9,.3,1.4); }
  .panel.lose { animation: shake .32s ease-out; }
  .ov-title { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
  .panel.win .ov-title { color: var(--g-success); }
  .panel.lose .ov-title { color: var(--g-danger); }
  .ov-sub { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.7; }
  .panel .btn { width: 100%; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes winpop { 0% { transform: scale(.86); opacity: 0; } 62% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 55% { transform: translateX(5px); } 80% { transform: translateX(-3px); } }
  @keyframes valpop { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
  @keyframes cellenter { from { opacity: 0; transform: translateY(10px) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes cellopen { 0% { transform: scale(.8); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @keyframes boomin { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes flagpop { 0% { transform: scale(.4) translateY(-2px); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
/* SW 图标库：内联 SVG 线性图标（stroke=currentColor，24 viewBox，与 UI 令牌联动） */
window.SW_ICON=function(n,s){s=s||"";var P={
 'rotate':'<path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>',
 'x':'<path d="M6 6l12 12M18 6L6 18"/>'
};
var fill={};
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};
</script>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <span class="sub">9×9 · 10 雷</span>
  </header>
  <div class="stats">
    <div class="stat"><span class="label">剩余雷数</span><span class="val" id="mines">10</span></div>
    <button class="btn" id="newBtn">新局</button>
    <div class="stat"><span class="label">用时</span><span class="val" id="time">0</span></div>
  </div>
  <div class="stage">
    <div class="board" id="board" role="grid" tabindex="0" aria-label="扫雷棋盘，方向键移动，空格揭开，F 插旗"></div>
    <div class="overlay" role="dialog" aria-modal="true" id="overlay">
      <div class="panel" id="panel">
        <h2 class="ov-title" id="ovTitle" role="status" aria-live="assertive"></h2>
        <p class="ov-sub" id="ovSub"></p>
        <button class="btn" id="ovBtn"><span id="ovBtnText">再来一局</span></button>
      </div>
    </div>
  </div>
  <div class="legend">
    <span class="lg-chip">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 16 7.5 7 11Z" fill="var(--g-danger)"/><path d="M7 21V3.5" stroke="var(--g-muted)" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span><b>插旗</b> · 长按 / 右键</span>
    </span>
    <span class="lg-chip">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="var(--g-text)" stroke-width="2" stroke-linecap="round" fill="none"><path d="M12 2.5v19M2.5 12h19M5.3 5.3l13.4 13.4M18.7 5.3 5.3 18.7"/></g><circle cx="12" cy="12" r="5.6" fill="var(--g-text)"/></svg>
      <span><b>目标</b> · 扫出 10 雷</span>
    </span>
  </div>
  <p class="foot">点按翻开 · 长按 / 右键插旗 · 首次点击必有安全区</p>
</div>
<script>
"use strict";
(() => {
  const N = 9;
  const MINES = 10;
  const PRESS_MS = 400;   // 长按插旗时长（ms）
  const MOVE_CANCEL = 12; // 手指移动超过该距离取消长按（px）

  const boardEl = document.getElementById("board");
  const minesEl = document.getElementById("mines");
  const timeEl = document.getElementById("time");
  const overlayEl = document.getElementById("overlay");
  const panelEl = document.getElementById("panel");
  const ovTitle = document.getElementById("ovTitle");
  const ovSub = document.getElementById("ovSub");
  const ovBtn = document.getElementById("ovBtn");
  const ovBtnText = document.getElementById("ovBtnText");

  // 旗 / 雷图形：内联 SVG（fill/stroke 走主题变量），零外部资源
  const FLAG_SVG = '<svg class="flag" viewBox="0 0 24 24"><ellipse cx="12" cy="20.5" rx="6.4" ry="1.7" fill="rgba(0,0,0,.26)"/><path d="M7 4 16 7.5 7 11Z" fill="var(--g-danger)"/><path d="M7 11.5V20" stroke="var(--g-muted)" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const MINE_SVG = '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="19.5" rx="6.5" ry="1.8" fill="rgba(0,0,0,.28)"/><g stroke="var(--g-text)" stroke-width="2.1" stroke-linecap="round" fill="none"><path d="M12 3.2v15.6M3.2 12h15.6M5.8 5.8l12.4 12.4M18.2 5.8 5.8 18.2"/></g><circle cx="12" cy="12" r="6" fill="var(--g-text)"/><ellipse cx="9.9" cy="9.5" rx="2.2" ry="1.35" fill="#eceff1" opacity=".85" transform="rotate(-32 9.9 9.5)"/><circle cx="12" cy="12" r="2.2" fill="var(--g-danger)"/></svg>';

  /* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
  var GB=(function(){
    var pending={},seq=0;
    window.__gOnGameBridgeResult=function(cbId,ok,payload){
      var cb=pending[cbId];if(!cb)return;
      delete pending[cbId];
      try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
    };
    function call(method,args){
      return new Promise(function(resolve,reject){
        var bridge=window.SmartWashGameBridge;
        if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
        var cbId="gb"+Date.now()+"_"+(++seq);
        pending[cbId]={resolve:resolve,reject:reject};
        try{bridge[method].apply(bridge,args.concat([cbId]));}
        catch(e){delete pending[cbId];reject(e);}
      });
    }
    return {
      available:!!window.SmartWashGameBridge,
      loadState:function(gameKey){return call("loadState",[gameKey]);},
      saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
      reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
      getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
      getLevels:function(gameKey){return call("getLevels",[gameKey]);}
    };
  })();
  /* ---------- 存档（本地 + 账号双写）：仅记最佳用时（秒） ---------- */
  var KEY="sw.minesweeper.v1";
  function loadSave(){try{var v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==="object")return{best:Math.max(0,parseInt(v.best,10)||0)}}catch(e){}return{best:0}}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}
    if(GB.available)GB.saveState("minesweeper",save).catch(function(){});}
  var save=loadSave();
  function syncSaveFromServer(){
    if(!GB.available||!GB.loadState)return;
    GB.loadState("minesweeper").then(function(res){
      if(!res||!res.stateJson)return;
      try{
        var r=JSON.parse(res.stateJson),rb=Math.max(0,parseInt(r.best,10)||0);
        if(rb>0&&(save.best===0||rb<save.best)){save.best=rb;persist()}
      }catch(e){}
    }).catch(function(){});
  }

  let mines = [], open = [], flags = [], counts = [];
  let cellsArr = [];
  let placed = false, finished = false, openCount = 0, flagCount = 0;
  let startAt = 0, timerId = null;

  const idx = (r, c) => r * N + c;

  function buildCells() {
    boardEl.innerHTML = "";
    cellsArr = [];
    curR = 0; curC = 0;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const d = document.createElement("div");
        d.className = "cell";
        d.setAttribute("role", "gridcell");
        d.dataset.r = r;
        d.dataset.c = c;
        d.style.setProperty("--r", r);   // 入场按行错落
        boardEl.appendChild(d);
        cellsArr.push(d);
      }
    }
    paintCursor();
  }

  /* 键盘/读屏：方向键移格、空格/Enter 揭开、F 插旗 */
  let curR = 0, curC = 0, curEl = null;
  function paintCursor() {
    if (curEl) curEl.classList.remove("cur");
    curEl = cellsArr[idx(curR, curC)];
    if (curEl) curEl.classList.add("cur");
  }
  boardEl.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowUp") curR = (curR + N - 1) % N;
    else if (k === "ArrowDown") curR = (curR + 1) % N;
    else if (k === "ArrowLeft") curC = (curC + N - 1) % N;
    else if (k === "ArrowRight") curC = (curC + 1) % N;
    else if (k === " " || k === "Enter") { reveal(curR, curC); e.preventDefault(); return; }
    else if (k === "f" || k === "F") { toggleFlag(curR, curC); e.preventDefault(); return; }
    else return;
    paintCursor(); e.preventDefault();
  });

  function neighbors(r, c, fn) {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < N && nc >= 0 && nc < N) fn(nr, nc);
      }
    }
  }

  function elapsedSec() {
    return Math.min(999, ((Date.now() - startAt) / 1000) | 0);
  }
  function startTimer() {
    startAt = Date.now();
    timerId = setInterval(() => { timeEl.textContent = elapsedSec(); }, 250);
  }
  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  /* S4: 页面隐藏时暂停计时，恢复时平移时间基点 */
  let hideAt = 0, wasRunning = false;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (timerId) { wasRunning = true; stopTimer(); hideAt = Date.now(); } }
    else if (wasRunning) { wasRunning = false; startAt += Date.now() - hideAt; timerId = setInterval(() => { timeEl.textContent = elapsedSec(); }, 250); }
  });

  function reset() {
    mines = []; open = []; flags = []; counts = [];
    for (let r = 0; r < N; r++) {
      mines.push(new Array(N).fill(false));
      open.push(new Array(N).fill(false));
      flags.push(new Array(N).fill(false));
      counts.push(new Array(N).fill(0));
    }
    placed = false;
    finished = false;
    openCount = 0;
    flagCount = 0;
    stopTimer();
    timeEl.textContent = "0";
    setMines(MINES);
    buildCells();
    overlayEl.classList.remove("show");
    panelEl.classList.remove("win", "lose");
  }

  // 布雷：首点及其邻域必无雷（首点保护）
  function placeMines(sr, sc) {
    const banned = new Set([idx(sr, sc)]);
    neighbors(sr, sc, (r, c) => banned.add(idx(r, c)));
    let n = 0;
    while (n < MINES) {
      const p = (Math.random() * N * N) | 0;
      if (banned.has(p) || mines[(p / N) | 0][p % N]) continue;
      mines[(p / N) | 0][p % N] = true;
      n++;
    }
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        let m = 0;
        neighbors(r, c, (nr, nc) => { if (mines[nr][nc]) m++; });
        counts[r][c] = m;
      }
    }
    placed = true;
    startTimer();
  }

  function paint(r, c) {
    const el = cellsArr[idx(r, c)];
    if (open[r][c]) {
      const k = counts[r][c];
      el.className = "cell open" + (k ? " n" + k : "") + (el === curEl ? " cur" : "");
      el.textContent = k ? k : "";
    } else if (flags[r][c]) {
      el.className = "cell flag" + (el === curEl ? " cur" : "");
      el.innerHTML = FLAG_SVG;
    } else {
      el.className = "cell" + (el === curEl ? " cur" : "");
      el.innerHTML = "";
    }
    el.setAttribute("aria-label", "第" + (r + 1) + "行第" + (c + 1) + "列，" +
      (open[r][c] ? (counts[r][c] ? counts[r][c] + " 个雷" : "已揭开") : flags[r][c] ? "已插旗" : "未揭开"));
  }

  function reveal(r, c) {
    if (finished || open[r][c] || flags[r][c]) return;
    if (!placed) placeMines(r, c);
    if (mines[r][c]) return lose(r, c);
    // 空格泛洪展开
    const stack = [[r, c]];
    while (stack.length) {
      const top = stack.pop();
      const cr = top[0], cc = top[1];
      if (open[cr][cc] || flags[cr][cc]) continue;
      open[cr][cc] = true;
      openCount++;
      paint(cr, cc);
      if (counts[cr][cc] === 0) {
        neighbors(cr, cc, (nr, nc) => { if (!open[nr][nc]) stack.push([nr, nc]); });
      }
    }
    if (openCount === N * N - MINES) winGame();
  }

  function toggleFlag(r, c) {
    if (finished || open[r][c]) return;
    flags[r][c] = !flags[r][c];
    flagCount += flags[r][c] ? 1 : -1;
    setMines(MINES - flagCount);
    paint(r, c);
  }

  /* 剩余雷数：更新文案并轻弹（状态变化反馈，渲染层） */
  function setMines(v) {
    minesEl.textContent = v;
    minesEl.classList.remove("bump");
    void minesEl.offsetWidth;
    minesEl.classList.add("bump");
  }

  function lose(br, bc) {
    finished = true;
    stopTimer();
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const el = cellsArr[idx(r, c)];
        if (mines[r][c]) {
          el.className = "cell open" + (r === br && c === bc ? " boom" : "");
          el.innerHTML = MINE_SVG;
        } else if (flags[r][c]) {
          el.className = "cell wrong";
          el.innerHTML = FLAG_SVG + SW_ICON('x');
        }
      }
    }
    timeEl.textContent = elapsedSec();
    ovTitle.textContent = "踩到雷了";
    ovSub.textContent = "用时 " + elapsedSec() + " 秒";
    ovBtnText.textContent = "再来一局";
    panelEl.classList.add("lose");
    overlayEl.classList.add("show");
  }

  function winGame() {
    finished = true;
    stopTimer();
    // 剩余雷自动插旗
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (mines[r][c] && !flags[r][c]) {
          flags[r][c] = true;
          flagCount++;
          paint(r, c);
        }
      }
    }
    setMines(MINES - flagCount);
    timeEl.textContent = elapsedSec();
    // 最佳用时（asc：越少越好）入本地 + 账号存档
    var t = elapsedSec();
    if (!save.best || t < save.best) { save.best = t; persist(); }
    // 成绩上报（用时 asc：越少越好）
    if (GB.available) GB.reportScore("minesweeper", { metricValue: t }).catch(function () {});
    ovTitle.textContent = "扫雷成功！";
    ovSub.textContent = "用时 " + t + " 秒 · 最佳 " + save.best + " 秒";
    ovBtnText.textContent = "再来一局";
    panelEl.classList.add("win");
    overlayEl.classList.add("show");
  }

  // —— 触屏：长按约 400ms 插旗；点按由 click 翻开 ——
  let pressTimer = null, lpFired = false, pressStart = null, touchCell = null;

  function cancelPress() {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  }

  boardEl.addEventListener("touchstart", (e) => {
    const el = e.target.closest(".cell");
    if (!el || finished) return;
    lpFired = false;
    touchCell = el;
    const t = e.changedTouches[0];
    pressStart = { x: t.clientX, y: t.clientY };
    cancelPress();
    pressTimer = setTimeout(() => {
      pressTimer = null;
      lpFired = true;
      toggleFlag(+el.dataset.r, +el.dataset.c);
    }, PRESS_MS);
  }, { passive: true });

  boardEl.addEventListener("touchmove", (e) => {
    if (!pressStart) return;
    const t = e.changedTouches[0];
    if (Math.abs(t.clientX - pressStart.x) > MOVE_CANCEL || Math.abs(t.clientY - pressStart.y) > MOVE_CANCEL) {
      cancelPress();
    }
  }, { passive: true });

  boardEl.addEventListener("touchend", (e) => {
    cancelPress();
    if (lpFired) {
      e.preventDefault(); // 长按已插旗，拦截合成 click 防止误翻开
      lpFired = false;
    }
    pressStart = null;
    touchCell = null;
  }, { passive: false });

  boardEl.addEventListener("touchcancel", () => {
    cancelPress();
    pressStart = null;
    touchCell = null;
  });

  // 桌面右键插旗；安卓长按附带的 contextmenu 在此去重
  boardEl.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    const el = e.target.closest(".cell");
    if (!el || finished) return;
    if (touchCell === el) {
      // 同一次触屏长按序列：浏览器附带的 contextmenu，避免重复插旗
      cancelPress();
      if (!lpFired) {
        lpFired = true;
        toggleFlag(+el.dataset.r, +el.dataset.c);
      }
      return;
    }
    toggleFlag(+el.dataset.r, +el.dataset.c);
  });

  boardEl.addEventListener("click", (e) => {
    const el = e.target.closest(".cell");
    if (!el) return;
    reveal(+el.dataset.r, +el.dataset.c);
  });

  document.getElementById("newBtn").addEventListener("click", (e) => { reset(); e.currentTarget.blur(); });
  ovBtn.addEventListener("click", (e) => { reset(); e.currentTarget.blur(); });

  reset();
  syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）+ 按钮图标注入（内联 SVG，零外链） */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(els.length){
    function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
    var lastFocus=null;
    function focusFirst(el){
      if(el.dataset.foc)return;el.dataset.foc="1";
      if(!lastFocus)lastFocus=document.activeElement;
      var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
    }
    function restore(el){
      if(!el.dataset.foc)return;delete el.dataset.foc;
      if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
    }
    function trap(el,e){
      if(e.key!=="Tab")return;
      var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
      if(!f.length)return;
      var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
      else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
    }
    function watch(el){
      try{new MutationObserver(function(){
        if(shown(el))focusFirst(el);else restore(el);
      }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
      el.addEventListener("keydown",function(e){trap(el,e)});
    }
    for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  }
  function $(id){return document.getElementById(id)}
  $("newBtn").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
  $("ovBtn").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
})();
</script>
