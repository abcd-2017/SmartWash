/* ---------- SW 图标库（内联 SVG 线性图标，stroke=currentColor） ---------- */

/*MG-ENGINE-BEGIN*/
// 迷你高尔夫引擎：纯函数、无 DOM。世界 360×540，y 向下；固定步长 1/120s。
var MGW=360,MGH=540,MGR=7,MG_HOLE_R=13;
var MG_L=26,MG_T=26,MG_R=334,MG_B=514;
var MG_V0=260,MG_V1=300;
var MG_FRICT=1.2,MG_SAND_FRICT=6.0;
var MG_STOP=9,MG_CAPTURE=150,MG_REST_WALL=.7,MG_REST_POST=.85;
var MG_PHYS=1/120,MG_MAXT=8;
function mgClamp(v,a,b){return v<a?a:(v>b?b:v)}
function mgIsInt(v){return typeof v==="number"&&isFinite(v)&&Math.floor(v)===v}
function mgInRect(x,y,r,pad){pad=pad||0;return x>=r[0]-pad&&x<=r[0]+r[2]+pad&&y>=r[1]-pad&&y<=r[1]+r[3]+pad}
function mgSandAt(c,x,y){var i;for(i=0;i<c.sands.length;i++)if(mgInRect(x,y,c.sands[i]))return true;return false}
function mgWaterAt(c,x,y){var i;for(i=0;i<c.waters.length;i++)if(mgInRect(x,y,c.waters[i]))return true;return false}
function mgSlopeAt(c,x,y){var i;for(i=0;i<c.slopes.length;i++)if(mgInRect(x,y,c.slopes[i]))return c.slopes[i];return null}
function mgRectCollide(st,w){
  var nx=mgClamp(st.x,w[0],w[0]+w[2]),ny=mgClamp(st.y,w[1],w[1]+w[3]);
  var dx=st.x-nx,dy=st.y-ny,d2=dx*dx+dy*dy;
  if(d2>=MGR*MGR)return false;
  if(d2<1e-9){
    var l=st.x-w[0],r=w[0]+w[2]-st.x,t=st.y-w[1],b=w[1]+w[3]-st.y,m=Math.min(l,r,t,b);
    if(m===l){st.x=w[0]-MGR;st.vx=-Math.abs(st.vx)*MG_REST_WALL}
    else if(m===r){st.x=w[0]+w[2]+MGR;st.vx=Math.abs(st.vx)*MG_REST_WALL}
    else if(m===t){st.y=w[1]-MGR;st.vy=-Math.abs(st.vy)*MG_REST_WALL}
    else{st.y=w[1]+w[3]+MGR;st.vy=Math.abs(st.vy)*MG_REST_WALL}
    return true;
  }
  var d=Math.sqrt(d2),ux=dx/d,uy=dy/d;
  st.x=nx+ux*MGR;st.y=ny+uy*MGR;
  var vn=st.vx*ux+st.vy*uy;
  if(vn<0){st.vx-=(1+MG_REST_WALL)*vn*ux;st.vy-=(1+MG_REST_WALL)*vn*uy}
  return true;
}
function mgPostCollide(st,p){
  var dx=st.x-p[0],dy=st.y-p[1],rr=p[2]+MGR,d2=dx*dx+dy*dy;
  if(d2>=rr*rr||d2<1e-9)return false;
  var d=Math.sqrt(d2),ux=dx/d,uy=dy/d;
  st.x=p[0]+ux*rr;st.y=p[1]+uy*rr;
  var vn=st.vx*ux+st.vy*uy;
  if(vn<0){st.vx-=(1+MG_REST_POST)*vn*ux;st.vy-=(1+MG_REST_POST)*vn*uy}
  return true;
}
function mgStep(c,st,dt){
  var s=mgSlopeAt(c,st.x,st.y),i;
  if(s){st.vx+=s[4]*s[6]*dt;st.vy+=s[5]*s[6]*dt}
  st.x+=st.vx*dt;st.y+=st.vy*dt;
  var k=mgSandAt(c,st.x,st.y)?MG_SAND_FRICT:MG_FRICT;
  var damp=Math.exp(-k*dt);st.vx*=damp;st.vy*=damp;
  var sp=Math.hypot(st.vx,st.vy),cap=MG_V0+MG_V1;
  if(sp>cap){var f=cap/sp;st.vx*=f;st.vy*=f}
  if(st.x<MG_L+MGR){st.x=MG_L+MGR;st.vx=Math.abs(st.vx)*MG_REST_WALL}
  if(st.x>MG_R-MGR){st.x=MG_R-MGR;st.vx=-Math.abs(st.vx)*MG_REST_WALL}
  if(st.y<MG_T+MGR){st.y=MG_T+MGR;st.vy=Math.abs(st.vy)*MG_REST_WALL}
  if(st.y>MG_B-MGR){st.y=MG_B-MGR;st.vy=-Math.abs(st.vy)*MG_REST_WALL}
  for(i=0;i<c.walls.length;i++)mgRectCollide(st,c.walls[i]);
  for(i=0;i<c.posts.length;i++)mgPostCollide(st,c.posts[i]);
  if(mgWaterAt(c,st.x,st.y))st.water=true;
  if(Math.hypot(st.x-c.hole[0],st.y-c.hole[1])<MG_HOLE_R*.85&&Math.hypot(st.vx,st.vy)<MG_CAPTURE){st.holed=true;st.vx=0;st.vy=0}
  if(Math.hypot(st.vx,st.vy)<MG_STOP){st.vx=0;st.vy=0}
  return st;
}
function mgRectList(v,n){
  if(v===undefined||v===null)return[];
  if(!Array.isArray(v))return null;
  var out=[],i;
  for(i=0;i<v.length;i++){var r=v[i];
    if(!Array.isArray(r)||r.length!==n)return null;
    for(var j=0;j<n;j++)if(!mgIsInt(r[j]))return null;
    if(r[2]<=0||r[3]<=0)return null;
    if(r[0]<0||r[1]<0||r[0]+r[2]>MGW||r[1]+r[3]>MGH)return null;
    out.push(r);
  }
  return out;
}
function mgPostList(v){
  if(v===undefined||v===null)return[];
  if(!Array.isArray(v))return null;
  var out=[],i;
  for(i=0;i<v.length;i++){var p=v[i];
    if(!Array.isArray(p)||p.length!==3)return null;
    for(var j=0;j<3;j++)if(!mgIsInt(p[j]))return null;
    if(p[2]<=0||p[2]>40)return null;
    out.push(p);
  }
  return out;
}
function mgSlopeList(v){
  if(v===undefined||v===null)return[];
  if(!Array.isArray(v))return null;
  var out=[],i;
  for(i=0;i<v.length;i++){var s=v[i];
    if(!Array.isArray(s)||s.length!==7)return null;
    for(var j=0;j<7;j++)if(!mgIsInt(s[j]))return null;
    if(s[2]<=0||s[3]<=0)return null;
    if(Math.abs(s[4])+Math.abs(s[5])!==1)return null;
    if(s[6]<=0||s[6]>400)return null;
    out.push(s);
  }

}
function mgNormalize(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return null;
  if(typeof d.name!=="string"||!d.name.length||d.name.length>32)return null;
  if(!mgIsInt(d.seed)||d.seed<0||d.seed>2147483647)return null;
  if(!mgIsInt(d.par)||d.par<2||d.par>6)return null;
  if(!Array.isArray(d.tee)||d.tee.length!==2||!mgIsInt(d.tee[0])||!mgIsInt(d.tee[1]))return null;
  if(!Array.isArray(d.hole)||d.hole.length!==2||!mgIsInt(d.hole[0])||!mgIsInt(d.hole[1]))return null;
  var walls=mgRectList(d.walls,4),sands=mgRectList(d.sands,4),waters=mgRectList(d.waters,4),
      slopes=mgSlopeList(d.slopes),posts=mgPostList(d.posts);
  if(walls===null||sands===null||waters===null||slopes===null||posts===null)return null;
  if(d.tee[0]<MG_L||d.tee[0]>MG_R||d.tee[1]<MG_T||d.tee[1]>MG_B)return null;
  if(d.hole[0]<MG_L||d.hole[0]>MG_R||d.hole[1]<MG_T||d.hole[1]>MG_B)return null;
  if(Math.hypot(d.tee[0]-d.hole[0],d.tee[1]-d.hole[1])<80)return null;
  var c={name:d.name,seed:d.seed,par:d.par,tee:d.tee.slice(),hole:d.hole.slice(),
         walls:walls,sands:sands,waters:waters,slopes:slopes,posts:posts};
  if(!mgFree(c,c.tee[0],c.tee[1])||!mgFree(c,c.hole[0],c.hole[1]))return null;
  return c;
}
function mgFree(c,x,y){
  var i;
  if(x<MG_L+MGR||x>MG_R-MGR||y<MG_T+MGR||y>MG_B-MGR)return false;
  for(i=0;i<c.walls.length;i++)if(mgInRect(x,y,c.walls[i],MGR))return false;
  for(i=0;i<c.posts.length;i++)if(Math.hypot(x-c.posts[i][0],y-c.posts[i][1])<c.posts[i][2]+MGR)return false;
  for(i=0;i<c.waters.length;i++)if(mgInRect(x,y,c.waters[i]))return false;
  return true;
}
function mgGrid(c){

  ctx.fillStyle=fg;ctx.fillRect(MG_L,MG_T,MG_R-MG_L,MG_B-MG_T);
  ctx.fillStyle=WHITE;ctx.globalAlpha=.055;
  for(x=MG_L,i=0;x<MG_R;x+=48,i++)if(i%2===0)ctx.fillRect(x,MG_T,24,MG_B-MG_T);
  ctx.globalAlpha=1;
  var vg=ctx.createRadialGradient(MGW/2,(MG_T+MG_B)/2,50,MGW/2,(MG_T+MG_B)/2,250);
  vg.addColorStop(0,colMix(PAL.fair,WHITE,.12));vg.addColorStop(1,colMix(PAL.fair,WHITE,0));
  ctx.fillStyle=vg;ctx.fillRect(MG_L,MG_T,MG_R-MG_L,MG_B-MG_T);
  ctx.restore();
  // —— 沙坑：暖砂渐变 + 暗边「面」+ 沙粒 ——
  for(i=0;i<course.sands.length;i++){
    var s=course.sands[i];
    ctx.save();dropShadow(.16,3);
    var sg=ctx.createLinearGradient(0,s[1],0,s[1]+s[3]);
    sg.addColorStop(0,colMix(PAL.warning,PAL.surface,.6));sg.addColorStop(1,colMix(PAL.warning,PAL.surface,.28));
    ctx.fillStyle=sg;rr(s[0],s[1],s[2],s[3],10);ctx.fill();ctx.restore();
    ctx.fillStyle=colShade(PAL.warning,-.28);ctx.globalAlpha=.5;
    rr(s[0]+2,s[1]+2,s[2]-4,s[3]-4,8);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle=colShade(PAL.warning,-.45);
    var sd=[[.22,.3],[.5,.62],[.74,.35],[.36,.72],[.64,.2]];
    for(var d=0;d<sd.length;d++){ctx.beginPath();ctx.arc(s[0]+s[2]*sd[d][0],s[1]+s[3]*sd[d][1],1.5,0,Math.PI*2);ctx.fill()}
  }
  // —— 水域：蓝色渐变 + 白色波纹 ——
  for(i=0;i<course.waters.length;i++){
    var w=course.waters[i];
    ctx.save();dropShadow(.16,3);
    var wg=ctx.createLinearGradient(0,w[1],0,w[1]+w[3]);
    wg.addColorStop(0,colMix(PAL.water,WHITE,.3));wg.addColorStop(1,colShade(PAL.water,-.2));
    ctx.fillStyle=wg;rr(w[0],w[1],w[2],w[3],10);ctx.fill();ctx.restore();
    ctx.strokeStyle=WHITE;ctx.globalAlpha=.5;ctx.lineWidth=2;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(w[0]+8,w[1]+w[3]*.35);ctx.quadraticCurveTo(w[0]+w[2]*.5,w[1]+w[3]*.2,w[0]+w[2]-8,w[1]+w[3]*.35);ctx.stroke();
    ctx.beginPath();ctx.moveTo(w[0]+8,w[1]+w[3]*.7);ctx.quadraticCurveTo(w[0]+w[2]*.5,w[1]+w[3]*.55,w[0]+w[2]-8,w[1]+w[3]*.7);ctx.stroke();
    ctx.globalAlpha=1;
  }
  // —— 斜坡：品牌软绿「面」+ 实心方向箭 ——
  for(i=0;i<course.slopes.length;i++){
    var sl=course.slopes[i];
    var sgd=ctx.createLinearGradient(sl[0],sl[1],sl[0],sl[1]+sl[3]);
    sgd.addColorStop(0,colMix(PAL.primarySoft,WHITE,.5));sgd.addColorStop(1,PAL.primarySoft);
    ctx.fillStyle=sgd;rr(sl[0],sl[1],sl[2],sl[3],10);ctx.fill();
    ctx.fillStyle=PAL.primaryDeep;ctx.globalAlpha=.85;
    var cx=sl[0]+sl[2]/2,cy=sl[1]+sl[3]/2,ux=sl[4],uy=sl[5];
    for(var k=-1;k<=1;k++){
      var bx=cx+ux*k*22,by=cy+uy*k*22;
      ctx.beginPath();
      ctx.moveTo(bx-uy*9-ux*7,by+ux*9-uy*7);ctx.lineTo(bx+ux*7,by+uy*7);ctx.lineTo(bx+uy*9-ux*7,by-ux*9-uy*7);
      ctx.closePath();ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // —— 墙：实木「面」（亮顶 / 本体 / 暗底） ——
  for(i=0;i<course.walls.length;i++){
    var wl=course.walls[i];
    ctx.save();dropShadow(.26,4);
    var lg=ctx.createLinearGradient(0,wl[1],0,wl[1]+wl[3]);
    lg.addColorStop(0,PAL.railHi);lg.addColorStop(.4,PAL.rail);lg.addColorStop(1,colShade(PAL.rail,-.32));
    ctx.fillStyle=lg;rr(wl[0],wl[1],wl[2],wl[3],7);ctx.fill();ctx.restore();
    ctx.fillStyle=WHITE;ctx.globalAlpha=.35;rr(wl[0]+2,wl[1]+1.5,wl[2]-4,2.5,1.2);ctx.fill();ctx.globalAlpha=1;
  }
  // —— 桩：球状立体（径向渐变 + 恒白高光） ——
  for(i=0;i<course.posts.length;i++){
    var p=course.posts[i];
    ctx.save();dropShadow(.3,4);
    var pg=ctx.createRadialGradient(p[0]-p[2]*.35,p[1]-p[2]*.4,p[2]*.15,p[0],p[1],p[2]*1.05);
    pg.addColorStop(0,colMix(PAL.rail,WHITE,.55));pg.addColorStop(.6,PAL.rail);pg.addColorStop(1,colShade(PAL.rail,-.4));
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p[0],p[1],p[2],0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.fillStyle=WHITE;ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(p[0]-p[2]*.32,p[1]-p[2]*.36,p[2]*.22,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  }
}
function drawHole(){
  var hx=course.hole[0],hy=course.hole[1];
  // 目标底环：把洞口从球道上分离出来
  ctx.fillStyle=colMix(PAL.pocket,PAL.fair,.5);
  ctx.beginPath();ctx.arc(hx,hy,MG_HOLE_R+4.5,0,Math.PI*2);ctx.fill();
  // 洞口：径向渐深，做出井口纵深
  var hg=ctx.createRadialGradient(hx,hy,1,hx,hy,MG_HOLE_R);
  hg.addColorStop(0,BLACK);hg.addColorStop(.65,PAL.pocket);hg.addColorStop(1,colShade(PAL.pocket,-.35));
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(hx,hy,MG_HOLE_R,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=colMix(PAL.pocket,WHITE,.28);ctx.lineWidth=1.6;
  ctx.beginPath();ctx.arc(hx,hy,MG_HOLE_R-.8,Math.PI*1.05,Math.PI*1.75);ctx.stroke();
  // 旗杆 + 实心旗面
  ctx.fillStyle=PAL.rail;rr(hx-1.5,hy-32,3,32,1.5);ctx.fill();
  var flg=ctx.createLinearGradient(hx,hy-32,hx+20,hy-21);
  flg.addColorStop(0,PAL.danger);flg.addColorStop(1,colShade(PAL.danger,-.25));
  ctx.fillStyle=flg;ctx.beginPath();ctx.moveTo(hx+1.5,hy-32);ctx.lineTo(hx+20,hy-26.5);ctx.lineTo(hx+1.5,hy-21);ctx.closePath();ctx.fill();
}
function drawTee(){
  var tx=course.tee[0],ty=course.tee[1];
  ctx.fillStyle=colMix(PAL.primarySoft,PAL.primaryDeep,.22);ctx.globalAlpha=.95;
  rr(tx-14,ty-14,28,28,9);ctx.fill();
  ctx.strokeStyle=PAL.primaryDeep;ctx.lineWidth=3;ctx.globalAlpha=1;
  rr(tx-14,ty-14,28,28,9);ctx.stroke();
  ctx.fillStyle=PAL.primaryDeep;
  ctx.beginPath();ctx.arc(tx,ty,3.6,0,Math.PI*2);ctx.fill();
}
function drawBall(){
  var bx=ball.x,by=ball.y;
  ctx.save();dropShadow(.38,6);
  var bg=ctx.createRadialGradient(bx-MGR*.36,by-MGR*.42,MGR*.14,bx,by,MGR*1.06);
  bg.addColorStop(0,WHITE);bg.addColorStop(.55,colMix(WHITE,PAL.text,.1));bg.addColorStop(1,colMix(WHITE,PAL.text,.3));
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bx,by,MGR,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.lineWidth=1.2;ctx.strokeStyle=colMix(PAL.text,WHITE,.35);
  ctx.beginPath();ctx.arc(bx,by,MGR-.6,0,Math.PI*2);ctx.stroke();
  // 高尔夫凹点
  ctx.fillStyle=colMix(WHITE,PAL.text,.32);
  var dim=[[.4,-.1],[.1,.42],[-.32,.28],[-.42,-.2],[.05,-.45]];
  for(var i=0;i<dim.length;i++){ctx.beginPath();ctx.arc(bx+dim[i][0]*MGR,by+dim[i][1]*MGR,1.3,0,Math.PI*2);ctx.fill()}
  // 恒白高光
  ctx.fillStyle=WHITE;ctx.globalAlpha=.95;
  ctx.beginPath();ctx.ellipse(bx-MGR*.34,by-MGR*.44,MGR*.26,MGR*.15,-.55,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}
function drawTrail(){
  if(trail.length<2)return;
  for(var i=0;i<trail.length;i++){
    var t=trail[i],k=i/trail.length;
    ctx.fillStyle=WHITE;ctx.globalAlpha=.14+.36*k;
    ctx.beginPath();ctx.arc(t.x,t.y,2.2+1.6*k,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawAim(){
  if(!aim)return;
  var dx=aim.sx-aim.cx,dy=aim.sy-aim.cy,d=Math.hypot(dx,dy);
  if(d<8)return;
  var power=Math.min(1,d/220),ux=dx/d,uy=dy/d,len=60+120*power;
  var ex=ball.x+ux*len,ey=ball.y+uy*len;
  ctx.save();
  // 击球方向：等距圆点轨迹（实心点，不用虚线）
  ctx.fillStyle=WHITE;
  var steps=Math.max(3,Math.floor(len/16));
  for(var i=1;i<=steps;i++){
    var t=i/steps;ctx.globalAlpha=.16+.5*t;
    ctx.beginPath();ctx.arc(ball.x+ux*len*t,ball.y+uy*len*t,2.6,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // 实心箭头
  ctx.fillStyle=PAL.text;ctx.globalAlpha=.9;
  ctx.beginPath();
  ctx.moveTo(ex+ux*11,ey+uy*11);
  ctx.lineTo(ex-uy*6-ux*2,ey+ux*6-uy*2);
  ctx.lineTo(ex+uy*6-ux*2,ey-ux*6-uy*2);
  ctx.closePath();ctx.fill();ctx.globalAlpha=1;
  // 拉杆（球后方向）
  ctx.strokeStyle=PAL.rail;ctx.lineWidth=6;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(ball.x-ux*(MGR+4),ball.y-uy*(MGR+4));ctx.lineTo(ball.x-ux*(MGR+26+40*power),ball.y-uy*(MGR+26+40*power));ctx.stroke();
  // 力度环
  ctx.strokeStyle=power<.55?PAL.primary:(power<.85?PAL.warning:PAL.danger);
  ctx.globalAlpha=.9;ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(ball.x,ball.y,MGR+9,-Math.PI/2,-Math.PI/2+power*Math.PI*2);ctx.stroke();
  ctx.globalAlpha=1;
  // 力度条（底边外「面」：底板 + 渐变填充 + 读数，不压球道）
  var bw=176,bx=64,by=MGH-15;
  ctx.fillStyle=PAL.surface;rr(bx,by,bw,9,4.5);ctx.fill();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.border;rr(bx+.5,by+.5,bw-1,8,4);ctx.stroke();
  var fc=power<.55?PAL.primary:(power<.85?PAL.warning:PAL.danger);
  if(bw*power>6){
    var pg=ctx.createLinearGradient(bx,by,bx,by+9);
    pg.addColorStop(0,colMix(fc,WHITE,.35));pg.addColorStop(1,fc);
    ctx.fillStyle=pg;rr(bx+2,by+2,(bw-4)*power,5,2.5);ctx.fill();
  }
  ctx.fillStyle=PAL.text;ctx.font="600 12px system-ui,sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText("力度 "+Math.round(power*100)+"%",bx+bw+8,by+5);
  ctx.restore();
}
function drawFx(){
  var i;
  for(i=0;i<ripples.length;i++){
    var r=ripples[i],k=1-r.life/.6;
    ctx.strokeStyle=PAL.water;ctx.globalAlpha=Math.max(0,r.life/.6);ctx.lineWidth=3;ctx.lineCap="round";
    ctx.beginPath();ctx.arc(r.x,r.y,8+k*26,0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<floats.length;i++){
    var f=floats[i];
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life));
    ctx.fillStyle=f.color;ctx.font="700 18px system-ui,sans-serif";
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
function draw(){
  if(!course)return;
  ctx.clearRect(0,0,MGW,MGH);
  drawCourse();drawTee();drawHole();drawTrail();drawBall();drawAim();drawFx();
}
/* ---------- 主循环 ---------- */
var lastT=0,acc=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  var dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(phase==="rolling"){
    var sp=window.__mgFast?3:1;
    acc=Math.min(acc+dt*sp,.25);
    while(acc>=MG_PHYS){
      mgStep(course,ball,MG_PHYS);acc-=MG_PHYS;
      var t=performance.now();
      if(t-lastTrail>40){trail.push({x:ball.x,y:ball.y});if(trail.length>14)trail.shift();lastTrail=t}
      afterStep();
      if(phase!=="rolling")break;
    }
  }
  updFx(dt);syncHud();draw();
}
/* ---------- 画布尺寸 ---------- */
var SC=1;
function resize(){
  var r=cv.getBoundingClientRect();
  if(r.width<10)return;
  var dpr=Math.max(1,Math.min(2.5,window.devicePixelRatio||1));
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  SC=r.width/MGW;
  ctx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",resize);
/* ---------- 测试钩子（不影响玩法） ---------- */
window.__mgEngine={
  normalize:mgNormalize,reachable:mgReachable,path:mgPath,simulate:mgSimulate,autoSolve:mgAutoSolve,maxStrokes:mgMaxStrokes,
  consts:{MGW:MGW,MGH:MGH,MG_PHYS:MG_PHYS,MG_BOUND:[MG_L,MG_T,MG_R,MG_B]},
  state:function(){return{phase:phase,strokes:strokes,level:cur,ball:{x:ball.x,y:ball.y,vx:ball.vx,vy:ball.vy}}},
  start:startLevel
};
/* ---------- 启动 ---------- */
resize();
startLevel(Math.min(saveData.lv,LEVELS.length-1));
requestAnimationFrame(loop);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  /* 工具钮图标注入（内联 SVG，零外链；与文字基线对齐） */
  function $(id){return document.getElementById(id)}
  $("btnRetry").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
  $("btnLevels").insertAdjacentHTML("afterbegin",window.SW_ICON("grid"));
})();
</script>
