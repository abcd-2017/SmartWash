<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 常量与工具 ---------- */
var MW=480,MH=640;
var THR=64,ROT=2.6,BURN=10;
var SAFE_VY=46,SAFE_VX=30,SAFE_A=0.5;
var K_LV="g_moonlander_level",K_BEST="g_moonlander_best";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function lsNum(k,d){var v=parseInt(lsGet(k),10);return isFinite(v)?v:d}
/* ---------- 账号存档（本地两键镜像，账号更优才覆盖） ---------- */
function accountSave(){
  if(!GB.available)return;
  GB.saveState("moon-lander",{
    "g_moonlander_level":lsNum(K_LV,1),
    "g_moonlander_best":lsNum(K_BEST,0)
  }).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("moon-lander").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var ru=parseInt(r["g_moonlander_level"],10),rb=parseInt(r["g_moonlander_best"],10);
      if(isFinite(ru)&&ru>lsNum(K_LV,1)){lsSet(K_LV,String(ru));changed=true}
      if(isFinite(rb)&&rb>lsNum(K_BEST,0)){lsSet(K_BEST,String(rb));changed=true}
      if(changed){
        S.unlocked=Math.max(1,lsNum(K_LV,1));
        S.best=lsNum(K_BEST,0);
        accountSave();
        genLevel(S.unlocked);S.level=S.unlocked;
        showMenu();syncHud();
      }
    }catch(e){}
  }).catch(function(){});
}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function mulberry(seed){seed=seed|0;return function(){seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- 调色板:CSS变量 → canvas ---------- */

function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL.bg=v("--g-bg");PAL.surface=v("--g-surface");PAL.surface2=v("--g-surface2");
  PAL.primary=v("--g-primary");PAL.primaryDeep=v("--g-primary-deep");PAL.primarySoft=v("--g-primary-soft");
  PAL.onPrimary=v("--g-on-primary");PAL.text=v("--g-text");PAL.muted=v("--g-muted");PAL.faint=v("--g-faint");
  PAL.border=v("--g-border");PAL.danger=v("--g-danger");PAL.success=v("--g-success");PAL.warning=v("--g-warning");
  PAL.sky1=v("--g-sky1");PAL.sky2=v("--g-sky2");PAL.water=v("--g-water");PAL.moon=v("--g-moon");PAL.moon2=v("--g-moon2");
  PAL.moonHi=v("--g-moon-hi");PAL.crater=v("--g-moon-crater");PAL.ship1=v("--g-moon-ship1");PAL.ship2=v("--g-moon-ship2");
  skyGrad=null;
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}

/* ---------- 关卡生成 ---------- */
function levelCfg(L){
  return{
    grav:26+Math.min(2*(L-1),20),
    windAmp:Math.min(2+1.5*(L-1),16),
    padW:Math.max(160-9*(L-1),66),
    fuel:Math.max(70,100-2*(L-1)),
    drift:Math.min(8+3*L,38)

}
function genLevel(L){
  var c=levelCfg(L),rnd=mulberry(L*7919+1013);
  S.grav=c.grav;S.windAmp=c.windAmp;S.padW=c.padW;S.fuelMax=c.fuel;S.fuel=c.fuel;
  S.padX=90+rnd()*(MW-180);S.padY=566;
  S.windPh=rnd()*6.28;
  //地形:起伏丘陵 + 平台区压平到 padY+10
  var pts=[],inner=S.padW/2,widen=inner+30,i,x,raw;
  for(x=0;x<=MW;x+=12){
    raw=576-(18*Math.sin(x*.013+L*1.7)+12*Math.sin(x*.031+L*.6)+6*Math.sin(x*.057+L*2.9));
    raw=Math.min(604,Math.max(540,raw));
    var dx=Math.abs(x-S.padX),y=raw;
    if(dx<=inner)y=S.padY+10;
    else if(dx<=widen){var q=(widen-dx)/(widen-inner);y=(S.padY+10)+(raw-(S.padY+10))*(1-q)}
    pts.push({x:x,y:y});
  }
  S.pts=pts;
  S.stars=[];
  for(i=0;i<70;i++)S.stars.push({x:rnd()*MW,y:rnd()*400,s:rnd()});
  S.craters=[];
  for(i=0;i<8;i++){
    var cx=20+rnd()*(MW-40);
    S.craters.push({x:cx,y:terrainYAt(cx)+6,r:4+rnd()*8});
  }
  S.ship={x:40+rnd()*(MW-80),y:70,vx:(rnd()-.5)*c.drift,vy:12,a:(rnd()-.5)*.2,va:0};
  S.t=0;S.windNow=0;S.trail=[];S.parts=[];S.everFly=false;S.resultOk=true;
}
function terrainYAt(x){
  var pts=S.pts;
  if(!pts.length)return 576;
  var i=clamp(x/12,0,pts.length-1),i0=Math.floor(i),i1=Math.min(pts.length-1,i0+1),f=i-i0;
  return pts[i0].y*(1-f)+pts[i1].y*f;
}

/* ---------- 粒子 ---------- */
function spawnPart(x,y,vx,vy,life,color,r){S.parts.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,color:color,r:r})}
function updParts(dt){
  for(var i=S.parts.length-1;i>=0;i--){
    var p=S.parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt;
    if(p.life<=0)S.parts.splice(i,1);
  }
}
function explode(x,y){
  var cols=[PAL.danger,PAL.warning,PAL.text];
  for(var i=0;i<30;i++){
    var a=Math.random()*6.28,sp=40+Math.random()*150;
    spawnPart(x,y,Math.cos(a)*sp,Math.sin(a)*sp-40,.5+Math.random()*.6,cols[i%3],2+Math.random()*2.5);
  }
}
function dust(x,y){
  for(var i=0;i<12;i++){
    var dir=i%2?1:-1;
    spawnPart(x+dir*10,y,dir*(20+Math.random()*50),-Math.random()*30,.5+Math.random()*.4,PAL.moon2,1.5+Math.random()*2);
  }
}

/* ---------- 物理 ---------- */
var ctl={fire:false,rot:0};
function physStep(dt){
  var sh=S.ship;
  S.t+=dt;
  S.windNow=S.windAmp*(Math.sin(S.t*.9+S.windPh)*.65+Math.sin(S.t*2.3+S.windPh*1.9)*.35);
  var tgt=ctl.rot*ROT;
  sh.va+=(tgt-sh.va)*Math.min(1,dt*9);
  sh.a=clamp(sh.a+sh.va*dt,-1.05,1.05);
  var thrusting=ctl.fire&&S.fuel>0;
  if(thrusting){
    sh.vx+=-Math.sin(sh.a)*THR*dt;
    sh.vy+=-Math.cos(sh.a)*THR*dt;
    S.fuel=Math.max(0,S.fuel-BURN*dt);
    if(Math.random()<.75){
      spawnPart(sh.x-Math.sin(sh.a)*16+(Math.random()-.5)*5,sh.y+Math.cos(sh.a)*18,
        sh.vx*.3-Math.sin(sh.a)*55+(Math.random()-.5)*30,sh.vy*.3+40+Math.random()*40,
        .35+Math.random()*.35,PAL.warning,1.6+Math.random()*1.6);
    }
  }
  sh.vx+=S.windNow*dt;
  sh.vy+=S.grav*dt;
  sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;
  S.trail.push({x:sh.x,y:sh.y});
  if(S.trail.length>60)S.trail.shift();
  //边界
  if(sh.x<10){crash("飞出空域：侧向漂移出左边界");return}
  if(sh.x>MW-10){crash("飞出空域：侧向漂移出右边界");return}
  if(sh.y<-80){crash("飞出空域：向上脱离了下降走廊");return}
  //接触判定
  var feetY=sh.y+16,gy=terrainYAt(sh.x),onPad=Math.abs(sh.x-S.padX)<=S.padW/2-2;
  if(onPad&&feetY>=S.padY){
    var vy=sh.vy,vxs=Math.abs(sh.vx),aa=Math.abs(sh.a);
    if(vy<=SAFE_VY&&vxs<=SAFE_VX&&aa<=SAFE_A)touchdown(vy,vxs,aa);
    else if(vy>SAFE_VY)crash("触地垂直速度 "+vy.toFixed(0)+" 过大（上限 46）");
    else if(vxs>SAFE_VX)crash("触地水平速度 "+vxs.toFixed(0)+" 过大（上限 30）");
    else crash("触地倾角 "+Math.round(aa*57.3)+"° 过大（上限 28°）");
  }else if(!onPad&&feetY>=gy-1){
    crash("偏离着陆平台，砸在了月面上");
  }
}
function touchdown(vy,vxs,aa){
  S.resultOk=true;S.phase="over";
  dust(S.ship.x,S.padY);
  var sc=400+Math.round(S.fuel*4+Math.max(0,SAFE_VY-vy)*8+Math.max(0,SAFE_VX-vxs)*3+(S.level-1)*60);
  var newUn=false;
  if(S.level+1>S.unlocked){S.unlocked=S.level+1;lsSet(K_LV,S.unlocked);newUn=true}
  if(sc>S.best){S.best=sc;lsSet(K_BEST,S.best)}
  accountSave();
  // 成绩上报（最高分 desc：越大越好）
  if(GB.available)GB.reportScore("moon-lander",{metricValue:S.best}).catch(function(){});
  syncHud();
  showOv({kicker:"TOUCHDOWN",title:"着陆成功 · 第 "+S.level+" 站",win:true,
    text:newUn?"解锁第 "+(S.level+1)+" 站：平台更窄、横风更急，重力也在爬升。":"动作干净利落，试试更高分的软着陆。",
    stats:[["触地垂直",vy.toFixed(1)],["触地水平",vxs.toFixed(1)],["倾角",Math.round(aa*57.3)+"°"],["剩余燃料",S.fuel.toFixed(0)],["得分",sc],["历史最佳",S.best]],
    btns:[["下一站","primary",function(){startLevel(S.level+1)},"arrow-right"],["重飞本站","ghost",function(){startLevel(S.level)},"rotate"],["选站","ghost",function(){showMenu()},"grid"]]});
}
function crash(reason){
  S.resultOk=false;S.phase="over";
  explode(S.ship.x,Math.min(S.ship.y,MH-30));
  syncHud();
  showOv({kicker:"CRASH",title:"着陆失败",win:false,
    text:reason+"。参考阈值：垂直 ≤46 · 水平 ≤30 · 倾角 ≤28°。",
    btns:[["重试本站","primary",function(){startLevel(S.level)},"rotate"],["选站","ghost",function(){showMenu()},"grid"]]});
}

/* ---------- 模式流程 ---------- */
function startLevel(L){
  S.level=clamp(L,1,999);
  genLevel(S.level);
  S.paused=false;S.phase="running";
  ctl.fire=false;ctl.rot=0;
  hideOv();syncHud();
}
function showMenu(){
  S.paused=false;
  S.selLevel=clamp(S.selLevel,1,S.unlocked);
  var c=levelCfg(S.selLevel);
  showOv({kicker:"MOON DESCENT",title:"月面轻降",win:false,
    text:"按住屏幕或「点火」喷射减速，‹ › 修正姿态；垂直 ≤46、水平 ≤30、倾角 ≤28° 落在平台内。",
    mid:'step',
    stats:[["最高解锁",S.unlocked+" 站"],["历史最佳",S.best]],
    btns:[["开始下降 · 第 "+S.selLevel+" 站","primary",function(){startLevel(S.selLevel)},"play"]]});
  renderStepper(c);
}
function renderStepper(c){
  ovMid.innerHTML='<div class="step"><button class="btn ghost sq" id="stPrev" aria-label="上一站">'+window.SW_ICON("arrow-left")+'</button><div class="sel" id="stSel">第 '+S.selLevel+' 站</div><button class="btn ghost sq" id="stNext" aria-label="下一站">'+window.SW_ICON("arrow-right")+'</button></div><p class="cfg" id="stCfg">平台宽 '+c.padW+' · 重力 '+c.grav+' · 横风 '+c.windAmp+'</p>';
  $("stPrev").addEventListener("click",function(){if(S.selLevel>1){S.selLevel--;refreshMenu()}});
  $("stNext").addEventListener("click",function(){if(S.selLevel<S.unlocked){S.selLevel++;refreshMenu()}});
}
function refreshMenu(){
  var c=levelCfg(S.selLevel);
  $("stSel").textContent="第 "+S.selLevel+" 站";
  $("stCfg").textContent="平台宽 "+c.padW+" · 重力 "+c.grav+" · 横风 "+c.windAmp;
  ovB.innerHTML="";
  [["开始下降 · 第 "+S.selLevel+" 站","primary",function(){startLevel(S.selLevel)},"play"]].forEach(function(b){
    var el=document.createElement("button");
    el.className="btn "+b[1];el.innerHTML=window.SW_ICON(b[3])+b[0];
    el.addEventListener("click",b[2]);ovB.appendChild(el);
  });
}
function showOv(o){
  ovK.textContent=o.kicker||"";
  ovT.textContent=o.title||"";
  ovX.textContent=o.text||"";
  ovCard.classList.toggle("win",!!o.win);   // 过关轻弹（渲染反馈）
  ovMid.innerHTML="";
  var st=o.stats||[];
  ovS.style.display=st.length?"grid":"none";
  ovS.innerHTML=st.map(function(s){return '<div class="st"><b>'+s[1]+"</b><span>"+s[0]+"</span></div>"}).join("");
  ovB.innerHTML="";
  (o.btns||[]).forEach(function(b){
    var el=document.createElement("button");
    el.className="btn"+(b[1]?" "+b[1]:"");
    el.innerHTML=(b[3]?window.SW_ICON(b[3]):"")+b[0];   // 图标 + 文案，避免 textContent 抹掉图标
    el.addEventListener("click",b[2]);
    ovB.appendChild(el);
  });
  ov.classList.add("show");
}
function hideOv(){ov.classList.remove("show")}
function pauseGame(){
  if(S.phase!=="running"||S.paused)return;
  S.paused=true;
  showOv({kicker:"PAUSED",title:"已暂停",text:"切出页面会自动暂停，回来点继续即可。",win:false,
    btns:[["继续","primary",function(){S.paused=false;hideOv()},"play"],["选站","ghost",function(){showMenu()},"grid"]]});
}

/* ---------- 输入 ---------- */
var touchFire=false,heldL=false,heldR=false,keys={};
function bindPad(el,down,up){
  el.addEventListener("pointerdown",function(e){e.preventDefault();down();try{el.setPointerCapture(e.pointerId)}catch(err){}});
  var end=function(e){e.preventDefault();up()};
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
}
bindPad($("padL"),function(){heldL=true},function(){heldL=false});
bindPad($("padR"),function(){heldR=true},function(){heldR=false});
bindPad($("padF"),function(){touchFire=true},function(){touchFire=false});
cv.addEventListener("pointerdown",function(e){
  if(S.phase==="running"&&!S.paused){touchFire=true}
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
});
cv.addEventListener("pointerup",function(){touchFire=false});
cv.addEventListener("pointercancel",function(){touchFire=false});
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("keydown",function(e){
  keys[e.code]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(e.code)>=0)e.preventDefault();
});
document.addEventListener("keyup",function(e){keys[e.code]=false});
window.addEventListener("blur",function(){keys={};touchFire=false;heldL=false;heldR=false});
$("btnPause").addEventListener("click",pauseGame);
$("btnMenu").addEventListener("click",function(){
  if(S.phase==="running"&&!S.paused){pauseGame()}else{showMenu()}
});
function readCtl(){
  var kr=(keys.ArrowRight||keys.KeyD)?1:0,kl=(keys.ArrowLeft||keys.KeyA)?1:0;
  ctl.rot=(heldR?1:0)-(heldL?1:0)||kr-kl;
  ctl.fire=touchFire||!!(keys.Space||keys.ArrowUp||keys.KeyW);
}

/* ---------- 绘制 ---------- */
var SC=1;
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.max(1,Math.min(2.5,window.devicePixelRatio||1));
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  SC=r.width/MW;
  ctx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
}
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawScene(){
  if(!skyGrad){
    skyGrad=ctx.createLinearGradient(0,0,0,MH);
    skyGrad.addColorStop(0,PAL.sky1);skyGrad.addColorStop(1,PAL.sky2);
  }
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,MW,MH);
  //星空
  ctx.fillStyle=PAL.faint;
  for(var i=0;i<S.stars.length;i++){
    var st=S.stars[i];
    ctx.globalAlpha=.25+.55*st.s;
    ctx.fillRect(st.x,st.y,st.s>.75?2:1.4,st.s>.75?2:1.4);
  }
  ctx.globalAlpha=1;
  //远处的地球（径向渐变 + 恒白高光 + 柔光）
  var eg=ctx.createRadialGradient(424,57,1,428,62,15);
  eg.addColorStop(0,colMix(PAL.water,WHITE,0.55));
  eg.addColorStop(0.55,PAL.water);
  eg.addColorStop(1,colShade(PAL.water,-0.35));
  ctx.save();
  ctx.shadowColor=PAL.water;ctx.shadowBlur=18;
  ctx.fillStyle=eg;
  ctx.beginPath();ctx.arc(428,62,13,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle="rgba(255,255,255,.55)";
  ctx.beginPath();ctx.arc(424,57,4.5,0,Math.PI*2);ctx.fill();
  //月面（竖向渐变「面」+ 顶部亮缘 + 底部压暗）
  var mg=ctx.createLinearGradient(0,470,0,MH);
  mg.addColorStop(0,PAL.moon);mg.addColorStop(1,PAL.moon2);
  ctx.fillStyle=mg;
  ctx.beginPath();ctx.moveTo(0,MH);
  for(var j=0;j<S.pts.length;j++)ctx.lineTo(S.pts[j].x,S.pts[j].y);
  ctx.lineTo(MW,MH);ctx.closePath();ctx.fill();
  //地面顶缘亮线（边线）
  ctx.strokeStyle=PAL.moonHi;ctx.lineWidth=2;ctx.lineJoin="round";
  ctx.beginPath();ctx.moveTo(S.pts[0].x,S.pts[0].y);
  for(j=1;j<S.pts.length;j++)ctx.lineTo(S.pts[j].x,S.pts[j].y);
  ctx.stroke();
  //陨坑（凹槽：暗底 + 亮缘）
  for(j=0;j<S.craters.length;j++){
    var cr=S.craters[j];
    ctx.fillStyle=PAL.crater;
    ctx.beginPath();ctx.ellipse(cr.x,cr.y,cr.r,cr.r*.4,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=colMix(PAL.crater,WHITE,0.28);ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(cr.x,cr.y-cr.r*.12,cr.r*.82,cr.r*.3,0,Math.PI,Math.PI*2);ctx.stroke();
  }
  //着陆目标：平台外围虚线目标环（可落点 / 目标）
  var blink=.4+.6*Math.abs(Math.sin(S.t*4));
  ctx.globalAlpha=S.phase==="menu"?.55:blink;
  ctx.strokeStyle=PAL.warning;ctx.lineWidth=1.6;
  ctx.setLineDash([5,4]);
  rrect(S.padX-S.padW/2-9,S.padY-9,S.padW+18,20,6);ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha=1;
  //着陆平台（渐变「面」+ 顶缘高光 + 落地投影）
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=8;ctx.shadowOffsetY=3;
  var pg=ctx.createLinearGradient(0,S.padY,0,S.padY+10);
  pg.addColorStop(0,PAL.primary);pg.addColorStop(1,PAL.primaryDeep);
  ctx.fillStyle=pg;rrect(S.padX-S.padW/2,S.padY,S.padW,10,3);ctx.fill();
  ctx.restore();
  ctx.strokeStyle=colMix(PAL.primary,WHITE,0.42);ctx.lineWidth=1.2;
  rrect(S.padX-S.padW/2+.6,S.padY+.6,S.padW-1.2,8.8,2.6);ctx.stroke();
  ctx.fillStyle=PAL.onPrimary;
  ctx.font="800 10px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("PAD",S.padX,S.padY+5.5);
  ctx.globalAlpha=S.phase==="menu"?.8:blink;
  ctx.fillStyle=PAL.warning;
  ctx.beginPath();ctx.arc(S.padX-S.padW/2+7,S.padY-4,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(S.padX+S.padW/2-7,S.padY-4,3,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}
function drawTrail(){
  ctx.fillStyle=PAL.faint;
  for(var i=0;i<S.trail.length;i++){
    ctx.globalAlpha=.05+.3*(i/S.trail.length);
    ctx.beginPath();ctx.arc(S.trail[i].x,S.trail[i].y,1.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawParts(){
  for(var i=0;i<S.parts.length;i++){
    var p=S.parts[i];
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawShip(){
  if(S.phase==="over"&&!S.resultOk)return;
  var sh=S.ship,thrusting=ctl.fire&&S.fuel>0&&S.phase==="running"&&!S.paused;
  // 悬浮投影（不随船体旋转）
  ctx.fillStyle="rgba(0,0,0,0.22)";
  ctx.beginPath();ctx.ellipse(sh.x,sh.y+20,13,4,0,0,Math.PI*2);ctx.fill();
  ctx.save();
  ctx.translate(sh.x,sh.y);ctx.rotate(sh.a);
  ctx.strokeStyle=PAL.muted;ctx.lineWidth=2.5;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-8,7);ctx.lineTo(-14,16);ctx.moveTo(8,7);ctx.lineTo(14,16);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-17,16);ctx.lineTo(-11,16);ctx.moveTo(11,16);ctx.lineTo(17,16);ctx.stroke();
  if(thrusting){
    var len=12+Math.random()*10;
    var fg=ctx.createLinearGradient(0,15,0,15+len);
    fg.addColorStop(0,PAL.warning);fg.addColorStop(1,colShade(PAL.warning,-0.4));
    ctx.fillStyle=fg;
    ctx.beginPath();ctx.moveTo(-4.5,15);ctx.lineTo(4.5,15);ctx.lineTo(0,15+len);ctx.closePath();ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.85)";
    ctx.beginPath();ctx.moveTo(-2,15);ctx.lineTo(2,15);ctx.lineTo(0,15+len*.55);ctx.closePath();ctx.fill();
  }
  // 船体（渐变「面」+ 落地投影）
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.32)";ctx.shadowBlur=10;ctx.shadowOffsetY=5;
  var bg=ctx.createLinearGradient(0,-14,0,12);
  bg.addColorStop(0,PAL.ship1);bg.addColorStop(1,PAL.ship2);
  ctx.fillStyle=bg;rrect(-13,-14,26,26,7);ctx.fill();
  ctx.restore();
  ctx.strokeStyle=PAL.primaryDeep;ctx.lineWidth=2;
  rrect(-13,-14,26,26,7);ctx.stroke();
  // 顶部高光（恒白）
  ctx.fillStyle="rgba(255,255,255,.5)";
  ctx.beginPath();ctx.ellipse(0,-9,8,3.2,0,0,Math.PI*2);ctx.fill();
  // 座舱（径向渐变）
  var cg=ctx.createRadialGradient(-1.5,-5.5,1,0,-3,6);
  cg.addColorStop(0,colMix(PAL.primarySoft,WHITE,0.55));
  cg.addColorStop(1,PAL.primaryDeep);
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.arc(0,-3,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=PAL.primaryDeep;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(0,-3,5,0,Math.PI*2);ctx.stroke();
  // 底部喷口
  ctx.fillStyle=PAL.muted;
  ctx.fillRect(-5,11,10,4);
  ctx.fillStyle="rgba(255,255,255,.35)";
  ctx.fillRect(-5,11,10,1.2);
  ctx.restore();
}
function drawHud(){
  if(S.phase==="menu")return;
  var sh=S.ship;
  //燃料条
  var pct=S.fuelMax>0?S.fuel/S.fuelMax:0;
  ctx.fillStyle=PAL.surface2;
  rrect(60,11,250,10,5);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rrect(60,11,250,10,5);ctx.stroke();
  var fc=pct>.35?PAL.primary:(pct>.15?PAL.warning:PAL.danger);
  if(pct>0){
    var fgr=ctx.createLinearGradient(0,12,0,20);
    fgr.addColorStop(0,colShade(fc,0.25));fgr.addColorStop(1,colShade(fc,-0.2));
    ctx.fillStyle=fgr;rrect(61,12,248*pct,8,4);ctx.fill();
  }
  ctx.fillStyle=PAL.text;ctx.font="700 12px system-ui,sans-serif";
  ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText("燃料",14,16.5);
  //横风
  var wAbs=Math.abs(S.windNow);
  ctx.textAlign="right";
  ctx.fillStyle=wAbs>8?PAL.warning:PAL.muted;
  ctx.fillText("横风 "+wAbs.toFixed(0),466,16.5);
  ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=2;
  var dir=S.windNow>=0?1:-1,wx=430;
  ctx.beginPath();ctx.moveTo(wx-dir*11,27);ctx.lineTo(wx+dir*11,27);
  ctx.moveTo(wx+dir*11,27);ctx.lineTo(wx+dir*6,23.5);
  ctx.moveTo(wx+dir*11,27);ctx.lineTo(wx+dir*6,30.5);ctx.stroke();
  //遥测
  var feetY=sh.y+16,alt=Math.max(0,Math.round(S.padY-feetY));
  var vy=S.ship.vy,vxs=Math.abs(sh.vx),deg=Math.round(Math.abs(sh.a)*57.3);
  ctx.textAlign="left";
  ctx.font="700 13px system-ui,sans-serif";
  ctx.fillStyle=PAL.text;
  ctx.fillText("高度 "+alt,14,50);
  ctx.fillStyle=vy<=SAFE_VY?PAL.success:(vy<=SAFE_VY+6?PAL.warning:PAL.danger);
  ctx.fillText("垂直 "+vy.toFixed(0),14,69);
  ctx.fillStyle=vxs<=SAFE_VX?PAL.success:PAL.danger;
  ctx.fillText("水平 "+vxs.toFixed(0),14,88);
  ctx.fillStyle=deg<=28?PAL.success:PAL.danger;
  ctx.fillText("倾角 "+deg+"°",14,107);
  //平台方向提示
  if(S.phase==="running"&&Math.abs(sh.x-S.padX)>170){
    ctx.textAlign="center";ctx.fillStyle=PAL.muted;
    ctx.fillText(S.padX>sh.x?"平台在右侧 ›":"‹ 平台在左侧",MW/2,MH-14);
  }
}
function draw(){
  ctx.clearRect(0,0,MW,MH);
  drawScene();
  drawTrail();
  drawParts();
  drawShip();
  drawHud();
}

/* ---------- HUD 同步 ---------- */
var lastLv="",lastBest="";
function syncHud(){
  var lv=String(S.level);
  if(lv!==lastLv){hudLv.textContent=lv;lastLv=lv;popVal(hudLv)}
  var bt=String(S.best);
  if(bt!==lastBest){hudBest.textContent=bt;lastBest=bt;popVal(hudBest)}
}

/* ---------- 主循环 ---------- */
var lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  var dt=Math.min(.05,(now-lastT)/1000);
  lastT=now;
  if(S.phase==="running"&&!S.paused){
    readCtl();
    var h=dt/2;
    physStep(h);
    if(S.phase==="running")physStep(h);
  }else{
    ctl.fire=false;ctl.rot=0;
    if(S.phase==="menu"||S.phase==="over")S.t+=dt*.5;
  }
  updParts(dt);
  syncHud();
  draw();
}

/* ---------- 生命周期 ---------- */
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&S.phase==="running"&&!S.paused)pauseGame();
});
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",resize);

/* 按钮 / 图例图标注入（内联 SVG，零外链；覆盖层按钮走 showOv 的 icon 字段） */
$("padL").insertAdjacentHTML("afterbegin",window.SW_ICON("arrow-left"));
$("padR").insertAdjacentHTML("afterbegin",window.SW_ICON("arrow-right"));
$("padF").insertAdjacentHTML("afterbegin",window.SW_ICON("arrow-up"));
$("btnPause").insertAdjacentHTML("afterbegin",window.SW_ICON("pause"));
$("btnMenu").insertAdjacentHTML("afterbegin",window.SW_ICON("grid"));
var icEls=document.querySelectorAll("[data-ic]"),ii;
for(ii=0;ii<icEls.length;ii++)icEls[ii].innerHTML=window.SW_ICON(icEls[ii].getAttribute("data-ic"));
palLoad();
S.unlocked=Math.max(1,lsNum(K_LV,1));
S.best=lsNum(K_BEST,0);
S.selLevel=S.unlocked;
genLevel(S.unlocked);
S.level=S.unlocked;
showMenu();
syncHud();
resize();
requestAnimationFrame(loop);
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
