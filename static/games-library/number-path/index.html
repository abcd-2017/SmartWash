/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="number-path",SAVE_KEY="sw.numberpath.v1";
var DEFAULT_LEVELS=DEFAULT_LEVELS_SRC;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  levelOk=new Array(LEVELS.length);
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
var levelOk=new Array(LEVELS.length);
function verifyPending(){   // 后台逐关复核（分片避免卡顿）：坏关禁选、当前关即时告警
  var i=0;
  function step(){
    var t0=Date.now();
    while(i<LEVELS.length&&Date.now()-t0<40){
      if(levelOk[i]===undefined)levelOk[i]=verifyLevel(LEVELS[i]);
      i++;
    }
    if(i<LEVELS.length)setTimeout(step,0);
    else if(typeof renderLevels==="function")renderLevels();
  }
  setTimeout(step,0);
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0)),done:(s.done&&typeof s.done==="object")?s.done:{}}}catch(e){return{lv:0,done:{}}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
      if(typeof resize==="function")resize();
    }
  }).catch(function(){});
}

function openLevelSelect(){

      b.className="lvbtn"+(save.done[i]?" done":"");

/* ---------- 结构校验 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.w)||d.w<5||d.w>6)return false;
  if(!Number.isInteger(d.h)||d.h<5||d.h>6)return false;
  var N=d.w*d.h;
  if(!Array.isArray(d.g)||d.g.length!==N)return false;
  var seen={};
  for(var i=0;i<N;i++){
    if(!Number.isInteger(d.g[i])||d.g[i]<0||d.g[i]>N)return false;
    if(d.g[i]>0){if(seen[d.g[i]])return false;seen[d.g[i]]=1;}
  }
  if(!Array.isArray(d.sol)||d.sol.length!==N)return false;
  for(var j=0;j<N;j++){if(!Number.isInteger(d.sol[j])||d.sol[j]<1||d.sol[j]>N)return false;
    if(seen[d.sol[j]]&&d.g[j]!==d.sol[j])return false;}
  return true;
}

}

    if(k>N){count++;return}
    if(pos[k]>=0){
      if(k===1||npAdj(nb,pos[k],prev))bt(k+1,pos[k]);
      return;
    }
    var cands=[];
    for(var q=0;q<nb[prev].length;q++){
      var cc=nb[prev][q];
      if(!fixed[cc]&&!usedBy[cc])cands.push(cc);
    }
    var nxt=(k<N)?pos[k+1]:-1;
    if(nxt>=0)cands.sort(function(a,b){
      var av=npAdj(nb,a,nxt)?1:0,bv=npAdj(nb,b,nxt)?1:0;
      return bv-av;
    });
    for(var u=0;u<cands.length;u++){
      usedBy[cands[u]]=true;
      bt(k+1,cands[u]);
      usedBy[cands[u]]=false;
      if(count>=cap)return;
    }
  }
  if(pos[1]>=0)bt(1,pos[1]);
  else for(var c=0;c<N;c++){
    if(fixed[c])continue;
    usedBy[c]=true;bt(1,c);usedBy[c]=false;
    if(count>=cap)return;
  }
  return count;
}
function verifyLevel(L){
  if(!validLevelData(L))return false;
  return npCount(L.w,L.h,L.g,2)===1;
}
/* ---------- 调色板（canvas 颜色全部经 PAL 读 CSS 变量） ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),onSoft:v("--g-on-soft"),
    ground1:v("--g-np-ground1"),ground2:v("--g-np-ground2"),tile1:v("--g-np-tile1"),tile2:v("--g-np-tile2"),
    anchor1:v("--g-np-anchor1"),anchor2:v("--g-np-anchor2"),edge:v("--g-np-edge"),trail:v("--g-np-trail"),
    end1:v("--g-np-end1"),end2:v("--g-np-end2")};
}
window.__gOnTheme=function(){palLoad()};
/* 颜色工具：PAL 色值混合，JS 内零颜色字面量 */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,grid=[],history=[],sel=-1,done=false;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,dpr=1,w=5,h=5,N=25,cs=48,pad=8;
var enterT=0,padBtns=[];
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* ---------- 关卡 ---------- */
function loadLevel(n2){
  lv=Math.max(0,Math.min(n2,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return}
  w=L.w;h=L.h;N=w*h;
  grid=L.g.slice();history=[];sel=-1;done=false;
  enterT=window.__gRM?0:performance.now();   // 入场错落（reduced-motion 时整体到位）
  $("lvTagText").textContent="第 "+(lv+1)+" 关 · "+L.name;
  var ok=verifyLevel(L);   // 加载复核：唯一解
  if(!ok)say("警告：内嵌验证器判定本关解不唯一（数据异常）");
  else say("点空格再点数字填入；1 与起点相邻，依次递增");
  buildPad();updStats();resize();
}
function filled(){var f=0;for(var i=0;i<N;i++)if(grid[i]>0)f++;return f}
function errsMap(){
  // 返回错误格集合：重复数字 + 已填相邻断裂
  var errs={},i;
  var seen={};
  for(i=0;i<N;i++)if(grid[i]>0){(seen[grid[i]]=seen[grid[i]]||[]).push(i)}
  for(var k in seen)if(seen[k].length>1)for(var q=0;q<seen[k].length;q++)errs[seen[k][q]]=1;
  var nb=npNb(w,h);
  for(i=0;i<N;i++){
    if(grid[i]<=0)continue;
    var nxt=grid[i]+1;
    if(nxt<=N){
      var p2=-1;
      for(var j=0;j<N;j++)if(grid[j]===nxt){p2=j;break}
      if(p2>=0&&!npAdj(nb,i,p2)){errs[i]=1;errs[p2]=1}
    }
  }
  return errs;
}
function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}   // 记分轻弹
function updStats(){
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  var f=filled()+" / "+N,ec=Object.keys(errsMap()).length;
  if($("stFill").textContent!==f){$("stFill").textContent=f;bump($("stFill"))}
  if($("stErr").textContent!==String(ec)){$("stErr").textContent=ec;bump($("stErr"))}
  $("stErr").classList.toggle("low",ec>0);
  $("btnUndo").disabled=!history.length||done;
  updPad();
}
/* ---------- 数字 pad：格砖键（已用置灰 / 与选中格可连的数高亮） ---------- */
function buildPad(){
  var p=$("pad");p.innerHTML="";padBtns=[];
  for(var v=1;v<=N;v++)(function(v){
    var b=document.createElement("button");
    b.className="key";b.type="button";b.textContent=v;b.dataset.v=v;
    b.setAttribute("aria-label","填 "+v);
    b.addEventListener("click",function(){setVal(v)});
    p.appendChild(b);padBtns.push(b);
  })(v);
  var b0=document.createElement("button");
  b0.className="key clear";b0.type="button";
  b0.innerHTML=SW_ICON("backspace")+"<span>擦</span>";
  b0.setAttribute("aria-label","擦除选中格");
  b0.addEventListener("click",function(){setVal(0)});
  p.appendChild(b0);
}
function updPad(){
  if(!padBtns.length)return;
  var used={},i,hint={};
  for(i=0;i<N;i++)if(grid[i]>0)used[grid[i]]=1;
  if(sel>=0&&sel<N&&grid[sel]<=0&&!done){   // 选中空格：高亮能与相邻数连起来的数（该点哪）
    var nb=npNb(w,h)[sel];
    for(i=0;i<nb.length;i++){var gv=grid[nb[i]];if(gv>0){if(gv>1)hint[gv-1]=1;if(gv<N)hint[gv+1]=1}}
  }
  for(i=0;i<padBtns.length;i++){var v=+padBtns[i].dataset.v;
    padBtns[i].classList.toggle("used",!!used[v]);
    padBtns[i].classList.toggle("hint",!!hint[v]&&!used[v])}
}
/* ---------- 交互 ---------- */
function setVal(v){
  if(done||sel<0)return;
  if(L.g[sel]>0){say("起手锚点不能改");return}
  if(grid[sel]===v)return;
  history.push({i:sel,prev:grid[sel]});
  grid[sel]=v;
  updStats();
  if(v>0)say("已填 "+v);
  checkWin();
}
function undo(){
  if(!history.length||done)return;
  var hh=history.pop();
  grid[hh.i]=hh.prev;sel=hh.i;
  updStats();say("撤销一步");
}
function hint(){
  if(done)return;
  for(var i=0;i<N;i++){
    if(grid[i]>0&&grid[i]!==L.sol[i]){
      history.push({i:i,prev:grid[i]});grid[i]=0;sel=i;
      say("提示：这个数字放错了，已擦除");
      updStats();return;
    }
  }
  for(var j=0;j<N;j++){
    if(grid[j]===0){
      history.push({i:j,prev:0});grid[j]=L.sol[j];sel=j;
      say("提示：此格应填 "+L.sol[j]);
      updStats();checkWin();return;
    }
  }
  say("已与内嵌解一致，检查断链");
}
function checkWin(){
  if(done)return;
  if(filled()<N)return;
  if(Object.keys(errsMap()).length)return;
  done=true;
  save.done[lv]=true;
  if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:history.length}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"长径打通！";
  $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成 · 1 到 "+N+" 一笔连通"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  setOvBtn((lv>=LEVELS.length-1)?"回到第 1 关":"下一关",(lv>=LEVELS.length-1)?"rotate":"play");
  $("overlay").classList.add("show");
}
function setOvBtn(text,icon){$("ovBtn").innerHTML=SW_ICON(icon)+"<span>"+text+"</span>"}
/* ---------- 绘制 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  pad=Math.max(6,Math.round(wCss*0.02));
  cs=Math.floor((wCss-pad*2)/w);
  if(cs>72)cs=72;
  if(cs<24)cs=24;
  W=cs*w+pad*2;H=cs*h+pad*2;
  cv.style.width=W+"px";cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
/* 入场：对角错位 40ms/格，reduced-motion 整体到位 */
function tileEnter(i,t){
  if(!enterT)return 1;
  var p=(t-enterT-(i%w+(i/w|0))*40)/260;
  return p>=1?1:(p<=0||window.__gRM?0:1-Math.pow(1-p,2));
}
function CC(i){return[pad+(i%w)*cs+cs/2,pad+((i/w)|0)*cs+cs/2]}
/* 轨迹层：蓝线=已连通，虚线=断链 */
function drawTrail(){
  var pos=[],i;
  for(i=0;i<=N;i++)pos[i]=-1;
  for(i=0;i<N;i++)if(grid[i]>0)pos[grid[i]]=i;
  var nb=npNb(w,h);
  ctx.save();ctx.lineCap="round";ctx.lineJoin="round";
  ctx.setLineDash([Math.max(4,cs*.14),Math.max(3,cs*.11)]);
  ctx.lineWidth=Math.max(2,cs*.09);ctx.strokeStyle=PAL.danger;
  for(i=1;i<N;i++){
    if(pos[i]<0||pos[i+1]<0||npAdj(nb,pos[i],pos[i+1]))continue;
    var a=CC(pos[i]),b=CC(pos[i+1]);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.shadowColor="rgba(0,0,0,0.20)";ctx.shadowBlur=cs*.07;ctx.shadowOffsetY=cs*.02;   // 恒黑阴影
  ctx.lineWidth=Math.max(3,cs*.17);ctx.strokeStyle=PAL.trail;
  for(i=1;i<N;i++){
    if(pos[i]<0||pos[i+1]<0||!npAdj(nb,pos[i],pos[i+1]))continue;
    var c=CC(pos[i]),d=CC(pos[i+1]);
    ctx.beginPath();ctx.moveTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.stroke();
  }
  ctx.restore();
}
function draw(){
  ctx.fillStyle=PAL.ground2;ctx.fillRect(0,0,W,H);
  if(!L)return;
  var errs=errsMap(),t=performance.now(),fs=cs>=52?22:(cs>=40?18:16),i,v,e;
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,PAL.ground1);bg.addColorStop(1,PAL.ground2);
  ctx.fillStyle=bg;rr(1,1,W-2,H-2,12);ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle=PAL.edge;rr(2,2,W-4,H-4,10);ctx.stroke();
  var gx=[],gy=[],gv=[];
  for(i=0;i<N;i++){   // 格砖层：锚点石 / 我填的 / 素砖
    e=tileEnter(i,t);
    if(e<=0){gx.push(-1);gy.push(-1);gv.push(0);continue}
    var x=i%w,y=(i/w)|0,px=pad+x*cs,py=pad+y*cs;
    var gap=Math.max(1.5,cs*.055),s=Math.max(.55,e),w2=cs-2*gap;
    var X=px+cs/2-w2*s/2,Y=py+cs/2-w2*s/2;
    var given=L.g[i]>0,val=grid[i]>0,b1,b2,ed;
    if(given){b1=PAL.anchor1;b2=PAL.anchor2;ed=colShade(PAL.anchor2,-.28)}
    else if(val){b1=colMix(PAL.tile1,PAL.deep,.10);b2=colMix(PAL.tile2,PAL.deep,.14);ed=PAL.deep}
    else{b1=PAL.tile1;b2=PAL.tile2;ed=PAL.border}
    ctx.save();
    ctx.globalAlpha=e;
    ctx.shadowColor="rgba(0,0,0,0.18)";ctx.shadowBlur=cs*.08;ctx.shadowOffsetY=cs*.035;   // 恒黑阴影
    var g=ctx.createLinearGradient(0,Y,0,Y+w2*s);
    g.addColorStop(0,colShade(b1,.22));g.addColorStop(.55,b1);g.addColorStop(1,b2);
    ctx.fillStyle=g;rr(X,Y,w2*s,w2*s,Math.min(10,cs*.2));ctx.fill();
    ctx.restore();
    ctx.globalAlpha=e;ctx.lineWidth=(given||val)?1.5:1;ctx.strokeStyle=errs[i]?PAL.danger:ed;
    if(val&&!given&&!errs[i])ctx.globalAlpha=e*.55;
    rr(X+.5,Y+.5,w2*s-1,w2*s-1,Math.min(10,cs*.2));ctx.stroke();
    ctx.globalAlpha=e;
    if(given){   // 锚点铆点
      ctx.fillStyle=PAL.onSoft;
      ctx.beginPath();ctx.arc(X+w2*s*.2,Y+w2*s*.2,Math.max(1.4,w2*s*.055),0,Math.PI*2);ctx.fill();
    }
    gx.push(px);gy.push(py);gv.push(given);
  }
  drawTrail();
  for(i=0;i<N;i++){   // 数字层：端点金色 chip
    v=grid[i];if(v<=0||gx[i]<0)continue;
    var cx=gx[i]+cs/2,cy=gy[i]+cs/2,isEnd=(v===1||v===N),gd=gv[i];
    ctx.globalAlpha=tileEnter(i,t);   // 数字与格砖同步淡入
    if(isEnd&&!gd){
      var cw=cs*.74;
      ctx.save();
      ctx.shadowColor="rgba(0,0,0,0.22)";ctx.shadowBlur=cs*.08;ctx.shadowOffsetY=cs*.03;   // 恒黑阴影
      var gg=ctx.createLinearGradient(0,cy-cw/2,0,cy+cw/2);
      gg.addColorStop(0,PAL.end1);gg.addColorStop(1,PAL.end2);
      ctx.fillStyle=gg;rr(cx-cw/2,cy-cw/2,cw,cw,Math.min(10,cs*.2));ctx.fill();
      ctx.restore();
      ctx.lineWidth=1.2;ctx.strokeStyle=colShade(PAL.end2,-.25);
      rr(cx-cw/2+.5,cy-cw/2+.5,cw-1,cw-1,Math.min(10,cs*.2));ctx.stroke();
      ctx.fillStyle="rgba(255,255,255,0.35)";   // 恒白高光
      rr(cx-cw*.32,cy-cw*.36,cw*.64,cw*.14,Math.min(4,cs*.06));ctx.fill();
      ctx.fillStyle=PAL.text;
    }else{
      if(isEnd&&gd){   // 锚点端点金环
        ctx.lineWidth=2;ctx.strokeStyle=PAL.end2;
        rr(gx[i]+cs*.14,gy[i]+cs*.14,cs*.72,cs*.72,Math.min(10,cs*.2));ctx.stroke();
      }
      ctx.fillStyle=errs[i]?PAL.danger:(gd?PAL.onSoft:PAL.deep);
    }
    ctx.font="700 "+fs+"px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(String(v),cx,cy+cs*.02);
  }
  ctx.globalAlpha=1;
  if(sel>=0&&sel<N&&!done){   // 选中态：软底 + 深绿双环
    var sx=pad+(sel%w)*cs,sy=pad+((sel/w)|0)*cs,sgap=Math.max(1.5,cs*.055);
    ctx.fillStyle=PAL.soft;ctx.globalAlpha=.55;
    rr(sx+sgap,sy+sgap,cs-2*sgap,cs-2*sgap,Math.min(10,cs*.2));ctx.fill();
    ctx.globalAlpha=1;
    ctx.lineWidth=Math.max(2.5,cs*.09);ctx.strokeStyle="rgba(255,255,255,0.92)";   // 恒白衬底
    rr(sx+cs*.06,sy+cs*.06,cs*.88,cs*.88,Math.min(10,cs*.2));ctx.stroke();
    ctx.lineWidth=Math.max(1.8,cs*.06);ctx.strokeStyle=PAL.deep;
    rr(sx+cs*.06,sy+cs*.06,cs*.88,cs*.88,Math.min(10,cs*.2));ctx.stroke();
  }
  requestAnimationFrame(draw);
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  if(done)return;
  var r=cv.getBoundingClientRect();
  var x=Math.floor((e.clientX-r.left-pad)/cs),y=Math.floor((e.clientY-r.top-pad)/cs);
  if(x>=0&&y>=0&&x<w&&y<h){sel=y*w+x;say("选中第 "+(sel+1)+" 格");updPad()}
  e.preventDefault();
});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){grid=L.g.slice();history=[];sel=-1;updStats();say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="9"){if(sel>=0)setVal(+k);e.preventDefault()}
  else if(k==="0"||k==="Backspace"||k==="Delete"){if(sel>=0)setVal(0);e.preventDefault()}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k.indexOf("Arrow")===0){
    if(sel<0)sel=0;
    else{
      var x=sel%w,y=(sel/w)|0;
      if(k==="ArrowLeft")x=Math.max(0,x-1);
      else if(k==="ArrowRight")x=Math.min(w-1,x+1);
      else if(k==="ArrowUp")y=Math.max(0,y-1);
      else y=Math.min(h-1,y+1);
      sel=y*w+x;
    }
    updPad();
    e.preventDefault();
  }
});
function renderLevels(){}
/* ---------- 启动 ---------- */
var running=true;
document.addEventListener("visibilitychange",function(){
  if(document.hidden)running=false;
  else if(!running){running=true;requestAnimationFrame(draw)}
});
palLoad();loadLevel(save.lv);
requestAnimationFrame(draw);
syncLevelsFromServer();syncSaveFromServer();
window.addEventListener("resize",resize);

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）+ 按钮图标注入（内联 SVG，零外链） */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(els.length){
    function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
    var lastFocus=null;
    function focusFirst(el){
      if(el.dataset.foc)return;el.dataset.foc="1";
      if(!lastFocus)lastFocus=document.activeElement;
      var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
    }
    function restore(el){
      if(!el.dataset.foc)return;delete el.dataset.foc;
      if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
    }
    function trap(el,e){
      if(e.key!=="Tab")return;
      var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
      if(!f.length)return;
      var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
      else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
    }
    function watch(el){
      try{new MutationObserver(function(){
        if(shown(el))focusFirst(el);else restore(el);
      }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
      el.addEventListener("keydown",function(e){trap(el,e)});
    }
    for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  }
  function $(id){return document.getElementById(id)}
  $("btnUndo").insertAdjacentHTML("afterbegin",window.SW_ICON("undo"));
  $("btnHint").insertAdjacentHTML("afterbegin",window.SW_ICON("bulb"));
  $("btnReset").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
  $("btnLv").insertAdjacentHTML("afterbegin",window.SW_ICON("grid"));
})();
</script>
