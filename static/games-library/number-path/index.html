function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  levelOk=new Array(LEVELS.length);
  return true;
}

/* ---------- 结构校验 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.w)||d.w<5||d.w>6)return false;
  if(!Number.isInteger(d.h)||d.h<5||d.h>6)return false;
  var N=d.w*d.h;
  if(!Array.isArray(d.g)||d.g.length!==N)return false;
  var seen={};
  for(var i=0;i<N;i++){
    if(!Number.isInteger(d.g[i])||d.g[i]<0||d.g[i]>N)return false;
    if(d.g[i]>0){if(seen[d.g[i]])return false;seen[d.g[i]]=1;}
  }
  if(!Array.isArray(d.sol)||d.sol.length!==N)return false;
  for(var j=0;j<N;j++){if(!Number.isInteger(d.sol[j])||d.sol[j]<1||d.sol[j]>N)return false;
    if(seen[d.sol[j]]&&d.g[j]!==d.sol[j])return false;}
  return true;
}
/* ---------- 独立验证器：数字序回溯计数（与交互冲突检查分离） ---------- */
function npNb(w,h){
  var nb=[];
  for(var i=0;i<w*h;i++){
    var x=i%w,y=(i/w)|0,out=[];
    if(x>0)out.push(i-1);
    if(x<w-1)out.push(i+1);
    if(y>0)out.push(i-w);
    if(y<h-1)out.push(i+w);
    nb.push(out);
  }
  return nb;
}
function npAdj(nb,a,b){for(var i=0;i<nb[a].length;i++)if(nb[a][i]===b)return true;return false}
function npCount(w,h,g,cap){
  var N=w*h,nb=npNb(w,h);
  var pos=new Array(N+1);
  for(var z=0;z<=N;z++)pos[z]=-1;
  var fixed=g.map(function(v){return v>0});
  for(var i=0;i<N;i++)if(g[i]>0)pos[g[i]]=i;
  var usedBy=new Array(N).fill(false),count=0;
  function bt(k,prev){
    if(count>=cap)return;
    if(k>N){count++;return}
    if(pos[k]>=0){
      if(k===1||npAdj(nb,pos[k],prev))bt(k+1,pos[k]);
      return;
    }
    var cands=[];
    for(var q=0;q<nb[prev].length;q++){
      var cc=nb[prev][q];
      if(!fixed[cc]&&!usedBy[cc])cands.push(cc);
    }
    var nxt=(k<N)?pos[k+1]:-1;
    if(nxt>=0)cands.sort(function(a,b){
      var av=npAdj(nb,a,nxt)?1:0,bv=npAdj(nb,b,nxt)?1:0;
      return bv-av;
    });
    for(var u=0;u<cands.length;u++){
      usedBy[cands[u]]=true;
      bt(k+1,cands[u]);
      usedBy[cands[u]]=false;
      if(count>=cap)return;
    }
  }
  if(pos[1]>=0)bt(1,pos[1]);
  else for(var c=0;c<N;c++){
    if(fixed[c])continue;
    usedBy[c]=true;bt(1,c);usedBy[c]=false;
    if(count>=cap)return;
  }
  return count;
}
function verifyLevel(L){
  if(!validLevelData(L))return false;
  return npCount(L.w,L.h,L.g,2)===1;
}

function errsMap(){

  var errs={},i;

function updStats(){
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stFill").textContent=filled()+" / "+N;
  $("stErr").textContent=Object.keys(errsMap()).length;
  $("btnUndo").disabled=!history.length||done;
}
function buildPad(){
  var pad=$("pad");pad.innerHTML="";
  for(var v=1;v<=N;v++){
    (function(v){
      var b=document.createElement("button");
      b.className="op";b.type="button";b.textContent=v;
      b.addEventListener("click",function(){setVal(v)});
      pad.appendChild(b);
    })(v);
  }
  var b0=document.createElement("button");
  b0.className="op";b0.type="button";b0.textContent="擦";
  b0.addEventListener("click",function(){setVal(0)});
  pad.appendChild(b0);
}
/* ---------- 交互 ---------- */
function setVal(v){
  if(done||sel<0)return;
  if(L.g[sel]>0){say("起手锚点不能改");return}
  if(grid[sel]===v)return;
  history.push({i:sel,prev:grid[sel]});
  grid[sel]=v;
  updStats();
  if(v>0)say("已填 "+v);
  checkWin();
}
function undo(){
  if(!history.length||done)return;
  var hh=history.pop();
  grid[hh.i]=hh.prev;sel=hh.i;
  updStats();say("撤销一步");
}
function hint(){
  if(done)return;
  for(var i=0;i<N;i++){
    if(grid[i]>0&&grid[i]!==L.sol[i]){
      history.push({i:i,prev:grid[i]});grid[i]=0;sel=i;
      say("提示：这个数字放错了，已擦除");
      updStats();return;
    }
  }
  for(var j=0;j<N;j++){
    if(grid[j]===0){
      history.push({i:j,prev:0});grid[j]=L.sol[j];sel=j;
      say("提示：此格应填 "+L.sol[j]);
      updStats();checkWin();return;
    }
  }
  say("已与内嵌解一致，检查断链");
}
function checkWin(){
  if(done)return;
  if(filled()<N)return;
  if(Object.keys(errsMap()).length)return;
  done=true;
  save.done[lv]=true;
  if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:history.length}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"长径打通！";
  $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成 · 1 到 "+N+" 一笔连通"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
/* ---------- 绘制 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cs=Math.min(Math.floor((wCss-16)/w),64);
  W=cs*w+16;H=cs*h+16;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function draw(){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  if(!L)return;
  var errs=errsMap();
  for(var i=0;i<N;i++){
    var x=i%w,y=(i/w)|0;
    var px=8+x*cs,py=8+y*cs;
    ctx.fillStyle=L.g[i]>0?PAL.anchor:PAL.path;   // 素材锚点/待填底色
    ctx.fillRect(px,py,cs-2,cs-2);
    ctx.strokeStyle=errs[i]?PAL.danger:PAL.border;
    ctx.lineWidth=errs[i]?2.5:1;
    ctx.strokeRect(px+1,py+1,cs-4,cs-4);
    if(i===sel&&!done){
      ctx.strokeStyle=PAL.deep;ctx.lineWidth=2.5;
      ctx.strokeRect(px+2,py+2,cs-6,cs-6);
    }
    var v=grid[i];
    if(v>0){
      ctx.fillStyle=errs[i]?PAL.danger:(v===1||v===N?PAL.success:PAL.text);
      ctx.font="700 "+Math.min(22,cs*0.4)+"px sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(String(v),px+cs/2,py+cs/2+1);
    }
  }
  requestAnimationFrame(draw);
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  if(done)return;
  var r=cv.getBoundingClientRect();
  var x=Math.floor((e.clientX-r.left-8)/cs),y=Math.floor((e.clientY-r.top-8)/cs);
  if(x>=0&&y>=0&&x<w&&y<h){sel=y*w+x;say("选中第 "+(sel+1)+" 格")}
  e.preventDefault();
});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){grid=L.g.slice();history=[];sel=-1;updStats();say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="9"){if(sel>=0)setVal(+k);e.preventDefault()}
  else if(k==="0"||k==="Backspace"||k==="Delete"){if(sel>=0)setVal(0);e.preventDefault()}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k.indexOf("Arrow")===0){
    if(sel<0)sel=0;
    else{
      var x=sel%w,y=(sel/w)|0;
      if(k==="ArrowLeft")x=Math.max(0,x-1);
      else if(k==="ArrowRight")x=Math.min(w-1,x+1);
      else if(k==="ArrowUp")y=Math.max(0,y-1);
      else y=Math.min(h-1,y+1);
      sel=y*w+x;
    }
    e.preventDefault();
  }
});
function renderLevels(){}
/* ---------- 启动 ---------- */
var running=true;
document.addEventListener("visibilitychange",function(){
  if(document.hidden)running=false;
  else if(!running){running=true;requestAnimationFrame(draw)}
});
palLoad();loadLevel(save.lv);
requestAnimationFrame(draw);
verifyPending();syncLevelsFromServer();syncSaveFromServer();
window.addEventListener("resize",resize);

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
