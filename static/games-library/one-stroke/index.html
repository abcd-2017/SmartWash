var LEVELS_KEY="sw.one-stroke.v1.levels",LEVELS_VER_KEY="sw.one-stroke.v1.levels.ver";
/*==PARSE-START==（解析逻辑供独立单测提取：validData/parseDbLevels 为纯函数）*/
/* 结构校验：nodes 6..24 个 [x,y]（0..100），edges 8..40 条 [a,b]（整数索引、无重边/自环），
   start 合法，limit 可选且 ≥ 边数；奇度节点数 ∈ {0,2}，有奇度点时 start 必须是奇度点之一；
   BFS 复核连通性（欧拉定理：连通 + 奇度 0/2 ⇔ 存在欧拉路径） */
function validData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(d.name!==undefined&&(typeof d.name!=="string"||d.name.length>32))return false;
  if(!Array.isArray(d.nodes)||!Array.isArray(d.edges))return false;
  var n=d.nodes.length;
  if(n<6||n>24)return false;
  for(var i=0;i<n;i++){
    var p=d.nodes[i];
    if(!Array.isArray(p)||p.length!==2)return false;
    var x=p[0],y=p[1];
    if(typeof x!=="number"||typeof y!=="number"||!isFinite(x)||!isFinite(y))return false;
    if(x<0||x>100||y<0||y>100)return false;
  }
  var m=d.edges.length;
  if(m<8||m>40)return false;
  var deg=[],used={};
  for(var z=0;z<n;z++)deg.push(0);
  for(var j=0;j<m;j++){
    var e=d.edges[j];
    if(!Array.isArray(e)||e.length!==2)return false;
    var a=e[0],b=e[1];
    if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a>=n||b>=n||a===b)return false;
    var k=a<b?a+"_"+b:b+"_"+a;
    if(used[k])return false;
    used[k]=true;
    deg[a]++;deg[b]++;
  }
  if(typeof d.start!=="number"||!Number.isInteger(d.start)||d.start<0||d.start>=n)return false;
  if(d.limit!==undefined){
    if(!Number.isInteger(d.limit)||d.limit<m||d.limit>99)return false;
  }
  var odd=[];
  for(var v=0;v<n;v++)if(deg[v]%2===1)odd.push(v);
  if(odd.length!==0&&odd.length!==2)return false;
  if(odd.length===2&&d.start!==odd[0]&&d.start!==odd[1])return false;
  var seen={},q=[d.start],cnt=1;
  seen[d.start]=true;
  for(var h=0;h<q.length;h++){
    var cur=q[h];
    for(var t=0;t<m;t++){
      var e2=d.edges[t],o=-1;
      if(e2[0]===cur)o=e2[1];else if(e2[1]===cur)o=e2[0];else continue;
      if(!seen[o]){seen[o]=true;cnt++;q.push(o);}
    }
  }
  if(cnt!==n)return false;
  return true;
}
function parseDbLevels(res){
  if(!res||typeof res!=="object"||Array.isArray(res))return null;
  if(!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[];
  for(var i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    if(typeof item.dataJson!=="string"||!item.dataJson)return null;
    var d;
    try{d=JSON.parse(item.dataJson);}catch(e){return null;}
    if(!d||typeof d!=="object"||Array.isArray(d))return null;
    if(!validData(d))return null;
    var name;
    if(typeof d.name==="string"&&d.name)name=d.name;
    else if(typeof item.name==="string"&&item.name)name=item.name;
    else name="第"+(i+1)+"关";
    if(name.length>32)return null;
    list.push({name:name,nodes:d.nodes,edges:d.edges,start:d.start,limit:d.limit||0});
  }
  return list;
}
/*==PARSE-END==*/
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{

    if(!Array.isArray(list)||!list.length)return 0;
    var checked=parseDbLevels({levels:list.map(function(r){
      var o={name:r&&r.name,nodes:r&&r.nodes,edges:r&&r.edges,start:r&&r.start};
      if(r&&r.limit)o.limit=r.limit;
      return{dataJson:JSON.stringify(o)};
    })});
    if(checked&&checked.length){LEVELS=checked;return v;}
  }catch(e){}
  return 0;
}

function fit(){
  if(!nodes.length)return;
  var w=stage.clientWidth||320;
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(var i=0;i<nodes.length;i++){
    var x=nodes[i][0],y=nodes[i][1];
    if(x<minX)minX=x;if(x>maxX)maxX=x;
    if(y<minY)minY=y;if(y>maxY)maxY=y;
  }
  var spanX=Math.max(maxX-minX,1),spanY=Math.max(maxY-minY,1);
  var ratio=(spanY+28)/(spanX+28);

  cv.style.width=w+"px";cv.style.height=h+"px";
  cv.width=Math.max(1,Math.round(w*dpr));cv.height=Math.max(1,Math.round(h*dpr));
  var availW=w-56,availH=h-56;
  var scale=Math.min(availW/spanX,availH/spanY);
  var cx0=(minX+maxX)/2,cy0=(minY+maxY)/2;
  minDist=1e9;
  for(var a=0;a<nodes.length;a++)for(var b=a+1;b<nodes.length;b++){
    var ddx=(nodes[a][0]-nodes[b][0])*scale,ddy=(nodes[a][1]-nodes[b][1])*scale;
    var dd=Math.hypot(ddx,ddy);
    if(dd<minDist)minDist=dd;
  }
  rNode=Math.max(5,Math.min(9,minDist*0.16));
  rHit=Math.max(24,minDist*0.45);
  pxs=[];pys=[];
  for(var j=0;j<nodes.length;j++){
    pxs.push(w/2+(nodes[j][0]-cx0)*scale);
    pys.push(h/2+(nodes[j][1]-cy0)*scale);
  }
  render();
}
function render(){
  if(!nodes.length)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var W=cv.width/dpr,H=cv.height/dpr;
  ctx.fillStyle=PAL.surface;ctx.fillRect(0,0,W,H);
  ctx.lineCap="round";ctx.lineJoin="round";
  ctx.strokeStyle=PAL.muted;ctx.lineWidth=2;
  for(var e=0;e<edges.length;e++){
    if(drawn.has(e))continue;
    ctx.beginPath();
    ctx.moveTo(pxs[edges[e][0]],pys[edges[e][0]]);
    ctx.lineTo(pxs[edges[e][1]],pys[edges[e][1]]);
    ctx.stroke();
  }
  ctx.strokeStyle=PAL.primary;ctx.lineWidth=Math.max(4,rNode*0.75);
  for(var d=0;d<edges.length;d++){
    if(!drawn.has(d))continue;
    ctx.beginPath();
    ctx.moveTo(pxs[edges[d][0]],pys[edges[d][0]]);
    ctx.lineTo(pxs[edges[d][1]],pys[edges[d][1]]);
    ctx.stroke();
  }
  for(var i=0;i<nodes.length;i++){
    var on=visited.has(i);
    ctx.beginPath();
    ctx.arc(pxs[i],pys[i],rNode,0,Math.PI*2);
    ctx.fillStyle=on?PAL.soft:PAL.surface;ctx.fill();
    ctx.strokeStyle=on?PAL.deep:PAL.muted;ctx.lineWidth=on?2:1.5;ctx.stroke();
  }
  if(!finished){
    ctx.beginPath();
    ctx.arc(pxs[start],pys[start],rNode+4,0,Math.PI*2);
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;ctx.stroke();
    var rm=window.__gRM;
    var t=rm?0:(performance.now()%1200)/1200;
    var pul=rm?0.5:0.5+0.5*Math.sin(t*Math.PI*2);
    ctx.globalAlpha=0.3*(1-pul);
    ctx.beginPath();
    ctx.arc(pxs[pos],pys[pos],rNode+5+pul*4,0,Math.PI*2);
    ctx.fillStyle=PAL.deep;ctx.fill();
    ctx.globalAlpha=1;
    ctx.beginPath();
    ctx.arc(pxs[pos],pys[pos],rNode+2,0,Math.PI*2);
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;ctx.stroke();
  }
}
var rafId=0;
function tick(){render();rafId=(finished||document.hidden)?0:requestAnimationFrame(tick);}
function ensureAnim(){if(!rafId&&nodes.length)rafId=requestAnimationFrame(tick);}
/* ---------- HUD ---------- */
function unlockedUpTo(){
  var m=0;
  for(var k in doneSave){
    var i=parseInt(k,10);
    if(doneSave[k]&&i+1>m)m=i+1;
  }
  return Math.min(m,LEVELS.length-1);
}
function starText(n){
  var s="";
  for(var i=0;i<3;i++)s+=i<n?"★":"☆";
  return s;
}
function updateHud(){
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  $("stDrawn").textContent=drawn.size+"/"+edges.length;
  $("lbUndo").textContent=limit?"剩余步":"撤销";
  $("stUndo").textContent=limit?(limit-undoStack.length):undoCount;
  var b=doneSave[cur];
  $("stBest").textContent=b?starText(b):"-";
  $("btnUndo").disabled=finished||!!limit||!undoStack.length;
  $("btnPick").disabled=false;
}
/* ---------- 关卡生命周期 ---------- */
function startLevel(n){
  cur=Math.max(0,Math.min(n,LEVELS.length-1));
  var L=LEVELS[cur];
  nodes=L.nodes;edges=L.edges;start=L.start;limit=L.limit||0;
  adj=[];edgeIdx={};
  for(var i=0;i<nodes.length;i++)adj.push([]);
  for(var e=0;e<edges.length;e++){
    var a=edges[e][0],b=edges[e][1],k=edgeKeyOf(a,b);
    edgeIdx[k]=e;
    adj[a].push({to:b,eid:e});
    adj[b].push({to:a,eid:e});
  }
  drawn=new Set();path=[start];undoStack=[];visited=new Set([start]);
  pos=start;undoCount=0;finished=false;
  fit();updateHud();hideOverlay();
  say("第"+(cur+1)+"关 · "+L.name+(limit?" · 限步 "+limit+" 步，不可撤销":" · 从空心圈出发"));
  ensureAnim();
}
function tapNode(i){
  if(finished)return;
  if(i===pos)return;
  var eid=edgeIdx[edgeKeyOf(pos,i)];
  if(eid===undefined){say("这两个点之间没有连线，只能沿边逐段画");return;}
  if(drawn.has(eid)){say("这条线已经画过了，换一条边试试");return;}
  move(i,eid);
}
function move(i,eid){
  drawn.add(eid);undoStack.push(eid);
  path.push(i);visited.add(i);pos=i;
  updateHud();ensureAnim();
  if(drawn.size===edges.length){complete();return;}
  var stuck=true;
  for(var k=0;k<adj[pos].length;k++){
    if(!drawn.has(adj[pos][k].eid)){stuck=false;break;}
  }
  if(stuck){
    if(limit)failStuck();
    else say("这个点已经无路可走了，试试撤销几步");
  }
}
function complete(){
  finished=true;
  var att=undoCount+resetCount;
  var stars=att===0?3:(att<=3?2:1);
  if(stars>(doneSave[cur]||0))doneSave[cur]=stars;
  saveData.lv=Math.max(saveData.lv,Math.min(cur+1,LEVELS.length-1));
  save();
  updateHud();render();
  var attText=att===0?"一次画成，完美！":"撤销 "+undoCount+" 次 · 重开 "+resetCount+" 次";
  panel.innerHTML="<h2>一笔画成！</h2><div class=\"stars\">"+starText(stars)+"</div>"+
    "<p class=\"desc\">共 "+edges.length+" 段线 · "+attText+"</p>"+
    "<button type=\"button\" class=\"btn\" id=\"ovNext\">"+(cur<LEVELS.length-1?"下一关":"从头再来")+"</button>"+
    "<button type=\"button\" class=\"btn ghost\" id=\"ovReplay\">重玩本关</button>";
  overlay.classList.add("show");
  $("ovNext").addEventListener("click",function(){
    resetCount=0;undoCount=0;
    startLevel(cur<LEVELS.length-1?cur+1:0);
  });
  $("ovReplay").addEventListener("click",function(){resetCount=0;undoCount=0;startLevel(cur);});
  if(GB.available)GB.reportScore("one-stroke",{metricValue:cur+1,metricExtra:stars}).catch(function(){});
}
function failStuck(){
  finished=true;
  panel.innerHTML="<h2 class=\"bad\">挑战失败</h2>"+
    "<p class=\"desc\">画了 "+drawn.size+"/"+edges.length+" 段后无路可走<br>限步挑战不可撤销，整关重试吧</p>"+
    "<button type=\"button\" class=\"btn\" id=\"ovRetry\">重新挑战</button>";
  overlay.classList.add("show");
  $("ovRetry").addEventListener("click",function(){resetCount=0;undoCount=0;startLevel(cur);});
}
/* ---------- 选关 ---------- */
function renderGrid(){
  var un=unlockedUpTo();
  var html="<h2>选择关卡</h2><p class=\"desc\">已解锁 "+(un+1)+" / "+LEVELS.length+"</p><div class=\"lvgrid\">";
  for(var i=0;i<LEVELS.length;i++){
    var cls="lvbtn"+((doneSave[i]&&doneSave[i]>0)?" done":"")+(i===cur?" cur":"");
    html+="<button type=\"button\" class=\""+cls+"\" data-i=\""+i+"\""+(i>un?" disabled":"")+">"+(i+1)+"</button>";
  }
  html+="</div><button type=\"button\" class=\"btn ghost\" id=\"ovClose\">关闭</button>";
  panel.innerHTML=html;
  var bs=panel.querySelectorAll("button[data-i]");
  for(var j=0;j<bs.length;j++){
    bs[j].addEventListener("click",function(){
      var i=parseInt(this.getAttribute("data-i"),10);
      if(i<=unlockedUpTo()){resetCount=0;undoCount=0;startLevel(i);}
    });
  }
  $("ovClose").addEventListener("click",hideOverlay);
}
function showPicker(){renderGrid();overlay.classList.add("show");}
function hideOverlay(){overlay.classList.remove("show");}
/* ---------- 输入：点击节点 ---------- */
cv.addEventListener("pointerdown",function(e){
  if(finished)return;
  var rect=cv.getBoundingClientRect();
  var px=e.clientX-rect.left,py=e.clientY-rect.top;
  var best=-1,bd=1e18;
  for(var i=0;i<pxs.length;i++){
    var dx=px-pxs[i],dy=py-pys[i],d2=dx*dx+dy*dy;
    if(d2<bd){bd=d2;best=i;}
  }
  if(best<0||bd>rHit*rHit)return;
  e.preventDefault();
  tapNode(best);
});
cv.addEventListener("contextmenu",function(e){e.preventDefault();});
/* ---------- 工具按钮 ---------- */
$("btnUndo").addEventListener("click",function(){
  if(finished||limit||!undoStack.length)return;
  var eid=undoStack.pop();
  drawn.delete(eid);
  path.pop();
  pos=path[path.length-1];
  undoCount++;
  updateHud();ensureAnim();
  say("已撤销一步");
});
$("btnReset").addEventListener("click",function(){
  if(undoStack.length||finished)resetCount++;
  startLevel(cur);
});
$("btnPick").addEventListener("click",showPicker);
/* ---------- 全局事件与启动 ---------- */
window.addEventListener("resize",fit);
document.addEventListener("visibilitychange",function(){
  if(document.hidden){save();if(rafId){cancelAnimationFrame(rafId);rafId=0;}}
  else{render();ensureAnim();}
});
window.addEventListener("pagehide",save);
startLevel(Math.min(saveData.lv,LEVELS.length-1));
syncSaveFromServer();
syncLevelsFromServer();
/* ---------- e2e 调试钩子（无头浏览器测试用，不参与玩法与存档） ---------- */
window.__os={
  levels:function(){return LEVELS;},
  state:function(){return{cur:cur,total:LEVELS.length,drawn:drawn.size,edges:edges.length,pos:pos,undo:undoCount,resets:resetCount,finished:finished,limit:limit,msg:msgEl.textContent};},
  nodePos:function(i){return{x:pxs[i],y:pys[i]};},
  canvasRect:function(){var r=cv.getBoundingClientRect();return{left:r.left,top:r.top,width:r.width,height:r.height};},
  clickNode:function(i){tapNode(i);},
  gotoLevel:function(i){resetCount=0;undoCount=0;startLevel(i);},
  injectLevels:function(res){var l=parseDbLevels(res);if(!l)return false;return applyLevels(l,(res&&res.version)||0);},
  pal:function(){return PAL;},
  theme:function(){return document.documentElement.dataset.theme;},
  overlayShown:function(){return overlay.classList.contains("show");},
  best:function(i){return doneSave[i]||0;},
  clearSave:function(){try{localStorage.removeItem(KEY);localStorage.removeItem(LEVELS_KEY);localStorage.removeItem(LEVELS_VER_KEY);}catch(e){}}
};
})();
</script>
