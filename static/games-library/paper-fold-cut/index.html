<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>一剪成形</title>
<style>

  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-st-paper:#F3EFE4;--g-st-hole:#3A4038;--g-st-foldln:#B08A4E;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-paper:#2C2E28;--g-st-hole:#101210;--g-st-foldln:#8A6E3E;color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 8px; text-align: center; line-height: 1.3; min-width: 0; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.low { color: var(--g-danger); }
  .stage { position: relative; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); box-shadow: var(--g-shadow); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--g-btn-primary); color: #fff; font-size: 16px; font-weight: 600; }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .35; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* 动效敏感用户降级——保留状态切换，压平装饰动效（动效层指令，不受 §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* 键盘焦点可见 */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}

  .legend { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 2px 8px; }
  .lg { font-size: 12px; color: var(--g-muted); background: var(--g-surface2); border-radius: 10px; padding: 2px 10px; }

  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},

})();

/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="paper-fold-cut",SAVE_KEY="sw.paperfoldcut.v1";
var DEFAULT_LEVELS=DEFAULT_LEVELS_SRC;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  levelOk=new Array(LEVELS.length);
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
var levelOk=new Array(LEVELS.length);
function verifyPending(){   // 后台逐关复核（分片避免卡顿）：坏关禁选、当前关即时告警
  var i=0;
  function step(){
    var t0=Date.now();
    while(i<LEVELS.length&&Date.now()-t0<40){
      if(levelOk[i]===undefined)levelOk[i]=verifyLevel(LEVELS[i]);
      i++;
    }
    if(i<LEVELS.length)setTimeout(step,0);
    else if(typeof renderLevels==="function")renderLevels();
  }
  setTimeout(step,0);
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0)),done:(s.done&&typeof s.done==="object")?s.done:{}}}catch(e){return{lv:0,done:{}}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
      if(typeof resize==="function")resize();
    }
  }).catch(function(){});
}
/* ---------- 选关浮层（lvgrid 通用） ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(save.done[i]?" done":"");
      b.textContent=i+1;
      b.disabled=(levelOk[i]===false)||(i>save.lv);   // 验证失败的关禁选；未验证的关乐观放行
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 结构校验 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(d.fold!=="h"&&d.fold!=="v")return false;
  if(!Array.isArray(d.holes)||d.holes.length<1||d.holes.length>8)return false;
  var fw=d.fold==="v"?4:8,fh=d.fold==="h"?4:8;
  for(var i=0;i<d.holes.length;i++){
    var p=d.holes[i];
    if(!Array.isArray(p)||p.length!==2)return false;
    if(!Number.isInteger(p[0])||!Number.isInteger(p[1]))return false;
    if(p[0]<0||p[1]<0||p[0]>=fw||p[1]>=fh)return false;
  }
  if(!Array.isArray(d.target)||d.target.length!==64)return false;
  for(var j=0;j<64;j++)if(d.target[j]!==0&&d.target[j]!==1)return false;
  var ref=pfExpand(d.fold,d.holes);
  for(var k=0;k<64;k++)if(ref[k]!==d.target[k])return false;
  return true;
}
/* ---------- 独立验证器：枚举全部共线点对线段（与交互逻辑分离） ---------- */
function pfExpand(fold,pts){
  var t=new Array(64).fill(0);
  for(var i=0;i<pts.length;i++){
    var x=pts[i][0],y=pts[i][1];
    if(fold==="h"){t[(4+y)*8+x]=1;t[(3-y)*8+x]=1}
    else{t[y*8+4+x]=1;t[y*8+(3-x)]=1}
  }
  return t;
}
function pfSeg(a,b){
  var dx=b[0]-a[0],dy=b[1]-a[1];
  if(!(dx===0||dy===0||Math.abs(dx)===Math.abs(dy)))return null;
  var n=Math.max(Math.abs(dx),Math.abs(dy));
  if(n===0)return [[a[0],a[1]]];
  var out=[];
  for(var i=0;i<=n;i++)out.push([a[0]+Math.round(dx*i/n),a[1]+Math.round(dy*i/n)]);
  return out;
}
function verifyLevel(L){
  if(!validLevelData(L))return false;
  var fw=L.fold==="v"?4:8,fh=L.fold==="h"?4:8;
  var cells=[];
  for(var y=0;y<fh;y++)for(var x=0;x<fw;x++)cells.push([x,y]);
  for(var i=0;i<cells.length;i++)for(var j=i;j<cells.length;j++){
    var seg=pfSeg(cells[i],cells[j]);
    if(!seg)continue;
    var t=pfExpand(L.fold,seg),ok=true;
    for(var k=0;k<64;k++)if(t[k]!==L.target[k]){ok=false;break}
    if(ok)return true;
  }
  return false;
}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),success:v("--g-success"),warning:v("--g-warning"),
    paper:v("--g-st-paper"),hole:v("--g-st-hole"),foldln:v("--g-st-foldln")};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,ptsA=null,cur=-1,done=false;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,dpr=1,cs=34,ts=22;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function curCut(){return ptsA?[ptsA]:[]}
/* ---------- 关卡 ---------- */
function loadLevel(n2){
  lv=Math.max(0,Math.min(n2,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return}
  ptsA=null;cur=-1;done=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("stFold").textContent=L.fold==="h"?"横折":"竖折";
  var ok=verifyLevel(L);   // 加载复核：一刀可达
  if(!ok)say("警告：内嵌验证器判定本关无法一刀达成（数据异常）");
  else say("在对折纸上点第一格");
  updStats();resize();
}
function updStats(){
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  var seg=curSeg();
  $("stCut").textContent=(seg?seg.length:0)+" 格";
}
function curSeg(){
  if(!ptsA)return null;
  return [ptsA];
}
/* ---------- 交互 ---------- */
function tap(x,y){
  if(done)return;
  if(!ptsA){
    ptsA=[x,y];
    say("已定第一点，再点同 行/列/对角线 上的一点");
  }else{
    var seg=pfSeg(ptsA,[x,y]);
    if(!seg){say("两点不共线（须同行/同列/45°对角），重新点第一格");ptsA=[x,y];updStats();return}
    // 剪一刀：检查展开
    var t=pfExpand(L.fold,seg),ok=true;
    for(var k=0;k<64;k++)if(t[k]!==L.target[k]){ok=false;break}
    if(ok){
      done=true;
      save.done[lv]=true;
      if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
      persist();
      if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:seg.length}).catch(function(){});
      $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"一刀剪成！";
      $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成 · 刀口 "+seg.length+" 格"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
      $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
      $("overlay").classList.add("show");
    }else{
      ptsA=[x,y];
      say("展开不像目标，换一个刀口（已重置第一点）");
    }
    updStats();
  }
}
function undo(){
  if(done)return;
  if(ptsA){ptsA=null;say("已清除当前刀口");updStats();return}
  say("没有可撤销的点了");
}
function hint(){
  if(done)return;
  say("提示：试着在折线附近沿对角线剪一刀");
}
/* ---------- 绘制 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cs=Math.max(24,Math.min(40,Math.floor((wCss-32-8*18)/(L&&L.fold==="h"?8:4))));
  ts=Math.max(16,Math.min(24,Math.floor((wCss-24)/10)));
  W=Math.round(wCss);
  H=Math.round(Math.max(4*cs,8*ts)+20);
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function draw(){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  if(!L)return;
  var fw=L.fold==="v"?4:8,fh=L.fold==="h"?4:8;
  var ox=8,oy=8;
  // 折后纸
  for(var y=0;y<fh;y++)for(var x=0;x<fw;x++){
    var px=ox+x*cs,py=oy+y*cs;
    ctx.fillStyle=PAL.paper;   // 素材纸面
    ctx.fillRect(px,py,cs-2,cs-2);
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
    ctx.strokeRect(px+0.5,py+0.5,cs-3,cs-3);
    if(ptsA&&ptsA[0]===x&&ptsA[1]===y){
      ctx.fillStyle=PAL.deep;
      ctx.beginPath();ctx.arc(px+cs/2,py+cs/2,cs*0.2,0,7);ctx.fill();
    }
    if(cur===y*fw+x&&!done){
      ctx.strokeStyle=PAL.warning;ctx.lineWidth=2.5;
      ctx.strokeRect(px+1,py+1,cs-4,cs-4);
    }
  }
  // 折线示意（贴折后纸一侧）
  ctx.strokeStyle=PAL.foldln;   // 素材折痕
  ctx.lineWidth=3;
  ctx.beginPath();
  if(L.fold==="h"){ctx.moveTo(ox,oy+fh*cs+2);ctx.lineTo(ox+fw*cs,oy+fh*cs+2)}
  else{ctx.moveTo(ox+fw*cs+2,oy);ctx.lineTo(ox+fw*cs+2,oy+fh*cs)}
  ctx.stroke();
  // 展开预览（8×8）
  var seg=ptsA?[ptsA]:null;
  var t=seg?pfExpand(L.fold,seg):new Array(64).fill(0);
  var ex=W-8-8*ts,ey=oy;
  for(var yy=0;yy<8;yy++)for(var xx=0;xx<8;xx++){
    var qx=ex+xx*ts,qy=ey+yy*ts;
    ctx.fillStyle=t[yy*8+xx]?PAL.hole:PAL.paper;   // 素材洞/纸
    ctx.fillRect(qx,qy,ts-1,ts-1);
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
    ctx.strokeRect(qx+0.5,qy+0.5,ts-2,ts-2);
  }
  ctx.fillStyle=PAL.muted;ctx.font="700 12px sans-serif";ctx.textAlign="right";ctx.textBaseline="top";
  ctx.fillText("展开预览",ex+8*ts,ey+8*ts+4);
  ctx.textAlign="left";
  ctx.fillText("对折纸",ox,oy+fh*cs+12);
  requestAnimationFrame(draw);
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  if(done)return;
  var r=cv.getBoundingClientRect();
  var fw=L.fold==="v"?4:8,fh=L.fold==="h"?4:8;
  var x=Math.floor((e.clientX-r.left-8)/cs),y=Math.floor((e.clientY-r.top-8)/cs);
  if(x>=0&&y>=0&&x<fw&&y<fh){cur=y*fw+x;tap(x,y)}
  e.preventDefault();
});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){ptsA=null;cur=-1;updStats();say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  var fw=L?L.fold==="v"?4:8:8,fh=L?L.fold==="h"?4:8:8;
  if(k.indexOf("Arrow")===0){
    if(cur<0)cur=0;
    else{
      var x=cur%fw,y=(cur/fw)|0;
      if(k==="ArrowLeft")x=Math.max(0,x-1);
      else if(k==="ArrowRight")x=Math.min(fw-1,x+1);
      else if(k==="ArrowUp")y=Math.max(0,y-1);
      else y=Math.min(fh-1,y+1);
      cur=y*fw+x;
    }
    e.preventDefault();
  }else if(k==="Enter"||k===" "){
    if(cur>=0)tap(cur%fw,(cur/fw)|0);
    e.preventDefault();
  }else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){ptsA=null;cur=-1;updStats();say("本关已重置")}
});
function renderLevels(){}
/* ---------- 启动 ---------- */
/* S4：隐藏时停 rAF 循环，恢复时续跑并重绘（rAF 在隐藏页本就被浏览器挂起，此处保证恢复续跑） */
var running=true;
document.addEventListener("visibilitychange",function(){
  if(document.hidden)running=false;
  else if(!running){running=true;requestAnimationFrame(draw)}
});
palLoad();loadLevel(save.lv);
requestAnimationFrame(draw);
verifyPending();syncLevelsFromServer();syncSaveFromServer();
window.addEventListener("resize",resize);

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
