<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>纸机穿环</title>
<style>
  /*token:GAME-THEME.md§2（纸面/环圈素材 token 统一 --g-st- 前缀，§3 D2）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-on-primary:#FFF;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gap:16px;--g-st-paper:#FFFFFF;--g-st-paperln:#9AA39C;--g-st-ring:#4A9FD4;--g-st-ring2:#2D6E9C;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-paper:#E6E9E6;--g-st-paperln:#6E7671;--g-st-ring:#6BB4DE;--g-st-ring2:#3F7CA8;color-scheme:dark }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .boxes { display: flex; gap: 8px; }
  .box { background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 10px; min-width: 86px; padding: 5px 12px; text-align: center; line-height: 1.3; }
  .box.alt { background: var(--g-surface); color: var(--g-text); border: 1px solid var(--g-border); }
  .box .label { display: block; font-size: 12px; }
  .box b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .hint { margin: 0; font-size: 14px; color: var(--g-muted); }
  .btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--g-btn-primary); color: var(--g-on-primary); font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .btn.ghost { background: var(--g-surface); color: var(--g-text); border: 1px solid var(--g-border); }
  .btn:active { opacity: .85; }
  .stage { position: relative; width: 100%; }
  canvas { display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: var(--g-radius-inner); border: 1px solid var(--g-border); background: var(--g-surface); touch-action: none; }
  .overlay { position: absolute; inset: 0; border-radius: var(--g-radius-inner); background: var(--g-scrim); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; text-align: center; }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .card { width: 100%; max-width: 320px; max-height: 100%; overflow: auto; background: var(--g-surface); border: 1px solid var(--g-border); border-radius: var(--g-radius); box-shadow: var(--g-shadow); padding: 16px; }
  .ov-kicker { margin: 0 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--g-muted); }
  .card h2 { margin: 0 0 8px; font-size: 18px; line-height: 1.25; color: var(--g-text); }
  .ov-text { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: var(--g-muted); }
  .ov-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 12px; }
  .ov-stats .st { background: var(--g-surface2); border-radius: 10px; padding: 7px 4px; }
  .ov-stats b { display: block; font-size: 18px; color: var(--g-primary-deep); font-variant-numeric: tabular-nums; }
  .ov-stats span { font-size: 12px; color: var(--g-muted); }
  .ov-btns { display: grid; gap: 8px; }
  .foot { margin: 14px 0 0; font-size: 12px; line-height: 1.6; color: var(--g-muted); text-align: center; }

  /* S2: 动效敏感用户降级（动效层指令，不受 §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<body>
<div class="wrap">
  <header>
    <div class="boxes">
      <div class="box"><span class="label">分数</span><b id="hudScore">0</b></div>

  <div class="toolbar">

      </div>
    </div>
  </div>
  <p class="foot">按住蓄力掷机 · 飞行中按住抬升 / 松手俯冲 · 碰到环缘只断连击 · 撞地撞顶结束</p>
</div>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 常量与存档 ---------- */
var MW=480,MH=360,GRAV=320,LIFT=460,PLX=140;
var KEY="sw.paper-glide.v1";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function loadSave(){try{var s=JSON.parse(lsGet(KEY))||{};return{best:parseInt(s.best,10)||0}}catch(e){return{best:0}}}
var save=loadSave();
function persist(){
  try{lsSet(KEY,JSON.stringify(save))}catch(e){}
  if(GB.available)GB.saveState("paper-glide",save).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("paper-glide").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rb=parseInt(JSON.parse(res.stateJson).best,10)||0;
      if(rb>save.best){save.best=rb;S.best=rb;persist();syncHud();}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 调色板:CSS变量 → canvas ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL.bg=v("--g-bg");PAL.surface=v("--g-surface");PAL.surface2=v("--g-surface2");PAL.border=v("--g-border");
  PAL.text=v("--g-text");PAL.muted=v("--g-muted");PAL.faint=v("--g-faint");
  PAL.primary=v("--g-primary");PAL.deep=v("--g-primary-deep");PAL.soft=v("--g-primary-soft");
  PAL.danger=v("--g-danger");PAL.warning=v("--g-warning");PAL.success=v("--g-success");
  PAL.paper=v("--g-st-paper");PAL.paperln=v("--g-st-paperln");PAL.ring=v("--g-st-ring");PAL.ring2=v("--g-st-ring2");
}
window.__gOnTheme=function(){palLoad();draw();};
/* ---------- DOM ---------- */
function $(id){return document.getElementById(id)}
var cv=$("cv"),ctx=cv.getContext("2d"),ov=$("ov");
var hudScore=$("hudScore"),hudRing=$("hudRing"),hudBest=$("hudBest");
var ovK=$("ovK"),ovT=$("ovT"),ovX=$("ovX"),ovS=$("ovS"),ovB=$("ovB");
/* ---------- 状态 ---------- */
var S={phase:"menu",paused:false,best:save.best,
  mode:"idle",chargeT:0,holding:false,
  px:0,py:MH/2,vx:0,vy:0,rot:0,
  rings:[],nextRingX:520,
  camX:0,score:0,ringN:0,streak:0,maxStreak:0,dist:0,
  parts:[],floats:[],t:0};
function startRun(){
  S.phase="run";S.paused=false;S.mode="toss";
  S.chargeT=0;S.holding=false;
  S.px=PLX;S.py=MH/2;S.vx=0;S.vy=0;S.rot=0;
  S.rings=[];S.nextRingX=520;
  S.camX=0;S.score=0;S.ringN=0;S.streak=0;S.maxStreak=0;S.dist=0;
  S.parts.length=0;S.floats.length=0;
  syncHud();hideOv();
}
function syncHud(){
  hudScore.textContent=String(S.score);
  hudRing.textContent=String(S.ringN);
  hudBest.textContent=String(S.best);
}
function endRun(){
  S.phase="over";S.mode="idle";
  var isRec=S.score>save.best&&S.score>0;
  if(isRec){save.best=S.score;S.best=S.score;persist();syncHud();}
  if(GB.available)GB.reportScore("paper-glide",{metricValue:S.best,metricExtra:"穿环"+S.ringN}).catch(function(){});
  syncHud();
  showOv({k:"CRASH",t:"纸飞机折了",
    x:isRec?"新纪录！环心连击分翻倍，试试全程不碰环缘。":"按住抬升、松手俯冲，环缘碰不得——只会断连击。",
    stats:[["穿环",S.ringN],["最高连击",S.maxStreak],["最高分",S.best]],
    btns:[["再掷一次","primary",startRun]]});
}
/* ---------- 覆盖层 ---------- */
function showOv(o){
  ovK.textContent=o.k||"";ovT.textContent=o.t||"";ovX.textContent=o.x||"";
  var st=o.stats||[];
  ovS.style.display=st.length?"grid":"none";
  ovS.innerHTML=st.map(function(s){return '<div class="st"><b>'+s[1]+"</b><span>"+s[0]+"</span></div>"}).join("");
  ovB.innerHTML="";
  (o.btns||[]).forEach(function(b){
    var el=document.createElement("button");
    el.className="btn"+(b[1]==="ghost"?" ghost":"");
    el.textContent=b[0];el.addEventListener("click",b[2]);ovB.appendChild(el);
  });
  ov.classList.add("show");
}
function hideOv(){ov.classList.remove("show")}
function pauseGame(){
  if(S.phase!=="run"||S.paused||S.mode==="toss")return;
  S.paused=true;
  showOv({k:"PAUSED",t:"已暂停",x:"气流停了，回来接着穿。",
    btns:[["继续","primary",function(){S.paused=false;hideOv()}],["重开","ghost",startRun]]});
}
/* ---------- 粒子/浮字 ---------- */
function puff(x,y,n,col,spd){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28,sp=(spd||60)*(0.3+Math.random());
    S.parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.4+Math.random()*.3,max:.7,r:1.4+Math.random()*2,col:col});
  }
}
function float_(x,y,txt,col){S.floats.push({x:x,y:y,txt:txt,col:col||PAL.deep,t:.9})}
/* ---------- 动作 ---------- */
function holdStart(){
  if(S.phase!=="run"||S.paused)return;
  S.holding=true;
  if(S.mode==="toss")S.chargeT=0;
}
function holdEnd(){
  if(!S.holding)return;
  S.holding=false;
  if(S.mode==="toss"&&S.phase==="run"&&!S.paused){
    var power=Math.min(1,S.chargeT/0.8);
    S.mode="fly";
    S.vx=250+power*200;
    S.vy=-60-power*90;
    puff(S.px,S.py,6,PAL.paperln,50);
  }
}
/* ---------- 物理步进 ---------- */
function sx(wx){return wx-S.camX}
function step(dt){
  S.t+=dt;
  if(S.mode==="toss"){
    if(S.holding)S.chargeT+=dt;
    return;
  }
  //飞行
  S.dist=S.px-PLX;
  S.vx+=6*dt;
  if(S.holding)S.vy-=LIFT*dt;
  S.vy+=GRAV*dt;
  S.vy=Math.max(-260,Math.min(300,S.vy));
  var prevX=S.px;
  S.px+=S.vx*dt;S.py+=S.vy*dt;
  S.rot=Math.max(-.5,Math.min(.6,S.vy*0.0022));
  S.camX=S.px-PLX;
  //上下边界：撞地撞顶结束
  if(S.py<18||S.py>MH-18){endRun();return}
  //生成环
  while(S.nextRingX<S.px+MW){
    var ry=70+Math.random()*(MH-150);
    S.rings.push({x:S.nextRingX,y:ry,done:false});
    S.nextRingX+=250+Math.random()*120;
  }
  //穿环判定（越过环面瞬间）
  for(var i=0;i<S.rings.length;i++){
    var rg=S.rings[i];
    if(!rg.done&&prevX<rg.x&&S.px>=rg.x){
      rg.done=true;
      var dy=S.py-rg.y;
      if(Math.abs(dy)<17){
        S.streak++;S.ringN++;
        S.maxStreak=Math.max(S.maxStreak,S.streak);
        var gain=100+20*Math.min(S.streak,10);
        S.score+=gain;
        S.vx=Math.min(S.vx+8,560);
        float_(rg.x+30,rg.y,"+"+gain+(S.streak>1?" 连×"+S.streak:""),PAL.deep);
        puff(rg.x,rg.y,10,PAL.ring,90);
        syncHud();
      }else if(Math.abs(dy)<40){
        S.streak=0;
        S.vy=dy>0?130:-130;
        float_(rg.x+30,rg.y,"环缘!",PAL.danger);
        puff(rg.x,rg.y+dy,6,PAL.ring2,70);
        syncHud();
      }else{
        S.streak=0;
        float_(rg.x+30,rg.y,"错空",PAL.muted);
        syncHud();
      }
    }
  }
  while(S.rings.length&&S.rings[0].x<S.camX-80)S.rings.shift();
  //粒子/浮字
  for(i=S.parts.length-1;i>=0;i--){
    var q=S.parts[i];
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
    if(q.life<=0)S.parts.splice(i,1);
  }
  for(i=S.floats.length-1;i>=0;i--){
    var fl=S.floats[i];fl.x-=40*dt;fl.y-=26*dt;fl.t-=dt;
    if(fl.t<=0)S.floats.splice(i,1);
  }
}
/* ---------- 绘制 ---------- */
var SC=1;
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  SC=r.width/MW;
  ctx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
}
function draw(){
  //天空
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,MW,MH);
  ctx.fillStyle=PAL.surface2;
  for(var i=0;i<6;i++){
    var cl=((i*97-S.camX*0.18)%(MW+160)+MW+160)%(MW+160)-80;
    ctx.globalAlpha=.5;
    ctx.beginPath();ctx.ellipse(cl,50+(i%3)*38,44,12,0,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  //地面与顶线
  ctx.fillStyle=PAL.surface2;ctx.fillRect(0,MH-10,MW,10);
  ctx.fillStyle=PAL.border;ctx.fillRect(0,10,MW,3);
  ctx.fillRect(0,MH-12,MW,3);
  //环
  for(i=0;i<S.rings.length;i++){
    var rg=S.rings[i],rx=sx(rg.x);
    if(rx<-60||rx>MW+60)continue;
    ctx.globalAlpha=rg.done?.35:1;
    ctx.strokeStyle=PAL.ring2;ctx.lineWidth=9;
    ctx.beginPath();ctx.ellipse(rx,rg.y,26,40,0,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle=PAL.ring;ctx.lineWidth=5;
    ctx.beginPath();ctx.ellipse(rx,rg.y,26,40,0,0,Math.PI*2);ctx.stroke();
    if(!rg.done){
      ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(rx,rg.y-12);ctx.lineTo(rx,rg.y+12);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  //纸飞机
  var px=S.mode==="toss"?PLX:sx(S.px);
  var py=S.mode==="toss"?MH/2:S.py;
  ctx.save();ctx.translate(px,py);ctx.rotate(S.rot);
  ctx.fillStyle=PAL.paper;ctx.strokeStyle=PAL.paperln;ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-14,-9);ctx.lineTo(-6,0);ctx.lineTo(-14,9);ctx.closePath();
  ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-6,0);ctx.lineTo(-10,-3.5);ctx.closePath();
  ctx.fillStyle=PAL.surface2;ctx.fill();
  ctx.restore();
  //蓄力条
  if(S.mode==="toss"){
    var c=S.holding?Math.min(1,S.chargeT/0.8):0;
    ctx.fillStyle=PAL.surface;ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
    ctx.beginPath();ctx.rect(PLX-60,py-46,120,12);ctx.fill();ctx.stroke();
    ctx.fillStyle=c<0.6?PAL.primary:(c<0.85?PAL.warning:PAL.danger);
    if(c>0){ctx.beginPath();ctx.rect(PLX-58,py-44,116*c,8);ctx.fill()}
    ctx.fillStyle=PAL.muted;ctx.font="700 12px system-ui,sans-serif";ctx.textAlign="center";
    ctx.fillText("按住蓄力掷出",PLX,py-58);
    //虚线弹道预览
    ctx.strokeStyle=PAL.faint;ctx.lineWidth=1.6;ctx.setLineDash([4,6]);
    ctx.beginPath();ctx.moveTo(px+18,py);
    ctx.quadraticCurveTo(px+70,py-14-c*40,px+130,py-40-c*70);ctx.stroke();
    ctx.setLineDash([]);
  }
  //连击
  if(S.streak>1){
    ctx.fillStyle=PAL.deep;ctx.font="700 22px system-ui,sans-serif";ctx.textAlign="center";
    ctx.fillText("连穿 ×"+S.streak,MW/2,40);
  }
  //粒子/浮字
  for(i=0;i<S.parts.length;i++){
    var q=S.parts[i];
    ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.fillStyle=q.col;
    ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign="center";ctx.font="700 16px system-ui,sans-serif";
  for(i=0;i<S.floats.length;i++){
    var f2=S.floats[i];
    ctx.globalAlpha=Math.min(1,f2.t*1.6);
    ctx.fillStyle=f2.col;ctx.fillText(f2.txt,f2.x,f2.y);
  }
  ctx.globalAlpha=1;
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  holdStart();
});
function pointerEnd(){holdEnd()}
cv.addEventListener("pointerup",pointerEnd);
cv.addEventListener("pointercancel",pointerEnd);
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
window.addEventListener("blur",function(){S.holding=false});
document.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.code==="KeyW"||e.code==="ArrowUp"){
    e.preventDefault();
    if(!e.repeat)holdStart();
  }
  if(e.code==="KeyP"&&S.phase==="run"){S.paused?((S.paused=false),hideOv()):pauseGame()}
  if(e.code==="KeyR"&&S.phase!=="menu")startRun();
  if(e.code==="Enter"&&S.phase!=="run")startRun();
});
document.addEventListener("keyup",function(e){
  if(e.code==="Space"||e.code==="KeyW"||e.code==="ArrowUp")holdEnd();
});
$("btnPause").addEventListener("click",pauseGame);
$("btnReset").addEventListener("click",startRun);
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&S.phase==="run"&&!S.paused)pauseGame();
});
/* ---------- 主循环 ---------- */
var lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  var dt=Math.min(.05,(now-lastT)/1000);
  lastT=now;
  if(S.phase==="run"&&!S.paused)step(dt);
  draw();
}
/* ---------- 启动 ---------- */
palLoad();
syncHud();
showOv({k:"PAPER GLIDE",t:"纸机穿环",
  x:"按住蓄力掷出纸飞机，飞行中按住抬升、松手俯冲；从环心穿过连击加分，碰环缘只断连击，撞顶撞地才结束。",
  stats:[["最高分",S.best]],
  btns:[["开始掷机","primary",startRun]]});
resize();
window.addEventListener("resize",resize);
requestAnimationFrame(loop);
syncSaveFromServer();
})();
</script>
