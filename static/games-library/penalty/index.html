<style>

    pn-net（球网）、pn-post（门柱/手套）、pn-ball-spot（球面斑块）、pn-keeper2（我方门将服）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-on-primary:#FFF;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-field:#2F8A66;--g-field2:#379871;--g-line:#FFFFFF;--g-ball:#FFFFFF;--g-pn-net:#E7F1EB;--g-pn-post:#F7FAF8;--g-pn-ball-spot:#22303A;--g-pn-keeper2:#2F8FD6;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-field:#27604A;--g-field2:#2E6E55;--g-line:#E6E9E6;--g-ball:#E6E9E6;--g-pn-net:#5C8A76;--g-pn-post:#DCE5DE;--g-pn-ball-spot:#121B23;--g-pn-keeper2:#6BB4DE;color-scheme:dark }
  * { box-sizing: border-box; }

  .ov-stats b { display: block; font-size: 18px; color: var(--g-primary-deep); font-variant-numeric: tabular-nums; }
  .ov-stats span { font-size: 12px; color: var(--g-muted); }

  .ov-btns .btn:nth-child(2) { animation-delay: 40ms; }
  .ov-btns .btn:nth-child(3) { animation-delay: 80ms; }
  .stars { font-size: 28px; letter-spacing: 4px; color: var(--g-text); margin-bottom: 8px; animation: starpop .42s ease-out both; }
  .lvgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 12px; }
  .lvbtn { min-height: 44px; border: 1px solid var(--g-border); border-radius: 10px; background: var(--g-surface); color: var(--g-text); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform .14s ease-out, background .16s ease-out, border-color .16s ease-out; }

  .keepbar { display: flex; gap: 8px; margin-top: 10px; }

  .keepbtn:active { transform: scale(.96); background: var(--g-primary-soft); color: var(--g-on-soft); }
  .toolbar { display: flex; gap: 8px; margin-top: 10px; }
  .toolbar .btn { flex: 1; animation: rise .36s ease-out both; }
  .toolbar .btn:nth-child(1) { animation-delay: 160ms; }
  .toolbar .btn:nth-child(2) { animation-delay: 200ms; }
  .toolbar .btn:nth-child(3) { animation-delay: 240ms; }
  .btn { min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: var(--g-radius-btn); background: var(--g-btn-primary); color: var(--g-on-primary); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out; }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: var(--g-surface2); color: var(--g-text); border: 1px solid var(--g-border); }
  .btn:disabled { opacity: .4; }
  .swi { display: inline-block; vertical-align: -.14em; flex: none; }
  .foot { margin: 12px 2px 0; font-size: 12px; line-height: 1.6; color: var(--g-muted); text-align: center; }

  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes starpop { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},

/*PN-ENGINE-BEGIN*/
// 点球引擎：纯函数、无 DOM。确定性（同参数同结果）：全部随机来自种子流。
var PN_GOAL_HW=150,PN_GOAL_H=140,PN_D=380;
var PN_PLAYER_K={delay:.06,dive:430,cover:86,reach:160,saveZ:118};
function pnMulberry32(a){a|=0;return function(){a=(a+0x6d2b79f5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function pnKeeperParams(kl){
  return{delay:Math.max(.06,.42-.034*kl),dive:190+24*kl,cover:34+2.4*kl,reach:96+3.2*kl,
         saveZ:92+2.2*kl,predict:Math.min(.8,.22+.055*kl),follow:Math.max(.5,.9-.035*kl),
         bite:Math.max(.08,Math.min(.55,.55-.04*kl))};
}
function pnIsInt(v){return typeof v==="number"&&isFinite(v)&&Math.floor(v)===v}
function pnNormalize(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return null;
  if(typeof d.name!=="string"||!d.name.length||d.name.length>32)return null;
  if(!pnIsInt(d.seed)||d.seed<0||d.seed>2147483647)return null;
  if(!pnIsInt(d.rounds)||[3,5,7].indexOf(d.rounds)<0)return null;
  if(!pnIsInt(d.keeperLevel)||d.keeperLevel<1||d.keeperLevel>10)return null;
  if(!pnIsInt(d.shooterLevel)||d.shooterLevel<1||d.shooterLevel>10)return null;
  return{name:d.name,seed:d.seed,rounds:d.rounds,keeperLevel:d.keeperLevel,shooterLevel:d.shooterLevel};
}
function pnResolve(shot,k){
  if(Math.abs(shot.x)>PN_GOAL_HW||shot.z>PN_GOAL_H||shot.z<8)return{res:"miss",kx:0,side:k.side};
  var kx=0;
  if(k.commitX!==undefined)kx=k.commitX;
  else if(k.side!==0)kx=k.side*Math.min(k.reach,k.dive*Math.max(0,shot.T-k.delay));
  var okSide=k.side===0?Math.abs(shot.x)<=k.cover:(shot.x*k.side>0&&Math.abs(shot.x-kx)<=k.cover);
  if(okSide&&shot.z<=k.saveZ)return{res:"save",kx:kx,side:k.side};
  return{res:"goal",kx:kx,side:k.side};
}
function pnPlayerShot(x,power){
  var v=300+260*power;
  return{x:x,z:25+85*power,v:v,T:PN_D/v};
}
function pnBiteRoll(rng,kl){var kp=pnKeeperParams(kl);return rng()<kp.bite}
function pnPlayerKick(rng,kl,lean,shot,bite){
  var kp=pnKeeperParams(kl),side,commitX;
  if(bite===true){side=lean;commitX=side*kp.reach}
  else{
    var r=rng();
    if(r<kp.follow)side=lean;
    else{
      var r2=rng();
      if(r2<kp.predict)side=shot.x>=0?1:-1;
      else{var r3=rng();side=r3<.42?-1:(r3<.84?1:0)}
    }
  }
  var k={side:side,delay:kp.delay,dive:kp.dive,cover:kp.cover,reach:kp.reach,saveZ:kp.saveZ};
  if(commitX!==undefined)k.commitX=commitX;
  var out=pnResolve(shot,k);
  out.side=side;out.bite=(bite===true);out.kp=kp;
  return out;
}
function pnRivalKick(rng,sl,playerSide){
  var side=rng()<.5?-1:1;
  var x=side*(64+7*sl+20*rng());
  var z=22+95*rng();
  var e=(10-sl)*2.0*(rng()+rng()-1);
  var v=290+70*rng();
  var shot={x:x+e,z:z+e*.8,v:v,T:PN_D/v};
  var out=pnResolve(shot,{side:playerSide,delay:PN_PLAYER_K.delay,dive:PN_PLAYER_K.dive,
    cover:PN_PLAYER_K.cover,reach:PN_PLAYER_K.reach,saveZ:PN_PLAYER_K.saveZ});
  out.kp=PN_PLAYER_K;
  return{shot:shot,out:out};
}
/*PN-ENGINE-END*/

var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);

}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);

var LEVELS=DEFAULT_LEVELS;
/* ---------- 关卡数据（DB 下发优先，本地缓存兜底；任一条非法整批放弃） ---------- */
var LEVELS_KEY="sw.penalty.v1.levels",LEVELS_VER_KEY="sw.penalty.v1.levels.ver";
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){
      for(var i=0;i<list.length;i++)if(!pnNormalize(list[i]))return 0;
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function parsePenaltyLevels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={},i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    if(typeof item.dataJson!=="string"||item.dataJson.length>65536)return null;
    var d;try{d=JSON.parse(item.dataJson)}catch(e){return null}
    var c=pnNormalize(d);
    if(!c)return null;
    var no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1||seen[no])return null;
    seen[no]=1;
    list.push({no:no,name:c.name,seed:c.seed,rounds:c.rounds,keeperLevel:c.keeperLevel,shooterLevel:c.shooterLevel});
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels("penalty").then(function(res){
    var list=parsePenaltyLevels(res);
    if(!list||!list.length)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      startMatch(cur);
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写，取优合并） ---------- */
var KEY="sw.penalty.v1";
function loadSave(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&typeof s==="object")return{lv:Math.max(0,parseInt(s.lv,10)||0),stars:(s.stars&&typeof s.stars==="object")?s.stars:{},best:(s.best&&typeof s.best==="object")?s.best:{}};
  }catch(e){}
  return{lv:0,stars:{},best:{}};
}
var saveData=loadSave();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(saveData))}catch(e){}
  if(GB.available)GB.saveState("penalty",saveData).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("penalty").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),ch=false;
      var rl=parseInt(r.lv,10)||0;
      if(rl>saveData.lv){saveData.lv=Math.min(rl,LEVELS.length-1);ch=true}
      if(r.stars&&typeof r.stars==="object")for(var k in r.stars){var w=parseInt(r.stars[k],10)||0;if(w>=1&&w<=3&&w>(saveData.stars[k]||0)){saveData.stars[k]=w;ch=true}}
      if(r.best&&typeof r.best==="object")for(var k2 in r.best){var b=parseInt(r.best[k2],10)||0;if(b>0&&b>(saveData.best[k2]||0)){saveData.best[k2]=b;ch=true}}
      if(ch){save();syncHud()}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- DOM ---------- */
function $(id){return document.getElementById(id)}
var cv=$("cv"),ctx=cv.getContext("2d"),ov=$("ov"),ovCard=$("ovCard"),msgEl=$("msg");
var stLv=$("stLv"),stScore=$("stScore"),stRound=$("stRound"),stDiff=$("stDiff");
var keepbar=$("keepbar"),btnFeint=$("btnFeint");
/* ---------- 常量（渲染几何） ---------- */
var W=360,H=540,GOAL_L=30,GOAL_R=330,GOAL_Y=125,BAR_Y=13,ZSCALE=.8,BALL_X=180,BALL_Y=505;
/* ---------- 状态 ---------- */
var cur=0,cfg=null,rng=pnMulberry32(1),round=0,pg=0,og=0,lean=0,phase="idle";
var flight=null,flightHold=0,pendingBite=null,feinted=false,aim=null,activePtr=null;
var trail=[],lastTs=0;
/* ---------- 流程 ---------- */
function say(t){msgEl.textContent=t}
var _hud={};
function bump(el,key,val){
  if(_hud[key]===val)return;
  var first=_hud[key]===undefined;
  _hud[key]=val;
  if(first||!el)return;
  el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");
}
function syncHud(){
  var lvT=(cur+1)+"/"+LEVELS.length,scT=pg+":"+og,
      rdT=cfg?(Math.min(round+1,cfg.rounds)+"/"+cfg.rounds):"-",
      dfT=cfg?("门将"+cfg.keeperLevel+"·射手"+cfg.shooterLevel):"-";
  stLv.textContent=lvT;stScore.textContent=scT;stRound.textContent=rdT;stDiff.textContent=dfT;
  bump(stLv,"lv",lvT);bump(stScore,"sc",scT);bump(stRound,"rd",rdT);bump(stDiff,"df",dfT);
  btnFeint.disabled=phase!=="aim";
  keepbar.hidden=phase!=="keep";
}
function startMatch(idx){
  cur=idx;cfg=pnNormalize(LEVELS[idx])||LEVELS[idx];
  rng=pnMulberry32(cfg.seed);round=0;pg=0;og=0;flight=null;pendingBite=null;feinted=false;aim=null;
  trail=[];phase="over";hideOv();
  nextRound();
}
function nextRound(){
  round++;
  lean=rng()<.5?-1:1;
  pendingBite=null;feinted=false;flight=null;
  phase="aim";
  say(round>cfg.rounds?"突然死亡 · 一轮定胜负！":"第 "+Math.min(round,cfg.rounds)+" 轮 · 你射门");
  syncHud();
}
function playerShoot(power,aimX){
  var shot=pnPlayerShot(aimX,power);
  var out=pnPlayerKick(rng,cfg.keeperLevel,lean,shot,pendingBite);
  pendingBite=null;feinted=false;
  flight={who:"player",shot:shot,out:out,t:0,T:shot.T,trail:[]};
  phase="fly";syncHud();
}
function rivalShoot(side){
  var rk=pnRivalKick(rng,cfg.shooterLevel,side);
  flight={who:"rival",shot:rk.shot,out:rk.out,t:0,T:rk.shot.T,trail:[],defSide:side};
  phase="fly";syncHud();
}
function settleFlight(){
  var out=flight.out;
  if(flight.who==="player"){
    if(out.res==="goal"){pg++;say("进球！")}
    else if(out.res==="save"){say("被门将扑出！")}
    else{say("射偏了……")}
  }else{
    if(out.res==="goal"){og++;say("对方进球……")}
    else if(out.res==="save"){say("你扑出了点球！")}
    else{say("对方射偏了！")}
  }
  syncHud();
  flightHold=.85;
  phase="between";
}
function afterBetween(){
  var who=flight.who;
  flight=null;trail=[];
  if(who==="player"){phase="keep";say("轮到你守门 · 选择扑救方向");syncHud();return}
  // 对方踢完，进入本轮结算
  if(round>=cfg.rounds&&pg!==og){finishMatch();return}
  if(round>=cfg.rounds+9){pg=Math.max(pg,og+1);finishMatch();return}
  nextRound();
}
function finishMatch(){
  phase="over";
  var win=pg>og;
  var margin=pg-og;
  if(win){
    var stars=margin>=3?3:(margin>=2?2:1);
    if(og===0&&stars<3)stars++;
    if(stars>(saveData.stars[cur]||0))saveData.stars[cur]=stars;
    if(saveData.best[cur]===undefined||margin>saveData.best[cur])saveData.best[cur]=margin;
    if(cur+1>saveData.lv)saveData.lv=Math.min(cur+1,LEVELS.length-1);
    save();
    var total=0;for(var k in saveData.stars)total+=saveData.stars[k];
    if(GB.available)GB.reportScore("penalty",{metricValue:Math.min(saveData.lv+1,LEVELS.length),metricExtra:total}).catch(function(){});
    var sh="";for(var i=0;i<3;i++)sh+=SW_ICON(i<stars?"star":"star-o");
    var btns=[];
    if(cur<LEVELS.length-1)btns.push(["下一关","primary",function(){startMatch(cur+1)},"arrow-right"]);
    btns.push(["重赛本关","ghost",function(){startMatch(cur)},"rotate"]);
    btns.push(["选关","ghost",showLevels,"grid"]);
    showOv({kicker:"FULL TIME",title:"胜利！",stars:sh,text:"进球更多，拿下本轮点球大战。",
      stats:[["比分",pg+":"+og],["净胜球",margin],["轮次",Math.min(round,cfg.rounds)]],btns:btns});
  }else{
    showOv({kicker:"FULL TIME",title:"惜败",
      text:"比分 "+pg+":"+og+"。多观察门将重心，再试一次。",
      stats:[["比分",pg+":"+og],["净胜球",margin],["轮次",Math.min(round,cfg.rounds)]],
      btns:[["重赛本关","primary",function(){startMatch(cur)},"rotate"],["选关","ghost",showLevels,"grid"]]});
  }
}
/* ---------- 覆盖层 ---------- */
function showOv(o){
  ovCard.innerHTML="";
  if(o.kicker){var k=document.createElement("p");k.className="ov-kicker";k.textContent=o.kicker;ovCard.appendChild(k)}
  var h=document.createElement("h2");h.textContent=o.title;ovCard.appendChild(h);
  if(o.stars){var st=document.createElement("div");st.className="stars";st.innerHTML=o.stars;ovCard.appendChild(st)}
  if(o.text){var t=document.createElement("p");t.className="ov-text";t.textContent=o.text;ovCard.appendChild(t)}
  if(o.stats&&o.stats.length){
    var g=document.createElement("div");g.className="ov-stats";
    o.stats.forEach(function(s){var d=document.createElement("div");d.className="st";d.innerHTML="<b>"+s[1]+"</b><span>"+s[0]+"</span>";g.appendChild(d)});
    ovCard.appendChild(g);
  }
  var bs=document.createElement("div");bs.className="ov-btns";
  (o.btns||[]).forEach(function(b){
    var el=document.createElement("button");el.className="btn"+(b[1]==="ghost"?" ghost":"");
    if(b[3])el.innerHTML=window.SW_ICON(b[3]);
    el.appendChild(document.createTextNode(b[0]));
    el.addEventListener("click",b[2]);bs.appendChild(el);
  });
  ovCard.appendChild(bs);
  ov.classList.add("show");
}
function hideOv(){ov.classList.remove("show")}
function showLevels(){
  phase="over";hideOv();
  ovCard.innerHTML="";
  var h=document.createElement("h2");h.textContent="选择关卡";ovCard.appendChild(h);
  var tip=document.createElement("p");tip.className="ov-text";tip.textContent="赢球解锁下一关；对手门将与射手强度逐关递进。";ovCard.appendChild(tip);
  var g=document.createElement("div");g.className="lvgrid";
  for(var i=0;i<LEVELS.length;i++){
    (function(n){
      var b=document.createElement("button");b.className="lvbtn"+(n===cur?" cur":"");
      var st=saveData.stars[n]||0;
      b.textContent=String(n+1);
      b.title=LEVELS[n].name+(st?" · "+st+" 星":"");
      if(n>saveData.lv)b.disabled=true;
      b.addEventListener("click",function(){startMatch(n)});
      g.appendChild(b);
    })(i);
  }
  ovCard.appendChild(g);
  var bs=document.createElement("div");bs.className="ov-btns";
  var back=document.createElement("button");back.className="btn ghost";
  back.innerHTML=window.SW_ICON("arrow-left");back.appendChild(document.createTextNode("返回"));
  back.addEventListener("click",function(){startMatch(cur)});
  bs.appendChild(back);ovCard.appendChild(bs);
  ov.classList.add("show");
  syncHud();
}
/* ---------- 输入 ---------- */
function toWorld(e){
  var r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}
cv.addEventListener("pointerdown",function(e){
  if(phase!=="aim")return;
  var p=toWorld(e);
  aim={sx:p.x,sy:p.y,cx:p.x,cy:p.y};activePtr=e.pointerId;
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(!aim||e.pointerId!==activePtr)return;
  var p=toWorld(e);aim.cx=p.x;aim.cy=p.y;
  e.preventDefault();
});
cv.addEventListener("pointerup",function(e){
  if(!aim||e.pointerId!==activePtr)return;
  var dx=aim.cx-aim.sx,dy=aim.cy-aim.sy,len=Math.hypot(dx,dy);
  if(dy<-20&&len>24){
    var power=Math.min(1,len/230);
    var aimX=Math.max(-145,Math.min(145,dx));
    playerShoot(power,aimX);
  }
  aim=null;activePtr=null;
});
cv.addEventListener("pointercancel",function(e){aim=null;activePtr=null});
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
btnFeint.addEventListener("click",function(){
  if(phase!=="aim"||pendingBite!==null)return;
  feinted=true;
  pendingBite=pnBiteRoll(rng,cfg.keeperLevel)?true:false;
  if(pendingBite)say("门将吃晃了，重心跟向一侧！");
  else say("假动作晃动，门将没有提前移动");
});

/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
/* 五边形球面斑块（足球花纹） */
function pentagon(cx,cy,rad){
  ctx.beginPath();
  for(var i=0;i<5;i++){
    var a=-Math.PI/2+i*Math.PI*2/5,px=cx+Math.cos(a)*rad,py=cy+Math.sin(a)*rad;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();ctx.fill();
}
function drawField(){
  // 草皮：竖向渐变打底（中段受光），再叠明暗相间的草垄色带（面）
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.field2);g.addColorStop(.5,PAL.field);g.addColorStop(1,PAL.field2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(var y=0,i=0;y<H;y+=60,i++){
    ctx.fillStyle=i%2?colMix(PAL.field,WHITE,.07):colMix(PAL.field2,BLACK,.10);
    ctx.fillRect(0,y,W,60);
  }
  // 禁区：先铺淡色面，再用粗圆角白线勾边（带状边，不用细线）
  var top=Math.max(0,BAR_Y-40);
  ctx.fillStyle=PAL.line;ctx.globalAlpha=.07;
  ctx.fillRect(24,top,W-48,GOAL_Y+150-top);
  ctx.globalAlpha=.9;ctx.strokeStyle=PAL.line;ctx.lineWidth=5;ctx.lineJoin="round";ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(24,GOAL_Y+150);ctx.lineTo(24,top);ctx.lineTo(W-24,top);ctx.lineTo(W-24,GOAL_Y+150);ctx.stroke();
  ctx.globalAlpha=.55;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(BALL_X,GOAL_Y+60,52,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  ctx.globalAlpha=1;
  ctx.fillStyle=PAL.line;ctx.beginPath();ctx.arc(BALL_X,GOAL_Y+80,4,0,Math.PI*2);ctx.fill();
}
/* 门柱：渐变圆角杆 + 高光棱线 + 投影，轻立体 */
function drawPost(x,y,w,h,vert){
  var r=Math.max(.5,Math.min(3.5,w/2,h/2));
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.3)";ctx.shadowBlur=5;ctx.shadowOffsetY=2;
  var g=vert?ctx.createLinearGradient(x,y,x+w,y):ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,colMix(PAL.post,WHITE,.6));
  g.addColorStop(.5,PAL.post);
  g.addColorStop(1,colMix(PAL.post,BLACK,.22));
  ctx.fillStyle=g;rr(x,y,w,h,r);ctx.fill();
  ctx.restore();
  ctx.strokeStyle=colMix(PAL.post,WHITE,.85);ctx.lineWidth=1.2;
  rr(x+1,y+1,Math.max(1,w-2),Math.max(1,h-2),Math.max(.5,r-1));ctx.stroke();
}
function drawGoal(){
  var gw=GOAL_R-GOAL_L,gh=GOAL_Y-BAR_Y;
  // 网面（面，不是线）：上亮下暗的渐变，读得出「球门里侧」
  var g=ctx.createLinearGradient(0,BAR_Y,0,GOAL_Y);
  g.addColorStop(0,colMix(PAL.net,PAL.field2,.2));
  g.addColorStop(1,colMix(PAL.net,PAL.field2,.75));
  ctx.fillStyle=g;ctx.fillRect(GOAL_L,BAR_Y,gw,gh);
  // 网眼
  ctx.save();
  ctx.strokeStyle=PAL.net;ctx.globalAlpha=.8;ctx.lineWidth=1.1;
  for(var x=GOAL_L+13;x<GOAL_R-2;x+=13){ctx.beginPath();ctx.moveTo(x,BAR_Y+1);ctx.lineTo(x,GOAL_Y-1);ctx.stroke()}
  for(var y=BAR_Y+13;y<GOAL_Y-2;y+=13){ctx.beginPath();ctx.moveTo(GOAL_L+1,y);ctx.lineTo(GOAL_R-1,y);ctx.stroke()}
  ctx.restore();
  // 横梁在网面上的投影，给出纵深
  ctx.save();ctx.fillStyle=colMix(PAL.field2,BLACK,.45);ctx.globalAlpha=.35;
  ctx.fillRect(GOAL_L,GOAL_Y-9,gw,9);ctx.restore();
  drawPost(GOAL_L-3.5,BAR_Y,7,gh+7,true);
  drawPost(GOAL_R-3.5,BAR_Y,7,gh+7,true);
  drawPost(GOAL_L-3.5,BAR_Y-3.5,gw+7,7,false);
}
/* 门将：渐变球衣 + 球裤 + 手套 + 头，描边取球衣暗部而非文本色 */
function drawKeeperFig(x,y,kit,tilt){
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt||0);
  ctx.fillStyle="rgba(0,0,0,.22)";
  ctx.beginPath();ctx.ellipse(0,3,18,4.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=colShade(kit,-.34);
  rr(-12,-12,9,13,4);ctx.fill();
  rr(3,-12,9,13,4);ctx.fill();
  var g=ctx.createLinearGradient(0,-48,0,-10);
  g.addColorStop(0,colMix(kit,WHITE,.28));
  g.addColorStop(.45,kit);
  g.addColorStop(1,colShade(kit,-.26));
  ctx.fillStyle=g;rr(-14,-48,28,38,10);ctx.fill();
  ctx.lineWidth=1.6;ctx.strokeStyle=colShade(kit,-.42);rr(-14,-48,28,38,10);ctx.stroke();
  ctx.fillStyle=colMix(kit,WHITE,.5);ctx.globalAlpha=.5;
  rr(-11,-45,22,5,2.5);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle=colShade(kit,-.18);ctx.lineWidth=7;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-10,-40);ctx.lineTo(-26,-28);ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,-40);ctx.lineTo(26,-28);ctx.stroke();
  ctx.fillStyle=PAL.post;
  ctx.beginPath();ctx.arc(-27,-27,5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(27,-27,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=colMix(PAL.post,WHITE,.35);
  ctx.beginPath();ctx.arc(0,-56,8.5,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=1.4;ctx.strokeStyle=colShade(kit,-.5);
  ctx.beginPath();ctx.arc(0,-56,8.5,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=colShade(kit,-.1);
  ctx.beginPath();ctx.arc(0,-57.5,8.5,Math.PI*1.05,Math.PI*1.95);ctx.fill();
  ctx.restore();
}
function keeperRenderInfo(){
  if(flight&&phase!=="aim"){
    var f=flight,u=Math.min(1,f.t/f.T),kp=f.out.kp||PN_PLAYER_K;
    var arrive=(f.out.bite?0:Math.min(f.T,kp.delay+Math.abs(f.out.kx)/kp.dive));
    var prog=arrive<=0?1:Math.min(1,f.t/arrive);
    var kx=f.out.side*Math.abs(f.out.kx)*prog;
    return{x:BALL_X+kx,y:GOAL_Y,tilt:f.out.side*prog*.9,kit:f.who==="player"?PAL.danger:PAL.keeper2};
  }
  if(phase==="aim"){
    return{x:BALL_X+lean*8,y:GOAL_Y,tilt:lean*.12,kit:PAL.danger};
  }
  if(phase==="keep"){
    return{x:BALL_X,y:GOAL_Y,tilt:0,kit:PAL.keeper2};
  }
  return{x:BALL_X,y:GOAL_Y,tilt:0,kit:PAL.danger};
}
/* 足球：径向渐变球体 + 五边形斑块 + 高光，轻立体 */
function drawBallAt(x,y,r){
  ctx.fillStyle="rgba(0,0,0,.28)";
  ctx.beginPath();ctx.ellipse(x+2,y+r*.78,r*.95,r*.34,0,0,Math.PI*2);ctx.fill();
  var g=ctx.createRadialGradient(x-r*.36,y-r*.40,r*.12,x,y,r*1.02);
  g.addColorStop(0,colMix(PAL.ball,WHITE,.85));
  g.addColorStop(.42,PAL.ball);
  g.addColorStop(1,colShade(PAL.ball,-.30));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(x,y,r-.1,0,Math.PI*2);ctx.clip();
  ctx.fillStyle=PAL.ballSpot;ctx.globalAlpha=.92;
  pentagon(x,y,r*.30);
  pentagon(x+r*.62,y-r*.34,r*.22);
  pentagon(x-r*.62,y-r*.30,r*.22);
  pentagon(x+r*.55,y+r*.55,r*.20);
  pentagon(x-r*.50,y+r*.60,r*.20);
  ctx.restore();
  ctx.lineWidth=Math.max(1.2,r*.16);ctx.strokeStyle=colShade(PAL.ball,-.46);
  ctx.beginPath();ctx.arc(x,y,r-ctx.lineWidth*.5,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=.9;ctx.fillStyle=WHITE;
  ctx.beginPath();ctx.ellipse(x-r*.34,y-r*.42,r*.26,r*.15,-.55,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}
function drawFlight(){
  var f=flight,u=Math.min(1,f.t/f.T);
  var bx=BALL_X+f.shot.x*u;
  var by=GOAL_Y+(BALL_Y-GOAL_Y)*(1-u);
  var bz=f.shot.z*Math.sin(u*Math.PI/2);
  var sy=by-bz*ZSCALE;
  var r=7+6*u;
  if(f.out.res==="save"){bx=BALL_X+f.out.kx;by=GOAL_Y-r*.4;sy=by-bz*ZSCALE}
  f.trail.push({x:bx,y:sy,r:r});
  if(f.trail.length>16)f.trail.shift();
  ctx.fillStyle=PAL.ball;
  for(var i=0;i<f.trail.length-1;i++){
    ctx.globalAlpha=i/f.trail.length*.4;
    ctx.beginPath();ctx.arc(f.trail[i].x,f.trail[i].y,f.trail[i].r*.7,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  drawBallAt(bx,sy,r);
}
function drawAim(){
  if(!aim||phase!=="aim")return;
  var dx=aim.cx-aim.sx,dy=aim.cy-aim.sy,len=Math.hypot(dx,dy);
  if(dy>=-20||len<24)return;
  var power=Math.min(1,len/230),aimX=Math.max(-145,Math.min(145,dx));
  var pc=power<.55?PAL.primary:(power<.85?PAL.warning:PAL.danger);
  var z=25+85*power;
  var tx=BALL_X+aimX,ty=GOAL_Y-z*ZSCALE;
  ctx.save();
  ctx.strokeStyle=PAL.text;ctx.globalAlpha=.55;ctx.lineWidth=2.5;ctx.setLineDash([7,7]);
  ctx.beginPath();ctx.moveTo(BALL_X,BALL_Y-10);ctx.lineTo(tx,ty);ctx.stroke();
  ctx.setLineDash([]);ctx.globalAlpha=1;
  // 落点环：按力度变色并带辉光
  ctx.shadowColor=pc;ctx.shadowBlur=12;
  ctx.strokeStyle=pc;ctx.lineWidth=3.5;
  ctx.beginPath();ctx.arc(tx,ty,12,0,Math.PI*2);ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle=pc;ctx.beginPath();ctx.arc(tx,ty,3,0,Math.PI*2);ctx.fill();
  // 力度百分比：底色胶囊，保证在草皮上可读
  var label=Math.round(power*100)+"%";
  ctx.font="700 16px system-ui,sans-serif";
  var tw=ctx.measureText(label).width;
  ctx.fillStyle=PAL.surface;ctx.globalAlpha=.92;
  rr(BALL_X-tw/2-8,BALL_Y-42,tw+16,22,11);ctx.fill();
  ctx.globalAlpha=1;ctx.fillStyle=PAL.text;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(label,BALL_X,BALL_Y-31);
  // 力度条：渐变轨道 + 立体滑块
  var bw=200,bx=(W-bw)/2,by=H-20;
  ctx.fillStyle=PAL.surface;rr(bx,by,bw,8,4);ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle=PAL.border;rr(bx+.5,by+.5,bw-1,7,3.5);ctx.stroke();
  ctx.save();rr(bx+1.5,by+1.5,bw-3,5,2.5);ctx.clip();
  var fg=ctx.createLinearGradient(bx,0,bx+bw,0);
  fg.addColorStop(0,PAL.primary);fg.addColorStop(.65,PAL.warning);fg.addColorStop(1,PAL.danger);
  ctx.fillStyle=fg;ctx.fillRect(bx,by,bw*power,8);
  ctx.restore();
  ctx.fillStyle=PAL.surface;ctx.beginPath();ctx.arc(bx+bw*power,by+4,5.5,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle=colShade(PAL.surface,-.3);ctx.stroke();
  ctx.restore();
}
/* 待机提示：未拖拽时在球上方给一个上下浮动的箭头与胶囊文案，指明「上拖射门」 */
function drawAimHint(){
  if(phase!=="aim"||aim)return;
  var bob=window.__gRM?0:Math.sin(lastTs/380)*4;
  var x=BALL_X,y=BALL_Y-46+bob;
  ctx.save();
  ctx.strokeStyle=PAL.line;ctx.globalAlpha=.85;ctx.lineWidth=3;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();ctx.moveTo(x-9,y+8);ctx.lineTo(x,y);ctx.lineTo(x+9,y+8);ctx.stroke();
  ctx.globalAlpha=.6;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(x-7,y+16);ctx.lineTo(x,y+8);ctx.lineTo(x+7,y+16);ctx.stroke();
  var label="上拖射门";
  ctx.font="600 12px system-ui,sans-serif";
  var tw=ctx.measureText(label).width;
  ctx.fillStyle=PAL.surface;ctx.globalAlpha=.88;
  rr(x-tw/2-8,y-27,tw+16,18,9);ctx.fill();
  ctx.globalAlpha=1;ctx.fillStyle=PAL.text;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(label,x,y-18);
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  drawField();drawGoal();
  var ki=keeperRenderInfo();
  drawKeeperFig(ki.x,ki.y,ki.kit,ki.tilt);
  if(flight)drawFlight();
  else if(phase==="aim"||phase==="keep")drawBallAt(BALL_X,BALL_Y,8);
  drawAim();drawAimHint();
}
/* ---------- 主循环 ---------- */
function loop(ts){
  requestAnimationFrame(loop);
  var dt=lastTs?Math.min(.05,(ts-lastTs)/1000):0;
  lastTs=ts;
  var sp=window.__pnFast?3:1;
  if(phase==="fly"&&flight){
    flight.t+=dt*sp;
    if(flight.t>=flight.T){flight.t=flight.T;settleFlight()}
  }else if(phase==="between"){
    flightHold-=dt*sp;
    if(flightHold<=0)afterBetween();
  }
  draw();
}
/* ---------- 画布尺寸 ---------- */
var SC=1;
function resize(){
  var r=cv.getBoundingClientRect();
  if(r.width<10)return;
  var dpr=Math.max(1,Math.min(2.5,window.devicePixelRatio||1));
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  SC=r.width/W;
  ctx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",resize);
/* ---------- 测试钩子（不影响玩法） ---------- */
window.__pnEngine={
  normalize:pnNormalize,mulberry:pnMulberry32,playerShot:pnPlayerShot,playerKick:pnPlayerKick,
  rivalKick:pnRivalKick,biteRoll:pnBiteRoll,keeperParams:pnKeeperParams,resolve:pnResolve,
  consts:{W:W,H:H,GOAL_L:GOAL_L,GOAL_R:GOAL_R,GOAL_Y:GOAL_Y,BAR_Y:BAR_Y,BALL_X:BALL_X,BALL_Y:BALL_Y,PN_D:PN_D,PN_GOAL_HW:PN_GOAL_HW,PN_GOAL_H:PN_GOAL_H},
  state:function(){return{phase:phase,round:round,pg:pg,og:og,lean:lean,level:cur,keeperLevel:cfg?cfg.keeperLevel:0,shooterLevel:cfg?cfg.shooterLevel:0}},
  start:startMatch
};
/* ---------- 启动 ---------- */
resize();
startMatch(Math.min(saveData.lv,LEVELS.length-1));
requestAnimationFrame(loop);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  /* 按钮图标注入（内联 SVG，零外链；照抄本库 window.SW_ICON 范式） */
  function $(id){return document.getElementById(id)}
  var IC=[["btnFeint","feint"],["btnRetry","rotate"],["btnLevels","grid"],["btnL","arrow-left"],["btnC","target"],["btnR","arrow-right"]],i;
  for(i=0;i<IC.length;i++){var b=$(IC[i][0]);if(b)b.insertAdjacentHTML("afterbegin",window.SW_ICON(IC[i][1]))}
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
