window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<body>

<script>
/*X3-ENGINE-BEGIN*/
var PS=(function(){
"use strict";
/* ===== 世界常量（逻辑坐标，确定性固定步长） ===== */
var W=480,H=320,G=700,BR=10,GROUND=300,DT=1/120,FLY_GUARD=1200;
/* ===== 关卡（第 1 关手工锚点关；其余公式化生成 + 扫描收敛，坏关不进表） ===== */
var L1={name:"摆炮·01",px:130,py:56,L:110,A:0.9,om:3.0,tg:[216,244,26],walls:[],mw:0,st:[[150,150],[120,210]],difficulty:1};
function genLevel(i){
  var px=110+(i%3)*14,py=50+(i%4)*8;
  var L=96+(i%6)*7;
  var A=Math.min(1.15,0.72+i*0.011);
  var om=2.6+(i%7)*0.14;
  var tx=250+((i*31)%120),ty=190+((i*23)%90),tr=Math.max(17,25-Math.floor(i/10)*2);
  var walls=[];
  if(i>=8)walls.push([228+((i*17)%90),116+((i*29)%80),16,64+((i*13)%56)]);
  if(i>=20)walls.push([330+((i*19)%80),120+((i*37)%100),16,60+((i*11)%50)]);
  var mw=(i>=28)?0.9+(i%5)*0.35:0;
  var st=[[px+L*0.7,py+L*0.9]];
  if(i%2)st.push([tx-40,ty-46]);
  var lv={name:"摆炮·"+(i<9?"0":"")+(i+1),px:px,py:py,L:L,A:A,om:om,tg:[tx,ty,tr],walls:walls,mw:mw,st:st,difficulty:Math.min(6,1+Math.floor(i/7))};
  /* 收敛调整：相位扫描无解依次移墙→抬靶→落到顶点正下方（保证可达，坏关不进表） */
  for(var tries=0;tries<10;tries++){
    if(sweep(lv).n>0)break;
    if(lv.walls.length)lv.walls.pop();
    else if(tries<7){lv.tg[1]-=16;lv.tg[2]+=2;}
    else{
      lv.tg[0]=px+L*Math.sin(A);
      lv.tg[1]=py+L*Math.cos(A)+80;
      lv.tg[2]+=2;
    }
  }
  return lv;
}
/* 摆锤运动：θ=A·cos(ωt)，起点为最高摆幅 */
function ballPos(lv,th){return {x:lv.px+lv.L*Math.sin(th),y:lv.py+lv.L*Math.cos(th)};}
function releaseState(lv,t){
  var th=lv.A*Math.cos(lv.om*t);
  var dth=-lv.A*lv.om*Math.sin(lv.om*t);
  var p=ballPos(lv,th);
  return {x:p.x,y:p.y,vx:lv.L*Math.cos(th)*dth,vy:-lv.L*Math.sin(th)*dth,ft:0,hit:false};
}
/* 墙位置（mw>0 时水平往复，确定性时间函数） */
function wallAt(lv,w,t){
  var x=w[0];
  if(lv.mw>0)x+=Math.sin(t*lv.mw)*34;
  return [x,w[1],w[2],w[3]];
}
function circRect(cx,cy,r,rc){
  var nx=Math.max(rc[0],Math.min(cx,rc[0]+rc[2]));
  var ny=Math.max(rc[1],Math.min(cy,rc[1]+rc[3]));
  var dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
/* 单步飞行动力学，返回 "fly"|"wall"|"ground"|"out"|"win" */
function stepFlight(lv,b){
  b.vy+=G*DT;b.x+=b.vx*DT;b.y+=b.vy*DT;b.ft+=DT;
  for(var i=0;i<lv.walls.length;i++){
    if(circRect(b.x,b.y,BR,wallAt(lv,lv.walls[i],b.ft)))return "wall";
  }
  var dx=b.x-lv.tg[0],dy=b.y-lv.tg[1];
  if(dx*dx+dy*dy<(BR+lv.tg[2])*(BR+lv.tg[2])){b.hit=true;return "win";}
  if(b.y>GROUND)return "ground";
  if(b.x<-40||b.x>W+40)return "out";
  return "fly";
}
/* ===== 验证器：释放相位扫描（独立于玩家操作路径） ===== */
function sweep(lv){
  var found=0,first=-1,per=2*Math.PI/lv.om;
  for(var s=0;s<360;s++){
    var b=releaseState(lv,(s/360)*per);
    var r="fly",guard=FLY_GUARD;
    while(r==="fly"&&guard-->0)r=stepFlight(lv,b);
    if(r==="win"){found++;if(first<0)first=s;}
  }
  return {n:found,phase:first};
}
var LEVELS=[L1];
for(var gi=1;gi<40;gi++)LEVELS.push(genLevel(gi));
function verifyAll(){
  var res=[],i;
  for(i=0;i<LEVELS.length;i++)res.push({ok:sweep(LEVELS[i]).n>0});
  return res;
}
function selfTest(){
  var out=[];
  /* 锚点1：第 1 关最高点松脱（v≈0）→ 球竖直下落砸中正下方靶（手工推演：起点 x=130+110·sin0.9≈216=靶心） */
  var b1=releaseState(L1,0);
  var dropX=L1.px+L1.L*Math.sin(L1.A);
  var r1="fly",g1=FLY_GUARD;
  while(r1==="fly"&&g1-->0)r1=stepFlight(L1,b1);
  out.push({name:"锚点1·第1关顶点松脱直落命中",pass:r1==="win"&&Math.abs(dropX-216)<3});
  /* 锚点2：合成密封箱关（靶被四面包死）→ 扫描判定无解 */
  var box={name:"box",px:130,py:56,L:110,A:0.9,om:3,tg:[300,250,24],mw:0,st:[],
    walls:[[244,196,120,14],[244,210,14,100],[358,210,14,100],[244,296,142,14]]};
  out.push({name:"锚点2·密封箱内靶扫描判无解",pass:sweep(box).n===0});
  /* 锚点3：全部 40 关扫描有解 */
  var all=verifyAll(),bad=[];
  for(var i=0;i<all.length;i++)if(!all[i].ok)bad.push(i+1);
  out.push({name:"全关验证·40关相位扫描有解",pass:bad.length===0,bad:bad.join(",")});
  return out;
}
return {W:W,H:H,G:G,BR:BR,GROUND:GROUND,DT:DT,LEVELS:LEVELS,
  ballPos:ballPos,releaseState:releaseState,wallAt:wallAt,stepFlight:stepFlight,
  sweep:sweep,verifyAll:verifyAll,selfTest:selfTest};
})();
window.PS=PS;
/*X3-ENGINE-END*/
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（DB 下发优先：整表相位扫描通过才接受；本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="pendulum-shot",SAVE_KEY="sw.pendulumshot.v1";
var DEFAULT_LEVELS=PS.LEVELS;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!(d.px>0&&d.px<470&&d.py>0&&d.py<200))return false;
  if(!(d.L>=60&&d.L<=200))return false;
  if(!(d.A>0.2&&d.A<=1.3))return false;
  if(!(d.om>=1.4&&d.om<=6))return false;
  if(!Array.isArray(d.tg)||d.tg.length!==3)return false;
  if(!Array.isArray(d.walls))return false;
  if(d.mw<0||d.mw>4)return false;
  if(!Array.isArray(d.st))return false;
  var probe=PS.sweep({px:d.px,py:d.py,L:d.L,A:d.A,om:d.om,tg:d.tg,walls:d.walls,mw:d.mw,st:d.st});
  return probe.n>0;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  for(var i=0;i<list.length;i++)if(!validLevelData(list[i]))return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){
      var ok=true;
      for(var i=0;i<list.length;i++)if(!validLevelData(list[i])){ok=false;break;}
      if(ok){LEVELS=list;return v;}
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    if(!res||!Array.isArray(res.levels)||!res.levels.length)return;
    var list=[],seen={};
    for(var i=0;i<res.levels.length;i++){
      var row=res.levels[i];
      if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return;
      var d;try{d=JSON.parse(row.dataJson);}catch(e){return;}
      if(seen[d&&d.name])return;seen[d&&d.name]=1;
      list.push(d);
    }
    if(list.length&&applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";$("ovBtn").style.background="var(--g-surface2)";$("ovBtn").style.color="var(--g-text)";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),
    sky1:v("--g-st-ps-sky1"),sky2:v("--g-st-ps-sky2"),
    gnd:v("--g-st-ps-gnd"),gnd2:v("--g-st-ps-gnd2"),
    wall:v("--g-st-ps-wall"),wall2:v("--g-st-ps-wall2"),
    rope:v("--g-st-ps-rope"),ball:v("--g-st-ps-ball"),ball2:v("--g-st-ps-ball2")};
}
window.__gOnTheme=function(){palLoad()};
palLoad();
/* ---------- 状态（续玩：lv 起步即存档关） ---------- */
var lv=save.lv,L=null,mode="aim",t=0,ball=null,trail=[],shots=0,stars=0,msgT=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=PS.W,H=PS.H;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  for(var si=0;si<L.st.length;si++)L.st[si].got=false;
  mode="aim";t=0;ball=null;trail=[];shots=0;stars=0;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=(L.mw>0?"有活动墙 · ":"")+"靶径 "+L.tg[2];
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stShots").textContent=0;$("stStars").textContent=0;
  updBtns();
  hideOverlay();
  say("摆锤荡起来后点画布松脱，砸中靶心");
}
function updBtns(){$("btnFire").disabled=mode!=="aim";}
function fire(){
  if(mode!=="aim")return;
  ball=PS.releaseState(L,t);
  ball.releaseX0=ball.x;
  trail=[];
  mode="fly";shots++;
  $("stShots").textContent=shots;
  updBtns();
}
function endFlight(res){
  if(res==="win"){
    var got=stars;
    if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:got}).catch(function(){});
    $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"正中靶心！";
    $("ovDesc").innerHTML="第 "+shots+" 发命中"+(got?"，顺带摘到 "+got+" 颗星":"")+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
    $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
    $("ovBtn").style.background="var(--g-btn-primary)";$("ovBtn").style.color="#fff";
    $("overlay").classList.add("show");
    mode="done";updBtns();
  }else{
    say(res==="wall"?"炮弹撞墙了":res==="ground"?"炮弹落地了":"炮弹飞出边界");
    mode="aim";ball=null;updBtns();
  }
}
/* ---------- 绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.height=Math.round(w*H/W)+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*H/W*dpr);
  var sc=w/W;
  ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
}
function rr(x,y,w2,h2,r){
  r=Math.min(r,w2/2,h2/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);
  ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();
}
function draw(ts){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.sky1);g.addColorStop(1,PAL.sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!L)return;
  /* 地面 */
  ctx.fillStyle=PAL.gnd;ctx.fillRect(0,PS.GROUND,W,H-PS.GROUND);
  ctx.fillStyle=PAL.gnd2;ctx.fillRect(0,PS.GROUND,W,4);
  /* 墙 */
  for(var i=0;i<L.walls.length;i++){
    var wc=PS.wallAt(L,L.walls[i],mode==="fly"&&ball?ball.ft:t);
    ctx.fillStyle=PAL.wall;
    rr(wc[0],wc[1],wc[2],wc[3],4);ctx.fill();
    ctx.strokeStyle=PAL.wall2;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=PAL.wall2;
    for(var by=wc[1]+8;by<wc[1]+wc[3]-4;by+=12)ctx.fillRect(wc[0]+3,by,wc[2]-6,2);
  }
  /* 靶 */
  ctx.fillStyle=PAL.surface;
  ctx.beginPath();ctx.arc(L.tg[0],L.tg[1],L.tg[2],0,7);ctx.fill();
  ctx.strokeStyle=PAL.danger;ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle=PAL.danger;
  ctx.beginPath();ctx.arc(L.tg[0],L.tg[1],L.tg[2]*0.4,0,7);ctx.fill();
  /* 星星 */
  for(var s=0;s<L.st.length;s++){
    var sp=L.st[s];
    if(sp.got)continue;
    drawStar(sp[0],sp[1],8,PAL.warning);
  }
  /* 摆绳与球（aim 模式） */
  var bp,th;
  if(mode==="aim"){
    th=L.A*Math.cos(L.om*t);
    bp=PS.ballPos(L,th);
    ctx.strokeStyle=PAL.rope;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(L.px,L.py);ctx.lineTo(bp.x,bp.y);ctx.stroke();
    ctx.fillStyle=PAL.wall2;
    ctx.beginPath();ctx.arc(L.px,L.py,5,0,7);ctx.fill();
    drawBall(bp.x,bp.y);
  }
  /* 弹道拖尾与飞行球 */
  if(ball){
    ctx.fillStyle=PAL.ball2;
    for(var ti=0;ti<trail.length;ti+=2){
      ctx.globalAlpha=0.35*(ti/trail.length);
      ctx.beginPath();ctx.arc(trail[ti][0],trail[ti][1],3,0,7);ctx.fill();
    }
    ctx.globalAlpha=1;
    drawBall(ball.x,ball.y);
  }
}
function drawBall(x,y){
  ctx.fillStyle=PAL.ball;
  ctx.beginPath();ctx.arc(x,y,PS.BR,0,7);ctx.fill();
  ctx.strokeStyle=PAL.ball2;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.75)";   // 恒白高光
  ctx.beginPath();ctx.arc(x-3,y-3,3,0,7);ctx.fill();
}
function drawStar(x,y,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  for(var i=0;i<10;i++){
    var a=-Math.PI/2+i*Math.PI/5;
    var rr2=i%2?r*0.45:r;
    ctx[i?"lineTo":"moveTo"](x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);
  }
  ctx.closePath();ctx.fill();
}
/* ---------- 主循环（切后台停续，dt 钳制防穿透） ---------- */
var rafId=0,last=0,acc=0;
function frame(ts){
  rafId=requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.05,(ts-last)/1000||0);
  last=ts;
  if(mode==="aim"){
    acc+=dt;
    while(acc>=PS.DT){t+=PS.DT;acc-=PS.DT;}
  }else if(mode==="fly"&&ball){
    acc+=dt;
    var n=0,r="fly";
    while(acc>=PS.DT&&n++<8){
      acc-=PS.DT;
      r=PS.stepFlight(L,ball);
      trail.push([ball.x,ball.y]);
      if(trail.length>90)trail.shift();
      /* 摘星 */
      for(var s=0;s<L.st.length;s++){
        var sp=L.st[s];
        if(!sp.got&&Math.hypot(ball.x-sp[0],ball.y-sp[1])<PS.BR+9){
          sp.got=true;stars++;$("stStars").textContent=stars;
        }
      }
      if(r!=="fly")break;
    }
    if(r!=="fly")endFlight(r);
  }
  draw(ts);
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){if(rafId){cancelAnimationFrame(rafId);rafId=0;}}
  else if(!rafId){last=0;rafId=requestAnimationFrame(frame);}
});
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){fire();e.preventDefault();});
cv.addEventListener("pointercancel",function(){});
$("btnFire").addEventListener("click",fire);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  if(mode==="done"){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }else loadLevel(lv);
  $("ovBtn").style.background="var(--g-surface2)";$("ovBtn").style.color="var(--g-text)";
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k===" "||k==="Enter"){e.preventDefault();fire();}
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
window.addEventListener("resize",resize);
/* ---------- 启动（loadLevel 以存档关续玩） ---------- */
loadLevel(save.lv);resize();rafId=requestAnimationFrame(frame);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
