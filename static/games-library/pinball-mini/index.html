  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-on-primary:#FFF;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gap:16px;--g-st-deck:#2F4A3E;--g-st-deck2:#263C32;--g-st-rail:#C9B691;--g-st-ball:#F2F2EC;color-scheme:light }

  .btn.ghost { background: var(--g-surface); color: var(--g-text); border: 1px solid var(--g-border); }

  .overlay.show { display: flex; animation: fadein .2s ease-out; }

  .card { width: 100%; max-width: 320px; max-height: 100%; overflow: auto; background: var(--g-surface); border: 1px solid var(--g-border); border-radius: var(--g-radius); box-shadow: var(--g-shadow); padding: 16px; }

  /* S2: 动效敏感用户降级（动效层指令，不受 §4 主题层 matchMedia 禁令约束） */

try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 常量与存档 ---------- */
var MW=480,MH=640,R=9,GRAV=560;
var KEY="sw.pinball-mini.v1";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function loadSave(){try{var s=JSON.parse(lsGet(KEY))||{};return{best:parseInt(s.best,10)||0}}catch(e){return{best:0}}}
var save=loadSave();
function persist(){
  try{lsSet(KEY,JSON.stringify(save))}catch(e){}
  if(GB.available)GB.saveState("pinball-mini",save).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("pinball-mini").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rb=parseInt(JSON.parse(res.stateJson).best,10)||0;
      if(rb>save.best){save.best=rb;S.best=rb;persist();syncHud();}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 调色板:CSS变量 → canvas ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL.bg=v("--g-bg");PAL.surface=v("--g-surface");PAL.surface2=v("--g-surface2");PAL.border=v("--g-border");
  PAL.text=v("--g-text");PAL.muted=v("--g-muted");PAL.faint=v("--g-faint");
  PAL.primary=v("--g-primary");PAL.deep=v("--g-primary-deep");PAL.soft=v("--g-primary-soft");PAL.onSoft=v("--g-on-soft");
  PAL.danger=v("--g-danger");PAL.warning=v("--g-warning");PAL.success=v("--g-success");PAL.water=v("--g-water");
  PAL.deck=v("--g-st-deck");PAL.deck2=v("--g-st-deck2");PAL.rail=v("--g-st-rail");PAL.ball=v("--g-st-ball");
}
window.__gOnTheme=function(){palLoad();draw();};
/* ---------- DOM ---------- */
function $(id){return document.getElementById(id)}
var cv=$("cv"),ctx=cv.getContext("2d"),ov=$("ov");
var hudScore=$("hudScore"),hudBall=$("hudBall"),hudBest=$("hudBest");
var ovK=$("ovK"),ovT=$("ovT"),ovX=$("ovX"),ovS=$("ovS"),ovB=$("ovB");
/* ---------- 桌面几何 ---------- */
var LANE_X=428;
var WALLS=[
  [14,150,14,MH-140],        // 左墙
  [MW-14,60,MW-14,MH-24],    // 右外墙
  [14,150,MW-14,60],         // 斜顶
  [424,64,466,120],          // 发射道顶导流板（\ 向，把上升球折向左上场）
  [LANE_X,170,LANE_X,MH-24], // 发射道内壁
  [LANE_X,MH-24,MW-14,MH-24],// 发射道底
  [14,MH-140,160,MH-52],     // 左下导轨
  [LANE_X,MH-140,320,MH-52], // 右下导轨
  [160,MH-52,164,MH-96],     // 左flipper护墙
  [320,MH-52,316,MH-96]      // 右flipper护墙
];
var SLINGS=[
  {a:[150,MH-46],b:[196,MH-100],cd:0},
  {a:[MW-150,MH-46],b:[MW-196,MH-100],cd:0}
];
var BUMPERS=[[150,160],[240,120],[330,160]];
var TARGETS=[{x:170,y:265,cd:0},{x:240,y:225,cd:0},{x:310,y:265,cd:0}];
var PIV_L=[160,MH-58],PIV_R=[320,MH-58],FLEN=62;
var REST_A=0.5,UP_A=-0.55;
/* ---------- 状态 ---------- */
var S={phase:"menu",paused:false,score:0,best:save.best,ballsLeft:3,
  balls:[],lamps:[false,false,false],multiT:0,
  fl:{l:{a:REST_A,w:0,press:false},r:{a:REST_A,w:0,press:false}},
  plunger:0,charging:false,parts:[],floats:[],t:0};
function syncHud(){
  hudScore.textContent=String(S.score);
  hudBall.textContent=String(S.ballsLeft);
  hudBest.textContent=String(S.best);
}
function startRun(){
  S.phase="run";S.paused=false;S.score=0;S.ballsLeft=3;
  S.balls=[];S.lamps=[false,false,false];S.multiT=0;
  S.parts.length=0;S.floats.length=0;
  spawnWaiting();
  syncHud();hideOv();
}
function spawnWaiting(){
  S.balls.push({x:(LANE_X+MW-14)/2,y:MH-40,vx:0,vy:0,wait:true});
}
function endRun(){
  S.phase="over";
  var isRec=S.score>save.best&&S.score>0;
  if(isRec){save.best=S.score;S.best=S.score;persist();syncHud();}
  if(GB.available)GB.reportScore("pinball-mini",{metricValue:S.best}).catch(function(){});
  syncHud();
  showOv({k:"GAME OVER",t:"球打完了",
    x:isRec?"新纪录！多球期间分数翻着涨，先吃灯再冲分。":"三灯全亮开出多球；挡板拍得越正，球回得越有劲。",
    stats:[["本局",S.score],["最高分",S.best],["多球次数",S.multiN||0]],
    btns:[["再来一局","primary",startRun]]});
}
/* ---------- 覆盖层 ---------- */
function showOv(o){
  ovK.textContent=o.k||"";ovT.textContent=o.t||"";ovX.textContent=o.x||"";
  var st=o.stats||[];
  ovS.style.display=st.length?"grid":"none";
  ovS.innerHTML=st.map(function(s){return '<div class="st"><b>'+s[1]+"</b><span>"+s[0]+"</span></div>"}).join("");
  ovB.innerHTML="";
  (o.btns||[]).forEach(function(b){
    var el=document.createElement("button");
    el.className="btn"+(b[1]==="ghost"?" ghost":"");
    el.textContent=b[0];el.addEventListener("click",b[2]);ovB.appendChild(el);
  });
  ov.classList.add("show");
}
function hideOv(){ov.classList.remove("show")}
function pauseGame(){
  if(S.phase!=="run"||S.paused)return;
  S.paused=true;
  showOv({k:"PAUSED",t:"已暂停",x:"台面停摆，回来接着打。",
    btns:[["继续","primary",function(){S.paused=false;hideOv()}],["重开","ghost",startRun]]});
}
/* ---------- 得分 ---------- */
function addScore(n,x,y,txt){
  S.score+=n;syncHud();
  if(txt)S.floats.push({x:x,y:y,txt:txt,col:PAL.onSoft,t:.8});
}
/* ---------- 物理 ---------- */
function flipTip(fl,piv,side){
  var c=Math.cos(fl.a)*FLEN,s=Math.sin(fl.a)*FLEN;
  return side==="L"?[piv[0]+c,piv[1]+s]:[piv[0]-c,piv[1]+s];
}
function collideSeg(b,ax,ay,bx,by,e,svx,svy){
  var dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
  if(l2===0)return null;
  var t=((b.x-ax)*dx+(b.y-ay)*dy)/l2;
  t=t<0?0:(t>1?1:t);
  var px=ax+dx*t,py=ay+dy*t;
  var nx=b.x-px,ny=b.y-py,d=Math.sqrt(nx*nx+ny*ny);
  if(!(d<b.r))return null;
  if(d<0.001){nx=0;ny=-1}else{nx/=d;ny/=d}
  b.x=px+nx*(b.r+0.3);b.y=py+ny*(b.r+0.3);
  var rvx=b.vx-(svx||0),rvy=b.vy-(svy||0);
  var vn=rvx*nx+rvy*ny;
  if(vn<0){
    rvx-=(1+e)*vn*nx;
    rvy-=(1+e)*vn*ny;
    b.vx=rvx+(svx||0);b.vy=rvy+(svy||0);
    return{nx:nx,ny:ny,px:px,py:py};
  }
  return null;
}
function circleHit(b,cx,cy,cr){
  var dx=b.x-cx,dy=b.y-cy,d=Math.sqrt(dx*dx+dy*dy);
  if(!(d<b.r+cr))return null;
  if(d<0.001){dx=0;dy=-1}else{dx/=d;dy/=d}
  b.x=cx+dx*(b.r+cr+0.3);b.y=cy+dy*(b.r+cr+0.3);
  return{nx:dx,ny:dy};
}
function ballBall(a,b){
  var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy);
  if(!(d<R+R)||d===0)return;
  var nx=dx/d,ny=dy/d,ov=(R+R-d)/2;
  a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
  var rvn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(rvn<0){
    var j=-(1+0.85)*rvn/2;
    a.vx-=j*nx;a.vy-=j*ny;b.vx+=j*nx;b.vy+=j*ny;
  }
}
function flipperCollide(b,piv,tip,fl){
  var ax=piv[0],ay=piv[1];
  var dx=tip[0]-ax,dy=tip[1]-ay,l2=dx*dx+dy*dy;
  if(l2===0)return;
  var t=((b.x-ax)*dx+(b.y-ay)*dy)/l2;
  t=t<0?0:(t>1?1:t);
  var px=ax+dx*t,py=ay+dy*t;
  var nx=b.x-px,ny=b.y-py,d=Math.sqrt(nx*nx+ny*ny);
  if(!(d<b.r))return;
  if(d<0.001){nx=0;ny=-1}else{nx/=d;ny/=d}
  b.x=px+nx*(b.r+0.3);b.y=py+ny*(b.r+0.3);
  var k=Math.sqrt((px-ax)*(px-ax)+(py-ay)*(py-ay))/Math.sqrt(l2);
  var svx=fl.tvx*k,svy=fl.tvy*k;
  var rvx=b.vx-svx,rvy=b.vy-svy;
  var vn=rvx*nx+rvy*ny;
  if(vn<0){
    rvx-=(1+0.45)*vn*nx;
    rvy-=(1+0.45)*vn*ny;
    b.vx=rvx+svx;b.vy=rvy+svy;
  }
}
function stepBall(b,dt){
  if(b.wait)return;
  b.vy+=GRAV*dt;
  b.vx*=1-0.06*dt;
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  var i,h;
  for(i=0;i<WALLS.length;i++){
    var w=WALLS[i];
    collideSeg(b,w[0],w[1],w[2],w[3],0.42,0,0);
  }
  //挡板（尖端速度作表面速度）
  var fls=[["L",PIV_L,S.fl.l],["R",PIV_R,S.fl.r]];
  for(i=0;i<2;i++){
    var piv=fls[i][1],fl=fls[i][2];
    flipperCollide(b,piv,flipTip(fl,piv,fls[i][0]),fl);
  }
  //弹弓
  for(i=0;i<SLINGS.length;i++){
    var sg=SLINGS[i];
    if(sg.cd>0){sg.cd-=dt}
    h=collideSeg(b,sg.a[0],sg.a[1],sg.b[0],sg.b[1],0.5,0,0);
    if(h&&sg.cd<=0){
      sg.cd=0.18;
      b.vx+=h.nx*240;b.vy+=h.ny*240;
      addScore(10,sg.a[0],sg.a[1]-10,"+10");
    }
  }
  //弹射柱（径向踢出保留少量切向 + 抖动，避免确定性循环）
  for(i=0;i<BUMPERS.length;i++){
    h=circleHit(b,BUMPERS[i][0],BUMPERS[i][1],22);
    if(h){
      var jx=h.nx+(Math.random()-.5)*0.3,jy=h.ny+(Math.random()-.5)*0.3;
      var jl=Math.sqrt(jx*jx+jy*jy);jx/=jl;jy/=jl;
      var sp0=290+Math.random()*60;
      b.vx=jx*sp0+b.vx*0.25;b.vy=jy*sp0+b.vy*0.25;
      addScore(50,BUMPERS[i][0],BUMPERS[i][1]-26,"+50");
      puff(BUMPERS[i][0],BUMPERS[i][1],5,PAL.warning,60);
    }
  }
  //灯位（带冷却，防同帧连触发）
  for(i=0;i<TARGETS.length;i++){
    var tg=TARGETS[i];
    if(tg.cd>0)tg.cd-=dt;
    h=circleHit(b,tg.x,tg.y,11);
    if(h&&tg.cd<=0){
      tg.cd=0.25;
      if(!S.lamps[i]){
        S.lamps[i]=true;
        addScore(100,tg.x,tg.y-18,"灯 +100");
        b.vx+=h.nx*120;b.vy+=h.ny*120;
        if(S.lamps[0]&&S.lamps[1]&&S.lamps[2]){
          S.lamps=[false,false,false];
          S.multiT=12;S.multiN=(S.multiN||0)+1;
          addScore(500,240,300,"多球 +500");
          if(S.balls.length<3)S.balls.push({x:240,y:210,vx:(Math.random()<.5?-1:1)*70,vy:-160,wait:false});
          S.floats.push({x:240,y:330,txt:"MULTIBALL!",col:PAL.warning,t:1.4});
        }
      }else{
        b.vx+=h.nx*90;b.vy+=h.ny*90;
      }
    }
  }
  //球与球
  for(i=0;i<S.balls.length;i++)if(S.balls[i]!==b&&!S.balls[i].wait)ballBall(b,S.balls[i]);
  //防卡死
  var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
  b.stuck=(sp<9&&b.y<MH-90)?(b.stuck||0)+dt:0;
  if(b.stuck>1.6){b.vy+=70;b.stuck=0}
  //发射道底等待：掉回发射道自动转为待发
  if(b.x>LANE_X+4&&b.y>MH-70&&sp<12){
    b.wait=true;b.vx=0;b.vy=0;b.x=(LANE_X+MW-14)/2;b.y=MH-40;
  }
  //落袋
  if(b.y>MH+40)return;
}
function launch(){
  for(var i=0;i<S.balls.length;i++){
    var b=S.balls[i];
    if(b.wait){
      var p=Math.min(1,S.plunger);
      b.wait=false;
      b.vy=-(660+520*p);
      S.plunger=0;S.charging=false;
      return;
    }
  }
}
function step(dt){
  S.t+=dt;
  //挡板角速度 + 尖端速度（有限差分）
  var fls=[["L",PIV_L,S.fl.l],["R",PIV_R,S.fl.r]];
  for(var i=0;i<2;i++){
    var fl=fls[i][2];
    var tgt=fl.press?UP_A:REST_A;
    var rate=fl.press?16:10;
    var na=fl.a+Math.max(-rate*dt,Math.min(rate*dt,tgt-fl.a));
    var otip=flipTip({a:fl.a},fls[i][1],fls[i][0]);
    var ntip=flipTip({a:na},fls[i][1],fls[i][0]);
    fl.tvx=(ntip[0]-otip[0])/Math.max(dt,0.001);
    fl.tvy=(ntip[1]-otip[1])/Math.max(dt,0.001);
    fl.w=(na-fl.a)/Math.max(dt,0.001);
    fl.a=na;
  }
  if(S.charging)S.plunger=Math.min(1,S.plunger+dt*1.1);
  if(S.multiT>0){S.multiT-=dt;if(S.multiT<=0)S.multiT=0}
  for(i=S.balls.length-1;i>=0;i--){
    var b=S.balls[i];
    if(!isFinite(b.x+b.y+b.vx+b.vy)){S.balls.splice(i,1);continue}
    stepBall(b,dt);
    if(b.y>MH+40)S.balls.splice(i,1);
  }
  if(S.phase==="run"&&S.balls.length===0){
    S.ballsLeft--;
    syncHud();
    if(S.ballsLeft<=0){endRun();return}
    spawnWaiting();
  }
  for(i=S.parts.length-1;i>=0;i--){
    var q=S.parts[i];
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;q.life-=dt;
    if(q.life<=0)S.parts.splice(i,1);
  }
  for(i=S.floats.length-1;i>=0;i--){
    var f=S.floats[i];f.y-=30*dt;f.t-=dt;
    if(f.t<=0)S.floats.splice(i,1);
  }
}
function puff(x,y,n,col,spd){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28,sp=(spd||60)*(0.3+Math.random());
    S.parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.35+Math.random()*.3,max:.65,r:1.4+Math.random()*2,col:col});
  }
}
/* ---------- 绘制 ---------- */
var SC=1;
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  SC=r.width/MW;
  ctx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
}
function draw(){
  //台面
  ctx.fillStyle=PAL.deck;
  ctx.beginPath();ctx.rect(0,0,MW,MH);ctx.fill();
  ctx.fillStyle=PAL.deck2;
  ctx.beginPath();ctx.arc(240,250,150,0,Math.PI*2);ctx.fill();
  //墙轨
  ctx.strokeStyle=PAL.rail;ctx.lineWidth=9;ctx.lineCap="round";
  for(var i=0;i<WALLS.length;i++){
    var w=WALLS[i];
    ctx.beginPath();ctx.moveTo(w[0],w[1]);ctx.lineTo(w[2],w[3]);ctx.stroke();
  }
  //弹弓
  for(i=0;i<SLINGS.length;i++){
    var sg=SLINGS[i];
    ctx.strokeStyle=sg.cd>0?PAL.warning:PAL.rail;
    ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(sg.a[0],sg.a[1]);ctx.lineTo(sg.b[0],sg.b[1]);ctx.stroke();
  }
  //弹射柱
  for(i=0;i<BUMPERS.length;i++){
    var bp=BUMPERS[i];
    ctx.strokeStyle=PAL.warning;ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(bp[0],bp[1],22,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=PAL.onSoft;
    ctx.beginPath();ctx.arc(bp[0],bp[1],13,0,Math.PI*2);ctx.fill();
  }
  //灯位
  for(i=0;i<TARGETS.length;i++){
    var tg=TARGETS[i];
    ctx.fillStyle=S.lamps[i]?PAL.primary:PAL.deck2;
    ctx.strokeStyle=S.lamps[i]?PAL.primary:PAL.rail;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(tg.x,tg.y,11,0,Math.PI*2);ctx.fill();ctx.stroke();
  }
  ctx.fillStyle=PAL.onSoft;ctx.font="700 14px system-ui,sans-serif";ctx.textAlign="center";
  var lit=(S.lamps[0]?1:0)+(S.lamps[1]?1:0)+(S.lamps[2]?1:0);
  ctx.fillText("灯 "+lit+"/3",240,330);
  if(S.multiT>0){
    ctx.fillStyle=PAL.warning;ctx.font="700 16px system-ui,sans-serif";
    ctx.fillText("多球中 "+Math.ceil(S.multiT)+"s",240,352);
  }
  //发射道柱塞
  var pl=44+S.plunger*36;
  ctx.strokeStyle=PAL.rail;ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(447,MH-14);ctx.lineTo(447,MH-pl);ctx.stroke();
  ctx.fillStyle=PAL.rail;
  ctx.beginPath();ctx.rect(438,MH-pl-10,18,10);ctx.fill();
  if(S.balls.some(function(b){return b.wait})){
    ctx.fillStyle=PAL.onSoft;ctx.font="700 12px system-ui,sans-serif";
    ctx.fillText("按住蓄力",447,MH-90);
  }
  //挡板
  var fls=[["L",PIV_L,S.fl.l],["R",PIV_R,S.fl.r]];
  for(i=0;i<2;i++){
    var side=fls[i][0],piv=fls[i][1],fl=fls[i][2];
    var tip=flipTip(fl,piv,side);
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=13;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(piv[0],piv[1]);ctx.lineTo(tip[0],tip[1]);ctx.stroke();
    ctx.strokeStyle=PAL.rail;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(piv[0],piv[1],5,0,Math.PI*2);ctx.stroke();
  }
  //球
  for(i=0;i<S.balls.length;i++){
    var b=S.balls[i];
    ctx.fillStyle=PAL.ball;
    ctx.beginPath();ctx.arc(b.x,b.y,R,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.6)";
    ctx.beginPath();ctx.arc(b.x-3,b.y-3,3,0,Math.PI*2);ctx.fill();
  }
  //粒子/浮字
  for(i=0;i<S.parts.length;i++){
    var q=S.parts[i];
    ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.fillStyle=q.col;
    ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.font="700 16px system-ui,sans-serif";
  for(i=0;i<S.floats.length;i++){
    var f=S.floats[i];
    ctx.globalAlpha=Math.min(1,f.t*1.5);
    ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
/* ---------- 输入 ---------- */
function pos(e){
  var r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};
}
var waitHeld=false;
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  if(S.phase!=="run"||S.paused)return;
  var p=pos(e);
  if(S.balls.some(function(b){return b.wait})){
    waitHeld=true;S.charging=true;
    return;
  }
  if(p.x<MW/2)S.fl.l.press=true;else S.fl.r.press=true;
});
function pointerEnd(){
  if(waitHeld){waitHeld=false;S.charging=false;launch()}
  S.fl.l.press=false;S.fl.r.press=false;
}
cv.addEventListener("pointerup",pointerEnd);
cv.addEventListener("pointercancel",pointerEnd);
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
window.addEventListener("blur",function(){S.charging=false;waitHeld=false;S.fl.l.press=false;S.fl.r.press=false});
document.addEventListener("keydown",function(e){
  if(["ArrowLeft","ArrowRight","Space","KeyA","KeyD"].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==="Space"){
    if(S.balls.some(function(b){return b.wait})){
      if(!e.repeat){S.charging=true;waitHeld=true}
    }else if(!e.repeat){S.fl.l.press=true;S.fl.r.press=true}
  }
  if(e.code==="ArrowLeft"||e.code==="KeyA")S.fl.l.press=true;
  if(e.code==="ArrowRight"||e.code==="KeyD")S.fl.r.press=true;
  if(e.code==="KeyP"&&S.phase==="run"){S.paused?((S.paused=false),hideOv()):pauseGame()}
  if(e.code==="KeyR"&&S.phase!=="menu")startRun();
  if(e.code==="Enter"&&S.phase!=="run")startRun();
});
document.addEventListener("keyup",function(e){
  if(e.code==="Space"){
    if(waitHeld){waitHeld=false;S.charging=false;launch()}
    S.fl.l.press=false;S.fl.r.press=false;
  }
  if(e.code==="ArrowLeft"||e.code==="KeyA")S.fl.l.press=false;
  if(e.code==="ArrowRight"||e.code==="KeyD")S.fl.r.press=false;
});
$("btnPause").addEventListener("click",pauseGame);
$("btnReset").addEventListener("click",startRun);
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&S.phase==="run"&&!S.paused)pauseGame();
});
/* ---------- 主循环 ---------- */
var lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  var dt=Math.min(.04,(now-lastT)/1000);
  lastT=now;
  if(S.phase==="run"&&!S.paused){
    var h=dt/2;
    step(h);step(h);
  }
  draw();
}
/* ---------- 启动 ---------- */
palLoad();
syncHud();
showOv({k:"PINBALL MINI",t:"单台弹珠",
  x:"按住蓄力把球打进台面；左右拍挡板救球，撞弹射柱 +50、点灯位 +100，三灯全亮开出 12 秒多球并 +500。三颗球打完结算。",
  stats:[["最高分",S.best]],
  btns:[["开始游戏","primary",startRun]]});
resize();
window.addEventListener("resize",resize);
requestAnimationFrame(loop);
syncSaveFromServer();
})();
</script>
