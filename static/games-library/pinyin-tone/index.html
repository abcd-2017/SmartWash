(function(){

var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}

})();

var GAME_KEY="pinyin-tone",SAVE_KEY="sw.pinyintone.v1";

/* 独立验证器一：拼音推导声调（答案唯一来源） */
function deriveTone(py){
  var n=0,t=0,i,ch;
  for(i=0;i<py.length;i++){
    ch=py[i];
    if(TONE_MARKS[ch]){n++;t=TONE_MARKS[ch];}
    else if(!/[a-zü]/.test(ch))return 0;
  }
  return n===1?t:0;
}
/* 独立验证器二：词条合法（词长/下标/拼音推导 = 声调一致性） */
function validWord(e){
  if(!Array.isArray(e)||e.length!==3)return false;
  var w=e[0],py=e[1],i=e[2];
  if(typeof w!=="string"||w.length<2||w.length>4)return false;
  if(!Number.isInteger(i)||i<0||i>=w.length)return false;
  if(typeof py!=="string"||!py.length||py.length>6)return false;
  return deriveTone(py)>0;
}

var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
/* 独立验证器三：单关结构（索引有效 / 关内不重复 / 声调 ≥3 种 / 五词） */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim()||d.name.length>24)return false;
  if(!Array.isArray(d.ws)||d.ws.length!==5)return false;
  var set={},tones={},cnt=0;
  for(var i=0;i<d.ws.length;i++){
    var w=d.ws[i];
    if(!Number.isInteger(w)||w<0||w>=WORDS.length||set[w])return false;
    set[w]=1;tones[deriveTone(WORDS[w][1])]=1;cnt++;
  }
  var tn=0;for(var k in tones)tn++;
  return cnt===5&&tn>=3;
}
function normalizeLevel(d){return {name:String(d.name),ws:d.ws.slice()};}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d)||seen[d.name])return null;
    seen[d.name]=1;
    list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){LEVELS=list.map(normalizeLevel);return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(list&&applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      if(save.lv>LEVELS.length-1)save.lv=LEVELS.length-1;
      persist();loadLevel(lv);
    }
  }).catch(function(){});
}

function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){

    try{
      var rlv=parseInt(JSON.parse(res.stateJson).lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,unplaced=[],placed={},sel=-1,errors=0,hints=3,done=false;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function toneOf(wi){return deriveTone(WORDS[wi][1]);}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  unplaced=L.ws.slice();placed={};sel=unplaced.length?0:-1;errors=0;hints=3;done=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  updStats();render();
  say("把词语按目标字的声调分进四个塔");
}
function updStats(){
  var e=$("stErr");e.textContent=errors;
  e.className="val"+(errors?" low":"");
  $("stDone").textContent=Object.keys(placed).length+"/5";
}
function render(){
  var row=$("wrow");row.innerHTML="";
  unplaced.forEach(function(wi,idx){
    var b=document.createElement("button");
    b.className="chip"+(idx===sel?" sel":"");
    b.textContent=WORDS[wi][0];
    b.addEventListener("click",function(){sel=idx;say("已选中「"+WORDS[wi][0]+"」，点声调塔归位");render();});
    row.appendChild(b);
  });
  if(!unplaced.length){var s=document.createElement("span");s.className="sub";s.textContent="全部归位！";row.appendChild(s);}
  var bins=$("bins");bins.innerHTML="";
  for(var t=1;t<=4;t++){
    (function(t){
      var d=document.createElement("div");d.className="bin";d.setAttribute("role","button");
      d.innerHTML="<div class='tname'><b>"+t+" 声</b><span>"+TONE_NAME[t]+"</span></div><div class='slot'></div>";
      var slot=d.querySelector(".slot");
      for(var k in placed){
        if(placed[k]===t){
          var sp=document.createElement("span");sp.className="placed";sp.textContent=WORDS[k][0];
          slot.appendChild(sp);
        }
      }
      if(!slot.children.length){var em=document.createElement("span");em.style.fontSize="12px";em.style.color="var(--g-faint)";em.textContent="（空）";slot.appendChild(em);}
      d.addEventListener("click",function(){place(t)});
      bins.appendChild(d);
    })(t);
  }
}
function place(t){
  if(done||sel<0||sel>=unplaced.length){say("先点一个词语");return;}
  var wi=unplaced[sel],ok=toneOf(wi)===t;
  if(ok){
    placed[wi]=t;unplaced.splice(sel,1);
    sel=unplaced.length?Math.min(sel,unplaced.length-1):-1;
    say("「"+WORDS[wi][0]+"」的「"+WORDS[wi][0][WORDS[wi][2]]+"」读"+TONE_NAME[t]+"，归位成功");
    updStats();render();
    if(!unplaced.length)winLevel();
  }else{
    errors++;updStats();
    say("不对：「"+WORDS[wi][0]+"」的「"+WORDS[wi][0][WORDS[wi][2]]+"」不是"+t+"声，再想想");
    render();
  }
}
function hint(){
  if(done)return;
  if(hints<=0){say("本关提示次数用完了");return;}
  if(sel<0||sel>=unplaced.length){say("先点一个词语");return;}
  hints--;
  var wi=unplaced[sel];
  say("提示（剩 "+hints+" 次）：「"+WORDS[wi][0]+"」目标字读「"+WORDS[wi][1]+"」");
}
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:errors}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"过关！";
  $("ovDesc").innerHTML="错误 "+errors+" 次"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
/* ---------- 交互 ---------- */
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(!done)openLevelSelect();});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){lv=(lv>=LEVELS.length-1)?0:lv+1;loadLevel(lv);}
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"||k==="ArrowUp"){if(unplaced.length){sel=(sel-1+unplaced.length)%unplaced.length;render();}e.preventDefault();}
  else if(k==="ArrowRight"||k==="ArrowDown"){if(unplaced.length){sel=(sel+1)%unplaced.length;render();}e.preventDefault();}
  else if(k>="1"&&k<="4"){place(parseInt(k,10));e.preventDefault();}
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
  else if(k===" "||k==="Enter"){if($("overlay").classList.contains("show"))$("ovBtn").click();e.preventDefault();}
});
/* ---------- 启动 ---------- */
loadLevel(save.lv);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
