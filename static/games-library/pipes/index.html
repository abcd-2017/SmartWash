/* 解析口径与 docs/level-gen/tools/pipes/lib.mjs 的 validData 保持一致：任一条非法整批放弃 */
function validData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  var n=d.size;
  if(!Number.isInteger(n)||n<3||n>8)return false;
  if(!Array.isArray(d.tiles)||d.tiles.length!==n*n)return false;

    if(!validData(d))return false;
    var name=(typeof d.name==="string"&&d.name)?d.name:("第"+(i+1)+"关");
    if(name.length>32)return false;
    list.push({name:name,size:d.size,tiles:d.tiles.slice(),src:d.src,snk:d.snk,par:d.par});

}

function tRot(v){return v===14?0:(v<4?v:(v<6?v-4:(v<10?v-6:v-10)));}

  if(t===4)return 14;

  if(i===pulseCell){var dt=(ts-pulseT0)/160;if(dt>=0&&dt<1)sc=1+0.12*Math.sin(Math.PI*dt);}
  ctx.save();
  ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-cx,-cy);
  ctx.strokeStyle=body;ctx.lineWidth=w;ctx.lineCap="round";
  ctx.beginPath();
  for(var d=0;d<4;d++){
    if(!(mask&(1<<d)))continue;
    ctx.moveTo(cx,cy);ctx.lineTo(cx+DX[d]*cellPx*0.5,cy+DY[d]*cellPx*0.5);
  }
  ctx.stroke();
  if(active){
    if(won){ctx.shadowColor=PAL.water;ctx.shadowBlur=cellPx*0.18;}
    ctx.strokeStyle=PAL.water;ctx.lineWidth=Math.max(1.5,w*0.42);
    ctx.beginPath();
    for(var d2=0;d2<4;d2++){
      if(!(mask&(1<<d2)))continue;
      ctx.moveTo(cx,cy);ctx.lineTo(cx+DX[d2]*cellPx*0.5,cy+DY[d2]*cellPx*0.5);
    }
    ctx.stroke();
    ctx.shadowBlur=0;
  }
  ctx.fillStyle=body;
  ctx.beginPath();ctx.arc(cx,cy,w*0.55,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawBadge(i,color){
  var cx=(i%size)*cellPx+cellPx/2,cy=((i/size)|0)*cellPx+cellPx/2;
  var rr=cellPx*0.36;
  ctx.strokeStyle=color;ctx.lineWidth=Math.max(2,cellPx*0.05);
  ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(cx,cy,rr*0.42,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.surface;
  ctx.beginPath();ctx.arc(cx,cy,rr*0.18,0,Math.PI*2);ctx.fill();
}
function render(ts){
  ts=ts||performance.now();
  if(!size)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,viewSize,viewSize);
  ctx.fillStyle=PAL.field;ctx.fillRect(0,0,viewSize,viewSize);
  ctx.strokeStyle=PAL.grid;ctx.lineWidth=1;
  ctx.beginPath();
  for(var k=1;k<size;k++){
    var p=Math.round(k*cellPx)+0.5;
    ctx.moveTo(p,0);ctx.lineTo(p,viewSize);
    ctx.moveTo(0,p);ctx.lineTo(viewSize,p);
  }
  ctx.stroke();
  for(var i=0;i<size*size;i++)drawCell(i,ts);
  ctx.fillStyle=PAL.leak;
  for(var li=0;li<stateLeaks.length;li++){
    var cell=stateLeaks[li][0],dir=stateLeaks[li][1];
    var cx=(cell%size)*cellPx+cellPx/2,cy=((cell/size)|0)*cellPx+cellPx/2;
    ctx.beginPath();
    ctx.arc(cx+DX[dir]*cellPx*0.42,cy+DY[dir]*cellPx*0.42,Math.max(2,cellPx*0.075),0,Math.PI*2);
    ctx.fill();
  }
  drawBadge(src,PAL.src);
  drawBadge(snk,PAL.snk);
}
/* ---------- 关卡流程 ---------- */
function unlockedMax(){
  var m=0;
  for(var k in doneSave){
    var i=parseInt(k,10);
    if(doneSave[k]!=null&&i+1>m)m=i+1;
  }
  return Math.min(m,LEVELS.length-1);
}
function updateStats(){
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  $("stMoves").textContent=String(moves);
  $("stBest").textContent=doneSave[cur]!=null?String(doneSave[cur]):"-";
}
function updateNav(){
  $("btnPrev").disabled=cur<=0;
  $("btnNext").disabled=cur>=unlockedMax();
}
function startLevel(n){
  n=Math.max(0,Math.min(n,LEVELS.length-1));
  cur=n;
  saveData.lv=n;
  var L=LEVELS[n];
  size=L.size;tiles=L.tiles.slice();src=L.src;snk=L.snk;
  par=Number.isInteger(L.par)?L.par:0;
  moves=0;won=false;pulseCell=-1;
  evaluate();
  resize();
  updateStats();
  updateNav();
  say("第"+(n+1)+"关 · "+L.name+" · 参考步数 "+par);
  save();
}
function rotateCell(i){
  var t=tType(tiles[i]);
  if(t===4)return;   /* 十字任意方向等价 */
  tiles[i]=encTile(t,(tRot(tiles[i])+1)%4);
  moves++;
  pulseCell=i;pulseT0=performance.now();poke();
  var ok=evaluate();
  updateStats();
  render();
  if(ok){onWin();}
  else if(stateLeaks.length>0)say("还有 "+stateLeaks.length+" 个漏口 · 已连通 "+stateReached+"/"+(size*size));
  else say("已无漏口 · 继续接通水源");
  save();
}
function onWin(){
  won=true;
  var prev=parseInt(doneSave[cur],10);
  if(!(prev>0)||moves<prev)doneSave[cur]=moves;
  saveData.lv=Math.min(cur+1,LEVELS.length-1);
  save();updateStats();updateNav();
  render();
  var best=doneSave[cur];
  var html='<h2>通关！</h2><p class="desc">本关用了 <b>'+moves+'</b> 步<br>参考步数 '+par+' · 最少 '+best+' 步'+(moves<=par?'<br>表现出色':'')+'</p>';
  html+='<button class="btn" data-act="next">'+(cur<LEVELS.length-1?'下一关':'再玩一遍')+'</button>';
  html+='<button class="btn ghost" data-act="retry">重玩本关</button>';
  html+='<button class="btn ghost" data-act="close">关闭</button>';
  showOverlay(html);
  say("通关！用了 "+moves+" 步");
  if(GB.available)GB.reportScore("pipes",{metricValue:Object.keys(doneSave).length,metricExtra:moves}).catch(function(){});
}
/* ---------- 覆盖层 ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function showOverlay(html){
  $("panel").innerHTML=html;
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show");}
function openPicker(){
  var html='<h2>选择关卡</h2><p class="desc">已解锁 '+(unlockedMax()+1)+' / '+LEVELS.length+'</p><div class="lvgrid">';
  for(var i=0;i<LEVELS.length;i++){
    var cls="lvgrid-btn"+(doneSave[i]!=null?" done":"")+(i===cur?" cur":"");
    var dis=i>unlockedMax()?" disabled":"";
    html+='<button class="'+cls+'" data-act="lv" data-lv="'+i+'"'+dis+'>'+(i+1)+'</button>';
  }
  html+='</div><button class="btn ghost" data-act="close">关闭</button>';
  showOverlay(html);
}
$("panel").addEventListener("click",function(e){
  var t=e.target&&e.target.closest?e.target.closest("[data-act]"):null;
  if(!t)return;
  var act=t.getAttribute("data-act");
  if(act==="next"){hideOverlay();startLevel(cur<LEVELS.length-1?cur+1:0);}
  else if(act==="retry"){hideOverlay();startLevel(cur);}
  else if(act==="close"){hideOverlay();}
  else if(act==="lv"){var i=parseInt(t.getAttribute("data-lv"),10);hideOverlay();if(i<=unlockedMax())startLevel(i);}
});
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  if(won)return;
  var rect=cv.getBoundingClientRect();
  var c=Math.floor((e.clientX-rect.left)/cellPx),r=Math.floor((e.clientY-rect.top)/cellPx);
  if(r<0||r>=size||c<0||c>=size)return;
  e.preventDefault();
  rotateCell(r*size+c);
});
cv.addEventListener("contextmenu",function(e){e.preventDefault();});
$("btnPrev").addEventListener("click",function(){if(cur>0)startLevel(cur-1);});
$("btnNext").addEventListener("click",function(){if(cur<unlockedMax())startLevel(cur+1);});
$("btnReset").addEventListener("click",function(){startLevel(cur);say("本关已重置");});
$("btnPick").addEventListener("click",openPicker);
window.addEventListener("resize",resize);
window.addEventListener("load",resize);
document.addEventListener("visibilitychange",function(){if(!document.hidden)render();});
/* ---------- 启动 ---------- */
palLoad();
startLevel(Math.min(Math.max(saveData.lv,0),unlockedMax()));
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
