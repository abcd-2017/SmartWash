/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},

/* ========== 核心与关卡（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
var PT={};
var PT_XMIN=50,PT_XMAX=340,PT_SPEED=260,PT_SAFE=221;
function ptMulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function ptClamp(v,a,b){return Math.max(a,Math.min(b,v));}
/* 由种子生成配料落点与时间（可复现） */
PT.genToppings=function(level){
  var rng=ptMulberry32(level.seed||1),tops=[],bombs=[],i;
  var x=80+rng()*230;
  for(i=0;i<level.need;i++){
    tops.push({x:ptClamp(x,PT_XMIN,PT_XMAX),t:1+i*level.gap});
    x=ptClamp(x+(rng()*2-1)*180,PT_XMIN,PT_XMAX);
  }
  for(i=0;i<level.bombs;i++){
    var k=(1+rng()*(level.need-1))|0;
    var bx=ptClamp((rng()<0.5?tops[k].x-140:tops[k].x+140)+(rng()*40-20),PT_XMIN,PT_XMAX);
    bombs.push({x:bx,t:tops[k].t+level.gap*0.5});
  }
  return {tops:tops,bombs:bombs};
};
/* 可完成性验证：面饼水平速度有上限，逐配料检查相邻落点可达；
   黑火药与任一配料在时间/水平距离上错开（可避开）；限时覆盖全部下落时间。 */
PT.validate=function(level){
  if(!level||typeof level!=="object")return{ok:false,why:"bad"};
  if(!Number.isInteger(level.need)||level.need<3||level.need>20)return{ok:false,why:"need"};
  if(!(level.gap>=0.6&&level.gap<=1.5))return{ok:false,why:"gap"};
  if(!(level.fall>=100&&level.fall<=320))return{ok:false,why:"fall"};
  if(!Number.isInteger(level.bombs)||level.bombs<0||level.bombs>level.need)return{ok:false,why:"bombs"};
  if(!(level.time>=1&&level.time<=90))return{ok:false,why:"time"};
  var g=PT.genToppings(level),tops=g.tops,i;
  if(tops.length!==level.need)return{ok:false,why:"tops"};
  var px=tops[0].x,pt=tops[0].t;
  if(px<PT_XMIN||px>PT_XMAX||pt<0)return{ok:false,why:"top0"};
  for(i=1;i<tops.length;i++){
    var dx=Math.abs(tops[i].x-px),dt=tops[i].t-pt;
    if(tops[i].x<PT_XMIN||tops[i].x>PT_XMAX)return{ok:false,why:"range"+i};
    if(dt<=0)return{ok:false,why:"order"+i};
    if(dx>PT_SAFE*dt)return{ok:false,why:"reach"+i};
    px=tops[i].x;pt=tops[i].t;
  }
  var travel=500/level.fall;
  if(level.time<pt+travel+0.5)return{ok:false,why:"time2"};
  for(i=0;i<g.bombs.length;i++){
    var b=g.bombs[i];
    if(b.x<PT_XMIN||b.x>PT_XMAX)return{ok:false,why:"brange"};
    for(var j=0;j<tops.length;j++){
      if(Math.abs(b.t-tops[j].t)<0.35&&Math.abs(b.x-tops[j].x)<90)return{ok:false,why:"bconf"+i};
    }
  }
  return{ok:true,why:"",count:tops.length};
};
PT.validateAll=function(list){
  var fails=[],i;
  for(i=0;i<list.length;i++){var r=PT.validate(list[i]);if(!r.ok)fails.push((i+1)+"("+r.why+")");}
  return {total:list.length,solvable:list.length-fails.length,fail:fails};
};
globalThis.__XC=PT;
/*XC-CORE-END*/

var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY="sw.pizza-toss.v1.levels",LEVELS_VER_KEY="sw.pizza-toss.v1.levels.ver";
function applyLevels(list,version){
  if(!Array.isArray(list)||list.length<40)return false;
  for(var i=0;i<list.length;i++)if(!PT.validate(list[i]).ok)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length>=40){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function parseLevels(res){
  if(!res||!Array.isArray(res.levels)||res.levels.length<40)return false;
  var list=[],i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item.dataJson!=="string")return false;
    var d;try{d=JSON.parse(item.dataJson);}catch(e){return false;}
    if(!PT.validate(d).ok)return false;
    list.push(d);
  }
  return list;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("pizza-toss").then(function(res){
    var list=parseLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){setupLevel(Math.max(0,Math.min(cur,LEVELS.length-1)));showStart();}
  }).catch(function(){});
}

/* ---------- 存档 ---------- */
var KEY="sw.pizza-toss.v1";
function loadSave(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&typeof s==="object"){
      var done={};
      if(s.done&&typeof s.done==="object")for(var k in s.done){var v=parseInt(s.done[k],10);if(v>0)done[k]=v;}
      return {lv:Math.max(0,parseInt(s.lv,10)||0),done:done,best:Math.max(0,parseInt(s.best,10)||0)};
    }
  }catch(e){}
  return {lv:0,done:{},best:0};
}
var saveData=loadSave();
var doneSave=saveData.done||{};
var best=saveData.best||0;
function totalBest(){var t=0,k;for(k in doneSave){var v=parseInt(doneSave[k],10)||0;if(v>0)t+=v;}return t;}
function save(){
  var data={lv:saveData.lv,done:doneSave,best:best};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("pizza-toss",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("pizza-toss").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(remote.lv,10)||0;if(rl>saveData.lv){saveData.lv=rl;changed=true;}
      var rb=parseInt(remote.best,10)||0;if(rb>best){best=rb;changed=true;}
      if(remote.done&&typeof remote.done==="object")for(var k in remote.done){
        var rv=parseInt(remote.done[k],10)||0,mv=parseInt(doneSave[k],10)||0;
        if(rv>mv){doneSave[k]=rv;changed=true;}
      }
      if(changed){best=Math.max(best,totalBest());save();refreshStats();}
    }catch(e){}
  }).catch(function(){});
}

var cur=0,L=null,gTop=null,pieces=[],doughX=0,targetX=0,doughAngle=0;
var caught=0,lives=3,timeLeft=0,state="ready",paused=false,over=false;
var W=0,H=0,dpr=1,doughY=0,flash=0,lastFrame=0,keyDir=0;
function fit(){
  var r=cv.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(200,r.width);H=Math.max(200,r.width*4/3);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  doughY=H-56;
  draw();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);

function setupLevel(n){
  n=Math.max(0,Math.min(n,LEVELS.length-1));
  cur=n;L=LEVELS[n];
  gTop=PT.genToppings(L);
  pieces=[];
  doughAngle=0;
  caught=0;lives=3;timeLeft=L.time;over=false;paused=false;flash=0;
  fit();
  doughX=W/2;targetX=W/2;
  refreshStats();
  btnPause.disabled=true;btnPause.textContent="暂停";
  say("点击「开始」抛饼");
}
function startPlay(){
  state="running";paused=false;over=false;
  hideOverlay();
  btnPause.disabled=false;btnPause.textContent="暂停";
  say("左右拖动移动面饼 · 接住全部配料");
}
function togglePause(){
  if(state!=="running")return;
  paused=!paused;
  btnPause.textContent=paused?"继续":"暂停";
  if(paused)showPause();else hideOverlay();
  say(paused?"已暂停":"已继续");
}
function retryLevel(){setupLevel(cur);startPlay();}
function enterLevel(n){setupLevel(n);showStart();}
function refreshStats(){
  stLv.textContent=(cur+1)+"/"+LEVELS.length;
  stScore.textContent=caught+"/"+L.need;
  stLives.textContent=String(lives);
}
function endLevel(win){
  if(over)return;
  over=true;state="over";btnPause.disabled=true;
  var sc=win?(L.need*10+Math.max(0,Math.ceil(timeLeft))*5):caught*5;
  var prev=doneSave[cur]||0;if(sc>prev)doneSave[cur]=sc;
  var tb=totalBest();if(tb>best)best=tb;
  if(win&&cur+1>saveData.lv)saveData.lv=cur+1;
  save();
  if(GB.available)GB.reportScore("pizza-toss",{metricValue:best,metricExtra:cur+1}).catch(function(){});
  refreshStats();
  if(win)showWin(sc);else showFail();
}

/* ---------- 更新 ---------- */
function update(dt){
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;say("时间到！");endLevel(false);return;}
  // 面饼移动
  if(keyDir!==0){
    doughX+=keyDir*260*dt;
    targetX=doughX;
  }else{
    var diff=targetX-doughX;
    var step=260*dt;
    if(Math.abs(diff)<=step)doughX=targetX;else doughX+=Math.sign(diff)*step;
  }
  doughX=Math.max(34,Math.min(W-34,doughX));
  doughAngle+=dt*3.2;
  var t=L.time-timeLeft;
  var i,p;
  for(i=pieces.length-1;i>=0;i--){
    p=pieces[i];
    var y=(t-p.t0)*L.fall-20;
    p.y=y;
    if(!p.resolved&&y>=doughY){
      p.resolved=true;
      if(Math.abs(p.x-doughX)<=38){
        if(p.bomb){lives--;flash=1;say("接到黑火药！剩余 "+lives+" 命");if(lives<=0){endLevel(false);return;}}
        else{caught++;say("接住配料 "+caught+"/"+L.need);refreshStats();}
      }else{
        if(!p.bomb){say("漏接配料！");endLevel(false);return;}
      }
    }
    if(y>H+40)pieces.splice(i,1);
  }
  // 生成到期的配料
  for(i=0;i<gTop.tops.length;i++){
    if(t>=gTop.tops[i].t&&!gTop.tops[i].spawned){gTop.tops[i].spawned=true;pieces.push({x:gTop.tops[i].x,t0:gTop.tops[i].t,y:-20,bomb:false,resolved:false});}
  }
  for(i=0;i<gTop.bombs.length;i++){
    if(t>=gTop.bombs[i].t&&!gTop.bombs[i].spawned){gTop.bombs[i].spawned=true;pieces.push({x:gTop.bombs[i].x,t0:gTop.bombs[i].t,y:-20,bomb:true,resolved:false});}
  }
  flash=Math.max(0,flash-dt*2.5);
  if(caught>=L.need){endLevel(true);return;}
}

/* ---------- 渲染 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.surface2;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=PAL.surface;ctx.fillRect(0,doughY+28,W,H-doughY-28);
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,doughY+28);ctx.lineTo(W,doughY+28);ctx.stroke();
  // 配料
  for(var i=0;i<pieces.length;i++){
    var p=pieces[i];
    if(p.resolved)continue;
    if(p.bomb){
      ctx.fillStyle=PAL.bomb;
      ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=PAL.danger;
      ctx.fillRect(p.x-1.5,p.y-18,3,7);
    }else{
      var c=PAL.top[i%4];
      ctx.fillStyle=c;
      ctx.beginPath();ctx.arc(p.x,p.y,11,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=PAL.surface;
      ctx.beginPath();ctx.arc(p.x-3,p.y-3,3,0,Math.PI*2);ctx.fill();
    }
  }
  // 面饼
  ctx.save();
  ctx.translate(doughX,doughY);
  ctx.rotate(doughAngle);
  ctx.fillStyle=PAL.dough;
  ctx.beginPath();ctx.arc(0,0,34,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=PAL.doughline;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,26,0,Math.PI*2);ctx.stroke();
  for(var k=0;k<caught;k++){
    var a=k*1.1;
    ctx.fillStyle=PAL.top[k%4];
    ctx.beginPath();ctx.arc(Math.cos(a)*16,Math.sin(a)*16,4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  if(flash>0){
    ctx.globalAlpha=Math.min(0.4,flash*0.4);
    ctx.fillStyle=PAL.danger;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
  ctx.fillStyle=PAL.muted;ctx.font="700 14px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("剩余 "+Math.max(0,Math.ceil(timeLeft))+" 秒",W/2,18);
}

function showLevels(){
  var html='<p class="rt">选择关卡</p><p class="rs">已过关卡显示为绿色</p><div class="lv-wrap"><div class="lv-grid">';
  for(var i=0;i<LEVELS.length;i++){
    var done=parseInt(doneSave[i],10)>0;
    var locked=i>saveData.lv;
    html+='<button class="lv-chip'+(i===cur?" sel":"")+(done?" done":"")+'" data-i="'+i+'"'+(locked?" disabled":"")+' type="button">'+(i+1)+'</button>';
  }
  html+='</div></div><div class="rbtns"><button class="btn ghost" id="ovClose" type="button">返回</button></div>';
  showPanel(html);
  var chips=panel.querySelectorAll(".lv-chip");
  for(var j=0;j<chips.length;j++)chips[j].addEventListener("click",function(){enterLevel(parseInt(this.getAttribute("data-i"),10));});
  $("ovClose").addEventListener("click",function(){hideOverlay();if(state==="running"&&paused)showPause();});
}

/* ---------- 输入 ---------- */
var dragging=false;
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();dragging=true;
  var r=cv.getBoundingClientRect();
  targetX=(e.clientX-r.left)/r.width*W;
});
cv.addEventListener("pointermove",function(e){
  if(!dragging)return;
  var r=cv.getBoundingClientRect();
  targetX=(e.clientX-r.left)/r.width*W;
});
cv.addEventListener("pointerup",function(){dragging=false;});
cv.addEventListener("pointercancel",function(){dragging=false;});
document.addEventListener("keydown",function(e){
  if(e.repeat)return;
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowLeft"||k==="a"){e.preventDefault();keyDir=-1;}
  else if(k==="ArrowRight"||k==="d"){e.preventDefault();keyDir=1;}
  else if(k===" "){e.preventDefault();if(state==="running")togglePause();else if(state==="ready"||state==="over")startPlay();}
});
document.addEventListener("keyup",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if((k==="ArrowLeft"||k==="a")&&keyDir<0)keyDir=0;
  if((k==="ArrowRight"||k==="d")&&keyDir>0)keyDir=0;
});
btnPause.addEventListener("click",togglePause);
btnRetry.addEventListener("click",function(){if(state==="running"||state==="over")retryLevel();});
btnLevels.addEventListener("click",function(){if(state==="running"&&!paused){paused=true;btnPause.textContent="继续";}showLevels();});
document.addEventListener("visibilitychange",function(){if(document.hidden&&state==="running"&&!paused)togglePause();});

/* ---------- 主循环 ---------- */
function loop(now){
  requestAnimationFrame(loop);
  var dt=((now-lastFrame)/1000)||0.016;lastFrame=now;
  if(dt>0.05)dt=0.05;
  if(state==="running"&&!paused&&!over)update(dt);
  draw();
}

setupLevel(Math.max(0,Math.min(saveData.lv,LEVELS.length-1)));
requestAnimationFrame(loop);
syncLevelsFromServer();
syncSaveFromServer();
showStart();
window.__validateLevels=function(){
