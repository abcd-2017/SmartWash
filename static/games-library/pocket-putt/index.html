window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
"use strict";
(() => {
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
var PP={};
var PP_W=360,PP_H=360,PP_BALLR=7,PP_HOLER=11,PP_DECEL=300,PP_STOP=14,PP_REST=0.82;
function ppMulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function ppOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function ppInRect(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
/* 物理模拟一杆，返回是否进洞与轨迹 */
PP.simPath=function(L,angle,power){
  var x=L.start.x,y=L.start.y;
  var vx=Math.cos(angle)*power,vy=Math.sin(angle)*power;
  var dt=1/120,path=[{x:x,y:y}],step,sp,ns,dl,dr,dtp,db,m,r,i;
  for(step=0;step<720;step++){
    sp=Math.hypot(vx,vy);
    if(sp>0){ns=Math.max(0,sp-PP_DECEL*dt);vx*=ns/sp;vy*=ns/sp;if(ns<PP_STOP){vx=0;vy=0;}}
    x+=vx*dt;y+=vy*dt;
    if(x<PP_BALLR){x=PP_BALLR;vx=-vx*PP_REST;}
    if(x>PP_W-PP_BALLR){x=PP_W-PP_BALLR;vx=-vx*PP_REST;}
    if(y<PP_BALLR){y=PP_BALLR;vy=-vy*PP_REST;}
    if(y>PP_H-PP_BALLR){y=PP_H-PP_BALLR;vy=-vy*PP_REST;}
    for(i=0;i<L.walls.length;i++){
      r=L.walls[i];
      if(ppInRect(x,y,r)){
        dl=x-r.x;dr=r.x+r.w-x;dtp=y-r.y;db=r.y+r.h-y;
        m=Math.min(dl,dr,dtp,db);
        if(m===dl){x=r.x-PP_BALLR;vx=-Math.abs(vx)*PP_REST;}
        else if(m===dr){x=r.x+r.w+PP_BALLR;vx=Math.abs(vx)*PP_REST;}
        else if(m===dtp){y=r.y-PP_BALLR;vy=-Math.abs(vy)*PP_REST;}
        else{y=r.y+r.h+PP_BALLR;vy=Math.abs(vy)*PP_REST;}
      }
    }
    if(step%4===0)path.push({x:x,y:y});
    if(Math.hypot(x-L.hole.x,y-L.hole.y)<PP_HOLER&&Math.hypot(vx,vy)<300)return{sunk:true,path:path};
    if(vx===0&&vy===0)break;
  }
  return{sunk:false,path:path};
};
PP.findSolution=function(L){
  var powers=[260,380,500],a,pw,r;
  for(a=0;a<360;a+=10)for(var pi=0;pi<powers.length;pi++){
    pw=powers[pi];r=PP.simPath(L,a*Math.PI/180,pw);
    if(r.sunk)return{angle:a,power:pw,path:r.path};
  }
  return null;
};
/* 关卡生成：随机起点/球洞/隔板；暴力采样找到可进洞一杆后，沿解轨迹布 3 颗星 */
PP.genLevel=function(no,seed){
  var p=(no-1)/39,rng=ppMulberry32(seed||1);
  var start={x:40+rng()*80,y:80+rng()*200};
  var hole={x:250+rng()*80,y:60+rng()*240};
  var nW=1+Math.floor(p*3),walls=[],tries=0;
  while(walls.length<nW&&tries<30){
    tries++;
    var w=30+rng()*60,h=20+rng()*50;
    var r={x:70+rng()*(PP_W-140-w),y:50+rng()*(PP_H-100-h),w:w,h:h};
    if(Math.hypot(r.x+r.w/2-start.x,r.y+r.h/2-start.y)<70)continue;
    if(Math.hypot(r.x+r.w/2-hole.x,r.y+r.h/2-hole.y)<60)continue;
    if(walls.some(function(o){return ppOverlap({x:r.x-8,y:r.y-8,w:r.w+16,h:r.h+16},o);}))continue;
    walls.push(r);
  }
  var sol=PP.findSolution({start:start,hole:hole,walls:walls});
  if(!sol)return null;
  var stars=[],fr=[0.35,0.6,0.85],i,idx,a2,b2,dx,dy,len,off;
  for(i=0;i<fr.length;i++){
    idx=Math.min(sol.path.length-1,Math.floor(fr[i]*(sol.path.length-1)));
    a2=sol.path[Math.max(0,idx-1)];b2=sol.path[Math.min(sol.path.length-1,idx+1)];
    dx=b2.x-a2.x;dy=b2.y-a2.y;len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
    off=(i%2===0?10:-10);
    stars.push({x:Math.max(16,Math.min(PP_W-16,sol.path[idx].x-dy*off)),y:Math.max(16,Math.min(PP_H-16,sol.path[idx].y+dx*off))});
  }
  return {name:"第"+no+"关 · 袖珍推杆",no:no,seed:seed||0,par:2+(nW>=3?1:0),start:start,hole:hole,walls:walls,stars:stars};
};
/* 可通关性验证：暴力采样（36 向 × 3 档力度）至少有一杆可进洞；星在解路径附近可吃 */
PP.validate=function(L){
  if(!L||!L.start||!L.hole)return{ok:false,why:"bad"};
  if(!Array.isArray(L.walls)||L.walls.length<1||L.walls.length>4)return{ok:false,why:"walls"};
  if(!Array.isArray(L.stars)||L.stars.length<1||L.stars.length>3)return{ok:false,why:"stars"};
  if(!Number.isInteger(L.par)||L.par<1||L.par>4)return{ok:false,why:"par"};
  var sol=PP.findSolution(L);
  if(!sol)return{ok:false,why:"unsolvable"};
  var near=0;
  for(var i=0;i<L.stars.length;i++)for(var j=0;j<sol.path.length;j++){
    if(Math.hypot(L.stars[i].x-sol.path[j].x,L.stars[i].y-sol.path[j].y)<16){near++;break;}
  }
  return{ok:true,why:"",angle:sol.angle,power:sol.power,starNear:near};
};
PP.validateAll=function(list){
  var fails=[],i;
  for(i=0;i<list.length;i++){var r=PP.validate(list[i]);if(!r.ok)fails.push((i+1)+"("+r.why+")");}
  return {total:list.length,solvable:list.length-fails.length,fail:fails};
};
globalThis.__XC=PP;
/*XC-CORE-END*/

/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim();}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),border:v("--g-border"),
    green:v("--g-st-green"),greenline:v("--g-st-greenline"),wall:v("--g-st-wall"),
    hole:v("--g-st-hole"),star:v("--g-st-star"),ball:v("--g-st-ball"),ballline:v("--g-st-ballline")};
}
window.__gOnTheme=function(){palLoad();draw();};

var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY="sw.pocket-putt.v1.levels",LEVELS_VER_KEY="sw.pocket-putt.v1.levels.ver";
function applyLevels(list,version){
  if(!Array.isArray(list)||list.length<40)return false;
  for(var i=0;i<list.length;i++){
    var d=list[i];
    if(!d||typeof d.name!=="string"||!Number.isInteger(d.no)||!Number.isInteger(d.seed))return false;
    var lv=PP.genLevel(d.no,d.seed);
    if(!lv||!PP.validate(lv).ok)return false;
  }
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length>=40){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function parseLevels(res){
  if(!res||!Array.isArray(res.levels)||res.levels.length<40)return false;
  var list=[],i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item.dataJson!=="string")return false;
    var d;try{d=JSON.parse(item.dataJson);}catch(e){return false;}
    if(!d||typeof d.name!=="string"||!Number.isInteger(d.no)||!Number.isInteger(d.seed))return false;
    var lv=PP.genLevel(d.no,d.seed);
    if(!lv||!PP.validate(lv).ok)return false;
    list.push(d);
  }
  return list;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("pocket-putt").then(function(res){
    var list=parseLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){setupLevel(Math.max(0,Math.min(cur,LEVELS.length-1)));showStart();}
  }).catch(function(){});
}

/* ---------- 存档 ---------- */
var KEY="sw.pocket-putt.v1";
function loadSave(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&typeof s==="object"){
      var done={};
      if(s.done&&typeof s.done==="object")for(var k in s.done){var v=parseInt(s.done[k],10);if(v>0)done[k]=v;}
      return {lv:Math.max(0,parseInt(s.lv,10)||0),done:done,best:Math.max(0,parseInt(s.best,10)||0)};
    }
  }catch(e){}
  return {lv:0,done:{},best:0};
}
var saveData=loadSave();
var doneSave=saveData.done||{};
var best=saveData.best||0;
function totalBest(){var t=0,k;for(k in doneSave){var v=parseInt(doneSave[k],10)||0;if(v>0)t+=v;}return t;}
function save(){
  var data={lv:saveData.lv,done:doneSave,best:best};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("pocket-putt",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("pocket-putt").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(remote.lv,10)||0;if(rl>saveData.lv){saveData.lv=rl;changed=true;}
      var rb=parseInt(remote.best,10)||0;if(rb>best){best=rb;changed=true;}
      if(remote.done&&typeof remote.done==="object")for(var k in remote.done){
        var rv=parseInt(remote.done[k],10)||0,mv=parseInt(doneSave[k],10)||0;
        if(rv>mv){doneSave[k]=rv;changed=true;}
      }
      if(changed){best=Math.max(best,totalBest());save();refreshStats();}
    }catch(e){}
  }).catch(function(){});
}

var cur=0,L=null,course=null;
var ball={x:0,y:0,vx:0,vy:0},strokes=0,starsGot=0,state="ready",paused=false,over=false;
var aimAngle=0,aimPower=300,dragging=false,dragStart=null,dragNow=null;
var W=0,H=0,dpr=1,scale=1,lastFrame=0;
function fit(){
  var r=cv.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(200,r.width);H=Math.max(200,r.width);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  scale=W/PP_W;
  draw();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);
function sx(x){return x*scale;}
function sy(y){return y*scale;}
function buildCourse(idx){
  var d=LEVELS[idx],lv=PP.genLevel(d.no,d.seed);
  if(!lv)lv=PP.genLevel(idx+1,7000);
  return lv;
}
function setupLevel(n){
  n=Math.max(0,Math.min(n,LEVELS.length-1));
  cur=n;L=LEVELS[n];course=buildCourse(n);
  ball={x:course.start.x,y:course.start.y,vx:0,vy:0};
  strokes=0;starsGot=0;over=false;paused=false;
  aimAngle=Math.atan2(course.hole.y-ball.y,course.hole.x-ball.x);
  aimPower=320;
  fit();refreshStats();
  btnPause.disabled=true;btnPause.textContent="暂停";
  say("点击「开始」上场");
}
function startPlay(){
  state="running";paused=false;over=false;

function togglePause(){

function retryLevel(){setupLevel(cur);startPlay();}
function enterLevel(n){setupLevel(n);showStart();}
function refreshStats(){
  stLv.textContent=(cur+1)+"/"+LEVELS.length;
  stScore.textContent=String(strokes);
  stPar.textContent=String(course?course.par:2);
}
function endLevel(win){
  if(over)return;
  over=true;state="over";btnPause.disabled=true;
  var sc=win?Math.max(40,200-(strokes-course.par)*50)+starsGot*20:0;
  var prev=doneSave[cur]||0;if(sc>prev)doneSave[cur]=sc;
  var tb=totalBest();if(tb>best)best=tb;
  if(win&&cur+1>saveData.lv)saveData.lv=cur+1;
  save();
  if(GB.available)GB.reportScore("pocket-putt",{metricValue:best,metricExtra:cur+1}).catch(function(){});
  refreshStats();
  if(win)showWin(sc);else showFail();
}
function shoot(angle,power){
  if(state!=="running"||paused||over)return;
  if(Math.hypot(ball.vx,ball.vy)>1)return;
  ball.vx=Math.cos(angle)*power;
  ball.vy=Math.sin(angle)*power;
  strokes++;refreshStats();
  say("击球！");
}

/* ---------- 更新 ---------- */
function update(dt){
  var sp=Math.hypot(ball.vx,ball.vy);
  if(sp>0){
    var ns=Math.max(0,sp-PP_DECEL*dt);
    if(ns<PP_STOP){ball.vx=0;ball.vy=0;}
    else{ball.vx*=ns/sp;ball.vy*=ns/sp;}
  }
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  var r,i;
  if(ball.x<PP_BALLR){ball.x=PP_BALLR;ball.vx=-ball.vx*PP_REST;}
  if(ball.x>PP_W-PP_BALLR){ball.x=PP_W-PP_BALLR;ball.vx=-ball.vx*PP_REST;}
  if(ball.y<PP_BALLR){ball.y=PP_BALLR;ball.vy=-ball.vy*PP_REST;}
  if(ball.y>PP_H-PP_BALLR){ball.y=PP_H-PP_BALLR;ball.vy=-ball.vy*PP_REST;}
  for(i=0;i<course.walls.length;i++){
    r=course.walls[i];
    if(ppInRectPub(ball.x,ball.y,r)){
      var dl=ball.x-r.x,dr=r.x+r.w-ball.x,dtp=ball.y-r.y,db=r.y+r.h-ball.y;
      var m=Math.min(dl,dr,dtp,db);
      if(m===dl){ball.x=r.x-PP_BALLR;ball.vx=-Math.abs(ball.vx)*PP_REST;}
      else if(m===dr){ball.x=r.x+r.w+PP_BALLR;ball.vx=Math.abs(ball.vx)*PP_REST;}
      else if(m===dtp){ball.y=r.y-PP_BALLR;ball.vy=-Math.abs(ball.vy)*PP_REST;}
      else{ball.y=r.y+r.h+PP_BALLR;ball.vy=Math.abs(ball.vy)*PP_REST;}
    }
  }
  // 吃星
  for(i=0;i<course.stars.length;i++){
    var s=course.stars[i];
    if(!s.got&&Math.hypot(ball.x-s.x,ball.y-s.y)<14){s.got=true;starsGot++;say("吃到星星 +20");refreshStats();}
  }
  // 进洞
  if(Math.hypot(ball.x-course.hole.x,ball.y-course.hole.y)<PP_HOLER&&Math.hypot(ball.vx,ball.vy)<300){
    ball.vx=0;ball.vy=0;endLevel(true);return;
  }
  if(ball.vx===0&&ball.vy===0){
    if(strokes>course.par+3){say("超出杆数上限");endLevel(false);return;}
    aimAngle=Math.atan2(course.hole.y-ball.y,course.hole.x-ball.x);
  }
}
function ppInRectPub(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}

/* ---------- 渲染 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function draw(){
  if(!course)return;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.green;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=PAL.greenline;ctx.lineWidth=2;
  ctx.strokeRect(sx(6),sy(6),sx(PP_W-12),sy(PP_H-12));
  var i;
  for(i=0;i<course.walls.length;i++){
    var r=course.walls[i];
    ctx.fillStyle=PAL.wall;
    rr(sx(r.x),sy(r.y),sx(r.w),sy(r.h),6);ctx.fill();
  }
  // 洞
  ctx.fillStyle=PAL.hole;
  ctx.beginPath();ctx.arc(sx(course.hole.x),sy(course.hole.y),PP_HOLER*scale,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=PAL.surface;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(sx(course.hole.x),sy(course.hole.y),PP_HOLER*scale+2,0,Math.PI*2);ctx.stroke();
  // 星
  for(i=0;i<course.stars.length;i++){
    var s=course.stars[i];if(s.got)continue;
    drawStar(sx(s.x),sy(s.y),9);
  }
  // 球
  ctx.fillStyle=PAL.ball;
  ctx.beginPath();ctx.arc(sx(ball.x),sy(ball.y),PP_BALLR*scale,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=PAL.ballline;ctx.lineWidth=1.5;ctx.stroke();
  // 瞄准
  if(state==="running"&&!paused&&!over&&Math.hypot(ball.vx,ball.vy)<=1){
    var len=(dragging&&dragNow)?Math.min(120,Math.hypot(dragNow[0]-dragStart[0],dragNow[1]-dragStart[1])):aimPower/PP_MAXPOWER()*120;
    var ang=(dragging&&dragNow)?Math.atan2(dragNow[1]-dragStart[1],dragNow[0]-dragStart[0]):aimAngle;
    var ex=sx(ball.x)+Math.cos(ang)*len,ey=sy(ball.y)+Math.sin(ang)*len;
    ctx.strokeStyle=PAL.surface;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(sx(ball.x),sy(ball.y));ctx.lineTo(ex,ey);ctx.stroke();
    ctx.fillStyle=PAL.surface;
    ctx.beginPath();ctx.arc(ex,ey,4,0,Math.PI*2);ctx.fill();
  }
}
function PP_MAXPOWER(){return 520;}
function drawStar(x,y,r){
  ctx.fillStyle=PAL.star;
  ctx.beginPath();
  for(var i=0;i<10;i++){
    var a=-Math.PI/2+i*Math.PI/5,rad=i%2===0?r:r*0.45;
    var px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();ctx.fill();
}

/* ---------- 输入 ---------- */
function canvasPos(e){
  var r=cv.getBoundingClientRect();
  return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  if(state!=="running"||paused||over)return;
  if(Math.hypot(ball.vx,ball.vy)>1)return;
  dragging=true;dragStart=canvasPos(e);dragNow=dragStart;
});
cv.addEventListener("pointermove",function(e){
  if(!dragging)return;
  dragNow=canvasPos(e);
});
cv.addEventListener("pointerup",function(e){
  if(!dragging)return;
  dragging=false;
  var p=canvasPos(e);
  var dx=p[0]-dragStart[0],dy=p[1]-dragStart[1];
  var len=Math.hypot(dx,dy);
  if(len<8)return;
  var ang=Math.atan2(dy,dx);
  var power=Math.min(PP_MAXPOWER(),len*4.5);
  aimAngle=ang;aimPower=power;
  shoot(ang,power);
});
cv.addEventListener("pointercancel",function(){dragging=false;});
document.addEventListener("keydown",function(e){
  if(e.repeat)return;
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowLeft"||k==="a"){e.preventDefault();aimAngle-=0.08;}
  else if(k==="ArrowRight"||k==="d"){e.preventDefault();aimAngle+=0.08;}
  else if(k==="ArrowUp"||k==="w"){e.preventDefault();aimPower=Math.min(PP_MAXPOWER(),aimPower+20);}
  else if(k==="ArrowDown"||k==="s"){e.preventDefault();aimPower=Math.max(80,aimPower-20);}
  else if(k===" "){e.preventDefault();if(state==="running")shoot(aimAngle,aimPower);else if(state==="ready"||state==="over")startPlay();}
});
btnPause.addEventListener("click",togglePause);
btnRetry.addEventListener("click",function(){if(state==="running"||state==="over")retryLevel();});
btnLevels.addEventListener("click",function(){if(state==="running"&&!paused){paused=true;btnPause.textContent="继续";}showLevels();});
document.addEventListener("visibilitychange",function(){if(document.hidden&&state==="running"&&!paused)togglePause();});

/* ---------- 主循环 ---------- */
function loop(now){
  requestAnimationFrame(loop);
  var dt=((now-lastFrame)/1000)||0.016;lastFrame=now;
  if(dt>0.05)dt=0.05;
  if(state==="running"&&!paused&&!over)update(dt);
  draw();
}

setupLevel(Math.max(0,Math.min(saveData.lv,LEVELS.length-1)));
requestAnimationFrame(loop);
syncLevelsFromServer();
syncSaveFromServer();
showStart();
window.__validateLevels=function(){
  try{
    var fails=[],i;
    for(i=0;i<LEVELS.length;i++){
      var lv=PP.genLevel(LEVELS[i].no,LEVELS[i].seed);
      if(!lv)fails.push((i+1)+"(gen)");
      else{var r=PP.validate(lv);if(!r.ok)fails.push((i+1)+"("+r.why+")");}
    }
    return {total:LEVELS.length,solvable:LEVELS.length-fails.length,fail:fails};
  }catch(e){return {error:String(e)};}
};
})();
</script>
