      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},

/* ---------- 关卡数据（DB 下发优先，本地缓存兜底；任一条非法整批放弃） ---------- */
var LEVELS_KEY="sw.poemfill.v1.levels",LEVELS_VER_KEY="sw.poemfill.v1.levels.ver";
var LEVELS=DEFAULT_LEVELS.slice();
function validateLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return null;
  if(typeof d.name!=="string"||d.name.length<1||d.name.length>32)return null;
  if(d.type!=="fill"&&d.type!=="link")return null;
  if(typeof d.poem!=="string"||!d.poem)return null;
  if(typeof d.hint!=="string")return null;
  if(!Number.isInteger(d.time)||d.time<10||d.time>300)return null;
  if(!Number.isInteger(d.mistakes)||d.mistakes<1||d.mistakes>5)return null;
  var i,b,t,key,seen,opts,ansCnt,out;
  if(d.type==="fill"){
    if(!Array.isArray(d.lines)||!d.lines.length)return null;
    for(i=0;i<d.lines.length;i++){if(typeof d.lines[i]!=="string"||!d.lines[i].length)return null;}
    if(!Array.isArray(d.blanks)||d.blanks.length<1||d.blanks.length>3)return null;
    seen={};out=[];
    for(i=0;i<d.blanks.length;i++){
      b=d.blanks[i];
      if(!b||typeof b!=="object")return null;
      if(!Number.isInteger(b.line)||b.line<0||b.line>=d.lines.length)return null;
      t=d.lines[b.line];
      if(!Number.isInteger(b.pos)||b.pos<0||b.pos>=t.length)return null;
      key=b.line+","+b.pos;if(seen[key])return null;seen[key]=true;
      if(typeof b.answer!=="string"||b.answer.length!==1)return null;
      if(t[b.pos]!==b.answer)return null;
      if(!Array.isArray(b.options)||b.options.length<3||b.options.length>6)return null;
      for(var c=0;c<b.options.length;c++){if(typeof b.options[c]!=="string"||b.options[c].length!==1)return null;}
      opts=new Set(b.options);if(opts.size!==b.options.length)return null;
      ansCnt=0;for(c=0;c<b.options.length;c++){if(b.options[c]===b.answer)ansCnt++;}
      if(ansCnt!==1)return null;
      out.push({line:b.line,pos:b.pos,answer:b.answer,options:b.options.slice()});
    }
    return {name:d.name,type:"fill",poem:d.poem,hint:d.hint,lines:d.lines.slice(),blanks:out,time:d.time,mistakes:d.mistakes};
  }
  if(typeof d.prompt!=="string"||!d.prompt)return null;
  if(typeof d.answer!=="string"||!d.answer)return null;
  if(!Array.isArray(d.options)||d.options.length<3||d.options.length>6)return null;
  for(i=0;i<d.options.length;i++){if(typeof d.options[i]!=="string"||!d.options[i].length)return null;}
  opts=new Set(d.options);if(opts.size!==d.options.length)return null;
  ansCnt=0;for(i=0;i<d.options.length;i++){if(d.options[i]===d.answer)ansCnt++;}
  if(ansCnt!==1)return null;
  if(d.options.indexOf(d.prompt)>=0)return null;
  return {name:d.name,type:"link",poem:d.poem,hint:d.hint,prompt:d.prompt,answer:d.answer,options:d.options.slice(),time:d.time,mistakes:d.mistakes};
}
/* 解析 DB 下发的关卡批次：任一条非法即整批放弃（返回 null） */
function parseLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var seen={},list=[],i,it,no,d;
  for(i=0;i<res.levels.length;i++){
    it=res.levels[i];
    if(!it||typeof it!=="object")return null;
    no=it.levelNo;
    if(typeof no!=="number"||!Number.isInteger(no)||no<1||seen[no])return null;
    if(typeof it.dataJson==="string"){try{d=JSON.parse(it.dataJson);}catch(e){return null;}}
    else if(it.dataJson&&typeof it.dataJson==="object"){d=it.dataJson;}
    else{return null;}
    d=validateLevelData(d);
    if(!d)return null;
    seen[no]=true;
    list.push({no:no,d:d});
  }
  list.sort(function(a,b){return a.no-b.no;});
  return list.map(function(x){return x.d;});
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){
      var ok=true;
      for(var i=0;i<list.length;i++){if(!validateLevelData(list[i])){ok=false;break;}}
      if(ok){LEVELS=list;return v;}
    }
  }catch(e){}
  return 0;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels("poem-fill").then(function(res){
    var list=parseLevels(res);
    if(!list)return;
    if(state!=="idle"&&state!=="ready")return;//对局进行中不打断
    if(applyLevels(list,res.version||0)){
      if(cur>=LEVELS.length)cur=LEVELS.length-1;
      startLevel(cur);
      if(overlayMode==="start"){state="idle";stopTimer();}
    }
  }).catch(function(){});
}
/* ---------- 存档 ---------- */
var KEY="sw.poemfill.v1";
function loadSave(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return{lv:Math.max(0,parseInt(s.lv,10)||0),done:s.done&&typeof s.done==="object"?s.done:{},total:Math.max(0,parseInt(s.total,10)||0)};}catch(e){}return{lv:0,done:{},total:0};}
var saveData=loadSave();
function save(){
  var data={lv:saveData.lv,done:saveData.done,total:saveData.total};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("poem-fill",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("poem-fill").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=Math.max(0,parseInt(r.lv,10)||0),rt=Math.max(0,parseInt(r.total,10)||0);
      if(rl>saveData.lv){saveData.lv=Math.min(LEVELS.length-1,rl);changed=true;}
      if(rt>saveData.total){saveData.total=rt;changed=true;}
      if(r.done&&typeof r.done==="object"){
        for(var k in r.done){
          var rv=parseInt(r.done[k],10)||0,mv=parseInt(saveData.done[k],10)||0;
          if(rv>mv){saveData.done[k]=rv;changed=true;}
        }
      }
      if(changed){save();if(cur>=LEVELS.length)cur=LEVELS.length-1;startLevel(cur);
        if(overlayMode==="start"){state="idle";stopTimer();}}
    }catch(e){}
  }).catch(function(){});
}

var blanks=[],activeBlank=-1,mistakesLeft=0,timeLeft=0,timerId=null,lastTs=0,overlayMode="start";

function $(id){return document.getElementById(id);}
function say(t){$("msg").textContent=t;}
function fmtTime(t){var v=Math.max(0,Math.ceil(t)),m=Math.floor(v/60),s=v%60;return(m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function mulberry(seed){var s=seed>>>0;return function(){s|=0;s=(s+0x6d2b79f5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function shuffle(arr,rng){for(var k=arr.length-1;k>0;k--){var j=Math.floor(rng()*(k+1)),t=arr[k];arr[k]=arr[j];arr[j]=t;}return arr;}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function startTimer(){
  stopTimer();lastTs=performance.now();
  timerId=setInterval(function(){
    var now=performance.now(),dt=(now-lastTs)/1000;lastTs=now;
    if(paused||state!=="play")return;
    timeLeft-=dt;
    if(timeLeft<=0){timeLeft=0;updateStats();lose("时间到了");return;}
    updateStats();
  },200);
}
function updateStats(){
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  $("stTime").textContent=fmtTime(timeLeft);
  $("stLife").textContent=mistakesLeft;
  var stars=0;for(var k in doneSave){if(parseInt(doneSave[k],10)>0)stars++;}
  $("stStar").textContent="★ "+stars;
  $("btnReset").disabled=state==="idle";
}
/* ---------- 渲染 ---------- */
function startLevel(n){
  if(n<0)n=0;if(n>=LEVELS.length)n=LEVELS.length-1;
  cur=n;L=LEVELS[cur];type=L.type;
  if(type==="fill"){
    // 深拷贝：不把「已填/点错」状态写回关卡数据，保证重玩与切关互不串味
    blanks=L.blanks.slice().sort(function(a,b){return a.line-b.line||a.pos-b.pos;}).map(function(b){
      return {line:b.line,pos:b.pos,answer:b.answer,options:b.options.slice(),filled:null,wrong:null};
    });
    activeBlank=0;
  }else{
    blanks=[];activeBlank=-1;
  }
  mistakesLeft=L.mistakes;timeLeft=L.time;over=false;state="play";paused=false;
  renderBoard();renderCands();updateStats();
  say(type==="fill"?"点字块填入高亮空缺":"选出与上句相接的下一句");
  if(L.blanks&&L.blanks.length===0){win();return;}
  startTimer();
}
function renderBoard(){
  $("poem").textContent=L.poem;
  $("hint").textContent=L.hint||"";
  var box=$("verse");box.innerHTML="";
  if(type==="fill"){
    for(var li=0;li<L.lines.length;li++){
      var row=document.createElement("div");row.className="line";
      for(var ci=0;ci<L.lines[li].length;ci++){
        var bi=blankIndexAt(li,ci);
        if(bi<0){
          var sp=document.createElement("span");sp.className="ch";sp.textContent=L.lines[li][ci];row.appendChild(sp);
        }else{
          var bt=document.createElement("button");bt.className="slot"+((blanks[bi].filled?" lock":" empty")+(bi===activeBlank?" active":""));
          bt.textContent=blanks[bi].filled||"";
          bt.setAttribute("data-bi",String(bi));
          bt.addEventListener("click",function(){pickSlot(parseInt(this.getAttribute("data-bi"),10));});
          row.appendChild(bt);
        }
      }
      box.appendChild(row);
    }
  }else{
    var pl=document.createElement("div");pl.className="prompt-line";pl.textContent=L.prompt;box.appendChild(pl);
    var ask=document.createElement("div");ask.className="ask";ask.textContent="请选出正确的下一句";box.appendChild(ask);
  }
}
function blankIndexAt(li,ci){
  for(var i=0;i<blanks.length;i++){if(blanks[i].line===li&&blanks[i].pos===ci)return i;}
  return -1;
}
function renderCands(){
  var box=$("cands");box.innerHTML="";
  if(type==="fill"){
    if(activeBlank<0||activeBlank>=blanks.length)return;
    var opts=blanks[activeBlank].options;
    for(var i=0;i<opts.length;i++){
      var b=document.createElement("button");b.className="btn cand";b.textContent=opts[i];b.setAttribute("data-ch",opts[i]);
      if(blanks[activeBlank].wrong&&blanks[activeBlank].wrong.indexOf(opts[i])>=0)b.disabled=true;
      b.addEventListener("click",function(){pickOption(this.getAttribute("data-ch"),this);});
      box.appendChild(b);
    }
  }else{
    for(var j=0;j<L.options.length;j++){
      var bb=document.createElement("button");bb.className="btn cand link";bb.textContent=L.options[j];bb.setAttribute("data-ch",L.options[j]);
      bb.addEventListener("click",function(){pickOption(this.getAttribute("data-ch"),this);});
      box.appendChild(bb);
    }
  }
}
/* ---------- 交互 ---------- */
function pickSlot(bi){
  if(over||state!=="play")return;
  if(bi<0||bi>=blanks.length||blanks[bi].filled)return;
  activeBlank=bi;renderBoard();renderCands();
  say("已选中第 "+(bi+1)+" 处空缺");
}
function pickOption(ch,btn){
  if(over||state!=="play")return;
  if(type==="fill"){
    if(activeBlank<0)return;
    var b=blanks[activeBlank];
    if(ch===b.answer){
      b.filled=b.answer;btn.classList.add("ok");btn.disabled=true;
      var nx=-1;
      for(var i=0;i<blanks.length;i++){if(!blanks[i].filled){nx=i;break;}}
      activeBlank=nx;
      renderBoard();renderCands();updateStats();
      if(nx<0){win();return;}
      say("「"+b.answer+"」填对了！继续下一处");
    }else{
      mistakesLeft--;wrongMark(b,ch);btn.disabled=true;btn.classList.add("bad");
      setTimeout(function(){btn.classList.remove("bad");},260);
      updateStats();
      if(mistakesLeft<=0){lose("机会用完了");return;}
      say("「"+ch+"」不对，再想想");
    }
  }else{
    if(ch===L.answer){
      btn.classList.add("ok");btn.disabled=true;
      win();return;
    }
    mistakesLeft--;btn.disabled=true;btn.classList.add("bad");
    setTimeout(function(){btn.classList.remove("bad");},260);
    updateStats();
    if(mistakesLeft<=0){lose("机会用完了");return;}
    say("这句接不上，再想想");
  }
}
function wrongMark(b,ch){
  if(!b.wrong)b.wrong=[];
  if(b.wrong.indexOf(ch)<0)b.wrong.push(ch);
}
/* ---------- 结算 ---------- */
function calcStars(){
  var frac=timeLeft/L.time;
  var s=1;
  if(frac>=0.35)s++;
  if(mistakesLeft===L.mistakes)s++;
  return Math.min(3,s);
}
function win(){
  over=true;state="over";stopTimer();
  var stars=calcStars();
  var gained=100+Math.max(0,Math.ceil(timeLeft))*2+mistakesLeft*30;
  totalScore+=gained;
  var prev=parseInt(doneSave[String(cur)],10)||0;
  if(stars>prev)doneSave[String(cur)]=stars;
  if(cur+1<LEVELS.length)saveData.lv=Math.max(saveData.lv,cur+1);
  save();
  var doneCount=0;for(var k in doneSave){if(parseInt(doneSave[k],10)>0)doneCount++;}
  if(GB.available)GB.reportScore("poem-fill",{metricValue:doneCount,metricExtra:totalScore}).catch(function(){});
  var starTxt="";for(var i=0;i<stars;i++)starTxt+="★";
  $("ovTitle").textContent="过关！";
  $("ovDesc").innerHTML=(type==="fill"?(L.lines[0]||""):(L.prompt+" → "+L.answer))+"<br>星级 "+starTxt+" · 本关 "+gained+" 分 · 累计 "+totalScore;
  $("ovBtn").textContent=cur+1<LEVELS.length?"下一关":"再玩一次";
  overlayMode="win";showOverlay();updateStats();
}
function lose(reason){
  over=true;state="over";stopTimer();
  $("ovTitle").textContent="本关失败";
  $("ovDesc").innerHTML=reason+"<br>已完成 "+(type==="fill"?(blanks.filter(function(b){return !!b.filled;}).length+"/"+blanks.length):"0/1")+" · 累计总分 "+totalScore;
  $("ovBtn").textContent="重试本关";
  overlayMode="lose";showOverlay();updateStats();
}
function showOverlay(){$("overlay").classList.add("show");}
function hideOverlay(){$("overlay").classList.remove("show");}
/* ---------- 按钮 ---------- */
$("btnReset").addEventListener("click",function(){if(state==="idle")return;startLevel(cur);say("本关已重置");});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(overlayMode==="start"){state="play";startTimer();}
  else if(overlayMode==="win"){startLevel(cur+1<LEVELS.length?cur+1:cur);}
  else{startLevel(cur);}
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden)paused=true;
  else{paused=false;lastTs=performance.now();}
});
/* ---------- 启动 ---------- */
loadCachedLevels();
var startIdx=Math.min(Math.max(saveData.lv,0),LEVELS.length-1);
startLevel(startIdx);
state="idle";stopTimer();
$("ovTitle").textContent="诗词填空";
$("ovDesc").innerHTML="规则：有的关卡给出一句诗的空缺，从候选字中选正确的字填入；有的关卡给出上句，选出相连的下一句。<br>限时完成、点错扣机会；剩余时间与机会决定星级。";
$("ovBtn").textContent="开始游戏";
overlayMode="start";showOverlay();updateStats();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
</body>
</html>
