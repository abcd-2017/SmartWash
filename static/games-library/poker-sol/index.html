<html lang="zh-CN">
<head>

<title>牌型计分</title>
<style>
  /*token:GAME-THEME.md §2 基线（按需裁剪）+ §3 素材 token（牌面 / 空格凹槽 / 目标 / 王牌）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-ps-face1:#FFFFFF;--g-ps-face2:#EDF4EF;--g-ps-cell:#E3EAE2;--g-ps-goal:#1E6B4A;--g-ps-jk1:#A2610E;--g-ps-jk2:#6E3F08;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-ps-face1:#262B27;--g-ps-face2:#1A1E1B;--g-ps-cell:#151816;--g-ps-goal:#123A2C;color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.4; }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; min-width: 0; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 8px; text-align: center; line-height: 1.3; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { display: inline-block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  /* 数据变化轻弹：仅当前真变化时由 JS 挂 .bump */
  .val.bump { animation: valPop .3s ease-out; }
  @keyframes valPop { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .dealrow { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  /* 当前待摆牌：牌面渐变 + 左上高光 + 投影，与盘上摆下的牌同材质 */
  .curcard {
    position: relative; width: 56px; height: 78px; flex: none; border-radius: 10px;
    background: linear-gradient(165deg, var(--g-ps-face1), var(--g-ps-face2));
    border: 1px solid var(--g-border);
    box-shadow: 0 1px 2px rgba(20,40,30,.06), 0 4px 10px rgba(20,40,30,.09);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; line-height: 1.15; color: var(--g-text);
  }
  .curcard::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(80% 50% at 24% 8%, rgba(255,255,255,.42), rgba(255,255,255,0) 60%);
  }
  .curcard .rk { position: relative; z-index: 1; }
  .curcard small { position: relative; z-index: 1; font-size: 12px; color: var(--g-muted); font-weight: 500; }
  .curcard.red { color: var(--g-danger); }
  .curcard.red small { color: var(--g-danger); opacity: .8; }
  .curcard.joker { background: linear-gradient(165deg, var(--g-ps-jk1), var(--g-ps-jk2)); border-color: rgba(255,255,255,.28); color: #fff; }
  .curcard.joker small { color: #fff; }
  .curcard.done { background: var(--g-surface2); border: 1px solid var(--g-border); box-shadow: none; color: var(--g-ps-goal); }
  .curcard.done small { color: var(--g-muted); }
  .dealinfo { flex: 1; min-width: 0; font-size: 14px; color: var(--g-muted); line-height: 1.5; }
  /* 牌桌：顶部品牌绿软底 → 卡面，铺出层次 */
  .board { background: linear-gradient(180deg, var(--g-primary-soft), var(--g-surface) 58%); border-radius: var(--g-radius); box-shadow: var(--g-shadow); padding: 10px 6px 12px; }
  .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  /* 空格：内凹槽 + 角标（行列坐标），键盘 / 提示定位可读 */
  .pcell {
    position: relative; aspect-ratio: 3/4; min-height: 44px; border: 1px solid var(--g-border); padding: 0;
    border-radius: 10px; background: var(--g-ps-cell);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.10);
    font-family: inherit; font-size: 18px; font-weight: 700; line-height: 1.1;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--g-text);
    transition: transform .16s ease-out, box-shadow .16s ease-out, background .16s ease-out;
  }
  /* 角标用 --g-muted 的低对比同族（定位提示，语义在 aria-label） */
  .pcell .pos { position: absolute; top: 3px; left: 5px; font-size: 12px; font-weight: 600; color: var(--g-muted); opacity: .55; line-height: 1; }
  .pcell .cen { position: absolute; right: 5px; bottom: 3px; font-size: 14px; line-height: 1; opacity: .85; }
  .pcell .rk { position: relative; z-index: 1; }
  /* 摆下的牌：牌面渐变 + 高光 + 投影（轻立体），与当前牌同材质 */
  .pcell.filled {
    background: linear-gradient(165deg, var(--g-ps-face1), var(--g-ps-face2));
    border: 1px solid var(--g-border);
    box-shadow: var(--g-shadow);
  }
  .pcell.filled::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(80% 50% at 24% 8%, rgba(255,255,255,.42), rgba(255,255,255,0) 60%);
  }
  .pcell.red { color: var(--g-danger); }
  /* 王牌：深暖金渐变 + 白字，与常规牌明确区分（牌面文字承载「王牌」语义）
     浅端 #A2610E 对白字 4.94:1、深端 #6E3F08 对 8.83:1，均过正文 4.5:1 */
  .pcell.joker { background: linear-gradient(165deg, var(--g-ps-jk1), var(--g-ps-jk2)); border-color: rgba(255,255,255,.28); color: #fff; }
  .pcell.joker .pos { color: rgba(255,255,255,.75); }
  .pcell.joker .cen { color: #fff; }
  /* 当前待摆落点：品牌绿环浮起；末列满手：暖金环提示「这行已成一手」 */
  .pcell.cur {
    border-color: var(--g-primary);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.10), 0 0 0 2px var(--g-primary), 0 8px 16px rgba(20,40,30,.18);
  }
  .pcell.rowend { box-shadow: inset 0 2px 6px rgba(0,0,0,.10), 0 0 0 2px var(--g-warning); }
  .pcell.filled.rowend { box-shadow: 0 1px 2px rgba(20,40,30,.06), 0 4px 10px rgba(20,40,30,.09), 0 0 0 2px var(--g-warning); }
  .pcell.filled.cur { box-shadow: 0 1px 2px rgba(20,40,30,.06), 0 4px 10px rgba(20,40,30,.09), 0 0 0 2px var(--g-primary), 0 8px 16px rgba(20,40,30,.18); }
  .pcell:active { transform: scale(.96); }
  /* 刚摆下：轻弹一次（JS 挂 .just，动画结束摘除） */
  .pcell.just { animation: place .2s ease-out; }
  @keyframes place { 0% { transform: scale(.82); } 62% { transform: scale(1.07); } 100% { transform: scale(1); } }
  /* 入场错落：逐格浮起，40ms 间隔（--i 由 JS 写入） */
  .grid5.entering .pcell { animation: rise .32s ease-out both; animation-delay: calc(var(--i, 0) * 40ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; font-weight: 500; color: var(--g-muted); text-align: center; }
  .msg.err { color: var(--g-danger); }
  .msg.win { color: var(--g-success); }
  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn {
    min-height: 44px; padding: 0 10px; flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .12s ease-out, opacity .16s ease-out;
  }
  .btn.primary { background: var(--g-btn-primary); color: #fff; font-size: 16px; font-weight: 600; }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .35; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  /* 过关反馈：轻弹（未达标 / 选关不挂 .win，保持克制） */
  .panel.win { animation: winpop .45s cubic-bezier(.18,.9,.3,1.4); }
  @keyframes winpop { 0% { transform: scale(.86); opacity: 0; } 62% { transform: scale(1.045); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.7; }
  .panel .desc b { color: var(--g-primary-deep); }
  .panel.win .desc b { color: var(--g-warning); }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
    transition: transform .12s ease-out;
  }
  .lvbtn:active { transform: scale(.96); }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }
  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（§6.1 模板：时长与延迟同时归零） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }
  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>

(function(){

  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];

    return new Promise(function(resolve,reject){

      var cbId="gb"+Date.now()+"_"+(++seq);

      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,

function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.target)||d.target<40||d.target>260)return false;
  if(d.jokers!==0&&d.jokers!==2)return false;
  return true;
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    var ck=d.target+"|"+d.jokers;
    if(seen[ck])return null;seen[ck]=1;
    list.push({name:String(d.name),target:d.target,jokers:d.jokers});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData))LEVELS=list;
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      loadLevel(lv);
    }
  }).catch(function(){});
}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").innerHTML=SW_ICON("x")+"取消";
  $("panel").classList.remove("win");
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

/* ---------- 牌引擎：r 2-14(A)，s 0-3；王 r=0 ---------- */
var RANK_TXT={11:"J",12:"Q",13:"K",14:"A"};
var SUIT_TXT=["♠","♥","♣","♦"];   /* 文本牌名（aria-label / 提示语）用；牌面图形走 SW_ICON */
var SUIT_NAMES=["spade","heart","diamond","club"];
var RED=[false,true,true,false];
function rankTxt(r){return r===0?"王":(RANK_TXT[r]||String(r));}
/* 五张实牌评估（USPC 计分） */
function evalReal(cs){
  var rs=cs.map(function(c){return c.r}).sort(function(a,b){return b-a});
  var flush=cs.every(function(c){return c.s===cs[0].s});
  var cnt={},i;
  for(i=0;i<5;i++)cnt[rs[i]]=(cnt[rs[i]]||0)+1;
  var groups=[];
  for(var key in cnt)groups.push(cnt[key]);
  groups.sort(function(a,b){return b-a});
  var uniq=[];
  for(i=0;i<5;i++)if(uniq.indexOf(rs[i])<0)uniq.push(rs[i]);
  uniq.sort(function(a,b){return a-b});
  var straight=uniq.length===5&&(rs[0]-rs[4]===4||(uniq.join()==="2,3,4,5,14"));
  if(flush&&uniq.length===5&&uniq.join()==="10,11,12,13,14")return 100;
  if(straight&&flush)return 75;
  if(groups[0]===4)return 50;
  if(groups[0]===3&&groups[1]===2)return 25;
  if(flush)return 20;
  if(straight)return 15;
  if(groups[0]===3)return 10;
  if(groups[0]===2&&groups[1]===2)return 5;
  if(groups[0]===2)return 2;
  return 0;
}
/* 含王牌评估：枚举替换 */
function evalHand(cards){
  var jokers=[],real=[],i,j;
  for(i=0;i<5;i++)(cards[i].r===0?jokers:real).push(cards[i]);
  if(!jokers.length)return evalReal(real);
  var best=0;
  function rec(depth,acc){
    if(depth===jokers.length){
      var v=evalReal(acc);
      if(v>best)best=v;
      return;
    }
    for(var r=2;r<=14;r++)for(var s=0;s<4;s++){
      acc.push({r:r,s:s});
      rec(depth+1,acc);
      acc.pop();
    }
  }
  rec(0,real.slice());
  return best;
}
function scoreGrid(grid){
  var s=0,i,j;
  for(i=0;i<5;i++){
    var row=[],col=[],rf=true,cf=true;
    for(j=0;j<5;j++){
      var a=grid[i*5+j],b=grid[j*5+i];
      if(a)row.push(a);else rf=false;
      if(b)col.push(b);else cf=false;
    }
    if(rf)s+=evalHand(row);
    if(cf)s+=evalHand(col);
  }
  return s;
}
function buildDeck(jokers){
  var d=[],r,s,i,k;
  for(r=2;r<=14;r++)for(s=0;s<4;s++)d.push({r:r,s:s});
  for(i=0;i<jokers;i++)d.push({r:0,s:0});
  for(k=d.length-1;k>0;k--){
    var j=Math.floor(Math.random()*(k+1)),tmp=d[k];d[k]=d[j];d[j]=tmp;
  }
  return d;
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,grid=new Array(25).fill(null),deck=[],dealt=0,over=false,won=false,finalScore=0,cur=12,hist=[];
function $(id){return document.getElementById(id)}
function say(t,cls){var m=$("msg");m.textContent=t;m.className="msg"+(cls?" "+cls:"")}
function curCard(){return deck[dealt]}
/* 数据变化轻弹（渲染层动效辅助，不改玩法逻辑） */
function bump(id){var e=$(id);if(!e||window.__gRM)return;e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}
function loadLevel(x){
  lv=Math.max(0,Math.min(x,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  grid=new Array(25).fill(null);
  deck=buildDeck(L.jokers);
  dealt=0;over=false;won=false;finalScore=0;cur=12;hist=[];
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent="目标 "+L.target+" 分"+(L.jokers?" · 双王牌":"")+" · 25 张牌";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  buildGrid();updStats();
  say("点任意空格放下当前这张牌");
}
/* ---------- 渲染（建盘一次 + 就地补丁） ---------- */
var cellEls=[];
function buildGrid(){
  var box=$("grid");
  box.innerHTML="";cellEls=[];
  for(var i=0;i<25;i++){
    (function(i){
      var b=document.createElement("button");
      b.type="button";
      b.className="pcell";
      b.style.setProperty("--i",String(i));
      b.setAttribute("aria-label","格"+(Math.floor(i/5)+1)+"-"+(i%5+1));
      b.innerHTML='<span class="pos" aria-hidden="true"></span><span class="rk"></span><span class="cen"></span>';
      b.addEventListener("click",function(){tapCell(i)});
      box.appendChild(b);
      cellEls.push(b);
    })(i);
  }
  renderGrid();
}
/* 空格角标：行列坐标（仅定位装饰，语义在 aria-label） */
function posTxt(i){return (Math.floor(i/5)+1)+"-"+(i%5+1)}
/* 行差 1 张满：暖金环提示「再放一张这行就成一手」 */
function rowOneShort(r){var j,n=0;for(j=0;j<5;j++)if(grid[r*5+j])n++;return n===4}
function renderGrid(){
  for(var i=0;i<25;i++){
    var b=cellEls[i],c=grid[i];
    var cls="pcell"+(c?" filled":"")+(c&&c.r===0?" joker":"")+(c&&c.r!==0&&RED[c.s]?" red":"");
    if(i===cur&&!over)cls+=" cur";
    else if(!c&&rowOneShort(Math.floor(i/5)))cls+=" rowend";
    if(b.className!==cls)b.className=cls;
    b.setAttribute("aria-label",c?("格"+posTxt(i)+" "+cardName(c)):("空格"+posTxt(i)));
    b.querySelector(".pos").textContent=c?"":posTxt(i);
    b.querySelector(".rk").textContent=c?(c.r===0?"王":rankTxt(c.r)):"";
    b.querySelector(".cen").innerHTML=c?SW_ICON(SUIT_NAMES[c.s]):"";
  }
}
function cardName(c){return c.r===0?"王牌":(SUIT_TXT[c.s]+rankTxt(c.r))}
function updStats(){
  var s=scoreGrid(grid);
  var el=$("stScore");
  if(el.textContent!==String(s)){el.textContent=s;bump("stScore")}
  $("stTarget").textContent=L.target;
  var cc=curCard();
  var box=$("curcard");
  if(cc){
    var jk=cc.r===0;
    box.className="curcard"+(jk?" joker":(RED[cc.s]?" red":""));
    box.innerHTML='<span class="rk">'+(jk?"王":rankTxt(cc.r))+'</span><small>'+(jk?"万能":SUIT_TXT[cc.s])+'</small>';
    $("dealinfo").textContent="还剩 "+(25-dealt)+" 张 · 行列成牌即计分";
  } else {
    box.className="curcard done";
    box.innerHTML=SW_ICON("check")+"<small>已摆完</small>";
    $("dealinfo").textContent="25 张已摆完，最终得分见结算";
  }
  $("btnUndo").disabled=!hist.length||over;
}
/* 刚摆下：轻弹一次（动画结束摘除 .just，状态切换本身不依赖动画） */
function justPlace(i){
  var b=cellEls[i];if(!b||window.__gRM)return;
  b.classList.remove("just");void b.offsetWidth;b.classList.add("just");
  setTimeout(function(){b.classList.remove("just")},220);
}
/* 入场错落：仅进关首次播放，之后不再重播 */
var hasEntered=false;
function enterGrid(){
  if(hasEntered)return;
  hasEntered=true;
  var g=$("grid");
  g.classList.add("entering");
  setTimeout(function(){g.classList.remove("entering")},window.__gRM?80:1400);
}
function tapCell(i){
  if(over)return;
  var cc=curCard();
  if(!cc){say("牌已发完","err");return;}
  if(grid[i]){say("这个格子已经有牌了","err");return;}
  hist.push({i:i,card:cc});
  grid[i]=cc;dealt++;
  updStats();renderGrid();justPlace(i);
  if(dealt>=25){
    finalScore=scoreGrid(grid);
    endGame(finalScore>=L.target);
    return;
  }
  var s=scoreGrid(grid);
  say("已放 "+dealt+"/25 · 当前 "+s+" 分");
}
function undo(){
  if(!hist.length||over)return;
  var h=hist.pop();
  grid[h.i]=null;dealt--;
  updStats();renderGrid();say("已撤回上一张");
}
function hint(){
  if(over)return;
  var cc=curCard();
  if(!cc)return;
  var best=-1,bestV=-1,i;
  for(i=0;i<25;i++){
    if(grid[i])continue;
    grid[i]=cc;
    var v=scoreGrid(grid);
    grid[i]=null;
    if(v>bestV){bestV=v;best=i;}
  }
  if(best>=0){cur=best;renderGrid();say("提示：这张牌放高亮格，估分 "+bestV);}
}
function endGame(w){
  over=true;won=w;
  if(w&&lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:w?lv+1:lv,metricExtra:finalScore}).catch(function(){});
  $("panel").classList.toggle("win",w);
  $("ovTitle").textContent=w?(lv>=LEVELS.length-1?"全部通关！":"过关！"):"未达标";
  $("ovDesc").innerHTML="最终得分 <b>"+finalScore+"</b> / 目标 "+L.target+(w&&lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"");
  $("ovBtn").innerHTML=SW_ICON(w?"arrow-right":"reset")+(w?(lv>=LEVELS.length-1?"回到第 1 关":"下一关"):"再试一次");
  $("overlay").classList.add("show");updStats();
}
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本局已重置")});
$("btnLv").addEventListener("click",function(){if(!over)openLevelSelect();});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(over){if(won&&lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0);}else loadLevel(won?lv+1:lv);}
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowUp"||k==="ArrowDown"||k==="ArrowLeft"||k==="ArrowRight"){
    var r=Math.floor(cur/5),c=cur%5;
    if(k==="ArrowUp")r=Math.max(0,r-1);
    if(k==="ArrowDown")r=Math.min(4,r+1);
    if(k==="ArrowLeft")c=Math.max(0,c-1);
    if(k==="ArrowRight")c=Math.min(4,c+1);
    cur=r*5+c;e.preventDefault();renderGrid();
  }
  else if(k===" "||k==="Enter"){
    if($("overlay").classList.contains("show")){$("ovBtn").click();}
    else tapCell(cur);
    e.preventDefault();
  }
  else if(k==="u"||k==="U")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本局已重置")}
});
/* ---------- 内嵌独立验证器（锚点用例 + 评估器一致性 + 发牌校验） ---------- */
function selfTest(){
  var total=0,ok=0,fails=[];
  function chk(c,name){total++;if(c)ok++;else fails.push(name);}
  chk(DEFAULT_LEVELS.length===40,"关卡数=40");
  chk(DEFAULT_LEVELS.every(validLevelData),"关卡配置合法");
  /* 锚点①：USPC 牌型分（固定手牌，手算） */
  function C(r,s){return {r:r,s:s}}
  function J(){return {r:0,s:0}}
  chk(evalHand([C(14,0),C(13,0),C(12,0),C(11,0),C(10,0)])===100,"锚点:皇家同花顺100");
  chk(evalHand([C(9,1),C(8,1),C(7,1),C(6,1),C(5,1)])===75,"锚点:同花顺75");
  chk(evalHand([C(14,0),C(14,1),C(14,2),C(14,3),C(5,0)])===50,"锚点:四条50");
  chk(evalHand([C(13,0),C(13,1),C(13,2),C(2,3),C(2,0)])===25,"锚点:葫芦25");
  chk(evalHand([C(14,0),C(11,0),C(8,0),C(5,0),C(2,0)])===20,"锚点:同花20");
  chk(evalHand([C(4,0),C(5,1),C(6,2),C(7,3),C(8,0)])===15,"锚点:顺子15");
  chk(evalHand([C(4,1),C(5,1),C(6,0),C(7,3),C(8,2)])===15,"锚点:顺子乱色15");
  chk(evalHand([C(5,0),C(4,0),C(3,2),C(2,3),C(14,1)])===15,"锚点:A2345轮子15");
  chk(evalHand([C(9,0),C(9,1),C(9,2),C(4,3),C(2,0)])===10,"锚点:三条10");
  chk(evalHand([C(9,0),C(9,1),C(4,2),C(4,3),C(2,0)])===5,"锚点:两对5");
  chk(evalHand([C(9,0),C(9,1),C(4,2),C(7,3),C(2,0)])===2,"锚点:一对2");
  chk(evalHand([C(9,0),C(6,1),C(4,2),C(7,3),C(2,0)])===0,"锚点:散牌0");
  /* 锚点②：王牌万能——单王补成皇家 / 双王补四条 */
  chk(evalHand([J(),C(14,0),C(13,0),C(12,0),C(11,0)])===100,"锚点:单王皇家100");
  chk(evalHand([J(),C(10,0),C(13,0),C(12,0),C(11,0)])===100,"锚点:单王补10♠皇家100");
  chk(evalHand([J(),J(),C(9,0),C(9,1),C(2,3)])===50,"锚点:双王四条50");
  /* 发牌：52(+2) 无重复 */
  (function(){
    var d=buildDeck(2);
    var keys={};
    for(var i=0;i<d.length;i++){
      var k=d[i].r===0?"J"+i:d[i].r+"_"+d[i].s;
      if(keys[k])return chk(false,"发牌:无重复");
      keys[k]=1;
    }
    chk(d.length===54,"发牌:54张含2王");
    var d2=buildDeck(0);
    chk(d2.length===52,"发牌:52张无王");
  })();
  /* 计盘：空盘 0 分；已知摆盘行分求和（手算） */
  (function(){
    chk(scoreGrid(new Array(25).fill(null))===0,"计盘:空盘0");
    var g=new Array(25).fill(null);
    g[0]=C(14,0);g[1]=C(13,0);g[2]=C(12,0);g[3]=C(11,0);g[4]=C(10,0);
    chk(scoreGrid(g)===100,"计盘:单行皇家100");
  })();
  window.__gSelfTest={ok:ok,total:total,fails:fails};
  if(fails.length)say("警告：内嵌自检未全过（"+ok+"/"+total+"）","err");
}
/* ---------- 启动（续玩：从存档关卡起步） ---------- */
loadLevel(save.lv);selfTest();enterGrid();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
