<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var PF={NEED:0.6,GROW:0.15,BASE:-0.045,STARTW:0.1,CAP_BUY:5,BUY_COST:20,
  FINGER_W:0.05,FEED_C:1,LEVEL_COUNT:40};
PF.priceSeries=function(seed,N){
  var rng=mulberry32(seed),arr=[],ph=rng()*6.283;
  for(var d=0;d<N;d++)arr.push(Math.round((23+5*Math.sin(d/3.2+ph)+rng()*3)*10)/10);
  return arr;
};
PF.newState=function(lv){return{day:1,n:lv.startN,tw:lv.startN*PF.STARTW,cash:lv.startCash};};
/* 当日投喂生长 + 密度超容量折损 */
PF.tickDay=function(lv,st,F){
  var perFish=F/st.n;
  var g=perFish*PF.GROW+PF.BASE;
  st.tw+=st.n*g;
  if(st.tw<0)st.tw=0;
  if(st.n>lv.cap){st.tw*=lv.cap/st.n;st.n=lv.cap;}
};
/* 全捕（均重 ≥ 下限才允许），按当日鱼价 */
PF.harvest=function(lv,st){
  if(st.n<1)return{ok:false,why:"empty"};
  var avg=st.tw/st.n;
  if(avg<lv.minW)return{ok:false,why:"small",avg:Math.round(avg*100)/100};
  var p=lv.prices[Math.min(st.day-1,lv.prices.length-1)];
  var gain=Math.round(st.tw*p);
  st.cash+=gain;
  st.n=0;st.tw=0;
  return{ok:true,gain:gain};
};
PF.buy=function(lv,st){
  if(st.cash<PF.BUY_COST)return{ok:false,why:"poor"};
  if(st.n>lv.cap-PF.CAP_BUY)return{ok:false,why:"full"};
  st.cash-=PF.BUY_COST;
  st.n+=PF.CAP_BUY;
  st.tw+=PF.CAP_BUY*PF.FINGER_W;
  return{ok:true};
};
/* 参考策略回放：喂足（量力）、达标记且价不低全捕、随后补苗到满塘 */
PF.greedyRun=function(lv){
  var st=PF.newState(lv),med=median(lv.prices);
  for(var d=0;d<lv.days;d++){
    var want=st.n*PF.NEED*1.3;
    var F=Math.max(0,Math.min(want,st.cash/PF.FEED_C));
    st.cash-=F*PF.FEED_C;
    var avgOk=st.n>0&&st.tw/st.n>=lv.minW;
    if(avgOk&&lv.prices[d]>=med){PF.harvest(lv,st);}
    var guard=0;
    while(st.n<=lv.cap-PF.CAP_BUY&&st.cash>=PF.BUY_COST&&guard<20){
      PF.buy(lv,st);guard++;
    }
    PF.tickDay(lv,st,F);
    st.day=d+2;
  }
  return {cash:st.cash,n:st.n,tw:Math.round(st.tw*100)/100};
};
function median(arr){
  var a=arr.slice().sort(function(x,y){return x-y}),m=Math.floor(a.length/2);
  return a.length%2?a[m]:(a[m-1]+a[m])/2;
}
/* 生成：目标=参考策略终值×0.8 */
PF.genLevel=function(no){
  for(var attempt=0;attempt<30;attempt++){
    var p=(no-1)/(PF.LEVEL_COUNT-1);
    var N=Math.round(25+p*15);
    var cap=24+Math.floor(p*8);
    var lv={name:"鱼塘·"+(no<10?"0":"")+no,days:N,cap:cap,startN:20,startCash:800,
      minW:0.7,prices:PF.priceSeries(9000+no*7+attempt,N),
      difficulty:Math.min(9,1+Math.floor(no/5))};
    var g=PF.greedyRun(lv);
    if(g.cash<lv.startCash*1.1)continue;
    lv.target=Math.max(lv.startCash,Math.floor(g.cash*0.8));
    return lv;
  }
  return {name:"鱼塘·"+(no<10?"0":"")+no,days:30,cap:28,startN:20,startCash:800,minW:0.7,
    prices:PF.priceSeries(9999,30),target:1200,difficulty:Math.min(9,1+Math.floor(no/5))};
};
/* 结构校验 */
PF.validate=function(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return{ok:false,why:"bad"};
  if(!Number.isInteger(d.days)||d.days<15||d.days>45)return{ok:false,why:"days"};
  if(!Number.isInteger(d.cap)||d.cap<10||d.cap>60)return{ok:false,why:"cap"};
  if(!Number.isInteger(d.startN)||d.startN<1||d.startN>d.cap)return{ok:false,why:"startN"};
  if(!isFinite(d.startCash)||d.startCash<0)return{ok:false,why:"cash"};
  if(!isFinite(d.minW)||d.minW<0.2||d.minW>1.5)return{ok:false,why:"minW"};
  if(!Array.isArray(d.prices)||d.prices.length!==d.days)return{ok:false,why:"prices"};
  for(var i=0;i<d.prices.length;i++)if(!isFinite(d.prices[i])||d.prices[i]<1||d.prices[i]>60)return{ok:false,why:"p"+i};
  if(!Number.isInteger(d.target)||d.target<100)return{ok:false,why:"target"};
  var g=PF.greedyRun(d);
  if(g.cash<d.target)return{ok:false,why:"unsolvable"};
  return{ok:true,why:""};
};
PF.validateAll=function(){
  var fails=[],i;
  for(i=1;i<=PF.LEVEL_COUNT;i++){
    var L=PF.genLevel(i),r=PF.validate(L);
    if(!r.ok)fails.push(i+"("+r.why+")");
  }
  return {total:PF.LEVEL_COUNT,solvable:PF.LEVEL_COUNT-fails.length,fail:fails};
};
PF.runTests=function(){
  var pass=0,rows=[];
  function ck(name,ok,got){rows.push({name:name,ok:!!ok,got:got});if(ok)pass++;}
  var lv={days:10,cap:40,startN:20,startCash:800,minW:0.7,prices:[20,20,20,20,20,20,20,20,20,20],target:900};
  //锚点1：足喂单日产增长精确：F=13,n=10,tw=5 → +10×(1.3×0.15-0.045)=+1.5
  var st1=PF.newState(lv);st1.n=10;st1.tw=5;
  PF.tickDay(lv,st1,13);
  ck("锚点·足喂日增 1.5",Math.abs((st1.tw-5)-1.5)<1e-9,"tw="+st1.tw);
  //锚点2：超容量折损：先增重再折算（F=18,n=30：g=0.6×0.15-0.045=0.045 → tw=(10+1.35)×25/30）
  var st2=PF.newState(lv);st2.n=30;st2.tw=10;lv2={days:10,cap:25,startN:20,startCash:800,minW:0.7,prices:[20]};
  PF.tickDay(lv2,st2,18);
  ck("锚点·超容折损 9.458",Math.abs(st2.n-25)<1e-9&&Math.abs(st2.tw-9.458333333)<1e-6,"n="+st2.n+",tw="+st2.tw.toFixed(3));
  //锚点3：达标全捕按当日价结算
  var st3=PF.newState(lv);st3.n=10;st3.tw=8;st3.day=1;
  var h3=PF.harvest(lv,st3);
  ck("锚点·全捕 +160",h3.ok&&h3.gain===160&&st3.n===0,"gain="+h3.gain);
  //锚点4：未达标拒捕
  var st4=PF.newState(lv);st4.n=10;st4.tw=5;
  var h4=PF.harvest(lv,st4);
  ck("锚点·未达标拒捕",!h4.ok&&h4.why==="small","why="+h4.why);
  //锚点5：投苗账目精确
  var st5=PF.newState(lv);
  var b5=PF.buy(lv,st5);
  ck("锚点·投苗 -20/+5尾",b5.ok&&st5.cash===780&&st5.n===25&&Math.abs(st5.tw-2.25)<1e-9,"cash="+st5.cash+",tw="+st5.tw);
  var r=PF.validateAll();
  ck("40 关参考策略可达标",r.fail.length===0,"fail="+r.fail.join(","));
  var L1=PF.genLevel(1),L2=PF.genLevel(1);
  ck("生成确定性",JSON.stringify(L1)===JSON.stringify(L2),"replay");
  return {total:7,pass:pass,rows:rows,levels:r};
};
globalThis.__XC=PF;
/*XC-CORE-END*/

/* ========== 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ========== */
var GAME_KEY="pond-fish",SAVE_KEY="sw.pondfish.v1";
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=PF.LEVEL_COUNT;i++)list.push(PF.genLevel(i));
  return list;
}
var LEVELS=buildDefaultLevels();
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!PF.validate(d).ok)return null;
    var no=parseInt(row.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=1;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return PF.validate(d).ok})){
      LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      loadLevel(cur);
    }
  }).catch(function(){});
}

/* ========== 存档（本地 + 账号双写，账号更优才覆盖） ========== */
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:parseInt(s.lv,10)||0,best:parseInt(s.best,10)||1}}catch(e){return{lv:0,best:1}}}
var save=loadSave();
var unlocked=clamp(save.best,1,1);
function persist(){
  var data={lv:cur,best:unlocked};
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson||state!=="edit")return;
    try{
      var r=JSON.parse(res.stateJson),ch=false;
      var rl=parseInt(r.lv,10),rb=parseInt(r.best,10);
      if(isFinite(rl)&&rl>save.lv&&rl<LEVELS.length){save.lv=rl;ch=true;}
      if(isFinite(rb)&&rb>unlocked&&rb<=LEVELS.length){unlocked=rb;ch=true;}
      if(ch){cur=clamp(save.lv,0,LEVELS.length-1);persist();loadLevel(cur);}
    }catch(e){}
  }).catch(function(){});
}

/* ========== 调色板 ========= */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),
    water:v("--g-water"),pond:v("--g-st-pond"),pond2:v("--g-st-pond2"),fish:v("--g-st-fish")};
}
window.__gOnTheme=function(){palLoad()};
palLoad();

/* ========== 画布与状态 ========= */
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,cur=save.lv,L=null,st=null,feedChosen=-1;
var state="edit",done=false;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);var H=170;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",function(){resize();draw();});
function feedPlan(k){
  var mult=k===0?1.0:(k===1?1.15:1.3);
  var F=Math.round(st.n*PF.NEED*mult*10)/10;
  return {F:F,cost:Math.ceil(F*PF.FEED_C)};
}
function loadLevel(n){
  cur=clamp(n,0,LEVELS.length-1);
  L=LEVELS[cur];
  if(!PF.validate(L).ok){say("关卡数据异常");return;}
  st=PF.newState(L);
  feedChosen=-1;state="edit";done=false;
  $("lvTag").textContent="第 "+(cur+1)+" 关 · "+L.name;
  $("lvRule").textContent=L.days+" 天 · 容量 "+L.cap+" 尾 · 起 "+(L.startN)+" 尾/"+(L.startN*PF.STARTW)+"kg";
  $("stTarget").textContent=L.target;
  say("第 1 天：先选一档投喂（省/中/足），需要时投苗或捕捞，再点「下一天」");
  resize();syncHud();draw();
}
function syncHud(){
  $("stDay").textContent=st.day+"/"+L.days;
  $("stCash").textContent=st.cash;
  $("stCash").className="val"+(st.cash<L.target*0.3?" low":"");
  $("stPool").textContent=st.n+"尾/"+Math.round(st.tw)+"kg";
  var btn=$("btnF0"),cost;
  var plans=[feedPlan(0),feedPlan(1),feedPlan(2)];
  var names=["btnF0","btnF1","btnF2"];
  for(var k=0;k<3;k++){
    $(names[k]).textContent=["喂·省","喂·中","喂·足"][k]+" "+plans[k].cost+"元";
    $(names[k]).disabled=state!=="edit"||feedChosen>=0||st.cash<plans[k].cost;
    $(names[k]).classList.toggle("on",feedChosen===k);
  }
  $("btnBuy").textContent="投苗 +"+PF.CAP_BUY+"（"+PF.BUY_COST+"元）";
  $("btnBuy").disabled=state!=="edit"||st.cash<PF.BUY_COST||st.n>L.cap-PF.CAP_BUY;
  $("btnHarvest").disabled=state!=="edit"||st.n<1;
  $("btnNext").disabled=state!=="edit"||feedChosen<0;
}
/* ---------- 交互 ---------- */
function pickFeed(k){
  if(state!=="edit"||done||feedChosen>=0)return;
  var p=feedPlan(k);
  if(st.cash<p.cost){say("现金不够这档饲料");return;}
  feedChosen=k;
  st.cash-=p.cost;
  say("今天投喂 "+p.F+" 单位（-"+p.cost+" 元）· 喂完可以下一天了");
  syncHud();draw();
}
function buyFish(){
  if(state!=="edit"||done)return;
  var r=PF.buy(L,st);
  say(r.ok?("已补 "+PF.CAP_BUY+" 尾夏花（-"+PF.BUY_COST+" 元）"):"投苗失败："+({poor:"现金不够",full:"塘快满了"}[r.why]||""));
  syncHud();draw();
}
function harvest(){
  if(state!=="edit"||done)return;
  var r=PF.harvest(L,st);
  if(r.ok){say("起捕！今日鱼价 "+L.prices[Math.min(st.day-1,L.prices.length-1)]+"/kg，入账 "+r.gain+" 元");}
  else say(r.why==="small"?("还小（均重 "+r.avg+"kg < "+L.minW+"）再养养"):"塘里没鱼");
  syncHud();draw();
  checkWin();
}
function nextDay(){
  if(state!=="edit"||done||feedChosen<0)return;
  var p=feedPlan(feedChosen);
  PF.tickDay(L,st,p.F);
  st.day++;
  feedChosen=-1;
  if(st.cash>=L.target){winLevel();return;}
  if(st.day>L.days){endDays();return;}
  var px=L.prices[Math.min(st.day-1,L.prices.length-1)];
  say("第 "+st.day+" 天 · 今日鱼价 "+px+"/kg");
  syncHud();draw();
}
function checkWin(){
  if(done)return;
  if(st.cash>=L.target)winLevel();
}
function winLevel(){
  done=true;state="done";
  if(cur<LEVELS.length-1&&cur+1>save.lv)save.lv=cur+1;
  if(cur+2>unlocked)unlocked=Math.min(LEVELS.length,cur+2);
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:cur+1,metricExtra:st.cash}).catch(function(){});
  $("ovTitle").textContent=(cur>=LEVELS.length-1)?"全部通关！":"丰收！";
  $("ovDesc").innerHTML="资产 "+st.cash+"（目标 "+L.target+"）· 存塘 "+st.n+" 尾/"+Math.round(st.tw)+"kg"+(cur<LEVELS.length-1?"<br>已解锁第 "+(cur+2)+" 关":"<br>40 塘全部完成");
  $("ovBtn").textContent=(cur>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("ovRetry").hidden=true;
  ovMode="win";
  $("overlay").classList.add("show");
}
function endDays(){
  done=true;state="done";
  if(st.cash>=L.target){winLevel();return;}
  $("ovTitle").textContent="期满盘点";
  $("ovDesc").textContent="资产 "+st.cash+"，差目标 "+L.target+"。记住：喂足长膘快，价高再起捕，别断料。";
  $("ovBtn").textContent="选关";
  $("ovRetry").hidden=false;
  ovMode="fail";
  $("overlay").classList.add("show");
}
var ovMode="select";
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<unlocked-1?" done":"");
      b.textContent=i+1;
      b.disabled=i>=unlocked;
      b.addEventListener("click",function(){
        cur=i;save.lv=Math.max(save.lv,cur);persist();
        $("overlay").classList.remove("show");
        loadLevel(cur);
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("ovRetry").hidden=true;
  ovMode="select";
  $("overlay").classList.add("show");
}

/* ========== 绘制 ========= */
function draw(){
  ctx.fillStyle=PAL.pond;ctx.fillRect(0,0,W,170);
  ctx.fillStyle=PAL.pond2;
  for(var wy=18;wy<170;wy+=26){
    ctx.beginPath();
    for(var wx=8;wx<W-8;wx+=10){
      var yy=wy+Math.sin(wx/30+wy)*3;
      if(wx===8)ctx.moveTo(wx,yy);else ctx.lineTo(wx,yy);
    }
    ctx.stroke();
  }
  //水草
  ctx.strokeStyle=PAL.success;ctx.lineWidth=2;
  for(var pl=0;pl<5;pl++){
    var bx=20+pl*(W-40)/4;
    ctx.beginPath();ctx.moveTo(bx,168);
    ctx.quadraticCurveTo(bx-6,150,bx+4,138+Math.sin(pl*2)*4);
    ctx.stroke();
  }
  //鱼
  var n=Math.min(st.n,40);
  var avg=st.n>0?st.tw/st.n:0;
  var r0=2.5+Math.min(5,avg*4);
  for(var i=0;i<n;i++){
    var fx=14+((i*53+Math.floor(st.tw*7))%(W-30));
    var fy=30+((i*37)%110);
    ctx.fillStyle=PAL.fish;
    ctx.beginPath();ctx.ellipse(fx,fy,r0,r0*0.55,0,0,7);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(fx-r0,fy);ctx.lineTo(fx-r0-4,fy-3);ctx.lineTo(fx-r0-4,fy+3);
    ctx.closePath();ctx.fill();
  }
  //天数牌
  ctx.fillStyle=PAL.surface;
  ctx.fillRect(W-88,8,80,24);
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.strokeRect(W-87.5,8.5,79,23);
  ctx.fillStyle=PAL.muted;
  ctx.font="12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("第"+st.day+"天 "+L.prices[Math.min(st.day-1,L.prices.length-1)]+"/kg",W-48,20);
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.strokeRect(0.5,0.5,W-1,169);
}

/* ========== 主循环（回合制；rAF 仅重绘，切后台停帧不推进任何状态） ========== */
var rafPending=false,lastTs=0;
function frame(ts){
  rafPending=false;
  if(document.hidden)return;
  lastTs=ts;
  draw();
  rafPending=true;requestAnimationFrame(frame);
}
function kick(){if(!rafPending&&!document.hidden){rafPending=true;requestAnimationFrame(frame);}}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){lastTs=0;}
  else{lastTs=0;kick();}
});

/* ========== 输入 ========== */
$("btnF0").addEventListener("click",function(){pickFeed(0)});
$("btnF1").addEventListener("click",function(){pickFeed(1)});
$("btnF2").addEventListener("click",function(){pickFeed(2)});
$("btnBuy").addEventListener("click",buyFish);
$("btnHarvest").addEventListener("click",harvest);
$("btnNext").addEventListener("click",nextDay);
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(ovMode==="win"){
    if(cur>=LEVELS.length-1){cur=0;save.lv=0;persist();loadLevel(0);}
    else{cur++;loadLevel(cur);}
  }else if(ovMode==="fail"){
    openLevelSelect();
  }
});
$("ovRetry").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  loadLevel(cur);
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="1")pickFeed(0);
  else if(k==="2")pickFeed(1);
  else if(k==="3")pickFeed(2);
  else if(k==="b"||k==="B")buyFish();
  else if(k==="v"||k==="V")harvest();
  else if(k==="Enter"){nextDay();e.preventDefault();}
  else if(k==="r"||k==="R")loadLevel(cur);
});

/* 调试验证入口 */
window.__validateLevels=function(){try{return PF.runTests()}catch(e){return {error:String(e)}}};

/* ========== 启动（续玩：从存档关卡起步） ========== */
cur=clamp(save.lv,0,LEVELS.length-1);
loadLevel(cur);
requestAnimationFrame(frame);
syncLevelsFromServer();
syncSaveFromServer();

})();
</script>
