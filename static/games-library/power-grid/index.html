window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var PG={LEVEL_COUNT:40};
PG.totalDemand=function(lv){var s=0;for(var i=0;i<lv.loads.length;i++)s+=lv.loads[i];return s;};
PG.totalCap=function(lv){var s=0;for(var i=0;i<lv.gens.length;i++)s+=lv.gens[i];return s;};
/* Edmonds-Karp 最大流：源→发电机(容量)→线路(开通)→负荷(需求)→汇 */
PG.flow=function(lv,mask){
  var nG=lv.gens.length,nL=lv.loads.length,S=nG+nL,T=S+1,N=T+1;
  var cap=[];
  for(var i=0;i<N;i++){cap.push(new Array(N).fill(0));}
  for(var g=0;g<nG;g++)cap[S][g]=lv.gens[g];
  for(var l=0;l<nL;l++)cap[nG+l][T]=lv.loads[l];
  for(var e=0;e<lv.edges.length;e++)if(mask[e])cap[lv.edges[e][0]][nG+lv.edges[e][1]]=99;
  var flow=0;
  for(;;){
    var par=new Array(N).fill(-1);par[S]=S;
    var qq=[S];
    for(var qi=0;qi<qq.length&&par[T]<0;qi++){
      var u=qq[qi];
      for(var v=0;v<N;v++)if(par[v]<0&&cap[u][v]>0){par[v]=u;qq.push(v);}
    }
    if(par[T]<0)break;
    var f=1e9,w=T;
    while(w!==S){f=Math.min(f,cap[par[w]][w]);w=par[w];}
    w=T;
    while(w!==S){cap[par[w]][w]-=f;cap[w][par[w]]+=f;w=par[w];}
    flow+=f;
  }
  return flow;
};
PG.feasible=function(lv,mask){return PG.flow(lv,mask)>=PG.totalDemand(lv);};
/* 暴力搜最少合闸数（E≤12） */
PG.minFlips=function(lv,from){
  var E=lv.edges.length,limit=1<<E,best=-1;
  for(var m=0;m<limit;m++){
    var mask=[],pc=0;
    for(var e=0;e<E;e++){var on=!!(m>>e&1);mask.push(on);if(on!==from[e])pc++;}
    if(best>=0&&pc>=best)continue;
    if(PG.feasible(lv,mask))best=pc;
  }
  return best;
};
/* 生成：供需有小余量，初始接线必缺电，par∈1..4 */
PG.genLevel=function(no){
  for(var attempt=0;attempt<40;attempt++){
    var rng=mulberry32(93600+no*641+attempt*19);
    var nG=2+Math.floor(rng()*2),nL=2+Math.floor(rng()*3);
    var gens=[],loads=[],i;
    var demand=0;
    for(i=0;i<nL;i++){var d2=1+Math.floor(rng()*3);loads.push(d2);demand+=d2;}
    var slack=1+Math.floor(rng()*2);
    var left=demand+slack;
    for(i=0;i<nG-1;i++){var c2=1+Math.floor(rng()*Math.min(3,left-1));gens.push(c2);left-=c2;}
    gens.push(left);
    var edges=[],seen={};
    for(var l=0;l<nL;l++){
      var g=Math.floor(rng()*nG);
      if(!seen[g+","+l]){edges.push([g,l]);seen[g+","+l]=1;}
    }
    var extra=2+Math.floor(rng()*Math.min(5,nG*nL-edges.length));
    for(var x=0;x<extra;x++){
      var g2=Math.floor(rng()*nG),l2=Math.floor(rng()*nL);
      if(!seen[g2+","+l2]){edges.push([g2,l2]);seen[g2+","+l2]=1;}
    }
    var E=edges.length;
    if(E<4||E>10)continue;
    //初始：从全通（可行）随机断线到不可行为止
    var init=[];
    for(i=0;i<E;i++)init.push(true);
    var off=0;
    while(PG.feasible({gens:gens,loads:loads,edges:edges},init)&&off<E){
      var k=Math.floor(rng()*E);
      if(init[k]){init[k]=false;off++;}
    }
    if(PG.feasible({gens:gens,loads:loads,edges:edges},init))continue;
    var lv={name:"电网·"+(no<10?"0":"")+no,gens:gens,loads:loads,edges:edges,init:init,
      difficulty:Math.min(9,1+Math.floor(no/5))};
    var par=PG.minFlips(lv,init);
    if(par<1||par>4)continue;
    lv.par=par;
    return lv;
  }
  return PG.genLevel(no>1?no-1:1);
};
/* 结构校验 */
PG.validate=function(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return{ok:false,why:"bad"};
  if(!Array.isArray(d.gens)||d.gens.length<1||d.gens.length>4)return{ok:false,why:"gens"};
  if(!Array.isArray(d.loads)||d.loads.length<1||d.loads.length>5)return{ok:false,why:"loads"};
  for(var i=0;i<d.gens.length;i++)if(!Number.isInteger(d.gens[i])||d.gens[i]<1||d.gens[i]>15)return{ok:false,why:"cap"+i};
  for(var j=0;j<d.loads.length;j++)if(!Number.isInteger(d.loads[j])||d.loads[j]<1||d.loads[j]>15)return{ok:false,why:"dem"+j};
  if(PG.totalCap(d)<PG.totalDemand(d))return{ok:false,why:"power"};
  if(!Array.isArray(d.edges)||d.edges.length<3||d.edges.length>10)return{ok:false,why:"edges"};
  var seen={};
  for(var e=0;e<d.edges.length;e++){
    var ed=d.edges[e];
    if(!Array.isArray(ed)||ed.length!==2)return{ok:false,why:"e"+e};
    if(ed[0]<0||ed[0]>=d.gens.length||ed[1]<0||ed[1]>=d.loads.length)return{ok:false,why:"epos"+e};
    if(seen[ed[0]+","+ed[1]])return{ok:false,why:"edup"+e};
    seen[ed[0]+","+ed[1]]=1;
  }
  if(!Array.isArray(d.init)||d.init.length!==d.edges.length)return{ok:false,why:"init"};
  if(PG.feasible(d,d.init))return{ok:false,why:"startOk"};
  var par=PG.minFlips(d,d.init);
  if(par<1||par>4)return{ok:false,why:"par"};
  return{ok:true,why:"",par:par};
};
PG.validateAll=function(){
  var fails=[],i;
  for(i=1;i<=PG.LEVEL_COUNT;i++){
    var L=PG.genLevel(i),r=PG.validate(L);
    if(!r.ok)fails.push(i+"("+r.why+")");
  }
  return {total:PG.LEVEL_COUNT,solvable:PG.LEVEL_COUNT-fails.length,fail:fails};
};
PG.runTests=function(){
  var pass=0,rows=[];
  function ck(name,ok,got){rows.push({name:name,ok:!!ok,got:got});if(ok)pass++;}
  //锚点1：G1(3)+G2(2) 供 L1(2)+L2(3)，断 G1-L2 时缺 1 → 合上即可 par=1
  var t1={gens:[3,2],loads:[2,3],edges:[[0,0],[0,1],[1,1]],init:[true,false,true]};
  var f1=PG.flow(t1,[true,true,true]);
  var p1=PG.minFlips(t1,[true,false,true]);
  ck("锚点·借线合闸 par=1",f1===5&&p1===1,"flow="+f1+",par="+p1);
  //锚点2：断线孤网 → 合上即可
  var t2={gens:[5],loads:[3],edges:[[0,0]],init:[false]};
  var p2=PG.minFlips(t2,[false]);
  ck("锚点·孤网合闸 par=1",p2===1,"par="+p2);
  //锚点3：双机各带一负荷，交叉线借用需容量分配
  var t3={gens:[2,2],loads:[2,2],edges:[[0,0],[1,1],[0,1]],init:[true,false,true]};
  var f3=PG.flow(t3,[true,true,true]);
  var p3=PG.minFlips(t3,[true,false,true]);
  ck("锚点·借线分配 par=1 flow=4",f3===4&&p3===1,"flow="+f3+",par="+p3);
  //锚点4：容量不足硬缺电
  var t4={gens:[2],loads:[3],edges:[[0,0]],init:[true]};
  var f4=PG.flow(t4,[true]);
  ck("锚点·硬缺电 flow=2<3",f4===2,"flow="+f4);
  var r=PG.validateAll();
  ck("40 关结构+par 校验",r.fail.length===0,"fail="+r.fail.join(","));
  var L1=PG.genLevel(1),L2=PG.genLevel(1);
  ck("生成确定性",JSON.stringify(L1)===JSON.stringify(L2),"replay");
  return {total:6,pass:pass,rows:rows,levels:r};
};
globalThis.__XC=PG;
/*XC-CORE-END*/

/* ========== 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ========== */
var GAME_KEY="power-grid",SAVE_KEY="sw.powergrid.v1";
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=PG.LEVEL_COUNT;i++)list.push(PG.genLevel(i));
  return list;
}
var LEVELS=buildDefaultLevels();
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!PG.validate(d).ok)return null;
    var no=parseInt(row.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=1;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return PG.validate(d).ok})){
      LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      loadLevel(cur);
    }
  }).catch(function(){});
}

/* ========== 存档（本地 + 账号双写，账号更优才覆盖） ========== */
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:parseInt(s.lv,10)||0,best:parseInt(s.best,10)||1}}catch(e){return{lv:0,best:1}}}
var save=loadSave();
var unlocked=clamp(save.best,1,1);
function persist(){
  var data={lv:cur,best:unlocked};
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson||state!=="edit")return;
    try{
      var r=JSON.parse(res.stateJson),ch=false;
      var rl=parseInt(r.lv,10),rb=parseInt(r.best,10);
      if(isFinite(rl)&&rl>save.lv&&rl<LEVELS.length){save.lv=rl;ch=true;}
      if(isFinite(rb)&&rb>unlocked&&rb<=LEVELS.length){unlocked=rb;ch=true;}
      if(ch){cur=clamp(save.lv,0,LEVELS.length-1);persist();loadLevel(cur);}
    }catch(e){}
  }).catch(function(){});
}

/* ========== 调色板 ========== */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),
    water:v("--g-water")};
}
window.__gOnTheme=function(){palLoad()};
palLoad();

/* ========== 画布与状态 ========== */
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,cur=save.lv,L=null,mask=[],moves=0,state="edit",done=false;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);var H=230;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",function(){resize();draw();});
function nodePos(){
  var nG=L.gens.length,nL=L.loads.length,pos=[];
  var gy0=40,gy1=190,gx=52,lx=W-52;
  for(var g=0;g<nG;g++)pos.push([gx,gy0+(gy1-gy0)*(nG===1?0.5:g/(nG-1))]);
  for(var l=0;l<nL;l++)pos.push([lx,gy0+(gy1-gy0)*(nL===1?0.5:l/(nL-1))]);
  return pos;
}
function loadLevel(n){
  cur=clamp(n,0,LEVELS.length-1);
  L=LEVELS[cur];
  var v=PG.validate(L);
  if(!v.ok){say("关卡数据异常");return;}
  L.par=v.par;
  mask=L.init.slice();
  moves=0;state="edit";done=false;
  $("lvTag").textContent="第 "+(cur+1)+" 关 · "+L.name;
  $("lvRule").textContent="电 "+PG.totalCap(L)+" → 需 "+PG.totalDemand(L)+" · 参考合闸 "+L.par;
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  $("stPar").textContent=L.par;
  say("点线路合闸/断开（数字键 1-"+Math.min(10,L.edges.length)+"），全部负荷得电且不超容即并网");
  resize();syncHud();draw();
}
function syncHud(){
  var f=PG.flow(L,mask);
  $("stFlow").textContent=f+"/"+PG.totalDemand(L);
  $("stFlow").className="val"+(f<PG.totalDemand(L)?" low":"");
  $("stMoves").textContent=moves;
}
/* ---------- 交互 ---------- */
function toggleEdge(e){
  if(state!=="edit"||done)return;
  mask[e]=!mask[e];
  if(mask[e])moves++;
  var f=PG.flow(L,mask),need=PG.totalDemand(L);
  if(f>=need){checkWin();return;}
  say("供电 "+f+"/"+need+" · 还缺 "+(need-f)+"（线路 "+(e+1)+(mask[e]?" 已合":" 已断")+"）");
  syncHud();draw();
}
function checkWin(){
  done=true;
  if(cur<LEVELS.length-1&&cur+1>save.lv)save.lv=cur+1;
  if(cur+2>unlocked)unlocked=Math.min(LEVELS.length,cur+2);
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:cur+1,metricExtra:moves}).catch(function(){});
  $("ovTitle").textContent=(cur>=LEVELS.length-1)?"全部通关！":"并网成功！";
  $("ovDesc").innerHTML="合闸 "+moves+" 次（参考最少 "+L.par+"）"+(cur<LEVELS.length-1?"<br>已解锁第 "+(cur+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(cur>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("ovRetry").hidden=true;
  ovMode="win";
  $("overlay").classList.add("show");
}
function hint(){
  if(state!=="edit"||done)return;
  var target=PG.bestMask(L,mask);
  if(!target){say("没有更近的可行方案了");return;}
  for(var e=0;e<L.edges.length;e++){
    if(target[e]!==mask[e]){
      say("提示：线路 "+(e+1)+" 应"+(target[e]?"合闸":"断开"));
      return;
    }
  }
  say("已经是最优接线了");
}
var ovMode="select";
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<unlocked-1?" done":"");
      b.textContent=i+1;
      b.disabled=i>=unlocked;
      b.addEventListener("click",function(){
        cur=i;save.lv=Math.max(save.lv,cur);persist();
        $("overlay").classList.remove("show");
        loadLevel(cur);
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("ovRetry").hidden=true;
  ovMode="select";
  $("overlay").classList.add("show");
}

/* ========== 绘制 ========== */
function draw(){
  ctx.fillStyle=PAL.surface2;ctx.fillRect(0,0,W,230);
  var pos=nodePos();
  var nG=L.gens.length;
  var served=distribute();
  //线路
  for(var e=0;e<L.edges.length;e++){
    var a=pos[L.edges[e][0]],b=pos[nG+L.edges[e][1]];
    ctx.strokeStyle=mask[e]?PAL.deep:PAL.faint;
    ctx.lineWidth=mask[e]?2.5:1.5;
    ctx.setLineDash(mask[e]?[]:[5,4]);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    ctx.setLineDash([]);
    //中点开关小方块
    var mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
    ctx.fillStyle=mask[e]?PAL.primary:PAL.bg;
    ctx.fillRect(mx-7,my-7,14,14);
    ctx.strokeStyle=hintEdge===e?PAL.warning:PAL.border;
    ctx.lineWidth=hintEdge===e?2.5:1;ctx.strokeRect(mx-7,my-7,14,14);
    ctx.fillStyle=mask[e]?PAL.surface:PAL.muted;
    ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(String(e+1),mx,my+1);
  }
  //节点
  for(var g=0;g<L.gens.length;g++){
    var p1=pos[g];
    ctx.fillStyle=PAL.primary;
    ctx.beginPath();ctx.arc(p1[0],p1[1],16,0,7);ctx.fill();
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=PAL.surface;
    ctx.font="700 14px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(String(L.gens[g]),p1[0],p1[1]);
    ctx.fillStyle=PAL.muted;
    ctx.font="12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText("G"+(g+1),p1[0],p1[1]+24);
  }
  for(var l=0;l<L.loads.length;l++){
    var p2=pos[nG+l];
    ctx.fillStyle=served[l]>=L.loads[l]?PAL.success:PAL.warning;
    ctx.beginPath();ctx.arc(p2[0],p2[1],16,0,7);ctx.fill();
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=PAL.surface;
    ctx.font="700 14px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(String(L.loads[l]),p2[0],p2[1]);
    ctx.fillStyle=PAL.muted;
    ctx.font="12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText("L"+(l+1),p2[0],p2[1]+24);
  }
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.strokeRect(0.5,0.5,W-1,229);
}
var hintEdge=-1;
/* 最大流分配结果（各负荷实得电） */
function distribute(){
  var nG=L.gens.length,nL=L.loads.length,S=nG+nL,T=S+1,N=T+1;
  var cap=[];
  for(var i=0;i<N;i++)cap.push(new Array(N).fill(0));
  for(var g=0;g<nG;g++)cap[S][g]=L.gens[g];
  for(var l=0;l<nL;l++)cap[nG+l][T]=L.loads[l];
  for(var e=0;e<L.edges.length;e++)if(mask[e])cap[L.edges[e][0]][nG+L.edges[e][1]]=99;
  var got=new Array(nL).fill(0);
  for(;;){
    var par=new Array(N).fill(-1);par[S]=S;
    var qq=[S];
    for(var qi=0;qi<qq.length&&par[T]<0;qi++){
      var u=qq[qi];
      for(var v=0;v<N;v++)if(par[v]<0&&cap[u][v]>0){par[v]=u;qq.push(v);}
    }
    if(par[T]<0)break;
    //回溯找瓶颈路径，并把路径上 load 段计入 got
    var path=[],w=T;
    while(w!==S){path.push(w);w=par[w];}
    var f=1e9;
    for(var s2=0;s2<path.length;s2++){var to=path[s2],fr=par[to];f=Math.min(f,cap[fr][to]);}
    for(var s3=0;s3<path.length;s3++){
      var to2=path[s3],fr2=par[to2];
      cap[fr2][to2]-=f;cap[to2][fr2]+=f;
      if(to2>=nG&&to2<T)got[to2-nG]+=f;
    }
  }
  return got;
}

/* ========== 主循环（纯事件驱动；rAF 仅重绘，切后台停帧不推进任何状态） ========== */
var rafPending=false,lastTs=0;
function frame(ts){
  rafPending=false;
  if(document.hidden)return;
  lastTs=ts;
  draw();
  rafPending=true;requestAnimationFrame(frame);
}
function kick(){if(!rafPending&&!document.hidden){rafPending=true;requestAnimationFrame(frame);}}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){lastTs=0;}
  else{lastTs=0;kick();}
});

/* ========== 输入 ========== */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  var pos=nodePos(),nG=L.gens.length;
  var best=-1,bd=1e9;
  for(var e2=0;e2<L.edges.length;e2++){
    var a=pos[L.edges[e2][0]],b=pos[nG+L.edges[e2][1]];
    var mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
    var d=Math.hypot(mx-x,my-y);
    if(d<18&&d<bd){bd=d;best=e2;}
  }
  if(best>=0){hintEdge=-1;toggleEdge(best);}
});
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){
  mask=L.init.slice();moves=0;state="edit";done=false;hintEdge=-1;
  $("overlay").classList.remove("show");
  say("已恢复初始接线");
  syncHud();draw();
});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(ovMode==="win"){
    if(cur>=LEVELS.length-1){cur=0;save.lv=0;persist();loadLevel(0);}
    else{cur++;loadLevel(cur);}
  }else if(ovMode==="fail"){
    openLevelSelect();
  }
});
$("ovRetry").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  mask=L.init.slice();moves=0;state="edit";done=false;
  syncHud();draw();
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  var idx=-1;
  if(k>="1"&&k<="9")idx=parseInt(k,10)-1;
  else if(k==="0")idx=9;
  if(idx>=0&&idx<L.edges.length){hintEdge=-1;toggleEdge(idx);e.preventDefault();}
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){
    mask=L.init.slice();moves=0;state="edit";done=false;hintEdge=-1;
    $("overlay").classList.remove("show");
    syncHud();draw();
  }
});

/* 调试验证入口 */
window.__validateLevels=function(){try{return PG.runTests()}catch(e){return {error:String(e)}}};
/* 最优接线（提示用） */
PG.bestMask=function(lv,from){
  var E=lv.edges.length,limit=1<<E,best=-1,bestMask=null;
  for(var m=0;m<limit;m++){
    var mask2=[],pc=0;
    for(var e=0;e<E;e++){var on=!!(m>>e&1);mask2.push(on);if(on!==from[e])pc++;}
    if(best>=0&&pc>=best)continue;
    if(PG.feasible(lv,mask2)){best=pc;bestMask=mask2;}
  }
  return bestMask;
};

/* ========== 启动（续玩：从存档关卡起步） ========== */
cur=clamp(save.lv,0,LEVELS.length-1);
loadLevel(cur);
requestAnimationFrame(frame);
syncLevelsFromServer();
syncSaveFromServer();

})();
</script>
