<style>

<script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="quoridor-lite",SAVE_KEY="sw.quoridorlite.v1";
var DEFAULT_LEVELS=[{"name":"围墙·01","size":7,"walls":4,"depth":1,"rand":2,"first":1},{"name":"围墙·02","size":7,"walls":4,"depth":1,"rand":2,"first":1},{"name":"围墙·03","size":7,"walls":4,"depth":1,"rand":1,"first":1},{"name":"围墙·04","size":7,"walls":4,"depth":1,"rand":1,"first":0},{"name":"围墙·05","size":7,"walls":5,"depth":1,"rand":1,"first":1},{"name":"围墙·06","size":7,"walls":5,"depth":1,"rand":0,"first":1},{"name":"围墙·07","size":7,"walls":5,"depth":1,"rand":0,"first":0},{"name":"围墙·08","size":7,"walls":5,"depth":1,"rand":0,"first":1},{"name":"围墙·09","size":7,"walls":6,"depth":1,"rand":1,"first":1},{"name":"围墙·10","size":7,"walls":6,"depth":1,"rand":0,"first":1},{"name":"围墙·11","size":7,"walls":6,"depth":2,"rand":1,"first":1},{"name":"围墙·12","size":7,"walls":6,"depth":2,"rand":1,"first":0},{"name":"围墙·13","size":7,"walls":6,"depth":2,"rand":0,"first":1},{"name":"围墙·14","size":7,"walls":6,"depth":2,"rand":0,"first":0},{"name":"围墙·15","size":7,"walls":7,"depth":2,"rand":1,"first":1},{"name":"围墙·16","size":7,"walls":7,"depth":2,"rand":0,"first":1},{"name":"围墙·17","size":7,"walls":7,"depth":2,"rand":0,"first":0},{"name":"围墙·18","size":7,"walls":7,"depth":2,"rand":0,"first":1},{"name":"围墙·19","size":7,"walls":8,"depth":2,"rand":1,"first":1},{"name":"围墙·20","size":7,"walls":8,"depth":2,"rand":0,"first":0},{"name":"围墙·21","size":7,"walls":8,"depth":2,"rand":0,"first":1},{"name":"围墙·22","size":7,"walls":8,"depth":2,"rand":0,"first":0},{"name":"围墙·23","size":7,"walls":8,"depth":2,"rand":0,"first":1},{"name":"围墙·24","size":7,"walls":8,"depth":2,"rand":0,"first":0},{"name":"围墙·25","size":9,"walls":5,"depth":1,"rand":1,"first":1},{"name":"围墙·26","size":9,"walls":6,"depth":1,"rand":1,"first":1},{"name":"围墙·27","size":9,"walls":6,"depth":1,"rand":0,"first":0},{"name":"围墙·28","size":9,"walls":6,"depth":2,"rand":1,"first":1},{"name":"围墙·29","size":9,"walls":7,"depth":2,"rand":1,"first":1},{"name":"围墙·30","size":9,"walls":7,"depth":2,"rand":0,"first":1},{"name":"围墙·31","size":9,"walls":7,"depth":2,"rand":0,"first":0},{"name":"围墙·32","size":9,"walls":8,"depth":2,"rand":1,"first":1},{"name":"围墙·33","size":9,"walls":8,"depth":2,"rand":1,"first":0},{"name":"围墙·34","size":9,"walls":8,"depth":2,"rand":0,"first":1},{"name":"围墙·35","size":9,"walls":8,"depth":2,"rand":0,"first":0},{"name":"围墙·36","size":9,"walls":8,"depth":2,"rand":0,"first":1},{"name":"围墙·37","size":9,"walls":8,"depth":2,"rand":0,"first":0},{"name":"围墙·38","size":9,"walls":8,"depth":2,"rand":0,"first":1},{"name":"围墙·39","size":9,"walls":8,"depth":2,"rand":0,"first":0},{"name":"围墙·40","size":9,"walls":8,"depth":2,"rand":0,"first":1}];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.size)||(d.size!==7&&d.size!==9))return false;
  if(!Number.isInteger(d.walls)||d.walls<1||d.walls>8)return false;
  if(!Number.isInteger(d.depth)||d.depth<1||d.depth>2)return false;
  if(!Number.isInteger(d.rand)||d.rand<0||d.rand>2)return false;
  if(d.first!==0&&d.first!==1)return false;
  return true;
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    var ck=d.size+"|"+d.walls+"|"+d.depth+"|"+d.rand+"|"+d.first;
    if(seen[ck])return null;seen[ck]=1;
    list.push({name:String(d.name),size:d.size,walls:d.walls,depth:d.depth,rand:d.rand,first:d.first});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData))LEVELS=list;
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      loadLevel(lv);resize();
    }
  }).catch(function(){});
}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

/* ---------- 规则引擎：n=7/9；VW[r*n+c]=纵墙(隔列c-1|c，跨行r..r+1)；HW[r*n+c]=横墙(隔行r-1|r，跨列c..c+1) ---------- */
var MATE=100000;
function wallBetween(VW,HW,n,a,b){
  var ra=Math.floor(a/n),ca=a%n,rb=Math.floor(b/n),cb=b%n;
  if(ra===rb&&Math.abs(cb-ca)===1){
    var c2=Math.max(ca,cb);
    if(ra<=n-2&&VW[ra*n+c2])return true;
    if(ra>=1&&VW[(ra-1)*n+c2])return true;
    return false;
  }
  if(ca===cb&&Math.abs(rb-ra)===1){
    var r2=Math.max(ra,rb);
    if(ca<=n-2&&HW[r2*n+ca])return true;
    if(ca>=1&&HW[r2*n+(ca-1)])return true;
    return false;
  }
  return true;
}
function VWorHW(VW,HW,n,r,c,type,v){
  if(type===0)VW[r*n+c]=v;else HW[r*n+c]=v;
}
/* 墙是否可筑：界内、不重叠不交叉、且双方仍有通路 */
function wallOK(VW,HW,n,r,c,type,pP,pA){
  if(type===0){
    if(c<1||c>n-1||r<0||r>n-2)return false;
    if(VW[r*n+c])return false;
    if(r>=1&&VW[(r-1)*n+c])return false;
    if(r<=n-3&&VW[(r+1)*n+c])return false;
    if(HW[(r+1)*n+(c-1)])return false;
    if(c<=n-2&&HW[(r+1)*n+c])return false;
  } else {
    if(r<1||r>n-1||c<0||c>n-2)return false;
    if(HW[r*n+c])return false;
    if(c>=1&&HW[r*n+(c-1)])return false;
    if(c<=n-3&&HW[r*n+(c+1)])return false;
    if(VW[(r-1)*n+c])return false;
    if(c>=1&&VW[(r-1)*n+(c-1)])return false;
  }
  VWorHW(VW,HW,n,r,c,type,1);
  var ok=distTo(VW,HW,n,pP,0)>=0&&distTo(VW,HW,n,pA,n-1)>=0;
  VWorHW(VW,HW,n,r,c,type,0);
  return ok;
}
/* BFS：from 到目标行的最短步数（无视棋子，只看墙）；不可达 -1 */
function distTo(VW,HW,n,from,goalRow){
  var dist=new Int16Array(n*n).fill(-1);
  var q=[from];dist[from]=0;var h=0;
  while(h<q.length){
    var cur=q[h++],r=Math.floor(cur/n),c=cur%n;
    if(r===goalRow)return dist[cur];
    var nb=[cur-n,cur+n,cur-1,cur+1];
    for(var i=0;i<4;i++){
      var t=nb[i];
      if(t<0||t>=n*n)continue;
      if(i===0&&r===0)continue;
      if(i===1&&r===n-1)continue;
      if(i===2&&c===0)continue;
      if(i===3&&c===n-1)continue;
      if(dist[t]>=0)continue;
      if(wallBetween(VW,HW,n,cur,t))continue;
      dist[t]=dist[cur]+1;q.push(t);
    }
  }
  return -1;
}
/* 棋子走法（含跳子与飞角） */
function pawnMoves(VW,HW,n,pawns,sd){
  var pos=pawns[sd],opp=pawns[3-sd],out=[],D=[[-1,0],[1,0],[0,-1],[0,1]];
  for(var d=0;d<4;d++){
    var dr=D[d][0],dc=D[d][1];
    var r=Math.floor(pos/n)+dr,c=pos%n+dc;
    if(r<0||r>=n||c<0||c>=n)continue;
    var t=r*n+c;
    if(wallBetween(VW,HW,n,pos,t))continue;
    if(t!==opp){out.push(t);continue;}
    var r2=r+dr,c2=c+dc;
    if(r2>=0&&r2<n&&c2>=0&&c2<n){
      var s2=r2*n+c2;
      if(!wallBetween(VW,HW,n,t,s2)){out.push(s2);continue;}
    }
    var P=[[-dc,-dr],[dc,dr]];
    for(var e=0;e<2;e++){
      var pr=Math.floor(pos/n)+P[e][0],pc=pos%n+P[e][1];
      if(pr<0||pr>=n||pc<0||pc>=n)continue;
      var pe=pr*n+pc;
      var tr=r+P[e][0],tc=c+P[e][1];
      if(tr<0||tr>=n||tc<0||tc>=n)continue;
      var te=tr*n+tc;
      if(pawns[1]===te||pawns[2]===te)continue;
      if(wallBetween(VW,HW,n,pos,pe))continue;
      if(wallBetween(VW,HW,n,pe,te))continue;
      out.push(te);
    }
  }
  return out;
}
/* 估值：视野 = 对方路程 − 我方路程 */
function evalSide(VW,HW,n,pawns,sd,goalS,goalO){
  var my=distTo(VW,HW,n,pawns[sd],goalS),op=distTo(VW,HW,n,pawns[3-sd],goalO);
  if(my===0)return MATE;
  if(op===0)return -MATE;
  if(my<0)return -MATE/2;
  if(op<0)return MATE/2;
  return (op-my)*10;
}
function genWallCands(VW,HW,n,pP,pA){
  var out=[];
  for(var t=0;t<2;t++)for(var r=0;r<n;r++)for(var c=0;c<n;c++)
    if(wallOK(VW,HW,n,r,c,t,pP,pA))out.push({t:t,r:r,c:c});
  return out;
}
function goalOf(sd){return sd===1?0:n-1;}
/* ---------- AI：候选=走子+筑墙，1 级贪心 / 2 级对手最优应对对拍 ---------- */
function aiBestMove(VW,HW,n,pawns,sd,wallsSD,wallsOpp,depth,rand){
  var goalS=goalOf(sd),goalO=goalOf(3-sd);
  function candsFor(w,who){
    var list=[],ms=pawnMoves(VW,HW,n,pawns,who),i;
    for(i=0;i<ms.length;i++)list.push({kind:0,to:ms[i]});
    if(w>0){
      var ws=genWallCands(VW,HW,n,pawns[1],pawns[2]);
      for(var x=0;x<ws.length;x++)list.push({kind:1,w:ws[x]});
    }
    return list;
  }
  function applyC(cand,undo){
    if(cand.kind===0){
      if(undo)pawns[sd]=cand.from;else{cand.from=pawns[sd];pawns[sd]=cand.to;}
    } else VWorHW(VW,HW,n,cand.w.r,cand.w.c,cand.w.t,undo?0:1);
  }
  var cs=candsFor(wallsSD,sd);
  if(!cs.length)return null;
  var scored=[];
  for(var i=0;i<cs.length;i++){
    applyC(cs[i],false);
    scored.push({m:cs[i],v:evalSide(VW,HW,n,pawns,sd,goalS,goalO)});
    applyC(cs[i],true);
  }
  scored.sort(function(a,b){return b.v-a.v;});
  if(depth>=2&&scored.length>1){
    var top=scored.slice(0,6);
    for(var j=0;j<top.length;j++){
      applyC(top[j].m,false);
      var oc=candsFor(wallsOpp,3-sd),best=-MATE*2;
      for(var k2=0;k2<oc.length;k2++){
        var cand2=oc[k2],save=cand2.kind===0?pawns[3-sd]:0;
        if(cand2.kind===0)pawns[3-sd]=cand2.to;
        else VWorHW(VW,HW,n,cand2.w.r,cand2.w.c,cand2.w.t,1);
        var v2=evalSide(VW,HW,n,pawns,3-sd,goalO,goalS);
        if(cand2.kind===0)pawns[3-sd]=save;
        else VWorHW(VW,HW,n,cand2.w.r,cand2.w.c,cand2.w.t,0);
        if(v2>best)best=v2;
        if(best>=MATE)break;
      }
      applyC(top[j].m,true);
      top[j].v=top[j].v-best*0.9;
    }
    top.sort(function(a,b){return b.v-a.v;});
    scored=top;
  }
  if(rand>0&&scored.length>1){
    var band=scored.filter(function(x){return x.v>=scored[0].v-(rand===2?20:8);});
    return band[Math.floor(Math.random()*band.length)].m;
  }
  return scored[0].m;
}

    if(VW[r*n+c])wallBar(c*cs+cs-3,r*cs+2,6,cs-4);

/* ---------- 内嵌独立验证器（锚点用例 + 规则矩阵 + AI 对拍） ---------- */
function selfTest(){
  var total=0,ok=0,fails=[];
  function chk(c,name){total++;if(c)ok++;else fails.push(name);}
  chk(DEFAULT_LEVELS.length===40,"关卡数=40");
  chk(DEFAULT_LEVELS.every(validLevelData),"关卡配置合法");
  /* 锚点①：空 7x7 底行中路到顶 = 6 步（手算） */
  (function(){
    var V=new Uint8Array(49),H=new Uint8Array(49);
    chk(distTo(V,H,7,6*7+3,0)===6,"锚点:空盘路程6");
  })();
  /* 锚点②：空 7x7 可筑墙 72（纵横各 (n-1)²=36，手算） */
  (function(){
    var V=new Uint8Array(49),H=new Uint8Array(49);
    chk(genWallCands(V,H,7,6*7+3,0).length===72,"锚点:空盘墙槽72");
  })();
  /* 锚点③：单横墙（隔行2|3，跨列2,3）绕行路程=7（手算：3上+1右+3上） */
  (function(){
    var V=new Uint8Array(49),H=new Uint8Array(49);
    chk(wallOK(V,H,7,3,2,1,6*7+3,0),"锚点:该墙可筑");
    H[3*7+2]=1;
    chk(distTo(V,H,7,6*7+3,0)===7,"锚点:单墙绕行7");
  })();
  /* 锚点④：跳子与飞角——贴身对手：直跳(1,3)；直跳被墙封死后飞角 (2,2)(2,4)，再封飞角借道剩 3 步 */
  (function(){
    var V=new Uint8Array(49),H=new Uint8Array(49);
    var pw={1:3*7+3,2:2*7+3};
    var m1=pawnMoves(V,H,7,pw,1);
    chk(m1.indexOf(1*7+3)>=0&&m1.length===4,"锚点:直跳局面4步");
    H[2*7+3]=1;
    var m2=pawnMoves(V,H,7,pw,1);
    chk(m2.length===5&&m2.indexOf(2*7+2)>=0&&m2.indexOf(2*7+4)>=0,"锚点:飞角局面5步");
    H[3*7+1]=1;H[3*7+2]=1;H[3*7+3]=1;H[3*7+4]=1;
    var m3=pawnMoves(V,H,7,pw,1);
    chk(m3.length===3,"锚点:全封飞角3步");
  })();
  /* 锚点⑤：封死保护——行0|1 三横墙封列0-5，纵墙封列5|6 通路；封死电脑的最后一墙被拒绝 */
  (function(){
    var V=new Uint8Array(49),H=new Uint8Array(49);
    H[1*7+0]=1;H[1*7+2]=1;H[1*7+4]=1;
    chk(wallOK(V,H,7,0,6,0,0*7+3,6*7+3),"锚点:漏斗第四墙可筑");
    V[0*7+6]=1;V[1*7+6]=1;
    chk(distTo(V,H,7,0*7+3,6)===-1,"锚点:封死后电脑路程-1");
    V[1*7+6]=0;
    chk(!wallOK(V,H,7,1,6,0,0*7+3,6*7+3),"锚点:封死最后一墙被拒绝");
    V[0*7+6]=0;
    chk(distTo(V,H,7,0*7+3,6)>=0,"锚点:拆墙后恢复可达");
  })();
  /* AI 对拍 4 局：必有人抵达终点（≤200 手） */
  var gi;
  for(gi=0;gi<4;gi++)chk(aiGame(),"AI 对拍 局"+(gi+1));
  window.__gSelfTest={ok:ok,total:total,fails:fails};
  if(fails.length)say("警告：内嵌自检未全过（"+ok+"/"+total+"）");
}
function aiGame(){
  var keepV=VW,keepH=HW,keepP={1:pawns[1],2:pawns[2]},keepW={1:walls[1],2:walls[2]},keepSide=side;
  n=7;VW=new Uint8Array(49);HW=new Uint8Array(49);
  pawns={1:6*7+3,2:3};walls={1:6,2:6};
  var s=1,ply=0,res=null;
  while(ply<200){
    var m=aiBestMove(VW,HW,n,pawns,s,walls[s],walls[3-s],1,ply%3===0?1:0);
    if(!m){res=true;break;}
    if(m.kind===0)pawns[s]=m.to;
    else{walls[s]--;VWorHW(VW,HW,n,m.w.r,m.w.c,m.w.t,1);}
    if(Math.floor(pawns[s]/n)===goalOf(s)){res=true;break;}
    ply++;s=3-s;
  }
  VW=keepV;HW=keepH;pawns=keepP;walls=keepW;side=keepSide;
  return res!==null;
}
/* ---------- 启动（续玩：从存档关卡起步） ---------- */
palLoad();loadLevel(save.lv);selfTest();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
