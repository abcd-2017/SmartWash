    delete pending[cbId];

  };
  function call(method,args){
    return new Promise(function(resolve,reject){

      var cbId="gb"+Date.now()+"_"+(++seq);

      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,

],"answer":1}],"time":90,"need":2},{"name":"初识灯影·08","questions":[{"t":"字谜","q":"女旁一个良字（打一字）","options":["娘","姐","娃","姑"],"answer":0},{"t":"物谜","q":"东升西落照四方，万物生长靠它帮（打一天体）","options":["太阳","月亮","火球","星星"],"answer":0},{"t":"物谜","q":"有时弯弯有时圆，晚上出来白天藏（打一天体）","options":["太阳","星星","明镜","月亮"],"answer":3}],"time":90,"need":2},{"name":"初识灯影·09","questions":[{"t":"字谜","q":"舟字旁边几张嘴（打一字）","options":["航","舰","船","般"],"answer":2},{"t":"字谜","q":"走之留下一句话（打一字）","options":["还","边","过","这"],"answer":3},{"t":"字谜","q":"足边立着艮字（打一字）","options":["跳","路","跑","跟"],"answer":3}],"time":90,"need":2},{"name":"初识灯影·10","questions":[{"t":"脑筋急转弯","q":"什么绳子越拉越长，一松手又弹回去？","options":["橡皮筋","钢丝绳","麻绳","尼龙绳"],"answer":0},{"t":"物谜","q":"红心果果满身籽，戴顶小草帽（打一水果）","options":["草莓","杨梅","樱桃","覆盆子"],"answer":0},{"t":"物谜","q":"一条银蛇划破空，转眼就无影无踪（打一天然现象）","options":["彩虹","闪电","火光","流星"],"answer":1}],"time":90,"need":2}];
var LEVELS=DEFAULT_LEVELS.slice();
/* ---------- 关卡数据（DB 下发优先，本地缓存兜底；任一条非法整批放弃） ---------- */
var LEVELS_KEY="sw.riddle.v1.levels",LEVELS_VER_KEY="sw.riddle.v1.levels.ver";
function validQuestion(q){
  if(!q||typeof q!=="object"||Array.isArray(q))return null;
  if(typeof q.q!=="string"||!q.q.length||q.q.length>64)return null;
  if(!Array.isArray(q.options)||q.options.length!==4)return null;
  var seen={},i,opt;
  for(i=0;i<4;i++){
    opt=q.options[i];
    if(typeof opt!=="string"||!opt.length||opt.length>24)return null;
    if(seen[opt])return null;
    seen[opt]=true;
  }
  if(!Number.isInteger(q.answer)||q.answer<0||q.answer>3)return null;
  if(!q.options[q.answer])return null;
  var out={q:q.q,options:q.options.slice(),answer:q.answer};
  if(typeof q.t==="string"&&q.t.length<=8)out.t=q.t;
  return out;
}
function validateLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return null;
  if(typeof d.name!=="string"||!d.name.length||d.name.length>32)return null;
  if(!Array.isArray(d.questions)||d.questions.length<3||d.questions.length>6)return null;
  var qs=[],i,q;
  for(i=0;i<d.questions.length;i++){
    q=validQuestion(d.questions[i]);
    if(!q)return null;
    qs.push(q);
  }
  var qset={},dup=false;
  for(i=0;i<qs.length;i++){if(qset[qs[i].q]){dup=true;break;}qset[qs[i].q]=true;}
  if(dup)return null;
  if(!Number.isInteger(d.time)||d.time<30||d.time>600)return null;
  if(!Number.isInteger(d.need)||d.need<1||d.need>qs.length)return null;
  return {name:d.name,questions:qs,time:d.time,need:d.need};
}
/* 解析 DB 下发的关卡批次：任一条非法即整批放弃（返回 null） */
function parseLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var seen={},list=[],i,it,no,d;
  for(i=0;i<res.levels.length;i++){
    it=res.levels[i];
    if(!it||typeof it!=="object")return null;
    no=it.levelNo;
    if(typeof no!=="number"||!Number.isInteger(no)||no<1||seen[no])return null;
    var raw=it.dataJson;
    if(typeof raw==="string"){try{d=JSON.parse(raw);}catch(e){return null;}}
    else if(raw&&typeof raw==="object"&&!Array.isArray(raw)){d=raw;}
    else return null;
    d=validateLevelData(d);
    if(!d)return null;
    seen[no]=true;
    list.push({no:no,d:d});
  }
  list.sort(function(a,b){return a.no-b.no;});
  return list.map(function(x){return x.d;});
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){
      var ok=true;
      for(var i=0;i<list.length;i++){if(!validateLevelData(list[i])){ok=false;break;}}
      if(ok){LEVELS=list;return v;}
    }
  }catch(e){}
  return 0;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels("riddle").then(function(res){
    var list=parseLevels(res);
    if(!list)return;
    if(state==="play")return;//对局进行中不打断
    if(applyLevels(list,res.version||0)){
      if(cur>=LEVELS.length)cur=LEVELS.length-1;
      startLevel(cur);
    }
  }).catch(function(){});
}
/* ---------- 存档 ---------- */
var KEY="sw.riddle.v1";
function loadSave(){
  try{var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&typeof s==="object")return{lv:Math.max(0,parseInt(s.lv,10)||0),
      stars:s.stars&&typeof s.stars==="object"?s.stars:{},
      best:s.best&&typeof s.best==="object"?s.best:{}};
  }catch(e){}
  return{lv:0,stars:{},best:{}};
}
var saveData=loadSave();
function save(){
  var data={lv:saveData.lv,stars:saveData.stars,best:saveData.best};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("riddle",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("riddle").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=Math.max(0,parseInt(r.lv,10)||0);
      if(rl>saveData.lv){saveData.lv=Math.min(LEVELS.length-1,rl);changed=true;}
      if(r.stars&&typeof r.stars==="object")for(var k in r.stars){
        var v=Math.max(0,parseInt(r.stars[k],10)||0);
        if(v>(parseInt(saveData.stars[k],10)||0)){saveData.stars[k]=v;changed=true;}
      }
      if(r.best&&typeof r.best==="object")for(var k2 in r.best){
        var b=Math.max(0,parseInt(r.best[k2],10)||0);
        var mine=parseInt(saveData.best[k2],10)||0;
        if(b>0&&(mine===0||b<mine)){saveData.best[k2]=b;changed=true;}
      }
      if(changed){save();if(state!=="play"){if(cur>=LEVELS.length)cur=LEVELS.length-1;startLevel(cur);}}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 常量与工具 ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function say(t,cls){var m=$("msg");m.textContent=t;m.className="msg"+(cls?" "+cls:"");}
function fmt(sec){var s=Math.max(0,Math.ceil(sec)),m=Math.floor(s/60);s%=60;return(m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
/* ---------- 状态 ---------- */
var cur=0,LEVEL=null,qIdx=0,correct=0,mistakes=0;
var timeTotal=0,timeLeft=0,timerId=null,paused=false;
var state="idle",locked=false,overlayMode="intro";
/* ---------- 计时 ---------- */
function startTimer(){
  stopTimer();
  if(state!=="play")return;
  timerId=setInterval(function(){
    if(paused)return;
    timeLeft-=0.2;
    if(timeLeft<=0){timeLeft=0;updateStats();lose("时间到了");return;}
    updateStats();
  },200);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
document.addEventListener("visibilitychange",function(){paused=document.hidden;});
/* ---------- 建关 ---------- */
function startLevel(n){
  if(n<0)n=0;if(n>=LEVELS.length)n=LEVELS.length-1;
  cur=n;LEVEL=LEVELS[n];
  qIdx=0;correct=0;mistakes=0;locked=false;paused=false;
  timeTotal=LEVEL.time;timeLeft=LEVEL.time;
  state="idle";
  stopTimer();
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  renderQuestion();
  say("第"+(cur+1)+"关 · "+LEVEL.name+" · 共 "+LEVEL.questions.length+" 题");
}
function beginPlay(){
  hideOverlay();
  state="play";
  paused=false;
  startTimer();
  updateStats();
}
function renderQuestion(){
  var q=LEVEL.questions[qIdx];
  $("qTag").textContent=q.t||"谜题";
  $("qText").textContent=q.q;
  var box=$("opts");box.innerHTML="";
  q.options.forEach(function(opt,i){
    var b=document.createElement("button");
    b.className="btn opt";b.textContent=opt;b.setAttribute("data-i",i);
    b.addEventListener("click",function(){pick(i,b);});
    box.appendChild(b);
  });
  locked=false;
  updateStats();
}
function updateStats(){
  $("stQ").textContent=(qIdx+1)+"/"+LEVEL.questions.length;
  $("stTime").textContent=fmt(timeLeft);
  $("stOk").textContent=correct+"/"+LEVEL.need;
  var ratio=timeTotal>0?Math.max(0,timeLeft/timeTotal):0;
  $("barFill").style.width=(ratio*100)+"%";
}
/* ---------- 作答 ---------- */
function pick(i,btn){
  if(state!=="play"||locked)return;
  locked=true;
  var q=LEVEL.questions[qIdx];
  var right=i===q.answer;
  var bs=$("opts").children;
  for(var k=0;k<bs.length;k++)bs[k].disabled=true;
  if(right){
    btn.classList.add("ok");
    correct++;
    say("答对了！","win");
  }else{
    btn.classList.add("bad");
    bs[q.answer].classList.add("ok");
    mistakes++;
    say("不对哦，正确答案是「"+q.options[q.answer]+"」","err");
  }
  updateStats();
  setTimeout(next,800);
}
function next(){
  if(state!=="play")return;
  qIdx++;
  if(qIdx>=LEVEL.questions.length){finish();return;}
  renderQuestion();
  say("选择你认为正确的一项");
}
function finish(){
  stopTimer();
  if(correct>=LEVEL.need)win();else lose("答对 "+correct+" 题，达标需要 "+LEVEL.need+" 题");
}
function win(){
  state="over";stopTimer();
  var ratio=timeTotal>0?timeLeft/timeTotal:0;
  var stars=1;
  if(mistakes===0)stars++;
  if(ratio>=0.3)stars++;
  var key=String(cur);
  saveData.stars[key]=Math.max(parseInt(saveData.stars[key],10)||0,stars);
  var used=Math.round((timeTotal-timeLeft)*10)/10;
  var prev=parseFloat(saveData.best[key])||0;
  if(!prev||used<prev)saveData.best[key]=used;
  saveData.lv=Math.max(saveData.lv,Math.min(cur+1,LEVELS.length-1));
  save();
  var done=countCompleted(),totalStars=sumStars();
  if(GB.available)GB.reportScore("riddle",{metricValue:done,metricExtra:totalStars}).catch(function(){});
  var isLast=cur>=LEVELS.length-1;
  $("ovTitle").textContent=isLast?"全部通关！":"过关！";
  $("ovDesc").innerHTML="「"+esc(LEVEL.name)+"」答对 <b>"+correct+"/"+LEVEL.questions.length+"</b> 题<br>"
    +"星级 "+"★".repeat(stars)+"☆".repeat(3-stars)+"（全对 +1，剩余时间 ≥30% +1）<br>"
    +"已通关 "+done+" 关 · 累计 "+totalStars+" 星";
  $("ovBtn").textContent=isLast?"回到第一关":"下一关";
  overlayMode="win";showOverlay();
}
function lose(reason){
  if(state!=="play")return;
  state="over";stopTimer();
  $("ovTitle").textContent="本关失败";
  $("ovDesc").innerHTML=reason+"<br>再试一次，争取达标！";
  $("ovBtn").textContent="重试本关";
  overlayMode="lose";showOverlay();
}
function countCompleted(){var n=0;for(var k in saveData.stars)if(saveData.stars[k]>0)n++;return n;}
function sumStars(){var n=0;for(var k in saveData.stars)n+=parseInt(saveData.stars[k],10)||0;return n;}
/* ---------- 浮层 ---------- */
function showOverlay(){$("overlay").classList.add("show");}
function hideOverlay(){$("overlay").classList.remove("show");}
/* ---------- 输入 ---------- */
$("btnRetry").addEventListener("click",function(){
  startLevel(cur);beginPlay();
});
$("ovBtn").addEventListener("click",function(){
  if(overlayMode==="win")startLevel(cur<LEVELS.length-1?cur+1:0);
  else if(overlayMode==="lose")startLevel(cur);
  beginPlay();
});
/* ---------- 启动 ---------- */
loadCachedLevels();
var startIdx=Math.min(Math.max(saveData.lv,0),LEVELS.length-1);
startLevel(startIdx);
$("ovTitle").textContent="灯谜问答";
$("ovDesc").innerHTML="读谜面，从 4 个候选中选出正确答案。<br>每关限时作答，答对达标即可过关，越快越准星级越高。<br>谜面均为自撰字谜、物谜与脑筋急转弯。";
$("ovBtn").textContent="开始游戏";
overlayMode="intro";showOverlay();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理：显示时聚焦首个可操作元素（dialog 语义配套，全库统一模板） */
(function(){var els=document.querySelectorAll(".overlay, .sheet");if(!els.length)return;
function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
function focusFirst(el){if(el.dataset.foc)return;el.dataset.foc="1";var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();}
function watch(el){try{new MutationObserver(function(){if(shown(el))focusFirst(el);else delete el.dataset.foc}).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}}
for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}})();
</script>
</body>
</html>
