    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
    transition: transform .14s ease-out, background .16s ease-out;

try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
/* ========== 关卡生成器 + 独立验证器（纯逻辑，无 DOM 依赖） ========== */
(function(){
"use strict";
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function firstOn(mask,n){for(var i=0;i<n;i++)if(mask>>i&1)return i;return -1}
/* 独立验证器：全图 BFS（每状态两邻居），求最少步数与首着 */
function rpBFS(n,init,goal){
  if(init===goal)return{par:0,first:-1};
  var dist={},parent={},q=[init];
  dist[init]=0;
  while(q.length){
    var cur=q.shift(),d=dist[cur],f=firstOn(cur,n),nxs=[cur^1];
    if(f>=0&&f+1<n)nxs.push(cur^(1<<(f+1)));
    for(var i=0;i<nxs.length;i++){
      var nx=nxs[i];
      if(dist[nx]!==undefined)continue;
      dist[nx]=d+1;parent[nx]=cur;
      if(nx===goal){
        var k=nx,first=-1;
        while(k!==init){first=k^parent[k];k=parent[k];}
        for(var b=0;b<n;b++)if(first>>b&1)return{par:d+1,first:b};
        return{par:d+1,first:-1};
      }
      q.push(nx);
    }
  }
  return{par:0,first:-1};
}
function genLevels(){
  var rnd=mulberry(20261125);
  function rn(m){return (rnd()*m)|0}
  var out=[];
  for(var i=0;i<40;i++){
    var n=Math.min(4+((i/7)|0),9);
    var lo=Math.min(2+i,36),hi=Math.min(lo+8+i,64);
    var got=false,gd=0;
    while(!got&&gd++<800){
      var init=rn(1<<n),goal=(i%5===4)?0:rn(1<<n);
      if(init===goal)continue;
      var v=rpBFS(n,init,goal);
      if(v.par<lo||v.par>hi)continue;
      out.push({name:"连环·"+(i+1<10?"0":"")+(i+1),n:n,init:init,goal:goal,par:v.par,difficulty:Math.min(6,1+((i/8)|0))});
      got=true;
    }
    if(!got){i--;}
  }
  return out;
}
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim()||d.name.length>24)return false;
  if(!Number.isInteger(d.n)||d.n<4||d.n>10)return false;
  if(!Number.isInteger(d.init)||d.init<0||d.init>=(1<<d.n))return false;
  if(!Number.isInteger(d.goal)||d.goal<0||d.goal>=(1<<d.n))return false;
  if(d.init===d.goal)return false;
  return true;
}
function normalizeLevel(d){
  var v=rpBFS(d.n,d.init,d.goal);
  var diff=Number.isInteger(d.difficulty)?Math.min(9,Math.max(1,d.difficulty)):3;
  return {name:String(d.name),n:d.n,init:d.init,goal:d.goal,par:v.par,difficulty:diff};
}
window.__RP={firstOn:firstOn,rpBFS:rpBFS,genLevels:genLevels,validLevelData:validLevelData,normalizeLevel:normalizeLevel};
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ========== */
var RP=window.__RP,GAME_KEY="ring-puzzle",SAVE_KEY="sw.ringpuzzle.v1";
var LEVELS=RP.genLevels();
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i],d;
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!RP.validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    var n=RP.normalizeLevel(d);
    if(!(n.par>0))continue;   // 验证器判不可达：该关不进关卡表
    list.push(n);
  }
  return list.length?list:null;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(RP.validLevelData)){
      LEVELS=list.map(RP.normalizeLevel).filter(function(x){return x.par>0});
      if(LEVELS.length)return v;
      LEVELS=RP.genLevels();
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);resize();
    }
  }).catch(function(){});
}
/* ---------- 存档 ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,n=0,mask=0,history=[],moves=0,done=false,hintRing=-1,hintT=0;
var dispY=[];   // 每环动画偏移
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=252,barY=86,dropOff=64;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* 主逻辑：动环判定（与 rpBFS 验证器相互独立） */
function canToggle(m,i,nn){
  if(i===0)return true;                       // 1 号环随时可动
  if(!(m>>(i-1)&1))return false;              // 前一环须在杆上
  for(var j=0;j<i-1;j++)if(m>>j&1)return false; // 再前面全空
  return true;
}
function loadLevel(idx){
  lv=Math.max(0,Math.min(idx,LEVELS.length-1));
  L=LEVELS[lv];
  if(!RP.validLevelData(L)){say("关卡数据异常");return;}
  var v=RP.rpBFS(L.n,L.init,L.goal);   // 加载复核
  n=L.n;mask=L.init;history=[];moves=0;done=false;hintRing=-1;
  dispY=[];
  for(var i=0;i<n;i++)dispY.push((mask>>i&1)?barY:barY+dropOff);
  $("lvTag").textContent="第 "+(lv+1)+" 关";
  $("lvRule").textContent=L.name+" · "+n+" 连环";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stPar").textContent=v.par>0?v.par:"-";
  if(!(v.par>0))console.warn("警告：验证器判定本关不可达（数据异常）");
  say("把环摆成目标形态（空心环=已解下）");
  buildGoal();updStats();resize();
}
function updStats(){
  $("stMoves").textContent=moves;
  $("btnUndo").disabled=!history.length||done;
}
function toggle(i){
  if(done)return;
  if(i<0||i>=n)return;
  if(!canToggle(mask,i,n)){
    say("第 "+(i+1)+" 环现在动不了：它要求第 "+i+" 环在杆上且前面 "+(i-1)+" 环全空");
    return;
  }
  history.push(mask);
  mask^=1<<i;
  moves=history.length;
  hintRing=-1;
  updStats();
  say((mask>>i&1)?"第 "+(i+1)+" 环已套回":"第 "+(i+1)+" 环已解下");
  if(mask===L.goal){winLevel();return;}
}
function undo(){
  if(!history.length||done)return;
  mask=history.pop();
  moves=history.length;hintRing=-1;
  say("已撤销一步");updStats();
}
function hint(){
  if(done)return;
  var v=RP.rpBFS(n,mask,L.goal);
  if(!(v.par>0)){say("验证器：当前局面已无法到达目标，撤销几步吧");return;}
  hintRing=v.first;hintT=Date.now();
  if(v.first<0){say("已达成目标！");return;}
  say("建议先动第 "+(v.first+1)+" 环（还需 "+v.par+" 步）");
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:moves}).catch(function(){});
  $("ovTitle").textContent="过关！";
  $("ovDesc").innerHTML="用 "+moves+" 步完成（参考最优 "+$("stPar").textContent+" 步）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  setOvBtn((lv>=LEVELS.length-1)?"回到第 1 关":"下一关",(lv>=LEVELS.length-1)?"rotate":"play");
  $("panel").classList.add("win");
  $("overlay").classList.add("show");
}
function setOvBtn(t,icon){$("panel").classList.remove("win");$("ovBtn").innerHTML=window.SW_ICON(icon)+t}
function hideOverlay(){$("overlay").classList.remove("show")}
function openLevelSelect(){
  var ggrid=$("lvgrid");ggrid.hidden=false;
  ggrid.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      ggrid.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  setOvBtn("取消","x");
  $("overlay").classList.add("show");
}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(nn){return s.getPropertyValue(nn).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),primary:v("--g-primary"),soft:v("--g-primary-soft"),
    onSoft:v("--g-on-soft"),onPrimary:v("--g-on-primary"),
    plate1:v("--g-rp-plate1"),plate2:v("--g-rp-plate2"),bar1:v("--g-rp-bar1"),bar2:v("--g-rp-bar2"),
    ring1:v("--g-rp-ring1"),ring2:v("--g-rp-ring2")};
}
window.__gOnTheme=function(){palLoad();buildGoal();draw()};//App 推送主题时刷新调色板，rAF 自动重绘
/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function bump(el){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");}
/* ---------- 绘制 ---------- */
var ringX=[];
function rr(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);H=252;
  var margin=Math.max(18,W*0.06);
  ringX=[];
  for(var i=0;i<n;i++)ringX.push(margin+(W-margin*2)*(i+0.5)/n);
  barY=86;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
/* 目标形态：圆点 chip（1=在杆实心 / 0=解下空心），替代画布内字符 HUD */
function buildGoal(){
  var g=$("goalChips");if(!g||!L)return;
  var s="";
  for(var i=0;i<n;i++)s+=(L.goal>>i&1)?"1":"0";
  var html='<span class="gl">目标</span>';
  for(i=0;i<n;i++)html+='<span class="gchip '+((L.goal>>i&1)?"on":"off")+'" aria-hidden="true"></span>';
  g.innerHTML=html;
  g.setAttribute("aria-label","目标形态（1=在杆）："+s);
}
/* 底盘「面」：渐变 + 顶光 + 边界 */
function drawPlate(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.plate1);g.addColorStop(1,PAL.plate2);
  ctx.fillStyle=g;rr(0.5,0.5,W-1,H-1,12);ctx.fill();
  var sh=ctx.createLinearGradient(0,0,0,84);
  sh.addColorStop(0,"rgba(255,255,255,0.22)");sh.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=sh;rr(1.5,1.5,W-3,82,11);ctx.fill();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.border;rr(0.5,0.5,W-1,H-1,12);ctx.stroke();
}
/* 横杆：木面渐变 + 顶缘亮线 + 投影 + 深描边 */
function drawBar(R){
  var margin=Math.max(18,W*0.06);
  var barH=Math.max(10,R*0.5),barW=W-margin*2-R*2;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.24)";ctx.shadowBlur=6;ctx.shadowOffsetY=3;
  var g=ctx.createLinearGradient(0,barY-barH/2,0,barY+barH/2);
  g.addColorStop(0,PAL.bar1);g.addColorStop(0.5,colMix(PAL.bar1,PAL.bar2,0.35));g.addColorStop(1,PAL.bar2);
  ctx.fillStyle=g;rr(margin+R,barY-barH/2,barW,barH,barH/2);ctx.fill();
  ctx.restore();
  ctx.globalAlpha=0.5;ctx.strokeStyle=WHITE;ctx.lineWidth=1.2;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(margin+R+5,barY-barH/2+2);ctx.lineTo(margin+R+barW-5,barY-barH/2+2);ctx.stroke();
  ctx.globalAlpha=1;
  ctx.lineWidth=1;ctx.strokeStyle=colMix(PAL.bar2,BLACK,0.28);
  rr(margin+R,barY-barH/2,barW,barH,barH/2);ctx.stroke();
}
/* 环：在杆=金属渐变环 + 内孔露底盘 + 高光弧 + 投影；解下=空心描环 */
function drawRing(cx,cy,R,on,i){
  var hint=hintRing===i&&Date.now()-hintT<2600;
  if(hint){
    var pulse=0.5+0.5*Math.sin((Date.now()-hintT)/170);
    ctx.strokeStyle=PAL.warning;ctx.lineWidth=3;ctx.globalAlpha=0.5+pulse*0.5;
    ctx.beginPath();ctx.arc(cx,cy,R+5,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }
  if(on){
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.34)";ctx.shadowBlur=R*0.5;ctx.shadowOffsetY=R*0.3;
    var g=ctx.createRadialGradient(cx-R*0.34,cy-R*0.38,R*0.12,cx,cy,R*1.05);
    g.addColorStop(0,colMix(PAL.ring1,WHITE,0.55));g.addColorStop(0.5,PAL.ring1);g.addColorStop(1,PAL.ring2);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
    ctx.restore();
    var pg=ctx.createLinearGradient(0,cy-R*0.55,0,cy+R*0.55);
    pg.addColorStop(0,PAL.plate1);pg.addColorStop(1,PAL.plate2);
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(cx,cy,R*0.55,0,Math.PI*2);ctx.fill();
    ctx.lineWidth=1.2;ctx.strokeStyle=colMix(PAL.ring2,BLACK,0.3);
    ctx.beginPath();ctx.arc(cx,cy,R*0.55,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle=WHITE;ctx.lineWidth=Math.max(1.5,R*0.14);ctx.lineCap="round";ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.arc(cx,cy,R*0.78,Math.PI*1.12,Math.PI*1.55);ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle=PAL.text;
  }else{
    ctx.globalAlpha=0.62;ctx.strokeStyle=colMix(PAL.ring2,PAL.plate2,0.25);
    ctx.lineWidth=Math.max(2,R*0.16);
    ctx.beginPath();ctx.arc(cx,cy,R*0.92,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
    ctx.lineWidth=1;ctx.strokeStyle=colMix(PAL.ring2,BLACK,0.25);
    ctx.beginPath();ctx.arc(cx,cy,R*0.92,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=PAL.muted;
  }
  ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(i+1),cx,cy+0.5);
}
function draw(){
  if(!L)return;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  drawPlate();
  var margin=Math.max(18,W*0.06),spacing=(W-margin*2)/n;
  var R=Math.min(19,spacing*0.42);
  drawBar(R);
  for(var i=0;i<n;i++){
    var on=mask>>i&1,target=on?barY:barY+dropOff;
    if(window.__gRM)dispY[i]=target;
    else{dispY[i]+=(target-dispY[i])*0.3;if(Math.abs(target-dispY[i])<0.6)dispY[i]=target;}
    drawRing(ringX[i],dispY[i],R,on,i);
  }
}
var rafId=0;
function loop(){draw(performance.now());rafId=requestAnimationFrame(loop)}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  if(done)return;
  var margin=Math.max(18,W*0.06),spacing=(W-margin*2)/n;
  var best=-1,bd=1e9;
  for(var i=0;i<n;i++){
    var d=Math.abs(x-ringX[i]);
    var yd=Math.abs(y-(mask>>i&1?barY:barY+dropOff));
    var dist=Math.hypot(d,yd);
    if(dist<Math.max(spacing*0.5,32)&&dist<bd){bd=dist;best=i;}
  }
  if(best>=0)toggle(best);
});
cv.addEventListener("pointercancel",function(){});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="9"){toggle(parseInt(k,10)-1);e.preventDefault();}
  else if(k==="0"){toggle(9);e.preventDefault();}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
  else if(k===" "||k==="Enter"){if($("overlay").classList.contains("show"))$("ovBtn").click();e.preventDefault();}
});
window.addEventListener("resize",resize);
document.addEventListener("visibilitychange",function(){
  if(document.hidden){ if(rafId){cancelAnimationFrame(rafId);rafId=0} }
  else{ if(!rafId){ rafId=requestAnimationFrame(loop) } resize() }
});
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);resize();setOvBtn("下一关","play");loop();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
/* 按钮图标注入（内联 SVG，零外链；重设文案统一走 setOvBtn，避免抹掉已注入图标） */
(function(){
  function $(id){return document.getElementById(id)}
  var dp=[["btnUndo","undo"],["btnHint","hint"],["btnReset","rotate"],["btnLv","grid"]],i;
  for(i=0;i<dp.length;i++)$(dp[i][0]).insertAdjacentHTML("afterbegin",window.SW_ICON(dp[i][1]));
})();
</script>
