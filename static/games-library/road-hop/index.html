window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
"use strict";
(() => {
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
var RH={};
RH.COLS=9; RH.ROWS=11; RH.LANE_ROWS=[1,3,5,7,9];
function rhMulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function rhGcd(a,b){while(b){var t=a%b;a=b;b=t;}return a;}
function rhLcm(a,b){return a*b/rhGcd(a,b);}
RH.period=function(lanes){var P=1,i;for(i=0;i<lanes.length;i++){P=rhLcm(P,RH.COLS/rhGcd(lanes[i].speed,RH.COLS));}return P;};
RH.carAt=function(lane,c,t){
  var idx=(c-lane.dir*lane.speed*t)%RH.COLS;idx=((idx%RH.COLS)+RH.COLS)%RH.COLS;
  return lane.pat[idx]===1;
};
RH.laneAt=function(lanes,y){for(var i=0;i<lanes.length;i++)if(lanes[i].row===y)return lanes[i];return null;};
/* 可通关性验证：状态 (x,y,t mod P) BFS，动作为上下左右/等待；
   每动一次车辆前进一拍，落点若在车道且有车即死；到达对岸即通。 */
RH.validate=function(L){
  if(!L||!Array.isArray(L.lanes)||L.lanes.length<3)return{ok:false,why:"lanes"};
  var P=RH.period(L.lanes);
  var seen={},q=[[4,0,0]],head=0;
  seen["4,0,0"]=1;
  var moves=[[0,0],[0,1],[0,-1],[1,0],[-1,0]];
  while(head<q.length){
    var cur=q[head++],x=cur[0],y=cur[1],t=cur[2];
    if(y===RH.ROWS-1)return{ok:true,why:"",ticks:t};
    for(var mi=0;mi<moves.length;mi++){
      var nx=x+moves[mi][0],ny=y+moves[mi][1],nt=t+1;
      if(nx<0||nx>=RH.COLS||ny<0||ny>=RH.ROWS)continue;
      var l=RH.laneAt(L.lanes,ny);
      if(l&&RH.carAt(l,nx,nt))continue;
      var key=nx+","+ny+","+(nt%P);
      if(seen[key])continue;
      seen[key]=1;q.push([nx,ny,nt]);
    }
  }
  return{ok:false,why:"blocked"};
};
/* 关卡生成：难度随 no 递增（车速 1→3、缺口 3→1、安全岛间距收紧）；
   生成后做 BFS 可通验证，并优先选择需要等待（步数超过理论最短）的布局。 */
RH.genLevel=function(no,seed){
  var p=(no-1)/39,best=null,att;
  var base=seed==null?7000+no*104729:seed;
  for(att=0;att<60;att++){
    var rng=rhMulberry32(base+att*7717);
    var lanes=[],i;
    for(i=0;i<RH.LANE_ROWS.length;i++){
      var row=RH.LANE_ROWS[i];
      var dir=i%2===0?1:-1;
      var speed=1+Math.min(3,Math.floor(p*4));
      var gapW=no<=8?3:(no<=32?2:1);
      var gaps=1+(rng()<0.35?1:0)+((no>25&&rng()<0.3)?1:0);
      var pat=new Array(RH.COLS),g,k;
      for(k=0;k<RH.COLS;k++)pat[k]=1;
      for(g=0;g<gaps;g++){
        var gs=(rng()*RH.COLS)|0;
        for(k=0;k<gapW;k++)pat[(gs+k)%RH.COLS]=0;
      }
      lanes.push({row:row,dir:dir,speed:speed,pat:pat});
    }
    var L={name:"第"+no+"关 · 过街小蛙",no:no,lanes:lanes};
    var r=RH.validate(L);
    if(r.ok){
      if(!best||r.ticks>best.t)best={L:L,t:r.ticks};
      if(r.ticks>=12+Math.round(p*6))return L;
    }
  }
  return best?best.L:null;
};
RH.validateAll=function(list){
  var fails=[],i,d,L,r;
  if(!Array.isArray(list))list=[];
  for(i=0;i<list.length;i++){
    d=list[i];
    L=RH.genLevel(d.no,d.seed);
    if(!L){fails.push((i+1)+"(gen)");}
    else{r=RH.validate(L);if(!r.ok)fails.push((i+1)+"("+r.why+")");}
  }
  return {total:list.length,solvable:list.length-fails.length,fail:fails};
};
globalThis.__XC=RH;
/*XC-CORE-END*/

/* ---------- 调色板：canvas 颜色全部读 CSS 变量，JS 零颜色字面量 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim();}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),onSoft:v("--g-on-soft"),
    danger:v("--g-danger"),border:v("--g-border"),
    road:v("--g-st-road"),roadline:v("--g-st-roadline"),island:v("--g-st-island"),
    car1:v("--g-st-car1"),car2:v("--g-st-car2"),car3:v("--g-st-car3"),
    frog:v("--g-st-frog"),frogdark:v("--g-st-frogdark"),
    roadHi:v("--g-rh-road-hi"),frogHi:v("--g-rh-frog-hi"),goal:v("--g-rh-goal"),shadow:v("--g-rh-shadow")};
}
window.__gOnTheme=function(){palLoad();draw();};
palLoad();
/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";

  }catch(e){}
  return 0;
}

function parseLevels(res){
  if(!res||!Array.isArray(res.levels)||res.levels.length<40)return false;

  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item.dataJson!=="string")return false;
    var d;try{d=JSON.parse(item.dataJson);}catch(e){return false;}
    if(!d||typeof d.name!=="string"||!Number.isInteger(d.no)||!Number.isInteger(d.seed))return false;

}

var KEY="sw.roadhop.v1";
function loadSave(){
  try{

    if(s&&typeof s==="object"){
      var done={};
      if(s.done&&typeof s.done==="object")for(var k in s.done){var v=parseInt(s.done[k],10);if(v>0)done[k]=v;}
      return {lv:Math.max(0,parseInt(s.lv,10)||0),done:done,best:Math.max(0,parseInt(s.best,10)||0)};
    }
  }catch(e){}
  return {lv:0,done:{},best:0};
}
var saveData=loadSave();

var best=saveData.best||0;
function totalBest(){var t=0,k;for(k in doneSave){var v=parseInt(doneSave[k],10)||0;if(v>0)t+=v;}return t;}
function save(){
  var data={lv:saveData.lv,done:doneSave,best:best};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("road-hop",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("road-hop").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(remote.lv,10)||0;
      if(rl>saveData.lv){saveData.lv=rl;changed=true;}
      var rb=parseInt(remote.best,10)||0;
      if(rb>best){best=rb;changed=true;}
      if(remote.done&&typeof remote.done==="object")for(var k in remote.done){
        var rv=parseInt(remote.done[k],10)||0,mv=parseInt(doneSave[k],10)||0;
        if(rv>mv){doneSave[k]=rv;changed=true;}
      }
      if(changed){best=totalBest()>0?Math.max(best,totalBest()):best;save();refreshStats();}
    }catch(e){}
  }).catch(function(){});
}

/* ---------- 渲染 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
/* 车辆：渐变体 + 车窗 + 恒白高光 + 恒黑落地投影 */
function drawCar(x,top,w,h,color){
  ctx.save();
  ctx.shadowColor=PAL.shadow;ctx.shadowBlur=h*0.18;ctx.shadowOffsetY=h*0.10;
  var g=ctx.createLinearGradient(0,top,0,top+h);
  g.addColorStop(0,colMix(color,WHITE,0.34));
  g.addColorStop(0.5,color);
  g.addColorStop(1,colShade(color,-0.26));
  ctx.fillStyle=g;rr(x,top,w,h,Math.min(6,w*0.12));ctx.fill();
  ctx.restore();
  ctx.strokeStyle=colShade(color,-0.40);   // 车体描边
  ctx.lineWidth=1.2;rr(x+0.6,top+0.6,w-1.2,h-1.2,Math.min(6,w*0.12));ctx.stroke();
  ctx.fillStyle=WHITE;ctx.globalAlpha=0.9;   // 车窗（恒白）
  ctx.fillRect(x+w*0.20,top+h*0.26,w*0.60,h*0.15);
  ctx.fillRect(x+w*0.20,top+h*0.58,w*0.60,h*0.15);
  ctx.globalAlpha=1;
  ctx.fillStyle=WHITE;ctx.globalAlpha=0.55;   // 车顶高光
  ctx.fillRect(x+w*0.08,top+h*0.08,w*0.84,Math.max(1.5,h*0.06));
  ctx.globalAlpha=1;
}
/* 小蛙：径向渐变体 + 眼柄 + 恒白高光 + 恒黑落地投影 */
function drawFrog(fx,fy,r){
  ctx.save();
  ctx.shadowColor=PAL.shadow;ctx.shadowBlur=r*0.5;ctx.shadowOffsetY=r*0.28;
  var g=ctx.createRadialGradient(fx-r*0.3,fy-r*0.35,r*0.15,fx,fy,r*1.05);
  g.addColorStop(0,PAL.frogHi);g.addColorStop(0.5,PAL.frog);g.addColorStop(1,PAL.frogdark);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(fx,fy,r,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle=PAL.frogdark;   // 眼柄
  ctx.beginPath();ctx.arc(fx-r*0.42,fy-r*0.42,r*0.30,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(fx+r*0.42,fy-r*0.42,r*0.30,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=WHITE;   // 眼白（恒白）
  ctx.beginPath();ctx.arc(fx-r*0.42,fy-r*0.46,r*0.20,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(fx+r*0.42,fy-r*0.46,r*0.20,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.text;   // 瞳孔
  ctx.beginPath();ctx.arc(fx-r*0.40,fy-r*0.44,r*0.09,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(fx+r*0.44,fy-r*0.44,r*0.09,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.85;ctx.fillStyle=WHITE;   // 顶部高光
  ctx.beginPath();ctx.ellipse(fx-r*0.28,fy-r*0.42,r*0.24,r*0.13,-0.5,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}
function draw(){
  if(!L)return;
  ctx.clearRect(0,0,W,H);
  // 安全岛地面：竖向渐变「面」+ 顶光
  var ig=ctx.createLinearGradient(0,0,0,H);
  ig.addColorStop(0,colMix(PAL.island,WHITE,0.32));ig.addColorStop(1,colShade(PAL.island,-0.06));
  ctx.fillStyle=ig;ctx.fillRect(0,0,W,H);
  var y,i;
  for(y=0;y<RH.ROWS;y++){
    var l=RH.laneAt(lanes,y);
    var top=sy(y);
    if(l){
      var rg=ctx.createLinearGradient(0,top,0,top+cellH);
      rg.addColorStop(0,PAL.roadHi);rg.addColorStop(0.5,PAL.road);rg.addColorStop(1,colShade(PAL.road,-0.10));
      ctx.fillStyle=rg;ctx.fillRect(0,top,W,cellH);
      ctx.strokeStyle=colShade(PAL.road,-0.24);ctx.lineWidth=1.5;   // 车道边线
      ctx.beginPath();ctx.moveTo(0,top+0.75);ctx.lineTo(W,top+0.75);ctx.moveTo(0,top+cellH-0.75);ctx.lineTo(W,top+cellH-0.75);ctx.stroke();
      ctx.fillStyle=PAL.roadline;   // 中央虚线
      for(i=0;i<RH.COLS;i++){
        var cx=i*cellW+cellW/2;
        ctx.fillRect(cx-cellW*0.18,top+cellH/2-1,cellW*0.36,2);
      }
    }else if(y===0||y===RH.ROWS-1){
      // 起点 / 对岸：品牌绿软面 + 顶光 + 凹槽砖
      var sg=ctx.createLinearGradient(0,top,0,top+cellH);
      sg.addColorStop(0,colMix(PAL.soft,WHITE,0.35));sg.addColorStop(1,PAL.soft);
      ctx.fillStyle=sg;ctx.fillRect(0,top,W,cellH);
      ctx.strokeStyle=colMix(PAL.primary,WHITE,0.30);ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(0,top+0.75);ctx.lineTo(W,top+0.75);ctx.stroke();
      ctx.fillStyle=colShade(PAL.soft,-0.10);
      for(i=0;i<RH.COLS;i++)ctx.fillRect(i*cellW+cellW*0.1,top+cellH*0.15,cellW*0.8,cellH*0.7);
      ctx.font='700 12px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=PAL.text;
      if(y===0)ctx.fillText("起点",W/2,top+cellH/2);
      else ctx.fillText("对岸",W/2,top+cellH*0.78);
    }
  }
  // 目标旗：对岸中央
  var gt=sy(RH.ROWS-1);
  ctx.strokeStyle=PAL.goal;ctx.lineWidth=2.5;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(W/2,gt+cellH*0.72);ctx.lineTo(W/2,gt+cellH*0.16);ctx.stroke();
  ctx.fillStyle=PAL.goal;
  ctx.beginPath();ctx.moveTo(W/2,gt+cellH*0.16);ctx.lineTo(W/2+cellW*0.42,gt+cellH*0.32);ctx.lineTo(W/2,gt+cellH*0.48);ctx.closePath();ctx.fill();
  // 车辆（连续位移，格子对齐碰撞）
  var carCols=[PAL.car1,PAL.car2,PAL.car3];
  for(var li=0;li<lanes.length;li++){
    var lane=lanes[li],lt=sy(lane.row);
    for(i=0;i<RH.COLS;i++){
      if(!lane.pat[i])continue;
      var colPos=i+lane.dir*lane.speed*tFloat;
      colPos=((colPos%RH.COLS)+RH.COLS)%RH.COLS;
      drawCar(colPos*cellW+cellW*0.06,lt+cellH*0.14,cellW*0.88,cellH*0.72,carCols[(li+i)%3]);
    }
  }
  drawFrog(frog.x*cellW+cellW/2,sy(frog.y)+cellH/2,cellW*0.30);
}

/* ---------- 统计 ---------- */
function refreshStats(){
  popVal(stLv,(cur+1)+"/"+LEVELS.length);
  popVal(stBest,String(best));
}

/* ---------- 输入 ---------- */
function queueMove(dx,dy){
  if(!playing||paused||over)return;
  queued={dx:dx,dy:dy};
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  if(!playing||paused||over)return;
  var r=cv.getBoundingClientRect();
  var px=(e.clientX-r.left)/r.width*W;
  var py=(e.clientY-r.top)/r.height*H;
  var fx=frog.x*cellW+cellW/2,fy=sy(frog.y)+cellH/2;
  var dx=px-fx,dy=py-fy;
  if(Math.abs(dx)>Math.abs(dy))queueMove(dx>0?1:-1,0);
  else queueMove(0,dy<0?1:-1);
});
var sx=0,sy0=0,tracking=false;
cv.addEventListener("touchstart",function(e){
  var t=e.changedTouches[0];sx=t.clientX;sy0=t.clientY;tracking=true;
},{passive:true});
cv.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  if(!tracking)return;tracking=false;
  var t=e.changedTouches[0];
  var dx=t.clientX-sx,dy=t.clientY-sy0;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))queueMove(dx>0?1:-1,0);
  else queueMove(0,dy>0?1:-1);
});
document.addEventListener("keydown",function(e){
  if(e.repeat)return;
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowUp"||k==="w"){e.preventDefault();queueMove(0,1);}
  else if(k==="ArrowDown"||k==="s"){e.preventDefault();queueMove(0,-1);}
  else if(k==="ArrowLeft"||k==="a"){e.preventDefault();queueMove(-1,0);}
  else if(k==="ArrowRight"||k==="d"){e.preventDefault();queueMove(1,0);}
  else if(k===" "){e.preventDefault();if(playing)togglePause();else if(!over)startPlay();}
});
btnPause.addEventListener("click",togglePause);
btnRetry.addEventListener("click",function(){if(playing||over)retryLevel();});
btnLevels.addEventListener("click",function(){if(playing&&!paused){paused=true;setBtnPause("继续","play");}showLevels();});
document.addEventListener("visibilitychange",function(){if(document.hidden&&playing&&!paused)togglePause();});
window.addEventListener("resize",function(){fit();});
window.addEventListener("orientationchange",function(){fit();});

/* ---------- 主循环 ---------- */
function loop(now){
  requestAnimationFrame(loop);
  var dt=((now-lastFrame)/1000)||0.016;lastFrame=now;
  if(dt>0.1)dt=0.1;
  if(playing&&!paused&&!over){
    tFloat+=dt*1000/TICK;
    while(tFloat>=tInt+1){
      if(queued){var q=queued;queued=null;doMove(q.dx,q.dy);}
      else{tInt++;var l=RH.laneAt(lanes,frog.y);if(l&&RH.carAt(l,frog.x,tInt))die();}
      if(!playing)break;
    }
  }
  draw();
}

/* ---------- 启动 ---------- */
setupLevel(Math.max(0,Math.min(saveData.lv,LEVELS.length-1)));
requestAnimationFrame(loop);
syncLevelsFromServer();
syncSaveFromServer();
showStart();
window.__validateLevels=function(){
  try{return RH.validateAll(LEVELS);}catch(e){return {error:String(e)};}
};
})();
</script>
<script>
/* 静态按钮图标注入：内联 SVG（零外链）；暂停钮文案由 setBtnPause 重插图标 */
(function(){
  function $(id){return document.getElementById(id)}
  var dp=[["btnPause","pause"],["btnLevels","grid"],["btnRetry","rotate"]],j;
  for(j=0;j<dp.length;j++){var el=$(dp[j][0]);if(el)el.insertAdjacentHTML("afterbegin",window.SW_ICON(dp[j][1]))}
})();
</script>
