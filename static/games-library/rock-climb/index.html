<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>岩壁攀岩</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材（st- 前缀素材 token）*/
  :root {
    --g-bg:#F5F6F3; --g-surface:#FFFFFF; --g-surface2:#EFF1EE;
    --g-primary:#2D9B6A; --g-primary-deep:#17734A;--g-btn-primary:#17734A; --g-primary-soft:#E8F6EF; --g-on-primary:#FFFFFF; --g-on-soft:#0B3625;
    --g-text:#1C1C1E; --g-muted:#6B6E73; --g-faint:#A9AEA9; --g-border:#E6E9E6; --g-hairline:#EFF1EE;
    --g-danger:#A83850; --g-warning:#9A6210; --g-success:#17734A; --g-water:#4A9FD4;
    --g-scrim:rgba(245,246,243,.9);
    --g-shadow:0 2px 12px rgba(20,40,30,.05);
    --g-radius:16px; --g-radius-btn:14px; --g-radius-inner:12px; --g-gap:16px;
    --g-st-rock1:#EAE6D9; --g-st-rock2:#F6F3EA; --g-st-seam:#D6CFBC;
    --g-rcl-rock-hi:#FBF9F2; --g-rcl-goal:#17734A; --g-rcl-shadow:rgba(20,40,30,.20); --g-rcl-base:#D8D2C0;
    color-scheme:light;
  }
  :root[data-theme=dark] {
    --g-bg:#141614; --g-surface:#1D201E; --g-surface2:#262A27;
    --g-primary-deep:#5BC894; --g-primary-soft:#1D3229; --g-on-soft:#B9E8CF;
    --g-text:#E6E9E6; --g-muted:#A9AEA9; --g-faint:#7E837D; --g-border:#2C312D; --g-hairline:#262A27;
    --g-danger:#DB7186; --g-warning:#E2A44E; --g-success:#4ADE6E; --g-water:#6BB4DE;
    --g-scrim:rgba(20,22,20,.9);
    --g-shadow:0 2px 12px rgba(0,0,0,.28);
    --g-st-rock1:#23251F; --g-st-rock2:#161712; --g-st-seam:#3A3D33;
    --g-rcl-rock-hi:#2E312A; --g-rcl-goal:#4ADE6E; --g-rcl-shadow:rgba(0,0,0,.45); --g-rcl-base:#1B1D18;
    color-scheme:dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.5; }
  .icon-btn {
    width: 44px; height: 44px; flex: 0 0 44px;
    border: 1px solid var(--g-border); border-radius: 12px;
    background: var(--g-surface); color: var(--g-text);
    display: grid; place-items: center; cursor: pointer; font: inherit;
    touch-action: manipulation;
  }
  .icon-btn { transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out; }
  .icon-btn:active { transform: scale(.96); }
  .scores { display: flex; gap: 8px; flex: 1; }
  .score-box {
    background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 12px;
    flex: 1; min-width: 0; padding: 5px 8px; text-align: center; line-height: 1.3;
    animation: rise .38s ease-out both;
  }
  .score-box:nth-child(2) { animation-delay: 40ms; }
  .score-box:nth-child(3) { animation-delay: 80ms; }
  .score-box .val.pop { animation: valpop .24s ease-out; }
  .score-box .label { display: block; font-size: 12px; opacity: .85; white-space: nowrap; }
  .score-box .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; min-width: 0; background: var(--g-surface2); border-radius: 12px; padding: 5px 8px; text-align: center; line-height: 1.3; animation: rise .38s ease-out both; }
  .stat:nth-child(2) { animation-delay: 40ms; }
  .stat:nth-child(3) { animation-delay: 80ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); white-space: nowrap; }
  .stat .val { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; animation: rise .38s ease-out both; animation-delay: 120ms; }
  .hint { margin: 0; font-size: 14px; color: var(--g-muted); }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: 14px;
    background: var(--g-btn-primary); color: var(--g-on-primary);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    touch-action: manipulation;
    transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out;
  }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: var(--g-surface2); color: var(--g-text); border: 1px solid var(--g-border); }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .btn .swi { margin-right: 4px; }
  .stage { position: relative; animation: fadein .3s ease-out both; animation-delay: 160ms; }
  canvas {
    display: block; width: 100%; aspect-ratio: 390 / 560; height: auto;
    background: var(--g-surface2);
    border: 1px solid var(--g-border); border-radius: 12px;
    touch-action: none;
  }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: absolute; inset: 0; z-index: 5;
    border-radius: 12px; background: var(--g-scrim);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 16px; text-align: center;
  }
  .overlay.show { display: flex; animation: rise .2s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: translateY(0); } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes valpop { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .ov-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--g-primary-deep); max-width: 100%; }
  .ov-sub { margin: 0 0 6px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .btn-row { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .btn-row .btn { flex: 1; }
  .lv-wrap { width: 100%; max-width: 340px; max-height: 48vh; overflow-y: auto; }
  .lv-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .lv-chip {
    min-height: 44px; border: 1px solid var(--g-border); border-radius: 10px;
    background: var(--g-surface); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    touch-action: manipulation;
  }
  .lv-chip.sel { border-color: var(--g-primary); box-shadow: inset 0 0 0 1.5px var(--g-primary); background: var(--g-primary-soft); color: var(--g-on-soft); }
  .lv-chip.done { background: var(--g-btn-primary); border-color: var(--g-primary); color: var(--g-on-primary); }
  .lv-chip:disabled { opacity: .38; cursor: not-allowed; }
  .badge { display: none; margin: 0 0 4px; padding: 4px 12px; border-radius: 999px; background: var(--g-surface2); color: var(--g-warning); font-size: 12px; font-weight: 700; }
  .badge.show { display: inline-block; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>
<script>
/* 内联图标库：照抄本库 window.SW_ICON 结构（24 viewBox / currentColor / aria-hidden / 零外链） */
window.SW_ICON=function(n,s){s=s||"";var P={
 'rotate':'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
 'play':'<path d="M8 5v14l11-7z"/>','pause':'<path d="M8 5v14M16 5v14"/>'
};
var fill={'play':1,'pause':1};
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="scores">
      <div class="score-box"><span class="label">高度</span><span class="val" id="score">0</span></div>
      <div class="score-box"><span class="label">最高分</span><span class="val" id="best">0</span></div>
      <div class="score-box"><span class="label">耐力</span><span class="val" id="stamina">100</span></div>
    </div>
  </header>
  <div class="toolbar">
    <p class="hint">左右手交替抓点，稳住耐力往上爬</p>
    <button class="btn" id="mainBtn">开始游戏</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="岩壁攀岩游戏画面"></canvas>
    <div class="overlay" role="dialog" aria-modal="true" id="overlay">
      <p class="ov-title" id="ovTitle" role="status" aria-live="assertive">准备开始</p>
      <p class="ov-sub" id="ovSub">左右手必须交替抓握，耐力耗尽会脱力坠落</p>
      <button class="btn" id="ovBtn">开始游戏</button>
    </div>
  </div>
  <p class="foot">操作：点岩点抓握 · 方向键选点 · 回车 / 空格抓握 · 空格暂停</p>
</div>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 画布与调色板（颜色全部经 CSS 变量读取，JS 零颜色字面量） ========== */
var NW=390,NH=560,W=390,H=560,S=1,offX=0,offY=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface2:v("--g-surface2"),text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),border:v("--g-border"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),danger:v("--g-danger"),warning:v("--g-warning"),
    water:v("--g-water"),success:v("--g-success"),onPrimary:v("--g-on-primary"),
    rock1:v("--g-st-rock1"),rock2:v("--g-st-rock2"),line:v("--g-st-seam"),
    rockHi:v("--g-rcl-rock-hi"),goal:v("--g-rcl-goal"),shadow:v("--g-rcl-shadow"),base:v("--g-rcl-base")};
}
window.__gOnTheme=function(){palLoad();grads=null;};
palLoad();
/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
var grads=null;
function buildGrads(){grads=ctx.createLinearGradient(0,0,0,NH);grads.addColorStop(0,PAL.rock1);grads.addColorStop(1,PAL.rock2);}

/* ========== 音效 ========== */
var AC=null;
function beep(f,d,type,vol){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=f;g.gain.value=vol||0.05;
    o.connect(g);g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(d||0.1));
    o.start();o.stop(AC.currentTime+(d||0.1)+0.02);
  }catch(e){}
}

/* ========== 存档（裸最高分；本地 + 账号双写） ========== */
var KEY="sw.rockclimb.v1";
var store={
  get:function(k){try{return window.localStorage.getItem(k)}catch(e){return null}},
  set:function(k,val){try{window.localStorage.setItem(k,val)}catch(e){}}
};
var best=parseInt(store.get(KEY)||"0",10)||0;
document.getElementById("best").textContent=best;
function persistBest(){
  store.set(KEY,String(best));
  if(GB.available)GB.saveState("rock-climb",String(best)).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("rock-climb").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rb=parseInt(JSON.parse(res.stateJson),10)||0;
      if(rb>best){best=rb;persistBest();document.getElementById("best").textContent=best;}
    }catch(e){}
  }).catch(function(){});
}

/* ========== 状态 ========== */
var REACH=150,M_PER_PX=1/24;
var holds=null,climb=null,camY=0,startY=0,minBodyY=0,score=0,grabCount=0,nextRest=8;
var stamina=100,state="ready",lastHand="",selIdx=-1,clock=0;
var scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),stEl=document.getElementById("stamina");
var overlayEl=document.getElementById("overlay");
var ovTitle=document.getElementById("ovTitle"),ovSub=document.getElementById("ovSub");
var ovBtn=document.getElementById("ovBtn"),mainBtn=document.getElementById("mainBtn");

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rand(a,b){return a+Math.random()*(b-a)}
function dist(ax,ay,bx,by){return Math.sqrt((ax-bx)*(ax-bx)+(ay-by)*(ay-by))}
function popVal(el,v){var s=String(v);if(el.textContent!==s){el.textContent=s;el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");}}
function setMainBtn(t,icon){mainBtn.innerHTML=window.SW_ICON(icon)+t;}   // 文案更新重插图标，不抹掉 SVG
function showOverlay(t,s,b,icon){ovTitle.textContent=t;ovSub.textContent=s;ovBtn.innerHTML=window.SW_ICON(icon||"play")+b;overlayEl.classList.add("show")}
function hideOverlay(){overlayEl.classList.remove("show")}

/* 岩点：kind 0 大握点(jug，省力) / 1 小捏点(crimp，耗力) / 2 休息台(rest，回耐力) */
function makeHold(y,px,diff){
  var x=clamp(px+rand(-REACH*0.55,REACH*0.55),26,NW-26);
  var kind=0,r=rand(12,15);
  grabCount++;
  if(grabCount>=nextRest){kind=2;r=17;grabCount=0;nextRest=8+((Math.random()*5)|0);}
  else if(Math.random()<0.22+diff*0.42){kind=1;r=rand(8.5,11);}
  return {x:x,y:y,r:r,kind:kind};
}
function bodyX(){return (holds[climb.L].x+holds[climb.R].x)/2}
function bodyY(){return (holds[climb.L].y+holds[climb.R].y)/2}
function gripDrain(k){return k===2?-14:(k===1?10:4)}
function resetRound(){
  holds=[
    {x:NW/2-46,y:NH-80,r:14,kind:0},
    {x:NW/2+46,y:NH-80,r:14,kind:0},
    {x:NW/2-10,y:NH-150,r:12,kind:0},
    {x:NW/2+70,y:NH-210,r:11,kind:1}
  ];
  climb={L:0,R:1};
  camY=0;startY=bodyY();minBodyY=startY;score=0;stamina=100;grabCount=0;nextRest=8;selIdx=-1;clock=0;
  var y=NH-210,diff=0;
  while(y>camY-160){y-=rand(44,72);holds.push(makeHold(y,holds[holds.length-1].x,diff));}
  popVal(scoreEl,0);popVal(stEl,100);
}
function startGame(){resetRound();state="running";hideOverlay();setMainBtn("暂停","pause");}

function endRound(){
  var isRecord=score>best&&score>0;
  if(isRecord){best=score;persistBest();document.getElementById("best").textContent=best;}
  if(GB.available)GB.reportScore("rock-climb",{metricValue:best}).catch(function(){});
  return isRecord?" · 新纪录":"";
}
function die(){
  state="over";
  beep(150,0.32,"sawtooth",0.06);
  showOverlay("脱力坠落","高度 "+score+" m"+endRound(),"重新开始","rotate");
  setMainBtn("重新开始","rotate");
}
function primary(){
  if(state==="running"){
    state="paused";showOverlay("已暂停","休息一下，随时继续","继续","play");setMainBtn("继续","play");
  }else if(state==="paused"){
    state="running";hideOverlay();setMainBtn("暂停","pause");
  }else startGame();
}

/* ========== 抓点 ========== */
function tryGrab(idx){
  if(state!=="running")return;
  var h=holds[idx];
  if(!h)return;
  var moveHand=lastHand==="L"?"R":"L";   // 强制交替：上次动左手则这次动右手
  var other=moveHand==="L"?"R":"L";
  if(idx===climb[other]){addFloatHold(h,"另一只手正抓着",PAL.warning);return;}
  var og=holds[climb[other]];
  if(dist(h.x,h.y,og.x,og.y)>REACH){addFloatHold(h,"够不到",PAL.warning);return;}
  // 耗力：小捏点更费
  var cost=h.kind===2?0:(h.kind===1?3.5:1.2);
  stamina=Math.max(0,stamina-cost);
  climb[moveHand]=idx;
  lastHand=moveHand;
  beep(h.kind===1?520:400,0.06,"triangle",0.04);
  var by=bodyY();
  if(by<minBodyY)minBodyY=by;
  var ns=Math.max(0,Math.floor((startY-minBodyY)*M_PER_PX));
  if(ns!==score){score=ns;popVal(scoreEl,ns);}
}
function addFloatHold(h,txt,c){addFloat(h.x,h.y-14,txt,c)}

/* ========== 更新 ========== */
function step(dt){
  clock+=dt;
  // 耐力：双手握点类型的平均（休息台为负=回力）
  var drain=(gripDrain(holds[climb.L].kind)+gripDrain(holds[climb.R].kind))/2;
  stamina=clamp(stamina-drain*dt,0,100);
  var shown=Math.round(stamina);
  popVal(stEl,shown);
  if(stamina<=0){die();return;}
  // 相机跟随
  var target=bodyY()-NH*0.42;
  if(target<camY)camY=target;
  // 生成新岩点
  var top=Infinity;
  for(var i=0;i<holds.length;i++)if(holds[i].y<top)top=holds[i].y;
  var diff=clamp((startY-minBodyY)/7000,0,1);
  while(top>camY-140){
    top-=rand(44+diff*22,72+diff*26);
    holds.push(makeHold(top,holds[holds.length-1].x,diff));
  }
  // 清理屏下岩点
  for(var m=holds.length-1;m>=0;m--)if(holds[m].y>camY+NH+80)holds.splice(m,1);
}

/* ========== 绘制 ========== */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawHold(h,idx,reach){
  var wy=h.y-camY;
  var c=h.kind===2?PAL.success:(h.kind===1?PAL.warning:PAL.primary);
  if(h.kind===2){
    // 休息台：渐变横板 + 顶光 + 落地投影
    ctx.save();
    ctx.shadowColor=PAL.shadow;ctx.shadowBlur=8;ctx.shadowOffsetY=3;
    var g=ctx.createLinearGradient(0,wy-5,0,wy+5);
    g.addColorStop(0,colMix(c,WHITE,0.30));g.addColorStop(1,colShade(c,-0.22));
    ctx.fillStyle=g;rr(h.x-26,wy-5,52,10,6);ctx.fill();
    ctx.restore();
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=1.6;rr(h.x-26,wy-5,52,10,6);ctx.stroke();
    ctx.strokeStyle=colMix(c,WHITE,0.55);ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(h.x-22,wy-3.5);ctx.lineTo(h.x+22,wy-3.5);ctx.stroke();
    if(idx===selIdx){ctx.strokeStyle=PAL.danger;ctx.lineWidth=2;ctx.beginPath();ctx.arc(h.x,wy,20,0,6.3);ctx.stroke();}
    return;
  }
  if(reach&&idx!==selIdx){   // 可达岩点：品牌绿软环 = 「该点哪」
    ctx.strokeStyle=colMix(PAL.primary,WHITE,0.40);ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(h.x,wy,h.r+7,0,6.3);ctx.stroke();
  }
  ctx.save();
  ctx.shadowColor=PAL.shadow;ctx.shadowBlur=h.r*0.5;ctx.shadowOffsetY=h.r*0.28;
  var g2=ctx.createRadialGradient(h.x-h.r*0.3,wy-h.r*0.35,h.r*0.15,h.x,wy,h.r*1.15);
  g2.addColorStop(0,colMix(c,WHITE,0.62));
  g2.addColorStop(0.5,c);
  g2.addColorStop(1,colShade(c,-0.32));
  ctx.fillStyle=g2;
  ctx.beginPath();ctx.ellipse(h.x,wy,h.r*1.15,h.r*0.82,h.kind===1?0.5:0.2,0,6.3);ctx.fill();
  ctx.restore();
  ctx.strokeStyle=colShade(c,-0.45);ctx.lineWidth=1.4;
  ctx.beginPath();ctx.ellipse(h.x,wy,h.r*1.15,h.r*0.82,h.kind===1?0.5:0.2,0,6.3);ctx.stroke();
  ctx.globalAlpha=0.85;ctx.fillStyle=WHITE;   // 恒白高光
  ctx.beginPath();ctx.ellipse(h.x-h.r*0.34,wy-h.r*0.34,h.r*0.26,h.r*0.15,-0.5,0,6.3);ctx.fill();
  ctx.globalAlpha=1;
  if(idx===selIdx){
    ctx.strokeStyle=PAL.danger;ctx.lineWidth=2.4;
    ctx.beginPath();ctx.arc(h.x,wy,h.r+9,0,6.3);ctx.stroke();
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(offX,offY);ctx.scale(S,S);
  if(!grads)buildGrads();
  ctx.fillStyle=grads;ctx.fillRect(0,0,NW,NH);
  // 岩壁顶光（rock-hi → rock1 渐变，替代灰白平铺）
  var tg=ctx.createLinearGradient(0,0,0,NH*0.4);
  tg.addColorStop(0,PAL.rockHi);tg.addColorStop(1,PAL.rock1);
  ctx.fillStyle=tg;ctx.fillRect(0,0,NW,NH*0.4);
  // 目标方向：顶部品牌绿双箭头（往上爬）
  ctx.strokeStyle=PAL.goal;ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();ctx.moveTo(NW/2-9,26);ctx.lineTo(NW/2,16);ctx.lineTo(NW/2+9,26);ctx.stroke();
  ctx.beginPath();ctx.moveTo(NW/2-9,36);ctx.lineTo(NW/2,26);ctx.lineTo(NW/2+9,36);ctx.stroke();
  // 岩壁裂隙
  ctx.strokeStyle=PAL.line;ctx.lineWidth=1.6;
  for(var s2=0;s2<4;s2++){
    var yy=((s2*170-(camY*0.35)%170)+170)%170-40;
    ctx.beginPath();
    ctx.moveTo(yy*1.3%NW,yy);
    ctx.quadraticCurveTo(NW*0.4,yy+40,NW*(0.2+s2*0.2),yy+90);
    ctx.stroke();
  }
  // 底部地面（起点岩台）
  var bg2=ctx.createLinearGradient(0,NH-46,0,NH);
  bg2.addColorStop(0,PAL.base);bg2.addColorStop(1,colShade(PAL.base,-0.22));
  ctx.fillStyle=bg2;rr(0,NH-46,NW,46,10);ctx.fill();
  ctx.strokeStyle=colMix(PAL.base,WHITE,0.45);ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(8,NH-45);ctx.lineTo(NW-8,NH-45);ctx.stroke();
  ctx.fillStyle=PAL.text;ctx.font='700 12px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("起点",NW/2,NH-24);
  // 高度刻度（目标 / 进度）
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  for(var hm=5;hm<=40;hm+=5){
    var wy=startY-hm/M_PER_PX-camY;
    if(wy<-10||wy>NH+10)continue;
    ctx.strokeStyle=PAL.muted;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(6,wy);ctx.lineTo(14,wy);ctx.stroke();
    ctx.fillStyle=PAL.text;
    ctx.fillText(hm+"m",18,wy+4);
  }
  // 可达岩点软环 + 岩点
  var lh0=holds[climb.L],rh0=holds[climb.R];
  for(var i=0;i<holds.length;i++){
    var h=holds[i];
    var reach=(i!==climb.L&&i!==climb.R)&&
      (dist(h.x,h.y,lh0.x,lh0.y)<=REACH||dist(h.x,h.y,rh0.x,rh0.y)<=REACH);
    drawHold(h,i,reach);
  }
  // 攀岩者：两臂 + 躯干 + 头（渐变体 + 恒白高光 + 落地投影）
  var lh=holds[climb.L],rh=holds[climb.R];
  var bx=(lh.x+rh.x)/2,by=(lh.y+rh.y)/2-camY;
  var bodyC=stamina<30?PAL.danger:PAL.primary;
  ctx.save();
  ctx.shadowColor=PAL.shadow;ctx.shadowBlur=8;ctx.shadowOffsetY=4;
  ctx.strokeStyle=PAL.deep;ctx.lineWidth=4;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(lh.x,lh.y-camY);ctx.lineTo(bx,by);ctx.lineTo(rh.x,rh.y-camY);ctx.stroke();
  ctx.restore();
  var bg3=ctx.createRadialGradient(bx-2,by-3,1,bx,by,9);
  bg3.addColorStop(0,colMix(bodyC,WHITE,0.5));bg3.addColorStop(1,bodyC);
  ctx.fillStyle=bg3;ctx.beginPath();ctx.arc(bx,by,7,0,6.3);ctx.fill();
  var hx=bx+(rh.x>lh.x?6:-6);
  var hg=ctx.createRadialGradient(hx-2,by-17,1,hx,by-15,8);
  hg.addColorStop(0,colMix(bodyC,WHITE,0.5));hg.addColorStop(1,bodyC);
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(hx,by-15,6.5,0,6.3);ctx.fill();
  ctx.globalAlpha=0.85;ctx.fillStyle=WHITE;
  ctx.beginPath();ctx.ellipse(bx-2,by-3,2.4,1.4,-0.5,0,6.3);ctx.fill();
  ctx.globalAlpha=1;
  // 耐力条：凹槽轨道 + 渐变填充 + 亮芯
  ctx.fillStyle=PAL.surface2;rr(12,12,120,10,5);ctx.fill();
  ctx.strokeStyle=colShade(PAL.surface2,-0.25);ctx.lineWidth=1;rr(12.5,12.5,119,9,4.5);ctx.stroke();
  var stc=stamina>55?PAL.success:(stamina>28?PAL.warning:PAL.danger);
  var sw=Math.max(6,120*stamina/100);
  var sg=ctx.createLinearGradient(0,12,0,22);
  sg.addColorStop(0,colMix(stc,WHITE,0.35));sg.addColorStop(1,stc);
  ctx.fillStyle=sg;rr(12,12,sw,10,5);ctx.fill();
  ctx.strokeStyle=colShade(stc,-0.3);ctx.lineWidth=1;rr(12.5,12.5,Math.max(5,sw-1),9,4.5);ctx.stroke();
  ctx.fillStyle=PAL.text;
  ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.fillText("高度 "+score+" m",142,21);
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

/* ========== 输入 ========== */
function toNominal(ev){
  var r=cv.getBoundingClientRect();
  return{x:(ev.clientX-r.left-offX)/S,y:(ev.clientY-r.top-offY)/S};
}
cv.addEventListener("pointerdown",function(ev){
  var p=toNominal(ev);
  // 找点击命中的岩点（容忍半径放大）
  var hitIdx=-1,hd2=1e9;
  for(var i=0;i<holds.length;i++){
    var h=holds[i];
    var d2=(h.x-p.x)*(h.x-p.x)+(h.y-camY-p.y)*(h.y-camY-p.y);
    var rr2=(h.r+16)*(h.r+16);
    if(d2<rr2&&d2<hd2){hd2=d2;hitIdx=i;}
  }
  selIdx=hitIdx;
  if(hitIdx>=0)tryGrab(hitIdx);
  ev.preventDefault();
});
// 键盘：方向键在可达岩点间选择，回车 / 空格抓握
function pickHold(dir){
  var cur=selIdx>=0?holds[selIdx]:{x:bodyX(),y:bodyY()};
  var bi=-1,bv=1e9;
  for(var i=0;i<holds.length;i++){
    if(i===selIdx)continue;
    var h=holds[i];
    var dx=h.x-cur.x,dy=h.y-camY-cur.y;
    var ok=false,v=0;
    if(dir==="up"&&dy<-14){ok=true;v=dx*dx+dy*dy;}
    else if(dir==="down"&&dy>14){ok=true;v=dx*dx+dy*dy;}
    else if(dir==="left"&&dx<-14){ok=true;v=dx*dx+dy*dy;}
    else if(dir==="right"&&dx>14){ok=true;v=dx*dx+dy*dy;}
    if(ok&&v<bv){bv=v;bi=i;}
  }
  if(bi>=0)selIdx=bi;
}
window.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowUp"||k==="w"){e.preventDefault();pickHold("up");}
  else if(k==="ArrowDown"||k==="s"){e.preventDefault();pickHold("down");}
  else if(k==="ArrowLeft"||k==="a"){e.preventDefault();pickHold("left");}
  else if(k==="ArrowRight"||k==="d"){e.preventDefault();pickHold("right");}
  else if(k===" "||k==="Enter"){e.preventDefault();if(selIdx>=0&&state==="running")tryGrab(selIdx);else primary();}
});

document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running"){state="paused";showOverlay("已暂停","回到游戏继续攀登","继续","play");setMainBtn("继续","play");}
});

/* ========== 主循环与启动 ========== */
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));
  H=Math.max(360,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);
  offX=(W-NW*S)/2;offY=(H-NH*S)/2;
}
window.addEventListener("resize",resize);

var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.033,(ts-last)/1000||0);
  last=ts;
  if(state==="running")step(dt);
  draw();
}

mainBtn.addEventListener("click",function(e){primary();e.currentTarget.blur();});
ovBtn.addEventListener("click",function(e){primary();e.currentTarget.blur();});

resize();
resetRound();
showOverlay("准备开始","左右手交替抓岩点，管理耐力节奏登顶","开始游戏","play");
setMainBtn("开始游戏","play");
syncSaveFromServer();
requestAnimationFrame(frame);

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
/* 静态按钮图标注入：内联 SVG（零外链）；主钮文案由 setMainBtn 重插图标 */
(function(){
  function $(id){return document.getElementById(id)}
  var dp=[["mainBtn","play"]],j;
  for(j=0;j<dp.length;j++){var el=$(dp[j][0]);if(el)el.insertAdjacentHTML("afterbegin",window.SW_ICON(dp[j][1]))}
})();
</script>
