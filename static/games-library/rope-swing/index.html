<style>

  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-sky1:#1B241E;--g-st-sky2:#141614;--g-st-rock:#3A423C;--g-st-rock2:#4A544C;--g-st-vine:#3E6B30;--g-st-body:#2D9B6A;color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;

  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }

  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay { position: fixed; inset: 0; z-index: 10; background: var(--g-scrim); display: none; align-items: center; justify-content: center; padding: 20px; }
  .overlay.show { display: flex; }
  .panel { width: 100%; max-width: 320px; padding: 22px 18px; background: var(--g-surface); border-radius: var(--g-radius); box-shadow: var(--g-shadow); text-align: center; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .desc b { color: var(--g-primary-deep); font-size: 28px; }
  .panel .btn { width: 100%; }

  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>

window.SW_ICON=function(n,s){s=s||"";var P={
 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>','arrow-left':'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 'arrow-up':'<path d="M12 19V5M6 11l6-6 6 6"/>','arrow-down':'<path d="M12 5v14M6 13l6 6 6-6"/>',

 'backspace':'<path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z M12.5 9.5l5 5M17.5 9.5l-5 5"/>',

<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<body>
<div class="wrap">
  <header><span class="sub">靠近藤蔓自动抓握，点击松手飞跃峡谷</span><span class="sub" id="bestTag">最高 0 m</span></header>

    <div class="stat"><span class="label">距离</span><span class="val" id="stDist">0 m</span></div>

  </div>
  <div class="stage"><canvas id="cv" aria-label="荡藤过谷" role="img"></canvas></div>

    <h2 id="ovTitle">坠入峡谷</h2>

  </div>
</div>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层 ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    success:v("--g-success"),warning:v("--g-warning"),danger:v("--g-danger"),
    sky1:v("--g-st-sky1"),sky2:v("--g-st-sky2"),rock:v("--g-st-rock"),rock2:v("--g-st-rock2"),
    vine:v("--g-st-vine"),body:v("--g-st-body")};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 状态 ---------- */
var SAVE_KEY="sw.ropeswing.v1";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,dpr=1;
var plats=[],vines=[];
var ch={x:0,y:0,vx:0,vy:0,r:12};
var mode="ground";//ground|fly|swing
var rope=null;//{px,py,L,theta,omega}
var curPlat=0;
var dist=0,swings=0,best=0,over=false,running=false;
var pump=0,grabBed=0;
var genX=0,genY=0,seed=1;
var lastTs=0;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function rr(a,b){return a+rnd()*(b-a)}
/* ---------- 存档 ---------- */
function loadBest(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&typeof s.best==="number")return s.best;}catch(e){}return 0}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({best:best}));}catch(e){}
  if(GB.available)GB.saveState("rope-swing",{best:best}).catch(function(){});
}
best=loadBest();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("rope-swing").then(function(res){
    if(!res||!res.stateJson)return;
    try{var r=JSON.parse(res.stateJson);var rb=parseInt(r.best,10)||0;if(rb>best){best=rb;persist();updStats()}}catch(e){}
  }).catch(function(){});
}
/* ---------- 布局 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=wCss;H=Math.round(W*0.95);
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ch.r=Math.max(10,Math.round(W*0.026));
}
/* ---------- 关卡生成 ---------- */
function baseY(){return Math.round(H*0.74)}
function genWorld(){
  plats=[];vines=[];
  var y=baseY();
  plats.push({x:-200,w:420,y:y});
  genX=220;genY=y;
  while(genX<W*3){
    var d=Math.min(1,genX/2600);
    var gap=rr(95,150+d*120);
    var w=rr(120,200-d*60);
    var ny=Math.max(Math.round(H*0.45),Math.min(Math.round(H*0.86),genY+rr(-70,70)));
    var px=genX+gap;
    //藤蔓挂在峡谷中间
    vines.push({px:genX+gap*0.5,py:rr(30,80),L:Math.max(90,(ny-rr(30,80))*rr(0.92,1.12)),used:false});
    plats.push({x:px,w:w,y:ny});
    genX=px+w;genY=ny;
  }
}
/* ---------- 统计 ---------- */
function updStats(){
  $("stDist").textContent=Math.floor(dist)+" m";
  $("stSwing").textContent=swings;
  $("stState").textContent=mode==="ground"?"地面":mode==="swing"?"摆荡":"飞跃";
  $("bestTag").textContent="最高 "+Math.floor(best)+" m";
}
/* ---------- 流程 ---------- */
function start(){
  seed=(Date.now()%100000)|0;
  genWorld();
  curPlat=0;
  ch.x=plats[0].x+90;ch.y=plats[0].y-ch.r;ch.vx=0;ch.vy=0;
  mode="ground";rope=null;dist=0;swings=0;over=false;running=true;pump=0;
  hideOverlay();updStats();
  say("点击松手飞出，长按 ←/→ 可加摆力");
}
function endGame(){
  running=false;over=true;
  var isNew=dist>best;
  if(isNew){best=dist;persist()}
  if(GB.available)GB.reportScore("rope-swing",{metricValue:Math.floor(dist),metricExtra:swings}).catch(function(){});
  $("ovTitle").textContent="坠入峡谷";
  $("ovDesc").innerHTML="荡出 <b>"+Math.floor(dist)+"</b> m"+(isNew?" · 新纪录":"")+"<br>抓藤 "+swings+" 次 · 最高 "+Math.floor(best)+" m";
  $("overlay").classList.add("show");
}
function release(){
  if(mode!=="swing"||!rope)return;
  var L=rope.L,th=rope.theta,om=rope.omega;
  ch.vx=L*om*Math.cos(th);
  ch.vy=-L*om*Math.sin(th);
  var sp=Math.hypot(ch.vx,ch.vy);
  if(sp>1600){ch.vx*=1600/sp;ch.vy*=1600/sp}
  mode="fly";rope=null;
  say("飞出！");
}
function tryGrab(){
  if(mode!=="fly")return false;
  for(var i=0;i<vines.length;i++){
    var v=vines[i];
    if(v.used)continue;
    var dx=ch.x-v.px,dy=ch.y-v.py;
    var d=Math.hypot(dx,dy);
    if(d<v.L+34&&dy>-10){
      var L=v.L;
      var th=Math.atan2(dx,dy);
      var om=(ch.vx*Math.cos(th)-ch.vy*Math.sin(th))/L;
      rope={px:v.px,py:v.py,L:L,theta:th,omega:om};
      v.used=true;mode="swing";swings++;
      updStats();
      say("抓牢了，点击松手！");
      return true;
    }
  }
  return false;
}
/* ---------- 主循环 ---------- */
function step(ts){
  if(!lastTs)lastTs=ts;
  var dt=Math.min(0.033,(ts-lastTs)/1000);lastTs=ts;
  if(running){
    if(mode==="ground"){
      var p=plats[curPlat];
      var run=170+Math.min(120,dist*0.25);
      ch.x+=run*dt;
      ch.y=p.y-ch.r;
      if(ch.x>=p.x+p.w){mode="fly";ch.vx=run;ch.vy=0;tryGrab()}
    }else if(mode==="fly"){
      ch.vy+=900*dt;
      ch.x+=ch.vx*dt;ch.y+=ch.vy*dt;
      if(!tryGrab()){
        //落地检测
        for(var i=0;i<plats.length;i++){
          var pl=plats[i];
          if(ch.vy>0&&ch.x>=pl.x&&ch.x<=pl.x+pl.w&&ch.y+ch.r>=pl.y&&ch.y+ch.r<=pl.y+26){
            ch.y=pl.y-ch.r;ch.vy=0;ch.vx=0;mode="ground";curPlat=i;
            say("落地，继续跑");
            break;
          }
        }
      }
      if(ch.y>H+60){endGame()}
    }else if(mode==="swing"){
      var g=900,L=rope.L;
      rope.omega+=(-(g/L)*Math.sin(rope.theta)+pump*1.7)*dt;
      rope.theta+=rope.omega*dt;
      ch.x=rope.px+L*Math.sin(rope.theta);
      ch.y=rope.py+L*Math.cos(rope.theta);
    }
    if(mode!=="ground")dist=Math.max(dist,ch.x/40);
    if(ch.x>genX-W*0.6)extendWorld();
    updStats();
  }
  draw();
  requestAnimationFrame(step);
}
function extendWorld(){
  var d=Math.min(1,genX/2600);
  var gap=rr(95,150+d*120);
  var w=rr(120,200-d*60);
  var ny=Math.max(Math.round(H*0.45),Math.min(Math.round(H*0.86),genY+rr(-70,70)));
  var px=genX+gap;
  vines.push({px:genX+gap*0.5,py:rr(30,80),L:Math.max(90,(ny-rr(30,80))*rr(0.92,1.12)),used:false});
  plats.push({x:px,w:w,y:ny});
  genX=px+w;genY=ny;
}
/* ---------- 绘制 ---------- */
function sx(wx){return wx-(ch.x-W*0.34)}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.sky1);g.addColorStop(1,PAL.sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  //岩壁
  for(var i=0;i<plats.length;i++){
    var p=plats[i],x0=sx(p.x),x1=sx(p.x+p.w),y=p.y;
    if(x1<-40||x0>W+40)continue;
    ctx.fillStyle=PAL.rock;
    ctx.fillRect(x0,y,x1-x0,H-y+40);
    ctx.fillStyle=PAL.rock2;
    ctx.fillRect(x0,y,x1-x0,6);
    ctx.fillRect(x0,y,4,H-y+40);
    ctx.fillRect(x1-4,y,4,H-y+40);
  }
  //藤蔓
  for(var v=0;v<vines.length;v++){
    var vn=vines[v],vx=sx(vn.px);
    if(vx<-40||vx>W+40)continue;
    ctx.strokeStyle=PAL.vine;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(vx,0);ctx.lineTo(vx,vn.py);ctx.stroke();
    ctx.fillStyle=PAL.vine;
    ctx.beginPath();ctx.arc(vx,vn.py,5,0,7);ctx.fill();
    if(!vn.used&&mode==="fly"){
      var d=Math.hypot(ch.x-vn.px,ch.y-vn.py);
      if(d<vn.L+34){
        ctx.strokeStyle=PAL.warning;ctx.lineWidth=2;ctx.setLineDash([5,5]);
        ctx.beginPath();ctx.arc(vx,vn.py,vn.L,0,7);ctx.stroke();ctx.setLineDash([]);
      }
    }
  }
  //人物
  var cxp=sx(ch.x),cyp=ch.y;
  if(mode==="swing"&&rope){
    ctx.strokeStyle=PAL.vine;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(sx(rope.px),rope.py);ctx.lineTo(cxp,cyp);ctx.stroke();
  }
  ctx.fillStyle=PAL.body;
  ctx.beginPath();ctx.arc(cxp,cyp,ch.r,0,7);ctx.fill();
  ctx.fillStyle=PAL.text;
  ctx.beginPath();ctx.arc(cxp+ch.r*0.35,cyp-ch.r*0.2,ch.r*0.14,0,7);ctx.fill();
  if(!running&&!over){
    ctx.fillStyle=PAL.scrim;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=PAL.text;ctx.font="700 22px -apple-system,'PingFang SC',sans-serif";
    ctx.textAlign="center";ctx.fillText("准备荡藤",W/2,H/2-10);
    ctx.fillStyle=PAL.muted;ctx.font="500 14px -apple-system,'PingFang SC',sans-serif";
    ctx.fillText("点击「开始」",W/2,H/2+18);
  }
  if(over){ctx.fillStyle=PAL.scrim;ctx.fillRect(0,0,W,H)}
}
/* ---------- 输入 ---------- */
var holdSide=0;
cv.addEventListener("pointerdown",function(e){
  if(!running)return;
  var r=cv.getBoundingClientRect();
  var left=e.clientX-r.left<r.width/2;
  holdSide=left?-1:1;pump=holdSide;
  if(mode==="swing")release();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(!running)return;
  var r=cv.getBoundingClientRect();
  var left=e.clientX-r.left<r.width/2;
  holdSide=left?-1:1;pump=holdSide;
});
cv.addEventListener("pointerup",function(){holdSide=0;pump=0});
cv.addEventListener("pointercancel",function(){holdSide=0;pump=0});
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft"){pump=-1;e.preventDefault()}
  else if(e.key==="ArrowRight"){pump=1;e.preventDefault()}
  else if((e.key===" "||e.key==="Enter")){
    if(!running)start();
    else if(mode==="swing")release();
    e.preventDefault();
  }
});
window.addEventListener("keyup",function(e){
  if(e.key==="ArrowLeft"&&pump===-1)pump=0;
  if(e.key==="ArrowRight"&&pump===1)pump=0;
});
$("btnStart").addEventListener("click",start);
$("btnRestart").addEventListener("click",start);
$("btnHint").addEventListener("click",function(){say("提示：在藤蔓最高点附近松手，飞得最远")});
$("ovBtn").addEventListener("click",start);
function hideOverlay(){$("overlay").classList.remove("show")}
window.addEventListener("resize",resize);
palLoad();resize();genWorld();updStats();
requestAnimationFrame(step);
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套） */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
