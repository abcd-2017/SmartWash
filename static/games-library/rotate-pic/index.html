<html lang="zh-CN">

<title>旋片复原</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（--g-rpic-* 棋盘/碎片面）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gap:16px;--g-rpic-board1:#EDEBE3;--g-rpic-board2:#DED9CB;--g-rpic-tile1:#FFFFFF;--g-rpic-tile2:#EFF1EE;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-rpic-board1:#262A27;--g-rpic-board2:#171B18;--g-rpic-tile1:#2A2F2B;--g-rpic-tile2:#1F241F;color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; min-width: 0; animation: rise .38s ease-out both; }
  .stat:nth-child(2) { animation-delay: 40ms; }
  .stat:nth-child(3) { animation-delay: 80ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.low { color: var(--g-warning); }
  .stage { position: relative; animation: fadein .3s ease-out both; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); border: 1px solid var(--g-border); box-shadow: var(--g-shadow); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out;
  }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .35; }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .legend { display: flex; gap: 8px; margin: 10px 2px 0; animation: rise .38s ease-out both; animation-delay: 120ms; }
  .lg-chip { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; background: var(--g-surface2); border-radius: 10px; padding: 5px 8px; font-size: 12px; color: var(--g-muted); line-height: 1.3; }
  .lg-chip b { color: var(--g-text); font-weight: 600; }
  .lg-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
    transition: transform .14s ease-out, background .16s ease-out;
  }
  .lvbtn:active { transform: scale(.96); }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（同时压 animation-duration 与 animation-delay） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="rotate-pic",SAVE_KEY="sw.rotatepic.v1";
var DEFAULT_LEVELS=[{"name":"旋片·01","seed":340192,"taps":2,"par":6,"difficulty":1},{"name":"旋片·02","seed":609266,"taps":3,"par":9,"difficulty":1},{"name":"旋片·03","seed":675718,"taps":3,"par":9,"difficulty":1},{"name":"旋片·04","seed":836039,"taps":2,"par":6,"difficulty":1},{"name":"旋片·05","seed":596377,"taps":2,"par":6,"difficulty":1},{"name":"旋片·06","seed":227106,"taps":2,"par":2,"difficulty":1},{"name":"旋片·07","seed":672279,"taps":2,"par":6,"difficulty":1},{"name":"旋片·08","seed":511717,"taps":2,"par":6,"difficulty":2},{"name":"旋片·09","seed":949037,"taps":3,"par":9,"difficulty":2},{"name":"旋片·10","seed":791029,"taps":3,"par":9,"difficulty":2},{"name":"旋片·11","seed":996432,"taps":3,"par":9,"difficulty":2},{"name":"旋片·12","seed":53703,"taps":5,"par":15,"difficulty":2},{"name":"旋片·13","seed":716008,"taps":5,"par":11,"difficulty":2},{"name":"旋片·14","seed":183941,"taps":4,"par":8,"difficulty":2},{"name":"旋片·15","seed":875858,"taps":4,"par":12,"difficulty":3},{"name":"旋片·16","seed":299065,"taps":5,"par":11,"difficulty":3},{"name":"旋片·17","seed":330909,"taps":3,"par":5,"difficulty":3},{"name":"旋片·18","seed":674262,"taps":3,"par":5,"difficulty":3},{"name":"旋片·19","seed":225050,"taps":3,"par":9,"difficulty":3},{"name":"旋片·20","seed":968934,"taps":4,"par":12,"difficulty":3},{"name":"旋片·21","seed":253271,"taps":5,"par":11,"difficulty":3},{"name":"旋片·22","seed":642981,"taps":5,"par":15,"difficulty":4},{"name":"旋片·23","seed":180510,"taps":5,"par":11,"difficulty":4},{"name":"旋片·24","seed":312397,"taps":6,"par":10,"difficulty":4},{"name":"旋片·25","seed":13859,"taps":5,"par":11,"difficulty":4},{"name":"旋片·26","seed":236716,"taps":5,"par":15,"difficulty":4},{"name":"旋片·27","seed":526294,"taps":6,"par":18,"difficulty":4},{"name":"旋片·28","seed":540416,"taps":7,"par":9,"difficulty":4},{"name":"旋片·29","seed":604956,"taps":7,"par":17,"difficulty":5},{"name":"旋片·30","seed":947512,"taps":6,"par":18,"difficulty":5},{"name":"旋片·31","seed":381385,"taps":6,"par":14,"difficulty":5},{"name":"旋片·32","seed":430623,"taps":7,"par":13,"difficulty":5},{"name":"旋片·33","seed":562029,"taps":6,"par":14,"difficulty":5},{"name":"旋片·34","seed":294510,"taps":7,"par":17,"difficulty":5},{"name":"旋片·35","seed":904055,"taps":7,"par":13,"difficulty":5},{"name":"旋片·36","seed":729875,"taps":6,"par":14,"difficulty":6},{"name":"旋片·37","seed":132520,"taps":7,"par":9,"difficulty":6},{"name":"旋片·38","seed":87376,"taps":8,"par":8,"difficulty":6},{"name":"旋片·39","seed":930378,"taps":8,"par":16,"difficulty":6},{"name":"旋片·40","seed":16056,"taps":9,"par":15,"difficulty":6}];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!verifyLevel(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return verifyLevel(d)})){
      LEVELS=list.map(normalizeLevel);return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
      resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  setOvBtn("取消","x");
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

//__VERIFY__START
/* 旋片复原独立验证器：4^9 状态空间 BFS（反向边：tap³），求每个状态到全零的最少转数 */
var RP_N=3,RP_MAX=262144;   // 4^9（每格转数 0-3，两位一格）
function rpRng(seed){
  var a=seed>>>0;
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function rpTapCells(ci){
  var r=Math.floor(ci/RP_N),c=ci%RP_N,out=[[r,c]];
  if(r>0)out.push([r-1,c]);
  if(r<RP_N-1)out.push([r+1,c]);
  if(c>0)out.push([r,c-1]);
  if(c<RP_N-1)out.push([r,c+1]);
  return out;
}
/* 对状态 s 的 ci 格执行 k 次顺时针联动（k=1 顺 / k=3 逆） */
function rpTapState(s,ci,k){
  var cells=rpTapCells(ci),digs=[],i;
  for(i=0;i<9;i++)digs.push((s>>(2*i))&3);
  for(i=0;i<cells.length;i++){
    var idx=cells[i][0]*RP_N+cells[i][1];
    digs[idx]=(digs[idx]+k)&3;
  }
  var out=0;
  for(i=8;i>=0;i--)out=(out<<2)|digs[i];
  return out;
}
/* 从全零出发沿反向边 BFS → dist[s]=最少转数 */
var RP_DIST=null;
function rpDistTable(){
  if(RP_DIST)return RP_DIST;
  var dist=new Int16Array(RP_MAX).fill(-1);
  dist[0]=0;
  var q=[0],head=0;
  while(head<q.length){
    var s=q[head++];
    for(var ci=0;ci<9;ci++){
      var s2=rpTapState(s,ci,3);   // 反向边：谁的顺转能到 s → s+逆
      if(dist[s2]<0){dist[s2]=dist[s]+1;q.push(s2);}
    }
  }
  RP_DIST=dist;
  return dist;
}
/* 由种子回放打乱（与生成器同一 PRNG）：状态 0 → 连续 taps 次随机顺转 */
function rpScrambleState(seed,taps){
  var rng=rpRng(seed),s=0;
  for(var i=0;i<taps;i++)s=rpTapState(s,Math.floor(rng()*9),1);
  return s;
}
function verifyLevel(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.seed)||d.seed<0||d.seed>=1000000)return false;
  if(!Number.isInteger(d.taps)||d.taps<1||d.taps>12)return false;
  if(!Number.isInteger(d.par)||d.par<1)return false;
  var dist=rpDistTable();
  var s=rpScrambleState(d.seed,d.taps);
  if(dist[s]<1)return false;      // 打乱后已是复原态：非谜题
  return dist[s]===d.par;         // par 必须等于 BFS 实测最少转数
}
function normalizeLevel(d){
  return {name:String(d.name),seed:d.seed,taps:d.taps,par:d.par,
    difficulty:Math.min(9,Math.max(1,Number.isInteger(d.difficulty)?d.difficulty:5))};
}
//__VERIFY__END

/* ---------- 颜色工具（JS 内零颜色字面量，恒白/恒黑除外） ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),
    board1:v("--g-rpic-board1"),board2:v("--g-rpic-board2"),
    tile1:v("--g-rpic-tile1"),tile2:v("--g-rpic-tile2")};
  PAL.tileEdge=colMix(PAL.tile1,BLACK,0.10);
  PAL.groove=colMix(PAL.board1,BLACK,0.10);
}
window.__gOnTheme=function(){palLoad();buildPicture();draw()};
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,state=0,initState=0,history=[],moves=0,done=false,cur=4,hintIdx=-1,hintT=0;
var tween=null,entryT0=0,pulseRAF=null;   // 渲染层动效状态（不改玩法状态机）
var off=document.createElement("canvas"),offctx=off.getContext("2d");
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,ts=0;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* 覆盖层按钮：图标 + 文本节点同插，避免 textContent 抹掉已注入图标 */
function setOvBtn(t,icon){$("ovBtn").innerHTML=window.SW_ICON(icon)+t}
function offCount(){
  var c=0;
  for(var i=0;i<9;i++)if((state>>(2*i))&3)c++;
  return c;
}
/* 种子画作：几何图形跨格分布 + 四角不同色角标（转动可辨） */
function buildPicture(){
  var pw=W;
  off.width=pw;off.height=pw;
  var rng=rpRng(L?L.seed:1);
  var cols=[PAL.primary,PAL.water,PAL.danger,PAL.warning,PAL.text,PAL.muted];
  var bg=offctx.createLinearGradient(0,0,0,pw);
  bg.addColorStop(0,PAL.surface2);bg.addColorStop(1,PAL.surface);
  offctx.fillStyle=bg;offctx.fillRect(0,0,pw,pw);
  // 斜条纹
  offctx.strokeStyle=cols[Math.floor(rng()*cols.length)];
  offctx.lineWidth=pw*0.045;
  offctx.globalAlpha=0.85;
  var n=3+Math.floor(rng()*3),i;
  for(i=0;i<n;i++){
    var x0=pw*rng()*1.4-pw*0.2;
    offctx.beginPath();
    offctx.moveTo(x0,-10);
    offctx.lineTo(x0+pw*0.55,pw+10);
    offctx.stroke();
  }
  offctx.globalAlpha=1;
  // 大圆（径向渐变「面」）
  var cx=pw*(0.25+rng()*0.5),cy=pw*(0.25+rng()*0.5),cr=pw*(0.16+rng()*0.16);
  var cc=cols[Math.floor(rng()*cols.length)];
  var rg=offctx.createRadialGradient(cx-cr*0.35,cy-cr*0.35,cr*0.1,cx,cy,cr);
  rg.addColorStop(0,colMix(cc,WHITE,0.45));rg.addColorStop(1,colShade(cc,-0.18));
  offctx.fillStyle=rg;offctx.beginPath();offctx.arc(cx,cy,cr,0,7);offctx.fill();
  // 旋转矩形（线性渐变「面」）
  offctx.save();
  offctx.translate(pw*rng(),pw*rng());
  offctx.rotate(rng()*6.28);
  var rc=cols[Math.floor(rng()*cols.length)];
  var rg2=offctx.createLinearGradient(-pw*0.22,-pw*0.08,pw*0.22,pw*0.08);
  rg2.addColorStop(0,colMix(rc,WHITE,0.35));rg2.addColorStop(1,colShade(rc,-0.16));
  offctx.fillStyle=rg2;offctx.fillRect(-pw*0.22,-pw*0.08,pw*0.44,pw*0.16);
  offctx.restore();
  // 三角（线性渐变「面」）
  var tc=cols[Math.floor(rng()*cols.length)];
  var tx=pw*rng(),ty=pw*rng(),tr=pw*(0.12+rng()*0.1);
  var rg3=offctx.createLinearGradient(tx,ty-tr,tx,ty+tr*0.8);
  rg3.addColorStop(0,colMix(tc,WHITE,0.35));rg3.addColorStop(1,colShade(tc,-0.16));
  offctx.fillStyle=rg3;offctx.beginPath();
  offctx.moveTo(tx,ty-tr);offctx.lineTo(tx+tr,ty+tr*0.8);offctx.lineTo(tx-tr,ty+tr*0.8);
  offctx.closePath();offctx.fill();
  // 散点（径向渐变）
  for(i=0;i<7;i++){
    var dc=cols[Math.floor(rng()*cols.length)];
    var dx=pw*rng(),dy=pw*rng(),dr=pw*(0.015+rng()*0.03);
    var rg4=offctx.createRadialGradient(dx-dr*0.3,dy-dr*0.3,dr*0.1,dx,dy,dr);
    rg4.addColorStop(0,colMix(dc,WHITE,0.5));rg4.addColorStop(1,colShade(dc,-0.15));
    offctx.fillStyle=rg4;offctx.beginPath();offctx.arc(dx,dy,dr,0,7);offctx.fill();
  }
  // 四角异色角标（渐变面 + 铆点）
  var corners=[[8,8],[pw-26,8],[8,pw-26],[pw-26,pw-26]];
  for(i=0;i<4;i++){
    var kc=cols[i];
    var rg5=offctx.createLinearGradient(corners[i][0],corners[i][1],corners[i][0]+18,corners[i][1]+18);
    rg5.addColorStop(0,colMix(kc,WHITE,0.4));rg5.addColorStop(1,colShade(kc,-0.16));
    offctx.fillStyle=rg5;offctx.fillRect(corners[i][0],corners[i][1],18,18);
    offctx.fillStyle=PAL.surface;offctx.fillRect(corners[i][0]+7,corners[i][1]+7,4,4);
  }
}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);
  ts=W/RP_N;
  cv.style.height=W+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(W*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(L)buildPicture();
}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  var now=performance.now(),i;
  ctx.fillStyle=PAL.bg;
  ctx.fillRect(0,0,W,W);
  // 棋盘「面」+ 落地投影
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.16)";ctx.shadowBlur=12;ctx.shadowOffsetY=4;
  var bgr=ctx.createLinearGradient(0,0,0,W);
  bgr.addColorStop(0,PAL.board1);bgr.addColorStop(1,PAL.board2);
  ctx.fillStyle=bgr;rr(0,0,W,W,12);ctx.fill();
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;rr(0.5,0.5,W-1,W-1,12);ctx.stroke();
  // 显示用旋转角（动效插值或实况）
  var disp=[];
  if(tween){
    var p=Math.min(1,(now-tween.t0)/tween.dur),e=1-Math.pow(1-p,2);
    for(i=0;i<9;i++)disp.push(tween.from[i]+(tween.to[i]-tween.from[i])*e);
  }else{
    for(i=0;i<9;i++)disp.push((state>>(2*i))&3);
  }
  var g=Math.max(2,ts*0.06),rad=Math.min(10,ts*0.16);
  for(i=0;i<9;i++){
    var r=Math.floor(i/RP_N),c=i%RP_N,x=c*ts,y=r*ts;
    var dp=entryT0?Math.max(0,Math.min(1,(now-entryT0-i*30)/180)):1;
    var sc=entryT0?(1-Math.pow(1-dp,3)):1;
    ctx.save();
    ctx.translate(x+ts/2,y+ts/2);ctx.scale(sc,sc);ctx.translate(-ts/2,-ts/2);
    // 碎片落地投影 + 碎片面渐变
    ctx.shadowColor="rgba(0,0,0,0.22)";ctx.shadowBlur=ts*0.10;ctx.shadowOffsetY=ts*0.05;
    var tf=ctx.createLinearGradient(0,g,0,ts-g);
    tf.addColorStop(0,PAL.tile1);tf.addColorStop(1,PAL.tile2);
    ctx.fillStyle=tf;rr(g,g,ts-2*g,ts-2*g,rad);ctx.fill();
    ctx.shadowColor="transparent";
    // 画面切片（裁进圆角碎片）
    ctx.save();
    rr(g,g,ts-2*g,ts-2*g,rad);ctx.clip();
    ctx.translate(ts/2,ts/2);ctx.rotate(disp[i]*Math.PI/2);ctx.translate(-ts/2,-ts/2);
    ctx.drawImage(off,c*ts,r*ts,ts,ts,g,g,ts-2*g,ts-2*g);
    ctx.restore();
    // 顶缘高光 + 描边
    ctx.strokeStyle=colMix(PAL.tile1,WHITE,0.5);ctx.lineWidth=1;
    rr(g+0.5,g+0.5,ts-2*g-1,ts-2*g-1,rad);ctx.stroke();
    ctx.strokeStyle=PAL.tileEdge;ctx.lineWidth=1;
    rr(g+1.5,g+1.5,ts-2*g-3,ts-2*g-3,Math.max(1,rad-1));ctx.stroke();
    ctx.restore();
    // 未正位标记（渐变珠 + 投影）
    if(((state>>(2*i))&3)!==0){
      ctx.save();
      ctx.shadowColor="rgba(0,0,0,0.25)";ctx.shadowBlur=3;ctx.shadowOffsetY=1;
      var dg=ctx.createRadialGradient(x+ts-11,y+7,0.5,x+ts-9,y+9,5);
      dg.addColorStop(0,colMix(PAL.warning,WHITE,0.5));dg.addColorStop(1,PAL.warning);
      ctx.fillStyle=dg;ctx.beginPath();ctx.arc(x+ts-9,y+9,5,0,7);ctx.fill();
      ctx.restore();
    }
    if(cur===i&&!done){
      ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;
      rr(x+2,y+2,ts-4,ts-4,Math.min(10,rad));ctx.stroke();
    }
    if(hintIdx===i){
      // reduced-motion：静态提示环，不脉冲
      var a=window.__gRM?0.7:0.5+0.5*Math.sin((now-hintT)/180);
      ctx.strokeStyle=PAL.warning;ctx.lineWidth=3;
      rr(x+2+a*2,y+2+a*2,ts-4-a*4,ts-4-a*4,Math.min(10,rad));ctx.stroke();
    }
  }
}
/* 状态变化 160ms ease-out（渲染层补间，不改玩法状态） */
function startTween(from,to){
  if(window.__gRM){tween=null;draw();return;}
  tween={t0:performance.now(),dur:160,from:from,to:to};
  requestAnimationFrame(stepTween);
}
function stepTween(now){
  draw();
  if(!tween)return;
  if(now-tween.t0>=tween.dur){tween=null;draw();}
  else requestAnimationFrame(stepTween);
}
/* 入场按格错落 30ms、单块 180ms，总 ≤600ms */
function startEntry(){
  if(window.__gRM){entryT0=0;draw();return;}
  entryT0=performance.now();
  requestAnimationFrame(stepEntry);
}
function stepEntry(now){
  draw();
  if(!entryT0)return;
  if(now-entryT0>=420){entryT0=0;draw();}
  else requestAnimationFrame(stepEntry);
}
/* 提示环短脉冲：1.2s 内 rAF 重绘，提示清除即停；reduced-motion 不启动 */
function startHintPulse(){
  if(window.__gRM){draw();return;}
  if(pulseRAF){cancelAnimationFrame(pulseRAF);pulseRAF=null;}
  var t0=performance.now();
  var step=function(now){
    pulseRAF=null;
    draw();
    if(hintIdx<0||now-t0>=1200)return;
    pulseRAF=requestAnimationFrame(step);
  };
  pulseRAF=requestAnimationFrame(step);
}
function stopHintPulse(){if(pulseRAF){cancelAnimationFrame(pulseRAF);pulseRAF=null}}
function updStats(){
  $("stMoves").textContent=moves;
  var off=offCount();
  $("stOff").textContent=off;
  $("stOff").className="val"+(off?" low":"");
  $("btnUndo").disabled=!history.length||done;
}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!verifyLevel(L)){say("关卡数据异常");return;}
  initState=rpScrambleState(L.seed,L.taps);
  state=initState;
  history=[];moves=0;done=false;hintIdx=-1;cur=4;stopHintPulse();
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent="3×3 联动旋转 · 参考 "+L.par+" 步（打乱 "+L.taps+" 次）";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  say("点碎片会带动上下左右一起转 90°，让全部碎片回到正位");
  tween=null;entryT0=0;
  resize();updStats();startEntry();
}
function tapAt(i){
  if(done||tween)return;
  var prev=state;
  history.push(prev);
  state=rpTapState(state,i,1);
  moves++;hintIdx=-1;stopHintPulse();
  startTween(prev,state);
  updStats();draw();
  if(state===0)winLevel();
}
function undo(){
  if(!history.length||done)return;
  tween=null;entryT0=0;
  state=history.pop();
  moves=Math.max(0,moves-1);hintIdx=-1;stopHintPulse();
  updStats();draw();say("已撤销");
}
function hint(){
  if(done)return;
  var dist=rpDistTable();
  if(dist[state]<0){hintIdx=-1;stopHintPulse();draw();say("当前局面异常，请重开本关");return;}
  if(dist[state]===0){hintIdx=-1;stopHintPulse();draw();say("已经全部正位了");return;}
  for(var i=0;i<9;i++){
    var s2=rpTapState(state,i,1);
    if(dist[s2]===dist[state]-1){
      hintIdx=i;hintT=performance.now();
      say("转动高亮碎片可更接近复原（还差 "+dist[state]+" 步）");
      startHintPulse();
      return;
    }
  }
  hintIdx=-1;stopHintPulse();draw();say("先撤销几步再重新转动");
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  var stars=moves<=L.par?3:(moves<=L.par+2?2:1);
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:stars}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"复原成功！";
  $("ovDesc").innerHTML="用 "+moves+" 步对齐（参考 "+L.par+" 步）· "+stars+" 星"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  setOvBtn((lv>=LEVELS.length-1)?"回到第 1 关":"下一关",(lv>=LEVELS.length-1)?"rotate":"arrow-right");
  $("overlay").classList.add("show");
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  if(done)return;
  var c=Math.floor(x/ts),r=Math.floor(y/ts);
  if(c<0||c>=RP_N||r<0||r>=RP_N)return;
  cur=r*RP_N+c;
  tapAt(cur);
});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){tween=null;entryT0=0;state=initState;history=[];moves=0;done=false;hintIdx=-1;stopHintPulse();updStats();draw();say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(done)return;openLevelSelect()});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if($("overlay").classList.contains("show")){
    if(k===" "||k==="Enter"){$("ovBtn").click();e.preventDefault();}
    return;
  }
  if(k==="ArrowUp"&&cur>=RP_N){cur-=RP_N;draw();e.preventDefault();}
  else if(k==="ArrowDown"&&cur<9-RP_N){cur+=RP_N;draw();e.preventDefault();}
  else if(k==="ArrowLeft"&&cur%RP_N>0){cur--;draw();e.preventDefault();}
  else if(k==="ArrowRight"&&cur%RP_N<RP_N-1){cur++;draw();e.preventDefault();}
  else if(k===" "||k==="Enter"){tapAt(cur);e.preventDefault();}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){tween=null;entryT0=0;state=initState;history=[];moves=0;done=false;hintIdx=-1;stopHintPulse();updStats();draw();say("本关已重置")}
});
window.addEventListener("resize",function(){resize();draw()});
/* ---------- 启动：BFS 表 + 逐关复核，par 不符的关不入表 ---------- */
rpDistTable();
(function(){
  var ok=[];
  for(var i=0;i<LEVELS.length;i++){
    var pass=false;
    try{pass=verifyLevel(LEVELS[i])}catch(e){pass=false}
    if(pass)ok.push(LEVELS[i]);
  }
  if(ok.length)LEVELS=ok;
})();
palLoad();loadLevel(save.lv);
setOvBtn("下一关","arrow-right");
syncLevelsFromServer();syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
/* 按钮图标注入（内联 SVG，零外链）；只前插图标，不改写按钮文本节点 */
(function(){
  function $(id){return document.getElementById(id)}
  var map=[["btnUndo","undo"],["btnHint","bulb"],["btnReset","rotate"],["btnLv","grid"]],i;
  for(i=0;i<map.length;i++){var b=$(map[i][0]);if(b)b.insertAdjacentHTML("afterbegin",window.SW_ICON(map[i][1]));}
})();
</script>
