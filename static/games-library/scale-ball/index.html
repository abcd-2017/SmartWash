      var cbId="gb"+Date.now()+"_"+(++seq);

      catch(e){delete pending[cbId];reject(e);}
    });
  }

    available:!!window.SmartWashGameBridge,

function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list.map(normalizeLevel);return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();

}

/* 单条结构校验 */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.n)||d.n<3||d.n>13)return false;
  if(!Number.isInteger(d.k)||d.k<1||d.k>5)return false;
  if(d.known!==0&&d.known!==1)return false;
  if(d.minK!==undefined&&(!Number.isInteger(d.minK)||d.minK<1||d.minK>d.k))return false;
  return true;
}
function normalizeLevel(d){
  var minK=Number.isInteger(d.minK)&&d.minK>0?d.minK:ballMinK(d.n,d.known?1:0);
  var diff=Number.isInteger(d.difficulty)?Math.min(9,Math.max(1,d.difficulty)):5;
  return {name:String(d.name),n:d.n,k:d.k,known:d.known?1:0,minK:minK,difficulty:diff};
}
/* ---------- 独立求解器：假设类计数对策搜索（用于加载复核与提示） ----------
   状态=(nHB 只可能重、nLB 只可能轻、nB 重轻都可能、nG 已知正常球数)+剩余次数。
   同类球对称 → 按计数抽象与逐球枚举精确等价。返回可行称重方案（供提示）。 */
function ballMinK(n,known){
  for(var k=1;k<=5;k++){
    if(ballSolve(known?n:0,0,known?0:n,0,k,new Map()).ok)return k;
  }
  return 0;
}
function ballSolve(nHB,nLB,nB,nG,k,memo){
  if(nHB+nLB+nB===1||nHB+nLB+nB===0)return {ok:true,choice:null};
  if(k===0)return {ok:false,choice:null};
  var key=nHB+","+nLB+","+nB+","+nG+","+k;
  if(memo.has(key))return memo.get(key);
  var ok=false,choice=null;
  outer:
  for(var lHB=0;lHB<=nHB;lHB++){
    for(var lLB=0;lLB<=nLB;lLB++){
      for(var lB=0;lB<=nB;lB++){
        var lSum=lHB+lLB+lB;
        if(lSum===0)continue;
        for(var rHB=0;rHB<=nHB-lHB;rHB++){
          for(var rLB=0;rLB<=nLB-lLB;rLB++){
            for(var rB=0;rB<=nB-lB;rB++){
              var rSum=rHB+rLB+rB;
              if(rSum===0||rSum<lSum)continue;   // 归一化：右盘候选≥左盘，差额用正常球垫左盘
              var pads=rSum-lSum;
              if(pads>nG)continue;
              var g2=nG-pads,total=nHB+nLB+nB;
              var lh=ballSolve(lHB+lB,rLB+rB,0,g2+(total-lSum-rSum),k-1,memo);
              if(!lh.ok)continue;
              var rl=ballSolve(rHB+rB,lLB+lB,0,g2+(total-lSum-rSum),k-1,memo);
              if(!rl.ok)continue;
              var eq=ballSolve(nHB-lHB-rHB,nLB-lLB-rLB,nB-lB-rB,g2+lSum+rSum,k-1,memo);
              if(!eq.ok)continue;
              ok=true;choice={l:[lHB,lLB,lB],r:[rHB,rLB,rB]};
              break outer;
            }
          }
        }
      }
    }
  }
  var res={ok:ok,choice:choice};
  memo.set(key,res);
  return res;
}

/* ---------- 状态 ---------- */
var lv=save.lv,L=null,n=0,K=0,known=1,oddIdx=0,oddHeavy=true;
/* 每球状态：0=未知(重轻都可能) 1=只可能重 2=只可能轻 3=已确认正常 */
var ballCls=[],usedW=0,history=[],assign=[],guessMode=false,done=false,failed=false;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* 覆盖层按钮：图标 + 文本一起重建，避免更新文案时抹掉已注入的 SVG 图标 */
function setOvBtn(t,icon){$("ovBtn").innerHTML=window.SW_ICON(icon)+t}
function loadLevel(nLevel){
  lv=Math.max(0,Math.min(nLevel,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  n=L.n;K=L.k;known=L.known;
  ballCls=[];for(var i=0;i<n;i++)ballCls.push(0);
  usedW=0;history=[];assign=[];guessMode=false;done=false;failed=false;
  oddIdx=Math.floor(Math.random()*n);
  oddHeavy=known===1?true:Math.random()<0.5;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=n+" 枚球 · "+(known?"已知异常球偏重":"轻重未知")+" · 限称 "+K+" 次";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stUsed").textContent="0/"+K;
  say("点球分配到左右盘（再点取消），然后称重");
  render();updStats();
}
function candCount(){
  var c=0;for(var i=0;i<n;i++)if(ballCls[i]!==3)c++;
  return c;
}
function goodCount(){
  var c=0;for(var i=0;i<n;i++)if(ballCls[i]===3)c++;
  return c;
}
function popVal(el,v){var s=String(v);if(el.textContent===s)return;el.textContent=s;el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");}
function updStats(){
  popVal($("stUsed"),usedW+"/"+K);
  popVal($("stCand"),candCount());
  $("btnUndo").disabled=!history.length||done;
  $("btnGo").disabled=done;
  $("btnGuess").disabled=done;
}
/* ---------- 渲染 ---------- */
function render(){
  var box=$("balls");box.innerHTML="";
  for(var i=0;i<n;i++){
    (function(i){
      var b=document.createElement("button");
      b.type="button";
      var cls="ball";
      if(assign[i]===1)cls+=" selL";
      if(assign[i]===2)cls+=" selR";
      if(ballCls[i]===3)cls+=" good";
      if(guessMode&&ballCls[i]!==3)cls+=" guessing";
      b.className=cls;
      b.textContent=i+1;
      b.setAttribute("aria-label","球 "+(i+1));
      b.addEventListener("click",function(){tapBall(i)});
      box.appendChild(b);
    })(i);
  }
  var pl=$("panL"),pr=$("panR");
  pl.querySelectorAll(".pchip").forEach(function(e){e.remove()});
  pr.querySelectorAll(".pchip").forEach(function(e){e.remove()});
  for(var j=0;j<n;j++){
    if(assign[j]!==1&&assign[j]!==2)continue;
    var c=document.createElement("span");
    c.className="pchip";
    c.style.cssText="font-size:12px;font-weight:700;color:var(--g-text);background:linear-gradient(180deg,var(--g-surface),var(--g-surface2));border-radius:10px;padding:1px 6px;box-shadow:inset 0 0 0 1px var(--g-border),var(--g-shadow);";
    c.textContent=j+1;
    (assign[j]===1?pl:pr).appendChild(c);
  }
  var hl=$("hlist");
  hl.innerHTML=history.map(function(h,ix){
    return "<div>第"+(ix+1)+"次　"+h.desc+" → <b>"+h.res+"</b></div>";
  }).join("")||"<div>尚无称重记录</div>";
}
function tapBall(i){
  if(done)return;
  if(guessMode){makeGuess(i);return;}
  if(ballCls[i]===3){say((i+1)+" 号已确认是正常球");return;}
  var cur=assign[i]||0;
  assign[i]=(cur+1)%3;
  if(assign[i]===0)delete assign[i];
  render();updStats();
}
/* ---------- 称重 ---------- */
function weigh(){
  if(done)return;
  var Lb=[],Rb=[];
  for(var i=0;i<n;i++){
    if(assign[i]===1)Lb.push(i);
    if(assign[i]===2)Rb.push(i);
  }
  if(!Lb.length&&!Rb.length){say("先把球分到左右盘（点球循环：左盘→右盘→取消）");return;}
  if(!Lb.length||!Rb.length){say("两盘都要放球");return;}
  var padL=Math.max(0,Rb.length-Lb.length),padR=Math.max(0,Lb.length-Rb.length);
  if(padL+padR>goodCount()){say("两盘球数要一样多（或用已确认的正常球垫平）");return;}
  var clsSnap=ballCls.slice();
  // 真值判定：正常球记 1，异常球重记 2 / 轻记 0
  var lw=Lb.length+padL,rw=Rb.length+padR;
  if(Lb.indexOf(oddIdx)>=0)lw+=oddHeavy?1:-1;
  if(Rb.indexOf(oddIdx)>=0)rw+=oddHeavy?1:-1;
  var res=lw>rw?"左沉":(lw<rw?"右沉":"平衡");
  var desc=Lb.join(",")+" vs "+Rb.join(",")+(padL?("（左垫 "+padL+" 正常球）"):"")+(padR?("（右垫 "+padR+" 正常球）"):"");
  history.push({res:res,desc:desc,cls:clsSnap});
  usedW++;
  // 按结果收敛每球状态（与求解器的类计数转移一致）
  var onScale={};
  for(var a=0;a<Lb.length;a++)onScale[Lb[a]]=1;
  for(var b2=0;b2<Rb.length;b2++)onScale[Rb[b2]]=1;
  if(res==="平衡"){
    for(var q=0;q<Lb.length;q++)ballCls[Lb[q]]=3;
    for(var r=0;r<Rb.length;r++)ballCls[Rb[r]]=3;
  }else{
    var side=(res==="左沉")?Lb:Rb,other=(res==="左沉")?Rb:Lb;
    for(var s=0;s<n;s++)if(!onScale[s])ballCls[s]=3;
    for(var u=0;u<side.length;u++){
      if(ballCls[side[u]]===0)ballCls[side[u]]=1;
      else if(ballCls[side[u]]===2)ballCls[side[u]]=3;
    }
    for(var v2=0;v2<other.length;v2++){
      // 已知异常方向（known=1）时，翘起侧只可能是正常球；未知方向时才可能是「偏轻」候选
      if(ballCls[other[v2]]===0)ballCls[other[v2]]=known?3:2;
      else if(ballCls[other[v2]]===1)ballCls[other[v2]]=3;
    }
  }
  assign=[];
  $("scale").classList.remove("tiltL","tiltR");
  if(res==="左沉")$("scale").classList.add("tiltL");
  if(res==="右沉")$("scale").classList.add("tiltR");
  setTimeout(function(){$("scale").classList.remove("tiltL","tiltR")},900);
  render();updStats();
  if(candCount()===1){say("异常球已锁定！点「指认」再点它");return;}
  if(usedW>=K)say("称重次数已用完（"+usedW+"/"+K+"）· 剩 "+candCount()+" 个候选，只能指认碰运气");
  else say("第 "+usedW+" 次称重："+res+" · 剩 "+candCount()+" 个候选");
}
function undo(){
  if(!history.length||done)return;
  var h=history.pop();
  usedW--;
  ballCls=h.cls.slice();assign=[];
  guessMode=false;
  render();updStats();say("已撤销一次称重");
}
/* ---------- 指认 ---------- */
function toggleGuess(){
  if(done)return;
  guessMode=!guessMode;
  say(guessMode?"指认模式：点一个球确认（候选不唯一会认错）":"已退出指认模式");
  render();
}
function makeGuess(i){
  guessMode=false;
  if(i===oddIdx){winLevel();return;}
  failed=true;
  $("ovTitle").textContent="认错了！";
  $("ovDesc").textContent=(i+1)+" 号是正常球。异常球是 "+(oddIdx+1)+" 号（"+(oddHeavy?"偏重":"偏轻")+"）。";
  setOvBtn("重试本关","rotate");
  $("overlay").classList.add("show");
  render();
}
/* ---------- 提示 ---------- */
function hint(){
  if(done||failed)return;
  if(candCount()===1){say("候选唯一了：点「指认」再点对应球");return;}
  if(usedW>=K){say("称重次数已用完，只能指认碰运气");return;}
  var cnt={0:0,1:0,2:0};
  for(var i=0;i<n;i++)cnt[ballCls[i]]++;
  var good=[];
  for(var j=0;j<n;j++)if(ballCls[j]===3)good.push(j);
  // 已知异常方向时，未知球（cnt[0]）按「只可能重」计入 nHB；未知方向时才是重轻都可能（nB）
  var r=ballSolve(known?cnt[1]+cnt[0]:cnt[1],cnt[2],known?0:cnt[0],good.length,K-usedW,new Map());
  if(!r.ok||!r.choice){say("当前局面没有稳妥策略了，建议撤销一步");return;}
  assign=[];
  var pick=[];
  function take(c2,cls){
    var arr=[];
    for(var t=0;t<n&&arr.length<c2;t++)if(ballCls[t]===cls&&pick.indexOf(t)<0){arr.push(t);pick.push(t);}
    return arr;
  }
  var lAll=take(r.choice.l[0],1).concat(take(r.choice.l[1],2)).concat(take(r.choice.l[2],0));
  var rAll=take(r.choice.r[0],1).concat(take(r.choice.r[1],2)).concat(take(r.choice.r[2],0));
  var pad=rAll.length-lAll.length;   // 右盘候选更多 → 垫左盘（与求解器约定一致）
  for(var p2=0;p2<pad&&p2<good.length;p2++)lAll.push(good[p2]);
  for(var a2=0;a2<lAll.length;a2++)assign[lAll[a2]]=1;
  for(var b3=0;b3<rAll.length;b3++)assign[rAll[b3]]=2;
  render();
  say("建议这样摆盘，直接点「称重」（还剩 "+(K-usedW)+" 次机会）");
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:usedW}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"找对了！";
  $("ovDesc").innerHTML="异常球是 "+(oddIdx+1)+" 号（"+(oddHeavy?"偏重":"偏轻")+"），用 "+usedW+" 次称重（最少 "+L.minK+" 次）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>44 关全部完成");
  setOvBtn((lv>=LEVELS.length-1)?"回到第 1 关":"下一关",(lv>=LEVELS.length-1)?"rotate":"play");
  $("overlay").classList.add("show");
}
/* ---------- 输入 ---------- */
$("btnGo").addEventListener("click",weigh);
$("btnGuess").addEventListener("click",toggleGuess);
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){if(done)return;openLevelSelect()});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(failed){loadLevel(lv);return;}
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="9"){var i=parseInt(k,10)-1;if(i<n)tapBall(i);e.preventDefault();}
  else if(k==="0"){if(n>=10)tapBall(9);e.preventDefault();}
  else if(k===" "||k==="Enter"){if($("overlay").classList.contains("show"))$("ovBtn").click();else weigh();e.preventDefault();}
  else if(k==="g"||k==="G")toggleGuess();
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);
/* 工具钮 / 主 CTA / 覆盖层按钮：文字前内联 SVG 图标（24 viewBox / currentColor） */
$("btnGo").insertAdjacentHTML("afterbegin",window.SW_ICON("scale"));
$("btnGuess").insertAdjacentHTML("afterbegin",window.SW_ICON("target"));
$("btnUndo").insertAdjacentHTML("afterbegin",window.SW_ICON("undo"));
$("btnHint").insertAdjacentHTML("afterbegin",window.SW_ICON("bulb"));
$("btnReset").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
$("btnLv").insertAdjacentHTML("afterbegin",window.SW_ICON("grid"));
setOvBtn("下一关","play");
syncLevelsFromServer();syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
