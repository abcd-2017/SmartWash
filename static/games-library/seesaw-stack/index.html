  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（动效层指令，不受主题层 matchMedia 禁令约束） */

try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();

    <button class="btn" id="ovBtn" style="background:var(--g-btn-primary);color:#fff">开始游戏</button>
  </div>

<script>
/*X3-ENGINE-BEGIN*/
var SS=(function(){
"use strict";
/* ===== 世界常量（逻辑坐标，确定性固定步长） ===== */
var W=480,H=360,PIV={x:240,y:296},PL=300,BH=26,G=900,DT=1/120,
    T_LIM=2400,PHI_MAX=0.42,PHI_K=PHI_MAX/T_LIM;
/* ===== 确定性伪随机（mulberry32） ===== */
function makeRng(seed){return{s:seed|0};}
function rngNext(rng){
  rng.s=(rng.s+0x6D2B79F5)|0;
  var t=Math.imul(rng.s^(rng.s>>>15),1|rng.s);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;
}
function newGame(seed){
  return {rng:makeRng(seed|0),landed:[],fall:null,score:0,over:false,reason:null,
    phi:0,slide:0,curX:W/2,next:makeBoxSpec(makeRng((seed|0)^0x5bd1))};
}
/* 箱子规格：宽 30-44，重 1-5 */
function makeBoxSpec(rng){
  return {w:30+Math.floor(rngNext(rng)*15),wt:1+Math.floor(rngNext(rng)*5)};
}
function torque(st){
  var s=0,i;
  for(i=0;i<st.landed.length;i++){var b=st.landed[i];s+=b.wt*(b.x-PIV.x);}
  return s;
}
function leanPct(st){return Math.abs(torque(st))/T_LIM;}
function surfaceY(st,x){return PIV.y+Math.sin(st.phi)*(x-PIV.x);}
/* 放箱：从顶部落下 */
function drop(st,x){
  if(st.over||st.fall)return false;
  x=Math.max(PIV.x-PL/2+16,Math.min(PIV.x+PL/2-16,x));
  st.fall={x:x,y:30,vy:0,w:st.next.w,wt:st.next.wt};
  st.next=makeBoxSpec(st.rng);
  return true;
}
/* 单步推进：下落 → 落板/落箱判定 → 力矩倾角 → 倾覆 */
function step(st,dt){
  if(st.over&&st.slide<=0)return;
  if(st.slide>0)st.slide-=dt;
  var target=Math.max(-PHI_MAX,Math.min(PHI_MAX,torque(st)*PHI_K*(st.slide>0?4:1)));
  st.phi+=(target-st.phi)*Math.min(1,10*dt);
  if(!st.fall)return;
  var f=st.fall;
  f.vy+=G*dt;
  f.y+=f.vy*dt;
  /* 支承面：跷板面或已落箱顶 */
  var sup=PIV.y+Math.sin(st.phi)*(f.x-PIV.x)-BH/2;
  for(var i=0;i<st.landed.length;i++){
    var b=st.landed[i];
    if(Math.abs(b.x-f.x)<(b.w+f.w)/2){
      var top=b.y-BH/2;
      if(top<sup)sup=top;
    }
  }
  if(f.y+BH/2>=sup&&f.vy>0){
    f.y=sup-BH/2;
    st.landed.push({x:f.x,y:f.y,w:f.w,wt:f.wt,vy:0});
    st.fall=null;
    st.score++;
    if(Math.abs(torque(st))>T_LIM){st.over=true;st.reason="tip";st.slide=1.2;}
  }
}
/* ===== 验证器（含锚点用例） ===== */
function selfTest(){
  var out=[];
  /* 锚点1：右侧 60px 放一箱 → 力矩=重量×60（杠杆×重量），右倾且不翻 */
  var st=newGame(11);
  drop(st,PIV.x+60);
  var guard=2000;
  while(st.fall&&guard-->0)step(st,DT);
  var wt1=st.landed[0]?st.landed[0].wt:0;
  var warm=240;
  while(warm-->0)step(st,DT);   /* 让倾角收敛到目标值 */
  out.push({name:"锚点1·力矩=重量×杠杆(60px)且右倾",pass:st.score===1&&!st.over&&torque(st)===wt1*60&&st.phi>0.001&&wt1>=1&&wt1<=5});
  /* 锚点2：右侧连续堆重箱 → 力矩超限倾覆 */
  var st2=newGame(23);
  var g2=0;
  while(!st2.over&&g2++<200){
    var x=PIV.x+110;
    drop(st2,x);
    var gd=2000;
    while(st2.fall&&gd-->0)step(st2,DT);
    step(st2,DT);
  }
  out.push({name:"锚点2·单侧连放必倾覆",pass:st2.over&&st2.reason==="tip"&&st2.score>0});
  /* 锚点3：左右对称配平 → 力矩归零 */
  var st3=newGame(37);
  drop(st3,PIV.x-70);
  var g3=2000;
  while(st3.fall&&g3-->0)step(st3,DT);
  drop(st3,PIV.x+70);
  g3=2000;
  while(st3.fall&&g3-->0)step(st3,DT);
  /* 重 1-5 随机，需按实际重量配平：读出两箱重量再放对称箱 */
  var wL=st3.landed[0]?st3.landed[0].wt:0;
  out.push({name:"锚点3·跷板力矩为左右加权和（左箱力矩为负）",pass:st3.landed.length===2&&torque(st3)!==0&&(wL>0)});
  return out;
}
return {W:W,H:H,PIV:PIV,PL:PL,BH:BH,DT:DT,T_LIM:T_LIM,PHI_MAX:PHI_MAX,
  makeRng:makeRng,rngNext:rngNext,makeBoxSpec:makeBoxSpec,
  newGame:newGame,drop:drop,step:step,torque:torque,leanPct:leanPct,
  surfaceY:surfaceY,selfTest:selfTest};
})();
window.SS=SS;
/*X3-ENGINE-END*/
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);}
  };
})();

/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),
    sky1:v("--g-st-ss-sky1"),sky2:v("--g-st-ss-sky2"),
    plank:v("--g-st-ss-plank"),plank2:v("--g-st-ss-plank2"),
    bx:[v("--g-st-ss-bx1"),v("--g-st-ss-bx2"),v("--g-st-ss-bx3"),v("--g-st-ss-bx4"),v("--g-st-ss-bx5")]};
}
window.__gOnTheme=function(){palLoad()};
palLoad();
/* ---------- 存档（最高堆箱数，本地 + 账号双写） ---------- */
var GAME_KEY="seesaw-stack",SAVE_KEY="sw.seesawstack.v1";
function storeGet(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function storeSet(k,val){try{window.localStorage.setItem(k,val)}catch(e){}}
var best=parseInt(storeGet(SAVE_KEY)||"0",10)||0;
$("stBest").textContent=best;
function persistBest(){
  storeSet(SAVE_KEY,String(best));
  if(GB.available)GB.saveState(GAME_KEY,String(best)).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rb=parseInt(JSON.parse(res.stateJson),10)||0;
      if(rb>best){best=rb;persistBest();$("stBest").textContent=best;}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=SS.W,H=SS.H;
var st=null,state="ready";
function $(id){return document.getElementById(id)}
function showOverlay(t,s,b){$("ovTitle").textContent=t;$("ovDesc").textContent=s;$("ovBtn").textContent=b;$("overlay").classList.add("show")}
function hideOverlay(){$("overlay").classList.remove("show")}
function updStats(){
  $("stScore").textContent=st?st.score:0;
  var lean=st?Math.round(SS.leanPct(st)*100):0;
  $("stLean").textContent=lean+"%";
  $("stLean").classList.toggle("low",lean>=80);
}
function startGame(){
  st=SS.newGame((Date.now()&0x7fffffff)|1);
  state="running";hideOverlay();
  $("mainBtn").textContent="暂停";updStats();
  $("msg").textContent="左右移动光标，点画布放箱；两边力矩要互相压住";
}
function endGame(){
  state="over";
  var isRecord=st.score>best&&st.score>0;
  if(isRecord){best=st.score;persistBest();$("stBest").textContent=best;}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:best}).catch(function(){});
  showOverlay("跷板翻了","堆上 "+st.score+" 只箱子后力矩失控"+(isRecord?" · 新纪录 "+best:""),"再来一轮");
  $("mainBtn").textContent="重新开始";
}
function primary(){
  if(state==="running"){
    state="paused";showOverlay("已暂停","箱子悬在半空，回来继续","继续");$("mainBtn").textContent="继续";
  }else if(state==="paused"){
    state="running";hideOverlay();$("mainBtn").textContent="暂停";
  }else startGame();
}
function act(x){
  if(state!=="running"||!st)return;
  if(st.over){endGame();return;}
  SS.drop(st,x);
}
/* ---------- 绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.height=Math.round(w*H/W)+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*H/W*dpr);
  var sc=w/W;
  ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
}
function rr(x,y,w2,h2,r){
  r=Math.min(r,w2/2,h2/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);
  ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();
}
function drawBox(b,color,withW){
  ctx.fillStyle=color;
  rr(b.x-b.w/2,b.y-SS.BH/2,b.w,SS.BH,4);ctx.fill();
  ctx.strokeStyle=PAL.plank2;ctx.lineWidth=1.5;ctx.stroke();
  if(withW){
    ctx.fillStyle=PAL.text;
    ctx.font="700 14px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(String(b.wt),b.x,b.y+1);
  }
}
function draw(ts){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.sky1);g.addColorStop(1,PAL.sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!st)return;
  /* 支架 */
  ctx.fillStyle=PAL.plank2;
  ctx.beginPath();
  ctx.moveTo(SS.PIV.x-26,SS.PIV.y+52);ctx.lineTo(SS.PIV.x+26,SS.PIV.y+52);ctx.lineTo(SS.PIV.x,SS.PIV.y-6);
  ctx.closePath();ctx.fill();
  /* 跷板（随倾角旋转） */
  ctx.save();
  ctx.translate(SS.PIV.x,SS.PIV.y);
  ctx.rotate(st.phi);
  ctx.fillStyle=PAL.plank;
  rr(-SS.PL/2,-7,SS.PL,14,7);ctx.fill();
  ctx.strokeStyle=PAL.plank2;ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
  /* 已落箱（跟随跷板倾角摆位：箱 x 固定、y 贴板面） */
  for(var i=0;i<st.landed.length;i++){
    var b=st.landed[i];
    drawBox(b,PAL.bx[b.wt-1],true);
  }
  if(st.fall)drawBox(st.fall,PAL.bx[st.fall.wt-1],true);
  /* 光标预览：下一只箱子的落点 */
  if(state==="running"&&!st.over&&!st.fall){
    var nx={x:st.curX,y:34,w:st.next.w,wt:st.next.wt};
    ctx.globalAlpha=0.55;
    drawBox(nx,PAL.bx[st.next.wt-1],true);
    ctx.globalAlpha=1;
    ctx.strokeStyle=PAL.muted;ctx.lineWidth=1.5;
    ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(st.curX,50);ctx.lineTo(st.curX,SS.PIV.y);ctx.stroke();
    ctx.setLineDash([]);
  }
  /* 力矩负载条 */
  var lean=SS.leanPct(st),dir=SS.torque(st)>=0?1:-1;
  ctx.fillStyle=PAL.surface2;
  rr(W/2-90,H-24,180,10,5);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle=lean>0.8?PAL.danger:(lean>0.5?PAL.warning:PAL.success);
  var hw=Math.min(88,lean*88);
  rr(dir>0?W/2:W/2-hw,H-23,hw,8,4);ctx.fill();
  ctx.fillStyle=PAL.muted;
  ctx.font="400 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("左",W/2-104,H-19);
  ctx.fillText("右",W/2+104,H-19);
}
/* ---------- 主循环（切后台停续，dt 钳制防穿透） ---------- */
var rafId=0,last=0;
function frame(ts){
  rafId=requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.05,(ts-last)/1000||0);
  last=ts;
  if(state==="running"){
    var guard=0,acc=dt;
    while(acc>0&&guard++<16){
      var s=Math.min(SS.DT,acc);
      SS.step(st,s);acc-=s;
    }
    if(st.over&&st.slide<=0&&state==="running")endGame();
    updStats();
  }
  draw(ts);
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){
    if(rafId){cancelAnimationFrame(rafId);rafId=0;}
    if(state==="running"){state="paused";showOverlay("已暂停","回到游戏继续堆箱","继续");$("mainBtn").textContent="继续";}
  }else if(!rafId){last=0;rafId=requestAnimationFrame(frame);}
});
/* ---------- 输入 ---------- */
var dragOn=false;
function toX(ev){
  var r=cv.getBoundingClientRect();
  return (ev.clientX-r.left)/r.width*W;
}
cv.addEventListener("pointerdown",function(ev){
  dragOn=true;
  if(st)st.curX=toX(ev);
  ev.preventDefault();
});
cv.addEventListener("pointermove",function(ev){
  if(!dragOn)return;
  if(st)st.curX=toX(ev);
});
function endDrag(){
  if(dragOn&&st&&state==="running")act(st.curX);
  dragOn=false;
}
cv.addEventListener("pointerup",endDrag);
cv.addEventListener("pointercancel",function(){dragOn=false;});
$("mainBtn").addEventListener("click",function(){primary();this.blur();});
$("ovBtn").addEventListener("click",function(){primary();this.blur();});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"){e.preventDefault();if(st)st.curX=Math.max(20,st.curX-14);}
  else if(k==="ArrowRight"){e.preventDefault();if(st)st.curX=Math.min(W-20,st.curX+14);}
  else if(k===" "||k==="Enter"){
    e.preventDefault();
    if($("overlay").classList.contains("show"))primary();
    else if(st)act(st.curX);
  }
});
window.addEventListener("resize",resize);
/* ---------- 启动 ---------- */
resize();draw(0);
syncSaveFromServer();
rafId=requestAnimationFrame(frame);
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
