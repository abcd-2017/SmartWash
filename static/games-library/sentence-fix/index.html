function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* ---------- 关卡生成器：固定种子洗题池，40 关 × 3 题 ---------- */
function genLevels(){
  var pool=[];
  for(var i=0;i<CASES.length;i++)pool.push(i);
  var r0=mulberry32(919191);
  for(var s=pool.length-1;s>0;s--){var j=Math.floor(r0()*(s+1)),t=pool[s];pool[s]=pool[j];pool[j]=t;}
  var fixes=[];
  for(var k=0;k<CASES.length;k++)fixes.push(CASES[k][1]);
  var list=[];
  for(var li=0;li<40;li++){
    var qs=[];
    for(var q=0;q<3;q++){
      var it=CASES[pool[(li*3+q)%pool.length]];
      var opts=[it[1],it[3],it[4]];
      var r2=mulberry32(12000+li*13+q*3);
      var guard=0;
      while(opts.length<(li<20?3:4)&&guard++<100){
        var f=fixes[Math.floor(r2()*fixes.length)];
        if(f!==it[1]&&opts.indexOf(f)<0)opts.push(f);
      }
      for(var m=opts.length-1;m>0;m--){var mj=Math.floor(r2()*(m+1)),tm=opts[m];opts[m]=opts[mj];opts[mj]=tm;}
      qs.push({s:it[0],fix:it[1],cause:it[2],opts:opts,ok:opts.indexOf(it[1])});
    }
    list.push({name:"门诊·"+(li+1<10?"0":"")+(li+1),qs:qs,difficulty:Math.min(6,Math.floor(li/7)+1)});
  }
  return list;
}
var DEFAULT_LEVELS=genLevels();
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
/* ---------- 独立验证器：结构完整性 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Array.isArray(d.qs)||d.qs.length<1||d.qs.length>6)return false;
  for(var i=0;i<d.qs.length;i++){
    var q=d.qs[i];
    if(!q||typeof q!=="object")return false;
    if(typeof q.s!=="string"||!q.s||q.s.length>60)return false;
    if(typeof q.cause!=="string"||!q.cause||q.cause.length>8)return false;
    if(!Array.isArray(q.opts)||q.opts.length<3||q.opts.length>5)return false;
    if(!Number.isInteger(q.ok)||q.ok<0||q.ok>=q.opts.length)return false;
    var seen={};
    for(var k=0;k<q.opts.length;k++){
      var o=q.opts[k];
      if(typeof o!=="string"||!o||o.length>60)return false;
      if(o===q.s)return false;             /* 改正句不得与病句相同 */
      if(seen[o])return false;
      seen[o]=1;
    }
  }
  return true;
}
/* 内嵌关复核：病句+正确改法+病因必须命中病句库 */
function auditAll(){
  var bad=[];
  for(var i=0;i<LEVELS.length;i++){
    var L=LEVELS[i],okLv=validLevelData(L);
    if(okLv)for(var q=0;q<L.qs.length;q++){
      var item=L.qs[q],ans=item.opts[item.ok],hit=false;
      for(var c=0;c<CASES.length;c++){
        if(CASES[c][0]===item.s&&CASES[c][1]===ans&&CASES[c][2]===item.cause){hit=true;break;}
      }
      if(!hit){okLv=false;break;}
    }
    if(!okLv)bad.push(i+1);
  }
  return bad;
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d)||seen[d.name])return null;
    seen[d.name]=1;
    list.push({name:d.name,qs:d.qs.map(function(q){return{s:q.s,fix:q.fix,cause:q.cause,opts:q.opts.slice(),ok:q.ok}}),difficulty:Number.isInteger(d.difficulty)?d.difficulty:5});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();loadLevel(lv);
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,qi=0,errors=0,done=false,gen=0;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  qi=0;errors=0;done=false;gen++;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent="三题全答完过关";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  renderQ();updStats();
  say("选出把病句改对的那一句");
}
function renderQ(){
  var q=L.qs[qi];
  $("qTag").textContent="病句 · 第 "+(qi+1)+" / "+L.qs.length+" 题";
  $("qLine").textContent=q.s;
  $("qCause").hidden=true;
  var box=$("opts");box.innerHTML="";
  for(var i=0;i<q.opts.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="opt";b.textContent=q.opts[i];
      b.setAttribute("aria-label","改正候选 "+(i+1));
      b.addEventListener("click",function(){answer(i)});
      box.appendChild(b);
    })(i);
  }
}
function updStats(){
  $("stQ").textContent=(qi+1)+"/"+L.qs.length;
  var e=$("stErr");e.textContent=errors;
  e.className="val"+(errors>0?" bad":"");
}
function answer(i){
  if(done)return;
  var q=L.qs[qi],btn=$("opts").children[i];
  if(i===q.ok){
    btn.classList.add("right");
    $("opts").querySelectorAll(".opt").forEach(function(b){b.disabled=true});
    $("qCause").hidden=false;
    $("qCause").textContent="病因：" + q.cause;
    say("改对了，病因是「"+q.cause+"」");
    var g=gen;
    setTimeout(function(){
      if(g!==gen)return;
      qi++;
      if(qi>=L.qs.length)winLevel();
      else{renderQ();updStats();say("选出把病句改对的那一句");}
    },900);
  }else{
    errors++;updStats();
    btn.classList.add("wrong");btn.disabled=true;
    say("这样改还没改对，看看是不是没找到病根");
  }
}
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:errors}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"门诊结束！";
  $("ovDesc").innerHTML="失误 "+errors+" 次"+(errors===0?"（妙手回春）":"")+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);$("overlay").classList.remove("show");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重开")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
  else{lv++;loadLevel(lv)}
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="9"){
    var i=parseInt(k,10)-1;
    var btns=$("opts").querySelectorAll(".opt:not(:disabled)");
    if(i<btns.length){btns[i].click();e.preventDefault();}
  }
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重开")}
  else if(e.key==="Enter"&&$("overlay").classList.contains("show")){$("ovBtn").click();e.preventDefault();}
});
/* ---------- 启动 ---------- */
loadLevel(save.lv);
var badLv=auditAll();
if(badLv.length)say("警告：内嵌验证器发现异常关卡 "+badLv.join(","));
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
