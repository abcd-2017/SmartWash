  * { box-sizing: border-box; }

var GAME_KEY="shadow-match",SAVE_KEY="sw.shadowmatch.v1";

function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  levelOk=new Array(LEVELS.length);
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){

  }catch(e){}
  return 0;
}

    var t0=Date.now();
    while(i<LEVELS.length&&Date.now()-t0<40){
      if(levelOk[i]===undefined)levelOk[i]=verifyLevel(LEVELS[i]);
      i++;
    }
    if(i<LEVELS.length)setTimeout(step,0);
    else if(typeof renderLevels==="function")renderLevels();
  }
  setTimeout(step,0);
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0)),done:(s.done&&typeof s.done==="object")?s.done:{}}}catch(e){return{lv:0,done:{}}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
      if(typeof resize==="function")resize();
    }
  }).catch(function(){});
}
/* ---------- 选关浮层（lvgrid 通用） ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(save.done[i]?" done":"");
      b.textContent=i+1;
      b.disabled=(levelOk[i]===false)||(i>save.lv);   // 验证失败的关禁选；未验证的关乐观放行
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 结构校验 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Array.isArray(d.h)||d.h.length!==5)return false;
  for(var y=0;y<5;y++){
    if(!Array.isArray(d.h[y])||d.h[y].length!==5)return false;
    for(var x=0;x<5;x++)if(!Number.isInteger(d.h[y][x])||d.h[y][x]<0||d.h[y][x]>3)return false;
  }
  if(!Number.isInteger(d.k)||d.k<0||d.k>3)return false;
  if(!Number.isInteger(d.m)||d.m<0||d.m>1)return false;
  if(!Array.isArray(d.t)||d.t.length!==5)return false;
  for(var i=0;i<5;i++)if(!Number.isInteger(d.t[i])||d.t[i]<0||d.t[i]>3)return false;
  return true;
}
/* ---------- 独立验证器：枚举 8 个体状态，目标剪影必须可达成且体非过度对称 ---------- */
function smSil(b){var n=b.length,s=[];for(var x=0;x<n;x++){var v=0;for(var y=0;y<n;y++)if(b[y][x]>v)v=b[y][x];s.push(v)}return s}
function smRot(b){var n=b.length,r=[];for(var y=0;y<n;y++){r.push([]);for(var x=0;x<n;x++)r[y].push(b[n-1-x][y])}return r}
function smMir(b){return b.map(function(r){return r.slice().reverse()})}
function verifyLevel(L){
  if(!validLevelData(L))return false;
  var seen={},distinct=0,ok=false,t=L.t.join(",");
  for(var m=0;m<2;m++){var c=m?smMir(L.h):L.h;
    for(var k=0;k<4;k++){if(k)c=smRot(c);
      var s=smSil(c).join(",");
      if(!seen[s]){seen[s]=1;distinct++}
      if(s===t)ok=true;
    }}
  return ok&&distinct>=4;
}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    success:v("--g-success"),danger:v("--g-danger"),warning:v("--g-warning"),
    shad:v("--g-st-shad"),top:v("--g-st-top"),mid:v("--g-st-mid"),dk:v("--g-st-dk")};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,orig=null,cur=0,cm=0,moves=0,done=false;
var hintT=0,hintTxt="";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=340;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function curBody(){var b=cm?smMir(orig):orig;for(var i=0;i<cur;i++)b=smRot(b);return b}
function curSil(){return smSil(curBody())}
/* ---------- 关卡 ---------- */
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return}
  orig=L.h;cur=0;cm=0;moves=0;done=false;hintTxt="";
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  var v=verifyLevel(L);   // 加载复核：目标投影可达成
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  if(!v)say("警告：内嵌验证器判定本关目标不可达成（数据异常）");
  else say("旋转模型，让下方投影与顶部影子逐列一致");
  updStats();
}
function updStats(){
  $("stState").textContent=(cm?"⇋ ":"")+(cur*90)+"°";
  $("stMoves").textContent=moves;
}
function checkWin(){
  if(done)return;
  if(curSil().join(",")===L.t.join(",")){
    done=true;
    save.done[lv]=true;
    if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
    persist();
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:moves}).catch(function(){});
    $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"投影匹配！";
    $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成 · 共操作 "+moves+" 步"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
    $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
    $("overlay").classList.add("show");
  }
}
function rotate(d){if(done)return;cur=(cur+d+4)%4;moves++;hintT=0;updStats();checkWin()}
function flip(){if(done)return;cm=1-cm;moves++;hintT=0;updStats();checkWin()}
function hint(){
  if(done)return;
  // 枚举 8 状态找达成目标的状态，换算成操作建议
  for(var m=0;m<2;m++)for(var k=0;k<4;k++){
    var b=m?smMir(orig):orig;for(var i=0;i<k;i++)b=smRot(b);
    if(smSil(b).join(",")===L.t.join(",")){
      var parts=[];
      if(m!==cm)parts.push("翻面");
      var d=(k-cur+4)%4;
      if(d===1)parts.push("右旋 1 次");
      else if(d===2)parts.push("右旋 2 次");
      else if(d===3)parts.push("左旋 1 次");
      hintTxt=parts.length?parts.join(" → "):"已匹配";
      hintT=Date.now();
      say("提示：依次 "+hintTxt);
      return;
    }
  }
  say("内嵌验证器未找到达成路径（数据异常），建议重开");
}
/* ---------- 绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);H=340;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function drawBars(cx0,y0,bw,bh,gap,vals,color,bg){
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.roundRect?ctx.roundRect(cx0-8,y0-10,(bw+gap)*5+10,bh+26,10):ctx.rect(cx0-8,y0-10,(bw+gap)*5+10,bh+26);
  ctx.fill();
  for(var i=0;i<5;i++){
    var h=vals[i]*(bh/3);
    ctx.fillStyle=color;
    ctx.fillRect(cx0+i*(bw+gap),y0+bh-h,bw,Math.max(h,2));
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
    ctx.strokeRect(cx0+i*(bw+gap)+.5,y0+.5,bw-1,bh-1);
  }
}
function rr(x,y,w2,h2,r){
  r=Math.min(r,w2/2,h2/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);
  ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();
}
function drawColumn(x,y,h,tw,th,ch,cx0,cy0){
  var px=cx0+(x-y)*tw/2,py=cy0+(x+y)*th/2,top=py-h*ch;
  ctx.fillStyle=PAL.mid;   // 素材左侧面
  ctx.beginPath();
  ctx.moveTo(px-tw/2,top);ctx.lineTo(px,top+th/2);ctx.lineTo(px,py+th/2);ctx.lineTo(px-tw/2,py);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=PAL.dk;    // 素材右侧面
  ctx.beginPath();
  ctx.moveTo(px+tw/2,top);ctx.lineTo(px,top+th/2);ctx.lineTo(px,py+th/2);ctx.lineTo(px+tw/2,py);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=PAL.top;   // 素材顶面
  ctx.beginPath();
  ctx.moveTo(px,top-th/2);ctx.lineTo(px+tw/2,top);ctx.lineTo(px,top+th/2);ctx.lineTo(px-tw/2,top);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(px,top-th/2);ctx.lineTo(px+tw/2,top);ctx.lineTo(px,top+th/2);ctx.lineTo(px-tw/2,top);
  ctx.closePath();ctx.stroke();
}
function draw(ts){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  if(!L)return;
  // 顶部目标影子
  ctx.fillStyle=PAL.muted;ctx.font="700 12px sans-serif";ctx.textAlign="left";ctx.textBaseline="top";
  ctx.fillText("目标影子",8,8);
  drawBars(W/2-62,26,18,26,8,L.t,PAL.shad,PAL.surface2);
  // 中部 3D 体
  var body=curBody(),tw=Math.min(38,W/8),th=tw*0.5,ch=tw*0.42;
  var cx0=W/2,cy0=150-((body.length-1)*th)/2;
  for(var s=0;s<5;s++)for(var x=0;x<5;x++){
    var y=s-x;if(y<0||y>=5)continue;
    if(body[y][x]>0)drawColumn(x,y,body[y][x],tw,th,ch,cx0,cy0);
  }
  // 底部当前投影
  ctx.fillStyle=PAL.muted;ctx.fillText("当前投影",8,236);
  var sil=curSil(),match=sil.join(",")===L.t.join(",");
  var pulse=hintT&&!window.__gRM?0.5+0.5*Math.sin((Date.now()-hintT)/160):0;
  drawBars(W/2-62,254,18,26,8,sil,match?PAL.success:PAL.primary,PAL.surface2);
  if(pulse&&!match){
    ctx.strokeStyle=PAL.warning;ctx.lineWidth=2;
    rr(W/2-70,244,(18+8)*5+20,46,10);ctx.stroke();
  }
  requestAnimationFrame(draw);
}
/* ---------- 输入 ---------- */
$("btnL").addEventListener("click",function(){rotate(-1)});
$("btnR").addEventListener("click",function(){rotate(1)});
$("btnFlip").addEventListener("click",flip);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"){rotate(-1);e.preventDefault()}
  else if(k==="ArrowRight"){rotate(1);e.preventDefault()}
  else if(k==="f"||k==="F")flip();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
  else if(k===" "||k==="Enter"){if($("overlay").classList.contains("show"))$("ovBtn").click();e.preventDefault()}
});
/* ---------- 启动 ---------- */
var running=true;
document.addEventListener("visibilitychange",function(){
  if(document.hidden)running=false;
  else if(!running){running=true;requestAnimationFrame(draw)}
});
palLoad();loadLevel(save.lv);resize();
requestAnimationFrame(draw);
verifyPending();syncLevelsFromServer();syncSaveFromServer();
window.addEventListener("resize",resize);

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
