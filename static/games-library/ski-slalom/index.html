/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 调色板（颜色全部经 CSS 变量读取，JS 零颜色字面量） ========== */
var PAL={};
function palLoad(){

    onSoft:v("--g-on-soft"),onPrimary:v("--g-on-primary"),

    stA:v("--g-st-a"),stB:v("--g-st-b"),stC:v("--g-st-c"),stD:v("--g-st-d"),stE:v("--g-st-e"),stF:v("--g-st-f")};
}
window.__gOnTheme=function(){palLoad();if(typeof draw==="function")draw();};

/* ========== 通用工具与覆盖层面板 ========== */
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
var overlayEl=$("overlay"),panelEl=$("panel");
function showPanel(html){panelEl.innerHTML=html;overlayEl.classList.add("show");}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}

/* ==================== 回转滑雪（旗门竞速计时赛，关卡驱动） ==================== */
var GAME_KEY="ski-slalom",SAVE_KEY="sw.skislalom.v1";
var LEVELS_KEY="sw.skislalom.v1.levels",LEVELS_VER_KEY="sw.skislalom.v1.levels.ver";

/*XC-CORE-BEGIN*/
var GEN={};
function ssSeed(no){return no*7841+4021;}
function ssRng(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var SS_AX=540,SS_DAMP=3,SS_VMAX=190,SS_GATE_HALF=34;
/* 物理单步（求解器与游戏共用同一组参数） */
function ssStep(st,steer,wy,len,dt){
  var v=170+45*(wy/len);
  st.vx+=steer*SS_AX*dt;
  st.vx*=Math.max(0,1-SS_DAMP*dt);
  if(st.vx>SS_VMAX)st.vx=SS_VMAX;
  if(st.vx<-SS_VMAX)st.vx=-SS_VMAX;
  st.x+=st.vx*dt;
  if(st.x<20){st.x=20;st.vx=Math.abs(st.vx)*0.4;}
  if(st.x>370){st.x=370;st.vx=-Math.abs(st.vx)*0.4;}
  st.wy+=v*dt;
  return v;
}
/* 独立求解器：P 控制器切弯 + 树回避，返回用时与漏门 / 撞树计数 */
GEN.solve=function(lv){
  var st={x:195,vx:0,wy:0};
  var gi=0,missed=0,hits=0,dt=1/120,time=0;
  while(st.wy<lv.len&&time<240){
    var steer=0;
    if(gi<lv.gates.length){
      steer=Math.max(-1,Math.min(1,(lv.gates[gi].x-st.x)*0.055));
    }
    for(var ti=0;ti<lv.trees.length;ti++){
      var tr=lv.trees[ti];
      var ahead=tr.y-st.wy;
      if(ahead>0&&ahead<160&&Math.abs(tr.x-st.x)<42){
        steer=Math.max(-1,Math.min(1,(st.x-tr.x)/40+ (st.x<tr.x?-0.55:0.55)));
        break;
      }
    }
    var prev=st.wy;
    ssStep(st,steer,st.wy,lv.len,dt);
    time+=dt;
    while(gi<lv.gates.length&&prev<=lv.gates[gi].y&&st.wy>lv.gates[gi].y){
      if(Math.abs(st.x-lv.gates[gi].x)>SS_GATE_HALF)missed++;
      gi++;
    }
    for(var tj=0;tj<lv.trees.length;tj++){
      if(Math.abs(st.x-lv.trees[tj].x)<24&&Math.abs(st.wy-lv.trees[tj].y)<18){hits++;}
    }
  }
  return {time:time,missed:missed,hits:hits,finished:st.wy>=lv.len};
};
GEN.gen=function(no,seed){
  var p=(no-1)/39;
  var nGates=10+Math.floor(p*22);
  var gateGap=Math.round(240-p*70);
  var amp=70+p*70;
  var nTrees=2+Math.floor(p*8);
  var s=(seed==null?ssSeed(no):seed);
  for(var att=0;att<80;att++){
    var lv=GEN.build(no,s+att*7919,nGates,gateGap,amp,nTrees);
    if(lv&&GEN.validate(lv).ok)return lv;
  }
  return GEN.build(no,555111,10,240,70,2);
};
GEN.build=function(no,seed,nGates,gateGap,amp,nTrees){
  var rng=ssRng(seed);
  var phase=rng()*6.28;
  var gates=[],i;
  for(i=0;i<nGates;i++){
    gates.push({x:195+amp*Math.sin(i*0.9+phase),y:420+i*gateGap});
  }
  var len=420+nGates*gateGap+520;
  var trees=[];
  for(var t=0;t<nTrees;t++){
    var ty=300+rng()*(len-700);
    var ok=true,nearGate=false,tries=0,tx=0;
    for(var g=0;g<gates.length;g++)if(Math.abs(ty-gates[g].y)<110)nearGate=true;
    if(nearGate){t--;continue;}
    while(tries<24){
      tries++;
      tx=30+rng()*340;
      ok=true;
      for(var g2=0;g2<gates.length-1;g2++){
        var a=gates[g2],b=gates[g2+1];
        for(var k=0;k<=10;k++){
          var px=a.x+(b.x-a.x)*k/10,py=a.y+(b.y-a.y)*k/10;
          if(Math.hypot(tx-px,ty-py)<58){ok=false;break;}
        }
        if(!ok)break;
      }
      if(ok)break;
    }
    if(ok)trees.push({x:tx,y:ty});
  }
  var sol=GEN.solve({len:len,gates:gates,trees:trees});
  var par=Math.ceil((sol.time*1.4+2)*10)/10;
  return {name:"回转·"+(no<10?"0"+no:no),no:no,seed:seed,len:len,gates:gates,trees:trees,par:par,nGates:nGates};
};
/* 独立验证器：求解器全程零漏门、零撞树、完赛，且 par 留有 ≥40% 裕量 */
GEN.validate=function(lv){
  if(!lv||typeof lv!=="object")return{ok:false,why:"shape"};
  if(!Array.isArray(lv.gates)||lv.gates.length<10||lv.gates.length>32)return{ok:false,why:"gates"};
  if(!Array.isArray(lv.trees)||lv.trees.length>16)return{ok:false,why:"trees"};
  if(!(lv.len>3000))return{ok:false,why:"len"};
  if(!(lv.par>0))return{ok:false,why:"par"};
  var sol=GEN.solve(lv);
  if(!sol.finished)return{ok:false,why:"unfinished"};
  if(sol.missed>0)return{ok:false,why:"missed"+sol.missed};
  if(sol.hits>0)return{ok:false,why:"hits"+sol.hits};
  if(lv.par<sol.time*1.4+1.9)return{ok:false,why:"par-tight"};
  return{ok:true,why:"",time:sol.time};
};
GEN.validateLevelsAll=function(){
  var fails=[],n=0;
  for(var no=1;no<=40;no++){
    var lv=GEN.gen(no,ssSeed(no));
    var r=GEN.validate(lv);
    if(!r.ok)fails.push(no+"("+r.why+")");
    n++;
  }
  return {total:n,fails:fails,allOk:fails.length===0};
};
globalThis.__XC=GEN;

/* ---------- 画布 ---------- */
var NW=390,NH=560,W=390,H=560,S=1,offX=0,offY=0;
var cv=$("cv"),ctx=cv.getContext("2d");
function rr(x0,y0,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x0+r,y0);
  ctx.arcTo(x0+w,y0,x0+w,y0+h,r);ctx.arcTo(x0+w,y0+h,x0,y0+h,r);
  ctx.arcTo(x0,y0+h,x0,y0,r);ctx.arcTo(x0,y0,x0+w,y0,r);
  ctx.closePath();
}
function fit(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));H=Math.max(300,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);offX=(W-NW*S)/2;offY=(H-NH*S)/2;
  draw();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);
function camY(){return skier.wy-380;}

/* ---------- 关卡流程 ---------- */
function loadLevel(idx){
  idx=Math.max(0,Math.min(idx,LEVELS.length-1));
  cur=idx;
  var d=LEVELS[idx];
  course=GEN.gen(d.no,d.seed==null?ssSeed(d.no):d.seed);
  var chk=GEN.validate(course);
  if(!chk.ok)course=GEN.gen(d.no,ssSeed(d.no));
  state="ready";paused=false;
  skier={x:195,vx:0,wy:0};
  elapsed=0;penalty=0;stumbleT=0;gi=0;passed=0;shakeT=0;
  refresh();
}
function enterLevel(i){loadLevel(i);showStart();}
function startPlay(){
  state="running";paused=false;
  hideOverlay();
  say("切进旗门，漏门 +2 秒");
}
function selectClosed(){showStart();}
function finishRun(){
  state="over";
  var total=elapsed+penalty;
  var win=total<=course.par;
  var stars=win?(total<=course.par*0.85?3:2):1;
  if(win){
    var old=parseInt(save.done[cur],10)||0;
    if(stars>old)save.done[cur]=stars;
    save.best=totalStars();
    if(cur+1>save.lv)save.lv=cur+1;
    persistSave();
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:save.lv,metricExtra:save.best}).catch(function(){});
  }
  refresh();
  if(win)showWin(total,stars);else showFail(total);
}
function stepGame(dt){
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt);
  if(stumbleT>0)stumbleT=Math.max(0,stumbleT-dt);
  var steer=0;
  if(keys.left&&!keys.right)steer=-1;
  else if(keys.right&&!keys.left)steer=1;
  else if(touchX!==null)steer=clamp((touchX-skier.x)/80,-1,1);
  var mul=stumbleT>0?0.55:1;
  var v;
  var prev=skier.wy;
  /* 与核心同参数的一步（速度按打滑系数缩放） */
  var st={x:skier.x,vx:skier.vx,wy:skier.wy};
  var vv=170+45*(st.wy/course.len);
  st.vx+=steer*540*mul*dt;
  st.vx*=Math.max(0,1-3*dt);
  if(st.vx>190)st.vx=190;if(st.vx<-190)st.vx=-190;
  st.x+=st.vx*dt;
  if(st.x<20){st.x=20;st.vx=Math.abs(st.vx)*0.4;}
  if(st.x>370){st.x=370;st.vx=-Math.abs(st.vx)*0.4;}
  st.wy+=vv*mul*dt;
  skier.x=st.x;skier.vx=st.vx;
  elapsed+=dt;
  /* 旗门判定 */
  while(gi<course.gates.length&&prev<=course.gates[gi].y&&st.wy>course.gates[gi].y){
    if(Math.abs(st.x-course.gates[gi].x)<=34){
      passed++;
      say("旗门 "+passed+"/"+course.nGates);
    }else{
      penalty+=2;
      say("漏门！罚时 +2s");
    }
    gi++;
  }
  /* 树 */
  for(var ti=0;ti<course.trees.length;ti++){
    var tr=course.trees[ti];
    if(prev<=tr.y&&st.wy>tr.y&&Math.abs(st.x-tr.x)<24){
      stumbleT=0.85;shakeT=0.3;
      say("撞树减速！");
    }
  }
  skier.wy=st.wy;
  stTime.textContent=(elapsed+penalty).toFixed(1);
  if(skier.wy>=course.len)finishRun();
}

/* ---------- 绘制 ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);
  if(!course){
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
    rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
    return;
  }
  ctx.save();
  ctx.translate(offX,offY);ctx.scale(S,S);
  if(shakeT>0){var a=shakeT/0.3;ctx.translate(Math.sin(shakeT*46)*4*a,0);}
  ctx.fillStyle=PAL.stA;ctx.fillRect(0,0,NW,120);
  ctx.fillStyle=PAL.stB;ctx.fillRect(0,110,NW,NH-110);
  var cam=state==="ready"?-380:camY();
  /* 雪面纹理 */
  ctx.fillStyle=PAL.stC;
  for(var m=0;m<26;m++){
    var my=((m*97)%2400);
    var myy=my-cam%2400;if(myy<-20)myy+=2400;
    var mx=(m*163)%350+20;
    if(myy>110&&myy<NH)ctx.fillRect(mx,myy,14,6);
  }
  /* 雪道边界 */
  ctx.strokeStyle=PAL.stD;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(14,110);ctx.lineTo(14,NH);ctx.moveTo(376,110);ctx.lineTo(376,NH);ctx.stroke();
  var i;
  /* 树 */
  for(i=0;i<course.trees.length;i++){
    var tr=course.trees[i],ty=tr.y-cam;
    if(ty<-40||ty>NH+40)continue;
    ctx.fillStyle=PAL.stE;
    ctx.beginPath();
    ctx.moveTo(tr.x-16,ty+16);ctx.lineTo(tr.x,ty-26);ctx.lineTo(tr.x+16,ty+16);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=PAL.stD;
    ctx.fillRect(tr.x-3,ty+16,6,10);
  }
  /* 旗门 */
  for(i=0;i<course.gates.length;i++){
    var g=course.gates[i],gy=g.y-cam;
    if(gy<-30||gy>NH+30)continue;
    var col=i%2===0?PAL.danger:PAL.primary;
    var isOpen=i>=gi;
    ctx.strokeStyle=PAL.stD;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(g.x-34,gy);ctx.lineTo(g.x-34,gy+22);ctx.stroke();
    ctx.beginPath();ctx.moveTo(g.x+34,gy);ctx.lineTo(g.x+34,gy+22);ctx.stroke();
    ctx.fillStyle=col;
    if(isOpen){
      ctx.beginPath();ctx.moveTo(g.x-34,gy);ctx.lineTo(g.x-10,gy+7);ctx.lineTo(g.x-34,gy+14);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(g.x+34,gy);ctx.lineTo(g.x+10,gy+7);ctx.lineTo(g.x+34,gy+14);ctx.closePath();ctx.fill();
    }else{
      ctx.globalAlpha=0.25;
      ctx.beginPath();ctx.moveTo(g.x-34,gy);ctx.lineTo(g.x-10,gy+7);ctx.lineTo(g.x-34,gy+14);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(g.x+34,gy);ctx.lineTo(g.x+10,gy+7);ctx.lineTo(g.x+34,gy+14);ctx.closePath();ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  /* 终点 */
  var fy=course.len-cam;
  if(fy>-30&&fy<NH+30){
    ctx.fillStyle=PAL.stD;
    ctx.fillRect(60,fy,NW-120,8);
    ctx.fillStyle=PAL.surface;
    for(var c2=0;c2<12;c2++)if(c2%2===0)ctx.fillRect(64+c2*22,fy,22,8);
    ctx.fillStyle=PAL.deep;
    ctx.font="700 14px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="alphabetic";
    ctx.fillText("FINISH",195,fy-6);
  }
  /* 滑雪者 */
  var sx=skier.x,syy=380;
  if(state==="over")syy=Math.min(380,course.len-cam);
  ctx.save();
  ctx.translate(sx,syy);
  ctx.rotate(clamp(skier.vx*0.0016,-0.5,0.5));
  ctx.strokeStyle=PAL.stD;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-10,14);ctx.lineTo(10,14);ctx.stroke();
  ctx.fillStyle=PAL.primary;
  ctx.beginPath();ctx.arc(0,-6,10,0,6.3);ctx.fill();
  ctx.fillStyle=PAL.onPrimary;
  ctx.beginPath();ctx.arc(3,-9,2.4,0,6.3);ctx.fill();
  ctx.restore();
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

/* ---------- 覆盖层 ---------- */
function showStart(){
  showPanel(
    '<p class="rt">第 '+(cur+1)+' 关 · '+esc(course.name)+'</p>'+
    '<p class="rs">'+course.nGates+' 组旗门 · '+course.trees.length+' 棵树 · 目标 <b>'+course.par.toFixed(1)+'s</b></p>'+
    '<div class="rbtns"><button class="btn" id="ovMain" type="button">开始</button></div>'+
    '<p class="rhint">滑行速度随下行距离递增，高速切弯要提前收线。漏门 +2s 罚时，撞树减速 0.85 秒。</p>'
  );
  $("ovMain").addEventListener("click",function(){startPlay();});
}
function showWin(total,stars){
  var last=cur>=LEVELS.length-1;
  showPanel(
    '<p class="rt">完赛！</p>'+
    '<p class="rs">用时 <b>'+total.toFixed(1)+'s</b> / 目标 '+course.par.toFixed(1)+'s · 星星 '+stars+' / 3</p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovReplay" type="button">重滑</button>'+
      '<button class="btn" id="ovNext" type="button">'+(last?"已完成全部":"下一关")+'</button>'+
    '</div>'
  );
  $("ovNext").addEventListener("click",function(){enterLevel(last?cur:cur+1);});
  $("ovReplay").addEventListener("click",function(){enterLevel(cur);});
}
function showFail(total){
  showPanel(
    '<p class="rt">超时</p>'+
    '<p class="rs">用时 '+total.toFixed(1)+'s · 目标 '+course.par.toFixed(1)+'s · 漏门罚时 '+penalty.toFixed(1)+'s</p>'+
    '<p class="rhint">提示：贴旗门内侧切线最省距离；看到下一个门提前压重心，避免来回猛摆。</p>'+
    '<div class="rbtns"><button class="btn" id="ovRetryF" type="button">重滑本关</button></div>'
  );
  $("ovRetryF").addEventListener("click",function(){retry();});
}
function showPause(){
  showPanel(
    '<p class="rt">已暂停</p>'+
    '<p class="rs">用时 '+(elapsed+penalty).toFixed(1)+'s · 旗门 '+passed+'/'+course.nGates+'</p>'+
    '<div class="rbtns">'+
      '<button class="btn ghost" id="ovReP" type="button">重滑本关</button>'+
      '<button class="btn" id="ovReR" type="button">继续</button>'+
    '</div>'
  );
  $("ovReR").addEventListener("click",function(){paused=false;hideOverlay();});
  $("ovReP").addEventListener("click",function(){retry();});
}
function retry(){loadLevel(cur);startPlay();}

/* ---------- 输入 ---------- */
var keys={left:false,right:false},touchX=null;
cv.addEventListener("pointerdown",function(ev){
  var r=cv.getBoundingClientRect();
  touchX=(ev.clientX-r.left-offX)/S;
  ev.preventDefault();
});
cv.addEventListener("pointermove",function(ev){
  if(touchX===null)return;
  var r=cv.getBoundingClientRect();
  touchX=(ev.clientX-r.left-offX)/S;
});
cv.addEventListener("pointerup",function(ev){touchX=null;});
cv.addEventListener("pointercancel",function(ev){touchX=null;});
window.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowLeft"||k==="a"){e.preventDefault();keys.left=true;touchX=null;}
  else if(k==="ArrowRight"||k==="d"){e.preventDefault();keys.right=true;touchX=null;}
  else if(k===" "){
    e.preventDefault();
    if(state==="ready"||state==="over")retry();
    else if(paused){paused=false;hideOverlay();}
  }
});
window.addEventListener("keyup",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="ArrowLeft"||k==="a")keys.left=false;
  else if(k==="ArrowRight"||k==="d")keys.right=false;
});
btnRetry.addEventListener("click",function(){retry();this.blur();});
btnLevels.addEventListener("click",function(){
  if(state==="running"&&!paused){paused=true;say("选关中");}
  openLevelSelect();this.blur();
});

/* 切后台自动暂停 */
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="running"&&!paused&&!overlayEl.classList.contains("show")){
    paused=true;showPause();
  }
});

/* ---------- 主循环与启动 ---------- */
var last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;
  var dt=Math.min(0.033,((ts-last)/1000)||0);
  last=ts;
  if(state==="running"&&!paused)stepGame(dt);
  draw();
}
fit();
refresh();
loadLevel(cur);
showStart();
syncLevelsFromServer();
syncSaveFromServer();
requestAnimationFrame(loop);
window.__validateLevels=GEN.validateLevelsAll;


/* ========== 关卡公共段（DB 下发优先 + localStorage 版本缓存 + 包内默认关兜底；仅函数声明，供游戏段调用） ========== */
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!d||typeof d.name!=="string"||!d.name.trim()||!Number.isInteger(d.no)||d.no<1||!Number.isInteger(d.seed))return null;
    if(seen[d.no])return null;
    seen[d.no]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||list.length<DEFAULT_LEVELS.length)return false;
  for(var i=0;i<list.length;i++){
    var d=list[i],lv;
    try{lv=GEN.gen(d.no,d.seed);}catch(e){return false;}
    if(!lv||!GEN.validate(lv).ok)return false;
  }
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length>=DEFAULT_LEVELS.length){
      for(var i=0;i<list.length;i++){var d=list[i];if(!d||!Number.isInteger(d.no)||!Number.isInteger(d.seed))return v;}
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      if(save.lv>LEVELS.length-1)save.lv=LEVELS.length-1;
      persistSave();loadLevel(cur);
    }
  }).catch(function(){});
}
function loadSaveData(){
  try{
    var s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    if(s&&typeof s==="object"){
      var done={};
      if(s.done&&typeof s.done==="object")for(var k in s.done){var v=parseInt(s.done[k],10);if(v>0)done[k]=v;}
      return{lv:Math.max(0,parseInt(s.lv,10)||0),done:done,best:Math.max(0,parseInt(s.best,10)||0)};
    }
  }catch(e){}
  return{lv:0,done:{},best:0};
}
function persistSave(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(remote.lv,10)||0;if(rl>save.lv){save.lv=rl;changed=true;}
      var rb=parseInt(remote.best,10)||0;if(rb>save.best){save.best=rb;changed=true;}
      if(remote.done&&typeof remote.done==="object")for(var k in remote.done){
        var rv=parseInt(remote.done[k],10)||0,mv=parseInt(save.done[k],10)||0;
        if(rv>mv){save.done[k]=rv;changed=true;}
      }
      if(changed){persistSave();}
    }catch(e){}
  }).catch(function(){});
}
function openLevelSelect(){
  var html='<p class="rt">选择关卡</p><p class="rs">已过关卡标绿，灰色未解锁</p><div class="lv-wrap"><div class="lv-grid">';
  for(var i=0;i<LEVELS.length;i++){
    var done=parseInt(save.done[i],10)>0;
    var locked=i>save.lv;
    html+='<button class="lv-chip'+(i===cur?" sel":"")+(done?" done":"")+'" data-i="'+i+'"'+(locked?" disabled":"")+' type="button">'+(i+1)+'</button>';
  }
  html+='</div></div><div class="rbtns"><button class="btn ghost" id="ovClose" type="button">返回</button></div>';
  showPanel(html);
  var chips=panelEl.querySelectorAll(".lv-chip");
  for(var j=0;j<chips.length;j++){
    chips[j].addEventListener("click",function(){
      var i=parseInt(this.getAttribute("data-i"),10);
      hideOverlay();enterLevel(i);
    });
  }
  $("ovClose").addEventListener("click",function(){hideOverlay();selectClosed();});
}

})();
</script>
