  for(var i=0;i<d.r;i++){
    if(!Array.isArray(d.clues[i])||d.clues[i].length!==d.c)return false;
    for(var j=0;j<d.c;j++){var v=d.clues[i][j];if(!Number.isInteger(v)||v<-1||v>4)return false}
  }

function parseDbLevels(res){

    if(!row||typeof row.dataJson!=="string")return null;
    var d;try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    var ck=d.r+"x"+d.c+"|"+d.clues.map(function(r){return r.join(",")}).join(";");
    if(seen[ck])return null;seen[ck]=1;
    list.push({name:String(d.name||("第"+(i+1)+"关")),r:d.r,c:d.c,clues:d.clues.map(function(r){return r.slice()})});

/* ---------- 边缘索引 ---------- */
function edgeInfo(R,C){
  var H=(R+1)*C,E=H+R*(C+1);
  var hId=function(x,y){return y*C+x},vId=function(x,y){return H+y*(C+1)+x};
  var cellEdges=[];
  for(var y=0;y<R;y++)for(var x=0;x<C;x++)cellEdges.push([hId(x,y),hId(x,y+1),vId(x,y),vId(x+1,y)]);
  var vertEdges=[];
  for(var y2=0;y2<=R;y2++)for(var x2=0;x2<=C;x2++){
    var list=[];
    if(x2>0)list.push(hId(x2-1,y2));
    if(x2<C)list.push(hId(x2,y2));
    if(y2>0)list.push(vId(x2,y2-1));
    if(y2<R)list.push(vId(x2,y2));
    vertEdges.push(list);
  }
  var edgeVerts=[];
  for(var y3=0;y3<=R;y3++)for(var x3=0;x3<C;x3++)edgeVerts.push([x3,y3,x3+1,y3]);
  for(var y4=0;y4<R;y4++)for(var x4=0;x4<=C;x4++)edgeVerts.push([x4,y4,x4,y4+1]);
  return {H:H,E:E,hId:hId,vId:vId,cellEdges:cellEdges,vertEdges:vertEdges,edgeVerts:edgeVerts};
}
/* ---------- 独立求解器：统计解数（上限 2），返回首解边集 ---------- */
function slitherSolve(R,C,clues,cap){
  var info=edgeInfo(R,C),E=info.E,cellEdges=info.cellEdges,vertEdges=info.vertEdges,edgeVerts=info.edgeVerts;
  var clueArr=[];
  for(var y=0;y<R;y++)for(var x=0;x<C;x++)clueArr.push(clues[y][x]);
  var MAX=cap||150000,count=0,nodes=0,first=null;
  function prop(val){
    var changed=true;
    while(changed){
      changed=false;
      for(var c=0;c<R*C;c++){
        var cl=clueArr[c];if(cl<0)continue;
        var es=cellEdges[c],sum=0,unk=[];
        for(var q=0;q<es.length;q++){var e=es[q];if(val[e]===1)sum++;else if(val[e]<0)unk.push(e)}
        if(sum>cl||sum+unk.length<cl)return false;
        if(unk.length){
          if(sum===cl){for(var q2=0;q2<unk.length;q2++)val[unk[q2]]=0;changed=true}
          else if(sum+unk.length===cl){for(var q3=0;q3<unk.length;q3++)val[unk[q3]]=1;changed=true}
        }
      }
      for(var v=0;v<=R;v++)for(var u=0;u<=C;u++){
        var es2=vertEdges[v*(C+1)+u],deg=0,unk2=[];
        for(var q4=0;q4<es2.length;q4++){var e2=es2[q4];if(val[e2]===1)deg++;else if(val[e2]<0)unk2.push(e2)}
        if(deg>2)return false;
        if(deg===2&&unk2.length){for(var q5=0;q5<unk2.length;q5++)val[unk2[q5]]=0;changed=true}
        else if(deg===0&&unk2.length===1){val[unk2[0]]=0;changed=true}
        else if(deg===1&&unk2.length===1){val[unk2[0]]=1;changed=true}
      }
    }
    return true;
  }
  function singleCycle(val){
    var on=0,startV=-1;
    var deg=new Array((R+1)*(C+1)).fill(0);
    for(var e=0;e<E;e++)if(val[e]===1){on++;var ev=edgeVerts[e];deg[ev[1]*(C+1)+ev[0]]++;deg[ev[3]*(C+1)+ev[2]]++;if(startV<0)startV=ev[1]*(C+1)+ev[0]}
    if(on===0)return false;
    for(var v=0;v<deg.length;v++)if(deg[v]!==0&&deg[v]!==2)return false;
    var adj=new Array((R+1)*(C+1)).fill(null).map(function(){return []});
    for(var e2=0;e2<E;e2++)if(val[e2]===1){var ev2=edgeVerts[e2],a=ev2[1]*(C+1)+ev2[0],b=ev2[3]*(C+1)+ev2[2];adj[a].push(b);adj[b].push(a)}
    var seen=new Array(deg.length).fill(false),st=[startV];seen[startV]=true;var cnt=1;
    while(st.length){var u=st.pop();var ad=adj[u];for(var q=0;q<ad.length;q++)if(!seen[ad[q]]){seen[ad[q]]=true;cnt++;st.push(ad[q])}}
    var onV=0;for(var v2=0;v2<deg.length;v2++)if(deg[v2]>0)onV++;
    return cnt===onV;
  }
  function dfs(val){
    if(count>=2||nodes>MAX)return;
    var v2=val.slice();
    if(!prop(v2))return;
    var pick=-1;
    for(var e=0;e<E;e++)if(v2[e]<0){pick=e;break}
    if(pick<0){nodes++;if(singleCycle(v2)){count++;if(!first)first=v2.slice()}return}
    nodes++;
    for(var b=0;b<=1;b++){
      var v3=v2.slice();v3[pick]=b;
      if(b===1){
        var ev=edgeVerts[pick];
        var parent=new Array((R+1)*(C+1)).fill(0).map(function(_,i){return i});
        function find(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x]}return x}
        for(var e3=0;e3<E;e3++)if(v3[e3]===1&&e3!==pick){var a=find(edgeVerts[e3][1]*(C+1)+edgeVerts[e3][0]),bb=find(edgeVerts[e3][3]*(C+1)+edgeVerts[e3][2]);if(a!==bb)parent[a]=bb}
        var a2=find(ev[1]*(C+1)+ev[0]),bb2=find(ev[3]*(C+1)+ev[2]);
        if(a2===bb2){
          var v4=v3.slice();if(!prop(v4))continue;
          var hasUnk=false;for(var e4=0;e4<E;e4++)if(v4[e4]<0){hasUnk=true;break}
          if(hasUnk)continue;
          nodes++;if(singleCycle(v4)){count++;if(!first)first=v4.slice()}
          continue;
        }
      }
      dfs(v3);
      if(count>=2||nodes>MAX)return;
    }
  }
  dfs(new Array(E).fill(-1));
  return {count:count,nodes:nodes,sol:first};
}

/* ---------- 分析 ---------- */
function analyze(){
  var errs={},on=0;
  for(var e=0;e<info.E;e++)if(state[e]===1)on++;
  for(var c=0;c<R*C;c++){
    var cl=L.clues[Math.floor(c/C)][c%C];if(cl<0)continue;
    var s=0;for(var q=0;q<4;q++)if(state[info.cellEdges[c][q]]===1)s++;
    if(s>cl)for(var q2=0;q2<4;q2++)errs[info.cellEdges[c][q2]]=1;
  }
  for(var v=0;v<=R;v++)for(var u=0;u<=C;u++){
    var es=info.vertEdges[v*(C+1)+u],d=0;
    for(var q3=0;q3<es.length;q3++)if(state[es[q3]]===1)d++;
    if(d>2)for(var q4=0;q4<es.length;q4++)errs[es[q4]]=1;
  }

function updStats(){

/* ---------- 关卡 ---------- */
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return}
  R=L.r;C=L.c;info=edgeInfo(R,C);
  state=info.edgeVerts.map(function(){return 0});//0未知 1线 2叉
  history=[];over=false;curEdge=-1;errEdges={};
  $("lvTag").textContent="第 "+(lv+1)+" 关";
  $("lvRule").textContent=C+"×"+R;
  var res=slitherSolve(R,C,L.clues,150000);
  if(res.count!==1)say("警告：内嵌求解器判定本关解不唯一（数据异常）");

function cycleEdge(e){
  if(over)return;
  var nv=(state[e]+1)%3;
  history.push({e:e,prev:state[e]});
  state[e]=nv;curEdge=e;
  updStats();
  if(nv===1)say("画线");else if(nv===2)say("打叉（排除）");else say("清除");
  checkWin();

function undo(){
  if(!history.length||over)return;
  var h=history.pop();state[h.e]=h.prev;curEdge=h.e;
  updStats();say("撤销一步");

function hint(){
  if(over)return;
  var res=slitherSolve(R,C,L.clues,150000);
  if(res.count!==1||!res.sol){say("本关解不唯一，无法提示");return}
  for(var e=0;e<info.E;e++){
    var want=res.sol[e]===1?1:2;
    if(state[e]!==want){history.push({e:e,prev:state[e]});state[e]=want;curEdge=e;break}
  }
  updStats();say("提示：已按解调整一条边");
  checkWin();

function checkWin(){
  var val=state.map(function(s){return s===1?1:0});
  // 提示约束
  for(var c=0;c<R*C;c++){
    var cl=L.clues[Math.floor(c/C)][c%C];if(cl<0)continue;
    var s=0;for(var q=0;q<4;q++)if(val[info.cellEdges[c][q]]===1)s++;
    if(s!==cl)return;
  }
  for(var v=0;v<=R;v++)for(var u=0;u<=C;u++){
    var es=info.vertEdges[v*(C+1)+u],d=0;
    for(var q2=0;q2<es.length;q2++)if(val[es[q2]]===1)d++;
    if(d!==0&&d!==2)return;
  }
  // 单环
  var on=0,startV=-1,deg=new Array((R+1)*(C+1)).fill(0);
  for(var e=0;e<info.E;e++)if(val[e]===1){on++;var ev=info.edgeVerts[e];deg[ev[1]*(C+1)+ev[0]]++;deg[ev[3]*(C+1)+ev[2]]++;if(startV<0)startV=ev[1]*(C+1)+ev[0]}
  if(on===0)return;
  for(var v3=0;v3<deg.length;v3++)if(deg[v3]!==0&&deg[v3]!==2)return;
  var adj=new Array((R+1)*(C+1)).fill(null).map(function(){return []});
  for(var e2=0;e2<info.E;e2++)if(val[e2]===1){var ev2=info.edgeVerts[e2],a=ev2[1]*(C+1)+ev2[0],b=ev2[3]*(C+1)+ev2[2];adj[a].push(b);adj[b].push(a)}
  var seen=new Array(deg.length).fill(false),st=[startV];seen[startV]=true;var cnt=1;
  while(st.length){var u2=st.pop(),ad=adj[u2];for(var q3=0;q3<ad.length;q3++)if(!seen[ad[q3]]){seen[ad[q3]]=true;cnt++;st.push(ad[q3])}}
  var onV=0;for(var v4=0;v4<deg.length;v4++)if(deg[v4]>0)onV++;

}
function winLevel(){

/* ---------- 绘制 ---------- */
function edgeMid(e){
  var ev=info.edgeVerts[e];

}
function draw(){
  ctx.fillStyle=PAL.board;ctx.fillRect(0,0,W,H);
  if(!L)return;
  // 格子底
  for(var y=0;y<R;y++)for(var x=0;x<C;x++){
    ctx.fillStyle=PAL.cell;ctx.fillRect(pad+x*cell+1,pad+y*cell+1,cell-2,cell-2);
    var cl=L.clues[y][x];
    if(cl>=0){
      ctx.fillStyle=PAL.text;
      ctx.font="700 22px -apple-system,'PingFang SC',sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(String(cl),pad+x*cell+cell/2,pad+y*cell+cell/2+1);
    }
  }
  // 边
  for(var e=0;e<info.E;e++){
    var ev=info.edgeVerts[e],ax=pad+ev[0]*cell,ay=pad+ev[1]*cell,bx=pad+ev[2]*cell,by=pad+ev[3]*cell;
    var m=edgeMid(e);
    if(state[e]===1){
      ctx.strokeStyle=errEdges[e]?PAL.danger:PAL.line;ctx.lineWidth=4;ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
    }else if(state[e]===2){
      ctx.strokeStyle=PAL.x;ctx.lineWidth=2.5;ctx.lineCap="round";
      var d=Math.min(8,cell*0.22);
      ctx.beginPath();ctx.moveTo(m.x-d,m.y-d);ctx.lineTo(m.x+d,m.y+d);
      ctx.moveTo(m.x+d,m.y-d);ctx.lineTo(m.x-d,m.y+d);ctx.stroke();
    }else if(e===curEdge&&!over){
      ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();ctx.setLineDash([]);
    }
  }
  // 点
  ctx.fillStyle=PAL.dot;
  for(var y2=0;y2<=R;y2++)for(var x2=0;x2<=C;x2++){
    ctx.beginPath();ctx.arc(pad+x2*cell,pad+y2*cell,3.5,0,7);ctx.fill();
  }

}
/* ---------- 输入 ---------- */
function edgeAt(px,py){
  var best=-1,bd=1e9;
  for(var e=0;e<info.E;e++){
    var ev=info.edgeVerts[e];
    var ax=pad+ev[0]*cell,ay=pad+ev[1]*cell,bx=pad+ev[2]*cell,by=pad+ev[3]*cell;
    var dx=bx-ax,dy=by-ay,len2=dx*dx+dy*dy;
    var t=((px-ax)*dx+(py-ay)*dy)/len2;t=Math.max(0,Math.min(1,t));
    var qx=ax+t*dx,qy=ay+t*dy,d=Math.hypot(px-qx,py-qy);
    if(d<bd){bd=d;best=e}
  }
  return bd<=cell*0.38?best:-1;
}

window.addEventListener("keydown",function(e){
  if(!L)return;
  if(e.key===" "||e.key==="Enter"){
    e.preventDefault();if(!over&&curEdge>=0)cycleEdge(curEdge);return;
  }
  var dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  var d=dirs[e.key];
  if(d){
    e.preventDefault();if(over)return;
    if(curEdge<0){curEdge=0;updStats();return}
    var m=edgeMid(curEdge);
    var best=-1,bd=1e9;
    for(var e2=0;e2<info.E;e2++){
      if(e2===curEdge)continue;
      var m2=edgeMid(e2);
      var vx=m2.x-m.x,vy=m2.y-m.y;
      if(vx*d[0]+vy*d[1]<=0.5)continue;
      var dist=Math.hypot(vx,vy);
      var ang=Math.abs(Math.atan2(vx*d[1]-vy*d[0],vx*d[0]+vy*d[1]));
      if(ang>0.9)continue;
      var score=dist*(1+ang);
      if(score<bd){bd=score;best=e2}
    }
    if(best>=0){curEdge=best;updStats()}
    return;
  }
  if(e.key==="z"||e.key==="Z"){undo()}
  else if(e.key==="h"||e.key==="H"){hint()}
  else if(e.key==="Tab"){e.preventDefault();curEdge=(curEdge+1+info.E)%info.E;updStats()}
});

    if(lv>LEVELS.length-1)lv=LEVELS.length-1;
    save.lv=Math.min(save.lv,lv);persist();
    loadLevel(lv);
  }).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("slitherlink").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(r.lv,10)||0;
      if(rl>save.lv){save.lv=Math.min(LEVELS.length-1,rl);changed=true}
      if(r.done&&typeof r.done==="object")for(var k in r.done)if(r.done[k]&&!save.done[k]){save.done[k]=true;changed=true}
      if(changed){persist();loadLevel(save.lv)}
    }catch(e){}
  }).catch(function(){});
}
palLoad();resize();loadLevel(lv);
requestAnimationFrame(draw);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套） */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
