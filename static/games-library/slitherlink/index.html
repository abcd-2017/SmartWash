  if(!Number.isInteger(d.r)||d.r<3||d.r>9)return false;
  if(!Number.isInteger(d.c)||d.c<3||d.c>9)return false;
  if(!Array.isArray(d.clues)||d.clues.length!==d.r)return false;
  for(var i=0;i<d.r;i++){
    if(!Array.isArray(d.clues[i])||d.clues[i].length!==d.c)return false;
    for(var j=0;j<d.c;j++){var v=d.clues[i][j];if(!Number.isInteger(v)||v<-1||v>4)return false}

    var row=res.levels[i];
    if(!row||typeof row.dataJson!=="string")return null;

    if(!validLevelData(d))return null;
    var ck=d.r+"x"+d.c+"|"+d.clues.map(function(r){return r.join(",")}).join(";");

function edgeInfo(R,C){
  var H=(R+1)*C,E=H+R*(C+1);
  var hId=function(x,y){return y*C+x},vId=function(x,y){return H+y*(C+1)+x};
  var cellEdges=[];
  for(var y=0;y<R;y++)for(var x=0;x<C;x++)cellEdges.push([hId(x,y),hId(x,y+1),vId(x,y),vId(x+1,y)]);
  var vertEdges=[];
  for(var y2=0;y2<=R;y2++)for(var x2=0;x2<=C;x2++){
    var list=[];
    if(x2>0)list.push(hId(x2-1,y2));
    if(x2<C)list.push(hId(x2,y2));
    if(y2>0)list.push(vId(x2,y2-1));
    if(y2<R)list.push(vId(x2,y2));
    vertEdges.push(list);
  }
  var edgeVerts=[];
  for(var y3=0;y3<=R;y3++)for(var x3=0;x3<C;x3++)edgeVerts.push([x3,y3,x3+1,y3]);
  for(var y4=0;y4<R;y4++)for(var x4=0;x4<=C;x4++)edgeVerts.push([x4,y4,x4,y4+1]);
  return {H:H,E:E,hId:hId,vId:vId,cellEdges:cellEdges,vertEdges:vertEdges,edgeVerts:edgeVerts};
}

    }

  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];

function updStats(){

/* ---------- 关卡 ---------- */

  if(res.count!==1)say("警告：内嵌求解器判定本关解不唯一（数据异常）");

function undo(){

function hint(){

function checkWin(){

    var s=0;for(var q=0;q<4;q++)if(val[info.cellEdges[c][q]]===1)s++;
    if(s!==cl)return;

    var es=info.vertEdges[v*(C+1)+u],d=0;

  if(on===0)return;

  for(var e2=0;e2<info.E;e2++)if(val[e2]===1){var ev2=info.edgeVerts[e2],a=ev2[1]*(C+1)+ev2[0],b=ev2[3]*(C+1)+ev2[2];adj[a].push(b);adj[b].push(a)}

  while(st.length){var u2=st.pop(),ad=adj[u2];for(var q3=0;q3<ad.length;q3++)if(!seen[ad[q3]]){seen[ad[q3]]=true;cnt++;st.push(ad[q3])}}

function winLevel(){

  if(GB.available)GB.reportScore("slitherlink",{metricValue:lv+1,metricExtra:analyze().on}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"过关！";
  $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成<br>环线 "+analyze().on+" 条边";

function renderLevels(){

/* ---------- 绘制 ---------- */
function edgeMid(e){
  var ev=info.edgeVerts[e];
  return {x:pad+(ev[0]+ev[2])/2*cell,y:pad+(ev[1]+ev[3])/2*cell};
}
/* 圆角矩形路径 */
function rr(x,y,w,h,r){

  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);

/* 数字牌字号：只取八档值 */
function clueFont(){
  if(cell>=72)return 28;

/* 边状态差异 → 160ms 长出 / 淡入（纯渲染层） */
var prevState=null,animMap={};

  var now=performance.now();
  if(!prevState||prevState.length!==state.length){prevState=state.slice();animMap={};return}
  for(var e=0;e<state.length;e++){
    if(state[e]!==prevState[e]){if(!animMap[e])animMap[e]=now;prevState[e]=state[e]}
  }

function animP(e){

/* 格子四边中被环线使用的条数（目标态，只读） */
function clueCount(c){

function draw(){

/* ---------- 输入 ---------- */
function edgeAt(px,py){
  var best=-1,bd=1e9;

$("btnHint").addEventListener("click",hint);

window.addEventListener("keydown",function(e){

<script>
/* 覆盖层焦点管理（dialog 语义配套） */
(function(){

  var lastFocus=null;
  function focusFirst(el){

    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  /* 按钮图标注入：工具钮 + 覆盖层主 CTA（SW_ICON） */
  function $(id){return document.getElementById(id)}
  $("btnUndo").insertAdjacentHTML("afterbegin",window.SW_ICON("undo"));
  $("btnHint").insertAdjacentHTML("afterbegin",window.SW_ICON("hint"));
  $("btnReset").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
  $("btnLv").insertAdjacentHTML("afterbegin",window.SW_ICON("grid"));
  $("ovBtn").insertAdjacentHTML("afterbegin",window.SW_ICON("play"));
})();
</script>
</body>
