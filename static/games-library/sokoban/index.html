<style>
:root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-on-primary:#FFFFFF;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-hairline:#EFF1EE;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gap:16px;--g-sk-floor1:#F2EEE3;--g-sk-floor2:#E6E0CF;--g-sk-line:#D6CFBB;--g-sk-wall1:#6E7D73;--g-sk-wall2:#48564D;--g-sk-box1:#E3A85E;--g-sk-box2:#B07A34;--g-sk-player1:#F0785C;--g-sk-player2:#BE453C;color-scheme:light }
:root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-hairline:#262A27;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-sk-floor1:#24271F;--g-sk-floor2:#1B1E17;--g-sk-line:#30352C;--g-sk-wall1:#7C8C82;--g-sk-wall2:#4B5850;--g-sk-box1:#BD864C;--g-sk-box2:#7C5124;--g-sk-player1:#E88A72;--g-sk-player2:#B25A48;color-scheme:dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
background: var(--g-bg); color: var(--g-text);
min-height: 100vh; display: flex; justify-content: center;
padding: 16px 8px 30px;
-webkit-user-select: none; user-select: none;
-webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
touch-action: manipulation; overscroll-behavior: none;
}
.wrap { width: 100%; max-width: 480px; margin: 0 auto; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; padding: 0 2px; }
.sub { font-size: 14px; color: var(--g-muted); line-height: 1.4; flex: 1; min-width: 0; }
.lvtag { flex: none; display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 10px; background: var(--g-primary-soft); color: var(--g-on-soft); font-size: 14px; font-weight: 600; line-height: 1.4; }
.stats { display: flex; gap: 8px; margin-bottom: 10px; }
.stat { flex: 1; min-width: 0; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; animation: rise .38s ease-out both; }
.stat:nth-child(2) { animation-delay: 40ms; }   
.stat:nth-child(3) { animation-delay: 80ms; }
.stat .label { display: block; font-size: 12px; color: var(--g-muted); }
.stat .val { display: inline-block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
#stGoal { color: var(--g-warning); }
.stage { position: relative; animation: fadein .3s ease-out both; }
canvas { display: block; margin: 0 auto; touch-action: none; border-radius: var(--g-radius-inner); border: 1px solid var(--g-border); box-shadow: var(--g-shadow); }
.legend { margin: 10px 2px 0; text-align: center; font-size: 12px; color: var(--g-muted); animation: rise .38s ease-out both; animation-delay: 120ms; }
.msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; transition: color .16s ease-out; }
.tools { display: flex; gap: 8px; margin-bottom: 8px; }
.btn {
min-height: 44px; padding: 0 14px; flex: 1;
display: inline-flex; align-items: center; justify-content: center; gap: 6px;
border: 0; border-radius: var(--g-radius-btn);
background: var(--g-surface2); color: var(--g-text);
font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out;
}
.btn:active { transform: scale(.96); }
.btn[disabled] { opacity: .45; }
.btn.primary { background: var(--g-btn-primary); color: var(--g-on-primary); font-size: 16px; font-weight: 600; }
.swi { display: inline-block; vertical-align: -0.14em; flex: none; }
.dpad { display: flex; gap: 8px; }
.ctl {
flex: 1; min-height: 48px; border: 0; border-radius: var(--g-radius-inner);
background: var(--g-btn-primary); color: var(--g-on-primary);
font-family: inherit; font-size: 22px; font-weight: 700; cursor: pointer;
display: flex; align-items: center; justify-content: center;
transition: transform .14s ease-out, opacity .16s ease-out;
}
.ctl:active { transform: scale(.96); }
.foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
.overlay {
position: fixed; inset: 0; z-index: 10;
background: var(--g-scrim);
display: none; align-items: center; justify-content: center; padding: 20px;
overflow-y: auto;
}
.overlay.show { display: flex; animation: fadein .2s ease-out; }
.panel {
width: 100%; max-width: 340px; padding: 22px 18px;
background: var(--g-surface); border-radius: var(--g-radius);
box-shadow: var(--g-shadow); text-align: center;
animation: pop .3s ease-out;
}
.panel.win { animation: winpop .45s cubic-bezier(.18,.9,.3,1.4); }   
.panel h2 { margin: 0 0 6px; font-size: 18px; }
.panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.7; }
.panel .desc b { color: var(--g-primary-deep); }
.panel.win .desc b { color: var(--g-warning); }
.panel .btn { width: 100%; }
.lvgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; max-height: 320px; overflow-y: auto; }
.lvbtn {
min-height: 48px; border: 0; border-radius: 10px;
background: var(--g-surface2); color: var(--g-text);
font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
transition: transform .14s ease-out, background .16s ease-out;
}
.lvbtn:active { transform: scale(.96); }
.lvbtn[disabled] { opacity: .35; }
.lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes winpop { 0% { transform: scale(.86); opacity: 0; } 62% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes valpop { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
.stat .val.pop { animation: valpop .24s ease-out; }
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }
:focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>

 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>','arrow-left':'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 'arrow-up':'<path d="M12 19V5M6 11l6-6 6 6"/>','arrow-down':'<path d="M12 5v14M6 13l6 6 6-6"/>',

</script>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<body>
<div class="wrap">
  <header><span class="lvtag" id="lvTag">第 1 关</span><span class="sub">把木箱推到金色光圈上 · 一次只能推一个</span></header>
  <div class="stats">
    <div class="stat"><span class="label">关卡</span><span class="val" id="stLv">1 / 12</span></div>

  </div>

<script>
(function(){
"use strict";
var PAL={};
function palLoad(){
var s=getComputedStyle(document.documentElement);
function v(n){return s.getPropertyValue(n).trim()}
PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
success:v("--g-success"),warning:v("--g-warning"),
floor1:v("--g-sk-floor1"),floor2:v("--g-sk-floor2"),line:v("--g-sk-line"),
wall1:v("--g-sk-wall1"),wall2:v("--g-sk-wall2"),
box1:v("--g-sk-box1"),box2:v("--g-sk-box2"),
player1:v("--g-sk-player1"),player2:v("--g-sk-player2")};
}
window.__gOnTheme=function(){palLoad()};
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   
function colParse(c){
c=String(c).trim();
if(c.charAt(0)==="#")c=c.slice(1);
if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
var A=colParse(a),B=colParse(b);
return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
var GB=(function(){
var pending={},seq=0;
window.__gOnGameBridgeResult=function(cbId,ok,payload){
var cb=pending[cbId];if(!cb)return;
delete pending[cbId];
try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
};
function call(method,args){
return new Promise(function(resolve,reject){
var bridge=window.SmartWashGameBridge;
if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
var cbId="gb"+Date.now()+"_"+(++seq);
pending[cbId]={resolve:resolve,reject:reject};
try{bridge[method].apply(bridge,args.concat([cbId]));}
catch(e){delete pending[cbId];reject(e);}
});
}
return {
available:!!window.SmartWashGameBridge,
loadState:function(gameKey){return call("loadState",[gameKey]);},
saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
getLevels:function(gameKey){return call("getLevels",[gameKey]);}
};
})();
var DEFAULT_LEVELS=[
["######","#    #","# @$.#","#    #","######"],
["######","#    #","# @$ #","#  . #","######"],
["########","#      #","# .$ $.#","#  @   #","########"],
["########","#  .   #","# #$#  #","# @ $. #","#  #   #","########"],
["########","#  #   #","# @$ . #","#  $ . #","#  #   #","########"],
["######","#.   #","#@$  #","#  $.#","######"],
["########","#      #","#  $   #","# @$.  #","#  .   #","########"],
["########","# .   #","# $  $ #","#  @   #","#    . #","########"],
["########","#  .   #","# #$ # #","# @ $  #","#  .   #","#      #","########"],
["#######","#  .  #","# #$# #","# @ $ #","#  .  #","#######"],
["#######","#  .  #","# $#$ #","#  @  #","#  .  #","#######"],
["########","#  . . #","# $$$  #","#  @   #","#  .   #","########"]
];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY="sw.sokoban.v1.levels",LEVELS_VER_KEY="sw.sokoban.v1.levels.ver";
function applyLevels(list,version){
if(!Array.isArray(list)||!list.length)return false;
for(var i=0;i<list.length;i++){if(!Array.isArray(list[i])||!list[i].length)return false;}
LEVELS=list;
try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
return true;
}
function loadCachedLevels(){
try{
var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
var ok=Array.isArray(list)&&list.length;for(var i=0;i<list.length;i++){if(!Array.isArray(list[i])||!list[i].length){ok=false;break;}}
if(ok){LEVELS=list;return v;}
}catch(e){}
return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
if(!GB.available||!GB.getLevels)return;   
GB.getLevels("sokoban").then(function(res){
if(!res||!Array.isArray(res.levels))return;
var list=[];
for(var i=0;i<res.levels.length;i++){
try{list.push(JSON.parse(res.levels[i].dataJson));}catch(e){return;}
}
if(applyLevels(list,res.version||0)){
if(lv>LEVELS.length-1)lv=LEVELS.length-1;
save.lv=Math.min(save.lv,lv);persist();
loadLevel(lv);resize();
}
}).catch(function(){});
}
var KEY="sw.sokoban.v1";
function loadSave(){try{var s=JSON.parse(localStorage.getItem(KEY))||{};return{lv:Math.min(LEVELS.length-1,Math.max(0,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}
if(GB.available)GB.saveState("sokoban",save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
if(!GB.available||!GB.loadState)return;
GB.loadState("sokoban").then(function(res){
if(!res||!res.stateJson)return;
try{
var remote=JSON.parse(res.stateJson);
var rlv=parseInt(remote.lv,10)||0;
if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
}catch(e){}
}).catch(function(){});
}
var lv=save.lv,walls={},targets={},boxes={},px=0,py=0,rows=0,cols=0;
var moves=0,pushes=0,history=[],done=false;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var L={cell:0,ox:0,oy:0,W:0,H:0};
var DPR=1,lastT=0,enterT0=0;
var visP={x:0,y:0},visB={},prevBoxKeys={};
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function key(x,y){return x+","+y}
function isFloor(x,y){return !walls[key(x,y)]}
function boxAt(x,y){return boxes[key(x,y)]}
function parseKey(k){var a=k.split(",");return[+a[0],+a[1]]}
function loadLevel(n){
var rows0=LEVELS[n],w=0;
walls={};targets={};boxes={};
for(var y=0;y<rows0.length;y++){
w=Math.max(w,rows0[y].length);
for(var x=0;x<rows0[y].length;x++){
var c=rows0[y].charAt(x);
if(c==="#")walls[key(x,y)]=1;
else{
if(c==="."||c==="*"||c==="+")targets[key(x,y)]=1;
if(c==="$"||c==="*")boxes[key(x,y)]=1;
if(c==="@"||c==="+"){px=x;py=y}
}
}
}
cols=w;rows=rows0.length;
moves=0;pushes=0;history=[];done=false;
enterT0=performance.now();
snapVis();
updStats();
say("第 "+(lv+1)+" 关 · 把木箱推到金色光圈上");
}
function updStats(){
$("stLv").textContent=(lv+1)+" / "+LEVELS.length;
$("lvTag").textContent="第 "+(lv+1)+" 关";
var tn=0,total=0,k;
for(k in targets){total++;if(boxes[k])tn++}
popVal($("stGoal"),tn+"/"+total);
popVal($("stMoves"),moves);
$("btnUndo").disabled=!history.length;
}
function popVal(el,v){var s=String(v);if(el.textContent!==s){el.textContent=s;el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");}}
function tryMove(dx,dy){
if(done)return;
var nx=px+dx,ny=py+dy;
if(!isFloor(nx,ny))return;
var b=boxAt(nx,ny);
if(b){
var bx=nx+dx,by=ny+dy;
if(!isFloor(bx,by)||boxAt(bx,by))return;
history.push({p:[px,py],b:b,mv:1});
delete boxes[key(nx,ny)];boxes[key(bx,by)]=1;
px=nx;py=ny;pushes++;
}else{
history.push({p:[px,py],b:null,mv:0});
px=nx;py=ny;
}
moves++;
updStats();
checkWin();
}
function undo(){
if(!history.length||done)return;
var h=history.pop();
if(h.b){var cur=key(px,py);delete boxes[cur];boxes[key(h.b[0],h.b[1])]=1}
px=h.p[0];py=h.p[1];
if(h.mv)pushes--;
moves--;
updStats();
say("撤销一步");
}
function checkWin(){
for(var k in targets)if(!boxes[k]){return}
done=true;
if(lv<LEVELS.length-1){
save.lv=Math.max(save.lv,lv+1);persist();
$("ovTitle").textContent="过关！";
$("ovDesc").innerHTML="用步 "+moves+" · 推动 "+pushes+"<br>已解锁第 "+(lv+2)+" 关";
setOvBtn("下一关","play");
}else{
$("ovTitle").textContent="全部通关！";
$("ovDesc").innerHTML="12 关全部完成<br>总用步 "+moves+" · 推动 "+pushes;
setOvBtn("回到第 1 关","rotate");
}
$("panel").classList.add("win");
if(GB.available)GB.reportScore("sokoban",{metricValue:lv+1,metricExtra:pushes}).catch(function(){});
$("overlay").classList.add("show");
}
function setOvBtn(t,icon){$("ovBtn").innerHTML=window.SW_ICON(icon)+t}
function resize(){
var w=cv.parentElement.clientWidth||360;
DPR=Math.min(window.devicePixelRatio||1,2);
L.cell=Math.floor((w-4)/cols);
L.W=L.cell*cols;L.H=L.cell*rows;
cv.style.width=L.W+"px";cv.style.height=L.H+"px";
cv.width=Math.round(L.W*DPR);cv.height=Math.round(L.H*DPR);
}
function rr(x,y,w2,h2,r){
r=Math.max(0,Math.min(r,w2/2,h2/2));
ctx.beginPath();
ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);
ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();
}
function snapVis(){
visP.x=px;visP.y=py;visB={};prevBoxKeys={};
for(var k in boxes){
var a=parseKey(k);
visB[k]={x:a[0],y:a[1],pop:0};
prevBoxKeys[k]=1;
}
}
function syncVis(now){
var k,pk,a;
for(k in boxes){
if(!visB[k]){
a=parseKey(k);
if(!isFinite(a[0])||!isFinite(a[1]))continue;
var from=null,pa;
for(pk in prevBoxKeys){
if(!boxes[pk]){
pa=parseKey(pk);
if(Math.abs(pa[0]-a[0])+Math.abs(pa[1]-a[1])===1){from=pk;break}
}
}
var vb=visB[from]||null;
visB[k]={x:vb?vb.x:a[0],y:vb?vb.y:a[1],pop:targets[k]?now:0};
}
}
for(k in visB)if(!boxes[k])delete visB[k];
prevBoxKeys={};for(k in boxes)prevBoxKeys[k]=1;
}
function easeVis(dt){
var k=window.__gRM?1:Math.min(1,dt/70),key;
visP.x+=(px-visP.x)*k;visP.y+=(py-visP.y)*k;
for(key in visB){
var a=parseKey(key),b=visB[key];
b.x+=(a[0]-b.x)*k;b.y+=(a[1]-b.y)*k;
}
}
function drawFloorCell(x,y,gap,rad){
var w=L.cell-2*gap;
ctx.fillStyle=((x+y)%2===0)?PAL.floor1:PAL.floor2;
rr(x*L.cell+gap,y*L.cell+gap,w,w,rad);ctx.fill();
ctx.lineWidth=1;ctx.strokeStyle=PAL.line;
rr(x*L.cell+gap+0.5,y*L.cell+gap+0.5,w-1,w-1,rad);ctx.stroke();
}
function drawWall(x,y,gap,rad){
var x0=x*L.cell,y0=y*L.cell,w=L.cell-2*gap;
ctx.save();
ctx.shadowColor="rgba(0,0,0,0.26)";ctx.shadowBlur=L.cell*0.10;ctx.shadowOffsetY=L.cell*0.045;
var g=ctx.createLinearGradient(0,y0+gap,0,y0+gap+w);
g.addColorStop(0,PAL.wall1);g.addColorStop(0.45,PAL.wall1);g.addColorStop(1,PAL.wall2);
ctx.fillStyle=g;rr(x0+gap,y0+gap,w,w,rad);ctx.fill();
ctx.restore();
ctx.lineWidth=Math.max(1,L.cell*0.03);ctx.strokeStyle=colMix(PAL.wall1,WHITE,0.22);
rr(x0+gap+0.5,y0+gap+0.5,w-1,w-1,rad);ctx.stroke();
ctx.lineWidth=Math.max(1.2,L.cell*0.05);ctx.strokeStyle=colMix(PAL.wall1,WHITE,0.45);
ctx.beginPath();ctx.moveTo(x0+gap+rad*0.7,y0+gap+1.2);ctx.lineTo(x0+gap+w-rad*0.7,y0+gap+1.2);ctx.stroke();
}
function drawTarget(cx,cy,now){
var r=L.cell;
var pulse=window.__gRM?0.35:(0.22+0.10*Math.sin(now/300));
var gl=ctx.createRadialGradient(cx,cy,r*0.05,cx,cy,r*0.46);
gl.addColorStop(0,colMix(PAL.warning,WHITE,0.10));
gl.addColorStop(1,colMix(PAL.warning,WHITE,0));
ctx.globalAlpha=pulse;ctx.fillStyle=gl;
ctx.beginPath();ctx.arc(cx,cy,r*0.46,0,Math.PI*2);ctx.fill();
ctx.globalAlpha=1;
ctx.strokeStyle=PAL.warning;ctx.lineWidth=Math.max(2,r*0.07);
ctx.beginPath();ctx.arc(cx,cy,r*0.27,0,Math.PI*2);ctx.stroke();
ctx.fillStyle=PAL.warning;
ctx.beginPath();ctx.arc(cx,cy,Math.max(2,r*0.075),0,Math.PI*2);ctx.fill();
}
function drawBox(x0,y0,on,pop,now){
var cell=L.cell,inset=cell*0.06,w=cell-2*inset,r=Math.min(9,cell*0.20),cx=x0+cell/2,cy=y0+cell/2;
var sc=1;
if(pop&&!window.__gRM){var p=Math.max(0,Math.min(1,(now-pop)/220));sc=1+0.12*Math.sin(p*Math.PI)}
ctx.save();
ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-cx,-cy);
ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=cell*0.10;ctx.shadowOffsetY=cell*0.05;
var g=ctx.createLinearGradient(0,y0+inset,0,y0+inset+w);
if(on){g.addColorStop(0,PAL.success);g.addColorStop(1,colShade(PAL.success,-0.28))}
else{g.addColorStop(0,PAL.box1);g.addColorStop(1,PAL.box2)}
ctx.fillStyle=g;rr(x0+inset,y0+inset,w,w,r);ctx.fill();
ctx.restore();
ctx.lineWidth=Math.max(1.2,cell*0.035);
ctx.strokeStyle=on?colShade(PAL.success,-0.42):colMix(PAL.box2,BLACK,0.22);
rr(x0+inset+0.5,y0+inset+0.5,w-1,w-1,r);ctx.stroke();
ctx.lineWidth=Math.max(1,cell*0.03);
ctx.strokeStyle=on?colMix(PAL.success,WHITE,0.45):colMix(PAL.box1,WHITE,0.55);
rr(x0+inset+cell*0.06,y0+inset+cell*0.06,w-cell*0.12,w-cell*0.12,r*0.8);ctx.stroke();
ctx.strokeStyle=on?colMix(PAL.success,BLACK,0.18):colMix(PAL.box2,BLACK,0.20);
ctx.lineWidth=Math.max(1,cell*0.028);
ctx.beginPath();
ctx.moveTo(x0+inset+cell*0.10,y0+inset+cell*0.10);ctx.lineTo(x0+inset+w-cell*0.10,y0+inset+w-cell*0.10);
ctx.moveTo(x0+inset+w-cell*0.10,y0+inset+cell*0.10);ctx.lineTo(x0+inset+cell*0.10,y0+inset+w-cell*0.10);
ctx.stroke();
}
function drawPlayer(cx,cy,now){
var r=L.cell*0.34;
ctx.save();
ctx.shadowColor="rgba(0,0,0,0.34)";ctx.shadowBlur=L.cell*0.09;ctx.shadowOffsetY=L.cell*0.05;
var g=ctx.createRadialGradient(cx-r*0.35,cy-r*0.40,r*0.15,cx,cy,r*1.05);
g.addColorStop(0,colMix(PAL.player1,WHITE,0.55));
g.addColorStop(0.45,PAL.player1);
g.addColorStop(1,PAL.player2);
ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
ctx.restore();
ctx.lineWidth=Math.max(1.2,L.cell*0.035);ctx.strokeStyle=colMix(PAL.player2,BLACK,0.35);
ctx.beginPath();ctx.arc(cx,cy,r-ctx.lineWidth*0.5,0,Math.PI*2);ctx.stroke();
ctx.globalAlpha=0.85;ctx.fillStyle=WHITE;
ctx.beginPath();ctx.ellipse(cx-r*0.32,cy-r*0.42,r*0.24,r*0.13,-0.5,0,Math.PI*2);ctx.fill();
ctx.globalAlpha=1;
var er=r*0.16,ex=r*0.34,ey=-r*0.05;
ctx.fillStyle=WHITE;
ctx.beginPath();ctx.arc(cx-ex,cy+ey,er*1.25,0,Math.PI*2);ctx.arc(cx+ex,cy+ey,er*1.25,0,Math.PI*2);ctx.fill();
ctx.fillStyle=PAL.text;
ctx.beginPath();ctx.arc(cx-ex,cy+ey,er*0.62,0,Math.PI*2);ctx.arc(cx+ex,cy+ey,er*0.62,0,Math.PI*2);ctx.fill();
}
function drawHints(now){
var dirs=[[1,0],[-1,0],[0,1],[0,-1]],cx=visP.x*L.cell+L.cell/2,cy=visP.y*L.cell+L.cell/2;
var a=window.__gRM?0.4:(0.30+0.16*Math.sin(now/260));
for(var i=0;i<4;i++){
var dx=dirs[i][0],dy=dirs[i][1],nx=px+dx,ny=py+dy;
if(!isFloor(nx,ny))continue;
var b=boxAt(nx,ny);
if(b&&(!isFloor(nx+dx,ny+dy)||boxAt(nx+dx,ny+dy)))continue;
ctx.globalAlpha=a;ctx.fillStyle=PAL.muted;
ctx.beginPath();ctx.arc(cx+dx*L.cell*0.44,cy+dy*L.cell*0.44,Math.max(2,L.cell*0.05),0,Math.PI*2);ctx.fill();
}
ctx.globalAlpha=1;
}
function draw(now){
now=now||performance.now();
var dt=Math.max(0,Math.min(64,now-(lastT||now)));lastT=now;
ctx.setTransform(DPR,0,0,DPR,0,0);
ctx.clearRect(0,0,L.W,L.H);
var rm=window.__gRM;
var gb=ctx.createLinearGradient(0,0,0,L.H);
gb.addColorStop(0,PAL.floor1);gb.addColorStop(1,PAL.floor2);
ctx.fillStyle=gb;rr(0.5,0.5,L.W-1,L.H-1,Math.min(12,L.W*0.03));ctx.fill();
var gl=ctx.createRadialGradient(L.W*0.5,-L.H*0.15,L.H*0.05,L.W*0.5,-L.H*0.15,L.H*0.9);
gl.addColorStop(0,"rgba(255,255,255,0.16)");gl.addColorStop(1,"rgba(255,255,255,0)");
ctx.fillStyle=gl;ctx.fillRect(0,0,L.W,L.H);
var gap=Math.max(1,L.cell*0.045),rad=Math.min(8,L.cell*0.16),x,y,k;
syncVis(now);easeVis(dt);
for(y=0;y<rows;y++){
var rp=rm?1:Math.max(0,Math.min(1,(now-enterT0-y*35)/260));
for(x=0;x<cols;x++){
k=key(x,y);
ctx.save();
if(rp<1){ctx.globalAlpha=rp;ctx.translate(0,(1-rp)*L.cell*0.18)}
if(walls[k])drawWall(x,y,gap,rad);
else{
drawFloorCell(x,y,gap,rad);
if(targets[k])drawTarget(x*L.cell+L.cell/2,y*L.cell+L.cell/2,now);
}
ctx.restore();
}
}
var bkeys=Object.keys(visB);
for(var i=0;i<bkeys.length;i++){
var bk=bkeys[i],bb=visB[bk];
if(!isFinite(bb.x)||!isFinite(bb.y))continue;
drawBox(bb.x*L.cell,bb.y*L.cell,!!targets[bk],bb.pop,now);
}
var scx=visP.x*L.cell,scy=visP.y*L.cell;
ctx.fillStyle=PAL.soft;rr(scx+2,scy+2,L.cell-4,L.cell-4,Math.min(10,L.cell*0.2));ctx.fill();
drawHints(now);
ctx.strokeStyle=PAL.primary;ctx.lineWidth=Math.max(2,L.cell*0.06);
ctx.globalAlpha=rm?0.85:(0.55+0.25*Math.sin(now/280));
ctx.beginPath();ctx.arc(scx+L.cell/2,scy+L.cell/2,L.cell*0.46,0,Math.PI*2);ctx.stroke();
ctx.globalAlpha=1;
drawPlayer(scx+L.cell/2,scy+L.cell/2,now);
}
function loop(now){try{draw(now||performance.now())}catch(e){}requestAnimationFrame(loop)}
var swipe=null;
cv.addEventListener("pointerdown",function(e){
swipe={x:e.clientX,y:e.clientY};
try{cv.setPointerCapture(e.pointerId)}catch(err){}
e.preventDefault();
});
cv.addEventListener("pointerup",function(e){
if(!swipe)return;
var dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;
swipe=null;
if(Math.abs(dx)<14&&Math.abs(dy)<14)return;
if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);else tryMove(0,dy>0?1:-1);
});
cv.addEventListener("pointercancel",function(){swipe=null});
function bindHold(id,fn,repeat){
var el=$(id),iv=null;
el.addEventListener("pointerdown",function(e){
try{el.setPointerCapture(e.pointerId)}catch(err){}
e.preventDefault();fn();
if(repeat)iv=setInterval(fn,150);
});
function stop(){if(iv){clearInterval(iv);iv=null}}
el.addEventListener("pointerup",stop);
el.addEventListener("pointercancel",stop);
}
bindHold("cUp",function(){tryMove(0,-1)},true);
bindHold("cDown",function(){tryMove(0,1)},true);
bindHold("cLeft",function(){tryMove(-1,0)},true);
bindHold("cRight",function(){tryMove(1,0)},true);
window.addEventListener("keydown",function(e){
var k=e.key;
if(k==="ArrowUp"||k==="w"){tryMove(0,-1);e.preventDefault()}
else if(k==="ArrowDown"||k==="s"){tryMove(0,1);e.preventDefault()}
else if(k==="ArrowLeft"||k==="a"){tryMove(-1,0);e.preventDefault()}
else if(k==="ArrowRight"||k==="d"){tryMove(1,0);e.preventDefault()}
else if(k==="z"||k==="Z"){undo()}
});
$("btnUndo").addEventListener("click",undo);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){
if(done)return;
var g=$("lvgrid");g.hidden=false;
g.innerHTML="";
for(var i=0;i<LEVELS.length;i++){
var b=document.createElement("button");
b.className="lvbtn"+(i<save.lv?" done":"");
b.textContent=i+1;
b.disabled=i>save.lv;
b.addEventListener("click",function(){
lv=+this.textContent-1;save.lv=Math.max(save.lv,lv);persist();
loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
});
g.appendChild(b);
}
$("ovTitle").textContent="选择关卡";
$("ovDesc").textContent="已通关的关卡会标绿";
setOvBtn("取消","x");
$("overlay").classList.add("show");
});
$("ovBtn").addEventListener("click",function(){
hideOverlay();
if(done){
if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
else{lv++;loadLevel(lv)}
}
});
function hideOverlay(){$("overlay").classList.remove("show");$("panel").classList.remove("win")}
window.addEventListener("resize",resize);
palLoad();loadLevel(lv);resize();loop();
setOvBtn("下一关","play");
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）+ 按钮图标注入（内联 SVG，零外链） */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(els.length){
    function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
    var lastFocus=null;
    function focusFirst(el){
      if(el.dataset.foc)return;el.dataset.foc="1";
      if(!lastFocus)lastFocus=document.activeElement;
      var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
    }
    function restore(el){
      if(!el.dataset.foc)return;delete el.dataset.foc;
      if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
    }
    function trap(el,e){
      if(e.key!=="Tab")return;
      var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
      if(!f.length)return;
      var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
      else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
    }
    function watch(el){
      try{new MutationObserver(function(){
        if(shown(el))focusFirst(el);else restore(el);
      }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
      el.addEventListener("keydown",function(e){trap(el,e)});
    }
    for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  }
  function $(id){return document.getElementById(id)}
  var dp=[["cUp","arrow-up"],["cDown","arrow-down"],["cLeft","arrow-left"],["cRight","arrow-right"]],j;
  for(j=0;j<dp.length;j++)$(dp[j][0]).innerHTML=window.SW_ICON(dp[j][1]);
  $("btnUndo").insertAdjacentHTML("afterbegin",window.SW_ICON("undo"));
  $("btnReset").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
  $("btnLv").insertAdjacentHTML("afterbegin",window.SW_ICON("grid"));
})();
</script>
