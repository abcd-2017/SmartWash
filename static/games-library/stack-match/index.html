<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（落地投影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}

    face1:v("--g-sm-face1"),face2:v("--g-sm-face2"),faceHi:v("--g-sm-face-hi"),cover:v("--g-sm-cover"),
    back1:v("--g-sm-back1"),back2:v("--g-sm-back2"),backHi:v("--g-sm-back-hi"),
    well:v("--g-sm-well"),slot:v("--g-sm-slot"),slotHi:v("--g-sm-slot-hi"),

    bp:[v("--g-bp1"),v("--g-bp2"),v("--g-bp3"),v("--g-bp4"),v("--g-bp5"),v("--g-bp6")]};
}
window.__gOnTheme=function(){palLoad();paint();};//App 推送主题时刷新调色板并重绘
/* ========== 引擎块（遮挡判定 / 槽位三消 / 逆向可解构造，供工具独立抽取回归） ========== */
/*SM-ENGINE-BEGIN*/
function intOK(v,lo,hi){ return isFinite(v)&&Math.floor(v)===v&&v>=lo&&v<=hi; }
/* 2×2 半格矩形是否重叠（x/y 为左上角半格坐标） */
function smRectOverlap(ax,ay,bx,by){ return ax<bx+2&&bx<ax+2&&ay<by+2&&by<ay+2; }
/* 遮挡关系：coveredBy[j]=被 j 压住的牌号列表；coverCnt[i]=压住 i 的牌数（为 0 即可点） */
function smBuildCover(arr){
  var n=arr.length,coveredBy=[],coverCnt=new Array(n),i,j;
  for(i=0;i<n;i++){coveredBy.push([]);coverCnt[i]=0;}
  for(i=0;i<n;i++)for(j=0;j<n;j++){
    if(i===j)continue;
    if(arr[j][2]>arr[i][2]&&smRectOverlap(arr[i][0],arr[i][1],arr[j][0],arr[j][1])){coveredBy[j].push(i);coverCnt[i]++;}
  }
  return {coveredBy:coveredBy,coverCnt:coverCnt};
}
/* 槽位三消：若有图案凑满 3 张则从槽位移除，返回被消图案（无则 -1）。slot 元素须带 .p */
function smResolveSlot(slot){
  var cnt={},i,p;
  for(i=0;i<slot.length;i++){p=slot[i].p;cnt[p]=(cnt[p]||0)+1;}
  for(var q in cnt){
    if(cnt[q]>=3){
      var t=3;
      for(i=slot.length-1;i>=0&&t>0;i--){ if(slot[i].p==q){slot.splice(i,1);t--;} }
      return +q;
    }
  }
  return -1;
}
/* 构造用场上落点：每个锚点位唯一合法层 = 最高重叠层+1（贴堆生长，天然满足同层不重叠与层间支撑） */
function smPickPos(top,gw,gh,w,h,zl,rng,placed){
  var cx,cy,i;
  if(!placed.length){cx=(w-2)/2;cy=(h-2)/2;}
  else{
    var sx=0,sy=0;
    for(i=0;i<placed.length;i++){sx+=placed[i][0];sy+=placed[i][1];}
    cx=sx/placed.length;cy=sy/placed.length;
  }
  var sigma=Math.max(w,h)/2.4,best=null,bestW=-1;
  for(var y=0;y<gh;y++)for(var x=0;x<gw;x++){
    var t=top[y*gw+x],z;
    if(t<0)z=0;else{z=t+1;if(z>zl)continue;}
    var d2=(x-cx)*(x-cx)+(y-cy)*(y-cy);
    var wgt=Math.exp(-d2/(2*sigma*sigma))*(t>=0?2.6/(1+0.45*t):1)*(0.5+rng());

/*
 * 逆向消除构造（洗牌保持可解的核心）：从「终局空局面」反向放回全部牌。
 * 每步二选一：补套 un-eliminate（槽 +2 张同图案、放 1 张回场上/盲堆）或
 * 回放 un-pick（槽 -1、放 1 张回场上/盲堆）；正向按构造逆序取牌必然存在全消路径。
 * 两阶段：先在抽象层 DFS 带记忆化回溯搜出合法步序（只管预算与槽位 ≤6 约束），
 * 再按步序落子（新放的牌相对已放牌必须可见 → 贴堆生长）。
 * spec={k,w,h,zl,drawTiles,pats,slotStart,dead}：pats 待放图案多重集（场上+盲堆），
 * slotStart 逆向起点槽位（=构造结束槽位状态），dead 每图案已移出暂存区的张数。
 * 返回 {tiles:[[x,y,z,p]…], draw:[p…](draw[0]=堆顶)} 或 null（空间/预算不可行）。
 */
function smConstruct(spec,rng){
  var k=spec.k,w=spec.w,h=spec.h,zl=spec.zl,drawTiles=spec.drawTiles;
  var pats=spec.pats,slotStart=spec.slotStart,dead=spec.dead||[];
  if(!intOK(drawTiles,0,pats.length-1))return null;
  var cnt=new Array(k).fill(0),i,p;
  for(i=0;i<pats.length;i++)cnt[pats[i]]++;
  var a=new Array(k).fill(0);
  for(i=0;i<slotStart.length;i++)a[slotStart[i]]++;
  var d=dead.slice();
  var l=new Array(k).fill(0),c1=new Array(k).fill(0),c2=new Array(k).fill(0);
  var totC1=0,totC2=0;
  for(p=0;p<k;p++){
    var active=cnt[p]+a[p];
    if((active+d[p])%3!==0)return null;      // 每图案可用张数须为 3 的倍数（缺口由暂存区补齐）
    l[p]=active%3;                            // 终局必然剩余的散牌数
    var r=(active+d[p])/3;
    c1[p]=r-(d[p]>0?1:0);
    if(c1[p]<0)return null;
    c2[p]=2*c1[p]-a[p]+l[p];
    if(c2[p]<0)return null;
    totC1+=c1[p];totC2+=c2[p];
  }
  if(totC1+totC2!==pats.length)return null;
  /* —— 第一阶段：抽象步序 DFS（带记忆化回溯，只管补套/回放预算与槽位约束）—— */
  var slot=[];
  for(p=0;p<k;p++)for(i=0;i<l[p];i++)slot.push(p);
  var done1v=new Array(k).fill(0),done2v=new Array(k).fill(0);
  var steps=[],__nodes=0;
  var memo=new Set();
  function smKey(){
    var s=done1v.join(",")+"|"+done2v.join(",")+"|";
    var ss=slot.slice().sort(function(m,n2){return m-n2});
    for(var i2=0;i2<ss.length;i2++)s+=ss[i2];
    return s;
  }
  function smDfs(){
    if(steps.length===pats.length)return true;   // 预算耗尽时代数保证槽位回到 slotStart
    if(++__nodes>60000)throw{cap:1};
    var kk=smKey();
    if(memo.has(kk))return false;
    var opts=[],i2,p2;
    if(slot.length<=4){                          // 补套：逆操作槽位 ≤4 才能执行
      for(p2=0;p2<k;p2++){
        if(c1[p2]-done1v[p2]<=0)continue;
        var sc=0;
        for(i2=0;i2<slot.length;i2++)if(slot[i2]===p2)sc++;
        opts.push({t:1,p:p2,w:(3*Math.max(0,c2[p2]-done2v[p2]-sc)+1)*(0.5+rng())});
      }
    }
    if(slot.length>=1){                          // 回放：从槽内抽一张（盈余图案优先）
      var seen={};
      for(i2=0;i2<slot.length;i2++){
        var q=slot[i2];
        if(c2[q]-done2v[q]<=0||seen[q])continue;
        seen[q]=1;
        var sq=0;
        for(var sj=0;sj<slot.length;sj++)if(slot[sj]===q)sq++;
        opts.push({t:0,p:q,w:(1+Math.max(0,sq-(c2[q]-done2v[q])))*(0.5+rng())});
      }
    }
    opts.sort(function(A,B){return B.w-A.w});
    for(i2=0;i2<opts.length;i2++){
      var o=opts[i2];
      steps.push(o);
      if(o.t===1){slot.push(o.p,o.p);done1v[o.p]++;}
      else{slot.splice(slot.indexOf(o.p),1);done2v[o.p]++;}
      if(smDfs())return true;
      if(o.t===1){slot.length-=2;done1v[o.p]--;}
      else{slot.push(o.p);done2v[o.p]--;}
      steps.pop();
    }
    memo.add(kk);
    return false;
  }
  try{ if(!smDfs())return null; }catch(e){ if(e&&e.cap)return null; throw e; }
  /* —— 第二阶段：按步序落子（盲堆/场上），与步序可行性解耦 —— */
  var gw=w-1,gh=h-1;
  var top=new Int16Array(gw*gh).fill(-1);
  var placed=[],drawList=[];
  var drawLeft=drawTiles,remaining=pats.length;
  for(i=0;i<steps.length;i++){
    var st=steps[i];
    remaining--;
    var toDraw=drawLeft>0&&(remaining<drawLeft||rng()<drawLeft/(remaining+1));
    if(toDraw){
      drawLeft--;drawList.push(st.p);
    }else{
      var pos=smPickPos(top,gw,gh,w,h,zl,rng,placed);
      if(!pos)return null;
      placed.push([pos[0],pos[1],pos[2],st.p]);
      var dy,dx;
      for(dy=-1;dy<=1;dy++)for(dx=-1;dx<=1;dx++){
        var nx=pos[0]+dx,ny=pos[1]+dy;
        if(nx<0||ny<0||nx>=gw||ny>=gh)continue;
        var idx=ny*gw+nx;
        if(top[idx]<pos[2])top[idx]=pos[2];
      }
    }
  }
  if(drawLeft>0)return null;                     // 场上放不下（空间不足）
  var out=[];
  for(i=drawList.length-1;i>=0;i--)out.push(drawList[i]);   // draw[0]=堆顶
  return {tiles:placed,draw:out};
}
/*SM-ENGINE-END*/

function parseStackMatchLevels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={},i,j;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    var d;
    try{d=JSON.parse(item.dataJson)}catch(e){return null}
    if(!d||typeof d!=="object"||Array.isArray(d))return null;
    if(typeof d.name!=="string"||!d.name.length||d.name.length>32)return null;
    if(!intOK(d.k,3,18))return null;
    if(!intOK(d.w,6,16)||!intOK(d.h,6,18)||(d.w&1)||(d.h&1))return null;
    if(!intOK(d.zl,0,7))return null;
    if(!Array.isArray(d.tiles)||!d.tiles.length||d.tiles.length>220)return null;
    if(!Array.isArray(d.draw)||d.draw.length>120)return null;
    if((d.tiles.length+d.draw.length)%3)return null;
    var cnt=new Array(d.k).fill(0),maxz=-1;
    for(j=0;j<d.tiles.length;j++){
      var t=d.tiles[j];
      if(!Array.isArray(t)||t.length!==4)return null;
      if(!intOK(t[0],0,d.w-2)||!intOK(t[1],0,d.h-2)||!intOK(t[2],0,d.zl)||!intOK(t[3],0,d.k-1))return null;
      cnt[t[3]]++;if(t[2]>maxz)maxz=t[2];
    }
    for(j=0;j<d.draw.length;j++){
      if(!intOK(d.draw[j],0,d.k-1))return null;
      cnt[d.draw[j]]++;
    }
    for(j=0;j<d.k;j++){ if(!cnt[j]||cnt[j]%3)return null; }   // 全图案至少一组且成三倍数
    if(maxz!==d.zl)return null;
    var n=d.tiles.length,a,b,sup;
    for(a=0;a<n;a++){                                          // 层叠合法性：同层不重叠 + 有直接支撑
      if(d.tiles[a][2]===0)continue;
      sup=false;
      for(b=0;b<n;b++){
        if(a===b)continue;
        if(d.tiles[b][2]===d.tiles[a][2]&&smRectOverlap(d.tiles[a][0],d.tiles[a][1],d.tiles[b][0],d.tiles[b][1]))return null;
        if(d.tiles[b][2]===d.tiles[a][2]-1&&smRectOverlap(d.tiles[a][0],d.tiles[a][1],d.tiles[b][0],d.tiles[b][1]))sup=true;
      }
      if(!sup)return null;
    }
    var no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=true;
    list.push({no:no,name:d.name,k:d.k,w:d.w,h:d.h,zl:d.zl,tiles:d.tiles,draw:d.draw});
  }

}

/* 牌面图案：内联矢量（圆 / 方 / 三角 / 菱 / 星 / 环），渐变体 + 恒白高光 + 深色描边 */
function drawGlyph(p,cx,cy,s,alpha){
  var color=PAL.bp[p%6]||PAL.primary;
  var shape=(p/6)|0;
  ctx.save();
  if(alpha!==undefined)ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  if(shape===5){
    ctx.strokeStyle=color;ctx.lineWidth=Math.max(2,s*0.16);
    ctx.beginPath();ctx.arc(cx,cy,s*0.4,0,7);ctx.stroke();
  }else if(shape===0){ctx.beginPath();ctx.arc(cx,cy,s*0.44,0,7);ctx.fill();}
  else if(shape===1){rr(cx-s*0.4,cy-s*0.4,s*0.8,s*0.8,s*0.2);ctx.fill();}
  else if(shape===2){
    ctx.beginPath();ctx.moveTo(cx,cy-s*0.46);ctx.lineTo(cx+s*0.46,cy+s*0.34);ctx.lineTo(cx-s*0.46,cy+s*0.34);
    ctx.closePath();ctx.fill();
  }else if(shape===3){
    ctx.beginPath();ctx.moveTo(cx,cy-s*0.46);ctx.lineTo(cx+s*0.4,cy);ctx.lineTo(cx,cy+s*0.46);ctx.lineTo(cx-s*0.4,cy);
    ctx.closePath();ctx.fill();
  }else if(shape===4){
    ctx.beginPath();
    for(var i=0;i<10;i++){
      var a=-Math.PI/2+i*Math.PI/5,rad=(i%2===0)?s*0.5:s*0.22;
      var gx=cx+Math.cos(a)*rad,gy=cy+Math.sin(a)*rad;
      if(i===0)ctx.moveTo(gx,gy);else ctx.lineTo(gx,gy);
    }
    ctx.closePath();ctx.fill();
  }
  // 顶部高光：把平面色块拉回「轻立体」牌面（恒白豁免）
  ctx.fillStyle=WHITE;ctx.globalAlpha=(alpha!==undefined?alpha:1)*0.45;
  ctx.beginPath();ctx.arc(cx-s*0.14,cy-s*0.16,s*0.11,0,7);ctx.fill();
  ctx.restore();
}
/* 牌背：品牌绿渐变 + 内框亮线 + 中心饰点（盲堆「还没翻」的物理感） */
function drawCardBack(x,y,w,h){
  ctx.save();
  ctx.shadowColor=PAL.shadow;ctx.shadowBlur=Math.max(2,w*0.09);ctx.shadowOffsetY=Math.max(1,w*0.05);
  var g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,PAL.back1);g.addColorStop(1,PAL.back2);
  ctx.fillStyle=g;rr(x,y,w,h,Math.min(10,w*0.18));ctx.fill();
  ctx.restore();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.backHi;ctx.globalAlpha=.9;
  rr(x+w*0.16,y+h*0.16,w*0.68,h*0.68,Math.min(6,w*0.12));ctx.stroke();
  ctx.globalAlpha=1;
  ctx.fillStyle=PAL.backHi;
  ctx.beginPath();ctx.arc(x+w/2,y+h/2,Math.max(2,w*0.09),0,7);ctx.fill();
}
function tileRect(t){
  return {x:G.ox+t.x*G.cell/2,y:G.oy+t.y*G.cell/2,w:G.cell-2,h:G.cell-2};
}
/* 场上牌：可点（亮）/ 被压（暗）两态；牌体渐变 + 顶光 + 落地投影 */
function drawFieldTile(t,free,now){
  var r=tileRect(t);
  var e=entrance[t.id];
  var sc=1,dy=0,al=1;
  if(e){                                  // 入场：缩放 .86→1 + 上移 10% + 淡入（160ms ease-out，按行错位）
    var k=Math.max(0,Math.min(1,(now-e)/160));
    if(k<1){var ez=1-Math.pow(1-k,2);sc=.86+.14*ez;dy=(1-ez)*r.h*0.10;al=.35+.65*ez;}
    else entrance[t.id]=0;
  }
  var cx=r.x+r.w/2,cy=r.y+r.h/2+dy;
  var w=r.w*sc,h=r.h*sc,x=cx-w/2,y=cy-h/2;
  ctx.save();
  ctx.globalAlpha=al;
  ctx.shadowColor=PAL.shadow;ctx.shadowBlur=Math.max(2,r.w*0.10);ctx.shadowOffsetY=Math.max(1,r.w*0.06);
  var g=ctx.createLinearGradient(0,y,0,y+h);
  if(free){g.addColorStop(0,PAL.face1);g.addColorStop(1,PAL.face2);}
  else{g.addColorStop(0,PAL.cover);g.addColorStop(1,colShade(PAL.cover,-0.10));}
  ctx.fillStyle=g;rr(x,y,w,h,8);ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.globalAlpha=al;
  // 被压牌用更深的描边 + 更淡的图案，与可点牌拉开「能不能点」的层次
  ctx.lineWidth=free?1.5:1;
  ctx.strokeStyle=free?PAL.deep:colShade(PAL.cover,-0.38);
  rr(x+.5,y+.5,w-1,h-1,8);ctx.stroke();
  // 顶缘亮线：牌体厚度感
  ctx.globalAlpha=al*.5;ctx.strokeStyle=free?PAL.faceHi:colShade(PAL.cover,-0.28);ctx.lineWidth=1;
  rr(x+2,y+2,w-4,h-4,6);ctx.stroke();
  ctx.restore();
  drawGlyph(t.p,cx,cy,r.w*0.62*sc,al*(free?1:.62));
}
function drawPile(){
  var p=G.pile;
  if(drawIdx<draw.length){
    var e=entrance.draw,al=1;
    if(e){                                    // 盲堆入场：整叠浮入（160ms）
      var k=Math.max(0,Math.min(1,(nowMs-e)/160));
      if(k<1){var ez=1-Math.pow(1-k,2);al=.4+.6*ez;}
      else entrance.draw=0;
    }
    ctx.save();
    ctx.globalAlpha=al;
    drawCardBack(p.x+5,p.y+5,p.w,p.h-2);
    drawCardBack(p.x+2.5,p.y+2.5,p.w,p.h-2);
    ctx.shadowColor=PAL.shadow;ctx.shadowBlur=Math.max(2,p.w*0.12);ctx.shadowOffsetY=Math.max(1,p.w*0.06);
    var g=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
    g.addColorStop(0,PAL.back1);g.addColorStop(1,PAL.back2);
    ctx.fillStyle=g;rr(p.x,p.y,p.w,p.h-2,Math.min(10,p.w*0.18));ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha=al;
    ctx.lineWidth=1.5;ctx.strokeStyle=PAL.backHi;rr(p.x,p.y,p.w,p.h-2,Math.min(10,p.w*0.18));ctx.stroke();
    drawGlyph(draw[drawIdx],p.x+p.w/2,p.y+(p.h-2)/2,p.w*0.6,al);
    ctx.restore();
    ctx.fillStyle=PAL.onSoft;
    ctx.font="600 12px -apple-system,'PingFang SC',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("剩"+(draw.length-drawIdx),p.x+p.w/2,p.y+p.h+2);
  }else{
    rr(p.x,p.y,p.w,p.h-2,Math.min(10,p.w*0.18));
    ctx.setLineDash([4,3]);ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=PAL.muted;
    ctx.font="600 12px -apple-system,'PingFang SC',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("空",p.x+p.w/2,p.y+(p.h-2)/2);
  }
}
function drawPark(){
  var pw=Math.round(G.bw*0.86),ph=G.parkH-8,py=G.parkY+4;
  ctx.fillStyle=PAL.muted;
  ctx.font="500 12px -apple-system,'PingFang SC',sans-serif";
  ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText("暂存",G.ox+2,py+ph/2);
  var x0=G.W-2-3*(pw+4);
  for(var i=0;i<3;i++){
    var x=x0+i*(pw+4);
    rr(x,py,pw,ph,6);
    ctx.setLineDash([3,3]);ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.stroke();
    ctx.setLineDash([]);
    if(i<parked.length){
      ctx.save();
      ctx.shadowColor=PAL.shadow;ctx.shadowBlur=2;ctx.shadowOffsetY=1;
      rr(x+2,py+2,pw-4,ph-4,5);
      var g=ctx.createLinearGradient(0,py+2,0,py+ph-2);
      g.addColorStop(0,PAL.face1);g.addColorStop(1,PAL.face2);
      ctx.fillStyle=g;ctx.fill();
      ctx.restore();
      drawGlyph(parked[i].p,x+pw/2,py+ph/2,pw*0.58,.62);
    }
  }
}
function slotX(i){return G.pile.x+G.pile.w+10+i*(G.bw+4)}
/* 槽位托盘：卡面「地面」（--g-surface），让凹槽有可依附的一层（深浅两端都靠这层分层） */
function drawTray(){
  var x=G.pile.x-4,y=G.slotY-2,w=slotX(6)+G.bw+4-x,h=G.slotH+20;
  ctx.save();
  ctx.shadowColor=PAL.shadow;ctx.shadowBlur=6;ctx.shadowOffsetY=2;
  ctx.fillStyle=PAL.surface;rr(x,y,w,h,12);ctx.fill();
  ctx.restore();
  rr(x+.5,y+.5,w-1,h-1,12);
  ctx.lineWidth=1;ctx.strokeStyle=PAL.border;ctx.stroke();
  ctx.globalAlpha=.5;ctx.strokeStyle=PAL.faceHi;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x+8,y+1.5);ctx.lineTo(x+w-8,y+1.5);ctx.stroke();ctx.globalAlpha=1;
}
function drawSlot(){
  for(var i=0;i<7;i++){
    var x=slotX(i);
    var y=G.slotY+(G.slotH-G.bh)/2;
    var w=G.bw,h=G.bh;
    // 凹槽：内凹底（顶影深 / 底缘亮）+ 1px 边界（替代平面浅灰格）
    ctx.save();
    rr(x,y,w,h,10);
    var g=ctx.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,PAL.well);g.addColorStop(0.45,PAL.slot);g.addColorStop(1,colShade(PAL.slot,0.05));
    ctx.fillStyle=g;ctx.fill();
    ctx.restore();
    // 内侧顶影：凹槽「陷进去」的关键（恒黑阴影，顶部向下衰减）
    ctx.save();
    rr(x+1.5,y+1.5,w-3,h-3,9);ctx.clip();
    var sh=ctx.createLinearGradient(0,y,0,y+h*0.55);
    sh.addColorStop(0,"rgba(0,0,0,0.42)");sh.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=sh;ctx.fillRect(x,y,w,h*0.55);
    ctx.restore();
    rr(x+.5,y+.5,w-1,h-1,10);
    ctx.lineWidth=1;ctx.strokeStyle=PAL.border;ctx.stroke();
    // 底缘亮线：凹槽「洞口」可辨（深浅两端都靠这一道亮边分层）
    ctx.globalAlpha=.7;ctx.strokeStyle=PAL.slotHi;ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(x+8,y+h-1.5);ctx.lineTo(x+w-8,y+h-1.5);
    ctx.stroke();ctx.globalAlpha=1;
    var hot=false;
    if(i<slot.length){
      var c=0,j;
      for(j=0;j<slot.length;j++)if(slot[j].p===slot[i].p)c++;
      if(c===2)hot=true;
    }
    if(hot){                                  // 凑对：目标环呼吸（「该点哪」）
      var pulse=window.__gRM?0:.5+.5*Math.sin(nowMs/260);
      rr(x-2,y-2,w+4,h+4,12);
      ctx.lineWidth=2;ctx.strokeStyle=PAL.goal;ctx.globalAlpha=.55+.45*pulse;ctx.stroke();ctx.globalAlpha=1;
    }
    if(i<slot.length){
      var e=slot[i].anim;
      var sc=1,al=1;
      if(e){                                    // 入槽：0→1 弹入（160ms ease-out）
        var k=Math.max(0,Math.min(1,(nowMs-e)/160));
        if(k<1){var ez=1-Math.pow(1-k,2);sc=.7+.3*ez;al=.35+.65*ez;}
        else slot[i].anim=0;
      }
      var cx=x+w/2,cy=y+h/2;
      ctx.save();
      ctx.globalAlpha=al;
      ctx.shadowColor=PAL.shadow;ctx.shadowBlur=Math.max(2,w*0.10);ctx.shadowOffsetY=1;
      var gw2=w*sc,gh2=h*sc;
      var g2=ctx.createLinearGradient(0,cy-gh2/2,0,cy+gh2/2);
      g2.addColorStop(0,PAL.face1);g2.addColorStop(1,PAL.face2);
      ctx.fillStyle=g2;rr(cx-gw2/2,cy-gh2/2,gw2,gh2,8*sc);ctx.fill();
      ctx.restore();
      ctx.lineWidth=1;ctx.strokeStyle=PAL.border;rr(cx-gw2/2+.5,cy-gh2/2+.5,gw2-1,gh2-1,8*sc);ctx.stroke();
      drawGlyph(slot[i].p,cx,cy,(w-6)*0.62*sc,al);
    }
  }
}
function drawFx(now){
  for(var i=fx.length-1;i>=0;i--){
    var f=fx[i],k=(now-f.t0)/420;
    if(k>=1){fx.splice(i,1);continue;}
    var col=PAL.bp[f.p%6]||PAL.primary;
    ctx.save();
    ctx.globalAlpha=1-k;
    ctx.strokeStyle=col;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(f.x,f.y,6+k*26,0,7);ctx.stroke();
    ctx.fillStyle=col;
    for(var j=0;j<6;j++){
      var a=j*Math.PI/3+f.seed;
      var rad=8+k*22;
      ctx.beginPath();ctx.arc(f.x+Math.cos(a)*rad,f.y+Math.sin(a)*rad,2.5*(1-k),0,7);ctx.fill();
    }
    ctx.restore();
  }
}
function paint(){
  var now=performance.now();
  nowMs=now;
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,G.W,G.H);
  // 板面：地面「面」渐变 + 顶缘亮线 + 2px 边界环 + 落地投影（替代纯色平面）
  var bx=G.ox-6,by=G.oy-6,bw=G.cols*G.cell+12,bh=G.rows*G.cell+12;
  ctx.save();
  ctx.shadowColor=PAL.shadow;ctx.shadowBlur=10;ctx.shadowOffsetY=4;
  var g=ctx.createLinearGradient(0,by,0,by+bh);
  g.addColorStop(0,PAL.board1);g.addColorStop(1,PAL.board2);
  ctx.fillStyle=g;rr(bx,by,bw,bh,12);ctx.fill();
  ctx.restore();
  rr(bx+.5,by+.5,bw-1,bh-1,12);
  ctx.lineWidth=1;ctx.strokeStyle=PAL.boardEdge;ctx.stroke();
  ctx.globalAlpha=.6;ctx.strokeStyle=PAL.boardHi;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(bx+10,by+1.5);ctx.lineTo(bx+bw-10,by+1.5);ctx.stroke();ctx.globalAlpha=1;
  var i;
  for(i=0;i<tiles.length;i++){
    if(tiles[i].removed)continue;
    drawFieldTile(tiles[i],coverCnt[i]===0,now);
  }
  drawTray();      // 托盘最底层，盲堆与凹槽都落在其上
  drawPile();
  drawPark();
  drawSlot();
  drawFx(now);
}
function loop(){paint();requestAnimationFrame(loop)}
/* ---------- 游戏逻辑 ---------- */
function remaining(){
  var n=draw.length-drawIdx,i;
  for(i=0;i<tiles.length;i++)if(!tiles[i].removed)n++;
  return n;
}
function applyLayout(tilesArr,drawArr){
  tiles=tilesArr.map(function(t,i){return{x:t[0],y:t[1],z:t[2],p:t[3],removed:false,id:i}});
  var bc=smBuildCover(tilesArr);
  coveredBy=bc.coveredBy;coverCnt=bc.coverCnt;
  draw=drawArr.slice();drawIdx=0;
}
/* 入场错落：大棋盘按行/区错位，总时长 ≤600ms（reduced-motion 时一次性到位） */
function seedEntrance(){
  var n=tiles.length,step=window.__gRM?0:Math.min(45,Math.max(30,Math.floor(420/Math.max(1,Math.ceil(n/3)))));
  var base=performance.now(),i,t;
  entrance=[];
  for(i=0;i<n;i++){t=tiles[i];entrance[t.id]=base+((t.y+t.x*0.4)/Math.max(1,(G.rows+G.cols))*3|0)*step;}
  entrance.draw=base+step*2;
}
function burstAt(slotIndex,p){
  var x=slotX(slotIndex)+G.bw/2;
  var y=G.slotY+(G.slotH-G.bh)/2+G.bh/2;
  fx.push({x:x,y:y,p:p,t0:performance.now(),seed:Math.random()*6.28});
}
function placeToSlot(entry){
  entry.anim=window.__gRM?0:performance.now();
  slot.push(entry);history.push(entry);
  var got=smResolveSlot(slot);
  if(got>=0){
    for(var i=0;i<slot.length;i++)slot[i].anim=window.__gRM?0:performance.now()+i*30;
    if(!window.__gRM)burstAt(0,got);      // 动效降级：跳过消除粒子（文字反馈仍在）
    say("消除 "+(entry.p+1)+" 号图案！槽位 "+slot.length+"/7",true);
  }else{
    say(slot.length>=5?"槽位快满了，小心安排顺序":"已收入槽位 · "+slot.length+"/7");
  }
  updStats();
  if(slot.length>=7){failLevel();return;}
  if(remaining()===0)winLevel();
}
function pickTile(id){
  if(over)return;
  if(id<0||id>=tiles.length||tiles[id].removed||coverCnt[id]>0)return;
  var t=tiles[id];
  t.removed=true;
  for(var i=0;i<coveredBy[id].length;i++)coverCnt[coveredBy[id][i]]--;
  placeToSlot({p:t.p,src:"f",tile:t});
}
function pickDraw(){
  if(over||drawIdx>=draw.length)return;
  var p=draw[drawIdx++];
  placeToSlot({p:p,src:"d",pos:drawIdx-1});
}
function undoPick(){
  if(over)return;
  if(props.undo<=0){say("撤回道具已用完");return;}
  var e=history.length?history[history.length-1]:null;
  if(!e||slot.indexOf(e)<0){say("最后一张已参与消除，撤不回了");return;}
  slot.splice(slot.indexOf(e),1);
  history.pop();
  if(e.src==="d"){drawIdx=e.pos;}
  else{
    e.tile.removed=false;
    for(var i=0;i<coveredBy[e.tile.id].length;i++)coverCnt[coveredBy[e.tile.id][i]]++;
  }
  props.undo--;usedProps++;
  renderProps();updStats();
  say("已撤回最后一张");
}
function moveOut(){
  if(over)return;
  if(props.out<=0){say("移出道具已用完");return;}
  if(slot.length<3){say("槽位不足 3 张");return;}
  if(parked.length>=3){say("暂存区已满");return;}
  parked=parked.concat(slot.splice(0,3));
  props.out--;usedProps++;
  renderProps();updStats();
  say("已把槽位前 3 张移入暂存区（不再参与消除）");
}
function shuffleBoard(){
  if(over)return;
  if(props.shuffle<=0){say("洗牌道具已用完");return;}
  var pats=[],i;
  for(i=0;i<tiles.length;i++)if(!tiles[i].removed)pats.push(tiles[i].p);
  for(i=drawIdx;i<draw.length;i++)pats.push(draw[i]);
  if(!pats.length){say("没有可重排的牌");return;}
  var dead=new Array(L.k).fill(0);
  for(i=0;i<parked.length;i++)dead[parked[i].p]++;
  var spec={k:L.k,w:L.w,h:L.h,zl:L.zl,drawTiles:draw.length-drawIdx,
    pats:pats,slotStart:slot.map(function(e){return e.p}),dead:dead};
  var c=null;
  for(var att=0;att<24&&!c;att++)c=smConstruct(spec,Math.random);
  if(!c){say("暂时洗不动，先消几张再试");return;}
  applyLayout(c.tiles,c.draw);
  history=[];                              // 旧位置已失效，撤回记录清空
  for(i=0;i<slot.length;i++)slot[i].anim=0;
  props.shuffle--;usedProps++;
  renderProps();updStats();
  seedEntrance();
  say("已按可解构造重排剩余牌（含盲堆顺序）");
}
/* ---------- 结算 ---------- */
function starTotal(){
  var s=0,k;
  for(k in stars)s+=stars[k];
  return s;
}
var ovMode="win";
function winLevel(){
  over=true;ovMode="win";
  var st=usedProps===0?3:(usedProps<=2?2:1);
  if(!(stars[cur]>=st))stars[cur]=st;
  cleared=Math.max(cleared,cur+1);
  save();
  if(GB.available)GB.reportScore("stack-match",{metricValue:cleared,metricExtra:starTotal()}).catch(function(){});
  var last=cur>=LEVELS.length-1;
  $("ovTitle").textContent=last?"全部通关！":"过关！";
  var starsTxt="";
  for(var i=0;i<3;i++)starsTxt+=SW_ICON(i<st?'star':'star-o','margin:0 2px');
  $("ovDesc").innerHTML="第 <b>"+(cur+1)+"</b> 关完成 "+starsTxt+"<br>已通关 "+cleared+" / "+LEVELS.length+" 关"+
    (usedProps===0?"<br>未用道具，满分三星":"");
  $("ovBtn").innerHTML=SW_ICON(last?"rotate":"play")+(last?"再玩一遍":"下一关");
  $("overlay").classList.add("show");
}
function failLevel(){
  over=true;ovMode="fail";
  $("ovTitle").textContent="牌槽满了";
  $("ovDesc").innerHTML="<span class='lose'>7 张槽位没有凑成任何三张同图案</span><br>提示：先消场上的散牌，别让同一图案拆开拿";
  $("ovBtn").innerHTML=SW_ICON("rotate")+"重试本关";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 统计与道具栏 ---------- */
function bumpStat(id){var el=$(id);el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}
var lastLeft=-1;      // 首帧不弹（lastLeft<0 视为「尚无上一态」）
function updStats(){
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  var n=remaining(),left=$("stLeft");
  left.textContent=n;
  if(lastLeft>=0&&n!==lastLeft)bumpStat("stLeft");
  lastLeft=n;
  $("stDraw").textContent=draw.length-drawIdx;
}
function renderProps(){
  $("btnUndo").innerHTML=SW_ICON("undo")+"撤回 <i>×"+props.undo+"</i>";
  $("btnOut").innerHTML=SW_ICON("swap-h")+"移出 <i>×"+props.out+"</i>";
  $("btnShuffle").innerHTML=SW_ICON("rotate")+"洗牌 <i>×"+props.shuffle+"</i>";
  $("btnLevels").innerHTML=SW_ICON("grid")+"选关";
  $("btnRestart").innerHTML=SW_ICON("rotate")+"重玩本关";
  $("lvClose").innerHTML=SW_ICON("x")+"关闭";
}
/* ---------- 关卡 ---------- */
function startLevel(n){
  cur=n;
  var d=LEVELS[n];
  L.k=d.k;L.w=d.w;L.h=d.h;L.zl=d.zl;
  applyLayout(d.tiles,d.draw);
  slot=[];parked=[];history=[];fx=[];
  props={undo:1,out:1,shuffle:1};usedProps=0;
  over=false;
  hideOverlay();
  resize();renderProps();updStats();
  seedEntrance();
  say("第"+(n+1)+"关 · "+d.name+" · 场上 "+tiles.length+" 张 + 盲堆 "+draw.length+" 张");
  save();
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  var p=G.pile;
  if(p&&x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h){e.preventDefault();pickDraw();return;}
  var order=[],i;
  for(i=0;i<tiles.length;i++)if(!tiles[i].removed)order.push(i);
  order.sort(function(a,b){return tiles[b].z-tiles[a].z||tiles[b].y-tiles[a].y||tiles[b].x-tiles[a].x});
  for(i=0;i<order.length;i++){
    var t=tiles[order[i]];
    var r=tileRect(t);
    if(x>=r.x&&x<=r.x+r.w+2&&y>=r.y&&y<=r.y+r.h+2){
      e.preventDefault();
      if(coverCnt[order[i]]===0)pickTile(order[i]);
      else say("这张被上层压住了，先拿开上面的牌");
      return;
    }
  }
});
/* ---------- 按钮 ---------- */
$("btnUndo").addEventListener("click",undoPick);
$("btnOut").addEventListener("click",moveOut);
$("btnShuffle").addEventListener("click",shuffleBoard);
$("btnRestart").addEventListener("click",function(){startLevel(cur)});
$("btnLevels").addEventListener("click",openLevels);
$("lvClose").addEventListener("click",function(){$("lvOverlay").classList.remove("show")});
$("ovBtn").addEventListener("click",function(){
  startLevel(ovMode==="fail"?cur:(cur<LEVELS.length-1?cur+1:0));
});
function openLevels(){
  var grid=$("lvGrid");
  grid.innerHTML="";
  var maxOk=Math.min(cleared,LEVELS.length-1);
  for(var i=0;i<LEVELS.length;i++){
    var b=document.createElement("button");
    b.className="lvbtn"+(i===cur?" on":"")+((i<cleared)?" done":"");
    b.textContent=String(i+1);
    b.disabled=i>maxOk;
    b.addEventListener("click",(function(idx){
      return function(){startLevel(idx);$("lvOverlay").classList.remove("show");};
    })(i));
    grid.appendChild(b);
  }
  $("lvDesc").textContent="已通关 "+cleared+" / "+LEVELS.length+" 关 · 点数字进入对应关卡";
  $("lvOverlay").classList.add("show");
}
/* ---------- e2e 只读探针（无副作用） ---------- */
window.__smState=function(){
  return {lv:cur+1,total:LEVELS.length,left:remaining(),drawLeft:draw.length-drawIdx,
    slot:slot.length,parked:parked.length,over:over,history:history.length,
    removed:tiles.map(function(t){return t.removed?1:0})};
};
window.addEventListener("resize",resize);
/* ---------- 启动 ---------- */
palLoad();
renderProps();
startLevel(cur);
loop();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
