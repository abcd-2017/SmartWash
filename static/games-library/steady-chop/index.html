<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

function step(dt){
  var L=curLv();

  //豆腐传送
  S.spawnT-=dt;
  if(S.spawnT<=0){
    S.tofus.push({x:-50,y:RAIL_Y,w:L.tofuW,ph:Math.random()*6.28});
    S.spawnT=L.interval;
  }
  for(var i=S.tofus.length-1;i>=0;i--){
    var t=S.tofus[i];
    t.x+=L.speed*dt;t.ph+=dt*6;
    if(t.x>MW+60){S.tofus.splice(i,1);float_(MW-40,RAIL_Y-16,"溜走",PAL.muted)}
  }
  //筷子移动
  var kvx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  var kvy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  if(kvx)S.cx+=kvx*330*dt;
  if(kvy)S.cy+=kvy*300*dt;
  var kg=(keys.KeyZ?1:0)-(keys.KeyX?1:0);

  S.cx=Math.max(36,Math.min(MW-36,S.cx));

    else S.shake=Math.max(0,S.shake-0.3*dt);
    S.carried.x=S.cx;S.carried.y=S.cy+14;S.carried.ph+=dt*9;
    if(S.shake>=1){fumble();S.drops=(S.drops||0)+1}
  }
  S.prevCx=S.cx;S.prevCy=S.cy;
  //下落豆腐
  for(i=S.falling.length-1;i>=0;i--){
    var f=S.falling[i];
    f.vy+=GRAV*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;
    if(f.vy>0&&f.y+TOFU_H/2>=PLATE_Y-6){
      if(Math.abs(f.x-S.plateX)<=S.plateW/2+4){
        S.falling.splice(i,1);
        S.delivered++;S.score+=20;
        puff(f.x,PLATE_Y-8,10,PAL.success,80);
        float_(f.x,PLATE_Y-30,"+1 夹入",PAL.deep);
        syncHud();
        if(S.delivered>=L.target){levelEnd(true);return}
      }else if(f.y>MH-16){
        S.falling.splice(i,1);
        S.time=Math.max(0,S.time-6);
        S.drops=(S.drops||0)+1;
        puff(f.x,MH-16,12,PAL.tofu2,90);
        float_(f.x,MH-40,"失手 -6s",PAL.danger);
        syncHud();
        if(S.time<=0){S.time=0;levelEnd(S.delivered>=L.target);return}
      }
    }else if(f.y>MH+40){S.falling.splice(i,1)}
  }
  //粒子/浮字
  for(i=S.parts.length-1;i>=0;i--){
    var q=S.parts[i];
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=260*dt;q.life-=dt;
    if(q.life<=0)S.parts.splice(i,1);
  }

    var fl=S.floats[i];fl.y-=30*dt;fl.t-=dt;

  if(S.carried){
    ctx.fillStyle=PAL.surface2;ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
    rrect(S.cx-52,S.cy-64,104,12,6);ctx.fill();ctx.stroke();
    ctx.fillStyle=S.shake>.66?PAL.danger:(S.shake>.33?PAL.warning:PAL.success);
    rrect(S.cx-50,S.cy-62,100*Math.min(1,S.shake),8,4);ctx.fill();
    ctx.fillStyle=PAL.muted;ctx.font="700 12px system-ui,sans-serif";
    ctx.fillText("稳",S.cx-66,S.cy-58);
  }
  //时间条
  var tp=S.timeMax>0?S.time/S.timeMax:0;
  ctx.fillStyle=PAL.surface2;ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rrect(60,14,MW-120,12,6);ctx.fill();ctx.stroke();
  ctx.fillStyle=tp>.35?PAL.primary:(tp>.15?PAL.warning:PAL.danger);
  if(tp>0){rrect(61,15,(MW-122)*tp,10,5);ctx.fill()}
  ctx.fillStyle=PAL.text;ctx.font="700 12px system-ui,sans-serif";ctx.textAlign="left";
  ctx.fillText("时间",12,20);
  ctx.textAlign="right";
  ctx.fillText(Math.max(0,Math.ceil(S.time))+"s",MW-12,20);
  //粒子/浮字
  for(i=0;i<S.parts.length;i++){
    var q=S.parts[i];
    ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.fillStyle=q.col;
    ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign="center";ctx.font="700 16px system-ui,sans-serif";
  for(i=0;i<S.floats.length;i++){
    var f2=S.floats[i];
    ctx.globalAlpha=Math.min(1,f2.t*1.5);
    ctx.fillStyle=f2.col;ctx.fillText(f2.txt,f2.x,f2.y);
  }
  ctx.globalAlpha=1;
}
/* ---------- 输入 ---------- */
var keys={},pointers={},pinchD=0;
function pos(e){
  var r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  pointers[e.pointerId]=pos(e);
  var ids=Object.keys(pointers);
  if(ids.length===2){
    var a=pointers[ids[0]],b=pointers[ids[1]];
    pinchD=Math.abs(a.x-b.x);
  }
});
cv.addEventListener("pointermove",function(e){
  if(!pointers[e.pointerId])return;
  pointers[e.pointerId]=pos(e);
  var ids=Object.keys(pointers);
  if(ids.length>=2){
    var a=pointers[ids[0]],b=pointers[ids[1]];
    var d=Math.abs(a.x-b.x);
    if(pinchD>0)S.gap=Math.max(40,Math.min(150,S.gap+(d-pinchD)*0.8));
    pinchD=d;
  }else if(ids.length===1){
    var p=pointers[e.pointerId];
    S.cx=Math.max(36,Math.min(MW-36,p.x));
    S.cy=Math.max(70,Math.min(PLATE_Y-60,p.y));
  }
});
function pointerEnd(e){
  delete pointers[e.pointerId];
  if(Object.keys(pointers).length<2)pinchD=0;
}
cv.addEventListener("pointerup",pointerEnd);
cv.addEventListener("pointercancel",pointerEnd);
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
btnAct.addEventListener("click",function(e){tryGrab();e.currentTarget.blur()});
window.addEventListener("blur",function(){keys={}});
document.addEventListener("keydown",function(e){
  keys[e.code]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==="Space"&&!e.repeat)tryGrab();
  if(e.code==="KeyP"&&S.phase==="run"){S.paused?((S.paused=false),hideOv()):pauseGame()}
  if(e.code==="KeyR"&&S.phase!=="menu")loadLevel(lvIdx);
  if(e.code==="Enter"&&S.phase!=="run")loadLevel(lvIdx);
});
document.addEventListener("keyup",function(e){keys[e.code]=false});
$("btnPause").addEventListener("click",pauseGame);
$("btnReset").addEventListener("click",function(){loadLevel(lvIdx)});
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&S.phase==="run"&&!S.paused)pauseGame();
});
/* ---------- 主循环 ---------- */
var lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  var dt=Math.min(.05,(now-lastT)/1000);
  lastT=now;
  if(S.phase==="run"&&!S.paused)step(dt);
  draw();
}
/* ---------- 启动 ---------- */
$("btnPause").insertAdjacentHTML("afterbegin",SW_ICON("pause"));
$("btnReset").insertAdjacentHTML("afterbegin",SW_ICON("rotate"));
$("btnAct").insertAdjacentHTML("afterbegin",SW_ICON("grab"));
palLoad();
syncHud();
showMenu();
resize();
window.addEventListener("resize",resize);
requestAnimationFrame(loop);
syncSaveFromServer();
syncLevelsFromServer();
})();
</script>
