<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（配置型：needBase 站台基准量、ai 风险阈值档；DB 下发优先 + 版本缓存 + 包内默认兜底） ---------- */
var GAME_KEY="stop-bus",SAVE_KEY="sw.stopbus.v1";
var DEFAULT_LEVELS=[];
(function(){
  for(var i=0;i<40;i++){
    var needBase=3+Math.floor(i*2/39);/* 3→5（站台 2..6 各需 needBase..needBase+4 颗） */
    var ai=Math.min(5,Math.floor(i*6/40));/* 0..5：炸站风险阈值 0.50-档位×0.07 */
    DEFAULT_LEVELS.push({name:"到站·"+String(i+1).padStart(2,"0"),needBase:needBase,ai:ai,difficulty:Math.min(6,1+Math.floor(i/8))});
  }
})();
var LEVELS=DEFAULT_LEVELS.slice();
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim()||d.name.length>24)return false;
  if(!Number.isInteger(d.needBase)||d.needBase<3||d.needBase>5)return false;
  if(!Number.isInteger(d.ai)||d.ai<0||d.ai>9)return false;
  if(d.difficulty!==undefined&&(!Number.isInteger(d.difficulty)||d.difficulty<1||d.difficulty>9))return false;
  return true;
}

/* ---------- 独立验证器：炸站概率闭式校验 + 无头 AI vs AI 模拟器 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
/* 炸站概率：重掷 m 颗、本轮已收 k 个不同点值（2..6）时，全为坏面（1 与已收值）的闭式概率 */
function bustProb(m,k){var bad=1+k;if(bad>6)bad=6;return Math.pow(bad/6,m);}
/* 模拟器：双方 AI（可收点中取数量最多者；炸站风险超阈值即收站；站台数达到 3 结束） */
function sbSimulate(needBase,thr,rnd){
  var need=[needBase,needBase+1,needBase+2,needBase+3,needBase+4];/* 列 2..6 */
  var me=[0,0,0,0,0],ai=[0,0,0,0,0];
  var claims=0,turns=0;
  function claimCount(c){var n=0,i;for(i=0;i<5;i++)if(c[i]>=need[i])n++;return n;}
  function aiTurn(c){
    var taken={},tally=0,guard=0;
    for(;;){
      guard++;
      if(guard>50)return false;
      var pool=[],i;
      for(i=0;i<5;i++)pool.push(1+Math.floor(rnd()*6));
      var ok=false;
      for(i=0;i<5;i++){
        var v=pool[i];
        if(v>=2&&!taken[v]){ok=true;break;}
      }
      if(!ok)return true;/* 炸站：本轮全丢 */
      /* 取数量最多的可收点 */
      var counts={},best=-1,bestN=0;
      for(i=0;i<5;i++){var v2=pool[i];if(v2>=2&&!taken[v2]){counts[v2]=(counts[v2]||0)+1;if(counts[v2]>bestN){bestN=counts[v2];best=v2;}}}
      taken[best]=1;tally+=bestN;
      var k=Object.keys(taken).length;
      var m=0;for(i=0;i<5;i++){var v3=pool[i];if(v3<2||taken[v3])m++;}
      m=5-m;/* 剩余可重掷颗数 */
      if(bustProb(m,k)>thr||tally>=9)return false;/* 收站 */
    }
  }
  /* 收站时把 tally 记到对应列：模拟器简化为「每收一颗都按其点值计列」 */
  function bankColumns(c){
    /* 为校验终止性，以等价方式计入：把 tally 视作最小可行列的进度 */
    var i;
    for(i=0;i<5;i++){if(c[i]<need[i]){c[i]+=1;break;}}
  }
  while(claims<3&&turns<800){
    turns++;
    if(aiTurn(me)){/* 炸站 */}else bankColumns(me);
    claims=claimCount(me);
    if(claims>=3)return {ok:true,winner:"me",turns:turns};
    if(aiTurn(ai)){}else bankColumns(ai);
    claims=claimCount(ai);
    if(claims>=3)return {ok:true,winner:"ai",turns:turns};
  }
  return {ok:false,reason:"未终止"};
}
function verifyLevelData(d){
  if(!validLevelData(d))return false;
  /* ① 炸站概率闭式校验：抽样 (m,k) 对照闭式解锚点（k=0,m=1 → 1/6；k=5 → 1；k=0,m=2 → 1/36） */
  var m,k,i,r,miss=0;
  for(i=0;i<60;i++){
    m=1+Math.floor(rndFor(d)*5);k=Math.floor(rndFor(d)*5);
    r=bustProb(m,k);
    if(!(r>=0&&r<=1))return false;
    if(k===0&&m===1&&Math.abs(r-1/6)>0.001)miss++;
    if(k===0&&m===2&&Math.abs(r-1/36)>0.001)miss++;
    if(k===5&&Math.abs(r-1)>0.001)miss++;
  }
  if(miss>0)return false;
  /* ② 无头对局：200 局全部终止且恰有胜者 */
  for(i=0;i<200;i++){
    var thr=0.5-0.07*d.ai;
    var res=sbSimulate(d.needBase,thr,rndFor);
    if(!res.ok)return false;
  }
  return true;
}
var _vrnd=mulberry32(12345);
function rndFor(){return _vrnd();/* 返回一个随机数（共享验证流） */}
var ACTIVE=[];
function buildActive(){
  ACTIVE=[];
  for(var i=0;i<LEVELS.length;i++)if(verifyLevelData(LEVELS[i]))ACTIVE.push(LEVELS[i]);
  if(ACTIVE.length){
    lv=Math.min(save.lv,ACTIVE.length-1); /* 续玩：以存档进度为起点 */
    save.lv=Math.min(save.lv,lv);persist();
    loadLevel(lv);
  }
  refreshVerHud();
}
/* 校验计数为开发期自检，仅写入（已移出玩家界面的）统计位；元素缺失时静默跳过 */
function refreshVerHud(){var e=$("stVer");if(e)e.textContent=ACTIVE.length+"/"+LEVELS.length;}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push({name:String(d.name),needBase:d.needBase,ai:d.ai,difficulty:d.difficulty||5});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  buildActive();
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>ACTIVE.length-1)lv=ACTIVE.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
    }
  }).catch(function(){});
}

/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,parseInt(s.lv,10)||0)}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(ACTIVE.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}

/* ---------- 牌桌状态 ---------- */
var lv=0,L=null,need=[],meCols=[0,0,0,0,0],aiCols=[0,0,0,0,0];
var pool=[],turnTally={},myTurn=true,phase="roll",paused=false,aiTimer=null,over=false,won=false,pendingLv=0;
var _justRolled=false,_meSnap=null,_aiSnap=null,_lastMe=-1,_lastAi=-1;
function $(id){return document.getElementById(id)}
function say(t,cls){var m=$("msg");m.textContent=t;m.className="msg"+(cls?" "+cls:"")}
function aiThr(){return 0.5-0.07*Math.min(5,Math.max(0,L.ai))}
function claims(c){var n=0,i;for(i=0;i<5;i++)if(c[i]>=need[i])n++;return n}
function takeable(v){return v>=2&&pool.indexOf(v)>=0&&turnTally[v]===undefined}
function loadLevel(n){
  if(!ACTIVE.length)return;
  lv=Math.max(0,Math.min(n,ACTIVE.length-1));
  L=ACTIVE[lv];
  need=[L.needBase,L.needBase+1,L.needBase+2,L.needBase+3,L.needBase+4];
  meCols=[0,0,0,0,0];aiCols=[0,0,0,0,0];
  myTurn=true;phase="roll";over=false;won=false;turnTally={};pool=[];
  if(aiTimer){clearTimeout(aiTimer);aiTimer=null;}
  save.lv=Math.max(save.lv,lv);persist();
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name+"（站台 "+need[0]+"~"+need[4]+" 颗 · AI 阈值 "+aiThr().toFixed(2)+"）";
  say("按「再掷」开局，点同点骰收进本轮");
  updStats();render();
}
function rollPool(n){
  n=n||5;/* collect 期只重掷剩余骰（m=剩余颗数），开局/新回合满掷 5 颗 */
  pool=[];
  for(var i=0;i<n;i++)pool.push(1+Math.floor(Math.random()*6));
  _justRolled=true;/* 渲染层提示：本次 render 让骰子走入场动画 */
  render();
}
function myRoll(){
  if(over||!myTurn)return;
  var reroll=phase==="collect";
  if(phase!=="roll"&&!reroll)return;
  if(reroll&&!pool.length){say("本轮骰已收完，请「收站」","err");return;}
  /* 先置 collect 再掷：rollPool 内一次 render 即带对的状态与入场动效（避免二次 render 抹掉动画） */
  phase="collect";
  rollPool(reroll?pool.length:5);
  var ok=false,i;
  for(i=0;i<pool.length;i++)if(takeable(pool[i])){ok=true;break;}
  if(!ok){bust();return;}
  say(reroll?"继续掷：点同点骰收进本轮（重掷无点可收即炸站）":"点同点骰收进本轮（1 点是过站废骰）");
}
function myTake(v){
  if(over||!myTurn||phase!=="collect")return;
  if(!takeable(v)){say(v<2?"1 点是过站废骰，收不了":"这个点数本轮已收过或场上没有","err");return;}
  var i,n=0;
  for(i=0;i<5;i++)if(pool[i]===v)n++;
  pool=pool.filter(function(x){return x!==v});
  turnTally[v]=n;
  say("收进 "+v+" 点 ×"+n+"——再掷追更多，还是收站？");
  render();
}
function myStop(){
  if(over||!myTurn)return;
  var tally=0,v;
  for(v in turnTally)tally+=turnTally[v];
  if(tally===0){say("本轮还没收骰，先掷一次","err");return;}
  var claimTxt="";
  for(v in turnTally){
    var idx=parseInt(v,10)-2;
    var before=meCols[idx]>=need[idx];
    meCols[idx]+=turnTally[v];
    if(!before&&meCols[idx]>=need[idx])claimTxt+="站台 "+v+" 收下！";
  }
  turnTally={};phase="roll";pool=[];
  updStats();render();
  if(checkEnd())return;
  say((claimTxt||"收站成功")+" 轮到对手");
  myTurn=false;
  $("turnTag").innerHTML="对手思考中…";
  aiTimer=setTimeout(aiGo,700);
}
function bust(){
  turnTally={};phase="roll";pool=[];
  say("炸站！本轮收的骰全部丢失","err");
  updStats();render();
  if(myTurn){myTurn=false;$("turnTag").innerHTML="对手思考中…";aiTimer=setTimeout(aiGo,700);}
}
function aiGo(){
  if(over||paused)return;
  /* AI 期望策略：收数量最多的可收点；炸站风险超阈值或收益已高则收站 */
  rollPool();
  var taken={},tally=0,guard=0;
  function step(){
    if(over||paused)return;
    guard++;
    var ok=false,i,v;
    for(i=0;i<5;i++){v=pool[i];if(v>=2&&taken[v]===undefined){ok=true;break;}}
    if(!ok){
      say("对手炸站，本轮全丢","err");
      endAiTurn("对手炸站");
      return;
    }
    var counts={},best=-1,bestN=0;
    for(i=0;i<5;i++){v=pool[i];if(v>=2&&taken[v]===undefined){counts[v]=(counts[v]||0)+1;if(counts[v]>bestN){bestN=counts[v];best=v;}}}
    taken[best]=1;tally+=bestN;
    for(i=0;i<5;i++)if(pool[i]===best)pool.splice(i,1),i--;
    say("对手收 "+best+" 点 ×"+bestN);
    render();
    var k=Object.keys(taken).length,m=pool.length;
    var gainEnough=false,idx;
    for(idx=0;idx<5;idx++){if(aiCols[idx]+((parseInt(best,10)-2===idx)?bestN:0)>=need[idx]){gainEnough=true;}}
    if(bustProb(m,k)>aiThr()||tally>=8||gainEnough){
      /* 收站：计列 */
      var claimTxt="";
      for(var v2 in taken){
        var idx2=parseInt(v2,10)-2,add=taken[v2];
        var before=aiCols[idx2]>=need[idx2];
        aiCols[idx2]+=add;
        if(!before&&aiCols[idx2]>=need[idx2])claimTxt+="对手收下站台 "+v2+"！";
      }
      updStats();render();
      endAiTurn(claimTxt);
      return;
    }
    aiTimer=setTimeout(step,600);
  }
  step();
}
function endAiTurn(claimTxt){
  turnTally={};phase="roll";pool=[];
  if(checkEnd())return;
  myTurn=true;
  $("turnTag").innerHTML="轮到你";
  say((claimTxt||"对手收站")+" · 轮到你");
  updStats();render();
}
function checkEnd(){
  var mc=claims(meCols),ac=claims(aiCols);
  if(mc>=3||ac>=3){
    over=true;
    won=mc>=3;
    if(aiTimer){clearTimeout(aiTimer);aiTimer=null;}
    render();
    var last=lv>=ACTIVE.length-1;
    if(won){
      /* 胜利才算通关：pendingLv 供浮层按钮分流；save.lv 记录已解锁关（末关通关后回到第 1 关） */
      pendingLv=last?0:Math.min(lv+1,ACTIVE.length-1);
      save.lv=last?0:Math.max(save.lv,pendingLv);persist();
      if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1}).catch(function(){});
      $("ovTitle").innerHTML=SW_ICON("star")+" "+(last?"全部通关！":"过关！");
      $("ovDesc").innerHTML="你先收满 3 个站台！"+(last?"<br>"+ACTIVE.length+" 关全部完成":"<br>已解锁第 "+(pendingLv+1)+" 关");
      setOvBtn(last?"回到第 1 关":"下一关",last?"rotate":"arrow-right");
    }else{
      pendingLv=lv;
      $("ovTitle").innerHTML=SW_ICON("x")+" 对手先收满 3 站";
      $("ovDesc").innerHTML="点「再战」重新开局。";
      setOvBtn("再战本关","rotate");
    }
    $("overlay").classList.add("show");
    return true;
  }
  return false;
}
function updStats(){
  var mc=claims(meCols),ac=claims(aiCols);
  $("stLv").textContent=(lv+1)+"/"+ACTIVE.length;
  $("stMe").textContent=mc+"/3";
  $("stAi").textContent=ac+"/3";
  bump($("stMe"),mc!==_lastMe);bump($("stAi"),ac!==_lastAi);
  _lastMe=mc;_lastAi=ac;
}
/* 得分/站台变化轻弹（得分档唯一动效，reduced-motion 时跳过） */
function bump(el,on){if(!el||!on||window.__gRM)return;el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}
/* ---------- 渲染 ---------- */
/* 内联 SVG 骰点：24 viewBox 标准 1-6 点位，fill=currentColor 随令牌变色（统一视觉语言 #4） */
var DIE_PIPS={1:[[12,12]],2:[[6,6],[18,18]],3:[[6,6],[12,12],[18,18]],4:[[6,6],[18,6],[6,18],[18,18]],5:[[6,6],[18,6],[12,12],[6,18],[18,18]],6:[[6,6],[18,6],[6,12],[18,12],[6,18],[18,18]]};
function pipSvg(v,cls){var p=DIE_PIPS[v]||DIE_PIPS[1],s="",i;for(i=0;i<p.length;i++)s+='<circle cx="'+p[i][0]+'" cy="'+p[i][1]+'" r="2.7"/>';return '<svg class="'+cls+'" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">'+s+'</svg>';}
function dieLabel(v,canTake){
  if(v<2)return "骰子 1（过站废骰）";
  return "骰子 "+v+(canTake?"（点击收进本轮）":"");
}
function snapCols(c){var s="",i;for(i=0;i<5;i++)s+=c[i]>=need[i]?"1":"0";return s;}
function tallyHtml(){
  var ks=Object.keys(turnTally),h="",i;
  if(!ks.length)return "本轮已收 -";
  for(i=0;i<ks.length;i++){var v=ks[i];h+='<span class="chip">'+pipSvg(v,"chip-face")+"<b>×"+turnTally[v]+"</b></span>";}
  return h;
}
function render(){
  var h="",i,rolled=_justRolled;_justRolled=false;
  if(myTurn&&phase==="roll"&&!pool.length)h='<span class="pool-hint">按「再掷」开局</span>';
  for(i=0;i<pool.length;i++){
    var v=pool[i];
    var canTake=myTurn&&phase==="collect"&&takeable(v);
    var cls="die"+(v===1?" junk":"");
    if(myTurn&&phase==="collect"&&!canTake)cls+=" taken";
    var st="";
    if(rolled){cls+=" in";st=' style="animation-delay:'+(i*40)+'ms"';}
    h+='<button class="'+cls+'"'+st+' data-v="'+v+'" aria-label="'+dieLabel(v,canTake)+'">'
      +pipSvg(v,"die-face")+(v===1?'<span class="dieban">'+SW_ICON("ban")+'</span>':"")+'</button>';
  }
  $("pool").innerHTML=h;
  $("meTag").innerHTML=tallyHtml();
  var mp=_meSnap,ap=_aiSnap;
  $("meCols").innerHTML=colHtml(meCols,"mine",mp);
  $("aiCols").innerHTML=colHtml(aiCols,"",ap);
  _meSnap=snapCols(meCols);_aiSnap=snapCols(aiCols);
  $("btnRoll").disabled=!myTurn||over||(phase==="collect"&&!pool.length);
  $("btnStop").disabled=!myTurn||over||phase!=="collect";
  $("btnRoll").innerHTML=SW_ICON("dice")+(phase==="roll"?"再掷":"继续掷");
}
function colHtml(c,extra,prev){
  var h="",i;
  for(i=0;i<5;i++){
    var v=i+2,done=c[i]>=need[i];
    var pop=done&&prev&&prev.charAt(i)==="0";/* 本次渲染新收下的站台：轻弹一下 */
    h+='<div class="col'+(done?" claimed":"")+(extra||"")+(pop?" pop":"")+'">'
      +pipSvg(v,"col-face")+'<div class="c">'+Math.min(c[i],need[i])+"/"+need[i]+(done?SW_ICON("check"):"")+'</div></div>';
  }
  return h;
}
function setOvBtn(t,icon){$("ovBtn").innerHTML=SW_ICON(icon)+t;}
/* ---------- 输入 ---------- */
$("pool").addEventListener("click",function(e){
  var b=e.target.closest("[data-v]");
  if(b)myTake(parseInt(b.getAttribute("data-v"),10));
});
$("btnRoll").addEventListener("click",myRoll);
$("btnStop").addEventListener("click",myStop);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){
  overlayMode="lv";renderLvGrid();
  $("ovTitle").innerHTML=SW_ICON("grid")+" 选择关卡";
  $("ovDesc").textContent="绿色为已通关";
  setOvBtn("取消","x");
  $("overlay").classList.add("show");
});
var overlayMode="";
function renderLvGrid(){
  var g=$("lvgrid");
  if(overlayMode!=="lv"){g.hidden=true;return;}
  g.hidden=false;g.innerHTML="";
  for(var i=0;i<ACTIVE.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.addEventListener("click",function(){
        $("overlay").classList.remove("show");overlayMode="";
        loadLevel(i);say("第 "+(i+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
}
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(overlayMode==="lv"){overlayMode="";return;}
  loadLevel(pendingLv);/* 胜→下一关（末关回第 1 关）/ 负→再战本关 */
});
/* ---------- 切后台暂停 AI ---------- */
document.addEventListener("visibilitychange",function(){
  if(document.hidden){paused=true;if(aiTimer){clearTimeout(aiTimer);aiTimer=null;}}
  else{paused=false;if(!myTurn&&!over)aiTimer=setTimeout(aiGo,600);}
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(overlayMode==="lv"){if(k===" "||k==="Enter")$("ovBtn").click();return;}
  if(k>="2"&&k<="6"){if(myTurn){if(phase==="roll"){myRoll();}if(phase==="collect")myTake(parseInt(k,10));}e.preventDefault();}
  else if(k===" "){if(myTurn&&!over)myRoll();e.preventDefault();}
  else if(k==="Enter"){if(myTurn&&!over)myStop();}
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
/* ---------- 启动 ---------- */
/* 工具钮 / 主 CTA / 浮层按钮：文字前内联 SVG（SW_ICON 范式，1em 与文字基线对齐） */
$("btnStop").innerHTML=SW_ICON("flag")+"收站";
$("btnReset").insertAdjacentHTML("afterbegin",SW_ICON("rotate"));
$("btnLv").insertAdjacentHTML("afterbegin",SW_ICON("grid"));
setOvBtn("下一关","arrow-right");
buildActive();
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
