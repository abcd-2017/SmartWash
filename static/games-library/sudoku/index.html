<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>数独</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（--g-sdk-*：木面 / 格砖 / 宫缝 / 九色数字墨 / 轨迹 / 选中 / 冲突）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-on-primary:#FFFFFF;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-sdk-board1:#F4DEB6;--g-sdk-board2:#E4C48C;--g-sdk-cell1:#FFFFFF;--g-sdk-cell2:#F7F9F7;--g-sdk-edge:#6E5126;--g-sdk-given:#6B6E73;--g-sdk-sel:#96D0B2;--g-sdk-same:#C9E9DA;--g-sdk-peer:#E2F0E8;--g-sdk-num1:#20242A;--g-sdk-num2:#0A4E30;--g-sdk-num3:#A83850;--g-sdk-num4:#7E540A;--g-sdk-num5:#25619E;--g-sdk-num6:#6345B8;--g-sdk-num7:#7A2E1E;--g-sdk-num8:#086670;--g-sdk-num9:#2F6B36;--g-sdk-bad-ink:#FFFFFF;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-sdk-board1:#3A3122;--g-sdk-board2:#2A2317;--g-sdk-cell1:#262A27;--g-sdk-cell2:#1D201E;--g-sdk-edge:#9A845C;--g-sdk-given:#C9C4B6;--g-sdk-sel:#245C40;--g-sdk-same:#1A3A2C;--g-sdk-peer:#151B18;--g-sdk-num1:#E6E9E6;--g-sdk-num2:#72CAA1;--g-sdk-num3:#DB9FAE;--g-sdk-num4:#D3A969;--g-sdk-num5:#89B0D2;--g-sdk-num6:#AD9FDB;--g-sdk-num7:#D29289;--g-sdk-num8:#72C4CA;--g-sdk-num9:#72CA7A;--g-sdk-bad-ink:#1C1C1E;color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat {
    background: linear-gradient(165deg, var(--g-surface), var(--g-surface2));
    border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; min-width: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), var(--g-shadow);
    animation: rise .38s ease-out both;
  }
  /* 入场错落 40ms（30-50ms 区间） */
  .stat:nth-child(2) { animation-delay: 40ms; }
  .stat:nth-child(3) { animation-delay: 80ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { display: inline-block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.bump { animation: valpop .24s ease-out; }
  @keyframes valpop { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  /* 入场错落：仅装载关卡时由 .enter 触发一次（paint 只改 class/内容，不重播） */
  @keyframes cellin { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  .board.enter .cell { animation: cellin .28s ease-out backwards; }

  /* 难度 chip：轻立体卡（渐变 + 顶光 + 投影），选中态品牌绿软底 + 深绿内环 */
  .diffs { display: flex; gap: 8px; margin-bottom: 10px; }
  .chip {
    flex: 1; min-height: 44px; border: 1px solid var(--g-border); border-radius: var(--g-radius-btn);
    background: linear-gradient(165deg, var(--g-surface), var(--g-surface2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 1px 2px rgba(20,40,30,.06);
    color: var(--g-muted);
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .14s ease-out, background .16s ease-out, color .16s ease-out, box-shadow .16s ease-out;
  }
  .chip:active { transform: scale(.96); }
  .chip.on { background: var(--g-primary-soft); color: var(--g-on-soft); border-color: transparent; box-shadow: inset 0 0 0 2px var(--g-primary-deep), 0 2px 8px rgba(20,40,30,.10); }
  #btnDaily { white-space: nowrap; }

  /* 棋盘：外框「面」= 木面渐变 + 顶缘高光 + 落地投影（轻立体）；凹槽边界带 + 格砖两色「面」 */
  .board {
    display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px;
    width: min(420px, 100%); margin: 0 auto; padding: 6px;
    background: linear-gradient(170deg, var(--g-sdk-board1), var(--g-sdk-board2));
    border: 2px solid var(--g-sdk-edge); border-radius: var(--g-radius-inner);
    box-shadow: var(--g-shadow), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .cell {
    --l1: transparent; --l2: transparent; --seam: none;
    position: relative; aspect-ratio: 1; border: 0; padding: 0;
    border-radius: 4px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 55%),
      linear-gradient(var(--l1), var(--l1)),
      linear-gradient(var(--l2), var(--l2)),
      var(--g-sdk-cell1);
    box-shadow: var(--seam), inset 0 1px 1px rgba(255,255,255,.6), inset 0 -1px 1px rgba(20,40,30,.10), 0 1px 1px rgba(20,40,30,.08);
    color: var(--g-sdk-num1);
    font-family: inherit; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .14s ease-out, box-shadow .16s ease-out, background .16s ease-out, color .16s ease-out;
  }
  .cell.alt { background-color: var(--g-sdk-cell2); }
  .cell:active { transform: scale(.96); }
  /* 3×3 宫分隔：内缩 2px 木面缝（非文本结构，边线对木面 ≥3:1），不改格尺寸 */
  .cell.br { --seam: inset 2px 0 0 0 var(--g-sdk-edge); }
  .cell.bb { --seam: inset 0 0 2px 0 var(--g-sdk-edge); }
  .cell.br.bb { --seam: inset 2px 0 2px 0 var(--g-sdk-edge); }
  /* 轨迹：同行列 / 同宫（我控制的范围） */
  .cell.peer { --l2: var(--g-sdk-peer); }
  /* 同数字：目标态（选中格的数字在盘上铺开） */
  .cell.same { --l1: var(--g-sdk-same); }
  /* 选中格：软绿面 + 深绿内环 + 抬起 */
  .cell.sel {
    --l1: var(--g-sdk-sel); color: var(--g-on-soft);
    box-shadow: var(--seam), inset 0 0 0 2px var(--g-primary-deep), 0 2px 8px rgba(20,40,30,.16);
    transform: translateY(-1px); z-index: 2;
  }
  .cell.sel:active { transform: scale(.96); }
  /* 冲突（最高优先级）：危险色实底 + 白/深墨字（压平轨迹层与数字九色，Theme 决定墨色） */
  .cell.bad { --l1: transparent; --l2: transparent; color: var(--g-sdk-bad-ink); background-color: var(--g-danger); box-shadow: var(--seam), inset 0 0 0 2px var(--g-danger), 0 1px 3px rgba(20,40,30,.10); }
  .cell.bad.sel { box-shadow: var(--seam), inset 0 0 0 2px var(--g-on-soft), 0 2px 8px rgba(20,40,30,.16); }
  .cell .num { display: block; }
  .cell .num.bump { animation: valpop .24s ease-out; }
  /* 题目给定格：压低的暗调格砖 + 顶部内凹阴影（不可改，材质与可填格不同） */
  .cell.given {
    background-color: var(--g-sdk-cell2);
    background-image: linear-gradient(180deg, rgba(20,40,30,.12), rgba(20,40,30,0) 45%),
                      linear-gradient(var(--l1), var(--l1)),
                      linear-gradient(var(--l2), var(--l2));
    box-shadow: var(--seam), inset 0 1px 2px rgba(20,40,30,.22), inset 0 -1px 0 rgba(255,255,255,.28);
  }
  .cell.given .num { color: var(--g-sdk-given); }
  /* 笔记：3×3 小字阵，对格面 ≥4.5:1 */
  .cell .notes {
    position: absolute; inset: 1px; display: grid;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    pointer-events: none;
  }
  .cell .notes span { font-size: 12px; font-weight: 600; color: var(--g-muted); line-height: 1; display: flex; align-items: center; justify-content: center; }
  /* 数字墨：九色区分（对格面 / 同数面 / 选中面均 ≥4.5:1） */
  .cell .num[data-n="1"] { color: var(--g-sdk-num1); }
  .cell .num[data-n="2"] { color: var(--g-sdk-num2); }
  .cell .num[data-n="3"] { color: var(--g-sdk-num3); }
  .cell .num[data-n="4"] { color: var(--g-sdk-num4); }
  .cell .num[data-n="5"] { color: var(--g-sdk-num5); }
  .cell .num[data-n="6"] { color: var(--g-sdk-num6); }
  .cell .num[data-n="7"] { color: var(--g-sdk-num7); }
  .cell .num[data-n="8"] { color: var(--g-sdk-num8); }
  .cell .num[data-n="9"] { color: var(--g-sdk-num9); }
  .cell.sel .num { color: var(--g-on-soft); }
  .cell.bad .num { color: var(--g-sdk-bad-ink); }

  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  /* 数字键区：轻立体键（渐变 + 顶光 + 投影），键面数字九色区分 */
  .keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 10px; }
  .key {
    min-height: 48px; border: 0; border-radius: var(--g-radius-btn);
    background: linear-gradient(165deg, var(--g-surface), var(--g-surface2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 1px 2px rgba(20,40,30,.06);
    color: var(--g-text);
    font-family: inherit; font-size: 22px; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    transition: transform .14s ease-out, background .16s ease-out, box-shadow .16s ease-out;
  }
  .key:active { transform: scale(.96); }
  .key[data-n="1"] { color: var(--g-sdk-num1); }
  .key[data-n="2"] { color: var(--g-sdk-num2); }
  .key[data-n="3"] { color: var(--g-sdk-num3); }
  .key[data-n="4"] { color: var(--g-sdk-num4); }
  .key[data-n="5"] { color: var(--g-sdk-num5); }
  .key[data-n="6"] { color: var(--g-sdk-num6); }
  .key[data-n="7"] { color: var(--g-sdk-num7); }
  .key[data-n="8"] { color: var(--g-sdk-num8); }
  .key[data-n="9"] { color: var(--g-sdk-num9); }
  .key.erase { font-size: 14px; font-weight: 600; color: var(--g-muted); background: linear-gradient(165deg, var(--g-surface2), var(--g-surface)); }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 10px; flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: var(--g-radius-btn);
    background: linear-gradient(165deg, var(--g-surface), var(--g-surface2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 1px 2px rgba(20,40,30,.06);
    color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .14s ease-out, background .16s ease-out, box-shadow .16s ease-out;
  }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .35; }
  /* 主 CTA：深底白字 5.85:1（--g-primary 绿底白字仅 3.5:1），字号回落 16px/600，与原生 AppButton 15sp 同量级 */
  .btn.primary { background: linear-gradient(180deg, var(--g-primary), var(--g-btn-primary)); color: var(--g-on-primary); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 2px 8px rgba(20,40,30,.18); font-size: 16px; font-weight: 600; }
  .btn.on { background: var(--g-primary-soft); color: var(--g-on-soft); box-shadow: inset 0 0 0 2px var(--g-primary-deep); }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 320px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  /* 过关轻弹 */
  .panel.win { animation: winpop .45s cubic-bezier(.18,.9,.3,1.4); }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes winpop { 0% { transform: scale(.86); opacity: 0; } 62% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.7; }
  .panel .desc b { color: var(--g-primary-deep); font-size: 22px; }
  .panel.win .desc b { color: var(--g-warning); }
  .panel .btn { width: 100%; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效与延迟（同时压 animation-duration 与 animation-delay） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>

 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>','arrow-left':'<path d="M19 12H5M11 6l-6 6 6 6"/>',

<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;

  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送

window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<div class="wrap">
  <header><span class="sub">每行每列每宫 1-9 不重复</span></header>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},

/* ---------- 关卡数据（DB 下发优先，本地缓存兜底） ---------- */
var LEVELS_KEY="sw.sudoku.v1.levels",LEVELS_VER_KEY="sw.sudoku.v1.levels.ver",PROG_KEY="sw.sudoku.v1.prog";

function setDbLevels(list){

function applyLevels(list,version){

}
function loadCachedLevels(){

loadCachedLevels();

function saveProg(){try{localStorage.setItem(PROG_KEY,JSON.stringify(prog))}catch(e){}}

/* ---------- DB 关卡解析与校验（任一条非法整批放弃） ---------- */
function validLevel(d){
  if(!d||typeof d.diff!=="number"||d.diff<0||d.diff>2||d.diff%1)return false;
  var p=d.puzzle,s=d.sol;
  if(!Array.isArray(p)||p.length!==81||!Array.isArray(s)||s.length!==81)return false;
  for(var i=0;i<81;i++){
    if(typeof p[i]!=="number"||p[i]<0||p[i]>9||p[i]%1)return false;
    if(typeof s[i]!=="number"||s[i]<1||s[i]>9||s[i]%1)return false;
    if(p[i]&&p[i]!==s[i])return false;
  }
  for(var r=0;r<9;r++)for(var c=0;c<9;c++)if(!okAt(s,r,c,s[r*9+c]))return false;
  return countSolutions(p.slice(),2)===1;
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[];
  for(var i=0;i<res.levels.length;i++){
    var d;
    try{d=JSON.parse(res.levels[i].dataJson)}catch(e){return null}
    if(!validLevel(d))return null;
    list.push({diff:d.diff,puzzle:d.puzzle,sol:d.sol});
  }
  return list;
}
function syncLevelsFromServer(){

}
/* ---------- 存档（本地 + 账号双写） ---------- */
var KEY="sw.sudoku.v1";
function pruneDaily(o){var ks=Object.keys(o).sort();while(ks.length>30)delete o[ks.shift()];return o}
function loadBest(){try{var s=JSON.parse(localStorage.getItem(KEY))||{};
  return{E:s.bestE||0,M:s.bestM||0,H:s.bestH||0,daily:(s.daily&&typeof s.daily==="object")?pruneDaily(s.daily):{}}}catch(e){return{E:0,M:0,H:0,daily:{}}}}
function saveBest(){pruneDaily(best.daily);try{localStorage.setItem(KEY,JSON.stringify({bestE:best.E,bestM:best.M,bestH:best.H,daily:best.daily}))}catch(e){}
  if(GB.available)GB.saveState("sudoku",{bestE:best.E,bestM:best.M,bestH:best.H,daily:best.daily}).catch(function(){});}

function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;

    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var keys=["E","M","H"];
      for(var i=0;i<keys.length;i++){
        var k=keys[i],rv=Math.max(0,parseInt(r["best"+k],10)||0);
        if(rv>0&&(best[k]===0||rv<best[k])){best[k]=rv;changed=true}
      }
      // 每日挑战：同日取更优（done 优先，用时短者胜）
      if(r.daily&&typeof r.daily==="object"){
        for(var dk in r.daily){
          var rr=r.daily[dk];if(!rr||typeof rr!=="object")continue;
          var m=best.daily[dk]||(best.daily[dk]={done:false,time:0,diff:0});
          var rt=Math.max(0,parseInt(rr.time,10)||0);
          if(rr.done)m.done=true;
          if(rt>0&&(!m.time||rt<m.time))m.time=rt;
          if((rr.diff||0)>m.diff)m.diff=rr.diff;
          changed=true;
        }
        pruneDaily(best.daily);
      }
      if(changed){saveBest();updDailyBtn()}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 生成器：回溯填满 + 挖洞保唯一解（含每日挑战纯函数块） ---------- */
/*DAILY-PURE-BEGIN*/
var GKEY="sudoku";
function hashKey(s){var h=0;for(var i=0;i<s.length;i++)h+=s.charCodeAt(i);return h%1000}
function seedForDate(ds){return(+ds)*31+hashKey(GKEY)}
function mulberry32(a){return function(){a|=0;a=(a+0x6d2b79f5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(a,rng){for(var i=a.length-1;i>0;i--){var j=Math.floor((rng||Math.random)()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function idx(r,c){return r*9+c}
function okAt(g,r,c,v){
  for(var i=0;i<9;i++){
    if(i!==c&&g[idx(r,i)]===v)return false;
    if(i!==r&&g[idx(i,c)]===v)return false;
  }
  var br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
  for(var rr=br;rr<br+3;rr++)for(var cc=bc;cc<bc+3;cc++)
    if((rr!==r||cc!==c)&&g[idx(rr,cc)]===v)return false;
  return true;
}
function fillAll(g,rng){
  for(var i=0;i<81;i++)if(!g[i]){
    var vals=shuffle([1,2,3,4,5,6,7,8,9],rng),r=Math.floor(i/9),c=i%9;
    for(var j=0;j<9;j++)if(okAt(g,r,c,vals[j])){
      g[i]=vals[j];
      if(fillAll(g,rng))return true;
      g[i]=0;
    }
    return false;
  }
  return true;
}
function countSolutions(g,limit){
  var count=0;
  function rec(){
    for(var i=0;i<81;i++)if(!g[i]){
      var r=Math.floor(i/9),c=i%9;
      for(var v=1;v<=9;v++)if(okAt(g,r,c,v)){
        g[i]=v;rec();g[i]=0;
        if(count>=limit)return;
      }
      return;
    }
    count++;
  }
  rec();
  return count;
}
var DIFF=[{name:"入门",clues:40},{name:"进阶",clues:32},{name:"大师",clues:26}];
function generate(d,rng){
  var base=[],i;
  for(i=0;i<81;i++)base.push(0);
  fillAll(base,rng);
  var sol=base.slice();
  var order=shuffle((function(){var a=[];for(var k=0;k<81;k++)a.push(k);return a})(),rng);
  var holes=0,target=81-DIFF[d].clues,deadline=Date.now()+400;
  for(i=0;i<81&&holes<target;i++){
    if(Date.now()>deadline)break;
    var p=order[i];
    if(!base[p])continue;
    var bak=base[p];
    base[p]=0;
    if(countSolutions(base.slice(),2)>=2)base[p]=bak;
    else holes++;
  }
  return{puzzle:base,sol:sol};
}
function validatePuzzle(g){
  if(!g||!Array.isArray(g.puzzle)||g.puzzle.length!==81||!Array.isArray(g.sol)||g.sol.length!==81)return false;
  for(var i=0;i<81;i++)if(g.puzzle[i]!==0&&g.puzzle[i]!==g.sol[i])return false;
  return countSolutions(g.puzzle.slice(),2)===1;
}
/* 每日挑战：按日期 seed 生成；失败自动 seed+1 重试（tries 次） */
function dailyPuzzleFor(ds,tries){
  var t=tries||8,s=seedForDate(ds),d=s%3,g=null,i;
  for(i=0;i<t;i++){g=generate(d,mulberry32(s+i));if(validatePuzzle(g))break;g=null}
  return g?{puzzle:g.puzzle,sol:g.sol,diff:d,seed:s}:null;
}
/*DAILY-PURE-END*/
/* ---------- 局面状态 ---------- */
var given=[],user=[],notes=[],sol=[],diff=0,elapsed=0,timer=null,running=false,done=false;
var notesMode=false,sel=-1,dailyMode=false,dailyDate="";
var cellEls=[];
function $(id){return document.getElementById(id)}

}
function buildGrid(){
  var s=$("sud");s.innerHTML="";cellEls=[];
  for(var i=0;i<81;i++){
    var d=document.createElement("button");
    var r=Math.floor(i/9),c=i%9;
    d.type="button";
    d.className="cell"+(((Math.floor(r/3)+Math.floor(c/3))%2)?" alt":"")+((c%3===2&&c!==8)?" br":"")+((r%3===2&&r!==8)?" bb":"");
    d.dataset.i=i;
    d.style.animationDelay=(r*32)+"ms";

  }
  //键盘/读屏：容器聚焦后方向键移格、数字键填数、0/Backspace 擦除
  s.addEventListener("keydown",function(e){

    else if(k==="ArrowLeft")c=(c+8)%9;

function fmt(s){var m=Math.floor(s/60),ss=s%60;return(m<10?"0":"")+m+":"+(ss<10?"0":"")+ss}
/* 本地 UTC+8 日期（YYYYMMDD），每日挑战唯一时间源 */
function todayStr(){return new Date(Date.now()+8*3600e3).toISOString().slice(0,10).replace(/-/g,"")}
function updDailyBtn(){

function startGame(d,daily){

function startTimer(){

function updLeft(){

function conflictAt(i,v){
  var r=Math.floor(i/9),c=i%9;
  for(var k=0;k<9;k++){
    if(k!==c&&valOf(idx(r,k))===v)return true;
    if(k!==r&&valOf(idx(k,c))===v)return true;
  }
  var br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
  for(var rr=br;rr<br+3;rr++)for(var cc=bc;cc<bc+3;cc++){
    var j=idx(rr,cc);
    if(j!==i&&valOf(j)===v)return true;
  }
  return false;
}
function valOf(i){return given[i]||user[i]}
function paint(){
  var sv=sel>=0?valOf(sel):0;

  var sbr=sel>=0?Math.floor(sr/3):-1,sbc=sel>=0?Math.floor(sc/3):-1;

    var el=cellEls[i],r=Math.floor(i/9),c=i%9;
    var v=valOf(i);
    var cls="cell"+(((Math.floor(r/3)+Math.floor(c/3))%2)?" alt":"")+((c%3===2&&c!==8)?" br":"")+((r%3===2&&r!==8)?" bb":"");
    if(given[i])cls+=" given";
    if(i===sel)cls+=" sel";
    else if(sel>=0){
      if(r===sr||c===sc||(Math.floor(r/3)===sbr&&Math.floor(c/3)===sbc))cls+=" peer";
      else if(v&&v===sv)cls+=" same";
    }
    if(v&&!given[i]&&conflictAt(i,v))cls+=" bad";

function input(v){

function clearNotesAround(i,v){

  var br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;

function checkWin(){

function setOvBtn(t,icon){$("ovBtn").innerHTML=(icon?SW_ICON(icon):"")+"<span>"+t+"</span>"}

/* ---------- 输入 ---------- */
function buildKeys(){

<script>

(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(els.length){
    function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
    var lastFocus=null;
    function focusFirst(el){
      if(el.dataset.foc)return;el.dataset.foc="1";
      if(!lastFocus)lastFocus=document.activeElement;
      var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
    }
    function restore(el){
      if(!el.dataset.foc)return;delete el.dataset.foc;
      if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
    }
    function trap(el,e){
      if(e.key!=="Tab")return;
      var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
      if(!f.length)return;
      var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
      else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
    }
    function watch(el){
      try{new MutationObserver(function(){
        if(shown(el))focusFirst(el);else restore(el);
      }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
      el.addEventListener("keydown",function(e){trap(el,e)});
    }
    for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  }
  function $(id){return document.getElementById(id)}
  var tp=[["btnNote","pen"],["btnPause","pause"],["btnNew","new"]],j;
  for(j=0;j<tp.length;j++)$(tp[j][0]).insertAdjacentHTML("afterbegin",window.SW_ICON(tp[j][1]));
})();
</script>
</body>
</html>
