<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>数独</title>
<style>
  /*token:GAME-THEME.md §2（全部 UI 走 token）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#1E8C5C;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#C9526B;--g-success:#2D9B6A;--g-warning:#D98A26;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-success:#4ADE6E;--g-warning:#E2A44E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 8px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .diffs { display: flex; gap: 8px; margin-bottom: 10px; }
  .chip {
    flex: 1; min-height: 44px; border: 1px solid var(--g-border); border-radius: var(--g-radius-btn);
    background: var(--g-surface); color: var(--g-muted);
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .chip.on { background: var(--g-primary-soft); color: var(--g-on-soft); border-color: transparent; }
  .sud {
    display: grid; grid-template-columns: repeat(9, 1fr);
    width: min(420px, 100%); margin: 0 auto;
    background: var(--g-surface); border: 2px solid var(--g-faint); border-radius: var(--g-radius-inner);
    overflow: hidden; padding: 2px;
  }
  .cell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums;
    border: 1px solid var(--g-border); background: var(--g-surface); color: var(--g-text);
    position: relative; cursor: pointer; transition: background .15s;
  }
  .cell.given { background: var(--g-surface2); font-weight: 600; }
  .cell.peer { background: var(--g-primary-soft); }
  .cell.same { background: var(--g-primary-soft); box-shadow: inset 0 0 0 2px var(--g-primary); }
  .cell.sel { background: var(--g-primary-soft); box-shadow: inset 0 0 0 2px var(--g-primary-deep); z-index: 1; }
  .cell.bad { color: var(--g-danger); font-weight: 700; }
  .cell .notes {
    position: absolute; inset: 2px; display: grid;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    pointer-events: none;
  }
  .cell .notes span { font-size: 12px; font-weight: 400; color: var(--g-muted); line-height: 1; display: flex; align-items: center; justify-content: center; }
  .cell.given .notes, .cell .num { display: flex; }
  .cell .num { align-items: center; justify-content: center; width: 100%; height: 100%; }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 10px; }
  .key {
    min-height: 48px; border: 0; border-radius: 12px;
    background: var(--g-surface); color: var(--g-text);
    font: inherit; font-size: 22px; font-weight: 600; cursor: pointer;
    box-shadow: 0 1px 0 var(--g-border);
  }
  .key:active { opacity: .7; }
  .key.erase { font-size: 14px; color: var(--g-muted); background: var(--g-surface2); }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 10px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn:active { opacity: .85; }
  .btn.primary { background: var(--g-primary); color: #fff; }
  .btn.on { background: var(--g-primary-soft); color: var(--g-on-soft); }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-faint); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .panel {
    width: 100%; max-width: 320px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 22px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.7; }
  .panel .desc b { color: var(--g-primary-deep); font-size: 22px; }
  .panel .btn { width: 100%; }
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
paint(B||"light");
})();
</script>
</head>
<body>
<div class="wrap">
  <header><span class="sub">每行每列每宫 1-9 不重复</span></header>
  <div class="stats">
    <div class="stat"><span class="label">难度</span><span class="val" id="stDiff">入门</span></div>
    <div class="stat"><span class="label">用时</span><span class="val" id="stTime">00:00</span></div>

  </div>

    <button class="chip on" data-d="0">入门</button>

  </div>
  <div class="sud" id="sud" aria-label="数独棋盘"></div>

  <div class="tools">
    <button class="btn" id="btnNote">笔记 关</button>
    <button class="btn" id="btnPause">暂停</button>
    <button class="btn primary" id="btnNew">新的一局</button>
  </div>
  <p class="foot">冲突数字标红 · 同数字自动高亮 · 填数会自动清理同行列宫的笔记 · 最佳用时按难度分开记录</p>
</div>
<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">已暂停</h2>
    <p class="desc" id="ovDesc"></p>
    <button class="btn" id="ovBtn">继续</button>
  </div>
</div>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 关卡数据（DB 下发优先，本地缓存兜底） ---------- */
var LEVELS_KEY="sw.sudoku.v1.levels",LEVELS_VER_KEY="sw.sudoku.v1.levels.ver",PROG_KEY="sw.sudoku.v1.prog";
var DB_LEVELS=[[],[],[]],fromDb=false;
function setDbLevels(list){
  var by=[[],[],[]];
  for(var i=0;i<list.length;i++){var d=list[i];if(d&&d.diff>=0&&d.diff<=2)by[d.diff].push(d)}
  DB_LEVELS=by;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  setDbLevels(list);
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){setDbLevels(list);return v}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function loadProg(){try{var p=JSON.parse(localStorage.getItem(PROG_KEY))||{};return{d0:p.d0||0,d1:p.d1||0,d2:p.d2||0}}catch(e){return{d0:0,d1:0,d2:0}}}
function saveProg(){try{localStorage.setItem(PROG_KEY,JSON.stringify(prog))}catch(e){}}
var prog=loadProg();
/* ---------- DB 关卡解析与校验（任一条非法整批放弃） ---------- */
function validLevel(d){
  if(!d||typeof d.diff!=="number"||d.diff<0||d.diff>2||d.diff%1)return false;
  var p=d.puzzle,s=d.sol;
  if(!Array.isArray(p)||p.length!==81||!Array.isArray(s)||s.length!==81)return false;
  for(var i=0;i<81;i++){
    if(typeof p[i]!=="number"||p[i]<0||p[i]>9||p[i]%1)return false;
    if(typeof s[i]!=="number"||s[i]<1||s[i]>9||s[i]%1)return false;
    if(p[i]&&p[i]!==s[i])return false;
  }
  for(var r=0;r<9;r++)for(var c=0;c<9;c++)if(!okAt(s,r,c,s[r*9+c]))return false;
  return countSolutions(p.slice(),2)===1;
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[];
  for(var i=0;i<res.levels.length;i++){
    var d;
    try{d=JSON.parse(res.levels[i].dataJson)}catch(e){return null}
    if(!validLevel(d))return null;
    list.push({diff:d.diff,puzzle:d.puzzle,sol:d.sol});
  }
  return list;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("sudoku").then(function(res){
    var list=parseDbLevels(res);
    if(list&&applyLevels(list,res.version||0)&&!fromDb)startGame(diff);
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
var KEY="sw.sudoku.v1";
function loadBest(){try{var s=JSON.parse(localStorage.getItem(KEY))||{};return{E:s.bestE||0,M:s.bestM||0,H:s.bestH||0}}catch(e){return{E:0,M:0,H:0}}}
function saveBest(){try{localStorage.setItem(KEY,JSON.stringify({bestE:best.E,bestM:best.M,bestH:best.H}))}catch(e){}
  if(GB.available)GB.saveState("sudoku",{bestE:best.E,bestM:best.M,bestH:best.H}).catch(function(){});}
var best=loadBest();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("sudoku").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var keys=["E","M","H"];
      for(var i=0;i<keys.length;i++){
        var k=keys[i],rv=Math.max(0,parseInt(r["best"+k],10)||0);
        if(rv>0&&(best[k]===0||rv<best[k])){best[k]=rv;changed=true}
      }
      if(changed)saveBest();
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 生成器：回溯填满 + 挖洞保唯一解 ---------- */
function idx(r,c){return r*9+c}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function okAt(g,r,c,v){
  for(var i=0;i<9;i++){
    if(i!==c&&g[idx(r,i)]===v)return false;
    if(i!==r&&g[idx(i,c)]===v)return false;
  }
  var br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
  for(var rr=br;rr<br+3;rr++)for(var cc=bc;cc<bc+3;cc++)
    if((rr!==r||cc!==c)&&g[idx(rr,cc)]===v)return false;
  return true;
}
function fillAll(g){
  for(var i=0;i<81;i++)if(!g[i]){
    var vals=shuffle([1,2,3,4,5,6,7,8,9]),r=Math.floor(i/9),c=i%9;
    for(var j=0;j<9;j++)if(okAt(g,r,c,vals[j])){
      g[i]=vals[j];
      if(fillAll(g))return true;
      g[i]=0;
    }
    return false;
  }
  return true;
}
function countSolutions(g,limit){
  var count=0;
  function rec(){
    for(var i=0;i<81;i++)if(!g[i]){
      var r=Math.floor(i/9),c=i%9;
      for(var v=1;v<=9;v++)if(okAt(g,r,c,v)){
        g[i]=v;rec();g[i]=0;
        if(count>=limit)return;
      }
      return;
    }
    count++;
  }
  rec();
  return count;
}
var DIFF=[{name:"入门",clues:40},{name:"进阶",clues:32},{name:"大师",clues:26}];
function generate(d){
  var base=[],i;
  for(i=0;i<81;i++)base.push(0);
  fillAll(base);
  var sol=base.slice();
  var order=shuffle((function(){var a=[];for(var k=0;k<81;k++)a.push(k);return a})());
  var holes=0,target=81-DIFF[d].clues,deadline=Date.now()+400;
  for(i=0;i<81&&holes<target;i++){
    if(Date.now()>deadline)break;
    var p=order[i];
    if(!base[p])continue;
    var bak=base[p];
    base[p]=0;
    if(countSolutions(base.slice(),2)>=2)base[p]=bak;
    else holes++;
  }
  return{puzzle:base,sol:sol};
}
/* ---------- 局面状态 ---------- */
var given=[],user=[],notes=[],sol=[],diff=0,elapsed=0,timer=null,running=false,done=false;
var notesMode=false,sel=-1;
var cellEls=[];
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function buildGrid(){
  var s=$("sud");s.innerHTML="";cellEls=[];
  for(var i=0;i<81;i++){
    var d=document.createElement("div");
    d.className="cell";
    d.dataset.i=i;
    d.addEventListener("click",function(){sel=+this.dataset.i;paint()});
    s.appendChild(d);cellEls.push(d);
  }
  //3×3 宫分隔线加粗
  for(var j=0;j<81;j++){
    var r=Math.floor(j/9),c=j%9;
    if(c%3===2&&c!==8)cellEls[j].style.borderRight="2px solid "+getVar("--g-faint");
    if(r%3===2&&r!==8)cellEls[j].style.borderBottom="2px solid "+getVar("--g-faint");
  }
}
function getVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function fmt(s){var m=Math.floor(s/60),ss=s%60;return(m<10?"0":"")+m+":"+(ss<10?"0":"")+ss}
function startGame(d){
  diff=d;
  document.querySelectorAll(".chip").forEach(function(ch){ch.classList.toggle("on",+ch.dataset.d===d)});
  say("出题中…");
  var arr=DB_LEVELS[d],lv=-1,g;
  if(arr&&arr.length){
    lv=(prog["d"+d]||0)%arr.length;
    prog["d"+d]=lv+1;saveProg();
    g={puzzle:arr[lv].puzzle.slice(),sol:arr[lv].sol.slice()};
    fromDb=true;
  }else{
    g=generate(d);
    fromDb=false;
  }
  $("stDiff").textContent=DIFF[d].name+(lv>=0?" "+(lv+1)+"/"+arr.length:"");
  given=g.puzzle;sol=g.sol;
  user=[];notes=[];
  for(var i=0;i<81;i++){user.push(0);notes.push([])}
  sel=-1;done=false;elapsed=0;
  $("stTime").textContent="00:00";
  paint();updLeft();
  startTimer();
  say(DIFF[d].name+(lv>=0?" "+(lv+1)+"/"+arr.length:"")+" · 提示格 "+given.filter(function(v){return v}).length);
}
function startTimer(){
  stopTimer();running=true;
  timer=setInterval(function(){
    if(!running)return;
    elapsed++;
    $("stTime").textContent=fmt(elapsed);
    if(elapsed>=3599)elapsed=3598;//封顶防溢出展示
  },1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null}running=false}
function updLeft(){
  var n=0;
  for(var i=0;i<81;i++)if(!given[i]&&!user[i])n++;
  $("stLeft").textContent=n;
}
function conflictAt(i,v){
  var r=Math.floor(i/9),c=i%9;
  for(var k=0;k<9;k++){
    if(k!==c&&valOf(idx(r,k))===v)return true;
    if(k!==r&&valOf(idx(k,c))===v)return true;
  }
  var br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
  for(var rr=br;rr<br+3;rr++)for(var cc=bc;cc<bc+3;cc++){
    var j=idx(rr,cc);
    if(j!==i&&valOf(j)===v)return true;
  }
  return false;
}
function valOf(i){return given[i]||user[i]}
function paint(){
  var sv=sel>=0?valOf(sel):0;
  var sr=sel>=0?Math.floor(sel/9):-1,sc=sel>=0?sel%9:-1;
  var sbr=sel>=0?Math.floor(sr/3):-1,sbc=sel>=0?Math.floor(sc/3):-1;
  for(var i=0;i<81;i++){
    var el=cellEls[i],r=Math.floor(i/9),c=i%9;
    var v=valOf(i);
    var cls="cell";
    if(given[i])cls+=" given";
    if(i===sel)cls+=" sel";
    else if(sel>=0){
      if(r===sr||c===sc||(Math.floor(r/3)===sbr&&Math.floor(c/3)===sbc))cls+=" peer";
      else if(v&&v===sv)cls+=" same";
    }
    if(v&&!given[i]&&conflictAt(i,v))cls+=" bad";
    el.className=cls;
    //内容：正式数字 或 笔记
    var html="";
    if(v){
      var numCls=(v&&!given[i]&&!conflictAt(i,v))?' style="color:var(--g-primary-deep)"':"";
      html='<span class="num"'+numCls+'>'+v+"</span>";
    }else if(notes[i].length){
      html='<span class="notes">';
      for(var n=1;n<=9;n++)html+="<span>"+(notes[i].indexOf(n)>=0?n:"")+"</span>";
      html+="</span>";
    }
    el.innerHTML=html;
  }
}
function input(v){
  if(done||sel<0||given[sel]){if(sel<0)say("先点选一个空格");return}
  if(notesMode&&!v){
    notes[sel]=[];paint();return;
  }
  if(notesMode){
    if(user[sel]){user[sel]=0}
    var p=notes[sel].indexOf(v);
    if(p>=0)notes[sel].splice(p,1);else notes[sel].push(v);
    paint();return;
  }
  if(user[sel]===v){user[sel]=0;paint();return}//同数再点 = 擦除
  user[sel]=v;
  clearNotesAround(sel,v);
  paint();updLeft();
  checkWin();
}
function clearNotesAround(i,v){
  var r=Math.floor(i/9),c=i%9;
  for(var k=0;k<9;k++){
    [idx(r,k),idx(k,c)].forEach(function(j){
      var p=notes[j].indexOf(v);
      if(p>=0)notes[j].splice(p,1);
    });
  }
  var br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
  for(var rr=br;rr<br+3;rr++)for(var cc=bc;cc<bc+3;cc++){
    var j2=idx(rr,cc),p2=notes[j2].indexOf(v);
    if(p2>=0)notes[j2].splice(p2,1);
  }
}
function checkWin(){
  for(var i=0;i<81;i++)if(valOf(i)!==sol[i])return;
  done=true;stopTimer();
  var key=diff===0?"E":diff===1?"M":"H";
  var isRecord=!best[key]||elapsed<best[key];
  if(isRecord){best[key]=elapsed;saveBest()}
  // 成绩上报（用时 asc：越少越好）
  if(GB.available)GB.reportScore("sudoku",{metricValue:elapsed}).catch(function(){});
  $("ovTitle").textContent="完成！";
  $("ovDesc").innerHTML="用时 <b>"+fmt(elapsed)+"</b><br>"+DIFF[diff].name+"难度"+(isRecord?" · 新纪录！":" · 最佳 "+fmt(best[key]));
  $("ovBtn").textContent="再来一局";
  $("overlay").classList.add("show");
  say("全部正确，漂亮！");
}
function togglePause(){
  if(done)return;
  if(running){
    stopTimer();
    $("ovTitle").textContent="已暂停";
    $("ovDesc").innerHTML="计时已停，随时回来继续";
    $("ovBtn").textContent="继续";
    $("overlay").classList.add("show");
  }else{
    $("overlay").classList.remove("show");
    startTimer();
  }
}
/* ---------- 输入 ---------- */
function buildKeys(){
  var k=$("keys");k.innerHTML="";
  for(var n=1;n<=9;n++){
    var b=document.createElement("button");
    b.className="key";b.textContent=n;
    b.addEventListener("click",function(){input(+this.textContent)});
    k.appendChild(b);
  }
  var e=document.createElement("button");
  e.className="key erase";e.textContent="擦除";
  e.addEventListener("click",function(){input(0)});
  k.appendChild(e);
}
document.querySelectorAll(".chip").forEach(function(ch){
  ch.addEventListener("click",function(){startGame(+this.dataset.d)});
});
$("btnNote").addEventListener("click",function(){
  notesMode=!notesMode;
  this.textContent=notesMode?"笔记 开":"笔记 关";
  this.classList.toggle("on",notesMode);
  say(notesMode?"笔记模式：点数字写候选，再点一次取消":"正式填数模式");
});
$("btnPause").addEventListener("click",togglePause);
$("btnNew").addEventListener("click",function(){startGame(diff)});
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(!done)startTimer();else startGame(diff);
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&running&&!done)togglePause();
});
buildGrid();buildKeys();startGame(0);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
