/* 覆盖层焦点管理：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},

/* ========== 核心与关卡（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
var SG={};
function sgMulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
/* 由种子生成订单与盘面（先保证订单所需品类各至少一盘，再随机补齐后洗牌） */
SG.genLevel=function(level){
  var rng=sgMulberry32(level.seed||1),orderList=[],i;
  for(i=0;i<level.orders;i++)orderList.push((rng()*level.types)|0);
  var counts={},plates=[];
  for(i=0;i<orderList.length;i++)counts[orderList[i]]=(counts[orderList[i]]||0)+1;
  var keys=Object.keys(counts).map(Number).sort(function(a,b){return a-b;});
  for(i=0;i<keys.length;i++)for(var k=0;k<counts[keys[i]];k++)plates.push(keys[i]);
  while(plates.length<level.plates)plates.push((rng()*level.types)|0);
  for(i=plates.length-1;i>0;i--){var j=(rng()*(i+1))|0;var tmp=plates[i];plates[i]=plates[j];plates[j]=tmp;}
  return {orders:orderList,plates:plates};
};
/* 可通关性验证：订单品类在盘面上数量充足；品类/限时/新鲜度/转速/目标分合法 */
SG.validate=function(level){
  if(!level||typeof level!=="object")return{ok:false,why:"bad"};
  if(!Number.isInteger(level.types)||level.types<3||level.types>5)return{ok:false,why:"types"};
  if(!Number.isInteger(level.orders)||level.orders<5||level.orders>20)return{ok:false,why:"orders"};
  if(!Number.isInteger(level.plates)||level.plates<level.orders||level.plates>40)return{ok:false,why:"plates"};
  if(!(level.fresh>=6&&level.fresh<=16))return{ok:false,why:"fresh"};
  if(!(level.speed>=0.4&&level.speed<=1.4))return{ok:false,why:"speed"};
  if(!(level.time>=level.orders*3))return{ok:false,why:"time"};
  if(!Number.isInteger(level.target)||level.target<1||level.target>level.orders)return{ok:false,why:"target"};
  var g=SG.genLevel(level),counts={},req={},t;
  for(var i=0;i<g.plates.length;i++)counts[g.plates[i]]=(counts[g.plates[i]]||0)+1;
  for(i=0;i<g.orders.length;i++)req[g.orders[i]]=(req[g.orders[i]]||0)+1;
  for(t in req)if((counts[t]||0)<req[t])return{ok:false,why:"count"+t};
  return{ok:true,why:"",plates:g.plates.length,orders:g.orders.length};
};
SG.validateAll=function(list){
  var fails=[],i;
  for(i=0;i<list.length;i++){var r=SG.validate(list[i]);if(!r.ok)fails.push((i+1)+"("+r.why+")");}
  return {total:list.length,solvable:list.length-fails.length,fail:fails};
};
globalThis.__XC=SG;
/*XC-CORE-END*/

var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY="sw.sushi-grab.v1.levels",LEVELS_VER_KEY="sw.sushi-grab.v1.levels.ver";
function applyLevels(list,version){
  if(!Array.isArray(list)||list.length<40)return false;
  for(var i=0;i<list.length;i++)if(!SG.validate(list[i]).ok)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length>=40){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function parseLevels(res){
  if(!res||!Array.isArray(res.levels)||res.levels.length<40)return false;
  var list=[],i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item.dataJson!=="string")return false;
    var d;try{d=JSON.parse(item.dataJson);}catch(e){return false;}
    if(!SG.validate(d).ok)return false;
    list.push(d);
  }
  return list;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels("sushi-grab").then(function(res){
    var list=parseLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){setupLevel(Math.max(0,Math.min(cur,LEVELS.length-1)));showStart();}
  }).catch(function(){});
}

/* ---------- 存档 ---------- */
var KEY="sw.sushi-grab.v1";
function loadSave(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&typeof s==="object"){
      var done={};
      if(s.done&&typeof s.done==="object")for(var k in s.done){var v=parseInt(s.done[k],10);if(v>0)done[k]=v;}
      return {lv:Math.max(0,parseInt(s.lv,10)||0),done:done,best:Math.max(0,parseInt(s.best,10)||0)};
    }
  }catch(e){}
  return {lv:0,done:{},best:0};
}
var saveData=loadSave();
var doneSave=saveData.done||{};
var best=saveData.best||0;
function totalBest(){var t=0,k;for(k in doneSave){var v=parseInt(doneSave[k],10)||0;if(v>0)t+=v;}return t;}
function save(){
  var data={lv:saveData.lv,done:doneSave,best:best};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState("sushi-grab",data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("sushi-grab").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(remote.lv,10)||0;if(rl>saveData.lv){saveData.lv=rl;changed=true;}
      var rb=parseInt(remote.best,10)||0;if(rb>best){best=rb;changed=true;}
      if(remote.done&&typeof remote.done==="object")for(var k in remote.done){
        var rv=parseInt(remote.done[k],10)||0,mv=parseInt(doneSave[k],10)||0;
        if(rv>mv){doneSave[k]=rv;changed=true;}
      }
      if(changed){best=Math.max(best,totalBest());save();refreshStats();}
    }catch(e){}
  }).catch(function(){});
}

var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var stLv=document.getElementById("stLv"),stScore=document.getElementById("stScore"),stTime=document.getElementById("stTime");
var msgEl=document.getElementById("msg");
var btnPause=document.getElementById("btnPause"),btnLevels=document.getElementById("btnLevels"),btnRetry=document.getElementById("btnRetry");
var overlay=document.getElementById("overlay"),panel=document.getElementById("panel");
function $(id){return document.getElementById(id);}
function say(t){msgEl.textContent=t;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}

var cur=0,L=null,gData=null,plates=[],orders=[],score=0,timeLeft=0;
var state="ready",paused=false,over=false;
var W=0,H=0,dpr=1,cx=0,cy=0,R=0,pickAngle=-Math.PI/2,flash=0,lastFrame=0;
function fit(){
  var r=cv.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(200,r.width);H=Math.max(200,r.width);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2;cy=H*0.6;R=Math.min(W,H)*0.32;
  draw();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);

function setupLevel(n){
  n=Math.max(0,Math.min(n,LEVELS.length-1));
  cur=n;L=LEVELS[n];
  gData=SG.genLevel(L);
  plates=[];
  for(var i=0;i<gData.plates.length;i++){
    plates.push({type:gData.plates[i],angle:pickAngle+Math.PI+i*(Math.PI*2/gData.plates.length),age:0});
  }
  orders=[];
  for(i=0;i<gData.orders.length;i++)orders.push({type:gData.orders[i],done:false});
  score=0;timeLeft=L.time;over=false;paused=false;flash=0;
  fit();refreshStats();
  btnPause.disabled=true;btnPause.textContent="暂停";
  say("点击「开始」上盘");
}
function startPlay(){
  state="running";paused=false;over=false;
  hideOverlay();
  btnPause.disabled=false;btnPause.textContent="暂停";
  say("点按寿司抓取 · 按顶部订单交付");
}
function togglePause(){
  if(state!=="running")return;
  paused=!paused;
  btnPause.textContent=paused?"继续":"暂停";
  if(paused)showPause();else hideOverlay();
  say(paused?"已暂停":"已继续");
}
function retryLevel(){setupLevel(cur);startPlay();}
function enterLevel(n){setupLevel(n);showStart();}
function refreshStats(){
  stLv.textContent=(cur+1)+"/"+LEVELS.length;
  stScore.textContent=String(score);
  stTime.textContent=Math.max(0,Math.ceil(timeLeft));
}
function endLevel(win){
  if(over)return;
  over=true;state="over";btnPause.disabled=true;
  var sc=Math.max(0,score);
  var prev=doneSave[cur]||0;if(sc>prev)doneSave[cur]=sc;
  var tb=totalBest();if(tb>best)best=tb;
  if(win&&cur+1>saveData.lv)saveData.lv=cur+1;
  save();
  if(GB.available)GB.reportScore("sushi-grab",{metricValue:best,metricExtra:cur+1}).catch(function(){});
  refreshStats();
  if(win)showWin(sc);else showFail(sc);
}
function grabPlate(idx){
  if(state!=="running"||paused||over)return;
  var p=plates[idx];if(!p)return;
  plates.splice(idx,1);
  var oi=-1;
  for(var i=0;i<orders.length;i++)if(!orders[i].done&&orders[i].type===p.type){oi=i;break;}
  if(oi>=0){orders[oi].done=true;score++;say("交付成功 +1");}
  else{score--;flash=1;say("不是订单要的 · -1");}
  refreshStats();
  if(orders.every(function(o){return o.done;}))endLevel(true);
}
function grabNearest(){
  if(!plates.length)return;
  var best=0,bestD=1e9;
  for(var i=0;i<plates.length;i++){
    var d=Math.abs(angDiff(plates[i].angle,pickAngle));
    if(d<bestD){bestD=d;best=i;}
  }
  grabPlate(best);
}
function angDiff(a,b){
  var d=a-b;
  while(d>Math.PI)d-=Math.PI*2;
  while(d<-Math.PI)d+=Math.PI*2;
  return d;
}

/* ---------- 更新 ---------- */
function update(dt){
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;refreshStats();endLevel(score>=L.target);return;}
  for(var i=plates.length-1;i>=0;i--){
    var p=plates[i];
    p.angle+=L.speed*dt;
    p.age+=dt;
    if(p.age>=L.fresh){plates.splice(i,1);score--;flash=1;say("寿司过期回收 · -1");refreshStats();}
  }
  flash=Math.max(0,flash-dt*2.5);
  refreshStats();
}

/* ---------- 渲染 ---------- */
function drawSushi(x,y,type,s){
  ctx.fillStyle=PAL.plate;
  ctx.beginPath();ctx.ellipse(x,y,s,s*0.62,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.fish[type%PAL.fish.length];
  ctx.beginPath();ctx.ellipse(x,y-s*0.12,s*0.62,s*0.34,0,0,Math.PI*2);ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.surface2;ctx.fillRect(0,0,W,H);
  // 订单栏
  var n=orders.length,chipW=Math.min(30,(W-24)/Math.max(n,1)-4),ox=W/2-(n*(chipW+4)-4)/2;
  for(var i=0;i<n;i++){
    var x=ox+i*(chipW+4);
    ctx.fillStyle=orders[i].done?PAL.soft:PAL.surface;
    ctx.strokeStyle=orders[i].done?PAL.primary:PAL.border;ctx.lineWidth=1;
    ctx.beginPath();ctx.rect(x,10,chipW,30);ctx.fill();ctx.stroke();
    drawSushi(x+chipW/2,25,orders[i].type,8);
    if(orders[i].done){ctx.strokeStyle=PAL.primary;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+6,25);ctx.lineTo(x+12,31);ctx.lineTo(x+20,19);ctx.stroke();}
  }
  // 转盘
  ctx.fillStyle=PAL.belt;
  ctx.beginPath();ctx.arc(cx,cy,R+22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.surface2;
  ctx.beginPath();ctx.arc(cx,cy,R+8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=PAL.beltline;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,R+8,0,Math.PI*2);ctx.stroke();
  // 取餐区
  var px=cx+Math.cos(pickAngle)*(R+8),py=cy+Math.sin(pickAngle)*(R+8);
  ctx.strokeStyle=PAL.primary;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(px,py,20,0,Math.PI*2);ctx.stroke();
  // 寿司
  for(var j=0;j<plates.length;j++){
    var p=plates[j];
    var x=cx+Math.cos(p.angle)*(R+8),y=cy+Math.sin(p.angle)*(R+8);
    drawSushi(x,y,p.type,11);
    // 新鲜度弧
    var k=1-p.age/L.fresh;
    ctx.strokeStyle=k>0.35?PAL.primary:PAL.danger;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,y,16,-Math.PI/2,-Math.PI/2+Math.PI*2*k);ctx.stroke();
  }
  if(flash>0){
    ctx.globalAlpha=Math.min(0.4,flash*0.4);
    ctx.fillStyle=PAL.danger;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
  ctx.fillStyle=PAL.muted;ctx.font="700 14px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("目标 "+L.target+" 分 · 剩余 "+Math.max(0,Math.ceil(timeLeft))+" 秒",W/2,H-16);
}

/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  if(state!=="running"||paused||over)return;
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  var bi=-1,bd=1e9;
  for(var i=0;i<plates.length;i++){
    var px=cx+Math.cos(plates[i].angle)*(R+8),py=cy+Math.sin(plates[i].angle)*(R+8);
    var d=Math.hypot(x-px,y-py);
    if(d<bd){bd=d;bi=i;}
  }
  if(bd<34)grabPlate(bi);
});
document.addEventListener("keydown",function(e){
  if(e.repeat)return;
  if(e.key===" "){e.preventDefault();if(state==="running")grabNearest();else if(state==="ready"||state==="over")startPlay();return;}
  if(e.key==="p"||e.key==="P"){if(state==="running")togglePause();return;}
});

/* ---------- 主循环 ---------- */
function loop(now){
  requestAnimationFrame(loop);
  var dt=((now-lastFrame)/1000)||0.016;lastFrame=now;
  if(dt>0.05)dt=0.05;
  if(state==="running"&&!paused&&!over)update(dt);
  draw();
}

setupLevel(Math.max(0,Math.min(saveData.lv,LEVELS.length-1)));
requestAnimationFrame(loop);
syncLevelsFromServer();
syncSaveFromServer();
showStart();
window.__validateLevels=function(){
  try{return SG.validateAll(LEVELS);}catch(e){return {error:String(e)};}
};
})();
</script>
