<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>近义天梯</title>
<style>
  /*token:GAME-THEME.md §2（全部 UI 壳走 token）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 8px; text-align: center; line-height: 1.3; min-width: 0; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.bad { color: var(--g-danger); }
  .ladder {
    display: flex; flex-direction: column-reverse; gap: 8px; align-items: stretch;
    background: var(--g-surface); border-radius: var(--g-radius-inner);
    padding: 12px; margin-bottom: 10px; box-shadow: var(--g-shadow);
  }
  .rung {
    min-height: 46px; display: flex; align-items: center; justify-content: center;
    border-radius: var(--g-radius-btn); font-size: 18px; font-weight: 700;
    background: var(--g-surface2); color: var(--g-faint); padding: 4px 10px;
  }
  .rung.fixed { background: var(--g-primary-soft); color: var(--g-on-soft); }
  .rung.fixed.end { background: var(--g-surface2); color: var(--g-primary-deep); }
  .rung.filled { background: var(--g-primary-soft); color: var(--g-on-soft); }
  .rung.act { box-shadow: inset 0 0 0 2px var(--g-primary); }
  .rung.shake { animation: shake .3s ease-in-out; box-shadow: inset 0 0 0 2px var(--g-danger); }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 8px; }
  .tile {
    min-height: 48px; padding: 0 18px; border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
    box-shadow: 0 1px 0 var(--g-border);
  }
  .tile:active { transform: scale(.95); }
  .tile.used { opacity: .2; pointer-events: none; }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .35; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（注意：动效层指令，不受 §4 主题层禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
  /* P2: 键盘焦点可见 */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>
</head>
<body>
<div class="wrap">
  <header><span class="sub" id="lvTag">第 1 关</span><span class="sub" id="lvRule"></span></header>
  <div class="stats">
    <div class="stat"><span class="label">关卡</span><span class="val" id="stLv">1/40</span></div>
    <div class="stat"><span class="label">梯级</span><span class="val" id="stStep">0/3</span></div>
    <div class="stat"><span class="label">失误</span><span class="val" id="stErr">0</span></div>
  </div>
  <div class="ladder" id="ladder" aria-label="近义天梯"></div>
  <div class="tiles" id="tiles" aria-label="候选词卡"></div>
  <p class="msg" id="msg" role="status" aria-live="polite">从起点词出发，按近义渐变次序爬到终点词（其中混着一个陷阱词）</p>
  <div class="tools">
    <button class="btn" id="btnReset">重开</button>
    <button class="btn" id="btnLv">选关</button>
  </div>
  <p class="foot">键盘：1-4 选词卡 · R 重开 · 相邻梯级词义相近、逐级过渡 · 进度自动保存</p>
</div>
<div class="overlay" role="dialog" aria-modal="true" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">过关！</h2>
    <p class="desc" id="ovDesc"></p>
    <div class="lvgrid" id="lvgrid" hidden></div>
    <button class="btn primary" id="ovBtn">下一关</button>
  </div>
</div>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 天梯库：40 组 {起点词, 中间三级近义路径, 终点词, 陷阱词}（近义渐变路径逐组校对） ---------- */
var GAME_KEY="synonym-ladder",SAVE_KEY="sw.synonymladder.v1";
var LADDERS=[
["高兴","快乐","开心","欢喜","喜悦","生气"],
["悲伤","难过","伤心","痛苦","悲痛","高兴"],
["美丽","漂亮","好看","动人","迷人","丑陋"],
["巨大","庞大","宏大","浩大","磅礴","渺小"],
["渺小","微小","细小","琐碎","细碎","巨大"],
["聪明","机灵","伶俐","灵活","灵巧","愚笨"],
["愚笨","迟钝","呆板","死板","古板","聪明"],
["勤劳","勤奋","用功","努力","刻苦","懒惰"],
["懒惰","懒散","松懈","散漫","拖沓","勤劳"],
["勇敢","无畏","果敢","果断","坚决","胆小"],
["胆小","怯懦","软弱","脆弱","柔弱","勇敢"],
["干净","洁净","清洁","清爽","清新","肮脏"],
["肮脏","污秽","邋遢","凌乱","杂乱","干净"],
["安静","宁静","平静","幽静","寂静","热闹"],
["热闹","喧闹","喧哗","嘈杂","吵闹","安静"],
["崎岖","坎坷","曲折","波折","起伏","平坦"],
["平坦","平缓","平整","光滑","平滑","崎岖"],
["节约","节省","俭省","节俭","朴素","浪费"],
["浪费","铺张","奢侈","豪华","奢华","节约"],
["帮助","协助","辅助","援助","支援","破坏"],
["破坏","损坏","损毁","摧毁","毁坏","保护"],
["保护","保卫","守卫","防卫","呵护","破坏"],
["思考","思索","思量","考虑","考量","发呆"],
["观察","观看","观赏","浏览","欣赏","无视"],
["快速","迅速","飞快","急速","神速","缓慢"],
["缓慢","迟缓","舒缓","平缓","徐缓","快速"],
["增加","添加","增长","增添","补充","减少"],
["减少","缩减","削减","缩小","降低","增加"],
["开始","起初","开端","发端","起步","结束"],
["结束","终结","完毕","收场","收尾","开始"],
["出现","显现","呈现","浮现","展现","消失"],
["消失","消逝","消散","隐没","湮灭","出现"],
["希望","期望","盼望","渴望","指望","失望"],
["失望","绝望","灰心","气馁","沮丧","希望"],
["骄傲","自满","自负","傲慢","狂妄","谦虚"],
["谦虚","谦逊","虚心","谦和","谦让","骄傲"],
["温和","温柔","温顺","和气","和蔼","凶恶"],
["凶恶","粗暴","蛮横","强横","狠毒","温和"],
["模糊","朦胧","隐约","含混","含糊","清楚"],
["清楚","清晰","明晰","明朗","明白","模糊"]
];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* ---------- 关卡：40 关即 40 组，运行时打乱 4 张卡（3 路径词 + 1 陷阱词） ---------- */
function genLevels(){
  var list=[];
  for(var i=0;i<LADDERS.length;i++){
    var a=LADDERS[i];
    list.push({name:"天梯·"+(i+1<10?"0":"")+(i+1),from:a[0],path:a.slice(1,4),to:a[4],trap:a[5],difficulty:Math.min(6,Math.floor(i/7)+1)});
  }
  return list;
}
var DEFAULT_LEVELS=genLevels();
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
/* ---------- 独立验证器：结构完整性 + 词间互斥 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(typeof d.from!=="string"||typeof d.to!=="string"||typeof d.trap!=="string")return false;
  if(!d.from||!d.to||!d.trap||d.from.length>3||d.to.length>3||d.trap.length>3)return false;
  if(!Array.isArray(d.path)||d.path.length!==3)return false;
  var all=[d.from,d.to,d.trap].concat(d.path),seen={};
  for(var i=0;i<all.length;i++){
    var w=all[i];
    if(typeof w!=="string"||!w||w.length>3)return false;
    if(seen[w])return false;               /* 全部词互不相同 */
    seen[w]=1;
  }
  return true;
}
function auditAll(){
  var bad=[];
  for(var i=0;i<LEVELS.length;i++)if(!validLevelData(LEVELS[i]))bad.push(i+1);
  return bad;
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d)||seen[d.name])return null;
    seen[d.name]=1;
    list.push({name:d.name,from:d.from,path:d.path.slice(),to:d.to,trap:d.trap,difficulty:Number.isInteger(d.difficulty)?d.difficulty:5});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();loadLevel(lv);
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,tiles=[],used=[],step=0,errors=0,done=false;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  var pool=L.path.concat([L.trap]);
  tiles=pool.slice();
  /* 打乱且保证首卡不是路径首词（否则一眼看穿） */
  for(var g=0;g<20;g++){
    for(var s=tiles.length-1;s>0;s--){var j=Math.floor(Math.random()*(s+1)),t=tiles[s];tiles[s]=tiles[j];tiles[j]=t;}
    if(tiles[0]!==L.path[0])break;
  }
  used=tiles.map(function(){return false});
  step=0;errors=0;done=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=L.from+" → "+L.to;
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  render();updStats();
  say("从「"+L.from+"」爬到「"+L.to+"」，4 张卡里有 1 张陷阱词");
}
function render(){
  var lad=$("ladder");lad.innerHTML="";
  var rungs=[L.from,L.path[0],L.path[1],L.path[2],L.to];
  for(var i=0;i<rungs.length;i++){
    var d=document.createElement("div");
    var fixed=(i===0||i===4);
    var filled=(!fixed&&i-1<step);
    d.className="rung"+(fixed?" fixed"+(i===4?" end":""):(filled?" filled":""))+(i===step+1&&!fixed&&!done?" act":"");
    d.textContent=rungs[i];
    lad.appendChild(d);
  }
  var t=$("tiles");t.innerHTML="";
  for(var k=0;k<tiles.length;k++){
    (function(k){
      var b=document.createElement("button");
      b.className="tile"+(used[k]?" used":"");
      b.textContent=tiles[k];
      b.setAttribute("aria-label","候选词 "+tiles[k]);
      b.addEventListener("click",function(){pick(k)});
      t.appendChild(b);
    })(k);
  }
}
function updStats(){
  $("stStep").textContent=step+"/3";
  var e=$("stErr");e.textContent=errors;
  e.className="val"+(errors>0?" bad":"");
}
function pick(k){
  if(done||used[k])return;
  var w=tiles[k];
  var rungs=$("ladder").children;
  if(w===L.path[step]){
    used[k]=true;step++;
    render();updStats();
    say("登上第 "+step+" 级：「"+w+"」");
    if(step>=3)winLevel();
  }else{
    errors++;updStats();
    var idx=step+1;
    if(rungs[idx]){
      rungs[idx].classList.add("shake");
      setTimeout(function(){rungs[idx].classList.remove("shake")},400);
    }
    if(w===L.trap)say("「"+w+"」是陷阱词，它不属于这条近义链");
    else say("「"+w+"」还不到上梯的时候，注意词义的过渡");
  }
}
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:errors}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"登顶了！";
  $("ovDesc").innerHTML=L.from+" → "+L.path.join(" → ")+" → "+L.to+"<br>失误 "+errors+" 次"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);$("overlay").classList.remove("show");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重开")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
  else{lv++;loadLevel(lv)}
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="4"){
    var i=parseInt(k,10)-1;
    if(i<tiles.length&&!used[i]){pick(i);e.preventDefault();}
  }
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重开")}
  else if(e.key==="Enter"&&$("overlay").classList.contains("show")){$("ovBtn").click();e.preventDefault();}
});
/* ---------- 启动 ---------- */
loadLevel(save.lv);
var badLv=auditAll();
if(badLv.length)say("警告：内嵌验证器发现异常关卡 "+badLv.join(","));
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
