<style>
  /*token:GAME-THEME.md§2（靶面/炸药素材 token 统一 --g-st- 前缀，§3 D2）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-on-primary:#FFF;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gap:16px;--g-st-mat:#EDE7DA;--g-st-gold:#D9A441;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-mat:#3E3B33;--g-st-gold:#8F6F2A;color-scheme:dark }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .boxes { display: flex; gap: 8px; }
  .box { background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 10px; min-width: 86px; padding: 5px 12px; text-align: center; line-height: 1.3; }
  .box.alt { background: var(--g-surface); color: var(--g-text); border: 1px solid var(--g-border); }
  .box .label { display: block; font-size: 12px; }
  .box b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .hint { margin: 0; font-size: 14px; color: var(--g-muted); }
  .btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--g-btn-primary); color: var(--g-on-primary); font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .btn.ghost { background: var(--g-surface); color: var(--g-text); border: 1px solid var(--g-border); }
  .btn:active { opacity: .85; }
  .stage { position: relative; width: 100%; }
  canvas { display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: var(--g-radius-inner); border: 1px solid var(--g-border); background: var(--g-surface); touch-action: none; }
  .overlay { position: absolute; inset: 0; border-radius: var(--g-radius-inner); background: var(--g-scrim); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; text-align: center; }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .card { width: 100%; max-width: 320px; max-height: 100%; overflow: auto; background: var(--g-surface); border: 1px solid var(--g-border); border-radius: var(--g-radius); box-shadow: var(--g-shadow); padding: 16px; }
  .ov-kicker { margin: 0 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--g-muted); }
  .card h2 { margin: 0 0 8px; font-size: 18px; line-height: 1.25; color: var(--g-text); }
  .ov-text { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: var(--g-muted); }
  .ov-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 12px; }
  .ov-stats .st { background: var(--g-surface2); border-radius: 10px; padding: 7px 4px; }
  .ov-stats b { display: block; font-size: 18px; color: var(--g-primary-deep); font-variant-numeric: tabular-nums; }
  .ov-stats span { font-size: 12px; color: var(--g-muted); }
  .ov-btns { display: grid; gap: 8px; }
  .foot { margin: 14px 0 0; font-size: 12px; line-height: 1.6; color: var(--g-muted); text-align: center; }

  /* S2: 动效敏感用户降级（动效层指令，不受 §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时聚焦首个可操作项，Tab 在层内循环，隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 常量与存档 ---------- */
var MW=480,MH=480,ROUND=60;
var KEY="sw.target-rush.v1";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function loadSave(){try{var s=JSON.parse(lsGet(KEY))||{};return{best:parseInt(s.best,10)||0}}catch(e){return{best:0}}}
var save=loadSave();
function persist(){
  try{lsSet(KEY,JSON.stringify(save))}catch(e){}
  if(GB.available)GB.saveState("target-rush",save).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("target-rush").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var rb=parseInt(JSON.parse(res.stateJson).best,10)||0;
      if(rb>save.best){save.best=rb;S.best=rb;persist();syncHud();}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 调色板:CSS变量 → canvas ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL.bg=v("--g-bg");PAL.surface=v("--g-surface");PAL.surface2=v("--g-surface2");PAL.border=v("--g-border");
  PAL.text=v("--g-text");PAL.muted=v("--g-muted");PAL.faint=v("--g-faint");
  PAL.primary=v("--g-primary");PAL.deep=v("--g-primary-deep");PAL.soft=v("--g-primary-soft");PAL.onSoft=v("--g-on-soft");
  PAL.danger=v("--g-danger");PAL.warning=v("--g-warning");PAL.success=v("--g-success");
  PAL.mat=v("--g-st-mat");PAL.gold=v("--g-st-gold");
}
window.__gOnTheme=function(){palLoad();draw();};
/* ---------- DOM ---------- */
function $(id){return document.getElementById(id)}
var cv=$("cv"),ctx=cv.getContext("2d"),ov=$("ov");
var hudScore=$("hudScore"),hudTime=$("hudTime"),hudBest=$("hudBest");
var ovK=$("ovK"),ovT=$("ovT"),ovX=$("ovX"),ovS=$("ovS"),ovB=$("ovB");
/* ---------- 状态 ---------- */
var S={phase:"menu",paused:false,score:0,best:save.best,
  time:ROUND,targets:[],spawnT:0.5,elapsed:0,
  streak:0,maxStreak:0,hits:0,shots:0,
  cross:{x:MW/2,y:MH/2},
  parts:[],floats:[],holeT:0,holeX:0,holeY:0};
function syncHud(){
  hudScore.textContent=String(S.score);
  hudTime.textContent=String(Math.max(0,Math.ceil(S.time)));
  hudBest.textContent=String(S.best);
}
function startRun(){
  S.phase="run";S.paused=false;S.score=0;
  S.time=ROUND;S.targets=[];S.spawnT=0.5;S.elapsed=0;
  S.streak=0;S.maxStreak=0;S.hits=0;S.shots=0;
  S.cross={x:MW/2,y:MH/2};
  S.parts.length=0;S.floats.length=0;
  syncHud();hideOv();
}
function endRun(){
  S.phase="over";
  var isRec=S.score>save.best&&S.score>0;
  if(isRec){save.best=S.score;S.best=S.score;persist();syncHud();}
  var acc=S.shots>0?Math.round(S.hits/S.shots*100):0;
  if(GB.available)GB.reportScore("target-rush",{metricValue:S.best,metricExtra:"命中"+acc+"%"}).catch(function(){});
  syncHud();
  showOv({k:"TIME UP",t:"限时结束",
    x:isRec?"新纪录！缩放靶环心最小，稳住准星再冲。":"脱靶会清空连击倍率，宁可慢半拍也别空枪。",
    stats:[["本局",S.score],["命中率",acc+"%"],["最高连击",S.maxStreak]],
    btns:[["再来一局","primary",startRun]]});
}
/* ---------- 覆盖层 ---------- */
function showOv(o){
  ovK.textContent=o.k||"";ovT.textContent=o.t||"";ovX.textContent=o.x||"";
  var st=o.stats||[];
  ovS.style.display=st.length?"grid":"none";
  ovS.innerHTML=st.map(function(s){return '<div class="st"><b>'+s[1]+"</b><span>"+s[0]+"</span></div>"}).join("");
  ovB.innerHTML="";
  (o.btns||[]).forEach(function(b){
    var el=document.createElement("button");
    el.className="btn"+(b[1]==="ghost"?" ghost":"");
    el.textContent=b[0];el.addEventListener("click",b[2]);ovB.appendChild(el);
  });
  ov.classList.add("show");
}
function hideOv(){ov.classList.remove("show")}
function pauseGame(){
  if(S.phase!=="run"||S.paused)return;
  S.paused=true;
  showOv({k:"PAUSED",t:"已暂停",x:"枪放下，回来继续打。",
    btns:[["继续","primary",function(){S.paused=false;hideOv()}],["重开","ghost",startRun]]});
}
/* ---------- 粒子/浮字 ---------- */
function puff(x,y,n,col,spd){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28,sp=(spd||70)*(0.3+Math.random());
    S.parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.3+Math.random()*.3,max:.6,r:1.4+Math.random()*2,col:col});
  }
}
function float_(x,y,txt,col){S.floats.push({x:x,y:y,txt:txt,col:col||PAL.deep,t:.9})}
/* ---------- 生成 ---------- */
function spawn(){
  var elapsed=S.elapsed;
  var r=Math.random();
  var kind="static";
  if(elapsed>10&&r<0.3)kind="move";
  else if(elapsed>22&&r<0.55)kind="scale";
  if(elapsed>8&&Math.random()<0.16)kind="bomb";
  if(elapsed>15&&Math.random()<0.08)kind="gold";
  var sc=0.8+Math.random()*0.5;
  var m={kind:kind,x:70+Math.random()*(MW-140),y:70+Math.random()*(MH-140),
    r:34*sc,life:kind==="move"?2.6:(kind==="scale"?2:2.2),t:0,
    vx:0,vy:0,ph:Math.random()*6.28,baseR:34*sc,score:1};
  if(kind==="move"){var a=Math.random()*6.28,sp=50+elapsed*1.3;m.vx=Math.cos(a)*sp;m.vy=Math.sin(a)*sp}
  S.targets.push(m);
}
/* ---------- 射击 ---------- */
function shoot(x,y){
  if(S.phase!=="run"||S.paused)return;
  S.shots++;
  S.holeT=.25;S.holeX=x;S.holeY=y;
  var hit=null,hd=1e9;
  for(var i=0;i<S.targets.length;i++){
    var t=S.targets[i];
    var d=Math.hypot(x-t.x,y-t.y);
    if(d<=t.r&&d<hd){hd=d;hit=t;hit.idx=i}
  }
  if(!hit){
    S.streak=0;
    float_(x,y,"脱靶",PAL.muted);
    syncHud();
    return;
  }
  S.targets.splice(hit.idx,1);
  if(hit.kind==="bomb"){
    S.streak=0;
    S.score=Math.max(0,S.score-200);
    float_(x,y-18,"炸药 -200",PAL.danger);
    puff(x,y,18,PAL.warning,130);
    syncHud();
    return;
  }
  S.hits++;S.streak++;
  S.maxStreak=Math.max(S.maxStreak,S.streak);
  var mult=1+0.1*Math.min(S.streak,20);
  var base,ring;
  var ratio=hd/hit.r;
  if(hit.kind==="gold"){base=300;ring="金靶"}
  else if(ratio<=0.2){base=100;ring="10环"}
  else if(ratio<=0.5){base=60;ring="8环"}
  else{base=30;ring="5环"}
  var gain=Math.round(base*mult);
  S.score+=gain;
  float_(x,y-18,ring+" +"+gain+(S.streak>1?" ×"+mult.toFixed(1):""),hit.kind==="gold"?PAL.warning:PAL.deep);
  puff(x,y,hit.kind==="gold"?12:8,hit.kind==="gold"?PAL.gold:PAL.danger,90);
  syncHud();
}
/* ---------- 步进 ---------- */
function step(dt){
  S.elapsed+=dt;
  S.time-=dt;
  if(S.time<=0){S.time=0;endRun();return}
  S.spawnT-=dt;
  var interval=Math.max(0.55,1.15-S.elapsed*0.011);
  var cap=S.elapsed>30?5:4;
  if(S.spawnT<=0&&S.targets.length<cap){spawn();S.spawnT=interval}
  //准星键盘移动
  var kvx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  var kvy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  if(kvx)S.cross.x=Math.max(10,Math.min(MW-10,S.cross.x+kvx*330*dt));
  if(kvy)S.cross.y=Math.max(10,Math.min(MH-10,S.cross.y+kvy*330*dt));
  //靶更新
  for(var i=S.targets.length-1;i>=0;i--){
    var t=S.targets[i];
    t.t+=dt;
    if(t.kind==="move"){
      t.x+=t.vx*dt;t.y+=t.vy*dt;
      if(t.x<50||t.x>MW-50)t.vx*=-1;
      if(t.y<50||t.y>MH-50)t.vy*=-1;
    }else if(t.kind==="scale"){
      t.r=t.baseR*(1-0.75*(t.t/t.life));
      if(t.r<6){S.targets.splice(i,1);continue}
    }
    if(t.t>=t.life){S.targets.splice(i,1);continue}
  }
  if(S.holeT>0)S.holeT-=dt;
  //粒子/浮字
  for(i=S.parts.length-1;i>=0;i--){
    var q=S.parts[i];
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
    if(q.life<=0)S.parts.splice(i,1);
  }
  for(i=S.floats.length-1;i>=0;i--){
    var f=S.floats[i];f.y-=28*dt;f.t-=dt;
    if(f.t<=0)S.floats.splice(i,1);
  }
}
/* ---------- 绘制 ---------- */
var SC=1;
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  SC=r.width/MW;
  ctx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
}
function drawTarget(t){
  ctx.save();
  ctx.translate(t.x,t.y);
  if(t.kind==="bomb"){
    ctx.fillStyle=PAL.danger;
    ctx.beginPath();ctx.arc(0,0,t.r*0.62,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=PAL.danger;ctx.lineWidth=2.4;
    ctx.beginPath();ctx.arc(0,0,t.r,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=PAL.surface;
    ctx.font="700 12px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("雷",0,1);
    ctx.restore();
    return;
  }
  if(t.kind==="gold"){
    ctx.fillStyle=PAL.gold;
    ctx.beginPath();ctx.arc(0,0,t.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,t.r*0.55,0,Math.PI*2);ctx.stroke();
    ctx.restore();
    return;
  }
  var wob=t.kind==="scale"?1:0.94+0.06*Math.sin(t.t*6+t.ph);
  ctx.fillStyle=PAL.mat;
  ctx.beginPath();ctx.arc(0,0,t.r*wob,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.danger;
  ctx.beginPath();ctx.arc(0,0,t.r*wob*0.66,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.mat;
  ctx.beginPath();ctx.arc(0,0,t.r*wob*0.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.danger;
  ctx.beginPath();ctx.arc(0,0,t.r*wob*0.2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(0,0,t.r*wob,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
function draw(){
  ctx.fillStyle=PAL.mat;ctx.globalAlpha=.4;ctx.fillRect(0,0,MW,MH);
  ctx.globalAlpha=1;
  ctx.strokeStyle=PAL.faint;ctx.lineWidth=1;
  for(var i=1;i<6;i++){
    ctx.beginPath();ctx.moveTo(i*MW/6,0);ctx.lineTo(i*MW/6,MH);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*MH/6);ctx.lineTo(MW,i*MH/6);ctx.stroke();
  }
  for(i=0;i<S.targets.length;i++)drawTarget(S.targets[i]);
  //弹孔
  if(S.holeT>0){
    ctx.globalAlpha=Math.min(1,S.holeT*4);
    ctx.fillStyle=PAL.text;
    ctx.beginPath();ctx.arc(S.holeX,S.holeY,4,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  //准星
  var c=S.cross;
  ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(c.x,c.y,14,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(c.x-20,c.y);ctx.lineTo(c.x-7,c.y);
  ctx.moveTo(c.x+7,c.y);ctx.lineTo(c.x+20,c.y);
  ctx.moveTo(c.x,c.y-20);ctx.lineTo(c.x,c.y-7);
  ctx.moveTo(c.x,c.y+7);ctx.lineTo(c.x,c.y+20);ctx.stroke();
  ctx.fillStyle=PAL.deep;
  ctx.beginPath();ctx.arc(c.x,c.y,2.4,0,Math.PI*2);ctx.fill();
  //连击
  if(S.streak>1){
    ctx.fillStyle=PAL.deep;ctx.font="700 22px system-ui,sans-serif";ctx.textAlign="center";
    ctx.fillText("连击 ×"+(1+0.1*Math.min(S.streak,20)).toFixed(1)+"（"+S.streak+"）",MW/2,36);
  }
  //粒子/浮字
  for(i=0;i<S.parts.length;i++){
    var q=S.parts[i];
    ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.fillStyle=q.col;
    ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.font="700 16px system-ui,sans-serif";ctx.textAlign="center";
  for(i=0;i<S.floats.length;i++){
    var f=S.floats[i];
    ctx.globalAlpha=Math.min(1,f.t*1.5);
    ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
/* ---------- 输入 ---------- */
var keys={};
function pos(e){
  var r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  var p=pos(e);
  S.cross.x=p.x;S.cross.y=p.y;
  shoot(p.x,p.y);
});
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
window.addEventListener("blur",function(){keys={}});
document.addEventListener("keydown",function(e){
  keys[e.code]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==="Space"&&!e.repeat)shoot(S.cross.x,S.cross.y);
  if(e.code==="KeyP"&&S.phase==="run"){S.paused?((S.paused=false),hideOv()):pauseGame()}
  if(e.code==="KeyR"&&S.phase!=="menu")startRun();
  if(e.code==="Enter"&&S.phase!=="run")startRun();
});
document.addEventListener("keyup",function(e){keys[e.code]=false});
$("btnPause").addEventListener("click",pauseGame);
$("btnReset").addEventListener("click",startRun);
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&S.phase==="run"&&!S.paused)pauseGame();
});
/* ---------- 主循环 ---------- */
var lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  var dt=Math.min(.05,(now-lastT)/1000);
  lastT=now;
  if(S.phase==="run"&&!S.paused)step(dt);
  draw();
}
/* ---------- 启动 ---------- */
palLoad();
syncHud();
showOv({k:"TARGET RUSH",t:"靶心速射",
  x:"60 秒限时点射：环心 10 环 100 分、8 环 60 分、5 环 30 分，连击叠倍率；金色速靶 +300，打中炸药 -200 并清空连击。标靶会移动、会缩放，手要快眼要准。",
  stats:[["最高分",S.best]],
  btns:[["开始射击","primary",startRun]]});
resize();
window.addEventListener("resize",resize);
requestAnimationFrame(loop);
syncSaveFromServer();
})();
</script>
