<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>俄罗斯方块</title>
<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（方块色板 bp1-8 沿用，外框/槽底/格沟 --g-tet-*）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-on-primary:#FFFFFF;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-hairline:#EFF1EE;--g-danger:#A83850;--g-success:#17734A;--g-warning:#9A6210;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gap:16px;--g-bp1:#F2B843;--g-bp2:#7BC57B;--g-bp3:#5AA7E8;--g-bp4:#EE7E9C;--g-bp5:#9B7BE0;--g-bp6:#4FC3D9;--g-bp7:#F08A5A;--g-bp8:#A8C66C;--g-bshade:rgba(20,40,30,.10);--g-tet-frame1:#FFFFFF;--g-tet-frame2:#E9F0EA;--g-tet-cell:#F4F8F4;--g-tet-grid:#CBD6CB;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-hairline:#262A27;--g-danger:#DB7186;--g-success:#4ADE6E;--g-warning:#E2A44E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-bp1:#F5C45E;--g-bp2:#8FD68F;--g-bp3:#74BDF2;--g-bp4:#F293AC;--g-bp5:#AC8FEC;--g-bp6:#66D2E5;--g-bp7:#F5A072;--g-bp8:#BBD67E;--g-bshade:rgba(0,0,0,.4);--g-tet-frame1:#272C28;--g-tet-frame2:#1A1E1B;--g-tet-cell:#222723;--g-tet-grid:#2B312C;color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; transition: transform .16s ease-out, background .16s ease-out; animation: rise .38s ease-out both; }
  .stat:nth-child(2) { animation-delay: 40ms; }
  .stat:nth-child(3) { animation-delay: 80ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size:18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.bump { animation: bump .24s ease-out; }
  .stage { position: relative; animation: fadein .3s ease-out both; animation-delay: 120ms; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 6px; animation: rise .38s ease-out both; animation-delay: 160ms; }
  .ctl {
    flex: 1; min-height: 48px; border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform .14s ease-out, background .16s ease-out;
  }
  .ctl:active { transform: scale(.96); }
  .ctl.wide { background: var(--g-btn-primary); color: var(--g-on-primary); }
  .bar { display: flex; gap: 8px; margin-top: 8px; animation: rise .38s ease-out both; animation-delay: 200ms; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out;
  }
  .btn:active { transform: scale(.96); }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .legend { display: flex; gap: 8px; margin: 10px 2px 0; animation: rise .38s ease-out both; animation-delay: 240ms; }
  .lg-chip { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; background: var(--g-surface2); border-radius: 10px; padding: 5px 8px; font-size: 12px; color: var(--g-muted); line-height: 1.3; }
  .lg-chip b { color: var(--g-text); font-weight: 600; }
  .lg-blk { width: 12px; height: 12px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; animation: fadein .3s ease-out both; animation-delay: 260ms; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  .panel {
    width: 100%; max-width: 320px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .3s ease-out;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .desc b { color: var(--g-primary-deep); font-size: 22px; }
  .panel .btn { width: 100%; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>

window.SW_ICON=function(n,s){s=s||"";var P={
 'arrow-right':'<path d="M5 12h14M13 6l6 6-6 6"/>','arrow-left':'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 'arrow-up':'<path d="M12 19V5M6 11l6-6 6 6"/>','arrow-down':'<path d="M12 5v14M6 13l6 6 6-6"/>',

 'pause':'<path d="M8 5v14M16 5v14"/>','play':'<path d="M8 5v14l11-7z"/>',
 'check':'<path d="M4 12.5l5 5L20 6.5"/>','x':'<path d="M6 6l12 12M18 6L6 18"/>',
 'star':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',
 'star-o':'<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/>',
 'circle':'<circle cx="12" cy="12" r="5.5"/>','circle-f':'<circle cx="12" cy="12" r="5.5"/>',
 'tri-up':'<path d="M12 5l8 15H4z"/>','tri-down':'<path d="M12 19l-8-15h16z"/>','tri-left':'<path d="M5 12l15-8v16z"/>','tri-right':'<path d="M19 12L4 4v16z"/>',
 'backspace':'<path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z M12.5 9.5l5 5M17.5 9.5l-5 5"/>',
 'swap-h':'<path d="M7 4L3 8l4 4M3 8h14M17 12l4 4-4 4M21 16H7"/>'
};
var fill={ 'star':1,'circle-f':1,'tri-up':1,'tri-down':1,'tri-left':1,'tri-right':1,'play':1 };
return '<svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="'+(fill[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="'+s+'" aria-hidden="true">'+P[n]+'</svg>';
};
</script>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<body>
<div class="wrap">
  <header><span class="sub">落块堆叠 · 铺满一行即消</span></header>
  <div class="stats">

    <button class="ctl" id="cRot"><svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="font-size:28px" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg></button>
    <button class="ctl" id="cRight"><svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="font-size:28px" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="ctl" id="cDown"><svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="font-size:28px" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <button class="ctl wide" id="cDrop"><svg class="swi" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="font-size:28px" aria-hidden="true"><path d="M12 3v13M6 10l6 6 6-6M5 21h14"/></svg></button>

    <h2 id="ovTitle">游戏结束</h2>

  </div>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 调色板：全部经 CSS 变量读取，JS 零颜色字面量 ---------- */
var PAL={bp:[]};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    deep:v("--g-primary-deep"),warning:v("--g-warning"),
    shade:v("--g-bshade"),
    bp:[v("--g-bp1"),v("--g-bp2"),v("--g-bp3"),v("--g-bp4"),v("--g-bp5"),v("--g-bp6"),v("--g-bp7"),v("--g-bp8")],
    frame1:v("--g-tet-frame1"),frame2:v("--g-tet-frame2"),cell:v("--g-tet-cell"),grid:v("--g-tet-grid")};
}
/* 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量（恒白/恒黑除外） */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){var A=colParse(a),B=colParse(b);return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")"}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
window.__gOnTheme=function(){palLoad()};//App 推送主题时刷新调色板，rAF 循环自动重绘
/* ---------- 存档（本地 + 账号双写） ---------- */
var KEY="sw.tetris.v1";
function loadBest(){try{var s=JSON.parse(localStorage.getItem(KEY))||{};return{best:Math.max(0,parseInt(s.best,10)||0),lines:Math.max(0,parseInt(s.lines,10)||0)}}catch(e){return{best:0,lines:0}}}
function saveBest(){try{localStorage.setItem(KEY,JSON.stringify({best:best.best,lines:linesTotal}))}catch(e){}
  if(GB.available)GB.saveState("tetris",{best:best.best,lines:linesTotal}).catch(function(){});}
/* ---------- 状态 ---------- */
var W=10,H=20,board=[],cur=null,next=null,bag=[];
var score=0,best=loadBest(),linesTotal=best.lines,level=1;
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("tetris").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rb=Math.max(0,parseInt(r.best,10)||0),rl=Math.max(0,parseInt(r.lines,10)||0);
      if(rb>best.best){best.best=rb;changed=true}
      if(rl>linesTotal){linesTotal=rl;changed=true}
      if(changed){saveBest();$("stBest").textContent=best.best}
    }catch(e){}
  }).catch(function(){});
}
var dropT=0,state="play";//play/clear/pause/over
var clearRows=[],clearT=0;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var L={cell:0,pad:4,boardX:0,boardY:0,W:0,H:0};
var BASE=[
  [[1,1,1,1]],            //I
  [[1,1],[1,1]],          //O
  [[1,1,1],[0,1,0]],      //T
  [[0,1,1],[1,1,0]],      //S
  [[1,1,0],[0,1,1]],      //Z
  [[1,0,0],[1,1,1]],      //J
  [[0,0,1],[1,1,1]]       //L
];
function $(id){return document.getElementById(id)}
function setBtnIcon(id,n){var el=$(id),svg=el.querySelector("svg");if(svg)svg.outerHTML=SW_ICON(n);else el.insertAdjacentHTML("afterbegin",SW_ICON(n))}
function say(t){$("msg").textContent=t}
/* ---------- 方块 ---------- */
function rot(m){var h=m.length,w=m[0].length,r=[],x,y;for(x=0;x<w;x++){r.push([]);for(y=h-1;y>=0;y--)r[x].push(m[y][x])}return r}
function takePiece(){
  if(!bag.length){bag=[0,1,2,3,4,5,6];for(var i=6;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=bag[i];bag[i]=bag[j];bag[j]=t}}
  var c=bag.pop(),m=[];
  for(var r=0;r<BASE[c].length;r++)m.push(BASE[c][r].slice());
  return{m:m,c:c,x:Math.floor((W-m[0].length)/2),y:0};
}
function collide(m,px,py){
  for(var r=0;r<m.length;r++)for(var c=0;c<m[r].length;c++){
    if(!m[r][c])continue;
    var x=px+c,y=py+r;
    if(x<0||x>=W||y>=H)return true;
    if(y>=0&&board[y][x])return true;
  }
  return false;
}
function kickTurn(){
  var m=rot(cur.m),tries=[0,-1,1];
  for(var i=0;i<tries.length;i++){
    if(!collide(m,cur.x+tries[i],cur.y)){cur.m=m;cur.x+=tries[i];return true}
  }
  return false;
}
function move(dx){
  if(state!=="play")return;
  if(!collide(cur.m,cur.x+dx,cur.y)){cur.x+=dx;return true}
  return false;
}
function softStep(){
  if(!collide(cur.m,cur.x,cur.y+1)){cur.y++;score++;updScore();return true}
  return false;
}
function lockPiece(){
  var top=H;
  for(var r=0;r<cur.m.length;r++)for(var c=0;c<cur.m[r].length;c++){
    if(cur.m[r][c]){
      var y=cur.y+r,x=cur.x+c;
      if(y<0){gameOver();return}
      board[y][x]=cur.c+1;if(y<top)top=y;
    }
  }
  //找满行 → 进入闪烁态
  clearRows=[];
  for(var yy=0;yy<H;yy++){
    var full=true;
    for(var xx=0;xx<W;xx++)if(!board[yy][xx]){full=false;break}
    if(full)clearRows.push(yy);
  }
  if(clearRows.length){state="clear";clearT=0}
  else spawnNext();
}
function finishClear(){
  var n=clearRows.length;
  clearRows.sort(function(a,b){return b-a});
  for(var i=0;i<n;i++)board.splice(clearRows[i],1);
  for(var j=0;j<n;j++)board.unshift([]);
  for(var k=0;k<H;k++)while(board[k].length<W)board[k].push(0);
  var gain=[0,100,300,500,800][n]*level;
  score+=gain;linesTotal+=n;
  level=Math.floor(linesTotal/10)+1;
  updScore();
  if(n>=4)say("四消！+"+gain);
  else if(n>1)say("消 "+n+" 行 +"+gain);
  saveBest();
  spawnNext();
}
function spawnNext(){
  cur=next||takePiece();
  next=takePiece();
  if(collide(cur.m,cur.x,cur.y)){gameOver();return}
  dropT=0;
}
function gravMs(){return Math.max(90,800*Math.pow(0.85,level-1))}
function hardDrop(){
  if(state!=="play")return;
  var d=0;
  while(!collide(cur.m,cur.x,cur.y+1)){cur.y++;d++}
  score+=d*2;updScore();
  lockPiece();
}
var lastLines=0;
function bump(el){el.classList.remove("bump");void el.offsetWidth;el.addEventListener("animationend",function(){el.classList.remove("bump")},{once:true});el.classList.add("bump")}
function updScore(){
  $("stScore").textContent=score;
  $("stLevel").textContent=level+" · "+linesTotal+"行";
  if(score>best.best){best.best=score;saveBest()}
  $("stBest").textContent=best.best;
  if(lastLines!==linesTotal){lastLines=linesTotal;bump($("stLevel"))}   // 消行得分轻弹
}
/* ---------- 流程 ---------- */
function newGame(){
  board=[];for(var r=0;r<H;r++)board.push([]);
  for(var k=0;k<H;k++)while(board[k].length<W)board[k].push(0);
  score=0;level=1;linesTotal=0;lastLines=0;bag=[];next=null;
  state="play";clearRows=[];dropT=0;
  spawnNext();updScore();
  hideOverlay();say("方向键或下方按键操作 · 加速消除拿更高分");
}
function gameOver(){
  state="over";
  saveBest();
  $("ovTitle").textContent="游戏结束";
  $("ovDesc").innerHTML="本局得分 <b>"+score+"</b><br>消除 "+linesTotal+" 行 · 等级 "+level+
    "<br>"+(score>=best.best&&score>0?"新纪录！最高分 "+best.best:"历史最高分 "+best.best);
  $("ovBtnTxt").textContent="再来一局";
  setBtnIcon("ovBtn","rotate");
  // 成绩上报（最高分 desc：越大越好；附累计行数）
  if(GB.available)GB.reportScore("tetris",{metricValue:best.best,metricExtra:linesTotal}).catch(function(){});
  showOverlay();
}
function togglePause(){
  if(state==="play"){state="pause";$("btnPauseTxt").textContent="继续";setBtnIcon("btnPause","play");
    $("ovTitle").textContent="已暂停";$("ovDesc").innerHTML="喘口气，方块悬在半空等你";
    $("ovBtnTxt").textContent="继续游戏";setBtnIcon("ovBtn","play");showOverlay()}
  else if(state==="pause"){state="play";$("btnPauseTxt").textContent="暂停";setBtnIcon("btnPause","pause");hideOverlay()}
}
function showOverlay(){$("overlay").classList.add("show")}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 几何与绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  var availH=Math.max(260,(window.innerHeight||700)-330);
  L.cell=Math.max(14,Math.min(Math.floor((w-2*L.pad)/W),Math.floor(availH/H)));
  L.boardW=L.cell*W;L.boardH=L.cell*H;
  L.boardX=(w-L.boardW)/2;
  L.boardY=L.pad+L.cell*2.6;//顶部预览区
  L.W=w;L.H=L.boardY+L.boardH+L.pad;
  cv.style.height=L.H+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(L.H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function rr(x,y,w2,h2,r){
  r=Math.min(r,w2/2,h2/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);
  ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();
}
function drawCellPx(px,py,size,color){
  var inset=Math.max(1,size*.06);
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.26)";ctx.shadowBlur=Math.max(2,size*0.14);ctx.shadowOffsetY=Math.max(1,size*0.06);   // 恒黑阴影
  var g=ctx.createLinearGradient(0,py+inset,0,py+size-inset);
  g.addColorStop(0,colMix(color,WHITE,0.42));g.addColorStop(0.45,color);g.addColorStop(1,colShade(color,-0.26));
  rr(px+inset,py+inset,size-inset*2,size-inset*2,size*.22);
  ctx.fillStyle=g;ctx.fill();
  ctx.restore();
  ctx.lineWidth=Math.max(1,size*0.045);ctx.strokeStyle=colShade(color,-0.4);
  rr(px+inset+0.5,py+inset+0.5,size-inset*2-1,size-inset*2-1,size*.2);ctx.stroke();
  ctx.fillStyle=WHITE;ctx.globalAlpha=.32;   // 恒白高光
  rr(px+inset+2,py+inset+2,size-inset*2-4,Math.max(2,(size-inset*2)*.22),2);ctx.fill();
  ctx.globalAlpha=1;
}
function text(s,x,y,size,c,align){
  ctx.fillStyle=c;ctx.font="600 "+size+"px -apple-system,'PingFang SC',sans-serif";
  ctx.textAlign=align||"left";ctx.textBaseline="middle";ctx.fillText(s,x,y);
}
function draw(ts){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,L.W,L.H);
  //预览面板（内凹槽「面」+ 顶影 + 落地投影）
  var pw=L.cell*2.6,ppx=L.W-L.pad-pw-8,ppy=L.pad,pph=L.cell*2.6;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.16)";ctx.shadowBlur=8;ctx.shadowOffsetY=3;   // 恒黑阴影
  rr(ppx,ppy,pw+8,pph,10);
  var pg=ctx.createLinearGradient(0,ppy,0,ppy+pph);
  pg.addColorStop(0,PAL.frame2);pg.addColorStop(1,PAL.frame1);
  ctx.fillStyle=pg;ctx.fill();
  ctx.restore();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.grid;rr(ppx+0.5,ppy+0.5,pw+7,pph-1,9.5);ctx.stroke();
  text("下一个",ppx+(pw+8)/2,ppy+pph*0.3,12,PAL.muted,"center");
  if(next){
    var m=next.m,s2=L.cell*0.52;
    var px0=ppx+(pw+8)/2-m[0].length*s2/2,py0=ppy+pph*0.6-m.length*s2/2;
    for(var r=0;r<m.length;r++)for(var c=0;c<m[r].length;c++)
      if(m[r][c])drawCellPx(px0+c*s2,py0+r*s2,s2,PAL.bp[next.c]);
  }
  //场地面板（外框「面」渐变 + 落地投影，格隙露暗端读作沟槽）
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.20)";ctx.shadowBlur=12;ctx.shadowOffsetY=5;   // 恒黑阴影
  rr(L.boardX-3,L.boardY-3,L.boardW+6,L.boardH+6,10);
  var fg=ctx.createLinearGradient(0,L.boardY-3,0,L.boardY+L.boardH+3);
  fg.addColorStop(0,PAL.frame1);fg.addColorStop(1,PAL.frame2);
  ctx.fillStyle=fg;ctx.fill();
  ctx.restore();
  ctx.lineWidth=1;ctx.strokeStyle=PAL.border;rr(L.boardX-3,L.boardY-3,L.boardW+6,L.boardH+6,10);ctx.stroke();
  //空格砖（凸面 + 底缘沟槽暗线）
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){
    if(board[y][x])continue;
    var px=L.boardX+x*L.cell,py=L.boardY+y*L.cell;
    rr(px+1,py+1,L.cell-2,L.cell-2,4);
    ctx.fillStyle=PAL.cell;ctx.fill();
    ctx.fillStyle=PAL.grid;ctx.fillRect(px+2,py+L.cell-2.5,L.cell-4,1.5);
  }
  //闪烁中的待消行
  if(state==="clear"){
    var on=(clearT/100|0)%2===0;
    ctx.fillStyle=on?WHITE:PAL.cell;ctx.globalAlpha=on?.85:1;   // 恒白闪光
    clearRows.forEach(function(ry){ctx.fillRect(L.boardX+1,L.boardY+ry*L.cell+1,L.boardW-2,L.cell-2)});
    ctx.globalAlpha=1;
  }
  //当前块
  if(cur&&(state==="play"||state==="pause")){
    for(var r2=0;r2<cur.m.length;r2++)for(var c2=0;c2<cur.m[r2].length;c2++){
      if(!cur.m[r2][c2])continue;
      var yy2=cur.y+r2;
      if(yy2<0)continue;
      drawCellPx(L.boardX+(cur.x+c2)*L.cell,L.boardY+yy2*L.cell,L.cell,PAL.bp[cur.c]);
    }
  }
}
/* ---------- 主循环 ---------- */
var last=0;
function loop(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(state==="play"){
    dropT+=dt*1000;
    if(dropT>=gravMs()){dropT=0;if(!softStep())lockPiece()}
  }else if(state==="clear"){
    clearT+=dt*1000;
    if(clearT>=220)finishClear();
  }
  draw(ts);
  requestAnimationFrame(loop);
}
/* ---------- 触屏按键（按住连发） ---------- */
function bindHold(id,fn,repeat){
  var el=$(id),iv=null;
  el.addEventListener("pointerdown",function(e){
    try{el.setPointerCapture(e.pointerId)}catch(err){}
    e.preventDefault();fn();
    if(repeat)iv=setInterval(fn,130);
  });
  function stop(){if(iv){clearInterval(iv);iv=null}}
  el.addEventListener("pointerup",stop);
  el.addEventListener("pointercancel",stop);
}
bindHold("cLeft",function(){move(-1)},true);
bindHold("cRight",function(){move(1)},true);
bindHold("cDown",function(){softStep()},true);
bindHold("cRot",kickTurn,false);
bindHold("cDrop",hardDrop,false);
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"){move(-1);e.preventDefault()}
  else if(k==="ArrowRight"){move(1);e.preventDefault()}
  else if(k==="ArrowDown"){softStep();e.preventDefault()}
  else if(k==="ArrowUp"||k==="x"||k==="X"){kickTurn();e.preventDefault()}
  else if(k===" "){hardDrop();e.preventDefault()}
  else if(k==="p"||k==="P"){togglePause()}
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="play")togglePause();
});
$("btnPause").addEventListener("click",togglePause);
$("ovBtn").addEventListener("click",function(){
  if(state==="pause")togglePause();else newGame();
});
window.addEventListener("resize",resize);
setBtnIcon("btnPause","pause");
setBtnIcon("ovBtn","rotate");
palLoad();resize();newGame();
$("stBest").textContent=best.best;
requestAnimationFrame(loop);
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
