<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>三张猜牌</title>
<style>
  /*token:GAME-THEME.md §2 基线（按需取用，值与基线一致）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);color-scheme:dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.4; }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; min-width: 0; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.plain { color: var(--g-text); }
  .btn {
    min-height: 44px; padding: 0 12px; border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--g-btn-primary); color: #fff; }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .35; }
  .board { background: var(--g-surface); border-radius: var(--g-radius); box-shadow: var(--g-shadow); padding: 14px 8px 16px; }
  .strip { position: relative; height: 118px; }
  .tile {
    position: absolute; left: calc(var(--p) * 34%); width: 28%; aspect-ratio: 5 / 7;
    border-radius: 10px; background: var(--g-surface); border: 1px solid var(--g-border);
    box-shadow: var(--g-shadow); color: var(--g-text); cursor: pointer;
    font-family: inherit; padding: 0; text-align: center;
    transition: left .3s ease;
  }
  .tile.back { background: repeating-linear-gradient(45deg, var(--g-primary-soft), var(--g-primary-soft) 5px, var(--g-surface) 5px, var(--g-surface) 10px); border-color: var(--g-primary); color: var(--g-primary); }
  .tile.target { border-color: var(--g-warning); color: var(--g-warning); background: var(--g-primary-soft); }
  .tile .cen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; line-height: 1; font-weight: 700; }
  .tile .sub { position: absolute; bottom: 6px; left: 0; right: 0; font-size: 12px; color: var(--g-muted); }
  .tile.dim { opacity: .45; }
  .tile.reveal { outline: 3px solid var(--g-success); outline-offset: 2px; }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; font-weight: 500; color: var(--g-muted); text-align: center; }
  .msg.err { color: var(--g-danger); }
  .msg.win { color: var(--g-success); }
  .foot { margin: 14px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.7; }
  .panel .desc b { color: var(--g-primary-deep); }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }
  .tools { display: flex; gap: 8px; margin-bottom: 10px; }
  .ctl { min-height: 48px; width: 100%; border: 0; border-radius: var(--g-radius-btn); background: var(--g-btn-primary); color: #fff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
  .ctl:active { opacity: .8; }
  .ctl:disabled { opacity: .4; }
  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（§6.1 模板） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

</head>
<body>
<div class="wrap">
  <header><span class="sub" id="lvTag">第 1 关</span><span class="sub" id="lvRule">盯紧 ★ 的位置 · 换位序列确定性可回放</span></header>
  <div class="stats">
    <div class="stat"><span class="label">关卡</span><span class="val" id="stLv">1/40</span></div>
    <div class="stat"><span class="label">换位次数</span><span class="val plain" id="stSwaps">-</span></div>
    <div class="stat"><span class="label">连胜</span><span class="val plain" id="stStreak">0</span></div>
    <div class="stat"><span class="label">序列校验</span><span class="val plain" id="stVer">-</span></div>
  </div>
  <div class="board">
    <div class="strip" id="strip"></div>
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite">先记住 ★ 在哪张，按「开始换位」后盯紧它的轨迹，最后点它所在的牌位</p>
  <button class="ctl" id="btnGo">开始换位</button>
  <div class="tools" style="margin-top:10px">
    <button class="btn" id="btnReset">重开</button>
    <button class="btn" id="btnLv">选关</button>
  </div>
  <p class="foot">键盘：回车 开始 / 换位后 1/2/3 猜牌位 · R 重开 · 关卡越大换位越多越快 · 进度自动保存</p>
</div>
<div class="overlay" role="dialog" aria-modal="true" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">过关！</h2>
    <p class="desc" id="ovDesc"></p>
    <div class="lvgrid" id="lvgrid" hidden></div>
    <button class="btn primary" id="ovBtn">下一关</button>
  </div>
</div>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（配置型：swaps 换位次数、tier 速度档；DB 下发优先 + 版本缓存 + 包内默认兜底） ---------- */
var GAME_KEY="three-card-monte",SAVE_KEY="sw.threecardmonte.v1";
var DEFAULT_LEVELS=[];
(function(){
  for(var i=0;i<40;i++){
    var swaps=4+Math.floor(i*20/39);/* 4→24 */
    var tier=1+Math.floor(i*5/39);/* 1→6（单次换位时长 = 700-档位×80 ms） */
    DEFAULT_LEVELS.push({name:"猜牌·"+String(i+1).padStart(2,"0"),swaps:swaps,tier:tier,difficulty:Math.min(6,1+Math.floor(i/8))});
  }
})();
var LEVELS=DEFAULT_LEVELS.slice();
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim()||d.name.length>24)return false;
  if(!Number.isInteger(d.swaps)||d.swaps<2||d.swaps>60)return false;
  if(!Number.isInteger(d.tier)||d.tier<1||d.tier>9)return false;
  if(d.difficulty!==undefined&&(!Number.isInteger(d.difficulty)||d.difficulty<1||d.difficulty>9))return false;
  return true;
}

/* ---------- 独立验证器：交换序列确定性生成 + 双实现独立回放交叉验证 ---------- */
function mcg(seed){return function(){seed=(seed*1103515245+12345)>>>0;return seed/4294967296;};}
/* 生成：每步从 3 个牌位中取两个不同位交换 */
function genSwaps(seed,count){
  var rnd=mcg(seed),out=[],i;
  for(i=0;i<count;i++){
    var a=Math.floor(rnd()*3),b=Math.floor(rnd()*2);
    if(b>=a)b++;
    out.push([a,b]);
  }
  return out;
}
/* 跟踪器 A：直接对目标下标做映射 */
function trackA(swaps,start){
  var pos=start,i;
  for(i=0;i<swaps.length;i++){
    var a=swaps[i][0],b=swaps[i][1];
    if(!(Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&a<3&&b>=0&&b<3&&a!==b))return -1;
    if(pos===a)pos=b;else if(pos===b)pos=a;
  }
  return pos;
}
/* 跟踪器 B：物理交换槽位数组后查找 */
function trackB(swaps,start){
  var slots=[0,1,2],i,j;
  slots[start]=9;/* 9 代表 ★ */
  for(i=0;i<swaps.length;i++){
    var a=swaps[i][0],b=swaps[i][1];
    if(!(Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&a<3&&b>=0&&b<3&&a!==b))return -1;
    var t=slots[a];slots[a]=slots[b];slots[b]=t;
  }
  for(j=0;j<3;j++)if(slots[j]===9)return j;
  return -1;
}
function verifyLevelData(d){
  if(!validLevelData(d))return false;
  /* 20 个独立局种子：生成序列必须良构，且两套独立跟踪器结论一致 */
  var r,i;
  for(r=1;r<=20;r++){
    var sw=genSwaps(d.swaps*97+r*13,genLen(d));
    for(i=0;i<sw.length;i++){
      var a=sw[i][0],b=sw[i][1];
      if(!(a>=0&&a<3&&b>=0&&b<3&&a!==b))return false;
    }
    var start=r%3;
    if(trackA(sw,start)!==trackB(sw,start))return false;
    if(trackA(sw,start)<0)return false;
  }
  return true;
}
function genLen(d){return d.swaps}
var ACTIVE=[];
function buildActive(){
  ACTIVE=[];
  for(var i=0;i<LEVELS.length;i++)if(verifyLevelData(LEVELS[i]))ACTIVE.push(LEVELS[i]);
  if(ACTIVE.length){
    if(lv>ACTIVE.length-1)lv=ACTIVE.length-1;
    save.lv=Math.min(save.lv,lv);persist();
    loadLevel(lv);
  }
  refreshVerHud();
}
function refreshVerHud(){$("stVer").textContent=ACTIVE.length+"/"+LEVELS.length;}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push({name:String(d.name),swaps:d.swaps,tier:d.tier,difficulty:d.difficulty||5});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  buildActive();
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>ACTIVE.length-1)lv=ACTIVE.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
    }
  }).catch(function(){});
}

/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,parseInt(s.lv,10)||0)}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(ACTIVE.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}

/* ---------- 牌桌状态 ---------- */
var lv=0,L=null,round=0,swaps=[],pos=1,phase="peek",swapIdx=0,streak=0,paused=false,pendingTimer=null;
function $(id){return document.getElementById(id)}
function say(t,cls){var m=$("msg");m.textContent=t;m.className="msg"+(cls?" "+cls:"")}
function swapDur(){return Math.max(220,700-80*Math.min(6,Math.max(1,L.tier)))}
function loadLevel(n){
  if(!ACTIVE.length)return;
  lv=Math.max(0,Math.min(n,ACTIVE.length-1));
  L=ACTIVE[lv];
  round++;
  swaps=genSwaps(L.swaps*97+round*13,genLen(L));
  pos=1;phase="peek";swapIdx=0;
  slots=[1,0,2];/* ★（tileId 0）复位到第 2 槽位 */
  if(pendingTimer){clearTimeout(pendingTimer);pendingTimer=null;}
  save.lv=Math.max(save.lv,lv);persist();
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name+"（换位 "+L.swaps+" 次 · 速度档 "+L.tier+"）";
  $("stSwaps").textContent=L.swaps;
  $("btnGo").disabled=false;
  $("btnGo").textContent="开始换位";
  say("先记住 ★ 在哪张，按「开始换位」开始追踪");
  render();
}
function startSwap(){
  if(phase!=="peek")return;
  phase="swapping";
  $("btnGo").disabled=true;
  say("盯紧 ★ 的轨迹…");
  render();
  stepSwap();
}
function stepSwap(){
  if(paused){pendingTimer=setTimeout(stepSwap,200);return;}
  if(swapIdx>=swaps.length){
    phase="guess";
    say("换位结束——★ 现在在哪？点一张牌位（键盘 1/2/3）");
    render();
    return;
  }
  var s=swaps[swapIdx++];
  /* 交换两个槽位内容：槽位 s[0] 与 s[1]；slots[槽位]=tileId（0=★） */
  pos=pos===s[0]?s[1]:(pos===s[1]?s[0]:pos);
  slots=slotsSwap(slots,s[0],s[1]);
  render();
  pendingTimer=setTimeout(stepSwap,swapDur());
}
var slots=[1,0,2];/* ★（tileId 0）初始在第 2 槽位，与 pos=1 一致 */
function slotsSwap(arr,a,b){var t=arr[a];arr[a]=arr[b];arr[b]=t;return arr}
function guess(idx){
  if(phase!=="guess")return;
  var hit=idx===pos;
  lastHit=hit;
  phase="revealed";
  if(hit){
    streak++;
    if(lv<ACTIVE.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:streak}).catch(function(){});
    say("猜对了！★ 就在这","win");
  }else{
    streak=0;
    say("猜错了，★ 在 "+(pos+1)+" 号位","err");
  }
  render(hit?idx:pos,idx);
  setTimeout(function(){
    $("ovTitle").textContent=hit?((lv>=ACTIVE.length-1)?"全部通关！":"过关！"):"猜错了";
    $("ovDesc").innerHTML=hit
      ?("换位 "+L.swaps+" 次仍盯准了 ★"+(lv<ACTIVE.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成"))
      :("★ 其实在 <b>"+(pos+1)+"</b> 号位。点「再试一次」重新追踪（序列会变化）。");
    $("ovBtn").textContent=hit?((lv>=ACTIVE.length-1)?"回到第 1 关":"下一关"):"再试一次";
    $("overlay").classList.add("show");
  },700);
}
/* ---------- 渲染 ---------- */
function tileHtml(slot,tileId,faceUp,revealSel,dim){
  var cls="tile";
  if(!faceUp)cls+=" back";
  else if(tileId===0)cls+=" target";
  if(dim)cls+=" dim";
  if(revealSel===slot)cls+=" reveal";
  var inner=faceUp?(tileId===0?'<span class="cen">★</span><span class="sub">目标</span>':'<span class="cen">✦</span><span class="sub">普通</span>'):'<span class="cen">?</span>';
  return '<button class="'+cls+'" data-slot="'+slot+'" style="--p:'+slot+'" aria-label="牌位 '+(slot+1)+'">'+inner+'</button>';
}
function render(revealSlot,dimOthers){
  var h="",s;
  var faceUpAll=phase==="peek"||phase==="revealed";
  for(s=0;s<3;s++){
    var tid=slots[s];
    var fu=faceUpAll&&(phase==="peek"?true:(tid===0));
    var dim=dimOthers!==undefined&&phase==="revealed"&&s!==revealSlot;
    h+=tileHtml(s,tid,fu,revealSlot,dim);
  }
  $("strip").innerHTML=h;
}
/* ---------- 输入 ---------- */
$("btnGo").addEventListener("click",startSwap);
$("strip").addEventListener("click",function(e){
  var b=e.target.closest("[data-slot]");
  if(b&&phase==="guess")guess(parseInt(b.getAttribute("data-slot"),10));
});
$("btnReset").addEventListener("click",function(){streak=0;loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){
  overlayMode="lv";renderLvGrid();
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="绿色为已通关";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
});
var overlayMode="";
function renderLvGrid(){
  var g=$("lvgrid");
  if(overlayMode!=="lv"){g.hidden=true;return;}
  g.hidden=false;g.innerHTML="";
  for(var i=0;i<ACTIVE.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.addEventListener("click",function(){
        $("overlay").classList.remove("show");overlayMode="";
        loadLevel(i);say("第 "+(i+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
}
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(overlayMode==="lv"){overlayMode="";return;}
  if(phase==="revealed"){
    if(streak>0&&lastHit&&lv>=ACTIVE.length-1){loadLevel(0);}
    else if(lastHit)loadLevel(lv+1);
    else loadLevel(lv);
  }
});
var lastHit=false;
/* ---------- 切后台暂停换位动画（visibilitychange） ---------- */
document.addEventListener("visibilitychange",function(){
  if(document.hidden){paused=true;}
  else{paused=false;}
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(overlayMode==="lv"){if(k===" "||k==="Enter")$("ovBtn").click();return;}
  if((k===" "||k==="Enter")&&phase==="peek"&&!$("overlay").classList.contains("show")){startSwap();e.preventDefault();}
  else if(/^Digit[1-3]$/.test(e.code)&&phase==="guess"){guess(parseInt(e.code.slice(5),10)-1);e.preventDefault();}
  else if(k==="r"||k==="R"){streak=0;loadLevel(lv);say("本关已重置")}
});
/* ---------- 启动 ---------- */
buildActive();
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
