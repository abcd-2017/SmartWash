<style>

  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;color-scheme:light }

  .slot .zi { font-size: 22px; font-weight: 700; width: 36px; text-align: center; color: var(--g-faint); }
  .slot.filled { background: var(--g-primary-soft); }
  .slot.filled .zi { color: var(--g-on-soft); }
  .slot.filled .tag { color: var(--g-on-soft); }
  .slot.now { box-shadow: inset 0 0 0 2px var(--g-primary); }
  .slot.err { box-shadow: inset 0 0 0 2px var(--g-danger); }
  .pool { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pcard {
    min-height: 64px; border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface); color: var(--g-text);
    font-family: inherit; cursor: pointer;
    box-shadow: 0 1px 0 var(--g-border);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 6px 2px;
  }
  .pcard .zi { font-size: 22px; font-weight: 700; }
  .pcard .py { font-size: 12px; color: var(--g-muted); min-height: 15px; }
  .pcard.used { opacity: .3; pointer-events: none; }
  .pcard.shake { animation: shake .3s ease-in-out; }

  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .btn {

  .overlay {
    position: fixed; inset: 0; z-index: 10;

  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;

    box-shadow: var(--g-shadow); text-align: center;

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */

window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（40 组四字，声调恰为一二三四各一；DB 下发优先，本地缓存兜底） ---------- */
var GAME_KEY="tone-tower",SAVE_KEY="sw.tonetower.v1";
var DEFAULT_LEVELS=[
{name:"四声塔·01",ch:["一","无","好","世"],py:["yī","wú","hǎo","shì"],tn:[1,2,3,4],difficulty:1},

{name:"四声塔·09",ch:["来","家","雨","路"],py:["lái","jiā","yǔ","lù"],tn:[2,1,3,4],difficulty:1},

{name:"四声塔·11",ch:["油","万","舟","走"],py:["yóu","wàn","zhōu","zǒu"],tn:[2,4,1,3],difficulty:2},
{name:"四声塔·12",ch:["灯","骑","洞","草"],py:["dēng","qí","dòng","cǎo"],tn:[1,2,4,3],difficulty:2},

{name:"四声塔·15",ch:["锅","台","洗","病"],py:["guō","tái","xǐ","bìng"],tn:[1,2,3,4],difficulty:2},
{name:"四声塔·16",ch:["屋","篮","椅","画"],py:["wū","lán","yǐ","huà"],tn:[1,2,3,4],difficulty:2},
{name:"四声塔·17",ch:["蜂","桥","古","象"],py:["fēng","qiáo","gǔ","xiàng"],tn:[1,2,3,4],difficulty:2},

{name:"四声塔·22",ch:["狼","火","山","豹"],py:["láng","huǒ","shān","bào"],tn:[2,3,1,4],difficulty:3},

{name:"四声塔·29",ch:["抄","银","宝","贝"],py:["chāo","yín","bǎo","bèi"],tn:[1,2,3,4],difficulty:3},
{name:"四声塔·30",ch:["书","房","卷","案"],py:["shū","fáng","juǎn","àn"],tn:[1,2,3,4],difficulty:3},
{name:"四声塔·31",ch:["帆","龙","桨","岸"],py:["fān","lóng","jiǎng","àn"],tn:[1,2,3,4],difficulty:4},
{name:"四声塔·32",ch:["听","读","讲","念"],py:["tīng","dú","jiǎng","niàn"],tn:[1,2,3,4],difficulty:4},
{name:"四声塔·33",ch:["诗","谣","曲","戏"],py:["shī","yáo","qǔ","xì"],tn:[1,2,3,4],difficulty:4},
{name:"四声塔·34",ch:["妈","娘","姐","妹"],py:["mā","niáng","jiě","mèi"],tn:[1,2,3,4],difficulty:4},
{name:"四声塔·35",ch:["公","婆","嫂","弟"],py:["gōng","pó","sǎo","dì"],tn:[1,2,3,4],difficulty:4},
{name:"四声塔·36",ch:["摸","描","写","算"],py:["mō","miáo","xiě","suàn"],tn:[1,2,3,4],difficulty:4},
{name:"四声塔·37",ch:["阴","晴","雪","雾"],py:["yīn","qíng","xuě","wù"],tn:[1,2,3,4],difficulty:4},
{name:"四声塔·38",ch:["肩","头","肘","臂"],py:["jiān","tóu","zhǒu","bì"],tn:[1,2,3,4],difficulty:4},
{name:"四声塔·39",ch:["酸","咸","苦","辣"],py:["suān","xián","kǔ","là"],tn:[1,2,3,4],difficulty:4},
{name:"四声塔·40",ch:["锅","勺","碗","筷"],py:["guō","sháo","wǎn","kuài"],tn:[1,2,3,4],difficulty:4}
];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";

/* ---------- 独立验证器：内容正确性 + 结构完整性 + 可通关性 ---------- */
/* 声调符号 → 调值（用于复核拼音标注与声调字段一致） */
var TONE_MARKS={"ā":1,"ō":1,"ē":1,"ī":1,"ū":1,"á":2,"ó":2,"é":2,"í":2,"ú":2,"ǎ":3,"ǒ":3,"ě":3,"ǐ":3,"ǔ":3,"à":4,"ò":4,"è":4,"ì":4,"ù":4};
function markTone(py){
  for(var i=0;i<py.length;i++){var t=TONE_MARKS[py[i]];if(t)return t;}
  return 0;
}
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Array.isArray(d.ch)||d.ch.length!==4)return false;
  if(!Array.isArray(d.py)||d.py.length!==4)return false;
  if(!Array.isArray(d.tn)||d.tn.length!==4)return false;
  var seen={},tset=[];
  for(var i=0;i<4;i++){
    var c=d.ch[i],p=d.py[i],t=d.tn[i];
    if(typeof c!=="string"||c.length!==1)return false;
    if(typeof p!=="string"||!p||p.length>6)return false;
    if(!Number.isInteger(t)||t<1||t>4)return false;
    if(seen[c])return false;               // 关内字形不重复
    seen[c]=1;
    if(markTone(p)!==t)return false;       // 拼音调号与调值一致（内容复核）
    if(tset.indexOf(t)>=0)return false;    // 调值互不相同
    tset.push(t);
  }
  tset.sort(function(a,b){return a-b});
  if(tset[0]!==1||tset[1]!==2||tset[2]!==3||tset[3]!==4)return false;  // 恰为一二三四 → 排序唯一可解
  return true;
}
function auditAll(){
  var bad=[];
  for(var i=0;i<LEVELS.length;i++)if(!validLevelData(LEVELS[i]))bad.push(i+1);
  return bad;
}
/* ---------- 关卡缓存与下发 ---------- */
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d)||seen[d.name])return null;
    seen[d.name]=1;
    list.push({name:d.name,ch:d.ch.slice(),py:d.py.slice(),tn:d.tn.slice(),difficulty:Number.isInteger(d.difficulty)?d.difficulty:5});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();loadLevel(lv);
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,order=[],used=[],towerN=0,errors=0,done=false;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var TAGS=["一声","二声","三声","四声"];
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  order=shuffle([0,1,2,3]);
  used=[false,false,false,false];
  placedSlots=[-1,-1,-1,-1];
  towerN=0;errors=0;done=false;
  var hard=lv>=20;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=hard?"无拼音 · 凭读音判断":"拼音提示开";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  renderTower();renderPool();updStats();
  say("按声调从低到高，把字一块块叠上塔");
}
/* 放置记录：placedSlots[slot]=字序号 */
var placedSlots=[-1,-1,-1,-1];
function renderTower(){
  var t=$("tower");t.innerHTML="";
  for(var s=0;s<4;s++){
    var filled=s<towerN;
    var idx=filled?placedSlots[s]:-1;
    var d=document.createElement("div");
    d.className="slot"+(filled?" filled":"")+(s===towerN&&!done?" now":"");
    d.innerHTML='<span class="tag">'+TAGS[s]+'</span><span class="zi">'+(idx>=0?L.ch[idx]:"")+'</span>';
    t.appendChild(d);
  }
}
function renderPool(){
  var p=$("pool");p.innerHTML="";
  for(var i=0;i<4;i++){
    (function(i){
      var idx=order[i],b=document.createElement("button");
      b.className="pcard"+(used[i]?" used":"");
      b.setAttribute("aria-label","候选字"+L.ch[idx]);
      var hard=lv>=20;
      b.innerHTML='<span class="zi">'+L.ch[idx]+'</span><span class="py">'+(hard?"":L.py[idx])+'</span>';
      b.addEventListener("click",function(){pick(i)});
      p.appendChild(b);
    })(i);
  }
}
function updStats(){
  $("stTower").textContent=towerN+"/4";
  var e=$("stErr");e.textContent=errors;
  e.className="val"+(errors>0?" bad":"");
}
function pick(i){
  if(done||used[i])return;
  var idx=order[i],t=L.tn[idx];
  if(t===towerN+1){
    used[i]=true;placedSlots[towerN]=idx;towerN++;
    renderTower();renderPool();updStats();
    say("「"+L.ch[idx]+"」（"+L.py[idx]+"）叠上了第 "+towerN+" 层");
    if(towerN===4)winLevel();
  }else{
    errors++;updStats();
    var btn=$("pool").children[i];
    btn.classList.remove("shake");void btn.offsetWidth;btn.classList.add("shake");
    for(var s=0;s<4;s++){var el=$("tower").children[s];el.classList.remove("err");}
    var slot=$("tower").children[towerN];
    if(slot){slot.classList.add("err");setTimeout(function(){if(slot)slot.classList.remove("err")},500);}
    say("搭错了！这一层要放声调更低 / 更高的字，从头再想");
  }
}
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:errors}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"塔搭好了！";
  $("ovDesc").innerHTML="失误 "+errors+" 次"+(errors===0?"（完美）":"")+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);$("overlay").classList.remove("show");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重摆")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
  else{lv++;loadLevel(lv)}
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="4"){pick(parseInt(k,10)-1);e.preventDefault();}
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重摆")}
  else if(k==="Enter"&&$("overlay").classList.contains("show")){$("ovBtn").click();e.preventDefault();}
});
/* ---------- 启动 ---------- */
loadLevel(save.lv);
var badLv=auditAll();
if(badLv.length)say("警告：内嵌验证器发现异常关卡 "+badLv.join(","));
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
