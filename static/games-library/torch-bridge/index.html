<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="torch-bridge",SAVE_KEY="sw.torchbridge.v1";
var DEFAULT_LEVELS=[{"name":"过桥·01","people":[1,2,3,10],"limit":19,"par":17,"difficulty":1},{"name":"过桥·02","people":[1,2,4,10],"limit":19,"par":17,"difficulty":1},{"name":"过桥·03","people":[1,2,5,10],"limit":19,"par":17,"difficulty":1},{"name":"过桥·04","people":[1,2,6,10],"limit":19,"par":17,"difficulty":1},{"name":"过桥·05","people":[1,2,8,10],"limit":19,"par":17,"difficulty":1},{"name":"过桥·06","people":[1,2,9,10],"limit":19,"par":17,"difficulty":1},{"name":"过桥·07","people":[1,3,4,8],"limit":19,"par":17,"difficulty":1},{"name":"过桥·08","people":[1,4,5,6],"limit":19,"par":17,"difficulty":1},{"name":"过桥·09","people":[2,3,4,6],"limit":18,"par":17,"difficulty":2},{"name":"过桥·10","people":[2,3,5,6],"limit":18,"par":17,"difficulty":2},{"name":"过桥·11","people":[1,3,4,9],"limit":19,"par":18,"difficulty":2},{"name":"过桥·12","people":[1,3,5,8],"limit":19,"par":18,"difficulty":2},{"name":"过桥·13","people":[1,3,6,8],"limit":19,"par":18,"difficulty":2},{"name":"过桥·14","people":[1,2,3,12],"limit":20,"par":19,"difficulty":2},{"name":"过桥·15","people":[1,2,4,12],"limit":20,"par":19,"difficulty":2},{"name":"过桥·16","people":[1,2,5,12],"limit":20,"par":19,"difficulty":2},{"name":"过桥·17","people":[1,2,6,12],"limit":19,"par":19,"difficulty":3},{"name":"过桥·18","people":[1,2,8,12],"limit":19,"par":19,"difficulty":3},{"name":"过桥·19","people":[1,2,9,12],"limit":19,"par":19,"difficulty":3},{"name":"过桥·20","people":[1,2,10,12],"limit":19,"par":19,"difficulty":3},{"name":"过桥·21","people":[1,3,4,10],"limit":19,"par":19,"difficulty":3},{"name":"过桥·22","people":[1,3,5,9],"limit":19,"par":19,"difficulty":3},{"name":"过桥·23","people":[1,3,6,9],"limit":19,"par":19,"difficulty":3},{"name":"过桥·24","people":[1,3,8,9],"limit":19,"par":19,"difficulty":3},{"name":"过桥·25","people":[1,5,12,2,7],"limit":27,"par":25,"difficulty":4},{"name":"过桥·26","people":[1,12,8,2,5],"limit":27,"par":25,"difficulty":4},{"name":"过桥·27","people":[1,12,9,5,2],"limit":27,"par":25,"difficulty":4},{"name":"过桥·28","people":[1,12,2,10,5],"limit":27,"par":25,"difficulty":4},{"name":"过桥·29","people":[1,10,8,7,2],"limit":27,"par":25,"difficulty":4},{"name":"过桥·30","people":[1,10,2,9,7],"limit":27,"par":25,"difficulty":4},{"name":"过桥·31","people":[1,3,4,10,5],"limit":27,"par":25,"difficulty":4},{"name":"过桥·32","people":[1,7,3,10,4],"limit":27,"par":25,"difficulty":4},{"name":"过桥·33","people":[1,4,10,3,8],"limit":27,"par":25,"difficulty":4},{"name":"过桥·34","people":[1,10,3,4,9],"limit":27,"par":25,"difficulty":4},{"name":"过桥·35","people":[1,9,7,3,5],"limit":26,"par":25,"difficulty":5},{"name":"过桥·36","people":[1,8,5,3,9],"limit":26,"par":25,"difficulty":5},{"name":"过桥·37","people":[2,3,8,5,4],"limit":26,"par":25,"difficulty":5},{"name":"过桥·38","people":[2,3,4,7,8],"limit":26,"par":25,"difficulty":5},{"name":"过桥·39","people":[1,8,9,2,10],"limit":27,"par":26,"difficulty":5},{"name":"过桥·40","people":[1,7,3,5,10],"limit":27,"par":26,"difficulty":5},{"name":"过桥·41","people":[1,3,10,5,8],"limit":26,"par":26,"difficulty":5},{"name":"过桥·42","people":[1,9,10,5,3],"limit":26,"par":26,"difficulty":5},{"name":"过桥·43","people":[2,3,5,4,9],"limit":26,"par":26,"difficulty":5},{"name":"过桥·44","people":[2,4,9,3,7],"limit":26,"par":26,"difficulty":5},{"name":"过桥·45","people":[2,4,3,9,8],"limit":26,"par":26,"difficulty":5},{"name":"过桥·46","people":[2,7,3,8,5],"limit":26,"par":26,"difficulty":5}];
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(normalizeLevel(d));
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list.map(normalizeLevel);return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
      if(typeof resize==="function")resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层（lvgrid 通用） ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  var u=$("ovUndo");
  if(u)u.hidden=true;
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

/* 单条结构校验 */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Array.isArray(d.people)||d.people.length<4||d.people.length>5)return false;
  for(var i=0;i<d.people.length;i++){if(!Number.isInteger(d.people[i])||d.people[i]<1||d.people[i]>20)return false;}
  if(!Number.isInteger(d.limit)||d.limit<1||d.limit>99)return false;
  if(d.par!==undefined&&(!Number.isInteger(d.par)||d.par<1||d.par>99))return false;
  return true;
}
/* par 缺省时由内嵌 Dijkstra 补算；limit 至少等于 par（保证可解） */
function normalizeLevel(d){
  var par=(Number.isInteger(d.par)&&d.par>0)?d.par:torchDijkstra(d.people,-1,-1).par;
  var limit=Math.max(d.limit,par);
  var diff=Number.isInteger(d.difficulty)?Math.min(9,Math.max(1,d.difficulty)):5;
  return {name:String(d.name),people:d.people.slice(),limit:limit,par:par,difficulty:diff};
}
/* ---------- 独立求解器：Dijkstra 最短总耗时（用于加载复核与提示） ---------- */
/* start:[mask,side] 缺省满员左岸；返回 {par, firstMove:[下标..]}（无解 par=0） */
function torchDijkstra(people,startMask,startSide){
  var n=people.length,full=(1<<n)-1;
  var s0=(startMask===undefined)?full:startMask;
  var s1=(startSide===undefined)?0:startSide;
  var dist=new Map(),parent=new Map();
  var k0=s0*2+s1;
  dist.set(k0,0);
  var pq=[[0,k0]];
  while(pq.length){
    pq.sort(function(a,b){return a[0]-b[0];});
    var cur=pq.shift(),d=cur[0],key=cur[1];
    if(dist.get(key)!==d)continue;
    var mask=Math.floor(key/2),side=key%2;
    if(mask===0&&side===1){
      var firstMove=[],k=key;
      while(k!==k0){
        var pk=parent.get(k);
        if(pk===k0){
          var pm=Math.floor(k/2),pm0=Math.floor(pk/2);
          for(var b=0;b<n;b++)if((pm^pm0)>>b&1)firstMove.push(b);
          break;
        }
        k=pk;
      }
      return {par:d,firstMove:firstMove};
    }
    var here=[];
    for(var i=0;i<n;i++)if((mask>>i&1)===(side===0?1:0))here.push(i);
    for(var a=0;a<here.length;a++){
      for(var b2=a;b2<here.length;b2++){
        var cost=Math.max(people[here[a]],people[b2]);
        var nm=mask^(1<<here[a]);
        if(b2!==a)nm^=(1<<here[b2]);
        var nk=nm*2+(1-side);
        var nd=d+cost;
        if(!dist.has(nk)||dist.get(nk)>nd){
          dist.set(nk,nd);parent.set(nk,key);
          pq.push([nd,nk]);
        }
      }
    }
  }
  return {par:0,firstMove:null};
}
/* ---------- 调色板（DOM 为主，token 直用；提示/准星色读 token） ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={warning:v("--g-warning"),deep:v("--g-primary-deep")};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,people=[],limit=0,par=0;
var leftMask=0,side=0,elapsed=0,sel=[],history=[];
var done=false,failed=false;
var NAMES=["甲","乙","丙","丁","戊"];
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  people=L.people;limit=L.limit;
  var v=torchDijkstra(people);   // 加载复核：可解性 + 最优耗时
  par=v.par>0?v.par:L.par||v.par;
  leftMask=(1<<people.length)-1;side=0;elapsed=0;sel=[];history=[];
  done=false;failed=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent="同行按较慢者计 · 手电随行";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stLimit").textContent=limit+"s";
  $("stPar").textContent=par+"s";
  if(!(par>0))say("警告：内嵌求解器判定本关无法过桥（数据异常）");
  else say("点选 1-2 人同行（耗时按较慢者计），再点「过桥」");
  render();updStats();
}
function updStats(){
  $("stTime").textContent=elapsed+"s";
  $("btnUndo").disabled=!history.length||done;
  $("btnGo").disabled=done||sel.length<1||sel.length>2;
}
/* ---------- 渲染 ---------- */
function render(){
  var bl=$("bankL"),br=$("bankR");
  bl.querySelectorAll(".peep").forEach(function(e){e.remove()});
  br.querySelectorAll(".peep").forEach(function(e){e.remove()});
  bl.classList.toggle("torchside",side===0);
  br.classList.toggle("torchside",side===1);
  for(var i=0;i<people.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.type="button";
      b.className="peep"+(sel.indexOf(i)>=0?" sel":"");
      b.dataset.idx=i;
      b.innerHTML='<span class="nm">'+NAMES[i]+'</span><span class="sp">'+people[i]+'</span>';
      b.setAttribute("aria-label",NAMES[i]+" 速度 "+people[i]+" 秒");
      b.addEventListener("click",function(){toggleSel(i)});
      (side===0?bl:br).appendChild(b);
    })(i);
  }
}
function toggleSel(i){
  if(done||failed)return;
  var onBank=(leftMask>>i&1)===(side===0?1:0);
  if(!onBank){say(NAMES[i]+" 在另一岸边");return;}
  var k=sel.indexOf(i);
  if(k>=0)sel.splice(k,1);
  else{
    if(sel.length>=2){say("每次最多两人同行");return;}
    sel.push(i);
  }
  render();updStats();
}
/* ---------- 交互 ---------- */
function cross(){
  if(done||failed)return;
  if(sel.length<1||sel.length>2){say("先点选 1-2 人");return;}
  for(var i=0;i<sel.length;i++){
    if((leftMask>>sel[i]&1)!==(side===0?1:0)){say("所选有人不在手电这一侧");return;}
  }
  history.push({mask:leftMask,side:side,elapsed:elapsed});
  var cost=0;
  for(var j=0;j<sel.length;j++)cost=Math.max(cost,people[sel[j]]);
  elapsed+=cost;
  for(var m=0;m<sel.length;m++)leftMask^=(1<<sel[m]);
  side=1-side;sel=[];
  document.querySelectorAll(".peep").forEach(function(e){e.classList.add("walking")});
  updStats();
  if(leftMask===0&&side===1){winLevel();return;}
  if(elapsed>limit){failLevel();return;}
  say("已用 "+elapsed+"s / "+limit+"s · 剩 "+popcount(leftMask)+" 人待渡");
}
function popcount(m){var c=0;while(m){m&=m-1;c++}return c}
function undo(){
  if(!history.length||done)return;
  var h=history.pop();
  leftMask=h.mask;side=h.side;elapsed=h.elapsed;sel=[];
  failed=false;
  hideOverlay();render();updStats();say("已撤销一步");
}
function hint(){
  if(done||failed)return;
  var v=torchDijkstra(people,leftMask,side);
  if(v.par===0){say("内嵌求解器：当前局面已无法按时过桥，建议撤销");return;}
  document.querySelectorAll(".peep").forEach(function(e){
    e.classList.toggle("hintpeep",v.firstMove.indexOf(+e.dataset.idx)>=0);
  });
  var names=v.firstMove.map(function(i){return NAMES[i]}).join("、");
  say("求解器建议派 "+names+" 过河（还剩至少 "+v.par+"s）");
}
/* ---------- 胜负 ---------- */
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:elapsed}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"过关！";
  $("ovDesc").innerHTML="全部过桥，用时 <b>"+elapsed+"s</b>（限时 "+limit+"s · 参考最优 "+par+"s）"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>46 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("ovUndo").hidden=true;
  $("overlay").classList.add("show");
}
function failLevel(){
  failed=true;
  $("ovTitle").textContent="超时了！";
  $("ovDesc").textContent="累计 "+elapsed+"s 超过限时 "+limit+"s。注意：让最快的两人先做往返摆渡。";
  $("ovBtn").textContent="重开本关";
  $("ovUndo").hidden=false;
  $("overlay").classList.add("show");
}
/* ---------- 输入 ---------- */
$("btnGo").addEventListener("click",cross);
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",function(){
  if(done)return;
  openLevelSelect();
});
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(failed){loadLevel(lv);return;}
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
var ovUndoEl=$("ovUndo");
if(ovUndoEl)ovUndoEl.addEventListener("click",undo);
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="5"){var i=parseInt(k,10)-1;if(i<people.length)toggleSel(i);e.preventDefault();}
  else if(k===" "||k==="Enter"){if($("overlay").classList.contains("show"))$("ovBtn").click();else cross();e.preventDefault();}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);
syncLevelsFromServer();syncSaveFromServer();

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
