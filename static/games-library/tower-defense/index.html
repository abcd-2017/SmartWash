<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材（st- 前缀素材 token）*/
  :root {
    --g-bg:#F5F6F3; --g-surface:#FFFFFF; --g-surface2:#EFF1EE;
    --g-primary:#2D9B6A; --g-primary-deep:#17734A;--g-btn-primary:#17734A; --g-primary-soft:#E8F6EF; --g-on-primary:#FFFFFF; --g-on-soft:#0B3625;
    --g-text:#1C1C1E; --g-muted:#6B6E73; --g-faint:#A9AEA9; --g-border:#E6E9E6; --g-hairline:#EFF1EE;
    --g-danger:#A83850; --g-warning:#9A6210; --g-success:#17734A; --g-water:#4A9FD4;
    --g-scrim:rgba(245,246,243,.9);
    --g-shadow:0 2px 12px rgba(20,40,30,.05);
    --g-radius:16px; --g-radius-btn:14px; --g-radius-inner:12px; --g-gap:16px;
    --g-st-field1:#D8E8C8; --g-st-field2:#CCDFB8; --g-st-road:#C9B691; --g-st-roadln:#A18C5F;

    --g-primary-deep:#5BC894; --g-primary-soft:#1D3229; --g-on-soft:#B9E8CF;
    --g-text:#E6E9E6; --g-muted:#A9AEA9; --g-faint:#7E837D; --g-border:#2C312D; --g-hairline:#262A27;
    --g-danger:#DB7186; --g-warning:#E2A44E; --g-success:#4ADE6E; --g-water:#6BB4DE;
    --g-scrim:rgba(20,22,20,.9);
    --g-shadow:0 2px 12px rgba(0,0,0,.28);
    --g-st-field1:#26331F; --g-st-field2:#1F2A1A; --g-st-road:#5C5240; --g-st-roadln:#7E6F4E;
    color-scheme:dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;

  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.5; }
  .icon-btn {
    width: 44px; height: 44px; flex: 0 0 44px;
    border: 1px solid var(--g-border); border-radius: 12px;

    display: grid; place-items: center; cursor: pointer; font: inherit;

  .scores { display: flex; gap: 8px; flex: 1; }
  .score-box {
    background: var(--g-btn-primary); color: var(--g-on-primary); border-radius: 12px;

  .score-box .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }

  .stat .label { display: block; font-size: 12px; color: var(--g-muted); white-space: nowrap; }
  .stat .val { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }

  .btn {

  .stage { position: relative; }
  canvas {
    display: block; width: 100%; aspect-ratio: 390 / 400; height: auto;
    background: var(--g-surface2);

  }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: absolute; inset: 0; z-index: 5;
    border-radius: 12px; background: var(--g-scrim);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 16px; text-align: center;
  }
  .overlay.show { display: flex; animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: translateY(0); } }
  .ov-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--g-primary-deep); max-width: 100%; }
  .ov-sub { margin: 0 0 6px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .btn-row { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .btn-row .btn { flex: 1; }
  .lv-wrap { width: 100%; max-width: 340px; max-height: 48vh; overflow-y: auto; }
  .lv-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .lv-chip {
    min-height: 44px; border: 1px solid var(--g-border); border-radius: 10px;
    background: var(--g-surface); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    touch-action: manipulation;
  }
  .lv-chip.sel { border-color: var(--g-primary); box-shadow: inset 0 0 0 1.5px var(--g-primary); background: var(--g-primary-soft); color: var(--g-on-soft); }
  .lv-chip.done { background: var(--g-btn-primary); border-color: var(--g-primary); color: var(--g-on-primary); }
  .lv-chip:disabled { opacity: .38; cursor: not-allowed; }
  .badge { display: none; margin: 0 0 4px; padding: 4px 12px; border-radius: 999px; background: var(--g-surface2); color: var(--g-warning); font-size: 12px; font-weight: 700; }
  .badge.show { display: inline-block; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();

<body>
<div class="wrap">

  <p class="foot">选塔卡点方格塔位建塔；点已建塔直接升级（Lv3 满）· 键盘 1-3 选卡 / ←→ 切塔位 / 回车建或升</p>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var TD={NW:390,NH:400,
  TOWERS:[
    {name:"箭塔",cost:60,rate:0.55,dmg:14,range:105,slow:0,splash:0},
    {name:"冰塔",cost:80,rate:0.85,dmg:8,range:95,slow:1.6,splash:0},
    {name:"炮塔",cost:140,rate:1.4,dmg:40,range:115,slow:0,splash:44}
  ],
  ZKINDS:[{hp:1,spd:1,r:11,reward:16},{hp:0.6,spd:1.8,r:9,reward:18},{hp:2.0,spd:0.55,r:14,reward:34}],
  WAVE_BONUS:90,LIVES:5};
/* 路径模板：固定四型轮转，路旁预置塔位（slot） */
TD.TEMPLATES=[
  {name:"S 型",path:[[0,70],[110,70],[110,190],[250,190],[250,310],[390,310]],
   slots:[[60,135],[170,120],[170,255],[300,250],[180,345],[80,25],[320,350],[60,255],[300,140],[240,120]]},
  {name:"U 型",path:[[70,0],[70,330],[320,330],[320,70],[180,70]],
   slots:[[130,150],[130,290],[250,290],[380,270],[380,120],[250,110],[90,60],[180,120],[250,200],[15,150]]},
  {name:"折返型",path:[[0,340],[180,340],[180,220],[60,220],[60,100],[300,100],[300,220],[390,220]],
   slots:[[90,300],[250,300],[120,180],[180,140],[250,160],[120,60],[240,40],[350,160],[80,160],[330,300]]},
  {name:"绕圈型",path:[[390,60],[100,60],[100,180],[330,180],[330,300],[60,300]],
   slots:[[200,20],[40,120],[160,120],[220,240],[390,240],[200,340],[40,240],[150,20],[280,120],[280,345]]}
];
TD.upCost=function(type,lv){var base=TD.TOWERS[type].cost;return lv===1?Math.round(base*0.6):Math.round(base*1.0);};
TD.towerDmg=function(type,lv){return TD.TOWERS[type].dmg*Math.pow(1.5,lv-1);};
TD.towerRange=function(type,lv){return TD.TOWERS[type].range*(1+0.08*(lv-1));};
/* 关卡生成：路径模板轮转，波数 3→8、每波 4→14 只、血 / 速递增 */
TD.LEVEL_COUNT=40;
TD.genLevel=function(no){
  var tpl=TD.TEMPLATES[(no-1)%TD.TEMPLATES.length];
  var rng=mulberry32(77000+no*1213);
  var wc=3+Math.floor(no/8);
  var hpBase=12+no*2.3,spdBase=22+no*0.7;
  var waves=[];
  for(var w=0;w<wc;w++){
    var kind=no>10&&rng()<0.22?2:(no>5&&rng()<0.35?1:0);
    var gap=Math.round((1.0+no*0.008)*(kind===2?1.5:1)*100)/100;   // 坦克波更稀疏
    waves.push({n:4+Math.floor(no/4),kind:kind,
      hp:Math.round(hpBase*TD.ZKINDS[kind].hp),
      spd:Math.round(spdBase*TD.ZKINDS[kind].spd*10)/10,
      gap:gap,delay:Math.max(3,6.5-no*0.08)});
  }
  return {name:"第"+no+"关 · 塔防路线",tpl:(no-1)%TD.TEMPLATES.length,
    waves:waves,gold0:180,lives:TD.LIVES,seed:55000+no*173};
};
TD.validate=function(level){
  if(!level||typeof level!=="object")return{ok:false,why:"bad"};
  if(!isFinite(level.tpl)||level.tpl<0||level.tpl>=TD.TEMPLATES.length||level.tpl!==(level.tpl|0))return{ok:false,why:"tpl"};
  if(!Array.isArray(level.waves)||level.waves.length<2||level.waves.length>12)return{ok:false,why:"waves"};
  for(var i=0;i<level.waves.length;i++){
    var w=level.waves[i];
    if(!w||typeof w!=="object")return{ok:false,why:"wave"+i};
    if(!isFinite(w.n)||w.n<1||w.n>30||w.n!==(w.n|0))return{ok:false,why:"n"+i};
    if(!isFinite(w.kind)||w.kind<0||w.kind>2||w.kind!==(w.kind|0))return{ok:false,why:"kind"+i};
    if(!isFinite(w.hp)||w.hp<1||w.hp>100000)return{ok:false,why:"hp"+i};
    if(!isFinite(w.spd)||w.spd<5||w.spd>200)return{ok:false,why:"spd"+i};
    if(!isFinite(w.gap)||w.gap<0.4||w.gap>6)return{ok:false,why:"gap"+i};
    if(!isFinite(w.delay)||w.delay<1||w.delay>20)return{ok:false,why:"delay"+i};
  }
  return{ok:true,why:""};
};
/* 路径长度与敌兵位置（敌兵以沿路距离 s 定位） */
TD.pathLens=function(path){
  var lens=[],total=0;
  for(var i=0;i<path.length-1;i++){
    var dx=path[i+1][0]-path[i][0],dy=path[i+1][1]-path[i][1];
    var l=Math.sqrt(dx*dx+dy*dy);
    lens.push(l);total+=l;
  }
  return {lens:lens,total:total};
};
TD.posAt=function(path,pLens,s){
  if(s<=0)return [path[0][0],path[0][1]];
  var acc=0;
  for(var i=0;i<pLens.lens.length;i++){
    if(s<=acc+pLens.lens[i]){
      var k=(s-acc)/pLens.lens[i];
      return [path[i][0]+(path[i+1][0]-path[i][0])*k,path[i][1]+(path[i+1][1]-path[i][1])*k];
    }
    acc+=pLens.lens[i];
  }
  var n=path.length-1;
  return [path[n][0],path[n][1]];
};
TD.createRun=function(level){
  var tpl=TD.TEMPLATES[level.tpl||0];
  return {level:level,rng:mulberry32(level.seed||1),tpl:tpl,
    plens:TD.pathLens(tpl.path),t:0,gold:level.gold0==null?180:level.gold0,
    lives:level.lives||TD.LIVES,towers:[],enemies:[],shots:[],
    events:TD.events(level),evIdx:0,status:"run",spawned:0};
};
TD.events=function(level){
  var evs=[],t=0;
  for(var w=0;w<level.waves.length;w++){
    var wv=level.waves[w];
    t+=wv.delay;
    for(var i=0;i<wv.n;i++){
      t+=wv.gap;
      evs.push({t:t,kind:wv.kind,hp:wv.hp,spd:wv.spd});
    }
  }
  return evs;
};
TD.build=function(run,type,slotIdx){
  if(slotIdx<0||slotIdx>=run.tpl.slots.length)return false;
  for(var i=0;i<run.towers.length;i++)if(run.towers[i].slot===slotIdx)return false;
  var def=TD.TOWERS[type];
  if(run.gold<def.cost)return false;
  run.gold-=def.cost;
  var sp=run.tpl.slots[slotIdx];
  run.towers.push({slot:slotIdx,x:sp[0],y:sp[1],type:type,lv:1,cd:0.2});
  return true;
};
TD.upgrade=function(run,slotIdx){
  for(var i=0;i<run.towers.length;i++){
    var tw=run.towers[i];
    if(tw.slot===slotIdx&&tw.lv<3){
      var c=TD.upCost(tw.type,tw.lv);
      if(run.gold>=c){run.gold-=c;tw.lv++;return true;}
      return false;
    }
  }
  return false;
};
/* 单步：出怪 / 沿路推进 / 塔索敌开火（即时命中 + 冰缓 + 炮溅射）/ 漏怪结算 */
TD.step=function(run,dt){
  if(run.status!=="run")return run.status;
  run.t+=dt;
  var L=run.level;
  while(run.evIdx<run.events.length&&run.events[run.evIdx].t<=run.t){
    var ev=run.events[run.evIdx++];
    run.enemies.push({s:0,hp:ev.hp,maxhp:ev.hp,spd:ev.spd,kind:ev.kind,slowT:0,
      x:run.tpl.path[0][0],y:run.tpl.path[0][1]});
    run.spawned++;
  }
  for(var i=run.enemies.length-1;i>=0;i--){
    var e=run.enemies[i];
    var f=e.slowT>0?0.55:1;
    e.slowT-=dt;
    e.s+=e.spd*f*dt;
    if(e.s>=run.plens.total){
      run.enemies.splice(i,1);
      run.lives--;
      if(run.lives<=0){run.status="fail";return "fail";}
      continue;
    }
    var pos=TD.posAt(run.tpl.path,run.plens,e.s);
    e.x=pos[0];e.y=pos[1];
  }
  for(var k=0;k<run.towers.length;k++){
    var tw=run.towers[k];
    tw.cd-=dt;
    if(tw.cd>0)continue;
    var def=TD.TOWERS[tw.type];
    var target=null,bs=-1;
    for(var m=0;m<run.enemies.length;m++){
      var en=run.enemies[m];
      var dx=en.x-tw.x,dy=en.y-tw.y;
      if(dx*dx+dy*dy<=TD.towerRange(tw.type,tw.lv)*TD.towerRange(tw.type,tw.lv)&&en.s>bs){bs=en.s;target=en;}
    }
    if(target){
      tw.cd=def.rate;
      var dmg=TD.towerDmg(tw.type,tw.lv);
      run.shots.push({x1:tw.x,y1:tw.y,x2:target.x,y2:target.y,life:0.12});
      if(def.splash>0){
        for(var q=run.enemies.length-1;q>=0;q--){
          var eq=run.enemies[q];
          var ddx=eq.x-target.x,ddy=eq.y-target.y;
          if(ddx*ddx+ddy*ddy<=def.splash*def.splash){
            eq.hp-=dmg;
            if(eq.hp<=0){run.gold+=TD.ZKINDS[eq.kind].reward;run.enemies.splice(q,1);}
          }
        }
      }else{
        target.hp-=dmg;
        if(def.slow>0)target.slowT=def.slow;
        if(target.hp<=0){run.gold+=TD.ZKINDS[target.kind].reward;
          var idx=run.enemies.indexOf(target);
          if(idx>=0)run.enemies.splice(idx,1);}
      }
    }
  }
  for(var s2=run.shots.length-1;s2>=0;s2--){
    run.shots[s2].life-=dt;
    if(run.shots[s2].life<=0)run.shots.splice(s2,1);
  }
  if(run.evIdx>=run.events.length&&run.enemies.length===0){run.status="win";return "win";}
  return "run";
};
/* 验证：贪心建塔升级策略（按路覆盖度排序：箭→箭→冰→箭→炮→箭→冰→炮，随后逐塔升满） */
TD.coverage=function(run,slotIdx){
  var sp=run.tpl.slots[slotIdx],cnt=0;
  for(var s=0;s<run.plens.total;s+=12){
    var pos=TD.posAt(run.tpl.path,run.plens,s);
    var dx=pos[0]-sp[0],dy=pos[1]-sp[1];
    if(dx*dx+dy*dy<=105*105)cnt++;
  }
  return cnt;
};
TD.BUILD_PLAN=["a0","a1","f2","a3","c4","a5","f6","c7"];
TD.policySim=function(level){
  var run=TD.createRun(level);
  var slots=run.tpl.slots.map(function(_,i){return i;});
  var byCov=slots.slice().sort(function(a,b){return TD.coverage(run,b)-TD.coverage(run,a);});
  var plan=[
    {b:0,slot:byCov[0]},{b:0,slot:byCov[1]},
    {u:byCov[0]},{u:byCov[1]},
    {b:1,slot:byCov[2]},
    {u:byCov[0]},{u:byCov[1]},
    {b:2,slot:byCov[3]},
    {b:0,slot:byCov[4]},{b:0,slot:byCov[5]},
    {u:byCov[2]},{u:byCov[3]},
    {u:byCov[0]},{u:byCov[1]},
    {u:byCov[4]},{u:byCov[5]},
    {u:byCov[2]},{u:byCov[3]}
  ];
  function towerAt(slot){
    for(var i=0;i<run.towers.length;i++)if(run.towers[i].slot===slot)return run.towers[i];
    return null;
  }
  function stepDone(st){
    if(st.b!=null)return towerAt(st.slot)!=null;
    var tw=towerAt(st.u);
    return !tw||tw.lv>=3;
  }
  function stepCost(st){
    if(st.b!=null)return TD.TOWERS[st.b].cost;
    var tw=towerAt(st.u);
    return tw&&tw.lv<3?TD.upCost(tw.type,tw.lv):0;
  }
  function doStep(st){
    if(st.b!=null)return TD.build(run,st.b,st.slot);
    var tw=towerAt(st.u);
    return tw&&TD.upgrade(run,st.u);
  }
  var guard=12000;   // 600s@0.05 上限
  while(guard-->0&&run.status==="run"){
    for(var i=0;i<plan.length;i++){
      var st=plan[i];
      if(stepDone(st))continue;
      if(run.gold>=stepCost(st)){doStep(st);break;}
    }
    TD.step(run,0.05);
  }
  return {status:run.status,lives:run.lives,t:run.t,gold:run.gold,
    towers:run.towers.map(function(t){return t.type+"L"+t.lv;}).join(",")};
};
TD.validateAll=function(){
  var fails=[],lifeSum=0,i;
  for(i=1;i<=TD.LEVEL_COUNT;i++){
    var L=TD.genLevel(i);
    var chk=TD.validate(L);
    if(!chk.ok){fails.push(i+"("+chk.why+")");continue;}
    var r=TD.policySim(L);
    lifeSum+=r.lives;
    if(r.status!=="win"||r.lives<2)fails.push(i+"("+r.status+",lives"+r.lives+")");
  }
  return {total:TD.LEVEL_COUNT,solvable:TD.LEVEL_COUNT-fails.length,fail:fails,
    avgLives:Math.round(lifeSum/TD.LEVEL_COUNT*100)/100};
};

var AC=null;
function beep(f,d,type,vol){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=f;g.gain.value=vol||0.05;
    o.connect(g);g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(d||0.1));
    o.start();o.stop(AC.currentTime+(d||0.1)+0.02);
  }catch(e){}
}

/* ========== 关卡数据：包内生成 + DB 下发（整批替换，任一条非法整批放弃） ========== */
var LEVELS=[],cur=0;

function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=TD.LEVEL_COUNT;i++)list.push(TD.genLevel(i));
  return list;
}
function parseTowerLevels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={},i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    var d;
    try{d=JSON.parse(item.dataJson)}catch(e){return null}
    if(!TD.validate(d).ok)return null;
    if(TD.policySim(d).status!=="win")return null;   // 下发关卡必须可守
    var no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=true;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;}
  }catch(e){}
  return 0;
}

var KEY="sw.towerdefense.v1";

var curSave=(function(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return{lv:parseInt(s.lv,10)||0,best:parseInt(s.best,10)||1};}catch(e){}
  return{lv:0,best:1};
})();
var unlocked=clamp(curSave.best,1,1);

  var data={lv:cur,best:unlocked};

function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("tower-defense").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=parseInt(r.lv,10),rb=parseInt(r.best,10);
      if(isFinite(rl)&&rl>curSave.lv){curSave.lv=Math.min(rl,LEVELS.length-1);changed=true;}
      if(isFinite(rb)&&rb>unlocked){unlocked=clamp(rb,1,LEVELS.length);changed=true;}
      if(changed){save();buildLevelChips();startLevel(curSave.lv);}
    }catch(e){}
  }).catch(function(){});
}

function step(dt){

    beep(660,0.12,"square",0.06);beep(880,0.16,"square",0.05);
    finishWin();

function syncHud(){
  ui.lv.textContent=(cur+1)+"/"+LEVELS.length;
  ui.gold.textContent=String(G.gold);
  var total=G.level.waves.length;
  var t2=0,wv=0;
  for(var w=0;w<total;w++){
    t2+=G.level.waves[w].delay;
    for(var k=0;k<G.level.waves[w].n;k++)t2+=G.level.waves[w].gap;
    if(G.t>=t2)wv=w+1;
  }
  ui.wave.textContent=(G.evIdx<G.events.length||G.enemies.length?Math.min(wv+1,total):total)+"/"+total;
  ui.lives.textContent=String(Math.max(0,G.lives));
  for(var c=0;c<3;c++){
    var def=TD.TOWERS[c];
    ui.cardBtns[c].textContent=def.name+" "+def.cost;
    ui.cardBtns[c].disabled=G.gold<def.cost;

/* ========== 绘制 ========== */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawTower(tw,selected){
  var def=TD.TOWERS[tw.type];
  var c=tw.type===0?PAL.primary:(tw.type===1?PAL.water:PAL.danger);
  ctx.fillStyle=PAL.surface;
  ctx.beginPath();ctx.arc(tw.x,tw.y,13,0,6.3);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=c;
  ctx.beginPath();ctx.arc(tw.x,tw.y,8,0,6.3);ctx.fill();
  // 等级刻点
  ctx.fillStyle=PAL.deep;
  for(var p=0;p<tw.lv;p++){
    ctx.beginPath();ctx.arc(tw.x-6+p*6,tw.y+16,2.2,0,6.3);ctx.fill();
  }
  if(selected){
    ctx.strokeStyle=PAL.warning;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(tw.x,tw.y,TD.towerRange(tw.type,tw.lv),0,6.3);ctx.stroke();
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(offX,offY);ctx.scale(S,S);
  if(G){
    var tpl=G.tpl;
    // 草地
    ctx.fillStyle=PAL.field1;
    ctx.fillRect(0,0,NW,NH);
    ctx.fillStyle=PAL.field2;
    for(var fy=0;fy<NH;fy+=46){
      for(var fx=(fy/46)%2===0?0:23;fx<NW;fx+=46){
        ctx.globalAlpha=0.5;
        ctx.fillRect(fx,fy,20,8);
        ctx.globalAlpha=1;
      }
    }
    // 道路
    ctx.strokeStyle=PAL.road;ctx.lineWidth=26;ctx.lineJoin="round";ctx.lineCap="butt";
    ctx.beginPath();
    ctx.moveTo(tpl.path[0][0],tpl.path[0][1]);
    for(var i=1;i<tpl.path.length;i++)ctx.lineTo(tpl.path[i][0],tpl.path[i][1]);
    ctx.stroke();
    ctx.strokeStyle=PAL.roadln;ctx.lineWidth=1.6;
    ctx.setLineDash([9,9]);
    ctx.beginPath();
    ctx.moveTo(tpl.path[0][0],tpl.path[0][1]);
    for(var i2=1;i2<tpl.path.length;i2++)ctx.lineTo(tpl.path[i2][0],tpl.path[i2][1]);
    ctx.stroke();
    ctx.setLineDash([]);
    // 起终点
    var end=tpl.path[tpl.path.length-1];
    ctx.fillStyle=PAL.danger;
    rr(end[0]-14,end[1]-14,28,28,8);ctx.fill();
    ctx.fillStyle=PAL.onPrimary;
    ctx.font="700 12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("基地",end[0],end[1]+0.5);
    // 塔位
    for(var s2=0;s2<tpl.slots.length;s2++){
      var sp=tpl.slots[s2];
      var occupied=false;
      for(var t3=0;t3<G.towers.length;t3++)if(G.towers[t3].slot===s2){occupied=true;break;}
      if(!occupied){
        ctx.fillStyle=PAL.surface2;
        rr(sp[0]-9,sp[1]-9,18,18,6);ctx.fill();
        ctx.strokeStyle=s2===slotCursor?PAL.primary:PAL.border;
        ctx.lineWidth=s2===slotCursor?2.2:1.2;
        ctx.stroke();
      }
    }
    // 塔
    for(var t4=0;t4<G.towers.length;t4++)drawTower(G.towers[t4],t4===slotCursor&&selCard===3);
    // 敌人
    for(var e=0;e<G.enemies.length;e++){
      var en=G.enemies[e];
      var ec=en.kind===2?PAL.danger:(en.kind===1?PAL.warning:PAL.text);
      ctx.fillStyle=ec;
      ctx.beginPath();ctx.arc(en.x,en.y,en.kind===2?12:9,0,6.3);ctx.fill();
      ctx.strokeStyle=PAL.border;ctx.lineWidth=1.4;ctx.stroke();
      if(en.slowT>0){
        ctx.strokeStyle=PAL.water;ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(en.x,en.y,en.kind===2?15:12,0,6.3);ctx.stroke();
      }
      if(en.hp<en.maxhp){
        ctx.fillStyle=PAL.faint;
        ctx.fillRect(en.x-12,en.y-16,24,3.5);
        ctx.fillStyle=PAL.danger;
        ctx.fillRect(en.x-12,en.y-16,24*Math.max(0,en.hp/en.maxhp),3.5);
      }
    }
    // 弹道轨迹
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=1.6;
    for(var sh=0;sh<G.shots.length;sh++){
      var so=G.shots[sh];
      ctx.globalAlpha=Math.max(0,so.life/0.12);
      ctx.beginPath();ctx.moveTo(so.x1,so.y1);ctx.lineTo(so.x2,so.y2);ctx.stroke();
      ctx.globalAlpha=1;
    }
    syncHud();
  }
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

/* ========== 输入：选塔卡 → 点塔位建塔；点已建塔直接升级 ========== */
function toNominal(ev){
  var r=cv.getBoundingClientRect();
  return{x:(ev.clientX-r.left-offX)/S,y:(ev.clientY-r.top-offY)/S};
}
cv.addEventListener("pointerdown",function(ev){
  if(state!=="running")return;
  var p=toNominal(ev);
  var best=-1,bd2=1e9;
  for(var s=0;s<G.tpl.slots.length;s++){
    var sp=G.tpl.slots[s];
    var dx=p.x-sp[0],dy=p.y-sp[1];
    var d2=dx*dx+dy*dy;
    if(d2<20*20&&d2<bd2){bd2=d2;best=s;}
  }
  if(best<0)return;
  slotCursor=best;
  var has=-1;
  for(var t=0;t<G.towers.length;t++)if(G.towers[t].slot===best){has=t;break;}
  if(has>=0){
    // 已建：直接尝试升级
    var tw=G.towers[has];
    if(tw.lv>=3)say("这座塔已升满");
    else if(TD.upgrade(G,best)){beep(640,0.08,"square",0.05);}
    else say("金币不足，升级需 "+TD.upCost(tw.type,tw.lv));
  }else if(selCard>=0){
    var def=TD.TOWERS[selCard];
    if(G.gold>=def.cost&&TD.build(G,selCard,best)){beep(520,0.08,"triangle",0.04);selCard=-1;}
    else say(G.gold<def.cost?"金币不足":"这个塔位已被占用");
  }else say("先在下方选一张塔卡");
  ev.preventDefault();
});
function selectCard(i){
  if(state!=="running")return;
  selCard=selCard===i?-1:i;
}
for(var cb=0;cb<3;cb++){
  (function(idx){
    ui.cardBtns[idx].addEventListener("click",function(){selectCard(idx);});
  })(cb);
}
window.addEventListener("keydown",function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="1")selectCard(0);
  else if(k==="2")selectCard(1);
  else if(k==="3")selectCard(2);
  else if(k==="ArrowRight"&&slotCursor<G.tpl.slots.length-1){e.preventDefault();slotCursor++;}
  else if(k==="ArrowLeft"&&slotCursor>0){e.preventDefault();slotCursor--;}
  else if(k==="Enter"||k===" "){
    e.preventDefault();
    var has=-1;
    for(var t=0;t<G.towers.length;t++)if(G.towers[t].slot===slotCursor){has=t;break;}
    if(has>=0){
      var tw=G.towers[has];
      if(tw.lv<3)TD.upgrade(G,slotCursor);
    }else if(selCard>=0)TD.build(G,selCard,slotCursor);
  }
});

function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));
  H=Math.max(300,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);
  offX=(W-NW*S)/2;offY=(H-NH*S)/2;
}

}

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
