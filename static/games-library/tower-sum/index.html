<style>
  /*token:GAME-THEME.md §2 基线（值与基线一致）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-hairline:#EFF1EE;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gap:16px;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-hairline:#262A27;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;

  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }

  }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .35; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;

  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;

  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }

  .lvbtn {

  }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* 数字塔专属 */
  .tower { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .trow { display: flex; gap: 5px; justify-content: center; }
  .tcell {
    width: 52px; height: 44px; border: 1px solid var(--g-border); border-radius: 10px;
    background: var(--g-bg); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 600; cursor: pointer; padding: 0;
    font-variant-numeric: tabular-nums;
  }
  .tcell.empty { color: var(--g-primary-deep); border-style: dashed; font-size: 16px; }
  .tcell.cur { outline: 2px solid var(--g-primary-deep); outline-offset: 1px; }
  .tcell.err { border-color: var(--g-danger); color: var(--g-danger); }
  .tcell.top { border-color: var(--g-warning); }
  .ctlbar { display: flex; gap: 6px; margin-top: 10px; justify-content: center; flex-wrap: wrap; }
  .ctlbar .btn { flex: 0 0 auto; min-width: 52px; padding: 0 10px; }
  .ctl { min-height: 48px; width: 100%; border: 0; border-radius: var(--g-radius-btn); background: var(--g-btn-primary); color: #fff; font-family: inherit; font-size: 18px; font-weight: 600; cursor: pointer; }

  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}

  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡（种子制：genLevel 生成 + 独立验证器逐关复核 + 缓存） ---------- */
var GAME_KEY="tower-sum",SAVE_KEY="sw.towersum.v1";
var LEVELS=[];for(var _i=0;_i<40;_i++)LEVELS.push(7001+_i*11);
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function applySeeds(seeds,ver){
  if(!Array.isArray(seeds)||seeds.length<8||!seeds.every(function(s){return Number.isInteger(s)&&s>0&&s<1e9;}))return false;
  LEVELS=seeds.slice();
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(LEVELS));localStorage.setItem(LEVELS_VER_KEY,String(ver||0));}catch(e){}
  return true;
}
function loadCachedSeeds(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length>=8&&list.every(function(s){return Number.isInteger(s)&&s>0&&s<1e9;})){
      LEVELS=list;return true;
    }
  }catch(e){}
  return false;
}
loadCachedSeeds();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    if(!res||!Array.isArray(res.levels)||!res.levels.length)return;
    var seeds=[];
    for(var i=0;i<res.levels.length;i++){
      var row=res.levels[i];
      if(!row||typeof row.dataJson!=="string")return;
      try{var d=JSON.parse(row.dataJson);if(!d||!Number.isInteger(d.seed))return;seeds.push(d.seed);}catch(e){return;}
    }
    if(applySeeds(seeds,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}

/* ---------- 生成器基础 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function diffOf(idx){
  if(idx<10)return [4,0,3];
  if(idx<22)return [5,0,4];
  if(idx<32)return [5,1,5];
  return [6,1,6];
}
/* 迭代枚举：底层空格赋值组合计数（生成器路径，内部推导底层空格） */
function countSolIter(n,grid){
  var baseEmpty=[];
  for(var c0=0;c0<n;c0++)if(grid[n-1][c0]===null)baseEmpty.push(c0);
  var count=0;
  var total=1;
  for(var i=0;i<baseEmpty.length;i++)total*=9;
  for(var code=0;code<total;code++){
    var x=code,ok=true,ts=[];
    for(var r=0;r<n;r++)ts.push(grid[r].slice());
    for(var b=0;b<baseEmpty.length&&ok;b++){
      var v=x%9+1;x=Math.floor(x/9);
      ts[n-1][baseEmpty[b]]=v;
    }
    /* 自底向上反推 */
    for(var rr=n-2;rr>=0;rr--){
      for(var c=0;c<=rr;c++){
        var s=ts[rr+1][c]+ts[rr+1][c+1];
        if(ts[rr][c]===null)ts[rr][c]=s;
        else if(ts[rr][c]!==s){ok=false;break;}
      }
      if(!ok)break;
    }
    if(ok)count++;
    if(count>1)break;
  }
  return count;
}
/* genLevel：底层 1-9，帕斯卡正推整塔，挖空并保证唯一解 */
function genLevel(seed,idx,attempt){
  attempt=attempt||0;
  var rng=mulberry32(seed);
  var dc=diffOf(idx),n=dc[0],baseHoles=dc[1],otherHoles=dc[2];
  var full=[];
  for(var r=0;r<n;r++){full.push([]);for(var c=0;c<=r;c++)full[r].push(0);}
  var base=[];
  for(var b=0;b<n;b++)base.push(1+Math.floor(rng()*9));
  full[n-1]=base.slice();
  for(var rr=n-2;rr>=0;rr--)for(var c=0;c<=rr;c++)full[rr][c]=full[rr+1][c]+full[rr+1][c+1];
  /* 挖空 */
  var grid=[];
  for(var r2=0;r2<n;r2++)grid.push(full[r2].slice());
  var bottom=[],mid=[];
  for(var i=0;i<n;i++){
    if(i<n-1&&rng()<(baseHoles===2?0.35:(baseHoles===1?0.5:0)))bottom.push(i);
    else mid.push(i);
  }
  while(bottom.length>baseHoles)bottom.pop();
  while(bottom.length<baseHoles&&mid.length>1){var w=mid.splice(Math.floor(rng()*mid.length),1)[0];if(w<n-1)bottom.push(w);}
  var top=[];
  for(var r3=0;r3<n-1;r3++)for(var c3=0;c3<=r3;c3++)top.push(r3*100+c3);
  for(var t=0;t<top.length;t++){var j=Math.floor(rng()*(t+1));var tmp=top[t];top[t]=top[j];top[j]=tmp;}
  var holes=[];
  for(var b2=0;b2<bottom.length;b2++)holes.push([n-1,bottom[b2]]);
  for(var o=0;o<Math.min(otherHoles,top.length);o++){
    var sel=top[o];
    holes.push([Math.floor(sel/100),sel%100]);
  }
  for(var h=0;h<holes.length;h++)grid[holes[h][0]][holes[h][1]]=null;
  /* 唯一性验证 + 修复 */
  var baseEmpty=[];
  for(var c4=0;c4<n;c4++)if(grid[n-1][c4]===null)baseEmpty.push(c4);
  var cnt=countSolIter(n,grid);
  if(cnt!==1){
    /* 逐个恢复非底层空格增加约束 */
    var holesIdx=holes.filter(function(h){return h[0]<n-1;});
    while(cnt!==1&&holesIdx.length){
      var hi=Math.floor(rng()*holesIdx.length);
      var hv=holesIdx.splice(hi,1)[0];
      grid[hv[0]][hv[1]]=full[hv[0]][hv[1]];
      baseEmpty=[];
      for(var c5=0;c5<n;c5++)if(grid[n-1][c5]===null)baseEmpty.push(c5);
      cnt=countSolIter(n,grid);
    }
    if(cnt!==1){
      if(attempt>=5){
        /* 保底：不挖底层，只挖三个非底层格 */
        var g2=[];
        for(var r4=0;r4<n;r4++)g2.push(full[r4].slice());
        g2[0][0]=null;
        if(n>=2)g2[n-2][0]=null;
        if(n>=2)g2[n-2][n-2]=null;
        return {n:n,grid:g2,sol:full,seed:seed};
      }
      return genLevel((seed*19+29)%1000000007,idx,attempt+1);
    }
  }
  if(holes.length<2){
    if(attempt>=5){
      var g3=[];
      for(var r5=0;r5<n;r5++)g3.push(full[r5].slice());
      g3[0][0]=null;
      if(n>=2)g3[n-2][0]=null;
      return {n:n,grid:g3,sol:full,seed:seed};
    }
    return genLevel((seed*19+29)%1000000007,idx,attempt+1);
  }
  return {n:n,grid:grid,sol:full,seed:seed};
}
/* 独立验证器：递归 DFS 枚举底层空格（与生成器迭代枚举不同路径） */
function verifyLevelData(d){
  if(!d||typeof d!=="object")return "数据异常";
  var n=d.n;
  if(!Number.isInteger(n)||n<4||n>6)return "层数越界";
  if(!Array.isArray(d.grid)||d.grid.length!==n)return "网格结构异常";
  for(var r=0;r<n;r++){
    if(!Array.isArray(d.grid[r])||d.grid[r].length!==r+1)return "行宽异常";
    for(var c=0;c<=r;c++){
      var v=d.grid[r][c];
      if(v!==null&&(!Number.isInteger(v)||v<1||v>999))return "格值越界";
    }
  }
  if(!Array.isArray(d.sol)||d.sol.length!==n)return "解结构异常";
  for(var r2=0;r2<n;r2++){
    if(!Array.isArray(d.sol[r2])||d.sol[r2].length!==r2+1)return "解行宽异常";
    for(var c2=0;c2<=r2;c2++){
      if(!Number.isInteger(d.sol[r2][c2])||d.sol[r2][c2]<1)return "解值异常";
      if(d.grid[r2][c2]!==null&&d.grid[r2][c2]!==d.sol[r2][c2])return "给定与解冲突";
    }
  }
  for(var r3=0;r3<n-1;r3++)for(var c3=0;c3<=r3;c3++){
    if(d.sol[r3][c3]!==d.sol[r3+1][c3]+d.sol[r3+1][c3+1])return "解违反帕斯卡约束";
  }
  /* 递归 DFS 枚举底层空格 */
  var baseEmpty=[];
  for(var c4=0;c4<n;c4++)if(d.grid[n-1][c4]===null)baseEmpty.push(c4);
  var count=0;
  (function dfs(k){
    if(count>1)return;
    if(k===baseEmpty.length){
      /* 自底向上正推 */
      var ts=[];
      for(var r4=0;r4<n;r4++)ts.push(d.grid[r4].slice());
      for(var rr=n-2;rr>=0;rr--){
        for(var c=0;c<=rr;c++){
          var s=ts[rr+1][c]+ts[rr+1][c+1];
          if(ts[rr][c]===null)ts[rr][c]=s;
          else if(ts[rr][c]!==s){return;}
        }
      }
      count++;
      return;
    }
    for(var v=1;v<=9;v++){
      d.grid[n-1][baseEmpty[k]]=v;
      dfs(k+1);
      d.grid[n-1][baseEmpty[k]]=null;
      if(count>1)return;
    }
  })(0);
  if(count!==1)return "解数="+count+"（应为 1）";
  return null;
}
/* 标准锚点用例（人工核对） */
function verifyAnchors(){
  /* 锚点1：n=2 底层 [2,3] 顶层挖空 → 唯一解 5 */
  var a1={n:2,grid:[[null],[2,3]]};
  if(countSolIter(2,a1.grid)!==1)return "锚点1 求解数≠1";
  /* 锚点2：n=3 底层 [1,2,3] 中层[3,5]给定、b 与顶层挖空 → b=2、顶=8 唯一 */
  var a2={n:3,grid:[[null],[3,5],[1,null,3]]};
  if(countSolIter(3,a2.grid)!==1)return "锚点2 求解数≠1";
  /* 锚点3：n=2 底层全挖只给顶层 10 → a+b=10 有 9 解；countSolIter 到 2 早退，返回 2 即非唯一 */
  var a3={n:2,grid:[[10],[null,null]]};
  var c3=countSolIter(2,a3.grid);
  if(c3!==2)return "锚点3 非唯一检测失败（应早退 2），实际 "+c3;
  /* 锚点4：n=4 全路径（底层 [1,2,3,4]，挖 b=1 与顶层；中层全给定 → 唯一） */
  var a4={n:4,grid:[[null],[8,12],[3,5,7],[1,null,3,4]],sol:[[20],[8,12],[3,5,7],[1,2,3,4]]};
  if(countSolIter(4,a4.grid)!==1)return "锚点4 求解数≠1";
  var e4=verifyLevelData(a4);if(e4)return "锚点4 "+e4;
  return null;
}
function selfCheck(){
  var err=verifyAnchors();
  for(var i=0;i<LEVELS.length;i++){
    var e=safeVerify(LEVELS[i],i);
    if(e&&!err)err="第 "+(i+1)+" 关 "+e;
  }
  if(err)say("数据校验告警："+err);
}
function safeVerify(seed,idx){
  try{
    var d=genLevel(seed,idx);
    return verifyLevelData(d);
  }catch(e){return "生成异常";}
}
/* ---------- 状态与渲染 ---------- */
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
var lv=save.lv,L=null,vals=[],curIdx=0,chances=3,done=false,errSet={},hints=3;
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  var d=null;
  for(var t=0;t<3;t++){
    d=genLevel(LEVELS[lv]+t*9973,lv);
    if(!verifyLevelData(d))break;
    d=null;
  }
  if(!d){say("本关数据异常，已回退");if(lv>0){lv--;save.lv=Math.min(save.lv,lv);persist();loadLevel(lv);return;}return;}
  L=d;
  vals=[];
  for(var r=0;r<L.n;r++){vals.push([]);for(var c=0;c<=r;c++)vals[r].push(L.grid[r][c]===null?null:L.grid[r][c]);}
  curIdx=0;chances=3;done=false;errSet={};hints=3;
  $("lvTag").textContent="第 "+(lv+1)+" 关";
  $("lvRule").textContent=L.n+" 层数字塔 · 每格=脚下两格之和";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  updStats();renderTower();
  $("ctlbar").hidden=true;
  say("点虚线格填数：中间格=脚下两格之和；底层格要从塔顶反推");
}
function holes(){
  var arr=[];
  for(var r=0;r<L.n;r++)for(var c=0;c<=r;c++)if(vals[r][c]===null)arr.push([r,c]);
  return arr;
}
function filled(){
  for(var r=0;r<L.n;r++)for(var c=0;c<=r;c++)if(vals[r][c]===null)return false;
  return true;
}
function updStats(){
  $("stHole").textContent=holes().length;
  var ch=$("stCh");ch.textContent=Math.max(0,chances);
  if(chances<=1)ch.classList.add("low");else ch.classList.remove("low");
  $("btnSubmit").disabled=!filled()||done;
  $("btnHint").disabled=hints<=0||done;
}
function renderTower(){
  var t=$("tower");t.innerHTML="";
  for(var r=0;r<L.n;r++){
    var row=document.createElement("div");row.className="trow";
    for(var c=0;c<=r;c++){
      (function(r,c){
        var b=document.createElement("button");
        b.setAttribute("data-r",r);b.setAttribute("data-c",c);
        b.addEventListener("click",function(){cellClick(r,c);});
        row.appendChild(b);
      })(r,c);
    }
    t.appendChild(row);
  }
  paintTower();
}
function paintTower(){
  var cells=$("tower").querySelectorAll(".tcell");
  for(var i=0;i<cells.length;i++){
    var r=+cells[i].getAttribute("data-r"),c=+cells[i].getAttribute("data-c");
    var v=vals[r][c];
    var cur=!done&&isCur(r,c);
    cells[i].className="tcell"+(v===null?" empty":"")+(cur?" cur":"")+(errSet[r+"_"+c]?" err":"")+(r===0&&v!==null?" top":"");
    cells[i].textContent=v===null?"？":String(v);
    cells[i].disabled=done;
  }
}
function holeList(){
  var arr=[];
  for(var r=0;r<L.n;r++)for(var c=0;c<=r;c++)if(vals[r][c]===null)arr.push(r*100+c);
  return arr;
}
function isCur(r,c){
  var hl=holeList();
  if(!hl.length)return false;
  var idx=-1;
  for(var i=0;i<hl.length;i++)if(hl[i]===r*100+c)idx=i;
  if(idx<0)return false;
  return idx===curIdx%hl.length;
}
function curCell(){
  var hl=holeList();
  if(!hl.length)return null;
  var k=curIdx%hl.length;
  return [Math.floor(hl[k]/100),hl[k]%100];
}
function cellClick(r,c){
  if(done||!L)return;
  if(vals[r][c]!==null){say("这是给定数，不能改");return;}
  var hl=holeList();
  for(var i=0;i<hl.length;i++)if(hl[i]===r*100+c)curIdx=i;
  $("ctlbar").hidden=false;
  paintTower();
}
function adjust(delta){
  if(done)return;
  var cc=curCell();
  if(!cc){say("先选一个空格");return;}
  var r=cc[0],c=cc[1];
  var v=vals[r][c]===null?0:vals[r][c];
  v=Math.min(999,Math.max(0,v+delta));
  vals[r][c]=v===0?null:v;
  delete errSet[r+"_"+c];
  paintTower();updStats();
}
function clearCell(){
  if(done)return;
  var cc=curCell();
  if(!cc)return;
  vals[cc[0]][cc[1]]=null;
  delete errSet[cc[0]+"_"+cc[1]];
  paintTower();updStats();
}
function submit(){
  if(done||!filled())return;
  var bad=0;
  for(var r=0;r<L.n;r++)for(var c=0;c<=r;c++){
    if(vals[r][c]!==L.sol[r][c]){errSet[r+"_"+c]=1;bad++;}
  }
  paintTower();
  if(!bad){winLevel();return;}
  chances--;updStats();
  if(chances<=0){failLevel("有 "+bad+" 个格子不对，机会用完了");return;}
  say("有 "+bad+" 个格子标红不对（检查每格=脚下两格之和），还剩 "+chances+" 次机会");
}
function hint(){
  if(done||hints<=0)return;
  var cc=curCell();
  if(!cc){say("先选一个空格");return;}
  vals[cc[0]][cc[1]]=L.sol[cc[0]][cc[1]];
  delete errSet[cc[0]+"_"+cc[1]];
  hints--;paintTower();updStats();
  say("已把光标格填上正确值；想想它脚下的两格或塔顶约束");
}
function winLevel(){
  done=true;$("ctlbar").hidden=true;paintTower();updStats();
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:3-Math.max(0,chances)}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"过关！";
  $("ovDesc").innerHTML=L.n+" 层塔全部配平 · 剩余机会 "+chances+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
function failLevel(reason){
  done=true;$("ctlbar").hidden=true;paintTower();updStats();
  $("ovTitle").textContent="配平失败";
  $("ovDesc").textContent=reason+"。重开本关再来，提示键可以确认一格。";
  $("ovBtn").textContent="重开本关";
  $("overlay").classList.add("show");
}
/* ---------- 键盘 ---------- */
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"){curIdx--;paintTower();e.preventDefault();}
  else if(k==="ArrowRight"){curIdx++;paintTower();e.preventDefault();}
  else if(k==="ArrowUp"){adjust(1);e.preventDefault();}
  else if(k==="ArrowDown"){adjust(-1);e.preventDefault();}
  else if(k==="Enter"||k===" "){
    if($("overlay").classList.contains("show")){$("ovBtn").click();e.preventDefault();return;}
    if(done)return;
    submit();e.preventDefault();
  }
  else if(k==="Backspace"){clearCell();e.preventDefault();}
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置");}
  else if(k==="l"||k==="L"){if(!done)openLevelSelect();}
});
$("btnM10").addEventListener("click",function(){adjust(-10);});
$("btnM1").addEventListener("click",function(){adjust(-1);});
$("btnP1").addEventListener("click",function(){adjust(1);});
$("btnP10").addEventListener("click",function(){adjust(10);});
$("btnClr").addEventListener("click",clearCell);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置");});
$("btnLv").addEventListener("click",function(){if(!done)openLevelSelect();});
$("btnSubmit").addEventListener("click",submit);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(chances<=0){loadLevel(lv);return;}
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0);}
    else{lv++;save.lv=Math.max(save.lv,lv);persist();loadLevel(lv);}
  }else loadLevel(lv);
});
/* ---------- 启动 ---------- */
loadLevel(save.lv);
selfCheck();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
