function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  levelOk=new Array(LEVELS.length);
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}

function verifyPending(){   // 后台逐关复核（分片避免卡顿）：坏关禁选、当前关即时告警

    var t0=Date.now();
    while(i<LEVELS.length&&Date.now()-t0<40){
      if(levelOk[i]===undefined)levelOk[i]=verifyLevel(LEVELS[i]);
      i++;

    if(i<LEVELS.length)setTimeout(step,0);

  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);
      if(typeof resize==="function")resize();
    }
  }).catch(function(){});
}
/* ---------- 选关浮层（lvgrid 通用） ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(save.done[i]?" done":"");
      b.textContent=i+1;
      b.disabled=(levelOk[i]===false)||(i>save.lv);   // 验证失败的关禁选；未验证的关乐观放行
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 结构校验 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.n)||d.n<7||d.n>9)return false;
  if(!Array.isArray(d.cols)||d.cols.length!==d.n)return false;
  var sum=0;
  for(var i=0;i<d.n;i++){if(!Number.isInteger(d.cols[i])||d.cols[i]<0||d.cols[i]>d.n)return false;sum+=d.cols[i]}
  if(sum!==d.n)return false;
  if(!Array.isArray(d.regs)||d.regs.length!==2)return false;
  if(!Number.isInteger(d.regs[0])||d.regs[0]<2||d.regs[0]>d.n-2)return false;
  if(!Number.isInteger(d.regs[1])||d.regs[1]<2||d.regs[1]>d.n-2)return false;
  if(!Array.isArray(d.regc)||d.regc.length!==4)return false;
  var rsum=0;
  for(var q=0;q<4;q++){if(!Number.isInteger(d.regc[q])||d.regc[q]<0)return false;rsum+=d.regc[q]}
  if(rsum!==d.n)return false;
  if(!Array.isArray(d.diagc)||d.diagc.length!==2)return false;
  for(var q2=0;q2<2;q2++)if(!Number.isInteger(d.diagc[q2])||d.diagc[q2]<0||d.diagc[q2]>d.n)return false;
  if(!Array.isArray(d.sol)||d.sol.length!==d.n)return false;
  for(var j=0;j<d.n;j++){if(!Number.isInteger(d.sol[j])||d.sol[j]<0||d.sol[j]>=d.n)return false;
    if(j>0&&Math.abs(d.sol[j]-d.sol[j-1])<=1)return false;}
  return true;
}
/* ---------- 独立验证器：行/列/区域计数 + 八向不相邻的布局计数（与交互逻辑分离） ---------- */
function tgReg(n,regs,r,c){return (r>=regs[1]?2:0)+(c>=regs[0]?1:0)}
function tgCount(n,cc,regs,regc,diagc,cap){
  var colUsed=new Array(n).fill(0),regUsed=[0,0,0,0],d0=0,d1=0,count=0;
  function bt(row,prev){
    if(count>=cap)return;
    if(row===n){if(d0===diagc[0]&&d1===diagc[1])count++;return}
    for(var c=0;c<n;c++){
      var rg=tgReg(n,regs,row,c);
      if(colUsed[c]>=cc[c])continue;
      if(regUsed[rg]>=regc[rg])continue;
      var g0=(c===row)?1:0,g1=(c===n-1-row)?1:0;
      if(d0+g0>diagc[0]||d1+g1>diagc[1])continue;
      if(prev!==null&&Math.abs(c-prev)<=1)continue;
      colUsed[c]++;regUsed[rg]++;d0+=g0;d1+=g1;
      bt(row+1,c);
      colUsed[c]--;regUsed[rg]--;d0-=g0;d1-=g1;
      if(count>=cap)return;
    }
  }
  bt(0,null);
  return count;
}
function verifyLevel(L){
  if(!validLevelData(L))return false;
  return tgCount(L.n,L.cols,L.regs,L.regc,L.diagc,2)>=1;
}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),
    sea:v("--g-st-sea"),sea2:v("--g-st-sea2"),gold:v("--g-st-gold"),grid:v("--g-st-grid")};
}
window.__gOnTheme=function(){palLoad()};
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,grid=[],history=[],cur=-1,done=false;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,dpr=1,n=8,cs=44;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
/* ---------- 关卡 ---------- */
function loadLevel(nl){
  lv=Math.max(0,Math.min(nl,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return}
  n=L.n;
  grid=new Array(n*n).fill(0);history=[];cur=-1;done=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  var ok=verifyLevel(L);   // 加载复核：线索可满足
  if(!ok)say("警告：内嵌验证器判定本关线索无解（数据异常）");
  else say("点格子放宝藏，让每列数量与底部数字一致");
  updStats();resize();
}
function starCount(){var c=0;for(var i=0;i<grid.length;i++)if(grid[i]===1)c++;return c}
function conflicts(){
  var errs=0;
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    if(grid[y*n+x]!==1)continue;
    var rowStars=0;
    for(var q=0;q<n;q++)if(grid[y*n+q]===1)rowStars++;
    if(rowStars>1){errs++;continue}
    for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
      if(!dy&&!dx)continue;
      var nx=x+dx,ny=y+dy;
      if(nx>=0&&ny>=0&&nx<n&&ny<n&&grid[ny*n+nx]===1){errs++;dy=2;break}
    }
  }
  var colC=new Array(n).fill(0),regC=[0,0,0,0],dgC=[0,0];
  for(var i=0;i<grid.length;i++)if(grid[i]===1){
    var gy=Math.floor(i/n),gx=i%n;
    colC[gx]++;regC[tgReg(n,L.regs,gy,gx)]++;
    if(gx===gy)dgC[0]++;
    if(gx===n-1-gy)dgC[1]++;
  }
  for(var c2=0;c2<n;c2++)if(colC[c2]>L.cols[c2])errs++;
  for(var r2=0;r2<4;r2++)if(regC[r2]>L.regc[r2])errs++;
  if(dgC[0]>L.diagc[0]||dgC[1]>L.diagc[1])errs++;
  return errs;
}
function updStats(){
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stN").textContent=starCount()+" / "+n;
  $("stErr").textContent=conflicts();
  $("btnUndo").disabled=!history.length||done;
}
/* ---------- 交互 ---------- */
function cycle(i){
  if(done||i<0)return;
  history.push({i:i,prev:grid[i]});
  grid[i]=(grid[i]+1)%3;
  if(grid[i]===1)say("放下宝藏");
  else if(grid[i]===2)say("标记排除");
  else say("清除标记");
  updStats();checkWin();
}
function undo(){
  if(!history.length||done)return;
  var h=history.pop();
  grid[h.i]=h.prev;cur=h.i;
  updStats();say("撤销一步");
}
function hint(){
  if(done)return;
  // 与内嵌解比对：先清一个错星，再放一个正确星
  for(var i=0;i<grid.length;i++){
    var y=Math.floor(i/n),x=i%n;
    if(grid[i]===1&&L.sol[y]!==x){
      history.push({i:i,prev:grid[i]});grid[i]=0;
      say("提示：这里不是宝藏，已移除");
      updStats();return;
    }
  }
  for(var r=0;r<n;r++){
    if(grid[r*n+L.sol[r]]!==1){
      history.push({i:r*n+L.sol[r],prev:grid[r*n+L.sol[r]]});
      grid[r*n+L.sol[r]]=1;
      say("提示：第 "+(r+1)+" 行的宝藏在这里");
      updStats();checkWin();return;
    }
  }
  say("按内嵌解已就位，检查其他行");
}
function checkWin(){
  if(done)return;
  if(starCount()<n||conflicts()>0)return;
  var colC=new Array(n).fill(0),regC=[0,0,0,0],dgW=[0,0];
  for(var i=0;i<grid.length;i++)if(grid[i]===1){
    var wy=Math.floor(i/n),wx=i%n;
    colC[wx]++;regC[tgReg(n,L.regs,wy,wx)]++;
    if(wx===wy)dgW[0]++;
    if(wx===n-1-wy)dgW[1]++;
  }
  for(var c=0;c<n;c++)if(colC[c]!==L.cols[c])return;
  for(var r2=0;r2<4;r2++)if(regC[r2]!==L.regc[r2])return;
  if(dgW[0]!==L.diagc[0]||dgW[1]!==L.diagc[1])return;
  for(var y=0;y<n;y++){
    var rowStars=0;
    for(var q=0;q<n;q++)if(grid[y*n+q]===1)rowStars++;
    if(rowStars!==1)return;
  }
  done=true;
  save.done[lv]=true;
  if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:history.length}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"宝藏找齐了！";
  $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成 · 操作 "+history.length+" 步"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
/* ---------- 绘制 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cs=Math.min(Math.floor((wCss-16)/n),56);
  W=cs*n+16;H=cs*n+34;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function draw(){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  if(!L)return;
  var errs=conflicts();
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    var i=y*n+x,v=grid[i];
    var px=8+x*cs,py=8+y*cs;
    ctx.fillStyle=(x+y)%2===0?PAL.sea:PAL.sea2;   // 素材海床棋盘格
    ctx.fillRect(px,py,cs-2,cs-2);
    if(v===1)ctx.fillStyle=PAL.grid;
    else ctx.fillStyle=PAL.grid;
    ctx.fillRect(px+1,py+1,cs-4,cs-4);
    if(v===1){
      ctx.fillStyle=PAL.gold;   // 素材金币色
      ctx.beginPath();ctx.arc(px+cs/2,py+cs/2,cs*0.28,0,7);ctx.fill();
      ctx.strokeStyle=PAL.border;ctx.lineWidth=1.5;ctx.stroke();
    }else if(v===2){
      ctx.strokeStyle=PAL.muted;ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(px+cs*0.3,py+cs*0.3);ctx.lineTo(px+cs*0.7,py+cs*0.7);
      ctx.moveTo(px+cs*0.7,py+cs*0.3);ctx.lineTo(px+cs*0.3,py+cs*0.7);
      ctx.stroke();
    }
    if(i===cur&&!done){
      ctx.strokeStyle=PAL.deep;ctx.lineWidth=2.5;
      ctx.strokeRect(px+1,py+1,cs-4,cs-4);
    }
  }
  // 对角辅助虚线
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1.5;
  ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(8,8);ctx.lineTo(8+n*cs,8+n*cs);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8+n*cs,8);ctx.lineTo(8,8+n*cs);ctx.stroke();
  ctx.setLineDash([]);
  // 区域分割线 + 区域线索（左上角标）
  ctx.strokeStyle=PAL.border;ctx.lineWidth=3;
  var vx=8+L.regs[0]*cs,vy=8+L.regs[1]*cs;
  ctx.beginPath();ctx.moveTo(vx,8);ctx.lineTo(vx,8+n*cs);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,vy);ctx.lineTo(8+n*cs,vy);ctx.stroke();
  ctx.font="700 12px sans-serif";
  ctx.textAlign="left";ctx.textBaseline="middle";
  var regNow=[0,0,0,0];
  for(var j2=0;j2<grid.length;j2++)if(grid[j2]===1)regNow[tgReg(n,L.regs,Math.floor(j2/n),j2%n)]++;
  var corners=[[0,0],[L.regs[0],0],[0,L.regs[1]],[L.regs[0],L.regs[1]]];
  for(var rg=0;rg<4;rg++){
    ctx.fillStyle=regNow[rg]>L.regc[rg]?PAL.danger:(regNow[rg]===L.regc[rg]?PAL.success:PAL.muted);
    ctx.fillText(L.regc[rg]+" 区",8+corners[rg][0]*cs+6,8+corners[rg][1]*cs+10);
  }
  // 列线索
  ctx.font="700 "+Math.min(16,cs*0.36)+"px sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  var colC=new Array(n).fill(0);
  for(var j=0;j<grid.length;j++)if(grid[j]===1)colC[j%n]++;
  for(var c=0;c<n;c++){
    ctx.fillStyle=colC[c]>L.cols[c]?PAL.danger:(colC[c]===L.cols[c]?PAL.success:PAL.muted);
    ctx.fillText(String(L.cols[c]),8+c*cs+cs/2,H-16);
  }
  requestAnimationFrame(draw);
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  if(done)return;
  var r=cv.getBoundingClientRect();
  var px=e.clientX-r.left,py=e.clientY-r.top;
  var x=Math.floor((px-8)/cs),y=Math.floor((py-8)/cs);
  if(x>=0&&y>=0&&x<n&&y<n&&py<8+n*cs)cycle(y*n+x);
  e.preventDefault();
});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){grid=new Array(n*n).fill(0);history=[];updStats();say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k.indexOf("Arrow")===0){
    if(cur<0)cur=0;
    else{
      var y=Math.floor(cur/n),x=cur%n;
      if(k==="ArrowLeft")x=Math.max(0,x-1);
      else if(k==="ArrowRight")x=Math.min(n-1,x+1);
      else if(k==="ArrowUp")y=Math.max(0,y-1);
      else y=Math.min(n-1,y+1);
      cur=y*n+x;
    }
    e.preventDefault();
  }else if(k==="Enter"||k===" "){if(cur>=0)cycle(cur);e.preventDefault()}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){grid=new Array(n*n).fill(0);history=[];updStats();say("本关已重置")}
});
function renderLevels(){}
/* ---------- 启动 ---------- */
var running=true;
document.addEventListener("visibilitychange",function(){
  if(document.hidden)running=false;
  else if(!running){running=true;requestAnimationFrame(draw)}
});
palLoad();loadLevel(save.lv);
requestAnimationFrame(draw);
verifyPending();syncLevelsFromServer();syncSaveFromServer();
window.addEventListener("resize",resize);

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
