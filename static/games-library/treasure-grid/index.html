  .stage { position: relative; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); box-shadow: var(--g-shadow); animation: rise .38s ease-out both; }

  .tools { display: flex; gap: 8px; margin-bottom: 8px; }

    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;

  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }

  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }

  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;

    var d;

/* ---------- 结构校验 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.n)||d.n<7||d.n>9)return false;
  if(!Array.isArray(d.cols)||d.cols.length!==d.n)return false;
  var sum=0;
  for(var i=0;i<d.n;i++){if(!Number.isInteger(d.cols[i])||d.cols[i]<0||d.cols[i]>d.n)return false;sum+=d.cols[i]}
  if(sum!==d.n)return false;
  if(!Array.isArray(d.regs)||d.regs.length!==2)return false;
  if(!Number.isInteger(d.regs[0])||d.regs[0]<2||d.regs[0]>d.n-2)return false;
  if(!Number.isInteger(d.regs[1])||d.regs[1]<2||d.regs[1]>d.n-2)return false;
  if(!Array.isArray(d.regc)||d.regc.length!==4)return false;
  var rsum=0;
  for(var q=0;q<4;q++){if(!Number.isInteger(d.regc[q])||d.regc[q]<0)return false;rsum+=d.regc[q]}
  if(rsum!==d.n)return false;
  if(!Array.isArray(d.diagc)||d.diagc.length!==2)return false;
  for(var q2=0;q2<2;q2++)if(!Number.isInteger(d.diagc[q2])||d.diagc[q2]<0||d.diagc[q2]>d.n)return false;
  if(!Array.isArray(d.sol)||d.sol.length!==d.n)return false;
  for(var j=0;j<d.n;j++){if(!Number.isInteger(d.sol[j])||d.sol[j]<0||d.sol[j]>=d.n)return false;
    if(j>0&&Math.abs(d.sol[j]-d.sol[j-1])<=1)return false;}
  return true;
}
/* ---------- 独立验证器：行/列/区域计数 + 八向不相邻的布局计数（与交互逻辑分离） ---------- */
function tgReg(n,regs,r,c){return (r>=regs[1]?2:0)+(c>=regs[0]?1:0)}
function tgCount(n,cc,regs,regc,diagc,cap){
  var colUsed=new Array(n).fill(0),regUsed=[0,0,0,0],d0=0,d1=0,count=0;
  function bt(row,prev){
    if(count>=cap)return;
    if(row===n){if(d0===diagc[0]&&d1===diagc[1])count++;return}
    for(var c=0;c<n;c++){
      var rg=tgReg(n,regs,row,c);
      if(colUsed[c]>=cc[c])continue;
      if(regUsed[rg]>=regc[rg])continue;
      var g0=(c===row)?1:0,g1=(c===n-1-row)?1:0;
      if(d0+g0>diagc[0]||d1+g1>diagc[1])continue;
      if(prev!==null&&Math.abs(c-prev)<=1)continue;
      colUsed[c]++;regUsed[rg]++;d0+=g0;d1+=g1;
      bt(row+1,c);
      colUsed[c]--;regUsed[rg]--;d0-=g0;d1-=g1;
      if(count>=cap)return;
    }
  }
  bt(0,null);
  return count;
}
function verifyLevel(L){
  if(!validLevelData(L))return false;
  return tgCount(L.n,L.cols,L.regs,L.regc,L.diagc,2)>=1;
}

  ctx.globalAlpha=.9;ctx.fillStyle=WHITE;
  ctx.beginPath();ctx.ellipse(x-r*0.32,y-r*0.38,r*0.22,r*0.13,-0.5,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  if(bad){ctx.strokeStyle=PAL.danger;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,r+3.5,0,Math.PI*2);ctx.stroke();}
}
/* 排除叉：白衬底 + danger 圆头笔画（跨底色可读） */
function drawCross(x,y,r){
  ctx.lineCap="round";ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r);ctx.stroke();
  ctx.strokeStyle=PAL.danger;ctx.lineWidth=2.6;
  ctx.beginPath();ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r);ctx.stroke();
  ctx.lineCap="butt";
}
function draw(){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  if(!L)return;
  var bx=8,by=8,bw=cs*n,bh=cs*n,i,x,y;
  /* 海床地面：竖向渐变 + 外沟槽边环 + 顶光 */
  var sg=ctx.createLinearGradient(0,by,0,by+bh);
  sg.addColorStop(0,PAL.sea);sg.addColorStop(1,PAL.sea2);
  ctx.fillStyle=sg;ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle="rgba(255,255,255,.35)";ctx.fillRect(bx,by,bw,1.5);
  ctx.strokeStyle=colShade(PAL.sea2,-0.28);ctx.lineWidth=2;
  rr(bx+1,by+1,bw-2,bh-2,10);ctx.stroke();
  /* 光标所在行 / 列轨迹（可落点提示） */
  if(cur>=0&&!done){
    var ccx=cur%n,ccy=Math.floor(cur/n);
    ctx.globalAlpha=0.5;ctx.fillStyle=PAL.soft;
    ctx.fillRect(bx+2,by+2+ccy*cs,bw-4,cs-2);
    ctx.fillRect(bx+2+ccx*cs,by+2,cs-2,bh-4);
    ctx.globalAlpha=1;
  }
  /* 逐格地砖：渐变面 + 顶光 + 落地投影 */
  var conf=cellConflicts();
  var gap=Math.max(1.5,cs*0.055),rad=Math.min(10,cs*0.18);
  for(y=0;y<n;y++)for(x=0;x<n;x++){
    i=y*n+x;var v=grid[i];
    var px=bx+x*cs,py=by+y*cs;
    var base=(x+y)%2===0?PAL.sea:PAL.sea2;
    ctx.fillStyle="rgba(0,0,0,.12)";rr(px+gap,py+gap+1.5,cs-gap*2,cs-gap*2,rad);ctx.fill();
    var g=ctx.createLinearGradient(0,py+gap,0,py+cs-gap);
    g.addColorStop(0,base);g.addColorStop(1,colShade(base,-0.10));
    ctx.fillStyle=g;rr(px+gap,py+gap,cs-gap*2,cs-gap*2,rad);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.5)";rr(px+gap+1,py+gap+1,cs-gap*2-2,2,1);ctx.fill();
    if(v===1)drawCoin(px+cs/2,py+cs/2,cs*0.30,conf[i]);
    else if(v===2)drawCross(px+cs/2,py+cs/2,cs*0.22);
    if(i===cur&&!done){
      ctx.strokeStyle=PAL.deep;ctx.lineWidth=2.5;
      rr(px+1.5,py+1.5,cs-3,cs-3,rad+1);ctx.stroke();
    }
  }
  /* 对角辅助虚线（凹槽） */
  ctx.strokeStyle=colShade(PAL.sea2,-0.22);ctx.lineWidth=1.5;
  ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+bw,by+bh);ctx.stroke();
  ctx.beginPath();ctx.moveTo(bx+bw,by);ctx.lineTo(bx,by+bh);ctx.stroke();
  ctx.setLineDash([]);
  /* 区域分割线 + 区域线索 chip */
  ctx.strokeStyle=colShade(PAL.sea2,-0.3);ctx.lineWidth=3;
  var vx=bx+L.regs[0]*cs,vy=by+L.regs[1]*cs;
  ctx.beginPath();ctx.moveTo(vx,by);ctx.lineTo(vx,by+bh);ctx.stroke();
  ctx.beginPath();ctx.moveTo(bx,vy);ctx.lineTo(bx+bw,vy);ctx.stroke();
  ctx.font="700 12px sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
  var regNow=[0,0,0,0];
  for(var j2=0;j2<grid.length;j2++)if(grid[j2]===1)regNow[tgReg(n,L.regs,Math.floor(j2/n),j2%n)]++;
  var corners=[[0,0],[L.regs[0],0],[0,L.regs[1]],[L.regs[0],L.regs[1]]];
  for(var rg=0;rg<4;rg++){
    var txt=L.regc[rg]+" 区";
    var rc=regNow[rg]>L.regc[rg]?PAL.danger:(regNow[rg]===L.regc[rg]?PAL.success:PAL.muted);
    var rx=bx+corners[rg][0]*cs+6,ry2=by+corners[rg][1]*cs+8;
    var rw=ctx.measureText(txt).width+12;
    ctx.globalAlpha=0.82;ctx.fillStyle=PAL.grid;rr(rx-3,ry2-8,rw,16,8);ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=rc;ctx.lineWidth=1.2;rr(rx-3,ry2-8,rw,16,8);ctx.stroke();
    ctx.fillStyle=rc;ctx.fillText(txt,rx+3,ry2+0.5);
  }
  /* 列线索 chip */
  ctx.font="700 "+Math.min(16,cs*0.36)+"px sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  var colC=new Array(n).fill(0);
  for(var j=0;j<grid.length;j++)if(grid[j]===1)colC[j%n]++;
  for(var c=0;c<n;c++){
    var cc2=colC[c]>L.cols[c]?PAL.danger:(colC[c]===L.cols[c]?PAL.success:PAL.muted);
    var cx2=bx+c*cs+cs/2,cy2=H-16;
    ctx.globalAlpha=0.82;ctx.fillStyle=PAL.grid;rr(cx2-cs*0.32,cy2-9,cs*0.64,18,9);ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=cc2;ctx.lineWidth=1.2;rr(cx2-cs*0.32,cy2-9,cs*0.64,18,9);ctx.stroke();
    ctx.fillStyle=cc2;ctx.fillText(String(L.cols[c]),cx2,cy2+0.5);
  }
  /* 放宝藏 / 排除脉冲 */
  var now=performance.now();
  for(var q=fxs.length-1;q>=0;q--){
    var qq=(now-fxs[q].t0)/180;
    if(qq>=1){fxs.splice(q,1);continue}
    var fx2=bx+(fxs[q].x+0.5)*cs,fy2=by+(fxs[q].y+0.5)*cs;
    ctx.globalAlpha=(1-qq)*0.55;ctx.strokeStyle=fxs[q].ok?PAL.success:PAL.danger;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(fx2,fy2,cs*0.2+qq*cs*0.35,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }
  scheduleDraw();
}
var rafPending=false;
function scheduleDraw(){
  if(rafPending)return;
  rafPending=true;
  requestAnimationFrame(function(){rafPending=false;draw();});
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  if(done)return;
  var r=cv.getBoundingClientRect();
  var px=e.clientX-r.left,py=e.clientY-r.top;
  var x=Math.floor((px-8)/cs),y=Math.floor((py-8)/cs);
  if(x>=0&&y>=0&&x<n&&y<n&&py<8+n*cs)cycle(y*n+x);
  e.preventDefault();
});
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){grid=new Array(n*n).fill(0);history=[];updStats();say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k.indexOf("Arrow")===0){
    if(cur<0)cur=0;
    else{
      var y=Math.floor(cur/n),x=cur%n;
      if(k==="ArrowLeft")x=Math.max(0,x-1);
      else if(k==="ArrowRight")x=Math.min(n-1,x+1);
      else if(k==="ArrowUp")y=Math.max(0,y-1);
      else y=Math.min(n-1,y+1);
      cur=y*n+x;
    }
    e.preventDefault();
  }else if(k==="Enter"||k===" "){if(cur>=0)cycle(cur);e.preventDefault()}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){grid=new Array(n*n).fill(0);history=[];updStats();say("本关已重置")}
});
function renderLevels(){}
/* ---------- 启动 ---------- */
var running=true;
document.addEventListener("visibilitychange",function(){
  if(document.hidden)running=false;
  else if(!running){running=true;scheduleDraw()}
});
palLoad();loadLevel(save.lv);
scheduleDraw();
/* 初始注入：工具钮 / 覆盖层按钮图标（内联 SVG，零外链） */
setBtn("btnUndo","undo","撤销");
setBtn("btnHint","bulb","提示");
setBtn("btnReset","rotate","重开");
setBtn("btnLv","grid","选关");
setBtn("ovBtn","play","下一关");
verifyPending();syncLevelsFromServer();syncSaveFromServer();
window.addEventListener("resize",resize);

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
