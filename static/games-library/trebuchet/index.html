<script>
/*X3-ENGINE-BEGIN*/
var TB=(function(){
"use strict";
/* ===== 世界常量（逻辑坐标，确定性固定步长） ===== */
var W=480,H=320,G=420,GROUND=300,DT=1/120,SY=240,SLX=60,
    ANG_MIN=10,ANG_MAX=80,WT_MIN=20,WT_MAX=100,WT_STEP=2,FLY_GUARD=1500;
function v0(w){return 120+2.6*w;}
/* ===== 关卡（第 1 关手工锚点关；其余公式化生成 + 扫描收敛，坏关不进表） ===== */
var L1={name:"攻城·01",wx:300,wh:150,gh:50,wind:0,shields:[],ammo:3,difficulty:1};
function genLevel(i){
  var wx=250+((i*13)%170),wh=80+((i*17)%110),gh=40+(i%3)*10;
  var wind=(((i*7)%5)-2)*24;
  var shields=[];
  if(i>=10)shields.push([wx-96-((i*11)%70),150+((i*19)%70),18,18]);
  if(i>=24)shields.push([wx-170-((i*23)%50),190+((i*29)%50),18,18]);
  var lv={name:"攻城·"+(i<9?"0":"")+(i+1),wx:wx,wh:wh,gh:gh,wind:wind,shields:shields,ammo:3,difficulty:Math.min(6,1+Math.floor(i/7))};
  /* 收敛调整：扫描无解依次去盾→压低城墙→加大城门→落到保底参数（坏关不进表） */
  for(var tries=0;tries<10;tries++){
    if(sweep(lv).n>0)break;
    if(lv.shields.length)lv.shields.pop();
    else if(tries<4)lv.wh=Math.max(60,lv.wh-18);
    else if(tries<7)lv.gh+=10;
    else{lv.wx=280;lv.wh=80;lv.gh=70;lv.wind=0;lv.shields=[];}
  }
  return lv;
}
/* 抛体一步；命中判定顺序：城门(胜) → 城墙/盾(毁) → 落地/出界 */
function stepFlight(lv,b){
  b.vx+=lv.wind*DT;
  b.vy+=G*DT;
  b.x+=b.vx*DT;b.y+=b.vy*DT;b.ft+=DT;
  /* 先判城门（墙面 ±8 带内、城门高度区间）→ 再判墙体 */
  var inGateBand=b.y>GROUND-lv.gh&&b.y<GROUND;
  if(inGateBand&&b.x>lv.wx-8&&b.x<lv.wx+16){b.hit=true;return "win";}
  var wall=[lv.wx,GROUND-lv.wh,14,lv.wh];
  if(b.x>wall[0]-4&&b.x<wall[0]+wall[2]+4&&b.y>wall[1]&&b.y<GROUND)return "wall";
  for(var i=0;i<lv.shields.length;i++){
    var s=lv.shields[i];
    if(b.x>s[0]-4&&b.x<s[0]+s[2]+4&&b.y>s[1]-4&&b.y<s[1]+s[3]+4)return "wall";
  }
  if(b.y>GROUND)return "ground";
  if(b.x<-40||b.x>W+40)return "out";
  return "fly";
}
function launch(lv,ang,wt){
  var r=ang*Math.PI/180,v=v0(wt);
  return {x:SLX,y:SY,vx:v*Math.cos(r),vy:-v*Math.sin(r),ft:0,hit:false};
}
/* ===== 验证器：角度×配重双参数扫描 ===== */
function sweep(lv){
  var found=0,first=null;
  for(var a=ANG_MIN;a<=ANG_MAX;a++){
    for(var wt=WT_MIN;wt<=WT_MAX;wt+=WT_STEP){
      var b=launch(lv,a,wt);
      var r="fly",guard=FLY_GUARD;
      while(r==="fly"&&guard-->0)r=stepFlight(lv,b);
      if(r==="win"){found++;if(!first)first={ang:a,wt:wt};}
    }
  }
  return {n:found,first:first};
}
var LEVELS=[L1];
for(var gi=1;gi<40;gi++)LEVELS.push(genLevel(gi));
function verifyAll(){
  var res=[],i;
  for(i=0;i<LEVELS.length;i++)res.push({ok:sweep(LEVELS[i]).n>0});
  return res;
}
function selfTest(){
  var out=[];
  /* 锚点1：第 1 关 (45°, 配重66) → v0=291.6，下落段在 x=300 处 y≈284 ∈ 城门带 [250,300]（手工推演） */
  var b=launch(L1,45,66);
  var r="fly",guard=FLY_GUARD;
  while(r==="fly"&&guard-->0)r=stepFlight(L1,b);
  out.push({name:"锚点1·第1关45°/66砸开城门",pass:r==="win"});
  /* 锚点2：合成「城门藏墙后」关 → 扫描判定无解 */
  var hide={name:"hide",wx:300,wh:160,gh:0,wind:0,shields:[[300,250,120,50]],ammo:3};
  out.push({name:"锚点2·城门被封死扫描判无解",pass:sweep(hide).n===0});
  /* 锚点3：全部 40 关扫描有解 */
  var all=verifyAll(),bad=[];
  for(var i=0;i<all.length;i++)if(!all[i].ok)bad.push(i+1);
  out.push({name:"全关验证·40关参数扫描有解",pass:bad.length===0,bad:bad.join(",")});
  return out;
}
return {W:W,H:H,G:G,GROUND:GROUND,DT:DT,SY:SY,SLX:SLX,
  ANG_MIN:ANG_MIN,ANG_MAX:ANG_MAX,WT_MIN:WT_MIN,WT_MAX:WT_MAX,WT_STEP:WT_STEP,
  LEVELS:LEVELS,v0:v0,launch:launch,stepFlight:stepFlight,
  sweep:sweep,verifyAll:verifyAll,selfTest:selfTest};
})();
window.TB=TB;
/*X3-ENGINE-END*/
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（DB 下发优先：整表参数扫描通过才接受；本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="trebuchet",SAVE_KEY="sw.trebuchet.v1";
var DEFAULT_LEVELS=TB.LEVELS;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!(d.wx>=180&&d.wx<=460))return false;
  if(!(d.wh>=50&&d.wh<=240))return false;
  if(!(d.gh>=20&&d.gh<=120))return false;
  if(!(d.wind>=-60&&d.wind<=60))return false;
  if(!Array.isArray(d.shields))return false;
  if(!Number.isInteger(d.ammo)||d.ammo<1||d.ammo>6)return false;
  var probe=TB.sweep({wx:d.wx,wh:d.wh,gh:d.gh,wind:d.wind,shields:d.shields});
  return probe.n>0;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  for(var i=0;i<list.length;i++)if(!validLevelData(list[i]))return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){
      var ok=true;
      for(var i=0;i<list.length;i++)if(!validLevelData(list[i])){ok=false;break;}
      if(ok){LEVELS=list;return v;}
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    if(!res||!Array.isArray(res.levels)||!res.levels.length)return;

    for(var i=0;i<res.levels.length;i++){
      var row=res.levels[i];

      if(seen[d&&d.name])return;seen[d&&d.name]=1;

    if(list.length&&applyLevels(list,res.version||0)){

/* ---------- 存档（本地 + 账号双写） ---------- */

/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];

/* ---------- 状态（续玩：lv 起步即存档关） ---------- */
var lv=save.lv,L=null,ang=45,wt=66,ammo=3,mode="aim",ball=null,trail=[],shots=0,won=false;

    $("ovDesc").innerHTML="第 "+shots+" 发砸开城门，剩 "+ammo+" 发"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");

function nudge(angD,wtD){

/* ---------- 绘制 ---------- */

  var sc=w/W;

}
function rr(x,y,w2,h2,r){

  ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);

}
/* 弹丸：径向渐变 + 恒白高光 + 落地投影（立体质感） */
function drawBall(x,y,r){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.4)";ctx.shadowBlur=r*0.8;ctx.shadowOffsetY=r*0.4;
  var g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.12,x,y,r*1.05);
  g.addColorStop(0,colMix(PAL.rock,WHITE,0.75));
  g.addColorStop(0.45,PAL.rock);
  g.addColorStop(1,colShade(PAL.rock,-0.35));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.lineWidth=Math.max(1.2,r*0.16);ctx.strokeStyle=colShade(PAL.rock,-0.45);
  ctx.beginPath();ctx.arc(x,y,r-ctx.lineWidth*0.5,0,Math.PI*2);ctx.stroke();

  ctx.globalAlpha=1;
}
/* 木件：渐变杆（亮面 → 暗面） */
function woodLine(x1,y1,x2,y2,w){
  var lg=ctx.createLinearGradient(x1,y1,x2,y2);
  lg.addColorStop(0,PAL.wood1);lg.addColorStop(1,PAL.wood2);
  ctx.strokeStyle=lg;ctx.lineWidth=w;ctx.lineCap="round";

}
function draw(ts){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.sky1);g.addColorStop(1,PAL.sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!L)return;
  var wx=L.wx,wh=L.wh,gh=L.gh,i;
  /* 地面：竖向渐变「面」+ 顶缘亮线（边线） */
  var gg=ctx.createLinearGradient(0,TB.GROUND,0,H);
  gg.addColorStop(0,PAL.gnd);gg.addColorStop(1,colShade(PAL.gnd,-0.28));
  ctx.fillStyle=gg;ctx.fillRect(0,TB.GROUND,W,H-TB.GROUND);
  ctx.fillStyle=colMix(PAL.gnd,WHITE,0.22);ctx.fillRect(0,TB.GROUND,W,2);
  ctx.fillStyle=PAL.gnd2;ctx.globalAlpha=0.45;ctx.fillRect(0,TB.GROUND+2,W,1);ctx.globalAlpha=1;
  /* 城墙：渐变「面」+ 顶缘高光 + 落地投影 + 城砖缝 */
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=10;ctx.shadowOffsetY=4;
  var wg=ctx.createLinearGradient(wx,0,wx+14,0);
  wg.addColorStop(0,PAL.wall2);wg.addColorStop(0.5,colMix(PAL.wall,WHITE,0.10));wg.addColorStop(1,PAL.wall);
  ctx.fillStyle=wg;rr(wx,TB.GROUND-wh,14,wh,3);ctx.fill();
  ctx.restore();
  ctx.fillStyle=colMix(PAL.wall,WHITE,0.28);ctx.fillRect(wx,TB.GROUND-wh,14,2.5);
  ctx.strokeStyle=colMix(PAL.wall2,BLACK,0.18);ctx.lineWidth=1.5;
  for(var by=TB.GROUND-wh+10;by<TB.GROUND-6;by+=16){
    ctx.beginPath();ctx.moveTo(wx+2,by);ctx.lineTo(wx+12,by);ctx.stroke();
  }
  /* 城门（目标）：内凹暗面 + 顶缘亮线 + 呼吸目标环 */
  ctx.fillStyle=PAL.gate;ctx.fillRect(wx-1,TB.GROUND-gh,14,gh);
  var gi=ctx.createLinearGradient(0,TB.GROUND-gh,0,TB.GROUND);
  gi.addColorStop(0,colShade(PAL.gate,0.16));gi.addColorStop(1,colShade(PAL.gate,-0.28));
  ctx.fillStyle=gi;ctx.fillRect(wx-1,TB.GROUND-gh,14,gh);
  ctx.fillStyle=colMix(PAL.gate,WHITE,0.25);ctx.fillRect(wx-1,TB.GROUND-gh,14,2);
  ctx.strokeStyle=PAL.gnd2;ctx.lineWidth=1.5;ctx.strokeRect(wx-0.5,TB.GROUND-gh+0.5,13,gh-1);
  if(mode==="aim"){
    var pul=window.__gRM?0.45:0.45+0.25*Math.sin((ts||0)/280);
    ctx.globalAlpha=pul;ctx.strokeStyle=PAL.aim;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(wx+6,TB.GROUND-gh/2,Math.max(9,gh*0.4),0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* 障碍盾：渐变「面」+ 投影 + 交叉木筋 */
  for(i=0;i<L.shields.length;i++){
    var s=L.shields[i];
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.28)";ctx.shadowBlur=8;ctx.shadowOffsetY=3;
    var sg=ctx.createLinearGradient(s[0],s[1],s[0]+s[2],s[1]+s[3]);
    sg.addColorStop(0,PAL.wall);sg.addColorStop(1,PAL.wall2);
    ctx.fillStyle=sg;rr(s[0],s[1],s[2],s[3],4);ctx.fill();
    ctx.restore();
    ctx.strokeStyle=colMix(PAL.wall,WHITE,0.22);ctx.lineWidth=1.5;
    rr(s[0]+0.5,s[1]+0.5,s[2]-1,s[3]-1,4);ctx.stroke();
    ctx.strokeStyle=colMix(PAL.wall2,BLACK,0.22);ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(s[0]+3,s[1]+3);ctx.lineTo(s[0]+s[2]-3,s[1]+s[3]-3);
    ctx.moveTo(s[0]+s[2]-3,s[1]+3);ctx.lineTo(s[0]+3,s[1]+s[3]-3);
    ctx.stroke();
  }
  /* 投石机：投影 + 木轮 + 渐变木架 + 配重箱 + 抛杆 */
  var bx=TB.SLX,py2=TB.SY;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.30)";ctx.shadowBlur=10;ctx.shadowOffsetY=4;
  ctx.fillStyle=colShade(PAL.gnd,-0.22);
  ctx.beginPath();ctx.ellipse(bx,TB.GROUND+2,26,5,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  for(i=0;i<2;i++){
    var wxp=bx+(i?15:-15),wyp=TB.GROUND-4;
    var wg2=ctx.createRadialGradient(wxp-2,wyp-2,1,wxp,wyp,6);
    wg2.addColorStop(0,colMix(PAL.wood1,WHITE,0.3));wg2.addColorStop(1,PAL.wood2);
    ctx.fillStyle=wg2;ctx.beginPath();ctx.arc(wxp,wyp,5.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=colShade(PAL.wood2,-0.3);ctx.lineWidth=1.2;ctx.stroke();
  }
  woodLine(bx-20,TB.GROUND-8,bx+20,TB.GROUND-8,4);
  woodLine(bx-15,TB.GROUND-6,bx,py2,5);
  woodLine(bx+15,TB.GROUND-6,bx,py2,5);
  var ar=ang*Math.PI/180;
  var tipX=bx+Math.cos(ar)*46,tipY=py2-Math.sin(ar)*46;
  var tailX=bx-Math.cos(ar)*16,tailY=py2+Math.sin(ar)*16;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.3)";ctx.shadowBlur=6;ctx.shadowOffsetY=2;
  var cg=ctx.createLinearGradient(tailX,tailY-7,tailX,tailY+7);
  cg.addColorStop(0,colMix(PAL.rock,WHITE,0.25));cg.addColorStop(1,colShade(PAL.rock,-0.25));
  ctx.fillStyle=cg;rr(tailX-7,tailY-7,14,14,3);ctx.fill();
  ctx.restore();
  var ag=ctx.createLinearGradient(bx,py2,tipX,tipY);
  ag.addColorStop(0,PAL.arm);ag.addColorStop(1,colMix(PAL.arm,WHITE,0.2));
  ctx.strokeStyle=ag;ctx.lineWidth=5;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(tailX,tailY);ctx.lineTo(tipX,tipY);ctx.stroke();
  ctx.fillStyle=colMix(PAL.wood2,WHITE,0.2);
  ctx.beginPath();ctx.arc(bx,py2,4,0,Math.PI*2);ctx.fill();
  if(mode==="aim"){
    drawBall(tipX,tipY,7);
    /* 瞄准方向虚线（短，指示射出方向；可落点仍靠自己调） */
    ctx.save();

  }
}
/* ---------- 主循环（切后台停续，dt 钳制防穿透） ---------- */
var rafId=0,last=0,acc=0;
function frame(ts){
  rafId=requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.05,(ts-last)/1000||0);
  last=ts;
  if(mode==="fly"&&ball){
    acc+=dt;
    var n=0,r="fly";
    while(acc>=TB.DT&&n++<8){
      acc-=TB.DT;
      r=TB.stepFlight(L,ball);
      trail.push([ball.x,ball.y]);
      if(trail.length>120)trail.shift();
      if(r!=="fly")break;
    }
    if(r!=="fly")endFlight(r);
  }
  draw(ts);
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){if(rafId){cancelAnimationFrame(rafId);rafId=0;}}
  else if(!rafId){last=0;rafId=requestAnimationFrame(frame);}
});
/* ---------- 输入 ---------- */
$("btnAL").addEventListener("click",function(){nudge(-1,0)});
$("btnAR").addEventListener("click",function(){nudge(1,0)});
$("btnWL").addEventListener("click",function(){nudge(0,-1)});
$("btnWR").addEventListener("click",function(){nudge(0,1)});
$("btnFire").addEventListener("click",fire);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  if(mode==="done"&&won){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }else loadLevel(lv);
  $("panel").classList.remove("win");
  $("ovBtn").style.background="var(--g-surface2)";$("ovBtn").style.color="var(--g-text)";
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"){e.preventDefault();nudge(-1,0);}
  else if(k==="ArrowRight"){e.preventDefault();nudge(1,0);}
  else if(k==="ArrowUp"){e.preventDefault();nudge(0,1);}
  else if(k==="ArrowDown"){e.preventDefault();nudge(0,-1);}
  else if(k===" "||k==="Enter"){e.preventDefault();fire();}
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
window.addEventListener("resize",resize);
/* ---------- 启动（loadLevel 以存档关续玩） ---------- */
loadLevel(save.lv);resize();rafId=requestAnimationFrame(frame);
setOvBtn("下一关","play");
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});

  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  function $(id){return document.getElementById(id)}
  var tbIcons=[["btnAL","arrow-down"],["btnAR","arrow-up"],["btnWL","minus"],["btnWR","plus"],["btnFire","play"],["btnReset","rotate"],["btnLv","grid"]],ti;
  for(ti=0;ti<tbIcons.length;ti++)$(tbIcons[ti][0]).insertAdjacentHTML("afterbegin",window.SW_ICON(tbIcons[ti][1]));
})();
</script>
