  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-tb-sky1:#1C1B16;--g-st-tb-sky2:#141614;--g-st-tb-gnd:#5E5340;--g-st-tb-gnd2:#453D2E;--g-st-tb-wall:#6E7887;--g-st-tb-wall2:#4A515C;--g-st-tb-rock:#4E3B22;--g-st-tb-arm:#6E5330;color-scheme:dark }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;

    width: 100%; max-width: 340px; padding: 22px 18px;

  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }

    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（动效层指令，不受主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');

try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();

<script>
/*X3-ENGINE-BEGIN*/
var TB=(function(){
"use strict";
/* ===== 世界常量（逻辑坐标，确定性固定步长） ===== */
var W=480,H=320,G=420,GROUND=300,DT=1/120,SY=240,SLX=60,
    ANG_MIN=10,ANG_MAX=80,WT_MIN=20,WT_MAX=100,WT_STEP=2,FLY_GUARD=1500;
function v0(w){return 120+2.6*w;}
/* ===== 关卡（第 1 关手工锚点关；其余公式化生成 + 扫描收敛，坏关不进表） ===== */
var L1={name:"攻城·01",wx:300,wh:150,gh:50,wind:0,shields:[],ammo:3,difficulty:1};
function genLevel(i){
  var wx=250+((i*13)%170),wh=80+((i*17)%110),gh=40+(i%3)*10;
  var wind=(((i*7)%5)-2)*24;
  var shields=[];
  if(i>=10)shields.push([wx-96-((i*11)%70),150+((i*19)%70),18,18]);
  if(i>=24)shields.push([wx-170-((i*23)%50),190+((i*29)%50),18,18]);
  var lv={name:"攻城·"+(i<9?"0":"")+(i+1),wx:wx,wh:wh,gh:gh,wind:wind,shields:shields,ammo:3,difficulty:Math.min(6,1+Math.floor(i/7))};
  /* 收敛调整：扫描无解依次去盾→压低城墙→加大城门→落到保底参数（坏关不进表） */
  for(var tries=0;tries<10;tries++){
    if(sweep(lv).n>0)break;
    if(lv.shields.length)lv.shields.pop();
    else if(tries<4)lv.wh=Math.max(60,lv.wh-18);
    else if(tries<7)lv.gh+=10;
    else{lv.wx=280;lv.wh=80;lv.gh=70;lv.wind=0;lv.shields=[];}
  }
  return lv;
}
/* 抛体一步；命中判定顺序：城门(胜) → 城墙/盾(毁) → 落地/出界 */
function stepFlight(lv,b){
  b.vx+=lv.wind*DT;
  b.vy+=G*DT;
  b.x+=b.vx*DT;b.y+=b.vy*DT;b.ft+=DT;
  /* 先判城门（墙面 ±8 带内、城门高度区间）→ 再判墙体 */
  var inGateBand=b.y>GROUND-lv.gh&&b.y<GROUND;
  if(inGateBand&&b.x>lv.wx-8&&b.x<lv.wx+16){b.hit=true;return "win";}
  var wall=[lv.wx,GROUND-lv.wh,14,lv.wh];
  if(b.x>wall[0]-4&&b.x<wall[0]+wall[2]+4&&b.y>wall[1]&&b.y<GROUND)return "wall";
  for(var i=0;i<lv.shields.length;i++){
    var s=lv.shields[i];
    if(b.x>s[0]-4&&b.x<s[0]+s[2]+4&&b.y>s[1]-4&&b.y<s[1]+s[3]+4)return "wall";
  }
  if(b.y>GROUND)return "ground";
  if(b.x<-40||b.x>W+40)return "out";
  return "fly";
}
function launch(lv,ang,wt){
  var r=ang*Math.PI/180,v=v0(wt);
  return {x:SLX,y:SY,vx:v*Math.cos(r),vy:-v*Math.sin(r),ft:0,hit:false};
}
/* ===== 验证器：角度×配重双参数扫描 ===== */
function sweep(lv){
  var found=0,first=null;
  for(var a=ANG_MIN;a<=ANG_MAX;a++){
    for(var wt=WT_MIN;wt<=WT_MAX;wt+=WT_STEP){
      var b=launch(lv,a,wt);
      var r="fly",guard=FLY_GUARD;
      while(r==="fly"&&guard-->0)r=stepFlight(lv,b);
      if(r==="win"){found++;if(!first)first={ang:a,wt:wt};}
    }
  }
  return {n:found,first:first};
}
var LEVELS=[L1];
for(var gi=1;gi<40;gi++)LEVELS.push(genLevel(gi));
function verifyAll(){
  var res=[],i;
  for(i=0;i<LEVELS.length;i++)res.push({ok:sweep(LEVELS[i]).n>0});
  return res;
}
function selfTest(){
  var out=[];
  /* 锚点1：第 1 关 (45°, 配重66) → v0=291.6，下落段在 x=300 处 y≈284 ∈ 城门带 [250,300]（手工推演） */
  var b=launch(L1,45,66);
  var r="fly",guard=FLY_GUARD;
  while(r==="fly"&&guard-->0)r=stepFlight(L1,b);
  out.push({name:"锚点1·第1关45°/66砸开城门",pass:r==="win"});
  /* 锚点2：合成「城门藏墙后」关 → 扫描判定无解 */
  var hide={name:"hide",wx:300,wh:160,gh:0,wind:0,shields:[[300,250,120,50]],ammo:3};
  out.push({name:"锚点2·城门被封死扫描判无解",pass:sweep(hide).n===0});
  /* 锚点3：全部 40 关扫描有解 */
  var all=verifyAll(),bad=[];
  for(var i=0;i<all.length;i++)if(!all[i].ok)bad.push(i+1);
  out.push({name:"全关验证·40关参数扫描有解",pass:bad.length===0,bad:bad.join(",")});
  return out;
}
return {W:W,H:H,G:G,GROUND:GROUND,DT:DT,SY:SY,SLX:SLX,
  ANG_MIN:ANG_MIN,ANG_MAX:ANG_MAX,WT_MIN:WT_MIN,WT_MAX:WT_MAX,WT_STEP:WT_STEP,
  LEVELS:LEVELS,v0:v0,launch:launch,stepFlight:stepFlight,
  sweep:sweep,verifyAll:verifyAll,selfTest:selfTest};
})();
window.TB=TB;
/*X3-ENGINE-END*/
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 关卡数据（DB 下发优先：整表参数扫描通过才接受；本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="trebuchet",SAVE_KEY="sw.trebuchet.v1";
var DEFAULT_LEVELS=TB.LEVELS;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!(d.wx>=180&&d.wx<=460))return false;
  if(!(d.wh>=50&&d.wh<=240))return false;
  if(!(d.gh>=20&&d.gh<=120))return false;
  if(!(d.wind>=-60&&d.wind<=60))return false;
  if(!Array.isArray(d.shields))return false;
  if(!Number.isInteger(d.ammo)||d.ammo<1||d.ammo>6)return false;
  var probe=TB.sweep({wx:d.wx,wh:d.wh,gh:d.gh,wind:d.wind,shields:d.shields});
  return probe.n>0;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  for(var i=0;i<list.length;i++)if(!validLevelData(list[i]))return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){
      var ok=true;
      for(var i=0;i<list.length;i++)if(!validLevelData(list[i])){ok=false;break;}
      if(ok){LEVELS=list;return v;}
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    if(!res||!Array.isArray(res.levels)||!res.levels.length)return;
    var list=[],seen={};
    for(var i=0;i<res.levels.length;i++){
      var row=res.levels[i];
      if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return;
      var d;try{d=JSON.parse(row.dataJson);}catch(e){return;}
      if(seen[d&&d.name])return;seen[d&&d.name]=1;
      list.push(d);
    }
    if(list.length&&applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);resize();
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 选关浮层 ---------- */
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";$("ovBtn").style.background="var(--g-surface2)";$("ovBtn").style.color="var(--g-text)";
  $("overlay").classList.add("show");
}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),water:v("--g-water"),
    sky1:v("--g-st-tb-sky1"),sky2:v("--g-st-tb-sky2"),
    gnd:v("--g-st-tb-gnd"),gnd2:v("--g-st-tb-gnd2"),
    wall:v("--g-st-tb-wall"),wall2:v("--g-st-tb-wall2"),
    rock:v("--g-st-tb-rock"),arm:v("--g-st-tb-arm")};
}
window.__gOnTheme=function(){palLoad()};
palLoad();
/* ---------- 状态（续玩：lv 起步即存档关） ---------- */
var lv=save.lv,L=null,ang=45,wt=66,ammo=3,mode="aim",ball=null,trail=[],shots=0,won=false;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=TB.W,H=TB.H;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  ang=45;wt=66;ammo=L.ammo;mode="aim";ball=null;trail=[];shots=0;won=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=(L.wind?"风 "+(L.wind>0?"+":"")+L.wind:"无风")+" · 城墙高 "+L.wh;
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  updHud();updBtns();
  hideOverlay();
  say("调角度与配重，砸开城墙底部的城门");
}
function updHud(){
  $("stAng").textContent=ang+"°";
  $("stWt").textContent=wt;
  $("stAmmo").textContent=ammo;
  $("stAmmo").classList.toggle("low",ammo<=1);
}
function updBtns(){$("btnFire").disabled=mode!=="aim"||ammo<=0;}
function fire(){
  if(mode!=="aim"||ammo<=0)return;
  ball=TB.launch(L,ang,wt);
  trail=[];mode="fly";shots++;ammo--;
  updHud();updBtns();
}
function endFlight(res){
  if(res==="win"){
    won=true;
    if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
    if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:ammo}).catch(function(){});
    $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"破门！";
    $("ovDesc").innerHTML="第 "+shots+" 发砸开城门，剩 "+ammo+" 发"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
    $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
    $("ovBtn").style.background="var(--g-btn-primary)";$("ovBtn").style.color="#fff";
    $("overlay").classList.add("show");
    mode="done";updBtns();
  }else{
    won=false;
    say(res==="wall"?"砸在城墙/盾上了":res==="ground"?"落在地上了":"飞出边界了");
    if(ammo<=0){
      $("ovTitle").textContent="炮弹用完";
      $("ovDesc").textContent="城门还没破。调整角度与配重再来。";
      $("ovBtn").textContent="重试本关";
      $("ovBtn").style.background="var(--g-btn-primary)";$("ovBtn").style.color="#fff";
      $("overlay").classList.add("show");
      mode="done";
    }else{mode="aim";ball=null;}
    updBtns();
  }
}
function nudge(angD,wtD){
  if(mode!=="aim")return;
  ang=Math.min(TB.ANG_MAX,Math.max(TB.ANG_MIN,ang+angD));
  wt=Math.min(TB.WT_MAX,Math.max(TB.WT_MIN,wt+wtD*TB.WT_STEP));
  updHud();
}
/* ---------- 绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.height=Math.round(w*H/W)+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*H/W*dpr);
  var sc=w/W;
  ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
}
function rr(x,y,w2,h2,r){
  r=Math.min(r,w2/2,h2/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);
  ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();
}
function draw(ts){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.sky1);g.addColorStop(1,PAL.sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!L)return;
  /* 地面 */
  ctx.fillStyle=PAL.gnd;ctx.fillRect(0,TB.GROUND,W,H-TB.GROUND);
  ctx.fillStyle=PAL.gnd2;ctx.fillRect(0,TB.GROUND,W,4);
  /* 城墙 + 城门 */
  ctx.fillStyle=PAL.wall;
  rr(L.wx,TB.GROUND-L.wh,14,L.wh,3);ctx.fill();
  ctx.strokeStyle=PAL.wall2;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=PAL.wall2;
  for(var by=TB.GROUND-L.wh+10;by<TB.GROUND-6;by+=16)ctx.fillRect(L.wx+3,by,8,2);
  ctx.fillStyle=PAL.rock;
  ctx.fillRect(L.wx-1,TB.GROUND-L.gh,14,L.gh);
  ctx.strokeStyle=PAL.gnd2;ctx.lineWidth=1.5;
  ctx.strokeRect(L.wx-1,TB.GROUND-L.gh,14,L.gh);
  ctx.fillStyle=PAL.gnd2;
  ctx.beginPath();ctx.arc(L.wx+6,TB.GROUND-L.gh/2,2,0,7);ctx.fill();
  /* 盾 */
  for(var i=0;i<L.shields.length;i++){
    var s=L.shields[i];
    ctx.fillStyle=PAL.wall;
    rr(s[0],s[1],s[2],s[3],4);ctx.fill();
    ctx.strokeStyle=PAL.wall2;ctx.lineWidth=2;ctx.stroke();
  }
  /* 投石机（框架 + 配重臂示意） */
  ctx.strokeStyle=PAL.arm;ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(TB.SLX-16,TB.GROUND);ctx.lineTo(TB.SLX,TB.SY);
  ctx.moveTo(TB.SLX+16,TB.GROUND);ctx.lineTo(TB.SLX,TB.SY);
  ctx.stroke();
  var ar=ang*Math.PI/180;
  ctx.strokeStyle=PAL.rock;ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(TB.SLX,TB.SY);
  ctx.lineTo(TB.SLX+Math.cos(ar)*46,TB.SY-Math.sin(ar)*46);
  ctx.stroke();
  ctx.fillStyle=PAL.rock;
  ctx.beginPath();ctx.arc(TB.SLX-20,TB.SY+6,10,0,7);ctx.fill();
  /* 弹道拖尾与飞石 */
  if(ball){
    ctx.fillStyle=PAL.rock;
    for(var ti=0;ti<trail.length;ti+=2){
      ctx.globalAlpha=0.3*(ti/trail.length);
      ctx.beginPath();ctx.arc(trail[ti][0],trail[ti][1],3,0,7);ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle=PAL.rock;
    ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,7);ctx.fill();
    ctx.strokeStyle=PAL.gnd2;ctx.lineWidth=2;ctx.stroke();
  }
  /* 风向标 */
  if(L.wind){
    ctx.fillStyle=PAL.muted;
    ctx.font="600 12px sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
    ctx.fillText("风 "+(L.wind>0?"→":"←")+" "+Math.abs(L.wind),12,20);
  }
}
/* ---------- 主循环（切后台停续，dt 钳制防穿透） ---------- */
var rafId=0,last=0,acc=0;
function frame(ts){
  rafId=requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.05,(ts-last)/1000||0);
  last=ts;
  if(mode==="fly"&&ball){
    acc+=dt;
    var n=0,r="fly";
    while(acc>=TB.DT&&n++<8){
      acc-=TB.DT;
      r=TB.stepFlight(L,ball);
      trail.push([ball.x,ball.y]);
      if(trail.length>120)trail.shift();
      if(r!=="fly")break;
    }
    if(r!=="fly")endFlight(r);
  }
  draw(ts);
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){if(rafId){cancelAnimationFrame(rafId);rafId=0;}}
  else if(!rafId){last=0;rafId=requestAnimationFrame(frame);}
});
/* ---------- 输入 ---------- */
$("btnAL").addEventListener("click",function(){nudge(-1,0)});
$("btnAR").addEventListener("click",function(){nudge(1,0)});
$("btnWL").addEventListener("click",function(){nudge(0,-1)});
$("btnWR").addEventListener("click",function(){nudge(0,1)});
$("btnFire").addEventListener("click",fire);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  if(mode==="done"&&won){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }else loadLevel(lv);
  $("ovBtn").style.background="var(--g-surface2)";$("ovBtn").style.color="var(--g-text)";
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"){e.preventDefault();nudge(-1,0);}
  else if(k==="ArrowRight"){e.preventDefault();nudge(1,0);}
  else if(k==="ArrowUp"){e.preventDefault();nudge(0,1);}
  else if(k==="ArrowDown"){e.preventDefault();nudge(0,-1);}
  else if(k===" "||k==="Enter"){e.preventDefault();fire();}
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
});
window.addEventListener("resize",resize);
/* ---------- 启动（loadLevel 以存档关续玩） ---------- */
loadLevel(save.lv);resize();rafId=requestAnimationFrame(frame);
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
