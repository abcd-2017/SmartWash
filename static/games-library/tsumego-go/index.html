<script>
/* ========== 独立验证器（纯逻辑，与对弈判定互不引用）：栈式泛洪 + 全点枚举 ========== */
(function(){
"use strict";
var DIRS=[[0,1],[0,-1],[1,0],[-1,0]];
function tParse(rows){
  var n=rows.length,g=[];
  for(var y=0;y<n;y++){
    var row=[];
    for(var x=0;x<n;x++){var ch=rows[y].charAt(x);row.push(ch==="b"?1:ch==="w"?2:0);}
    g.push(row);
  }
  return g;
}
function tChain(g,n,x,y){
  var color=g[y][x],seen={},libs={},stack=[y*n+x];
  seen[y*n+x]=1;
  while(stack.length){
    var p=stack.pop(),px=p%n,py=(p/n)|0,d;
    for(d=0;d<4;d++){
      var nx=px+DIRS[d][0],ny=py+DIRS[d][1];
      if(nx<0||nx>=n||ny<0||ny>=n)continue;
      var v=g[ny][nx],k=ny*n+nx;
      if(v===0)libs[k]=1;
      else if(v===color&&!seen[k]){seen[k]=1;stack.push(k);}
    }
  }
  var ss=[],ll=[],k2;
  for(k2 in seen)ss.push(+k2);
  for(k2 in libs)ll.push(+k2);
  return {stones:ss,libs:ll};
}
function tApply(g,n,x,y){   // 黑落子：提气尽白链；返回 null=占位/自杀
  if(g[y][x]!==0)return null;
  var g2=g.map(function(r){return r.slice()});
  g2[y][x]=1;
  var captured=0,d;
  for(d=0;d<4;d++){
    var nx=x+DIRS[d][0],ny=y+DIRS[d][1];
    if(nx<0||nx>=n||ny<0||ny>=n)continue;
    if(g2[ny][nx]===2){
      var c=tChain(g2,n,nx,ny);
      if(!c.libs.length){c.stones.forEach(function(s){g2[(s/n)|0][s%n]=0});captured+=c.stones.length;}
    }
  }
  if(captured===0&&tChain(g2,n,x,y).libs.length===0)return null;
  var adjAtari=0,seen={};   // 双叫口径：与新落子相邻、落子后恰 1 气的白链数
  for(d=0;d<4;d++){
    var nx2=x+DIRS[d][0],ny2=y+DIRS[d][1];
    if(nx2<0||nx2>=n||ny2<0||ny2>=n)continue;
    if(g2[ny2][nx2]!==2||seen[ny2*n+nx2])continue;
    var c2=tChain(g2,n,nx2,ny2);
    c2.stones.forEach(function(s){seen[s]=1});
    if(c2.libs.length===1)adjAtari++;
  }
  return {g2:g2,captured:captured,adjAtari:adjAtari};
}
function tSolutions(g,n,goal){
  var out=[];
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    if(g[y][x]!==0)continue;
    var r=tApply(g,n,x,y);
    if(!r)continue;
    if(goal==="cap"?r.captured>=1:r.adjAtari>=2)out.push({x:x,y:y});
  }
  return out;
}
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(!Number.isInteger(d.size)||d.size<5||d.size>9)return false;
  if(!Array.isArray(d.rows)||d.rows.length!==d.size)return false;
  for(var i=0;i<d.rows.length;i++){
    if(typeof d.rows[i]!=="string"||d.rows[i].length!==d.size)return false;
    for(var j=0;j<d.size;j++){
      var ch=d.rows[i].charAt(j);
      if(ch!=="."&&ch!=="b"&&ch!=="w")return false;
    }
  }
  if(d.goal!=="cap"&&d.goal!=="dbl")return false;
  return true;
}
function normalizeLevel(d,idx){
  var g=tParse(d.rows);
  var sols=tSolutions(g,d.size,d.goal);
  var name=(d&&typeof d.name==="string"&&d.name.trim())?d.name:(d.goal==="cap"?"吃子·":"双叫·")+String(idx+1).padStart(2,"0");
  return {name:name,size:d.size,rows:d.rows,goal:d.goal,par:sols.length,sol:sols,difficulty:Number.isInteger(d.difficulty)?Math.min(9,Math.max(1,d.difficulty)):3};
}
window.__TG={tParse:tParse,tChain:tChain,tApply:tApply,tSolutions:tSolutions,validLevelData:validLevelData,normalizeLevel:normalizeLevel};
})();
</script>
<script>
(function(){

/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},

})();

var RAW_LEVELS=[

];
var LEVELS=RAW_LEVELS.map(function(d,i){return TG.normalizeLevel(d,i)}).filter(function(x){return x.par>0});
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i],d;
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!TG.validLevelData(d))return null;
    var name=(typeof d.name==="string"&&d.name.trim())?d.name:null;
    if(name&&seenName[name])return null;
    if(name)seenName[name]=1;
    var n=TG.normalizeLevel(d,i);
    if(!(n.par>0))continue;   // 验证器判无正解：该关不进关卡表
    list.push(n);
  }
  return list.length?list:null;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(TG.validLevelData)){
      LEVELS=list.map(function(d,i){return TG.normalizeLevel(d,i)}).filter(function(x){return x.par>0});
      if(LEVELS.length)return v;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();
      loadLevel(lv);resize();
    }
  }).catch(function(){});
}

function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rs=parseInt(remote.solved,10)||0;
      if(rs>save.solved){save.solved=rs;persist();}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 对弈判定（与验证器独立实现）：递归泛洪 ---------- */
var PB=1,PW=2;
function pParse(rows){
  return rows.map(function(r){return r.split("").map(function(c){return c==="b"?PB:c==="w"?PW:0})});
}
function pChain(g,n,x,y){
  var color=g[y][x],stones=[],libs=[],vis={};
  function dfs(px,py){
    var k=py*n+px;
    if(vis[k])return;
    vis[k]=1;stones.push(k);
    var D=[[0,1],[0,-1],[1,0],[-1,0]];
    for(var d=0;d<4;d++){
      var nx=px+D[d][0],ny=py+D[d][1];
      if(nx<0||nx>=n||ny<0||ny>=n)continue;
      var v=g[ny][nx];
      if(v===0){if(libs.indexOf(ny*n+nx)<0)libs.push(ny*n+nx);}
      else if(v===color)dfs(nx,ny);
    }
  }
  dfs(x,y);
  return {stones:stones,libs:libs};
}
function pEffect(g,n,x,y){   // 黑落子效果；null=非法
  if(g[y][x]!==0)return null;
  var g2=g.map(function(r){return r.slice()});
  g2[y][x]=PB;
  var captured=0,D=[[0,1],[0,-1],[1,0],[-1,0]],d;
  for(d=0;d<4;d++){
    var nx=x+D[d][0],ny=y+D[d][1];
    if(nx<0||nx>=n||ny<0||ny>=n)continue;
    if(g2[ny][nx]===PW){
      var c=pChain(g2,n,nx,ny);
      if(!c.libs.length){c.stones.forEach(function(s){g2[(s/n)|0][s%n]=0});captured+=c.stones.length;}
    }
  }
  if(captured===0&&pChain(g2,n,x,y).libs.length===0)return null;
  var adjAtari=0,done=[];
  for(d=0;d<4;d++){
    var nx2=x+D[d][0],ny2=y+D[d][1];
    if(nx2<0||nx2>=n||ny2<0||ny2>=n)continue;
    if(g2[ny2][nx2]!==PW)continue;
    var k2=ny2*n+nx2,sk=null;
    for(var q=0;q<done.length;q++)if(done[q].indexOf(k2)>=0){sk=1;break;}
    if(sk)continue;
    var c2=pChain(g2,n,nx2,ny2);
    done.push(c2.stones);
    if(c2.libs.length===1)adjAtari++;
  }
  return {g2:g2,captured:captured,adjAtari:adjAtari};
}
/* ---------- 状态 ---------- */
var lv=save.lv,g=null,L=null,n=0,over=false,mistakes=0,cursor=-1,hintPt=null,errFlash=null;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,cell=0,margin=0;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(idx){
  lv=Math.max(0,Math.min(idx,LEVELS.length-1));
  L=LEVELS[lv];
  var sols=TG.tSolutions(TG.tParse(L.rows),L.size,L.goal);   // 加载复核
  g=pParse(L.rows);n=L.size;
  over=false;cursor=-1;hintPt=null;errFlash=null;
  $("lvTag").textContent="第 "+(lv+1)+" 关";
  $("lvRule").textContent=L.name+" · 黑先一手"+(L.goal==="cap"?" · 提子":" · 双叫");
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  $("stPar").textContent=sols.length>0?sols.length+" 处":"-";
  if(!(sols.length>0))say("警告：验证器判定本题无正解（数据异常）");
  else say(L.goal==="cap"?"黑先：找一手提掉白棋（共 "+sols.length+" 处正解）":"黑先：找一手同时叫吃两块白棋（共 "+sols.length+" 处正解）");
  updStats();resize();
}
function updStats(){$("stMiss").textContent=mistakes}
function place(x,y){
  if(over)return;
  if(g[y][x]!==0){say("这里已有棋子");return;}
  var r=pEffect(g,n,x,y);
  if(!r){say("自杀手不合法（落子后自己的棋没气）");return;}
  var good=L.goal==="cap"?r.captured>=1:r.adjAtari>=2;
  if(!good){
    mistakes++;updStats();
    errFlash={x:x,y:y,t0:Date.now()};
    say(L.goal==="cap"?"没提到子——不是正解，已收回":"只叫吃 "+r.adjAtari+" 块白棋——不是双叫，已收回");
    return;
  }
  g=r.g2;over=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  save.solved++;persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:mistakes}).catch(function(){});
  $("ovTitle").textContent="正解！";
  $("ovDesc").innerHTML=(L.goal==="cap"?"一手提掉 "+r.captured+" 枚白棋":"双叫成立")+"，失误 "+mistakes+" 次"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 题全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
  say(L.goal==="cap"?"提子成功！":"双叫成立！");
  render();
}
function hint(){
  if(over)return;
  hintPt=(L.sol&&L.sol[0])||null;
  say("正解点已高亮");
}
/* ---------- 调色板 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(nn){return s.getPropertyValue(nn).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),deep:v("--g-primary-deep"),
    danger:v("--g-danger"),warning:v("--g-warning"),
    bd:v("--g-st-bd"),ln:v("--g-st-ln"),bk:v("--g-st-bk"),wt:v("--g-st-wt")};
}
window.__gOnTheme=function(){palLoad();render()};//App 推送主题时刷新调色板并重绘
/* ---------- 绘制 ---------- */
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);H=W;
  margin=Math.max(14,W*0.05);cell=(W-margin*2)/(n-1||1);
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  render();
}
function px(x){return margin+x*cell}
function render(){
  if(!g)return;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=PAL.bd;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=PAL.ln;ctx.lineWidth=1;
  for(var i=0;i<n;i++){
    ctx.beginPath();ctx.moveTo(px(0),px(i));ctx.lineTo(px(n-1),px(i));ctx.stroke();
    ctx.beginPath();ctx.moveTo(px(i),px(0));ctx.lineTo(px(i),px(n-1));ctx.stroke();
  }
  ctx.lineWidth=2;
  ctx.strokeRect(px(0),px(0),cell*(n-1),cell*(n-1));
  if(n%2===1){   // 中心星位（奇数路盘）
    var mc=(n-1)/2;
    ctx.fillStyle=PAL.ln;
    ctx.beginPath();ctx.arc(px(mc),px(mc),3,0,7);ctx.fill();
  }
  if(errFlash&&Date.now()-errFlash.t0<500){
    ctx.fillStyle=PAL.danger;ctx.globalAlpha=0.55;
    ctx.beginPath();ctx.arc(px(errFlash.x),px(errFlash.y),cell*0.45,0,7);ctx.fill();
    ctx.globalAlpha=1;
  }
  if(hintPt){
    var pulse=0.5+0.5*Math.sin(Date.now()/170);
    ctx.strokeStyle=PAL.warning;ctx.lineWidth=3;ctx.globalAlpha=0.45+pulse*0.55;
    ctx.beginPath();ctx.arc(px(hintPt.x),px(hintPt.y),cell*0.46,0,7);ctx.stroke();
    ctx.globalAlpha=1;
  }
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    var v=g[y][x];
    if(!v)continue;
    var cx2=px(x),cy2=px(y),rad=cell*0.44;
    ctx.fillStyle=v===PB?PAL.bk:PAL.wt;
    ctx.beginPath();ctx.arc(cx2,cy2,rad,0,7);ctx.fill();
    if(v===PB){
      ctx.strokeStyle="rgba(255,255,255,.4)";ctx.lineWidth=1;   // 黑子恒亮描边（深色木底可辨）
      ctx.beginPath();ctx.arc(cx2,cy2,rad,0,7);ctx.stroke();
    }else{
      ctx.strokeStyle=PAL.ln;ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(cx2,cy2,rad,0,7);ctx.stroke();
    }
  }
  if(!over&&cursor>=0){
    var crx=cursor%n,cry=(cursor/n)|0;
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(px(crx),px(cry),cell*0.5,0,7);ctx.stroke();
  }
}
function loop(){render();requestAnimationFrame(loop)}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  var cx3=Math.round((x-margin)/cell),cy3=Math.round((y-margin)/cell);
  if(cx3<0||cx3>=n||cy3<0||cy3>=n)return;
  cursor=cy3*n+cx3;
  place(cx3,cy3);
  render();
});
cv.addEventListener("pointercancel",function(){});
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
  else{lv++;loadLevel(lv)}
});
function hideOverlay(){$("overlay").classList.remove("show")}
function openLevelSelect(){
  var ggrid=$("lvgrid");ggrid.hidden=false;
  ggrid.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);hideOverlay();say("第 "+(lv+1)+" 关");
      });
      ggrid.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(!over&&n){
    if(cursor<0)cursor=(n/2|0)*n+(n/2|0);
    if(k==="ArrowLeft"){cursor=cursor%n>0?cursor-1:cursor;e.preventDefault();}
    else if(k==="ArrowRight"){cursor=cursor%n<n-1?cursor+1:cursor;e.preventDefault();}
    else if(k==="ArrowUp"){cursor=cursor-n>=0?cursor-n:cursor;e.preventDefault();}
    else if(k==="ArrowDown"){cursor=Math.floor(cursor/n)<n-1?cursor+n:cursor;e.preventDefault();}
    else if(k==="Enter"||k===" "){place(cursor%n,(cursor/n)|0);e.preventDefault();}
  }
  if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){loadLevel(lv);say("本关已重置")}
  else if(k===" "&&$("overlay").classList.contains("show"))$("ovBtn").click();
  render();
});
window.addEventListener("resize",resize);
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);resize();loop();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
