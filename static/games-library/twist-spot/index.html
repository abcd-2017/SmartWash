/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},

var DEFAULT_LEVELS=[
{name:"绕口·01",text:"四是四，十是十，十四是十四，四十是四十。",wrong:[{a:"时",b:"十",n:2},{a:"似",b:"四",n:5}],difficulty:1},

{name:"绕口·14",text:"一平盆面，烙一平盆饼。",wrong:[{a:"路",b:"烙",n:1},{a:"喷",b:"盆",n:2}],difficulty:2},
{name:"绕口·15",text:"高高山上一条藤，藤条头上挂铜铃。",wrong:[{a:"调",b:"条",n:2},{a:"乖",b:"挂",n:1}],difficulty:2},

{name:"绕口·17",text:"出前门，往正南，有个面铺面冲南。",wrong:[{a:"普",b:"铺",n:1},{a:"蓝",b:"南",n:2}],difficulty:2},

{name:"绕口·26",text:"门口四辆车，车里四个人。",wrong:[{a:"量",b:"辆",n:1},{a:"撤",b:"车",n:2}],difficulty:3},
{name:"绕口·27",text:"墙头一颗葱，风吹葱不动。",wrong:[{a:"棵",b:"颗",n:1},{a:"冲",b:"葱",n:2}],difficulty:3},

{name:"绕口·40",text:"东村烧笋西村晒，笋香飘过晒谷台。",wrong:[{a:"捎",b:"烧",n:1},{a:"洒",b:"晒",n:1}],difficulty:5}

var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";

/* ---------- 独立验证器：替换对解析 + 结构完整性 ---------- */
function findNth(text,ch,n){
  var cnt=0;
  for(var i=0;i<text.length;i++){
    if(text[i]===ch){cnt++;if(cnt===n)return i;}
  }
  return -1;
}
/* 解析替换对为位置；返回 null 表示数据非法 */
function resolveWrong(text,w){
  if(!w||typeof w!=="object")return null;
  if(typeof w.a!=="string"||w.a.length!==1)return null;
  if(typeof w.b!=="string"||w.b.length!==1)return null;
  if(w.a===w.b)return null;
  var n=Number.isInteger(w.n)?w.n:1;
  if(n<1)return null;
  var idx=findNth(text,w.b,n);
  if(idx<0||text[idx]!==w.b)return null;    // 正字必须真实出现在指定次序
  return {idx:idx,a:w.a,b:w.b};
}
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(typeof d.text!=="string"||d.text.length<6||d.text.length>44)return false;
  if(!Array.isArray(d.wrong)||d.wrong.length<1||d.wrong.length>4)return false;
  var seenIdx={},seenA={};
  for(var i=0;i<d.wrong.length;i++){
    var r=resolveWrong(d.text,d.wrong[i]);
    if(!r)return null;
    if(seenIdx[r.idx])return null;          // 同一字不可同时被两处替换
    if(seenA[r.a])return null;
    seenIdx[r.idx]=1;seenA[r.a]=1;
  }
  return d.wrong.map(function(w){return resolveWrong(d.text,w)});
}
function auditAll(){
  var bad=[];
  for(var i=0;i<LEVELS.length;i++)if(!validLevelData(LEVELS[i]))bad.push(i+1);
  return bad;
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    var r=validLevelData(d);
    if(!r||seen[d.name])return null;
    seen[d.name]=1;
    list.push({name:d.name,text:d.text,wrong:r,difficulty:Number.isInteger(d.difficulty)?d.difficulty:5});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();loadLevel(lv);
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,wr=[],found=[],cur=0,errors=0,hints=2,done=false;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function isPunc(ch){return /，。！？、；：/.test(ch)}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  var r=validLevelData(L);
  if(!r){say("关卡数据异常");return;}
  wr=r;found=[];cur=firstCharPos();errors=0;hints=2;done=false;
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent="混入 "+wr.length+" 个错字";
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  render();updStats();
  say("句子里混进了近音近形的错字，把它们全点出来");
}
function firstCharPos(){
  for(var i=0;i<L.text.length;i++)if(!isPunc(L.text[i]))return i;
  return 0;
}
function render(){
  var b=$("board");b.innerHTML="";
  for(var i=0;i<L.text.length;i++){
    (function(i){
      var ch=L.text[i];
      var isW=wr.some(function(w){return w.idx===i});
      var isF=found.indexOf(i)>=0;
      var el;
      if(isPunc(ch)){
        el=document.createElement("span");
        el.className="tchar punc";
        el.textContent=ch;
      }else{
        el=document.createElement("button");
        el.className="tchar"+(isF?" found":(cur===i?" cur":""));
        el.textContent=displayAt(i);
        el.setAttribute("aria-label","第"+(i+1)+"字 "+displayAt(i));
        el.addEventListener("click",function(){tryPos(i)});
      }
      b.appendChild(el);
    })(i);
  }
}
/* 错位处显示错字；已纠错显示正字；其余位置显示原字 */
function displayAt(i){
  for(var k=0;k<wr.length;k++){
    if(wr[k].idx===i)return found.indexOf(i)>=0?wr[k].b:wr[k].a;
  }
  return L.text[i];
}
function updStats(){
  $("stFound").textContent=found.length+"/"+wr.length;
  var e=$("stErr");e.textContent=errors;
  e.className="val"+(errors>0?" bad":"");
  $("btnHint").disabled=done||hints<=0;
}
function tryPos(i){
  if(done||found.indexOf(i)>=0)return;
  var isW=wr.some(function(w){return w.idx===i});
  if(isW){
    found.push(i);found.sort(function(a,b){return a-b});
    updStats();render();
    say("纠出一个！还有 "+(wr.length-found.length)+" 个");
    if(found.length===wr.length)winLevel();
  }else{
    errors++;updStats();
    var el=$("board").children[i];
    el.classList.add("shake","wrongtry");
    setTimeout(function(){el.classList.remove("shake","wrongtry")},500);
    say("这个字没错，读一读上下文再找");
  }
}
function hint(){
  if(done||hints<=0)return;
  var target=null;
  for(var k=0;k<wr.length;k++)if(found.indexOf(wr[k].idx)<0){target=wr[k];break;}
  if(!target)return;
  hints--;updStats();
  var el=$("board").children[target.idx];
  el.classList.add("shake");
  setTimeout(function(){el.classList.remove("shake")},600);
  say("留意「"+target.a+"」——正确应写作「"+target.b+"」");
}
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:errors}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"全找出来了！";
  $("ovDesc").innerHTML="失误 "+errors+" 次、用提示 "+(2-hints)+" 次"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);$("overlay").classList.remove("show");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
function moveCur(d){
  var i=cur;
  do{i+=d;}while(i>=0&&i<L.text.length&&isPunc(L.text[i]));
  if(i>=0&&i<L.text.length){cur=i;render();}
}
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重开")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
  else{lv++;loadLevel(lv)}
});
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft"){moveCur(-1);e.preventDefault();}
  else if(e.key==="ArrowRight"){moveCur(1);e.preventDefault();}
  else if(e.key==="Enter"||e.key===" "){
    if($("overlay").classList.contains("show")){$("ovBtn").click();}
    else tryPos(cur);
    e.preventDefault();
  }
  else if(e.key==="h"||e.key==="H")hint();
  else if(e.key==="r"||e.key==="R"){loadLevel(lv);say("本关已重开")}
});
/* ---------- 启动 ---------- */
loadLevel(save.lv);
var badLv=auditAll();
if(badLv.length)say("警告：内嵌验证器发现异常关卡 "+badLv.join(","));
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
