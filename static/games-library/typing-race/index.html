<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F3">
<title>打字竞速</title>
<style>
  /*token:GAME-THEME.md §2 基线（值与基线一致）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 8px; text-align: center; line-height: 1.3; min-width: 0; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .target {
    background: var(--g-surface); border-radius: var(--g-radius-inner);
    padding: 16px 14px; margin-bottom: 10px; box-shadow: var(--g-shadow);
    font-size: 22px; font-weight: 700; line-height: 1.8; letter-spacing: 1px;
    word-break: break-all; min-height: 90px;
  }
  .target .ok { color: var(--g-success); }
  .target .no { color: var(--g-danger); text-decoration: underline; }
  .target .cur { background: var(--g-primary-soft); color: var(--g-on-soft); border-radius: 4px; }
  .inputbox {
    width: 100%; min-height: 48px; padding: 10px 12px; margin-bottom: 10px;
    border: 1px solid var(--g-border); border-radius: var(--g-radius-btn);
    background: var(--g-surface); color: var(--g-text);
    font-family: inherit; font-size: 16px;
    -webkit-user-select: text; user-select: text;
  }
  .inputbox:focus { outline: 2px solid var(--g-primary-deep); outline-offset: 1px; }
  .bar { height: 8px; border-radius: 999px; background: var(--g-surface2); margin-bottom: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; border-radius: 999px; background: var(--g-water); }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--g-btn-primary); color: #fff; }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .35; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .bigscore { font-size: 36px; font-weight: 700; color: var(--g-primary-deep); margin: 0 0 4px; font-variant-numeric: tabular-nums; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

</head>
<body>
<div class="wrap">
  <header><span class="sub">60 秒 · 中英混打速度赛</span><span class="sub" id="bestTag">最高分 0</span></header>
  <div class="stats">
    <div class="stat"><span class="label">分数</span><span class="val" id="stScore">0</span></div>
    <div class="stat"><span class="label">句数</span><span class="val" id="stSent">0</span></div>
    <div class="stat"><span class="label">速度</span><span class="val" id="stSpeed">0</span></div>
  </div>
  <div class="target" id="target" aria-label="目标句，按顺序输入"></div>
  <input class="inputbox" id="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="点这里或直接开打，输入对齐的字符" aria-label="输入框">
  <div class="bar" id="barWrap" hidden><i id="barFill"></i></div>
  <p class="msg" id="msg" role="status" aria-live="polite">点「开始挑战」进入 60 秒限时赛</p>
  <div class="tools">
    <button class="btn primary" id="btnStart">开始挑战</button>
  </div>
  <p class="foot">触屏点输入框唤起键盘，或直接用物理键盘 · 英文不区分大小写 · 打完整句自动换句 · 切后台自动暂停 · 成绩自动保存</p>
</div>
<div class="overlay" role="dialog" aria-modal="true" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">时间到！</h2>
    <p class="bigscore" id="ovScore">0</p>
    <p class="desc" id="ovDesc"></p>
    <button class="btn primary" id="ovBtn">再来一局</button>
  </div>
</div>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 句库：30 条自撰中英混合短句（英文为常用词） ---------- */
var GAME_KEY="typing-race",SAVE_KEY="sw.typingrace.v1";
var SENTENCES=[
"今天天气很好 today 我去公园散步",
"我喜欢读书 reading 让我快乐",
"早上好 good morning 新的一天",
"我们一起努力 study hard 每天进步",
"春天来了 spring 花开得很美",
"我的手机 phone 没电了",
"妈妈做的饭很好吃 yummy",
"朋友送我一本书 book 作为礼物",
"晚上早点睡觉 sleep 对身体好",
"我爱我的家人 family 永远的爱",
"这个问题很简单 easy 别担心",
"明天见 see you soon 朋友",
"感谢你的帮助 thank you",
"水果很新鲜 fresh 又甜又脆",
"他跑得很快 fast 像风一样",
"音乐真好听 music 让我放松",
"旅行真有趣 travel 让人开心",
"请再说一遍 again 我没听清",
"小猫很可爱 cat 我喜欢它",
"冬天的雪 snow 白茫茫一片",
"我的学习计划 plan 每天背十个单词",
"咖啡有点苦 coffee 但是提神",
"网络信号很好 wifi 视频流畅",
"运动让我健康 sport 每天半小时",
"太阳升起 sunrise 新的开始",
"这部电影很棒 movie 值得再看",
"你的笑容很美 smile 感染了我",
"时间过得真快 time 珍惜当下",
"梦想需要坚持 dream 一步一步来",
"生日快乐 happy birthday 朋友"
];

/* ---------- 状态 ---------- */
var ROUND_MS=60000;
var state="idle";
var target="",progress=0,lastProgress=0;
var score=0,sentDone=0,recent=[];
var deadline=0,pausedLeft=0;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{best:parseInt(s.best,10)||0}}catch(e){return{best:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rb=parseInt(remote.best,10)||0;
      if(rb>save.best){save.best=rb;persist();paintBest();}
    }catch(e){}
  }).catch(function(){});
}
function paintBest(){$("bestTag").textContent="最高分 "+save.best}
function pickSentence(){
  var i,n=SENTENCES.length,guard=0;
  do{i=Math.floor(Math.random()*n);guard++;}while(recent.indexOf(i)>=0&&guard<50);
  recent.push(i);if(recent.length>8)recent.shift();
  return SENTENCES[i];
}
function nextSentence(){
  target=pickSentence();
  progress=0;lastProgress=0;
  $("inp").value="";
  paintTarget();
}
function paintTarget(){
  var html="";
  var i;
  for(i=0;i<target.length;i++){
    var ch=target[i];
    var esc=ch==="<"?"&lt;":ch===">"?"&gt;":ch==="&"?"&amp;":ch;
    if(i<progress)html+='<span class="ok">'+esc+"</span>";
    else if(i<progress+8)html+=i===progress?'<span class="cur">'+esc+"</span>":'<span>'+esc+"</span>";
    else html+="<span>"+esc+"</span>";
  }
  /* 已输入但错位的字符标红缀在后面 */
  var typed=$("inp").value||"";
  if(typed.length>progress){
    var extra=typed.slice(progress);
    var esc2=extra.replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/&/g,"&amp;");
    html+='<span class="no">'+esc2+"</span>";
  }
  $("target").innerHTML=html;
}
function onInput(){
  if(state!=="playing")return;
  var typed=$("inp").value||"";
  /* 计算连续匹配前缀（英文不区分大小写） */
  var p=0;
  while(p<typed.length&&p<target.length&&typed[p].toLowerCase()===target[p].toLowerCase())p++;
  if(p>lastProgress){score+=p-lastProgress;}
  progress=p;
  paintTarget();paintStats();
  if(progress>=target.length){
    sentDone++;
    score+=10;   /* 整句奖励 */
    say("整句完成 +10！");
    paintStats();
    setTimeout(function(){if(state==="playing")nextSentence()},250);
  }else if(typed.length>progress){
    say("从第 "+(progress+1)+" 个字符开始不对，退格修正");
  }
}
function paintStats(){
  $("stScore").textContent=score;
  $("stSent").textContent=sentDone;
  var elapsed=Math.max(1,ROUND_MS-Math.max(0,deadline-Date.now()));
  $("stSpeed").textContent=Math.round(score*60000/elapsed/100)/10;
}
/* ---------- 流程 ---------- */
function startRound(){
  score=0;sentDone=0;recent=[];
  deadline=Date.now()+ROUND_MS;
  state="playing";
  $("btnStart").disabled=true;
  $("btnStart").textContent="挑战中…";
  $("barWrap").hidden=false;
  $("overlay").classList.remove("show");
  nextSentence();paintStats();
  say("照着上面的句子打，打对越多分越高！");
  $("inp").focus();
}
function pauseRound(){
  if(state!=="playing")return;
  pausedLeft=deadline-Date.now();
  state="paused";
  $("btnStart").textContent="继续";
  say("已暂停，点「继续」接着打");
}
function resumeRound(){
  if(state!=="paused")return;
  deadline=Date.now()+Math.max(0,pausedLeft);
  state="playing";
  $("btnStart").textContent="挑战中…";
  $("inp").focus();
  say("继续！");
  /* 暂停发生在整句完成的换句延迟窗口内时，恢复后补换句，避免旧句反复计分 */
  if(progress>=target.length){nextSentence();}
}
function endRound(){
  state="over";
  var isNew=score>save.best;
  if(isNew){save.best=score;persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:score,metricExtra:sentDone}).catch(function(){});
  $("ovTitle").textContent=isNew?"新纪录！":"时间到！";
  $("ovScore").textContent=score;
  $("ovDesc").innerHTML="完成 "+sentDone+" 句 · 平均速度 "+$("stSpeed").textContent+" 字/分<br>最高分 "+save.best;
  $("btnStart").disabled=false;
  $("btnStart").textContent="开始挑战";
  $("barWrap").hidden=true;
  $("overlay").classList.add("show");
}
$("inp").addEventListener("input",onInput);
$("inp").addEventListener("keydown",function(e){
  if(e.key===" "&&state==="paused"){e.preventDefault();resumeRound();}
});
$("btnStart").addEventListener("click",function(){
  if(state==="playing")return;
  if(state==="paused")resumeRound();
  else startRound();
});
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  startRound();
});
/* 计时 + 切后台暂停 */
function loop(){
  requestAnimationFrame(loop);
  if(state==="playing"){
    var left=deadline-Date.now();
    if(left<=0){endRound();return;}
    $("barFill").style.width=Math.max(0,left/ROUND_MS*100)+"%";
    paintStats();
  }
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="playing")pauseRound();
});
/* ---------- 启动 ---------- */
paintBest();paintStats();
requestAnimationFrame(loop);
syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

</body>
</html>
