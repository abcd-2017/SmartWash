  .ov-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--g-primary-deep); max-width: 100%; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */

window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var VD={NW:390,NH:520,BASE_Y:486,TURRET_X:195,BULLET_V:430,
  MAXRATE:8,MAXSPREAD:4,KIND:{r:[14,10,20,30],hp:[1,0.55,2.4,9],spd:[1,1.7,0.55,0.45],coin:[14,16,34,100]}};
VD.costRate=function(lv){return 30+lv*20};
VD.costSpread=function(lv){return 50+lv*50};
VD.interval=function(lv){return 0.6*Math.pow(0.84,lv)};
VD.dmg=function(lv){return 14+lv*7};
VD.streams=function(lv){return 1+lv};
/* 关卡生成：波数 3→8、每波 5→18 只、血量 / 速度随关卡递增，每 10 关终波 Boss */
VD.LEVEL_COUNT=40;
VD.genLevel=function(no){
  var rng=mulberry32(63000+no*1013);
  var wc=3+Math.floor((no-1)/7);
  var hpBase=13+no*3.1,spdBase=17+no*0.5;
  var waves=[];
  for(var w=0;w<wc;w++){
    var boss=(no%10===0&&w===wc-1);
    var kind=boss?3:(w===0?0:(rng()<0.4?1:(rng()<0.72?2:0)));
    var n=boss?1:5+Math.floor(no/3);
    var hpMul=(w===0?0.55:1);   // 首波为热身波（血量近似减半）
    waves.push({n:n,kind:kind,
      hp:Math.round(hpBase*hpMul*VD.KIND.hp[kind]),
      spd:Math.round(spdBase*VD.KIND.spd[kind]*10)/10});
  }
  return {name:"第"+no+"关 · 消灭病毒",waves:waves,gold0:60+no*2};
};
VD.validate=function(level){
  if(!level||typeof level!=="object")return{ok:false,why:"bad"};
  if(!Array.isArray(level.waves)||level.waves.length<2||level.waves.length>12)return{ok:false,why:"waves"};
  for(var i=0;i<level.waves.length;i++){
    var w=level.waves[i];
    if(!w||typeof w!=="object")return{ok:false,why:"wave"+i};
    if(!isFinite(w.n)||w.n<1||w.n>40||w.n!==(w.n|0))return{ok:false,why:"n"+i};
    if(!isFinite(w.hp)||w.hp<1||w.hp>100000)return{ok:false,why:"hp"+i};
    if(!isFinite(w.spd)||w.spd<5||w.spd>200)return{ok:false,why:"spd"+i};
    if(!isFinite(w.kind)||w.kind<0||w.kind>3||w.kind!==(w.kind|0))return{ok:false,why:"kind"+i};
  }
  if(level.gold0!=null&&(!isFinite(level.gold0)||level.gold0<0||level.gold0>500))return{ok:false,why:"gold"};
  return{ok:true,why:""};
};
VD.createRun=function(level){
  return {level:level,rng:mulberry32(88000+(level.no||1)*7919),
    waveIdx:0,spawnLeft:level.waves[0].n,spawnT:0.6,
    viruses:[],bullets:[],coins:level.gold0==null?60:level.gold0,lives:4,
    rateLv:0,spreadLv:0,fireT:0.3,clock:0,buy:null,status:"run",spawned:0};
};
VD.buy=function(run,what){
  if(run.status!=="run")return false;
  if(what==="rate"&&run.rateLv<VD.MAXRATE){
    var c=VD.costRate(run.rateLv);
    if(run.coins>=c){run.coins-=c;run.rateLv++;return true;}
  }else if(what==="spread"&&run.spreadLv<VD.MAXSPREAD){
    var c2=VD.costSpread(run.spreadLv);
    if(run.coins>=c2){run.coins-=c2;run.spreadLv++;return true;}
  }
  return false;
};
/* 单步：波次推进 + 病毒下压 + 自动索敌开火 + 命中结算（gameplay 与验证共用） */
VD.step=function(run,dt){
  if(run.status!=="run")return run.status;
  run.clock+=dt;
  if(run.buy){VD.buy(run,run.buy);run.buy=null;}
  var L=run.level;
  // 出怪
  if(run.spawnLeft>0){
    run.spawnT-=dt;
    if(run.spawnT<=0){
      run.spawnT=0.85;
      run.spawnLeft--;
      run.spawned++;
      var w=L.waves[run.waveIdx];
      var ph=run.rng()*6.28;
      run.viruses.push({x:30+run.rng()*(VD.NW-60),y:-24,vy:w.spd,ph:ph,
        hp:w.hp,maxhp:w.hp,kind:w.kind,r:VD.KIND.r[w.kind]});
    }
  }else if(run.viruses.length===0){
    if(run.waveIdx<L.waves.length-1){
      run.waveIdx++;
      run.spawnLeft=L.waves[run.waveIdx].n;
      run.spawnT=1.4;
      run.coins+=40;   // 波次奖励
    }else{
      run.status="win";
      return "win";
    }
  }
  // 病毒移动
  for(var i=run.viruses.length-1;i>=0;i--){
    var v=run.viruses[i];
    v.y+=v.vy*dt;
    v.x+=Math.sin(run.clock*2+v.ph)*14*dt;
    if(v.x<16)v.x=16;
    if(v.x>VD.NW-16)v.x=VD.NW-16;
    if(v.y>=VD.BASE_Y){
      run.viruses.splice(i,1);
      run.lives--;
      if(run.lives<=0){run.status="fail";return "fail";}
    }
  }
  // 自动索敌（最接近基地者）开火
  var target=null,ty=-1;
  for(var k=0;k<run.viruses.length;k++){
    if(run.viruses[k].y>ty){ty=run.viruses[k].y;target=run.viruses[k];}
  }
  run.fireT-=dt;
  if(target&&run.fireT<=0){
    run.fireT=VD.interval(run.rateLv);
    var ang=Math.atan2(target.y-(VD.BASE_Y-16),target.x-VD.TURRET_X);
    var ns=VD.streams(run.spreadLv);
    for(var s=0;s<ns;s++){
      var off=(s-(ns-1)/2)*0.16;
      run.bullets.push({x:VD.TURRET_X,y:VD.BASE_Y-16,
        vx:Math.cos(ang+off)*VD.BULLET_V,vy:Math.sin(ang+off)*VD.BULLET_V,
        dmg:VD.dmg(run.rateLv)});
    }
  }
  // 子弹运动与命中
  for(var b=run.bullets.length-1;b>=0;b--){
    var bl=run.bullets[b];
    bl.x+=bl.vx*dt;bl.y+=bl.vy*dt;
    if(bl.y<-20||bl.x<-20||bl.x>VD.NW+20){run.bullets.splice(b,1);continue;}
    for(var m=run.viruses.length-1;m>=0;m--){
      var tv=run.viruses[m];
      var dx=bl.x-tv.x,dy=bl.y-tv.y;
      var rr2=(tv.r+4)*(tv.r+4);
      if(dx*dx+dy*dy<rr2){
        tv.hp-=bl.dmg;
        run.bullets.splice(b,1);
        if(tv.hp<=0){
          run.coins+=VD.KIND.coin[tv.kind];
          run.viruses.splice(m,1);
        }
        break;
      }
    }
  }
  return "run";
};
/* 验证：贪心升级策略（攻速优先 → 双弹道 → 攻速 → 弹道）确定性模拟 */
VD.policySim=function(level){
  var run=VD.createRun(level);
  var guard=7200;   // 360s@0.05 上限
  while(guard-->0&&run.status==="run"){
    if(run.rateLv<5)run.buy="rate";
    else if(run.spreadLv<2)run.buy="spread";
    else if(run.rateLv<VD.MAXRATE)run.buy="rate";
    else if(run.spreadLv<VD.MAXSPREAD)run.buy="spread";
    VD.step(run,0.05);
  }
  return {status:run.status,lives:run.lives,rate:run.rateLv,spread:run.spreadLv,
    t:run.clock,spawned:run.spawned,waves:L0(level)};
  function L0(l){return l.waves.length}
};
VD.validateAll=function(){
  var fails=[],lifeSum=0,i;
  for(i=1;i<=VD.LEVEL_COUNT;i++){
    var L=VD.genLevel(i);
    var chk=VD.validate(L);
    if(!chk.ok){fails.push(i+"("+chk.why+")");continue;}
    var r=VD.policySim(L);
    lifeSum+=r.lives;
    if(r.status!=="win"||r.lives<1)fails.push(i+"("+r.status+",lives"+r.lives+")");
  }
  return {total:VD.LEVEL_COUNT,solvable:VD.LEVEL_COUNT-fails.length,fail:fails,
    avgLives:Math.round(lifeSum/VD.LEVEL_COUNT*100)/100};
};

/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}

var AC=null;
function beep(f,d,type,vol){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=f;g.gain.value=vol||0.05;
    o.connect(g);g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(d||0.1));
    o.start();o.stop(AC.currentTime+(d||0.1)+0.02);
  }catch(e){}
}

/* ========== 关卡数据：包内生成 + DB 下发（整批替换，任一条非法整批放弃） ========== */
var LEVELS=[],cur=0;

function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=VD.LEVEL_COUNT;i++)list.push(VD.genLevel(i));
  return list;
}
function parseVirusLevels(res){
  if(!res||typeof res!=="object"||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={},i;
  for(i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item!=="object")return null;
    var d;
    try{d=JSON.parse(item.dataJson)}catch(e){return null}
    if(!VD.validate(d).ok)return null;
    if(VD.policySim(d).status!=="win")return null;   // 下发关卡必须可通关
    var no=parseInt(item.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=true;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;}
  }catch(e){}
  return 0;
}

/* ========== 绘制 ========== */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function kindColor(k){return k===0?PAL.water:(k===1?PAL.warning:(k===2?PAL.danger:PAL.danger))}
function drawVirus(v){
  var c=kindColor(v.kind),i,an;
  // 尖刺（渐变描边 + 投影）
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.25)";ctx.shadowBlur=4;ctx.shadowOffsetY=2;   // 恒黑投影
  ctx.strokeStyle=c;ctx.lineWidth=2.4;ctx.lineCap="round";
  for(i=0;i<8;i++){
    an=i*Math.PI/4+v.ph+G.clock*0.8;
    ctx.beginPath();
    ctx.moveTo(v.x+Math.cos(an)*v.r*0.7,v.y+Math.sin(an)*v.r*0.7);
    ctx.lineTo(v.x+Math.cos(an)*(v.r+5),v.y+Math.sin(an)*(v.r+5));
    ctx.stroke();
  }
  ctx.restore();
  // 体身：径向渐变 + 落地投影
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.35)";ctx.shadowBlur=v.r*0.7;ctx.shadowOffsetY=v.r*0.35;   // 恒黑投影
  var g=ctx.createRadialGradient(v.x-v.r*0.35,v.y-v.r*0.4,v.r*0.12,v.x,v.y,v.r*1.05);
  g.addColorStop(0,colMix(c,WHITE,0.65));g.addColorStop(0.45,c);g.addColorStop(1,colShade(c,-0.35));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(v.x,v.y,v.r,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.lineWidth=1.6;ctx.strokeStyle=colShade(c,-0.45);
  ctx.beginPath();ctx.arc(v.x,v.y,v.r-0.8,0,Math.PI*2);ctx.stroke();
  // 细胞核（恒白高光）
  ctx.fillStyle="rgba(255,255,255,.5)";   // 恒白
  ctx.beginPath();ctx.arc(v.x-v.r*0.3,v.y-v.r*0.3,v.r*0.22,0,Math.PI*2);ctx.fill();
  // 血条：恒黑轨道 + danger 余量
  if(v.hp<v.maxhp){
    ctx.fillStyle="rgba(0,0,0,0.28)";   // 恒黑轨道
    ctx.fillRect(v.x-v.r,v.y-v.r-8,v.r*2,4);
    ctx.fillStyle=PAL.danger;
    ctx.fillRect(v.x-v.r,v.y-v.r-8,v.r*2*Math.max(0,v.hp/v.maxhp),4);
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(offX,offY);ctx.scale(S,S);
  if(!grads)buildGrads();
  ctx.fillStyle=grads;ctx.fillRect(0,0,NW,NH);
  // 培养皿底：渐变「面」+ 顶缘亮线
  var bgr=ctx.createLinearGradient(0,VD.BASE_Y,0,NH);
  bgr.addColorStop(0,PAL.cell);bgr.addColorStop(1,colShade(PAL.cell,-0.25));
  ctx.fillStyle=bgr;ctx.fillRect(0,VD.BASE_Y,NW,NH-VD.BASE_Y);
  ctx.fillStyle=PAL.cellHi;ctx.globalAlpha=0.5;ctx.fillRect(0,VD.BASE_Y,NW,2);ctx.globalAlpha=1;
  // 底线（目标：守住）+ 危险区带
  ctx.fillStyle=colMix(PAL.danger,PAL.cell,0.82);ctx.fillRect(0,VD.BASE_Y,NW,9);
  ctx.fillStyle=PAL.base;ctx.fillRect(0,VD.BASE_Y,NW,3);
  ctx.fillStyle=colMix(PAL.base,WHITE,0.4);ctx.fillRect(0,VD.BASE_Y,NW,1);
  if(G){
    var target=null,ty=-1,k;
    for(k=0;k<G.viruses.length;k++)if(G.viruses[k].y>ty){ty=G.viruses[k].y;target=G.viruses[k];}
    for(var i=0;i<G.viruses.length;i++)drawVirus(G.viruses[i]);
    // 目标标记：炮台正在索敌的最前病毒
    if(target){
      ctx.save();ctx.strokeStyle=PAL.warning;ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.arc(target.x,target.y,target.r+7,0,Math.PI*2);ctx.stroke();ctx.restore();
    }
    // 子弹：渐变弹体 + 发光
    for(var b=0;b<G.bullets.length;b++){
      var bl=G.bullets[b];
      ctx.save();
      ctx.strokeStyle=PAL.deep;ctx.lineWidth=3.5;ctx.lineCap="round";
      ctx.shadowColor=PAL.deep;ctx.shadowBlur=6;
      ctx.beginPath();
      ctx.moveTo(bl.x,bl.y);
      ctx.lineTo(bl.x-bl.vx*0.02,bl.y-bl.vy*0.02);
      ctx.stroke();
      ctx.restore();
    }
    // 炮台：底座「面」+ 旋转炮管 + 炮口球
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.3)";ctx.shadowBlur=8;ctx.shadowOffsetY=3;   // 恒黑投影
    var tg=ctx.createLinearGradient(0,VD.BASE_Y-10,0,VD.BASE_Y+10);
    tg.addColorStop(0,PAL.turret2);tg.addColorStop(1,PAL.turret1);
    ctx.fillStyle=tg;rr(VD.TURRET_X-22,VD.BASE_Y-10,44,20,8);ctx.fill();
    ctx.restore();
    ctx.strokeStyle=colMix(PAL.turret1,WHITE,0.25);ctx.lineWidth=1.5;
    rr(VD.TURRET_X-22,VD.BASE_Y-10,44,20,8);ctx.stroke();
    var ang=target?Math.atan2(target.y-(VD.BASE_Y-16),target.x-VD.TURRET_X):-Math.PI/2;
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.25)";ctx.shadowBlur=5;ctx.shadowOffsetY=2;   // 恒黑投影
    var bg2=ctx.createLinearGradient(VD.TURRET_X,VD.BASE_Y-14,VD.TURRET_X+Math.cos(ang)*22,VD.BASE_Y-14+Math.sin(ang)*22);
    bg2.addColorStop(0,PAL.turret2);bg2.addColorStop(1,PAL.turret1);
    ctx.strokeStyle=bg2;ctx.lineWidth=7;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(VD.TURRET_X,VD.BASE_Y-14);
    ctx.lineTo(VD.TURRET_X+Math.cos(ang)*22,VD.BASE_Y-14+Math.sin(ang)*22);ctx.stroke();
    ctx.restore();
    var hg=ctx.createRadialGradient(VD.TURRET_X-3,VD.BASE_Y-17,1,VD.TURRET_X,VD.BASE_Y-14,10);
    hg.addColorStop(0,colMix(PAL.primary,WHITE,0.6));hg.addColorStop(1,PAL.deep);
    ctx.fillStyle=hg;ctx.beginPath();ctx.arc(VD.TURRET_X,VD.BASE_Y-14,10,0,Math.PI*2);ctx.fill();
    syncHud();
  }
  ctx.restore();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  rr(offX+0.5,offY+0.5,NW*S-1,NH*S-1,10);ctx.stroke();
}

/* ========== 主循环与启动 ========== */
function resize(){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,Math.floor(r.width));
  H=Math.max(320,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/NW,H/NH);
  offX=(W-NW*S)/2;offY=(H-NH*S)/2;
}
window.addEventListener("resize",resize);
var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(0.033,(ts-last)/1000||0);
  last=ts;
  if(state==="running"&&G)step(dt);
  draw();
}

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
  function $(id){return document.getElementById(id)}
  var vdIcons=[["btnRate","bolt"],["btnSpread","split"],["btnRetryBottom","rotate"],["btnNext","play"],["btnReplayWin","rotate"],["btnSelectWin","grid"],["btnRetry","rotate"],["btnSelectFail","grid"],["btnCloseSelect","x"]],vi;
  for(vi=0;vi<vdIcons.length;vi++)$(vdIcons[vi][0]).insertAdjacentHTML("afterbegin",window.SW_ICON(vdIcons[vi][1]));
})();
</script>
