<html lang="zh-CN">
<head>

<style>
  /*token:GAME-THEME.md §2 基线 + §3 素材 token（--g-wr-* 为本作素材色，深色为同色相压暗变体）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-on-primary:#FFFFFF;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-hairline:#EFF1EE;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-st-belt:#8E968C;--g-wr-floor1:#E9EDE6;--g-wr-floor2:#DCE3D8;--g-wr-rack1:#C9A468;--g-wr-rack2:#A87F3F;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-st-belt:#4A5248;--g-wr-floor1:#1B1F1C;--g-wr-floor2:#121512;--g-wr-rack1:#4E4636;--g-wr-rack2:#2C2517;color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 5px 8px; text-align: center; line-height: 1.3; min-width: 0; animation: rise .38s ease-out both; }
  .stat:nth-child(2) { animation-delay: 40ms; }
  .stat:nth-child(3) { animation-delay: 80ms; }
  .stat:nth-child(4) { animation-delay: 120ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); white-space: nowrap; }
  .stat .val { display: inline-block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.low { color: var(--g-danger); }
  .stage { position: relative; animation: fadein .3s ease-out both; }
  canvas { display: block; width: 100%; touch-action: none; border-radius: var(--g-radius-inner); box-shadow: var(--g-shadow); }
  .legend { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 2px 8px; animation: rise .38s ease-out both; animation-delay: 160ms; }
  .lg-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--g-surface2); border-radius: 10px; padding: 3px 9px; font-size: 12px; color: var(--g-muted); line-height: 1.3; }
  .lg-chip b { color: var(--g-text); font-weight: 600; }
  .lg-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .btn { min-height: 44px; padding: 0 10px; flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out;
  }
  .btn.primary { background: var(--g-btn-primary); color: var(--g-on-primary); }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .35; }
  .swi { display: inline-block; vertical-align: -0.14em; flex: none; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .3s ease-out;
  }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .desc b { color: var(--g-primary-deep); }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn { min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
    transition: transform .14s ease-out, background .16s ease-out;
  }
  .lvbtn:active { transform: scale(.96); }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（同时压 animation-duration 与 animation-delay） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>

<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var WR={W:7,H:5,PICK:[0,0],START:[2,2],STEP:0.45,HAND:0.8,CAT:3,LEVEL_COUNT:40};
WR.dist=function(a,b){return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);};
WR.slotCat=function(lv,x,y){
  if(x<4||y>3)return -1;
  return lv.shelves[y*(lv.W-4)+(x-4)];
};
/* 贪婪基准：到货即排队，先到先取；取货→最近匹配空位放货，超时记错漏 */
WR.sim=function(lv){
  var t=0,fork=WR.START.slice(),queue=[],ai=0,stored=0,comp=0,slots=[];
  for(var i=0;i<(lv.W-4)*4;i++)slots.push(false);
  while(ai<lv.arrivals.length||queue.length){
    while(ai<lv.arrivals.length&&lv.arrivals[ai][0]<=t){
      queue.push({cat:lv.arrivals[ai][1],arr:t,dl:t+lv.patience});
      ai++;
    }
    if(!queue.length){t+=0.25;continue;}
    var b=queue.shift();
    var tp=t+WR.dist(fork,WR.PICK)*WR.STEP;
    var best=-1,bd=1e9;
    for(var s=0;s<slots.length;s++){
      if(slots[s])continue;
      var sx=4+s%(lv.W-4),sy=Math.floor(s/(lv.W-4));
      if(lv.shelves[s]!==b.cat)continue;
      var d=WR.dist(WR.PICK,[sx,sy]);
      if(d<bd){bd=d;best=s;}
    }
    if(best<0){comp++;t=tp+1;}
    else{
      var bx=4+best%(lv.W-4),by=Math.floor(best/(lv.W-4));
      var te=tp+WR.HAND+bd*WR.STEP;
      slots[best]=true;
      fork=[bx,by];
      if(te>b.dl)comp++;else stored++;
      t=te;
    }
    //队列中其他件随时间流逝判超时
    for(var q2=queue.length-1;q2>=0;q2--)if(queue[q2].dl<=t){queue.splice(q2,1);comp++;}
  }
  return {stored:stored,comp:comp};
};
/* 生成：到货间隔 9-13s → 5.5-8s；基准定 K/L */
WR.genLevel=function(no){
  for(var attempt=0;attempt<20;attempt++){
    var p=(no-1)/(WR.LEVEL_COUNT-1);
    var rng=mulberry32(59700+no*487+attempt*41);
    var shelves=[];
    for(var s=0;s<(WR.W-4)*4;s++)shelves.push(Math.floor(rng()*3));
    var arrivals=[],t=5;
    var nBox=Math.min(14,8+Math.floor(p*6));
    for(var i=0;i<nBox;i++){
      var type=Math.floor(rng()*3);
      arrivals.push([Math.round(t*4)/4,type]);
      t+=(9-p*3.5)+rng()*(4-p*1.5);
    }
    var lv={name:"仓库·"+(no<10?"0":"")+no,W:WR.W,H:WR.H,w:WR.W,h:WR.H,shelves:shelves,
      arrivals:arrivals,patience:Math.round(20-p*7),
      targetK:0,maxL:1,difficulty:Math.min(9,1+Math.floor(no/5))};
    var g=WR.sim(lv);
    if(g.stored<4)continue;
    lv.targetK=Math.max(4,g.stored-(p>0.5?1:0));
    lv.maxL=Math.max(1,g.comp);
    if(lv.targetK>g.stored)continue;
    return lv;
  }
  return {name:"仓库·"+(no<10?"0":"")+no,W:WR.W,H:WR.H,w:WR.W,h:WR.H,
    shelves:[0,1,2,0,1,2,0,1,2,0,1,2],arrivals:[[5,0],[12,1],[19,2]],
    patience:18,targetK:3,maxL:1,difficulty:Math.min(9,1+Math.floor(no/5))};
};
/* 结构校验 */
WR.validate=function(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return{ok:false,why:"bad"};
  if(!Number.isInteger(d.W)||d.W<6||d.W>8)return{ok:false,why:"W"};
  if(!Number.isInteger(d.H)||d.H<4||d.H>6)return{ok:false,why:"H"};
  if(!Array.isArray(d.shelves)||d.shelves.length!==(d.W-4)*4)return{ok:false,why:"shelves"};
  for(var i=0;i<d.shelves.length;i++)if(!Number.isInteger(d.shelves[i])||d.shelves[i]<0||d.shelves[i]>2)return{ok:false,why:"s"+i};
  if(!Array.isArray(d.arrivals)||d.arrivals.length<4||d.arrivals.length>20)return{ok:false,why:"arrivals"};
  var last=-1;
  for(var j=0;j<d.arrivals.length;j++){
    var a=d.arrivals[j];
    if(!Array.isArray(a)||a.length!==2)return{ok:false,why:"a"+j};
    if(!isFinite(a[0])||a[0]<0)return{ok:false,why:"at"+j};
    if(a[0]<last)return{ok:false,why:"order"+j};
    last=a[0];
    if(!Number.isInteger(a[1])||a[1]<0||a[1]>2)return{ok:false,why:"type"+j};
  }
  if(!isFinite(d.patience)||d.patience<8||d.patience>40)return{ok:false,why:"patience"};
  if(!Number.isInteger(d.targetK)||d.targetK<3)return{ok:false,why:"K"};
  if(!Number.isInteger(d.maxL)||d.maxL<1)return{ok:false,why:"L"};
  var g=WR.sim(d);
  if(g.stored<d.targetK||g.comp>d.maxL)return{ok:false,why:"unsolvable"};
  return{ok:true,why:"",stored:g.stored,comp:g.comp};
};
WR.validateAll=function(){
  var fails=[],i;
  for(i=1;i<=WR.LEVEL_COUNT;i++){
    var L=WR.genLevel(i),r=WR.validate(L);
    if(!r.ok)fails.push(i+"("+r.why+")");
  }
  return {total:WR.LEVEL_COUNT,solvable:WR.LEVEL_COUNT-fails.length,fail:fails};
};
WR.runTests=function(){
  var pass=0,rows=[];
  function ck(name,ok,got){rows.push({name:name,ok:!!ok,got:got});if(ok)pass++;}
  //锚点1：基准跑固定小关
  var t1={W:7,H:5,shelves:[0,0,1,1,2,2,0,1,2,0,1,2],arrivals:[[5,0],[12,1],[19,2]],patience:20,targetK:3,maxL:1};
  var g1=WR.sim(t1);
  ck("锚点·三单入库 错漏 0",g1.stored===3&&g1.comp===0,"stored="+g1.stored+",comp="+g1.comp);
  //锚点2：耐心极短 → 必错漏

var GAME_KEY="warehouse-rush",SAVE_KEY="sw.warehouserush.v1";
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=WR.LEVEL_COUNT;i++)list.push(WR.genLevel(i));
  return list;
}
var LEVELS=buildDefaultLevels();
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!WR.validate(d).ok)return null;
    var no=parseInt(row.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=1;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return WR.validate(d).ok})){
      LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      if(state==="run")loadLevel(cur);
    }
  }).catch(function(){});
}

/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}
function rr(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/* ---------- 交互 ---------- */
function bfs(tx,ty){
  var key=function(x,y){return x+","+y};
  var prev={},seen={};
  var q=[[forklift.x,forklift.y]];
  seen[key(forklift.x,forklift.y)]=1;
  var dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  while(q.length){
    var c=q.shift();
    if(c[0]===tx&&c[1]===ty){
      var path=[],k=key(tx,ty);
      while(k!==key(forklift.x,forklift.y)){
        var parts=k.split(",");
        path.unshift([+parts[0],+parts[1]]);
        k=prev[k];
      }
      return path;
    }
    for(var d=0;d<4;d++){
      var nx=c[0]+dirs[d][0],ny=c[1]+dirs[d][1];
      if(nx<0||ny<0||nx>=L.w||ny>=L.h)continue;
      if(seen[key(nx,ny)])continue;
      seen[key(nx,ny)]=1;
      prev[key(nx,ny)]=key(c[0],c[1]);
      q.push([nx,ny]);
    }
  }
  return [];
}
function tapCell(gx,gy){
  if(state!=="run")return;
  if(path&&path.length){say("叉车行驶中…");return;}
  path=bfs(gx,gy);
  if(!path.length)say("已经在那儿了");
}
function tryPickupPlace(){
  //到达出货口且空手 → 取队首
  if(forklift.x===WR.PICK[0]&&forklift.y===WR.PICK[1]&&!carrying&&queue.length){
    handT=WR.HAND;
    var b=queue.shift();
    carrying=b;
    say("取到货件（"+["蓝","绿","橙"][b.cat]+"类）· 点同色货架放下");
  }
  //到达匹配货架且带货 → 放货
  var sc=WR.slotCat(L,forklift.x,forklift.y);
  if(sc>=0&&carrying){
    var si=forklift.y*(L.w-4)+(forklift.x-4);
    if(!slotsFilled[si]&&sc===carrying.cat){
      handT=WR.HAND;
      slotsFilled[si]=true;
      stored++;
      carrying=null;
      say("入库 +1（共 "+stored+"/"+L.targetK+"）");
    }else if(slotsFilled[si]&&sc===carrying.cat){
      say("这个货位已满，找同色空格");
    }else{
      say("颜色不对，看准货架标签再放");
    }
  }
}
function stepMove(dx,dy){
  if(state!=="run")return;
  if(path&&path.length){say("叉车行驶中…");return;}
  var nx=forklift.x+dx,ny=forklift.y+dy;
  if(nx<0||ny<0||nx>=L.w||ny>=L.h)return;
  forklift={x:nx,y:ny};
  tryPickupPlace();
  syncHud();draw();
}

/* ========== 绘制 ========= */
/* 立体砖：竖向渐变面 + 顶缘亮线 + 落地投影 */
function tile3(px,py,base,rad,gap){
  var w=cell-2*gap;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.18)";ctx.shadowBlur=cell*0.07;ctx.shadowOffsetY=cell*0.03;
  var g=ctx.createLinearGradient(0,py+gap,0,py+gap+w);
  g.addColorStop(0,colShade(base,0.12));g.addColorStop(0.5,base);g.addColorStop(1,colShade(base,-0.14));
  ctx.fillStyle=g;rr(px+gap,py+gap,w,w,rad);ctx.fill();
  ctx.restore();
  ctx.lineWidth=1;ctx.strokeStyle=colShade(base,-0.28);
  rr(px+gap+0.5,py+gap+0.5,w-1,w-1,rad);ctx.stroke();
}
/* 货件箱：渐变箱面 + 顶光 + 落地投影 + 封箱线 */
function box3(cx,cy,w,h,base){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.28)";ctx.shadowBlur=w*0.18;ctx.shadowOffsetY=w*0.08;
  var g=ctx.createLinearGradient(0,cy-h/2,0,cy+h/2);
  g.addColorStop(0,colShade(base,0.22));g.addColorStop(0.5,base);g.addColorStop(1,colShade(base,-0.22));
  ctx.fillStyle=g;rr(cx-w/2,cy-h/2,w,h,Math.min(6,w*0.14));ctx.fill();
  ctx.restore();
  ctx.lineWidth=1;ctx.strokeStyle=colShade(base,-0.4);
  rr(cx-w/2+0.5,cy-h/2+0.5,w-1,h-1,Math.min(6,w*0.14));ctx.stroke();
  ctx.strokeStyle=colShade(base,0.45);ctx.lineWidth=Math.max(1,w*0.06);
  ctx.beginPath();ctx.moveTo(cx,cy-h/2+1);ctx.lineTo(cx,cy+h/2-1);ctx.stroke();
}
/* 输送带（左列）：渐变带面 + 滚轮 + 出货口标记 */
function drawBelt(px,py,r){
  var gap=Math.max(1,cell*0.05),rad=Math.min(10,cell*0.18),w=cell-2*gap;
  ctx.save();

  ctx.fillStyle=g;rr(px+gap,py+gap,w,w,rad);ctx.fill();
  ctx.restore();

  }

/* 货架格：木面渐变 + 类别色带 + 类别字母 + 已放货立体箱 */
function drawSlot(px,py,c,r){

/* 队列卡片：渐变箱面 + 封箱线 + 耐心条 */
function drawQueue(){
  for(var q=0;q<Math.min(5,queue.length);q++){
    var b=queue[q],qx=4,qy=4+q*(cell-8),qw=cell-8,qh=cell-10;
    var frac=Math.max(0,Math.min(1,(b.dl-t)/L.patience)),col=catColor(b.cat);
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.24)";ctx.shadowBlur=cell*0.08;ctx.shadowOffsetY=cell*0.03;
    var g=ctx.createLinearGradient(0,qy,0,qy+qh);
    g.addColorStop(0,colShade(col,0.22));g.addColorStop(1,colShade(col,-0.18));
    ctx.fillStyle=g;rr(qx,qy,qw,qh,Math.min(8,qw*0.16));ctx.fill();
    ctx.restore();
    ctx.lineWidth=1;ctx.strokeStyle=colShade(col,-0.4);
    rr(qx+0.5,qy+0.5,qw-1,qh-1,Math.min(8,qw*0.16));ctx.stroke();
    ctx.strokeStyle=colShade(col,0.5);ctx.lineWidth=Math.max(1,qw*0.06);
    ctx.beginPath();ctx.moveTo(qx+qw/2,qy+1);ctx.lineTo(qx+qw/2,qy+qh-1);ctx.stroke();
    ctx.fillStyle=frac>0.4?PAL.success:(frac>0.2?PAL.warning:PAL.danger);

/* 叉车：渐变体身 + 驾驶室 + 叉齿 + 恒白高光 + 落地投影（替代字符「叉」） */
function drawForklift(){

  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.35)";ctx.shadowBlur=cell*0.1;ctx.shadowOffsetY=cell*0.05;

  rr(fx-s/2+0.5,fy-s/2+0.5,s-1,s*0.82-1,s*0.2);ctx.stroke();
  ctx.fillStyle=colShade(PAL.warning,0.28);
  rr(fx-s*0.28,fy-s*0.24,s*0.56,s*0.4,s*0.12);ctx.fill();
  ctx.fillStyle=colShade(PAL.warning,-0.2);
  var tw=Math.max(2,s*0.08);
  ctx.fillRect(fx-s*0.32,fy-s*0.62,tw,s*0.24);
  ctx.fillRect(fx+s*0.32-tw,fy-s*0.62,tw,s*0.24);
  ctx.fillStyle=WHITE;ctx.globalAlpha=0.5;
  rr(fx-s*0.34,fy-s*0.3,s*0.68,Math.max(2,s*0.06),2);ctx.fill();
  ctx.globalAlpha=1;
  if(carrying)box3(fx,fy-cell*0.42,cell*0.3,cell*0.24,catColor(carrying.cat));
}
function draw(){
  if(!L)return;
  ctx.fillStyle=PAL.floor1;ctx.fillRect(0,0,W,L.h*cell);
  var now=Date.now();
  var stag=Math.max(4,Math.min(14,Math.floor(300/(L.w*L.h))));
  var gap=Math.max(1,cell*0.05),rad=Math.min(10,cell*0.18);
  for(var r=0;r<L.h;r++)for(var c=0;c<L.w;c++){
    var px=c*cell,py=r*cell;
    var p=window.__gRM?1:Math.max(0,Math.min(1,(now-enterT-(r*L.w+c)*stag)/180));
    var sc=0.85+0.15*p;
    ctx.save();
    ctx.globalAlpha=p;
    ctx.translate(px+cell/2,py+cell/2);ctx.scale(sc,sc);ctx.translate(-(px+cell/2),-(py+cell/2));
    if(c===0)drawBelt(px,py,r);
    else if(c>=4&&r<=3)drawSlot(px,py,c,r);
    else tile3(px,py,((c+r)%2===0)?PAL.floor1:PAL.floor2,rad,gap);
    ctx.restore();
  }
  drawQueue();
  drawForklift();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.strokeRect(0.5,0.5,W-1,L.h*cell-1);
}

/* ========== 步进（实时分拣；rAF + visibilitychange 停帧/续跑，dt 钳制） ========== */
var acc=0;
function step(dt){
  if(state!=="run")return;
  t+=dt;
  //到货
  while(ai<L.arrivals.length&&L.arrivals[ai][0]<=t){
    queue.push({cat:L.arrivals[ai][1],arr:t,dl:t+L.patience});
    ai++;
  }
  //超时错漏
  for(var q=queue.length-1;q>=0;q--){
    if(queue[q].dl<=t){
      queue.splice(q,1);
      complaints++;
      say("一件货没人理，客户发火了（错漏 "+complaints+"/"+L.maxL+"）");
    }
  }
  //寻路移动
  if(path&&path.length){
    stepAcc+=dt;
    while(stepAcc>=WR.STEP&&path.length&&state==="run"){
      stepAcc-=WR.STEP;
      var nxt=path.shift();
      forklift={x:nxt[0],y:nxt[1]};
      tryPickupPlace();
    }
  }
  //手持延时
  if(handT>0){
    handT-=dt;
    if(handT<=0)handT=0;
  }
  syncHud();
  var lastArr=ai>=L.arrivals.length&&!queue.length;
  if(t>=timeMax(L)&&(lastArr||t>timeMax(L)+40))endShift();
}

/* ========== 主循环 ========== */
var rafPending=false,lastTs=0;
function frame(ts){
  rafPending=false;
  if(document.hidden)return;
  if(!lastTs)lastTs=ts;
  var dt=Math.min(0.05,(ts-lastTs)/1000||0);
  lastTs=ts;
  step(dt);draw();
  rafPending=true;requestAnimationFrame(frame);
}
function kick(){if(!rafPending&&!document.hidden){rafPending=true;requestAnimationFrame(frame);}}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){lastTs=0;if(state==="run")say("已暂停 · 切回继续分拣");}
  else{lastTs=0;kick();}
});

/* ========== 输入 ========== */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  var gx=Math.floor(x/cell),gy=Math.floor(y/cell);
  if(gx<0||gy<0||gx>=L.w||gy>=L.h)return;
  tapCell(gx,gy);
});
$("btnUp").addEventListener("click",function(){stepMove(0,-1)});
$("btnDown").addEventListener("click",function(){stepMove(0,1)});
$("btnLeft").addEventListener("click",function(){stepMove(-1,0)});
$("btnRight").addEventListener("click",function(){stepMove(1,0)});
$("btnReset").addEventListener("click",function(){loadLevel(cur);});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(ovMode==="win"){
    if(cur>=LEVELS.length-1){cur=0;save.lv=0;persist();loadLevel(0);}
    else{cur++;loadLevel(cur);}
  }else if(ovMode==="fail"){
    openLevelSelect();
  }
});
$("ovRetry").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  loadLevel(cur);
});
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowUp"){stepMove(0,-1);e.preventDefault();}
  else if(e.key==="ArrowDown"){stepMove(0,1);e.preventDefault();}
  else if(e.key==="ArrowLeft"){stepMove(-1,0);e.preventDefault();}
  else if(e.key==="ArrowRight"){stepMove(1,0);e.preventDefault();}
  else if(e.key==="r"||e.key==="R")loadLevel(cur);
});

/* 调试验证入口 */
window.__validateLevels=function(){try{return WR.runTests()}catch(e){return {error:String(e)}}};

$("ovRetry").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
setOvBtn("下一关","play");

})();
