var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},

  };
})();

/* ---------- 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ---------- */
var GAME_KEY="water-dig",SAVE_KEY="sw.waterdig.v1";
var DEFAULT_LEVELS=DEFAULT_LEVELS_SRC;
var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seenName={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d))return null;
    if(seenName[d.name])return null;
    seenName[d.name]=1;
    list.push(d);
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  levelOk=new Array(LEVELS.length);
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){
      LEVELS=list;return v;
    }
  }catch(e){}
  return 0;
}
var levelOk=new Array(LEVELS.length);
function verifyPending(){   // 后台逐关复核（分片避免卡顿）：坏关禁选、当前关即时告警
  var i=0;
  function step(){
    var t0=Date.now();
    while(i<LEVELS.length&&Date.now()-t0<40){
      if(levelOk[i]===undefined)levelOk[i]=verifyLevel(LEVELS[i]);
      i++;
    }
    if(i<LEVELS.length)setTimeout(step,0);
    else if(typeof renderLevels==="function")renderLevels();
  }
  setTimeout(step,0);
}

/* ---------- 结构校验 ---------- */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(!Number.isInteger(d.w)||d.w<5||d.w>7)return false;
  if(!Number.isInteger(d.h)||d.h<5||d.h>7)return false;
  var N=d.w*d.h;
  if(!Array.isArray(d.hgt)||d.hgt.length!==N)return false;
  for(var i=0;i<N;i++)if(!Number.isInteger(d.hgt[i])||d.hgt[i]<0||d.hgt[i]>3)return false;
  if(!Number.isInteger(d.src)||d.src<0||d.src>=N)return false;
  if(!Number.isInteger(d.tgt)||d.tgt<0||d.tgt>=N||d.tgt===d.src)return false;
  if(!Number.isInteger(d.budget)||d.budget<1||d.budget>3)return false;
  return true;
}
/* ---------- 独立验证器：状态图 Dijkstra + 零挖可达检查（与放水模拟分离） ---------- */
function wdNb(w,h,i){
  var x=i%w,y=(i/w)|0,out=[];
  if(x>0)out.push(i-1);
  if(x<w-1)out.push(i+1);
  if(y>0)out.push(i-w);
  if(y<h-1)out.push(i+w);
  return out;
}
function wdMinBudget(w,h,height,src,tgt){
  var dist=new Array(w*h*4),i;
  for(i=0;i<w*h*4;i++)dist[i]=Infinity;
  dist[src*4+height[src]]=0;
  var pq=[[0,src,height[src]]];
  while(pq.length){
    pq.sort(function(a,b){return a[0]-b[0]});
    var top=pq.shift(),c=top[0],cell=top[1],lv=top[2];
    if(c>dist[cell*4+lv])continue;
    var list=wdNb(w,h,cell);
    for(var q=0;q<list.length;q++){
      var nb=list[q],nh=height[nb];
      if(nh<=lv){
        if(c<dist[nb*4+nh]){dist[nb*4+nh]=c;pq.push([c,nb,nh])}
      }else{
        var nc=c+(nh-lv);
        if(nc<dist[nb*4+lv]){dist[nb*4+lv]=nc;pq.push([nc,nb,lv])}
      }
    }
  }
  var best=Infinity;
  for(var l=0;l<4;l++)best=Math.min(best,dist[tgt*4+l]);
  return best===Infinity?null:best;
}
function wdFlowNoDig(w,h,height,src){
  var reached=new Array(w*h).fill(false),levels=new Array(w*h).fill(0),q=[src];
  reached[src]=true;levels[src]=height[src];
  while(q.length){
    var cur=q.shift(),list=wdNb(w,h,cur);
    for(var q2=0;q2<list.length;q2++){
      var nb=list[q2];
      if(!reached[nb]&&height[nb]<=levels[cur]){reached[nb]=true;levels[nb]=height[nb];q.push(nb)}
    }
  }
  return reached;
}
function verifyLevel(L){
  if(!validLevelData(L))return false;
  var mb=wdMinBudget(L.w,L.h,L.hgt,L.src,L.tgt);
  if(mb===null||mb<1||mb>L.budget)return false;
  if(wdFlowNoDig(L.w,L.h,L.hgt,L.src)[L.tgt])return false;
  return true;
}

/* ---------- 水流模拟（玩家挖后地形） ---------- */
function flowNow(){
  var reached=new Array(w*h).fill(false),levels=new Array(w*h).fill(0),layer=new Array(w*h).fill(-1),q=[src()];
  reached[src()]=true;levels[src()]=height[src()];layer[src()]=0;
  while(q.length){
    var c=q.shift(),list=wdNb(w,h,c);
    for(var q2=0;q2<list.length;q2++){
      var nb=list[q2];
      if(!reached[nb]&&height[nb]<=levels[c]){reached[nb]=true;levels[nb]=height[nb];layer[nb]=layer[c]+1;q.push(nb)}
    }
  }
  return {reached:reached,levels:levels,layer:layer,maxLayer:layer.reduce(function(a,b){return Math.max(a,b)},0)};
}
function src(){return L.src}
function dig(i){
  if(done||flowing)return;
  if(i===L.tgt){say("田地不能挖");return}
  if(height[i]<=0){say("这里已经是渠底，挖不动了");return}
  if(used>=L.budget){say("挖掘预算用完，撤销几步或按放水试试");return}
  history.push({i:i,prev:height[i]});
  height[i]--;used++;
  flowT=0;flowLayers=null;
  say("挖掉一格土（高度 "+height[i]+"）");
  updStats();
}
function undo(){
  if(!history.length||done||flowing)return;
  var hh=history.pop();
  height[hh.i]=hh.prev;used--;
  flowT=0;flowLayers=null;
  updStats();say("撤销一步");
}
function startFlow(){
  if(done||flowing)return;
  var f=flowNow();
  flowLayers=f;
  flowing=true;
  flowT=Date.now();
  say("放水！");
  if(window.__gRM){finishFlow(f);return}
}
function finishFlow(f){
  flowing=false;
  if(f.reached[L.tgt]){
    winLevel();
  }else{
    say("水在半路断了——断口处地形比水位高，继续挖或调整");
  }
}
function winLevel(){
  done=true;
  save.done[lv]=true;
  if(lv+1<LEVELS.length&&save.lv<lv+1)save.lv=lv+1;
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:used}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"水到田了！";
  $("ovDesc").innerHTML="第 "+(lv+1)+" 关完成 · 用了 "+used+"/"+L.budget+" 次挖掘"+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
/* ---------- 绘制 ---------- */
function resize(){
  var wCss=cv.parentElement.clientWidth||360;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cs=Math.min(Math.floor((wCss-16)/w),64);
  W=cs*w+16;H=cs*h+16;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function centerOf(i){var x=i%w,y=(i/w)|0;return {x:8+x*cs+cs/2,y:8+y*cs+cs/2}}
function draw(){
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  if(!L)return;
  var f=flowLayers;
  var shown=f&&flowing?Math.floor((Date.now()-flowT)/130):0;
  for(var i=0;i<w*h;i++){
    var p=centerOf(i),x=i%w,y=(i/w)|0;
    ctx.fillStyle=PAL.g[height[i]];   // 素材地形色阶
    ctx.fillRect(8+x*cs+2,8+y*cs+2,cs-4,cs-4);
    ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
    ctx.strokeRect(8+x*cs+2.5,8+y*cs+2.5,cs-5,cs-5);
    if(f&&(f.reached[i]&&(!flowing||f.layer[i]<=shown))){
      ctx.globalAlpha=0.75;
      ctx.fillStyle=PAL.water;
      ctx.fillRect(8+x*cs+2,8+y*cs+2,cs-4,cs-4);
      ctx.globalAlpha=1;
    }
    ctx.fillStyle=i===L.src?PAL.water:(i===L.tgt?PAL.crop:PAL.text);   // 素材田色
    ctx.font="700 "+Math.min(18,cs*0.3)+"px sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(i===L.src?"源":(i===L.tgt?"田":String(height[i])),p.x,p.y);
    if(i===cur&&!done&&!flowing){
      ctx.strokeStyle=PAL.deep;ctx.lineWidth=2.5;
      ctx.strokeRect(8+x*cs+3,8+y*cs+3,cs-6,cs-6);
    }
  }
  if(flowing&&f){
    if(shown>f.maxLayer+2)finishFlow(f);
    else say("水正在流……");
  }
  requestAnimationFrame(draw);
}
/* ---------- 输入 ---------- */
cv.addEventListener("pointerdown",function(e){
  var r=cv.getBoundingClientRect();
  var x=Math.floor((e.clientX-r.left-8)/cs),y=Math.floor((e.clientY-r.top-8)/cs);
  if(x>=0&&y>=0&&x<w&&y<h){cur=y*w+x;dig(cur)}
  e.preventDefault();
});
$("btnFlow").addEventListener("click",startFlow);
$("btnUndo").addEventListener("click",undo);
$("btnHint").addEventListener("click",hint);
$("btnReset").addEventListener("click",function(){height=L.hgt.slice();history=[];used=0;flowLayers=null;flowing=false;updStats();say("本关已重置")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  hideOverlay();
  if(done){
    if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
    else{lv++;loadLevel(lv)}
  }
});
function hint(){
  if(done||flowing)return;
  var f=flowNow();
  if(f.reached[L.tgt]){say("水路已通，按「放水」！");return}
  if(used>=L.budget){say("预算用完了，先撤销几步再试");return}
  // 贪心：试每格挖 1，选使断口离田最近的
  var best=-1,bestD=1e9;
  for(var i=0;i<w*h;i++){
    if(height[i]<=0||i===L.tgt)continue;
    var h2=height.slice();h2[i]--;
    var f2=flowWith(h2);
    if(f2.reached[L.tgt]){best=i;break}
    // 可达集到田的最短步数
    var dist=new Array(w*h).fill(-1),q=[];
    for(var z=0;z<w*h;z++)if(f2.reached[z]){dist[z]=0;q.push(z)}
    while(q.length){
      var c=q.shift(),list=wdNb(w,h,c);
      for(var q2=0;q2<list.length;q2++){
        var nb=list[q2];
        if(dist[nb]<0){dist[nb]=dist[c]+1;q.push(nb)}
      }
    }
    if(dist[L.tgt]>=0&&dist[L.tgt]<bestD){bestD=dist[L.tgt];best=i}
  }
  if(best<0){say("内嵌求解器也没辙，撤销几步换个思路");return}
  history.push({i:best,prev:height[best]});
  height[best]--;used++;
  flowLayers=null;
  say("提示：挖这里（现在高度 "+height[best]+"）");
  updStats();
}
function flowWith(h2){
  var reached=new Array(w*h).fill(false),levels=new Array(w*h).fill(0),q=[L.src];
  reached[L.src]=true;levels[L.src]=h2[L.src];
  while(q.length){
    var c=q.shift(),list=wdNb(w,h,c);
    for(var q2=0;q2<list.length;q2++){
      var nb=list[q2];
      if(!reached[nb]&&h2[nb]<=levels[c]){reached[nb]=true;levels[nb]=h2[nb];q.push(nb)}
    }
  }
  return {reached:reached};
}
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k.indexOf("Arrow")===0){
    if(cur<0)cur=0;
    else{
      var x=cur%w,y=(cur/w)|0;
      if(k==="ArrowLeft")x=Math.max(0,x-1);
      else if(k==="ArrowRight")x=Math.min(w-1,x+1);
      else if(k==="ArrowUp")y=Math.max(0,y-1);
      else y=Math.min(h-1,y+1);
      cur=y*w+x;
    }
    e.preventDefault();
  }else if(k==="Enter"){if(cur>=0)dig(cur);e.preventDefault()}
  else if(k===" "){startFlow();e.preventDefault()}
  else if(k==="z"||k==="Z")undo();
  else if(k==="h"||k==="H")hint();
  else if(k==="r"||k==="R"){height=L.hgt.slice();history=[];used=0;flowLayers=null;flowing=false;updStats();say("本关已重置")}
});
function renderLevels(){}
/* ---------- 启动 ---------- */
palLoad();loadLevel(save.lv);
requestAnimationFrame(draw);
verifyPending();syncLevelsFromServer();syncSaveFromServer();
window.addEventListener("resize",resize);

})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
