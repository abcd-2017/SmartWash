<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ========== 核心与关卡生成（确定性纯函数；XC-CORE 供 node 抽取独立复现验证） ========== */
/*XC-CORE-BEGIN*/
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var WD={W:10,D:10,HARD:[1,2,4,1],MOVE:2,LEVEL_COUNT:40};
WD.cell=function(lv,x,y){return lv.cells[y*lv.w+x];};
WD.strokeCost=function(type,depth){return 1+WD.HARD[type]+depth;};
/* 水囊标号：4 邻连通的含水层 */
WD.pockets=function(lv){
  var pid=new Array(lv.w*lv.d).fill(-1),list=[],i;
  for(i=0;i<lv.w*lv.d;i++){
    var cx0=i%lv.w,cy0=Math.floor(i/lv.w);
    if(WD.cell(lv,cx0,cy0)!==3||pid[i]>=0)continue;
    var id=list.length,size=0,qq=[i];pid[i]=id;
    while(qq.length){
      var c=qq.pop();size++;
      var cx=c%lv.w,cy=Math.floor(c/lv.w);
      var nb=[[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]];
      for(var n2=0;n2<4;n2++){
        var nx=nb[n2][0],ny=nb[n2][1];
        if(nx<0||ny<0||nx>=lv.w||ny>=lv.d)continue;
        var ni=ny*lv.w+nx;
        if(WD.cell(lv,nx,ny)===3&&pid[ni]<0){pid[ni]=id;qq.push(ni);}
      }
    }
    list.push(size);
  }
  return {pid:pid,list:list};
};
/* 每列钻井方案：钻到第 k 个水囊的费用/水量前缀（费用含上方全部岩土） */
WD.colPlans=function(lv,x,pk){
  var opts=[{cost:0,yield:0}],cost=0,got=0,seenHole={};
  for(var y=0;y<lv.d;y++){
    var c=WD.cell(lv,x,y);
    if(c===3&&seenHole[pk.pid[y*lv.w+x]]===undefined){
      cost+=WD.strokeCost(0,y);
      seenHole[pk.pid[y*lv.w+x]]=1;
      got+=pk.list[pk.pid[y*lv.w+x]];
      opts.push({cost:cost,yield:got});
    }else{
      cost+=WD.strokeCost(c===3?0:c,y);
    }
  }
  return opts;
};
/* DP：列自左向右访问（移机费最优），best[y]=拿到 y 水的最小总费用 */
WD.solve=function(lv){
  var pk=WD.pockets(lv),maxTotal=0,i;
  for(i=0;i<pk.list.length;i++)maxTotal+=pk.list[i];
  var plans=[];
  for(var x=0;x<lv.w;x++)plans.push(WD.colPlans(lv,x,pk));
  var INF=1e9;
  var bc=[];
  var best=new Array(maxTotal+1).fill(INF);
  for(var x1=0;x1<lv.w;x1++){
    var cur=new Array(maxTotal+1).fill(INF);
    for(var x0=0;x0<x1;x0++){
      if(!bc[x0])continue;
      var mv=WD.MOVE*(x1-x0);
      for(var y0=0;y0<=maxTotal;y0++){
        if(bc[x0][y0]>=INF)continue;
        for(var k=1;k<plans[x1].length;k++){
          var o=plans[x1][k];
          var y2=Math.min(maxTotal,y0+o.yield);
          var c2=bc[x0][y0]+mv+o.cost;
          if(c2<cur[y2])cur[y2]=c2;
        }
      }
    }
    for(var k2=1;k2<plans[x1].length;k2++){
      var o2=plans[x1][k2];
      var y22=Math.min(maxTotal,o2.yield);
      var c22=WD.MOVE*x1+o2.cost;
      if(c22<cur[y22])cur[y22]=c22;
    }
    bc[x1]=cur;
    for(var y3=0;y3<=maxTotal;y3++)if(cur[y3]<best[y3])best[y3]=cur[y3];
  }
  return {best:best,maxTotal:maxTotal,
    minCostFor:function(t){var r=INF;for(var y=t;y<=maxTotal;y++)if(best[y]<r)r=best[y];return r;},
    maxYield:function(){var m=0;for(var y=0;y<=maxTotal;y++)if(best[y]<INF)m=y;return m;}};
};
/* 生成：岩层随深度变重，水囊 2-5 片；预算=最优方案费用×比例+余量 */
WD.genLevel=function(no){
  for(var attempt=0;attempt<30;attempt++){
    var rng=mulberry32(72400+no*577+attempt*23);
    var w=WD.W,d=WD.D,cells=[];
    for(var y=0;y<d;y++)for(var x=0;x<w;x++){
      var r=rng(),t;
      if(y<2)t=0;
      else if(y<5)t=r<0.55?0:1;
      else t=r<0.3?0:(r<0.65?1:2);
      cells.push(t);
    }
    var nPk=2+Math.floor(rng()*2)+(no>20?1:0);
    var placed=0,tries=0;
    while(placed<nPk&&tries<40){
      tries++;
      var px=1+Math.floor(rng()*(w-2)),py=2+Math.floor(rng()*(d-3));
      var horiz=rng()<0.5,len=1+Math.floor(rng()*2),okP=true,pts=[];
      for(var q=0;q<len;q++){
        var tx=px+(horiz?q:0),ty=py+(horiz?0:q);
        if(tx>=w||ty>=d||cells[ty*w+tx]===3){okP=false;break;}
        pts.push([tx,ty]);
      }
      if(!okP)continue;
      for(var q2=0;q2<pts.length;q2++)cells[pts[q2][1]*w+pts[q2][0]]=3;
      placed++;
    }
    if(placed<2)continue;
    var lv={name:"打井·"+(no<10?"0":"")+no,w:w,d:d,cells:cells,budget:0,target:0,
      difficulty:Math.min(9,1+Math.floor(no/5))};
    var sol=WD.solve(lv);
    var maxY=sol.maxYield();
    if(maxY<3)continue;
    var target=Math.max(2,Math.floor(maxY*(0.8+Math.min(0.12,no*0.003))));
    if(target>maxY)target=maxY;
    var mc=sol.minCostFor(target);
    if(mc>=1e9)continue;
    var ratio=1.3-Math.min(0.15,no*0.0035);
    lv.target=target;
    lv.budget=Math.ceil(mc*ratio)+8;
    if(lv.budget>900)continue;
    return lv;
  }
  return {name:"打井·"+(no<10?"0":"")+no,w:4,d:5,
    cells:[0,0,0,0, 0,0,0,0, 0,3,0,0, 0,0,0,3, 2,2,1,2],
    budget:20,target:2,difficulty:Math.min(9,1+Math.floor(no/5))};
};
/* 结构校验 */
WD.validate=function(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return{ok:false,why:"bad"};
  if(!Number.isInteger(d.w)||d.w<3||d.w>16)return{ok:false,why:"w"};
  if(!Number.isInteger(d.d)||d.d<3||d.d>16)return{ok:false,why:"d"};
  if(!Array.isArray(d.cells)||d.cells.length!==d.w*d.d)return{ok:false,why:"cells"};
  for(var i=0;i<d.cells.length;i++)if(!Number.isInteger(d.cells[i])||d.cells[i]<0||d.cells[i]>3)return{ok:false,why:"c"+i};
  if(!Number.isInteger(d.budget)||d.budget<10||d.budget>900)return{ok:false,why:"budget"};
  if(!Number.isInteger(d.target)||d.target<2)return{ok:false,why:"target"};
  var pk=WD.pockets(d);
  if(pk.list.length<1)return{ok:false,why:"nopocket"};
  var sol=WD.solve(d);
  if(sol.maxYield()<d.target)return{ok:false,why:"unsolvable"};
  if(sol.minCostFor(d.target)>d.budget)return{ok:false,why:"poor"};
  return{ok:true,why:""};
};
WD.validateAll=function(){
  var fails=[],i;
  for(i=1;i<=WD.LEVEL_COUNT;i++){
    var L=WD.genLevel(i),r=WD.validate(L);
    if(!r.ok)fails.push(i+"("+r.why+")");
  }
  return {total:WD.LEVEL_COUNT,solvable:WD.LEVEL_COUNT-fails.length,fail:fails};
};
WD.runTests=function(){
  var pass=0,rows=[];
  function ck(name,ok,got){rows.push({name:name,ok:!!ok,got:got});if(ok)pass++;}
  //锚点1：岩层(硬4)在深度3 → 单钻 1+4+3=8
  ck("锚点·岩层单钻 8",WD.strokeCost(2,3)===8,WD.strokeCost(2,3));
  //锚点2：横排两格水囊 flood fill → 尺寸 2
  var t2={w:4,d:3,cells:[0,0,0,0, 0,3,3,0, 0,0,0,0],budget:50,target:2};
  var pk2=WD.pockets(t2);
  ck("锚点·两格水囊连通",pk2.list.length===1&&pk2.list[0]===2,JSON.stringify(pk2.list));
  //锚点3：列计划前缀（水囊在 (1,2)，土层上方）
  var t3={w:3,d:5,cells:[0,0,0, 0,0,0, 0,3,0, 0,0,0, 0,0,0],budget:50,target:1};
  var pk3=WD.pockets(t3);
  var pl3=WD.colPlans(t3,1,pk3);
  ck("锚点·列计划 cost=9 yield=1",pl3.length===2&&pl3[1].cost===9&&pl3[1].yield===1,JSON.stringify(pl3));
  //锚点4：微型图求解：目标 1 最小费用 = 移机 2 + 钻费 9 = 11
  var s3=WD.solve(t3);
  ck("锚点·求解最小费用 11",s3.minCostFor(1)===11&&s3.maxYield()===1,"cost="+s3.minCostFor(1));
  var r=WD.validateAll();
  ck("40 关结构+可解+预算校验",r.fail.length===0,"fail="+r.fail.join(","));
  var L1=WD.genLevel(1),L2=WD.genLevel(1);
  ck("生成确定性",JSON.stringify(L1)===JSON.stringify(L2),"replay");
  return {total:6,pass:pass,rows:rows,levels:r};
};
globalThis.__XC=WD;
/*XC-CORE-END*/

/* ========== 关卡数据（DB 下发优先，本地缓存兜底，包内默认关兜底） ========== */
var GAME_KEY="well-drill",SAVE_KEY="sw.welldill.v1";
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function buildDefaultLevels(){
  var list=[];
  for(var i=1;i<=WD.LEVEL_COUNT;i++)list.push(WD.genLevel(i));
  return list;
}
var LEVELS=buildDefaultLevels();
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!WD.validate(d).ok)return null;
    var no=parseInt(row.levelNo,10);
    if(!isFinite(no)||no<1)no=i+1;
    if(seen[no])return null;
    seen[no]=1;
    d.no=no;
    list.push(d);
  }
  list.sort(function(a,b){return a.no-b.no});
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(function(d){return WD.validate(d).ok})){
      LEVELS=list;return parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    }
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(cur>LEVELS.length-1)cur=LEVELS.length-1;
      loadLevel(cur);
    }
  }).catch(function(){});
}

/* ========== 存档（本地 + 账号双写，账号更优才覆盖） ========== */
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:parseInt(s.lv,10)||0,best:parseInt(s.best,10)||1}}catch(e){return{lv:0,best:1}}}
var save=loadSave();
var unlocked=clamp(save.best,1,1);
function persist(){
  var data={lv:cur,best:unlocked};
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,data).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson||state!=="edit")return;
    try{
      var r=JSON.parse(res.stateJson),ch=false;
      var rl=parseInt(r.lv,10),rb=parseInt(r.best,10);
      if(isFinite(rl)&&rl>save.lv&&rl<LEVELS.length){save.lv=rl;ch=true;}
      if(isFinite(rb)&&rb>unlocked&&rb<=LEVELS.length){unlocked=rb;ch=true;}
      if(ch){cur=clamp(save.lv,0,LEVELS.length-1);persist();loadLevel(cur);}
    }catch(e){}
  }).catch(function(){});
}

/* ========== 调色板 ========== */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),
    danger:v("--g-danger"),warning:v("--g-warning"),success:v("--g-success"),
    water:v("--g-water"),earth:v("--g-st-earth"),clay:v("--g-st-clay"),
    rock:v("--g-st-rock"),sky:v("--g-st-sky")};
}
window.__gOnTheme=function(){palLoad()};
palLoad();

/* ========== 画布与状态 ========== */
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,cs=26,cur=save.lv,L=null;
var rig=0,depths=[],drained={},money=0,water=0,pk=null,state="edit",done=false;
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function resize(){
  var w=cv.parentElement.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(w);
  cs=Math.max(20,Math.min(30,Math.floor((W-10)/L.w)));
  var H=L.d*cs+34;
  cv.style.height=H+"px";
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",function(){resize();draw();});
function loadLevel(n){
  cur=clamp(n,0,LEVELS.length-1);
  L=LEVELS[cur];
  if(!WD.validate(L).ok){say("关卡数据异常");return;}
  pk=WD.pockets(L);
  rig=0;depths=new Array(L.w).fill(0);drained={};
  money=L.budget;water=0;state="edit";done=false;
  $("lvTag").textContent="第 "+(cur+1)+" 关 · "+L.name;
  $("lvRule").textContent="经费 "+L.budget+" · 目标水 "+L.target+" · "+L.w+"×"+L.d;
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  say("移动井架选点钻孔：经费=1+硬度+深度/钻，移动 2/格；水囊一钻全收");
  resize();syncHud();draw();
}
function syncHud(){
  $("stMoney").textContent=money;
  $("stMoney").className="val"+(money<6?" low":"");
  $("stWater").textContent=water+"/"+L.target;
  $("stWater").className="val"+(water>=L.target?"":" low");
  $("stRig").textContent="x"+rig+" d"+depths[rig];
}
/* ---------- 交互 ---------- */
function curType(){
  var t=WD.cell(L,rig,depths[rig]);
  if(t===3&&drained[pk.pid[depths[rig]*L.w+rig]])return 0;
  return t;
}
function moveRig(dir){
  if(state!=="edit"||done)return;
  var nx=rig+dir;
  if(nx<0||nx>=L.w){say("到边界了");return;}
  if(money<WD.MOVE){say("经费不够移机（"+WD.MOVE+"）");checkFail();return;}
  money-=WD.MOVE;rig=nx;
  say("井架移到 x="+rig+"（花费 "+WD.MOVE+"）");
  syncHud();draw();checkFail();
}
function stroke(){
  if(state!=="edit"||done)return;
  if(depths[rig]>=L.d){say("这口井已经到底了");return;}
  var t=curType();
  var cost=WD.strokeCost(t,depths[rig]);
  if(money<cost){say("经费不够这一钻（要 "+cost+"）");checkFail();return;}
  money-=cost;
  depths[rig]++;
  say("钻进 1m（花费 "+cost+" · 剩 "+money+"）");
  if(WD.cell(L,rig,depths[rig]-1)===3){
    var pid=pk.pid[(depths[rig]-1)*L.w+rig];
    if(!drained[pid]){
      drained[pid]=1;
      water+=pk.list[pid];
      say("打穿水囊！引水 +"+pk.list[pid]+"（共 "+water+"/"+L.target+"）");
    }
  }
  syncHud();draw();
  if(water>=L.target){winLevel();return;}
  checkFail();
}
function checkFail(){
  if(done||water>=L.target)return;
  var canStroke=depths[rig]<L.d&&money>=WD.strokeCost(curType(),depths[rig]);
  if(money<WD.MOVE&&!canStroke){
    state="pause";
    $("ovTitle").textContent="经费见底";
    $("ovDesc").textContent="引水 "+water+"/"+L.target+"，剩余经费撑不起任何动作了。";
    $("ovBtn").textContent="选关";
    $("ovRetry").hidden=false;
    ovMode="fail";
    $("overlay").classList.add("show");
  }
}
function winLevel(){
  done=true;state="done";
  if(cur<LEVELS.length-1&&cur+1>save.lv)save.lv=cur+1;
  if(cur+2>unlocked)unlocked=Math.min(LEVELS.length,cur+2);
  persist();
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:cur+1,metricExtra:money}).catch(function(){});
  $("ovTitle").textContent=(cur>=LEVELS.length-1)?"全部通关！":"通水！";
  $("ovDesc").innerHTML="引水 "+water+"（目标 "+L.target+"）· 剩余经费 "+money+(cur<LEVELS.length-1?"<br>已解锁第 "+(cur+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(cur>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("ovRetry").hidden=true;
  ovMode="win";
  $("overlay").classList.add("show");
}
var ovMode="select";
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<unlocked-1?" done":"");
      b.textContent=i+1;
      b.disabled=i>=unlocked;
      b.addEventListener("click",function(){
        cur=i;save.lv=Math.max(save.lv,cur);persist();
        $("overlay").classList.remove("show");
        loadLevel(cur);
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("ovRetry").hidden=true;
  ovMode="select";
  $("overlay").classList.add("show");
}

/* ========== 绘制 ========== */
function draw(){
  var ox=(W-L.w*cs)/2,oy=30;
  //天空与村庄
  ctx.fillStyle=PAL.sky;ctx.fillRect(0,0,W,oy);
  ctx.fillStyle=PAL.surface;
  ctx.fillRect(6,oy-14,14,12);ctx.fillRect(22,oy-10,10,8);
  ctx.fillStyle=PAL.muted;
  ctx.font="12px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.fillText("村",8,oy-16);
  //地层
  for(var y=0;y<L.d;y++)for(var x=0;x<L.w;x++){
    var c=WD.cell(L,x,y);
    var px=ox+x*cs,py=oy+y*cs;
    if(c===0)ctx.fillStyle=PAL.earth;
    else if(c===1)ctx.fillStyle=PAL.clay;
    else if(c===2)ctx.fillStyle=PAL.rock;
    else ctx.fillStyle=PAL.water;
    ctx.fillRect(px,py,cs-1,cs-1);
    if(c===3&&!drained[pk.pid[y*L.w+x]]){
      ctx.fillStyle="rgba(255,255,255,.35)";   // 恒白水光
      ctx.fillRect(px+3,py+3,cs-9,3);
    }
    if(c===2){
      ctx.fillStyle=PAL.faint;
      ctx.fillRect(px+4,py+cs*0.5,cs-9,2);
    }
  }
  //已钻管道
  for(var x2=0;x2<L.w;x2++){
    if(!depths[x2])continue;
    var dx0=ox+x2*cs+cs/2;
    ctx.strokeStyle=PAL.text;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(dx0,oy);ctx.lineTo(dx0,oy+depths[x2]*cs);ctx.stroke();
  }
  //井架
  var rx=ox+rig*cs+cs/2;
  ctx.fillStyle=PAL.primary;
  ctx.beginPath();
  ctx.moveTo(rx,oy-16);ctx.lineTo(rx-8,oy-2);ctx.lineTo(rx+8,oy-2);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(rx,oy-2);ctx.lineTo(rx,oy+2);ctx.stroke();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;
  ctx.strokeRect(0.5,0.5,W-1,L.d*cs+33);
}

/* ========== 主循环（纯事件驱动；rAF 仅重绘，切后台停帧不推进任何状态） ========== */
var rafPending=false,lastTs=0;
function frame(ts){
  rafPending=false;
  if(document.hidden)return;
  lastTs=ts;
  draw();
  rafPending=true;requestAnimationFrame(frame);
}
function kick(){if(!rafPending&&!document.hidden){rafPending=true;requestAnimationFrame(frame);}}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){lastTs=0;}
  else{lastTs=0;kick();}
});

/* ========== 输入 ========== */
cv.addEventListener("pointerdown",function(e){
  var rect=cv.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  e.preventDefault();
  var ox=(W-L.w*cs)/2;
  if(y<30){
    var gx=Math.floor((x-ox)/cs);
    if(gx>=0&&gx<L.w&&gx!==rig){var d2=gx-rig;moveRig(d2>0?1:-1);}
  }else{
    stroke();
  }
});
$("btnLeft").addEventListener("click",function(){moveRig(-1)});
$("btnRight").addEventListener("click",function(){moveRig(1)});
$("btnDrill").addEventListener("click",stroke);
$("btnReset").addEventListener("click",function(){loadLevel(cur);});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(ovMode==="win"){
    if(cur>=LEVELS.length-1){cur=0;save.lv=0;persist();loadLevel(0);}
    else{cur++;loadLevel(cur);}
  }else if(ovMode==="fail"){
    openLevelSelect();
  }
});
$("ovRetry").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  loadLevel(cur);
});
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft"){moveRig(-1);e.preventDefault();}
  else if(e.key==="ArrowRight"){moveRig(1);e.preventDefault();}
  else if(e.key===" "||e.key==="ArrowDown"){stroke();e.preventDefault();}
  else if(e.key==="r"||e.key==="R")loadLevel(cur);
});

/* 调试验证入口 */
window.__validateLevels=function(){try{return WD.runTests()}catch(e){return {error:String(e)}}};

/* ========== 启动（续玩：从存档关卡起步） ========== */
cur=clamp(save.lv,0,LEVELS.length-1);
loadLevel(cur);
requestAnimationFrame(frame);
syncLevelsFromServer();
syncSaveFromServer();

})();
</script>

</body>
