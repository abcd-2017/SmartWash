<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>主题寻词</title>
<style>
  /*token:GAME-THEME.md §2 基线（值与基线一致）*/
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;

  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); }
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat { flex: 1; background: var(--g-surface2); border-radius: var(--g-radius-inner); padding: 6px 4px; text-align: center; line-height: 1.3; min-width: 0; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.bad { color: var(--g-danger); }
  .themeline {
    background: var(--g-primary-soft); color: var(--g-on-soft);
    border-radius: var(--g-radius-inner); padding: 8px 10px; margin-bottom: 10px;
    font-size: 14px; text-align: center;
  }
  .themeline b { font-size: 16px; }
  .wordlist { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .wchip {
    font-size: 14px; color: var(--g-muted); background: var(--g-surface2);
    border-radius: 999px; padding: 6px 14px; min-height: 32px; line-height: 1.4;
  }
  .wchip.found { color: var(--g-on-soft); background: var(--g-primary-soft); text-decoration: line-through; }
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px;
    background: var(--g-surface); border-radius: var(--g-radius-inner);

  }
  .gcell {
    aspect-ratio: 1; min-height: 40px; border: 0; border-radius: 10px;
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .gcell.start { box-shadow: inset 0 0 0 2px var(--g-primary); }
  .gcell.found { background: var(--g-primary-soft); color: var(--g-on-soft); }
  .gcell.shake { animation: shake .3s ease-in-out; box-shadow: inset 0 0 0 2px var(--g-danger); }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 14px; flex: 1;
    border: 0; border-radius: var(--g-radius-btn);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .35; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%; max-width: 340px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
  .lvbtn {
    min-height: 44px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .lvbtn[disabled] { opacity: .35; }
  .lvbtn.done { background: var(--g-primary-soft); color: var(--g-on-soft); }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }

  /* S2: 动效敏感用户降级——保留状态切换，压平装饰动效（animate.md 要求；注意：这是动效层指令，不受 GAME-THEME §4 主题层 matchMedia 禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>
<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();

/* ---------- 主题词库：12 主题 × 12 词（全部为规范名词，主题归类逐词校对） ---------- */
var GAME_KEY="word-hunt",SAVE_KEY="sw.wordhunt.v1";
var THEMES={
"动物":["老虎","狮子","大象","熊猫","猴子","兔子","老鼠","狐狸","乌龟","青蛙","蝴蝶","蜜蜂"],
"水果":["苹果","香蕉","西瓜","桃子","梨子","橙子","葡萄","草莓","柠檬","芒果","樱桃","枣子"],
"天气":["大风","下雨","下雪","打雷","闪电","云朵","雾气","冰雹","彩虹","晴天","阴天","霜冻"],
"身体":["耳朵","眼睛","鼻子","嘴巴","手指","脚趾","肩膀","大腿","膝盖","肚子","脸蛋","牙齿"],
"学习":["铅笔","橡皮","尺子","书包","课本","黑板","粉笔","钢笔","词典","地图","台灯","印章"],
"家庭":["爸爸","妈妈","爷爷","奶奶","叔叔","阿姨","哥哥","姐姐","弟弟","妹妹","舅舅","姑姑"],
"食物":["米饭","面条","饺子","包子","馒头","鸡蛋","牛奶","豆腐","青菜","萝卜","土豆","番茄"],
"自然":["高山","大海","河流","森林","草原","沙漠","岛屿","湖泊","溪流","瀑布","星空","月亮"],
"交通":["火车","汽车","飞机","轮船","地铁","公交","摩托","出租","高铁","自行车","帆船","马车"],
"运动":["跑步","跳远","游泳","篮球","足球","排球","网球","体操","滑冰","拳击","爬山","骑车"],
"颜色":["红色","蓝色","绿色","黄色","黑色","白色","紫色","灰色","粉色","橙色","棕色","金色"],
"职业":["医生","老师","司机","厨师","警察","农民","工人","演员","歌手","作家","画家","护士"]
};
var TKEYS=[];for(var tk in THEMES)TKEYS.push(tk);
var ROWS=6,COLS=8;
var DIRS=[[0,1],[1,0],[1,1]];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* ---------- 独立验证器：结构完整性 + 路径匹配 + 意外出现扫描 ---------- */
function pathCells(w,r,c,d){
  var cells=[],dr=DIRS[d][0],dc=DIRS[d][1];
  for(var k=0;k<w.length;k++){
    var rr=r+dr*k,cc=c+dc*k;
    if(rr<0||rr>=ROWS||cc<0||cc>=COLS)return null;
    cells.push([rr,cc]);
  }
  return cells;
}
function countOccurrences(grid,w){
  var total=0,rev=w.split("").reverse().join("");
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    for(var d=0;d<DIRS.length;d++){
      var dr=DIRS[d][0],dc=DIRS[d][1];
      /* 正向 */
      if(r+w.length*dr<=ROWS&&(w.length*dr<=0||r+w.length*dr>=0)&&c+w.length*dc<=COLS){
        var s1="";
        for(var k=0;k<w.length;k++)s1+=grid[r+dr*k][c+dc*k];
        if(s1===w)total++;
        if(s1===rev&&rev!==w)total++;
      }
    }
  }
  return total;
}
function validateGrid(theme,grid,words){
  if(!Array.isArray(grid)||grid.length!==ROWS)return "行数不符";
  var charPool={};
  for(var t=0;t<TKEYS.length;t++){
    var arr=THEMES[TKEYS[t]];
    for(var k=0;k<arr.length;k++)for(var j=0;j<arr[k].length;j++)charPool[arr[k][j]]=1;
  }
  for(var r=0;r<ROWS;r++){
    if(!Array.isArray(grid[r])||grid[r].length!==COLS)return "列数不符";
    for(var c=0;c<COLS;c++){
      var ch=grid[r][c];
      if(typeof ch!=="string"||ch.length!==1)return "非法字符";
      if(!charPool[ch])return "字符不在词库";
    }
  }
  var seenW={};
  for(var i=0;i<words.length;i++){
    var w=words[i];
    if(!THEMES[theme]||THEMES[theme].indexOf(w.w)<0)return w.w+" 不属于主题";
    if(seenW[w.w])return w.w+" 重复";
    seenW[w.w]=1;
    var cells=pathCells(w.w,w.r,w.c,w.d);
    if(!cells)return w.w+" 出界";
    for(var k=0;k<cells.length;k++){
      if(grid[cells[k][0]][cells[k][1]]!==w.w[k])return w.w+" 字符不匹配";
    }
    if(countOccurrences(grid,w.w)!==1)return w.w+" 在字海中出现歧义";
  }
  return null;
}
/* ---------- 关卡生成器：固定种子，每关 5 词 + 随机填字，验证不过换种子重排 ---------- */
function genOne(seed){
  var rnd=mulberry32(seed);
  var theme=TKEYS[Math.floor(rnd()*TKEYS.length)];
  var words=THEMES[theme].slice();
  for(var s=words.length-1;s>0;s--){var j=Math.floor(rnd()*(s+1)),t=words[s];words[s]=words[j];words[j]=t;}
  var picks=words.slice(0,5);
  for(var attempt=0;attempt<24;attempt++){
    var grid=[],occ={};
    for(var r=0;r<ROWS;r++){grid.push([]);for(var c=0;c<COLS;c++)grid[r].push(null);}
    var placed=[],ok=true;
    for(var p=0;p<picks.length;p++){
      var w=picks[p],put=false;
      for(var tr=0;tr<60&&!put;tr++){
        var d=Math.floor(rnd()*DIRS.length),dr=DIRS[d][0],dc=DIRS[d][1];
        var r0=Math.floor(rnd()*ROWS),c0=Math.floor(rnd()*COLS);
        var cells=[];
        var good=true;
        for(var k=0;k<w.length;k++){
          var rr=r0+dr*k,cc=c0+dc*k;
          if(rr<0||rr>=ROWS||cc<0||cc>=COLS||grid[rr][cc]!==null){good=false;break;}
          cells.push([rr,cc]);
        }
        if(!good)continue;
        for(var k2=0;k2<cells.length;k2++)grid[cells[k2][0]][cells[k2][1]]=w[k2];
        placed.push({w:w,r:r0,c:c0,d:d});
        put=true;
      }
      if(!put){ok=false;break;}
    }
    if(!ok||placed.length<5)continue;
    /* 随机填字（逐字拆入池） */
    var fill=[];
    for(var t2=0;t2<TKEYS.length;t2++){
      var arr2=THEMES[TKEYS[t2]];
      for(var k3=0;k3<arr2.length;k3++){
        var ws2=arr2[k3];
        for(var k4=0;k4<ws2.length;k4++)fill.push(ws2[k4]);
      }
    }
    for(var r2=0;r2<ROWS;r2++)for(var c2=0;c2<COLS;c2++){
      if(grid[r2][c2]===null)grid[r2][c2]=fill[Math.floor(rnd()*fill.length)];
    }
    var err=validateGrid(theme,grid,placed);
    if(!err)return{name:"寻词·"+(seed%1000),theme:theme,grid:grid,words:placed};
  }
  return null;
}
function genLevels(){
  var list=[];
  for(var i=0;i<40;i++){
    var lv=null;
    for(var t=0;t<8&&!lv;t++)lv=genOne(90000+i*31+t*7919);
    if(!lv)return null;
    list.push(lv);
  }
  return list;
}
var DEFAULT_LEVELS=genLevels();
var LEVELS=DEFAULT_LEVELS||[];
var LEVELS_KEY=SAVE_KEY+".levels",LEVELS_VER_KEY=SAVE_KEY+".levels.ver";
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return false;
  if(typeof d.name!=="string"||!d.name.trim())return false;
  if(typeof d.theme!=="string"||!THEMES[d.theme])return false;
  if(!Array.isArray(d.words)||d.words.length<1||d.words.length>8)return false;
  return validateGrid(d.theme,d.grid,d.words)===null;
}
function auditAll(){
  var bad=[];
  for(var i=0;i<LEVELS.length;i++)if(!validLevelData(LEVELS[i]))bad.push(i+1);
  return bad;
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[],seen={};
  for(var i=0;i<res.levels.length;i++){
    var row=res.levels[i];
    if(!row||typeof row!=="object"||typeof row.dataJson!=="string")return null;
    var d;
    try{d=JSON.parse(row.dataJson);}catch(e){return null;}
    if(!validLevelData(d)||seen[d.name])return null;
    seen[d.name]=1;
    list.push({name:d.name,theme:d.theme,grid:d.grid.map(function(row){return row.slice()}),words:d.words.map(function(w){return{w:w.w,r:w.r,c:w.c,d:w.d}})});
  }
  return list;
}
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length&&list.every(validLevelData)){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;
  GB.getLevels(GAME_KEY).then(function(res){
    var list=parseDbLevels(res);
    if(!list)return;
    if(applyLevels(list,res.version||0)){
      if(lv>LEVELS.length-1)lv=LEVELS.length-1;
      save.lv=Math.min(save.lv,lv);persist();loadLevel(lv);
    }
  }).catch(function(){});
}
/* ---------- 存档（本地 + 账号双写） ---------- */
function loadSave(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};return{lv:Math.max(0,Math.min(LEVELS.length-1,parseInt(s.lv,10)||0))}}catch(e){return{lv:0}}}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
  if(GB.available)GB.saveState(GAME_KEY,save).catch(function(){});
}
var save=loadSave();
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState(GAME_KEY).then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var remote=JSON.parse(res.stateJson);
      var rlv=parseInt(remote.lv,10)||0;
      if(rlv>save.lv){save.lv=Math.min(LEVELS.length-1,rlv);persist();loadLevel(save.lv);}
    }catch(e){}
  }).catch(function(){});
}
/* ---------- 状态 ---------- */
var lv=save.lv,L=null,found=[],errors=0,done=false,start=null,cur=[0,0];
function $(id){return document.getElementById(id)}
function say(t){$("msg").textContent=t}
function loadLevel(n){
  lv=Math.max(0,Math.min(n,LEVELS.length-1));
  L=LEVELS[lv];
  if(!validLevelData(L)){say("关卡数据异常");return;}
  found=[];errors=0;done=false;start=null;cur=[0,0];
  $("lvTag").textContent="第 "+(lv+1)+" 关 · "+L.name;
  $("lvRule").textContent=L.theme;
  $("themeName").textContent=L.theme;
  $("stLv").textContent=(lv+1)+"/"+LEVELS.length;
  renderWords();renderGrid();updStats();
  say("点首尾两字圈出主题词");
}
function renderWords(){
  var box=$("wordlist");box.innerHTML="";
  L.words.forEach(function(w){
    var s=document.createElement("span");
    s.className="wchip"+(found.indexOf(w.w)>=0?" found":"");
    s.textContent=w.w;
    box.appendChild(s);
  });
}
function renderGrid(){
  var g=$("grid");g.innerHTML="";
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    (function(r,c){
      var b=document.createElement("button");
      b.className="gcell";
      b.textContent=L.grid[r][c];
      b.setAttribute("aria-label","第"+(r+1)+"行第"+(c+1)+"列 "+L.grid[r][c]);
      if(start&&start[0]===r&&start[1]===c)b.classList.add("start");
      if(cur[0]===r&&cur[1]===c)b.classList.add("cur-cell");
      var covered=found.some(function(fw){
        var it=null;
        for(var i=0;i<L.words.length;i++)if(L.words[i].w===fw)it=L.words[i];
        if(!it)return false;
        var dr=DIRS[it.d][0],dc=DIRS[it.d][1];
        for(var k=0;k<it.w.length;k++)if(it.r+dr*k===r&&it.c+dc*k===c)return true;
        return false;
      });
      if(covered)b.classList.add("found");
      b.addEventListener("click",function(){tap(r,c)});
      g.appendChild(b);
    })(r,c);
  }
}
function updStats(){
  $("stFound").textContent=found.length+"/"+L.words.length;
  var e=$("stErr");e.textContent=errors;
  e.className="val"+(errors>0?" bad":"");
}
function tap(r,c){
  if(done)return;
  if(!start){start=[r,c];renderGrid();say("再点终点字圈出词");return;}
  if(start[0]===r&&start[1]===c){start=null;renderGrid();say("取消起点，重新选");return;}
  judge(start,r,c);
  start=null;
  renderGrid();
}
function judge(a,b){
  var dr=0,dc=0;
  if(b[0]!==a[0]&&b[1]!==a[1]){
    if(b[0]-a[0]!==b[1]-a[1]||b[0]-a[0]<0){failLine(a,b);return;}
    dr=1;dc=1;
  }else if(b[0]===a[0]&&b[1]===a[1]){failLine(a,b);return;}
  else if(b[0]===a[0]){dr=0;dc=1;if(b[1]<a[1]){failLine(a,b);return;}}
  else{dr=1;dc=0;if(b[0]<a[0]){failLine(a,b);return;}}
  var len=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1])+1;
  var str="";
  var cells=[];
  for(var k=0;k<len;k++)cells.push([a[0]+dr*k,a[1]+dc*k]);
  for(var k2=0;k2<cells.length;k2++)str+=L.grid[cells[k2][0]][cells[k2][1]];
  var hit=null;
  for(var i=0;i<L.words.length;i++){
    var w=L.words[i];
    if(found.indexOf(w.w)>=0)continue;
    if(w.w===str){
      var dc2=DIRS[w.d][1];
      if(w.r===a[0]&&w.c===a[1]&&cells[cells.length-1][0]===w.r+DIRS[w.d][0]*(w.w.length-1)&&cells[cells.length-1][1]===w.c+DIRS[w.d][1]*(w.w.length-1)){hit=w;break;}
    }
  }
  if(hit){
    found.push(hit.w);
    say("找到了「"+hit.w+"」！");
    renderWords();updStats();
    if(found.length===L.words.length)winLevel();
  }else{
    errors++;updStats();
    failLine(a,b);
    say("这条线上没有未找到的主题词（注意方向只能是 → ↓ ↘）");
  }
}
function failLine(a,b){
  var g=$("grid").children;
  var dr=Math.sign(b[0]-a[0]),dc=Math.sign(b[1]-a[1]);
  var len=Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]))+1;
  for(var k=0;k<len;k++){
    var rr=a[0]+dr*k,cc=a[1]+dc*k;
    if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS){
      var idx=rr*COLS+cc;
      g[idx].classList.add("shake");
      (function(el){setTimeout(function(){el.classList.remove("shake")},400)})(g[idx]);
    }
  }
}
function winLevel(){
  done=true;
  if(lv<LEVELS.length-1){save.lv=Math.max(save.lv,lv+1);persist();}
  if(GB.available)GB.reportScore(GAME_KEY,{metricValue:lv+1,metricExtra:errors}).catch(function(){});
  $("ovTitle").textContent=(lv>=LEVELS.length-1)?"全部通关！":"全部找到！";
  $("ovDesc").innerHTML="失误 "+errors+" 次"+(errors===0?"（火眼金睛）":"")+(lv<LEVELS.length-1?"<br>已解锁第 "+(lv+2)+" 关":"<br>40 关全部完成");
  $("ovBtn").textContent=(lv>=LEVELS.length-1)?"回到第 1 关":"下一关";
  $("overlay").classList.add("show");
}
function openLevelSelect(){
  var g=$("lvgrid");g.hidden=false;
  g.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var b=document.createElement("button");
      b.className="lvbtn"+(i<save.lv?" done":"");
      b.textContent=i+1;
      b.disabled=i>save.lv;
      b.addEventListener("click",function(){
        lv=i;save.lv=Math.max(save.lv,lv);persist();
        loadLevel(lv);$("overlay").classList.remove("show");
      });
      g.appendChild(b);
    })(i);
  }
  $("ovTitle").textContent="选择关卡";
  $("ovDesc").textContent="已通关的关卡会标绿";
  $("ovBtn").textContent="取消";
  $("overlay").classList.add("show");
}
$("btnReset").addEventListener("click",function(){loadLevel(lv);say("本关已重开")});
$("btnLv").addEventListener("click",openLevelSelect);
$("ovBtn").addEventListener("click",function(){
  $("overlay").classList.remove("show");
  if(lv>=LEVELS.length-1){lv=0;save.lv=0;persist();loadLevel(0)}
  else{lv++;loadLevel(lv)}
});
window.addEventListener("keydown",function(e){
  if($("overlay").classList.contains("show")){
    if(e.key==="Enter"){$("ovBtn").click();e.preventDefault();}
    return;
  }
  if(e.key==="ArrowLeft"){cur[1]=Math.max(0,cur[1]-1);renderGrid();e.preventDefault();}
  else if(e.key==="ArrowRight"){cur[1]=Math.min(COLS-1,cur[1]+1);renderGrid();e.preventDefault();}
  else if(e.key==="ArrowUp"){cur[0]=Math.max(0,cur[0]-1);renderGrid();e.preventDefault();}
  else if(e.key==="ArrowDown"){cur[0]=Math.min(ROWS-1,cur[0]+1);renderGrid();e.preventDefault();}
  else if(e.key==="Enter"){tap(cur[0],cur[1]);e.preventDefault();}
  else if(e.key==="r"||e.key==="R"){loadLevel(lv);say("本关已重开")}
});
/* ---------- 启动 ---------- */
loadLevel(save.lv);
var badLv=auditAll();
if(!LEVELS.length)say("警告：关卡生成失败");
else if(badLv.length)say("警告：内嵌验证器发现异常关卡 "+badLv.join(","));
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
