<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>单词搜索</title>
<style>
  :root { --g-bg:#F5F6F3;--g-surface:#FFFFFF;--g-surface2:#EFF1EE;--g-primary:#2D9B6A;--g-primary-deep:#17734A;--g-btn-primary:#17734A;--g-primary-soft:#E8F6EF;--g-on-soft:#0B3625;--g-on-primary:#FFFFFF;--g-text:#1C1C1E;--g-muted:#6B6E73;--g-faint:#A9AEA9;--g-border:#E6E9E6;--g-danger:#A83850;--g-warning:#9A6210;--g-success:#17734A;--g-water:#4A9FD4;--g-scrim:rgba(245,246,243,.9);--g-shadow:0 2px 12px rgba(20,40,30,.05);--g-radius:16px;--g-radius-btn:14px;--g-radius-inner:12px;--g-gap:16px;--g-ws-board:#EDF2EC;--g-ws-board-hi:#F8FAF7;--g-ws-cell:#FFFFFF;--g-ws-cell-hi:#FFFFFF;--g-ws-cell-alt:#EFF3EE;--g-ws-groove:#C3CEC3;--g-ws-num1:#E8F6EF;--g-ws-num2:#17734A;--g-ws-num-ink:#FFFFFF;--g-ws-c1:#17734A;--g-ws-c2:#1A6196;--g-ws-c3:#8F5A0C;--g-ws-c4:#6247B8;--g-ws-shadow:rgba(20,40,30,.18);color-scheme:light }
  :root[data-theme=dark] { --g-bg:#141614;--g-surface:#1D201E;--g-surface2:#262A27;--g-primary-deep:#5BC894;--g-primary-soft:#1D3229;--g-on-soft:#B9E8CF;--g-text:#E6E9E6;--g-muted:#A9AEA9;--g-faint:#7E837D;--g-border:#2C312D;--g-danger:#DB7186;--g-warning:#E2A44E;--g-success:#4ADE6E;--g-water:#6BB4DE;--g-scrim:rgba(20,22,20,.9);--g-shadow:0 2px 12px rgba(0,0,0,.28);--g-ws-board:#0D110D;--g-ws-board-hi:#1A1F1A;--g-ws-cell:#242824;--g-ws-cell-hi:#303530;--g-ws-cell-alt:#20241F;--g-ws-groove:#414941;--g-ws-num1:#1D3229;--g-ws-num2:#5BC894;--g-ws-num-ink:#0B241A;--g-ws-c1:#5BC894;--g-ws-c2:#6BB4DE;--g-ws-c3:#E2A44E;--g-ws-c4:#A48AE8;--g-ws-shadow:rgba(0,0,0,.40);color-scheme:dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--g-bg); color: var(--g-text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 30px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; gap: 8px; }
  .sub { font-size: 14px; color: var(--g-muted); line-height: 1.4; text-align: right; }
  /* 关卡标签 = 品牌 soft 底 + deep 字，前缀内联「字砖」图标（照 hex-fill .lvtag 范式） */
  .lvtag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 10px; background: var(--g-primary-soft); color: var(--g-primary-deep); font-size: 14px; font-weight: 600; line-height: 1.4; }
  .lvtag .swi { width: 14px; height: 14px; flex: none; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat { min-width: 0; padding: 6px 4px; background: var(--g-surface2); border-radius: var(--g-radius-inner); text-align: center; line-height: 1.3; animation: rise .38s ease-out both; }
  .stat:nth-child(2) { animation-delay: 40ms; }
  .stat:nth-child(3) { animation-delay: 80ms; }
  .stat .label { display: block; font-size: 12px; color: var(--g-muted); }
  .stat .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g-primary-deep); }
  .stat .val.bump { animation: bump .2s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .stage { position: relative; animation: fadein .3s ease-out both; }
  canvas { display: block; width: 100%; height: auto; margin: 0 auto; touch-action: none; border-radius: var(--g-radius-inner); box-shadow: var(--g-shadow); }
  .legend { display: flex; gap: 8px; margin: 10px 2px 0; animation: rise .38s ease-out both; animation-delay: 120ms; }
  .lg-chip { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 5px 8px; background: var(--g-surface2); border-radius: 10px; font-size: 12px; color: var(--g-muted); line-height: 1.3; }
  .lg-chip b { color: var(--g-text); font-weight: 600; }
  .lg-chip .lg-tile { flex: none; width: 22px; height: 22px; }
  .lg-chip .lg-tile svg { display: block; width: 100%; height: 100%; }
  .msg { min-height: 20px; margin: 10px 2px; font-size: 14px; color: var(--g-muted); text-align: center; }
  .sec { font-size: 12px; color: var(--g-muted); margin: 12px 2px 6px; }
  .wordlist { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  /* 词卡 = 一张待翻的「字砖」：顶光 + 落地投影；找到后翻成品牌软底并划掉 */
  .chip {
    min-height: 44px; padding: 5px 10px; border: 0; border-radius: var(--g-radius-inner);
    background: var(--g-surface); color: var(--g-text); font: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25;
    box-shadow: inset 0 1px 0 var(--g-ws-cell-hi), 0 1px 3px var(--g-ws-shadow);
    transition: transform .14s ease-out, background .16s ease-out, box-shadow .16s ease-out, color .16s ease-out;
  }
  .chip:active { transform: scale(.96); }
  .chip b { font-size: 16px; font-weight: 600; }
  .chip i { font-style: normal; font-size: 12px; color: var(--g-muted); }
  .chip.ok { background: var(--g-primary-soft); color: var(--g-on-soft); box-shadow: inset 0 0 0 1px var(--g-primary-deep), 0 1px 2px var(--g-ws-shadow); }
  .chip.ok i { color: var(--g-on-soft); opacity: .75; }
  .chip.ok b { text-decoration: line-through; }
  .chip.jump { animation: bump .2s ease-out; }
  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn {
    min-height: 44px; padding: 0 12px; flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: var(--g-radius-btn); background: var(--g-surface2); color: var(--g-text);
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .14s ease-out, opacity .16s ease-out, background .16s ease-out;
  }
  .btn .swi { width: 18px; height: 18px; flex: none; }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .35; }
  .btn.primary { background: var(--g-btn-primary); color: var(--g-on-primary); font-size: 16px; font-weight: 600; }
  .foot { margin: 12px 2px 0; font-size: 12px; color: var(--g-muted); text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--g-scrim);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadein .2s ease-out; }
  .panel {
    width: 100%; max-width: 320px; padding: 22px 18px;
    background: var(--g-surface); border-radius: var(--g-radius);
    box-shadow: var(--g-shadow); text-align: center;
    animation: pop .25s ease-out;
  }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel .desc { margin: 0 0 16px; font-size: 14px; color: var(--g-muted); line-height: 1.6; }
  .panel .desc b { color: var(--g-primary-deep); font-size: 22px; }
  .panel .btn { width: 100%; margin-bottom: 8px; }
  .panel .btn:last-child { margin-bottom: 0; }

  /* S2: 动效降级——保留状态切换，压平装饰动效（动效层指令，不受 §4 主题层禁令约束） */
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important} }

  /* P2: 键盘焦点可见（S5） */
  :focus-visible{outline:2px solid var(--g-primary-deep);outline-offset:2px}
</style>

<script>
//主题运行时:GAME-THEME.md§4(桥唯一控制,无桥恒浅色)
(function(){
var R=document.documentElement,B=null;
function paint(m){R.dataset.theme=m;var c=document.querySelector('meta[name=theme-color]');
  if(c)c.content=getComputedStyle(R).getPropertyValue("--g-bg").trim();
  try{window.__gOnTheme(m)}catch(e){}}
window.__applySmartWashTheme=function(m){if(m==="light"||m==="dark"){B=m;paint(m)}};//App推送
try{var t=SmartWashGameBridge&&SmartWashGameBridge.getTheme();if(t==="light"||t==="dark")B=t}catch(e){}
window.__gRM=(function(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();try{var __rmq=matchMedia("(prefers-reduced-motion: reduce)");(__rmq.addEventListener||__rmq.addListener).call(__rmq,function(e){window.__gRM=e.matches&&true;try{window.__gOnTheme&&__gOnTheme()}catch(x){}})}catch(e){};paint(B||"light");
})();
</script>

<script>
(function(){
"use strict";
/* ========== 游戏桥适配层（存档/关卡/成绩，无桥自动降级 localStorage） ========== */
var GB=(function(){
  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;
      if(!bridge||typeof bridge[method]!=="function"){reject(new Error("桥不可用"));return;}
      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},
    reportScore:function(gameKey,obj){return call("reportScore",[gameKey,JSON.stringify(obj||{})]);},
    getLeaderboard:function(gameKey,limit){return call("getLeaderboard",[gameKey,limit||20]);},
    getLevels:function(gameKey){return call("getLevels",[gameKey]);}
  };
})();
/* ---------- 调色板：全部经 CSS 变量读取，JS 零颜色字面量 ---------- */
var PAL={};
function palLoad(){
  var s=getComputedStyle(document.documentElement);
  function v(n){return s.getPropertyValue(n).trim()}
  PAL={bg:v("--g-bg"),surface:v("--g-surface"),surface2:v("--g-surface2"),border:v("--g-border"),
    text:v("--g-text"),muted:v("--g-muted"),faint:v("--g-faint"),
    primary:v("--g-primary"),deep:v("--g-primary-deep"),soft:v("--g-primary-soft"),onSoft:v("--g-on-soft"),
    success:v("--g-success"),water:v("--g-water"),warning:v("--g-warning"),danger:v("--g-danger"),
    board:v("--g-ws-board"),boardHi:v("--g-ws-board-hi"),cell:v("--g-ws-cell"),cellHi:v("--g-ws-cell-hi"),
    cellAlt:v("--g-ws-cell-alt"),groove:v("--g-ws-groove"),shadow:v("--g-ws-shadow"),
    num2:v("--g-ws-num2"),numInk:v("--g-ws-num-ink"),
    c1:v("--g-ws-c1"),c2:v("--g-ws-c2"),c3:v("--g-ws-c3"),c4:v("--g-ws-c4")};
}
window.__gOnTheme=function(){palLoad()};//App 推送主题时刷新调色板，rAF 循环自动重绘
/* ---------- 颜色工具：仅由 PAL 色值混合出明暗，JS 内零颜色字面量 ---------- */
var BLACK="rgb(0,0,0)",WHITE="rgb(255,255,255)";   // 恒暗 / 恒白（阴影与高光）
function colParse(c){
  c=String(c).trim();
  if(c.charAt(0)==="#")c=c.slice(1);
  if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length===6)return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  var m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m?[+m[1],+m[2],+m[3]]:[0,0,0];
}
function colMix(a,b,t){
  var A=colParse(a),B=colParse(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function colShade(c,t){return colMix(c,t<0?BLACK:WHITE,t<0?-t:t)}

var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY="sw.wordsearch.v1.levels",LEVELS_VER_KEY="sw.wordsearch.v1.levels.ver";
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}

/* 单关数据校验（DB 下发逐条复核；任一条非法整批放弃） */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return null;
  if(typeof d.name!=="string"||!d.name.length||d.name.length>32)return null;
  var size=d.size;
  if(!Number.isInteger(size)||size<6||size>12)return null;
  if(typeof d.grid!=="string"||[...d.grid].length!==size*size)return null;
  var g=[...d.grid],dirs={E:[1,0],S:[0,1],W:[-1,0],N:[0,-1],SE:[1,1],SW:[-1,1],NE:[1,-1],NW:[-1,-1]};
  if(!Array.isArray(d.words)||d.words.length<2||d.words.length>12)return null;
  var out=[],seen=new Set();
  for(var i=0;i<d.words.length;i++){
    var w=d.words[i];
    if(!Array.isArray(w)||w.length!==5)return null;
    var text=String(w[0]),clue=String(w[1]),dir=String(w[2]),x=w[3],y=w[4];
    if([...text].length<2||[...text].length>6)return null;
    if(!clue.length||[...clue].length>40)return null;
    if(!dirs[dir])return null;
    if(!Number.isInteger(x)||!Number.isInteger(y))return null;
    if(seen.has(text))return null;
    seen.add(text);
    var dx=dirs[dir][0],dy=dirs[dir][1];
    if(x<0||y<0||x>=size||y>=size)return null;
    if(x+dx*(text.length-1)<0||y+dy*(text.length-1)<0||x+dx*(text.length-1)>=size||y+dy*(text.length-1)>=size)return null;
    var tw=[...text];
    for(var k=0;k<tw.length;k++)if(g[(y+dy*k)*size+(x+dx*k)]!==tw[k])return null;
    out.push([text,clue,dir,x,y]);
  }
  return {name:d.name,size:size,words:out,grid:g};
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[];
  for(var i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item.dataJson!=="string")return null;
    var d;try{d=JSON.parse(item.dataJson);}catch(e){return null;}
    var v=validLevelData(d);
    if(!v)return null;
    list.push(v);
  }
  return list;
}
function syncLevelsFromServer(){
  if(!GB.available||!GB.getLevels)return;   // 无桥：用默认/缓存关卡
  GB.getLevels("word-search").then(function(res){
    var list=parseDbLevels(res);
    if(list&&applyLevels(list,res.version||0)){
      if(cur>=LEVELS.length)cur=LEVELS.length-1;
      startLevel(cur);
    }
  }).catch(function(){});
}

var KEY="sw.wordsearch.v1";
function loadSave(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&typeof s==="object")return{lv:Math.max(0,parseInt(s.lv,10)||0),done:s.done||{},hints:s.hints||{}};
  }catch(e){}
  return {lv:0,done:{},hints:{}};
}
var saveData=loadSave();
var doneSave=saveData.done,hintsSave=saveData.hints;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({lv:cur,done:doneSave,hints:hintsSave}))}catch(e){}
  if(GB.available)GB.saveState("word-search",{lv:cur,done:doneSave,hints:hintsSave}).catch(function(){});
}
function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("word-search").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=Math.max(0,parseInt(r.lv,10)||0);
      if(rl>saveData.lv){saveData.lv=Math.min(LEVELS.length-1,rl);changed=true;}
      if(r.done&&typeof r.done==="object"){
        for(var k in r.done){
          if(!Array.isArray(r.done[k]))continue;
          var mine=doneSave[k]||(doneSave[k]=[]);
          for(var i=0;i<r.done[k].length;i++){
            var w=parseInt(r.done[k][i],10);
            if(w>=0&&mine.indexOf(w)<0){mine.push(w);changed=true}
          }
        }
      }
      if(r.hints&&typeof r.hints==="object"){
        for(var hk in r.hints){
          var hv=parseInt(r.hints[hk],10);
          if(hv>=0&&(parseInt(hintsSave[hk],10)||0)<hv){hintsSave[hk]=hv;changed=true}
        }
      }
      if(changed){save();startLevel(Math.min(saveData.lv,LEVELS.length-1));}
    }catch(e){}
  }).catch(function(){});
}

function startLevel(n){

  cur=n;L=LEVELS[n];N=L.size;gridChars=L.grid;wordList=L.words;
  $("lvTagText").textContent="第 "+(n+1)+" 关";
  maxLen=0;for(var i=0;i<wordList.length;i++)maxLen=Math.max(maxLen,[...wordList[i][0]].length);
  found=wordList.map(function(){return null});
  var saved=doneSave[n];
  if(Array.isArray(saved))for(var j=0;j<saved.length;j++){
    var wi=saved[j];
    if(wi>=0&&wi<wordList.length)found[wi]={cells:pathOf(wi),color:FOUND_COLORS[wi%FOUND_COLORS.length]};
  }
  hintsLeft=parseInt(hintsSave[n],10);
  if(!(hintsLeft>=0))hintsLeft=3;
  completed=false;tapAnchor=null;dragging=false;moved=false;dragStart=null;dragCur=null;currentSel=null;

function pathOf(wi){
  var w=wordList[wi],d=DIRS[w[2]],cells=[];
  for(var k=0;k<[...w[0]].length;k++)cells.push({c:w[3]+d[0]*k,r:w[4]+d[1]*k});
  return cells;
}
function updateStats(){

  var cnt=0;for(var i=0;i<found.length;i++)if(found[i])cnt++;

function renderChips(){

/* ---------- 选择与判定 ---------- */
function cellFromPoint(x,y){
  if(!L)return null;
  var c=Math.floor((x-lay.bx)/lay.cell),r=Math.floor((y-lay.by)/lay.cell);
  if(c<0||r<0||c>=N||r>=N)return null;
  return {c:c,r:r};
}
function snapPath(a,b){
  var dx=b.c-a.c,dy=b.r-a.r;
  if(!dx&&!dy)return null;
  var ang=Math.atan2(dy,dx),best=null,bd=1e9;
  for(var code in ANG){
    var da=Math.abs(((ang-ANG[code]+Math.PI*3)%(Math.PI*2))-Math.PI);
    if(da<bd){bd=da;best=code}
  }
  if(bd>Math.PI/8+0.02)return null;
  var ux=DIRS[best][0],uy=DIRS[best][1];
  var steps=(ux&&uy)?Math.round((dx*ux+dy*uy)/2):Math.round(dx*ux+dy*uy);
  if(steps>maxLen)steps=maxLen;
  if(steps<1)return null;
  var cells=[];
  for(var k=0;k<=steps;k++){
    var c=a.c+ux*k,r=a.r+uy*k;
    if(c<0||r<0||c>=N||r>=N)return null;
    cells.push({c:c,r:r});
  }
  return cells;
}
function stringOf(cells){
  var s="";
  for(var i=0;i<cells.length;i++)s+=gridChars[cells[i].r*N+cells[i].c];
  return s;
}
function tryPath(path){
  if(!path||path.length<2){say("请从首字拖到末字");return}
  var s=stringOf(path),hit=-1;
  for(var i=0;i<wordList.length;i++){
    if(found[i])continue;
    var wt=wordList[i][0];
    if(wt===s||(!/[一-鿿]/.test(wt)&&wt.toLowerCase()===s.toLowerCase())){hit=i;break}
  }
  if(hit>=0){
    var color=FOUND_COLORS[hit%FOUND_COLORS.length];
    found[hit]={cells:path,color:color};
    foundFx.push({cells:path,color:color,ts:performance.now()});
    (doneSave[cur]=doneSave[cur]||[]).push(hit);
    renderChips();updateStats();save();
    var chips=$("wordlist").children;
    if(chips[hit]){chips[hit].classList.remove("jump");void chips[hit].offsetWidth;chips[hit].classList.add("jump")}
    if(found.every(Boolean))completeLevel();
    else say("找到了「"+wordList[hit][0]+"」！");
  }else{
    badFx={cells:path,ts:performance.now()};
    say("「"+s+"」不是本关词语，再看看");
  }
}
function hintWord(wi){
  if(completed)return;
  if(found[wi]){say("「"+wordList[wi][0]+"」已经找到了");return}
  if(hintsLeft<=0){say("本关提示次数用完了");return}
  hintsLeft--;hintsSave[cur]=hintsLeft;save();updateStats();
  hintAnim={cells:pathOf(wi),until:performance.now()+1600};
  say("「"+wordList[wi][0]+"」的位置已标出");
}
function completeLevel(){
  completed=true;

/* ---------- 指针交互 ---------- */
function evCell(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",function(e){
  if(completed||!L)return;
  var p=evCell(e),cell=cellFromPoint(p.x,p.y);
  if(!cell)return;
  dragging=true;moved=false;dragStart=cell;dragCur=cell;currentSel=null;
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();draw();
});
cv.addEventListener("pointermove",function(e){
  if(!dragging||completed)return;
  var p=evCell(e),cell=cellFromPoint(p.x,p.y);
  if(!cell)return;
  dragCur=cell;
  if(cell.c!==dragStart.c||cell.r!==dragStart.r)moved=true;
  currentSel=snapPath(dragStart,cell);
  draw();
});
cv.addEventListener("pointerup",function(e){
  if(!dragging)return;
  dragging=false;
  var p=evCell(e),cell=cellFromPoint(p.x,p.y);
  if(completed){currentSel=null;draw();return}
  if(cell&&moved&&currentSel){tryPath(currentSel);tapAnchor=null;currentSel=null;draw();return}
  if(!cell){tapAnchor=null;currentSel=null;draw();return}
  if(tapAnchor&&(tapAnchor.c!==cell.c||tapAnchor.r!==cell.r)){
    var tp=snapPath(tapAnchor,cell);
    if(tp)tryPath(tp);else say("两点不在同一直线上");
    tapAnchor=null;currentSel=null;
  }else if(tapAnchor){
    tapAnchor=null;say("已取消起点");
  }else{
    tapAnchor=cell;say("起点已选定，再点结尾字确定方向");
  }
  draw();
});
cv.addEventListener("pointercancel",function(){
  dragging=false;currentSel=null;tapAnchor=null;draw();
});
/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function fontFor(fs){return "600 "+fs+"px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif"}
function strokePath(cells,widthFactor,color,alpha){
  if(!cells||cells.length<2)return;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=lay.cell*widthFactor;
  ctx.strokeStyle=PAL[color];
  ctx.beginPath();
  for(var i=0;i<cells.length;i++){
    var x=lay.bx+(cells[i].c+0.5)*lay.cell,y=lay.by+(cells[i].r+0.5)*lay.cell;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
}
/* 字砖：可点可辨的「面」+ 顶光 + 砖沟 + 落地投影（替代原细线表格） */
function drawTile(x,y,idx,scale,selected,anchored,ink){

  else if(ink){g.addColorStop(0,colMix(base,WHITE,0.12));g.addColorStop(0.55,base);g.addColorStop(1,colShade(base,-0.12))}

  ctx.restore();
  ctx.lineWidth=1;ctx.strokeStyle=selected?PAL.numInk:(ink?colShade(base,-0.3):PAL.groove);
  rr(px+0.5,py+0.5,w*s-1,w*s-1,Math.min(10,lay.cell*0.2));ctx.stroke();
  if(selected){  // 目标态：恒白内高光点，与深底区分
    ctx.fillStyle="rgba(255,255,255,0.16)";   // 恒白高光
    ctx.beginPath();ctx.arc(px+w*s*0.32,py+w*s*0.3,Math.max(1.2,w*s*0.07),0,Math.PI*2);ctx.fill();
  }
  if(ink){  // 轨迹态：顶部恒白高光条，与未找到的素砖区分
    ctx.fillStyle="rgba(255,255,255,0.42)";   // 恒白高光
    rr(px+w*s*0.18,py+w*s*0.14,w*s*0.64,w*s*0.10,Math.min(4,w*s*0.05));ctx.fill();
  }
  if(anchored){  // 起点：品牌深绿环 + 恒白衬底（该点哪一眼可读）
    ctx.lineWidth=Math.max(2.5,lay.cell*0.1);ctx.strokeStyle="rgba(255,255,255,0.92)";   // 恒白衬底
    rr(px-2.5,py-2.5,w*s+5,w*s+5,Math.min(10,lay.cell*0.2)+2.5);ctx.stroke();
    ctx.lineWidth=Math.max(1.8,lay.cell*0.06);ctx.strokeStyle=PAL.deep;
    rr(px-2.5,py-2.5,w*s+5,w*s+5,Math.min(10,lay.cell*0.2)+2.5);ctx.stroke();
  }
}
/* 入场：逐格错位淡入；错位总量设上限（总时长 ≤600ms，按格子数均摊，大棋盘不拖尾） */
var ENTER_FADE=260,ENTER_BUDGET=340,ENTER_MAX_STEP=34;
function tileEnter(idx,t){
  if(!lay.enterT)return 1;
  var step=Math.min(ENTER_MAX_STEP,Math.floor(ENTER_BUDGET/Math.max(1,N*N)));
  var p=(t-lay.enterT-idx*step)/ENTER_FADE;
  if(p>=1)return 1;
  if(p<=0||window.__gRM)return 0;
  var e=1-Math.pow(1-p,2);
  return e;
}
function draw(){
  if(!L||!lay.W)return;
  var w=lay.W,i,j;
  ctx.clearRect(0,0,w,w);
  ctx.fillStyle=PAL.board;ctx.fillRect(0,0,w,w);
  /* 棋盘「面」：顶光渐变 + 2px 沟槽外框 */
  var bg=ctx.createLinearGradient(0,0,0,w);
  bg.addColorStop(0,PAL.boardHi);bg.addColorStop(1,PAL.board);
  ctx.fillStyle=bg;rr(1,1,w-2,w-2,12);ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle=PAL.groove;rr(2,2,w-4,w-4,10);ctx.stroke();
  // 轨迹态：已找到的词 → 路径上每块字砖染成该词色（面级色带）
  var inked={};
  for(i=0;i<found.length;i++)if(found[i]){
    var wc=PAL[found[i].color];
    for(j=0;j<found[i].cells.length;j++){
      var cc=found[i].cells[j];inked[cc.r*N+cc.c]=wc;
    }
  }
  var t=performance.now();
  // 字砖层：先铺不透明砖面（轨迹层随后叠在砖面之上）
  for(i=0;i<N;i++)for(j=0;j<N;j++){
    var idx=i*N+j;
    var e=tileEnter(idx,t);
    if(e<=0)continue;
    var sel=currentSel?currentSel.some(function(q){return q.c===j&&q.r===i}):false;
    var anch=!!(tapAnchor&&tapAnchor.c===j&&tapAnchor.r===i);
    drawTile(lay.bx+j*lay.cell,lay.by+i*lay.cell,idx,Math.max(.6,e),sel,anch,inked[idx]);
  }
  // 轨迹层：画在字砖之上、字符之下，保证提示/错误/选中/找到闪光可见
  var now=performance.now();
  foundFx=foundFx.filter(function(f){return now-f.ts<400});
  for(i=0;i<foundFx.length;i++){
    var k=(now-foundFx[i].ts)/400;
    strokePath(foundFx[i].cells,0.62,"numInk",0.45*(1-k));
  }
  if(hintAnim){
    if(now>hintAnim.until)hintAnim=null;
    else{
      var pulse=0.28+0.18*Math.sin(now/90);
      strokePath(hintAnim.cells,0.9,"numInk",pulse);   // 恒底衬环：跨色带仍可辨
      strokePath(hintAnim.cells,0.66,"warning",pulse);
    }
  }
  if(badFx){
    if(now-badFx.ts>350)badFx=null;
    else{
      var ba=0.45*(1-(now-badFx.ts)/350);
      strokePath(badFx.cells,0.78,"numInk",ba);
      strokePath(badFx.cells,0.56,"danger",ba);
    }
  }
  if(currentSel)strokePath(currentSel,0.62,"numInk",0.4);
  // 字符层：最后画，压在所有轨迹之上
  for(i=0;i<N;i++)for(j=0;j<N;j++){
    var idx2=i*N+j;
    var e2=tileEnter(idx2,t);
    if(e2<=0)continue;
    var sel2=currentSel?currentSel.some(function(q){return q.c===j&&q.r===i}):false;
    ctx.globalAlpha=e2;
    ctx.font=fontFor(lay.fs);
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle=(sel2||inked[idx2])?PAL.numInk:PAL.text;
    ctx.fillText(gridChars[idx2],lay.bx+(j+0.5)*lay.cell,lay.by+(i+0.5)*lay.cell);
    ctx.globalAlpha=1;
  }
}
/* ---------- 主循环与尺寸 ---------- */
function loop(){draw();requestAnimationFrame(loop)}
function resize(){
  var w=stageEl.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  lay.W=w;
  var pad=Math.max(4,Math.round(w*0.02));
  lay.bx=pad;lay.by=pad;
  lay.bs=w-pad*2;
  lay.cell=N?lay.bs/N:0;
  lay.fs=Math.max(12,Math.min(28,Math.round(lay.cell*0.44)));
  cv.style.height=w+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function showOverlay(){$("overlay").classList.add("show")}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 按钮 ---------- */
$("btnHint").addEventListener("click",function(){
  if(completed)return;
  var wi=-1;
  for(var i=0;i<wordList.length;i++)if(!found[i]){wi=i;break}
  if(wi<0)return;
  hintWord(wi);
});
$("btnReset").addEventListener("click",function(){
  delete hintsSave[cur];doneSave[cur]=[];
  startLevel(cur);say("本关已重置");
});
$("ovNext").addEventListener("click",function(){
  startLevel(cur<LEVELS.length-1?cur+1:0);
});
$("ovReplay").addEventListener("click",function(){
  delete hintsSave[cur];doneSave[cur]=[];
  startLevel(cur);
});
window.addEventListener("resize",resize);
/* ---------- 启动 ---------- */
palLoad();
$("lvTagIco").innerHTML=window.SW_ICON("tile");
$("btnHint").insertAdjacentHTML("afterbegin",window.SW_ICON("hint"));
$("btnReset").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
$("ovNext").insertAdjacentHTML("afterbegin",window.SW_ICON("play"));
$("ovReplay").insertAdjacentHTML("afterbegin",window.SW_ICON("rotate"));
startLevel(Math.min(saveData.lv,LEVELS.length-1));
resize();loop();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
<script>
/* 覆盖层焦点管理（dialog 语义配套）：显示时记录触发元素并聚焦首个可操作项；Tab 在层内循环；隐藏后归还焦点 */
(function(){
  var els=document.querySelectorAll(".overlay, .sheet");
  if(!els.length)return;
  function shown(el){return !!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)}
  var lastFocus=null;
  function focusFirst(el){
    if(el.dataset.foc)return;el.dataset.foc="1";
    if(!lastFocus)lastFocus=document.activeElement;
    var t=el.querySelector("button,input,select,textarea,[tabindex]");if(t)t.focus();
  }
  function restore(el){
    if(!el.dataset.foc)return;delete el.dataset.foc;
    if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
  }
  function trap(el,e){
    if(e.key!=="Tab")return;
    var f=el.querySelectorAll("button,input,select,textarea,[tabindex]");
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
  function watch(el){
    try{new MutationObserver(function(){
      if(shown(el))focusFirst(el);else restore(el);
    }).observe(el,{attributes:true,attributeFilter:["class","style","hidden"]})}catch(e){}
    el.addEventListener("keydown",function(e){trap(el,e)});
  }
  for(var i=0;i<els.length;i++){watch(els[i]);if(shown(els[i]))focusFirst(els[i]);}
})();
</script>
