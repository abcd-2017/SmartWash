  var pending={},seq=0;
  window.__gOnGameBridgeResult=function(cbId,ok,payload){
    var cb=pending[cbId];if(!cb)return;
    delete pending[cbId];
    try{ok?cb.resolve(payload):cb.reject(new Error(typeof payload==="string"?payload:"桥调用失败"));}catch(e){}
  };
  function call(method,args){
    return new Promise(function(resolve,reject){
      var bridge=window.SmartWashGameBridge;

      var cbId="gb"+Date.now()+"_"+(++seq);
      pending[cbId]={resolve:resolve,reject:reject};
      try{bridge[method].apply(bridge,args.concat([cbId]));}
      catch(e){delete pending[cbId];reject(e);}
    });
  }
  return {
    available:!!window.SmartWashGameBridge,
    loadState:function(gameKey){return call("loadState",[gameKey]);},
    saveState:function(gameKey,obj){return call("saveState",[gameKey,JSON.stringify({stateJson:JSON.stringify(obj||{}),schemaVer:1})]);},

var LEVELS=DEFAULT_LEVELS;
var LEVELS_KEY="sw.wordsearch.v1.levels",LEVELS_VER_KEY="sw.wordsearch.v1.levels.ver";
function applyLevels(list,version){
  if(!Array.isArray(list)||!list.length)return false;
  LEVELS=list;
  try{localStorage.setItem(LEVELS_KEY,JSON.stringify(list));localStorage.setItem(LEVELS_VER_KEY,String(version||0));}catch(e){}
  return true;
}
function loadCachedLevels(){
  try{
    var v=parseInt(localStorage.getItem(LEVELS_VER_KEY),10)||0;
    var list=JSON.parse(localStorage.getItem(LEVELS_KEY)||"null");
    if(Array.isArray(list)&&list.length){LEVELS=list;return v;}
  }catch(e){}
  return 0;
}
loadCachedLevels();
/* 单关数据校验（DB 下发逐条复核；任一条非法整批放弃） */
function validLevelData(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return null;
  if(typeof d.name!=="string"||!d.name.length||d.name.length>32)return null;
  var size=d.size;
  if(!Number.isInteger(size)||size<6||size>12)return null;
  if(typeof d.grid!=="string"||[...d.grid].length!==size*size)return null;
  var g=[...d.grid],dirs={E:[1,0],S:[0,1],W:[-1,0],N:[0,-1],SE:[1,1],SW:[-1,1],NE:[1,-1],NW:[-1,-1]};
  if(!Array.isArray(d.words)||d.words.length<2||d.words.length>12)return null;
  var out=[],seen=new Set();
  for(var i=0;i<d.words.length;i++){
    var w=d.words[i];
    if(!Array.isArray(w)||w.length!==5)return null;
    var text=String(w[0]),clue=String(w[1]),dir=String(w[2]),x=w[3],y=w[4];
    if([...text].length<2||[...text].length>6)return null;
    if(!clue.length||[...clue].length>40)return null;
    if(!dirs[dir])return null;
    if(!Number.isInteger(x)||!Number.isInteger(y))return null;
    if(seen.has(text))return null;
    seen.add(text);
    var dx=dirs[dir][0],dy=dirs[dir][1];
    if(x<0||y<0||x>=size||y>=size)return null;
    if(x+dx*(text.length-1)<0||y+dy*(text.length-1)<0||x+dx*(text.length-1)>=size||y+dy*(text.length-1)>=size)return null;
    var tw=[...text];
    for(var k=0;k<tw.length;k++)if(g[(y+dy*k)*size+(x+dx*k)]!==tw[k])return null;
    out.push([text,clue,dir,x,y]);
  }
  return {name:d.name,size:size,words:out,grid:g};
}
function parseDbLevels(res){
  if(!res||!Array.isArray(res.levels)||!res.levels.length)return null;
  var list=[];
  for(var i=0;i<res.levels.length;i++){
    var item=res.levels[i];
    if(!item||typeof item.dataJson!=="string")return null;
    var d;try{d=JSON.parse(item.dataJson);}catch(e){return null;}
    var v=validLevelData(d);
    if(!v)return null;
    list.push(v);
  }
  return list;
}

    if(list&&applyLevels(list,res.version||0)){
      if(cur>=LEVELS.length)cur=LEVELS.length-1;
      startLevel(cur);
    }
  }).catch(function(){});
}

function syncSaveFromServer(){
  if(!GB.available||!GB.loadState)return;
  GB.loadState("word-search").then(function(res){
    if(!res||!res.stateJson)return;
    try{
      var r=JSON.parse(res.stateJson),changed=false;
      var rl=Math.max(0,parseInt(r.lv,10)||0);
      if(rl>saveData.lv){saveData.lv=Math.min(LEVELS.length-1,rl);changed=true;}
      if(r.done&&typeof r.done==="object"){
        for(var k in r.done){
          if(!Array.isArray(r.done[k]))continue;
          var mine=doneSave[k]||(doneSave[k]=[]);
          for(var i=0;i<r.done[k].length;i++){
            var w=parseInt(r.done[k][i],10);
            if(w>=0&&mine.indexOf(w)<0){mine.push(w);changed=true}
          }
        }
      }
      if(r.hints&&typeof r.hints==="object"){
        for(var hk in r.hints){
          var hv=parseInt(r.hints[hk],10);
          if(hv>=0&&(parseInt(hintsSave[hk],10)||0)<hv){hintsSave[hk]=hv;changed=true}
        }
      }
      if(changed){save();startLevel(Math.min(saveData.lv,LEVELS.length-1));}
    }catch(e){}
  }).catch(function(){});
}

function startLevel(n){
  n=Math.max(0,Math.min(LEVELS.length-1,n));
  cur=n;L=LEVELS[n];N=L.size;gridChars=L.grid;wordList=L.words;
  maxLen=0;for(var i=0;i<wordList.length;i++)maxLen=Math.max(maxLen,[...wordList[i][0]].length);
  found=wordList.map(function(){return null});
  var saved=doneSave[n];
  if(Array.isArray(saved))for(var j=0;j<saved.length;j++){
    var wi=saved[j];
    if(wi>=0&&wi<wordList.length)found[wi]={cells:pathOf(wi),color:FOUND_COLORS[wi%FOUND_COLORS.length]};
  }
  hintsLeft=parseInt(hintsSave[n],10);
  if(!(hintsLeft>=0))hintsLeft=3;
  completed=false;tapAnchor=null;dragging=false;moved=false;dragStart=null;dragCur=null;currentSel=null;
  hintAnim=null;badFx=null;foundFx=[];startTime=Date.now();
  renderChips();updateStats();hideOverlay();
  resize();draw();
  say("第 "+(n+1)+" 关 · "+L.name+" · 找出 "+wordList.length+" 个词");
  save();
}
function pathOf(wi){
  var w=wordList[wi],d=DIRS[w[2]],cells=[];
  for(var k=0;k<[...w[0]].length;k++)cells.push({c:w[3]+d[0]*k,r:w[4]+d[1]*k});
  return cells;
}
function updateStats(){
  $("stLv").textContent=(cur+1)+"/"+LEVELS.length;
  var cnt=0;for(var i=0;i<found.length;i++)if(found[i])cnt++;
  $("stFound").textContent=cnt+"/"+wordList.length;
  $("stHint").textContent="×"+hintsLeft;
}
function renderChips(){
  var el=$("wordlist");el.innerHTML="";
  for(var i=0;i<wordList.length;i++){
    var b=document.createElement("button");
    b.className="chip"+(found[i]?" ok":"");
    b.setAttribute("data-i",String(i));
    b.innerHTML="<b>"+wordList[i][0]+"</b><i>"+wordList[i][1]+"</i>";
    (function(idx){
      b.addEventListener("click",function(){hintWord(idx)});
    })(i);
    el.appendChild(b);
  }
}
/* ---------- 选择与判定 ---------- */
function cellFromPoint(x,y){
  if(!L)return null;
  var c=Math.floor((x-lay.bx)/lay.cell),r=Math.floor((y-lay.by)/lay.cell);
  if(c<0||r<0||c>=N||r>=N)return null;
  return {c:c,r:r};
}
function snapPath(a,b){
  var dx=b.c-a.c,dy=b.r-a.r;
  if(!dx&&!dy)return null;
  var ang=Math.atan2(dy,dx),best=null,bd=1e9;
  for(var code in ANG){
    var da=Math.abs(((ang-ANG[code]+Math.PI*3)%(Math.PI*2))-Math.PI);
    if(da<bd){bd=da;best=code}
  }
  if(bd>Math.PI/8+0.02)return null;
  var ux=DIRS[best][0],uy=DIRS[best][1];
  var steps=(ux&&uy)?Math.round((dx*ux+dy*uy)/2):Math.round(dx*ux+dy*uy);
  if(steps>maxLen)steps=maxLen;
  if(steps<1)return null;
  var cells=[];
  for(var k=0;k<=steps;k++){
    var c=a.c+ux*k,r=a.r+uy*k;
    if(c<0||r<0||c>=N||r>=N)return null;
    cells.push({c:c,r:r});
  }
  return cells;
}
function stringOf(cells){
  var s="";
  for(var i=0;i<cells.length;i++)s+=gridChars[cells[i].r*N+cells[i].c];
  return s;
}
function tryPath(path){
  if(!path||path.length<2){say("请从首字拖到末字");return}
  var s=stringOf(path),hit=-1;
  for(var i=0;i<wordList.length;i++){
    if(found[i])continue;
    var wt=wordList[i][0];
    if(wt===s||(!/[一-鿿]/.test(wt)&&wt.toLowerCase()===s.toLowerCase())){hit=i;break}
  }
  if(hit>=0){
    var color=FOUND_COLORS[hit%FOUND_COLORS.length];
    found[hit]={cells:path,color:color};
    foundFx.push({cells:path,color:color,ts:performance.now()});
    (doneSave[cur]=doneSave[cur]||[]).push(hit);
    renderChips();updateStats();save();
    if(found.every(Boolean))completeLevel();
    else say("找到了「"+wordList[hit][0]+"」！");
  }else{
    badFx={cells:path,ts:performance.now()};
    say("「"+s+"」不是本关词语，再看看");
  }
}
function hintWord(wi){
  if(completed)return;
  if(found[wi]){say("「"+wordList[wi][0]+"」已经找到了");return}
  if(hintsLeft<=0){say("本关提示次数用完了");return}
  hintsLeft--;hintsSave[cur]=hintsLeft;save();updateStats();
  hintAnim={cells:pathOf(wi),until:performance.now()+1600};
  say("「"+wordList[wi][0]+"」的位置已标出");
}
function completeLevel(){
  completed=true;
  var sec=Math.round((Date.now()-startTime)/1000);
  $("ovDesc").innerHTML="用时 <b>"+sec+"</b> 秒 · 找到 <b>"+wordList.length+"</b> 个词<br>"+(cur<LEVELS.length-1?"继续保持，下一关更难！":"全部关卡通关，太厉害了！");
  $("ovNext").textContent=cur<LEVELS.length-1?"下一关":"再玩一轮";
  showOverlay();
  // 成绩上报（到达关卡，desc：越大越好）
  if(GB.available)GB.reportScore("word-search",{metricValue:cur+1}).catch(function(){});
}
/* ---------- 指针交互 ---------- */
function evCell(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",function(e){
  if(completed||!L)return;
  var p=evCell(e),cell=cellFromPoint(p.x,p.y);
  if(!cell)return;
  dragging=true;moved=false;dragStart=cell;dragCur=cell;currentSel=null;
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();draw();
});
cv.addEventListener("pointermove",function(e){
  if(!dragging||completed)return;
  var p=evCell(e),cell=cellFromPoint(p.x,p.y);
  if(!cell)return;
  dragCur=cell;
  if(cell.c!==dragStart.c||cell.r!==dragStart.r)moved=true;
  currentSel=snapPath(dragStart,cell);
  draw();
});
cv.addEventListener("pointerup",function(e){
  if(!dragging)return;
  dragging=false;
  var p=evCell(e),cell=cellFromPoint(p.x,p.y);
  if(completed){currentSel=null;draw();return}
  if(cell&&moved&&currentSel){tryPath(currentSel);tapAnchor=null;currentSel=null;draw();return}
  if(!cell){tapAnchor=null;currentSel=null;draw();return}
  if(tapAnchor&&(tapAnchor.c!==cell.c||tapAnchor.r!==cell.r)){
    var tp=snapPath(tapAnchor,cell);
    if(tp)tryPath(tp);else say("两点不在同一直线上");
    tapAnchor=null;currentSel=null;
  }else if(tapAnchor){
    tapAnchor=null;say("已取消起点");
  }else{
    tapAnchor=cell;say("起点已选定，再点结尾字确定方向");
  }
  draw();
});
cv.addEventListener("pointercancel",function(){
  dragging=false;currentSel=null;tapAnchor=null;draw();
});
/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function fontFor(fs){return "600 "+fs+"px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif"}
function strokePath(cells,widthFactor,color,alpha){
  if(!cells||cells.length<2)return;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=lay.cell*widthFactor;
  ctx.strokeStyle=PAL[color];
  ctx.beginPath();
  for(var i=0;i<cells.length;i++){
    var x=lay.bx+(cells[i].c+0.5)*lay.cell,y=lay.by+(cells[i].r+0.5)*lay.cell;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
}
function center(c){return {x:lay.bx+(c.c+0.5)*lay.cell,y:lay.by+(c.r+0.5)*lay.cell}}
function draw(){
  if(!L||!lay.W)return;
  var w=lay.W,i,j;
  ctx.clearRect(0,0,w,w);
  rr(0,0,w,w,12);ctx.fillStyle=PAL.bg;ctx.fill();
  rr(lay.bx,lay.by,lay.bs,lay.bs,10);ctx.fillStyle=PAL.surface;ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=1;ctx.stroke();
  // 网格线
  ctx.strokeStyle=PAL.surface2;ctx.lineWidth=1;
  ctx.beginPath();
  for(i=1;i<N;i++){
    var x=lay.bx+i*lay.cell,y=lay.by+i*lay.cell;
    ctx.moveTo(x,lay.by);ctx.lineTo(x,lay.by+lay.bs);
    ctx.moveTo(lay.bx,y);ctx.lineTo(lay.bx+lay.bs,y);
  }
  ctx.stroke();
  // 已找到的词
  ctx.save();rr(lay.bx,lay.by,lay.bs,lay.bs,10);ctx.clip();
  for(i=0;i<found.length;i++)if(found[i])strokePath(found[i].cells,0.62,found[i].color,0.24);
  var now=performance.now();
  foundFx=foundFx.filter(function(f){return now-f.ts<400});
  for(i=0;i<foundFx.length;i++){
    var k=(now-foundFx[i].ts)/400;
    strokePath(foundFx[i].cells,0.62,foundFx[i].color,0.45*(1-k));
  }
  if(hintAnim){
    if(now>hintAnim.until)hintAnim=null;
    else{
      var pulse=0.28+0.18*Math.sin(now/90);
      strokePath(hintAnim.cells,0.72,"warning",pulse);
    }
  }
  if(badFx){
    if(now-badFx.ts>350)badFx=null;
    else strokePath(badFx.cells,0.6,"danger",0.45*(1-(now-badFx.ts)/350));
  }
  if(currentSel)strokePath(currentSel,0.62,"deep",0.4);
  ctx.restore();
  // 字符
  ctx.font=fontFor(lay.fs);
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle=PAL.text;
  for(i=0;i<N;i++)for(j=0;j<N;j++){
    var ch=gridChars[i*N+j];
    ctx.fillText(ch,lay.bx+(j+0.5)*lay.cell,lay.by+(i+0.5)*lay.cell);
  }
  // 起点标记
  if(tapAnchor){
    var p=center(tapAnchor);
    ctx.beginPath();ctx.arc(p.x,p.y,lay.cell*0.36,0,Math.PI*2);
    ctx.fillStyle=PAL.soft;ctx.fill();
    ctx.strokeStyle=PAL.deep;ctx.lineWidth=2;ctx.stroke();
  }
}
/* ---------- 主循环与尺寸 ---------- */
function loop(){draw();requestAnimationFrame(loop)}
function resize(){
  var w=stageEl.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  lay.W=w;
  var pad=Math.max(4,Math.round(w*0.02));
  lay.bx=pad;lay.by=pad;
  lay.bs=w-pad*2;
  lay.cell=N?lay.bs/N:0;
  lay.fs=Math.max(12,Math.min(28,Math.round(lay.cell*0.44)));
  cv.style.height=w+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function showOverlay(){$("overlay").classList.add("show")}
function hideOverlay(){$("overlay").classList.remove("show")}
/* ---------- 按钮 ---------- */
$("btnHint").addEventListener("click",function(){
  if(completed)return;
  var wi=-1;
  for(var i=0;i<wordList.length;i++)if(!found[i]){wi=i;break}
  if(wi<0)return;
  hintWord(wi);
});
$("btnReset").addEventListener("click",function(){
  delete hintsSave[cur];doneSave[cur]=[];
  startLevel(cur);say("本关已重置");
});
$("ovNext").addEventListener("click",function(){
  startLevel(cur<LEVELS.length-1?cur+1:0);
});
$("ovReplay").addEventListener("click",function(){
  delete hintsSave[cur];doneSave[cur]=[];
  startLevel(cur);
});
window.addEventListener("resize",resize);
/* ---------- 启动 ---------- */
palLoad();
startLevel(Math.min(saveData.lv,LEVELS.length-1));
resize();loop();
syncLevelsFromServer();syncSaveFromServer();
})();
</script>
</body>
