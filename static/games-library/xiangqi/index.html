      for(i=0;i<4;i++){nr=r+D4[i][0];nc=c+D4[i][1];if(inPalace(nr,nc,color)&&!ownAt(nr,nc))add(sq,nr,nc);}
    }else if(t===A){
      for(i=0;i<4;i++){nr=r+DIAG[i][0];nc=c+DIAG[i][1];if(inPalace(nr,nc,color)&&!ownAt(nr,nc))add(sq,nr,nc);}
    }else if(t===B){
      for(i=0;i<4;i++){
        nr=r+ELE[i][0];nc=c+ELE[i][1];
        if(!inb(nr,nc)||!ownHalf(nr,color))continue;
        if(b[(r+ELE[i][0]/2)*9+(c+ELE[i][1]/2)])continue;   // 塞象眼
        if(!ownAt(nr,nc))add(sq,nr,nc);
      }
    }else if(t===N){
      for(i=0;i<8;i++){
        nr=r+HOR[i];nc=c+HOC[i];
        if(!inb(nr,nc)||ownAt(nr,nc))continue;
        if(b[(r+HLR[i])*9+(c+HLC[i])])continue;             // 蹩马腿
        add(sq,nr,nc);
      }
    }else if(t===R||t===C){
      for(i=0;i<4;i++){
        dr=D4[i][0];dc=D4[i][1];nr=r+dr;nc=c+dc;
        if(t===R){
          while(inb(nr,nc)){
            q=b[nr*9+nc];
            if(!q)add(sq,nr,nc);
            else{if(!ownAt(nr,nc))add(sq,nr,nc);break;}
            nr+=dr;nc+=dc;
          }
        }else{
          scr=0;
          while(inb(nr,nc)){
            q=b[nr*9+nc];
            if(scr===0){
              if(!q)add(sq,nr,nc);else scr=1;
            }else{
              /* 炮移动不可越子；越过炮架仅用于吃子 */
              if(q){if(!ownAt(nr,nc))add(sq,nr,nc);break;}
            }
            nr+=dr;nc+=dc;
          }
        }
      }
    }else if(t===P){
      var fdr=color===RED?-1:1;
      nr=r+fdr;nc=c;
      if(inb(nr,nc)&&!ownAt(nr,nc))add(sq,nr,nc);
      if(crossed(r,color)){
        if(c>0&&!ownAt(r,c-1))add(sq,r,c-1);
        if(c<8&&!ownAt(r,c+1))add(sq,r,c+1);
      }
    }
  }
  return moves;
}
/* 攻击检测：sq 是否被 by 方攻击（含将帅照面） */
function attackedBy(b,sq,by){
  var r=(sq/9)|0,c=sq%9,d,i,nr,nc,q,first,second,dr,dc,af;
  for(d=0;d<4;d++){
    dr=D4[d][0];dc=D4[d][1];nr=r+dr;nc=c+dc;first=null;second=null;
    while(inb(nr,nc)){
      q=b[nr*9+nc];
      if(q){
        if(first===null)first=q;
        else{second=q;break;}
      }
      nr+=dr;nc+=dc;
    }
    if(first!==null&&(first>0?1:-1)===by){
      af=first>0?first:-first;
      if(af===R)return true;
      if(af===K&&d<2)return true;   // 将帅照面（仅竖向）
    }
    if(second!==null&&(second>0?1:-1)===by&&Math.abs(second)===C)return true;
  }
  for(i=0;i<8;i++){
    nr=r+HOR[i];nc=c+HOC[i];
    if(!inb(nr,nc))continue;
    q=b[nr*9+nc];
    if(q&&(q>0?1:-1)===by&&Math.abs(q)===N){
      if(!b[(r+HLR[i])*9+(c+HLC[i])])return true;
    }
  }
  if(by===RED){
    nr=r+1;
    if(nr<=9){q=b[nr*9+c];if(q===P)return true;}
    if(r<=4){
      if(c>0){q=b[r*9+c-1];if(q===P)return true;}
      if(c<8){q=b[r*9+c+1];if(q===P)return true;}
    }
  }else{
    nr=r-1;
    if(nr>=0){q=b[nr*9+c];if(q===-P)return true;}
    if(r>=5){
      if(c>0){q=b[r*9+c-1];if(q===-P)return true;}
      if(c<8){q=b[r*9+c+1];if(q===-P)return true;}
    }
  }
  for(i=0;i<4;i++){
    nr=r+DIAG[i][0];nc=c+DIAG[i][1];
    if(!inPalace(nr,nc,by))continue;
    q=b[nr*9+nc];
    if(q&&(q>0?1:-1)===by&&Math.abs(q)===A)return true;
  }
  for(i=0;i<4;i++){
    nr=r+ELE[i][0];nc=c+ELE[i][1];
    if(!inb(nr,nc)||!ownHalf(nr,by))continue;
    q=b[nr*9+nc];
    if(q&&(q>0?1:-1)===by&&Math.abs(q)===B){
      if(!b[(r+ELE[i][0]/2)*9+(c+ELE[i][1]/2)])return true;
    }
  }
  return false;
}
function inCheck(b,color){
  var g=findGeneral(b,color);
  return g<0||attackedBy(b,g,-color);
}
function doMove(b,u,m){var f=(m/90)|0,t=m%90;u.f=f;u.t=t;u.cap=b[t];b[t]=b[f];b[f]=0;}
function undoMove(b,u){b[u.f]=b[u.t];b[u.t]=u.cap;}
function legalMoves(b,color){
  var ps=genPseudo(b,color),out=[],u={f:0,t:0,cap:0},i,m,ng,bad;
  for(i=0;i<ps.length;i++){
    m=ps[i];doMove(b,u,m);ng=findGeneral(b,color);bad=ng<0||attackedBy(b,ng,-color);undoMove(b,u);
    if(!bad)out.push(m);
  }
  return out;
}
function captureMoves(b,color){
  var ps=genPseudo(b,color),out=[],u={f:0,t:0,cap:0},i,m,t,ng,bad;
  for(i=0;i<ps.length;i++){
    m=ps[i];t=m%90;if(!b[t])continue;
    doMove(b,u,m);ng=findGeneral(b,color);bad=ng<0||attackedBy(b,ng,-color);undoMove(b,u);
    if(!bad)out.push(m);
  }
  return out;
}
function evalBoard(b){
  var s=0,sq,pc,t,r,c,idx,v;
  for(sq=0;sq<90;sq++){
    pc=b[sq];if(!pc)continue;
    t=pc>0?pc:-pc;r=(sq/9)|0;c=sq%9;
    idx=pc>0?sq:(9-r)*9+c;
    v=VAL[t]+PST[t][idx];
    s+=pc>0?v:-v;
  }
  return s;
}
function evalFor(b,color){return color===RED?evalBoard(b):-evalBoard(b);}
function orderMoves(b,moves){
  var i,sc=[];
  for(i=0;i<moves.length;i++){
    var t=moves[i]%90,cap=b[t];
    sc.push(cap?(1000+Math.abs(cap)*10-Math.abs(b[(moves[i]/90)|0])):0);
  }
  var arr=moves.map(function(m,i2){return [m,sc[i2]];});
  arr.sort(function(a,b2){return b2[1]-a[1];});
  for(i=0;i<moves.length;i++)moves[i]=arr[i][0];
}
/* ========== AI：negamax + α-β 剪枝 + 吃子静态搜索，深度与随机性由关卡决定 ========== */
var NODE_LIMIT=260000,TIME_BUDGET=1400,nodes=0,aborted=false;
function search(b,color,depth,alpha,beta,ply){
  if(aborted||nodes>NODE_LIMIT){aborted=true;return 0;}
  nodes++;
  var moves=legalMoves(b,color);
  if(moves.length===0)return -MATE+ply;   // 将死或困毙均判负
  if(depth<=0)return quiesce(b,color,alpha,beta,ply,2);
  orderMoves(b,moves);
  var best=-INF,u={f:0,t:0,cap:0},i,val;
  for(i=0;i<moves.length;i++){
    doMove(b,u,moves[i]);
    val=-search(b,-color,depth-1,-beta,-alpha,ply+1);
    undoMove(b,u);
    if(aborted)return 0;
    if(val>best)best=val;
    if(best>alpha)alpha=best;
    if(alpha>=beta)break;
  }
  return best;
}
function quiesce(b,color,alpha,beta,ply,qleft){
  if(aborted||nodes>NODE_LIMIT){aborted=true;return 0;}
  nodes++;
  var u={f:0,t:0,cap:0},i,val;
  if(inCheck(b,color)){
    if(qleft<=0)return evalFor(b,color);
    var ev=legalMoves(b,color);
    if(!ev.length)return -MATE+ply;
    orderMoves(b,ev);
    var bestE=-INF;
    for(i=0;i<ev.length;i++){
      doMove(b,u,ev[i]);
      val=-quiesce(b,-color,-beta,-alpha,ply+1,qleft>0?qleft-1:0);
      undoMove(b,u);
      if(aborted)return 0;
      if(val>bestE)bestE=val;
      if(bestE>alpha)alpha=bestE;
      if(alpha>=beta)break;
    }
    return bestE;
  }
  var stand=evalFor(b,color);
  if(stand>=beta)return stand;
  if(stand>alpha)alpha=stand;
  if(qleft<=0)return stand;
  var caps=captureMoves(b,color);
  if(!caps.length)return stand;
  orderMoves(b,caps);
  var best=stand;
  for(i=0;i<caps.length;i++){
    doMove(b,u,caps[i]);
    val=-quiesce(b,-color,-beta,-alpha,ply+1,qleft-1);
    undoMove(b,u);
    if(aborted)return 0;
    if(val>best)best=val;
    if(best>alpha)alpha=best;
    if(alpha>=beta)break;
  }
  return best;
}
function aiBestMove(b,color,depth,rand){
  var moves=legalMoves(b,color);
  if(!moves.length)return -1;
  if(moves.length===1)return moves[0];
  var t0=Date.now(),scored=null,d,i,j,order,m,u,val,local,best;
  for(d=1;d<=depth;d++){
    nodes=0;aborted=false;
    order=[];
    if(scored)for(i=0;i<scored.length;i++)order.push(scored[i].m);
    for(i=0;i<moves.length;i++)if(order.indexOf(moves[i])<0)order.push(moves[i]);
    local=[];
    for(i=0;i<order.length;i++){
      u={f:0,t:0,cap:0};
      doMove(b,u,order[i]);
      val=-search(b,-color,d-1,-INF,INF,1);
      undoMove(b,u);
      if(aborted)break;
      local.push({m:order[i],v:val});
    }
    if(aborted)break;   // 保留上一完整深度的结果
    local.sort(function(a,b2){return b2.v-a.v;});
    scored=local;
    if(scored[0].v>=MATE-500)break;
    if(Date.now()-t0>TIME_BUDGET)break;
  }
  if(!scored||!scored.length)return moves[0];
  best=scored[0].v;
  var pool=[scored[0]],th;
  if(rand>0){
    th=rand*rand*15;
    for(j=1;j<scored.length;j++){if(scored[j].v>=best-th)pool.push(scored[j]);else break;}
  }else{
    for(j=1;j<scored.length;j++){if(scored[j].v===best)pool.push(scored[j]);else break;}
  }
  return pool[(Math.random()*pool.length)|0].m;
}

var cv=document.getElementById("cv"),ctx=cv.getContext("2d");

function $(id){return document.getElementById(id);}
var elLv=$("stLv"),elDiff=$("stDiff"),elRec=$("stRec"),elName=$("lvName"),elMsg=$("msg"),
    btnPrev=$("btnPrev"),btnNext=$("btnNext"),btnUndo=$("btnUndo"),btnNew=$("btnNew"),btnResign=$("btnResign"),
    overlay=$("overlay"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovBtn=$("ovBtn");

function diffOf(p){
  var mt=p.depth*3+(4-p.handicap)*2+(p.first?0:1)+(2-p.rand);
  return Math.max(1,Math.min(10,Math.ceil(((mt-2)/21)*10)));
}
function say(t){elMsg.textContent=t;}
function updateStats(){

}
function updateButtons(){

function showOverlay(){overlay.classList.add("show");}
function hideOverlay(){overlay.classList.remove("show");}
function gx(c){return L.pad+c*L.cellX;}
function gy(r){return L.pad+r*L.cellY;}
function pickFont(px){
  var tiers=[12,14,16,18,22,28,36],best=tiers[0];
  for(var i=1;i<tiers.length;i++)if(px>=tiers[i])best=tiers[i];
  return best;
}
function markSquare(sq,color,alpha){
  var r=(sq/9)|0,c=sq%9,p=L.cell*0.1;
  ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=Math.max(1.5,L.cell*0.05);
  ctx.strokeRect(gx(c)+p,gy(r)+p,L.cellX-2*p,L.cellY-2*p);
  ctx.globalAlpha=1;
}
function ringSquare(sq,color,lw){
  var r=(sq/9)|0,c=sq%9;
  ctx.strokeStyle=color;ctx.lineWidth=lw||Math.max(2,L.cell*0.06);
  ctx.beginPath();ctx.arc(gx(c),gy(r),L.cell*0.46,0,Math.PI*2);ctx.stroke();
}
function dotSquare(sq,color){
  var r=(sq/9)|0,c=sq%9;
  ctx.fillStyle=color;ctx.globalAlpha=0.85;
  ctx.beginPath();ctx.arc(gx(c),gy(r),Math.max(2,L.cell*0.13),0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}
function drawPiece(sq,pc){
  var r=(sq/9)|0,c=sq%9,x=gx(c),y=gy(r),rad=L.cell*0.44;
  ctx.globalAlpha=0.16;ctx.fillStyle=PAL.text;
  ctx.beginPath();ctx.arc(x,y+rad*0.09,rad*0.96,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  var g2=ctx.createRadialGradient(x-rad*0.32,y-rad*0.36,rad*0.14,x,y,rad);
  g2.addColorStop(0,PAL.surface);g2.addColorStop(1,PAL.surface2);
  ctx.fillStyle=g2;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=PAL.border;ctx.lineWidth=Math.max(1,L.cell*0.03);ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,rad*0.76,0,Math.PI*2);
  ctx.strokeStyle=pc>0?PAL.danger:PAL.text;ctx.lineWidth=Math.max(1,L.cell*0.028);ctx.stroke();
  ctx.font='700 '+pickFont(rad*1.12)+'px "KaiTi","STKaiti","PingFang SC",serif';
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle=pc>0?PAL.danger:PAL.text;

function render(){
  if(!board)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,L.W,L.H);
  var g=ctx.createLinearGradient(0,0,L.W,L.H);
  g.addColorStop(0,PAL.board1);g.addColorStop(1,PAL.board2);
  ctx.fillStyle=g;ctx.fillRect(0,0,L.W,L.H);
  var r,c;
  ctx.strokeStyle=PAL.line;ctx.lineWidth=1;
  ctx.beginPath();
  for(r=0;r<10;r++){ctx.moveTo(gx(0),gy(r));ctx.lineTo(gx(8),gy(r));}
  for(c=0;c<9;c++){
    if(c===0||c===8){ctx.moveTo(gx(c),gy(0));ctx.lineTo(gx(c),gy(9));}
    else{ctx.moveTo(gx(c),gy(0));ctx.lineTo(gx(c),gy(4));ctx.moveTo(gx(c),gy(5));ctx.lineTo(gx(c),gy(9));}
  }
  ctx.moveTo(gx(3),gy(0));ctx.lineTo(gx(5),gy(2));
  ctx.moveTo(gx(5),gy(0));ctx.lineTo(gx(3),gy(2));
  ctx.moveTo(gx(3),gy(7));ctx.lineTo(gx(5),gy(9));
  ctx.moveTo(gx(5),gy(7));ctx.lineTo(gx(3),gy(9));
  ctx.stroke();
  ctx.lineWidth=2;ctx.strokeRect(gx(0),gy(0),gx(8)-gx(0),gy(9)-gy(0));
  ctx.fillStyle=PAL.line;ctx.globalAlpha=0.5;
  ctx.font='700 '+pickFont(L.cell*0.5)+'px "KaiTi","STKaiti","PingFang SC",serif';
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("楚  河",gx(2),gy(4)+L.cellY/2);
  ctx.fillText("汉  界",gx(6),gy(4)+L.cellY/2);
  ctx.globalAlpha=1;
  var i;
  if(lastMove>=0){markSquare((lastMove/90)|0,PAL.deep,0.35);markSquare(lastMove%90,PAL.deep,0.35);}
  if(selection>=0)ringSquare(selection,PAL.primary,Math.max(2,L.cell*0.07));
  for(i=0;i<legalCache.length;i++){
    var mt=legalCache[i]%90;
    if(board[mt])ringSquare(mt,PAL.danger,Math.max(2,L.cell*0.07));
    else dotSquare(mt,PAL.deep);
  }
  for(i=0;i<90;i++)if(board[i])drawPiece(i,board[i]);
  if(!over&&inCheck(board,turn)){
    var gsq=findGeneral(board,turn);
    if(gsq>=0)ringSquare(gsq,PAL.danger,Math.max(2.5,L.cell*0.08));
  }

function resize(){
  var w=(cv.parentElement&&cv.parentElement.clientWidth)||320;
  dpr=Math.min(window.devicePixelRatio||1,2);
  L.W=w;L.pad=Math.max(10,Math.round(w*0.05));
  L.H=Math.round(w*9/8);
  L.cellX=(w-2*L.pad)/8;L.cellY=(L.H-2*L.pad)/9;L.cell=Math.min(L.cellX,L.cellY);
  cv.style.height=L.H+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(L.H*dpr);
  render();
}
function hitTest(x,y){
  var br=0,bc=0,bd=Infinity,rr,cc,dx,dy,d;
  for(rr=0;rr<10;rr++)for(cc=0;cc<9;cc++){
    dx=x-gx(cc);dy=y-gy(rr);d=dx*dx+dy*dy;
    if(d<bd){bd=d;br=rr;bc=cc;}
  }
  var lim=Math.max(L.cell*0.55,16);
  return bd<=lim*lim?[br,bc]:null;
}
function pushHistory(){
  history.push({b:board.slice(),turn:turn,last:lastMove,half:halfmove,over:over,result:result});
}
function applyMove(m,color){
  var f=(m/90)|0,t=m%90,cap=board[t],pc=board[f];
  board[t]=pc;board[f]=0;
  lastMove=m;
  if(cap||Math.abs(pc)===P)halfmove=0;else halfmove++;
  turn=-color;
}
function selectPiece(sq){
  selection=sq;legalCache=[];
  var ms=legalMoves(board,playerColor),i;
  for(i=0;i<ms.length;i++)if(((ms[i]/90)|0)===sq)legalCache.push(ms[i]);
  render();
}
function afterMove(){
  var side=turn,lm=legalMoves(board,side);
  if(lm.length===0){
    if(inCheck(board,side))endGame(side===playerColor?"lose":"win",side===playerColor?"被将死":"将死对手");
    else endGame(side===playerColor?"lose":"win",side===playerColor?"被困毙":"困毙对手");
    return;
  }
  if(halfmove>=120){endGame("draw","60 回合无吃子，判和");return;}
  if(side===aiColor){
    aiThinking=true;say("AI 思考中…");updateButtons();
    if(aiTimer)clearTimeout(aiTimer);
    aiTimer=setTimeout(aiTurn,350);
  }else{
    say("轮到你了");updateButtons();
  }
}
function humanMove(m){
  pushHistory();
  selection=-1;legalCache=[];
  applyMove(m,playerColor);
  render();
  afterMove();
}
function aiTurn(){
  aiTimer=null;
  if(over)return;
  var m=aiBestMove(board,aiColor,LEVELS[cur].depth,LEVELS[cur].rand);
  if(m<0){endGame(aiColor===playerColor?"lose":"win","无合法走子");return;}
  pushHistory();
  applyMove(m,aiColor);
  aiThinking=false;
  render();
  afterMove();
}
function endGame(kind,reason){
  over=true;result=kind;aiThinking=false;
  if(aiTimer){clearTimeout(aiTimer);aiTimer=null;}
  if(kind==="win"){
    saveData.wins++;
    if(cur+1<LEVELS.length&&saveData.unlocked<cur+1)saveData.unlocked=cur+1;
    if(GB.available)GB.reportScore("xiangqi",{metricValue:saveData.wins}).catch(function(){});
  }else if(kind==="lose"){saveData.losses++;}
  else{saveData.draws++;}
  save();updateStats();updateButtons();
  var title,btn;
  if(kind==="win"){title="你赢了！";btn=(cur+1<LEVELS.length)?"下一关":"再玩一次";}
  else if(kind==="lose"){title="你输了";btn="重试本关";}
  else{title="和棋";btn="重试本关";}
  ovTitle.textContent=title;
  ovDesc.textContent=reason+(kind==="win"?" · 已解锁新关卡":" · 再接再厉");
  ovBtn.textContent=btn;
  showOverlay();
  say(reason);
}
function startLevel(n){
  n=Math.max(0,Math.min(LEVELS.length-1,n));
  if(aiTimer){clearTimeout(aiTimer);aiTimer=null;}
  cur=n;
  var Lv=LEVELS[n];
  playerColor=Lv.first?RED:BLACK;
  aiColor=-playerColor;
  board=initialBoard(removalSquares(aiColor,Lv.handicap));
  turn=RED;selection=-1;legalCache=[];lastMove=-1;halfmove=0;over=false;result=null;aiThinking=false;history=[];
  hideOverlay();
  updateStats();updateButtons();render();save();
  if(turn!==playerColor){
    aiThinking=true;say("AI 思考中…");updateButtons();
    aiTimer=setTimeout(aiTurn,400);
  }else{
    say(Lv.name+" · 轮到你了");
  }
}
function undo(){
  if(aiThinking)return;
  if(aiTimer){clearTimeout(aiTimer);aiTimer=null;}
  if(over||!history.length)return;
  var snaps=[];
  while(history.length){
    snaps.push(history.pop());
    if(snaps[snaps.length-1].turn===playerColor)break;
  }
  var snap=snaps[snaps.length-1];
  if(!snap||snap.turn!==playerColor)return;
  board=snap.b.slice();turn=snap.turn;lastMove=snap.last;halfmove=snap.half;over=false;result=null;
  selection=-1;legalCache=[];
  hideOverlay();say("已悔棋，轮到你了");render();updateStats();updateButtons();
}
cv.addEventListener("pointerdown",function(e){
  if(over||aiThinking)return;
  if(turn!==playerColor)return;
  var rect=cv.getBoundingClientRect();
  var pt=hitTest(e.clientX-rect.left,e.clientY-rect.top);
  if(!pt)return;
  var sq=pt[0]*9+pt[1],pc=board[sq],m;
  if(selection>=0){
    if(sq===selection){selection=-1;legalCache=[];render();return;}
    m=selection*90+sq;
    if(legalCache.indexOf(m)>=0){humanMove(m);return;}
    if(pc&&(pc>0?1:-1)===playerColor){selectPiece(sq);return;}
    selection=-1;legalCache=[];render();return;
  }
  if(pc&&(pc>0?1:-1)===playerColor)selectPiece(sq);
});
btnPrev.addEventListener("click",function(){startLevel(cur-1);});
btnNext.addEventListener("click",function(){startLevel(cur+1);});
btnUndo.addEventListener("click",undo);
btnNew.addEventListener("click",function(){startLevel(cur);});
btnResign.addEventListener("click",function(){if(!over)endGame("lose","你认输了");});
ovBtn.addEventListener("click",function(){
  if(result==="win"&&cur+1<LEVELS.length)startLevel(cur+1);
  else startLevel(cur);
});
window.addEventListener("resize",resize);
window.addEventListener("load",resize);
document.addEventListener("visibilitychange",function(){if(!document.hidden)render();});

/* 供关卡校验器使用的只读引擎句柄 */
try{
  window.__XQ__={
    RED:RED,BLACK:BLACK,K:K,A:A,B:B,N:N,R:R,C:C,P:P,
    initial:function(handicap,aiColor){return initialBoard(removalSquares(aiColor||BLACK,handicap||0));},
    removalSquares:removalSquares,
    legal:legalMoves,
    inCheck:inCheck,
    attacked:attackedBy,
    eval:evalBoard,
    best:aiBestMove
  };
}catch(e){}

palLoad();
startLevel(Math.min(saveData.lv||0,LEVELS.length-1));
resize();
syncLevelsFromServer();
syncSaveFromServer();
})();
</script>
